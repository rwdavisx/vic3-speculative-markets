 SPEC_INTEREST_TT: "#header [concept_spec_investor_interest]: [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n$SPEC_TILE_BODY$"
 SPEC_RISK_TT: "#header Риск: $SPEC_UNWIND$#!\n[concept_spec_market_confidence] при завершении бума: #N -[Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#!\n$TOOLTIP_DELIMITER$\n#v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_peak_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1')|1]#! от пикового показателя «[concept_spec_investor_interest]» (#v [Country.MakeScope.Var(Concatenate('spec_peak_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#!)\n[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_sev_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_WHY_END_3', SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_sev_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_WHY_END_2', 'SPEC_WHY_END_1'))]\n#v x[Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey))|%0]#! от доли в торговле ([concept_market]: #v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#!, полный эффект при #v 3%#!)\n#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Country.MakeScope.ScriptValue('spec_crash_scale')|2]#!#!#! от фактора «[concept_spec_market_conditions]»[AddLocalizationIf(GreaterThan_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_risk_raw_', Goods.GetKey)), Country.MakeScope.ScriptValue('spec_crash_scale')), '(CFixedPoint)40'), 'SPEC_WHY_CAP')][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_hype_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_hprev_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')), 'SPEC_WHY_FALLING')]\n$TOOLTIP_DELIMITER$\n$SPEC_UNWIND_DESC$"
 SPEC_CURRENT_GOODS_FILTERS: "[SelectLocalization(GetVariableSystem.HasValue('spec_il_cat', 'staple'), 'STAPLE_FILTER_NAME', SelectLocalization(GetVariableSystem.HasValue('spec_il_cat', 'industrial'), 'INDUSTRIAL_FILTER_NAME', SelectLocalization(GetVariableSystem.HasValue('spec_il_cat', 'luxury'), 'LUXURY_FILTER_NAME', SelectLocalization(GetVariableSystem.HasValue('spec_il_cat', 'military'), 'MILITARY_FILTER_NAME', 'ALL_GOODS'))))]"
 SPEC_COL_LEVER: "Вмешательство"
 SPEC_COL_LEVER_TT: "#header Рыночное вмешательство#!\n$TOOLTIP_DELIMITER$\nСдерживание спекуляций: интерес удерживается на уровне #v Спокойствие#!, у производителей снижается [concept_throughput], и они платят сбор\nПоощрение инвестиций: интерес не ниже уровня #v Интерес#!, у производителей растёт [concept_throughput], а платит за это государство\n\nКаждое вмешательство ежемесячно стоит [concept_authority] до отмены, больше для товаров первой необходимости и для товаров с большой долей в торговле рынка. Спекуляции можно сдерживать для товаров с уровнем #v Азарт#! и #v Лихорадка#!, а также для товара, завершение бума которого снизило бы [concept_spec_market_confidence] на #v 2#! или больше. Инвестиции можно поощрять для товаров ниже уровня #v Интерес#!."
 SPEC_SEP_FEVERISH_TT: "#header @spec_interest_feverish! [concept_spec_investor_interest]: Лихорадка#!\nДоля нашей торговли: #v [Country.MakeScope.Var('spec_heat_6').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] производителей: #P +8%#!\n[concept_spec_market_confidence]: #P растёт#! каждый месяц, сильнее при большей доле торговли; не действует, пока длится [concept_spec_financial_panic]\nВозможный исход: [concept_spec_collapse]"
 SPEC_SEP_EAGER_TT: "#header @spec_interest_eager! [concept_spec_investor_interest]: Азарт#!\nДоля нашей торговли: #v [Country.MakeScope.Var('spec_heat_5').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] производителей: #P +5%#!\n[concept_spec_market_confidence]: #P растёт#! каждый месяц, сильнее при большей доле торговли; не действует, пока длится [concept_spec_financial_panic]\nВозможный исход: [concept_spec_bust]"
 SPEC_SEP_KEEN_TT: "#header @spec_interest_keen! [concept_spec_investor_interest]: Интерес#!\nДоля нашей торговли: #v [Country.MakeScope.Var('spec_heat_4').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] производителей: #P +3%#!\nВозможный исход: [concept_spec_correction]"
 SPEC_SEP_CALM_TT: "#header @spec_interest_calm! [concept_spec_investor_interest]: Спокойствие#!\nДоля нашей торговли: #v [Country.MakeScope.Var('spec_heat_3').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\nНет эффектов"
 SPEC_SEP_DOUBTFUL_TT: "#header @spec_interest_doubtful! [concept_spec_investor_interest]: Сомнения#!\nДоля нашей торговли: #v [Country.MakeScope.Var('spec_heat_2').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] производителей: #N -5%#!\nПосле завершения бума интерес к товару некоторое время удерживается на этом уровне или ниже"
 SPEC_SEP_FLEEING_TT: "#header @spec_interest_fleeing! [concept_spec_investor_interest]: Отток#!\nДоля нашей торговли: #v [Country.MakeScope.Var('spec_heat_1').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] производителей: #N -10%#!\nЕсли бум с пиком #v Лихорадка#! падает так низко, наступает [concept_spec_collapse]"
 SPEC_IB_TURNING_TT: "#header Перелом бума#!\nТовар «[Goods.GetName]» дешевеет после крупного бума. Если [concept_spec_investor_interest] продолжит падать, наступит [concept_spec_collapse], и [concept_spec_market_confidence] снизится примерно на #N [Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#!."
 SPEC_IB_HEAT_TT: "#header [concept_spec_investor_interest]: [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n$SPEC_TILE_BODY$"
 SPEC_TILE_NEXT: "[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)6'), 'SPEC_TILE_DANGER', 'SPEC_IB_EMPTY')]"
 SPEC_IB_EMPTY: ""
 SPEC_TILE_DANGER: "\nЗона краха: #v [Country.MakeScope.Var(Concatenate('spec_ui_bar_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! пути до вершины\nЧем выше поднимается интерес, тем сильнее [concept_spec_collapse] снижает [concept_spec_market_confidence]."
 SPEC_IL_MONTHS_1: "#v 3#! мес."
