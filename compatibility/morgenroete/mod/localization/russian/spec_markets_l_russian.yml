 concept_spec_long_depression: "Долгая депрессия"
 concept_spec_long_depression_desc: "$concept_spec_long_depression$ является мировым экономическим кризисом. Она начинается, когда у страны со статусом «[concept_great_power]» начинается [concept_spec_financial_panic], затрагивает все страны, где в этот момент идёт паника, и распространяется по тесным связям: общий [concept_market], отношения сюзерена и подданных, права на инвестиции, крупная торговля и иностранная собственность.\n\nМировой обвал (#v 4#! мес.): кредит замерзает, [concept_spec_market_confidence] истощается\nДепрессия (до #v 5#! лет): инвестиции, строительство и торговля замедляются, часть попов переходит в ряды: [Concept('concept_radical','$concept_radicals|q$')]\nВосстановление (#v 1#! г.): [concept_spec_market_confidence] возвращается\n\nРешения каждого правительства ускоряют его собственное и мировое восстановление, а решения страны со статусом «[concept_great_power]» значат больше всего."
