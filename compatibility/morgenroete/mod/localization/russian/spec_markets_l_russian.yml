 concept_spec_market_confidence: "Уверенность рынка"
 concept_spec_market_confidence_desc: "$concept_spec_market_confidence$ показывает, как инвесторы оценивают [concept_market] страны ([concept_country]), от #v 0#! (#v Паника#!) до #v 100#! (#v Мания#!). Страх замедляет инвестиции и повышает проценты по займам ([concept_loans]), а жадность ускоряет инвестиции.\n\nЕё повышают бумы ([Concept('concept_good','$concept_goods|q$')]), а снижают [Concept('concept_spec_boom_end','$concept_spec_boom_ends|q$')], [Concept('concept_spec_foreign_panic','$concept_spec_foreign_panics|q$')], [Concept('concept_diplomatic_play','$concept_diplomatic_plays|q$')] и [concept_war]. Бумы и их завершения сильнее там, где большую часть экономики составляет группа «$building_financial_district$», и слабее там, где больше представителей группы «$building_manor_house$».\n\nВыше #v 55#! банки направляют средства в [concept_investment_pool], при #v 80#! рынок входит в состояние «[concept_spec_speculative_mania]», а ниже #v 25#! начинается [concept_spec_financial_panic]."
 concept_spec_speculative_mania: "Спекулятивная мания"
 concept_spec_speculative_mania_desc: "[concept_market] входит в состояние «$concept_spec_speculative_mania$», когда [concept_spec_market_confidence] составляет не менее #v 80#!. Банки предоставляют максимум средств в [concept_investment_pool], но [concept_spec_boom_end] сильнее снижает показатель «$concept_spec_market_confidence$». После долгой или особенно сильной мании [Concept('concept_political_movement','$concept_political_movements|q$')], выступающие за закон «[GetLawType('law_laissez_faire').GetName]», получают дополнительную поддержку в течение нескольких лет."
 concept_spec_financial_panic: "Финансовая паника"
 concept_spec_financial_panics: "Финансовые паники"
 concept_spec_financial_panic_desc: "$concept_spec_financial_panic$ начинается, когда [concept_spec_market_confidence] падает ниже порога паники (#v 25#!). Когда [concept_spec_leverage] превышает #v 3#! мес., порог растёт, до #v 65#!. Если представителей группы «$building_financial_district$» мало, он ниже, вплоть до #v 20#!.\n\nОна сокращает [concept_throughput] всех зданий и собираемые налоги, каждую неделю до своего окончания требует из казны ([concept_treasury]) пособий безработным, замедляет [concept_private_construction] и инвестиции, снижает бонус к товарообороту ([concept_throughput]), который получают [Concept('concept_company','$concept_companies|q$')], переводит часть инвесторов в ряды: [Concept('concept_radical','$concept_radicals|q$')], и заставляет банки изымать [concept_spec_outstanding_credit] из инвестиционного пула ([concept_investment_pool]).\n\nКаждая связанная страна ([concept_country]) переживает [concept_spec_foreign_panic], а деньги бегут в спокойные страны ([Concept('concept_great_power','$concept_great_powers|q$')]) в других местах. В течение нескольких лет после этого набирают поддержку [Concept('concept_political_movement','$concept_political_movements|q$')], направленные против: [GetLawType('law_laissez_faire').GetName]."
 concept_spec_foreign_panic: "Зарубежная паника"
 concept_spec_foreign_panics: "Зарубежная паника"
 concept_spec_foreign_panic_desc: "$concept_spec_foreign_panic$ снижает [concept_spec_market_confidence], если [concept_country] связана с другой страной, где начинается [concept_spec_financial_panic]. Связью может быть общий [concept_market], подчинение, права на инвестиции, обширная торговля или владение экономикой. Чем теснее связи, тем больше потери. Закон «[GetLawType('law_free_trade').GetName]» усиливает торговые связи, а прочая торговая политика ослабляет их. [concept_embargo] обрывает торговую связь."
 concept_spec_boom_end: "Завершение бума"
 concept_spec_boom_ends: "Завершения бумов"
 concept_spec_boom_end_desc: "Бум завершается, когда [concept_spec_investor_interest] к товару ([concept_good]) после подъёма снова падает, и чем выше он поднялся, тем сильнее падение: бум с пиком на уровне #v Интерес#! завершается событием «[concept_spec_correction]», с пиком #v Азарт#! событием «[concept_spec_bust]», а с пиком #v Лихорадка#! событием «[concept_spec_collapse]».\n\nКаждое завершение снижает [concept_spec_market_confidence], сильнее для крупных бумов и для товаров ([Concept('concept_good','$concept_goods|q$')]) с большей долей в торговле рынка ([concept_market]). Затем инвесторы воздерживаются, пока $concept_good$ восстанавливается, а если его производит [concept_company], её отрасль теряет [concept_throughput]. Пик, от которого ведётся отсчёт, понемногу снижается каждый месяц, поэтому медленно остывающий бум завершается мягче или вовсе обходится без события «$concept_spec_boom_end$»."
 concept_spec_correction: "Коррекция"
 concept_spec_correction_desc: "$concept_spec_correction$ означает самое мягкое [concept_spec_boom_end]. Она происходит, когда [concept_good] достигает пика #v Интерес#!, а затем [concept_spec_investor_interest] падает до уровня #v Сомнения#!.\n\nПри этом [concept_spec_market_confidence] снижается незначительно. Затем $concept_good$ не привлекает инвесторов в течение #v 3#! мес. Если его производит [concept_company], в этой отрасли [concept_throughput] снижается на #N 2.5%#! на #v 90#! дн. и ещё на #N 25%#! за каждую изученную технологию: [GetTechnology('corporate_charters').GetName] и [GetTechnology('corporate_management').GetName]."
 concept_spec_bust: "Спад"
 concept_spec_bust_desc: "$concept_spec_bust$ означает более тяжёлое [concept_spec_boom_end], чем [concept_spec_correction]. Он происходит, когда [concept_good] достигает пика #v Азарт#!, а затем [concept_spec_investor_interest] падает до уровня #v Сомнения#!.\n\nПри этом [concept_spec_market_confidence] снижается сильнее: примерно в #v 2#! раз больше, чем если бы тот же бум завершила [concept_spec_correction]. Затем $concept_good$ не привлекает инвесторов в течение #v 6#! мес. Если его производит [concept_company], в этой отрасли [concept_throughput] снижается на #N 5%#! на #v 180#! дн. и ещё на #N 25%#! за каждую изученную технологию: [GetTechnology('corporate_charters').GetName] и [GetTechnology('corporate_management').GetName]."
 concept_spec_collapse: "Крах"
 concept_spec_collapse_desc: "$concept_spec_collapse$ означает самое тяжёлое [concept_spec_boom_end]. Он происходит, когда [concept_good] достигает пика #v Лихорадка#!, а затем [concept_spec_investor_interest] падает до уровня #v Отток#!.\n\nПри этом [concept_spec_market_confidence] резко снижается: примерно в #v 5#! раз больше, чем если бы тот же бум завершила [concept_spec_correction]. Затем $concept_good$ не привлекает инвесторов в течение #v 12#! мес. Если его производит [concept_company], в этой отрасли [concept_throughput] снижается на #N 10%#! на год и ещё на #N 25%#! за каждую изученную технологию: [GetTechnology('corporate_charters').GetName] и [GetTechnology('corporate_management').GetName]. Если $concept_spec_collapse$ затрагивает значительную долю торговли, которую ведёт [concept_market], может начаться [concept_spec_financial_panic]."
 concept_spec_investor_interest: "Интерес инвесторов"
 concept_spec_investor_interest_desc: "$concept_spec_investor_interest$ показывает, насколько привлекательны для инвесторов [Concept('concept_building','$concept_buildings|q$')], производящие товар ([concept_good]). Он растёт, пока [concept_market_price] выше долгосрочного среднего, и падает, пока она ниже, от #v Отток#! до #v Лихорадка#!.\n\n[concept_throughput] этих зданий следует за ним, от #N -10%#! при #v Отток#! до #P +8%#! при #v Лихорадка#!, и так же меняется [concept_prosperity] ([Concept('concept_company','$concept_companies|q$')], производящие $concept_good$). Бум ($concept_good$) повышает [concept_spec_market_confidence]. Когда интерес падает, бум завершается событием «[concept_spec_boom_end]»."
 concept_spec_credit_policy: "Кредитная политика"
 concept_spec_credit_policy_tight: "Жёсткое кредитование"
 concept_spec_credit_policy_normal: "Обычное кредитование"
 concept_spec_credit_policy_loose: "Мягкое кредитование"
 concept_spec_credit_policy_desc: "$concept_spec_credit_policy$ определяет, насколько свободно банки направляют средства в [concept_investment_pool]. Для неё требуется: [GetTechnology('central_banking').GetName]. Варианты: «$concept_spec_credit_policy_tight$», «$concept_spec_credit_policy_normal$» или «$concept_spec_credit_policy_loose$». Более жёсткий кредит замедляет инвестиции и тянет [concept_spec_market_confidence] вниз, когда она высока, а более мягкий увеличивает [concept_spec_outstanding_credit]. После изменения политика блокируется на #v 6#! мес."
 concept_spec_leverage: "Кредитное плечо"
 concept_spec_leverage_desc: "$concept_spec_leverage$ отражает [concept_spec_outstanding_credit] страны ([concept_country]) в месяцах дохода показателя «[concept_investment_pool]».\n\nКаждый полный месяц даёт #P +2%#! [concept_throughput], до #P +24%#!. Во время события «[concept_spec_financial_panic]» или пока остаются [concept_spec_bad_debts], оно уменьшается на #N 2%#! в месяц. Свыше #v 3#! мес. [concept_spec_financial_panic] начинается при более высоком значении показателя «[concept_spec_market_confidence]» и оставляет [concept_spec_bad_debts]."
 concept_spec_bad_debts: "Безнадёжные долги"
 concept_spec_bad_debts_desc: "$concept_spec_bad_debts$ представляют собой потери, оставленные событием «[concept_spec_financial_panic]», и растут с показателем «[concept_spec_leverage]» свыше #v 3#! мес.\n\nКаждое очко снижает [concept_throughput] на #N 0.4%#! и инвестиции на #N 0.75%#!. Они нарастают на #v 3#! в месяц, затем снижаются на #v 0.6#! в месяц и в худшем случае списываются примерно за #v 6#! лет. Пока они остаются, банки не кредитуют. #v Кредитовать банки#! их не списывает. #v Выкупить плохие долги#! уменьшает их вдвое, один раз, пока они есть."
 concept_spec_lending_standards: "Стандарты кредитования"
 concept_spec_lending_standards_desc: "$concept_spec_lending_standards$ показывают, насколько осторожно кредитуют банки страны ([concept_country]): #v Строгие#!, #v Осторожные#!, #v Надёжные#!, #v Слабые#! или #v Безрассудные#!. Чем слабее стандарты, тем больше средств банки направляют в [concept_investment_pool] и тем большая их часть идёт в бумы, поэтому эти бумы завершаются тяжелее, а спасение банков обходится дороже.\n\nОни понемногу ослабевают в каждый месяц без события «[concept_spec_financial_panic]», от #v Строгие#! до #v Безрассудные#! примерно за #v 20#! спокойных лет, и сильнее после каждого спасения банков или решения #v Выкупить плохие долги#!. Они ужесточаются при завершении бума, и сильнее всего, когда $concept_spec_financial_panic$ проходит до конца без спасения банков."
 concept_spec_outstanding_credit: "Непогашенный кредит"
 concept_spec_outstanding_credit_desc: "$concept_spec_outstanding_credit$ представляет собой кредиты, которые банки направили в [concept_investment_pool] и которые ещё не погашены. Банки кредитуют, пока [concept_spec_market_confidence] выше #v 55#!, до лимита кредитования в #v 3#! мес. дохода пула. [GetTechnology('central_banking').GetName] добавляет #v 5#! мес., а [GetTechnology('investment_banks').GetName] и [GetTechnology('international_exchange_standards').GetName] добавляют по #v 2#!.\n\nКаждый месяц #v 2%#! погашается из пула. Когда начинается [concept_spec_financial_panic], часть кредитов изымается.\n\n#lore В сороковые годы XIX века банки давали кредиты под залог железнодорожных акций, в 1837 году под хлопок, а в 1873 году под строительные участки в Вене, и попадались, когда эти бумы лопались.#!"
