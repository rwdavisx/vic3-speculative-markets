 concept_spec_exchange: "Биржа"
 concept_spec_trust: "Доверие"
 concept_spec_trust_desc: "@spec_trust! Насколько инвесторы, вкладывающие в страну ([concept_country]), верят в её биржу ([concept_spec_exchange]), от #v 0%#! до #v 100%#!.\n\nДоверие #P растёт#! в спокойные месяцы и #N падает#! при каждом событии «[concept_spec_financial_panic]», крахе и обвале. Его уровень, #N Ненадёжная#!, Сомнительная, #v Уважаемая#! или #P Надёжная#!, меняет стоимость заимствований для страны ([concept_country])."
 concept_spec_exchange_desc: "@spec_exchange! $concept_spec_exchange$ страны ([concept_country]) является местом, где переходят из рук в руки её акции, облигации и кредиты. Её статус зависит от очков ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]): #v Провинциальная#!, #v Национальная#!, #v Международная#! (требуется: [GetTechnology('stock_exchange').GetName]) или #v Мировой центр#! (требуется: [GetTechnology('central_banking').GetName]). Более высокий статус усиливает реакцию инвесторов на рост цен, а начиная с уровня #v Международная#! биржа получает [concept_spec_capital_flight].\n\nГосударство дарует своей бирже один устав: #v Товарная биржа#!, #v Денежный рынок#! или #v Фондовый рынок#!. Биржа имеет от #v 1#! до #v 4#! специализаций из #v 10#! путей к славе, тем больше, чем выше её статус, и сохраняет каждую не менее #v 5#! лет.\n\nДоверие растёт в спокойные годы при надёжном кредитовании и падает, когда случается [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')], остаются [concept_spec_bad_debts] или основной товар переживает [concept_spec_bust] или [concept_spec_collapse]. Низкое доверие повышает процентную ставку по займам ([concept_loans]), а высокое снижает её."
