 SPEC_RISK_CALM: "#header Нет бума#!\n$TOOLTIP_DELIMITER$\n#italic Поводов для беспокойства нет. Товар «[Goods.GetName]» в последнее время не переживал бума.#!\n\nКогда [concept_spec_investor_interest] достигнет уровня #v Интерес#! или выше, падение обратно до #v Сомнения#! #N завершит бум#!\nЧем выше подъём, тем тяжелее падение"
