 concept_spec_intervention: "Вмешательство"
 concept_spec_intervention_desc: "С помощью меры «$concept_spec_intervention$» правительство может применить #v Сдерживание спекуляций#! к товару ([concept_good]) или #v Поощрение инвестиций#! в него.\n\n#v Сдерживание спекуляций#!: [concept_spec_investor_interest] снижается до уровня #v Спокойствие#!, производители #N -10%#! [concept_throughput], сбор в размере #v 10%#! недельного производства по базовой цене\n#v Поощрение инвестиций#!: интерес поднимается до уровня #v Интерес#!, производители #P +10%#! [concept_throughput], субсидия в размере #v 20%#!\n\nКаждое вмешательство ежемесячно стоит [concept_authority] до отмены, больше для товаров первой необходимости и для товаров с большой долей в торговле рынка ([concept_market])."
 SPEC_LEVER_ISSUE_TT: "#header Крупный выпуск акций: [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\nНа #v 2#! лет:\nОчки ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]): #P +25%#!\nБанковские кредиты в этот товар учитываются #N x1.5#! при завершении его бума\nДоверие, полученное или потерянное при завершении его бума: #v x2#!\n$TOOLTIP_DELIMITER$\nТребуется национальный статус или выше, [concept_spec_investor_interest] #v Азарт#! или выше и отсутствие вмешательства ([concept_spec_intervention]). Одновременно идёт только один крупный выпуск; следующий можно провести через #v 1#! г. после окончания этого.[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_issue_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_ISSUE_ON', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_issue').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_ISSUE_ON: "\n\nДля этого товара ([concept_good]) идёт выпуск акций"
 spec_issue_stand_tt: "Наша биржа ([concept_spec_exchange]) имеет статус #v Национальная#! или выше"
 spec_issue_hot_tt: "[concept_spec_investor_interest] на уровне #v Азарт#! или выше"
 spec_issue_one_tt: "Других выпусков не идёт"
 spec_issue_cool_tt: "После прошлого выпуска рынок отдыхал год"
 spec_issue_no_lever_tt: "На этот товар ([concept_good]) не действует [concept_spec_intervention]"
 spec_lever_no_issue_tt: "На этот товар ([concept_good]) не идёт крупный выпуск акций"
 SPEC_LEVERS_TT: "#header Рыночное вмешательство#!\n#N -[Country.MakeScope.ScriptValue('spec_lever_authority')|0]#! [concept_authority] в месяц\n$TOOLTIP_DELIMITER$\nСдерживается: #v [Country.MakeScope.ScriptValue('spec_n_restrain')|0]#!\nПоощряется: #v [Country.MakeScope.ScriptValue('spec_n_encourage')|0]#!\n[concept_budget_additional_income]: #P @money![Country.MakeScope.ScriptValue('spec_lever_levy')|D]#! в неделю\n[concept_budget_additional_expenses]: #N @money![Country.MakeScope.ScriptValue('spec_lever_spend')|D]#! в неделю"
 spec_story.1.t: "Обвал рынка: [ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName]"
 spec_story.1.t_generic: "Обвал рынка"
 spec_story.1.d: "Товар «[ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName]» больше не вызывает ажиотажа. Цены, росшие целый год, рухнули за месяц, а компании, учреждённые на вершине увлечения, не могут оплатить счета. Купцы, скупавшие товар по любой цене, остались со складами, которые не могут опустошить. Банки, дававшие займы под залог этих запасов, подсчитывают убытки."
 spec_story.1.d_generic: "Ажиотаж вокруг самых модных товаров сезона закончился. Цены, росшие целый год, рухнули за месяц, а компании, учреждённые на вершине увлечения, не могут оплатить счета. Купцы, скупавшие товар по любой цене, остались со складами, которые не могут опустошить. Банки, дававшие займы под залог этих запасов, подсчитывают убытки."
 spec_story.1.f: "«Мой товар вот уже тридцать лет: [ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName]. Но никогда не видел я такой жажды купить и такого отчаяния при продаже, как за нынешний год»."
 spec_story.1.f_generic: "«Я в этой торговле уже тридцать лет, но никогда не видел такой жажды купить и такого отчаяния при продаже, как за нынешний год»."
 spec_story.1.a: "Помочь разорившимся производителям."
 spec_story.1.b: "Пусть слабейшие торговые дома разорятся."
 spec_story.1.c: "Расследовать дела учредителей."
 spec_story.2.t: "Афера раскрыта"
 spec_story.2.d: "Директора компании «[ROOT.GetCountry.GetCapital.GetCityHubName]: [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName]» бежали из страны. Её книги показывают, что щедрые дивиденды последних двух лет выплачивались из новых взносов. Её акциями владели тысячи служащих, вдов и лавочников. Город [ROOT.GetCountry.GetCapital.GetCityHubName] читает в каждой газете один вопрос: сколько ещё проспектов вышло из-под той же руки?"
 spec_story.2.d_generic: "Город [ROOT.GetCountry.GetCapital.GetCityHubName] потрясён бегством директоров прославленного акционерного общества за границу. Его книги показывают, что щедрые дивиденды последних двух лет выплачивались из новых взносов. Его акциями владели тысячи служащих, вдов и лавочников. Город [ROOT.GetCountry.GetCapital.GetCityHubName] читает в каждой газете один вопрос: сколько ещё проспектов вышло из-под той же руки?"
 spec_story.2.f: "#bold Разыскивается по обвинению в мошенничестве#!\nДиректор-распорядитель компании «[ROOT.GetCountry.GetCapital.GetCityHubName]: [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName]», лет пятидесяти, хорошо одет, обходителен и внушает доверие. В последний раз замечен у доков."
 spec_story.2.f_generic: "#bold Разыскивается по обвинению в мошенничестве#!\nДиректор-распорядитель акционерного общества, город [ROOT.GetCountry.GetCapital.GetCityHubName]. Лет пятидесяти, хорошо одет, обходителен и внушает доверие. В последний раз замечен у доков."
 spec_story.2.a: "Предать директоров суду."
 spec_story.2.b: "Замять дело."
 spec_story.2.c: "Возместить убытки мелким инвесторам."
 spec_story.3.t: "Набег на банки"
 spec_story.3.d: "Сегодня утром город [ROOT.GetCountry.GetCapital.GetCityHubName] увидел, как вкладчики осадили один из старейших банков. К полудню его двери закрылись. Его банкноты отказываются принимать по всему городу, а фирмы, державшие там счета, не могут выдать рабочим недельное жалованье. Очереди у всех прочих банков растут с каждым часом."
 spec_story.3.f: "«Мой отец хранил сбережения в этом банке, как и его отец до него. Нам говорили, что он надёжен, как сама казна»."
 spec_story.3.a: "Гарантировать его вклады."
 spec_story.3.b: "Он должен выстоять или пасть сам."
 spec_story.3.c: "Мы должны прокредитовать банки."
 spec_story.4.t: "Паника: [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]"
 spec_story.4.t_generic: "Паника за рубежом"
 spec_story.4.d: "Город [ROOT.GetCountry.GetCapital.GetCityHubName] получил известие: страна [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] переживает такое событие, как [concept_spec_financial_panic]. Её банки требуют возврата зарубежных займов. Страна [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] была рынком сбыта и источником кредитов для наших фирм, а теперь им внезапно не хватает денег. Каждый купец на бирже хочет знать, распространится ли беда дальше."
 spec_story.4.d_generic: "Город [ROOT.GetCountry.GetCapital.GetCityHubName] получил известие о финансовой панике за рубежом. Иностранные банки требуют вернуть займы, а нашим фирмам, торговавшим или занимавшим за границей, внезапно не хватает денег. Каждый купец на бирже хочет знать, распространится ли беда дальше."
 spec_story.4.f: "«Стоит стране [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] чихнуть, и наша биржа слегает»."
 spec_story.4.f_generic: "«Стоит соседям чихнуть, и наша биржа слегает»."
 spec_story.4.a: "Дать взаймы нашим торговым домам."
 spec_story.4.b: "Их беды нас не касаются."
 spec_story.4.c: "Обвинить безрассудных иностранных банкиров."
 spec_story.5.t: "Уверенность возвращается"
 spec_story.5.d: "Худшая пора паники позади. Уцелевшие фирмы вновь нанимают рабочих, банки начали выдавать займы надёжным клиентам, а немногие смельчаки скупают акции за малую долю прошлогодней цены. Никто не ждёт скорого возвращения прежних излишеств, но город [ROOT.GetCountry.GetCapital.GetCityHubName] вновь готов вести дела."
 spec_story.5.f: "«Те, кто весной всё распродал, осенью покупают обратно. И дешевле, чем продали»."
 spec_story.5.a: "Поощрить новые предприятия."
 spec_story.5.b: "На этот раз кредитование должно быть надёжным."
 spec_story.6.t: "Депутация фабрикантов"
 spec_story.6.d: "К правительству явилась депутация фабрикантов и купцов. Они говорят, что их новые предприятия стоят недостроенными из-за нехватки кредита, тогда как зарубежные соперники свободно занимают деньги и захватывают их рынки. Они просят вновь разрешить банкам выдавать займы."
 spec_story.6.f: "«Ваша осторожность, сударь, спасла нас от краха, позаботившись о том, чтобы разоряться было уже нечему»."
 spec_story.6.a: "Смягчить кредитование."
 spec_story.6.b: "Кредитование останется жёстким."
 spec_story.6.c: "Вместо этого предложить им субсидию."
 spec_story.7.t: "Повальное увлечение акциями"
 spec_story.7.d: "Город [ROOT.GetCountry.GetCapital.GetCityHubName] видит, как кофейни заполняются служащими, лавочниками и школьными учителями. Они торгуют акциями компаний, которых никогда не видели. Акции предприятий, выпускающих товар «[ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName]», переходят из рук в руки по нескольку раз в день, большей частью на заёмные деньги. Говорят, даже прислуга закладывает всё нажитое ради доли в следующем выпуске акций."
 spec_story.7.d_generic: "Город [ROOT.GetCountry.GetCapital.GetCityHubName] видит, как кофейни заполняются служащими, лавочниками и школьными учителями. Они торгуют акциями компаний, которых никогда не видели. Акции новейших предприятий переходят из рук в руки по нескольку раз в день, большей частью на заёмные деньги. Говорят, даже прислуга закладывает всё нажитое ради доли в следующем выпуске акций."
 spec_story.7.f: "«Сегодня утром мой цирюльник посоветовал мне акции компаний, чей товар: [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName]. Я принял совет и дал ему свой: продавайте»."
 spec_story.7.f_generic: "«Сегодня утром мой цирюльник дал мне совет насчёт акций. Я принял его и дал ему свой: продавайте»."
 spec_story.7.a: "Пусть народ приобщится к богатству."
 spec_story.7.b: "Запретить торговлю на заёмные деньги."
 spec_story.7.c: "Ввести гербовый сбор на передачу акций."
 spec_story.8.t: "Предостережения о пузыре"
 spec_story.8.d: "Город [ROOT.GetCountry.GetCapital.GetCityHubName] обсуждает письмо почтенного экономиста в ведущую газету. Он утверждает, что товары [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] и [ROOT.GetCountry.MakeScope.Var('spec_story_good2').GetGoods.GetName] не могут дорожать вечно и что банки выдавали займы под цены, каких не заплатил бы ни один здравомыслящий человек. Биржевые посредники называют это старушечьим карканьем. И всё же письмо читают вслух в каждом клубе и каждой конторе города."
 spec_story.8.d_generic: "Город [ROOT.GetCountry.GetCapital.GetCityHubName] обсуждает письмо почтенного экономиста в ведущую газету. Он утверждает, что самые модные нынче товары не могут дорожать вечно и что банки выдавали займы под цены, каких не заплатил бы ни один здравомыслящий человек. Биржевые посредники называют это старушечьим карканьем. И всё же письмо читают вслух в каждом клубе и каждой конторе города."
 spec_story.8.f: "«Цена есть лишь то, что согласился заплатить последний покупатель. Я прошу читателей задуматься, сколько покупателей ещё осталось»."
 spec_story.8.a: "Своевременное предостережение."
 spec_story.8.b: "Пустое паникёрство."
