 SPEC_XS_CAP_TT: "#header Капитал#!\n$TOOLTIP_DELIMITER$\n#italic Деньги, на которые может опираться наша биржа ([concept_spec_exchange]).#!\n\nСобственный: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_own_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, шесть месяцев дохода показателя «[concept_investment_pool]» (среднее за год)\nОт наших связей: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_reach_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, четверть денег каждой меньшей страны ([concept_country]) в нашем рынке ([concept_market]), наших субъектов ([Concept('concept_subject','$concept_subjects|q$')]), нашего блока ([concept_power_bloc]) или любой страны, давшей нам права на [concept_foreign_investment]. Не больше собственного\n$TOOLTIP_DELIMITER$\n#weak Больше денег помогает, но всё слабее. Чтобы удвоить очки, нужно в шестнадцать раз больше денег#!"
 SPEC_XS_WEALTH_TT: "#header Богатство на душу населения#!\n$TOOLTIP_DELIMITER$\n#italic Насколько богат наш народ по сравнению с миром.#!\n\nДоход показателя «[concept_investment_pool]» на человека в #v [Country.MakeScope.Var('spec_xs_ratio_v').GetValueWithDefault('(CFixedPoint)0')|2]#! раз выше среднемирового\nУсиление: от #v x0.75#! до #v x1.5#!\n$TOOLTIP_DELIMITER$\n#weak Богатство помогает, но всё слабее#!"
 SPEC_XS_TECH_TT: "#header Финансовые технологии#!\n$TOOLTIP_DELIMITER$\n#italic Денежные знания, которые изучила наша страна. Каждое повышает очки нашей биржи.#!\n\n#b Каждая изученная технология добавляет#!\n$banking$: #P +5%#!\n$stock_exchange$: #P +5%#!\n$central_banking$: #P +5%#!\n$joint_stock_companies$: #P +5%#!\n$mutual_funds$: #P +5%#!\n$investment_banks$: #P +10%#!\n$international_exchange_standards$: #P +10%#!\n$modern_financial_instruments$: #P +10%#!\n$TOOLTIP_DELIMITER$\n#instruction Для статуса #v Международная#! также нужна технология «[GetTechnology('stock_exchange').GetName]», для статуса #v Мировой центр#! технология «[GetTechnology('central_banking').GetName]», вместе с остальными требованиями каждого статуса#!"
 SPEC_XS_ECON_TT: "#header Экономическая система#!\n$TOOLTIP_DELIMITER$\n#italic Как наш экономический закон меняет очки.#!\n\n$law_laissez_faire$: #P x1.15#!\n$law_interventionism$: #P x1.05#!\n$law_agrarianism$: #N x0.95#!\n$law_traditionalism$: #N x0.9#!\n$law_extraction_economy$: #N x0.9#!\n$law_command_economy$: #N x0.75#!\n$law_cooperative_ownership$: #N x0.6#!"
