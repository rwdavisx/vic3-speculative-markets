 SPEC_COL_LEVER_TT: "#header Рыночное вмешательство#!\n$TOOLTIP_DELIMITER$\n#italic Вмешайтесь, чтобы охладить товар или подогреть интерес к нему.#!\n\n#v Сдерживание спекуляций#! удерживает интерес на уровне #v Спокойствие#!. Производители #N теряют#! [concept_throughput] и платят сбор\n#v Поощрение инвестиций#! удерживает интерес не ниже уровня #v Интерес#!. Производители #P получают#! $concept_throughput$, а платит государство\n$TOOLTIP_DELIMITER$\n#weak Каждое вмешательство стоит [concept_authority] каждый месяц до отмены, больше для товаров первой необходимости и широко торгуемых товаров#!"
