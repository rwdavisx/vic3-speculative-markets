 SPEC_XS_CAP_TT: "#header Капитал#!\n$TOOLTIP_DELIMITER$\nОчки начинаются с капитала, на который опирается наша биржа ([concept_spec_exchange]), и растут как его квадратный корень: вчетверо больший капитал удваивает очки.\n\nСобственный: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_own_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, шесть месяцев поступлений в [concept_investment_pool], в среднем за прошлый год\nОт наших связей: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_reach_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, четверть капитала каждой меньшей страны ([concept_country]) в нашем рынке ([concept_market]), наших субъектов ([Concept('concept_subject','$concept_subjects|q$')]), нашего блока ([concept_power_bloc]) или стран, давших нам права на [concept_foreign_investment]; не больше собственного"
 SPEC_XS_WEALTH_TT: "#header Богатство на душу населения#!\n$TOOLTIP_DELIMITER$\nНаши поступления в [concept_investment_pool] на человека в #v [Country.MakeScope.Var('spec_xs_ratio_v').GetValueWithDefault('(CFixedPoint)0')|2]#! раз выше мировых. Сбережения богатого народа делают рынок глубже: квадратный корень этой величины, от #v x0.5#! до #v x2#!"
 SPEC_XS_TECH_TT: "#header Финансовые технологии#!\n$TOOLTIP_DELIMITER$\nКаждая изученная технология повышает очки:\n$banking$: #P +5%#!\n$stock_exchange$: #P +5%#!\n$central_banking$: #P +5%#!\n$joint_stock_companies$: #P +5%#!\n$mutual_funds$: #P +5%#!\n$investment_banks$: #P +10%#!\n$international_exchange_standards$: #P +10%#!\n$modern_financial_instruments$: #P +10%#!\n\nДля статуса #v Международная#! нужна технология «[GetTechnology('stock_exchange').GetName]», для статуса #v Мировой центр#! технология «[GetTechnology('central_banking').GetName]»"
 SPEC_XS_ECON_TT: "#header Экономическая система#!\n$TOOLTIP_DELIMITER$\nНаша экономическая система умножает очки:\n$law_laissez_faire$: #P x1.15#!\n$law_interventionism$: #P x1.05#!\n$law_agrarianism$: #N x0.95#!\n$law_traditionalism$: #N x0.9#!\n$law_extraction_economy$: #N x0.9#!\n$law_command_economy$: #N x0.75#!\n$law_cooperative_ownership$: #N x0.6#!"
