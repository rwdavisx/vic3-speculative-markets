 SPEC_EXCH_G_TRUST_TT: "#header Доверие#!\n$TOOLTIP_DELIMITER$\nКаждый месяц: #P растёт#!, если нет события «[concept_spec_financial_panic]» и стандарты кредитования #v Надёжные#! или строже, держится при #v Слабые#!, #N падает#! при #v Безрассудные#!\nЗавершение бума в основном товаре: [concept_spec_correction] #P немного#!, [concept_spec_bust] или [concept_spec_collapse] #N сильно#!\n[concept_spec_financial_panic]: от #N -20%#! до #N -50%#! доверия в начале, больше при высоком показателе «[concept_spec_leverage]», вдвое меньше, если её вызвала [concept_spec_foreign_panic] или действует обязательство; доверие #N снова уменьшается вдвое#!, если паника проходит до конца без спасения банков\n[concept_spec_bad_debts]: #N падает#! каждый месяц, и статус не может расти\nНовая биржа начинает с #v 50%#!"
