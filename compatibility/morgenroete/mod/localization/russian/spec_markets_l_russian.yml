 SPEC_CHARTER_HELD: "Устав дарован"
 SPEC_CHARTER_GRANT: "Даровать устав"
 SPEC_CHARTER_RULE: "#P Первый устав бесплатен#!\nСмена устава позже стоит #N -50%#! доверия к бирже ([concept_spec_exchange]) и всех специализаций, которые допускал только прежний устав\nПосле дарования устав действует #v 10#! лет"
 spec_charter_current_tt: "У нашей биржи ([concept_spec_exchange]) ещё нет этого устава"
 spec_charter_locked_tt: "За последние #v 10#! лет устав не даровался"
 SPEC_H_CHARTER: "Устав биржи"
 SPEC_H_CHARTER_TT: "#header Устав биржи#!\n$TOOLTIP_DELIMITER$\n$SPEC_EXCH_CARD_NOTE$\n\n$SPEC_CHARTER_RULE$"
 SPEC_EXCH_CARD_NOTE: "#italic Какой рынок представляет наша биржа ([concept_spec_exchange]). Мы выбираем один.#!\nКаждый устав даёт свой бонус и открывает пути к славе, которые не может выбрать никакой другой устав"
 SPEC_H_KNOWN_TT: "#header Специализации#!\n$TOOLTIP_DELIMITER$\n#italic Пути к славе, по которым идёт наша биржа ([concept_spec_exchange]).#!\n\n$SPEC_PURSUE_RULE$"
 SPEC_H_RIVAL: "Конкуренция"
 SPEC_H_RIVAL_TT: "#header Конкуренция#!\n$TOOLTIP_DELIMITER$\n$SPEC_RIVAL_RULE$"
 SPEC_H_RIVAL_RIGHT: "#N -[GetPlayer.MakeScope.ScriptValue('spec_rv_upkeep_total')|0]#! @inf!"
 SPEC_RIVAL_RULE: "#italic Наша биржа ([concept_spec_exchange]) может выбрать другие биржи и бороться с ними за доверие.#!\n\nСодержание каждого конкурента стоит от #N 25#! до #N 150#! влияния. Чем выше статус, тем дороже\nПри самом низком статусе можно выбрать #v 1#! конкурента и ещё по одному за каждую ступень выше (до #v 4#!)\nКонкурента нельзя бросить в первый год\nЭто не связано с дипломатическим соперничеством\n\n#b Состязание#!\nКаждое состязание длится #v 5#! лет с момента начала, затем решается, как перетягивание каната, и начинается новое\nПолоса начинается с соотношения двух очков ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')])\n#N Каждое состязание сверх первого распыляет наши силы#! и ослабляет наши очки во всех них (#v 2#! состязания: #N 80%#!, #v 4#!: #N 57.1%#!)\nКаждая голубая фишка ([concept_spec_blue_chip]) тянет полосу на #v 3%#! в свою сторону (полностью до #v 5#!, наполовину до #v 10#!)\nКаждое удачное действие сдвигает её на #v 10%#! в свою сторону, не более #v 5#! сдвигов за сторону\nОколо середины это ничья\n\n#b Победа#!\nПосле #P победы#! проигравший отдаёт #P 5%#! доверия\nПосле #P решающей победы#! (полоса заканчивается дальше #v 75%#! от середины) проигравший отдаёт #P 10%#! доверия и #P 5%#! дохода своего показателя «[concept_investment_pool]» на 12 мес.\nПобеда над биржей с более высоким статусом даёт больше. Победа над более низкой даёт меньше\nЕсли отношения ([concept_relations]) плохие или хуже, проигравший теряет в #N x1.5#! раза больше\n\n#b Действия#!\nИх можно применять к биржам, с которыми мы состязаемся, и к тем, что состязаются с нами\nКаждое действие срабатывает раз в год против каждого конкурента\nПротив более крупной биржи они дороже и слабее (от #v x0.75#! до #v x1.33#!)\nВо время события «[concept_spec_financial_panic]» бегущие деньги сначала уходят к конкуренту"
 SPEC_RV_SUB_OUT: "Наши конкуренты"
 SPEC_RV_SUB_OUT_RIGHT: "#v [GetPlayer.MakeScope.Var('spec_rv_n_out').GetValue|0]#!"
 SPEC_RV_SUB_IN: "Конкурируют с нами"
 SPEC_RV_SUB_IN_RIGHT: "#v [GetPlayer.MakeScope.Var('spec_rv_n_in').GetValue|0]#!"
 SPEC_RV_COL_EXCH: "$concept_country$"
 SPEC_RV_COL_SCORE: "Спор"
 SPEC_RV_COL_SCORE_TT: "Кто впереди, с нашими очками рядом с их очками и числом сдвигов каждой стороны. Каждое состязание решается через #v 5#! лет после начала"
 SPEC_RV_COL_LEFT: "Конец"
 SPEC_RV_COL_LEFT_TT: "Сколько лет до решения этого состязания. Каждое длится #v 5#! лет"
 SPEC_RV_LEFT: "#v [Country.MakeScope.Var('spec_rv_ui_left').GetValueWithDefault('(CFixedPoint)5')|0]#! г."
 SPEC_RV_LEFT_TT: "#header Конец состязания#!\n$TOOLTIP_DELIMITER$\n#italic Каждое состязание длится #v 5#! лет. Когда оно заканчивается, полоса фиксируется, победитель забирает доверие у проигравшего и начинается новое состязание.#!\n\nЭто решится примерно через #v [Country.MakeScope.Var('spec_rv_ui_left').GetValueWithDefault('(CFixedPoint)5')|0]#! лет"
 SPEC_RV_COL_ACT: "Действия"
 SPEC_RV_COL_ACT_TT: "Наши действия против них. Каждое удавшееся сдвигает спор в нашу сторону"
 SPEC_RV_COL_LAST: "Их последнее действие"
 SPEC_RV_COL_LAST_TT: "Их последнее действие против нас"
 SPEC_RV_SCORE_TT: "#header Состязание со страной [Country.GetNameNoFormatting]#!\n#italic Перетягивание каната между нашими двумя биржами ([concept_spec_exchange]), которое решается через #v 5#! лет после начала. На чьей стороне окажется полоса, тот получит доверие другого.#!\n$TOOLTIP_DELIMITER$\n$SPEC_RV_NOW_LINE$\n$TOOLTIP_DELIMITER$\n$SPEC_RV_SCORE_BODY$"
 SPEC_RV_NOW_LINE: "Если бы решилось сейчас: [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)0.75'), 'SPEC_RV_BAND_BIGWIN', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)0.2'), 'SPEC_RV_BAND_WIN', SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)-0.2'), 'SPEC_RV_BAND_DRAW', SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)-0.75'), 'SPEC_RV_BAND_LOSS', 'SPEC_RV_BAND_BIGLOSS'))))]\nПолоса: #v [Select_CFixedPoint(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)0'), Country.MakeScope.Var('spec_rv_ui_p').GetValue, Multiply_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)-1'))|%0]#! [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)0'), 'SPEC_RV_OUR_WAY', 'SPEC_RV_THEIR_WAY')]\nРешится через #v [Country.MakeScope.Var('spec_rv_ui_left').GetValueWithDefault('(CFixedPoint)5')|0]#! лет"
 SPEC_RV_OUR_WAY: "в нашу сторону"
 SPEC_RV_THEIR_WAY: "в их сторону"
 SPEC_RV_SCORE_BODY: "#b Что двигает полосу#!\nОчки бирж ([concept_spec_exchange]), #v [GetPlayer.MakeScope.Var('spec_centre_score').GetValue|0]#! против #v [Country.MakeScope.Var('spec_centre_score').GetValue|0]#!: [Divide_CFixedPoint(Subtract_CFixedPoint(Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1')), Multiply_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Country.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'))), Max_CFixedPoint(Max_CFixedPoint(Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1')), Multiply_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Country.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'))), '(CFixedPoint)1'))|+=%0][AddLocalizationIf(LessThan_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)0.99'), 'SPEC_RV_THIN_US')][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)0.99'), 'SPEC_RV_THIN_THEM')]\nНаши сдвиги, #v [Country.MakeScope.Var('spec_rv_ui_us').GetValue|0]#!: [Multiply_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_us').GetValue, '(CFixedPoint)0.1')|+=%0]\nИх сдвиги, #v [Country.MakeScope.Var('spec_rv_ui_them').GetValue|0]#!: [Multiply_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_them').GetValue, '(CFixedPoint)-0.1')|+=%0]\nНаши голубые фишки ([concept_spec_blue_chip]), #v [GetPlayer.MakeScope.Var('spec_bc_n').GetValueWithDefault('(CFixedPoint)0')|0]#!: [Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.03')|+=%0]\nИх голубые фишки ([concept_spec_blue_chip]), #v [Country.MakeScope.Var('spec_bc_n').GetValueWithDefault('(CFixedPoint)0')|0]#!: [Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)-0.03')|+=%0]\n\n#weak Каждое удачное действие сдвигает полосу на #v 10%#!, не более #v 5#! раз за сторону#!"
 SPEC_RV_THIN_US: "\n#indent_newline:2 Мы #N распыляем силы#!, участвуя в #v [GetPlayer.MakeScope.Var('spec_rv_n_all').GetValueWithDefault('(CFixedPoint)0')|0]#! состязаниях, поэтому наши очки считаются как #N [GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1')|%0]#!#!"
 SPEC_RV_THIN_THEM: "\n#indent_newline:2 Они #P распыляют силы#!, участвуя в #v [Country.MakeScope.Var('spec_rv_n_all').GetValueWithDefault('(CFixedPoint)0')|0]#! состязаниях, поэтому их очки считаются как #P [Country.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1')|%0]#!#!"
 SPEC_RV_ROUND: "#weak Споры решатся через#! #v [Country.MakeScope.Var('spec_rv_ui_left').GetValueWithDefault('(CFixedPoint)5')|0]#! #weak лет#!"
