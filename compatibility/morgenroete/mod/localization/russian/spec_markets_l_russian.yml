 SPEC_RV_SLOT_CANCEL_TT: "#header Завершить состязание: [Country.GetNameNoFormatting]#!\n$TOOLTIP_DELIMITER$\n#italic Итог через $SPEC_RV_LEFT$. Завершение сейчас считается поражением, а если состязание уже показывает его, то это $SPEC_RV_BAND_BIGLOSS$.#!\n\nНаша биржа ([concept_spec_exchange]) теряет #N [Multiply_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_forfeit').GetValueWithDefault('(CFixedPoint)0'), Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_exch_loss'), Select_CFixedPoint(GetScriptedGui('spec_sgui_rv_is_bitter').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End), '(CFixedPoint)1.5', '(CFixedPoint)1')))|1]#! доверия\nИх биржа получает #N [Country.MakeScope.Var('spec_rv_ui_forfeit').GetValueWithDefault('(CFixedPoint)0')|1]#! доверия\n[SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)-0.7499'), 'SPEC_RV_SLOT_CANCEL_LURE', 'SPEC_RV_EV_NONE')]Ячейка состязания освобождается[SelectLocalization(GetScriptedGui('spec_sgui_rv_is_locked').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End), 'SPEC_RV_SLOT_CANCEL_LOCKED', 'SPEC_RV_SLOT_CANCEL_CLICK')]"
