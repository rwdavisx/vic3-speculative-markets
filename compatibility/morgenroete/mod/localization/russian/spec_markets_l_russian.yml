 SPEC_H_COMPANIES_TT: "#header $concept_companies$#!\n$TOOLTIP_DELIMITER$\n[concept_spec_investor_interest] повышает или понижает [concept_throughput] сооружений, производящих товар. Он снижается ещё сильнее, пока товар восстанавливается после бума. [concept_company] зарабатывает больше, пока её товары пользуются спросом, и меньше, когда они дешевеют."
