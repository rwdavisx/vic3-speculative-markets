 spec_ld_status_2: "#n Депрессия:#! не более #v [GetGlobalVariable('spec_ld_months').GetValue|0]#! мес.\nИнвестиции #N -15%#!, строительство #N -15%#!, торговля #N -15%#!, [concept_loans], процентная ставка #N +20%#!"
