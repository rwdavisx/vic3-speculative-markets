 SPEC_UNWIND_DESC_3: "Этот бум поднялся до уровня #v Лихорадка#!\n#N Закончится#!, если ценовой тренд упадёт ниже #v [Divide_CFixedPoint('(CFixedPoint)-4.988', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!. Тогда [concept_spec_investor_interest] перейдёт на уровень #v Отток#!, и наступит [concept_spec_collapse]\nЗатем инвесторы будут держаться в стороне #v 12#! мес.\n#P Опасность снижается#! по мере того, как бум стареет"
