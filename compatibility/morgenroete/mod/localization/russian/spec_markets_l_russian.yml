 SPEC_TILE_BOOM_COST: ", #N -[Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|0]#! [concept_spec_market_confidence]"
