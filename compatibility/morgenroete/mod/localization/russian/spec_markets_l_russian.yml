 SPEC_XS_TT: "#header @spec_speculative_excess! $concept_spec_speculative_excess$: [Country.MakeScope.Var('spec_heat').GetValueWithDefault('(CFixedPoint)0')|0] / 200#!\n$TOOLTIP_DELIMITER$\n#italic Это пузырь. Чем дольше бум перегрет, тем он больше.#!\n\n#P Растёт#!, пока [concept_spec_market_confidence] не ниже #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#!\n#v Медленно уменьшается#!, пока она между #v 60#! и #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#!\n#N Лопается#!, если она падает ниже #v 60#!\n\nЕсли бы он лопнул сейчас: #N -[Country.MakeScope.ScriptValue('spec_burst_now')|0]#! ([concept_spec_market_confidence]) сразу (не больше #N [Country.MakeScope.ScriptValue('spec_burst_max')|0]#!)\n$TOOLTIP_DELIMITER$\n#instruction Чтобы сдуть его мягко, держите уверенность между 60 и [Country.MakeScope.ScriptValue('spec_heat_from')|0]. Шкала краснеет, когда лопнувший пузырь ударит больно.#!"
