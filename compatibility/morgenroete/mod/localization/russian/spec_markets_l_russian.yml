 SPEC_IL_FILTER_TIERS: "[concept_spec_investor_interest]"
 SPEC_IL_SORT_GOODS_TT: "#header Сортировать по товарам#!\n$TOOLTIP_DELIMITER$\n[Concept('concept_good','$concept_goods|q$')], которыми торгует наш [concept_market], располагаются в фиксированном порядке: сначала по категории, затем по названию."
 SPEC_IL_SORT_INTEREST_TT: "#header Сортировать: [concept_spec_investor_interest]#!\n$TOOLTIP_DELIMITER$\nСначала самый высокий интерес; внутри уровня сначала самые торгуемые.\n\nМетка показывает уровень, от @spec_interest_fleeing! #v Отток#! до @spec_interest_feverish! #v Лихорадка#!. Стрелка показывает изменение за этот месяц."
 SPEC_IL_SORT_LEVER_TT: "$SPEC_IL_SORT_LEVER_BASE_TT$$SPEC_IL_ISSUE_FILTER$"
 SPEC_IL_ISSUE_FILTER: "\n\nТакже отображаются действующие крупные выпуски."
 SPEC_IL_SORT_LEVER_BASE_TT: "#header Показать вмешательства#!\n$TOOLTIP_DELIMITER$\nПоказывает только товары, для которых действует [concept_spec_intervention].\n\n$SPEC_COL_LEVER_TT$\n\n#instruction Нажмите, чтобы отфильтровать; нажмите снова, чтобы показать все#!"
 SPEC_IL_DANGER_TT: "#header Зона краха#!\nЕсли [concept_spec_investor_interest] упадёт до этого уровня, наступит [concept_spec_collapse], и [concept_spec_market_confidence] снизится примерно на #N [Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#!."
 SPEC_IL_CRASHED_TT: "#header [Goods.GetName]: бум завершён#!\nЕго бум завершился в этом месяце, исход: [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]. Теперь инвесторы воздерживаются от вложений в течение [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))], а там, где его производит [concept_company], её отрасль теряет [concept_throughput]."
 SPEC_IL_GLUT_TT: "#header [Goods.GetName]: восстановление#!\nИсход последнего бума: [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]. Инвесторы воздерживаются от вложений в течение [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))] после его завершения, удерживая [concept_spec_investor_interest] на уровне #v Сомнения#! или ниже. Если товар производит [concept_company], в этой отрасли снижается [concept_throughput]."
 SPEC_TILE_BANKS: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_expx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_BANKS_ON', 'SPEC_GOODS_NONE')]$SPEC_TILE_CYCLE$"
 SPEC_TILE_BANKS_ON: "\n\n#title Банковские кредиты:#! #v [Country.MakeScope.Var(Concatenate('spec_exp_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! от [concept_spec_outstanding_credit], #v [Country.MakeScope.Var(Concatenate('spec_ui_expm_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! мес. дохода пула\nЕсли бы его бум закончился, [concept_spec_market_confidence] упала бы в #v x[Country.MakeScope.Var(Concatenate('spec_ui_expx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|2]#! раз сильнее, чем при буме, в который банки не давали кредитов"
 SPEC_NOTE_BANKS: ""
 SPEC_NOTE_BANKS_ON: " Банки активно кредитовали его, поэтому падение оказалось в #N x[SCOPE.GetValue('spec_note_bank')|2]#! раз сильнее."
 SPEC_H_BANK_LENT: "Куда банки давали кредиты"
 SPEC_H_BANK_LENT_TT: "#header Куда банки давали кредиты#!\n$TOOLTIP_DELIMITER$\nБольшую часть новых кредитов банки направляют в товары на подъёме: чем больше доля товара в нашей торговле и чем выше [concept_spec_investor_interest], тем больше он получает. Кредит остаётся в своём товаре до погашения.\n\nКогда завершается бум, в который банки давали кредиты, [concept_spec_market_confidence] падает сильнее. Сдерживание спекуляций товаром вдвое сокращает новые кредиты в него."
 SPEC_BANK_PIE: "Кредиты в бумы по товарам"
 SPEC_BANK_SLICE_NAME: "[SelectLocalization(Country.MakeScope.Var(Concatenate('spec_bank_oth_', Scope.GetGoods.GetKey)).IsSet, 'SPEC_BANK_OTHER', 'SPEC_BANK_GOOD_NAME')]"
 SPEC_BANK_GOOD_NAME: "[Scope.GetGoods.GetName]"
 SPEC_BANK_SLICE_SHARE: "[SelectLocalization(Country.MakeScope.Var(Concatenate('spec_bank_oth_', Scope.GetGoods.GetKey)).IsSet, 'SPEC_BANK_OTHER_SHARE', 'SPEC_BANK_GOOD_SHARE')]"
 SPEC_BANK_OTHER_SHARE: "#v [Divide_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_exp_booms'), Country.MakeScope.Var('spec_bank_top').GetValueWithDefault('(CFixedPoint)0')), Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_exp_booms'), '(CFixedPoint)0.001'))|%0]#!"
 SPEC_BANK_GOOD_SHARE: "#v [Divide_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_exp_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_exp_booms'), '(CFixedPoint)0.001'))|%0]#!"
 SPEC_BANK_SLICE_TT: "[SelectLocalization(Country.MakeScope.Var(Concatenate('spec_bank_oth_', Scope.GetGoods.GetKey)).IsSet, 'SPEC_BANK_OTHER_TT', 'SPEC_BANK_GOOD_TT')]"
 SPEC_BANK_GOOD_TT: "#header [Scope.GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\n#v [Country.MakeScope.Var(Concatenate('spec_exp_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%1]#! от [concept_spec_outstanding_credit] вложено в него.\nЕсли бы его бум закончился, [concept_spec_market_confidence] упала бы #v x[Country.MakeScope.Var(Concatenate('spec_ui_expx_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)1')|2]#! сильнее.\n\n#grey Кредит остаётся в своём товаре до погашения, даже когда бум остывает.#!"
 SPEC_BANK_NONE_S: "#grey Кредитов в бумы нет#!"
 SPEC_BANK_NONE: "Банки не давали кредитов в бумы. Банки дают кредиты, пока [concept_spec_market_confidence] выше #v 55#! (сейчас #v [Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)0')|0]#!), в основном в товары с уровнем #v Интерес#! и выше."
 SPEC_LHIST_EMPTY: "#grey Записывается каждый месяц, начиная с этого#!"
 SPEC_H_CREDIT_HISTORY: "История кредитного плеча"
 SPEC_H_CREDIT_HISTORY_TT: "#header История кредитного плеча#!\n$TOOLTIP_DELIMITER$\n[concept_spec_leverage] за последние #v 36#! мес., новые справа\nБезопасно до #v 3#! мес., рискованно до #v 8#!, опасно свыше #v 8#!\nБелая линия: наш лимит кредитования\nПравый край: порог паники на каждом уровне"
 SPEC_H_CREDIT_HISTORY_RIGHT: "Сейчас #v [Country.MakeScope.ScriptValue('spec_lev')|1]#! мес."
