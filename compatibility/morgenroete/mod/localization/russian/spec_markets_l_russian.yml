 SPEC_JE_FAVOURED: "В фаворе"
 SPEC_JE_FAVOURED_TT: "Товары, к которым инвесторы в этом месяце питают наибольший интерес, поэтому доли в компаниях и зданиях, которые их производят, легко продаются"
 SPEC_JE_SHUNNED: "В опале"
 SPEC_JE_SHUNNED_TT: "Товары, с которыми инвесторы в этом месяце меньше всего хотят иметь дело"
 SPEC_JE_STAGE_6: "[JournalEntry.GetCountry.GetCapital.GetCityHubName]: над страной нависла [concept_spec_long_depression]. Инвесторы берегут то, что у них есть, и никому не дают в долг, а каждое оживление до сих пор угасало за несколько месяцев. За мировым восстановлением следит отдельная запись журнала.\n\nОбщественные работы дают безработным занятие и пропитание, пока длится спад."
 SPEC_JE_STAGE_5: "[JournalEntry.GetCountry.GetCapital.GetCityHubName]: страну охватила паника. Вкладчики с рассвета толпятся у банков, займы отзываются, а [concept_private_construction] сокращено вдвое ещё на #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! мес., если правительство не вмешается.\n\n#v Кредитовать банки#! завершает панику быстрее и вдвое ослабляет её эффекты. Общественные работы дают безработным занятие и пропитание.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_currency_v'), '(CFixedPoint)0'), 'SPEC_JE_SUSPEND_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_4: "Паника миновала, оставив разорившиеся торговые дома и недостроенные предприятия. Инвесторы подсчитывают убытки. Новая паника не может начаться в течение #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic_cooldown').GetValue|0]#! мес.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_reform_open_v'), '(CFixedPoint)0'), 'SPEC_JE_INQUIRY_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_3: "Город [JournalEntry.GetCountry.GetCapital.GetCityHubName]: биржа обезумела. Служащие и вдовы на заёмные деньги покупают акции #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! и #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#!, и каждый месяц, когда [concept_spec_market_confidence] составляет #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#! или больше, увеличивает [concept_spec_speculative_excess]. Когда $concept_spec_market_confidence$ падает ниже #v 60#!, пузырь лопается. Чем сильнее перегрев, тем тяжелее падение.\n\nСдерживание спекуляций с самыми востребованными товарами или ужесточение кредитования позволят постепенно выпустить воздух из пузыря."
 SPEC_JE_STAGE_2: "Деньги доступны, инвесторы полны оптимизма. На акции новых компаний в отраслях #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! и #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! за час подают больше заявок, чем выпущено, а банки щедро кредитуют под их залог. Когда [concept_spec_market_confidence] составляет #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#! или больше, начинает накапливаться [concept_spec_speculative_excess].\n\nБлагополучные времена также подходят для конверсии государственного долга под меньший процент."
 SPEC_JE_STAGE_1: "Город [JournalEntry.GetCountry.GetCapital.GetCityHubName]: биржевая торговля идёт спокойно. Инвесторы охотно вкладываются в следующие товары: #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! и #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#!. Они избегают других: #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! и #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!."
 SPEC_JE_STAGE_0: "[JournalEntry.GetCountry.GetCapital.GetCityHubName]: инвесторы насторожены. Понесённые недавно убытки заставляют их беречь деньги и избегать товаров #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! и #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!. Мягкое кредитование или поощрение инвестиций в товар могут вернуть их на рынок."
