 SPEC_BAR_SRC_TT: "#header Риск паники#!\n[concept_spec_market_confidence]: до #N -[Country.MakeScope.Var('spec_risk_src_hit').GetValueWithDefault('(CFixedPoint)0')|0]#!\n$TOOLTIP_DELIMITER$\n#N -20#! от фактора «[concept_spec_foreign_panic]»\n#v x[Country.MakeScope.Var('spec_risk_src_size').GetValueWithDefault('(CFixedPoint)0')|2]#! от соотношения их экономики и нашей\n#v x[Country.MakeScope.Var('spec_risk_src_w').GetValueWithDefault('(CFixedPoint)0')|2]#! от фактора «[concept_spec_market_tie]»\n#v x[Country.MakeScope.Var('spec_risk_src_reach').GetValueWithDefault('(CFixedPoint)0')|2]#! от их показателя «[concept_rank]»\n$TOOLTIP_DELIMITER$\n[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_risk_src_tie').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_BAR_TIE_1', SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_risk_src_tie').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_BAR_TIE_2', SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_risk_src_tie').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_BAR_TIE_3', SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_risk_src_tie').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)4'), 'SPEC_BAR_TIE_4', 'SPEC_BAR_TIE_5'))))] Их рынок находится в диапазоне #v [SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_risk_src').GetCountry.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), '(CFixedPoint)20'),'SPEC_TIER_PANIC', SelectLocalization(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_risk_src').GetCountry.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), '(CFixedPoint)20'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_risk_src').GetCountry.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), '(CFixedPoint)40')),'SPEC_TIER_WARY', SelectLocalization(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_risk_src').GetCountry.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), '(CFixedPoint)40'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_risk_src').GetCountry.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), '(CFixedPoint)60')),'SPEC_TIER_STEADY', SelectLocalization(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_risk_src').GetCountry.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), '(CFixedPoint)60'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_risk_src').GetCountry.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), '(CFixedPoint)80')),'SPEC_TIER_BUOYANT', 'SPEC_TIER_MANIA'))))]#!, и если бы там началась [concept_spec_financial_panic], наша [concept_spec_market_confidence] могла бы упасть на эту величину.\n\nУчитываются только страны в состоянии #v Потрясение#!, #v Настороженность#! или #v Мания#!."
