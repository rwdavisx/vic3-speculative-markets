 SPEC_EFFECT_GIVEN_TT: "#header Кредиты за этот месяц#!\n#v @money![Country.MakeScope.Var('spec_credit_given').GetValueWithDefault('(CFixedPoint)0')|D]#! за этот месяц\n$TOOLTIP_DELIMITER$\nСтавка кредитования: #v [SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_credit_rate'), '(CFixedPoint)0.01'), 'SPEC_CREDITW_0', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_credit_rate'), '(CFixedPoint)0.5'), 'SPEC_CREDITW_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_credit_rate'), '(CFixedPoint)1.15'), 'SPEC_CREDITW_2', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_credit_rate'), '(CFixedPoint)1.8'), 'SPEC_CREDITW_3', 'SPEC_CREDITW_4'))))]#!\n$ECONOMIC_SYSTEM_GC_LINK$: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_law_mult'), '(CFixedPoint)1')|+%0]#!\nФинансовые технологии: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_tech_credit'), '(CFixedPoint)1')|+%0]#!\n[concept_spec_credit_policy]: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_stance_credit'), '(CFixedPoint)1')|+%0]#!\n[concept_spec_banking_reforms]: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_reform_credit'), '(CFixedPoint)1')|+%0]#!\n[concept_spec_lending_standards]: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_credit'), '(CFixedPoint)1')|+%0]#!\n[concept_spec_exchange]: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_credit'), '(CFixedPoint)1')|+%0]#!\n\nБанки дают кредиты раз в месяц, пока [concept_spec_market_confidence] выше #v 55#!, и тем больше, чем она выше. Они не кредитуют сверх лимита кредитования, ниже порога паники, во время события «[concept_spec_financial_panic]» или мирового обвала, пока остаются [concept_spec_bad_debts], а также при политике «[Concept('concept_spec_credit_policy','$concept_spec_credit_policy_tight|q$')]».\n\nИзменение показателя «[concept_investment_pool]» показано в неделю."
