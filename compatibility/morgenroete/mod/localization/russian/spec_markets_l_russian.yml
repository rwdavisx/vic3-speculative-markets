 SPEC_EXCH_LIMIT_ON: "\nЛимит кредитования за наше место ([Concept('concept_spec_financial_centre','$concept_spec_financial_centres|q$')]): #P +[Country.MakeScope.ScriptValue('spec_exch_limit')|0]#! мес., всего до #v 12#!"
