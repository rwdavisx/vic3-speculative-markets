 SPEC_STANCE_TIGHT_TT: "#header Жёсткое кредитование#!\nВыдано кредитов за этот месяц: #v Нет#!\n$TOOLTIP_DELIMITER$\nКаждый месяц [concept_spec_market_confidence] теряет #N 10%#! от превышения над #v 60#!\nРеакция инвесторов: #N -50%#!\n@intelligentsia! Интеллигенция ([concept_in_government]): #P +2#! [concept_approval]\n@industrialists! Промышленники ([concept_in_government]): #N -2#! [concept_approval]\n\nБумы остаются меньше, поэтому их завершения и паники мягче.[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-1'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-1')), Not(GetScriptedGui('spec_sgui_tight').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_TIGHT_WHY')]"
 SPEC_STANCE_NORMAL_TT: "#header Обычное кредитование#!\nВыдано кредитов за этот месяц: #v @money![Country.MakeScope.ScriptValue('spec_credit_preview')|D]#!\n$TOOLTIP_DELIMITER$\nБанки предоставляют средства в [concept_investment_pool], пока [concept_spec_market_confidence] выше #v 55#!.[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0')), Not(GetScriptedGui('spec_sgui_normal').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_NORMAL_WHY')]"
 SPEC_STANCE_LOOSE_TT: "#header Мягкое кредитование#!\nВыдано кредитов за этот месяц: #v @money![Country.MakeScope.ScriptValue('spec_credit_preview_loose')|D]#!\n$TOOLTIP_DELIMITER$\nРеакция инвесторов на рост цен: #v +30%#!\n@industrialists! Промышленники ([concept_in_government]): #P +2#! [concept_approval]\n@intelligentsia! Интеллигенция ([concept_in_government]): #N -2#! [concept_approval]\n\nБумы становятся крупнее, как и потери при их завершении.[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1')), Not(GetScriptedGui('spec_sgui_loose').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_LOOSE_WHY')]"
