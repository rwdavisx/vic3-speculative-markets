 spec_excess_from_conf: "Растёт, потому что [concept_spec_market_confidence] в этом месяце на уровне #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! или выше"
 spec_excess_cooling: "Медленно сокращается, потому что [concept_spec_market_confidence] ниже #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!"
 spec_finance_bar: "Здоровые финансы"
 spec_finance_bar_desc: "@spec_sound_finance! [concept_spec_sound_finance]: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#! из #v 3#!; [concept_spec_banking_reforms]"
 spec_inquiry_no_panic_tt: "Сейчас не идёт [concept_spec_financial_panic]"
 spec_inquiry_reform_tt: "Наши технологии открывают реформу ([Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')]), которую мы ещё не провели"
 spec_suspend_panic_tt: "Сейчас идёт [concept_spec_financial_panic]"
 spec_suspend_note_tt: "Мы выбрали денежную школу в правилах эмиссии"
 spec_inquiry_when_tt: "[concept_spec_financial_panic] закончилась в последний год, и с тех пор комиссия не заседала, или прошло #v 10#! спокойных лет без паники (осталось #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_calm_left')|0]#! мес.)"
 spec_convert_conf_tt: "@spec_market_confidence! [concept_spec_market_confidence] составляет не менее #v 60#!"
 spec_convert_debt_tt: "Наш долг составляет не менее #v 20%#! предела, заданного показателем «[concept_credit]»"
 spec_convert_cd_tt: "Мы не конвертировали долг последние #v 10#! лет"
 spec_convert_conf_cost_tt: "@spec_market_confidence! [concept_spec_market_confidence] #N -5#!"
 spec_relief_when_tt: "Идёт [concept_spec_financial_panic] или [concept_spec_long_depression]"
 spec_relief_cd_tt: "Общественные работы не проводились в последние #v 12#! мес."
 spec_suspend_tt: "[concept_spec_financial_panic] #P заканчивается#! в течение #v 2#! мес., но до тех пор бьёт в полную силу\n[concept_spec_market_confidence] #P +15#!\nВ течение #v 10#! лет после этого [concept_spec_speculative_excess] растёт на #N 50%#! быстрее\n[concept_spec_lending_standards] ослабевают, как после спасения банков"
 spec_suspend_act: "Приостановить банковский акт"
 spec_suspend_act_desc: "Позволить банку выпустить больше банкнот, чем разрешает акт. Паника стихает в течение нескольких месяцев и ничего не стоит казне. Подвох в том, что инвесторы усваивают, что мы всегда их спасём. Считается решением #v Кредитовать банки#! для этой паники.\n\n#lore Великобритания приостанавливала свой банковский акт в 1847, 1857 и 1866 годах.#!"
 spec_relief_works_button: "Общественные работы"
 spec_relief_works_button_desc: "Оплачивать общественные работы и помощь, пока длится спад. На #v 12#! мес. это улучшает благосостояние и строительство и отнимает поддержку у радикалов. Чем больше наш [concept_gdp], тем дороже это каждую неделю."
 spec_convert_debt: "Конвертировать государственный долг"
 spec_convert_debt_desc: "Пока инвесторы в хорошем настроении, заменим наши займы новыми под меньший процент. Те, кто жил на прежние проценты, спасибо нам не скажут."
 spec_inquiry: "Следственная комиссия"
 spec_inquiry_desc: "Поручить комиссии выслушать банкиров, маклеров и разорённых вкладчиков и сказать, как должны работать наши банки и компании. Её доклад проводит одну реформу ([Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')]), которую открывают наши технологии. Правительство будет занято ею #v 6#! мес."
 spec_debt_converted: "Конвертированный долг"
 spec_debt_converted_desc: "Наши займы конвертированы под более низкую ставку, пока инвесторы охотно давали в долг."
 spec_relief_works: "Общественные работы"
 spec_relief_works_desc: "Общественные работы и помощь для тех, кого спад лишил работы."
 spec_relief_costs: "Расходы на общественные работы"
 spec_relief_costs_desc: "Казна оплачивает общественные работы и помощь."
 spec_act_suspended: "Банковский акт приостановлен"
 spec_act_suspended_desc: "Правительство отступило от собственного закона, чтобы прекратить панику."
 spec_inquiry_sitting: "Следственная комиссия"
 spec_inquiry_sitting_desc: "Комиссия заслушивает показания о деятельности наших банков и компаний."
 spec_sound_finance: "Здоровые финансы"
 spec_sound_finance_desc: "Валюта, банки и компании работают по правилам, которым доверяют инвесторы."
 spec_rentiers_cut: "Доходы рантье сокращены"
 spec_relief_thanks: "Общественные работы"
 spec_dear_money: "Дорогие деньги"
 spec_free_issue: "Свободные банки"
 spec_disclosure_burden: "Правила отчётности"
 spec_disclosure_welcomed: "Правила отчётности"
 spec_report_shelved: "Всё как прежде"
 spec_report_buried: "Доклад положен под сукно"
 spec_reform_currency_tt: "Банки дают на #v 25%#! меньше, [concept_spec_speculative_excess] растёт на #v 25%#! медленнее, а [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')] длится на #v 25%#! дольше\nВо время паники можно приостановить банковский акт"
 spec_reform_free_tt: "Банки дают на #v 25%#! больше, бумы на #v 10%#! крупнее, а их завершения отнимают на #v 10%#! больше уверенности ([concept_spec_market_confidence])"
 spec_reform_llr_tt: "#v Кредитовать банки#! стоит на #v 50%#! меньше и завершает панику на месяц раньше"
 spec_reform_company_tt: "Завершения бумов отнимают на #v 30%#! меньше уверенности ([concept_spec_market_confidence])"
 spec_reform.1.t: "Следственная комиссия"
 spec_reform.1.d_panic: "Комиссия, назначенная после паники, представила доклад в трёх томах показаний банкиров, биржевых посредников и разорившихся вкладчиков. Её члены согласны, что паника не была карой небесной. Почти во всём остальном они расходятся, и у каждого средства нашлись защитники в палате."
 spec_reform.1.d_calm: "Пока на рынках спокойно, комиссия целый год выслушивала банкиров, биржевых посредников и знатоков политической экономии о том, как не дать следующему буму закончиться разорением. В её докладе предложено несколько средств, и у каждого нашлись защитники в палате."
 spec_reform.1.f: "«В пору всеобщего смятения одно банкротство порождает множество других. Лучший способ предотвратить последующие крахи состоит в том, чтобы остановить первый, который их вызывает»."
 spec_reform.1.a: "Связать выпуск банкнот с золотом в хранилищах."
 spec_reform.1.b: "Разрешить каждому надёжному банку выпускать свои банкноты."
 spec_reform.1.c: "Назначить кредитора последней инстанции."
 spec_reform.1.d: "Обязать компании публиковать отчётность."
 spec_reform.1.e: "Поблагодарить комиссию и положить её доклад под сукно."
 spec_reform.2.t: "Здоровые финансы"
 spec_reform.2.d: "Наши банки выпускают банкноты по установленным правилам, кредитор готов прийти на помощь при панике, а компании обязаны показывать инвесторам свои владения и долги. За рубежом наши облигации теперь продаются с надбавкой, а [ROOT.GetCountry.GetCapital.GetCityHubName] слывёт тихой гаванью для капитала."
 spec_reform.2.f: "«Первый долг банкира состоит не в том, чтобы наживать деньги, а в том, чтобы их беречь»."
 spec_reform.2.a: "Доверие есть основание кредита."
