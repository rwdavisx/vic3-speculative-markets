 je_spec_depression_reason: "Паника на крупнейших биржах переросла в мировой кризис. Инвестиции и строительство замедлились, торговля сократилась, а безработные всё сильнее ропщут. [concept_spec_long_depression] завершится, когда мир восстановится, но не позднее чем через #v 5#! лет.\n\nНаши решения ускоряют восстановление нашей страны и всего мира. Наибольший вес имеют решения, которые принимают [Concept('concept_great_power','$concept_great_powers|q$')]. Когда наше восстановление завершится, [concept_spec_market_confidence] вернётся здесь раньше, чем в других странах."
