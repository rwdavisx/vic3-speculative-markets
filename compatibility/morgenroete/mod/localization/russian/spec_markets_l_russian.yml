 SPEC_RISKS_TT: "#header Риски#!\n$TOOLTIP_DELIMITER$\nЧто может снизить [concept_spec_market_confidence], если дела пойдут плохо. В отличие от факторов, этого ещё не произошло.\n\nБумы под угрозой: наши бумы завершаются ([concept_spec_boom_end])\nРиск паники: [concept_spec_financial_panic] перекидывается из связанной с нами страны ([concept_country])\nРиск войны: [concept_diplomatic_play] перерастает в войну\nРиск дефолта: наш долг достигает предела ([Concept('concept_credit','$concept_credit_limit|q$')])"
