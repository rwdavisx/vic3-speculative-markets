 concept_spec_speculative_excess: "Спекулятивный перегрев"
 concept_spec_speculative_excess_desc: "@spec_speculative_excess! #italic Это пузырь, который страна ([concept_country]) надувает на своём рынке ([concept_market]). Чем дольше бум перегрет, тем он больше.#!\n\nДо изучения технологии «[GetTechnology('stock_exchange').GetName]» пузырь не образуется.\n#P Растёт#! каждый месяц, пока [concept_spec_market_confidence] не ниже #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!, и тем быстрее, чем она выше\n#v Медленно уменьшается#!, пока она между #v 60#! и #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!\n#N Лопается#!, если она падает ниже #v 60#!\n\nКогда он лопается, $concept_spec_market_confidence$ падает ещё сильнее, вплоть до #N [GetPlayer.MakeScope.ScriptValue('spec_burst_max')|0]#!. Чем больше пузырь, тем тяжелее падение."
 concept_spec_sound_finance: "Здоровые финансы"
 concept_spec_sound_finance_desc: "@spec_sound_finance! #italic Награда за проведение всех трёх реформ ([concept_spec_banking_reforms]): правила эмиссии, кредитор последней инстанции и закон о компаниях.#!\n\nКогда у страны ([concept_country]) есть все три:\n#P +10#! [concept_prestige]\n#P 5%#! меньше процентов по займам ([concept_loans])"
 concept_spec_banking_reforms: "Банковские реформы"
 concept_spec_banking_reform: "Банковская реформа"
 concept_spec_banking_reforms_desc: "@spec_banking_reforms! #italic Правила, по которым работают банки и компании страны ([concept_country]). Каждая реформа меняет ход бумов и паник.#!\n\nКаждая реформа становится доступна с технологией. Следственная комиссия проводит одну реформу за раз. Она может заседать после события «[concept_spec_financial_panic]» или после #v 10#! спокойных лет без паники.\n\n#bold Правила эмиссии#! ([GetTechnology('banking').GetName]), выберите одно:\n#bold Денежная школа#!\n$spec_reform_currency_tt$\n#bold Свободные банки#!\n$spec_reform_free_tt$\n\n#bold Кредитор последней инстанции#! ([GetTechnology('central_banking').GetName])\n$spec_reform_llr_tt$\n\n#bold Закон о компаниях#! ([GetTechnology('joint_stock_companies').GetName])\n$spec_reform_company_tt$\n\nПроведите все три, чтобы получить [concept_spec_sound_finance]."
 alert_spec_panic_risk_alert_name: "Риск паники"
 spec_panic_risk_alert_setting_name: "Риск паники"
 alert_spec_panic_risk_alert_desc: "Если все наши бумы закончатся разом, [concept_spec_market_confidence] упадёт до #N [GetPlayer.MakeScope.ScriptValue('spec_after_collapse')|0]#!.\n[concept_spec_financial_panic] начинается ниже #v [GetPlayer.MakeScope.ScriptValue('spec_panic_at')|0]#!."
 alert_spec_panic_risk_alert_hint: "Чтобы снизить риск, сдерживайте спекуляции самыми рискованными товарами или ужесточите [concept_spec_credit_policy]. И то и другое на вкладке #bold $SPEC_FIN_TAB_BANKING$#! окна #bold $SPEC_FINANCE$#!."
 alert_spec_panic_risk_alert_action: "Журнал"
 alert_spec_bubble_alert_name: "Спекулятивный перегрев"
 spec_bubble_alert_setting_name: "Спекулятивный перегрев"
 alert_spec_bubble_alert_desc: "Наш [concept_spec_speculative_excess] составляет #v [GetPlayer.MakeScope.Var('spec_heat').GetValue|0]#!. Это и есть пузырь.\n\n#N Лопнет#!, если [concept_spec_market_confidence] упадёт ниже #v 60#!\nЕсли бы он лопнул сейчас: #N -[GetPlayer.MakeScope.ScriptValue('spec_burst_now')|0]#! к показателю «$concept_spec_market_confidence$» сразу"
 alert_spec_bubble_alert_hint: "Чтобы сдуть его мягко, сдерживайте товары в буме или ужесточите [concept_spec_credit_policy].\n#P Растёт#!, пока [concept_spec_market_confidence] не ниже #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!\n#v Медленно сдувается#!, пока она между #v 60#! и #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!"
 alert_spec_bubble_alert_action: "Журнал"
 alert_spec_rescue_alert_name: "Доступно спасение банков"
 spec_rescue_alert_setting_name: "Доступно спасение банков"
 alert_spec_rescue_alert_desc: "Идёт [concept_spec_financial_panic], а мы ещё не прокредитовали банки."
 alert_spec_rescue_alert_hint: "Используйте #v Кредитовать банки#! на вкладке #bold $SPEC_FIN_TAB_BANKING$#! окна #bold $SPEC_FINANCE$#!. Один раз за панику.\n#P Заканчивает#! панику раньше\n#P Вдвое ослабляет#! её штрафы на оставшиеся месяцы\n[concept_spec_market_confidence] #P +20#!\n\n#weak Не уменьшает выплаты ($spec_panic_relief$), не списывает [concept_spec_bad_debts] и не возвращает уже радикализованных людей#!"
 alert_spec_rescue_alert_action: "Журнал"
 alert_spec_bailout_alert_name: "Доступен выкуп плохих долгов"
 spec_bailout_alert_setting_name: "Доступен выкуп плохих долгов"
 alert_spec_bailout_alert_desc: "@spec_bad_debts! [concept_spec_bad_debts] сдерживают [concept_throughput] и инвестиции, а государство ещё не выкупило плохие займы."
 alert_spec_bailout_alert_hint: "Используйте #v Выкупить плохие долги#! на вкладке #bold $SPEC_FIN_TAB_BANKING$#! окна #bold $SPEC_FINANCE$#!. Только один раз, пока они есть.\n#P Вдвое уменьшает#! оставшиеся [concept_spec_bad_debts]\nСтоит #v @money![GetPlayer.MakeScope.ScriptValue('spec_bailout_cost')|D]#!"
 alert_spec_bailout_alert_action: "Журнал"
 spec_excess_bar_desc: "[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_has_stock_exchange'), '(CFixedPoint)0'), 'SPEC_EXCESS_ON', 'SPEC_EXCESS_OFF')]"
 SPEC_EXCESS_ON: "@spec_speculative_excess! [concept_spec_speculative_excess]: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#![SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_burst_now'), '(CFixedPoint)0'), 'SPEC_EXCESS_COST', 'SPEC_JE_NONE')]"
 SPEC_EXCESS_COST: ", падение сейчас снизит [concept_spec_market_confidence] на #N [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_burst_now')|0]#!"
