 SPEC_IL_TIER_2: "Сомнения"
 SPEC_IL_TIER_3: "Спокойствие"
 SPEC_IL_TIER_4: "Интерес"
 SPEC_IL_TIER_5: "Азарт"
 SPEC_IL_TIER_6: "Лихорадка"
 SPEC_IL_LEVEL_1_TT: "#header @spec_interest_fleeing! Отток#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_IL_LEVEL_CURRENT')]\nДействует, пока ценовой тренд ниже #v [Country.MakeScope.ScriptValue('spec_level_from_2')|=+%1]#! относительно долгосрочного среднего\nЦеновой тренд сейчас: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Эффекты:#!\n[concept_throughput] производителей: #N -10%#!\nБум уровня #v Лихорадка#!, упавший так низко, заканчивается событием «[concept_spec_collapse]»\nИнвестиции можно поощрять, если товар не восстанавливается"
 SPEC_IL_LEVEL_2_TT: "#header @spec_interest_doubtful! Сомнения#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_LEVEL_CURRENT')]\nДействует, пока ценовой тренд между #v [Country.MakeScope.ScriptValue('spec_level_from_2')|=+%1]#! и #v [Country.MakeScope.ScriptValue('spec_level_from_3')|=+%1]#! относительно долгосрочного среднего\nЦеновой тренд сейчас: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Эффекты:#!\n[concept_throughput] производителей: #N -5%#!\nПосле завершения бума восстанавливающийся товар на время удерживается на этом уровне или ниже\nИнвестиции можно поощрять, если товар не восстанавливается"
 SPEC_IL_LEVEL_3_TT: "#header @spec_interest_calm! Спокойствие#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_LEVEL_CURRENT')]\nДействует, пока ценовой тренд между #v [Country.MakeScope.ScriptValue('spec_level_from_3')|=+%1]#! и #v [Country.MakeScope.ScriptValue('spec_level_from_4')|=+%1]#! относительно долгосрочного среднего\nЦеновой тренд сейчас: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Эффекты:#!\nНет эффектов\nИнвестиции можно поощрять, если товар не восстанавливается"
 SPEC_IL_LEVEL_4_TT: "#header @spec_interest_keen! Интерес#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)4'), 'SPEC_IL_LEVEL_CURRENT')]\nДействует, пока ценовой тренд между #v [Country.MakeScope.ScriptValue('spec_level_from_4')|=+%1]#! и #v [Country.MakeScope.ScriptValue('spec_level_from_5')|=+%1]#! относительно долгосрочного среднего\nЦеновой тренд сейчас: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Эффекты:#!\n[concept_throughput] производителей: #P +3%#!\nМожет завершиться так: [concept_spec_correction]"
 SPEC_IL_LEVEL_5_TT: "#header @spec_interest_eager! Азарт#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)5'), 'SPEC_IL_LEVEL_CURRENT')]\nДействует, пока ценовой тренд между #v [Country.MakeScope.ScriptValue('spec_level_from_5')|=+%1]#! и #v [Country.MakeScope.ScriptValue('spec_level_from_6')|=+%1]#! относительно долгосрочного среднего\nЦеновой тренд сейчас: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Эффекты:#!\n[concept_throughput] производителей: #P +5%#!\n[concept_spec_market_confidence]: #P растёт#! каждый месяц, сильнее при большей доле в торговле, но не во время события «[concept_spec_financial_panic]»\nМожет завершиться так: [concept_spec_bust]\nСпекуляции можно сдерживать"
 SPEC_IL_LEVEL_6_TT: "#header @spec_interest_feverish! Лихорадка#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)6'), 'SPEC_IL_LEVEL_CURRENT')]\nДействует, пока ценовой тренд выше #v [Country.MakeScope.ScriptValue('spec_level_from_6')|=+%1]#! относительно долгосрочного среднего\nЦеновой тренд сейчас: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Эффекты:#!\n[concept_throughput] производителей: #P +8%#!\n[concept_spec_market_confidence]: #P растёт#! каждый месяц, сильнее при большей доле в торговле, но не во время события «[concept_spec_financial_panic]»\nМожет завершиться так: [concept_spec_collapse]\nСпекуляции можно сдерживать"
