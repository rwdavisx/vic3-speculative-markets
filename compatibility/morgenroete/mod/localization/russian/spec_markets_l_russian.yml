 spec_relief_when_tt: "Сейчас идёт [concept_spec_financial_panic] или [concept_spec_long_depression]"
 spec_relief_cd_tt: "Общественные работы не проводились в последние #v 12#! мес."
 spec_suspend_tt: "[concept_spec_financial_panic] завершится в течение #v 2#! мес., до тех пор в полную силу\n[concept_spec_market_confidence] повышается на #v 15#!\nНа #v 10#! лет [concept_spec_speculative_excess] нарастает на #v 50%#! быстрее\n[concept_spec_lending_standards] ослабевают, как после спасения банков"
 spec_suspend_act: "Приостановить банковский акт"
 spec_suspend_act_desc: "Позволить банку кредитовать сверх предела, который акт устанавливает для его банкнот. Паника стихает в течение нескольких месяцев без затрат для казны, но инвесторы усваивают, что правительство всегда вмешается. Считается решением #v Кредитовать банки#! для этой паники.\n\n#lore Великобритания приостанавливала свой банковский акт в 1847, 1857 и 1866 годах.#!"
 spec_relief_works_button: "Общественные работы"
 spec_relief_works_button_desc: "Оплатить общественные работы и помощь, пока длится спад: пособия, больше строительства и меньше радикалов на #v 12#! мес. Еженедельные затраты растут вместе с показателем «[concept_gdp]»."
 spec_convert_debt: "Конвертировать государственный долг"
 spec_convert_debt_desc: "Пока инвесторы полны оптимизма, заменим наши займы новыми под меньший процент. Владельцы облигаций, жившие на прежние проценты, нам спасибо не скажут."
 spec_inquiry: "Следственная комиссия"
 spec_inquiry_desc: "Назначить комиссию, которая выслушает банкиров, биржевых посредников и разорившихся вкладчиков и представит доклад о правилах работы наших банков и компаний. По её докладу будет проведена одна доступная при наших технологиях [Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')]. Заседания будут занимать внимание правительства в течение #v 6#! мес."
 spec_debt_converted: "Конвертированный долг"
 spec_debt_converted_desc: "Займы конвертированы под более низкую ставку, пока инвесторы охотно давали в долг"
 spec_relief_works: "Общественные работы"
 spec_relief_works_desc: "Общественные работы и помощь тем, кого спад лишил заработка"
 spec_relief_costs: "Расходы на общественные работы"
 spec_relief_costs_desc: "Стоимость общественных работ"
 spec_act_suspended: "Банковский акт приостановлен"
 spec_act_suspended_desc: "Правительство отступило от собственного закона, чтобы прекратить панику"
 spec_inquiry_sitting: "Следственная комиссия"
 spec_inquiry_sitting_desc: "Комиссия заслушивает показания о последней панике"
 spec_sound_finance: "Здоровые финансы"
 spec_sound_finance_desc: "Валюта, банки и компании работают по правилам, которым доверяют инвесторы"
 spec_rentiers_cut: "Доходы рантье сокращены"
 spec_relief_thanks: "Общественные работы"
 spec_dear_money: "Дорогие деньги"
 spec_free_issue: "Свободные банки"
 spec_disclosure_burden: "Правила отчётности"
 spec_disclosure_welcomed: "Правила отчётности"
 spec_reform_currency_tt: "Банки выдают на #v 25%#! меньше займов, [concept_spec_speculative_excess] накапливается на #v 25%#! медленнее, а события «[Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')]» длятся на #v 25%#! дольше\nПозволяет приостановить банковский акт во время паники"
 spec_reform_free_tt: "Банки выдают на #v 25%#! больше займов, бумы на #v 10%#! крупнее, а их завершения снижают [concept_spec_market_confidence] на #v 10%#! сильнее"
 spec_reform_llr_tt: "#v Кредитовать банки#! стоит на #v 50%#! меньше и завершает панику на месяц раньше"
 spec_reform_company_tt: "Завершения бумов отнимают на #v 30%#! меньше уверенности ([concept_spec_market_confidence])"
 spec_reform.1.t: "Следственная комиссия"
 spec_reform.1.d_panic: "Комиссия, назначенная после паники, представила доклад: три тома показаний банкиров, биржевых посредников и разорившихся вкладчиков. Её члены согласны, что паника не была карой небесной. Почти во всём остальном они расходятся, и у каждого средства нашлись защитники в палате."
 spec_reform.1.d_calm: "Пока на рынках спокойно, комиссия целый год выслушивала банкиров, биржевых посредников и знатоков политической экономии о том, как не дать следующему буму закончиться разорением. В её докладе предложено несколько средств, и у каждого нашлись защитники в палате."
 spec_reform.1.f: "«В пору всеобщего смятения одно банкротство порождает множество других. Лучший способ предотвратить последующие крахи состоит в том, чтобы остановить первый, который их вызывает»."
 spec_reform.1.a: "Связать выпуск банкнот с золотом в хранилищах."
 spec_reform.1.b: "Разрешить каждому надёжному банку выпускать свои банкноты."
 spec_reform.1.c: "Назначить кредитора последней инстанции."
 spec_reform.1.d: "Обязать компании публиковать отчётность."
 spec_reform.1.e: "Поблагодарить комиссию за труды."
 spec_reform.2.t: "Здоровые финансы"
 spec_reform.2.d: "Наши банки выпускают банкноты по установленным правилам, кредитор готов прийти на помощь при панике, а компании обязаны показывать инвесторам свои владения и долги. За рубежом наши облигации теперь продаются с надбавкой, а город [ROOT.GetCountry.GetCapital.GetCityHubName] слывёт тихой гаванью для капитала."
 spec_reform.2.f: "«Первый долг банкира состоит не в том, чтобы наживать деньги, а в том, чтобы их беречь»."
 spec_reform.2.a: "Доверие есть основание кредита."
