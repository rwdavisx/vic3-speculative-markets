 concept_spec_financial_centre: "Ведущая биржа"
 concept_spec_financial_centres: "Ведущие биржи"
 concept_spec_financial_centre_desc: "$concept_spec_financial_centres$ определяются как #v 5#! стран ([Concept('concept_country','$concept_countries|q$')]) с самыми высокими очками ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]), рейтинг обновляется каждый месяц. Очки растут с квадратным корнем из #v 6#! мес. дохода показателя «[concept_investment_pool]», а также с доверием, богатством на душу населения, финансовыми районами, компаниями, финансовыми технологиями, показателем «[concept_rank]» и экономической системой. Среднее первой тройки показано как #v 100#!.\n\nПервое место: #P +10%#! [concept_prestige], #P -10%#! к процентной ставке ([concept_loans]), #P +5#! мес. лимита кредитования\nПоследнее место (#v 5#!): #P +2%#!, #P -2%#!, #P +1#! мес.\nДля бонуса к лимиту кредитования требуется: [GetTechnology('central_banking').GetName], а также стандарты кредитования #v Надёжные#! или строже"
