 SPEC_EFFECT_LAX_VALUE: "#v [SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.2'), 'SPEC_LAXW_0', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.4'), 'SPEC_LAXW_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.6'), 'SPEC_LAXW_2', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.8'), 'SPEC_LAXW_3', 'SPEC_LAXW_4'))))]#!"
 SPEC_EFFECT_LAX_TT: "#header [concept_spec_lending_standards]#!\n$SPEC_EFFECT_LAX_VALUE$\n$TOOLTIP_DELIMITER$\nКредиты за месяц: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_credit'), '(CFixedPoint)1')|+%0]#!\nДоля кредитов в бумы: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_pull'), '(CFixedPoint)1')|+%0]#!\nСтоимость спасения банков: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_cost'), '(CFixedPoint)1')|+%0]#!\n$TOOLTIP_DELIMITER$\nБанки становятся беспечными в годы без потерь и после каждого спасения банков. Осторожность возвращается к ним только через потери: когда завершается бум и особенно когда [concept_spec_financial_panic] проходит до конца без спасения банков.\n\n#title Чтобы банки оставались осторожными:#!\n- [concept_spec_credit_policy]: вариант «Жёсткая», и банки перестанут становиться беспечнее\n- Сдерживайте бумы, пока они не закончились плохо\n- Позвольте панике пройти без спасения банков или реже приостанавливайте банковский акт\n\nУровни: #v Строгие#!, #v Осторожные#!, #v Надёжные#!, #v Слабые#!, #v Безрассудные#!"
 SPEC_TILE_CYCLE: "[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_overx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_OVER_ON', 'SPEC_GOODS_NONE')][SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_bb_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_TILE_BB_ON', 'SPEC_GOODS_NONE')]"
 SPEC_TILE_OVER_ON: "\n\n#title Перестройка:#! предложение выросло на #v [Country.MakeScope.Var(Concatenate('spec_ui_over_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! с начала этого бума\nЕсли бы его бум закончился, [concept_spec_market_confidence] упала бы #v x[Country.MakeScope.Var(Concatenate('spec_ui_overx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|2]#! сильнее"
 SPEC_TILE_BB_ON: "\n\n#title Строительство на буме:#! #P +[Country.MakeScope.Var(Concatenate('spec_ui_bb_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! к эффективности строительства для этой отрасли, пока интерес инвесторов так высок"
 SPEC_NOTE_CYCLE: "[SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)2.5'), 'SPEC_NOTE_PPL_3', SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)1.5'), 'SPEC_NOTE_PPL_2', SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)0.5'), 'SPEC_NOTE_PPL_1', 'SPEC_GOODS_NONE')))]"
 SPEC_NOTE_OVER_ON: " За время бума было построено столько, что падение оказалось тяжелее: #N x[SCOPE.GetValue('spec_note_over')|2]#!."
 SPEC_NOTE_PPL_1: " Убытки понесли рабочие, владевшие этой отраслью, а некоторые из них в областях, где она находится, перешли в разряд: [Concept('concept_radical', '$concept_radicals|q$')]."
 SPEC_NOTE_PPL_2: " Убытки понесли её владельцы, а некоторые из них в областях, где она находится, перешли в разряд: [Concept('concept_radical', '$concept_radicals|q$')]."
 SPEC_NOTE_PPL_3: " Убытки понесли её владельцы и простые вкладчики, а многие из них в областях, где она находится, перешли в разряд: [Concept('concept_radical', '$concept_radicals|q$')]."
