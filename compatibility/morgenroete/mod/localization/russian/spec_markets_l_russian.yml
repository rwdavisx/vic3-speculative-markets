 SPEC_DOWNSIDE_TT: "#header Бумы под угрозой#!\nЕсли бы наш крупнейший бум (товар: #v [Country.MakeScope.Var('spec_risk_top_good').GetGoods.GetName]#!) завершился сейчас, [concept_spec_market_confidence] снизилась бы на #N [Min_CFixedPoint(Country.MakeScope.Var('spec_risk_top').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'))|0]#!.\nБумы, которые могут завершиться: #v [Country.MakeScope.Var('spec_n_risk').GetValueWithDefault('(CFixedPoint)0')|0]#!. Они редко заканчиваются одновременно, но в таком случае уверенность упала бы до #v [Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), Country.MakeScope.Var('spec_exposure').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0')|0]#! (#v [SelectLocalization(LessThan_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), Country.MakeScope.Var('spec_exposure').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0'), '(CFixedPoint)20'),'SPEC_TIER_PANIC', SelectLocalization(And(GreaterThanOrEqualTo_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), Country.MakeScope.Var('spec_exposure').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0'), '(CFixedPoint)20'), LessThan_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), Country.MakeScope.Var('spec_exposure').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0'), '(CFixedPoint)40')),'SPEC_TIER_WARY', SelectLocalization(And(GreaterThanOrEqualTo_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), Country.MakeScope.Var('spec_exposure').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0'), '(CFixedPoint)40'), LessThan_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), Country.MakeScope.Var('spec_exposure').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0'), '(CFixedPoint)60')),'SPEC_TIER_STEADY', SelectLocalization(And(GreaterThanOrEqualTo_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), Country.MakeScope.Var('spec_exposure').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0'), '(CFixedPoint)60'), LessThan_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), Country.MakeScope.Var('spec_exposure').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0'), '(CFixedPoint)80')),'SPEC_TIER_BUOYANT', 'SPEC_TIER_MANIA'))))]#!)[AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_n_held').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_RISK_HELD_LINE')]\n$TOOLTIP_DELIMITER$\n#title По товарам:#!#indent_newline:3 $SPEC_ITEMS_RISK$#![AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_heat_collapse').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.005'), 'SPEC_RISK_SHARE')]\n\n#instruction Сдерживайте спекуляции с наиболее уязвимыми товарами или ужесточите правила: [concept_spec_credit_policy]#!"
