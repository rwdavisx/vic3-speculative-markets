 SPEC_STANCE_TIGHT_TT: "#header Жёсткое кредитование#!\nКредиты за этот месяц: #v Нет#!\n$TOOLTIP_DELIMITER$\n#italic Банки перестают кредитовать, чтобы охладить рынок.#!\n\nКаждый месяц уходит #N 10%#! нашей уверенности рынка ([concept_spec_market_confidence]) сверх #v 60#!\nРеакция инвесторов: #N -50%#!\n@intelligentsia! Интеллигенция ([concept_in_government]): #P +2#! [concept_approval]\n@industrialists! Промышленники ([concept_in_government]): #N -2#! [concept_approval]\n\n#P Меньше#! бумы, #P мягче#! крахи и паники[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-1'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-1')), Not(GetScriptedGui('spec_sgui_tight').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_TIGHT_WHY')]"
 SPEC_STANCE_NORMAL_TT: "#header Обычное кредитование#!\nКредиты за этот месяц: #v @money![Country.MakeScope.ScriptValue('spec_credit_preview')|D]#!\n$TOOLTIP_DELIMITER$\n#italic Банки кредитуют как обычно.#!\n\nБанки направляют средства в [concept_investment_pool], пока [concept_spec_market_confidence] выше #v 55#!.[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0')), Not(GetScriptedGui('spec_sgui_normal').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_NORMAL_WHY')]"
 SPEC_STANCE_LOOSE_TT: "#header Мягкое кредитование#!\nКредиты за этот месяц: #v @money![Country.MakeScope.ScriptValue('spec_credit_preview_loose')|D]#!\n$TOOLTIP_DELIMITER$\n#italic Банки свободно дают в долг, чтобы разогреть рынок.#!\n\nРеакция инвесторов на рост цен: #v +30%#!\n@industrialists! Промышленники ([concept_in_government]): #P +2#! [concept_approval]\n@intelligentsia! Интеллигенция ([concept_in_government]): #N -2#! [concept_approval]\n\n#P Крупнее#! бумы, но #N больше#! потери при их завершении[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1')), Not(GetScriptedGui('spec_sgui_loose').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_LOOSE_WHY')]"
