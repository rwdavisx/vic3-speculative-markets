 SPEC_EFFECT_EXCH_TT: "#header $SPEC_EFFECT_EXCH$#!\nСтатус ([concept_spec_exchange]): $SPEC_EFFECT_EXCH_VALUE$\n$TOOLTIP_DELIMITER$\nОчки ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]): #v [Country.MakeScope.Var('spec_centre_score').GetValueWithDefault('(CFixedPoint)0')|0]#!\nДоверие: #v $SPEC_EXCH_TRUST$#!\nУстав биржи: #v [SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_exch_known').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.5'), 'SPEC_EXCH_KNOWN_0', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_exch_known').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1.5'), 'SPEC_EXCH_KNOWN_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_exch_known').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2.5'), 'SPEC_EXCH_KNOWN_2', 'SPEC_EXCH_KNOWN_3')))]#!\n$TOOLTIP_DELIMITER$\nРеакция инвесторов на рост цен: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_hype'), '(CFixedPoint)1')|+%0]#! по сравнению с нормой (чем выше, тем быстрее растут бумы)\n[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1.5'), 'SPEC_EXCH_FX_FLIGHT', 'SPEC_EXCH_FX_FLIGHT_GP')][AddLocalizationIf(And(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.5'), Not(Country.MakeScope.Var('spec_centre_rank').IsSet)), 'SPEC_EXCH_FX_PRESTIGE')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_loss'), '(CFixedPoint)1')), 'SPEC_EXCH_FX_LOSS')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_credit'), '(CFixedPoint)1')), 'SPEC_EXCH_FX_CREDIT')]\nКолебания показателя «[concept_spec_market_mood]» от доверия: #v x[Country.MakeScope.ScriptValue('spec_exch_mood')|2]#! (ниже #v x1#! спокойнее, выше бурнее)\nВосстановление показателя «[concept_spec_market_confidence]» от довер