 notification_spec_tied_mania_desc: "Инвесторов страны [SCOPE.sC('spec_note_src').GetName] охватила [concept_spec_speculative_mania]. Если за ней последует [concept_spec_financial_panic], наши связи с этой страной приведут к тому, что упадёт и наша [concept_spec_market_confidence]."
 notification_spec_tied_mania_tooltip: "#header $notification_spec_tied_mania_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_tied_mania_desc$"
 notification_spec_feverish_name: "Инвесторов лихорадит: [SCOPE.sGoods('spec_note_good').GetName]"
 notification_spec_feverish_desc: "Товар «[SCOPE.sGoods('spec_note_good').GetName]»: [concept_spec_investor_interest] достиг уровня #v Лихорадка#!. Если он упадёт до уровня #v Отток#!, пока бум всё ещё так велик, бум завершит [concept_spec_collapse], и [concept_spec_market_confidence] резко упадёт. Бум медленно уменьшается, пока остывает, поэтому плавное охлаждение завершает его мягче, а сдерживание спекуляций сводит его на нет постепенно, как мягкую коррекцию."
 notification_spec_feverish_tooltip: "#header $notification_spec_feverish_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_feverish_desc$"
 notification_spec_near_panic_name: "Уверенность на грани паники"
 notification_spec_near_panic_desc: "@spec_market_confidence! [concept_spec_market_confidence] упала до #v [GetPlayer.MakeScope.Var('spec_conf').GetValue|0]#!. Ниже #v $SPEC_PANIC_AT$#! начинается [concept_spec_financial_panic]."
 notification_spec_near_panic_tooltip: "#header $notification_spec_near_panic_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_near_panic_desc$"
 notification_spec_nearly_broke_name: "Казна пустеет"
 notification_spec_nearly_broke_desc: "При нынешнем дефиците нас ждёт [concept_bankruptcy] через #v [GetPlayer.MakeScope.ScriptValue('spec_broke_weeks')|0]#! нед. [concept_spec_market_confidence] будет снижаться, пока бюджет не восстановится."
 notification_spec_nearly_broke_tooltip: "#header $notification_spec_nearly_broke_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_nearly_broke_desc$"
 notification_spec_panic_over_name: "Паника утихает"
 notification_spec_panic_over_desc: "[concept_spec_financial_panic] закончилась. Её штрафы и выплаты ($spec_panic_relief$) прекратились. Оставшиеся после неё [concept_spec_bad_debts] ещё замедляют производство и инвестиции, пока не исчезнут."
 notification_spec_panic_over_tooltip: "#header $notification_spec_panic_over_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_panic_over_desc$"
 notification_spec_bubble_burst_name: "Пузырь лопается"
 notification_spec_bubble_burst_desc: "@spec_market_confidence! [concept_spec_market_confidence] упала слишком низко, чтобы поддерживать наш [concept_spec_speculative_excess]. Пузырь лопнул, и $concept_spec_market_confidence$ падает ещё ниже."
 notification_spec_bubble_burst_tooltip: "#header $notification_spec_bubble_burst_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_bubble_burst_desc$"
 notification_spec_lev_unsafe_name: "Кредитное плечо превысило безопасный предел"
 notification_spec_lev_unsafe_desc: "@spec_leverage! [concept_spec_leverage] превысило #v 3#! мес., безопасный максимум. Отныне [concept_spec_financial_panic] начинается при более высоком значении показателя «[concept_spec_market_confidence]» и оставляет после себя [concept_spec_bad_debts]."
 notification_spec_lev_unsafe_tooltip: "#header $notification_spec_lev_unsafe_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_lev_unsafe_desc$"
