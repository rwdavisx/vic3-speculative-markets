 SPEC_XS_BAR_COOL: "[Country.MakeScope.Var('spec_heat').GetValueWithDefault('(CFixedPoint)0')|0], остывает. Падение стоит #N -[Country.MakeScope.ScriptValue('spec_burst_now')|0]#!"
