 SPEC_UNWIND_DESC_2: "Этот [concept_good] пережил бум, достигший уровня #v Азарт#!. Если ценовой тренд упадёт ниже #v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!, [concept_spec_investor_interest] перейдёт на уровень #v Сомнения#! и наступит [concept_spec_bust]. Затем инвесторы будут воздерживаться от вложений в течение #v 6#! мес. Со временем риск снижается."
 SPEC_UNWIND_1: "Коррекция"
