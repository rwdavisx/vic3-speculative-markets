l_russian:
 spec_confidence_bar: "Уверенность рынка"
 spec_confidence_bar_desc: "@spec_market_confidence! [concept_spec_market_confidence]: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!"
 spec_stance_current_tt: "Это не текущая [concept_spec_credit_policy]"
 spec_stance_cooldown_tt: "@spec_credit_policy! [concept_spec_credit_policy] не менялась в последние #v 6#! мес."
 spec_rescued_tt: "Пока длится эта [concept_spec_financial_panic], мы не кредитовали банки и не приостанавливали банковский акт"
 spec_credit_tight: "Жёсткое кредитование"
 spec_credit_tight_fx: "@spec_credit_policy! [concept_spec_credit_policy] меняется на вариант #v Жёсткая#!"
 spec_credit_normal_fx: "@spec_credit_policy! [concept_spec_credit_policy] меняется на вариант #v Обычная#!"
 spec_credit_loose_fx: "@spec_credit_policy! [concept_spec_credit_policy] меняется на вариант #v Мягкая#!"
 spec_credit_tight_desc: "#italic Сделать займы дорогими, чтобы охладить рынок.#!\n\n#N Банки перестают кредитовать#!\nИнвесторы слабее воодушевляются ростом цен\n#P Меньше бумы#!, мягче их завершения и слабее паники\nКаждый месяц уходит #N 10%#! уверенности ([concept_spec_market_confidence]) сверх #v 60#!\n\nБлокирует [concept_spec_credit_policy] на #v 6#! мес.\nТребуется: [GetTechnology('central_banking').GetName]\n\n@intelligentsia! Интеллигенция ([concept_in_government]): #P +2#! [concept_approval]\n@industrialists! Промышленники ([concept_in_government]): #N -2#! [concept_approval]"
 spec_credit_normal: "Обычное кредитование"
 spec_credit_normal_desc: "#italic Банки кредитуют на обычных условиях.#!\n\nОни направляют средства в [concept_investment_pool], пока [concept_spec_market_confidence] выше #v 55#!\n\nБлокирует [concept_spec_credit_policy] на #v 6#! мес.\nТребуется: [GetTechnology('central_banking').GetName]"
 spec_credit_loose: "Мягкое кредитование"
 spec_credit_loose_desc: "#italic Сделать займы дешёвыми и пустить деньги в оборот.#!\n\n#P Банки дают больше#!\nИнвесторы сильнее воодушевляются ростом цен\n#P Крупнее бумы#!, но #N больше потери#! при их завершении\n\nБлокирует [concept_spec_credit_policy] на #v 6#! мес.\nТребуется: [GetTechnology('central_banking').GetName]\n\n@industrialists! Промышленники ([concept_in_government]): #P +2#! [concept_approval]\n@intelligentsia! Интеллигенция ([concept_in_government]): #N -2#! [concept_approval]"
 spec_rescue_banks: "Кредитовать банки"
 spec_rescue_banks_desc: "#italic Влить в банки деньги из казны ([concept_treasury]), чтобы остановить панику.#!\n\nСтоимость: около #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#! от показателя «[concept_gdp]»\n#P Заканчивает#! [concept_spec_financial_panic] в течение #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#! мес.\n#P Вдвое ослабляет#! её штрафы на оставшиеся месяцы\n[concept_spec_market_confidence] растёт на #P 20#!\n\n#b Не меняется#!\nВыплаты ($spec_panic_relief$)\nЛюди, уже радикализованные в начале паники\n[concept_spec_bad_debts], которые она оставляет\n\nЧем дольше паника ещё продлится, тем дороже\nТолько один раз за событие «$concept_spec_financial_panic$»\n[GetTechnology('central_banking').GetName] делает это дешевле и быстрее"
 spec_conf_panic: "Потрясение инвесторов"
 spec_conf_panic_held: "Потрясение инвесторов"
 spec_conf_wary: "Настороженность инвесторов"
 spec_conf_steady: "Устойчивость инвесторов"
 spec_conf_buoyant: "Оптимизм инвесторов"
 spec_conf_mania: "Одержимость инвесторов"
 spec_conf_panic_desc: "Влияние показателя «[concept_spec_market_confidence]» на инвестиции и проценты по займам ([concept_loans])"
 spec_conf_panic_held_desc: "Влияние показателя «[concept_spec_market_confidence]» на инвестиции и проценты по займам ([concept_loans])"
 spec_conf_wary_desc: "Влияние показателя «[concept_spec_market_confidence]» на инвестиции и проценты по займам ([concept_loans])"
 spec_conf_steady_desc: "Влияние показателя «[concept_spec_market_confidence]» на инвестиции и проценты по займам ([concept_loans])"
 spec_conf_buoyant_desc: "Влияние показателя «[concept_spec_market_confidence]» на инвестиции и проценты по займам ([concept_loans])"
 spec_conf_mania_desc: "Влияние показателя «[concept_spec_market_confidence]» на инвестиции и проценты по займам ([concept_loans])"
 spec_panic: "Финансовая паника"
 spec_panic_desc: "Эффекты события «[concept_spec_financial_panic]» на рынке ([concept_market])"
 spec_panic_crunch: "Кредитный голод"
 spec_panic_crunch_desc: "Пока длится [concept_spec_financial_panic], банки прекратили кредитование, и [concept_private_construction] резко замедлилось"
 spec_lev_boom: "Кредитный бум"
 spec_bailout_fx_tt: "@spec_bad_debts! [concept_spec_bad_debts]: #P уменьшены вдвое#!, исчезнут через #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_months')|0]#! мес. вместо #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#!"
 spec_bailout_cost_tt: "[concept_treasury]: #N -@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_cost')|D]#!, около #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_share')|%0]#! от показателя «[concept_gdp]»"
 spec_bailout_debts_tt: "Есть [concept_spec_bad_debts], которые нужно списать"
 spec_bailed_tt: "Государство не выкупало плохие долги с тех пор, как появились эти [concept_spec_bad_debts]"
 spec_lev_boom_desc: "Заёмные деньги загружают заводы работой и дают #P +2%#! к показателю «[concept_throughput]» за каждый полный месяц показателя «[concept_spec_leverage]», вплоть до #P +24%#!"
 spec_credit_crunch: "Безнадёжные долги"
 spec_credit_crunch_desc: "Банки всё ещё подсчитывают убытки от прошлого бума. #N Они ничего не дают в долг#!, пока это не пройдёт.\n#v Кредитовать банки#! это не устраняет\n#v Выкупить плохие долги#! уменьшает это вдвое, один раз, пока эффект действует"
 spec_loose_credit: "Мягкое кредитование"
 spec_loose_credit_desc: "Эффекты показателя «[concept_spec_credit_policy]»"
 spec_tight_credit: "Жёсткое кредитование"
 spec_tight_credit_desc: "Эффекты показателя «[concept_spec_credit_policy]»"
 spec_markets.1.t: "Спекулятивная мания"
 spec_markets.1.d: "Город [ROOT.GetCountry.GetCapital.GetCityHubName] наживает состояния быстрее, чем их успевают сосчитать. Каждую неделю дорожают товары: [ROOT.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName], [ROOT.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName] и [ROOT.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]. Новые компании для их производства учреждаются едва ли не ежедневно, а банки без раздумий дают взаймы под залог их акций. Мало кто задаётся вопросом, чего всё это стоит на самом деле.\n\nНекоторые из тех, кто относится к группам $capitalists_no_icon$ и $shopkeepers_no_icon$, приписывают своё новое богатство правительству и переходят в разряд «[Concept('concept_loyalist','$concept_loyalists|q$')]». Если это продолжится, [Concept('concept_political_movement','$concept_political_movements|q$')], поддерживающие закон «[GetLawType('law_laissez_faire').GetName]», обретут новых сторонников."
 spec_markets.1.d_generic: "Город [ROOT.GetCountry.GetCapital.GetCityHubName] наживает состояния быстрее, чем их успевают сосчитать. Цены растут каждую неделю, новые компании учреждаются едва ли не ежедневно, а банки без раздумий дают взаймы под залог их акций. Мало кто задаётся вопросом, чего всё это стоит на самом деле.\n\nНекоторые из тех, кто относится к группам $capitalists_no_icon$ и $shopkeepers_no_icon$, приписывают своё новое богатство правительству и переходят в разряд «[Concept('concept_loyalist','$concept_loyalists|q$')]». Если это продолжится, [Concept('concept_political_movement','$concept_political_movements|q$')], поддерживающие закон «[GetLawType('law_laissez_faire').GetName]», обретут новых сторонников."
 spec_markets.1.f: "«Покупай, мой мальчик, и не смотри на цену. Сколько бы ты ни заплатил сегодня, завтра найдётся другой, кто даст больше»."
 spec_markets.1.a: "Процветание говорит само за себя."
 spec_markets.1.b: "Призвать к сдержанности."
 spec_markets.1.b.tt: "@spec_market_confidence! [concept_spec_market_confidence] снижается на #v 10#!"
 spec_markets.1.c: "Пусть спекулянты внесут свою долю."
 spec_markets.1.c.tt: "@spec_market_confidence! [concept_spec_market_confidence] снижается на #v 5#!"
 spec_markets.2.t: "Финансовая паника"
 spec_markets.2.d_crash: "Завершение бума ([ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName]), крупнейшего из завершившихся, переросло во всеобщую панику. Торговые дома, ссужавшие под его цену, лопаются один за другим, а вкладчики с рассвета толпятся у банков ([ROOT.GetCountry.GetCapital.GetCityHubName]). Банки требуют вернуть займы на #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#!, а инвесторы держатся за то немногое, что у них осталось. [concept_private_construction] будет сокращено вдвое на #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! мес.\n\nРазорившиеся $capitalists_no_icon$, $aristocrats_no_icon$ и $shopkeepers_no_icon$ винят правительство, а некоторые переходят в ряды: [Concept('concept_radical','$concept_radicals|q$')]. Многие теперь хотят, чтобы государство обуздало рынки, и набирают поддержку [Concept('concept_political_movement','$concept_political_movements|q$')], направленные против: [GetLawType('law_laissez_faire').GetName].[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_crash_no_loans: "Завершение бума ([ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName]), крупнейшего из завершившихся, переросло во всеобщую панику. Торговые дома, ссужавшие под его цену, лопаются один за другим, а вкладчики с рассвета толпятся у банков ([ROOT.GetCountry.GetCapital.GetCityHubName]). Инвесторы держатся за то немногое, что у них осталось. [concept_private_construction] будет сокращено вдвое на #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! мес.\n\nРазорившиеся $capitalists_no_icon$, $aristocrats_no_icon$ и $shopkeepers_no_icon$ винят правительство, а некоторые переходят в ряды: [Concept('concept_radical','$concept_radicals|q$')]. Многие теперь хотят, чтобы государство обуздало рынки, и набирают поддержку [Concept('concept_political_movement','$concept_political_movements|q$')], направленные против: [GetLawType('law_laissez_faire').GetName].[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign: "Паника из страны [ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName] перекинулась на наши рынки. Торговые дома, торговавшие или занимавшие там, лопаются один за другим, а вкладчики с рассвета толпятся у банков ([ROOT.GetCountry.GetCapital.GetCityHubName]). Банки требуют вернуть займы на #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#!, а инвесторы держатся за то немногое, что у них осталось. [concept_private_construction] будет сокращено вдвое на #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! мес.\n\nРазорившиеся $capitalists_no_icon$, $aristocrats_no_icon$ и $shopkeepers_no_icon$ винят правительство, а некоторые переходят в ряды: [Concept('concept_radical','$concept_radicals|q$')]. Многие теперь хотят, чтобы государство обуздало рынки, и набирают поддержку [Concept('concept_political_movement','$concept_political_movements|q$')], направленные против: [GetLawType('law_laissez_faire').GetName].[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign_no_loans: "Паника из страны [ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName] перекинулась на наши рынки. Торговые дома, торговавшие или занимавшие там, лопаются один за другим, а вкладчики с рассвета толпятся у банков ([ROOT.GetCountry.GetCapital.GetCityHubName]). Инвесторы держатся за то немногое, что у них осталось. [concept_private_construction] будет сокращено вдвое на #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! мес.\n\nРазорившиеся $capitalists_no_icon$, $aristocrats_no_icon$ и $shopkeepers_no_icon$ винят правительство, а некоторые переходят в ряды: [Concept('concept_radical','$concept_radicals|q$')]. Многие теперь хотят, чтобы государство обуздало рынки, и набирают поддержку [Concept('concept_political_movement','$concept_political_movements|q$')], направленные против: [GetLawType('law_laissez_faire').GetName].[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other: "Уверенность рухнула в одночасье. Надёжные фирмы не могут занять ни под какой процент, а вкладчики с рассвета толпятся у банков ([ROOT.GetCountry.GetCapital.GetCityHubName]). Банки требуют вернуть займы на #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#!, а инвесторы держатся за то немногое, что у них осталось. [concept_private_construction] будет сокращено вдвое на #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! мес.\n\nРазорившиеся $capitalists_no_icon$, $aristocrats_no_icon$ и $shopkeepers_no_icon$ винят правительство, а некоторые переходят в ряды: [Concept('concept_radical','$concept_radicals|q$')]. Многие теперь хотят, чтобы государство обуздало рынки, и набирают поддержку [Concept('concept_political_movement','$concept_political_movements|q$')], направленные против: [GetLawType('law_laissez_faire').GetName].[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other_no_loans: "Уверенность рухнула в одночасье. Надёжные фирмы не могут занять ни под какой процент, а вкладчики с рассвета толпятся у банков ([ROOT.GetCountry.GetCapital.GetCityHubName]). Инвесторы держатся за то немногое, что у них осталось. [concept_private_construction] будет сокращено вдвое на #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! мес.\n\nРазорившиеся $capitalists_no_icon$, $aristocrats_no_icon$ и $shopkeepers_no_icon$ винят правительство, а некоторые переходят в ряды: [Concept('concept_radical','$concept_radicals|q$')]. Многие теперь хотят, чтобы государство обуздало рынки, и набирают поддержку [Concept('concept_political_movement','$concept_political_movements|q$')], направленные против: [GetLawType('law_laissez_faire').GetName].[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.bad_debts: "Кредиты бума стали безнадёжными. В ближайшие месяцы [concept_spec_bad_debts] снизят [concept_throughput] на #N [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_tp_full_pct')|1]%#!, затем ослабнут и спишутся через #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#! мес. Пока они не спишутся, банки ничего не выдадут, а #v Кредитовать банки#! их не спишет."
 spec_markets.2.d_crash_bad: "$spec_markets.2.d_crash$\n\n$spec_markets.2.bad_debts$"
 spec_markets.2.d_crash_no_loans_bad: "$spec_markets.2.d_crash_no_loans$\n\n$spec_markets.2.bad_debts$"
 spec_markets.2.d_foreign_bad: "$spec_markets.2.d_foreign$\n\n$spec_markets.2.bad_debts$"
 spec_markets.2.d_foreign_no_loans_bad: "$spec_markets.2.d_foreign_no_loans$\n\n$spec_markets.2.bad_debts$"
 spec_markets.2.d_other_bad: "$spec_markets.2.d_other$\n\n$spec_markets.2.bad_debts$"
 spec_markets.2.d_other_no_loans_bad: "$spec_markets.2.d_other_no_loans$\n\n$spec_markets.2.bad_debts$"
 spec_markets.2.f: "«Вчера за мной числилось сорок тысяч. Сегодня всё моё состояние умещается в пальто, да и за него дают сущие гроши»."
 spec_markets.2.a: "Рынок должен сам нащупать дно."
 spec_markets.2.a.tt: "[concept_spec_financial_panic] пройдёт до конца, если мы позже не решим #v Кредитовать банки#!, что также отменит это изменение показателя «[concept_approval]» ($ig_industrialists$)"
 spec_markets.2.b: "Мы должны прокредитовать банки."
 spec_markets.2.b.tt: "[concept_spec_financial_panic] завершится в течение #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#! мес., а её эффекты ослабнут вдвое\n[concept_spec_market_confidence] повысится на #v 20#!"
 spec_rescue_cost_tt: "[concept_treasury]: #N -@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_cost')|D]#!, около #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#! от показателя «[concept_gdp]»"
 spec_levy_tt: "[concept_treasury]: #P +@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_speculator_tax')|D]#!, около #v 0.25%#! от показателя «[concept_gdp]»"
 spec_bank_bailout_tt: "$ig_trade_unions$ и $ig_rural_folk$, [concept_approval]: #N -2#! на #v 2.5#! лет"
