 SPEC_WAR_ROW_3_DEVASTATION: "\n[Country.MakeScope.Var('spec_war3_devastation').GetValueWithDefault('(CFixedPoint)0')|+=2] от показателя «[concept_devastation]» (#v [Country.MakeScope.Var('spec_war3_devastation_r').GetValueWithDefault('(CFixedPoint)0')|%0]#!)"
 SPEC_WAR_ROW_3_BATTLES: "\n[Country.MakeScope.Var('spec_war3_battles').GetValueWithDefault('(CFixedPoint)0')|+=2] от соотношения побед и поражений ([Concept('concept_battle','$concept_battles|q$')], #v [Country.MakeScope.Var('spec_war3_battles_r').GetValueWithDefault('(CFixedPoint)0')|%0]#!)"
 SPEC_WAR_ROW_3_HELD: "\n[Country.MakeScope.Var('spec_war3_held').GetValueWithDefault('(CFixedPoint)0')|+=2] от оккупированных вражеских земель (#v [Country.MakeScope.Var('spec_war3_held_r').GetValueWithDefault('(CFixedPoint)0')|%0]#!)"
 SPEC_WAR_ROW_3_PRESSURE: "\n[Country.MakeScope.Var('spec_war3_pressure').GetValueWithDefault('(CFixedPoint)0')|+=2] от показателя «[concept_war_pressure]» (#v [Country.MakeScope.Var('spec_war3_pressure_r').GetValueWithDefault('(CFixedPoint)0')|%0]#!)"
 SPEC_WAR_ROW_3_LAND: "\n[Country.MakeScope.Var('spec_war3_land').GetValueWithDefault('(CFixedPoint)0')|+=2] от земель, потерянных по навязанным целям ([Concept('concept_war_goal','$concept_war_goals|q$')], #v [Country.MakeScope.Var('spec_war3_land_r').GetValueWithDefault('(CFixedPoint)0')|%0]#!)"
 SPEC_WAR_ROW_3_LENGTH: "\n[Country.MakeScope.Var('spec_war3_length').GetValueWithDefault('(CFixedPoint)0')|+=2] от затяжной войны (#v [Country.MakeScope.Var('spec_war3_length_r').GetValueWithDefault('(CFixedPoint)0')|0]#! мес.)"
 SPEC_WAR_ROW_3_STALEMATE: "\n[Country.MakeScope.Var('spec_war3_stalemate').GetValueWithDefault('(CFixedPoint)0')|+=2] от тупика"
 SPEC_ITEM_WAR_MORE: "\nПрочие войны: #tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WAR_MORE_TT [Country.MakeScope.Var('spec_war_more').GetValueWithDefault('(CFixedPoint)0')|+=1]#!#!"
 SPEC_WAR_MORE_TT: "#header Прочие войны#!\n$TOOLTIP_DELIMITER$\nВсе войны сверх первых трёх, вместе взятые"
 SPEC_ITEM_TM_WARCAP: "\nПредел для всех войн: #tooltippable #tooltip:[Country.GetTooltipTag],SPEC_TM_WARCAP_TT [Country.MakeScope.Var('spec_tm_warcap').GetValueWithDefault('(CFixedPoint)0')|+=1]#!#!"
 SPEC_ITEM_TM_PLAY: "\n[concept_diplomatic_play]: #tooltippable #tooltip:[Country.GetTooltipTag],SPEC_TM_PLAY_TT [Country.MakeScope.Var('spec_tm_play').GetValueWithDefault('(CFixedPoint)0')|+=1]#!#!"
 SPEC_ITEM_TM_BROKE: "\nПустеющая казна: #tooltippable #tooltip:[Country.GetTooltipTag],SPEC_TM_BROKE_TT [Country.MakeScope.Var('spec_tm_broke').GetValueWithDefault('(CFixedPoint)0')|+=1]#!#!"
 SPEC_ITEM_TM_DEFAULT: "\n[concept_default]: #tooltippable #tooltip:[Country.GetTooltipTag],SPEC_TM_DEFAULT_TT [Country.MakeScope.Var('spec_tm_default').GetValueWithDefault('(CFixedPoint)0')|+=1]#!#!"
 SPEC_ITEM_TM_REVOLUTION: "\n[concept_revolution]: #tooltippable #tooltip:[Country.GetTooltipTag],SPEC_TM_REVOLUTION_TT [Country.MakeScope.Var('spec_tm_revolution').GetValueWithDefault('(CFixedPoint)0')|+=1]#!#!"
 SPEC_TM_WARCAP_TT: "#header Предел для всех войн: [Country.MakeScope.Var('spec_tm_warcap').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_war_sum').GetValueWithDefault('(CFixedPoint)0')|+=2] от всех наших войн вместе\nНе более чем от #N -4#! до #P +0.5#! в месяц"
 SPEC_TM_PLAY_TT: "#header [concept_diplomatic_play]: [Country.MakeScope.Var('spec_tm_play').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#N -0.5#! за участие в событии «[concept_diplomatic_play]»\n$TOOLTIP_DELIMITER$\n#weak Считается один раз, сколько бы их ни было, пока не начнётся [concept_war]#!"
 SPEC_TM_BROKE_TT: "#header Пустеющая казна: [Country.MakeScope.Var('spec_tm_broke').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#v [Country.MakeScope.ScriptValue('spec_broke_weeks')|0]#! нед. до события «[concept_bankruptcy]», если мы продолжим терять деньги так же\n$TOOLTIP_DELIMITER$\n#weak Начинается за #v 20#! нед. до события «$concept_bankruptcy$» и растёт до #N -3#! по мере того, как пустеет [concept_treasury]#!"
 SPEC_TM_DEFAULT_TT: "#header [concept_default]: [Country.MakeScope.Var('spec_tm_default').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#N -5#! за состояние «[concept_default]»"
 SPEC_TM_REVOLUTION_TT: "#header [concept_revolution]: [Country.MakeScope.Var('spec_tm_revolution').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#N -2#! за событие «[concept_revolution]»"
 concept_spec_market_confidence: "Уверенность рынка"
 concept_spec_market_confidence_desc: "@spec_market_confidence! #italic Как инвесторы оценивают рынок ([concept_market]) вашей страны ([concept_country]), от #v 0#! (#v Паника#!) до #v 100#! (#v Мания#!).#!\n\nСтрах #N замедляет инвестиции#! и делает займы ([concept_loans]) дороже\nЖадность #P ускоряет инвестиции#!\n\n#P Растёт#! при бумах ([Concept('concept_good','$concept_goods|q$')])\n#N Падает#! из-за: [Concept('concept_spec_boom_end','$concept_spec_boom_ends|q$')], [Concept('concept_spec_foreign_panic','$concept_spec_foreign_panics|q$')], [Concept('concept_diplomatic_play','$concept_diplomatic_plays|q$')] и [concept_war]\nБумы и их завершения сильнее там, где большую часть экономики составляет группа «$building_financial_district$», и слабее там, где больше представителей группы «$building_manor_house$»\n\nВыше #v 55#! банки направляют средства в [concept_investment_pool]\nПри #v 80#! или выше наступает [concept_spec_speculative_mania]\nНиже #v 25#! начинается [concept_spec_financial_panic]\nВысокий показатель «[concept_spec_leverage]» поднимает этот порог\nМалое число представителей группы «$building_financial_district$» немного его снижает"
 concept_spec_speculative_mania: "Спекулятивная мания"
 concept_spec_speculative_mania_desc: "@spec_speculative_mania! #italic Ваш рынок ([concept_market]) обезумел от жадности.#!\n\nДлится, пока [concept_spec_market_confidence] не ниже #v 80#!\n#P Банки направляют максимум средств#! в [concept_investment_pool]\n#N Каждое событие «[concept_spec_boom_end]» сильнее снижает#! показатель «$concept_spec_market_confidence$»\n\nДолгая или очень сильная мания на несколько лет помогает [Concept('concept_political_movement','$concept_political_movements|q$')], выступающим за закон «[GetLawType('law_laissez_faire').GetName]»"
 concept_spec_financial_panic: "Финансовая паника"
 concept_spec_financial_panics: "Финансовые паники"
 concept_spec_financial_panic_desc: "@spec_financial_panic! #italic Крах, когда инвесторы бегут, а банки забирают свои деньги.#!\n\nНачинается, когда [concept_spec_market_confidence] падает ниже #v 25#!. Когда [concept_spec_leverage] превышает #v 3#! мес., этот порог растёт, до #v 65#!. Если представителей группы «$building_financial_district$» мало, он ниже, вплоть до #v 20#!.\n\nПока она длится:\n#N Ниже#! [concept_throughput] во всех зданиях и меньше собранных налогов\n#N Еженедельно расходует#! казну ([concept_treasury]) на помощь безработным\n#N Замедляет#! [concept_private_construction] и инвестиции\n#N Меньше#! бонус ($concept_throughput$), который получают [Concept('concept_company','$concept_companies|q$')]\n#N Часть инвесторов переходит#! в ряды: [Concept('concept_radical','$concept_radicals|q$')]\n#N Банки изымают#! [concept_spec_outstanding_credit] из пула ([concept_investment_pool])\n\nОна распространяется на каждую связанную страну ([concept_country]) как [concept_spec_foreign_panic], а деньги бегут в спокойные страны ([Concept('concept_great_power','$concept_great_powers|q$')])\nПотом несколько лет набирают поддержку [Concept('concept_political_movement','$concept_political_movements|q$')], направленные против: [GetLawType('law_laissez_faire').GetName]"
 concept_spec_foreign_panic: "Зарубежная паника"
 concept_spec_foreign_panics: "Зарубежная паника"
 concept_spec_foreign_panic_desc: "@spec_foreign_panic! #italic Паника за рубежом, перекидывающаяся на ваш рынок.#!\n\nКогда [concept_spec_financial_panic] начинается в стране ([concept_country]), связанной с вашей, ваша [concept_spec_market_confidence] #N падает#!\nСтраны связывают общий [concept_market], подчинение одной другой, права на инвестиции, обширная торговля или владение частью вашей экономики\n#N Чем теснее связи, тем сильнее падение#!\n\nЗакон «[GetLawType('law_free_trade').GetName]» усиливает торговые связи\nПрочая торговая политика ослабляет их\n[concept_embargo] обрывает торговую связь"
 concept_spec_boom_end: "Завершение бума"
 concept_spec_boom_ends: "Завершения бумов"
 concept_spec_boom_end_desc: "@spec_boom_end! #italic Что поднялось, то опустится. Бум завершается, когда [concept_spec_investor_interest] к товару ([concept_good]) после подъёма снова падает.#!\n\nЧем выше он поднялся, тем сильнее падение:\nПик на уровне #v Интерес#!: [concept_spec_correction]\nПик на уровне #v Азарт#!: [concept_spec_bust]\nПик на уровне #v Лихорадка#!: [concept_spec_collapse]\n\n#N Снижает#! [concept_spec_market_confidence], сильнее для крупных бумов и для товаров ($concept_goods$) с большей долей в торговле рынка ([concept_market])\nЗатем инвесторы воздерживаются, пока $concept_good$ восстанавливается\nЕсли его производит [concept_company], эта отрасль #N теряет#! [concept_throughput]\n\n#instruction Пик понемногу снижается каждый месяц. Медленно остывающий бум завершается мягче или вовсе обходится без события «$concept_spec_boom_end$».#!"
 concept_spec_correction: "Коррекция"
 concept_spec_correction_desc: "@spec_correction! #italic $concept_spec_correction$ означает самое мягкое [concept_spec_boom_end].#!\n\nПроисходит, когда [concept_spec_investor_interest] к товару ([concept_good]) с пиком #v Интерес#! падает до уровня #v Сомнения#!\n\n#N Снижает#! [concept_spec_market_confidence] незначительно\nИнвесторы избегают товара ($concept_good$) #v 3#! мес.\nЕсли его производит [concept_company], эта отрасль теряет #N 2.5%#! [concept_throughput] на #v 90#! дн. и ещё #N 25%#! за каждую изученную технологию: [GetTechnology('corporate_charters').GetName] и [GetTechnology('corporate_management').GetName]"
 concept_spec_bust: "Спад"
 concept_spec_bust_desc: "@spec_bust! #italic $concept_spec_bust$ означает более тяжёлое [concept_spec_boom_end], чем [concept_spec_correction].#!\n\nПроисходит, когда [concept_spec_investor_interest] к товару ([concept_good]) с пиком #v Азарт#! падает до уровня #v Сомнения#!\n\n#N Снижает#! [concept_spec_market_confidence] сильнее, примерно в #v 2#! раз больше, чем $concept_spec_correction$ после того же бума\nИнвесторы избегают товара ($concept_good$) #v 6#! мес.\nЕсли его производит [concept_company], эта отрасль теряет #N 5%#! [concept_throughput] на #v 180#! дн. и ещё #N 25%#! за каждую изученную технологию: [GetTechnology('corporate_charters').GetName] и [GetTechnology('corporate_management').GetName]"
 concept_spec_collapse: "Крах"
 concept_spec_collapse_desc: "@spec_collapse! #italic $concept_spec_collapse$ означает самое тяжёлое [concept_spec_boom_end].#!\n\nПроисходит, когда [concept_spec_investor_interest] к товару ([concept_good]) с пиком #v Лихорадка#! падает до уровня #v Отток#!\n\n#N Резко снижает#! [concept_spec_market_confidence], примерно в #v 5#! раз больше, чем [concept_spec_correction] после того же бума\nИнвесторы избегают товара ($concept_good$) #v 12#! мес.\nЕсли его производит [concept_company], эта отрасль теряет #N 10%#! [concept_throughput] на год и ещё #N 25%#! за каждую изученную технологию: [GetTechnology('corporate_charters').GetName] и [GetTechnology('corporate_management').GetName]\n\nХуже всего то, что $concept_spec_collapse$ в значительной части торговли рынка ([concept_market]) может вызвать [concept_spec_financial_panic]"
 concept_spec_investor_interest: "Интерес инвесторов"
 concept_spec_investor_interest_desc: "@spec_investor_interest! #italic Насколько привлекательны для инвесторов [Concept('concept_building','$concept_buildings|q$')], производящие товар ([concept_good]), от #v Отток#! до #v Лихорадка#!.#!\n\n#P Растёт#!, пока [concept_market_price] выше долгосрочного среднего\n#N Падает#!, пока она ниже\n\n[concept_throughput] этих зданий следует за ним, от #N -10%#! при #v Отток#! до #P +8%#! при #v Лихорадка#!\nТак же меняется [concept_prosperity] ([Concept('concept_company','$concept_companies|q$')], производящие $concept_good$)\nБум ($concept_good$) повышает [concept_spec_market_confidence]\nКогда интерес падает, бум завершается событием «[concept_spec_boom_end]»"
 concept_spec_credit_policy: "Кредитная политика"
 concept_spec_credit_policy_tight: "Жёсткое кредитование"
 concept_spec_credit_policy_normal: "Обычное кредитование"
 concept_spec_credit_policy_loose: "Мягкое кредитование"
 concept_spec_credit_policy_desc: "@spec_credit_policy! #italic Насколько свободно банки направляют средства в [concept_investment_pool].#!\n\nОткрывается: [GetTechnology('central_banking').GetName]\nВарианты: «$concept_spec_credit_policy_tight$», «$concept_spec_credit_policy_normal$» или «$concept_spec_credit_policy_loose$»\n\n#v Более жёсткий#! кредит замедляет инвестиции и тянет [concept_spec_market_confidence] вниз, когда она высока\n#v Более мягкий#! кредит увеличивает [concept_spec_outstanding_credit]\n\nПосле изменения политика блокируется на #v 6#! мес."
 concept_spec_leverage: "Кредитное плечо"
 concept_spec_leverage_desc: "@spec_leverage! #italic Сколько дали в долг ваши банки. Это ваш показатель «[concept_spec_outstanding_credit]» в месяцах дохода пула ([concept_investment_pool]).#!\n\n#P +2%#! [concept_throughput] за каждый полный месяц, до #P +24%#!\nБонус угасает во время события «[concept_spec_financial_panic]» и пока остаются [concept_spec_bad_debts]\n\nСвыше #v 3#! мес. становится рискованно:\n#N $concept_spec_financial_panic$ начинается раньше#!, при более высоком значении показателя «[concept_spec_market_confidence]»\n#N Она оставляет после себя $concept_spec_bad_debts$#!"
 concept_spec_bad_debts: "Безнадёжные долги"
 concept_spec_bad_debts_desc: "@spec_bad_debts! #italic Потери, которые [concept_spec_financial_panic] оставляет в книгах ваших банков.#!\n\nРастут с показателем «[concept_spec_leverage]» свыше #v 3#! мес.\n\nКаждое очко: #N -0.4%#! к показателю «[concept_throughput]» и #N -0.75%#! к инвестициям\nНесколько месяцев нарастают, затем медленно уменьшаются\nВ худшем случае списываются примерно за #v 6#! лет\n#N Банки не кредитуют#!, пока они остаются\n\n#v Кредитовать банки#! их не списывает\n#v Выкупить плохие долги#! уменьшает их вдвое, один раз, пока они есть"
 concept_spec_lending_standards: "Стандарты кредитования"
 concept_spec_lending_standards_desc: "@spec_lending_standards! #italic Насколько осторожно кредитуют банки вашей страны ([concept_country]): #v Строгие#!, #v Осторожные#!, #v Надёжные#!, #v Слабые#! или #v Безрассудные#!.#!\n\nБолее беспечные банки направляют больше средств в [concept_investment_pool] и вкладывают больше в бумы\n#N Поэтому бумы завершаются тяжелее#!, а спасение банков обходится дороже\n\n#N Слабеют#! понемногу в каждый месяц без события «[concept_spec_financial_panic]», от #v Строгие#! до #v Безрассудные#! примерно за #v 20#! спокойных лет\n#N Слабеют ещё сильнее#! после каждого спасения банков или решения #v Выкупить плохие долги#!\n#P Ужесточаются#! при завершении бума, сильнее всего, когда $concept_spec_financial_panic$ проходит до конца без спасения банков"
 concept_spec_blue_chip: "Голубая фишка"
 concept_spec_blue_chips: "Голубые фишки"
 concept_spec_blue_chip_desc: "@spec_blue_chip! #italic Звёздная компания ([concept_company]), удерживающая не менее #v 70#! ([concept_prosperity]) #v 12#! мес. подряд.#!\n\nКаждая добавляет #v 2#! к показателю «[concept_spec_company_strength]»\n#b Каждая#! #grey (первые 5 полностью, следующие 5 вдвое меньше)#!\n[concept_spec_market_confidence], теряемая при крахах и паниках: #P -4%#!\nДоверие к бирже ([concept_spec_exchange]): #P +0.4%#! полной шкалы в год\nСостязания бирж ([concept_spec_exchange]): #P +3%#! в нашу пользу\nВклад капиталистов в [concept_investment_pool]: #P +0.6%#!\nПроценты по займам: #P -1%#!\n\n#b Если мы теряем одну#!\nЭто происходит после #v 3#! мес. подряд ниже #v 70#! ([concept_prosperity])\nДоверие к бирже ([concept_spec_exchange]): #N -1.7%#! полной шкалы\n[concept_spec_market_confidence]: #N -3#!\nМедвежий налёт на нас делает одну из них #N уязвимой#! на год. Тогда она теряет статус после одного месяца ниже #v 70#! ([concept_prosperity]), а не #v 3#!\n\n#b Компания года#!\nЕсли наша компания самая процветающая в мире, доверие к бирже ([concept_spec_exchange]) #P +2.5%#! полной шкалы и [concept_prestige] #P +5%#! на год\n\n#N Теряется#! после #v 3#! мес. подряд ниже #v 70#!, и затем отсчёт #v 12#! мес. начинается заново\nОдин месяц ниже сбрасывает путь к статусу\nСтрана ([concept_country]), покинувшая рыночную экономику, не сохраняет ни одной"
 concept_spec_company_strength: "Мощь компаний"
 concept_spec_company_strength_desc: "@spec_company_strength! #italic Насколько сильна страна ([concept_country]) по всем своим компаниям вместе ([Concept('concept_company','$concept_companies|q$')]).#!\n\nКаждая компания добавляет свой уровень «[concept_prosperity]», делённый на #v 20#!, так что компания с #v 100#! добавляет #v 5#!\nКаждая голубая фишка ([concept_spec_blue_chip]) добавляет ещё #v 2#!\nСильнейшая страна получает почётное звание «Дом великих компаний»"
 concept_spec_outstanding_credit: "Непогашенный кредит"
 concept_spec_outstanding_credit_desc: "@spec_outstanding_credit! #italic Деньги, которые банки направили в [concept_investment_pool] и ещё не вернули.#!\n\nБанки кредитуют, пока [concept_spec_market_confidence] выше #v 55#!\nОни останавливаются на лимите кредитования в #v 3#! мес. дохода пула\n[GetTechnology('central_banking').GetName] добавляет #v 5#! мес.\n[GetTechnology('investment_banks').GetName] и [GetTechnology('international_exchange_standards').GetName] добавляют по #v 2#!\n\nНебольшая часть ежемесячно погашается из пула\nКогда начинается [concept_spec_financial_panic], банки #N изымают часть кредитов#!\n\n#lore В сороковые годы XIX века банки давали кредиты под залог железнодорожных акций, в 1837 году под хлопок, а в 1873 году под строительные участки в Вене, и попадались, когда эти бумы лопались.#!"
