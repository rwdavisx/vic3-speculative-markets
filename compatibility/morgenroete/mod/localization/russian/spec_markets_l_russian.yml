 SPEC_WHY_COND: "#header [concept_spec_market_conditions]: x[Country.MakeScope.ScriptValue('spec_crash_scale')|2]#!\n$TOOLTIP_DELIMITER$\n#v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), '(CFixedPoint)55')|2]#! от показателя «[concept_spec_market_confidence]» (#v [Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55')|0]#!)[AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_depth'), '(CFixedPoint)1')), 'SPEC_WHY_COND_DEPTH')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_steady'), '(CFixedPoint)1')), 'SPEC_WHY_COND_STEADY')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_fin_risk'), '(CFixedPoint)1')), 'SPEC_WHY_COND_FIN')]\n$TOOLTIP_DELIMITER$\nМасштабирует потерю показателя «[concept_spec_market_confidence]» при событии «[concept_spec_boom_end]». Чем выше $concept_spec_market_confidence$, тем больше потеря. При #v 55#! эффекта нет."
