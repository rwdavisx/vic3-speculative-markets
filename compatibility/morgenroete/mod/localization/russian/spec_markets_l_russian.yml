 SPEC_DRIVER_RESTRAIN_TT: "#header Сдерживаемые бумы: [Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] от бумов, которые сдуваются в этом месяце\n#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#! от фактора «[concept_spec_market_conditions]»\n$TOOLTIP_DELIMITER$\nСдерживаемый бум сдувается постепенно, и наступает [concept_spec_correction], а не один обвал. Это немного стоит каждый месяц."
 SPEC_DRIVER_CAUTION_TT: "#header Правительство и события: [Country.MakeScope.Var('spec_c_caution').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\nЕдиновременное изменение в этом месяце из-за наших решений и рыночных событий."
 SPEC_DRIVER_LIMIT_TT: "#header Нижний и верхний пределы: [Country.MakeScope.Var('spec_c_limit').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_market_confidence] не может опуститься ниже #v 0#! или подняться выше #v 100#!, поэтому часть изменения этого месяца не учтена."
 SPEC_DRIVER_RESCUE_TT: "#header Спасение банков: [Country.MakeScope.Var('spec_c_rescue').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\nРазовый рост от решения #v Кредитовать банки#! или #v Приостановить банковский акт#!. Он не может поднять [concept_spec_market_confidence] выше #v 100#!."
 SPEC_DRIVER_RESCUE: "Спасение банков"
 SPEC_DRIVER_WAREND: "Конец войны"
 SPEC_DRIVER_WAREND_TT: "#header Конец войны: [Country.MakeScope.Var('spec_c_warend').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#v x[Country.MakeScope.Var('spec_war_stakes_now').GetValueWithDefault('(CFixedPoint)0')|%0]#! от полного эффекта, по нашим потерям ([concept_casualties])\n$TOOLTIP_DELIMITER$\nПолный эффект в зависимости от исхода войны:\nПобеда с навязанной целью ([concept_war_goal]): #P +4#!\nПобеда без навязанных целей: #P +1#!\nПоражение с навязанной нам целью ([concept_war_goal]): #N -8#!\nПоражение без навязанных целей: #N -2#!\nНичья: #N -1#!\n\nЗависит от наших потерь: не менее #v 25%#! эффекта, а весь эффект, если война унесла #v 25%#! наших сил."
 SPEC_DRIVER_BURST: "Лопнувшие пузыри"
 SPEC_DRIVER_BURST_TT: "#header Лопнувшие пузыри: [Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0'), Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_burst_per_heat'), '(CFixedPoint)-1'))|0]#! от фактора «[concept_spec_speculative_excess]»\n#N -[Country.MakeScope.ScriptValue('spec_burst_per_heat')|2]#! за каждый пункт\nОграничено значением #N -[Country.MakeScope.ScriptValue('spec_burst_max')|0]#!\n$TOOLTIP_DELIMITER$\nПузырь лопается, когда [concept_spec_market_confidence] падает ниже #v 60#! после бума, поднявшего её выше #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#!. Чем дольше и выше шёл бум, тем больше потеря.\n\nПузыри образуются только в стране, где есть [GetTechnology('stock_exchange').GetName]."
 SPEC_DRIVER_CAUTION: "Правительство и события"
 SPEC_DRIVER_RESTRAIN: "Сдерживаемые бумы"
 SPEC_DRIVER_LIMIT: "Нижний и верхний пределы"
 SPEC_DRIVER_BOOM: "Товарные бумы"
 SPEC_DRIVER_BOOM_TT: "#header Товарные бумы: [Country.MakeScope.Var('spec_c_boom').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] от фактора «[Concept('concept_good','$concept_goods|q$')] в буме»: #v [Country.MakeScope.Var('spec_n_boom').GetValueWithDefault('(CFixedPoint)0')|0]#![AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_BOOM_CAP')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_steady'), '(CFixedPoint)1')), 'SPEC_BOOM_STEADY')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_fin_boom'), '(CFixedPoint)1')), 'SPEC_BOOM_FIN')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_boom_rule'), '(CFixedPoint)1')), 'SPEC_BOOM_RULE')]\n$TOOLTIP_DELIMITER$\nКаждый бум повышает [concept_spec_market_confidence] тем сильнее, чем больше его доля в торговле, которую ведёт [concept_market]. Не действует, пока длится [concept_spec_financial_panic]. [GetTechnology('stock_exchange').GetName] и [GetTechnology('investment_banks').GetName] увеличивают масштаб бумов, как и [GetTechnology('modern_financial_instruments').GetName]."
 SPEC_BOOM_CAP: "\nОграничено значением #v +3#! до применения множителей"
 SPEC_BOOM_STEADY: "\n#v x[Country.MakeScope.ScriptValue('spec_steady')|2]#! от усадеб"
 SPEC_BOOM_FIN: "\n#v x[Country.MakeScope.ScriptValue('spec_fin_boom')|2]#! от финансовых технологий"
 SPEC_BOOM_RULE: "\n#v x[Country.MakeScope.ScriptValue('spec_boom_rule')|2]#! от волатильности рынка"
 SPEC_DRIVER_CRASH: "Завершённые бумы"
 SPEC_DRIVER_CRASH_TT: "#header Завершённые бумы:[Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\nКрупнейший за последний месяц: #v [Country.MakeScope.Var('spec_crashed').GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] от размера завершившихся бумов\n#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#! от фактора «[concept_spec_market_conditions]»[AddLocalizationIf(Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-40')), 'SPEC_CRASH_CAP')]\n$TOOLTIP_DELIMITER$\nКаждое событие «[concept_spec_boom_end]» снижает [concept_spec_market_confidence]. Чем крупнее бум и его доля в торговле ([concept_market]), тем больше потеря. Смягчает: [GetTechnology('mutual_funds').GetName]; усиливает: [GetTechnology('modern_financial_instruments').GetName]."
 SPEC_CRASH_CAP: "\nОграничено значением #N -40#! в месяц"
 SPEC_DRIVER_FOREIGN: "Зарубежная паника"
 SPEC_FOREIGN_HIT: "\n#N -20#! от фактора «[concept_spec_foreign_panic]»\n#v x[Country.MakeScope.Var('spec_fh_size').GetValueWithDefault('(CFixedPoint)0')|2]#! от соотношения их экономики и нашей\n#v x[Country.MakeScope.Var('spec_fh_tie').GetValueWithDefault('(CFixedPoint)0')|2]#! от фактора «[concept_spec_market_tie]»\n#v x[Country.MakeScope.Var('spec_fh_reach').GetValueWithDefault('(CFixedPoint)0')|2]#! от их показателя «[concept_rank]»[AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_foreign_loss_mult'), '(CFixedPoint)1')), 'SPEC_FOREIGN_UNSTD')]"
 SPEC_FOREIGN_UNSTD: "\n#v x[Country.MakeScope.ScriptValue('spec_foreign_loss_mult')|2]#! из-за отсутствия: «[GetTechnology('currency_standards').GetName]»"
 SPEC_FOREIGN_FLIGHT: "\n[Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')|+=2] от фактора «[concept_spec_capital_flight]»"
 SPEC_DRIVER_FOREIGN_TT: "#header Зарубежная паника: [Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\nПоследний случай: #v [Country.MakeScope.Var('spec_foreign_src').GetCountry.GetName]#!\n$TOOLTIP_DELIMITER$[AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_HIT')][AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_FLIGHT')]\n$TOOLTIP_DELIMITER$\nОбщий [concept_market]: #v [Country.MakeScope.ScriptValue('spec_tie_market')|%0]#!\nПодчинённая страна или сюзерен: #v 80%#!\nПрава на иностранные инвестиции: #v [Country.MakeScope.ScriptValue('spec_tie_investment')|%0]#!\nАктивная торговля между рынками: #v [Country.MakeScope.ScriptValue('spec_tie_trade')|%0]#!\nИностранные владельцы нашей экономики: до #v 90%#!\n\nЕсли в связанной с нашей стране ([concept_country]) начинается [concept_spec_financial_panic], здесь снижается [concept_spec_market_confidence], и тем сильнее, чем теснее [concept_spec_market_tie] и чем больше их экономика по сравнению с нашей. [concept_great_power] передаёт дальше весь ущерб, крупная держава половину, малые страны немного. Паника, занесённая из-за рубежа, дальше не распространяется. Без «[GetTechnology('currency_standards').GetName]» потеря на четверть больше."
 SPEC_DRIVER_TURMOIL: "Война и беспорядки"
 SPEC_DRIVER_TURMOIL_TT: "#header Война и беспорядки: [Country.MakeScope.Var('spec_c_turmoil').GetValueWithDefault('(CFixedPoint)0')|+=2]#!$SPEC_ITEMS_TURMOIL$\n$TOOLTIP_DELIMITER$\nКаждая [concept_war] (фактор «[concept_spec_war_news]»): от #N -3#! до #P +0.15#! в месяц\nВсе войны вместе: от #N -4#! до #P +0.5#! в месяц\n[concept_diplomatic_play] без войны: #N -0.5#! в месяц\nПустеющая казна: до #N -3#! в месяц, за #v 20#! нед. до события «[concept_bankruptcy]»\n[concept_default]: #N -5#! в месяц\n[concept_revolution]: #N -2#! в месяц\n\nНаведите курсор на число, чтобы увидеть причину."
 SPEC_DRIVER_MOOD: "Настроение рынка"
 SPEC_DRIVER_MOOD_TT: "#header Настроение рынка: [Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0')|+=2] от сдвига этого месяца\n[Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0'))|+=2] от настроения прошлого месяца\n$TOOLTIP_DELIMITER$\n[concept_spec_market_mood] случайно сдвигается каждый месяц, не более чем на #v 0.75#! в любую сторону, и #v 75%#! сдвига переходит на следующий месяц."
 SPEC_DRIVER_DRIFT: "Возврат к норме"
 SPEC_DRIVER_DRIFT_TT: "#header Возврат к норме: [Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0'), Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100'))|+=1] от расстояния до значения «[concept_spec_baseline]» (#v 55#!)\n#v x[Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100')|%1]#! восстанавливается каждый месяц\n$TOOLTIP_DELIMITER$\nДостижение «[GetTechnology('macroeconomics').GetName]» ускоряет это наполовину."
 SPEC_DRIVER_TIGHT: "Жёсткое кредитование"
 SPEC_DRIVER_GROWTH: "Рост"
 SPEC_DRIVER_GROWTH_TT: "#header Рост: [Country.MakeScope.Var('spec_c_growth').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#v [Country.MakeScope.Var('spec_growth').GetValueWithDefault('(CFixedPoint)0')|=+%1]#! от показателя «[concept_gdp]» по сравнению со средним за недавнее время\n#v -2%#! от нормального роста\n$TOOLTIP_DELIMITER$\nКаждые #v 1%#! роста выше или ниже нормы меняют [concept_spec_market_confidence] на #v 0.1#! в месяц, но не более чем на #v 0.6#! в любую сторону."
 SPEC_DRIVER_BUSINESS: "Настроение промышленников"
 SPEC_DRIVER_BUSINESS_TT: "#header Настроение промышленников: [Country.MakeScope.Var('spec_c_business').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[concept_approval] промышленников: #v [Country.MakeScope.ScriptValue('spec_ind_approval')|0]#!\n\nЛояльные (#v 10#! и выше): #P +0.4#! в месяц\nДовольные (#v 5#! и выше): #P +0.2#! в месяц\nНедовольные (#v -5#! и ниже): #N -0.2#! в месяц\nВозмущённые (#v -10#! и ниже): #N -0.4#! в месяц"
 SPEC_DRIVER_TIGHT_TT: "#header Жёсткое кредитование: [Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\nУровень [concept_spec_market_confidence] выше #v 60#!: #v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.1')|1]#!\n#N -10%#! от него каждый месяц, от фактора «[Concept('concept_spec_credit_policy','$concept_spec_credit_policy_tight|q$')]»\n$TOOLTIP_DELIMITER$\nБум остывает в течение месяцев, а не сразу."
 concept_spec_market_conditions: "Рыночные условия"
 concept_spec_market_conditions_desc: "$concept_spec_market_conditions$ определяют, насколько [concept_spec_boom_end] снижает [concept_spec_market_confidence]. Чем выше $concept_spec_market_confidence$ в момент завершения бума, тем больше потеря. При значении #v 55#! ($concept_spec_market_confidence$) они не действуют. На них также влияют финансовые районы, усадьбы и финансовые технологии."
 concept_spec_baseline: "Базовая уверенность"
 concept_spec_baseline_desc: "$concept_spec_baseline$ равна #v 55#!. Предоставленная самой себе, [concept_spec_market_confidence] возвращается к этому уровню сверху или снизу, и чем дальше она ушла, тем быстрее возвращается."
 concept_spec_market_mood: "Настроение рынка"
 concept_spec_market_mood_desc: "$concept_spec_market_mood$ складывается из колебаний настроений инвесторов, не имеющих единой причины. Каждый месяц оно случайно сдвигается не более чем на #v 0.75#! в любую сторону, и #v 75%#! сдвига переходит на следующий месяц, поэтому хорошие и плохие периоды держатся какое-то время, а потом затихают."
 concept_spec_market_tie: "Рыночная связь"
 concept_spec_market_tie_desc: "$concept_spec_market_tie$ показывает, насколько тесно одна страна ([concept_country]) следует за другой на уровне рынка ([concept_market]). От неё зависит, насколько сильно [concept_spec_financial_panic] передаётся между ними.\n\nВладение учитывается, когда страна владеет #v 10%#! экономики другой ([concept_gdp]), и достигает максимума при #v 30%#!. [GetLawType('law_free_trade').GetName] усиливает торговую связь, а другие торговые политики ослабляют её. [GetTechnology('international_exchange_standards').GetName] усиливает рыночные и инвестиционные связи. [concept_embargo] разрывает торговую связь."
 concept_spec_capital_flight: "Бегство капитала"
 concept_spec_capital_flight_desc: "Когда начинается [concept_spec_financial_panic], деньги бегут в безопасное место. Каждая [concept_great_power] и каждая страна ([concept_country]), чья биржа ([concept_spec_exchange]) имеет статус #v Международная#! или выше, получает до #P +[GetPlayer.MakeScope.ScriptValue('spec_flight_gain_max')|0]#! к показателю «[concept_spec_market_confidence]», если живёт в мире, находится на уровне #v Устойчивость#! или выше и не связана со страной, охваченной паникой. Выигрыш увеличивают [GetTechnology('international_trade').GetName] и [GetTechnology('international_exchange_standards').GetName]. Чем выше статус биржи ([concept_spec_exchange]), тем больше она получает."
 concept_spec_war_news: "Военные новости"
 concept_spec_war_news_desc: "Инвесторы следят за каждой войной ([concept_war]) месяц за месяцем. $concept_spec_war_news$ ежемесячно меняют [concept_spec_market_confidence] в зависимости от хода войны: [concept_casualties], [concept_blockade], [concept_devastation], падение показателя «[concept_gdp]» и затяжная война снижают её, а выигранные сражения ([Concept('concept_battle','$concept_battles|q$')]) и удержание земель врага повышают. Каждая война меняет её на величину от #N -3#! до #P +0.15#! в месяц, все войны вместе от #N -4#! до #P +0.5#!."
