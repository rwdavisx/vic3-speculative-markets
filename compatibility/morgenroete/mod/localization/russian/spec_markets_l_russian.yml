 spec_levy_tt: "[concept_treasury]: #P +@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_speculator_tax')|D]#!, около #v 0.25%#! от показателя «[concept_gdp]»"
 spec_bank_bailout_tt: "$ig_trade_unions$ и $ig_rural_folk$, [concept_approval]: #N -2#! на #v 2.5#! лет"
 spec_markets.2.c: "Спекулянты навлекли это на нас."
 spec_boom_riding: "На волне бума"
