', SelectLocalization(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_risk_src').GetCountry.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), '(CFixedPoint)60'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_risk_src').GetCountry.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), '(CFixedPoint)80')),'SPEC_TIER_BUOYANT', 'SPEC_TIER_MANIA'))))]#!\n$TOOLTIP_DELIMITER$\n#b Почему так много#!\n#N -20#! базовый удар от события «[concept_spec_foreign_panic]»\n#v x[Country.MakeScope.Var('spec_risk_src_size').GetValueWithDefault('(CFixedPoint)0')|2]#! размер их экономики по сравнению с нашей\n#v x[Country.MakeScope.Var('spec_risk_src_w').GetValueWithDefault('(CFixedPoint)0')|2]#! насколько тесно мы связаны ([concept_spec_market_tie])\n#v x[Country.MakeScope.Var('spec_risk_src_reach').GetValueWithDefault('(CFixedPoint)0')|2]#! насколько они важны ([concept_rank])\n$TOOLTIP_DELIMITER$\n#weak Панику могут распространить только рынки в состоянии #v Потрясение#!, #v Настороженность#! или #v Мания#!#!"
