 SPEC_RIVAL_RULE: "Каждый год биржа с большими очками ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]) получает #P 5%#! доверия, а другая теряет #N 5%#!, или #N 7.5%#!, если отношения двух стран плохие или хуже (до учёта эффектов потерь доверия). Это действует для обеих, независимо от того, кто кого назначил.\nМожно назначить: рынок с нашим статусом или на ступень выше, с очками не меньше наших. Мировой центр не назначает соперника.\nВо время события «[concept_spec_financial_panic]» бегущие деньги сначала уходят к сопернику.\nСоюз, оборонительный пакт или права на инвестиции между двумя странами прекращают соперничество."
