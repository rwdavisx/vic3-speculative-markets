 spec_excess_bar: "Спекулятивный перегрев"
 concept_spec_speculative_excess: "Спекулятивный перегрев"
 concept_spec_speculative_excess_desc: "$concept_spec_speculative_excess$ измеряет пузырь, который накапливает рынок ([concept_market]) страны ([concept_country]) во время бума. После изучения технологии «[GetTechnology('stock_exchange').GetName]» он растёт каждый месяц, пока [concept_spec_market_confidence] составляет не менее #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!. Чем выше поднимается $concept_spec_market_confidence$, тем быстрее рост. Пока $concept_spec_market_confidence$ держится между #v 60#! и #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!, перегрев уменьшается на #v 2%#! в месяц.\n\nКогда $concept_spec_market_confidence$ падает ниже #v 60#!, пузырь лопается и $concept_spec_market_confidence$ снижается ещё сильнее, вплоть до #v [GetPlayer.MakeScope.ScriptValue('spec_burst_max')|0]#!. Чем выше $concept_spec_speculative_excess$, тем тяжелее падение."
 concept_spec_sound_finance: "Здоровые финансы"
 concept_spec_sound_finance_desc: "$concept_spec_sound_finance$ достигаются, когда проведены все три [concept_spec_banking_reforms]: правила эмиссии, кредитор последней инстанции и закон о компаниях.\n\nПосле проведения всех трёх [concept_country] получает #v 10#! к показателю «[concept_prestige]», а [concept_loans] обходятся ей на #v 5%#! дешевле по процентам."
 concept_spec_banking_reforms: "Банковские реформы"
 concept_spec_banking_reform: "Банковская реформа"
 concept_spec_banking_reforms_desc: "$concept_spec_banking_reforms$ устанавливают правила, по которым работают банки и компании страны ([concept_country]). Каждая реформа становится доступна с технологией и проводится через следственную комиссию, которая может заседать после события «[concept_spec_financial_panic]» или после #v 10#! лет без него. Каждая комиссия проводит одну реформу.\n\n#bold Правила эмиссии#! ([GetTechnology('banking').GetName]), одно из двух:\n#bold Денежная школа:#! $spec_reform_currency_tt$\n#bold Свободные банки:#! $spec_reform_free_tt$\n\n#bold Кредитор последней инстанции#! ([GetTechnology('central_banking').GetName]): $spec_reform_llr_tt$\n\n#bold Закон о компаниях#! ([GetTechnology('joint_stock_companies').GetName]): $spec_reform_company_tt$\n\nПроведение всех трёх даёт [concept_spec_sound_finance]."
 alert_spec_panic_risk_alert_name: "Риск паники"
 spec_panic_risk_alert_setting_name: "Риск паники"
 alert_spec_panic_risk_alert_desc: "Если бы наши бумы завершились сейчас, [concept_spec_market_confidence] упала бы до #N [GetPlayer.MakeScope.ScriptValue('spec_after_collapse')|0]#!, ниже порога #v [GetPlayer.MakeScope.ScriptValue('spec_panic_at')|0]#!, за которым начинается [concept_spec_financial_panic]."
 alert_spec_panic_risk_alert_hint: "Сдержите спекуляции товарами под наибольшей угрозой или ужесточите политику ([concept_spec_credit_policy]) на вкладке #bold $SPEC_FIN_TAB_BANKING$#! окна #bold $SPEC_FINANCE$#!."
 alert_spec_panic_risk_alert_action: "Журнал"
 alert_spec_bubble_alert_name: "Спекулятивный перегрев"
 spec_bubble_alert_setting_name: "Спекулятивный перегрев"
 alert_spec_bubble_alert_desc: "Наш [concept_spec_speculative_excess] достиг #v [GetPlayer.MakeScope.Var('spec_heat').GetValue|0]#!. Когда [concept_spec_market_confidence] упадёт ниже #v 60#!, пузырь лопнет и [concept_spec_market_confidence] снизится ещё на #N [GetPlayer.MakeScope.ScriptValue('spec_burst_now')|0]#!."
 alert_spec_bubble_alert_hint: "Пузырь растёт каждый месяц, пока [concept_spec_market_confidence] составляет не менее #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!, и сдувается, пока она держится между #v 60#! и этим порогом. Сдерживание спекуляций с товарами, переживающими бум, или более жёсткая [concept_spec_credit_policy] позволяют плавно его уменьшить."
 alert_spec_bubble_alert_action: "Журнал"
 alert_spec_rescue_alert_name: "Доступно спасение банков"
 spec_rescue_alert_setting_name: "Доступно спасение банков"
 alert_spec_rescue_alert_desc: "Идёт [concept_spec_financial_panic], а мы ещё не прокредитовали банки."
 alert_spec_rescue_alert_hint: "#v Кредитовать банки#! сокращает панику, вдвое ослабляет её эффекты и повышает [concept_spec_market_confidence] на #P +20#!. Один раз за панику, на вкладке #bold $SPEC_FIN_TAB_BANKING$#! окна #bold $SPEC_FINANCE$#!."
 alert_spec_rescue_alert_action: "Журнал"
