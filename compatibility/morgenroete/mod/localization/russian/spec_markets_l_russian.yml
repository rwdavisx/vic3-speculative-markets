 spec_panic_movements: "Недоверие к рынкам"
 spec_panic_movements_desc: "После паники многие уверились, что государство должно обуздать рынки, и [Concept('concept_political_movement','$concept_political_movements|q$')], выступающие против закона «[GetLawType('law_laissez_faire').GetName]», обрели поддержку."
 spec_mania_movements: "Вера в рынки"
 spec_mania_movements_desc: "Долгий бум убедил многих, что рынки лучше оставить в покое, и [Concept('concept_political_movement','$concept_political_movements|q$')], поддерживающие закон «[GetLawType('law_laissez_faire').GetName]», обрели поддержку."
 SPEC_DRIVER_DEBT: "Государственный долг"
 SPEC_DRIVER_DEBT_TT: "#header Государственный долг: [GetPlayer.MakeScope.Var('spec_c_debt').GetValue|+=2]#!\n$TOOLTIP_DELIMITER$\n#italic Инвесторы нервничают, когда мы слишком много занимаем.#!\n\nМы использовали #v [GetPlayer.MakeScope.ScriptValue('spec_debt_share')|%0]#! нашего показателя «[concept_credit]» ([concept_principal])\n#P Безопасно#! до #v 50%#!\nКаждые #v 10%#! сверх этого: #N -0.2#! к показателю «[concept_spec_market_confidence]» в месяц (не более #N -1#!)\n$TOOLTIP_DELIMITER$\n#instruction Погасите долг ниже 50%, и это пройдёт.#!"
