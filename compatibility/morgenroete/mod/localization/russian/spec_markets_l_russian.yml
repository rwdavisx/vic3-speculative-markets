 SPEC_RISK_3_ON: "#header Риск войны#!\n[concept_spec_market_confidence]: до #N -[Country.MakeScope.Var('spec_war_risk').GetValueWithDefault('(CFixedPoint)0')|1]#! в месяц\n$TOOLTIP_DELIMITER$\n[Concept('concept_diplomatic_play','$concept_diplomatic_plays|q$')], которые могут перейти в войну: #v [Country.MakeScope.Var('spec_wr_n').GetValueWithDefault('(CFixedPoint)0')|0]#!\n#N -0.6#! за каждую, от средней войны#indent_newline:3 [AddLocalizationIf(Country.MakeScope.Var('spec_wr1').IsSet, 'SPEC_ITEM_WR_1')][AddLocalizationIf(Country.MakeScope.Var('spec_wr2').IsSet, 'SPEC_ITEM_WR_2')][AddLocalizationIf(Country.MakeScope.Var('spec_wr3').IsSet, 'SPEC_ITEM_WR_3')]#!\n$TOOLTIP_DELIMITER$\nЧем хуже идёт война, тем дороже она обходится. См. [concept_spec_war_news]."
