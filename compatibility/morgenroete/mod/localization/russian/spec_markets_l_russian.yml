 spec_rival.1.t11: "Медвежий налёт: #v [ROOT.GetCountry.GetCapital.GetCityHubName]#!!"
 spec_rival.1.d11: "Ещё до открытия торгов брокеры, действовавшие в интересах страны #v [SCOPE.sCountry('target').GetName]#!, разом выбросили на биржу крупные пакеты наших железнодорожных и банковских акций. Цены рухнули, телеграфные ленты не поспевали за торгами, и к полудню наши собственные клерки в страхе распродавали бумаги.\n\nНаша [concept_spec_market_confidence] упадёт на #N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#! за 6 мес."
 spec_rival.1.f11: "«Паника на рынке может начаться с одного-единственного слуха.»"
 spec_rival.1.t10: "Провалившийся налёт"
 spec_rival.1.d10: "Брокеры, действовавшие в интересах страны #v [SCOPE.sCountry('target').GetName]#!, разом выбросили наши акции на биржу в расчёте на разгром. Но наши банки скупили каждый предложенный лот, цены устояли, и к закрытию торгов свои убытки подсчитывали уже сами налётчики.\n\nИх собственная [concept_spec_market_confidence] падает на #P 3#! за 6 мес."
 spec_rival.1.f10: "\"Медведю, что продаёт не своё, лучше бы оказаться правым.\""
 spec_rival.1.t21: "Наш капитал переманивают"
 spec_rival.1.d21: "Агенты из страны #v [SCOPE.sCountry('target').GetName]#! сняли номера в наших лучших гостиницах, и наши крупнейшие инвесторы каждый вечер ужинают с ними. Их предложение простое: лучшая ставка, более надёжная гавань и никаких неудобных вопросов.\n\nВ течение 12 мес. #N [GetPlayer.MakeScope.Var('spec_rv_lure_share').GetValue|%0]#! дохода нашего показателя «[concept_investment_pool]» уходит к ним."
 spec_rival.1.f21: "\"Капитал идёт туда, где с ним хорошо обходятся, и остаётся там, где его хорошо кормят.\""
 spec_rival.1.t31: "Кампания слухов"
 spec_rival.1.d31: "Утренние газеты страны #v [SCOPE.sCountry('target').GetName]#! печатают длинные колонки о поддельных балансах и шатающихся банках в городе #v [ROOT.GetCountry.GetCapital.GetCityHubName]#!. Ни одна статья не подписана, и мало что в них правда, но их читают в каждой конторе континента.\n\nНаша биржа ([concept_spec_exchange]) теряет #N [Multiply_CFixedPoint('(CFixedPoint)0.0167', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|%0]#! доверия."
 spec_rival.1.f31: "\"Ложь успевает обойти полмира, пока правда ещё натягивает сапоги.\""
 spec_rival.1.t3n: "Купленная кампания разоблачена"
 spec_rival.1.d3n: "Газеты страны #v [SCOPE.sCountry('target').GetName]#! полны сомнений в нашей бирже ([concept_spec_exchange]). Но один клерк проговорился, и теперь все знают, чьи деньги заплатили за чернила.\n\nМы теряем доверие, но и они тоже, а их репутация за рубежом страдает."
 spec_rival.1.f3n: "\"Грязь, брошенная в темноте, всё равно пачкает руки.\""
 spec_rival.1.t: "Конкурент действует против нас"
 spec_rival.1.f: "«Паника на рынке может начаться с одного-единственного слуха.»"
 spec_rival.1.a: "Отплатить им той же монетой."
 spec_rival.1.a_tt: "Мы сделаем то же самое с ними, даже если уже делали это в этом году."
 spec_rival.1.a_1: "#v Медвежий налёт#! против них:"
 spec_rival.1.a_2: "#v Переманить их капитал#!:"
 spec_rival.1.a_3: "#v Газетная кампания#! против них:"
 spec_rival.1.b: "Сомкнуть ряды против них."
 spec_rival.1.b_tt: "В течение 12 мес. их действия против нас вполовину слабее. Стоит @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]."
 spec_rival.1.c: "Вести себя так, будто ничего не случилось."
 spec_rival.1.c_tt: "Наша биржа ([concept_spec_exchange]) получает #P [Multiply_CFixedPoint('(CFixedPoint)0.01', Add_CFixedPoint('(CFixedPoint)1', Multiply_CFixedPoint('(CFixedPoint)1', SCOPE.sCountry('target').MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'))))|%0]#! доверия за невозмутимость. Чем крупнее биржа, которую мы проигнорировали, тем больше это значит."
 spec_rival.1.d: "Скупать на панике."
 spec_rival.1.d_tt: "Наши банки скупают то, что продают налётчики. Налёт отнимает #P вдвое#! меньше уверенности ([concept_spec_market_confidence]). Стоит #N @money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rv_counter_cost')|D]#! (#v 1%#! нашего ВВП)."
 spec_rival.1.e: "Предложить те же условия."
 spec_rival.1.e_tt: "Мы платим нашим инвесторам, чтобы они остались. Они забирают #P вдвое#! меньше из нашего показателя «[concept_investment_pool]». Стоит #N @money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rv_counter_cost')|D]#! (#v 1%#! нашего ВВП)."
 spec_rival.1.g: "Ответить в наших газетах."
 spec_rival.1.g_tt: "Наши газеты печатают цифры. Наша биржа ([concept_spec_exchange]) возвращает #P 1%#! доверия. Стоит #N @money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rv_counter_cost')|D]#! (#v 1%#! нашего ВВП)."
 SPEC_DRIVER_RIVAL: "Действия конкурентов"
 SPEC_DRIVER_RIVAL_TT: "#header Действия конкурентов: [Country.MakeScope.Var('spec_c_rival').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#italic Медвежий налёт конкурента на наш рынок, растянутый на шесть месяцев.#!\n#instruction Налёты могут отнять у нас не более #v 4#! уверенности в год, сколько бы их ни было.#!"
 spec_rival.1.d11_big: "Великая биржа страны #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! наконец заметила нас, и увиденное ей не по нраву.\n\nЕщё до открытия торгов брокеры, действовавшие в интересах страны #v [SCOPE.sCountry('target').GetName]#!, разом выбросили на биржу крупные пакеты наших железнодорожных и банковских акций. Цены рухнули, телеграфные ленты не поспевали за торгами, и к полудню наши собственные клерки в страхе распродавали бумаги.\n\nНаша [concept_spec_market_confidence] упадёт на #N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#! за 6 мес."
 spec_rival.1.d11_even: "Годами биржи стран #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! и #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! кружили друг вокруг друга. Это был лишь вопрос времени.\n\nЕщё до открытия торгов брокеры, действовавшие в интересах страны #v [SCOPE.sCountry('target').GetName]#!, разом выбросили на биржу крупные пакеты наших железнодорожных и банковских акций. Цены рухнули, телеграфные ленты не поспевали за торгами, и к полудню наши собственные клерки в страхе распродавали бумаги.\n\nНаша [concept_spec_market_confidence] упадёт на #N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#! за 6 мес."
 spec_rival.1.d11_small: "Выскочки из страны #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! решили, что бирже страны #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! пора сбить спесь.\n\nЕщё до открытия торгов брокеры, действовавшие в интересах страны #v [SCOPE.sCountry('target').GetName]#!, разом выбросили на биржу крупные пакеты наших железнодорожных и банковских акций. Цены рухнули, телеграфные ленты не поспевали за торгами, и к полудню наши собственные клерки в страхе распродавали бумаги.\n\nНаша [concept_spec_market_confidence] упадёт на #N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#! за 6 мес."
 spec_rival.1.d10_big: "Великая биржа страны #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! наконец заметила нас, и увиденное ей не по нраву.\n\nБрокеры, действовавшие в интересах страны #v [SCOPE.sCountry('target').GetName]#!, разом выбросили наши акции на биржу в расчёте на разгром. Но наши банки скупили каждый предложенный лот, цены устояли, и к закрытию торгов свои убытки подсчитывали уже сами налётчики.\n\nИх собственная [concept_spec_market_confidence] падает на #P 3#! за 6 мес."
 spec_rival.1.d10_even: "Годами биржи стран #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! и #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! кружили друг вокруг друга. Это был лишь вопрос времени.\n\nБрокеры, действовавшие в интересах страны #v [SCOPE.sCountry('target').GetName]#!, разом выбросили наши акции на биржу в расчёте на разгром. Но наши банки скупили каждый предложенный лот, цены устояли, и к закрытию торгов свои убытки подсчитывали уже сами налётчики.\n\nИх собственная [concept_spec_market_confidence] падает на #P 3#! за 6 мес."
 spec_rival.1.d10_small: "Выскочки из страны #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! решили, что бирже страны #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! пора сбить спесь.\n\nБрокеры, действовавшие в интересах страны #v [SCOPE.sCountry('target').GetName]#!, разом выбросили наши акции на биржу в расчёте на разгром. Но наши банки скупили каждый предложенный лот, цены устояли, и к закрытию торгов свои убытки подсчитывали уже сами налётчики.\n\nИх собственная [concept_spec_market_confidence] падает на #P 3#! за 6 мес."
 spec_rival.1.d21_big: "Великая биржа страны #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! наконец заметила нас, и увиденное ей не по нраву.\n\nАгенты из страны #v [SCOPE.sCountry('target').GetName]#! сняли номера в наших лучших гостиницах, и наши крупнейшие инвесторы каждый вечер ужинают с ними. Их предложение простое: лучшая ставка, более надёжная гавань и никаких неудобных вопросов.\n\nВ течение 12 мес. #N [GetPlayer.MakeScope.Var('spec_rv_lure_share').GetValue|%0]#! дохода нашего показателя «[concept_investment_pool]» уходит к ним."
 spec_rival.1.d21_even: "Годами биржи стран #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! и #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! кружили друг вокруг друга. Это был лишь вопрос времени.\n\nАгенты из страны #v [SCOPE.sCountry('target').GetName]#! сняли номера в наших лучших гостиницах, и наши крупнейшие инвесторы каждый вечер ужинают с ними. Их предложение простое: лучшая ставка, более надёжная гавань и никаких неудобных вопросов.\n\nВ течение 12 мес. #N [GetPlayer.MakeScope.Var('spec_rv_lure_share').GetValue|%0]#! дохода нашего показателя «[concept_investment_pool]» уходит к ним."
 spec_rival.1.d21_small: "Выскочки из страны #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! решили, что бирже страны #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! пора сбить спесь.\n\nАгенты из страны #v [SCOPE.sCountry('target').GetName]#! сняли номера в наших лучших гостиницах, и наши крупнейшие инвесторы каждый вечер ужинают с ними. Их предложение простое: лучшая ставка, более надёжная гавань и никаких неудобных вопросов.\n\nВ течение 12 мес. #N [GetPlayer.MakeScope.Var('spec_rv_lure_share').GetValue|%0]#! дохода нашего показателя «[concept_investment_pool]» уходит к ним."
 spec_rival.1.d31_big: "Великая биржа страны #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! наконец заметила нас, и увиденное ей не по нраву.\n\nУтренние газеты страны #v [SCOPE.sCountry('target').GetName]#! печатают длинные колонки о поддельных балансах и шатающихся банках в городе #v [ROOT.GetCountry.GetCapital.GetCityHubName]#!. Ни одна статья не подписана, и мало что в них правда, но их читают в каждой конторе континента.\n\nНаша биржа ([concept_spec_exchange]) теряет #N [Multiply_CFixedPoint('(CFixedPoint)0.0167', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|%0]#! доверия."
 spec_rival.1.d31_even: "Годами биржи стран #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! и #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! кружили друг вокруг друга. Это был лишь вопрос времени.\n\nУтренние газеты страны #v [SCOPE.sCountry('target').GetName]#! печатают длинные колонки о поддельных балансах и шатающихся банках в городе #v [ROOT.GetCountry.GetCapital.GetCityHubName]#!. Ни одна статья не подписана, и мало что в них правда, но их читают в каждой конторе континента.\n\nНаша биржа ([concept_spec_exchange]) теряет #N [Multiply_CFixedPoint('(CFixedPoint)0.0167', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|%0]#! доверия."
 spec_rival.1.d31_small: "Выскочки из страны #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! решили, что бирже страны #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! пора сбить спесь.\n\nУтренние газеты страны #v [SCOPE.sCountry('target').GetName]#! печатают длинные колонки о поддельных балансах и шатающихся банках в городе #v [ROOT.GetCountry.GetCapital.GetCityHubName]#!. Ни одна статья не подписана, и мало что в них правда, но их читают в каждой конторе континента.\n\nНаша биржа ([concept_spec_exchange]) теряет #N [Multiply_CFixedPoint('(CFixedPoint)0.0167', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|%0]#! доверия."
 spec_rival.1.d3n_big: "Великая биржа страны #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! наконец заметила нас, и увиденное ей не по нраву.\n\nГазеты страны #v [SCOPE.sCountry('target').GetName]#! полны сомнений в нашей бирже ([concept_spec_exchange]). Но один клерк проговорился, и теперь все знают, чьи деньги заплатили за чернила.\n\nМы теряем доверие, но и они тоже, а их репутация за рубежом страдает."
 spec_rival.1.d3n_even: "Годами биржи стран #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! и #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! кружили друг вокруг друга. Это был лишь вопрос времени.\n\nГазеты страны #v [SCOPE.sCountry('target').GetName]#! полны сомнений в нашей бирже ([concept_spec_exchange]). Но один клерк проговорился, и теперь все знают, чьи деньги заплатили за чернила.\n\nМы теряем доверие, но и они тоже, а их репутация за рубежом страдает."
 spec_rival.1.d3n_small: "Выскочки из страны #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! решили, что бирже страны #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! пора сбить спесь.\n\nГазеты страны #v [SCOPE.sCountry('target').GetName]#! полны сомнений в нашей бирже ([concept_spec_exchange]). Но один клерк проговорился, и теперь все знают, чьи деньги заплатили за чернила.\n\nМы теряем доверие, но и они тоже, а их репутация за рубежом страдает."
 spec_rival.1.desc: "Конкурент выступил против нашей биржи ([concept_spec_exchange])."
 SPEC_RV_RAID_TT: "#header Медвежий налёт#!\n$TOOLTIP_DELIMITER$\n#italic Наши маклеры разом сбрасывают акции страны [Country.GetNameNoFormatting], чтобы обрушить её рынок.#!\n$TOOLTIP_DELIMITER$\n#b Если сработает#!\n[concept_spec_market_confidence] страны [Country.GetNameNoFormatting]: #P -[Multiply_CFixedPoint('(CFixedPoint)3', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|0]#! за #v 6#! мес.\nСостязание: #P 10%#! в нашу сторону\n\n#b Если провалится#! (шанс #N [Min_CFixedPoint('(CFixedPoint)80', Add_CFixedPoint('(CFixedPoint)20', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint('(CFixedPoint)0', Divide_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, GetPlayer.MakeScope.Var('spec_centre_score').GetValue), Max_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|0]%#!)\nНаша [concept_spec_market_confidence]: #N -3#! за #v 6#! мес.\nСостязание: #N 10%#! в их сторону\n$TOOLTIP_DELIMITER$\nСтоимость: #N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#! из нашей казны ([concept_treasury])\nПерезарядка: #v 1 г.#! против [Country.GetNameNoFormatting][AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_raid').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_RAID')]"
 SPEC_RV_WHY_RV_RAID: "\n\n[GetScriptedGui('spec_sgui_rv_raid').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_LURE_TT: "#header Переманить капитал#!\n$TOOLTIP_DELIMITER$\n#italic Наши банкиры переманивают инвесторов страны [Country.GetNameNoFormatting] более выгодными условиями.#!\n$TOOLTIP_DELIMITER$\n#P [Multiply_CFixedPoint('(CFixedPoint)0.05', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|%0]#! дохода показателя «[concept_investment_pool]» страны [Country.GetNameNoFormatting] переходит к нам на #v 12#! мес.\nСостязание: #P 10%#! в нашу сторону\n$TOOLTIP_DELIMITER$\nСтоимость: #N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_lure_debt_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#! добавляется к нашему показателю «[concept_spec_outstanding_credit]»\nПерезарядка: #v 1 г.#! против страны [Country.GetNameNoFormatting][AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_lure').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_LURE')]"
 SPEC_RV_WHY_RV_LURE: "\n\n[GetScriptedGui('spec_sgui_rv_lure').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_PRESS_TT: "#header Газетная кампания#!\n$TOOLTIP_DELIMITER$\n#italic Дружественные газеты заполняют страницы сомнениями в бирже ([concept_spec_exchange]) страны [Country.GetNameNoFormatting].#!\n$TOOLTIP_DELIMITER$\n#b Если сработает#!\nДоверие к бирже ([concept_spec_exchange]) страны [Country.GetNameNoFormatting]: #P -[Multiply_CFixedPoint('(CFixedPoint)0.0167', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|%0]#!\nСостязание: #P 10%#! в нашу сторону\n\n#b Если раскроют#! (шанс #N [Country.MakeScope.ScriptValue('spec_rv_press_expose')|0]%#!, выше там, где пресса страны [Country.GetNameNoFormatting] свободна)\n[concept_relations] со страной [Country.GetNameNoFormatting]: #N -20#!\nДоверие к нашей бирже ([concept_spec_exchange]): #N -1.7%#!\nСостязание: #N 10%#! в их сторону\n$TOOLTIP_DELIMITER$\nСтоимость: [concept_influence] #N -75#! @inf! на #v 12#! мес.\nПерезарядка: #v 1 г.#! против [Country.GetNameNoFormatting][AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_press').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_PRESS')]"
 SPEC_RV_WHY_RV_PRESS: "\n\n[GetScriptedGui('spec_sgui_rv_press').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_HOLD_TT: "#header Удержать позицию#!\n$TOOLTIP_DELIMITER$\n#italic Мы выкупаем то, что продал [Country.GetNameNoFormatting], и укрепляем нашу сторону в состязании.#!\n$TOOLTIP_DELIMITER$\nОтменяет один сдвиг страны [Country.GetNameNoFormatting] и возвращает состязание на #P 10%#! в нашу сторону\nИх сдвигов против нас сейчас: #v [Country.MakeScope.Var('spec_rv_ui_them').GetValue|0]#!\n$TOOLTIP_DELIMITER$\nСтоимость: #N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#! из нашей казны ([concept_treasury])\nПерезарядка: #v 1 г.#! против страны [Country.GetNameNoFormatting][AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_hold').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_HOLD')]"
 SPEC_RV_WHY_RV_HOLD: "\n\n[GetScriptedGui('spec_sgui_rv_hold').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_SHORE_TT: "#header Укрепить рынок#!\n$TOOLTIP_DELIMITER$\n#italic Наши банки смыкают ряды против страны [Country.GetNameNoFormatting].#!\n$TOOLTIP_DELIMITER$\nДействия страны [Country.GetNameNoFormatting] против нас #P вдвое#! слабее в течение #v 12#! мес.\n$TOOLTIP_DELIMITER$\nСтоимость: #N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#! из нашей казны ([concept_treasury])\nПерезарядка: #v 2 г.#! против страны [Country.GetNameNoFormatting][AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_shore').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_SHORE')]"
