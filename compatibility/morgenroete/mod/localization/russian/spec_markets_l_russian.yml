 notification_spec_ld_recovered_tooltip: "#header $notification_spec_ld_recovered_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_ld_recovered_desc$"
 spec_depression.1.t: "$SPEC_LD_NAME$"
 spec_depression.1.d: "Паника на мировых биржах слилась воедино. Кредит больше не переходит от одного крупного торгового дома к другому, цены падают повсюду разом, а заказы, загружавшие наши фабрики и шахты, отменяют по телеграфу. Каждый рынок опирается на остальные, и все они рушатся вместе.\n\nОбвал продлится несколько месяцев, а затем наступит долгая депрессия. Скорость восстановления зависит от наших нынешних действий и от того, что предпримут [Concept('concept_great_power','$concept_great_powers|q$')]."
 spec_depression.1.f: "«Мы и прежде переживали панику. Но на этот раз деньгам некуда бежать»."
 spec_depression.1.a: "Необходимо сократить расходы."
 spec_depression.1.b: "Укрепить биржи."
 spec_depression.2.t: "Стена пошлин"
 spec_depression.2.d: "Владельцы наших крупнейших предприятий подали прошение правительству, и к ним присоединились крупные землевладельцы. По их словам, иностранные товары и дешёвое иностранное зерно продают на наших рынках за любую цену, которую удаётся выручить, а отечественные фабрики и поместья не могут продавать по цене, покрывающей жалованье. Они просят повысить пошлины на всё, что соперничает с отечественной промышленностью и урожаем.\n\nЗащита оградит наше восстановление, но ударит по торговым партнёрам, а вместе с ними и по восстановлению всего мира."
 spec_depression.2.f: "«Каждая страна возводит стену вокруг собственного рынка, а потом удивляется, почему её вывоз не восстанавливается»."
 spec_depression.2.a: "Защитить нашу промышленность."
 spec_depression.2.b: "Сохранить открытые рынки."
 spec_depression.3.t: "Общественные работы"
 spec_depression.3.d: "Город [ROOT.GetCountry.GetCapital.GetCityHubName]: тысячи людей сидят без дела, а средства помощи исчерпаны. Городские инженеры составили список работ, на которых их можно занять: стоки, дороги, набережные и новый крытый рынок. Если только казна согласится заплатить."
 spec_depression.3.f: "«Человек, который роет канаву за дневной заработок, не нищий. И он это знает»."
 spec_depression.3.a: "Оплатить работы."
 spec_depression.3.b: "Благотворительность есть частное дело."
 spec_depression.4.t: "Банки в осаде"
 spec_depression.4.d: "Город [ROOT.GetCountry.GetCapital.GetCityHubName]: пошли слухи, что местные банки щедро кредитовали фирмы, которые теперь разоряются. С утра вкладчики стоят в очередях за своими сбережениями. К вечеру у банков не останется монеты для выплат. Директора просят правительство вмешаться."
 spec_depression.4.f: "«Банк совершенно надёжен до тех пор, пока все не уверятся в обратном»."
 spec_depression.4.a: "Объявить банковские каникулы."
 spec_depression.4.b: "Спасти банки."
 spec_depression.4.c: "Пусть разоряются."
 spec_depression.5.t: "Денежный вопрос"
 spec_depression.5.d: "Падение цен раскололо страну. Фермеры и мелкие заёмщики говорят, что деньги стали слишком дороги и каждый год снижения цен делает долг всё тяжелее. Они требуют выпустить больше денег и облегчить кредитование. Банкиры и кредиторы отвечают, что лишь твёрдые деньги вернут доверие отечественных и зарубежных инвесторов."
 spec_depression.5.f: "«Мой закладной долг ровно тот же, что пять лет назад. А за пшеницу дают вдвое меньше»."
 spec_depression.5.a: "Твёрдые деньги превыше всего."
 spec_depression.5.b: "Облегчить кредитование."
 spec_depression.6.t: "Марш безработных"
 spec_depression.6.d: "Город [ROOT.GetCountry.GetCapital.GetCityHubName]: колонна безработных прошла под знамёнами «Работы или хлеба». Они разбили лагерь перед правительственными учреждениями и требуют принять прошение. Полиция уверяет, что к ночи очистит площадь."
 spec_depression.6.f: "«Мы просим не милостыни. Мы просим работы»."
 spec_depression.6.a: "Разогнать их."
 spec_depression.6.b: "Выслушать их прошение."
 spec_depression.7.t: "Призывы к реформам"
 spec_depression.7.d: "Газеты спрашивают, отчего депрессия тянется так долго и кто разбогател на предшествовавших ей спекуляциях. Законодатели требуют расследовать дела банков, бирж и действия самого правительства."
 spec_depression.7.f: "«Вопрос уже не в том, подвела ли нас система, а в том, кто за это ответит»."
 spec_depression.7.a: "Назначить расследование."
 spec_depression.7.b: "Система исправна."
 spec_depression.8.t: "$SPEC_LD_NAME$ отступает"
 spec_depression.8.d: "Впервые за долгие годы новые заказы поступают быстрее, чем отменяются старые. Цены перестали падать, банки вновь выдают займы, а простаивавшие предприятия нанимают рабочих. Депрессия кончилась, хотя мало кто из переживших её скоро об этом забудет."
 spec_depression.8.f: "«Говорят, торговля поправляется. Поверю, когда об этом скажет моя книга заказов»."
 spec_depression.8.a: "Уроки усвоены."
 spec_depression.8.b: "Пора вернуться к делам."
