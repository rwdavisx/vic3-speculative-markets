 alert_spec_bailout_alert_hint: "#v Выкупить плохие долги#! уменьшает оставшиеся [concept_spec_bad_debts] вдвое за #v @money![GetPlayer.MakeScope.ScriptValue('spec_bailout_cost')|D]#!, один раз, пока они есть. Доступно на вкладке #bold $SPEC_FIN_TAB_BANKING$#! окна #bold $SPEC_FINANCE$#!."
