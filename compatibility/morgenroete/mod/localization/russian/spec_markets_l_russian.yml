 SPEC_UNWIND_DESC_3: "Этот [concept_good] пережил бум, достигший уровня #v Лихорадка#!. Если ценовой тренд упадёт ниже #v [Divide_CFixedPoint('(CFixedPoint)-4.988', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!, [concept_spec_investor_interest] перейдёт на уровень #v Отток#! и наступит [concept_spec_collapse]. Затем инвесторы будут воздерживаться от вложений в течение #v 12#! мес. Со временем риск снижается."
 SPEC_UNWIND_2: "Спад"
