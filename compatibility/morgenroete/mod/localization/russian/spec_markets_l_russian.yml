 spec_suspend_note_tt: "Правила эмиссии следуют денежной школе"
 spec_inquiry_when_tt: "[concept_spec_financial_panic] завершилась за последний год, и с тех пор расследование не проводилось, либо прошло #v 10#! лет без паники (осталось #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_calm_left')|0]#! мес.)"
