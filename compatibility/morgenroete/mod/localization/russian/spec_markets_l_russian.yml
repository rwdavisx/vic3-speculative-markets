 SPEC_LHIST_KEY_RISKY: "Рискованно"
 SPEC_LHIST_KEY_DANGER: "Опасно"
 SPEC_LHIST_PANIC_3: "#low Паника 25#!"
 SPEC_LHIST_PANIC_3_TT: "#header Порог паники: 25#!\n$TOOLTIP_DELIMITER$\n#italic Точка, где тревога переходит в панику.#!\n\nПри #v 3#! мес. показателя «[concept_spec_leverage]» [concept_spec_financial_panic] начинается, если [concept_spec_market_confidence] падает ниже #v 25#!"
 SPEC_LHIST_PANIC_8: "#low Паника 47#!"
 SPEC_LHIST_PANIC_8_TT: "#header Порог паники: 47#!\n$TOOLTIP_DELIMITER$\n#italic Точка, где тревога переходит в панику.#!\n\nПри #v 8#! мес. показателя «[concept_spec_leverage]» [concept_spec_financial_panic] начинается, если [concept_spec_market_confidence] падает ниже #v 47#!"
 SPEC_LHIST_PANIC_12: "#low Паника 65#!"
 SPEC_LHIST_PANIC_12_TT: "#header Порог паники: 65#!\n$TOOLTIP_DELIMITER$\n#italic Точка, где тревога переходит в панику.#!\n\nПри #v 12#! мес. показателя «[concept_spec_leverage]» [concept_spec_financial_panic] начинается, если [concept_spec_market_confidence] падает ниже #v 65#!"
