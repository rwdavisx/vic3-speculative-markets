 SPEC_WHY_SPEED: "#header Реакция инвесторов#!\nНа рост цен: #v x[Country.MakeScope.ScriptValue('spec_hype_mult')|2]#!\nНа падение цен: #v x[Country.MakeScope.ScriptValue('spec_hype_mult_down')|2]#!\n$TOOLTIP_DELIMITER$\n#v x[Country.MakeScope.ScriptValue('spec_law_mult')|2]#! от экономической системы\n#v x[Country.MakeScope.ScriptValue('spec_stance_hype')|2]#! от фактора «[concept_spec_credit_policy]»[AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_stance_hype'), '(CFixedPoint)1'), 'SPEC_WHY_SPEED_LOOSE')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_tech_hype'), '(CFixedPoint)1')), 'SPEC_WHY_SPEED_TECH')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_depth'), '(CFixedPoint)1')), 'SPEC_WHY_SPEED_DEPTH')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_band_gain'), '(CFixedPoint)1')), 'SPEC_WHY_SPEED_BAND')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_hype'), '(CFixedPoint)1')), 'SPEC_WHY_SPEED_EXCH')]\n\nЧем она выше, тем быстрее [concept_spec_investor_interest] следует за ценовым трендом."
