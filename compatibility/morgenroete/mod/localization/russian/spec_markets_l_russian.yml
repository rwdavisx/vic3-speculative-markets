 SPEC_EFFECT_GIVEN_TT: "#header Кредиты за этот месяц#!\n#v @money![Country.MakeScope.Var('spec_credit_given').GetValueWithDefault('(CFixedPoint)0')|D]#! за этот месяц\n$TOOLTIP_DELIMITER$\n#italic Деньги, которые наши банки добавляют в [concept_investment_pool].#!\n\nСтавка кредитования: #v [SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_credit_rate'), '(CFixedPoint)0.01'), 'SPEC_CREDITW_0', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_credit_rate'), '(CFixedPoint)0.5'), 'SPEC_CREDITW_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_credit_rate'), '(CFixedPoint)1.15'), 'SPEC_CREDITW_2', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_credit_rate'), '(CFixedPoint)1.8'), 'SPEC_CREDITW_3', 'SPEC_CREDITW_4'))))]#!\n#italic Насколько свободно кредитуют наши банки, а не проценты, которые мы платим.#!\n\n#b По сравнению с обычным кредитованием#!\n$ECONOMIC_SYSTEM_GC_LINK$: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_law_mult'), '(CFixedPoint)1')|+%0]#!\nФинансовые технологии: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_tech_credit'), '(CFixedPoint)1')|+%0]#!\n[concept_spec_credit_policy]: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_stance_credit'), '(CFixedPoint)1')|+%0]#!\n[concept_spec_banking_reforms]: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_reform_credit'), '(CFixedPoint)1')|+%0]#!\n[concept_spec_lending_standards]: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_credit'), '(CFixedPoint)1')|+%0]#!\n[concept_spec_exchange]: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_credit'), '(CFixedPoint)1')|+%0]#!\n$TOOLTIP_DELIMITER$\n#weak Банки кредитуют каждый месяц, пока [concept_spec_market_confidence] выше #v 55#!, и тем больше, чем она выше, пока не достигнут лимита кредитования. [concept_investment_pool] показывает это по неделям.#!"
