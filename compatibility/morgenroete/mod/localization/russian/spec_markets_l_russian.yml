 SPEC_LEVER_RESTRAIN_TT: "#header Сдержать спекуляции: [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n#italic Охладите разогретый товар ([concept_good]), пока его бум не стал слишком большим.#!\n\n[concept_spec_investor_interest] за несколько месяцев снижается до уровня #v Спокойствие#!\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_DOWN', 'SPEC_LEVER_NONE')][concept_budget_additional_income]: #P @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_levy_', Goods.GetKey))|D]#! в неделю (#v 10%#! их производства по базовой цене)\nКогда его бум закончится, он будет медленно сходить на нет примерно год, как [concept_spec_correction], а не рухнет разом\n\nСвязывает #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#! [concept_authority], пока действует, а не списывает их каждый месяц. Мы получим их обратно после отмены#indent_newline:3 \n#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! для этого товара ([concept_good]) обычно, столько же, сколько половина налога на его потребление\n#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! от того, сколько мы им торгуем (#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! нашего рынка)#!\n\n#lore После краха Компании Южных морей «Акт о пузырях» 1720 года запретил учреждать акционерные компании без королевской хартии.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_restrain_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_restrain').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_LEVER_ENCOURAGE_TT: "#header Поощрить инвестиции: [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n#italic Подогрейте интерес инвесторов к товару ([concept_good]), который они не замечают.#!\n\n[concept_spec_investor_interest] за несколько месяцев поднимается до уровня #v Интерес#!\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_UP', 'SPEC_LEVER_NONE')][concept_budget_additional_expenses]: #N @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_subsidy_', Goods.GetKey))|D]#! в неделю (#v 20%#! их производства по базовой цене)\nОтменяется само, когда [concept_good] достигает уровня #v Азарт#!\n\nСвязывает #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#! [concept_authority], пока действует, а не списывает их каждый месяц. Мы получим их обратно после отмены#indent_newline:3 \n#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! для этого товара ([concept_good]) обычно, столько же, сколько половина налога на его потребление\n#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! от того, сколько мы им торгуем (#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! нашего рынка)#!\n\n#lore В середине XIX века Британская Индия и Франция гарантировали инвесторам в железные дороги твёрдый доход на капитал.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_encourage_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_encourage').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
