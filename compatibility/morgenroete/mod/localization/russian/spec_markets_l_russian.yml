 spec_coty_desc: "Самая процветающая в мире [concept_spec_blue_chip] в этом году наша"
 spec_bc_index: "Индекс голубых фишек"
 spec_bc_index_desc: "Наши голубые фишки ([concept_spec_blue_chip]) привлекают сбережения на рынок и удешевляют займы. Каждая делает его сильнее. Первые 5 считаются полностью, а остальные до 10 наполовину."
 spec_bluechip.1.t: "Новая голубая фишка"
 spec_bluechip.1.d: "После года стабильной прибыли [SCOPE.sCompany('spec_bc_co').GetName] теперь числится среди голубых фишек. Её акции ищут все банки и вдовы страны, а маклеры гадают, удовольствуется ли она своим положением или попросит у рынка ещё."
 spec_bluechip.1.f: "Надёжно, как в банке, — говорят."
 spec_bluechip.1.a: "Ударить в колокол в их честь"
 spec_bluechip.1.a.tt: "Доверие к нашей бирже ([concept_spec_exchange]): #P +2%#!"
 spec_bluechip.1.b: "Пусть выпустят новые акции"
 spec_bluechip.1.b.tt: "Наш фонд ([concept_investment_pool]): #P +[ROOT.GetCountry.MakeScope.ScriptValue('spec_bc_shares')|D]#! @money!\nКомпания [SCOPE.sCompany('spec_bc_co').GetName] становится уязвимой на #v 5#! г., поэтому один месяц ниже #v 70#! ([concept_prosperity]) лишит её статуса голубой фишки"
 spec_bluechip.2.t: "Голубая фишка оступается"
 spec_bluechip.2.d: "[SCOPE.sCompany('spec_bc_co').GetName] опустилась ниже уровня голубой фишки. Если её прибыль не восстановится за 3 мес., рынок вычеркнет её из списка, и наша биржа это почувствует."
 spec_bluechip.2.f: "Дом, простоявший поколение, может пасть за один сезон."
 spec_bluechip.2.a: "Поддержать её"
 spec_bluechip.2.a.tt: "Стоимость: #N [ROOT.GetCountry.MakeScope.ScriptValue('spec_bc_prop_cost')|D]#! @money!\n[SCOPE.sCompany('spec_bc_co').GetName] сохраняет статус #v 12#! мес. при любой прибыли"
 spec_bluechip.2.b: "Пусть решает рынок"
 spec_bluechip.2.b.tt: "Если она останется ниже порога #v 3#! мес.:\nДоверие к нашей бирже ([concept_spec_exchange]): #N -2%#!\n[concept_spec_market_confidence]: #N -3#!"
 spec_bluechip.3.t: "Компания года"
 spec_bluechip.3.d: "Финансовая пресса всех столиц единодушна в том, что компания [SCOPE.sCompany('spec_bc_co').GetName] в этом году самая процветающая в мире. Наша биржа купается в лучах её славы."
 spec_bluechip.3.f: "Каждый клерк в Сити хочет себе её акций."
 spec_bluechip.3.a: "День гордости"
 spec_bluechip.3.a.tt: "Доверие к нашей бирже ([concept_spec_exchange]): #P +2%#!\n$spec_coty$ на год: [concept_prestige] #P +5%#!"
 SPEC_H_CENTRES: "Ведущие биржи"
 SPEC_H_CENTRES_TT: "#header $concept_spec_financial_centres$#!\n$concept_spec_financial_centre_desc$"
 concept_spec_financial_centre: "Ведущая биржа"
 concept_spec_financial_centres: "Ведущие биржи"
 concept_spec_financial_centre_desc: "@spec_financial_centre! $concept_spec_financial_centres$ — это #v 5#! стран ([Concept('concept_country','$concept_countries|q$')]) с самыми высокими очками ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]), рейтинг обновляется каждый месяц. Чем больше средств из пула ([concept_investment_pool]) может привлечь ваша биржа ([concept_spec_exchange]), тем выше очки. На них также влияют доверие, богатство на душу населения, финансовые районы, компании, финансовые технологии, [concept_rank] и экономическая система. Среднее первой тройки: #v 100#!.\n\nПервое место: #P +10%#! [concept_prestige], #P -10%#! к процентной ставке ([concept_loans]), #P +5#! мес. лимита кредитования\nПоследнее место (#v 5#!): #P +2%#!, #P -2%#!, #P +1#! мес.\nДля бонуса к лимиту кредитования требуется: [GetTechnology('central_banking').GetName], а также стандарты кредитования #v Надёжные#! или строже"
 SPEC_CENTRE_PLACE: "#v ##[Country.MakeScope.Var('spec_centre_rank').GetValueWithDefault('(CFixedPoint)0')|0]#!"
 SPEC_CENTRE_PLACE_TT: "[Concept('concept_spec_financial_centre','$concept_spec_financial_centres|q$')] мира - наше место в рейтинге: #v ##[Country.MakeScope.Var('spec_centre_rank').GetValueWithDefault('(CFixedPoint)0')|0]#!"
