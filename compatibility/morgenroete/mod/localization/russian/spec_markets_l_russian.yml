 spec_lever_fits_restrain_tt: "[concept_spec_investor_interest] достиг уровня #v Азарт#! или выше, либо завершение бума снизит [concept_spec_market_confidence] не менее чем на #v 2#!"
 spec_lever_fits_encourage_tt: "[concept_spec_investor_interest] ниже уровня #v Интерес#!, [concept_good] не восстанавливается после бума и не переживает бум, который может завершить [concept_spec_bust] или [concept_spec_collapse]"
 SPEC_LEVER_RESTRAIN_TT: "#header Сдержать спекуляции: [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_investor_interest]: за несколько месяцев снижается до уровня #v Спокойствие#!\n[concept_authority]: #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#! в месяц#indent_newline:3 \n#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! от базового значения (половина налога на потребление этого товара)\n#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! от доли в торговле (#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! нашего рынка)#!\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_DOWN', 'SPEC_LEVER_NONE')][concept_budget_additional_income]: #P @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_levy_', Goods.GetKey))|D]#! в неделю, сбор в размере 10% нашего недельного производства по базовой цене\n\nПока спекуляции сдерживаются, бум товара не может расти или резко завершиться. Он сходит на нет в форме события «[concept_spec_correction]» примерно за год, каждый месяц понемногу снижая [concept_spec_market_confidence].\n\n#lore Подобно «Акту о пузырях» 1720 года, который ограничил создание новых акционерных компаний после краха Компании Южных морей.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_restrain_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_restrain').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_LEVER_ENCOURAGE_TT: "#header Поощрить инвестиции: [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_investor_interest]: за несколько месяцев поднимается до уровня #v Интерес#!\n[concept_authority]: #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#! в месяц#indent_newline:3 \n#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! от базового значения (половина налога на потребление этого товара)\n#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! от доли в торговле (#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! нашего рынка)#!\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_UP', 'SPEC_LEVER_NONE')][concept_budget_additional_expenses]: #N @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_subsidy_', Goods.GetKey))|D]#! в неделю, субсидия в размере 20% нашего недельного производства по базовой цене\n\nОтменяется сама, когда [concept_good] достигает уровня #v Азарт#!, чтобы его бум мог завершиться своим чередом.\n\n#lore Подобно гарантированному доходу, который Британская Индия и Франция предлагали инвесторам в железные дороги в середине XIX века.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_encourage_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_encourage').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
