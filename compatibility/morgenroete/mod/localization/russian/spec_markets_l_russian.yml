 SPEC_RISK_4_ON: "#header Риск дефолта#!\n[concept_spec_market_confidence]: до #N -5#! в месяц\n$TOOLTIP_DELIMITER$\n[concept_credit], использовано: #v [Country.MakeScope.Var('spec_default_risk').GetValueWithDefault('(CFixedPoint)0')|%0]#![AddLocalizationIf(Country.MakeScope.Var('spec_tm_broke').IsSet, 'SPEC_RISK_4_BROKE')]\n$TOOLTIP_DELIMITER$\nСвыше #v 100%#!: [concept_default], #N -5#! в месяц до его окончания\nПоказывается с #v 80%#!"
