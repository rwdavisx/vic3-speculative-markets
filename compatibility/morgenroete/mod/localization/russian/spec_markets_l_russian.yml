 SPEC_IL_TIER_6: "Лихорадка"
 SPEC_IL_LEVEL_1_TT: "#header @spec_interest_fleeing! Отток#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_IL_LEVEL_CURRENT')]\n$TOOLTIP_DELIMITER$\n#italic Один из шести уровней настроения инвесторов. Зависит от того, насколько цена ушла от нормы.#!\n\nТовар здесь, когда его цена ниже нормы более чем на #v [Country.MakeScope.ScriptValue('spec_level_from_2')|=+%1]#!\nСейчас: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Эффекты:#!\n[concept_throughput] производителей: #N -10%#!\nЕсли бум уровня #v Лихорадка#! падает так низко, наступает [concept_spec_collapse]\nЗдесь можно поощрять инвестиции, если товар не восстанавливается"
 SPEC_IL_LEVEL_2_TT: "#header @spec_interest_doubtful! Сомнения#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_LEVEL_CURRENT')]\n$TOOLTIP_DELIMITER$\n#italic Один из шести уровней настроения инвесторов. Зависит от того, насколько цена ушла от нормы.#!\n\nТовар здесь, когда его цена отличается от нормы на #v [Country.MakeScope.ScriptValue('spec_level_from_2')|=+%1]#!..#v [Country.MakeScope.ScriptValue('spec_level_from_3')|=+%1]#!\nСейчас: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Эффекты:#!\n[concept_throughput] производителей: #N -5%#!\nПосле завершения бума товар на время остаётся на этом уровне или ниже, чтобы восстановиться\nЗдесь можно поощрять инвестиции, если товар не восстанавливается"
 SPEC_IL_LEVEL_3_TT: "#header @spec_interest_calm! Спокойствие#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_LEVEL_CURRENT')]\n$TOOLTIP_DELIMITER$\n#italic Один из шести уровней настроения инвесторов. Зависит от того, насколько цена ушла от нормы.#!\n\nТовар здесь, когда его цена отличается от нормы на #v [Country.MakeScope.ScriptValue('spec_level_from_3')|=+%1]#!..#v [Country.MakeScope.ScriptValue('spec_level_from_4')|=+%1]#!\nСейчас: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Эффекты:#!\nНа этом уровне ничего не происходит\nЗдесь можно поощрять инвестиции, если товар не восстанавливается"
 SPEC_IL_LEVEL_4_TT: "#header @spec_interest_keen! Интерес#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)4'), 'SPEC_IL_LEVEL_CURRENT')]\n$TOOLTIP_DELIMITER$\n#italic Один из шести уровней настроения инвесторов. Зависит от того, насколько цена ушла от нормы.#!\n\nТовар здесь, когда его цена отличается от нормы на #v [Country.MakeScope.ScriptValue('spec_level_from_4')|=+%1]#!..#v [Country.MakeScope.ScriptValue('spec_level_from_5')|=+%1]#!\nСейчас: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Эффекты:#!\n[concept_throughput] производителей: #P +3%#!\nКогда бум закончится: [concept_spec_correction]"
 SPEC_IL_LEVEL_5_TT: "#header @spec_interest_eager! Азарт#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)5'), 'SPEC_IL_LEVEL_CURRENT')]\n$TOOLTIP_DELIMITER$\n#italic Один из шести уровней настроения инвесторов. Зависит от того, насколько цена ушла от нормы.#!\n\nТовар находится здесь, когда его цена отличается от нормы на величину от #v [Country.MakeScope.ScriptValue('spec_level_from_5')|=+%1]#! до #v [Country.MakeScope.ScriptValue('spec_level_from_6')|=+%1]#!\nСейчас: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Эффекты:#!\n[concept_throughput] производителей: #P +5%#!\n[concept_spec_market_confidence] #P растёт#! каждый месяц (сильнее, если товар занимает большую долю нашей торговли, и не растёт, пока длится [concept_spec_financial_panic])\nКогда бум закончится: [concept_spec_bust]\nЗдесь можно сдерживать спекуляции"
 SPEC_IL_LEVEL_6_TT: "#header @spec_interest_feverish! Лихорадка#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)6'), 'SPEC_IL_LEVEL_CURRENT')]\n$TOOLTIP_DELIMITER$\n#italic Один из шести уровней настроения инвесторов. Зависит от того, насколько цена ушла от нормы.#!\n\nТовар находится здесь, когда его цена выше нормы более чем на #v [Country.MakeScope.ScriptValue('spec_level_from_6')|=+%1]#!\nСейчас: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Эффекты:#!\n[concept_throughput] производителей: #P +8%#!\n[concept_spec_market_confidence] #P растёт#! каждый месяц (сильнее, если товар занимает большую долю нашей торговли, и не растёт, пока длится [concept_spec_financial_panic])\nКогда бум закончится: [concept_spec_collapse]\nЗдесь можно сдерживать спекуляции"
