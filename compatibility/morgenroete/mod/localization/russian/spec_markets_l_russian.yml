 SPEC_IL_SORT_GOODS_TT: "#header Сортировать по товарам#!\n$TOOLTIP_DELIMITER$\n[Concept('concept_good','$concept_goods|q$')], которыми торгует наш [concept_market], располагаются в фиксированном порядке, сначала по категории, затем по названию."
 SPEC_IL_SORT_INTEREST_TT: "#header Сортировать: [concept_spec_investor_interest]#!\n$TOOLTIP_DELIMITER$\nСначала самые разогретые товары, затем самые торгуемые\n\nМетка показывает уровень, от @spec_interest_fleeing! #v Отток#! до @spec_interest_feverish! #v Лихорадка#!\nСтрелка показывает изменение за этот месяц"
 SPEC_IL_SORT_LEVER_TT: "$SPEC_IL_SORT_LEVER_BASE_TT$$SPEC_IL_ISSUE_FILTER$"
 SPEC_IL_ISSUE_FILTER: "\n\nТакже отображаются действующие крупные выпуски."
 SPEC_IL_SORT_LEVER_BASE_TT: "#header Показать вмешательства#!\n$TOOLTIP_DELIMITER$\nПоказывает только товары, для которых действует [concept_spec_intervention]\n\n#instruction Нажмите, чтобы показать только эти товары; нажмите снова, чтобы показать все#!"
 SPEC_IL_DANGER_TT: "#header Зона краха#!\n$TOOLTIP_DELIMITER$\n#italic Бум так велик, что откат сейчас закончит его плохо.#!\n\nЕсли [concept_spec_investor_interest] упадёт так низко, наступит [concept_spec_collapse]\nЭто обойдётся примерно в #N [Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! уверенности ([concept_spec_market_confidence])"
 SPEC_IL_CRASHED_TT: "#header [Goods.GetName]: бум завершён#!\n$TOOLTIP_DELIMITER$\n#italic Бум этого товара только что закончился.#!\n\nВ этом месяце он закончился так: [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]\n#N Инвесторы держатся в стороне#! в течение [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))]\nИз-за этого [Concept('concept_company','$concept_companies|q$')] #N теряет#! [concept_throughput]"
 SPEC_IL_GLUT_TT: "#header [Goods.GetName]: восстановление#!\n$TOOLTIP_DELIMITER$\n#italic Инвесторы всё ещё насторожены после окончания прошлого бума.#!\n\nТот бум закончился так: [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]\n[concept_spec_investor_interest] #N застрял#! на уровне #v Сомнения#! или ниже в течение [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))]\nИз-за этого [Concept('concept_company','$concept_companies|q$')] #N теряет#! [concept_throughput]"
 SPEC_TILE_BANKS: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_expx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_BANKS_ON', 'SPEC_GOODS_NONE')]$SPEC_TILE_CYCLE$"
 SPEC_TILE_BANKS_ON: "\n\n#title Банковские займы#!\nНа этот бум приходится #v [Country.MakeScope.Var(Concatenate('spec_exp_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! всего показателя «[concept_spec_outstanding_credit]», что равно #v [Country.MakeScope.Var(Concatenate('spec_ui_expm_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! мес. дохода пула\nЕсли бум закончится, удар по показателю «[concept_spec_market_confidence]» будет в #N x[Country.MakeScope.Var(Concatenate('spec_ui_expx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|2]#! раза сильнее, чем для бума, в который банки не вкладывали"
 SPEC_NOTE_BANKS: ""
 SPEC_NOTE_BANKS_ON: " Банки активно кредитовали его, поэтому падение оказалось в #N x[SCOPE.GetValue('spec_note_bank')|2]#! раз сильнее."
 SPEC_H_BANK_LENT: "Куда банки давали кредиты"
 SPEC_H_BANK_LENT_TT: "#header Куда банки давали кредиты#!\n$TOOLTIP_DELIMITER$\n#italic Банки направляют новые кредиты в товары на подъёме.#!\n\nКрупные товары с более высоким показателем «[concept_spec_investor_interest]» получают больше денег\nКредит остаётся в своём товаре до погашения\n#N Если заканчивается бум, в который вложены кредиты#!, [concept_spec_market_confidence] падает сильнее\n$TOOLTIP_DELIMITER$\n#instruction Сдерживание спекуляций товаром вдвое сокращает новые кредиты в него.#!"
 SPEC_BANK_PIE: "Кредиты в бумы по товарам"
 SPEC_BANK_SLICE_NAME: "[SelectLocalization(Country.MakeScope.Var(Concatenate('spec_bank_oth_', Scope.GetGoods.GetKey)).IsSet, 'SPEC_BANK_OTHER', 'SPEC_BANK_GOOD_NAME')]"
 SPEC_BANK_GOOD_NAME: "[Scope.GetGoods.GetName]"
 SPEC_BANK_SLICE_SHARE: "[SelectLocalization(Country.MakeScope.Var(Concatenate('spec_bank_oth_', Scope.GetGoods.GetKey)).IsSet, 'SPEC_BANK_OTHER_SHARE', 'SPEC_BANK_GOOD_SHARE')]"
 SPEC_BANK_OTHER_SHARE: "#v [Divide_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_exp_booms'), Country.MakeScope.Var('spec_bank_top').GetValueWithDefault('(CFixedPoint)0')), Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_exp_booms'), '(CFixedPoint)0.001'))|%0]#!"
 SPEC_BANK_GOOD_SHARE: "#v [Divide_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_exp_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_exp_booms'), '(CFixedPoint)0.001'))|%0]#!"
 SPEC_BANK_SLICE_TT: "[SelectLocalization(Country.MakeScope.Var(Concatenate('spec_bank_oth_', Scope.GetGoods.GetKey)).IsSet, 'SPEC_BANK_OTHER_TT', 'SPEC_BANK_GOOD_TT')]"
 SPEC_BANK_GOOD_TT: "#header [Scope.GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\n#italic Сколько банковских денег вложено в этот бум.#!\n\nЗдесь #v [Country.MakeScope.Var(Concatenate('spec_exp_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%1]#! от всего показателя «[concept_spec_outstanding_credit]»\nЕсли бы его бум закончился, из-за этих кредитов [concept_spec_market_confidence] упала бы в #N x[Country.MakeScope.Var(Concatenate('spec_ui_expx_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)1')|2]#! раз сильнее"
 SPEC_BANK_NONE_S: "#grey Кредитов в бумы нет#!"
 SPEC_BANK_NONE: "В бумы ничего не вложено\nБанки кредитуют, только пока [concept_spec_market_confidence] выше #v 55#!, в основном в товары с уровнем #v Интерес#! и выше"
 SPEC_LHIST_EMPTY: "#grey Записывается каждый месяц, начиная с этого#!"
 SPEC_H_CREDIT_HISTORY: "История кредитного плеча"
 SPEC_H_CREDIT_HISTORY_TT: "#header История кредитного плеча#!\n$TOOLTIP_DELIMITER$\n#italic Насколько глубоко наши банки влезли в кредиты, месяц за месяцем.#!\n\n[concept_spec_leverage] за последние #v 36#! мес., новые справа\n#P Безопасно#! до #v 3#! мес.\n#v Рискованно#! до #v 8#!\n#N Опасно#! свыше #v 8#!\n\nБелая линия показывает наш лимит кредитования\nПравый край показывает, где начинается паника на каждом уровне"
 SPEC_H_CREDIT_HISTORY_RIGHT: "Сейчас #v [Country.MakeScope.ScriptValue('spec_lev')|1]#! мес."
