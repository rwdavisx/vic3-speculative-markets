 concept_spec_long_depression: "Долгая депрессия"
 concept_spec_long_depression_desc: "@spec_long_depression! $concept_spec_long_depression$ — это кризис всей мировой экономики. Она начинается, когда у страны со статусом «[concept_great_power]» начинается [concept_spec_financial_panic]. Затем она затрагивает все страны, где уже идёт паника, и распространяется по тесным связям: общий [concept_market], отношения сюзерена и подданных, права на инвестиции, крупная торговля и иностранная собственность.\n\nВо время мирового обвала (#v 4#! мес.) кредит замерзает, а [concept_spec_market_confidence] истощается.\nВо время депрессии (до #v 5#! лет) инвестиции, строительство и торговля замедляются, а часть попов переходит в ряды: [Concept('concept_radical','$concept_radicals|q$')].\nВо время восстановления (#v 1#! г.) $concept_spec_market_confidence$ возвращается.\n\nВаши решения ускоряют ваше собственное и мировое восстановление. Больше всего значат решения страны со статусом «$concept_great_power$»."
 je_spec_depression: "$SPEC_LD_NAME$"
 SPEC_LD_LONG: "Долгая депрессия"
 SPEC_LD_GREAT: "Великая депрессия"
 SPEC_LD_NAME: "[SelectLocalization(GreaterThan_CFixedPoint(GetGlobalVariable('spec_ld_count').GetValue, '(CFixedPoint)1'), 'SPEC_LD_GREAT', 'SPEC_LD_LONG')]"
 je_spec_depression_reason: "Паника на крупнейших биржах переросла в мировой кризис. Инвестиции и строительство замедлились, торговля сократилась, а безработные всё сильнее ропщут. [concept_spec_long_depression] завершится, когда мир восстановится, но не позднее чем через #v 5#! лет.\n\nНаши решения ускоряют восстановление нашей страны и всего мира. Наибольший вес имеют решения, которые принимают [Concept('concept_great_power','$concept_great_powers|q$')]. Когда наше восстановление завершится, [concept_spec_market_confidence] вернётся здесь раньше, чем в других странах."
