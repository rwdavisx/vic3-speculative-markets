 SPEC_H_COMPANIES: "Компании"
 SPEC_H_COMPANIES_TT: "#header $concept_companies$#!\n$TOOLTIP_DELIMITER$\n#italic Как настроение рынка по отношению к товару влияет на здания, которые его производят.#!\n\nПри высоком показателе «[concept_spec_investor_interest]» его здания получают #P больше#! [concept_throughput]\nПри низком интересе они получают #N меньше#!\nПосле завершения бума они получают #N ещё меньше#!, пока товар не восстановится\n[concept_company] зарабатывает больше, пока её товары пользуются спросом"
 SPEC_H_COMPANIES_RIGHT: "[GetDataModelSize(Country.GetCompanies)]  @spec_blue_chip! #v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!"
 SPEC_H_COMPANIES_RIGHT_TT: "#header @spec_company_strength! [concept_spec_company_strength]: #v [Country.MakeScope.ScriptValue('spec_log_kstr')|1]#!#!\n$TOOLTIP_DELIMITER$\n#italic Наш счёт в рейтинге «Дом великих компаний».#!\n\n#b Откуда он берётся#!\nМы складываем [concept_prosperity] всех наших компаний ($concept_companies$), и каждые #v 20#! дают #v 1#!\n[Concept('concept_spec_blue_chip','$concept_spec_blue_chips|q$')]: #v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!, каждая добавляет ещё #v 2#!\n#grey Больше компаний помогает только через их процветание#!"
 SPEC_CO_BC: "#P [concept_spec_blue_chip]#!, добавляет #v 2#! к нашему показателю «[concept_spec_company_strength]» и входит в наши «$concept_spec_blue_chips$»"
 SPEC_CO_BC_LOW: "  #N Слабеет#!, ниже #v 70#! ([concept_prosperity]) уже #v [Company.MakeScope.Var('spec_bc_low').GetValue|0]#! мес. из #v 3#!. При #v 3#! она перестаёт быть голубой фишкой"
 SPEC_CO_BC_CLIMB: "Получит статус «[concept_spec_blue_chip]», если [concept_prosperity] продержится на уровне #v 70#! или выше ещё #v [Subtract_CFixedPoint('(CFixedPoint)12', Company.MakeScope.Var('spec_bc_months').GetValue)|0]#! мес."
 SPEC_CO_COTY: "#P Компания года#!, самая процветающая в мире [concept_spec_blue_chip]"
 SPEC_CO_PROPPED: "  Под защитой и пока сохраняет статус, каков бы ни был показатель «[concept_prosperity]»"
 SPEC_CO_FRAGILE: "  #N Уязвима#!, поэтому один месяц, когда [concept_prosperity] ниже #v 70#!, лишает статуса"
 SPEC_CO_NONE: "#low У нас нет компаний#!"
 SPEC_BC_STRIP: "Голубые фишки"
 SPEC_BC_STRIP_N: "У нас: #v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!"
 SPEC_BC_STRIP_FX: "Защита от краха #P [Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)4.0')|0]%#!\nТяга в состязаниях #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)3.0')|0]%#!\nДоверие #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.417')|1]%#! в год"
 SPEC_BC_STRIP_TT: "#header $concept_spec_blue_chips$: #v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!#!\n$TOOLTIP_DELIMITER$\n#italic Наши самые надёжные и процветающие компании.#!\n\nКомпания становится голубой фишкой, если #v 12#! мес. подряд держит показатель «[concept_prosperity]» на уровне #v 70#! или выше\n\n#b Что они нам дают#!\n[concept_spec_market_confidence], теряемая при крахах и паниках: #P -[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)4.0')|0]%#! #grey (-4% за каждую)#!\nДоверие к бирже ([concept_spec_exchange]): #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.4167')|1]%#! от полной шкалы в год #grey (+0.4% за каждую)#!\nСостязания бирж ([concept_spec_exchange]): #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)3.0')|0]%#! в нашу сторону #grey (+3% за каждую)#!\nВклад капиталистов в [concept_investment_pool]: #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.6')|1]%#! #grey (+0.6% за каждую)#!\nПроценты по займам: #P -[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)1.0')|0]%#! #grey (-1% за каждую)#!\n#grey Первые 5 считаются полностью, следующие 5 наполовину. Каждая также добавляет #v 2#! к показателю «[concept_spec_company_strength]», нашему счёту на пути «Дом великих компаний»#!\n$TOOLTIP_DELIMITER$\n#b Если мы её теряем#!\nЭто происходит после #v 3#! мес. подряд ниже #v 70#! ([concept_prosperity])\nДоверие к бирже ([concept_spec_exchange]): #N -1.7%#! от полной шкалы\n[concept_spec_market_confidence]: #N -3#!\nМедвежий налёт на нас делает одну из них #N уязвимой#! на год. Тогда она перестаёт быть голубой фишкой уже после одного месяца ниже #v 70#! ([concept_prosperity]), а не #v 3#!\n\n#b Компания года#!\nЕсли наша компания самая процветающая в мире, мы получаем доверие к бирже ([concept_spec_exchange]) #P +2.5%#! от полной шкалы и [concept_prestige] #P +5%#! на год"
 SPEC_CO_TAG_COTY: "#P Компания года#!"
 SPEC_CO_TAG_LOW: "#N Слабеет [Company.MakeScope.Var('spec_bc_low').GetValue|0]/3#!"
 SPEC_CO_TAG_FRAGILE: "#N Уязвима#!"
 SPEC_CO_TAG_BC: "#P Голубая фишка#!"
 SPEC_CO_TAG_CLIMB: "#grey [Company.MakeScope.Var('spec_bc_months').GetValue|0]/12 мес.#!"
 SPEC_CO_PCT: "[Country.MakeScope.Var(Concatenate('spec_ui_co_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|+=0]%"
 SPEC_CO_TT_HEAD: "#header [concept_spec_investor_interest]#!"
 SPEC_CO_LINE: "[Goods.GetName]: [SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_CO_W1', SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_CO_W2', SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_CO_W3', SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)4'), 'SPEC_CO_W4', SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)5'), 'SPEC_CO_W5', SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)6'), 'SPEC_CO_W6', 'SPEC_CO_W0'))))))], [concept_throughput] [Multiply_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_co_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.01')|+=%0]"
 SPEC_CO_ENC: "  Поощрение инвестиций: [concept_throughput] #P +10%#!"
 SPEC_CO_RES: "  Сдерживание спекуляций: [concept_throughput] #N -10%#!"
 SPEC_CO_GLUT: "  @warning! #N [Goods.GetName]: восстановление#!: [concept_throughput] #N [Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_company_tie'), Select_CFixedPoint(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), '(CFixedPoint)-0.025', Select_CFixedPoint(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), '(CFixedPoint)-0.05', Select_CFixedPoint(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), '(CFixedPoint)-0.1', '(CFixedPoint)0'))))|%0]#! на #v [Select_CFixedPoint(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), '(CFixedPoint)3', Select_CFixedPoint(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), '(CFixedPoint)6', Select_CFixedPoint(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), '(CFixedPoint)12', '(CFixedPoint)0')))|0]#! мес."
