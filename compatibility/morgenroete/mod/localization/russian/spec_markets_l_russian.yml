 spec_panic_movements: "Недоверие к рынкам"
 spec_panic_movements_desc: "После паники многие требуют, чтобы государство обуздало рынки. [Concept('concept_political_movement','$concept_political_movements|q$')], выступающие против закона «[GetLawType('law_laissez_faire').GetName]», обретают новых сторонников. Со временем этот эффект слабеет."
 spec_mania_movements: "Вера в рынки"
 spec_mania_movements_desc: "Долгий бум убедил многих, что рынки лучше оставить в покое. [Concept('concept_political_movement','$concept_political_movements|q$')], поддерживающие закон «[GetLawType('law_laissez_faire').GetName]», обретают новых сторонников. Со временем этот эффект слабеет."
 SPEC_DRIVER_DEBT: "Государственный долг"
 SPEC_DRIVER_DEBT_TT: "#header Государственный долг: [GetPlayer.MakeScope.Var('spec_c_debt').GetValue|+=2]#!\n$TOOLTIP_DELIMITER$\n[concept_credit], использовано: #v [GetPlayer.MakeScope.ScriptValue('spec_debt_share')|%0]#! ([concept_principal])\nИнвесторы допускают до #v 50%#!\n$TOOLTIP_DELIMITER$\nКаждые #v 10%#! сверх этого снижают [concept_spec_market_confidence] на #v 0.2#! в месяц, но не более чем на #N -1#!."
