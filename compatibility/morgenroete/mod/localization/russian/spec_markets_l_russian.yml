 SPEC_PLEDGE_MAKE_TT: "#header Обязательство спасать банки#!\n$TOOLTIP_DELIMITER$\n#italic Государство обещает спасать банки всякий раз, когда они попадают в беду.#!\n\n#P Каждая#! [concept_spec_financial_panic] сразу получает спасение, на #P 25%#! дешевле, пока [concept_treasury] может платить из резервов и мы не в состоянии «[concept_default]»\nДоверие, которое наша биржа ([concept_spec_exchange]) теряет при панике: #P -50%#!\nПриток капитала ([concept_spec_capital_flight]): #P +50%#!\n#N Каждое спасение#! ослабляет стандарты кредитования\n$TOOLTIP_DELIMITER$\n#N Если мы объявим#! [concept_default], обязательство рушится и всё доверие теряется. [concept_spec_market_confidence] #N -15#!, [concept_legitimacy] #N -10#! на #v 5#! лет\n#weak Отзыв обязательства требует предупреждения за#! #v 24#! #weak мес.#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_pledge').IsValid(GuiScope.SetRoot(Country.MakeScope).End)), 'SPEC_PLEDGE_PLEDGE_WHY')]"
 SPEC_PLEDGE_OUT_TT: "#header $SPEC_PLEDGE_OUT$#!\n$TOOLTIP_DELIMITER$\nНачинает отсчёт #v 24#! мес. до конца обязательства. Пока срок не истёк, обязательство действует и каждая паника по-прежнему получает спасение.\n\n#b Обязательство, от которого мы отказываемся#!\n#italic Государство обещает спасать банки всякий раз, когда они попадают в беду.#!\n\n#P Каждая#! [concept_spec_financial_panic] сразу получает спасение, на #P 25%#! дешевле, пока [concept_treasury] может платить из резервов и мы не в состоянии «[concept_default]»\nДоверие, которое наша биржа ([concept_spec_exchange]) теряет при панике: #P -50%#!\nПриток капитала ([concept_spec_capital_flight]): #P +50%#!\n#N Каждое спасение#! ослабляет стандарты кредитования\n$TOOLTIP_DELIMITER$\n#N Если мы объявим#! [concept_default], обязательство рушится и всё доверие теряется. [concept_spec_market_confidence] #N -15#!, [concept_legitimacy] #N -10#! на #v 5#! лет\n#weak Отзыв обязательства требует предупреждения за#! #v 24#! #weak мес.#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_pledge_leave').IsValid(GuiScope.SetRoot(Country.MakeScope).End)), 'SPEC_PLEDGE_PLEDGE_LEAVE_WHY')]"
