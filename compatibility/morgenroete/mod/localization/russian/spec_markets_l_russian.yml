 SPEC_LAXL_HERE: "\n\n#P Мы здесь#!"
 SPEC_LAXL_0_TT: "#header Строгие#!\n$TOOLTIP_DELIMITER$\n#italic Банки почти не кредитуют. Бумы остаются малыми и заканчиваются мягко.#!\n\n#b По сравнению с #v Надёжные#!:#!\nКредиты в месяц: от #v -25%#! до #v -15%#!\nДоля, идущая в бумы: от #P -50%#! до #P -30%#!\nСтоимость спасения банков: от #P -50%#! до #P -30%#!\n\n#P Наша биржа ([concept_spec_exchange]) набирает доверие в спокойные месяцы#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.2')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_1_TT: "#header Осторожные#!\n$TOOLTIP_DELIMITER$\n#italic Банки кредитуют осторожно.#!\n\n#b По сравнению с #v Надёжные#!:#!\nКредиты в месяц: от #v -15%#! до #v -5%#!\nДоля, идущая в бумы: от #P -30%#! до #P -10%#!\nСтоимость спасения банков: от #P -30%#! до #P -10%#!\n\n#P Наша биржа ([concept_spec_exchange]) набирает доверие в спокойные месяцы#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.2'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.4')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_2_TT: "#header Надёжные#!\n$TOOLTIP_DELIMITER$\n#italic Обычный уровень.#!\n\n#b По сравнению с #v Надёжные#!:#!\nКредиты в месяц: от #v -5%#! до #v +5%#!\nДоля, идущая в бумы: от #P -10%#! до #N +10%#!\nСтоимость спасения банков: от #P -10%#! до #N +10%#!\n\n#P Наша биржа ([concept_spec_exchange]) набирает доверие в спокойные месяцы#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.4'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.6')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_3_TT: "#header Слабые#!\n$TOOLTIP_DELIMITER$\n#italic Банки легко дают в долг и гонятся за бумами.#!\n\n#b По сравнению с #v Надёжные#!:#!\nКредиты в месяц: от #v +5%#! до #v +15%#!\nДоля, идущая в бумы: от #N +10%#! до #N +30%#!\nСтоимость спасения банков: от #N +10%#! до #N +30%#!\n\n#N Наша биржа ([concept_spec_exchange]) перестаёт набирать доверие#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.6'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.8')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_4_TT: "#header Безрассудные#!\n$TOOLTIP_DELIMITER$\n#italic Банки дают в долг кому угодно. Бумы разогреваются и тяжело заканчиваются.#!\n\n#b По сравнению с #v Надёжные#!:#!\nКредиты в месяц: от #v +15%#! до #v +25%#!\nДоля, идущая в бумы: от #N +30%#! до #N +50%#!\nСтоимость спасения банков: от #N +30%#! до #N +50%#!\n\n#N Наша биржа ([concept_spec_exchange]) перестаёт набирать доверие#![AddLocalizationIf(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.8'), 'SPEC_LAXL_HERE')]"
 SPEC_EFFECT_LAX: "Стандарты кредитования"
 SPEC_EFFECT_LAX_VALUE: "#v [SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.2'), 'SPEC_LAXW_0', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.4'), 'SPEC_LAXW_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.6'), 'SPEC_LAXW_2', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.8'), 'SPEC_LAXW_3', 'SPEC_LAXW_4'))))]#!"
 SPEC_EFFECT_LAX_TT: "#header @spec_lending_standards! [concept_spec_lending_standards]: $SPEC_EFFECT_LAX_VALUE$#!\n$TOOLTIP_DELIMITER$\n#italic Насколько осторожно кредитуют наши банки. Беспечные банки дают больше кредитов, но их бумы завершаются тяжелее.#!\n\n#b По сравнению с обычным уровнем (#v Надёжные#!)#!\n#v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_credit'), '(CFixedPoint)1')|+%0]#! к кредитам за месяц\n#v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_pull'), '(CFixedPoint)1')|+%0]#! к обычной доле этих кредитов, идущей в бумы\n#v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_cost'), '(CFixedPoint)1')|+%0]#! к стоимости спасения банков\n\n#b Как они меняются#!\n#N Слабеют#! понемногу каждый спокойный месяц (от #v Строгие#! до #v Безрассудные#! примерно за #v 20#! лет)\n#N Сильно слабеют#! после каждого спасения банков\n#P Ужесточаются#! при завершении бума или когда мы сдерживаем бум\n#P Сильно ужесточаются#!, когда [concept_spec_financial_panic] заканчивается без спасения банков\n$TOOLTIP_DELIMITER$\n#instruction Выберите для показателя «[concept_spec_credit_policy]» вариант #v Жёсткая#!, чтобы они перестали слабеть. Паника или плохие долги тоже приостанавливают ослабление. Уровень #v Надёжные#! или строже также укрепляет доверие к нашей бирже ([concept_spec_exchange]).#!"
 SPEC_TILE_CYCLE: "[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_overx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_OVER_ON', 'SPEC_GOODS_NONE')][SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_bb_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_TILE_BB_ON', 'SPEC_GOODS_NONE')]"
 SPEC_TILE_OVER_ON: "\n\n#title Перепроизводство:#! предложение выросло на #v [Country.MakeScope.Var(Concatenate('spec_ui_over_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! с начала этого бума\nЕсли бум закончится, удар по показателю «[concept_spec_market_confidence]» будет в #N x[Country.MakeScope.Var(Concatenate('spec_ui_overx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|2]#! раза сильнее"
 SPEC_TILE_BB_ON: "\n\n#title Строительство на буме:#! #P +[Country.MakeScope.Var(Concatenate('spec_ui_bb_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! к эффективности строительства для этой отрасли, пока интерес инвесторов так высок"
 SPEC_NOTE_CYCLE: "[SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)2.5'), 'SPEC_NOTE_PPL_3', SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)1.5'), 'SPEC_NOTE_PPL_2', SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)0.5'), 'SPEC_NOTE_PPL_1', 'SPEC_GOODS_NONE')))]"
 SPEC_NOTE_OVER_ON: " За время бума было построено столько, что падение оказалось тяжелее: #N x[SCOPE.GetValue('spec_note_over')|2]#!."
 SPEC_NOTE_PPL_1: " Убытки понесли рабочие, владевшие этой отраслью, а некоторые из них в областях, где она находится, перешли в разряд: [Concept('concept_radical', '$concept_radicals|q$')]."
 SPEC_NOTE_PPL_2: " Убытки понесли её владельцы, а некоторые из них в областях, где она находится, перешли в разряд: [Concept('concept_radical', '$concept_radicals|q$')]."
 SPEC_NOTE_PPL_3: " Убытки понесли её владельцы и простые вкладчики, а многие из них в областях, где она находится, перешли в разряд: [Concept('concept_radical', '$concept_radicals|q$')]."
