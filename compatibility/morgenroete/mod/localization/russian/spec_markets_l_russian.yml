 SPEC_SEP_KEEN_TT: "#header @spec_interest_keen! [concept_spec_investor_interest]: Интерес#!\nДоля нашей торговли: #v [Country.MakeScope.Var('spec_heat_4').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#italic Насколько инвесторы увлечены этим товаром.#!\n\n[concept_throughput] производителей: #P +3%#!\nКогда бум закончится: [concept_spec_correction]"
 SPEC_SEP_CALM_TT: "#header @spec_interest_calm! [concept_spec_investor_interest]: Спокойствие#!\nДоля нашей торговли: #v [Country.MakeScope.Var('spec_heat_3').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#italic Насколько инвесторы увлечены этим товаром.#!\n\nНа этом уровне ничего не происходит"
 SPEC_SEP_DOUBTFUL_TT: "#header @spec_interest_doubtful! [concept_spec_investor_interest]: Сомнения#!\nДоля нашей торговли: #v [Country.MakeScope.Var('spec_heat_2').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#italic Насколько инвесторы увлечены этим товаром.#!\n\n[concept_throughput] производителей: #N -5%#!\nПосле завершения бума товар на время остаётся на этом уровне или ниже, чтобы восстановиться"
 SPEC_SEP_FLEEING_TT: "#header @spec_interest_fleeing! [concept_spec_investor_interest]: Отток#!\nДоля нашей торговли: #v [Country.MakeScope.Var('spec_heat_1').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#italic Насколько инвесторы увлечены этим товаром.#!\n\n[concept_throughput] производителей: #N -10%#!\nЕсли бум уровня #v Лихорадка#! падает так низко, наступает [concept_spec_collapse]"
 SPEC_IB_TURNING_TT: "#header Перелом бума#!\n$TOOLTIP_DELIMITER$\n#italic Товар «[Goods.GetName]» пережил крупный бум, и он угасает.#!\n\nЕсли [concept_spec_investor_interest] продолжит падать, наступит [concept_spec_collapse]\nЭто обойдётся примерно в #N [Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! уверенности ([concept_spec_market_confidence])"
 SPEC_IB_HEAT_TT: "#header @spec_investor_interest! [concept_spec_investor_interest]: [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n$SPEC_TILE_BODY$"
 SPEC_TILE_NEXT: "[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)6'), 'SPEC_TILE_DANGER', 'SPEC_IB_EMPTY')]"
 SPEC_IB_EMPTY: ""
