l_french:
 INVESTMENT_POOL_CHANGE: "[GetPlayer.GetInvestmentPoolChangeFromConstructionDesc]\n[GetPlayer.GetInvestmentPoolChangeFromInvestmentDesc][SelectLocalization(GreaterThan_CFixedPoint(GetPlayer.MakeScope.Var('spec_credit_given').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_POOL_CREDIT', 'SPEC_POOL_NONE')][SelectLocalization(And(GreaterThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_in_panic'), '(CFixedPoint)0'), GreaterThan_CFixedPoint(GetPlayer.MakeScope.Var('spec_clawed').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0')), 'SPEC_POOL_RECALL', 'SPEC_POOL_NONE')][SelectLocalization(GetPlayer.MakeScope.Var('spec_crunch').IsSet, 'SPEC_POOL_BAD', 'SPEC_POOL_NONE')]"
 SPEC_POOL_CREDIT: "\n#v @money![GetPlayer.MakeScope.Var('spec_credit_given').GetValueWithDefault('(CFixedPoint)0')|+D]#! grâce au crédit bancaire ce mois-ci"
 SPEC_POOL_RECALL: "\n#N @money!-[GetPlayer.MakeScope.Var('spec_clawed').GetValueWithDefault('(CFixedPoint)0')|D]#! en raison des prêts rappelés pendant la [concept_spec_financial_panic]"
 SPEC_POOL_BAD: "\n#N -[GetPlayer.MakeScope.ScriptValue('spec_crunch_invest_pct')|0] %#! d’investissement en raison des [concept_spec_bad_debts], s’estompant sur #v [GetPlayer.MakeScope.ScriptValue('spec_crunch_months')|0]#! mois"
 SPEC_POOL_NONE: ""
