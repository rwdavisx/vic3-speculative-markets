 setting_spec_impact_standard_desc: "Effets sur votre économie ([Concept('concept_spec_leverage', '$concept_spec_leverage|q$')], [Concept('concept_spec_financial_panic', '$concept_spec_financial_panics|q$')]) tels que le mod les prévoit"
 setting_spec_impact_strong: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_spec_impact_strong_desc #high Fort#!#!#!"
 setting_spec_impact_strong_desc: "Effets accrus sur votre économie ([Concept('concept_spec_leverage', '$concept_spec_leverage|q$')], [Concept('concept_spec_financial_panic', '$concept_spec_financial_panics|q$')]), environ trois cinquièmes de plus"
