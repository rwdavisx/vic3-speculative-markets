 setting_spec_volatility_historical_desc: "Les essors spéculatifs et les [Concept('concept_spec_financial_panic', '$concept_spec_financial_panics|q$')] surviendront à peu près aussi souvent qu’au XIXe siècle"
 setting_spec_volatility_heightened: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_spec_volatility_heightened_desc #high Élevée#!#!#!"
 setting_spec_volatility_heightened_desc: "Les essors spéculatifs seront plus forts et se termineront plus brutalement, et les [Concept('concept_spec_financial_panic', '$concept_spec_financial_panics|q$')] surviendront plus souvent qu’au XIXe siècle"
 rule_spec_market_impact: "Impact du marché"
