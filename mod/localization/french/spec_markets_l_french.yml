 spec_rival.1.d3n_big: "La grande Bourse de #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! nous a enfin remarqués, et ce qu’elle voit ne lui plaît guère.\n\nLes journaux de #v [SCOPE.sCountry('target').GetName]#! étaient pleins de doutes sur notre [concept_spec_exchange]. Mais un commis a parlé, et tout le monde sait désormais quel argent a payé l’encre.\n\nNous perdons de la réputation, mais eux aussi, et leur nom en souffre à l’étranger."
 spec_rival.1.d3n_even: "Depuis des années, les Bourses de #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! et de #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! se tournent autour. Ce n’était qu’une question de temps.\n\nLes journaux de #v [SCOPE.sCountry('target').GetName]#! étaient pleins de doutes sur notre [concept_spec_exchange]. Mais un commis a parlé, et tout le monde sait désormais quel argent a payé l’encre.\n\nNous perdons de la réputation, mais eux aussi, et leur nom en souffre à l’étranger."
 spec_rival.1.d3n_small: "Les parvenus de #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! ont décidé qu’il fallait rabattre le caquet de #v [ROOT.GetCountry.GetCapital.GetCityHubName]#!.\n\nLes journaux de #v [SCOPE.sCountry('target').GetName]#! étaient pleins de doutes sur notre [concept_spec_exchange]. Mais un commis a parlé, et tout le monde sait désormais quel argent a payé l’encre.\n\nNous perdons de la réputation, mais eux aussi, et leur nom en souffre à l’étranger."
 spec_rival.1.desc: "Une concurrente s’en est prise à notre [concept_spec_exchange]."
 SPEC_RV_RAID_TT: "#header Attaque à la baisse#!\n$TOOLTIP_DELIMITER$\n#italic Nos courtiers bradent d’un coup les titres de [Country.GetNameNoFormatting] pour faire plonger leur marché.#!\n$TOOLTIP_DELIMITER$\n#b Si elle réussit#!\n[concept_spec_market_confidence] de [Country.GetNameNoFormatting] : #P -[Multiply_CFixedPoint('(CFixedPoint)3', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|0]#! sur #v 6#! mois\nDuel : #P 10 %#! en notre faveur\n\n#b Si elle échoue#! (#N [Min_CFixedPoint('(CFixedPoint)80', Add_CFixedPoint('(CFixedPoint)20', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint('(CFixedPoint)0', Divide_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, GetPlayer.MakeScope.Var('spec_centre_score').GetValue), Max_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|0] %#! de risque)\nNotre [concept_spec_market_confidence] : #N -3#! sur #v 6#! mois\nDuel : #N 10 %#! en leur faveur\n$TOOLTIP_DELIMITER$\nCoût : #N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#! pris sur notre [concept_treasury]\nDélai : #v 1 an#! contre [Country.GetNameNoFormatting][AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_raid').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_RAID')]"
 SPEC_RV_WHY_RV_RAID: "\n\n[GetScriptedGui('spec_sgui_rv_raid').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_LURE_TT: "#header Attirer les capitaux#!\n$TOOLTIP_DELIMITER$\n#italic Nos banquiers séduisent les investisseurs de [Country.GetNameNoFormatting] avec de meilleures conditions.#!\n$TOOLTIP_DELIMITER$\n#P [Multiply_CFixedPoint('(CFixedPoint)0.05', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|%0]#! des revenus du [concept_investment_pool] de [Country.GetNameNoFormatting] nous reviennent pendant #v 12#! mois\nDuel : #P 10 %#! en notre faveur\n$TOOLTIP_DELIMITER$\nCoût : #N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_lure_debt_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#! ajoutés à notre [concept_spec_outstanding_credit]\nDélai : #v 1 an#! contre [Country.GetNameNoFormatting][AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_lure').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_LURE')]"
 SPEC_RV_WHY_RV_LURE: "\n\n[GetScriptedGui('spec_sgui_rv_lure').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_PRESS_TT: "#header Campagne de presse#!\n$TOOLTIP_DELIMITER$\n#italic Des journaux amis remplissent leurs pages de doutes sur la [concept_spec_exchange] de [Country.GetNameNoFormatting].#!\n$TOOLTIP_DELIMITER$\n#b Si elle réussit#!\nRéputation de la [concept_spec_exchange] de [Country.GetNameNoFormatting] : #P -[Multiply_CFixedPoint('(CFixedPoint)0.0167', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|%0]#!\nDuel : #P 10 %#! en notre faveur\n\n#b Si elle est démasquée#! (#N [Country.MakeScope.ScriptValue('spec_rv_press_expose')|0] %#! de risque, plus élevé là où la presse de [Country.GetNameNoFormatting] est libre)\n[concept_relations] avec [Country.GetNameNoFormatting] : #N -20#!\nRéputation de notre [concept_spec_exchange] : #N -1.7 %#!\nDuel : #N 10 %#! en leur faveur\n$TOOLTIP_DELIMITER$\nCoût : [concept_influence] #N -75#! @inf! pendant #v 12#! mois\nDélai : #v 1 an#! contre [Country.GetNameNoFormatting][AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_press').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_PRESS')]"
 SPEC_RV_WHY_RV_PRESS: "\n\n[GetScriptedGui('spec_sgui_rv_press').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_HOLD_TT: "#header Tenir bon#!\n$TOOLTIP_DELIMITER$\n#italic Nous rachetons ce que [Country.GetNameNoFormatting] a vendu et stabilisons notre côté du duel.#!\n$TOOLTIP_DELIMITER$\nAnnule une poussée de [Country.GetNameNoFormatting], ce qui ramène le duel de #P 10 %#! en notre faveur\nLeurs poussées contre nous en ce moment : #v [Country.MakeScope.Var('spec_rv_ui_them').GetValue|0]#!\n$TOOLTIP_DELIMITER$\nCoût : #N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#! pris sur notre [concept_treasury]\nDélai : #v 1 an#! contre [Country.GetNameNoFormatting][AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_hold').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_HOLD')]"
 SPEC_RV_WHY_RV_HOLD: "\n\n[GetScriptedGui('spec_sgui_rv_hold').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_SHORE_TT: "#header Soutenir#!\n$TOOLTIP_DELIMITER$\n#italic Nos banques serrent les rangs contre [Country.GetNameNoFormatting].#!\n$TOOLTIP_DELIMITER$\nLes actions de [Country.GetNameNoFormatting] contre nous n’ont que la #P moitié#! de leur effet pendant #v 12#! mois\n$TOOLTIP_DELIMITER$\nCoût : #N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#! pris sur notre [concept_treasury]\nDélai : #v 2 ans#! contre [Country.GetNameNoFormatting][AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_shore').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_SHORE')]"
 SPEC_RV_WHY_RV_SHORE: "\n\n[GetScriptedGui('spec_sgui_rv_shore').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
