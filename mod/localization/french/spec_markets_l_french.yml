 spec_panic_risk_alert_setting_name: "Risque de panique"
 alert_spec_panic_risk_alert_desc: "Si tous nos essors prenaient fin en même temps, la [concept_spec_market_confidence] tomberait à #N [GetPlayer.MakeScope.ScriptValue('spec_after_collapse')|0]#!.\nUne [concept_spec_financial_panic] éclate sous #v [GetPlayer.MakeScope.ScriptValue('spec_panic_at')|0]#!."
 alert_spec_panic_risk_alert_hint: "Pour réduire le risque, freiner la spéculation sur les biens les plus menacés ou resserrer la [concept_spec_credit_policy]. Les deux se trouvent dans l’onglet #bold $SPEC_FIN_TAB_BANKING$#! de la fenêtre #bold $SPEC_FINANCE$#!."
 alert_spec_panic_risk_alert_action: "Journal"
 alert_spec_bubble_alert_name: "Excès spéculatif"
 spec_bubble_alert_setting_name: "Excès spéculatif"
 alert_spec_bubble_alert_desc: "Notre [concept_spec_speculative_excess] est de #v [GetPlayer.MakeScope.Var('spec_heat').GetValue|0]#!. C’est la bulle.\n\n#N Éclate#! si la [concept_spec_market_confidence] passe sous #v 60#!\nSi elle éclatait maintenant : #N -[GetPlayer.MakeScope.ScriptValue('spec_burst_now')|0]#! de $concept_spec_market_confidence$ d’un coup"
 alert_spec_bubble_alert_hint: "Pour la dégonfler en douceur, freiner les biens en essor ou resserrer la [concept_spec_credit_policy].\n#P Grossit#! tant que la [concept_spec_market_confidence] est à #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! ou plus\n#v Dégonfle#! lentement tant qu’elle est entre #v 60#! et #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!"
 alert_spec_bubble_alert_action: "Journal"
 alert_spec_rescue_alert_name: "Sauvetage bancaire possible"
 spec_rescue_alert_setting_name: "Sauvetage bancaire possible"
 alert_spec_rescue_alert_desc: "Une [concept_spec_financial_panic] est en cours, et nous n’avons pas encore prêté aux banques."
 alert_spec_rescue_alert_hint: "Utiliser #v Prêter aux banques#! dans l’onglet #bold $SPEC_FIN_TAB_BANKING$#! de la fenêtre #bold $SPEC_FINANCE$#!. Une fois par panique.\n#P Met fin#! plus tôt à la panique\n#P Réduit de moitié#! ses pénalités pour les mois restants\n[concept_spec_market_confidence] #P +20#!\n\n#weak Ne réduit pas les versements de $spec_panic_relief$, n’efface pas les [concept_spec_bad_debts] et ne ramène pas les gens déjà radicalisés#!"
 alert_spec_rescue_alert_action: "Journal"
