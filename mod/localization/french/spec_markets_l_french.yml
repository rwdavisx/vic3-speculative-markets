 spec_coty_desc: "La [concept_spec_blue_chip] la plus prospère du monde est la nôtre cette année"
 spec_bc_index: "Indice des Blue Chips"
 spec_bc_index_desc: "Nos [concept_spec_blue_chip] attirent l’épargne vers le marché et rendent les prêts moins chers. Chacune le renforce. Les 5 premières comptent en entier, et les suivantes jusqu’à 10 comptent à moitié."
 spec_bluechip.1.t: "Une nouvelle valeur de premier ordre"
 spec_bluechip.1.d: "Après une année de profits réguliers, [SCOPE.sCompany('spec_bc_co').GetName] compte désormais parmi les valeurs de premier ordre. Toutes les banques et toutes les veuves du pays recherchent ses actions, et les courtiers se demandent si elle se contentera de son rang ou si elle demandera davantage au marché."
 spec_bluechip.1.f: "Sûre comme la Banque, dit-on."
 spec_bluechip.1.a: "Sonner la cloche en son honneur"
 spec_bluechip.1.a.tt: "Réputation de notre [concept_spec_exchange] : #P +2 %#!"
 spec_bluechip.1.b: "La laisser émettre de nouvelles actions"
 spec_bluechip.1.b.tt: "Notre [concept_investment_pool] : #P +[ROOT.GetCountry.MakeScope.ScriptValue('spec_bc_shares')|D]#! @money!\n[SCOPE.sCompany('spec_bc_co').GetName] devient fragile pendant #v 5#! ans, donc un seul mois sous #v 70#! de [concept_prosperity] suffit pour qu’elle ne soit plus une valeur de premier ordre"
 spec_bluechip.2.t: "Une valeur de premier ordre chancelle"
 spec_bluechip.2.d: "[SCOPE.sCompany('spec_bc_co').GetName] est passée sous le seuil d’une valeur de premier ordre. Si ses profits ne se redressent pas d’ici 3 mois, le marché la rayera de la liste, et notre Bourse s’en ressentira."
 spec_bluechip.2.f: "Une maison debout depuis une génération peut tomber en une saison."
 spec_bluechip.2.a: "La soutenir"
 spec_bluechip.2.a.tt: "Coût : #N [ROOT.GetCountry.MakeScope.ScriptValue('spec_bc_prop_cost')|D]#! @money!\n[SCOPE.sCompany('spec_bc_co').GetName] garde son statut pendant #v 12#! mois, quels que soient ses profits"
 spec_bluechip.2.b: "Laisser le marché décider"
 spec_bluechip.2.b.tt: "Si elle reste sous le seuil pendant #v 3#! mois :\nRéputation de notre [concept_spec_exchange] : #N -2 %#!\n[concept_spec_market_confidence] : #N -3#!"
 spec_bluechip.3.t: "Compagnie de l’année"
 spec_bluechip.3.d: "La presse financière de toutes les capitales s’accorde à dire que [SCOPE.sCompany('spec_bc_co').GetName] est la compagnie la plus prospère du monde cette année. Notre Bourse se pare de sa gloire."
 spec_bluechip.3.f: "Chaque commis de la City en veut une part."
 spec_bluechip.3.a: "Un jour de fierté"
 spec_bluechip.3.a.tt: "Réputation de notre [concept_spec_exchange] : #P +2 %#!\n$spec_coty$ pendant un an : [concept_prestige] #P +5 %#!"
