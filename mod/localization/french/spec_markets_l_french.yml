 spec_rival.1.t11: "Attaque à la baisse sur #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! !"
 spec_rival.1.d11: "Avant la cloche d’ouverture, des courtiers agissant pour #v [SCOPE.sCountry('target').GetName]#! ont jeté d’un coup sur le parquet de gros paquets de nos actions ferroviaires et bancaires. Les cours ont cédé, les téléscripteurs ont pris du retard, et à midi nos propres commis vendaient dans la panique.\n\nNotre [concept_spec_market_confidence] baissera de #N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#! sur 6 mois."
 spec_rival.1.f11: "« Une ruée sur le marché peut naître d’une simple rumeur. »"
 spec_rival.1.t10: "L’attaque qui a échoué"
 spec_rival.1.d10: "Des courtiers agissant pour #v [SCOPE.sCountry('target').GetName]#! ont jeté d’un coup nos actions sur le parquet, escomptant une débâcle. Au lieu de cela, nos banques ont acheté chaque lot proposé, les cours ont tenu, et à la cloche de clôture, c’étaient les assaillants qui pansaient leurs pertes.\n\nLeur propre [concept_spec_market_confidence] baisse de #P 3#! sur 6 mois."
 spec_rival.1.f10: "\"L’ours qui vend ce qu’il ne possède pas a intérêt à avoir raison.\""
 spec_rival.1.t21: "On courtise nos capitaux"
 spec_rival.1.d21: "Des agents de #v [SCOPE.sCountry('target').GetName]#! ont pris des chambres dans nos plus beaux hôtels, et nos plus gros investisseurs dînent avec eux chaque soir. Leur offre est simple, un meilleur taux, un port plus sûr et pas de questions gênantes.\n\nPendant 12 mois, #N [GetPlayer.MakeScope.Var('spec_rv_lure_share').GetValue|%0]#! des revenus de notre [concept_investment_pool] leur reviennent."
 spec_rival.1.f21: "\"Le capital va là où on le traite bien, et reste là où on le nourrit bien.\""
 spec_rival.1.t31: "Une campagne de rumeurs"
 spec_rival.1.d31: "Les journaux du matin de #v [SCOPE.sCountry('target').GetName]#! publient de longues colonnes sur des bilans falsifiés et des banques chancelantes à #v [ROOT.GetCountry.GetCapital.GetCityHubName]#!. Aucune n’est signée et peu sont vraies, mais on les lit dans tous les comptoirs du continent.\n\nNotre [concept_spec_exchange] perd #N [Multiply_CFixedPoint('(CFixedPoint)0.0167', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|%0]#! de réputation."
 spec_rival.1.f31: "\"Un mensonge fait le tour du monde pendant que la vérité enfile encore ses bottes.\""
 spec_rival.1.t3n: "Une campagne payée démasquée"
 spec_rival.1.d3n: "Les journaux de #v [SCOPE.sCountry('target').GetName]#! étaient pleins de doutes sur notre [concept_spec_exchange]. Mais un commis a parlé, et tout le monde sait désormais quel argent a payé l’encre.\n\nNous perdons de la réputation, mais eux aussi, et leur nom en souffre à l’étranger."
 spec_rival.1.f3n: "\"La boue lancée dans l’ombre salit tout de même les mains.\""
 spec_rival.1.t: "Une concurrente s’en prend à nous"
 spec_rival.1.f: "« Une ruée sur le marché peut naître d’une simple rumeur. »"
 spec_rival.1.a: "Leur rendre la monnaie de leur pièce."
 spec_rival.1.a_tt: "Nous leur en faisons autant, même si nous l’avons fait cette année."
 spec_rival.1.a_1: "#v Attaque à la baisse#! contre eux :"
 spec_rival.1.a_2: "#v Attirer leurs capitaux#! :"
 spec_rival.1.a_3: "#v Campagne de presse#! contre eux :"
 spec_rival.1.b: "Serrer les rangs contre eux."
 spec_rival.1.b_tt: "Pendant 12 mois, leurs actions contre nous ont moitié moins d’effet. Coûte @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]."
 spec_rival.1.c: "Continuer comme si de rien n’était."
 spec_rival.1.c_tt: "Notre [concept_spec_exchange] gagne #P [Multiply_CFixedPoint('(CFixedPoint)0.01', Add_CFixedPoint('(CFixedPoint)1', Multiply_CFixedPoint('(CFixedPoint)1', SCOPE.sCountry('target').MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'))))|%0]#! de réputation pour avoir gardé son sang-froid. Plus la Bourse que nous ignorons est grande, plus cela compte."
 spec_rival.1.d: "Acheter dans la panique."
 spec_rival.1.d_tt: "Nos banques achètent ce que vendent les attaquants. L’attaque coûte #P moitié#! moins de [concept_spec_market_confidence]. Coûte #N @money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rv_counter_cost')|D]#! (#v 1 %#! de notre PIB)."
 spec_rival.1.e: "S’aligner sur leurs conditions."
 spec_rival.1.e_tt: "Nous payons nos investisseurs pour qu’ils restent. Ils prennent #P moitié#! moins de notre [concept_investment_pool]. Coûte #N @money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rv_counter_cost')|D]#! (#v 1 %#! de notre PIB)."
 spec_rival.1.g: "Répondre dans nos propres journaux."
 spec_rival.1.g_tt: "Nos journaux publient les chiffres. Notre [concept_spec_exchange] regagne #P 1 %#! de réputation. Coûte #N @money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rv_counter_cost')|D]#! (#v 1 %#! de notre PIB)."
 SPEC_DRIVER_RIVAL: "Actions des concurrentes"
 SPEC_DRIVER_RIVAL_TT: "#header Coups des concurrentes : [Country.MakeScope.Var('spec_c_rival').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#italic L’attaque à la baisse d’une concurrente contre notre marché, étalée sur six mois.#!\n#instruction Les attaques peuvent nous coûter au plus #v 4#! de confiance par an, quel que soit leur nombre.#!"
 spec_rival.1.d11_big: "La grande Bourse de #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! nous a enfin remarqués, et ce qu’elle voit ne lui plaît guère.\n\nAvant la cloche d’ouverture, des courtiers agissant pour #v [SCOPE.sCountry('target').GetName]#! ont jeté d’un coup sur le parquet de gros paquets de nos actions ferroviaires et bancaires. Les cours ont cédé, les téléscripteurs ont pris du retard, et à midi nos propres commis vendaient dans la panique.\n\nNotre [concept_spec_market_confidence] baissera de #N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#! sur 6 mois."
 spec_rival.1.d11_even: "Depuis des années, les Bourses de #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! et de #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! se tournent autour. Ce n’était qu’une question de temps.\n\nAvant la cloche d’ouverture, des courtiers agissant pour #v [SCOPE.sCountry('target').GetName]#! ont jeté d’un coup sur le parquet de gros paquets de nos actions ferroviaires et bancaires. Les cours ont cédé, les téléscripteurs ont pris du retard, et à midi nos propres commis vendaient dans la panique.\n\nNotre [concept_spec_market_confidence] baissera de #N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#! sur 6 mois."
