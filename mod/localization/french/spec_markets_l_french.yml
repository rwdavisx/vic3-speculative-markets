 SPEC_PLEDGE_MAKE_TT: "#header Promesse de sauver les banques#!\n$TOOLTIP_DELIMITER$\n#italic L’État promet de sauver les banques chaque fois qu’elles sont en difficulté.#!\n\n#P Chaque#! [concept_spec_financial_panic] fait l’objet d’un sauvetage immédiat, #P 25 %#! moins cher, tant que le [concept_treasury] peut payer sur ses réserves et que nous ne sommes pas en [concept_default]\nRéputation perdue par notre [concept_spec_exchange] lors d’une panique : #P -50 %#!\n[concept_spec_capital_flight] reçue : #P +50 %#!\n#N Chaque sauvetage#! assouplit les critères de prêt\n$TOOLTIP_DELIMITER$\n#N Si nous tombons en#! [concept_default], la promesse est rompue et toute la réputation est perdue. [concept_spec_market_confidence] #N -15#!, [concept_legitimacy] #N -10#! pendant #v 5#! ans\n#weak Retirer la promesse exige un préavis de#! #v 24#! #weak mois#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_pledge').IsValid(GuiScope.SetRoot(Country.MakeScope).End)), 'SPEC_PLEDGE_PLEDGE_WHY')]"
