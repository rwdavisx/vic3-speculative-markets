 concept_spec_intervention: "Intervention"
 concept_spec_intervention_desc: "@spec_intervention! Avec une $concept_spec_intervention$, votre gouvernement intervient sur le marché d’un [concept_good]. Vous pouvez y #v Freiner la spéculation#! ou y #v Encourager l’investissement#!.\n\n#v Freiner la spéculation#! ramène l’[concept_spec_investor_interest] à #v Calme#!. Ses producteurs perdent #N 10 %#! de [concept_throughput] et paient chaque semaine un prélèvement de #v 10 %#! de leur production, au prix de base.\n\n#v Encourager l’investissement#! porte l’intérêt à #v Vif#!. Ses producteurs gagnent #P 10 %#! de $concept_throughput$ et reçoivent une subvention de #v 20 %#! de leur production.\n\nChaque mesure coûte de l’[concept_authority] chaque mois jusqu’à sa levée. Les biens essentiels coûtent plus, tout comme les $concept_goods$ qui représentent une grande part des échanges du [concept_market]."
 SPEC_LEVER_ISSUE_TT: "#header Lancer une grande émission sur [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n#italic Vendre des parts d’un [concept_good] brûlant sur notre Bourse. Gros gains, gros risques.#!\n\nPendant #v 2#! ans :\nScore ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]) : #P +25 %#!\nÀ la fin de son essor, les prêts bancaires qui y sont engagés font #N x1,5#! plus mal\nÀ la fin de son essor, la réputation gagnée ou perdue est #v x2#!\n$TOOLTIP_DELIMITER$\nUne seule à la fois, à au moins #v 1#! an d’intervalle[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_issue_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_ISSUE_ON', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_issue').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_ISSUE_ON: "\n\nUne émission est en cours sur ce [concept_good]"
 spec_issue_stand_tt: "Notre [concept_spec_exchange] est #v Nationale#! ou mieux"
 spec_issue_hot_tt: "L’[concept_spec_investor_interest] est #v Avide#! ou plus"
 spec_issue_one_tt: "Aucune autre émission n’est en cours"
 spec_issue_cool_tt: "Le marché s’est reposé un an depuis la dernière émission"
 spec_issue_no_lever_tt: "Aucune [concept_spec_intervention] n’est en vigueur sur ce [concept_good]"
 spec_lever_no_issue_tt: "Aucune grande émission n’est en cours sur ce [concept_good]"
 SPEC_LEVERS_TT: "#header Interventions sur le marché#!\n$TOOLTIP_DELIMITER$\n#italic Les biens dont notre gouvernement refroidit ou réchauffe le marché.#!\n\nCoûte #N -[Country.MakeScope.ScriptValue('spec_lever_authority')|0]#! d’[concept_authority] par mois\nFreinés : #v [Country.MakeScope.ScriptValue('spec_n_restrain')|0]#!\nEncouragés : #v [Country.MakeScope.ScriptValue('spec_n_encourage')|0]#!\n[concept_budget_additional_income] : #P @money![Country.MakeScope.ScriptValue('spec_lever_levy')|D]#! par semaine\n[concept_budget_additional_expenses] : #N @money![Country.MakeScope.ScriptValue('spec_lever_spend')|D]#! par semaine"
 spec_story.1.t: "Le marché s’effondre : [ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName]"
 spec_story.1.t_generic: "Un marché s’effondre"
 spec_story.1.d: "La ruée sur le bien [ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName] est terminée. Des cours qui avaient grimpé pendant un an se sont écroulés en un mois, et les compagnies constituées au plus fort de l’engouement ne peuvent plus honorer leurs effets. Les négociants qui achetaient à tout prix se retrouvent avec des entrepôts impossibles à vider, tandis que les banques qui prêtaient sur leurs stocks font leurs comptes."
 spec_story.1.d_generic: "La ruée sur les biens en vogue est terminée. Des cours qui avaient grimpé pendant un an se sont écroulés en un mois, et les compagnies constituées au plus fort de l’engouement ne peuvent plus honorer leurs effets. Les négociants qui achetaient à tout prix se retrouvent avec des entrepôts impossibles à vider, tandis que les banques qui prêtaient sur leurs stocks font leurs comptes."
 spec_story.1.f: "« Voilà trente ans que je fais commerce du bien [ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName], et jamais je n’avais vu des hommes aussi empressés d’acheter ni aussi désespérés de vendre qu’en ces douze derniers mois. »"
 spec_story.1.f_generic: "« Voilà trente ans que je fais ce commerce, et jamais je n’avais vu des hommes aussi empressés d’acheter ni aussi désespérés de vendre qu’en ces douze derniers mois. »"
 spec_story.1.a: "Accordons des secours aux producteurs ruinés."
 spec_story.1.b: "Laissons les maisons les plus faibles faire faillite."
 spec_story.1.c: "Enquêtons sur les fondateurs des compagnies."
 spec_story.2.t: "Une escroquerie dévoilée"
 spec_story.2.d: "Les directeurs de la Compagnie [ROOT.GetCountry.GetCapital.GetCityHubName] [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] ont fui le pays. Ses livres révèlent que les généreux dividendes des deux dernières années provenaient des nouvelles souscriptions. Des milliers d’employés, de veuves et de commerçants détenaient ses actions. Tous les journaux de [ROOT.GetCountry.GetCapital.GetCityHubName] demandent maintenant combien d’autres prospectus ont été rédigés par la même main."
 spec_story.2.d_generic: "Les directeurs d’une célèbre société par actions de [ROOT.GetCountry.GetCapital.GetCityHubName] ont fui le pays. Ses livres révèlent que les généreux dividendes des deux dernières années provenaient des nouvelles souscriptions. Des milliers d’employés, de veuves et de commerçants détenaient ses actions. Tous les journaux de [ROOT.GetCountry.GetCapital.GetCityHubName] demandent maintenant combien d’autres prospectus ont été rédigés par la même main."
 spec_story.2.f: "#bold Recherché pour escroquerie#!\nLe directeur général de la Compagnie [ROOT.GetCountry.GetCapital.GetCityHubName] [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName], âgé d’environ cinquante ans, bien mis et d’abord engageant. Aperçu pour la dernière fois sur les quais."
 spec_story.2.f_generic: "#bold Recherché pour escroquerie#!\nLe directeur général d’une société par actions de [ROOT.GetCountry.GetCapital.GetCityHubName], âgé d’environ cinquante ans, bien mis et d’abord engageant. Aperçu pour la dernière fois sur les quais."
 spec_story.2.a: "Poursuivons les directeurs."
 spec_story.2.b: "Étouffons l’affaire."
 spec_story.2.c: "Indemnisons les petits investisseurs."
 spec_story.3.t: "La ruée sur les banques"
 spec_story.3.d: "Les déposants ont assiégé ce matin l’une des plus anciennes banques de [ROOT.GetCountry.GetCapital.GetCityHubName], qui a fermé ses portes à midi. Ses billets sont refusés dans toute la ville, et les entreprises qui y tenaient leurs comptes ne peuvent payer leurs ouvriers cette semaine. Devant toutes les autres banques, les files s’allongent d’heure en heure."
 spec_story.3.f: "« Mon père gardait son épargne dans cette banque, et son père avant lui. On nous disait qu’elle était aussi sûre que le Trésor. »"
 spec_story.3.a: "Garantissons ses dépôts."
 spec_story.3.b: "Qu’elle se sauve ou tombe seule."
 spec_story.3.c: "Nous devons soutenir les banques."
 spec_story.4.t: "Panique : [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]"
 spec_story.4.t_generic: "Panique à l’étranger"
 spec_story.4.d: "La nouvelle d’une [concept_spec_financial_panic] frappant le pays [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] est parvenue à [ROOT.GetCountry.GetCapital.GetCityHubName]. Ses banques rappellent leurs prêts à l’étranger. Nos entreprises qui commerçaient avec [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] ou y empruntaient manquent soudain d’argent. À la Bourse, tous les négociants veulent savoir si le mal va s’étendre."
 spec_story.4.d_generic: "La nouvelle d’une panique financière à l’étranger est parvenue à [ROOT.GetCountry.GetCapital.GetCityHubName]. Les banques étrangères rappellent leurs prêts, et nos entreprises qui vendaient ou empruntaient au-delà des frontières manquent soudain d’argent. À la Bourse, tous les négociants veulent savoir si le mal va s’étendre."
 spec_story.4.f: "« Quand le pays [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] éternue, notre Bourse s’alite. »"
 spec_story.4.f_generic: "« Quand nos voisins éternuent, notre Bourse s’alite. »"
 spec_story.4.a: "Prêtons à nos maisons de commerce."
 spec_story.4.b: "Leurs difficultés ne sont pas les nôtres."
 spec_story.4.c: "Accusons l’imprudence des banquiers étrangers."
 spec_story.5.t: "La confiance revient"
 spec_story.5.d: "Le pire de la panique est passé. Les entreprises qui ont survécu embauchent à nouveau, les banques recommencent à prêter aux clients solides, et quelques investisseurs audacieux achètent des actions pour une fraction du prix de l’an dernier. Nul ne s’attend à retrouver bientôt les excès d’autrefois, mais les affaires reprennent à [ROOT.GetCountry.GetCapital.GetCityHubName]."
 spec_story.5.f: "« Ceux qui ont tout vendu au printemps rachètent à l’automne, et à meilleur prix qu’ils n’avaient vendu. »"
 spec_story.5.a: "Encourageons les nouvelles entreprises."
 spec_story.5.b: "Cette fois, prêtons avec discernement."
 spec_story.6.t: "La délégation des manufacturiers"
 spec_story.6.d: "Une délégation de manufacturiers et de négociants s’est présentée au gouvernement. Leurs nouvelles usines restent inachevées faute de crédit, disent-ils, tandis que leurs concurrents étrangers empruntent librement et leur prennent leurs marchés. Ils demandent que les banques soient de nouveau autorisées à prêter."
 spec_story.6.f: "« Votre prudence, monsieur, nous a préservés de la ruine en veillant à ce qu’il ne reste plus rien à ruiner. »"
 spec_story.6.a: "Assouplissons le crédit."
 spec_story.6.b: "Le crédit restera restreint."
 spec_story.6.c: "Accordons-leur plutôt une subvention."
 spec_story.7.t: "La fièvre des actions"
 spec_story.7.d: "Employés, commerçants et maîtres d’école se pressent dans les cafés de [ROOT.GetCountry.GetCapital.GetCityHubName] pour échanger les actions de compagnies qu’ils n’ont jamais vues. Les titres des entreprises de [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] changent de mains plusieurs fois par jour, achetés pour la plupart à crédit. On raconte que des domestiques mettent en gage leurs habits du dimanche pour prendre part à la prochaine souscription."
 spec_story.7.d_generic: "Employés, commerçants et maîtres d’école se pressent dans les cafés de [ROOT.GetCountry.GetCapital.GetCityHubName] pour échanger les actions de compagnies qu’ils n’ont jamais vues. Les titres des entreprises les plus récentes changent de mains plusieurs fois par jour, achetés pour la plupart à crédit. On raconte que des domestiques mettent en gage leurs habits du dimanche pour prendre part à la prochaine souscription."
 spec_story.7.f: "« Mon barbier m’a donné ce matin un tuyau sur les actions liées au bien [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName]. Je l’ai écouté, puis lui ai rendu la pareille : vendez. »"
 spec_story.7.f_generic: "« Mon barbier m’a donné ce matin un tuyau sur les actions. Je l’ai écouté, puis lui ai rendu la pareille : vendez. »"
 spec_story.7.a: "Que le peuple ait sa part de la richesse."
 spec_story.7.b: "Interdisons les achats à crédit."
 spec_story.7.c: "Imposons un droit de timbre sur les cessions d’actions."
 spec_story.8.t: "Une bulle annoncée"
 spec_story.8.d: "Un économiste respecté a écrit au principal journal de [ROOT.GetCountry.GetCapital.GetCityHubName] que la hausse des cours des biens [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] et [ROOT.GetCountry.MakeScope.Var('spec_story_good2').GetGoods.GetName] ne saurait durer, et que les banques ont prêté sur la foi de prix qu’aucun homme sensé ne paierait. Les courtiers n’y voient que les jérémiades d’une vieille femme. Pourtant, la lettre se lit à haute voix dans tous les cercles et comptoirs de la ville."
 spec_story.8.d_generic: "Un économiste respecté a écrit au principal journal de [ROOT.GetCountry.GetCapital.GetCityHubName] que la hausse des biens les plus en vogue ne saurait durer, et que les banques ont prêté sur la foi de prix qu’aucun homme sensé ne paierait. Les courtiers n’y voient que les jérémiades d’une vieille femme. Pourtant, la lettre se lit à haute voix dans tous les cercles et comptoirs de la ville."
 spec_story.8.f: "« Un prix n’est jamais que ce que le dernier acheteur a consenti à payer. Je prie mes lecteurs de songer au nombre d’acheteurs qu’il reste. »"
 spec_story.8.a: "L’avertissement vient à point."
 spec_story.8.b: "Sornettes alarmistes."
 spec_story.6.a.tt: "La [concept_spec_credit_policy] devient #v Normale#! et reste verrouillée pendant #v 6#! mois"
