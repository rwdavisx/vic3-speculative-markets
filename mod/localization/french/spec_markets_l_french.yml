 SPEC_PANIC_LINE_TT: "#header Seuil de panique#!\nSi la [concept_spec_market_confidence] tombe sous #v [Country.MakeScope.ScriptValue('spec_panic_at')|0]#!, une [concept_spec_financial_panic] éclate. L’emprunt élève ce seuil. Dès que le [concept_spec_leverage] dépasse #v 3#! mois, il monte, jusqu’à #v 65#! à #v 12#! mois."
