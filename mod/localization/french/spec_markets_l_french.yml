 spec_excess_bar: "Excès spéculatif"
 concept_spec_speculative_excess: "Excès spéculatif"
 concept_spec_speculative_excess_desc: "@spec_speculative_excess! #italic C’est la bulle sur le [concept_market] d’un [concept_country]. Plus un essor reste chaud longtemps, plus elle grossit.#!\n\nAucune bulle ne peut se former avant [GetTechnology('stock_exchange').GetName].\n#P Grossit#! chaque mois où la [concept_spec_market_confidence] est à #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! ou plus, et d’autant plus vite qu’elle monte\n#v Dégonfle#! lentement tant qu’elle est entre #v 60#! et #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!\n#N Éclate#! si elle tombe sous #v 60#!\n\nQuand elle éclate, la $concept_spec_market_confidence$ chute encore, jusqu’à #N [GetPlayer.MakeScope.ScriptValue('spec_burst_max')|0]#!. Plus la bulle est grosse, plus la chute est rude."
 concept_spec_sound_finance: "Finances saines"
 concept_spec_sound_finance_desc: "@spec_sound_finance! #italic La récompense pour l’adoption des trois [concept_spec_banking_reforms] : règles d’émission des billets, prêteur en dernier ressort et droit des sociétés.#!\n\nUne fois les trois adoptées par un [concept_country] :\n#P +10#! de [concept_prestige]\n#P 5 %#! d’intérêts en moins sur ses [concept_loans]"
 concept_spec_banking_reforms: "Réformes bancaires"
 concept_spec_banking_reform: "Réforme bancaire"
 concept_spec_banking_reforms_desc: "@spec_banking_reforms! #italic Les règles qui régissent les banques et les compagnies d’un [concept_country]. Chacune change le cours des essors et des paniques.#!\n\nChaque réforme devient disponible grâce à une technologie. Une commission d’enquête adopte une réforme à la fois. Elle peut siéger après une [concept_spec_financial_panic], ou après #v 10#! années calmes sans panique.\n\n#bold Règles d’émission des billets#! ([GetTechnology('banking').GetName]), un choix parmi deux :\n#bold École monétaire#!\n$spec_reform_currency_tt$\n#bold Liberté bancaire#!\n$spec_reform_free_tt$\n\n#bold Prêteur en dernier ressort#! ([GetTechnology('central_banking').GetName])\n$spec_reform_llr_tt$\n\n#bold Droit des sociétés#! ([GetTechnology('joint_stock_companies').GetName])\n$spec_reform_company_tt$\n\nAdoptez les trois pour atteindre les [concept_spec_sound_finance]."
