 SPEC_WHY_COND: "#header @spec_market_conditions! [concept_spec_market_conditions] : x[Country.MakeScope.ScriptValue('spec_crash_scale')|2]#!\n$TOOLTIP_DELIMITER$\n#italic Plus le marché est chaud, plus la fin d’un essor fait mal.#!\n\n#v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), '(CFixedPoint)55')|2]#! en raison d’une [concept_spec_market_confidence] de #v [Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55')|0]#![AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_depth'), '(CFixedPoint)1')), 'SPEC_WHY_COND_DEPTH')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_steady'), '(CFixedPoint)1')), 'SPEC_WHY_COND_STEADY')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_fin_risk'), '(CFixedPoint)1')), 'SPEC_WHY_COND_FIN')]\n$TOOLTIP_DELIMITER$\n#weak Aucun effet à #v 55#! de $concept_spec_market_confidence$. Plus elle monte, plus le coup d’une [concept_spec_boom_end] est rude#!"
