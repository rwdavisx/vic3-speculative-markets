 SPEC_RISKS_TT: "#header Risques#!\n$TOOLTIP_DELIMITER$\n#italic Ce qui pourrait faire chuter notre [concept_spec_market_confidence]. Plus le chiffre rouge est grand, plus le coup est dur.#!\n\n#b Essors menacés#! montre le coup si l’un de nos essors prend fin\n#b Risque de panique#! montre le coup si une panique dans un marché lié au nôtre se propage jusqu’à nous\n#b Risque de guerre#! montre le coup si un [concept_diplomatic_play] tourne à la guerre\n#b Risque de défaut#! montre le coup si nous empruntons au-delà de notre [Concept('concept_credit','$concept_credit_limit|q$')]\n#b Bulle#! montre le coup si notre $concept_spec_speculative_excess$ éclate\n$TOOLTIP_DELIMITER$\n#instruction Survolez chacun pour voir ce qu’il recouvre#!"
 SPEC_RISK_1: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_risk_top').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_RISK_1_V', 'SPEC_CHIP_ZERO')]"
 SPEC_RISK_1_V: "#N -[Min_CFixedPoint(Country.MakeScope.Var('spec_risk_top').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'))|0]#!"
