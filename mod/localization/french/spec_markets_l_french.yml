 SPEC_EFFECT_EXCH_TT: "#header $SPEC_EFFECT_EXCH$#!\nRang de la [concept_spec_exchange] : $SPEC_EFFECT_EXCH_VALUE$\n$TOOLTIP_DELIMITER$\nScore ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]) : #v [Country.MakeScope.Var('spec_centre_score').GetValueWithDefault('(CFixedPoint)0')|0]#!\nRéputation : #v $SPEC_EXCH_TRUST$#!\nCharte de la Bourse : #v [SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_exch_known').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.5'), 'SPEC_EXCH_KNOWN_0', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_exch_known').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1.5'), 'SPEC_EXCH_KNOWN_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_exch_known').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2.5'), 'SPEC_EXCH_KNOWN_2', 'SPEC_EXCH_KNOWN_3')))]#!\n$TOOLTIP_DELIMITER$\nRéaction des investisseurs à la hausse des prix : #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_hype'), '(CFixedPoint)1')|+%0]#! par rapport à la normale (plus haut, les essors grandissent plus vite)\n[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1.5'), 'SPEC_EXCH_FX_FLIGHT', 'SPEC_EXCH_FX_FLIGHT_GP')][AddLocalizationIf(And(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.5'), Not(Country.MakeScope.Var('spec_centre_rank').IsSet)), 'SPEC_EXCH_FX_PRESTIGE')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_loss'), '(CFixedPoint)1')), 'SPEC_EXCH_FX_LOSS')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_credit'), '(CFixedPoint)1')), 'SPEC_EXCH_FX_CREDIT')]\nVariations de l’[concept_spec_market_mood], selon la réputation : #v x[Country.MakeScope.ScriptValue('spec_exch_mood')|2]#! (sous #v x1#!, plus calme, au-dessus, plus agitée)\nRétablissement de la [concept_spec_market_confidence], selon la réputation : #v x[Country.MakeScope.ScriptValue('spec_exch_recover')|2]#! (au-dessus de #v x1#!, plus rapide, en dessous, plus lent)[AddLocalizationIf(Country.MakeScope.Var('spec_crunch').IsSet, 'SPEC_EXCH_FX_CRUNCH')][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.5'), 'SPEC_EXCH_FX_LEAN')]\n$TOOLTIP_DELIMITER$\n[SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.5'), 'SPEC_EXCH_NEXT_0', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1.5'), 'SPEC_EXCH_NEXT_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2.5'), 'SPEC_EXCH_NEXT_2', 'SPEC_EXCH_NEXT_3')))]"
