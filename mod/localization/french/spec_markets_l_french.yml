 SPEC_RISK_SLIGHT: "#header Risque de $SPEC_UNWIND$#!\n[concept_spec_market_confidence] si l’essor prend fin : #v Faible#!\n$TOOLTIP_DELIMITER$\n#italic Un petit essor. S’il prenait fin maintenant, il ferait à peine mal.#!\n\n$SPEC_UNWIND_DESC$"
 SPEC_RISK_GLUT: "#header En reprise#!\n$TOOLTIP_DELIMITER$\n#italic [Goods.GetName] se remet de son dernier essor.#!\n\nLes investisseurs se tiennent à l’écart un temps, donc l’[concept_spec_investor_interest] reste au niveau #v Hésitant#!"
 SPEC_RISK_CALM: "#header Aucun essor#!\n$TOOLTIP_DELIMITER$\n#italic Rien d’inquiétant. [Goods.GetName] n’a connu aucun essor récemment.#!\n\nUne fois que l’[concept_spec_investor_interest] atteint #v Vif#! ou plus, un retour à #v Hésitant#! #N met fin à l’essor#!\nPlus il monte haut, plus il tombe durement"
 SPEC_UNWIND_3: "Effondrement"
 SPEC_UNWIND_C_3: "@spec_collapse! [concept_spec_collapse]"
 SPEC_UNWIND_DESC_3: "Cet essor est monté jusqu’au niveau #v Fiévreux#!\n#N Prend fin#! si la tendance des prix passe sous #v [Divide_CFixedPoint('(CFixedPoint)-4.988', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!. L’[concept_spec_investor_interest] devient alors #v Fuyant#! et l’essor se termine par un [concept_spec_collapse]\nLes investisseurs se tiennent ensuite à l’écart pendant #v 12#! mois\n#P Le risque s’estompe#! à mesure que l’essor vieillit"
 SPEC_UNWIND_2: "Débâcle"
 SPEC_UNWIND_C_2: "@spec_bust! [concept_spec_bust]"
 SPEC_UNWIND_DESC_2: "Cet essor est monté jusqu’au niveau #v Avide#!\n#N Prend fin#! si la tendance des prix passe sous #v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!. L’[concept_spec_investor_interest] devient alors #v Hésitant#! et l’essor se termine par une [concept_spec_bust]\nLes investisseurs se tiennent ensuite à l’écart pendant #v 6#! mois\n#P Le risque s’estompe#! à mesure que l’essor vieillit"
 SPEC_UNWIND_1: "Correction"
 SPEC_UNWIND_C_1: "@spec_correction! [concept_spec_correction]"
 SPEC_UNWIND_DESC_1: "Cet essor est monté jusqu’au niveau #v Vif#!\n#N Prend fin#! si la tendance des prix passe sous #v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!. L’[concept_spec_investor_interest] devient alors #v Hésitant#! et l’essor se termine par une [concept_spec_correction]\nLes investisseurs se tiennent ensuite à l’écart pendant #v 3#! mois\n#P Le risque s’estompe#! à mesure que l’essor vieillit"
