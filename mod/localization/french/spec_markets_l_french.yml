 SPEC_CREDIT_LOCK: "\n\nVerrouille la [concept_spec_credit_policy] pendant #v 6#! mois"
 SPEC_EFFECT_GIVEN_TT: "#header Crédit accordé ce mois-ci#!\n#v @money![Country.MakeScope.Var('spec_credit_given').GetValueWithDefault('(CFixedPoint)0')|D]#! ce mois-ci\n$TOOLTIP_DELIMITER$\n#italic L’argent que nos banques ajoutent à notre [concept_investment_pool].#!\n\nTaux de prêt : #v [SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_credit_rate'), '(CFixedPoint)0.01'), 'SPEC_CREDITW_0', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_credit_rate'), '(CFixedPoint)0.5'), 'SPEC_CREDITW_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_credit_rate'), '(CFixedPoint)1.15'), 'SPEC_CREDITW_2', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_credit_rate'), '(CFixedPoint)1.8'), 'SPEC_CREDITW_3', 'SPEC_CREDITW_4'))))]#!\n#italic La facilité avec laquelle nos banques prêtent, pas les intérêts que nous payons.#!\n\n#b Par rapport à un niveau de prêt normal#!\n$ECONOMIC_SYSTEM_GC_LINK$ : #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_law_mult'), '(CFixedPoint)1')|+%0]#!\nTechnologies financières : #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_tech_credit'), '(CFixedPoint)1')|+%0]#!\n[concept_spec_credit_policy] : #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_stance_credit'), '(CFixedPoint)1')|+%0]#!\n[concept_spec_banking_reforms] : #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_reform_credit'), '(CFixedPoint)1')|+%0]#!\n[concept_spec_lending_standards] : #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_credit'), '(CFixedPoint)1')|+%0]#!\n[concept_spec_exchange] : #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_credit'), '(CFixedPoint)1')|+%0]#!\n$TOOLTIP_DELIMITER$\n#weak Les banques prêtent chaque mois tant que la [concept_spec_market_confidence] dépasse #v 55#!, d’autant plus qu’elle est haute, jusqu’à atteindre leur plafond de prêt. Le [concept_investment_pool] l’affiche semaine par semaine.#!"
