 spec_panic_movements: "Méfiance envers les marchés"
 spec_panic_movements_desc: "Après la panique, beaucoup pensent désormais que l’État doit brider les marchés, et les [Concept('concept_political_movement','$concept_political_movements|q$')] opposés à [GetLawType('law_laissez_faire').GetName] ont gagné des soutiens."
 spec_mania_movements: "Foi dans les marchés"
 spec_mania_movements_desc: "Un long essor a convaincu beaucoup de gens qu’il vaut mieux laisser les marchés agir seuls, et les [Concept('concept_political_movement','$concept_political_movements|q$')] favorables à [GetLawType('law_laissez_faire').GetName] ont gagné des soutiens."
 SPEC_DRIVER_DEBT: "Dette publique"
 SPEC_DRIVER_DEBT_TT: "#header Dette publique : [GetPlayer.MakeScope.Var('spec_c_debt').GetValue|+=2]#!\n$TOOLTIP_DELIMITER$\n#italic Les investisseurs s’inquiètent quand nous empruntons trop.#!\n\n[concept_credit] utilisé : #v [GetPlayer.MakeScope.ScriptValue('spec_debt_share')|%0]#! ([concept_principal])\n#P Sans risque#! jusqu’à #v 50 %#!\nChaque tranche de #v 10 %#! au-delà : #N -0.2#! de [concept_spec_market_confidence] par mois (jamais plus de #N -1#!)\n$TOOLTIP_DELIMITER$\n#instruction Rembourser la dette sous 50 % pour que cela disparaisse.#!"
