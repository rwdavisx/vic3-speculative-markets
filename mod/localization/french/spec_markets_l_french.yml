 SPEC_LAXL_HERE: "\n\n#P Nous sommes ici#!"
 SPEC_LAXL_0_TT: "#header Stricts#!\n$TOOLTIP_DELIMITER$\n#italic Les banques prêtent à peine. Les essors restent petits et finissent en douceur.#!\n\n#b Par rapport à #v Sains#! :#!\nCrédit accordé chaque mois : #v -25 %#! à #v -15 %#!\nPart qui va aux essors : #P -50 %#! à #P -30 %#!\nCoût d’un sauvetage bancaire : #P -50 %#! à #P -30 %#!\n\n#P Notre [concept_spec_exchange] gagne en réputation pendant les mois calmes#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.2')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_1_TT: "#header Prudents#!\n$TOOLTIP_DELIMITER$\n#italic Les banques prêtent avec prudence.#!\n\n#b Par rapport à #v Sains#! :#!\nCrédit accordé chaque mois : #v -15 %#! à #v -5 %#!\nPart qui va aux essors : #P -30 %#! à #P -10 %#!\nCoût d’un sauvetage bancaire : #P -30 %#! à #P -10 %#!\n\n#P Notre [concept_spec_exchange] gagne en réputation pendant les mois calmes#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.2'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.4')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_2_TT: "#header Sains#!\n$TOOLTIP_DELIMITER$\n#italic Le niveau normal.#!\n\n#b Par rapport à #v Sains#! :#!\nCrédit accordé chaque mois : #v -5 %#! à #v +5 %#!\nPart qui va aux essors : #P -10 %#! à #N +10 %#!\nCoût d’un sauvetage bancaire : #P -10 %#! à #N +10 %#!\n\n#P Notre [concept_spec_exchange] gagne en réputation pendant les mois calmes#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.4'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.6')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_3_TT: "#header Laxistes#!\n$TOOLTIP_DELIMITER$\n#italic Les banques prêtent facilement et courent après les essors.#!\n\n#b Par rapport à #v Sains#! :#!\nCrédit accordé chaque mois : #v +5 %#! à #v +15 %#!\nPart qui va aux essors : #N +10 %#! à #N +30 %#!\nCoût d’un sauvetage bancaire : #N +10 %#! à #N +30 %#!\n\n#N Notre [concept_spec_exchange] ne gagne plus en réputation#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.6'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.8')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_4_TT: "#header Imprudents#!\n$TOOLTIP_DELIMITER$\n#italic Les banques prêtent à n’importe qui. Les essors s’emballent et finissent mal.#!\n\n#b Par rapport à #v Sains#! :#!\nCrédit accordé chaque mois : #v +15 %#! à #v +25 %#!\nPart qui va aux essors : #N +30 %#! à #N +50 %#!\nCoût d’un sauvetage bancaire : #N +30 %#! à #N +50 %#!\n\n#N Notre [concept_spec_exchange] ne gagne plus en réputation#![AddLocalizationIf(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.8'), 'SPEC_LAXL_HERE')]"
 SPEC_EFFECT_LAX: "Critères de prêt"
 SPEC_EFFECT_LAX_VALUE: "#v [SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.2'), 'SPEC_LAXW_0', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.4'), 'SPEC_LAXW_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.6'), 'SPEC_LAXW_2', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.8'), 'SPEC_LAXW_3', 'SPEC_LAXW_4'))))]#!"
 SPEC_EFFECT_LAX_TT: "#header @spec_lending_standards! [concept_spec_lending_standards] : $SPEC_EFFECT_LAX_VALUE$#!\n$TOOLTIP_DELIMITER$\n#italic La prudence de nos banques quand elles prêtent. Des banques négligentes prêtent davantage, mais leurs essors finissent plus durement.#!\n\n#b Par rapport à la normale (#v Sains#!)#!\n#v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_credit'), '(CFixedPoint)1')|+%0]#! de crédit accordé chaque mois\n#v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_pull'), '(CFixedPoint)1')|+%0]#! sur la part habituelle de ce crédit placée dans les essors\n#v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_cost'), '(CFixedPoint)1')|+%0]#! sur le coût d’un sauvetage bancaire\n\n#b Comment ils évoluent#!\n#N Plus laxistes#! un peu chaque mois calme (de #v Stricts#! à #v Imprudents#! en environ #v 20#! ans)\n#N Bien plus laxistes#! à chaque sauvetage bancaire\n#P Plus stricts#! quand un essor prend fin, ou quand nous en freinons un\n#P Bien plus stricts#! quand une [concept_spec_financial_panic] se termine sans sauvetage\n$TOOLTIP_DELIMITER$\n#instruction Choisir le crédit #v Restreint#! comme [concept_spec_credit_policy] pour qu’ils cessent de se relâcher. Une panique ou des créances douteuses les figent aussi. #v Sains#! ou plus stricts, ils renforcent aussi la réputation de notre [concept_spec_exchange].#!"
 SPEC_TILE_CYCLE: "[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_overx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_OVER_ON', 'SPEC_GOODS_NONE')][SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_bb_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_TILE_BB_ON', 'SPEC_GOODS_NONE')]"
 SPEC_TILE_OVER_ON: "\n\n#title Surproduction :#! #v [Country.MakeScope.Var(Concatenate('spec_ui_over_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! d’offre en plus depuis le début de cet essor\nSi l’essor prend fin, le coup porté à la [concept_spec_market_confidence] est #N x[Country.MakeScope.Var(Concatenate('spec_ui_overx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|2]#! plus fort"
 SPEC_TILE_BB_ON: "\n\n#title Construction d’essor :#! #P +[Country.MakeScope.Var(Concatenate('spec_ui_bb_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! d’efficacité de construction pour son industrie tant que les investisseurs restent aussi enthousiastes"
 SPEC_NOTE_CYCLE: "[SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)2.5'), 'SPEC_NOTE_PPL_3', SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)1.5'), 'SPEC_NOTE_PPL_2', SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)0.5'), 'SPEC_NOTE_PPL_1', 'SPEC_GOODS_NONE')))]"
 SPEC_NOTE_OVER_ON: " On avait tant construit pendant l’essor que la chute a été #N x[SCOPE.GetValue('spec_note_over')|2]#! plus rude."
 SPEC_NOTE_PPL_1: " Les ouvriers qui possédaient son industrie ont subi les pertes, et certains sont devenus [Concept('concept_radical', '$concept_radicals|q$')] dans les États où elle se trouve."
 SPEC_NOTE_PPL_2: " Ses propriétaires ont subi les pertes, et certains sont devenus [Concept('concept_radical', '$concept_radicals|q$')] dans les États où elle se trouve."
 SPEC_NOTE_PPL_3: " Ses propriétaires et les petits épargnants ont subi les pertes, et beaucoup sont devenus [Concept('concept_radical', '$concept_radicals|q$')] dans les États où elle se trouve."
