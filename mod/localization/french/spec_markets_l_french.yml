 SPEC_STANCE_TIGHT_TT: "#header Crédit restreint#!\nCrédit accordé ce mois-ci : #v Aucun#!\n$TOOLTIP_DELIMITER$\n#italic Les banques cessent de prêter pour refroidir le marché.#!\n\nChaque mois, #N 10 %#! de notre [concept_spec_market_confidence] au-dessus de #v 60#! s’évapore\nRéaction des investisseurs : #N -50 %#!\n@intelligentsia! Intelligentsia [concept_in_government] : #P +2#! d’[concept_approval]\n@industrialists! Industriels [concept_in_government] : #N -2#! d’[concept_approval]\n\nDes essors #P plus petits#!, des krachs et des paniques #P plus doux#![SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-1'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-1')), Not(GetScriptedGui('spec_sgui_tight').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_TIGHT_WHY')]"
 SPEC_STANCE_NORMAL_TT: "#header Crédit normal#!\nCrédit accordé ce mois-ci : #v @money![Country.MakeScope.ScriptValue('spec_credit_preview')|D]#!\n$TOOLTIP_DELIMITER$\n#italic Les banques prêtent comme d’habitude.#!\n\nLes banques prêtent au [concept_investment_pool] tant que la [concept_spec_market_confidence] dépasse #v 55#!.[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0')), Not(GetScriptedGui('spec_sgui_normal').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_NORMAL_WHY')]"
 SPEC_STANCE_LOOSE_TT: "#header Crédit souple#!\nCrédit accordé ce mois-ci : #v @money![Country.MakeScope.ScriptValue('spec_credit_preview_loose')|D]#!\n$TOOLTIP_DELIMITER$\n#italic Les banques prêtent librement pour réchauffer le marché.#!\n\nRéaction des investisseurs à la hausse des prix : #v +30 %#!\n@industrialists! Industriels [concept_in_government] : #P +2#! d’[concept_approval]\n@intelligentsia! Intelligentsia [concept_in_government] : #N -2#! d’[concept_approval]\n\nDes essors #P plus grands#!, mais des pertes #N plus lourdes#! à leur fin[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1')), Not(GetScriptedGui('spec_sgui_loose').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_LOOSE_WHY')]"
