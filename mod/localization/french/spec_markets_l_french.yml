 SPEC_IL_SORT_INTEREST_TT: "#header Trier par [concept_spec_investor_interest]#!\n$TOOLTIP_DELIMITER$\nLes biens les plus brûlants d’abord, puis les plus échangés\n\nLe repère montre le niveau, de @spec_interest_fleeing! #v Fuyant#! à @spec_interest_feverish! #v Fiévreux#!\nLa flèche montre la variation de ce mois"
