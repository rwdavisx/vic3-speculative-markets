 SPEC_IL_SORT_LEVER_BASE_TT: "#header Afficher les interventions#!\n$TOOLTIP_DELIMITER$\nAffiche uniquement les biens faisant l’objet d’une [concept_spec_intervention]\n\n#instruction Cliquez pour n’afficher que ces biens, cliquez à nouveau pour tout afficher#!"
 SPEC_IL_DANGER_TT: "#header Zone d’effondrement#!\n$TOOLTIP_DELIMITER$\n#italic L’essor est si grand qu’un recul maintenant finirait mal.#!\n\nSi l’[concept_spec_investor_interest] tombe aussi bas, l’essor finit en [concept_spec_collapse]\nCela coûterait environ #N [Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! de [concept_spec_market_confidence]"
 SPEC_IL_CRASHED_TT: "#header [Goods.GetName] : essor terminé#!\n$TOOLTIP_DELIMITER$\n#italic L’essor de ce bien vient de prendre fin.#!\n\nIl s’est terminé ce mois-ci ainsi : [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]\n#N Les investisseurs se tiennent à l’écart#! pendant [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))]\nUne [Concept('concept_company','$concept_companies|q$')] qui le produit #N perd#! de la [concept_throughput]"
 SPEC_IL_GLUT_TT: "#header [Goods.GetName] : reprise#!\n$TOOLTIP_DELIMITER$\n#italic Les investisseurs restent méfiants après la fin du dernier essor.#!\n\nCet essor s’est terminé ainsi : [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]\n[concept_spec_investor_interest] #N bloqué#! au niveau #v Hésitant#! ou en dessous pendant [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))]\nUne [Concept('concept_company','$concept_companies|q$')] qui le produit #N perd#! de la [concept_throughput]"
 SPEC_TILE_BANKS: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_expx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_BANKS_ON', 'SPEC_GOODS_NONE')]$SPEC_TILE_CYCLE$"
 SPEC_TILE_BANKS_ON: "\n\n#title Prêts bancaires#!\n#v [Country.MakeScope.Var(Concatenate('spec_exp_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! de tout le [concept_spec_outstanding_credit] est engagé dans cet essor, soit #v [Country.MakeScope.Var(Concatenate('spec_ui_expm_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! mois de revenu du pool\nS’il prend fin, le coup porté à la [concept_spec_market_confidence] est #N x[Country.MakeScope.Var(Concatenate('spec_ui_expx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|2]#! plus fort que pour un essor où aucune banque n’a prêté"
 SPEC_NOTE_BANKS: ""
 SPEC_NOTE_BANKS_ON: " Les banques y avaient beaucoup prêté, la chute a donc été #N x[SCOPE.GetValue('spec_note_bank')|2]#! plus dure."
 SPEC_H_BANK_LENT: "Où les banques ont prêté"
 SPEC_H_BANK_LENT_TT: "#header Où les banques ont prêté#!\n$TOOLTIP_DELIMITER$\n#italic Les banques versent leurs nouveaux prêts dans les biens en essor.#!\n\nLes biens qui pèsent plus et ont plus d’[concept_spec_investor_interest] reçoivent plus d’argent\nUn prêt reste dans son bien jusqu’à son remboursement\n#N Si un essor chargé de prêts prend fin#!, la [concept_spec_market_confidence] chute davantage\n$TOOLTIP_DELIMITER$\n#instruction Freiner la spéculation sur un bien pour réduire de moitié ses nouveaux prêts.#!"
 SPEC_BANK_PIE: "Prêts des essors par bien"
 SPEC_BANK_SLICE_NAME: "[SelectLocalization(Country.MakeScope.Var(Concatenate('spec_bank_oth_', Scope.GetGoods.GetKey)).IsSet, 'SPEC_BANK_OTHER', 'SPEC_BANK_GOOD_NAME')]"
 SPEC_BANK_GOOD_NAME: "[Scope.GetGoods.GetName]"
 SPEC_BANK_SLICE_SHARE: "[SelectLocalization(Country.MakeScope.Var(Concatenate('spec_bank_oth_', Scope.GetGoods.GetKey)).IsSet, 'SPEC_BANK_OTHER_SHARE', 'SPEC_BANK_GOOD_SHARE')]"
 SPEC_BANK_OTHER_SHARE: "#v [Divide_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_exp_booms'), Country.MakeScope.Var('spec_bank_top').GetValueWithDefault('(CFixedPoint)0')), Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_exp_booms'), '(CFixedPoint)0.001'))|%0]#!"
 SPEC_BANK_GOOD_SHARE: "#v [Divide_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_exp_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_exp_booms'), '(CFixedPoint)0.001'))|%0]#!"
 SPEC_BANK_SLICE_TT: "[SelectLocalization(Country.MakeScope.Var(Concatenate('spec_bank_oth_', Scope.GetGoods.GetKey)).IsSet, 'SPEC_BANK_OTHER_TT', 'SPEC_BANK_GOOD_TT')]"
 SPEC_BANK_GOOD_TT: "#header [Scope.GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\n#italic Combien d’argent des banques repose sur cet essor.#!\n\n#v [Country.MakeScope.Var(Concatenate('spec_exp_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%1]#! de tout l’[concept_spec_outstanding_credit] se trouve ici\nSi cet essor prenait fin, les prêts feraient chuter la [concept_spec_market_confidence] #N x[Country.MakeScope.Var(Concatenate('spec_ui_expx_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)1')|2]#! plus bas"
 SPEC_BANK_NONE_S: "#grey Aucun crédit prêté aux essors#!"
 SPEC_BANK_NONE: "Rien de prêté aux essors\nLes banques ne prêtent que tant que la [concept_spec_market_confidence] dépasse #v 55#!, surtout aux biens au niveau #v Vif#! ou plus"
 SPEC_LHIST_EMPTY: "#grey Enregistré chaque mois à partir de maintenant#!"
 SPEC_H_CREDIT_HISTORY: "Historique du levier du crédit"
 SPEC_H_CREDIT_HISTORY_TT: "#header Historique du levier du crédit#!\n$TOOLTIP_DELIMITER$\n#italic Jusqu’où nos banques ont prêté, mois après mois.#!\n\nLes #v 36#! derniers mois de [concept_spec_leverage], le plus récent à droite\n#P Sûr#! jusqu’à #v 3#! mois\n#v Risqué#! jusqu’à #v 8#!\n#N Dangereux#! au-delà de #v 8#!\n\nLa ligne blanche est notre plafond de crédit\nLe bord droit indique où une panique commence à chaque niveau"
 SPEC_H_CREDIT_HISTORY_RIGHT: "Maintenant #v [Country.MakeScope.ScriptValue('spec_lev')|1]#! mois"
