 SPEC_JE_NEWS_6: "#italic Encore une année de vaches maigres : les fabriques se taisent et les banques refusent de prêter#!"
 SPEC_JE_NEWS_5: "#italic PANIQUE AUX GUICHETS ! La foule assiège les maisons de banque de [GetPlayer.GetCapital.GetCityHubName]#!"
 SPEC_JE_NEWS_4: "#italic La Bourse rouvre sur un marché étroit ; les créanciers comptent leurs pertes#!"
 SPEC_JE_NEWS_3: "#italic Fièvre à la Bourse de [GetPlayer.GetCapital.GetCityHubName] : commis et veuves achètent à crédit, le secteur [GetPlayer.MakeScope.Var('spec_top1').GetGoods.GetName] s’envole#!"
 SPEC_JE_NEWS_2: "#italic Nouvelle émission du secteur [GetPlayer.MakeScope.Var('spec_top1').GetGoods.GetName] couverte en moins d’une heure, car les banques prêtent sans compter#!"
 SPEC_JE_NEWS_1: "#italic Séance calme à [GetPlayer.GetCapital.GetCityHubName] : actions du secteur [GetPlayer.MakeScope.Var('spec_top1').GetGoods.GetName] fermes, le reste inchangé#!"
