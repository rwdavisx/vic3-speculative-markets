 concept_spec_financial_centre: "Grande Bourse"
 concept_spec_financial_centres: "Grandes Bourses"
 concept_spec_financial_centre_desc: "@spec_financial_centre! Les $concept_spec_financial_centres$ sont les #v 5#! [Concept('concept_country','$concept_countries|q$')] ayant le meilleur score ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]), classés chaque mois. Plus votre [concept_spec_exchange] peut puiser d’argent dans le [concept_investment_pool], plus son score est élevé. La réputation, la richesse par habitant, les quartiers d’affaires, les compagnies, les technologies financières, le [concept_rank] et le système économique le modifient aussi. La moyenne des trois premiers vaut #v 100#!.\n\nPremière place : #P +10 %#! de [concept_prestige], #P -10 %#! de taux d’intérêt des [concept_loans], #P +5#! mois de plafond de crédit\nDernière place (#v 5#!) : #P +2 %#!, #P -2 %#!, #P +1#! mois\nLe bonus de plafond de crédit nécessite [GetTechnology('central_banking').GetName] et des critères de prêt #v Sains#! ou plus stricts"
