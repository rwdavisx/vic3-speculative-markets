 SPEC_RISK_5_NONE: "#header @spec_speculative_excess! $concept_spec_speculative_excess$#!\nRien d’inquiétant. Aucune bulle pour le moment. Elle commence à se former dès que la [concept_spec_market_confidence] atteint #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#!."
 SPEC_RISK_4: "[SelectLocalization(Country.MakeScope.Var('spec_default_risk').IsSet, 'SPEC_RISK_4_V', 'SPEC_CHIP_ZERO')]"
 SPEC_RISK_4_V: "#N -5#!"
 SPEC_RISK_4_TT: "[SelectLocalization(Country.MakeScope.Var('spec_default_risk').IsSet, 'SPEC_RISK_4_ON', 'SPEC_RISK_4_NONE')]"
 SPEC_RISK_4_ON: "#header Risque de défaut#!\n$TOOLTIP_DELIMITER$\n#italic Nous empruntons près de notre limite. Au-delà, c’est le défaut.#!\n\n[concept_credit] utilisé : #v [Country.MakeScope.Var('spec_default_risk').GetValueWithDefault('(CFixedPoint)0')|%0]#![AddLocalizationIf(Country.MakeScope.Var('spec_tm_broke').IsSet, 'SPEC_RISK_4_BROKE')]\nAu-delà de #v 100 %#! : [concept_default], #N -5#! de [concept_spec_market_confidence] chaque mois jusqu’à sa fin\n$TOOLTIP_DELIMITER$\n#weak Apparaît dès que nous avons utilisé #v 80 %#! de notre $concept_credit$#!"
 SPEC_RISK_4_BROKE: "\n#v [Country.MakeScope.ScriptValue('spec_broke_weeks')|0]#! semaines avant la [concept_bankruptcy] si nous continuons à perdre de l’argent ainsi. Coûte déjà [Country.MakeScope.Var('spec_tm_broke').GetValueWithDefault('(CFixedPoint)0')|+=2] par mois"
