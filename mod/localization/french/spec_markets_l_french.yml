 SPEC_RV_SCORE_TT: "#header Duel avec [Country.GetNameNoFormatting]#!\n#italic Une partie de tir à la corde entre notre [concept_spec_exchange] et la leur, réglée #v 5#! ans après son début. Le camp où finit la barre prend de la réputation à l’autre.#!\n$TOOLTIP_DELIMITER$\n$SPEC_RV_NOW_LINE$\n$TOOLTIP_DELIMITER$\n$SPEC_RV_SCORE_BODY$"
 SPEC_RV_NOW_LINE: "S’il se réglait maintenant : [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)0.75'), 'SPEC_RV_BAND_BIGWIN', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)0.2'), 'SPEC_RV_BAND_WIN', SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)-0.2'), 'SPEC_RV_BAND_DRAW', SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)-0.75'), 'SPEC_RV_BAND_LOSS', 'SPEC_RV_BAND_BIGLOSS'))))]\nLa barre : #v [Select_CFixedPoint(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)0'), Country.MakeScope.Var('spec_rv_ui_p').GetValue, Multiply_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)-1'))|%0]#! [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)0'), 'SPEC_RV_OUR_WAY', 'SPEC_RV_THEIR_WAY')]\nSe règle dans #v [Country.MakeScope.Var('spec_rv_ui_left').GetValueWithDefault('(CFixedPoint)5')|0]#! ans"
 SPEC_RV_OUR_WAY: "en notre faveur"
 SPEC_RV_THEIR_WAY: "en leur faveur"
 SPEC_RV_SCORE_BODY: "#b Ce qui tire la barre#!\nScore de chaque [concept_spec_exchange], #v [GetPlayer.MakeScope.Var('spec_centre_score').GetValue|0]#! contre #v [Country.MakeScope.Var('spec_centre_score').GetValue|0]#! : [Divide_CFixedPoint(Subtract_CFixedPoint(Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1')), Multiply_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Country.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'))), Max_CFixedPoint(Max_CFixedPoint(Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1')), Multiply_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Country.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'))), '(CFixedPoint)1'))|+=%0][AddLocalizationIf(LessThan_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)0.99'), 'SPEC_RV_THIN_US')][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)0.99'), 'SPEC_RV_THIN_THEM')]\nNos poussées, #v [Country.MakeScope.Var('spec_rv_ui_us').GetValue|0]#! : [Multiply_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_us').GetValue, '(CFixedPoint)0.1')|+=%0]\nLeurs poussées, #v [Country.MakeScope.Var('spec_rv_ui_them').GetValue|0]#! : [Multiply_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_them').GetValue, '(CFixedPoint)-0.1')|+=%0]\n[concept_spec_blue_chip] de notre côté, #v [GetPlayer.MakeScope.Var('spec_bc_n').GetValueWithDefault('(CFixedPoint)0')|0]#! : [Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.03')|+=%0]\n[concept_spec_blue_chip] de leur côté, #v [Country.MakeScope.Var('spec_bc_n').GetValueWithDefault('(CFixedPoint)0')|0]#! : [Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)-0.03')|+=%0]\n\n#weak Chaque coup réussi la pousse de #v 10 %#!, jusqu’à #v 5#! par camp#!"
 SPEC_RV_THIN_US: "\n#indent_newline:2 Nous sommes #N dispersés#! sur #v [GetPlayer.MakeScope.Var('spec_rv_n_all').GetValueWithDefault('(CFixedPoint)0')|0]#! duels, donc notre score compte #N [GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1')|%0]#!#!"
 SPEC_RV_THIN_THEM: "\n#indent_newline:2 Ils sont #P dispersés#! sur #v [Country.MakeScope.Var('spec_rv_n_all').GetValueWithDefault('(CFixedPoint)0')|0]#! duels, donc leur score compte #P [Country.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1')|%0]#!#!"
