 SPEC_XS_TT: "#header @spec_speculative_excess! $concept_spec_speculative_excess$ : [Country.MakeScope.Var('spec_heat').GetValueWithDefault('(CFixedPoint)0')|0] / 200#!\n$TOOLTIP_DELIMITER$\n#italic C’est la bulle. Plus un essor reste chaud longtemps, plus elle grossit.#!\n\n#P Grossit#! tant que la [concept_spec_market_confidence] est à #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#! ou plus\n#v Dégonfle#! lentement tant qu’elle est entre #v 60#! et #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#!\n#N Éclate#! si elle tombe sous #v 60#!\n\nSi elle éclatait maintenant : #N -[Country.MakeScope.ScriptValue('spec_burst_now')|0]#! de [concept_spec_market_confidence] d’un coup (jamais plus de #N [Country.MakeScope.ScriptValue('spec_burst_max')|0]#!)\n$TOOLTIP_DELIMITER$\n#instruction Pour la dégonfler en douceur, maintenez la confiance entre 60 et [Country.MakeScope.ScriptValue('spec_heat_from')|0]. La barre devient rouge quand un éclatement ferait mal.#!"
