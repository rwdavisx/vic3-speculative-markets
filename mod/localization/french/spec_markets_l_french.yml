 SPEC_LEV_MAIN_TT: "#header @spec_leverage! [concept_spec_leverage]#!\n$TOOLTIP_DELIMITER$\n#italic Ce que nos banques ont prêté, compté en mois de revenus.#!\n\nLes banques nous ont prêté #v #tooltippable #tooltip:[Country.GetTooltipTag],SPEC_LEV_MONTHS_TT [Country.MakeScope.ScriptValue('spec_lev')|1] mois#!#!#! de revenus du fonds\nÉtat : [SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_lev'), '(CFixedPoint)8'), 'SPEC_LEV_WORD_DANGER', SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_lev'), '(CFixedPoint)3'), 'SPEC_LEV_WORD_RISKY', 'SPEC_LEV_WORD_SAFE'))]\n$SPEC_LEV_LIMIT$\n$TOOLTIP_DELIMITER$\n[concept_throughput] grâce à l’argent emprunté : #P +[Country.MakeScope.ScriptValue('spec_lev_boom_pct')|0] %#!\nUne panique éclate sous #v [Country.MakeScope.ScriptValue('spec_panic_at')|0]#! de [concept_spec_market_confidence]\nSi une panique éclatait maintenant, les [concept_spec_bad_debts] coûteraient #N -[Country.MakeScope.ScriptValue('spec_crunch_tp_if_pct')|1] %#! de [concept_throughput] et #N -[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_crunch_if'), '(CFixedPoint)0.75')|1] %#! d’investissement\n[AddLocalizationIf(Or(Country.MakeScope.Var('spec_crunch').IsSet, Country.MakeScope.Var('spec_lev_fade').IsSet), 'SPEC_LEV_NOTES')]\n[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_lev'), '(CFixedPoint)8'), 'SPEC_LEV_ADVICE_DANGER', SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_lev'), '(CFixedPoint)3'), 'SPEC_LEV_ADVICE_RISKY', 'SPEC_LEV_ADVICE_SAFE'))]"
