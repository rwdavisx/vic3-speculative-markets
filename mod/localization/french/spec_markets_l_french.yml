 SPEC_COL_LEVER: "Intervention"
 SPEC_COL_LEVER_TT: "#header Interventions sur le marché#!\n$TOOLTIP_DELIMITER$\n#italic Intervenir pour refroidir un bien ou le relancer.#!\n\n#v Freiner la spéculation#! maintient l’intérêt au niveau #v Calme#!. Les producteurs #N perdent#! de la [concept_throughput] et paient un prélèvement\n#v Encourager l’investissement#! maintient l’intérêt au moins au niveau #v Vif#!. Les producteurs #P gagnent#! de la $concept_throughput$ aux frais de l’État\n$TOOLTIP_DELIMITER$\n#weak Chaque mesure coûte de l’[concept_authority] chaque mois jusqu’à sa levée, davantage pour les biens essentiels et les biens très échangés#!"
 SPEC_SEP_FEVERISH_TT: "#header @spec_interest_feverish! [concept_spec_investor_interest] : Fiévreux#!\nPart de nos échanges : #v [Country.MakeScope.Var('spec_heat_6').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#italic À quel point les investisseurs sont attirés par ce bien.#!\n\n[concept_throughput] des producteurs : #P +8 %#!\nLa [concept_spec_market_confidence] #P augmente#! chaque mois (davantage si le bien pèse lourd dans nos échanges, pas pendant une [concept_spec_financial_panic])\nÀ sa fin : [concept_spec_collapse]"
 SPEC_SEP_EAGER_TT: "#header @spec_interest_eager! [concept_spec_investor_interest] : Avide#!\nPart de nos échanges : #v [Country.MakeScope.Var('spec_heat_5').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#italic À quel point les investisseurs sont attirés par ce bien.#!\n\n[concept_throughput] des producteurs : #P +5 %#!\nLa [concept_spec_market_confidence] #P augmente#! chaque mois (davantage si le bien pèse lourd dans nos échanges, pas pendant une [concept_spec_financial_panic])\nÀ sa fin : [concept_spec_bust]"
 SPEC_SEP_KEEN_TT: "#header @spec_interest_keen! [concept_spec_investor_interest] : Vif#!\nPart de nos échanges : #v [Country.MakeScope.Var('spec_heat_4').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#italic L’envie qu’ont les investisseurs de ce bien.#!\n\n[concept_throughput] des producteurs : #P +3 %#!\nÀ sa fin : [concept_spec_correction]"
 SPEC_SEP_CALM_TT: "#header @spec_interest_calm! [concept_spec_investor_interest] : Calme#!\nPart de nos échanges : #v [Country.MakeScope.Var('spec_heat_3').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#italic L’envie qu’ont les investisseurs de ce bien.#!\n\nRien ne se passe à ce niveau"
 SPEC_SEP_DOUBTFUL_TT: "#header @spec_interest_doubtful! [concept_spec_investor_interest] : Hésitant#!\nPart de nos échanges : #v [Country.MakeScope.Var('spec_heat_2').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#italic L’envie qu’ont les investisseurs de ce bien.#!\n\n[concept_throughput] des producteurs : #N -5 %#!\nAprès la fin d’un essor, le bien reste un temps à ce niveau ou en dessous pour se rétablir"
 SPEC_SEP_FLEEING_TT: "#header @spec_interest_fleeing! [concept_spec_investor_interest] : Fuyant#!\nPart de nos échanges : #v [Country.MakeScope.Var('spec_heat_1').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#italic L’envie qu’ont les investisseurs de ce bien.#!\n\n[concept_throughput] des producteurs : #N -10 %#!\nSi un essor #v Fiévreux#! tombe aussi bas, il finit en [concept_spec_collapse]"
 SPEC_IB_TURNING_TT: "#header Retournement de l’essor#!\n$TOOLTIP_DELIMITER$\n#italic [Goods.GetName] a connu un grand essor, et il s’essouffle.#!\n\nSi l’[concept_spec_investor_interest] continue de baisser, il finit en [concept_spec_collapse]\nCela coûterait environ #N [Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! de [concept_spec_market_confidence]"
 SPEC_IB_HEAT_TT: "#header @spec_investor_interest! [concept_spec_investor_interest] pour [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n$SPEC_TILE_BODY$"
 SPEC_TILE_NEXT: "[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)6'), 'SPEC_TILE_DANGER', 'SPEC_IB_EMPTY')]"
