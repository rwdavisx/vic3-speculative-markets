 SPEC_TM_WARCAP_TT: "#header Limite pour toutes les guerres : [Country.MakeScope.Var('spec_tm_warcap').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_war_sum').GetValueWithDefault('(CFixedPoint)0')|+=2] pour toutes nos guerres ensemble\nPlafonné de #N -4#! à #P +0.5#! par mois"
 SPEC_TM_PLAY_TT: "#header [concept_diplomatic_play] : [Country.MakeScope.Var('spec_tm_play').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#N -0.5#! car nous sommes dans un [concept_diplomatic_play]\n$TOOLTIP_DELIMITER$\n#weak Ne compte qu’une fois, quel que soit le nombre de crises, jusqu’au début d’une [concept_war]#!"
 SPEC_TM_BROKE_TT: "#header Trésor qui s’épuise : [Country.MakeScope.Var('spec_tm_broke').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#v [Country.MakeScope.ScriptValue('spec_broke_weeks')|0]#! semaines avant la [concept_bankruptcy] si nous continuons à perdre de l’argent ainsi\n$TOOLTIP_DELIMITER$\n#weak Commence #v 20#! semaines avant la $concept_bankruptcy$ et grimpe jusqu’à #N -3#! à mesure que le [concept_treasury] se vide#!"
 SPEC_TM_DEFAULT_TT: "#header [concept_default] : [Country.MakeScope.Var('spec_tm_default').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#N -5#! car nous sommes en [concept_default]"
 SPEC_TM_REVOLUTION_TT: "#header [concept_revolution] : [Country.MakeScope.Var('spec_tm_revolution').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#N -2#! en raison d’une [concept_revolution]"
 concept_spec_market_confidence: "Confiance du marché"
 concept_spec_market_confidence_desc: "@spec_market_confidence! #italic Le regard des investisseurs sur le [concept_market] de votre [concept_country], de #v 0#! (#v Panique#!) à #v 100#! (#v Frénésie#!).#!\n\nLa peur #N ralentit l’investissement#! et renchérit les [concept_loans]\nL’avidité #P accélère l’investissement#!\n\n#P Augmente#! avec les [Concept('concept_good','$concept_goods|q$')] en essor\n#N Baisse#! avec les [Concept('concept_spec_boom_end','$concept_spec_boom_ends|q$')], les [Concept('concept_spec_foreign_panic','$concept_spec_foreign_panics|q$')], les [Concept('concept_diplomatic_play','$concept_diplomatic_plays|q$')] et la [concept_war]\nLes essors et leurs fins sont plus forts là où les bâtiments de type $building_financial_district$ pèsent davantage dans l’économie, et plus faibles là où ceux de type $building_manor_house$ sont plus nombreux\n\nAu-delà de #v 55#!, les banques prêtent au [concept_investment_pool]\nÀ #v 80#! ou plus survient une [concept_spec_speculative_mania]\nSous #v 25#!, une [concept_spec_financial_panic] éclate\nUn [concept_spec_leverage] élevé relève ce seuil\nPeu de bâtiments de type $building_financial_district$ l’abaissent un peu"
 concept_spec_speculative_mania: "Frénésie spéculative"
 concept_spec_speculative_mania_desc: "@spec_speculative_mania! #italic Votre [concept_market] est saisi d’une folle avidité.#!\n\nDure tant que la [concept_spec_market_confidence] est à #v 80#! ou plus\n#P Les banques prêtent le plus librement#! au [concept_investment_pool]\n#N Chaque [concept_spec_boom_end] coûte davantage#! de $concept_spec_market_confidence$\n\nUne frénésie longue ou très intense aide pendant quelques années les [Concept('concept_political_movement','$concept_political_movements|q$')] favorables à [GetLawType('law_laissez_faire').GetName]"
 concept_spec_financial_panic: "Panique financière"
 concept_spec_financial_panics: "Paniques financières"
 concept_spec_financial_panic_desc: "@spec_financial_panic! #italic Un krach, quand les investisseurs fuient et que les banques retirent leur argent.#!\n\nÉclate lorsque votre [concept_spec_market_confidence] passe sous #v 25#!. Au-delà de #v 3#! mois de [concept_spec_leverage], ce seuil s’élève, jusqu’à #v 65#!. Avec peu de bâtiments de type $building_financial_district$, il baisse, jusqu’à #v 20#!.\n\nTant qu’elle dure :\n#N Moins#! de [concept_throughput] dans chaque bâtiment, et moins d’impôts perçus\n#N Ponctionne#! le [concept_treasury] chaque semaine pour secourir les chômeurs\n#N Ralentit#! la [concept_private_construction] et l’investissement\n#N Réduit#! le bonus de $concept_throughput$ des [Concept('concept_company','$concept_companies|q$')]\n#N Certains investisseurs deviennent#! [Concept('concept_radical','$concept_radicals|q$')]\n#N Les banques retirent#! l’[concept_spec_outstanding_credit] du [concept_investment_pool]\n\nElle se propage à chaque [concept_country] lié sous forme de [concept_spec_foreign_panic], et les capitaux fuient vers les [Concept('concept_great_power','$concept_great_powers|q$')] épargnées\nEnsuite, les [Concept('concept_political_movement','$concept_political_movements|q$')] opposés à [GetLawType('law_laissez_faire').GetName] gagnent des soutiens pendant quelques années"
 concept_spec_foreign_panic: "Panique étrangère"
 concept_spec_foreign_panics: "Paniques étrangères"
 concept_spec_foreign_panic_desc: "@spec_foreign_panic! #italic Une panique à l’étranger qui déborde sur votre marché.#!\n\nQuand une [concept_spec_financial_panic] éclate dans un [concept_country] lié au vôtre, votre [concept_spec_market_confidence] #N baisse#!\nLes pays sont liés par un [concept_market] commun, un rapport de sujétion, des droits d’investissement, des échanges importants ou la propriété d’une part de votre économie\n#N Plus les liens sont étroits, plus la baisse est forte#!\n\n[GetLawType('law_free_trade').GetName] renforce les liens commerciaux\nLes autres politiques commerciales les affaiblissent\nUn [concept_embargo] rompt le lien commercial"
 concept_spec_boom_end: "Fin d’essor"
 concept_spec_boom_ends: "Fins d’essor"
 concept_spec_boom_end_desc: "@spec_boom_end! #italic Tout ce qui monte redescend. Un essor prend fin lorsque l’[concept_spec_investor_interest] pour un [concept_good] retombe après une hausse.#!\n\nPlus il est monté haut, plus la chute est rude :\nPic au niveau #v Vif#! : une [concept_spec_correction]\nPic au niveau #v Avide#! : une [concept_spec_bust]\nPic au niveau #v Fiévreux#! : un [concept_spec_collapse]\n\n#N Réduit#! votre [concept_spec_market_confidence], davantage pour les grands essors et pour les $concept_goods$ qui pèsent plus dans les échanges du [concept_market]\nLes investisseurs se tiennent ensuite à l’écart pendant la reprise du $concept_good$\nSi une [concept_company] le produit, son secteur #N perd#! de la [concept_throughput]\n\n#instruction Le pic s’estompe un peu chaque mois. Un essor qui se tempère lentement se termine plus en douceur, voire sans aucune $concept_spec_boom_end$.#!"
 concept_spec_correction: "Correction"
 concept_spec_correction_desc: "@spec_correction! #italic Une $concept_spec_correction$ est la plus modérée des [concept_spec_boom_end].#!\n\nSurvient lorsque l’[concept_spec_investor_interest] pour un [concept_good] ayant culminé au niveau #v Vif#! retombe au niveau #v Hésitant#!\n\n#N Réduit#! un peu la [concept_spec_market_confidence]\nLes investisseurs se détournent du $concept_good$ pendant #v 3#! mois\nSi une [concept_company] le produit, son secteur perd #N 2.5 %#! de [concept_throughput] pendant #v 90#! jours, et #N 25 %#! de plus pour chacune des technologies [GetTechnology('corporate_charters').GetName] et [GetTechnology('corporate_management').GetName] recherchées"
 concept_spec_bust: "Débâcle"
 concept_spec_bust_desc: "@spec_bust! #italic Une $concept_spec_bust$ est une [concept_spec_boom_end] plus rude qu’une [concept_spec_correction].#!\n\nSurvient lorsque l’[concept_spec_investor_interest] pour un [concept_good] ayant culminé au niveau #v Avide#! retombe au niveau #v Hésitant#!\n\n#N Réduit#! davantage la [concept_spec_market_confidence], environ #v 2#! fois plus qu’une $concept_spec_correction$ pour un même essor\nLes investisseurs se détournent du $concept_good$ pendant #v 6#! mois\nSi une [concept_company] le produit, son secteur perd #N 5 %#! de [concept_throughput] pendant #v 180#! jours, et #N 25 %#! de plus pour chacune des technologies [GetTechnology('corporate_charters').GetName] et [GetTechnology('corporate_management').GetName] recherchées"
 concept_spec_collapse: "Effondrement"
 concept_spec_collapse_desc: "@spec_collapse! #italic Un $concept_spec_collapse$ est la pire des [concept_spec_boom_end].#!\n\nSurvient lorsque l’[concept_spec_investor_interest] pour un [concept_good] ayant culminé au niveau #v Fiévreux#! tombe jusqu’au niveau #v Fuyant#!\n\n#N Réduit#! fortement la [concept_spec_market_confidence], environ #v 5#! fois plus qu’une [concept_spec_correction] pour un même essor\nLes investisseurs se détournent du $concept_good$ pendant #v 12#! mois\nSi une [concept_company] le produit, son secteur perd #N 10 %#! de [concept_throughput] pendant un an, et #N 25 %#! de plus pour chacune des technologies [GetTechnology('corporate_charters').GetName] et [GetTechnology('corporate_management').GetName] recherchées\n\nPire encore, un $concept_spec_collapse$ touchant une grande part des échanges du [concept_market] peut déclencher une [concept_spec_financial_panic]"
 concept_spec_investor_interest: "Intérêt des investisseurs"
 concept_spec_investor_interest_desc: "@spec_investor_interest! #italic L’attrait qu’exercent sur les investisseurs les [Concept('concept_building','$concept_buildings|q$')] produisant un [concept_good], de #v Fuyant#! à #v Fiévreux#!.#!\n\n#P Augmente#! tant que le [concept_market_price] dépasse sa moyenne à long terme\n#N Baisse#! tant qu’il lui est inférieur\n\nLa [concept_throughput] de ces bâtiments suit cet intérêt, de #N -10 %#! au niveau #v Fuyant#! à #P +8 %#! au niveau #v Fiévreux#!\nDe même que la [concept_prosperity] des [Concept('concept_company','$concept_companies|q$')] produisant le $concept_good$\nUn $concept_good$ en essor augmente la [concept_spec_market_confidence]\nQuand l’intérêt retombe, l’essor se termine par une [concept_spec_boom_end]"
 concept_spec_credit_policy: "Politique de crédit"
 concept_spec_credit_policy_tight: "Crédit restreint"
 concept_spec_credit_policy_normal: "Crédit normal"
 concept_spec_credit_policy_loose: "Crédit souple"
 concept_spec_credit_policy_desc: "@spec_credit_policy! #italic La facilité avec laquelle les banques prêtent au [concept_investment_pool].#!\n\nDébloquée par [GetTechnology('central_banking').GetName]\nPeut être : $concept_spec_credit_policy_tight$, $concept_spec_credit_policy_normal$ ou $concept_spec_credit_policy_loose$\n\nUn crédit #v plus restreint#! ralentit l’investissement et fait baisser la [concept_spec_market_confidence] quand elle est élevée\nUn crédit #v plus souple#! accroît l’[concept_spec_outstanding_credit]\n\nUne fois modifiée, elle est verrouillée pendant #v 6#! mois"
 concept_spec_leverage: "Levier du crédit"
 concept_spec_leverage_desc: "@spec_leverage! #italic Ce que vos banques ont prêté. C’est votre [concept_spec_outstanding_credit], compté en mois de revenus du [concept_investment_pool].#!\n\n#P +2 %#! de [concept_throughput] pour chaque mois entier, jusqu’à #P +24 %#!\nLe bonus s’estompe pendant une [concept_spec_financial_panic] et tant que des [concept_spec_bad_debts] subsistent\n\nAu-delà de #v 3#! mois, cela devient risqué :\n#N Une $concept_spec_financial_panic$ éclate plus tôt#!, à une [concept_spec_market_confidence] plus élevée\n#N Elle laisse des $concept_spec_bad_debts$#!"
 concept_spec_bad_debts: "Créances douteuses"
 concept_spec_bad_debts_desc: "@spec_bad_debts! #italic Les pertes qu’une [concept_spec_financial_panic] laisse dans les comptes de vos banques.#!\n\nElles augmentent avec le [concept_spec_leverage] au-delà de #v 3#! mois\n\nChaque point : #N -0.4 %#! de [concept_throughput] et #N -0.75 %#! d’investissement\nElles s’accumulent pendant quelques mois, puis reculent lentement\nAu pire, elles mettent environ #v 6#! ans à se résorber\n#N Les banques ne prêtent plus#! tant qu’elles subsistent\n\n#v Prêter aux banques#! ne les efface pas\n#v Racheter les créances douteuses#! les réduit de moitié, une seule fois tant qu’elles durent"
 concept_spec_lending_standards: "Critères de prêt"
 concept_spec_lending_standards_desc: "@spec_lending_standards! #italic La prudence avec laquelle les banques de votre [concept_country] prêtent. Ils peuvent être #v Stricts#!, #v Prudents#!, #v Sains#!, #v Laxistes#! ou #v Imprudents#!.#!\n\nDes banques plus laxistes prêtent davantage au [concept_investment_pool] et en placent une plus grande part dans les essors\n#N Les essors finissent donc plus durement#! et un sauvetage bancaire coûte plus cher\n\n#N S’assouplissent#! un peu chaque mois sans [concept_spec_financial_panic], passant de #v Stricts#! à #v Imprudents#! en environ #v 20#! années calmes\n#N S’assouplissent encore#! après chaque sauvetage bancaire ou chaque recours à #v Racheter les créances douteuses#!\n#P Se resserrent#! quand un essor prend fin, surtout quand une $concept_spec_financial_panic$ suit son cours sans sauvetage bancaire"
 concept_spec_blue_chip: "Valeur de premier ordre"
 concept_spec_blue_chips: "Valeurs de premier ordre"
 concept_spec_blue_chip_desc: "@spec_blue_chip! #italic Une [concept_company] vedette qui a maintenu #v 70#! de [concept_prosperity] ou plus pendant #v 12#! mois d’affilée.#!\n\nChacune ajoute #v 2#! à notre [concept_spec_company_strength]\n#b Chacune#! #grey (les 5 premières en entier, les 5 suivantes pour moitié)#!\n[concept_spec_market_confidence] perdue lors des krachs et des paniques : #P -4 %#!\nRéputation de la [concept_spec_exchange] : #P +0.4 %#! de la barre complète par an\nDuels de la [concept_spec_exchange] : #P +3 %#! en notre faveur\nContribution des capitalistes au [concept_investment_pool] : #P +0.6 %#!\nIntérêts des prêts : #P -1 %#!\n\n#b Si nous en perdons une#!\nCela arrive après #v 3#! mois d’affilée sous #v 70#! de [concept_prosperity]\nRéputation de la [concept_spec_exchange] : #N -1.7 %#! de la barre complète\n[concept_spec_market_confidence] : #N -3#!\nUne attaque à la baisse qui nous vise en rend une #N Fragile#! pendant un an. Elle perd alors le statut après un seul mois sous #v 70#! de [concept_prosperity], et non #v 3#!\n\n#b Compagnie de l’année#!\nSi la nôtre est la plus prospère du monde, nous gagnons #P +2.5 %#! de la barre complète en réputation de la [concept_spec_exchange], et #P +5 %#! de [concept_prestige] pendant un an\n\n#N Perdue#! après #v 3#! mois d’affilée sous #v 70#!, puis les #v 12#! mois repartent de zéro\nUn seul mois en dessous remet à zéro la progression vers ce statut\nUn [concept_country] qui quitte l’économie de marché n’en garde aucune"
 concept_spec_company_strength: "Puissance des compagnies"
 concept_spec_company_strength_desc: "@spec_company_strength! #italic La force de l’ensemble des [Concept('concept_company','$concept_companies|q$')] d’un [concept_country].#!\n\nChaque compagnie ajoute sa [concept_prosperity] divisée par #v 20#!, donc une compagnie à #v 100#! ajoute #v 5#!\nChaque [concept_spec_blue_chip] ajoute #v 2#! de plus\nLe pays le plus fort remporte le titre de Siège des grandes compagnies"
 concept_spec_outstanding_credit: "Encours de crédit"
 concept_spec_outstanding_credit_desc: "@spec_outstanding_credit! #italic L’argent que les banques ont prêté au [concept_investment_pool] et qu’elles n’ont pas encore récupéré.#!\n\nLes banques prêtent tant que la [concept_spec_market_confidence] dépasse #v 55#!\nElles s’arrêtent à un plafond de crédit de #v 3#! mois de revenus du fonds\n[GetTechnology('central_banking').GetName] ajoute #v 5#! mois\n[GetTechnology('investment_banks').GetName] et [GetTechnology('international_exchange_standards').GetName] ajoutent #v 2#! mois chacun\n\nUne petite part est remboursée par le fonds chaque mois\nQuand une [concept_spec_financial_panic] éclate, les banques #N en retirent une partie#!\n\n#lore Les banques ont prêté sur des actions ferroviaires dans les années 1840, sur le coton en 1837 et sur des terrains à bâtir à Vienne en 1873, et ont été prises au piège quand ces essors ont éclaté.#!"
