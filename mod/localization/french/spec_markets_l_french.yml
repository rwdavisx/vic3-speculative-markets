 spec_finance_bar_desc: "@spec_sound_finance! [concept_spec_sound_finance] : #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#! sur #v 3#! [concept_spec_banking_reforms]"
 spec_inquiry_no_panic_tt: "Aucune [concept_spec_financial_panic] n’est en cours"
 spec_inquiry_reform_tt: "Notre technologie permet une [Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')] pas encore adoptée"
 spec_suspend_panic_tt: "Une [concept_spec_financial_panic] est en cours"
 spec_suspend_note_tt: "Nous avons choisi la Currency School pour nos règles des billets"
 spec_inquiry_when_tt: "Une [concept_spec_financial_panic] a pris fin dans l’année écoulée et aucune commission n’a siégé depuis, ou #v 10#! années calmes sont passées sans panique (encore #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_calm_left')|0]#! mois)"
 spec_convert_conf_tt: "La [concept_spec_market_confidence] atteint au moins #v 60#!"
 spec_convert_debt_tt: "Notre dette atteint au moins #v 20 %#! de notre limite de [concept_credit]"
 spec_convert_cd_tt: "Nous n’avons pas converti la dette au cours des #v 10#! dernières années"
 spec_convert_conf_cost_tt: "@spec_market_confidence! [concept_spec_market_confidence] #N -5#!"
 spec_relief_when_tt: "Une [concept_spec_financial_panic] ou la [concept_spec_long_depression] est en cours"
 spec_relief_cd_tt: "Aucun chantier de secours au cours des #v 12#! derniers mois"
 spec_suspend_tt: "La [concept_spec_financial_panic] #P prend fin#! d’ici #v 2#! mois, mais frappe de toute sa force jusque-là\n[concept_spec_market_confidence] #P +15#!\nPendant #v 10#! ans ensuite, l’[concept_spec_speculative_excess] s’accumule #N 50 %#! plus vite\nLes [concept_spec_lending_standards] s’assouplissent, comme après un sauvetage bancaire"
 spec_suspend_act: "Suspendre la loi bancaire"
 spec_suspend_act_desc: "Autoriser la banque à émettre plus de billets que la loi ne le permet. La panique s’apaise en quelques mois sans rien coûter au Trésor. Le revers, c’est que les investisseurs apprennent que nous les renflouerons toujours. Compte comme #v Prêter aux banques#! pour cette panique.\n\n#lore La Grande-Bretagne a suspendu son Bank Charter Act en 1847, 1857 et 1866.#!"
 spec_relief_works_button: "Chantiers de secours"
 spec_relief_works_button_desc: "Financer des travaux publics et des secours tant que dure la crise. Pendant #v 12#! mois, cela améliore les aides sociales et la construction, et retire des soutiens aux radicaux. Plus notre [concept_gdp] est grand, plus le coût hebdomadaire est élevé."
 spec_convert_debt: "Convertir la dette nationale"
 spec_convert_debt_desc: "Tant que les investisseurs sont de bonne humeur, échangeons nos emprunts contre de nouveaux à un taux plus bas. Ceux qui vivaient des anciens intérêts ne nous remercieront pas."
 spec_inquiry: "Commission d’enquête"
 spec_inquiry_desc: "Demander à une commission d’entendre banquiers, courtiers et épargnants ruinés, et de dire comment gérer nos banques et nos compagnies. Son rapport adopte une [Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')] que notre technologie permet. Elle occupe le gouvernement pendant #v 6#! mois."
 spec_debt_converted: "Dette convertie"
 spec_debt_converted_desc: "Nos emprunts ont été convertis à un taux plus bas alors que les investisseurs étaient empressés de prêter."
 spec_relief_works: "Chantiers de secours"
 spec_relief_works_desc: "Des travaux publics et des secours sont fournis à ceux que la crise a privés d’emploi."
 spec_relief_costs: "Coût des chantiers de secours"
 spec_relief_costs_desc: "Le Trésor supporte le coût des travaux publics et des secours."
 spec_act_suspended: "Loi bancaire suspendue"
 spec_act_suspended_desc: "Le gouvernement a écarté sa propre loi pour mettre fin à une panique."
 spec_inquiry_sitting: "Commission d’enquête"
 spec_inquiry_sitting_desc: "Une commission recueille des témoignages sur la conduite de nos banques et de nos compagnies."
 spec_sound_finance: "Finances saines"
 spec_sound_finance_desc: "Notre monnaie, nos banques et nos compagnies sont régies par des règles qui inspirent confiance aux investisseurs."
 spec_rentiers_cut: "Revenus des rentiers réduits"
 spec_relief_thanks: "Chantiers de secours"
 spec_dear_money: "Argent cher"
 spec_free_issue: "Liberté bancaire"
 spec_disclosure_burden: "Règles de transparence"
 spec_disclosure_welcomed: "Règles de transparence"
 spec_report_shelved: "Les affaires continuent"
 spec_report_buried: "Enquête enterrée"
 spec_reform_currency_tt: "Les banques prêtent #v 25 %#! de moins, l’[concept_spec_speculative_excess] grossit #v 25 %#! moins vite, et chaque [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')] dure #v 25 %#! plus longtemps\nPermet de suspendre la loi bancaire pendant une panique"
 spec_reform_free_tt: "Les banques prêtent #v 25 %#! de plus, les essors sont #v 10 %#! plus grands, et leur fin coûte #v 10 %#! de [concept_spec_market_confidence] en plus"
 spec_reform_llr_tt: "#v Prêter aux banques#! coûte #v 50 %#! de moins et met fin à la panique un mois plus tôt"
 spec_reform_company_tt: "Quand les essors finissent, ils coûtent #v 30 %#! de [concept_spec_market_confidence] en moins"
 spec_reform.1.t: "Commission d’enquête"
 spec_reform.1.d_panic: "La commission nommée après la panique a remis son rapport en trois volumes de témoignages de banquiers, de courtiers et de déposants ruinés. Ses membres conviennent que la panique n’était pas un fléau du ciel. Sur presque tout le reste, ils sont en désaccord, et chaque remède a ses défenseurs à la chambre."
 spec_reform.1.d_calm: "Les marchés étant calmes, une commission a passé l’année à entendre banquiers, courtiers et économistes sur les moyens d’empêcher le prochain essor de finir en ruine. Son rapport propose plusieurs remèdes, chacun défendu par ses partisans à la chambre."
 spec_reform.1.f: "« Dans les périodes de vive alarme, une faillite en entraîne beaucoup d’autres ; le meilleur moyen de prévenir celles qui en découlent est d’arrêter la première, qui en est la cause. »"
 spec_reform.1.a: "Lions l’émission des billets à l’or des coffres."
 spec_reform.1.b: "Que toute banque saine émette ses propres billets."
 spec_reform.1.c: "Désignons un prêteur en dernier ressort."
 spec_reform.1.d: "Obligeons les compagnies à publier leurs comptes."
 spec_reform.1.e: "Remercier la commission et ranger son rapport."
 spec_reform.2.t: "Finances saines"
 spec_reform.2.d: "Nos banques émettent leurs billets selon des règles, un prêteur se tient prêt lorsque la panique frappe, et nos compagnies doivent montrer aux investisseurs ce qu’elles possèdent et ce qu’elles doivent. À l’étranger, nos obligations se vendent désormais au-dessus du pair, et l’on cite [ROOT.GetCountry.GetCapital.GetCityHubName] comme un havre sûr pour les capitaux."
 spec_reform.2.f: "« Le premier devoir d’un banquier n’est pas de gagner de l’argent, mais de le garder. »"
 spec_reform.2.a: "La confiance est le fondement du crédit."
