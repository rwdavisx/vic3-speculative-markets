 alert_spec_bailout_alert_desc: "Les [concept_spec_bad_debts] freinent la [concept_throughput] et l’investissement, et l’État n’a pas encore racheté de créances douteuses."
 alert_spec_bailout_alert_hint: "Utiliser #v Racheter les créances douteuses#! dans l’onglet #bold $SPEC_FIN_TAB_BANKING$#! de la fenêtre #bold $SPEC_FINANCE$#!. Une seule fois tant qu’elles durent.\n#P Réduit de moitié#! les [concept_spec_bad_debts] restantes\nCoûte #v @money![GetPlayer.MakeScope.ScriptValue('spec_bailout_cost')|D]#!"
 alert_spec_bailout_alert_action: "Journal"
