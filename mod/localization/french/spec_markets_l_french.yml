 building_group_bg_financial_districts_standard_of_living_add: "[concept_sol] des employés des quartiers d’affaires"
 building_group_bg_financial_districts_standard_of_living_add_desc: "Un bonus ou un malus au [concept_sol] des employés des quartiers d’affaires"
 SPEC_H_COMPANIES: "Compagnies"
 SPEC_H_COMPANIES_TT: "#header $concept_companies$#!\n$TOOLTIP_DELIMITER$\n#italic Comment l’humeur du marché envers un bien modifie les bâtiments qui le produisent.#!\n\nAvec un [concept_spec_investor_interest] élevé, ses bâtiments obtiennent #P plus#! de [concept_throughput]\nAvec un intérêt faible, ils en obtiennent #N moins#!\nAprès la fin de son essor, ils en obtiennent #N encore moins#! jusqu’à sa reprise\nUne [concept_company] gagne davantage tant que l’on veut ses biens"
 SPEC_H_COMPANIES_RIGHT: "[GetDataModelSize(Country.GetCompanies)]  @spec_blue_chip! #v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!"
 SPEC_H_COMPANIES_RIGHT_TT: "#header @spec_company_strength! [concept_spec_company_strength] : #v [Country.MakeScope.ScriptValue('spec_log_kstr')|1]#!#!\n$TOOLTIP_DELIMITER$\n#italic Notre score pour le Siège des grandes compagnies.#!\n\n#b D’où il vient#!\nNous additionnons la [concept_prosperity] de toutes nos $concept_companies$, et chaque tranche de #v 20#! ajoute #v 1#!\n[Concept('concept_spec_blue_chip','$concept_spec_blue_chips|q$')] : #v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!, chacune ajoute #v 2#! de plus\n#grey Avoir plus de compagnies n’aide qu’à travers leur prospérité#!"
 SPEC_CO_BC: "#P [concept_spec_blue_chip]#!, qui ajoute #v 2#! à notre [concept_spec_company_strength] et compte parmi nos $concept_spec_blue_chips$"
 SPEC_CO_BC_LOW: "  #N En recul#!, sous #v 70#! de [concept_prosperity] pendant #v [Company.MakeScope.Var('spec_bc_low').GetValue|0]#! mois sur #v 3#!. À #v 3#!, elle perd son statut"
 SPEC_CO_BC_CLIMB: "Devient une [concept_spec_blue_chip] après encore #v [Subtract_CFixedPoint('(CFixedPoint)12', Company.MakeScope.Var('spec_bc_months').GetValue)|0]#! mois à au moins #v 70#! de [concept_prosperity]"
 SPEC_CO_COTY: "#P Compagnie de l’année#!, la [concept_spec_blue_chip] la plus prospère du monde"
 SPEC_CO_PROPPED: "  Soutenue pour garder son statut pour l’instant, quelle que soit sa [concept_prosperity]"
 SPEC_CO_FRAGILE: "  #N Fragile#!, donc un seul mois sous #v 70#! de [concept_prosperity] lui fait perdre le statut"
 SPEC_CO_NONE: "#low Nous ne possédons aucune compagnie#!"
 SPEC_BC_STRIP: "Valeurs de premier ordre"
 SPEC_BC_STRIP_N: "#v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#! détenues"
 SPEC_BC_STRIP_FX: "Bouclier anti-krach #P [Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)4.0')|0] %#!\nPoids en duel #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)3.0')|0] %#!\nRéputation #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.417')|1] %#! par an"
 SPEC_BC_STRIP_TT: "#header $concept_spec_blue_chips$ : #v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!#!\n$TOOLTIP_DELIMITER$\n#italic Nos compagnies les plus solides et les plus prospères.#!\n\nUne compagnie en devient une après #v 12#! mois d’affilée à au moins #v 70#! de [concept_prosperity]\n\n#b Ce que les nôtres nous apportent#!\n[concept_spec_market_confidence] perdue lors des krachs et des paniques : #P -[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)4.0')|0] %#! #grey (-4 % chacune)#!\nRéputation de la [concept_spec_exchange] : #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.4167')|1] %#! de la barre entière par an #grey (+0.4 % chacune)#!\nDuels de la [concept_spec_exchange] : #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)3.0')|0] %#! en notre faveur #grey (+3 % chacune)#!\nContribution des capitalistes au [concept_investment_pool] : #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.6')|1] %#! #grey (+0.6 % chacune)#!\nIntérêts des prêts : #P -[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)1.0')|0] %#! #grey (-1 % chacune)#!\n#grey Les 5 premières comptent en entier, les 5 suivantes à moitié. Chacune ajoute aussi #v 2#! à notre [concept_spec_company_strength], notre score pour le Siège des grandes compagnies#!\n$TOOLTIP_DELIMITER$\n#b Si nous en perdons une#!\nCela arrive après #v 3#! mois d’affilée sous #v 70#! de [concept_prosperity]\nRéputation de la [concept_spec_exchange] : #N -1.7 %#! de la barre entière\n[concept_spec_market_confidence] : #N -3#!\nUne attaque à la baisse qui nous touche en rend une #N fragile#! pendant un an. Elle perd alors son statut après un seul mois sous #v 70#! de [concept_prosperity], et non #v 3#!\n\n#b Compagnie de l’année#!\nSi la nôtre est la plus prospère du monde, la réputation de la [concept_spec_exchange] gagne #P +2.5 %#! de la barre entière, et le [concept_prestige] #P +5 %#! pendant un an"
