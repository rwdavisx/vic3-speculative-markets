 spec_rv_raid_fx: "Nous payons @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]. Leur [concept_spec_market_confidence] baisse de #N [Multiply_CFixedPoint('(CFixedPoint)3', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|0]#! sur 6 mois, ou la nôtre en cas d’échec."
 spec_rv_lure_fx: "Notre [concept_spec_outstanding_credit] augmente de #N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_lure_debt_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#!. Pendant 12 mois, #P [Multiply_CFixedPoint('(CFixedPoint)0.05', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|%0]#! de leur revenu du [concept_investment_pool] vient au nôtre."
 spec_rv_press_fx: "Nous payons #N 75#! d’influence pendant 12 mois. Leur [concept_spec_exchange] perd #N [Multiply_CFixedPoint('(CFixedPoint)0.0167', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|%0]#! de réputation. L’opération peut être démasquée, plus probablement là où leur presse est libre. Dans ce cas, les relations baissent de #N 20#! et notre réputation de #N 1.7 %#!."
 spec_rv_hold_fx: "Nous payons @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]. Une de leurs poussées dans notre duel est annulée."
 spec_rv_pushed_tt: "Ils ont fait pencher notre duel de leur côté"
 SPEC_RV_HOLD: "Tenir bon"
 spec_rv_shore_fx: "Nous payons @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]. Pendant 12 mois, leurs actions contre nous ont moitié moins d’effet."
