 SPEC_PLEDGE_STATE: "[SelectLocalization(Country.MakeScope.Var('spec_pledge').IsSet, SelectLocalization(Country.MakeScope.Var('spec_pledge_leave').IsSet, 'SPEC_PLEDGE_LEAVING', 'SPEC_PLEDGE_ON'), 'SPEC_PLEDGE_NONE')]"
