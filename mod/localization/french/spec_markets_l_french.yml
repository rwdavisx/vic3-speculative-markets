 concept_spec_long_depression: "Longue dépression"
 concept_spec_long_depression_desc: "@spec_long_depression! La $concept_spec_long_depression$ est une crise de toute l’économie mondiale. Elle débute lorsqu’une [concept_great_power] sombre dans une [concept_spec_financial_panic]. Elle touche alors tous les pays déjà en proie à la panique et se propage par les liens étroits : [concept_market] commun, sujets et suzerains, droits d’investissement, échanges importants et propriété étrangère.\n\nPendant le krach mondial (#v 4#! mois), le crédit gèle et la [concept_spec_market_confidence] s’effrite.\nPendant la dépression (jusqu’à #v 5#! ans), l’investissement, la construction et le commerce ralentissent, et certains pops deviennent [Concept('concept_radical','$concept_radicals|q$')].\nPendant la reprise (#v 1#! an), la $concept_spec_market_confidence$ revient.\n\nVos choix accélèrent votre propre reprise et celle du monde. Ceux d’une $concept_great_power$ comptent le plus."
 je_spec_depression: "La $SPEC_LD_NAME$"
