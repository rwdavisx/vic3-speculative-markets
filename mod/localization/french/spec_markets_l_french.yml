 SPEC_EFFECT_DEBT_TT: "#header Retraits en panique#!\n#v @money![Country.MakeScope.ScriptValue('spec_clawback')|D]#! si une panique éclatait aujourd’hui\n$TOOLTIP_DELIMITER$\n#italic De l’argent encore dans notre [concept_investment_pool] pour l’instant. Si une [concept_spec_financial_panic] éclate, les banques rappellent une partie de leurs prêts et le retirent.#!\n\n[concept_spec_outstanding_credit] : #v @money![Country.MakeScope.Var('spec_debt').GetValueWithDefault('(CFixedPoint)0')|D]#!\nPart rappelée : #v 50 %#!\nPart maximale du fonds qu’elle peut prendre : #v [Country.MakeScope.ScriptValue('spec_claw_share')|%0]#! avec notre [concept_spec_leverage]\n$TOOLTIP_DELIMITER$\n#instruction Plus notre [concept_spec_leverage] est élevé, plus une panique peut prendre du fonds : #v 25 %#! avec un levier faible, la totalité dès que le levier devient dangereux.#!\n\n#weak L’$concept_spec_outstanding_credit$ baisse de #v 2 %#! par mois à mesure que les prêts sont remboursés#!"
