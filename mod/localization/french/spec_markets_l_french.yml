 notification_spec_tied_mania_desc: "Les investisseurs du pays suivant ont été saisis d’une [concept_spec_speculative_mania] : [SCOPE.sC('spec_note_src').GetName]. Si elle se termine par une [concept_spec_financial_panic], nos liens avec lui entraîneront notre propre [concept_spec_market_confidence] à la baisse."
 notification_spec_tied_mania_tooltip: "#header $notification_spec_tied_mania_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_tied_mania_desc$"
 notification_spec_feverish_name: "Fièvre des investisseurs : [SCOPE.sGoods('spec_note_good').GetName]"
 notification_spec_feverish_desc: "L’[concept_spec_investor_interest] pour [SCOPE.sGoods('spec_note_good').GetName] est désormais #v Fiévreux#!. S’il tombe jusqu’à #v Fuyant#! alors que l’essor est encore aussi fort, celui-ci se terminera par un [concept_spec_collapse] et la [concept_spec_market_confidence] chutera lourdement. L’essor se réduit lentement en se tempérant : un refroidissement en douceur l’achève plus doucement, et Freiner la spéculation le fait retomber lentement, en une simple correction."
 notification_spec_feverish_tooltip: "#header $notification_spec_feverish_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_feverish_desc$"
 notification_spec_near_panic_name: "La confiance frôle la panique"
 notification_spec_near_panic_desc: "La [concept_spec_market_confidence] est tombée à #v [GetPlayer.MakeScope.Var('spec_conf').GetValue|0]#!. Sous #v $SPEC_PANIC_AT$#!, une [concept_spec_financial_panic] éclate."
 notification_spec_near_panic_tooltip: "#header $notification_spec_near_panic_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_near_panic_desc$"
 notification_spec_nearly_broke_name: "Le Trésor s’épuise"
 notification_spec_nearly_broke_desc: "À notre déficit actuel, nous atteindrons la [concept_bankruptcy] dans #v [GetPlayer.MakeScope.ScriptValue('spec_broke_weeks')|0]#! semaines. La [concept_spec_market_confidence] continuera de glisser jusqu’au redressement du budget."
 notification_spec_nearly_broke_tooltip: "#header $notification_spec_nearly_broke_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_nearly_broke_desc$"
 notification_spec_panic_over_name: "La panique s’apaise"
 notification_spec_panic_over_desc: "La [concept_spec_financial_panic] a suivi son cours. Ses pénalités et les versements de $spec_panic_relief$ ont pris fin. Les [concept_spec_bad_debts] qu’elle a laissées freinent encore la production et l’investissement jusqu’à ce qu’elles disparaissent."
