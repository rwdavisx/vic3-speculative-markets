 SPEC_IL_LEVEL_1_TT: "#header @spec_interest_fleeing! Fuyant#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_IL_LEVEL_CURRENT')]\n$TOOLTIP_DELIMITER$\n#italic L’un des six niveaux d’humeur des investisseurs, fixé par l’écart du prix avec la normale.#!\n\nUn bien est à ce niveau quand son prix est en dessous de #v [Country.MakeScope.ScriptValue('spec_level_from_2')|=+%1]#! par rapport à la normale\nEn ce moment : #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Effets :#!\n[concept_throughput] des producteurs : #N -10 %#!\nSi un essor #v Fiévreux#! tombe aussi bas, il finit en [concept_spec_collapse]\nL’investissement peut être encouragé ici, sauf si le bien est en reprise"
 SPEC_IL_LEVEL_2_TT: "#header @spec_interest_doubtful! Hésitant#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_LEVEL_CURRENT')]\n$TOOLTIP_DELIMITER$\n#italic L’un des six niveaux d’humeur des investisseurs, fixé par l’écart du prix avec la normale.#!\n\nUn bien est à ce niveau quand son prix est entre #v [Country.MakeScope.ScriptValue('spec_level_from_2')|=+%1]#! et #v [Country.MakeScope.ScriptValue('spec_level_from_3')|=+%1]#! par rapport à la normale\nEn ce moment : #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Effets :#!\n[concept_throughput] des producteurs : #N -5 %#!\nAprès la fin d’un essor, le bien reste un temps à ce niveau ou en dessous pour se rétablir\nL’investissement peut être encouragé ici, sauf si le bien est en reprise"
 SPEC_IL_LEVEL_3_TT: "#header @spec_interest_calm! Calme#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_LEVEL_CURRENT')]\n$TOOLTIP_DELIMITER$\n#italic L’un des six niveaux d’humeur des investisseurs, fixé par l’écart du prix avec la normale.#!\n\nUn bien est à ce niveau quand son prix est entre #v [Country.MakeScope.ScriptValue('spec_level_from_3')|=+%1]#! et #v [Country.MakeScope.ScriptValue('spec_level_from_4')|=+%1]#! par rapport à la normale\nEn ce moment : #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Effets :#!\nRien ne se passe à ce niveau\nL’investissement peut être encouragé ici, sauf si le bien est en reprise"
 SPEC_IL_LEVEL_4_TT: "#header @spec_interest_keen! Vif#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)4'), 'SPEC_IL_LEVEL_CURRENT')]\n$TOOLTIP_DELIMITER$\n#italic L’un des six niveaux d’humeur des investisseurs, fixé par l’écart du prix avec la normale.#!\n\nUn bien est à ce niveau quand son prix est entre #v [Country.MakeScope.ScriptValue('spec_level_from_4')|=+%1]#! et #v [Country.MakeScope.ScriptValue('spec_level_from_5')|=+%1]#! par rapport à la normale\nEn ce moment : #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Effets :#!\n[concept_throughput] des producteurs : #P +3 %#!\nÀ sa fin : [concept_spec_correction]"
 SPEC_IL_LEVEL_5_TT: "#header @spec_interest_eager! Avide#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)5'), 'SPEC_IL_LEVEL_CURRENT')]\n$TOOLTIP_DELIMITER$\n#italic L’un des six niveaux d’humeur des investisseurs, fixé par l’écart du prix par rapport à la normale.#!\n\nUn bien est à ce niveau quand son prix s’écarte de #v [Country.MakeScope.ScriptValue('spec_level_from_5')|=+%1]#! à #v [Country.MakeScope.ScriptValue('spec_level_from_6')|=+%1]#! de la normale\nEn ce moment : #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Effets :#!\n[concept_throughput] des producteurs : #P +5 %#!\nLa [concept_spec_market_confidence] #P augmente#! chaque mois (davantage si le bien pèse lourd dans nos échanges, pas pendant une [concept_spec_financial_panic])\nÀ sa fin : [concept_spec_bust]\nLa spéculation peut être freinée ici"
 SPEC_IL_LEVEL_6_TT: "#header @spec_interest_feverish! Fiévreux#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)6'), 'SPEC_IL_LEVEL_CURRENT')]\n$TOOLTIP_DELIMITER$\n#italic L’un des six niveaux d’humeur des investisseurs, fixé par l’écart du prix par rapport à la normale.#!\n\nUn bien est à ce niveau quand son prix dépasse la normale de plus de #v [Country.MakeScope.ScriptValue('spec_level_from_6')|=+%1]#!\nEn ce moment : #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Effets :#!\n[concept_throughput] des producteurs : #P +8 %#!\nLa [concept_spec_market_confidence] #P augmente#! chaque mois (davantage si le bien pèse lourd dans nos échanges, pas pendant une [concept_spec_financial_panic])\nÀ sa fin : [concept_spec_collapse]\nLa spéculation peut être freinée ici"
