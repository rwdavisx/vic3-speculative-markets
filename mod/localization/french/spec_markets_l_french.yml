 SPEC_DRIVER_RESTRAIN_TT: "#header Essors freinés : [Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] en raison des essors que nous avons désamorcés en douceur ce mois-ci\n#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#! selon la chaleur du marché ([concept_spec_market_conditions])\n$TOOLTIP_DELIMITER$\n#weak Les essors freinés se dégonflent lentement sous forme de [concept_spec_correction] au lieu de s’effondrer d’un coup#!"
 SPEC_DRIVER_CAUTION_TT: "#header Gouvernement et événements : [Country.MakeScope.Var('spec_c_caution').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\nUne variation ponctuelle due à nos décisions et aux événements du marché"
 SPEC_DRIVER_LIMIT_TT: "#header Plancher et plafond : [Country.MakeScope.Var('spec_c_limit').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\nLa [concept_spec_market_confidence] ne peut descendre sous #v 0#! ni dépasser #v 100#!. Voici la part qui n’a pas pu compter."
 SPEC_DRIVER_RESCUE_TT: "#header Sauvetage bancaire : [Country.MakeScope.Var('spec_c_rescue').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\nUne hausse ponctuelle obtenue par #v Prêter aux banques#! ou #v Suspendre la loi bancaire#! (jamais au-delà de #v 100#!)"
 SPEC_DRIVER_RESCUE: "Sauvetage bancaire"
 SPEC_DRIVER_WAREND: "Fin de la guerre"
 SPEC_DRIVER_WAREND_TT: "#header Fin de la guerre : [Country.MakeScope.Var('spec_c_warend').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#v x[Country.MakeScope.Var('spec_war_stakes_now').GetValueWithDefault('(CFixedPoint)0')|%0]#! de l’effet total, selon nos [concept_casualties]\n$TOOLTIP_DELIMITER$\n#title Effet total#!\nVictoire avec un [concept_war_goal] obtenu : #P +4#!\nVictoire sans rien obtenir : #P +1#!\nDéfaite avec un [concept_war_goal] cédé : #N -8#!\nDéfaite sans rien céder : #N -2#!\nAucun vainqueur : #N -1#!\n\n#weak Nous en ressentons toujours au moins #v 25 %#!, et la totalité dès que la guerre a coûté #v 25 %#! de nos forces#!"
 SPEC_DRIVER_BURST: "Éclatement des bulles"
 SPEC_DRIVER_BURST_TT: "#header Éclatement de la bulle : [Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#italic La bulle a éclaté.#!\n\n[concept_spec_speculative_excess] : #v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0'), Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_burst_per_heat'), '(CFixedPoint)-1'))|0]#! points\n#N -[Country.MakeScope.ScriptValue('spec_burst_per_heat')|2]#! par point\nJamais plus de #N -[Country.MakeScope.ScriptValue('spec_burst_max')|0]#!\n$TOOLTIP_DELIMITER$\nElle éclate quand la [concept_spec_market_confidence] passe sous #v 60#! après un essor au-dessus de #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#!\nPlus l’essor a été long et haut, plus l’éclatement est fort\n#weak Nécessite [GetTechnology('stock_exchange').GetName]#!"
 SPEC_DRIVER_CAUTION: "Gouvernement et événements"
 SPEC_DRIVER_RESTRAIN: "Essors freinés"
 SPEC_DRIVER_LIMIT: "Plancher et plafond"
 SPEC_DRIVER_BOOM: "Biens en essor"
 SPEC_DRIVER_BOOM_TT: "#header Biens en essor : [Country.MakeScope.Var('spec_c_boom').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] en raison de #v [Country.MakeScope.Var('spec_n_boom').GetValueWithDefault('(CFixedPoint)0')|0]#! [Concept('concept_good','$concept_goods|q$')] en essor[AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_BOOM_CAP')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_steady'), '(CFixedPoint)1')), 'SPEC_BOOM_STEADY')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_fin_boom'), '(CFixedPoint)1')), 'SPEC_BOOM_FIN')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_boom_rule'), '(CFixedPoint)1')), 'SPEC_BOOM_RULE')]\n$TOOLTIP_DELIMITER$\nPlus la part d’un bien dans notre [concept_market] est grande, plus son essor apporte. Rien pendant une [concept_spec_financial_panic]\n#weak [GetTechnology('stock_exchange').GetName], [GetTechnology('investment_banks').GetName] et [GetTechnology('modern_financial_instruments').GetName] l’amplifient#!"
 SPEC_BOOM_CAP: "\nPlafonné à #v +3#! avant tout ce qui suit"
 SPEC_BOOM_STEADY: "\n#v x[Country.MakeScope.ScriptValue('spec_steady')|2]#! en raison des manoirs"
 SPEC_BOOM_FIN: "\n#v x[Country.MakeScope.ScriptValue('spec_fin_boom')|2]#! en raison des technologies financières"
 SPEC_BOOM_RULE: "\n#v x[Country.MakeScope.ScriptValue('spec_boom_rule')|2]#! en raison de la volatilité du marché"
 SPEC_DRIVER_CRASH: "Essors terminés"
 SPEC_DRIVER_CRASH_TT: "#header Essors terminés : [Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\nLe plus important le mois dernier : #v [Country.MakeScope.Var('spec_crashed').GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] selon l’ampleur des essors terminés\n#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#! selon la chaleur du marché ([concept_spec_market_conditions])[AddLocalizationIf(Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-40')), 'SPEC_CRASH_CAP')]\n$TOOLTIP_DELIMITER$\nLes gros essors, et les biens qui pèsent plus dans notre [concept_market], font plus mal\n#weak [GetTechnology('mutual_funds').GetName] l’atténue, [GetTechnology('modern_financial_instruments').GetName] l’aggrave#!"
 SPEC_CRASH_CAP: "\nPlafonné à #N -40#! par mois"
 SPEC_DRIVER_FOREIGN: "Paniques étrangères"
 SPEC_FOREIGN_HIT: "\n#N -20#! de perte de base due à une [concept_spec_foreign_panic]\n#v x[Country.MakeScope.Var('spec_fh_size').GetValueWithDefault('(CFixedPoint)0')|2]#! selon la taille de leur économie face à la nôtre\n#v x[Country.MakeScope.Var('spec_fh_tie').GetValueWithDefault('(CFixedPoint)0')|2]#! selon la force de nos liens ([concept_spec_market_tie])\n#v x[Country.MakeScope.Var('spec_fh_reach').GetValueWithDefault('(CFixedPoint)0')|2]#! selon leur importance ([concept_rank])[AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_foreign_loss_mult'), '(CFixedPoint)1')), 'SPEC_FOREIGN_UNSTD')]"
 SPEC_FOREIGN_UNSTD: "\n#v x[Country.MakeScope.ScriptValue('spec_foreign_loss_mult')|2]#! car nous n’avons pas [GetTechnology('currency_standards').GetName]"
 SPEC_FOREIGN_FLIGHT: "\n[Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')|+=2] en raison de la [concept_spec_capital_flight]"
 SPEC_DRIVER_FOREIGN_TT: "#header Paniques étrangères : [Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\nLa plus récente : #v [Country.MakeScope.Var('spec_foreign_src').GetCountry.GetName]#!\n$TOOLTIP_DELIMITER$[AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_HIT')][AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_FLIGHT')]\n$TOOLTIP_DELIMITER$\n#title @spec_market_tie! [concept_spec_market_tie]#!\n#italic La part de la panique d’un pays lié qui nous atteint par chaque type de lien. Ces parts ne s’additionnent pas. Si plusieurs paniques nous atteignent dans le mois, seul le coup le plus dur compte.#!\nMême [concept_market] : #v [Country.MakeScope.ScriptValue('spec_tie_market')|%0]#!\nSujet ou suzerain : #v 80 %#!\nDroits d’investissement étrangers : #v [Country.MakeScope.ScriptValue('spec_tie_investment')|%0]#!\nÉchanges intenses entre marchés : #v [Country.MakeScope.ScriptValue('spec_tie_trade')|%0]#!\nPropriété étrangère de notre économie : jusqu’à #v 90 %#!\n$TOOLTIP_DELIMITER$\n#weak La panique d’une [concept_great_power] nous frappe en entier, celle d’une puissance importante à moitié, celle d’un petit pays à peine. Une panique contractée à l’étranger ne se propage pas plus loin.#!"
 SPEC_DRIVER_TURMOIL: "Guerre et troubles"
 SPEC_DRIVER_TURMOIL_TT: "#header Guerre et troubles : [Country.MakeScope.Var('spec_c_turmoil').GetValueWithDefault('(CFixedPoint)0')|+=2]#!$SPEC_ITEMS_TURMOIL$\n$TOOLTIP_DELIMITER$\nChaque [concept_war] ([concept_spec_war_news]) : #N -3#! à #P +0.15#! par mois\nToutes les guerres ensemble : #N -4#! à #P +0.5#! par mois\nUn [concept_diplomatic_play] qui n’est pas encore une guerre : #N -0.5#! par mois\nTrésor qui s’épuise : jusqu’à #N -3#! par mois, à partir de #v 20#! semaines avant la [concept_bankruptcy]\n[concept_default] : #N -5#! par mois\n[concept_revolution] : #N -2#! par mois\n\n#instruction Survoler un chiffre pour voir ses causes#!"
 SPEC_DRIVER_MOOD: "Humeur du marché"
 SPEC_DRIVER_MOOD_TT: "#header Humeur du marché : [Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0')|+=2] en raison de la variation aléatoire de ce mois\n[Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0'))|+=2] reporté du mois dernier\n$TOOLTIP_DELIMITER$\n#weak Varie au hasard chaque mois, jusqu’à #v 0.75#! dans un sens ou dans l’autre. #v 75 %#! s’en reporte sur le mois suivant. Les compagnies à forte [concept_prosperity] la relèvent dès que notre [concept_spec_exchange] atteint le rang #v Nationale#!.#!"
 SPEC_DRIVER_DRIFT: "Retour à la normale"
 SPEC_DRIVER_DRIFT_TT: "#header Retour à la normale : [Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0'), Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100'))|+=1] selon notre écart avec la [concept_spec_baseline] (#v 55#!)\n#v x[Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100')|%1]#! de l’écart se comble chaque mois\n$TOOLTIP_DELIMITER$\n#weak [GetTechnology('macroeconomics').GetName] rend ce retour moitié plus rapide#!"
 SPEC_DRIVER_TIGHT: "Crédit restreint"
 SPEC_DRIVER_GROWTH: "Croissance"
 SPEC_DRIVER_GROWTH_TT: "#header Croissance : [Country.MakeScope.Var('spec_c_growth').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#v [Country.MakeScope.Var('spec_growth').GetValueWithDefault('(CFixedPoint)0')|=+%1]#! de croissance du [concept_gdp] par rapport aux derniers mois\n#v 2 %#! de croissance est jugé normal et ne change rien\n$TOOLTIP_DELIMITER$\n#weak La [concept_spec_market_confidence] bouge de #v 0.1#! par mois pour chaque tranche de #v 1 %#! plus rapide ou plus lente que la normale, jusqu’à #v 0.6#! dans un sens ou dans l’autre#!"
 SPEC_DRIVER_BUSINESS: "Climat des affaires"
 SPEC_DRIVER_BUSINESS_TT: "#header Climat des affaires : [Country.MakeScope.Var('spec_c_business').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[concept_approval] des industriels : #v [Country.MakeScope.ScriptValue('spec_ind_approval')|0]#!\n\nLoyaux (#v 10#! ou plus) : #P +0.4#! par mois\nSatisfaits (#v 5#! ou plus) : #P +0.2#! par mois\nMécontents (#v -5#! ou moins) : #N -0.2#! par mois\nFurieux (#v -10#! ou moins) : #N -0.4#! par mois"
 SPEC_DRIVER_TIGHT_TT: "#header Crédit restreint : [Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.1')|1]#! de [concept_spec_market_confidence] au-dessus de #v 60#!\n#N -10 %#! de cet excédent par mois, en raison de [Concept('concept_spec_credit_policy','$concept_spec_credit_policy_tight|q$')]\n$TOOLTIP_DELIMITER$\n#weak Refroidit un essor lentement sur plusieurs mois plutôt que d’un coup#!"
 concept_spec_market_conditions: "Conditions de marché"
 concept_spec_market_conditions_desc: "@spec_market_conditions! Les $concept_spec_market_conditions$ indiquent à quel point le marché est chaud quand survient une [concept_spec_boom_end]. Elles déterminent combien de [concept_spec_market_confidence] cette fin coûte. Plus la $concept_spec_market_confidence$ est élevée à ce moment, plus la perte est lourde. À #v 55#!, elles n’ont aucun effet. Les quartiers d’affaires, les manoirs et les technologies financières les modifient aussi."
 concept_spec_baseline: "Confiance de référence"
 concept_spec_baseline_desc: "@spec_baseline! Livrée à elle-même, la [concept_spec_market_confidence] revient vers sa $concept_spec_baseline$ de #v 55#!, par le haut comme par le bas. Plus elle s’en est éloignée, plus le retour est rapide."
 concept_spec_market_mood: "Humeur du marché"
 concept_spec_market_mood_desc: "@spec_market_mood! L’$concept_spec_market_mood$ est le mouvement des sentiments des investisseurs qui n’a pas de cause unique. Chaque mois, elle varie au hasard, jusqu’à #v 0.75#! dans un sens ou dans l’autre, et #v 75 %#! s’en reporte, si bien que les bonnes et mauvaises périodes durent un temps avant de s’estomper."
 concept_spec_market_tie: "Lien de marché"
 concept_spec_market_tie_desc: "@spec_market_tie! Un $concept_spec_market_tie$ mesure à quel point un [concept_country] suit le [concept_market] d’un autre. Il détermine la part d’une [concept_spec_financial_panic] qui passe de l’un à l’autre.\n\nLa propriété compte à partir du moment où un pays détient #v 10 %#! du [concept_gdp] de l’autre, et atteint son maximum à #v 30 %#!. [GetLawType('law_free_trade').GetName] renforce le lien commercial et les autres politiques commerciales l’affaiblissent. [GetTechnology('international_exchange_standards').GetName] renforce les liens de marché et d’investissement. Un [concept_embargo] coupe le lien commercial."
 concept_spec_capital_flight: "Fuite des capitaux"
 concept_spec_capital_flight_desc: "@spec_capital_flight! Quand une [concept_spec_financial_panic] éclate, l’argent fuit vers la sécurité. Chaque [concept_great_power], et chaque [concept_country] dont la [concept_spec_exchange] est #v Internationale#! ou mieux, gagne jusqu’à #P +[GetPlayer.MakeScope.ScriptValue('spec_flight_gain_max')|0]#! de [concept_spec_market_confidence] s’il est en paix, au niveau #v Stabilité#! ou mieux, et sans lien avec le pays en panique. [GetTechnology('international_trade').GetName] et [GetTechnology('international_exchange_standards').GetName] augmentent ce gain. Plus une [concept_spec_exchange] est haut placée, plus elle en reçoit."
 concept_spec_war_news: "Nouvelles de guerre"
 concept_spec_war_news_desc: "@spec_war_news! Les investisseurs suivent une [concept_war] mois après mois. Les $concept_spec_war_news$ font varier la [concept_spec_market_confidence] chaque mois selon son cours : les [concept_casualties], le [concept_blockade], la [concept_devastation], la baisse du [concept_gdp] et une guerre longue la font baisser, tandis que les [Concept('concept_battle','$concept_battles|q$')] gagnées et le territoire ennemi tenu la font monter. Chaque guerre la fait varier de #N -3#! à #P +0.15#! par mois, et toutes les guerres ensemble de #N -4#! à #P +0.5#!."
