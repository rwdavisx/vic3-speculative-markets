 SPEC_LEVER_RESTRAIN_TT: "#header Freiner la spéculation sur [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n#italic Refroidir un [concept_good] en surchauffe avant que son essor ne devienne trop grand.#!\n\nL’[concept_spec_investor_interest] retombe à #v Calme#! en quelques mois\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_DOWN', 'SPEC_LEVER_NONE')][concept_budget_additional_income] : #P @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_levy_', Goods.GetKey))|D]#! par semaine (#v 10 %#! de leur production, au prix de base)\nQuand son essor prend fin, il se résorbe lentement sur environ un an en une [concept_spec_correction], et non d’un coup\n\nMobilise #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#! d’[concept_authority] tant que la mesure est en vigueur, sans nouveau paiement chaque mois. Nous la récupérons à sa levée#indent_newline:3 \n#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! pour ce [concept_good] en temps normal, soit la moitié d’une taxe de consommation sur celui-ci\n#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! selon la part de nos échanges (#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! de notre marché)#!\n\n#lore Après la bulle des mers du Sud, le Bubble Act de 1720 interdit de lancer des sociétés par actions sans charte royale.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_restrain_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_restrain').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_LEVER_ENCOURAGE_TT: "#header Encourager l’investissement dans [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n#italic Ranimer l’intérêt des investisseurs pour un [concept_good] qu’ils délaissent.#!\n\nL’[concept_spec_investor_interest] monte à #v Vif#! en quelques mois\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_UP', 'SPEC_LEVER_NONE')][concept_budget_additional_expenses] : #N @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_subsidy_', Goods.GetKey))|D]#! par semaine (#v 20 %#! de leur production, au prix de base)\nPrend fin d’elle-même quand le [concept_good] devient #v Avide#!\n\nMobilise #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#! d’[concept_authority] tant que la mesure est en vigueur, sans nouveau paiement chaque mois. Nous la récupérons à sa levée#indent_newline:3 \n#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! pour ce [concept_good] en temps normal, soit la moitié d’une taxe de consommation sur celui-ci\n#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! selon la part de nos échanges (#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! de notre marché)#!\n\n#lore Au milieu du XIXe siècle, l’Inde britannique et la France garantissaient aux investisseurs ferroviaires un rendement fixe sur leur capital.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_encourage_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_encourage').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
