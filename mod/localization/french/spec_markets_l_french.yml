 SPEC_RV_TIER_BIGWIN_TT: "#header $SPEC_RV_BAND_BIGWIN$#!\n#italic La barre finit à plus de #v 75 %#! de notre côté quand le duel se règle#!\n$TOOLTIP_DELIMITER$\nRéputation de notre [concept_spec_exchange] : #P +[Divide_CFixedPoint(Multiply_CFixedPoint(Select_CFixedPoint(GreaterThan_CFixedPoint(GetPlayer.MakeScope.Var('spec_exch_stand').GetValue, Country.MakeScope.Var('spec_exch_stand').GetValue), Divide_CFixedPoint('(CFixedPoint)3', Add_CFixedPoint(Subtract_CFixedPoint(GetPlayer.MakeScope.Var('spec_exch_stand').GetValue, Country.MakeScope.Var('spec_exch_stand').GetValue), '(CFixedPoint)1')), Multiply_CFixedPoint('(CFixedPoint)3', Add_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValue, GetPlayer.MakeScope.Var('spec_exch_stand').GetValue), '(CFixedPoint)0'), '(CFixedPoint)1'))), '(CFixedPoint)4'), '(CFixedPoint)120')|%0]#!\nRéputation de [Country.GetNameNoFormatting] : #N -[Multiply_CFixedPoint(Multiply_CFixedPoint(Divide_CFixedPoint(Multiply_CFixedPoint(Select_CFixedPoint(GreaterThan_CFixedPoint(GetPlayer.MakeScope.Var('spec_exch_stand').GetValue, Country.MakeScope.Var('spec_exch_stand').GetValue), Divide_CFixedPoint('(CFixedPoint)3', Add_CFixedPoint(Subtract_CFixedPoint(GetPlayer.MakeScope.Var('spec_exch_stand').GetValue, Country.MakeScope.Var('spec_exch_stand').GetValue), '(CFixedPoint)1')), Multiply_CFixedPoint('(CFixedPoint)3', Add_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValue, GetPlayer.MakeScope.Var('spec_exch_stand').GetValue), '(CFixedPoint)0'), '(CFixedPoint)1'))), '(CFixedPoint)4'), '(CFixedPoint)120'), Country.MakeScope.ScriptValue('spec_exch_loss')), Select_CFixedPoint(GetScriptedGui('spec_sgui_rv_is_bitter').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End), '(CFixedPoint)1.5', '(CFixedPoint)1'))|%0]#!\n#P 5 %#! des revenus du [concept_investment_pool] de [Country.GetNameNoFormatting] nous reviennent pendant #v 12#! mois\n$TOOLTIP_DELIMITER$\n$SPEC_RV_NOW_LINE$"
 SPEC_RV_TIER_WIN_TT: "#header $SPEC_RV_BAND_WIN$#!\n#italic La barre finit entre #v 20 %#! et #v 75 %#! de notre côté quand le duel se règle#!\n$TOOLTIP_DELIMITER$\nRéputation de notre [concept_spec_exchange] : #P +[Divide_CFixedPoint(Multiply_CFixedPoint(Select_CFixedPoint(GreaterThan_CFixedPoint(GetPlayer.MakeScope.Var('spec_exch_stand').GetValue, Country.MakeScope.Var('spec_exch_stand').GetValue), Divide_CFixedPoint('(CFixedPoint)3', Add_CFixedPoint(Subtract_CFixedPoint(GetPlayer.MakeScope.Var('spec_exch_stand').GetValue, Country.MakeScope.Var('spec_exch_stand').GetValue), '(CFixedPoint)1')), Multiply_CFixedPoint('(CFixedPoint)3', Add_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValue, GetPlayer.MakeScope.Var('spec_exch_stand').GetValue), '(CFixedPoint)0'), '(CFixedPoint)1'))), '(CFixedPoint)2'), '(CFixedPoint)120')|%0]#!\nRéputation de [Country.GetNameNoFormatting] : #N -[Multiply_CFixedPoint(Multiply_CFixedPoint(Divide_CFixedPoint(Multiply_CFixedPoint(Select_CFixedPoint(GreaterThan_CFixedPoint(GetPlayer.MakeScope.Var('spec_exch_stand').GetValue, Country.MakeScope.Var('spec_exch_stand').GetValue), Divide_CFixedPoint('(CFixedPoint)3', Add_CFixedPoint(Subtract_CFixedPoint(GetPlayer.MakeScope.Var('spec_exch_stand').GetValue, Country.MakeScope.Var('spec_exch_stand').GetValue), '(CFixedPoint)1')), Multiply_CFixedPoint('(CFixedPoint)3', Add_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValue, GetPlayer.MakeScope.Var('spec_exch_stand').GetValue), '(CFixedPoint)0'), '(CFixedPoint)1'))), '(CFixedPoint)2'), '(CFixedPoint)120'), Country.MakeScope.ScriptValue('spec_exch_loss')), Select_CFixedPoint(GetScriptedGui('spec_sgui_rv_is_bitter').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End), '(CFixedPoint)1.5', '(CFixedPoint)1'))|%0]#!\n$TOOLTIP_DELIMITER$\n$SPEC_RV_NOW_LINE$"
 SPEC_RV_TIER_DRAW_TT: "#header $SPEC_RV_BAND_DRAW$#!\n#italic La barre finit à moins de #v 20 %#! du milieu quand le duel se règle#!\n$TOOLTIP_DELIMITER$\nAucun camp ne gagne ni ne perd de réputation\n$TOOLTIP_DELIMITER$\n$SPEC_RV_NOW_LINE$"
