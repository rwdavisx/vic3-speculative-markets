 SPEC_RISK_TT: "#header Risque de $SPEC_UNWIND$#!\nSi l’essor prend fin maintenant : #N -[Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! de [concept_spec_market_confidence]\n$TOOLTIP_DELIMITER$\n#b Pourquoi autant#!\n#v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_peak_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1')|1]#! de base, selon le niveau atteint par l’[concept_spec_investor_interest] (#v [Country.MakeScope.Var(Concatenate('spec_peak_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#!)\n[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_sev_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_WHY_END_3', SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_sev_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_WHY_END_2', 'SPEC_WHY_END_1'))]\n#v x[Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey))|%0]#! selon sa part de nos échanges (#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! de notre [concept_market], plein effet à #v 3 %#!)\n#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Country.MakeScope.ScriptValue('spec_crash_scale')|2]#!#!#! selon la chaleur du marché ([concept_spec_market_conditions])[AddLocalizationIf(GreaterThan_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_risk_raw_', Goods.GetKey)), Country.MakeScope.ScriptValue('spec_crash_scale')), '(CFixedPoint)40'), 'SPEC_WHY_CAP')][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_hype_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_hprev_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')), 'SPEC_WHY_FALLING')]\n$TOOLTIP_DELIMITER$\n$SPEC_UNWIND_DESC$"
