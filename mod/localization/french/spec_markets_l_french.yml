 SPEC_RISK_3_ON: "#header Risque de guerre#!\n$TOOLTIP_DELIMITER$\n#italic Un [concept_diplomatic_play] qui tourne à la guerre secoue les marchés.#!\n\nSi la guerre éclate, jusqu’à #N -[Country.MakeScope.Var('spec_war_risk').GetValueWithDefault('(CFixedPoint)0')|1]#! de [concept_spec_market_confidence] par mois\nCoups diplomatiques susceptibles de devenir des guerres : #v [Country.MakeScope.Var('spec_wr_n').GetValueWithDefault('(CFixedPoint)0')|0]#!\n#N -0.6#! pour chacun, sur la base d’une guerre moyenne#indent_newline:3 [AddLocalizationIf(Country.MakeScope.Var('spec_wr1').IsSet, 'SPEC_ITEM_WR_1')][AddLocalizationIf(Country.MakeScope.Var('spec_wr2').IsSet, 'SPEC_ITEM_WR_2')][AddLocalizationIf(Country.MakeScope.Var('spec_wr3').IsSet, 'SPEC_ITEM_WR_3')]#!\n$TOOLTIP_DELIMITER$\n#weak Une guerre qui tourne mal coûte encore plus, via [concept_spec_war_news].#!"
 SPEC_ITEM_WR_1: "\nContre #v [Country.MakeScope.Var('spec_wr1').GetCountry.GetName]#! : #N -0.6#!"
 SPEC_ITEM_WR_2: "\nContre #v [Country.MakeScope.Var('spec_wr2').GetCountry.GetName]#! : #N -0.6#!"
 SPEC_ITEM_WR_3: "\nContre #v [Country.MakeScope.Var('spec_wr3').GetCountry.GetName]#! : #N -0.6#!"
 SPEC_RISK_3_NONE: "#header Risque de guerre#!\nRien d’inquiétant. Nous ne participons à aucun [concept_diplomatic_play] qui pourrait tourner à la guerre."
