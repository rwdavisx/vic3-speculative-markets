 SPEC_EXCH_FX_FLIGHT_GP: "Reçoit la [concept_spec_capital_flight] : seulement en tant que [concept_great_power]"
 SPEC_EXCH_FX_PRESTIGE: "\n[concept_prestige]: #P +2%#!"
 SPEC_EXCH_FX_LOSS: "\nPertes de réputation : #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_loss'), '(CFixedPoint)1')|+%0]#!"
 SPEC_EXCH_FX_CREDIT: "\nCrédit accordé : jusqu’à #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_credit'), '(CFixedPoint)1')|+%0]#!"
 concept_spec_exchange: "Bourse"
 concept_spec_trust: "Réputation"
 concept_spec_trust_desc: "@spec_trust! La confiance des investisseurs dans la [concept_spec_exchange] d’un [concept_country], de #v 0 %#! à #v 100 %#!.\n\nElle #P progresse#! les mois calmes et #N recule#! à chaque [concept_spec_financial_panic], krach et effondrement. Son niveau, #N Discréditée#!, Suspecte, #v Respectée#! ou #P Fiable#!, détermine ce que le [concept_country] paie pour emprunter."
 concept_spec_exchange_desc: "@spec_exchange! La $concept_spec_exchange$ d’un [concept_country] est le lieu où s’échangent ses actions, ses obligations et son crédit. Son rang suit son score ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]) : #v Provinciale#!, #v Nationale#!, #v Internationale#! (nécessite [GetTechnology('stock_exchange').GetName]) ou #v Centre mondial#! (nécessite [GetTechnology('central_banking').GetName]). Un rang plus élevé accroît la réaction des investisseurs à la hausse des prix et, à partir du rang #v Internationale#!, la Bourse reçoit la [concept_spec_capital_flight].\n\nL’État accorde une charte à sa Bourse : #v Bourse de commerce#!, #v Marché monétaire#! ou #v Bourse des valeurs#!. Une Bourse détient de #v 1#! à #v 4#! spécialités parmi les #v 10#! voies de la renommée, davantage à mesure que son rang s’élève, et conserve chacune au moins #v 5#! ans.\n\nLa réputation progresse pendant les années calmes avec des prêts prudents, et recule avec les [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')], les [concept_spec_bad_debts] et une [concept_spec_bust] ou un [concept_spec_collapse] dans un bien principal. Une faible réputation augmente le taux d’intérêt des [concept_loans], et une forte réputation le réduit."
 spec_exch_national: "Rang de la Bourse"
 spec_trust_0: "Bourse discréditée"
 spec_trust_0_desc: "La [concept_spec_exchange] du [concept_country] est #v Discréditée#! auprès des investisseurs."
 spec_trust_1: "Bourse suspecte"
 spec_trust_1_desc: "La [concept_spec_exchange] du [concept_country] est #v Suspecte#! auprès des investisseurs."
 spec_trust_3: "Bourse fiable"
 spec_trust_3_desc: "La [concept_spec_exchange] du [concept_country] est #v Fiable#! aux yeux des investisseurs."
 spec_exch_national_desc: "La [concept_spec_exchange] du [concept_country] est connue bien au-delà de sa propre ville, sans compter encore parmi les $concept_spec_financial_centres$."
 SPEC_EXCH_KNOWN_ME: "[SelectLocalization(LessThan_CFixedPoint(GetPlayer.MakeScope.Var('spec_exch_known').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.5'), 'SPEC_EXCH_KNOWN_0', SelectLocalization(LessThan_CFixedPoint(GetPlayer.MakeScope.Var('spec_exch_known').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1.5'), 'SPEC_EXCH_KNOWN_1', SelectLocalization(LessThan_CFixedPoint(GetPlayer.MakeScope.Var('spec_exch_known').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2.5'), 'SPEC_EXCH_KNOWN_2', 'SPEC_EXCH_KNOWN_3')))]"
