 notification_spec_tied_panic_name: "La panique éclate : [SCOPE.sC('spec_note_src').GetName]"
 notification_spec_tied_panic_desc: "Une [concept_spec_financial_panic] a éclaté dans le pays suivant : [SCOPE.sC('spec_note_src').GetName]. Nos liens avec lui ont porté une [concept_spec_foreign_panic] jusque sur nos propres marchés."
