 SPEC_LHIST_PANIC_8_TT: "#header Seuil de panique : 47#!\n$TOOLTIP_DELIMITER$\n#italic Le point où l’inquiétude tourne à la panique.#!\n\nÀ #v 8#! mois de [concept_spec_leverage], une [concept_spec_financial_panic] éclate si la [concept_spec_market_confidence] passe sous #v 47#!"
