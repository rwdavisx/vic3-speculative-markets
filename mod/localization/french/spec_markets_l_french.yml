 SPEC_EXCH_CARD_NOTE: "#italic Le type de marché qu’est notre [concept_spec_exchange]. Nous en choisissons un.#!\nChacun apporte son propre bonus et ouvre des voies de la renommée qu’aucune autre charte ne peut choisir"
 SPEC_H_KNOWN_TT: "#header Spécialités#!\n$TOOLTIP_DELIMITER$\n#italic Les voies de la renommée que poursuit notre [concept_spec_exchange].#!\n\n$SPEC_PURSUE_RULE$"
 SPEC_H_RIVAL: "Concurrence"
 SPEC_H_RIVAL_TT: "#header Concurrence#!\n$TOOLTIP_DELIMITER$\n$SPEC_RIVAL_RULE$"
 SPEC_H_RIVAL_RIGHT: "#N -[GetPlayer.MakeScope.ScriptValue('spec_rv_upkeep_total')|0]#! @inf!"
 SPEC_RIVAL_RULE: "#italic Notre [concept_spec_exchange] peut choisir d’autres Bourses à qui disputer la réputation.#!\n\nChaque concurrente coûte de #N 25#! à #N 150#! d’influence à entretenir, davantage à un rang élevé\nNous pouvons choisir #v 1#! concurrente au rang le plus bas, et une de plus pour chaque rang au-dessus (jusqu’à #v 4#!)\nNous ne pouvons pas abandonner une concurrente pendant sa première année\nCela ne relève pas des rivalités diplomatiques\n\n#b Le duel#!\nChaque duel dure #v 5#! ans à partir de son début, puis se règle comme une partie de tir à la corde et un nouveau commence\nLa barre part des scores de [Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')] des deux Bourses\n#N Chaque duel au-delà du premier nous disperse#! et affaiblit notre score dans tous (#v 2#! duels : #N 80 %#!, #v 4#! : #N 57.1 %#!)\nChaque [concept_spec_blue_chip] la tire de #v 3 %#! vers son camp (traction entière jusqu’à #v 5#!, demi-traction jusqu’à #v 10#!)\nChaque action réussie la pousse de #v 10 %#! vers son camp, jusqu’à #v 5#! poussées chacune\nPrès du milieu, c’est un match nul\n\n#b La victoire#!\nAprès une #P victoire#!, la perdante cède #P 5 %#! de réputation\nAprès une #P large victoire#! (la barre finit à plus de #v 75 %#! d’un côté), la perdante cède #P 10 %#! de réputation, et #P 5 %#! des revenus de son [concept_investment_pool] pendant 12 mois\nBattre une Bourse de rang supérieur rapporte davantage, battre une Bourse de rang inférieur rapporte moins\nSi les [concept_relations] sont mauvaises ou pires, la perdante perd #N x1.5#! fois plus\n\n#b Les actions#!\nNous pouvons les employer contre les Bourses avec lesquelles nous sommes en duel, et contre celles qui sont en duel avec nous\nChaque action fonctionne une fois par an contre chaque concurrente\nContre une Bourse plus grande, elles coûtent plus et rapportent moins (#v x0.75#! à #v x1.33#!)\nLors d’une [concept_spec_financial_panic], les capitaux en fuite vont d’abord vers une concurrente"
