 SPEC_EXCH_FX_LEAN: "\n[concept_spec_market_mood] due aux compagnies à forte [concept_prosperity] : #v [Country.MakeScope.ScriptValue('spec_exch_lean')|+=2]#! par mois"
 SPEC_EXCH_LIMIT: "[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_limit'), '(CFixedPoint)0'), 'SPEC_EXCH_LIMIT_ON', 'SPEC_EXCH_LIMIT_OFF')]"
 SPEC_EXCH_LIMIT_ON: "\nPlafond de crédit dû à notre place parmi les [Concept('concept_spec_financial_centre','$concept_spec_financial_centres|q$')] : #P +[Country.MakeScope.ScriptValue('spec_exch_limit')|0]#! mois, jusqu’à #v 12#! au total"
 SPEC_EXCH_LIMIT_OFF: "\nNotre place parmi les [Concept('concept_spec_financial_centre','$concept_spec_financial_centres|q$')] ne donne #N aucun#! plafond de crédit avant [GetTechnology('central_banking').GetName], ni tant que les critères de prêt sont #v Laxistes#! ou #v Imprudents#!"
