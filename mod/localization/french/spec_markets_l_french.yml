 SPEC_XS_CAP_TT: "#header Capital#!\n$TOOLTIP_DELIMITER$\n#italic L’argent sur lequel notre [concept_spec_exchange] peut s’appuyer.#!\n\nEn propre : #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_own_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, six mois de revenus du [concept_investment_pool] (moyenne annuelle)\nGrâce à nos liens : #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_reach_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, un quart de l’argent de chaque [concept_country] plus petit de notre [concept_market], de nos [Concept('concept_subject','$concept_subjects|q$')], de notre [concept_power_bloc] ou de tout pays qui nous accorde des droits d’[concept_foreign_investment]. Jamais plus que notre part propre\n$TOOLTIP_DELIMITER$\n#weak Plus d’argent aide, mais de moins en moins. Il faut seize fois plus d’argent pour doubler le score#!"
 SPEC_XS_WEALTH_TT: "#header Richesse par habitant#!\n$TOOLTIP_DELIMITER$\n#italic La richesse de notre peuple comparée au reste du monde.#!\n\nLe revenu du [concept_investment_pool] par personne vaut #v [Country.MakeScope.Var('spec_xs_ratio_v').GetValueWithDefault('(CFixedPoint)0')|2]#! fois la moyenne mondiale\nBonus : de #v x0.75#! à #v x1.5#!\n$TOOLTIP_DELIMITER$\n#weak Être plus riche aide, mais de moins en moins#!"
 SPEC_XS_TECH_TT: "#header Technologies financières#!\n$TOOLTIP_DELIMITER$\n#italic Le savoir-faire financier que notre pays a étudié. Chacune élève le score de notre Bourse.#!\n\n#b Chacune étudiée ajoute#!\n$banking$ : #P +5 %#!\n$stock_exchange$ : #P +5 %#!\n$central_banking$ : #P +5 %#!\n$joint_stock_companies$ : #P +5 %#!\n$mutual_funds$ : #P +5 %#!\n$investment_banks$ : #P +10 %#!\n$international_exchange_standards$ : #P +10 %#!\n$modern_financial_instruments$ : #P +10 %#!\n$TOOLTIP_DELIMITER$\n#instruction [GetTechnology('stock_exchange').GetName] est aussi nécessaire pour devenir #v Internationale#!, et [GetTechnology('central_banking').GetName] pour devenir #v Centre mondial#!, en plus des autres conditions de chaque rang#!"
 SPEC_XS_ECON_TT: "#header Système économique#!\n$TOOLTIP_DELIMITER$\n#italic Comment notre loi économique modifie le score.#!\n\n$law_laissez_faire$ : #P x1,15#!\n$law_interventionism$ : #P x1,05#!\n$law_agrarianism$ : #N x0,95#!\n$law_traditionalism$ : #N x0,9#!\n$law_extraction_economy$ : #N x0,9#!\n$law_command_economy$ : #N x0,75#!\n$law_cooperative_ownership$ : #N x0,6#!"
