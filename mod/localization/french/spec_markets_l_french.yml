 SPEC_JE_EXCH_ON: "Bourse de $SPEC_EXCH_CITY_ME$ : #v $SPEC_EXCH_STAND_ME$#!"
 SPEC_JE_EXCH_TT: "Notre [concept_spec_exchange] et son rang. L’onglet #bold $SPEC_FIN_TAB_EXCHANGE$#! de la fenêtre #bold $SPEC_FINANCE$#! donne le reste."
 SPEC_JE_FAVOURED: "Prisés"
 SPEC_JE_FAVOURED_TT: "Les biens dont les investisseurs raffolent ce mois-ci, si bien que les parts des compagnies et des bâtiments qui les produisent se vendent aisément"
 SPEC_JE_SHUNNED: "Boudés"
 SPEC_JE_SHUNNED_TT: "Les biens dont les investisseurs veulent le moins entendre parler ce mois-ci"
 SPEC_JE_STAGE_6: "La [concept_spec_long_depression] pèse sur [JournalEntry.GetCountry.GetCapital.GetCityHubName]. Les investisseurs thésaurisent et ne prêtent à personne ; jusqu’ici, chaque reprise s’est essoufflée en quelques mois. Une entrée du journal dédiée suit la reprise mondiale.\n\nLes chantiers de secours peuvent employer les chômeurs et les nourrir tant que la crise dure."
 SPEC_JE_STAGE_5: "La panique s’est emparée de [JournalEntry.GetCountry.GetCapital.GetCityHubName]. Dès l’aube, les déposants font la queue devant les banques, les prêts sont rappelés et la [concept_private_construction] est réduite de moitié pendant encore #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! mois, à moins que le gouvernement n’agisse.\n\n#v Prêter aux banques#! y mettrait fin plus tôt et réduirait ses effets de moitié. Les chantiers de secours peuvent employer les chômeurs et les nourrir.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_currency_v'), '(CFixedPoint)0'), 'SPEC_JE_SUSPEND_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_4: "La panique est passée, laissant derrière elle des maisons en faillite et des chantiers inachevés. Les investisseurs comptent leurs pertes, et aucune nouvelle panique ne peut éclater pendant #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic_cooldown').GetValue|0]#! mois.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_reform_open_v'), '(CFixedPoint)0'), 'SPEC_JE_INQUIRY_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_3: "La Bourse de [JournalEntry.GetCountry.GetCapital.GetCityHubName] a perdu la raison. Employés et veuves empruntent pour acheter des actions dans #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! et #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#!, et chaque mois où la [concept_spec_market_confidence] atteint au moins #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#! accroît l’[concept_spec_speculative_excess]. Lorsque la $concept_spec_market_confidence$ passe sous #v 60#!, la bulle éclate, et plus l’excès est grand, plus la chute est rude.\n\nFreiner la spéculation sur les biens les plus prisés, ou resserrer le crédit, permettrait de dégonfler lentement la bulle."
 SPEC_JE_STAGE_2: "L’argent est facile et les investisseurs sont optimistes. Les nouvelles compagnies dans #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! et #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! sont sursouscrites en moins d’une heure, et les banques prêtent sans réserve contre leurs actions. Avec une [concept_spec_market_confidence] d’au moins #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#!, l’[concept_spec_speculative_excess] commence à s’accumuler.\n\nLa prospérité est aussi le moment de convertir notre dette nationale à un taux plus bas."
 SPEC_JE_STAGE_1: "Les échanges à la Bourse de [JournalEntry.GetCountry.GetCapital.GetCityHubName] sont ordonnés. Les investisseurs privilégient #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! et #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#!, et délaissent #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! et #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!."
 SPEC_JE_STAGE_0: "Sur la place de [JournalEntry.GetCountry.GetCapital.GetCityHubName], les investisseurs se méfient. Échaudés par les pertes récentes, ils gardent leur argent et délaissent #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! et #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!. Un crédit souple, ou des encouragements à investir dans un bien, peuvent les faire revenir."
