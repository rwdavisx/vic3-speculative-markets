 SPEC_UNWIND_DESC_3: "Bu yükseliş #v Hararetli#! düzeyine kadar çıktı\nFiyat eğilimi #v [Divide_CFixedPoint('(CFixedPoint)-4.988', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#! altına düşerse #N biter#!. Ardından [concept_spec_investor_interest] #v Kaçış#! olur ve yükseliş bir [concept_spec_collapse] ile biter\nSonra yatırımcılar #v 12#! ay uzak durur\nYükseliş yaşlandıkça #P tehlike azalır#!"
