 spec_reform_currency_tt: "Bankalar #v %25#! daha az kredi verir, [concept_spec_speculative_excess] #v %25#! daha yavaş büyür ve [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')] #v %25#! daha uzun sürer\nBir panikte Bankacılık Kanunu askıya alınabilir"
 spec_reform_free_tt: "Bankalar #v %25#! daha çok kredi verir, yükselişler #v %10#! daha büyük olur ve bittiklerinde #v %10#! daha çok [concept_spec_market_confidence] kaybettirir"
 spec_reform_llr_tt: "#v Bankalara Borç Ver#! #v %50#! daha ucuza mal olur ve paniği bir ay daha erken bitirir"
 spec_reform_company_tt: "Yükselişler bittiğinde #v %30#! daha az [concept_spec_market_confidence] kaybettirir"
 spec_reform.1.t: "Araştırma Komisyonu"
 spec_reform.1.d_panic: "Panikten sonra atanan komisyon, bankacıların, borsacıların ve servetini yitirmiş mevduat sahiplerinin ifadelerinden oluşan üç ciltlik raporunu sundu. Üyeler, paniğin ilahi bir felaket olmadığı konusunda hemfikir. Neredeyse diğer her konuda ayrılıyorlar ve önerilen her çarenin mecliste savunucuları var."
 spec_reform.1.d_calm: "Pazarların sakin olduğu bu yılda bir komisyon, bir sonraki yükselişin yıkımla bitmesini nasıl önleyebileceğimizi bankacılara, borsacılara ve siyasi iktisatçılara sordu. Raporunda çeşitli çareler sıralanıyor. Her birinin mecliste savunucuları var."
 spec_reform.1.f: "“Dehşetin hüküm sürdüğü zamanlarda bir iflas nicelerine yol açar. Peşi sıra gelen iflasları önlemenin en iyi yolu, onlara sebep olan ilk iflası durdurmaktır.”"
 spec_reform.1.a: "Banknot basımını kasalardaki altına bağla."
 spec_reform.1.b: "Her sağlam banka kendi banknotunu bassın."
 spec_reform.1.c: "Bir son kredi mercii ata."
 spec_reform.1.d: "Şirketleri hesaplarını yayımlamaya mecbur et."
 spec_reform.1.e: "Komisyona teşekkür et ve raporunu rafa kaldır."
 spec_reform.2.t: "Sağlam Maliye"
 spec_reform.2.d: "Bankalarımız banknotlarını kurallara göre basıyor, panik anında kredi verecek bir merci hazır bekliyor ve şirketlerimiz yatırımcılara neleri olduğunu ve ne kadar borçları bulunduğunu göstermek zorunda. Tahvillerimiz artık yurt dışında değerinin üzerinde satılıyor ve [ROOT.GetCountry.GetCapital.GetCityHubName], sermaye için güvenli bir liman olarak anılıyor."
 spec_reform.2.f: "“Bir bankacının ilk vazifesi para kazanmak değil, parayı muhafaza etmektir.”"
 spec_reform.2.a: "Güven, kredinin temelidir."
