 SPEC_IL_DANGER_TT: "#header Çöküş Bölgesi#!\n$TOOLTIP_DELIMITER$\n#italic Yükseliş o kadar büyük ki şimdi geri düşmek onu kötü bitirir.#!\n\n[concept_spec_investor_interest] bu kadar düşerse yükseliş bir [concept_spec_collapse] ile biter\nBu yaklaşık #N [Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! [concept_spec_market_confidence] kaybına mal olur"
 SPEC_IL_CRASHED_TT: "#header [Goods.GetName]: Yükseliş Bitti#!\n$TOOLTIP_DELIMITER$\n#italic Bu maldaki yükseliş az önce bitti.#!\n\nBu ay şu şekilde bitti: [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]\n#N Yatırımcılar uzak duruyor#!: [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))]\n[Concept('concept_company','$concept_companies|q$')] bu yüzden [concept_throughput] #N kaybediyor#!"
 SPEC_IL_GLUT_TT: "#header [Goods.GetName] Toparlanıyor#!\n$TOOLTIP_DELIMITER$\n#italic Son yükseliş bittikten sonra yatırımcılar hâlâ temkinli.#!\n\nO yükseliş şu şekilde bitti: [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]\n[concept_spec_investor_interest] #N sınırlı#! · en yüksek düzey: #v Kuşkulu#!\n[Concept('concept_company','$concept_companies|q$')] bu yüzden [concept_throughput] #N kaybediyor#![AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_until_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_IL_RECOVERY_LEFT')]"
 SPEC_IL_RECOVERY_LEFT: "\nToparlanmanın bitişi: [TimeKeeper.GetCurrentDateWithDiff(FixedPointToInt(Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_until_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.ScriptValue('spec_calendar_day'))))] · kalan gün: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_until_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.ScriptValue('spec_calendar_day'))|0]#!"
 SPEC_TILE_BANKS: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_expx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_BANKS_ON', 'SPEC_GOODS_NONE')]$SPEC_TILE_CYCLE$"
 SPEC_TILE_BANKS_ON: "\n\n#title Banka Kredileri#!\nTüm [concept_spec_outstanding_credit] borcunun #v [Country.MakeScope.Var(Concatenate('spec_exp_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! kadarı bu yükselişte, havuz gelirinin #v [Country.MakeScope.Var(Concatenate('spec_ui_expm_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! ayı değerinde\nBiterse [concept_spec_market_confidence] darbesi, hiçbir bankanın kredi vermediği bir yükselişe göre #N x[Country.MakeScope.Var(Concatenate('spec_ui_expx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|2]#! büyük olur"
