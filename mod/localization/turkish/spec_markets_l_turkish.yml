 concept_spec_market_confidence: "Pazar Güveni"
 concept_spec_market_confidence_desc: "@spec_market_confidence! #italic Yatırımcıların yönettiğin [concept_country] içindeki [concept_market] hakkında ne hissettiği; #v 0#! (#v Panik#!) ile #v 100#! (#v Çılgınlık#!) arasında.#!\n\nKorku #N yatırımı yavaşlatır#! ve [concept_loans] maliyetini artırır\nHırs #P yatırımı hızlandırır#!\n\nYükselişteki [Concept('concept_good','$concept_goods|q$')] ile #P artar#!\n[Concept('concept_spec_boom_end','$concept_spec_boom_ends|q$')], [Concept('concept_spec_foreign_panic','$concept_spec_foreign_panics|q$')], [Concept('concept_diplomatic_play','$concept_diplomatic_plays|q$')] ve [concept_war] ile #N düşer#!\nYükselişler ve sonları, $building_financial_district$ ekonomide daha büyük yer tuttuğunda daha büyük, $building_manor_house$ sayıca onları aştığında daha küçüktür\n\nBankalar #v 55#! üzerinde [concept_investment_pool] için kredi verir\n#v 80#! veya üzerinde bir [concept_spec_speculative_mania] başlar\n#v 25#! altında bir [concept_spec_financial_panic] başlar\nYüksek [concept_spec_leverage] bu eşiği yükseltir\n$building_financial_district$ azsa eşik biraz düşer"
 concept_spec_speculative_mania: "Spekülatif Çılgınlık"
 concept_spec_speculative_mania_desc: "@spec_speculative_mania! #italic [concept_market] açgözlülükle çılgına döndü.#!\n\n[concept_spec_market_confidence] #v 80#! veya üzerinde olduğu sürece devam eder\nBankalar [concept_investment_pool] için #P en serbest şekilde kredi verir#!\n#N Her [concept_spec_boom_end] daha çok#! $concept_spec_market_confidence$ kaybettirir\n\nUzun süren veya çok yüksek bir çılgınlık, sonraki birkaç yıl [GetLawType('law_laissez_faire').GetName] isteyen [Concept('concept_political_movement','$concept_political_movements|q$')] gruplarına yardım eder"
 concept_spec_financial_panic: "Mali Panik"
 concept_spec_financial_panics: "Mali Panikler"
 concept_spec_financial_panic_desc: "@spec_financial_panic! #italic Yatırımcıların kaçtığı ve bankaların paralarını geri çektiği bir çöküş.#!\n\n[concept_spec_market_confidence] #v 25#! altına düştüğünde başlar. [concept_spec_leverage] #v 3#! ayı aştıkça bu eşik yükselir, en fazla #v 65#! olur. $building_financial_district$ azsa düşer, en az #v 20#! olur.\n\nSürdüğü sürece:\nHer binada #N daha az#! [concept_throughput] ve daha az vergi toplanır\nİşsizlere yardım için her hafta [concept_treasury] #N erir#!\n[concept_private_construction] ve yatırım #N yavaşlar#!\n[Concept('concept_company','$concept_companies|q$')] için $concept_throughput$ bonusu #N küçülür#!\n#N Bazı yatırımcılar#! [Concept('concept_radical','$concept_radicals|q$')] olur\nBankalar [concept_investment_pool] içinden [concept_spec_outstanding_credit] #N geri çeker#!\n\nBağlantılı her [concept_country] ülkesine bir [concept_spec_foreign_panic] olarak yayılır, para ise sakin [Concept('concept_great_power','$concept_great_powers|q$')] ülkelerine kaçar\nSonrasında [GetLawType('law_laissez_faire').GetName] karşıtı [Concept('concept_political_movement','$concept_political_movements|q$')] birkaç yıl destek kazanır"
 concept_spec_foreign_panic: "Yabancı Panik"
 concept_spec_foreign_panics: "Yabancı Panikler"
 concept_spec_foreign_panic_desc: "@spec_foreign_panic! #italic Yurt dışındaki bir paniğin pazarına taşması.#!\n\nSeninle bağlantılı bir [concept_country] içinde [concept_spec_financial_panic] başladığında [concept_spec_market_confidence] #N düşer#!\nÜlkeler ortak bir [concept_market], birinin diğerine bağlı olması, yatırım hakları, yoğun ticaret veya ekonominin bir kısmına sahip olma yoluyla bağlanır\n#N Bağ ne kadar yakınsa düşüş o kadar büyük#!\n\n[GetLawType('law_free_trade').GetName] ticaret bağlarını güçlendirir\nDiğer ticaret politikaları onları zayıflatır\n[concept_embargo] ticaret bağını keser"
 concept_spec_boom_end: "Yükseliş Sonu"
 concept_spec_boom_ends: "Yükseliş Sonları"
 concept_spec_boom_end_desc: "@spec_boom_end! #italic Her yükselişin bir inişi vardır. Bir [concept_good] için [concept_spec_investor_interest] yükseldikten sonra geri düştüğünde yükseliş sona erer.#!\n\nNe kadar yükselmişse o kadar sert düşer:\nZirvesi #v İlgili#!: bir [concept_spec_correction]\nZirvesi #v Hevesli#!: bir [concept_spec_bust]\nZirvesi #v Hararetli#!: bir [concept_spec_collapse]\n\n[concept_spec_market_confidence] düzeyini #N düşürür#!; büyük yükselişlerde ve [concept_market] ticaretinde payı büyük olan $concept_goods$ için daha fazla\nArdından $concept_good$ toparlanırken yatırımcılar uzak durur\nOnu bir [concept_company] üretiyorsa o sanayi [concept_throughput] #N kaybeder#!\n\n#instruction Zirve her ay biraz söner. Yavaş soğuyan bir yükseliş daha yumuşak biter ya da hiç $concept_spec_boom_end$ yaşanmaz.#!"
 concept_spec_correction: "Düzeltme"
 concept_spec_correction_desc: "@spec_correction! #italic $concept_spec_correction$, en hafif [concept_spec_boom_end] türüdür.#!\n\nBir [concept_good] için #v İlgili#! düzeyinde zirve yapan [concept_spec_investor_interest] yeniden #v Kuşkulu#! düzeyine düştüğünde gerçekleşir\n\n[concept_spec_market_confidence] düzeyini biraz #N düşürür#!\nYatırımcılar #v 3#! ay boyunca $concept_good$ yatırımından uzak durur\nOnu bir [concept_company] üretiyorsa o sanayi #v 90#! gün boyunca #N %2.5#! [concept_throughput] kaybeder; araştırılan [GetTechnology('corporate_charters').GetName] ve [GetTechnology('corporate_management').GetName] her biri için #N %25#! daha"
 concept_spec_bust: "Daralma"
 concept_spec_bust_desc: "@spec_bust! #italic $concept_spec_bust$, [concept_spec_correction] ile karşılaştırıldığında daha sert bir [concept_spec_boom_end] türüdür.#!\n\nBir [concept_good] için #v Hevesli#! düzeyinde zirve yapan [concept_spec_investor_interest] yeniden #v Kuşkulu#! düzeyine düştüğünde gerçekleşir\n\n[concept_spec_market_confidence] düzeyini daha fazla #N düşürür#!; aynı yükselişten sonraki bir $concept_spec_correction$ kaybının yaklaşık #v 2#! katı\nYatırımcılar #v 6#! ay boyunca $concept_good$ yatırımından uzak durur\nOnu bir [concept_company] üretiyorsa o sanayi #v 180#! gün boyunca #N %5#! [concept_throughput] kaybeder; araştırılan [GetTechnology('corporate_charters').GetName] ve [GetTechnology('corporate_management').GetName] her biri için #N %25#! daha"
 concept_spec_collapse: "Çöküş"
 concept_spec_collapse_desc: "@spec_collapse! #italic $concept_spec_collapse$, en ağır [concept_spec_boom_end] türüdür.#!\n\nBir [concept_good] için #v Hararetli#! düzeyinde zirve yapan [concept_spec_investor_interest] tamamen #v Kaçış#! düzeyine gerilediğinde gerçekleşir\n\n[concept_spec_market_confidence] düzeyini sert biçimde #N düşürür#!; aynı yükselişten sonraki bir [concept_spec_correction] kaybının yaklaşık #v 5#! katı\nYatırımcılar #v 12#! ay boyunca $concept_good$ yatırımından uzak durur\nOnu bir [concept_company] üretiyorsa o sanayi bir yıl boyunca #N %10#! [concept_throughput] kaybeder; araştırılan [GetTechnology('corporate_charters').GetName] ve [GetTechnology('corporate_management').GetName] her biri için #N %25#! daha\n\nEn kötüsü, [concept_market] ticaretinin büyük bir payında yaşanan bir $concept_spec_collapse$ bir [concept_spec_financial_panic] başlatabilir"
 concept_spec_investor_interest: "Yatırımcı İlgisi"
 concept_spec_investor_interest_desc: "@spec_investor_interest! #italic Yatırımcıların bir [concept_good] üreten [Concept('concept_building','$concept_buildings|q$')] için ne kadar istekli olduğu; #v Kaçış#! düzeyinden #v Hararetli#! düzeyine kadar.#!\n\n[concept_market_price] uzun dönem ortalamasının üzerindeyken #P artar#!\nAltındayken #N düşer#!\n\nBu binaların [concept_throughput] değeri onu izler: #v Kaçış#! düzeyinde #N -%10#!, #v Hararetli#! düzeyinde #P +%8#!\n$concept_good$ üreten [Concept('concept_company','$concept_companies|q$')] için [concept_prosperity] de onu izler\nYükselişteki bir $concept_good$ [concept_spec_market_confidence] düzeyini artırır\nİlgi geri düştüğünde yükseliş bir [concept_spec_boom_end] ile biter"
 concept_spec_credit_policy: "Kredi Politikası"
 concept_spec_credit_policy_tight: "Sıkı Kredi"
 concept_spec_credit_policy_normal: "Normal Kredi"
 concept_spec_credit_policy_loose: "Gevşek Kredi"
 concept_spec_credit_policy_desc: "@spec_credit_policy! #italic Bankaların [concept_investment_pool] için ne kadar serbestçe kredi verdiği.#!\n\n[GetTechnology('central_banking').GetName] ile açılır\n$concept_spec_credit_policy_tight$, $concept_spec_credit_policy_normal$ veya $concept_spec_credit_policy_loose$ olabilir\n\n#v Daha sıkı#! kredi yatırımı yavaşlatır ve [concept_spec_market_confidence] yüksek seyrettiğinde onu aşağı çeker\n#v Daha gevşek#! kredi [concept_spec_outstanding_credit] miktarını artırır\n\nDeğiştirildiğinde #v 6#! ay boyunca kilitlenir"
 concept_spec_leverage: "Kredi Kaldıracı"
 concept_spec_leverage_desc: "@spec_leverage! #italic Bankalarının ne kadar kredi verdiği. [concept_spec_outstanding_credit] miktarının [concept_investment_pool] gelirinin kaç ayına denk geldiğidir.#!\n\nHer tam ay için #P +%2#! [concept_throughput], en fazla #P +%24#!\nBu bonus bir [concept_spec_financial_panic] sırasında ve [concept_spec_bad_debts] sürerken söner\n\n#v 3#! ayı aşınca riskli hale gelir:\n#N $concept_spec_financial_panic$ daha erken başlar#!, daha yüksek bir [concept_spec_market_confidence] düzeyinde\n#N Ardında $concept_spec_bad_debts$ bırakır#!"
 concept_spec_bad_debts: "Batık Alacaklar"
 concept_spec_bad_debts_desc: "@spec_bad_debts! #italic Bir [concept_spec_financial_panic] sonrasında bankalarının defterlerinde kalan zararlar.#!\n\n[concept_spec_leverage] #v 3#! ayı aştıkça artarlar\n\nHer puan: #N -%0.4#! [concept_throughput] ve #N -%0.75#! yatırım\nBirkaç ay birikirler, sonra yavaşça azalırlar\nEn kötü durumda temizlenmeleri yaklaşık #v 6#! yıl sürer\nOnlar sürdükçe #N bankalar kredi vermez#!\n\n#v Bankalara Borç Ver#! onları temizlemez\n#v Batık Kredileri Satın Al#! onları yarıya indirir, sürdükleri sürece bir kez"
 concept_spec_lending_standards: "Kredi Standartları"
 concept_spec_lending_standards_desc: "@spec_lending_standards! #italic Yönettiğin [concept_country] bankalarının ne kadar dikkatli kredi verdiği. #v Katı#!, #v İhtiyatlı#!, #v Sağlam#!, #v Özensiz#! veya #v Pervasız#! olabilir.#!\n\nDaha özensiz bankalar [concept_investment_pool] için daha çok kredi verir ve bunun daha büyük kısmını yükselişlere yatırır\n#N Bu yüzden yükselişler daha sert biter#! ve Banka Kurtarma daha pahalıya mal olur\n\n[concept_spec_financial_panic] olmadan geçen her ay #N biraz gevşer#!; yaklaşık #v 20#! sakin yılda #v Katı#! düzeyinden #v Pervasız#! düzeyine iner\nHer Banka Kurtarma veya #v Batık Kredileri Satın Al#! sonrasında #N daha da gevşer#!\nBir yükseliş sona erdiğinde #P sıkılaşır#!, en çok da bir $concept_spec_financial_panic$ Banka Kurtarma olmadan sonuna kadar sürdüğünde"
 concept_spec_blue_chip: "Birinci Sınıf Hisse"
 concept_spec_blue_chips: "Birinci Sınıf Hisseler"
 concept_spec_blue_chip_desc: "@spec_blue_chip! #italic #v 12#! ay üst üste #v 70#! veya daha fazla [concept_prosperity] tutturan yıldız bir [concept_company].#!\n\nHer biri [concept_spec_company_strength] değerimize #v 2#! ekler\n#b Her biri#! #grey (ilk 5 tam, sonraki 5 yarı yarıya)#!\nÇöküş ve paniklerde kaybedilen [concept_spec_market_confidence]: #P -%4#!\n[concept_spec_exchange] güvenilirliği: yılda tam çubuğun #P +%0.4#! kadarı\n[concept_spec_exchange] rekabetleri: #P +%3#! bizden yana\nKapitalistlerin [concept_investment_pool] katkısı: #P +%0.6#!\nKredi faizi: #P -%1#!\n\n#b Birini kaybedersek#!\n#v 3#! ay üst üste #v 70#! [concept_prosperity] altında kalınca olur\n[concept_spec_exchange] güvenilirliği: tam çubuğun #N -%1.7#! kadarı\n[concept_spec_market_confidence]: #N -3#!\nBizi vuran bir Ayı Baskını birini bir yıllığına #N Kırılgan#! yapar. O zaman #v 3#! değil, #v 70#! [concept_prosperity] altında geçen tek bir ayın ardından statüsünü kaybeder\n\n#b Yılın Şirketi#!\nBizimki dünyanın en müreffeh şirketiyse tam çubuğun #P +%2.5#! kadarı [concept_spec_exchange] güvenilirliği ve bir yıllığına #P +%5#! [concept_prestige] kazanırız\n\n#v 3#! ay üst üste #v 70#! altında kalınca #N kaybedilir#!, ardından #v 12#! ay baştan başlar\nAltında geçen tek bir ay, ona doğru tırmanışı sıfırlar\nPazar ekonomisinden çıkan bir [concept_country] hiçbirini tutamaz"
 concept_spec_company_strength: "Şirket Gücü"
 concept_spec_company_strength_desc: "@spec_company_strength! #italic Bir [concept_country] için [Concept('concept_company','$concept_companies|q$')] toplamda ne kadar güçlü.#!\n\nHer şirket [concept_prosperity] değerinin #v 20#! ile bölümünü ekler, yani #v 100#! düzeyindeki bir şirket #v 5#! ekler\nHer [concept_spec_blue_chip] #v 2#! daha ekler\nEn güçlü olan Büyük Şirketlerin Yuvası unvanını kazanır"
 concept_spec_outstanding_credit: "Ödenmemiş Kredi"
 concept_spec_outstanding_credit_desc: "@spec_outstanding_credit! #italic Bankaların [concept_investment_pool] için verdiği ve henüz geri alamadığı para.#!\n\n[concept_spec_market_confidence] #v 55#! üzerindeyken bankalar kredi verir\nHavuz gelirinin #v 3#! ayı olan Kredi Sınırında dururlar\n[GetTechnology('central_banking').GetName] #v 5#! ay ekler\n[GetTechnology('investment_banks').GetName] ve [GetTechnology('international_exchange_standards').GetName] her biri #v 2#! ay ekler\n\nHer ay havuzdan biraz geri ödenir\nBir [concept_spec_financial_panic] başladığında bankalar #N bir kısmını geri çeker#!\n\n#lore Bankalar 1840'larda demiryolu hisseleri, 1837 yılında pamuk ve 1873 yılında Viyana'da arsa karşılığında borç verdi ve bu yükselişler çöktüğünde ortada kaldı.#!"
