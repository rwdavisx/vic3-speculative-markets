 concept_spec_intervention_desc: "@spec_intervention! Bir $concept_spec_intervention$ ile hükümetin tek bir [concept_good] için pazara müdahale eder. Onun için #v Spekülasyonu Dizginle#! veya #v Yatırımı Teşvik Et#! seçebilirsin.\n\n#v Spekülasyonu Dizginle#!, [concept_spec_investor_interest] düzeyini #v Sakin#! düzeyine indirir. Üreticileri #N %10#! [concept_throughput] kaybeder ve her hafta ürettiklerinin temel fiyat üzerinden #v %10#! kadarını vergi olarak öder.\n\n#v Yatırımı Teşvik Et#!, ilgiyi #v İlgili#! düzeyine çıkarır. Üreticileri #P %10#! $concept_throughput$ kazanır ve ürettiklerinin #v %20#! kadarı oranında sübvansiyon alır.\n\nHer biri kaldırılana kadar her ay [concept_authority] harcar. Temel ihtiyaç malları ve [concept_market] ticaretinde büyük payı olan $concept_goods$ daha pahalıya gelir."
 SPEC_LEVER_ISSUE_TT: "#header [Goods.GetName] için Büyük İhraç Yap#!\n$TOOLTIP_DELIMITER$\n#italic Borsamızda sıcak bir [concept_good] hisselerini sat. Büyük ödül, büyük risk.#!\n\n#v 2#! yıl boyunca:\n[Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')] puanı: #P +%25#!\nYükselişi bittiğinde içindeki banka kredileri #N x1.5#! kadar acıtır\nYükselişi bittiğinde kazanılan veya kaybedilen güvenilirlik #v x2#! olur\n$TOOLTIP_DELIMITER$\nAynı anda yalnızca bir tane, aralarında en az #v 1#! yıl[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_issue_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_ISSUE_ON', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_issue').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_ISSUE_ON: "\n\nİhracın bitmesine #v [Country.MakeScope.Var('spec_issue').GetValue|0]#! ay kaldı\nBir sonraki ihraç #v [Country.MakeScope.Var('spec_issue_cool').GetValueWithDefault('(CFixedPoint)0')|0]#! ay sonra yapılabilir"
