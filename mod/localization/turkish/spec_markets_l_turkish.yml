 SPEC_LAXL_HERE: "\n\n#P Buradayız#!"
 SPEC_LAXL_0_TT: "#header Katı#!\n$TOOLTIP_DELIMITER$\n#italic Bankalar neredeyse hiç kredi vermez. Yükselişler küçük kalır ve yumuşak biter.#!\n\n#b #v Sağlam#! düzeyine göre:#!\nHer ay verilen kredi: #v -%25#! ile #v -%15#! arası\nBunun yükselişlere giden payı: #P -%50#! ile #P -%30#! arası\nBanka Kurtarma maliyeti: #P -%50#! ile #P -%30#! arası\n\n#P [concept_spec_exchange] kurumumuz sakin aylarda güvenilirlik kazanır#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.2')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_1_TT: "#header İhtiyatlı#!\n$TOOLTIP_DELIMITER$\n#italic Bankalar dikkatli kredi verir.#!\n\n#b #v Sağlam#! düzeyine göre:#!\nHer ay verilen kredi: #v -%15#! ile #v -%5#! arası\nBunun yükselişlere giden payı: #P -%30#! ile #P -%10#! arası\nBanka Kurtarma maliyeti: #P -%30#! ile #P -%10#! arası\n\n#P [concept_spec_exchange] kurumumuz sakin aylarda güvenilirlik kazanır#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.2'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.4')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_2_TT: "#header Sağlam#!\n$TOOLTIP_DELIMITER$\n#italic Normal düzey.#!\n\n#b #v Sağlam#! düzeyine göre:#!\nHer ay verilen kredi: #v -%5#! ile #v +%5#! arası\nBunun yükselişlere giden payı: #P -%10#! ile #N +%10#! arası\nBanka Kurtarma maliyeti: #P -%10#! ile #N +%10#! arası\n\n#P [concept_spec_exchange] kurumumuz sakin aylarda güvenilirlik kazanır#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.4'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.6')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_3_TT: "#header Özensiz#!\n$TOOLTIP_DELIMITER$\n#italic Bankalar kolayca kredi verir ve yükselişlerin peşinden koşar.#!\n\n#b #v Sağlam#! düzeyine göre:#!\nHer ay verilen kredi: #v +%5#! ile #v +%15#! arası\nBunun yükselişlere giden payı: #N +%10#! ile #N +%30#! arası\nBanka Kurtarma maliyeti: #N +%10#! ile #N +%30#! arası\n\n#N [concept_spec_exchange] kurumumuz güvenilirlik kazanmayı bırakır#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.6'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.8')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_4_TT: "#header Pervasız#!\n$TOOLTIP_DELIMITER$\n#italic Bankalar herkese kredi verir. Yükselişler kızışır ve sert biter.#!\n\n#b #v Sağlam#! düzeyine göre:#!\nHer ay verilen kredi: #v +%15#! ile #v +%25#! arası\nBunun yükselişlere giden payı: #N +%30#! ile #N +%50#! arası\nBanka Kurtarma maliyeti: #N +%30#! ile #N +%50#! arası\n\n#N [concept_spec_exchange] kurumumuz güvenilirlik kazanmayı bırakır#![AddLocalizationIf(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.8'), 'SPEC_LAXL_HERE')]"
 SPEC_EFFECT_LAX: "Kredi Standartları"
 SPEC_EFFECT_LAX_VALUE: "#v [SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.2'), 'SPEC_LAXW_0', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.4'), 'SPEC_LAXW_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.6'), 'SPEC_LAXW_2', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.8'), 'SPEC_LAXW_3', 'SPEC_LAXW_4'))))]#!"
 SPEC_EFFECT_LAX_TT: "#header @spec_lending_standards! [concept_spec_lending_standards]: $SPEC_EFFECT_LAX_VALUE$#!\n$TOOLTIP_DELIMITER$\n#italic Bankalarımızın kredi verirken ne kadar dikkatli olduğu. Özensiz bankalar daha çok kredi verir ama yükselişleri daha sert biter.#!\n\n#b Normale (#v Sağlam#!) göre#!\nHer ay verilen kredi: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_credit'), '(CFixedPoint)1')|+%0]#!\nBu kredinin yükselişlere giden olağan payı: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_pull'), '(CFixedPoint)1')|+%0]#!\nBanka Kurtarma maliyeti: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_cost'), '(CFixedPoint)1')|+%0]#!\n\n#b Nasıl değişir#!\nHer sakin ay #N biraz gevşer#! (#v Katı#! düzeyinden #v Pervasız#! düzeyine yaklaşık #v 20#! yıl sürer)\nBankaları her kurtardığımızda #N çok gevşer#!\nBir yükseliş sona erdiğinde veya birini dizginlediğimizde #P sıkılaşır#!\nBir [concept_spec_financial_panic] kurtarma olmadan sona erdiğinde #P çok sıkılaşır#!\n$TOOLTIP_DELIMITER$\n#instruction Gevşemesini durdurmak için [concept_spec_credit_policy] ayarını #v Sıkı#! yap. Panik veya Batık Alacaklar da onu durdurur. #v Sağlam#! veya daha katı düzey ayrıca [concept_spec_exchange] güvenilirliğimizi artırır.#!"
 SPEC_TILE_CYCLE: "[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_overx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_OVER_ON', 'SPEC_GOODS_NONE')][SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_bb_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_TILE_BB_ON', 'SPEC_GOODS_NONE')]"
 SPEC_TILE_OVER_ON: "\n\n#title Aşırı İnşaat:#! bu yükseliş başladığından beri arz #v [Country.MakeScope.Var(Concatenate('spec_ui_over_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! arttı\nYükseliş biterse [concept_spec_market_confidence] darbesi #N x[Country.MakeScope.Var(Concatenate('spec_ui_overx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|2]#! büyük olur"
 SPEC_TILE_BB_ON: "\n\n#title Yükseliş İnşaatı:#! yatırımcılar bu kadar istekli kaldıkça sanayisi için #P +[Country.MakeScope.Var(Concatenate('spec_ui_bb_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! inşaat verimliliği"
 SPEC_NOTE_CYCLE: "[SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)2.5'), 'SPEC_NOTE_PPL_3', SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)1.5'), 'SPEC_NOTE_PPL_2', SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)0.5'), 'SPEC_NOTE_PPL_1', 'SPEC_GOODS_NONE')))]"
 SPEC_NOTE_OVER_ON: " Yükseliş sırasında o kadar çok şey inşa edilmişti ki düşüş #N x[SCOPE.GetValue('spec_note_over')|2]#! daha sert oldu."
