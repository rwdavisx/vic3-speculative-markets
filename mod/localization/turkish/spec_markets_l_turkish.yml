 spec_coty: "Yılın Şirketi"
 spec_coty_desc: "Dünyanın en müreffeh [concept_spec_blue_chip] bu yıl bizim"
 spec_bc_index: "Blue Chip Endeksi"
 spec_bc_index_desc: "[concept_spec_blue_chip] şirketlerimiz birikimleri piyasaya çeker ve kredileri ucuzlatır. Her biri onu güçlendirir. İlk 5 tanesi tam, 10 tanesine kadar geri kalanı yarım sayılır."
 spec_bluechip.1.t: "Yeni Bir Birinci Sınıf Hisse"
 spec_bluechip.1.d: "Bir yıllık istikrarlı kârın ardından [SCOPE.sCompany('spec_bc_co').GetName] artık birinci sınıf hisseler arasında sayılıyor. Hisselerini ülkedeki her banka ve her dul arıyor; simsarlar ise şirketin mevcut konumuyla mı yetineceğini, yoksa piyasadan daha fazlasını mı isteyeceğini merak ediyor."
 spec_bluechip.1.f: "Banka kadar sağlam, derler."
 spec_bluechip.1.a: "Onlar için zili çalın"
 spec_bluechip.1.a.tt: "[concept_spec_exchange] güvenilirliğimiz: #P +%2#!"
 spec_bluechip.1.b: "Yeni hisse çıkarmalarına izin verin"
 spec_bluechip.1.b.tt: "Bizim [concept_investment_pool]: #P +[ROOT.GetCountry.MakeScope.ScriptValue('spec_bc_shares')|D]#! @money!\n[SCOPE.sCompany('spec_bc_co').GetName], #v 5#! yıl boyunca kırılgan olur, bu yüzden #v 70#! [concept_prosperity] altında geçen tek bir ay artık birinci sınıf hisse olmadığı anlamına gelir"
 spec_bluechip.2.t: "Bir Birinci Sınıf Hisse Sendeliyor"
 spec_bluechip.2.d: "[SCOPE.sCompany('spec_bc_co').GetName], birinci sınıf hisse çizgisinin altına düştü. Kârları 3 ay içinde toparlanmazsa piyasa onu listeden silecek ve Borsamız bunu hissedecek."
 spec_bluechip.2.f: "Bir nesil ayakta kalan bir ticarethane bir mevsimde yıkılabilir."
 spec_bluechip.2.a: "Destekleyin"
 spec_bluechip.2.a.tt: "Maliyet: #N [ROOT.GetCountry.MakeScope.ScriptValue('spec_bc_prop_cost')|D]#! @money!\n[SCOPE.sCompany('spec_bc_co').GetName], kârı ne olursa olsun #v 12#! ay boyunca statüsünü korur"
 spec_bluechip.2.b: "Bırakın piyasa karar versin"
 spec_bluechip.2.b.tt: "Çizginin altında #v 3#! ay kalırsa:\n[concept_spec_exchange] güvenilirliğimiz: #N -%2#!\n[concept_spec_market_confidence]: #N -3#!"
 spec_bluechip.3.t: "Yılın Şirketi"
 spec_bluechip.3.d: "Her başkentin mali basını hemfikir. [SCOPE.sCompany('spec_bc_co').GetName] bu yıl dünyanın en müreffeh şirketi. Borsamız onun şanının tadını çıkarıyor."
