 SPEC_XS_TT: "#header @spec_speculative_excess! $concept_spec_speculative_excess$: [Country.MakeScope.Var('spec_heat').GetValueWithDefault('(CFixedPoint)0')|0] / 200#!\n$TOOLTIP_DELIMITER$\n#italic Bu balondur. Bir yükseliş ne kadar uzun süre kızışırsa o kadar büyür.#!\n\n[concept_spec_market_confidence] #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#! veya üzerindeyken #P büyür#!\n#v 60#! ile #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#! arasındayken yavaşça #v küçülür#!\n#v 60#! altına düşerse #N patlar#!\n\nŞimdi patlasaydı: anında #N -[Country.MakeScope.ScriptValue('spec_burst_now')|0]#! [concept_spec_market_confidence] (asla #N [Country.MakeScope.ScriptValue('spec_burst_max')|0]#! fazlası değil)\n$TOOLTIP_DELIMITER$\n#instruction Yavaşça söndürmek için güveni 60 ile [Country.MakeScope.ScriptValue('spec_heat_from')|0] arasında tut. Bir patlama zarar verecekse çubuk kırmızıya döner.#!"
