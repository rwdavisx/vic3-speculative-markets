 spec_inquiry_when_tt: "Son bir yılda bir [concept_spec_financial_panic] sona erdi ve o zamandan beri hiçbir araştırma toplanmadı ya da paniksiz #v 10#! sakin yıl geçti (#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_calm_left')|0]#! ay kaldı)"
