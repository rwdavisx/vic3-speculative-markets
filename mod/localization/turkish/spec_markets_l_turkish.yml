 concept_spec_speculative_excess_desc: "@spec_speculative_excess! #italic Bu, bir [concept_country] için [concept_market] içindeki balondur. Bir yükseliş ne kadar uzun süre kızışırsa o kadar büyür.#!\n\n[GetTechnology('stock_exchange').GetName] öncesinde balon oluşamaz.\n[concept_spec_market_confidence] #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! veya üzerinde olduğu her ay #P büyür#!; ne kadar yükselirse o kadar hızlı\n#v 60#! ile #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! arasındayken yavaşça #v küçülür#!\n#v 60#! altına düşerse #N patlar#!\n\nPatladığında $concept_spec_market_confidence$ en fazla #N [GetPlayer.MakeScope.ScriptValue('spec_burst_max')|0]#! daha düşer. Balon ne kadar büyükse düşüş o kadar sert olur."
 concept_spec_sound_finance: "Sağlam Maliye"
 concept_spec_sound_finance_desc: "@spec_sound_finance! #italic Üç [concept_spec_banking_reforms] düzenlemesinin tamamını, yani Banknot Kuralları, Son Kredi Mercii ve Şirketler Kanunu'nu yürürlüğe koymanın ödülü.#!\n\nBir [concept_country] üçüne de sahip olunca:\n#P +10#! [concept_prestige]\n[concept_loans] için #P %5#! daha az faiz"
 concept_spec_banking_reforms: "Bankacılık Reformları"
 concept_spec_banking_reform: "Bankacılık Reformu"
 concept_spec_banking_reforms_desc: "@spec_banking_reforms! #italic Bir [concept_country] için bankaların ve şirketlerin uyduğu kurallar. Her biri yükselişlerin ve paniklerin gidişatını değiştirir.#!\n\nHer reform bir teknolojiyle açılır. Bir Araştırma Komisyonu bir seferde bir reform yapar. Komisyon bir [concept_spec_financial_panic] sonrasında veya paniksiz geçen #v 10#! sakin yılın ardından toplanabilir.\n\n#bold Banknot Kuralları#! ([GetTechnology('banking').GetName]), birini seç:\n#bold Para Okulu#!\n$spec_reform_currency_tt$\n#bold Serbest Bankacılık#!\n$spec_reform_free_tt$\n\n#bold Son Kredi Mercii#! ([GetTechnology('central_banking').GetName])\n$spec_reform_llr_tt$\n\n#bold Şirketler Kanunu#! ([GetTechnology('joint_stock_companies').GetName])\n$spec_reform_company_tt$\n\nÜçünü de yürürlüğe koymak [concept_spec_sound_finance] kazandırır."
