 spec_bailed_tt: "Bu [concept_spec_bad_debts] başladığından beri devlet batık kredi satın almadı"
 spec_lev_boom_desc: "Borç para fabrikaları meşgul tutar ve [concept_spec_leverage] düzeyinin her tam ayı için #P +%2#! [concept_throughput] ekler, en fazla #P +%24#!"
 spec_credit_crunch: "Batık Alacaklar"
 spec_credit_crunch_desc: "Bankalar hâlâ son yükselişten kalan zararlarını sayıyor. Bu etki geçene kadar #N hiç kredi vermezler#!.\n#v Bankalara Borç Ver#! bunu temizlemez\n#v Batık Kredileri Satın Al#! bunu yarıya indirir, sürdüğü sürece bir kez"
