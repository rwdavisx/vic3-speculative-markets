 concept_spec_long_depression_desc: "@spec_long_depression! $concept_spec_long_depression$ tüm dünya ekonomisinin krizidir. Bir [concept_great_power] bir [concept_spec_financial_panic] içine düştüğünde başlar. Ardından zaten panik yaşayan her ülkeye ulaşır ve ortak [concept_market], bağlı ülkeler ve egemenler, yatırım hakları, yoğun ticaret ve yabancı mülkiyet gibi yakın bağlar üzerinden yayılır.\n\nDünya Çöküşü sırasında (#v 4#! ay) kredi donar ve [concept_spec_market_confidence] erir.\nBunalım sırasında (en fazla #v 5#! yıl) yatırım, inşaat ve ticaret yavaşlar, bazı nüfuslar [Concept('concept_radical','$concept_radicals|q$')] olur.\nToparlanma sırasında (#v 1#! yıl) $concept_spec_market_confidence$ geri döner.\n\nSeçimlerin hem kendi toparlanmanı hem de dünyanınkini hızlandırır. En çok bir $concept_great_power$ seçimleri önemlidir."
