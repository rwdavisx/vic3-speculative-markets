 SPEC_CO_TT_HEAD: "#header [concept_spec_investor_interest]#!"
 SPEC_CO_LINE: "[Goods.GetName]: [SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_CO_W1', SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_CO_W2', SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_CO_W3', SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)4'), 'SPEC_CO_W4', SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)5'), 'SPEC_CO_W5', SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)6'), 'SPEC_CO_W6', 'SPEC_CO_W0'))))))], [concept_throughput] [Multiply_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_co_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.01')|+=%0]"
