 SPEC_H_BANK_LENT_TT: "#header Bankaların Kredi Verdiği Yerler#!\n$TOOLTIP_DELIMITER$\n#italic Bankalar yeni kredilerini yükselişteki mallara akıtır.#!\n\nDaha büyük ve [concept_spec_investor_interest] düzeyi daha yüksek mallar paranın daha çoğunu alır\nBir kredi geri ödenene kadar kendi malında kalır\n#N İçinde kredi olan bir yükseliş biterse#! [concept_spec_market_confidence] daha da düşer\n$TOOLTIP_DELIMITER$\n#instruction Spekülasyonu dizginlemek, yükselişteki sektörlere yeni krediler dağıtılırken malın ağırlığını yarıya indirir.#!"
