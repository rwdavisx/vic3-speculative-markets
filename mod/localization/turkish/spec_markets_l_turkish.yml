 SPEC_DRIVER_WAREND_TT: "#header Savaşın Sonu: [Country.MakeScope.Var('spec_c_warend').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n[concept_casualties] durumumuza göre tam etkinin #v x[Country.MakeScope.Var('spec_war_stakes_now').GetValueWithDefault('(CFixedPoint)0')|%0]#! kadarı\n$TOOLTIP_DELIMITER$\n#title Tam Etki#!\nKazandık ve bir [concept_war_goal] elde ettik: #P +4#!\nKazandık ama hiçbir şey elde etmedik: #P +1#!\nKaybettik ve bir [concept_war_goal] verdik: #N -8#!\nKaybettik ama hiçbir şey vermedik: #N -2#!\nKimse kazanmadı: #N -1#!\n\n#weak Her zaman en az #v %25#! kadarını hissederiz; savaş kuvvetlerimizin #v %25#! kadarına mal olduysa tamamını#!"
