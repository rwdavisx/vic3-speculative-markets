l_turkish:
 spec_confidence_bar: "Pazar Güveni"
 spec_confidence_bar_desc: "@spec_market_confidence! [concept_spec_market_confidence]: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!"
 spec_stance_current_tt: "Mevcut [concept_spec_credit_policy] bu değil"
 spec_stance_cooldown_tt: "@spec_credit_policy! [concept_spec_credit_policy] son #v 6#! ayda değişmedi"
 spec_rescued_tt: "Bu [concept_spec_financial_panic] sırasında bankalara borç vermedik ve Bankacılık Kanunu'nu askıya almadık"
 spec_credit_tight: "Sıkı Kredi"
 spec_credit_tight_fx: "@spec_credit_policy! [concept_spec_credit_policy] #v Sıkı#! olur"
 spec_credit_normal_fx: "@spec_credit_policy! [concept_spec_credit_policy] #v Normal#! olur"
 spec_credit_loose_fx: "@spec_credit_policy! [concept_spec_credit_policy] #v Gevşek#! olur"
 spec_credit_tight_desc: "#italic Pazarı soğutmak için borçlanmayı pahalılaştır.#!\n\n#N Bankalar kredi vermeyi bırakır#!\nYatırımcılar yükselen fiyatlara daha az heyecanlanır\n#P Daha küçük yükselişler#!, daha yumuşak bitişler ve daha hafif panikler\nHer ay [concept_spec_market_confidence] değerinin #v 60#! üzerindeki kısmının #N %10#! kadarı erir\n\n[concept_spec_credit_policy] #v 6#! ay kilitlenir\n[GetTechnology('central_banking').GetName] gerekir\n\n@intelligentsia! Aydınlar [concept_in_government]: #P +2#! [concept_approval]\n@industrialists! Sanayiciler [concept_in_government]: #N -2#! [concept_approval]"
 spec_credit_normal: "Normal Kredi"
 spec_credit_normal_desc: "#italic Bankalar olağan koşullarla kredi verir.#!\n\n[concept_spec_market_confidence] #v 55#! üzerindeyken [concept_investment_pool] için kredi verirler\n\n[concept_spec_credit_policy] #v 6#! ay kilitlenir\n[GetTechnology('central_banking').GetName] gerekir"
 spec_credit_loose: "Gevşek Kredi"
 spec_credit_loose_desc: "#italic Borçlanmayı ucuzlat ve paranın akmasına izin ver.#!\n\n#P Bankalar daha çok kredi verir#!\nYatırımcılar yükselen fiyatlara daha çok heyecanlanır\n#P Daha büyük yükselişler#!, ama bittiklerinde #N daha büyük kayıplar#!\n\n[concept_spec_credit_policy] #v 6#! ay kilitlenir\n[GetTechnology('central_banking').GetName] gerekir\n\n@industrialists! Sanayiciler [concept_in_government]: #P +2#! [concept_approval]\n@intelligentsia! Aydınlar [concept_in_government]: #N -2#! [concept_approval]"
 spec_rescue_banks: "Bankalara Borç Ver"
 spec_rescue_banks_desc: "#italic Paniği durdurmak için [concept_treasury] kaynağından bankalara para akıt.#!\n\nMaliyet: [concept_gdp] değerinin yaklaşık #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#! kadarı\n[concept_spec_financial_panic] #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#! ay içinde #P biter#!\nKalan aylar için cezaları #P yarıya iner#!\n[concept_spec_market_confidence] #P 20#! artar\n\n#b Değişmeyenler#!\n$spec_panic_relief$ ödemeleri\nPanik başladığında zaten radikalleşmiş insanlar\nGeride bıraktığı [concept_spec_bad_debts]\n\nPaniğin süresi ne kadar uzunsa maliyet o kadar artar\nHer $concept_spec_financial_panic$ için yalnızca bir kez\n[GetTechnology('central_banking').GetName] bunu daha ucuz ve hızlı yapar"
 spec_conf_panic: "Sarsılmış Yatırımcılar"
