 spec_rival.1.t11: "#v [ROOT.GetCountry.GetCapital.GetCityHubName]#! Üzerine Ayı Baskını!"
 spec_rival.1.d11: "Açılış zilinden önce #v [SCOPE.sCountry('target').GetName]#! adına çalışan borsacılar demiryolu ve banka hisselerimizden büyük blokları bir anda salona attı. Fiyatlar kırıldı, teleksler geride kaldı ve öğlene kadar kendi kâtiplerimiz bile korkuyla satış yapıyordu.\n\n[concept_spec_market_confidence] değerimiz 6 ay içinde en fazla #N [SCOPE.GetValue('spec_rv_event_amount')|2]#! düşecek."
 spec_rival.1.f11: ""Piyasadaki bir panik, tek bir söylentiyle başlayabilir.""
 spec_rival.1.t10: "Başarısız Baskın"
 spec_rival.1.d10: "#v [SCOPE.sCountry('target').GetName]#! adına çalışan borsacılar, bir bozgun bekleyerek hisselerimizi bir anda salona boşalttı. Oysa bankalarımız sunulan her lotu satın aldı, fiyatlar dayandı ve kapanış zili çaldığında yaralarını saran baskıncılar oldu.\n\nOnların kendi [concept_spec_market_confidence] değeri 6 ay içinde en fazla #P [SCOPE.GetValue('spec_rv_event_amount')|2]#! düşer."
 spec_rival.1.f10: "\"Sahip olmadığını satan ayı, haklı çıksa iyi eder.\""
 spec_rival.1.t21: "Sermayemize Kur Yapılıyor"
 spec_rival.1.d21: "#v [SCOPE.sCountry('target').GetName]#! ajanları en iyi otellerimizde oda tuttu ve en büyük yatırımcılarımız her akşam onlarla yemek yiyor. Teklifleri basit. Daha iyi bir faiz, daha güvenli bir liman ve hiçbir rahatsız edici soru yok.\n\n12 ay boyunca [concept_investment_pool] gelirimizin #N [GetPlayer.MakeScope.Var('spec_rv_lure_share').GetValue|%0]#! kadarı onlara gider."
 spec_rival.1.f21: "\"Sermaye iyi davranıldığı yere gider, iyi beslendiği yerde kalır.\""
 spec_rival.1.t31: "Fısıltı Kampanyası"
 spec_rival.1.d31: "#v [SCOPE.sCountry('target').GetName]#! sabah gazeteleri, #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! şehrindeki sahte bilançolar ve sallanan bankalar hakkında uzun sütunlar yayımlıyor. Hiçbiri imzalı değil ve azı doğru, ama kıtadaki her yazıhanede okunuyorlar.\n\n[concept_spec_exchange] kurumumuz #N [Divide_CFixedPoint(SCOPE.GetValue('spec_rv_event_amount'), '(CFixedPoint)120')|%2]#! güvenilirlik kaybeder."
 spec_rival.1.f31: "\"Yalan dünyayı yarı yarıya dolaşırken doğru hâlâ çizmelerini giymektedir.\""
 spec_rival.1.t3n: "Parayla Yürütülen Kampanya İfşa Oldu"
 spec_rival.1.d3n: "#v [SCOPE.sCountry('target').GetName]#! gazeteleri [concept_spec_exchange] kurumumuz hakkındaki şüphelerle doluydu. Ama bir kâtip konuştu ve artık herkes mürekkebin kimin parasıyla ödendiğini biliyor.\n\nGüvenilirlik kaybediyoruz, ama onlar da kaybediyor ve yurt dışında adları zarar görüyor."
 spec_rival.1.f3n: "\"Karanlıkta atılan çamur yine de elleri kirletir.\""
 spec_rival.1.t: "Bir Yarışçı Bize Karşı Hamle Yaptı"
 spec_rival.1.f: ""Piyasadaki bir panik, tek bir söylentiyle başlayabilir.""
 spec_rival.1.a: "Onlara kendi ilaçlarının tadına baktıralım."
 spec_rival.1.a_tt: "Aynısını onlara yaparız, bu yıl yapmış olsak bile."
 spec_rival.1.a_1: "Onlara karşı #v Ayı Baskını#!:"
 spec_rival.1.a_2: "#v Sermayelerini Çek#!:"
 spec_rival.1.a_3: "Onlara karşı #v Basın Kampanyası#!:"
 spec_rival.1.b: "Onlara karşı saflarımızı sıklaştıralım."
 spec_rival.1.b_tt: "yarı etki. Korumanın bitişi: [TimeKeeper.GetCurrentDateWithDiff(FixedPointToInt(Select_CFixedPoint(GreaterThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_nx_shore'), '(CFixedPoint)1.05'), '(CFixedPoint)504', '(CFixedPoint)360')))]. Yeniden kullanılabilir: [TimeKeeper.GetCurrentDateWithDiff('(int32)730')]. Maliyet: @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]."
 spec_rival.1.c: "Hiçbir şey olmamış gibi devam edelim."
 spec_rival.1.c_tt: "[concept_spec_exchange] kurumumuz soğukkanlılığını koruduğu için #P [Multiply_CFixedPoint('(CFixedPoint)0.01', Add_CFixedPoint('(CFixedPoint)1', Multiply_CFixedPoint('(CFixedPoint)1', SCOPE.sCountry('target').MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'))))|%0]#! güvenilirlik kazanır. Umursamadığımız Borsa ne kadar büyükse bu o kadar çok sayılır."
 spec_rival.1.d: "Paniğin içinden alım yapalım."
 spec_rival.1.d_tt: "Bankalarımız baskıncıların sattığını satın alır. Baskın #P yarısı kadar#! [concept_spec_market_confidence] kaybettirir. Maliyeti #N @money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rv_counter_cost')|D]#! (GSYH'mizin #v %1#! kadarı)."
