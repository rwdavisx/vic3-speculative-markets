 SPEC_XS_CAP_TT: "#header Sermaye#!\n$TOOLTIP_DELIMITER$\n#italic [concept_spec_exchange] kurumumuzun kullanabildiği para.#!\n\nKendimizin: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_own_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, altı aylık [concept_investment_pool] geliri (yıllık ortalama)\nBağlarımızdan: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_reach_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, [concept_market] içimizdeki her küçük [concept_country], [Concept('concept_subject','$concept_subjects|q$')] ülkelerimiz, [concept_power_bloc] üyelerimiz veya bize [concept_foreign_investment] hakkı veren her ülkenin parasının dörtte biri. Asla kendimizinkinden fazla değil\n$TOOLTIP_DELIMITER$\n#weak Daha çok para yardımcı olur ama giderek azalan ölçüde. Puanı ikiye katlamak için on altı kat para gerekir#!"
