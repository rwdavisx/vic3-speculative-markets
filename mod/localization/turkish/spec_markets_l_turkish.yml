 spec_suspend_tt: "[concept_spec_financial_panic] #v 2#! ay içinde #P sona erer#!, ancak o zamana kadar tam güçle vurur\n[concept_spec_market_confidence] #P +15#!\nSonraki #v 10#! yıl boyunca [concept_spec_speculative_excess] #N %50#! daha hızlı büyür\n[concept_spec_lending_standards] tıpkı bir Banka Kurtarmasından sonraki gibi gevşer"
 spec_suspend_act: "Bankacılık Kanunu'nu Askıya Al"
 spec_suspend_act_desc: "Bankanın Kanun'un izin verdiğinden fazla banknot basmasına izin ver. Panik birkaç ay içinde yatışır ve hazineye hiçbir maliyeti olmaz. Bedeli, yatırımcıların onları her zaman kurtaracağımızı öğrenmesidir. Bu, bu panik için #v Bankalara Borç Ver#! sayılır.\n\n#lore Britanya, Bank Charter Act'i 1847, 1857 ve 1866 yıllarında askıya aldı.#!"
 spec_relief_works_button: "Yardım İşleri"
 spec_relief_works_button_desc: "Durgunluk sürerken bayındırlık işlerini ve yardımları finanse et. #v 12#! ay boyunca refahı ve inşaatı artırır, radikallerden destek çeker. [concept_gdp] değerimiz ne kadar büyükse haftalık maliyet o kadar artar."
 spec_convert_debt: "Devlet Borcunu Yenile"
 spec_convert_debt_desc: "Yatırımcıların keyfi yerindeyken borçlarımızı daha düşük faizli yenileriyle değiştir. Eski faizle geçinenler bize teşekkür etmeyecek."
 spec_inquiry: "Araştırma Komisyonu"
 spec_inquiry_desc: "Bankacıları, simsarları ve varını yoğunu yitirmiş tasarruf sahiplerini dinleyecek ve bankalarımızla şirketlerimizin nasıl yönetilmesi gerektiğini söyleyecek bir komisyon kur. Raporu, teknolojimizin açtığı bir [Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')] düzenlemesini çıkarır. Hükümeti #v 6#! ay meşgul eder."
 spec_debt_converted: "Yenilenen Borç"
 spec_debt_converted_desc: "Yatırımcılar borç vermeye hevesliyken kredilerimiz daha düşük faizle yenilendi."
 spec_relief_works: "Yardım İşleri"
 spec_relief_works_desc: "Daralma yüzünden işsiz kalanlara bayındırlık işleri ve yardım sağlanıyor."
 spec_relief_costs: "Yardım İşleri Maliyeti"
 spec_relief_costs_desc: "Bayındırlık işlerinin ve yardımların maliyetini hazine karşılıyor."
 spec_act_suspended: "Bankacılık Kanunu Askıda"
 spec_act_suspended_desc: "Hükümet bir paniği sona erdirmek için kendi kanununu bir kenara bıraktı."
 spec_inquiry_sitting: "Araştırma Komisyonu"
 spec_inquiry_sitting_desc: "Bir komisyon bankalarımızın ve şirketlerimizin tutumuna ilişkin ifadeleri dinliyor."
 spec_sound_finance: "Sağlam Maliye"
 spec_sound_finance_desc: "Paramız, bankalarımız ve şirketlerimiz yatırımcıların güvendiği kurallarla yönetiliyor."
 spec_rentiers_cut: "Rantiye Geliri Kesintisi"
 spec_relief_thanks: "Yardım İşleri"
