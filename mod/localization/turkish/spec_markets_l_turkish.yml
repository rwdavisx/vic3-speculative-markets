 SPEC_IL_SORT_INTEREST_TT: "#header [concept_spec_investor_interest] Ölçüsüne Göre Sırala#!\n$TOOLTIP_DELIMITER$\nÖnce en sıcak mallar, sonra en çok ticareti yapılanlar\n\nİşaret düzeyi gösterir: @spec_interest_fleeing! #v Kaçış#! düzeyinden @spec_interest_feverish! #v Hararetli#! düzeyine\nOk bu ayki değişimi gösterir"
