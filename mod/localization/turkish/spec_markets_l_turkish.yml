 concept_spec_financial_centre_desc: "@spec_financial_centre! $concept_spec_financial_centres$, [Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')] puanı en yüksek olan #v 5#! [Concept('concept_country','$concept_countries|q$')] olup her ay sıralanır. [concept_spec_exchange] kurumunun yararlanabildiği [concept_investment_pool] parası ne kadar çoksa puanı o kadar yüksek olur. Güvenilirlik, kişi başına zenginlik, Mali Bölgeler, şirketler, finans teknolojileri, [concept_rank] ve ekonomik sistem de onu değiştirir. İlk üçün ortalaması #v 100#! olur.\n\nBirinci sıra: #P +%10#! [concept_prestige], #P -%10#! [concept_loans] faiz oranı, #P +5#! ay Kredi Sınırı\nSon sıra (#v 5#!): #P +%2#!, #P -%2#!, #P +1#! ay\nKredi Sınırı bonusu için [GetTechnology('central_banking').GetName] ve Kredi Standartlarının #v Sağlam#! veya daha katı olması gerekir"
