 SPEC_RV_RAID_TT: "#header Ayı Baskını#!\n$TOOLTIP_DELIMITER$\n#italic Simsarlarımız [Country.GetNameNoFormatting] hisselerini bir anda elden çıkararak pazarlarını çökertir.#!\n$TOOLTIP_DELIMITER$\n#b İşe yararsa#!\n[Country.GetNameNoFormatting] [concept_spec_market_confidence] değeri: #v 6#! ay içinde en fazla #P -[Multiply_CFixedPoint(Multiply_CFixedPoint(Multiply_CFixedPoint(Multiply_CFixedPoint('(CFixedPoint)0.5', Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_nx_raid'), Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))), Select_CFixedPoint(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)80'), '(CFixedPoint)2', '(CFixedPoint)1')), Select_CFixedPoint(GetScriptedGui('spec_sgui_rv_is_shielded').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End), '(CFixedPoint)0.5', '(CFixedPoint)1')), '(CFixedPoint)6')|2]#!\nYarış: bizim lehimize #P %10#!\n\n#b Başarısız olursa#! (#N %[Min_CFixedPoint('(CFixedPoint)80', Add_CFixedPoint('(CFixedPoint)20', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint('(CFixedPoint)0', Divide_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, GetPlayer.MakeScope.Var('spec_centre_score').GetValue), Max_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|0]#! olasılık)\n[concept_spec_market_confidence] değerimiz: #v 6#! ay içinde en fazla #N -[Multiply_CFixedPoint(Multiply_CFixedPoint(Multiply_CFixedPoint(Multiply_CFixedPoint('(CFixedPoint)0.5', '(CFixedPoint)1'), Select_CFixedPoint(GreaterThanOrEqualTo_CFixedPoint(GetPlayer.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)80'), '(CFixedPoint)2', '(CFixedPoint)1')), Select_CFixedPoint(GetScriptedGui('spec_sgui_rv_is_shield').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End), '(CFixedPoint)0.5', '(CFixedPoint)1')), '(CFixedPoint)6')|2]#!\nYarış: onların lehine #N %10#!\nYıllık sınır: 4.\n$TOOLTIP_DELIMITER$\nMaliyet: [concept_treasury] kaynağımızdan #N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#!\nBekleme süresi: [Country.GetNameNoFormatting] karşısında #v 1 yıl#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_raid').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_RAID')]"
 SPEC_RV_WHY_RV_RAID: "\n\n[GetScriptedGui('spec_sgui_rv_raid').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_LURE_TT: "#header Sermaye Çek#!\n$TOOLTIP_DELIMITER$\n#italic Bankacılarımız [Country.GetNameNoFormatting] yatırımcılarını daha iyi koşullarla kendimize çeker.#!\n$TOOLTIP_DELIMITER$\n[Country.GetNameNoFormatting] tarafının [concept_investment_pool] gelirinin #P [Multiply_CFixedPoint(Multiply_CFixedPoint('(CFixedPoint)0.05', Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_nx_lure'), Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))), Select_CFixedPoint(GetScriptedGui('spec_sgui_rv_is_shielded').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End), '(CFixedPoint)0.5', '(CFixedPoint)1'))|%2]#! kadarı #v 12#! ay boyunca bize gelir\nYarış: bizim lehimize #P %10#!\n$TOOLTIP_DELIMITER$\nMaliyet: [concept_spec_outstanding_credit] borcumuza #N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_lure_debt_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#! eklenir\nBekleme süresi: [Country.GetNameNoFormatting] karşısında #v 1 yıl#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_lure').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_LURE')]"
 SPEC_RV_WHY_RV_LURE: "\n\n[GetScriptedGui('spec_sgui_rv_lure').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_PRESS_TT: "#header Basın Kampanyası#!\n$TOOLTIP_DELIMITER$\n#italic Dost gazeteler sayfalarını [Country.GetNameNoFormatting] [concept_spec_exchange] kurumu hakkındaki şüphelerle doldurur.#!\n$TOOLTIP_DELIMITER$\n#b İşe yararsa#!\n[Country.GetNameNoFormatting] [concept_spec_exchange] güvenilirliği: #P -[Divide_CFixedPoint(Min_CFixedPoint(Country.MakeScope.Var('spec_centre_trust').GetValue, Multiply_CFixedPoint(Multiply_CFixedPoint(Multiply_CFixedPoint('(CFixedPoint)2', Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_nx_press'), Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))), Select_CFixedPoint(GetScriptedGui('spec_sgui_rv_is_shielded').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End), '(CFixedPoint)0.5', '(CFixedPoint)1')), Country.MakeScope.ScriptValue('spec_exch_loss'))), '(CFixedPoint)120')|%2]#!\nYarış: bizim lehimize #P %10#!\n\n#b İfşa olursa#! (#N %[Country.MakeScope.ScriptValue('spec_rv_press_expose')|0]#! olasılık, [Country.GetNameNoFormatting] basını özgür olduğunda daha yüksek)\n[Country.GetNameNoFormatting] ile [concept_relations]: #N -20#!\nonlar −[Divide_CFixedPoint(Min_CFixedPoint(Country.MakeScope.Var('spec_centre_trust').GetValue, Multiply_CFixedPoint(Multiply_CFixedPoint(Multiply_CFixedPoint('(CFixedPoint)2', Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_nx_press'), Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))), Select_CFixedPoint(GetScriptedGui('spec_sgui_rv_is_shielded').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End), '(CFixedPoint)0.5', '(CFixedPoint)1')), Country.MakeScope.ScriptValue('spec_exch_loss'))), '(CFixedPoint)120')|%2]. [concept_spec_exchange] güvenilirliğimiz: #N -%[Divide_CFixedPoint(Min_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_trust').GetValue, Multiply_CFixedPoint('(CFixedPoint)2', GetPlayer.MakeScope.ScriptValue('spec_exch_loss'))), '(CFixedPoint)120')|%2]#!\nYarış: onların lehine #N %10#!\n$TOOLTIP_DELIMITER$\nMaliyet: #v 12#! ay boyunca [concept_influence] #N -75#! @inf!\nBekleme süresi: [Country.GetNameNoFormatting] karşısında #v 1 yıl#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_press').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_PRESS')]"
 SPEC_RV_WHY_RV_PRESS: "\n\n[GetScriptedGui('spec_sgui_rv_press').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
