 spec_lever_fits_restrain_tt: "@spec_investor_interest! [concept_spec_investor_interest] en az #v Hevesli#! düzeyinde veya yükselişin sona ermesi en az #v 2#! [concept_spec_market_confidence] kaybına yol açacak"
 spec_lever_fits_encourage_tt: "@spec_investor_interest! [concept_spec_investor_interest] #v İlgili#! düzeyinin altında, [concept_good] yükseliş sonrası toparlanma döneminde değil ve [concept_spec_bust] veya [concept_spec_collapse] ile sona erebilecek bir yükselişi yok"
 SPEC_LEVER_RESTRAIN_TT: "#header Spekülasyonu Dizginle (Mal: [Goods.GetName])#!\n$TOOLTIP_DELIMITER$\n#italic Sıcak bir [concept_good] yükselişi çok büyümeden onu soğut.#!\n\n[concept_spec_investor_interest] birkaç ay içinde #v Sakin#! düzeyine iner\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_DOWN', 'SPEC_LEVER_NONE')][concept_budget_additional_income]: haftada #P @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_levy_', Goods.GetKey))|D]#! (temel fiyattan ürettiklerinin #v %10#! kadarı)\nYükselişi bittiğinde bir anda değil, yaklaşık bir yıl içinde bir [concept_spec_correction] olarak yavaşça söner\n\nYürürlükteyken #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#! [concept_authority] bağlar, her ay yeniden ödenmez. Kaldırınca geri alırız#indent_newline:3 \nBu [concept_good] için normalde #v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#!, üzerindeki tüketim vergisinin yarısı kadar\nNe kadar ticaretini yaptığımıza göre #v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! (pazarımızın #v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! kadarı)#!\n\n#lore Güney Denizi Balonu'ndan sonra 1720 tarihli Bubble Act, kraliyet imtiyazı olmadan anonim şirket kurulmasını yasakladı.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_restrain_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_restrain').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_LEVER_ENCOURAGE_TT: "#header Yatırımı Teşvik Et (Mal: [Goods.GetName])#!\n$TOOLTIP_DELIMITER$\n#italic Yatırımcıların görmezden geldiği bir [concept_good] için ilgilerini ısıt.#!\n\n[concept_spec_investor_interest] birkaç ay içinde #v İlgili#! düzeyine yükselir\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_UP', 'SPEC_LEVER_NONE')][concept_budget_additional_expenses]: haftada #N @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_subsidy_', Goods.GetKey))|D]#! (temel fiyattan ürettiklerinin #v %20#! kadarı)\n[concept_good] #v Hevesli#! olunca kendiliğinden biter\n\nYürürlükteyken #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#! [concept_authority] bağlar, her ay yeniden ödenmez. Kaldırınca geri alırız#indent_newline:3 \nBu [concept_good] için normalde #v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#!, üzerindeki tüketim vergisinin yarısı kadar\nNe kadar ticaretini yaptığımıza göre #v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! (pazarımızın #v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! kadarı)#!\n\n#lore 1800'lerin ortasında Britanya Hindistanı ve Fransa, demiryolu yatırımcılarına sermayeleri için sabit bir getiri garanti etti.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_encourage_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_encourage').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
