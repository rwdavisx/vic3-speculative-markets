 SPEC_DRIVER_BURST_TT: "#header Balon Patlamaları: [Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#italic Balon patladı.#!\n\n#v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0'), Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_burst_per_heat'), '(CFixedPoint)-1'))|0]#! puan [concept_spec_speculative_excess]\nHer puan için #N -[Country.MakeScope.ScriptValue('spec_burst_per_heat')|2]#!\nEn fazla #N -[Country.MakeScope.ScriptValue('spec_burst_max')|0]#!\n$TOOLTIP_DELIMITER$\nBir yükseliş güveni #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#! üzerine çıkardıktan sonra [concept_spec_market_confidence] #v 60#! altına düşerse balon patlar\nYükseliş ne kadar uzun ve yüksek olursa patlama o kadar büyük olur\n#weak [GetTechnology('stock_exchange').GetName] gerekir#!"
 SPEC_DRIVER_CAUTION: "Hükümet ve Olaylar"
 SPEC_DRIVER_RESTRAIN: "Dizginlenen Yükselişler"
 SPEC_DRIVER_LIMIT: "Alt ve Üst Sınır"
 SPEC_DRIVER_BOOM: "Yükselen Mallar"
 SPEC_DRIVER_BOOM_TT: "#header Yükselen Mallar: [Country.MakeScope.Var('spec_c_boom').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\nYükselişteki #v [Country.MakeScope.Var('spec_n_boom').GetValueWithDefault('(CFixedPoint)0')|0]#! [Concept('concept_good','$concept_goods|q$')] etkisinden [Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0')|+=2][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_BOOM_CAP')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_steady'), '(CFixedPoint)1')), 'SPEC_BOOM_STEADY')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_fin_boom'), '(CFixedPoint)1')), 'SPEC_BOOM_FIN')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_boom_rule'), '(CFixedPoint)1')), 'SPEC_BOOM_RULE')]\n$TOOLTIP_DELIMITER$\nBir malın [concept_market] içindeki payı ne kadar büyükse yükselişi o kadar çok katkı yapar. [concept_spec_financial_panic] sırasında etkisizdir\n#weak [GetTechnology('stock_exchange').GetName], [GetTechnology('investment_banks').GetName] ve [GetTechnology('modern_financial_instruments').GetName] bunu büyütür#!"
 SPEC_BOOM_CAP: "\nAşağıdakilerden önce #v +3#! ile sınırlı"
 SPEC_BOOM_STEADY: "\nMalikânelerden #v x[Country.MakeScope.ScriptValue('spec_steady')|2]#!"
 SPEC_BOOM_FIN: "\nMali teknolojilerden #v x[Country.MakeScope.ScriptValue('spec_fin_boom')|2]#!"
 SPEC_BOOM_RULE: "\nPazar Oynaklığından #v x[Country.MakeScope.ScriptValue('spec_boom_rule')|2]#!"
 SPEC_DRIVER_CRASH: "Sona Eren Yükselişler"
 SPEC_DRIVER_CRASH_TT: "#header Sona Eren Yükselişler: [Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\nGeçen ayın en büyüğü: #v [Country.MakeScope.Var('spec_crashed').GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\nSona eren yükselişlerin büyüklüğünden [Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0')|+=2]\nPazarın ne kadar sıcak olduğu ([concept_spec_market_conditions]): #tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#![AddLocalizationIf(Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-40')), 'SPEC_CRASH_CAP')]\n$TOOLTIP_DELIMITER$\nDaha büyük yükselişler ve [concept_market] içinde payı daha büyük mallar daha çok acıtır\n#weak [GetTechnology('mutual_funds').GetName] bunu hafifletir, [GetTechnology('modern_financial_instruments').GetName] ağırlaştırır#!"
 SPEC_CRASH_CAP: "\nAyda #N -40#! ile sınırlı"
 SPEC_DRIVER_FOREIGN: "Yabancı Panikler"
 SPEC_FOREIGN_HIT: "\nBir [concept_spec_foreign_panic] temel darbesi: #N -20#!\nEkonomilerinin bizimkine göre büyüklüğü: #v x[Country.MakeScope.Var('spec_fh_size').GetValueWithDefault('(CFixedPoint)0')|2]#!\nNe kadar sıkı bağlıyız ([concept_spec_market_tie]): #v x[Country.MakeScope.Var('spec_fh_tie').GetValueWithDefault('(CFixedPoint)0')|2]#!\nNe kadar önemliler ([concept_rank]): #v x[Country.MakeScope.Var('spec_fh_reach').GetValueWithDefault('(CFixedPoint)0')|2]#![AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_foreign_loss_mult'), '(CFixedPoint)1')), 'SPEC_FOREIGN_UNSTD')]"
 SPEC_FOREIGN_UNSTD: "\n[GetTechnology('currency_standards').GetName] olmadığı için: #v x[Country.MakeScope.ScriptValue('spec_foreign_loss_mult')|2]#!"
 SPEC_FOREIGN_FLIGHT: "\n[concept_spec_capital_flight] etkisinden [Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')|+=2]"
 SPEC_DRIVER_FOREIGN_TT: "#header Yabancı Panikler: [Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\nEn son: #v [Country.MakeScope.Var('spec_foreign_src').GetCountry.GetName]#!\n$TOOLTIP_DELIMITER$[AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_HIT')][AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_FLIGHT')]\n$TOOLTIP_DELIMITER$\n#title @spec_market_tie! [concept_spec_market_tie]#!\n#italic Bağlı bir ülkenin paniğinin her bağ türü üzerinden bize ne kadarının ulaştığı. Bunlar toplanmaz. Bir ayda birkaç panik ulaşırsa yalnızca en büyük darbe sayılır.#!\nOrtak [concept_market]: #v [Country.MakeScope.ScriptValue('spec_tie_market')|%0]#!\nEgemenlik altındaki ülke veya bağlı olunan ülke: #v %80#!\nYabancı yatırım hakları: #v [Country.MakeScope.ScriptValue('spec_tie_investment')|%0]#!\nPazarlar arası yoğun ticaret: #v [Country.MakeScope.ScriptValue('spec_tie_trade')|%0]#!\nEkonomimizdeki yabancı mülkiyet: en fazla #v %90#!\n$TOOLTIP_DELIMITER$\n#weak Bir [concept_great_power] paniği bizi tam olarak, bir Büyük Gücün paniği yarı yarıya, küçük bir ülkeninki ise çok az vurur. Yurt dışından bulaşan bir panik daha öteye yayılmaz.#!"
 SPEC_DRIVER_TURMOIL: "Savaş ve Huzursuzluk"
 SPEC_DRIVER_TURMOIL_TT: "#header Savaş ve Huzursuzluk: [Country.MakeScope.Var('spec_c_turmoil').GetValueWithDefault('(CFixedPoint)0')|+=2]#!$SPEC_ITEMS_TURMOIL$\n$TOOLTIP_DELIMITER$\nHer [concept_war] ([concept_spec_war_news]): ayda #N -3#! ile #P +0.15#! arası\nTüm savaşlar birlikte: ayda #N -4#! ile #P +0.5#! arası\nHenüz savaşa dönmemiş bir [concept_diplomatic_play]: ayda #N -0.5#!\nTükenen hazine: ayda en fazla #N -3#!, [concept_bankruptcy] öncesi #v 20#! haftadan itibaren\n[concept_default]: ayda #N -5#!\n[concept_revolution]: ayda #N -2#!\n\n#instruction Nedenlerini görmek için bir sayının üzerine gel#!"
 SPEC_DRIVER_MOOD: "Pazar Havası"
 SPEC_DRIVER_MOOD_TT: "#header $SPEC_DRIVER_MOOD$: [Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\nGeçen aydan devreden  [Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0'))|+=2]\n[SelectLocalization(Country.MakeScope.Var('spec_mood_random').IsSet, 'SPEC_MOOD_SOURCES', 'SPEC_MOOD_COMBINED')]"
 SPEC_MOOD_COMBINED: "Bu ayki değişim  [Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0')|+=2]"
 SPEC_MOOD_SOURCES: "Ölçeklendirilmiş rastgele dalgalanma  [Country.MakeScope.Var('spec_mood_random').GetValueWithDefault('(CFixedPoint)0')|+=2][AddLocalizationIf(GreaterThan_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_mood_random').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0'), 'SPEC_MOOD_COMPANY')]"
 SPEC_MOOD_COMPANY: "\nŞirket refahının etkisi  [Subtract_CFixedPoint(Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_mood_random').GetValueWithDefault('(CFixedPoint)0'))|+=2]"
 SPEC_DRIVER_DRIFT: "Normale Dönüş"
 SPEC_DRIVER_DRIFT_TT: "#header Normale Dönüş: [Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_baseline] düzeyinden (#v 55#!) ne kadar uzak olduğumuzdan [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0'), Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100'))|+=1]\nHer ay farkın #v x[Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100')|%1]#! kadarı kapanır\n$TOOLTIP_DELIMITER$\n#weak [GetTechnology('macroeconomics').GetName] bunu yarı yarıya hızlandırır#!"
 SPEC_DRIVER_TIGHT: "Sıkı Kredi"
 SPEC_DRIVER_GROWTH: "Büyüme"
 SPEC_DRIVER_GROWTH_TT: "#header Büyüme: [Country.MakeScope.Var('spec_c_growth').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\nSon aylara göre [concept_gdp] büyümesi: #v [Country.MakeScope.Var('spec_growth').GetValueWithDefault('(CFixedPoint)0')|=+%1]#!\n#v %2#! büyüme normal sayılır ve hiçbir şeyi değiştirmez\n$TOOLTIP_DELIMITER$\n#weak Normalden her #v %1#! hızlı veya yavaş büyüme için [concept_spec_market_confidence] ayda #v 0.1#! değişir, her iki yönde en fazla #v 0.6#!#!"
 SPEC_DRIVER_BUSINESS: "İş İklimi"
 SPEC_DRIVER_BUSINESS_TT: "#header İş İklimi: [Country.MakeScope.Var('spec_c_business').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\nSanayicilerin [concept_approval] düzeyi: #v [Country.MakeScope.ScriptValue('spec_ind_approval')|0]#!\n\nSadık (#v 10#! ve üzeri): ayda #P +0.4#!\nMemnun (#v 5#! ve üzeri): ayda #P +0.2#!\nMemnuniyetsiz (#v -5#! ve altı): ayda #N -0.2#!\nÖfkeli (#v -10#! ve altı): ayda #N -0.4#!"
 SPEC_DRIVER_TIGHT_TT: "#header Sıkı Kredi: [Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_market_confidence] değerinin #v 60#! üzerindeki kısmı: #v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.1')|1]#!\nBunun ayda #N -%10#! kadarı, [Concept('concept_spec_credit_policy','$concept_spec_credit_policy_tight|q$')] nedeniyle\n$TOOLTIP_DELIMITER$\n#weak Bir yükselişi bir anda değil, aylar içinde yavaşça soğutur#!"
 concept_spec_market_conditions: "Pazar Koşulları"
 concept_spec_market_conditions_desc: "@spec_market_conditions! $concept_spec_market_conditions$, bir [concept_spec_boom_end] geldiğinde pazarın ne kadar kızgın olduğudur. Bu sonun ne kadar [concept_spec_market_confidence] kaybettireceğini belirler. O anda $concept_spec_market_confidence$ ne kadar yüksekse kayıp o kadar büyük olur. #v 55#! düzeyinde etkileri yoktur. Mali Bölgeler, Konaklar ve finans teknolojileri de bunları değiştirir."
 concept_spec_baseline: "Temel Güven"
 concept_spec_baseline_desc: "@spec_baseline! Kendi haline bırakılırsa [concept_spec_market_confidence], yukarıdan ya da aşağıdan, $concept_spec_baseline$ değeri olan #v 55#! düzeyine geri döner. Ne kadar uzaklaşırsa o kadar hızlı döner."
 concept_spec_market_mood: "Pazar Havası"
 concept_spec_market_mood_desc: "@spec_market_mood! $concept_spec_market_mood$ önceki ayın değerinin yüzde #v 75#! kadarını korur. Her yeni rastgele dalgalanmanın büyüklüğü finans sistemine bağlıdır."
 concept_spec_market_tie: "Pazar Bağı"
 concept_spec_market_tie_desc: "@spec_market_tie! $concept_spec_market_tie$, bir [concept_country] için başka bir ülkenin [concept_market] gelişmelerini ne kadar yakından izlediğidir. Bir [concept_spec_financial_panic] durumunun ne kadarının aralarında geçeceğini belirler.\n\nMülkiyet, bir ülke diğerinin [concept_gdp] değerinin #v %10#! kadarına sahip olunca hesaba katılır ve #v %30#! düzeyinde en güçlüdür. [GetLawType('law_free_trade').GetName] ticaret bağını güçlendirir, diğer ticaret politikaları zayıflatır. [GetTechnology('international_exchange_standards').GetName] pazar ve yatırım bağlarını güçlendirir. Bir [concept_embargo] ticaret bağını keser."
 concept_spec_capital_flight: "Sermaye Kaçışı"
 concept_spec_capital_flight_desc: "@spec_capital_flight! Bir [concept_spec_financial_panic] başladığında para güvenli limana kaçar. Her [concept_great_power] ve [concept_spec_exchange] kurumu #v Uluslararası#! veya daha yüksek olan her [concept_country], barış içindeyse, #v Dengeli#! veya daha iyi durumdaysa ve panikteki ülkeyle bağı yoksa en fazla #P +[GetPlayer.MakeScope.ScriptValue('spec_flight_gain_max')|0]#! [concept_spec_market_confidence] kazanır. [GetTechnology('international_trade').GetName] ve [GetTechnology('international_exchange_standards').GetName] kazancı artırır. Bir [concept_spec_exchange] ne kadar yüksekte durursa o kadar çok pay alır."
 concept_spec_war_news: "Savaş Haberleri"
 concept_spec_war_news_desc: "@spec_war_news! Yatırımcılar her [concept_war] ayı ayına izler. $concept_spec_war_news$, savaşın gidişatına göre [concept_spec_market_confidence] değerini her ay değiştirir: [concept_casualties], [concept_blockade], [concept_devastation], düşen [concept_gdp] ve uzun savaş değeri düşürür; kazanılan [Concept('concept_battle','$concept_battles|q$')] ve düşman topraklarını elde tutmak yükseltir. Her savaş değeri ayda #N -3#! ile #P +0.15#! arasında, tüm savaşlar birlikte #N -4#! ile #P +0.5#! arasında değiştirir."
