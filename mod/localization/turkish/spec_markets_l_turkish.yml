 SPEC_RIVAL_RULE: "#italic [concept_spec_exchange] kurumumuz güvenilirlik için mücadele edeceği başka Borsalar seçebilir.#!\n\nHer yarışçının bakımı #N 25#! ile #N 150#! nüfuz tutar. Konum yükseldikçe daha pahalıdır\nEn düşük Konumda #v 1#! yarışçı seçebiliriz, üstündeki her Konum için bir fazla (en fazla #v 4#!)\nBir yarışçı ilk yılında bırakılamaz\nBu, diplomatik rekabetlerden ayrıdır\n\n#b Yarış#!\nHer yarış başladığı andan itibaren #v 5#! yıl sürer, sonra halat çekme gibi sonuçlanır ve yenisi başlar\nÇubuk iki tarafın [Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')] puanından başlar\n#N İlkinden sonraki her yarış bizi fazla dağıtır#! ve hepsindeki puanımızı zayıflatır (#v 2#! yarış: #N %80#!, #v 4#!: #N %57.1#!)\nHer [concept_spec_blue_chip] çubuğu kendi tarafına #v %3#! çeker (#v 5#! tanesine kadar tam, #v 10#! tanesine kadar yarım)\nİşe yarayan her eylem onu kendi tarafına #v %10#! iter, her taraf için en fazla #v 5#! itiş\nOrtaya yakınsa berabere\n\n#b Kazanmak#!\nBir #P zaferden#! sonra kaybeden #P %5#! güvenilirlik verir\n#P Kesin Zafer#! ≥ #v 75%#! · Güven #P 10%#!. Sermaye uygunsa: #P 5%#! [concept_investment_pool] → biz (12 ay). Aksi halde mevcut aktarım sürer.\nDaha yüksek Konumlu bir Borsayı yenmek daha çok kazandırır. Daha alçağı yenmek daha az kazandırır\n[concept_relations] Kötü veya daha kötüyse kaybeden #N x1.5#! kaybeder\n\n#b Eylemler#!\nYarıştığımız Borsalara ve bizimle yarışan Borsalara karşı kullanabiliriz\nPiyasayı Destekle: #v 2#! yıl. Diğer eylemler her rakibe karşı yılda bir kullanılabilir.\nDaha büyük bir Borsaya karşı daha pahalıdır ve daha az etki eder (#v x0.75#! ile #v x1.33#! arası)\nBir [concept_spec_financial_panic] sırasında kaçan para önce bir yarışçıya gider"
