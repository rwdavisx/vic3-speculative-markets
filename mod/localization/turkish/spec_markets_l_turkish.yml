 SPEC_DRIVER_RIVAL: "Yarışçı Eylemleri"
 SPEC_DRIVER_RIVAL_TT: "#header Yarışçı Eylemleri: [Country.MakeScope.Var('spec_c_rival').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#italic Bir yarışçının pazarımıza yaptığı Ayı Baskını, altı aya yayılır.#!\n#instruction Kaç baskın gelirse gelsin, yılda en fazla #v 4#! güvene mal olabilir.#!"
 spec_rival.1.d11_big: "Büyük #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! Borsası sonunda bizi fark etti ve gördüklerinden hiç hoşlanmadı.\n\nAçılış zilinden önce #v [SCOPE.sCountry('target').GetName]#! adına çalışan borsacılar demiryolu ve banka hisselerimizden büyük blokları bir anda salona attı. Fiyatlar kırıldı, teleksler geride kaldı ve öğlene kadar kendi kâtiplerimiz bile korkuyla satış yapıyordu.\n\n[concept_spec_market_confidence] değerimiz 6 ay içinde en fazla #N [SCOPE.GetValue('spec_rv_event_amount')|2]#! düşecek."
 spec_rival.1.d11_even: "Yıllardır #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! ve #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! borsaları birbirinin etrafında dolanıyor. Bu yalnızca bir zaman meselesiydi.\n\nAçılış zilinden önce #v [SCOPE.sCountry('target').GetName]#! adına çalışan borsacılar demiryolu ve banka hisselerimizden büyük blokları bir anda salona attı. Fiyatlar kırıldı, teleksler geride kaldı ve öğlene kadar kendi kâtiplerimiz bile korkuyla satış yapıyordu.\n\n[concept_spec_market_confidence] değerimiz 6 ay içinde en fazla #N [SCOPE.GetValue('spec_rv_event_amount')|2]#! düşecek."
 spec_rival.1.d11_small: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! borsasının sonradan görmeleri, #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! borsasına haddini bildirmeye karar verdi.\n\nAçılış zilinden önce #v [SCOPE.sCountry('target').GetName]#! adına çalışan borsacılar demiryolu ve banka hisselerimizden büyük blokları bir anda salona attı. Fiyatlar kırıldı, teleksler geride kaldı ve öğlene kadar kendi kâtiplerimiz bile korkuyla satış yapıyordu.\n\n[concept_spec_market_confidence] değerimiz 6 ay içinde en fazla #N [SCOPE.GetValue('spec_rv_event_amount')|2]#! düşecek."
 spec_rival.1.d10_big: "Büyük #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! Borsası sonunda bizi fark etti ve gördüklerinden hiç hoşlanmadı.\n\n#v [SCOPE.sCountry('target').GetName]#! adına çalışan borsacılar, bir bozgun bekleyerek hisselerimizi bir anda salona boşalttı. Oysa bankalarımız sunulan her lotu satın aldı, fiyatlar dayandı ve kapanış zili çaldığında yaralarını saran baskıncılar oldu.\n\nOnların kendi [concept_spec_market_confidence] değeri 6 ay içinde en fazla #P [SCOPE.GetValue('spec_rv_event_amount')|2]#! düşer."
 spec_rival.1.d10_even: "Yıllardır #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! ve #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! borsaları birbirinin etrafında dolanıyor. Bu yalnızca bir zaman meselesiydi.\n\n#v [SCOPE.sCountry('target').GetName]#! adına çalışan borsacılar, bir bozgun bekleyerek hisselerimizi bir anda salona boşalttı. Oysa bankalarımız sunulan her lotu satın aldı, fiyatlar dayandı ve kapanış zili çaldığında yaralarını saran baskıncılar oldu.\n\nOnların kendi [concept_spec_market_confidence] değeri 6 ay içinde en fazla #P [SCOPE.GetValue('spec_rv_event_amount')|2]#! düşer."
 spec_rival.1.d10_small: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! borsasının sonradan görmeleri, #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! borsasına haddini bildirmeye karar verdi.\n\n#v [SCOPE.sCountry('target').GetName]#! adına çalışan borsacılar, bir bozgun bekleyerek hisselerimizi bir anda salona boşalttı. Oysa bankalarımız sunulan her lotu satın aldı, fiyatlar dayandı ve kapanış zili çaldığında yaralarını saran baskıncılar oldu.\n\nOnların kendi [concept_spec_market_confidence] değeri 6 ay içinde en fazla #P [SCOPE.GetValue('spec_rv_event_amount')|2]#! düşer."
 spec_rival.1.d21_big: "Büyük #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! Borsası sonunda bizi fark etti ve gördüklerinden hiç hoşlanmadı.\n\n#v [SCOPE.sCountry('target').GetName]#! ajanları en iyi otellerimizde oda tuttu ve en büyük yatırımcılarımız her akşam onlarla yemek yiyor. Teklifleri basit. Daha iyi bir faiz, daha güvenli bir liman ve hiçbir rahatsız edici soru yok.\n\n12 ay boyunca [concept_investment_pool] gelirimizin #N [GetPlayer.MakeScope.Var('spec_rv_lure_share').GetValue|%0]#! kadarı onlara gider."
 spec_rival.1.d21_even: "Yıllardır #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! ve #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! borsaları birbirinin etrafında dolanıyor. Bu yalnızca bir zaman meselesiydi.\n\n#v [SCOPE.sCountry('target').GetName]#! ajanları en iyi otellerimizde oda tuttu ve en büyük yatırımcılarımız her akşam onlarla yemek yiyor. Teklifleri basit. Daha iyi bir faiz, daha güvenli bir liman ve hiçbir rahatsız edici soru yok.\n\n12 ay boyunca [concept_investment_pool] gelirimizin #N [GetPlayer.MakeScope.Var('spec_rv_lure_share').GetValue|%0]#! kadarı onlara gider."
 spec_rival.1.d21_small: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! borsasının sonradan görmeleri, #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! borsasına haddini bildirmeye karar verdi.\n\n#v [SCOPE.sCountry('target').GetName]#! ajanları en iyi otellerimizde oda tuttu ve en büyük yatırımcılarımız her akşam onlarla yemek yiyor. Teklifleri basit. Daha iyi bir faiz, daha güvenli bir liman ve hiçbir rahatsız edici soru yok.\n\n12 ay boyunca [concept_investment_pool] gelirimizin #N [GetPlayer.MakeScope.Var('spec_rv_lure_share').GetValue|%0]#! kadarı onlara gider."
 spec_rival.1.d31_big: "Büyük #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! Borsası sonunda bizi fark etti ve gördüklerinden hiç hoşlanmadı.\n\n#v [SCOPE.sCountry('target').GetName]#! sabah gazeteleri, #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! şehrindeki sahte bilançolar ve sallanan bankalar hakkında uzun sütunlar yayımlıyor. Hiçbiri imzalı değil ve azı doğru, ama kıtadaki her yazıhanede okunuyorlar.\n\n[concept_spec_exchange] kurumumuz #N [Divide_CFixedPoint(SCOPE.GetValue('spec_rv_event_amount'), '(CFixedPoint)120')|%2]#! güvenilirlik kaybeder."
 spec_rival.1.d31_even: "Yıllardır #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! ve #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! borsaları birbirinin etrafında dolanıyor. Bu yalnızca bir zaman meselesiydi.\n\n#v [SCOPE.sCountry('target').GetName]#! sabah gazeteleri, #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! şehrindeki sahte bilançolar ve sallanan bankalar hakkında uzun sütunlar yayımlıyor. Hiçbiri imzalı değil ve azı doğru, ama kıtadaki her yazıhanede okunuyorlar.\n\n[concept_spec_exchange] kurumumuz #N [Divide_CFixedPoint(SCOPE.GetValue('spec_rv_event_amount'), '(CFixedPoint)120')|%2]#! güvenilirlik kaybeder."
 spec_rival.1.d31_small: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! borsasının sonradan görmeleri, #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! borsasına haddini bildirmeye karar verdi.\n\n#v [SCOPE.sCountry('target').GetName]#! sabah gazeteleri, #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! şehrindeki sahte bilançolar ve sallanan bankalar hakkında uzun sütunlar yayımlıyor. Hiçbiri imzalı değil ve azı doğru, ama kıtadaki her yazıhanede okunuyorlar.\n\n[concept_spec_exchange] kurumumuz #N [Divide_CFixedPoint(SCOPE.GetValue('spec_rv_event_amount'), '(CFixedPoint)120')|%2]#! güvenilirlik kaybeder."
 spec_rival.1.d3n_big: "Büyük #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! Borsası sonunda bizi fark etti ve gördüklerinden hiç hoşlanmadı.\n\n#v [SCOPE.sCountry('target').GetName]#! gazeteleri [concept_spec_exchange] kurumumuz hakkındaki şüphelerle doluydu. Ama bir kâtip konuştu ve artık herkes mürekkebin kimin parasıyla ödendiğini biliyor.\n\nGüvenilirlik kaybediyoruz, ama onlar da kaybediyor ve yurt dışında adları zarar görüyor."
 spec_rival.1.d3n_even: "Yıllardır #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! ve #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! borsaları birbirinin etrafında dolanıyor. Bu yalnızca bir zaman meselesiydi.\n\n#v [SCOPE.sCountry('target').GetName]#! gazeteleri [concept_spec_exchange] kurumumuz hakkındaki şüphelerle doluydu. Ama bir kâtip konuştu ve artık herkes mürekkebin kimin parasıyla ödendiğini biliyor.\n\nGüvenilirlik kaybediyoruz, ama onlar da kaybediyor ve yurt dışında adları zarar görüyor."
 spec_rival.1.d3n_small: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! borsasının sonradan görmeleri, #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! borsasına haddini bildirmeye karar verdi.\n\n#v [SCOPE.sCountry('target').GetName]#! gazeteleri [concept_spec_exchange] kurumumuz hakkındaki şüphelerle doluydu. Ama bir kâtip konuştu ve artık herkes mürekkebin kimin parasıyla ödendiğini biliyor.\n\nGüvenilirlik kaybediyoruz, ama onlar da kaybediyor ve yurt dışında adları zarar görüyor."
