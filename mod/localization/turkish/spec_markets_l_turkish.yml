 SPEC_PLEDGE_OUT_TT: "#header $SPEC_PLEDGE_OUT$#!\n$TOOLTIP_DELIMITER$\nTaahhüdü bitirmek için #v 24#! aylık bildirim süresini başlatır. Süre dolana kadar Taahhüt geçerlidir ve her panik yine kurtarılır.\n\n#b Bitirdiğimiz Taahhüt#!\n#italic Devlet, bankaların başı her sıkıştığında onları kurtaracağına söz verir.#!\n\n[concept_treasury] rezervlerden ödeyebildiği ve [concept_default] durumunda olmadığımız sürece #P her#! [concept_spec_financial_panic] hemen ve #P %25#! daha ucuza kurtarılır\nPanikte [concept_spec_exchange] kurumumuzun kaybettiği güvenilirlik: #P -%50#!\nGelen [concept_spec_capital_flight]: #P +%50#!\n#N Her kurtarma#! Kredi Standartlarını gevşetir\n$TOOLTIP_DELIMITER$\n[concept_default] durumuna #N düşersek#! Taahhüt bozulur ve tüm güvenilirlik kaybedilir. #v 5#! yıl boyunca [concept_spec_market_confidence] #N -15#!, [concept_legitimacy] #N -10#!\n#weak Taahhüdü geri çekmek için#! #v 24#! #weak ay önceden bildirim gerekir#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_pledge_leave').IsValid(GuiScope.SetRoot(Country.MakeScope).End)), 'SPEC_PLEDGE_PLEDGE_LEAVE_WHY')]"
