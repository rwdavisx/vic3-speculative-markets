 SPEC_H_COMPANIES: "Şirketler"
 SPEC_H_COMPANIES_TT: "#header $concept_companies$#!\n$TOOLTIP_DELIMITER$\n#italic Pazarın bir mala bakışı, onu üreten binaları nasıl etkiler.#!\n\n[concept_spec_investor_interest] yüksekken binaları #P daha fazla#! [concept_throughput] alır\nİlgi düşükken #N daha az#! alırlar\nYükselişi bittikten sonra toparlanana kadar #N daha da az#! alırlar\nBir [concept_company], insanlar mallarını isterken daha çok kazanır"
 SPEC_H_COMPANIES_RIGHT: "[GetDataModelSize(Country.GetCompanies)]  @spec_blue_chip! #v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!"
 SPEC_H_COMPANIES_RIGHT_TT: "#header @spec_company_strength! [concept_spec_company_strength]: #v [Country.MakeScope.ScriptValue('spec_log_kstr')|1]#!#!\n$TOOLTIP_DELIMITER$\n#italic Büyük Şirketlerin Yuvası için puanımız.#!\n\n#b Nereden gelir#!\nTüm $concept_companies$ için [concept_prosperity] değerlerini toplarız ve her #v 20#! puan #v 1#! ekler\n[Concept('concept_spec_blue_chip','$concept_spec_blue_chips|q$')]: #v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!, her biri #v 2#! daha ekler\n#grey Daha çok şirkete sahip olmak yalnızca getirileri sayesinde işe yarar#!"
 SPEC_CO_BC: "#P [concept_spec_blue_chip]#!, [concept_spec_company_strength] değerimize #v 2#! ekler ve $concept_spec_blue_chips$ sayımıza dahil olur"
 SPEC_CO_BC_LOW: "  #N Geriliyor#!, son #v 3#! ayın #v [Company.MakeScope.Var('spec_bc_low').GetValue|0]#! ayında #v 70#! [concept_prosperity] altında. #v 3#! olunca statüsünü kaybeder"
 SPEC_CO_BC_CLIMB: "#v [Company.MakeScope.ScriptValue('spec_bc_updates_left')|0]#! ay daha #v 70#! veya daha fazla [concept_prosperity] düzeyinde kalırsa [concept_spec_blue_chip] olur"
 SPEC_CO_COTY: "#P Yılın Şirketi#!, dünyanın en müreffeh [concept_spec_blue_chip]"
 SPEC_CO_PROPPED: "  [concept_prosperity] ne olursa olsun statüsünü şimdilik korumak için destekleniyor[AddLocalizationIf(GreaterThan_CFixedPoint(Company.MakeScope.Var('spec_bc_propped').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_CO_PROPPED_END')]"
 SPEC_CO_FRAGILE: "  #N Kırılgan#!, bu yüzden #v 70#! [concept_prosperity] altında geçen tek bir ay statüyü kaybettirir[AddLocalizationIf(GreaterThan_CFixedPoint(Company.MakeScope.Var('spec_bc_fragile').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_CO_FRAGILE_END')]"
 SPEC_CO_PROPPED_END: " · [TimeKeeper.GetCurrentDateWithDiff(FixedPointToInt(Subtract_CFixedPoint(Company.MakeScope.Var('spec_bc_propped').GetValueWithDefault('(CFixedPoint)0'), Company.MakeScope.ScriptValue('spec_calendar_day'))))]"
 SPEC_CO_FRAGILE_END: " · [TimeKeeper.GetCurrentDateWithDiff(FixedPointToInt(Subtract_CFixedPoint(Company.MakeScope.Var('spec_bc_fragile').GetValueWithDefault('(CFixedPoint)0'), Company.MakeScope.ScriptValue('spec_calendar_day'))))]"
 SPEC_CO_NONE: "#low Şirketimiz yok#!"
 SPEC_BC_STRIP: "Birinci Sınıf Hisseler"
 SPEC_BC_STRIP_N: "Elimizde #v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!"
 SPEC_BC_STRIP_FX: "Çöküş kalkanı #P %[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)4.0')|0]#!\nYarış çekişi #P +%[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)3.0')|0]#!\nGüvenilirlik yılda #P +%[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.417')|1]#!"
 SPEC_BC_STRIP_TT: "#header $concept_spec_blue_chips$: #v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!#!\n$TOOLTIP_DELIMITER$\n#italic En istikrarlı, en müreffeh şirketlerimiz.#!\n\nBir şirket, #v 12#! ay üst üste #v 70#! veya daha fazla [concept_prosperity] düzeyinde kalınca bu sınıfa girer\n\n#b Bize kazandırdıkları#!\nÇöküşler ve paniklerde kaybedilen [concept_spec_market_confidence]: #P -%[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)4.0')|0]#! #grey (her biri -%4)#!\n[concept_spec_exchange] güvenilirliği: yılda tam çubuğun #P +%[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.4167')|1]#! kadarı #grey (her biri +%0.4)#!\n[concept_spec_exchange] yarışları: bizim lehimize #P +%[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)3.0')|0]#! #grey (her biri +%3)#!\nKapitalistlerin [concept_investment_pool] katkısı: #P +%[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.6')|1]#! #grey (her biri +%0.6)#!\nKredi faizi: #P -%[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)1.0')|0]#! #grey (her biri -%1)#!\n#grey İlk 5 tanesi tam, sonraki 5 tanesi yarım sayılır. Her biri ayrıca Büyük Şirketlerin Yuvası puanımız olan [concept_spec_company_strength] değerine #v 2#! ekler#!\n$TOOLTIP_DELIMITER$\n#b Birini kaybedersek#!\n#v 3#! ay üst üste #v 70#! [concept_prosperity] altında kalınca olur\n[concept_spec_exchange] güvenilirliği: tam çubuğun #N -%1.7#! kadarı\n[concept_spec_market_confidence]: #N -3#!\nBize isabet eden bir Ayı Baskını, birini bir yıl boyunca #N Kırılgan#! yapar. O sürede #v 3#! yerine #v 70#! [concept_prosperity] altında geçen tek bir ay statüsünü kaybettirir\n\n#b Yılın Şirketi#!\nBizimki dünyanın en müreffeh şirketiyse [concept_spec_exchange] güvenilirliği tam çubuğun #P +%2.5#! kadarı artar ve bir yıl boyunca [concept_prestige] #P +%5#! kazanırız"
