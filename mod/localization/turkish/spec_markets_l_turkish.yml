 SPEC_LEVERS_TT: "#header Pazar Müdahaleleri#!\n$TOOLTIP_DELIMITER$\n#italic Hükümetimizin pazarı soğuttuğu veya ısıttığı mallar.#!\n\nAyda #N -[Country.MakeScope.ScriptValue('spec_lever_authority')|0]#! [concept_authority] harcar\nDizginlenen: #v [Country.MakeScope.ScriptValue('spec_n_restrain')|0]#!\nTeşvik edilen: #v [Country.MakeScope.ScriptValue('spec_n_encourage')|0]#!\n[concept_budget_additional_income]: haftada #P @money![Country.MakeScope.ScriptValue('spec_lever_levy')|D]#!\n[concept_budget_additional_expenses]: haftada #N @money![Country.MakeScope.ScriptValue('spec_lever_spend')|D]#!"
 spec_story.1.t: "[ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName] Pazarı Çöküyor"
 spec_story.1.t_generic: "Bir Pazar Çöküyor"
 spec_story.1.d: "[ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName] hücumu sona erdi. Bir yıldır yükselen fiyatlar bir ayda düştü. Çılgınlığın doruğunda halka açılan şirketler borçlarını ödeyemiyor. Fiyatına bakmadan mal alan tüccarlar boşaltamadıkları depolarla baş başa kaldı. Stokları karşılığında kredi veren bankalar ise zararlarını hesaplıyor."
 spec_story.1.d_generic: "Mevsimin gözde mallarına hücum sona erdi. Bir yıldır yükselen fiyatlar bir ayda düştü. Çılgınlığın doruğunda halka açılan şirketler borçlarını ödeyemiyor. Fiyatına bakmadan mal alan tüccarlar boşaltamadıkları depolarla baş başa kaldı. Stokları karşılığında kredi veren bankalar ise zararlarını hesaplıyor."
 spec_story.1.f: "“Otuz yıldır [ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName] ticaretindeyim. Bu son on iki ayda gördüğüm kadar almaya hevesli, satmaya çaresizce muhtaç insanı ömrümde görmedim.”"
 spec_story.1.f_generic: "“Otuz yıldır bu ticaretin içindeyim. Bu son on iki ayda gördüğüm kadar almaya hevesli, satmaya çaresizce muhtaç insanı ömrümde görmedim.”"
 spec_story.1.a: "Yıkıma uğrayan üreticilere yardım ulaştır."
 spec_story.1.b: "En zayıf firmalar batsın."
 spec_story.1.c: "Şirket kurucularını soruştur."
 spec_story.2.t: "Dolandırıcılık Ortaya Çıktı"
 spec_story.2.d: "[ROOT.GetCountry.GetCapital.GetCityHubName] [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] Şirketi müdürleri ülkeden kaçtı. Defterler, son iki yılın cömert temettülerinin yeni hissedarların parasıyla ödendiğini gösteriyor. Binlerce kâtip, dul kadın ve esnaf bu şirketin hisselerini tutuyordu. [ROOT.GetCountry.GetCapital.GetCityHubName] basınının tamamı şimdi daha kaç izahnamenin aynı kalemden çıktığını soruyor."
 spec_story.2.d_generic: "[ROOT.GetCountry.GetCapital.GetCityHubName] şehrindeki meşhur bir anonim şirketin müdürleri ülkeden kaçtı. Defterler, son iki yılın cömert temettülerinin yeni hissedarların parasıyla ödendiğini gösteriyor. Binlerce kâtip, dul kadın ve esnaf bu şirketin hisselerini tutuyordu. [ROOT.GetCountry.GetCapital.GetCityHubName] basınının tamamı şimdi daha kaç izahnamenin aynı kalemden çıktığını soruyor."
 spec_story.2.f: "#bold Dolandırıcılık Suçlamasıyla Aranıyor#!\n[ROOT.GetCountry.GetCapital.GetCityHubName] [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] Şirketi genel müdürü. Elli yaşlarında, iyi giyimli, tavırları güven telkin eden bir şahıs. En son rıhtımda görüldü."
 spec_story.2.f_generic: "#bold Dolandırıcılık Suçlamasıyla Aranıyor#!\n[ROOT.GetCountry.GetCapital.GetCityHubName] şehrindeki bir anonim şirketin genel müdürü. Elli yaşlarında, iyi giyimli, tavırları güven telkin eden bir şahıs. En son rıhtımda görüldü."
 spec_story.2.a: "Müdürleri yargıla."
 spec_story.2.b: "Meseleyi örtbas et."
 spec_story.2.c: "Küçük yatırımcıların zararını karşıla."
 spec_story.3.t: "Bankalara Hücum"
 spec_story.3.d: "Mevduat sahipleri bu sabah [ROOT.GetCountry.GetCapital.GetCityHubName] şehrinin en eski bankalarından birini kuşattı. Öğleye kalmadan kapıları kapandı. Banknotları şehrin hiçbir yerinde kabul edilmiyor. Hesaplarını orada tutan firmalar bu hafta işçilerinin ücretlerini ödeyemiyor. Diğer bütün bankaların önündeki kuyruklar her saat uzuyor."
 spec_story.3.f: "“Babam birikimini o bankada tutardı, ondan önce dedem de öyle. Hazine kadar güvenli olduğunu söylemişlerdi.”"
 spec_story.3.a: "Mevduatlarını güvence altına al."
 spec_story.3.b: "Kendi başına ayakta kalmalı ya da batmalı."
 spec_story.3.c: "Bankalara borç vermeliyiz."
 spec_story.4.t: "[ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]: Panik"
 spec_story.4.t_generic: "Dışarıda Panik"
 spec_story.4.d: "[ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] ülkesinde başlayan [concept_spec_financial_panic] haberi [ROOT.GetCountry.GetCapital.GetCityHubName] şehrine ulaştı. Oradaki bankalar yurt dışındaki kredilerini geri çağırıyor. [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] pazarına mal satan veya oradan borçlanan firmalarımız bir anda parasız kaldı. Borsadaki her tüccar bu derdin yayılıp yayılmayacağını öğrenmek istiyor."
 spec_story.4.d_generic: "Yurt dışında başlayan bir mali paniğin haberi [ROOT.GetCountry.GetCapital.GetCityHubName] şehrine ulaştı. Yabancı bankalar kredilerini geri çağırıyor. Denizaşırı pazarlara mal satan veya oralardan borçlanan firmalarımız bir anda parasız kaldı. Borsadaki her tüccar bu derdin yayılıp yayılmayacağını öğrenmek istiyor."
 spec_story.4.f: "“[ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] hapşırınca bizim borsa yatağa düşer.”"
 spec_story.4.f_generic: "“Komşularımız hapşırınca bizim borsa yatağa düşer.”"
 spec_story.4.a: "Ticarethanelerimize kredi ver."
 spec_story.4.b: "Onların derdi bizi ilgilendirmez."
 spec_story.4.c: "Pervasız yabancı bankacıları suçla."
 spec_story.5.t: "Güven Dönüyor"
 spec_story.5.d: "Paniğin en kötü günleri geride kaldı. Ayakta kalan firmalar yeniden işçi alıyor, bankalar sağlam müşterilere kredi vermeye başladı. Birkaç cesur yatırımcı geçen yılki fiyatların çok altında hisse alıyor. Kimse eski aşırılıklara çabucak dönülmesini beklemiyor ama [ROOT.GetCountry.GetCapital.GetCityHubName] yeniden iş başında."
 spec_story.5.f: "“İlkbaharda her şeyini satanlar sonbaharda hepsini geri alıyor, hem de sattıklarından daha ucuza.”"
 spec_story.5.a: "Yeni girişimleri teşvik et."
 spec_story.5.b: "Bu kez krediler sağlam olmalı."
 spec_story.6.t: "İmalatçılar Heyeti"
 spec_story.6.d: "İmalatçılar ve tüccarlardan oluşan bir heyet hükümetin huzuruna çıktı. Söylediklerine göre kredi yokluğundan yeni tesisleri yarım kalmış, yurt dışındaki rakipleri ise rahatça borçlanıp pazarlarını ele geçiriyormuş. Bankaların yeniden kredi vermesine izin verilmesini istiyorlar."
 spec_story.6.f: "“İhtiyatınız bizi çöküşten kurtardı efendim. Çökecek hiçbir şey bırakmayarak.”"
 spec_story.6.a: "Krediyi gevşet."
 spec_story.6.b: "Kredi sıkı kalacak."
 spec_story.6.c: "Bunun yerine sübvansiyon teklif et."
 spec_story.7.t: "Hisse Çılgınlığı"
 spec_story.7.d: "Kâtipler, esnaf ve muallimler hiç görmedikleri şirketlerin hisselerini alıp satmak için [ROOT.GetCountry.GetCapital.GetCityHubName] kahvehanelerini dolduruyor. [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] girişimlerinin hisseleri günde birkaç kez el değiştiriyor; çoğu borç parayla alınıyor. Hizmetçilerin bir sonraki halka arzdan pay almak için bayramlık giysilerini rehine verdiği söyleniyor."
 spec_story.7.d_generic: "Kâtipler, esnaf ve muallimler hiç görmedikleri şirketlerin hisselerini alıp satmak için [ROOT.GetCountry.GetCapital.GetCityHubName] kahvehanelerini dolduruyor. En yeni girişimlerin hisseleri günde birkaç kez el değiştiriyor; çoğu borç parayla alınıyor. Hizmetçilerin bir sonraki halka arzdan pay almak için bayramlık giysilerini rehine verdiği söyleniyor."
 spec_story.7.f: "“Berberim bu sabah [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] hisseleri hakkında bir tüyo verdi. Aldım, karşılığında ben de ona bir tüyo verdim: sat.”"
 spec_story.7.f_generic: "“Berberim bu sabah hisseler hakkında bir tüyo verdi. Aldım, karşılığında ben de ona bir tüyo verdim: sat.”"
 spec_story.7.a: "Halk da servetten pay alsın."
 spec_story.7.b: "Borç parayla alım satımı yasakla."
 spec_story.7.c: "Hisse devirlerine damga vergisi koy."
 spec_story.8.t: "Balon Uyarıları"
 spec_story.8.d: "Saygın bir iktisatçı, [ROOT.GetCountry.GetCapital.GetCityHubName] basınının önde gelen gazetesine yazdığı mektupta [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] ve [ROOT.GetCountry.MakeScope.Var('spec_story_good2').GetGoods.GetName] fiyatlarındaki yükselişin süremeyeceğini, bankaların aklı başında kimsenin ödemeyeceği fiyatları teminat sayarak kredi verdiğini belirtti. Borsacılar bunu ihtiyar bir kadının söylenmesine benzetiyor. Yine de mektup şehrin her kulübünde ve ticarethanesinde yüksek sesle okunuyor."
 spec_story.8.d_generic: "Saygın bir iktisatçı, [ROOT.GetCountry.GetCapital.GetCityHubName] basınının önde gelen gazetesine yazdığı mektupta günün gözde mallarındaki fiyat artışının süremeyeceğini, bankaların aklı başında kimsenin ödemeyeceği fiyatları teminat sayarak kredi verdiğini belirtti. Borsacılar bunu ihtiyar bir kadının söylenmesine benzetiyor. Yine de mektup şehrin her kulübünde ve ticarethanesinde yüksek sesle okunuyor."
 spec_story.8.f: "“Fiyat dediğiniz, son alıcının ödemeye razı olduğu meblağdan ibarettir. Okurlarımdan geriye kaç alıcı kaldığını düşünmelerini rica ederim.”"
 spec_story.8.a: "Uyarı tam vaktinde geldi."
 spec_story.8.b: "Boş yere korku salıyor."
