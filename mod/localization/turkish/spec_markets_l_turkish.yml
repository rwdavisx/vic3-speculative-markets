 SPEC_CO_RES: "  Spekülasyonu Dizginle: [concept_throughput] #N -%10#!"
 SPEC_CO_GLUT: "  @warning! #N [Goods.GetName] Toparlanıyor#!: #v [Select_CFixedPoint(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), '(CFixedPoint)3', Select_CFixedPoint(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), '(CFixedPoint)6', Select_CFixedPoint(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), '(CFixedPoint)12', '(CFixedPoint)0')))|0]#! ay boyunca [concept_throughput] #N [Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_company_tie'), Select_CFixedPoint(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), '(CFixedPoint)-0.025', Select_CFixedPoint(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), '(CFixedPoint)-0.05', Select_CFixedPoint(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), '(CFixedPoint)-0.1', '(CFixedPoint)0'))))|%0]#!"
