 SPEC_EFFECT_EXCH_TT: "#header $SPEC_EFFECT_EXCH$#!\n[concept_spec_exchange] Konumu: $SPEC_EFFECT_EXCH_VALUE$\n$TOOLTIP_DELIMITER$\n[Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')] puanı: #v [Country.MakeScope.Var('spec_centre_score').GetValueWithDefault('(CFixedPoint)0')|0]#!\nGüvenilirlik: #v $SPEC_EXCH_TRUST$#!\nBorsa İmtiyazı: #v [SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_exch_known').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.5'), 'SPEC_EXCH_KNOWN_0', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_exch_known').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1.5'), 'SPEC_EXCH_KNOWN_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_exch_known').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2.5'), 'SPEC_EXCH_KNOWN_2', 'SPEC_EXCH_KNOWN_3')))]#!\n$TOOLTIP_DELIMITER$\nYükselen fiyatlara Yatırımcı Tepkisi: normale göre #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_hype'), '(CFixedPoint)1')|+%0]#! (daha yüksekse yükselişler daha hızlı oluşur)\n[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1.5'), 'SPEC_EXCH_FX_FLIGHT', 'SPEC_EXCH_FX_FLIGHT_GP')][AddLocalizationIf(And(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.5'), Not(Country.MakeScope.Var('spec_centre_rank').IsSet)), 'SPEC_EXCH_FX_PRESTIGE')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_loss'), '(CFixedPoint)1')), 'SPEC_EXCH_FX_LOSS')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_credit'), '(CFixedPoint)1')), 'SPEC_EXCH_FX_CREDIT')]\nGüvenilirliğe göre [concept_spec_market_mood] dalgalanması: #v x[Country.MakeScope.ScriptValue('spec_exch_mood')|2]#! (#v x1#! altı daha sakin, üstü daha çılgın)\nGüvenilirliğe göre [concept_spec_market_confidence] t