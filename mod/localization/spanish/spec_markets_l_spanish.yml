 SPEC_TIER_PANIC_TT: "#header Conmoción#!\nPor debajo de #v 20#!\n$TOOLTIP_DELIMITER$\n#italic Los inversores tienen miedo.#!\n$SPEC_INVEST_PANIC$\n\nUn [concept_spec_financial_panic] empieza por debajo de #v [Country.MakeScope.ScriptValue('spec_panic_at')|0]#! y reduce a la mitad la [concept_private_construction] durante hasta #v [Country.MakeScope.ScriptValue('spec_panic_months_trust')|0]#! meses\n#weak Tras un pánico, no puede empezar otro en #v 12#! meses#!"
