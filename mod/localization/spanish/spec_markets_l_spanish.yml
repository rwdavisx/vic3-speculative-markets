 SPEC_TM_PLAY_TT: "#header [concept_diplomatic_play]: [Country.MakeScope.Var('spec_tm_play').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#N -0.5#! por estar en una [concept_diplomatic_play]\n$TOOLTIP_DELIMITER$\n#weak Cuenta una vez, haya las jugadas que haya, hasta que empieza una [concept_war]#!"
 SPEC_TM_BROKE_TT: "#header Tesoro casi vacío: [Country.MakeScope.Var('spec_tm_broke').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#v [Country.MakeScope.ScriptValue('spec_broke_weeks')|0]#! semanas hasta la [concept_bankruptcy] si seguimos perdiendo dinero así\n$TOOLTIP_DELIMITER$\n#weak Empieza #v 20#! semanas antes de la $concept_bankruptcy$ y crece hasta #N -3#! a medida que el [concept_treasury] se vacía#!"
 SPEC_TM_DEFAULT_TT: "#header [concept_default]: [Country.MakeScope.Var('spec_tm_default').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#N -5#! por estar en [concept_default]"
 SPEC_TM_REVOLUTION_TT: "#header [concept_revolution]: [Country.MakeScope.Var('spec_tm_revolution').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#N -2#! por una [concept_revolution]"
 concept_spec_market_confidence: "Confianza bursátil"
 concept_spec_market_confidence_desc: "@spec_market_confidence! #italic Cómo ven los inversores el [concept_market] de tu [concept_country], de #v 0#! (#v Pánico#!) a #v 100#! (#v Manía#!).#!\n\nEl miedo #N frena la inversión#! y encarece los [concept_loans]\nLa codicia #P acelera la inversión#!\n\n#P Sube#! con [Concept('concept_good','$concept_goods|q$')] en auge\n#N Baja#! con [Concept('concept_spec_boom_end','$concept_spec_boom_ends|q$')], [Concept('concept_spec_foreign_panic','$concept_spec_foreign_panics|q$')], [Concept('concept_diplomatic_play','$concept_diplomatic_plays|q$')] y la [concept_war]\nLos auges y sus finales son mayores donde los $building_financial_district$ tienen más peso en la economía, y menores donde los $building_manor_house$ los superan en número\n\nLos bancos prestan al [concept_investment_pool] por encima de #v 55#!\nUna [concept_spec_speculative_mania] llega con #v 80#! o más\nUn [concept_spec_financial_panic] comienza por debajo de #v 25#!\nUn [concept_spec_leverage] alto eleva ese umbral\nPocos $building_financial_district$ lo bajan un poco"
 concept_spec_speculative_mania: "Manía especulativa"
 concept_spec_speculative_mania_desc: "@spec_speculative_mania! #italic Tu [concept_market] se ha vuelto loco de codicia.#!\n\nDura mientras la [concept_spec_market_confidence] sea de #v 80#! o más\n#P Los bancos prestan con la máxima libertad#! al [concept_investment_pool]\n#N Cada [concept_spec_boom_end] cuesta más#! $concept_spec_market_confidence$\n\nUna manía larga o muy intensa ayuda durante algunos años a los [Concept('concept_political_movement','$concept_political_movements|q$')] que quieren [GetLawType('law_laissez_faire').GetName]"
 concept_spec_financial_panic: "Pánico financiero"
 concept_spec_financial_panics: "Pánicos financieros"
 concept_spec_financial_panic_desc: "@spec_financial_panic! #italic Una crisis, cuando los inversores huyen y los bancos retiran su dinero.#!\n\nComienza cuando tu [concept_spec_market_confidence] cae por debajo de #v 25#!. Con más de #v 3#! meses de [concept_spec_leverage], ese umbral sube, hasta #v 65#!. Con pocos $building_financial_district$ baja, hasta #v 20#!.\n\nMientras dura:\n#N Menos#! [concept_throughput] en todos los edificios, y menos impuestos recaudados\n#N Vacía#! el [concept_treasury] cada semana para socorrer a los desempleados\n#N Frena#! la [concept_private_construction] y la inversión\n#N Menor#! bonificación de $concept_throughput$ para [Concept('concept_company','$concept_companies|q$')]\n#N Algunos inversores se vuelven#! [Concept('concept_radical','$concept_radicals|q$')]\n#N Los bancos retiran#! [concept_spec_outstanding_credit] del [concept_investment_pool]\n\nSe propaga a cada [concept_country] vinculado como un [concept_spec_foreign_panic], y el dinero huye hacia [Concept('concept_great_power','$concept_great_powers|q$')] en calma\nDespués, durante algunos años, [Concept('concept_political_movement','$concept_political_movements|q$')] contra [GetLawType('law_laissez_faire').GetName] ganan apoyo"
 concept_spec_foreign_panic: "Pánico extranjero"
 concept_spec_foreign_panics: "Pánicos extranjeros"
 concept_spec_foreign_panic_desc: "@spec_foreign_panic! #italic Un pánico en el extranjero que se extiende a tu mercado.#!\n\nCuando comienza un [concept_spec_financial_panic] en un [concept_country] vinculado al tuyo, tu [concept_spec_market_confidence] #N cae#!\nLos países se vinculan por un [concept_market] compartido, porque uno sea súbdito del otro, por derechos de inversión, por mucho comercio o por poseer parte de tu economía\n#N Cuanto más estrecho el vínculo, mayor la caída#!\n\n[GetLawType('law_free_trade').GetName] refuerza los vínculos comerciales\nOtras políticas comerciales los debilitan\nUn [concept_embargo] corta el vínculo comercial"
 concept_spec_boom_end: "Fin del auge"
 concept_spec_boom_ends: "Finales de auge"
 concept_spec_boom_end_desc: "@spec_boom_end! #italic Todo lo que sube, baja. Un auge termina cuando el [concept_spec_investor_interest] en un [concept_good] retrocede tras subir.#!\n\nCuanto más alto llegó, más dura es la caída:\nMáximo en #v Interesado#!: una [concept_spec_correction]\nMáximo en #v Ávido#!: una [concept_spec_bust]\nMáximo en #v Febril#!: un [concept_spec_collapse]\n\n#N Reduce#! tu [concept_spec_market_confidence], más en los auges mayores y en los $concept_goods$ con mayor cuota del comercio del [concept_market]\nDespués los inversores se retraen mientras el $concept_good$ se recupera\nSi lo produce una [concept_company], esa industria #N pierde#! [concept_throughput]\n\n#instruction El máximo se desvanece un poco cada mes. Un auge que se enfría despacio termina con más suavidad, o sin ningún $concept_spec_boom_end$.#!"
 concept_spec_correction: "Corrección"
 concept_spec_correction_desc: "@spec_correction! #italic Una $concept_spec_correction$ es el [concept_spec_boom_end] más leve.#!\n\nSucede cuando el [concept_spec_investor_interest] en un [concept_good] que alcanzó #v Interesado#! vuelve a #v Dudoso#!\n\n#N Reduce#! ligeramente la [concept_spec_market_confidence]\nLos inversores se retraen del $concept_good$ durante #v 3#! meses\nSi lo produce una [concept_company], esa industria pierde un #N 2.5%#! de [concept_throughput] durante #v 90#! días, y un #N 25%#! más por cada una de [GetTechnology('corporate_charters').GetName] y [GetTechnology('corporate_management').GetName] que se haya investigado"
 concept_spec_bust: "Quiebra"
 concept_spec_bust_desc: "@spec_bust! #italic Una $concept_spec_bust$ es un [concept_spec_boom_end] más duro que una [concept_spec_correction].#!\n\nSucede cuando el [concept_spec_investor_interest] en un [concept_good] que alcanzó #v Ávido#! vuelve a #v Dudoso#!\n\n#N Reduce#! más la [concept_spec_market_confidence], unas #v 2#! veces lo que costaría una $concept_spec_correction$ del mismo auge\nLos inversores se retraen del $concept_good$ durante #v 6#! meses\nSi lo produce una [concept_company], esa industria pierde un #N 5%#! de [concept_throughput] durante #v 180#! días, y un #N 25%#! más por cada una de [GetTechnology('corporate_charters').GetName] y [GetTechnology('corporate_management').GetName] que se haya investigado"
 concept_spec_collapse: "Colapso"
 concept_spec_collapse_desc: "@spec_collapse! #italic Un $concept_spec_collapse$ es el peor [concept_spec_boom_end].#!\n\nSucede cuando el [concept_spec_investor_interest] en un [concept_good] que alcanzó #v Febril#! cae hasta #v En fuga#!\n\n#N Reduce#! mucho la [concept_spec_market_confidence], unas #v 5#! veces lo que costaría una [concept_spec_correction] del mismo auge\nLos inversores se retraen del $concept_good$ durante #v 12#! meses\nSi lo produce una [concept_company], esa industria pierde un #N 10%#! de [concept_throughput] durante un año, y un #N 25%#! más por cada una de [GetTechnology('corporate_charters').GetName] y [GetTechnology('corporate_management').GetName] que se haya investigado\n\nPeor aún, un $concept_spec_collapse$ en una gran parte del comercio del [concept_market] puede desencadenar un [concept_spec_financial_panic]"
 concept_spec_investor_interest: "Interés inversor"
 concept_spec_investor_interest_desc: "@spec_investor_interest! #italic Lo atraídos que se sienten los inversores por los [Concept('concept_building','$concept_buildings|q$')] que producen un [concept_good], de #v En fuga#! a #v Febril#!.#!\n\n#P Sube#! mientras el [concept_market_price] está por encima de su media a largo plazo\n#N Baja#! mientras está por debajo\n\nEl [concept_throughput] de esos edificios lo sigue, de #N -10%#! en #v En fuga#! a #P +8%#! en #v Febril#!\nIgual que la [concept_prosperity] de las [Concept('concept_company','$concept_companies|q$')] que producen el $concept_good$\nUn $concept_good$ en auge eleva la [concept_spec_market_confidence]\nCuando el interés retrocede, el auge termina en un [concept_spec_boom_end]"
 concept_spec_credit_policy: "Política crediticia"
 concept_spec_credit_policy_tight: "Crédito restrictivo"
 concept_spec_credit_policy_normal: "Crédito normal"
 concept_spec_credit_policy_loose: "Crédito expansivo"
 concept_spec_credit_policy_desc: "@spec_credit_policy! #italic La facilidad con que los bancos prestan al [concept_investment_pool].#!\n\nSe desbloquea con [GetTechnology('central_banking').GetName]\nPuede ser $concept_spec_credit_policy_tight$, $concept_spec_credit_policy_normal$ o $concept_spec_credit_policy_loose$\n\nUn crédito #v más restrictivo#! frena la inversión y hace bajar la [concept_spec_market_confidence] cuando está alta\nUn crédito #v más expansivo#! aumenta el [concept_spec_outstanding_credit]\n\nTras cambiarla, queda bloqueada durante #v 6#! meses"
 concept_spec_leverage: "Apalancamiento crediticio"
 concept_spec_leverage_desc: "@spec_leverage! #italic Cuánto han prestado tus bancos. Es tu [concept_spec_outstanding_credit], medido en meses de ingresos del [concept_investment_pool].#!\n\n#P +2%#! de [concept_throughput] por cada mes completo, hasta #P +24%#!\nLa bonificación se desvanece durante un [concept_spec_financial_panic] y mientras duren las [concept_spec_bad_debts]\n\nPor encima de #v 3#! meses se vuelve arriesgado:\n#N Un $concept_spec_financial_panic$ comienza antes#!, con una [concept_spec_market_confidence] más alta\n#N Deja $concept_spec_bad_debts$#!"
 concept_spec_bad_debts: "Deudas incobrables"
 concept_spec_bad_debts_desc: "@spec_bad_debts! #italic Las pérdidas que un [concept_spec_financial_panic] deja en los libros de tus bancos.#!\n\nCrecen con un [concept_spec_leverage] superior a #v 3#! meses\n\nCada punto: #N -0.4%#! de [concept_throughput] y #N -0.75%#! de inversión\nSe acumulan durante unos meses y luego disminuyen despacio\nEn el peor caso tardan unos #v 6#! años en desaparecer\n#N Los bancos no prestan#! mientras duren\n\n#v Prestar a los bancos#! no las elimina\n#v Comprar préstamos incobrables#! las reduce a la mitad, una vez mientras duren"
 concept_spec_lending_standards: "Criterios de préstamo"
 concept_spec_lending_standards_desc: "@spec_lending_standards! #italic Con qué cuidado prestan los bancos de tu [concept_country]. Pueden ser #v Estrictos#!, #v Cautelosos#!, #v Prudentes#!, #v Laxos#! o #v Temerarios#!.#!\n\nLos bancos más laxos prestan más al [concept_investment_pool] y destinan más a los auges\n#N Así los auges terminan peor#! y un rescate bancario cuesta más\n\n#N Se relajan#! un poco cada mes sin [concept_spec_financial_panic], de #v Estrictos#! a #v Temerarios#! en unos #v 20#! años tranquilos\n#N Se relajan aún más#! tras cada rescate bancario o #v Comprar préstamos incobrables#!\n#P Se endurecen#! cuando termina un auge, sobre todo cuando un $concept_spec_financial_panic$ sigue su curso sin rescate bancario"
 concept_spec_blue_chip: "Valor de primera"
 concept_spec_blue_chips: "Valores de primera"
 concept_spec_blue_chip_desc: "@spec_blue_chip! #italic Una [concept_company] estrella que ha mantenido #v 70#! o más de [concept_prosperity] durante #v 12#! meses seguidos.#!\n\nCada uno suma #v 2#! a nuestra [concept_spec_company_strength]\n#b Cada uno#! #grey (los primeros 5 por completo, los 5 siguientes a la mitad)#!\n[concept_spec_market_confidence] perdida por crisis y pánicos: #P -4%#!\nReputación de la [concept_spec_exchange]: #P +0.4%#! de la barra completa al año\nPugnas de la [concept_spec_exchange]: #P +3%#! a nuestro favor\nAportación de los capitalistas al [concept_investment_pool]: #P +0.6%#!\nInterés de los préstamos: #P -1%#!\n\n#b Si perdemos uno#!\nOcurre tras #v 3#! meses seguidos por debajo de #v 70#! de [concept_prosperity]\nReputación de la [concept_spec_exchange]: #N -1.7%#! de la barra completa\n[concept_spec_market_confidence]: #N -3#!\nUn ataque bajista que nos golpee vuelve uno #N Frágil#! durante un año. Entonces deja de serlo tras un solo mes por debajo de #v 70#! de [concept_prosperity], no #v 3#!\n\n#b Compañía del año#!\nSi la nuestra es la más próspera del mundo, ganamos #P +2.5%#! de la barra completa de reputación de la [concept_spec_exchange], y #P +5%#! de [concept_prestige] durante un año\n\n#N Se pierde#! tras #v 3#! meses seguidos por debajo de #v 70#!, y entonces los #v 12#! meses vuelven a empezar\nUn mes por debajo reinicia el camino hacia él\nUn [concept_country] que abandona la economía de mercado no conserva ninguno"
 concept_spec_company_strength: "Fuerza de las compañías"
 concept_spec_company_strength_desc: "@spec_company_strength! #italic Lo fuertes que son, en conjunto, las [Concept('concept_company','$concept_companies|q$')] de un [concept_country].#!\n\nCada compañía suma su [concept_prosperity] dividida entre #v 20#!, así que una con #v 100#! suma #v 5#!\nCada [concept_spec_blue_chip] suma #v 2#! más\nLa más fuerte gana el título de Sede de grandes compañías"
 concept_spec_outstanding_credit: "Crédito pendiente"
 concept_spec_outstanding_credit_desc: "@spec_outstanding_credit! #italic Dinero que los bancos han prestado al [concept_investment_pool] y que aún no han recuperado.#!\n\nLos bancos prestan mientras la [concept_spec_market_confidence] está por encima de #v 55#!\nSe detienen en un límite de préstamo de #v 3#! meses de ingresos del fondo\n[GetTechnology('central_banking').GetName] añade #v 5#! meses\n[GetTechnology('investment_banks').GetName] y [GetTechnology('international_exchange_standards').GetName] añaden #v 2#! cada uno\n\nCada mes se devuelve un poco con cargo al fondo\nCuando comienza un [concept_spec_financial_panic], los bancos #N retiran una parte#!\n\n#lore Los bancos prestaron con la garantía de acciones ferroviarias en la década de 1840, de algodón en 1837 y de solares en Viena en 1873, y quedaron atrapados cuando esos auges se hundieron.#!"
