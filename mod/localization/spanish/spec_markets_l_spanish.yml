 SPEC_RISK_5_NONE: "#header @spec_speculative_excess! $concept_spec_speculative_excess$#!\nNada de qué preocuparse. Ahora mismo no hay burbuja. Empieza a crecer cuando la [concept_spec_market_confidence] alcanza #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#!."
 SPEC_RISK_4: "[SelectLocalization(Country.MakeScope.Var('spec_default_risk').IsSet, 'SPEC_RISK_4_V', 'SPEC_CHIP_ZERO')]"
 SPEC_RISK_4_V: "#N -5#!"
 SPEC_RISK_4_TT: "[SelectLocalization(Country.MakeScope.Var('spec_default_risk').IsSet, 'SPEC_RISK_4_ON', 'SPEC_RISK_4_NONE')]"
 SPEC_RISK_4_ON: "#header Riesgo de impago#!\n$TOOLTIP_DELIMITER$\n#italic Estamos pidiendo prestado cerca de nuestro límite. Si lo superamos, entramos en impago.#!\n\n[concept_credit] usado: #v [Country.MakeScope.Var('spec_default_risk').GetValueWithDefault('(CFixedPoint)0')|%0]#![AddLocalizationIf(Country.MakeScope.Var('spec_tm_broke').IsSet, 'SPEC_RISK_4_BROKE')]\nSi pasa del #v 100%#!: [concept_default], #N -5#! de [concept_spec_market_confidence] cada mes hasta que termine\n$TOOLTIP_DELIMITER$\n#weak Aparece cuando hemos usado el #v 80%#! de nuestro $concept_credit$#!"
 SPEC_RISK_4_BROKE: "\n#v [Country.MakeScope.ScriptValue('spec_broke_weeks')|0]#! semanas hasta la [concept_bankruptcy] si seguimos perdiendo dinero así. Ya cuesta [Country.MakeScope.Var('spec_tm_broke').GetValueWithDefault('(CFixedPoint)0')|+=2] al mes"
