 SPEC_LAXL_HERE: "\n\n#P Estamos aquí#!"
 SPEC_LAXL_0_TT: "#header Estrictos#!\n$TOOLTIP_DELIMITER$\n#italic Los bancos apenas prestan. Los auges son pequeños y terminan con suavidad.#!\n\n#b Frente a #v Prudentes#!:#!\nCrédito concedido cada mes: de #v -25%#! a #v -15%#!\nParte que va a los auges: de #P -50%#! a #P -30%#!\nCoste de un rescate bancario: de #P -50%#! a #P -30%#!\n\n#P Nuestra [concept_spec_exchange] gana reputación en los meses tranquilos#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.2')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_1_TT: "#header Cautelosos#!\n$TOOLTIP_DELIMITER$\n#italic Los bancos prestan con cuidado.#!\n\n#b Frente a #v Prudentes#!:#!\nCrédito concedido cada mes: de #v -15%#! a #v -5%#!\nParte que va a los auges: de #P -30%#! a #P -10%#!\nCoste de un rescate bancario: de #P -30%#! a #P -10%#!\n\n#P Nuestra [concept_spec_exchange] gana reputación en los meses tranquilos#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.2'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.4')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_2_TT: "#header Prudentes#!\n$TOOLTIP_DELIMITER$\n#italic El nivel normal.#!\n\n#b Frente a #v Prudentes#!:#!\nCrédito concedido cada mes: de #v -5%#! a #v +5%#!\nParte que va a los auges: de #P -10%#! a #N +10%#!\nCoste de un rescate bancario: de #P -10%#! a #N +10%#!\n\n#P Nuestra [concept_spec_exchange] gana reputación en los meses tranquilos#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.4'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.6')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_3_TT: "#header Laxos#!\n$TOOLTIP_DELIMITER$\n#italic Los bancos prestan con facilidad y persiguen los auges.#!\n\n#b Frente a #v Prudentes#!:#!\nCrédito concedido cada mes: de #v +5%#! a #v +15%#!\nParte que va a los auges: de #N +10%#! a #N +30%#!\nCoste de un rescate bancario: de #N +10%#! a #N +30%#!\n\n#N Nuestra [concept_spec_exchange] deja de ganar reputación#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.6'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.8')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_4_TT: "#header Temerarios#!\n$TOOLTIP_DELIMITER$\n#italic Los bancos prestan a cualquiera. Los auges se calientan y terminan mal.#!\n\n#b Frente a #v Prudentes#!:#!\nCrédito concedido cada mes: de #v +15%#! a #v +25%#!\nParte que va a los auges: de #N +30%#! a #N +50%#!\nCoste de un rescate bancario: de #N +30%#! a #N +50%#!\n\n#N Nuestra [concept_spec_exchange] deja de ganar reputación#![AddLocalizationIf(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.8'), 'SPEC_LAXL_HERE')]"
 SPEC_EFFECT_LAX: "Criterios de préstamo"
 SPEC_EFFECT_LAX_VALUE: "#v [SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.2'), 'SPEC_LAXW_0', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.4'), 'SPEC_LAXW_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.6'), 'SPEC_LAXW_2', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.8'), 'SPEC_LAXW_3', 'SPEC_LAXW_4'))))]#!"
 SPEC_EFFECT_LAX_TT: "#header @spec_lending_standards! [concept_spec_lending_standards]: $SPEC_EFFECT_LAX_VALUE$#!\n$TOOLTIP_DELIMITER$\n#italic Con qué cuidado prestan nuestros bancos. Los bancos descuidados prestan más, pero sus auges terminan peor.#!\n\n#b Comparado con lo normal (#v Prudentes#!)#!\n#v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_credit'), '(CFixedPoint)1')|+%0]#! de crédito concedido cada mes\n#v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_pull'), '(CFixedPoint)1')|+%0]#! sobre la parte habitual de ese crédito que va a los auges\n#v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_cost'), '(CFixedPoint)1')|+%0]#! de coste de un rescate bancario\n\n#b Cómo cambian#!\n#N Más laxos#! un poco cada mes tranquilo (de #v Estrictos#! a #v Temerarios#! en unos #v 20#! años)\n#N Mucho más laxos#! cada vez que rescatamos a los bancos\n#P Más estrictos#! cuando termina un auge, o cuando lo contenemos\n#P Mucho más estrictos#! cuando un [concept_spec_financial_panic] termina sin rescate\n$TOOLTIP_DELIMITER$\n#instruction Fija la [concept_spec_credit_policy] en #v Restrictiva#! para que dejen de relajarse. Un pánico o las deudas incobrables también lo detienen. Con #v Prudentes#! o más estrictos, también crece la reputación de nuestra [concept_spec_exchange].#!"
