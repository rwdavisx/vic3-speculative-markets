 SPEC_RV_SLOT_CANCEL_TT: "#header Terminar el pulso con [Country.GetNameNoFormatting]#!\n$TOOLTIP_DELIMITER$\n#italic Se resuelve en $SPEC_RV_LEFT$. Terminarlo ahora cuenta como perderlo, con una $SPEC_RV_BAND_BIGLOSS$ si el pulso ya la muestra.#!\n\nNuestra [concept_spec_exchange] pierde #N [Multiply_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_forfeit').GetValueWithDefault('(CFixedPoint)0'), Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_exch_loss'), Select_CFixedPoint(GetScriptedGui('spec_sgui_rv_is_bitter').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End), '(CFixedPoint)1.5', '(CFixedPoint)1')))|1]#! de reputación\nLa suya gana #N [Country.MakeScope.Var('spec_rv_ui_forfeit').GetValueWithDefault('(CFixedPoint)0')|1]#! de reputación\n[SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)-0.7499'), 'SPEC_RV_SLOT_CANCEL_LURE', 'SPEC_RV_EV_NONE')]El hueco de pulso queda libre[SelectLocalization(GetScriptedGui('spec_sgui_rv_is_locked').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End), 'SPEC_RV_SLOT_CANCEL_LOCKED', 'SPEC_RV_SLOT_CANCEL_CLICK')]"
