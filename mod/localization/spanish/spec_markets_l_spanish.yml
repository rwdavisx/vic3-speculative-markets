 SPEC_EXCH_CARD_NOTE: "#italic El tipo de mercado que es nuestra [concept_spec_exchange]. Elegimos uno.#!\nCada uno da su propia bonificación y abre vías de renombre que ningún otro estatuto puede elegir"
 SPEC_H_KNOWN_TT: "#header Especialidades#!\n$TOOLTIP_DELIMITER$\n#italic Las vías de renombre que persigue nuestra [concept_spec_exchange].#!\n\n$SPEC_PURSUE_RULE$"
 SPEC_H_RIVAL: "Competencia"
 SPEC_H_RIVAL_TT: "#header Competencia#!\n$TOOLTIP_DELIMITER$\n$SPEC_RIVAL_RULE$"
 SPEC_H_RIVAL_RIGHT: "#N -[GetPlayer.MakeScope.ScriptValue('spec_rv_upkeep_total')|0]#! @inf!"
 SPEC_RIVAL_RULE: "#italic Nuestra [concept_spec_exchange] puede elegir otras Bolsas con las que disputarse la reputación.#!\n\nCada competidor cuesta de #N 25#! a #N 150#! de influencia mantenerlo, más con un rango alto\nPodemos elegir #v 1#! competidor con el rango más bajo, y uno más por cada rango superior (hasta #v 4#!)\nNo podemos abandonar a un competidor durante su primer año\nEsto es independiente de las rivalidades diplomáticas\n\n#b El pulso#!\nCada pulso dura #v 5#! años desde que empieza, luego se resuelve como un tira y afloja y comienza uno nuevo\nLa barra parte de las dos puntuaciones de [Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]\n#N Cada pulso además del primero nos dispersa#! y debilita nuestra puntuación en todos (#v 2#! pulsos: #N 80%#!, #v 4#!: #N 57.1%#!)\nCada [concept_spec_blue_chip] la arrastra un #v 3%#! hacia su lado (arrastre completo hasta #v 5#!, medio arrastre hasta #v 10#!)\nCada acción que funciona la empuja un #v 10%#! hacia su lado, hasta #v 5#! empujes cada una\nCerca del centro es un empate\n\n#b La victoria#!\nTras una #P victoria#!, el perdedor cede un #P 5%#! de reputación\nTras una #P gran victoria#! (la barra termina a más de un #v 75%#! hacia un lado), el perdedor cede un #P 10%#! de reputación y un #P 5%#! de los ingresos de su [concept_investment_pool] durante 12 meses\nVencer a una Bolsa de rango superior rinde más, y vencer a una inferior rinde menos\nSi las [concept_relations] son malas o peores, el perdedor pierde #N x1.5#! más\n\n#b Acciones#!\nPodemos usarlas contra las Bolsas con las que competimos y contra las que compiten con nosotros\nCada acción funciona una vez al año contra cada competidor\nContra una Bolsa mayor cuestan más y logran menos (#v x0.75#! a #v x1.33#!)\nEn un [concept_spec_financial_panic], el dinero que huye va primero a un competidor"
