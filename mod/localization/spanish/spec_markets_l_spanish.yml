 alert_spec_bailout_alert_hint: "Use #v Comprar préstamos incobrables#! en la pestaña #bold $SPEC_FIN_TAB_BANKING$#! de la ventana #bold $SPEC_FINANCE$#!. Solo una vez mientras duren.\n#P Reduce a la mitad#! las [concept_spec_bad_debts] restantes\nCuesta #v @money![GetPlayer.MakeScope.ScriptValue('spec_bailout_cost')|D]#!"
