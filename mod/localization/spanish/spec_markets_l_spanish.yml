 SPEC_RV_RAID_TT: "#header Ataque bajista#!\n$TOOLTIP_DELIMITER$\n#italic Nuestros corredores venden de golpe las acciones de [Country.GetNameNoFormatting] para hundir su mercado.#!\n$TOOLTIP_DELIMITER$\n#b Si funciona#!\n[concept_spec_market_confidence] de [Country.GetNameNoFormatting]: #P -[Multiply_CFixedPoint('(CFixedPoint)3', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|0]#! durante #v 6#! meses\nPulso: #P 10%#! a nuestro favor\n\n#b Si fracasa#! (#N [Min_CFixedPoint('(CFixedPoint)80', Add_CFixedPoint('(CFixedPoint)20', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint('(CFixedPoint)0', Divide_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, GetPlayer.MakeScope.Var('spec_centre_score').GetValue), Max_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|0]%#! de probabilidad)\nNuestra [concept_spec_market_confidence]: #N -3#! durante #v 6#! meses\nPulso: #N 10%#! a su favor\n$TOOLTIP_DELIMITER$\nCoste: #N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#! de nuestro [concept_treasury]\nEspera: #v 1 año#! contra [Country.GetNameNoFormatting][AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_raid').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_RAID')]"
 SPEC_RV_WHY_RV_RAID: "\n\n[GetScriptedGui('spec_sgui_rv_raid').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_LURE_TT: "#header Atraer capital#!\n$TOOLTIP_DELIMITER$\n#italic Nuestros banqueros cortejan a los inversores de [Country.GetNameNoFormatting] con mejores condiciones.#!\n$TOOLTIP_DELIMITER$\n#P [Multiply_CFixedPoint('(CFixedPoint)0.05', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|%0]#! de los ingresos del [concept_investment_pool] de [Country.GetNameNoFormatting] pasa a nosotros durante #v 12#! meses\nPulso: #P 10%#! a nuestro favor\n$TOOLTIP_DELIMITER$\nCoste: #N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_lure_debt_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#! sumados a nuestro [concept_spec_outstanding_credit]\nEspera: #v 1 año#! contra [Country.GetNameNoFormatting][AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_lure').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_LURE')]"
 SPEC_RV_WHY_RV_LURE: "\n\n[GetScriptedGui('spec_sgui_rv_lure').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_PRESS_TT: "#header Campaña de prensa#!\n$TOOLTIP_DELIMITER$\n#italic Los periódicos afines llenan sus páginas de dudas sobre la [concept_spec_exchange] de [Country.GetNameNoFormatting].#!\n$TOOLTIP_DELIMITER$\n#b Si funciona#!\nReputación de la [concept_spec_exchange] de [Country.GetNameNoFormatting]: #P -[Multiply_CFixedPoint('(CFixedPoint)0.0167', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|%0]#!\nPulso: #P 10%#! a nuestro favor\n\n#b Si es descubierta#! (#N [Country.MakeScope.ScriptValue('spec_rv_press_expose')|0]%#! de probabilidad, más alta donde la prensa de [Country.GetNameNoFormatting] es libre)\n[concept_relations] con [Country.GetNameNoFormatting]: #N -20#!\nReputación de nuestra [concept_spec_exchange]: #N -1.7%#!\nPulso: #N 10%#! a su favor\n$TOOLTIP_DELIMITER$\nCoste: [concept_influence] #N -75#! @inf! durante #v 12#! meses\nEspera: #v 1 año#! contra [Country.GetNameNoFormatting][AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_press').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_PRESS')]"
 SPEC_RV_WHY_RV_PRESS: "\n\n[GetScriptedGui('spec_sgui_rv_press').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_HOLD_TT: "#header Mantener la línea#!\n$TOOLTIP_DELIMITER$\n#italic Recompramos lo que vendió [Country.GetNameNoFormatting] y afianzamos nuestro lado del pulso.#!\n$TOOLTIP_DELIMITER$\nDeshace uno de los empujones de [Country.GetNameNoFormatting] y devuelve el pulso un #P 10%#! a nuestro favor\nSus empujones contra nosotros ahora: #v [Country.MakeScope.Var('spec_rv_ui_them').GetValue|0]#!\n$TOOLTIP_DELIMITER$\nCoste: #N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#! de nuestro [concept_treasury]\nEspera: #v 1 año#! contra [Country.GetNameNoFormatting][AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_hold').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_HOLD')]"
 SPEC_RV_WHY_RV_HOLD: "\n\n[GetScriptedGui('spec_sgui_rv_hold').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_SHORE_TT: "#header Reforzar#!\n$TOOLTIP_DELIMITER$\n#italic Nuestros bancos cierran filas contra [Country.GetNameNoFormatting].#!\n$TOOLTIP_DELIMITER$\nLas acciones de [Country.GetNameNoFormatting] contra nosotros tienen #P la mitad#! de efecto durante #v 12#! meses\n$TOOLTIP_DELIMITER$\nCoste: #N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#! de nuestro [concept_treasury]\nEspera: #v 2 años#! contra [Country.GetNameNoFormatting][AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_shore').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_SHORE')]"
 SPEC_RV_WHY_RV_SHORE: "\n\n[GetScriptedGui('spec_sgui_rv_shore').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
