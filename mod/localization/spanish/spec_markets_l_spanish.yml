 SPEC_IL_SORT_LEVER_BASE_TT: "#header Mostrar intervenciones#!\n$TOOLTIP_DELIMITER$\nMuestra solo los bienes con una [concept_spec_intervention]\n\n#instruction Haz clic para mostrar solo estos bienes; vuelve a hacer clic para mostrarlos todos#!"
 SPEC_IL_DANGER_TT: "#header Zona de colapso#!\n$TOOLTIP_DELIMITER$\n#italic El auge es tan grande que retroceder ahora lo haría terminar mal.#!\n\nSi el [concept_spec_investor_interest] cae hasta aquí, el auge termina en un [concept_spec_collapse]\nEso costaría unos #N [Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! de [concept_spec_market_confidence]"
 SPEC_IL_CRASHED_TT: "#header [Goods.GetName]: auge terminado#!\n$TOOLTIP_DELIMITER$\n#italic El auge de este bien acaba de terminar.#!\n\nTerminó este mes en [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]\n#N Los inversores se mantienen alejados#! durante [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))]\n[Concept('concept_company','$concept_companies|q$')]: las que lo producen #N pierden#! [concept_throughput]"
 SPEC_IL_GLUT_TT: "#header [Goods.GetName] en recuperación#!\n$TOOLTIP_DELIMITER$\n#italic Los inversores aún desconfían tras el fin del último auge.#!\n\nEse auge terminó en [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]\n[concept_spec_investor_interest] #N atascado#! en #v Dudoso#! o menos durante [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))]\n[Concept('concept_company','$concept_companies|q$')]: las que lo producen #N pierden#! [concept_throughput]"
 SPEC_TILE_BANKS: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_expx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_BANKS_ON', 'SPEC_GOODS_NONE')]$SPEC_TILE_CYCLE$"
 SPEC_TILE_BANKS_ON: "\n\n#title Préstamos bancarios#!\nEl #v [Country.MakeScope.Var(Concatenate('spec_exp_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! de todo el [concept_spec_outstanding_credit] está en este auge, el equivalente a #v [Country.MakeScope.Var(Concatenate('spec_ui_expm_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! meses de ingresos del fondo\nSi termina, el golpe a la [concept_spec_market_confidence] es #N x[Country.MakeScope.Var(Concatenate('spec_ui_expx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|2]#! mayor que con un auge en el que ningún banco hubiera prestado"
 SPEC_NOTE_BANKS: ""
 SPEC_NOTE_BANKS_ON: " Los bancos habían prestado mucho en él, así que la caída fue #N x[SCOPE.GetValue('spec_note_bank')|2]#! más dura."
 SPEC_H_BANK_LENT: "Dónde han prestado los bancos"
 SPEC_H_BANK_LENT_TT: "#header Dónde han prestado los bancos#!\n$TOOLTIP_DELIMITER$\n#italic Los bancos vuelcan los préstamos nuevos en los bienes que están en auge.#!\n\nLos bienes más grandes y con más [concept_spec_investor_interest] reciben más dinero\nUn préstamo se queda en su bien hasta que se devuelve\n#N Si termina un auge con préstamos#!, la [concept_spec_market_confidence] cae más\n$TOOLTIP_DELIMITER$\n#instruction Contenga la especulación en un bien para reducir a la mitad los préstamos nuevos que recibe.#!"
 SPEC_BANK_PIE: "Préstamos de auges por bien"
 SPEC_BANK_SLICE_NAME: "[SelectLocalization(Country.MakeScope.Var(Concatenate('spec_bank_oth_', Scope.GetGoods.GetKey)).IsSet, 'SPEC_BANK_OTHER', 'SPEC_BANK_GOOD_NAME')]"
 SPEC_BANK_GOOD_NAME: "[Scope.GetGoods.GetName]"
 SPEC_BANK_SLICE_SHARE: "[SelectLocalization(Country.MakeScope.Var(Concatenate('spec_bank_oth_', Scope.GetGoods.GetKey)).IsSet, 'SPEC_BANK_OTHER_SHARE', 'SPEC_BANK_GOOD_SHARE')]"
 SPEC_BANK_OTHER_SHARE: "#v [Divide_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_exp_booms'), Country.MakeScope.Var('spec_bank_top').GetValueWithDefault('(CFixedPoint)0')), Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_exp_booms'), '(CFixedPoint)0.001'))|%0]#!"
 SPEC_BANK_GOOD_SHARE: "#v [Divide_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_exp_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_exp_booms'), '(CFixedPoint)0.001'))|%0]#!"
 SPEC_BANK_SLICE_TT: "[SelectLocalization(Country.MakeScope.Var(Concatenate('spec_bank_oth_', Scope.GetGoods.GetKey)).IsSet, 'SPEC_BANK_OTHER_TT', 'SPEC_BANK_GOOD_TT')]"
 SPEC_BANK_GOOD_TT: "#header [Scope.GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\n#italic Cuánto dinero de los bancos hay en juego en este auge.#!\n\n#v [Country.MakeScope.Var(Concatenate('spec_exp_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%1]#! de todo el [concept_spec_outstanding_credit] está aquí\nSi su auge terminara, estos préstamos harían que la [concept_spec_market_confidence] cayera #N x[Country.MakeScope.Var(Concatenate('spec_ui_expx_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)1')|2]#!"
 SPEC_BANK_NONE_S: "#grey Ningún crédito prestado a auges#!"
 SPEC_BANK_NONE: "Nada prestado a auges\nLos bancos solo prestan mientras la [concept_spec_market_confidence] está por encima de #v 55#!, sobre todo a bienes en #v Interesado#! o más calientes"
 SPEC_LHIST_EMPTY: "#grey Se registra cada mes a partir de ahora#!"
 SPEC_H_CREDIT_HISTORY: "Historial del apalancamiento crediticio"
 SPEC_H_CREDIT_HISTORY_TT: "#header Historial del apalancamiento crediticio#!\n$TOOLTIP_DELIMITER$\n#italic Hasta dónde han prestado nuestros bancos, mes a mes.#!\n\nLos últimos #v 36#! meses de [concept_spec_leverage], el más reciente a la derecha\n#P Seguro#! hasta #v 3#! meses\n#v Arriesgado#! hasta #v 8#!\n#N Peligroso#! a partir de #v 8#!\n\nLa línea blanca es nuestro límite de préstamo\nEl borde derecho muestra dónde empieza un pánico en cada nivel"
 SPEC_H_CREDIT_HISTORY_RIGHT: "Ahora #v [Country.MakeScope.ScriptValue('spec_lev')|1]#! meses"
 SPEC_LHIST_OLDEST: "#grey Hace 35 meses#!"
 SPEC_LHIST_NOW: "#grey Este mes#!"
