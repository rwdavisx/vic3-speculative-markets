 SPEC_SEP_DOUBTFUL_TT: "#header @spec_interest_doubtful! [concept_spec_investor_interest] Dudoso#!\nCuota de nuestro comercio: #v [Country.MakeScope.Var('spec_heat_2').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#italic Cuánto interés tienen los inversores en este bien.#!\n\n[concept_throughput] de los productores: #N -5%#!\nTras el fin de un auge, el bien se queda aquí o más abajo un tiempo para recuperarse"
