 SPEC_EFFECT_DEBT_TT: "#header Retirada por pánico#!\n#v @money![Country.MakeScope.ScriptValue('spec_clawback')|D]#! si hoy empezara un pánico\n$TOOLTIP_DELIMITER$\n#italic Dinero que por ahora sigue en nuestro [concept_investment_pool]. Si llega un [concept_spec_financial_panic], los bancos reclaman parte de sus préstamos y se lo llevan.#!\n\n[concept_spec_outstanding_credit]: #v @money![Country.MakeScope.Var('spec_debt').GetValueWithDefault('(CFixedPoint)0')|D]#!\nParte reclamada: #v 50%#!\nLo máximo que puede llevarse del fondo: #v [Country.MakeScope.ScriptValue('spec_claw_share')|%0]#! con nuestro [concept_spec_leverage]\n$TOOLTIP_DELIMITER$\n#instruction Cuanto mayor sea nuestro [concept_spec_leverage], más del fondo puede llevarse un pánico: el #v 25%#! con un apalancamiento bajo, todo cuando se vuelve peligroso.#!\n\n#weak El $concept_spec_outstanding_credit$ baja un #v 2%#! al mes a medida que se devuelven los préstamos#!"
