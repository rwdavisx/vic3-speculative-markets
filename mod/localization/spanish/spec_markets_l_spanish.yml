 spec_markets.2.f: "«Ayer tenía cuarenta mil. Esta mañana solo tengo mi abrigo, y por él me han ofrecido bien poco»."
 spec_markets.2.a: "El mercado debe encontrar su propio suelo."
 spec_markets.2.a.tt: "El [concept_spec_financial_panic] sigue su curso completo a menos que más adelante decidamos #v Prestar a los bancos#!, lo que también elimina este cambio de [concept_approval] de $ig_industrialists$"
 spec_markets.2.b: "Debemos apoyar a los bancos."
 spec_markets.2.b.tt: "El [concept_spec_financial_panic] termina en un plazo de #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#! meses y sus efectos se reducen a la mitad\nLa [concept_spec_market_confidence] aumenta en #v 20#!"
 spec_rescue_cost_tt: "[concept_treasury]: #N -@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_cost')|D]#!, aproximadamente el #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#! del [concept_gdp]"
 spec_levy_tt: "[concept_treasury]: #P +@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_speculator_tax')|D]#!, aproximadamente el #v 0.25%#! del [concept_gdp]"
 spec_bank_bailout_tt: "[concept_approval] de $ig_trade_unions$ y $ig_rural_folk$: #N -2#! durante #v 2.5#! años"
 spec_markets.2.c: "Los especuladores nos han traído esta desgracia."
