 je_spec_depression_reason: "Los pánicos de las grandes bolsas se han convertido en una crisis mundial. La inversión y la construcción se han frenado, el comercio ha caído y los desempleados se impacientan. La [concept_spec_long_depression] termina cuando el mundo se recupera o, como máximo, tras #v 5#! años.\n\nNuestras decisiones aceleran nuestra recuperación y la mundial; las de las [Concept('concept_great_power','$concept_great_powers|q$')] cuentan más. Una vez completada nuestra recuperación, la [concept_spec_market_confidence] vuelve aquí antes que en otros lugares."
