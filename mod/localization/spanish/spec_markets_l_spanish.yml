 SPEC_COL_LEVER_TT: "#header Intervenciones bursátiles#!\n$TOOLTIP_DELIMITER$\n#italic Intervenir para enfriar o avivar un bien.#!\n\n#v Contener la especulación#! mantiene el interés en #v Sereno#!. Los productores #N pierden#! [concept_throughput] y pagan un gravamen\n#v Fomentar la inversión#! mantiene el interés al menos en #v Interesado#!. Los productores #P ganan#! $concept_throughput$ y el Estado lo paga\n$TOOLTIP_DELIMITER$\n#weak Cada una cuesta [concept_authority] cada mes hasta que se retira, más en los bienes básicos y en los muy comerciados#!"
 SPEC_SEP_FEVERISH_TT: "#header @spec_interest_feverish! [concept_spec_investor_interest]: Febril#!\nProporción de nuestro comercio: #v [Country.MakeScope.Var('spec_heat_6').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#italic Cuánto atrae este bien a los inversores.#!\n\n[concept_throughput] de los productores: #P +8%#!\nLa [concept_spec_market_confidence] #P sube#! cada mes (más si es una gran parte de nuestro comercio, nada durante un [concept_spec_financial_panic])\nAl terminar: [concept_spec_collapse]"
 SPEC_SEP_EAGER_TT: "#header @spec_interest_eager! [concept_spec_investor_interest]: Ávido#!\nProporción de nuestro comercio: #v [Country.MakeScope.Var('spec_heat_5').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#italic Cuánto atrae este bien a los inversores.#!\n\n[concept_throughput] de los productores: #P +5%#!\nLa [concept_spec_market_confidence] #P sube#! cada mes (más si es una gran parte de nuestro comercio, nada durante un [concept_spec_financial_panic])\nAl terminar: [concept_spec_bust]"
 SPEC_SEP_KEEN_TT: "#header @spec_interest_keen! [concept_spec_investor_interest] Interesado#!\nCuota de nuestro comercio: #v [Country.MakeScope.Var('spec_heat_4').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#italic Cuánto interés tienen los inversores en este bien.#!\n\n[concept_throughput] de los productores: #P +3%#!\nAl terminar: [concept_spec_correction]"
