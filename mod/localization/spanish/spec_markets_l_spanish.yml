 concept_spec_exchange: "Bolsa"
 concept_spec_trust: "Reputación"
 concept_spec_trust_desc: "@spec_trust! Cuánto creen los inversores en la [concept_spec_exchange] de un [concept_country], de #v 0%#! a #v 100%#!.\n\n#P Sube#! en los meses tranquilos y #N cae#! con cada [concept_spec_financial_panic], quiebra y colapso. Su nivel, #N Desacreditada#!, Cuestionada, #v Respetada#! o #P Fiable#!, cambia lo que paga el [concept_country] por endeudarse."
 concept_spec_exchange_desc: "@spec_exchange! La $concept_spec_exchange$ de un [concept_country] es donde cambian de manos sus acciones, bonos y créditos. Su rango depende de su puntuación de [Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]: #v Provincial#!, #v Nacional#!, #v Internacional#! (requiere [GetTechnology('stock_exchange').GetName]) o #v Centro mundial#! (requiere [GetTechnology('central_banking').GetName]). Un rango más alto aumenta la reacción inversora a la subida de precios, y a partir de #v Internacional#! la Bolsa recibe [concept_spec_capital_flight].\n\nEl Estado otorga a su Bolsa un estatuto: #v Bolsa de mercancías#!, #v Mercado monetario#! o #v Bolsa de valores#!. Una Bolsa tiene de #v 1#! a #v 4#! especialidades de entre las #v 10#! vías de renombre, más cuanto más alto es su rango, y conserva cada una al menos #v 5#! años.\n\nLa reputación aumenta en los años tranquilos con préstamos prudentes, y disminuye con cada [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')], con las [concept_spec_bad_debts] y con una [concept_spec_bust] o un [concept_spec_collapse] en un bien principal. Una reputación baja eleva el tipo de interés de los [concept_loans] y una alta lo reduce."
 spec_exch_national: "Rango de la Bolsa"
 spec_trust_0: "Bolsa desacreditada"
 spec_trust_0_desc: "Los inversores consideran #v Desacreditada#! la [concept_spec_exchange] del [concept_country]."
