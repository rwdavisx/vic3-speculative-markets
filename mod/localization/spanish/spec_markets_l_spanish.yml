 spec_lever_fits_encourage_tt: "El [concept_spec_investor_interest] está por debajo de #v Interesado#!, el [concept_good] no se está recuperando tras un auge y no tiene ningún auge que pueda terminar en una [concept_spec_bust] o un [concept_spec_collapse]"
 SPEC_LEVER_RESTRAIN_TT: "#header Contener la especulación en [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n#italic Enfriar un [concept_good] recalentado antes de que su auge crezca demasiado.#!\n\nEl [concept_spec_investor_interest] baja a #v Sereno#! en unos meses\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_DOWN', 'SPEC_LEVER_NONE')][concept_budget_additional_income]: #P @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_levy_', Goods.GetKey))|D]#! por semana (#v 10%#! de lo que producen, a precio base)\nCuando su auge termina, se desinfla poco a poco durante aproximadamente un año como una [concept_spec_correction], no de golpe\n\nInmoviliza #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#! de [concept_authority] mientras está en vigor, sin pagarse de nuevo cada mes. La recuperamos al retirar la medida#indent_newline:3 \n#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! para este [concept_good] normalmente, lo mismo que medio impuesto al consumo sobre él\n#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! según cuánto lo comerciamos (#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! de nuestro mercado)#!\n\n#lore Tras la burbuja de los Mares del Sur, la Ley de la Burbuja de 1720 prohibió lanzar sociedades por acciones sin carta real.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_restrain_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_restrain').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_LEVER_ENCOURAGE_TT: "#header Fomentar la inversión en [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n#italic Despertar el interés de los inversores por un [concept_good] que ignoran.#!\n\nEl [concept_spec_investor_interest] sube a #v Interesado#! en unos meses\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_UP', 'SPEC_LEVER_NONE')][concept_budget_additional_expenses]: #N @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_subsidy_', Goods.GetKey))|D]#! por semana (#v 20%#! de lo que producen, a precio base)\nTermina sola cuando el [concept_good] pasa a #v Ávido#!\n\nInmoviliza #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#! de [concept_authority] mientras está en vigor, sin pagarse de nuevo cada mes. La recuperamos al retirar la medida#indent_newline:3 \n#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! para este [concept_good] normalmente, lo mismo que medio impuesto al consumo sobre él\n#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! según cuánto lo comerciamos (#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! de nuestro mercado)#!\n\n#lore A mediados del siglo XIX, la India británica y Francia garantizaban a los inversores ferroviarios un rendimiento fijo sobre su capital.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_encourage_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_encourage').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_LEVER_TP_DOWN: "[concept_throughput] de sus productores: #N -10%#!\n"
 SPEC_LEVER_TP_UP: "[concept_throughput] de sus productores: #P +10%#!\n"
 SPEC_LEVER_LIFT: "\n\nEn vigor\n#instruction Haz clic para retirarla#!"
 SPEC_LEVER_NONE: ""
 SPEC_LEVERS_RIGHT: "[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_levers_used'), '(CFixedPoint)0'), SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_levers_used'), '(CFixedPoint)1'), 'SPEC_LEVERS_ONE', 'SPEC_LEVERS_MANY'), 'SPEC_LEVER_NONE')]"
 SPEC_LEVERS_ONE: "1 intervención: #N -[Country.MakeScope.ScriptValue('spec_lever_authority')|0]#! @aut!"
 SPEC_LEVERS_MANY: "[Country.MakeScope.ScriptValue('spec_levers_used')|0] intervenciones: #N -[Country.MakeScope.ScriptValue('spec_lever_authority')|0]#! @aut!"
 concept_spec_intervention: "Intervención"
 concept_spec_intervention_desc: "@spec_intervention! Con una $concept_spec_intervention$ tu gobierno interviene en el mercado de un [concept_good]. Puedes #v Contener la especulación#! en él o #v Fomentar la inversión#! en él.\n\n#v Contener la especulación#! enfría el [concept_spec_investor_interest] hasta #v Sereno#!. Sus productores pierden un #N 10%#! de [concept_throughput] y pagan cada semana un gravamen del #v 10%#! de lo que producen, a precio base.\n\n#v Fomentar la inversión#! calienta el interés hasta #v Interesado#!. Sus productores ganan un #P 10%#! de $concept_throughput$ y reciben una subvención del #v 20%#! de lo que producen.\n\nCada una cuesta [concept_authority] cada mes hasta que la retiras. Los bienes básicos cuestan más, y también los $concept_goods$ que suponen una gran parte del comercio del [concept_market]."
 SPEC_LEVER_ISSUE_TT: "#header Lanzar una gran emisión en [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n#italic Venda acciones de un [concept_good] en auge en nuestra Bolsa. Grandes recompensas, grandes riesgos.#!\n\nDurante #v 2#! años:\nPuntuación de [Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]: #P +25%#!\nCuando termine su auge, los préstamos bancarios en él harán #N x1.5#! de daño\nCuando termine su auge, la reputación ganada o perdida será #v x2#!\n$TOOLTIP_DELIMITER$\nSolo una a la vez, con al menos #v 1#! año entre ellas[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_issue_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_ISSUE_ON', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_issue').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_ISSUE_ON: "\n\nHay una emisión en curso sobre este [concept_good]"
 spec_issue_stand_tt: "Nuestra [concept_spec_exchange] tiene rango #v Nacional#! o superior"
 spec_issue_hot_tt: "El [concept_spec_investor_interest] es #v Ávido#! o mayor"
 spec_issue_one_tt: "No hay otra emisión en curso"
 spec_issue_cool_tt: "El mercado ha descansado un año desde la última emisión"
 spec_issue_no_lever_tt: "No hay ninguna [concept_spec_intervention] en vigor sobre este [concept_good]"
 spec_lever_no_issue_tt: "No hay ninguna gran emisión en curso sobre este [concept_good]"
 SPEC_LEVERS_TT: "#header Intervenciones bursátiles#!\n$TOOLTIP_DELIMITER$\n#italic Bienes en los que nuestro gobierno está enfriando o calentando el mercado.#!\n\nCuesta #N -[Country.MakeScope.ScriptValue('spec_lever_authority')|0]#! de [concept_authority] al mes\nContenidos: #v [Country.MakeScope.ScriptValue('spec_n_restrain')|0]#!\nFomentados: #v [Country.MakeScope.ScriptValue('spec_n_encourage')|0]#!\n[concept_budget_additional_income]: #P @money![Country.MakeScope.ScriptValue('spec_lever_levy')|D]#! a la semana\n[concept_budget_additional_expenses]: #N @money![Country.MakeScope.ScriptValue('spec_lever_spend')|D]#! a la semana"
 spec_story.1.t: "El mercado de [ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName] se desploma"
 spec_story.1.t_generic: "Un mercado se desploma"
 spec_story.1.d: "La fiebre por [ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName] ha terminado. Los precios que subieron durante un año han caído en un mes, y las compañías que salieron a bolsa en el apogeo de la fiebre no pueden pagar sus facturas. Los mercaderes que compraban a cualquier precio se han quedado con almacenes que no pueden vaciar, y los bancos que prestaron contra sus existencias hacen cuentas de las pérdidas."
 spec_story.1.d_generic: "La fiebre por los bienes predilectos de la temporada ha terminado. Los precios que subieron durante un año han caído en un mes, y las compañías que salieron a bolsa en el apogeo de la fiebre no pueden pagar sus facturas. Los mercaderes que compraban a cualquier precio se han quedado con almacenes que no pueden vaciar, y los bancos que prestaron contra sus existencias hacen cuentas de las pérdidas."
 spec_story.1.f: "«Llevo treinta años en el comercio de [ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName], y jamás había visto hombres tan ansiosos por comprar ni tan desesperados por vender como en estos doce meses»."
 spec_story.1.f_generic: "«Llevo treinta años en este comercio, y jamás había visto hombres tan ansiosos por comprar ni tan desesperados por vender como en estos doce meses»."
 spec_story.1.a: "Extendamos el socorro a los productores arruinados."
 spec_story.1.b: "Dejemos que quiebren las casas más débiles."
 spec_story.1.c: "Investiguemos a los promotores."
 spec_story.2.t: "Una estafa al descubierto"
 spec_story.2.d: "Los directores de la compañía de [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] de [ROOT.GetCountry.GetCapital.GetCityHubName] han huido del país, y sus libros revelan que los generosos dividendos de los dos últimos años se pagaban con las nuevas suscripciones. Miles de oficinistas, viudas y comerciantes tenían sus acciones. Todos los periódicos de [ROOT.GetCountry.GetCapital.GetCityHubName] preguntan ahora cuántos otros prospectos salieron de la misma mano."
 spec_story.2.d_generic: "Los directores de una célebre sociedad por acciones de [ROOT.GetCountry.GetCapital.GetCityHubName] han huido del país, y sus libros revelan que los generosos dividendos de los dos últimos años se pagaban con las nuevas suscripciones. Miles de oficinistas, viudas y comerciantes tenían sus acciones. Todos los periódicos de [ROOT.GetCountry.GetCapital.GetCityHubName] preguntan ahora cuántos otros prospectos salieron de la misma mano."
 spec_story.2.f: "#bold Se busca por fraude#!\nAl director gerente de la compañía de [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] de [ROOT.GetCountry.GetCapital.GetCityHubName], de unos cincuenta años, bien vestido y de modales convincentes. Visto por última vez en los muelles."
 spec_story.2.f_generic: "#bold Se busca por fraude#!\nAl director gerente de una sociedad por acciones de [ROOT.GetCountry.GetCapital.GetCityHubName], de unos cincuenta años, bien vestido y de modales convincentes. Visto por última vez en los muelles."
 spec_story.2.a: "Procesemos a los directores."
 spec_story.2.b: "Silenciemos el asunto."
 spec_story.2.c: "Indemnicemos a los pequeños inversores."
 spec_story.3.t: "Retirada masiva de depósitos"
 spec_story.3.d: "Los depositantes han asediado esta mañana uno de los bancos más antiguos de [ROOT.GetCountry.GetCapital.GetCityHubName], y al mediodía sus puertas ya estaban cerradas. Sus billetes se rechazan por toda la ciudad, y las firmas que tenían allí sus cuentas no pueden pagar a sus obreros esta semana. Las colas ante los demás bancos crecen de hora en hora."
 spec_story.3.f: "«Mi padre guardaba sus ahorros en ese banco, y antes que él, su padre. Nos dijeron que era tan seguro como el Tesoro»."
 spec_story.3.a: "Garanticemos sus depósitos."
 spec_story.3.b: "Debe sostenerse o caer por sí solo."
 spec_story.3.c: "Debemos apoyar a los bancos."
 spec_story.4.t: "Pánico en [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]"
 spec_story.4.t_generic: "Pánico extranjero"
 spec_story.4.d: "Han llegado a [ROOT.GetCountry.GetCapital.GetCityHubName] noticias de un [concept_spec_financial_panic] en [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]. Sus bancos exigen la devolución de sus préstamos en el extranjero, y nuestras firmas que vendían a [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] o se endeudaban allí se han quedado de pronto sin dinero. Todos los mercaderes de la bolsa quieren saber si el mal se extenderá."
 spec_story.4.d_generic: "Han llegado a [ROOT.GetCountry.GetCapital.GetCityHubName] noticias de un pánico financiero en el extranjero. Los bancos extranjeros exigen la devolución de sus préstamos, y nuestras firmas que vendían o se endeudaban fuera se han quedado de pronto sin dinero. Todos los mercaderes de la bolsa quieren saber si el mal se extenderá."
 spec_story.4.f: "«Cuando [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] estornuda, nuestra bolsa se mete en cama»."
 spec_story.4.f_generic: "«Cuando nuestros vecinos estornudan, nuestra bolsa se mete en cama»."
 spec_story.4.a: "Prestemos a nuestras casas mercantiles."
 spec_story.4.b: "Sus problemas no son los nuestros."
 spec_story.4.c: "Culpemos a los imprudentes banqueros extranjeros."
 spec_story.5.t: "Vuelve la confianza"
 spec_story.5.d: "Lo peor del pánico ha pasado. Las firmas que sobrevivieron vuelven a contratar obreros, los bancos han empezado a prestar a clientes solventes y unos pocos inversores audaces compran acciones por una fracción del precio del año pasado. Nadie espera volver pronto a los antiguos excesos, pero [ROOT.GetCountry.GetCapital.GetCityHubName] vuelve a hacer negocios."
 spec_story.5.f: "«Los hombres que lo vendieron todo en primavera lo recompran en otoño, y a mejor precio del que vendieron»."
 spec_story.5.a: "Fomentemos nuevas empresas."
 spec_story.5.b: "Esta vez los préstamos deben ser prudentes."
 spec_story.6.t: "La delegación de fabricantes"
 spec_story.6.d: "Una delegación de fabricantes y mercaderes ha visitado al gobierno. Dicen que sus nuevas fábricas quedan a medio terminar por falta de crédito, mientras sus rivales extranjeros toman préstamos sin trabas y les arrebatan los mercados. Piden que se permita a los bancos volver a prestar."
 spec_story.6.f: "«Su prudencia, señor, nos ha salvado de un desplome asegurándose de que no quede nada que pueda desplomarse»."
 spec_story.6.a: "Facilitemos el crédito."
 spec_story.6.b: "El crédito seguirá siendo restrictivo."
 spec_story.6.c: "Ofrezcámosles una subvención en su lugar."
 spec_story.7.t: "Fiebre por las acciones"
 spec_story.7.d: "Oficinistas, comerciantes y maestros abarrotan los cafés de [ROOT.GetCountry.GetCapital.GetCityHubName] para negociar acciones de compañías que jamás han visto. Las acciones de empresas de [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] cambian de manos varias veces al día, la mayoría compradas con dinero prestado. Se dice que los criados empeñan su ropa de domingo para tener parte en la próxima emisión."
 spec_story.7.d_generic: "Oficinistas, comerciantes y maestros abarrotan los cafés de [ROOT.GetCountry.GetCapital.GetCityHubName] para negociar acciones de compañías que jamás han visto. Las acciones de las empresas más recientes cambian de manos varias veces al día, la mayoría compradas con dinero prestado. Se dice que los criados empeñan su ropa de domingo para tener parte en la próxima emisión."
 spec_story.7.f: "«Esta mañana mi barbero me dio un consejo sobre acciones de [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName]. Lo acepté y le di otro a cambio: vende»."
 spec_story.7.f_generic: "«Esta mañana mi barbero me dio un consejo sobre acciones. Lo acepté y le di otro a cambio: vende»."
 spec_story.7.a: "Que el pueblo participe de la riqueza."
 spec_story.7.b: "Prohibamos negociar con dinero prestado."
 spec_story.7.c: "Gravemos las transferencias de acciones con un impuesto de timbre."
 spec_story.8.t: "Advertencias de una burbuja"
 spec_story.8.d: "Un respetado economista ha escrito al principal periódico de [ROOT.GetCountry.GetCapital.GetCityHubName] que la subida de [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] y [ROOT.GetCountry.MakeScope.Var('spec_story_good2').GetGoods.GetName] no puede durar y que los bancos han prestado contra precios que ningún hombre sensato pagaría. Los corredores lo tachan de lamentos de vieja. Sin embargo, la carta se lee en voz alta en todos los clubes y casas de comercio de la ciudad."
 spec_story.8.d_generic: "Un respetado economista ha escrito al principal periódico de [ROOT.GetCountry.GetCapital.GetCityHubName] que la subida de los bienes más favorecidos del momento no puede durar y que los bancos han prestado contra precios que ningún hombre sensato pagaría. Los corredores lo tachan de lamentos de vieja. Sin embargo, la carta se lee en voz alta en todos los clubes y casas de comercio de la ciudad."
 spec_story.8.f: "«Un precio no es sino lo que el último comprador estuvo dispuesto a pagar. Ruego a mis lectores que consideren cuántos compradores quedan»."
 spec_story.8.a: "La advertencia llega a tiempo."
 spec_story.8.b: "Disparates alarmistas."
 spec_story.6.a.tt: "La [concept_spec_credit_policy] pasa a ser #v Normal#! y queda fijada durante #v 6#! meses"
