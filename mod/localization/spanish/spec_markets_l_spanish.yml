 spec_depression.1.t: "La $SPEC_LD_NAME$"
 spec_depression.1.d: "Los pánicos de las bolsas del mundo se han fundido en uno solo. El crédito ha dejado de circular entre las grandes casas, los precios caen en todas partes a la vez y los pedidos que mantenían ocupadas nuestras fábricas y minas se cancelan por telégrafo. Cada mercado se apoya en los demás y todos caen juntos.\n\nLa caída durará unos meses y después vendrá una larga depresión. La rapidez de nuestra recuperación dependerá de lo que hagamos ahora y de lo que hagan las [Concept('concept_great_power','$concept_great_powers|q$')]."
 spec_depression.1.f: "«Ya hemos sufrido pánicos. Esta vez el dinero no tiene adónde huir»."
 spec_depression.1.a: "Debemos reducir gastos."
 spec_depression.1.b: "Estabilicemos las bolsas."
 spec_depression.2.t: "Un muro de aranceles"
 spec_depression.2.d: "Los dueños de nuestras mayores fábricas han presentado una petición al gobierno, y los grandes terratenientes se han sumado a ellos. Dicen que los bienes extranjeros y el grano extranjero barato se venden en nuestros mercados a cualquier precio que puedan conseguir sus productores, y que nuestras propias fábricas y fincas no logran vender a un precio que cubra los salarios. Piden aranceles más altos para todo lo que compita con la industria y las cosechas nacionales.\n\nLa protección ampararía nuestra recuperación, pero perjudicaría a nuestros socios comerciales y, con ellos, a la recuperación mundial."
 spec_depression.2.f: "«Cada nación levanta un muro en torno a su mercado, y todas se preguntan por qué no se recuperan sus exportaciones»."
 spec_depression.2.a: "Protejamos nuestra industria."
 spec_depression.2.b: "Mantengamos abiertos nuestros mercados."
 spec_depression.3.t: "Obras asistenciales"
 spec_depression.3.d: "Miles de hombres permanecen sin trabajo en [ROOT.GetCountry.GetCapital.GetCityHubName], y los fondos de socorro se han agotado. Los ingenieros municipales tienen una lista de obras que podrían emplearlos, desde desagües y caminos hasta terraplenes y un nuevo mercado cubierto, si el tesoro accede a pagarlas."
 spec_depression.3.f: "«Un hombre que cava un desagüe a cambio de su jornal no es un mendigo, y lo sabe»."
 spec_depression.3.a: "Financiemos las obras."
 spec_depression.3.b: "La caridad es un asunto privado."
 spec_depression.4.t: "Los bancos bajo asedio"
 spec_depression.4.d: "Se ha corrido la voz de que los bancos de [ROOT.GetCountry.GetCapital.GetCityHubName] prestaron grandes sumas a firmas que ahora quiebran. Desde la mañana, los depositantes hacen cola para retirar sus ahorros; al caer la tarde, los bancos no tendrán moneda con que pagarles. Sus directores piden al gobierno que actúe."
 spec_depression.4.f: "«Un banco es perfectamente sólido hasta que todos creen que no lo es»."
 spec_depression.4.a: "Decretemos un cierre bancario temporal."
 spec_depression.4.b: "Rescatemos a los bancos."
 spec_depression.4.c: "Dejemos que quiebren."
 spec_depression.5.t: "La cuestión monetaria"
 spec_depression.5.d: "La caída de los precios ha dividido al país. Los agricultores y los pequeños deudores dicen que el dinero se ha encarecido demasiado y que cada deuda pesa más con cada año de bajada de precios. Quieren que se emita más dinero y se facilite el crédito. Los banqueros y acreedores responden que solo una moneda sólida devolverá la confianza a los inversores nacionales y extranjeros."
 spec_depression.5.f: "«Mi hipoteca es la misma que hace cinco años. Mi trigo se vende por la mitad»."
 spec_depression.5.a: "Una moneda sólida ante todo."
 spec_depression.5.b: "Facilitemos el crédito."
 spec_depression.6.t: "Marcha de los desempleados"
 spec_depression.6.d: "Una columna de desempleados ha marchado hasta [ROOT.GetCountry.GetCapital.GetCityHubName] tras pancartas que rezan «Trabajo o pan». Han acampado ante las oficinas del gobierno y piden presentar una petición. La policía afirma que puede despejar la plaza antes de que anochezca."
 spec_depression.6.f: "«No pedimos caridad. Pedimos trabajo»."
 spec_depression.6.a: "Dispersémoslos."
 spec_depression.6.b: "Escuchemos su petición."
 spec_depression.7.t: "Peticiones de reforma"
 spec_depression.7.d: "Los periódicos preguntan por qué ha durado tanto la depresión y quién se enriqueció con la especulación que la precedió. Miembros de la cámara han reclamado una investigación sobre los bancos, las bolsas y la conducta del propio gobierno."
 spec_depression.7.f: "«La cuestión ya no es si el sistema falló, sino quién responderá por ello»."
 spec_depression.7.a: "Abramos una investigación."
 spec_depression.7.b: "El sistema es sólido."
 spec_depression.8.t: "La $SPEC_LD_NAME$ remite"
 spec_depression.8.d: "Por primera vez en años, llegan más pedidos de los que se cancelan. Los precios han tocado fondo, los bancos vuelven a prestar y las fábricas que estaban paradas contratan obreros. La depresión ha terminado, aunque pocos de quienes la vivieron la olvidarán pronto."
 spec_depression.8.f: "«Dicen que mejora el comercio. Lo creeré cuando lo diga mi propio libro de pedidos»."
 spec_depression.8.a: "Hemos aprendido la lección."
 spec_depression.8.b: "Volvamos a los negocios."
