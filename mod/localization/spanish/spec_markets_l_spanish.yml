 spec_rival.1.t11: "¡Ataque bajista contra #v [ROOT.GetCountry.GetCapital.GetCityHubName]#!!"
 spec_rival.1.d11: "Antes del toque de apertura, corredores que actuaban por cuenta de #v [SCOPE.sCountry('target').GetName]#! arrojaron de golpe al parqué grandes paquetes de nuestras acciones ferroviarias y bancarias. Los precios se hundieron, los teletipos se quedaron atrás y a mediodía nuestros propios empleados vendían asustados.\n\nNuestra [concept_spec_market_confidence] caerá #N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#! en 6 meses."
 spec_rival.1.f11: "\"Una corrida contra el mercado puede empezar con un solo rumor.\""
 spec_rival.1.t10: "El asalto fallido"
 spec_rival.1.d10: "Corredores que actuaban por cuenta de #v [SCOPE.sCountry('target').GetName]#! arrojaron de golpe nuestras acciones al parqué, esperando una desbandada. En cambio, nuestros bancos compraron cada lote ofrecido, los precios aguantaron y, al toque de cierre, eran los asaltantes quienes lamían sus pérdidas.\n\nSu propia [concept_spec_market_confidence] cae #P 3#! en 6 meses."
 spec_rival.1.f10: "\"Al oso que vende lo que no tiene, más le vale acertar.\""
 spec_rival.1.t21: "Cortejan nuestro capital"
 spec_rival.1.d21: "Agentes de #v [SCOPE.sCountry('target').GetName]#! se han alojado en nuestros mejores hoteles, y nuestros mayores inversores cenan con ellos cada noche. Su oferta es sencilla, un tipo mejor, un puerto más seguro y ninguna pregunta incómoda.\n\nDurante 12 meses, el #N [GetPlayer.MakeScope.Var('spec_rv_lure_share').GetValue|%0]#! de los ingresos de nuestro [concept_investment_pool] va a parar a ellos."
 spec_rival.1.f21: "\"El capital va adonde lo tratan bien y se queda donde lo alimentan bien.\""
 spec_rival.1.t31: "Una campaña de rumores"
 spec_rival.1.d31: "Los diarios matutinos de #v [SCOPE.sCountry('target').GetName]#! publican largas columnas sobre balances falsificados y bancos tambaleantes en #v [ROOT.GetCountry.GetCapital.GetCityHubName]#!. Ninguna va firmada y pocas son ciertas, pero se leen en todas las casas de comercio del continente.\n\nNuestra [concept_spec_exchange] pierde #N [Multiply_CFixedPoint('(CFixedPoint)0.0167', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|%0]#! de reputación."
 spec_rival.1.f31: "\"Una mentira da media vuelta al mundo mientras la verdad todavía se calza las botas.\""
 spec_rival.1.t3n: "Una campaña pagada, al descubierto"
 spec_rival.1.d3n: "Los periódicos de #v [SCOPE.sCountry('target').GetName]#! estaban llenos de dudas sobre nuestra [concept_spec_exchange]. Pero un empleado habló, y ahora todos saben con qué dinero se pagó la tinta.\n\nPerdemos reputación, pero ellos también, y su nombre sufre en el extranjero."
 spec_rival.1.f3n: "\"El barro lanzado a oscuras igual ensucia las manos.\""
 spec_rival.1.t: "Un competidor se mueve contra nosotros"
 spec_rival.1.f: "\"Una corrida contra el mercado puede empezar con un solo rumor.\""
 spec_rival.1.a: "Paguémosles con la misma moneda."
 spec_rival.1.a_tt: "Hacemos lo mismo con ellos, aunque ya lo hayamos hecho este año."
 spec_rival.1.a_1: "#v Ataque bajista#! contra ellos:"
 spec_rival.1.a_2: "#v Atraer su capital#!:"
 spec_rival.1.a_3: "#v Campaña de prensa#! contra ellos:"
 spec_rival.1.b: "Cerremos filas contra ellos."
 spec_rival.1.b_tt: "Durante 12 meses sus acciones contra nosotros tienen la mitad de efecto. Cuesta @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]."
 spec_rival.1.c: "Sigamos como si nada."
 spec_rival.1.c_tt: "Nuestra [concept_spec_exchange] gana #P [Multiply_CFixedPoint('(CFixedPoint)0.01', Add_CFixedPoint('(CFixedPoint)1', Multiply_CFixedPoint('(CFixedPoint)1', SCOPE.sCountry('target').MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'))))|%0]#! de reputación por mantener la calma. Cuanto mayor sea la Bolsa a la que ignoramos, más cuenta."
 spec_rival.1.d: "Compremos en pleno pánico."
 spec_rival.1.d_tt: "Nuestros bancos compran lo que venden los atacantes. El ataque quita #P la mitad#! de [concept_spec_market_confidence]. Cuesta #N @money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rv_counter_cost')|D]#! (#v 1%#! de nuestro PIB)."
 spec_rival.1.e: "Igualemos sus condiciones."
 spec_rival.1.e_tt: "Pagamos a nuestros inversores para que se queden. Se llevan #P la mitad#! de nuestro [concept_investment_pool]. Cuesta #N @money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rv_counter_cost')|D]#! (#v 1%#! de nuestro PIB)."
 spec_rival.1.g: "Respondamos en nuestros propios periódicos."
 spec_rival.1.g_tt: "Nuestros periódicos publican las cifras. Nuestra [concept_spec_exchange] recupera un #P 1%#! de reputación. Cuesta #N @money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rv_counter_cost')|D]#! (#v 1%#! de nuestro PIB)."
 SPEC_DRIVER_RIVAL: "Acciones de competidores"
 SPEC_DRIVER_RIVAL_TT: "#header Acciones de competidores: [Country.MakeScope.Var('spec_c_rival').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#italic El ataque bajista de un competidor contra nuestro mercado, repartido en seis meses.#!\n#instruction Los ataques pueden costarnos como mucho #v 4#! de confianza al año, vengan los que vengan.#!"
 spec_rival.1.d11_big: "La gran Bolsa de #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! por fin se ha fijado en nosotros, y no le gusta lo que ve.\n\nAntes del toque de apertura, corredores que actuaban por cuenta de #v [SCOPE.sCountry('target').GetName]#! arrojaron de golpe al parqué grandes paquetes de nuestras acciones ferroviarias y bancarias. Los precios se hundieron, los teletipos se quedaron atrás y a mediodía nuestros propios empleados vendían asustados.\n\nNuestra [concept_spec_market_confidence] caerá #N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#! en 6 meses."
 spec_rival.1.d11_even: "Desde hace años, las Bolsas de #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! y #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! se vigilan mutuamente. Era solo cuestión de tiempo.\n\nAntes del toque de apertura, corredores que actuaban por cuenta de #v [SCOPE.sCountry('target').GetName]#! arrojaron de golpe al parqué grandes paquetes de nuestras acciones ferroviarias y bancarias. Los precios se hundieron, los teletipos se quedaron atrás y a mediodía nuestros propios empleados vendían asustados.\n\nNuestra [concept_spec_market_confidence] caerá #N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#! en 6 meses."
 spec_rival.1.d11_small: "Los advenedizos de #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! han decidido que hay que bajarle los humos a #v [ROOT.GetCountry.GetCapital.GetCityHubName]#!.\n\nAntes del toque de apertura, corredores que actuaban por cuenta de #v [SCOPE.sCountry('target').GetName]#! arrojaron de golpe al parqué grandes paquetes de nuestras acciones ferroviarias y bancarias. Los precios se hundieron, los teletipos se quedaron atrás y a mediodía nuestros propios empleados vendían asustados.\n\nNuestra [concept_spec_market_confidence] caerá #N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#! en 6 meses."
 spec_rival.1.d10_big: "La gran Bolsa de #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! por fin se ha fijado en nosotros, y no le gusta lo que ve.\n\nCorredores que actuaban por cuenta de #v [SCOPE.sCountry('target').GetName]#! arrojaron de golpe nuestras acciones al parqué, esperando una desbandada. En cambio, nuestros bancos compraron cada lote ofrecido, los precios aguantaron y, al toque de cierre, eran los asaltantes quienes lamían sus pérdidas.\n\nSu propia [concept_spec_market_confidence] cae #P 3#! en 6 meses."
 spec_rival.1.d10_even: "Desde hace años, las Bolsas de #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! y #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! se vigilan mutuamente. Era solo cuestión de tiempo.\n\nCorredores que actuaban por cuenta de #v [SCOPE.sCountry('target').GetName]#! arrojaron de golpe nuestras acciones al parqué, esperando una desbandada. En cambio, nuestros bancos compraron cada lote ofrecido, los precios aguantaron y, al toque de cierre, eran los asaltantes quienes lamían sus pérdidas.\n\nSu propia [concept_spec_market_confidence] cae #P 3#! en 6 meses."
 spec_rival.1.d10_small: "Los advenedizos de #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! han decidido que hay que bajarle los humos a #v [ROOT.GetCountry.GetCapital.GetCityHubName]#!.\n\nCorredores que actuaban por cuenta de #v [SCOPE.sCountry('target').GetName]#! arrojaron de golpe nuestras acciones al parqué, esperando una desbandada. En cambio, nuestros bancos compraron cada lote ofrecido, los precios aguantaron y, al toque de cierre, eran los asaltantes quienes lamían sus pérdidas.\n\nSu propia [concept_spec_market_confidence] cae #P 3#! en 6 meses."
 spec_rival.1.d21_big: "La gran Bolsa de #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! por fin se ha fijado en nosotros, y no le gusta lo que ve.\n\nAgentes de #v [SCOPE.sCountry('target').GetName]#! se han alojado en nuestros mejores hoteles, y nuestros mayores inversores cenan con ellos cada noche. Su oferta es sencilla, un tipo mejor, un puerto más seguro y ninguna pregunta incómoda.\n\nDurante 12 meses, el #N [GetPlayer.MakeScope.Var('spec_rv_lure_share').GetValue|%0]#! de los ingresos de nuestro [concept_investment_pool] va a parar a ellos."
 spec_rival.1.d21_even: "Desde hace años, las Bolsas de #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! y #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! se vigilan mutuamente. Era solo cuestión de tiempo.\n\nAgentes de #v [SCOPE.sCountry('target').GetName]#! se han alojado en nuestros mejores hoteles, y nuestros mayores inversores cenan con ellos cada noche. Su oferta es sencilla, un tipo mejor, un puerto más seguro y ninguna pregunta incómoda.\n\nDurante 12 meses, el #N [GetPlayer.MakeScope.Var('spec_rv_lure_share').GetValue|%0]#! de los ingresos de nuestro [concept_investment_pool] va a parar a ellos."
 spec_rival.1.d21_small: "Los advenedizos de #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! han decidido que hay que bajarle los humos a #v [ROOT.GetCountry.GetCapital.GetCityHubName]#!.\n\nAgentes de #v [SCOPE.sCountry('target').GetName]#! se han alojado en nuestros mejores hoteles, y nuestros mayores inversores cenan con ellos cada noche. Su oferta es sencilla, un tipo mejor, un puerto más seguro y ninguna pregunta incómoda.\n\nDurante 12 meses, el #N [GetPlayer.MakeScope.Var('spec_rv_lure_share').GetValue|%0]#! de los ingresos de nuestro [concept_investment_pool] va a parar a ellos."
 spec_rival.1.d31_big: "La gran Bolsa de #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! por fin se ha fijado en nosotros, y no le gusta lo que ve.\n\nLos diarios matutinos de #v [SCOPE.sCountry('target').GetName]#! publican largas columnas sobre balances falsificados y bancos tambaleantes en #v [ROOT.GetCountry.GetCapital.GetCityHubName]#!. Ninguna va firmada y pocas son ciertas, pero se leen en todas las casas de comercio del continente.\n\nNuestra [concept_spec_exchange] pierde #N [Multiply_CFixedPoint('(CFixedPoint)0.0167', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|%0]#! de reputación."
 spec_rival.1.d31_even: "Desde hace años, las Bolsas de #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! y #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! se vigilan mutuamente. Era solo cuestión de tiempo.\n\nLos diarios matutinos de #v [SCOPE.sCountry('target').GetName]#! publican largas columnas sobre balances falsificados y bancos tambaleantes en #v [ROOT.GetCountry.GetCapital.GetCityHubName]#!. Ninguna va firmada y pocas son ciertas, pero se leen en todas las casas de comercio del continente.\n\nNuestra [concept_spec_exchange] pierde #N [Multiply_CFixedPoint('(CFixedPoint)0.0167', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|%0]#! de reputación."
 spec_rival.1.d31_small: "Los advenedizos de #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! han decidido que hay que bajarle los humos a #v [ROOT.GetCountry.GetCapital.GetCityHubName]#!.\n\nLos diarios matutinos de #v [SCOPE.sCountry('target').GetName]#! publican largas columnas sobre balances falsificados y bancos tambaleantes en #v [ROOT.GetCountry.GetCapital.GetCityHubName]#!. Ninguna va firmada y pocas son ciertas, pero se leen en todas las casas de comercio del continente.\n\nNuestra [concept_spec_exchange] pierde #N [Multiply_CFixedPoint('(CFixedPoint)0.0167', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|%0]#! de reputación."
 spec_rival.1.d3n_big: "La gran Bolsa de #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! por fin se ha fijado en nosotros, y no le gusta lo que ve.\n\nLos periódicos de #v [SCOPE.sCountry('target').GetName]#! estaban llenos de dudas sobre nuestra [concept_spec_exchange]. Pero un empleado habló, y ahora todos saben con qué dinero se pagó la tinta.\n\nPerdemos reputación, pero ellos también, y su nombre sufre en el extranjero."
 spec_rival.1.d3n_even: "Desde hace años, las Bolsas de #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! y #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! se vigilan mutuamente. Era solo cuestión de tiempo.\n\nLos periódicos de #v [SCOPE.sCountry('target').GetName]#! estaban llenos de dudas sobre nuestra [concept_spec_exchange]. Pero un empleado habló, y ahora todos saben con qué dinero se pagó la tinta.\n\nPerdemos reputación, pero ellos también, y su nombre sufre en el extranjero."
 spec_rival.1.d3n_small: "Los advenedizos de #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! han decidido que hay que bajarle los humos a #v [ROOT.GetCountry.GetCapital.GetCityHubName]#!.\n\nLos periódicos de #v [SCOPE.sCountry('target').GetName]#! estaban llenos de dudas sobre nuestra [concept_spec_exchange]. Pero un empleado habló, y ahora todos saben con qué dinero se pagó la tinta.\n\nPerdemos reputación, pero ellos también, y su nombre sufre en el extranjero."
