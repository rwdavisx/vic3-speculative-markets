 SPEC_CENTRE_N_NONE: "-"
 SPEC_CENTRE_TT_OWN: "#header [Country.GetName]#!\nNo es una de las #v 5#! [Concept('concept_spec_financial_centre','$concept_spec_financial_centres|q$')] del mundo\n$TOOLTIP_DELIMITER$\nPuntos: #v [Country.MakeScope.Var('spec_centre_score').GetValueWithDefault('(CFixedPoint)0')|0]#!\n[concept_spec_exchange] Rango: $SPEC_CENTRE_STAND$\nReputación: #v $SPEC_EXCH_TRUST$#!\nAños sin [concept_spec_financial_panic]: $SPEC_CENTRE_CALM$"
 spec_financial_centre: "Bolsa principal"
 spec_financial_centre_desc: "La [concept_spec_exchange] del [concept_country] es una de las [Concept('concept_spec_financial_centre','$concept_spec_financial_centres|q$')] del mundo, y el capital la busca desde todas partes."
