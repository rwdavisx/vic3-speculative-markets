 SPEC_RISKS_TT: "#header Riesgos#!\n$TOOLTIP_DELIMITER$\n#italic Lo que podría hacer caer nuestra [concept_spec_market_confidence]. Cuanto mayor es el número rojo, más duro es el golpe.#!\n\n#b Auges amenazados#! muestra el golpe si termina uno de nuestros auges\n#b Riesgo de pánico#! muestra el golpe si un pánico en un mercado vinculado al nuestro se extiende hasta nosotros\n#b Riesgo de guerra#! muestra el golpe si una [concept_diplomatic_play] se convierte en guerra\n#b Riesgo de impago#! muestra el golpe si nos endeudamos más allá de nuestro [Concept('concept_credit','$concept_credit_limit|q$')]\n#b Burbuja#! muestra el golpe si nuestro $concept_spec_speculative_excess$ estalla\n$TOOLTIP_DELIMITER$\n#instruction Pase el cursor sobre cada uno para ver qué hay detrás#!"
 SPEC_RISK_1: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_risk_top').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_RISK_1_V', 'SPEC_CHIP_ZERO')]"
 SPEC_RISK_1_V: "#N -[Min_CFixedPoint(Country.MakeScope.Var('spec_risk_top').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'))|0]#!"
