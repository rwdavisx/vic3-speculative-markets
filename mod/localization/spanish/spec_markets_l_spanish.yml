 alert_spec_bubble_alert_name: "Exceso especulativo"
 spec_bubble_alert_setting_name: "Exceso especulativo"
 alert_spec_bubble_alert_desc: "Nuestro [concept_spec_speculative_excess] es de #v [GetPlayer.MakeScope.Var('spec_heat').GetValue|0]#!. Esta es la burbuja.\n\n#N Estalla#! si la [concept_spec_market_confidence] baja de #v 60#!\nSi estallara ahora: #N -[GetPlayer.MakeScope.ScriptValue('spec_burst_now')|0]#! de $concept_spec_market_confidence$ de golpe"
 alert_spec_bubble_alert_hint: "Para desinflarla con suavidad, contenga los bienes en auge o endurezca la [concept_spec_credit_policy].\n#P Crece#! mientras la [concept_spec_market_confidence] está en #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! o más\n#v Se reduce#! despacio mientras está entre #v 60#! y #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!"
 alert_spec_bubble_alert_action: "Diario"
 alert_spec_rescue_alert_name: "Rescate bancario disponible"
 spec_rescue_alert_setting_name: "Rescate bancario disponible"
 alert_spec_rescue_alert_desc: "Hay un [concept_spec_financial_panic] en curso y aún no hemos prestado a los bancos."
 alert_spec_rescue_alert_hint: "Use #v Prestar a los bancos#! en la pestaña #bold $SPEC_FIN_TAB_BANKING$#! de la ventana #bold $SPEC_FINANCE$#!. Una vez por pánico.\n#P Termina#! antes el pánico\n#P Reduce a la mitad#! sus penalizaciones durante los meses que le quedan\n[concept_spec_market_confidence] #P +20#!\n\n#weak No reduce los pagos de $spec_panic_relief$, no liquida las [concept_spec_bad_debts] ni recupera a la gente ya radicalizada#!"
 alert_spec_rescue_alert_action: "Diario"
