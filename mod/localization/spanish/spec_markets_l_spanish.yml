 concept_spec_long_depression_desc: "@spec_long_depression! La $concept_spec_long_depression$ es una crisis de toda la economía mundial. Comienza cuando una [concept_great_power] cae en un [concept_spec_financial_panic]. Después alcanza a todos los países que ya están en pánico, y se propaga por los vínculos estrechos, como un [concept_market] compartido, súbditos y soberanos, derechos de inversión, comercio intenso y propiedad extranjera.\n\nDurante la caída mundial (#v 4#! meses), el crédito se congela y la [concept_spec_market_confidence] se agota.\nDurante la depresión (hasta #v 5#! años), la inversión, la construcción y el comercio se frenan, y parte de la población se vuelve [Concept('concept_radical','$concept_radicals|q$')].\nDurante la recuperación (#v 1#! año), vuelve la $concept_spec_market_confidence$.\n\nTus decisiones aceleran tu propia recuperación y la del mundo. Las de una $concept_great_power$ son las que más cuentan."
 je_spec_depression: "La $SPEC_LD_NAME$"
