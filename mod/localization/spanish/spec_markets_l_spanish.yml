 SPEC_RISK_2_NONE: "#header Riesgo de pánico#!\nNada de qué preocuparse. Ningún [concept_country] vinculado al nuestro está cerca de un [concept_spec_financial_panic] ni en #v Manía#!."
 SPEC_RISK_3: "[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_war_risk').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_RISK_3_V', 'SPEC_CHIP_ZERO')]"
 SPEC_RISK_3_V: "#N -[Country.MakeScope.Var('spec_war_risk').GetValueWithDefault('(CFixedPoint)0')|1]#!"
 SPEC_RISK_3_TT: "[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_war_risk').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_RISK_3_ON', 'SPEC_RISK_3_NONE')]"
 SPEC_RISK_3_ON: "#header Riesgo de guerra#!\n$TOOLTIP_DELIMITER$\n#italic Una [concept_diplomatic_play] que se convierte en guerra sacude los mercados.#!\n\nSi estalla la guerra, hasta #N -[Country.MakeScope.Var('spec_war_risk').GetValueWithDefault('(CFixedPoint)0')|1]#! de [concept_spec_market_confidence] al mes\nJugadas diplomáticas que podrían convertirse en guerras: #v [Country.MakeScope.Var('spec_wr_n').GetValueWithDefault('(CFixedPoint)0')|0]#!\n#N -0.6#! por cada una, según una guerra media#indent_newline:3 [AddLocalizationIf(Country.MakeScope.Var('spec_wr1').IsSet, 'SPEC_ITEM_WR_1')][AddLocalizationIf(Country.MakeScope.Var('spec_wr2').IsSet, 'SPEC_ITEM_WR_2')][AddLocalizationIf(Country.MakeScope.Var('spec_wr3').IsSet, 'SPEC_ITEM_WR_3')]#!\n$TOOLTIP_DELIMITER$\n#weak Una guerra que va mal cuesta aún más a través de [concept_spec_war_news].#!"
 SPEC_ITEM_WR_1: "\nContra #v [Country.MakeScope.Var('spec_wr1').GetCountry.GetName]#!: #N -0.6#!"
 SPEC_ITEM_WR_2: "\nContra #v [Country.MakeScope.Var('spec_wr2').GetCountry.GetName]#!: #N -0.6#!"
 SPEC_ITEM_WR_3: "\nContra #v [Country.MakeScope.Var('spec_wr3').GetCountry.GetName]#!: #N -0.6#!"
 SPEC_RISK_3_NONE: "#header Riesgo de guerra#!\nNada de qué preocuparse. No estamos en ninguna [concept_diplomatic_play] que pueda convertirse en guerra."
