 SPEC_PLEDGE_MAKE_TT: "#header Compromiso de rescatar a los bancos#!\n$TOOLTIP_DELIMITER$\n#italic El Estado promete salvar a los bancos siempre que tengan problemas.#!\n\n#P Todo#! [concept_spec_financial_panic] se rescata de inmediato, un #P 25%#! más barato, mientras el [concept_treasury] pueda pagarlo con sus reservas y no estemos en [concept_default]\nReputación que pierde nuestra [concept_spec_exchange] en un pánico: #P -50%#!\n[concept_spec_capital_flight] recibida: #P +50%#!\n#N Cada rescate#! relaja los criterios de préstamo\n$TOOLTIP_DELIMITER$\n#N Si entramos en#! [concept_default], el compromiso se rompe y se pierde toda la reputación. [concept_spec_market_confidence] #N -15#!, [concept_legitimacy] #N -10#! durante #v 5#! años\n#weak Retirar el compromiso requiere un preaviso de#! #v 24#! #weak meses#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_pledge').IsValid(GuiScope.SetRoot(Country.MakeScope).End)), 'SPEC_PLEDGE_PLEDGE_WHY')]"
 SPEC_PLEDGE_OUT_TT: "#header $SPEC_PLEDGE_OUT$#!\n$TOOLTIP_DELIMITER$\nInicia un preaviso de #v 24#! meses para poner fin al compromiso. Hasta que venza, el compromiso sigue vigente y todo pánico se sigue rescatando.\n\n#b El compromiso que vamos a terminar#!\n#italic El Estado promete salvar a los bancos siempre que tengan problemas.#!\n\n#P Todo#! [concept_spec_financial_panic] se rescata de inmediato, un #P 25%#! más barato, mientras el [concept_treasury] pueda pagarlo con sus reservas y no estemos en [concept_default]\nReputación que pierde nuestra [concept_spec_exchange] en un pánico: #P -50%#!\n[concept_spec_capital_flight] recibida: #P +50%#!\n#N Cada rescate#! relaja los criterios de préstamo\n$TOOLTIP_DELIMITER$\n#N Si entramos en#! [concept_default], el compromiso se rompe y se pierde toda la reputación. [concept_spec_market_confidence] #N -15#!, [concept_legitimacy] #N -10#! durante #v 5#! años\n#weak Retirar el compromiso requiere un preaviso de#! #v 24#! #weak meses#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_pledge_leave').IsValid(GuiScope.SetRoot(Country.MakeScope).End)), 'SPEC_PLEDGE_PLEDGE_LEAVE_WHY')]"
