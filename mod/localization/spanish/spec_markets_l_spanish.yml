 SPEC_UNWIND_LINK: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_sev_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_sev_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]"
 SPEC_UNWIND_DESC: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_sev_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_DESC_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_sev_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_DESC_2', 'SPEC_UNWIND_DESC_1'))]"
 SPEC_RISK_NONE: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_sev_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_RISK_SLIGHT', SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_RISK_GLUT', 'SPEC_RISK_CALM'))]"
 SPEC_RISK_SLIGHT: "#header Riesgo de $SPEC_UNWIND$#!\n[concept_spec_market_confidence] si termina el auge: #v Leve#!\n$TOOLTIP_DELIMITER$\n#italic Un auge pequeño. Si terminara ahora, apenas haría daño.#!\n\n$SPEC_UNWIND_DESC$"
 SPEC_RISK_GLUT: "#header En recuperación#!\n$TOOLTIP_DELIMITER$\n#italic [Goods.GetName] se está recuperando de su último auge.#!\n\nLos inversores se mantienen alejados un tiempo, así que el [concept_spec_investor_interest] se queda en #v Dudoso#!"
 SPEC_RISK_CALM: "#header Sin auge#!\n$TOOLTIP_DELIMITER$\n#italic Nada de qué preocuparse. [Goods.GetName] no ha tenido ningún auge últimamente.#!\n\nCuando el [concept_spec_investor_interest] llega a #v Interesado#! o más, una caída de vuelta a #v Dudoso#! #N pone fin al auge#!\nCuanto más sube, más fuerte cae"
 SPEC_UNWIND_3: "Colapso"
 SPEC_UNWIND_C_3: "@spec_collapse! [concept_spec_collapse]"
 SPEC_UNWIND_DESC_3: "Este auge llegó hasta #v Febril#!\n#N Termina#! si la tendencia del precio cae por debajo de #v [Divide_CFixedPoint('(CFixedPoint)-4.988', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!. Entonces el [concept_spec_investor_interest] pasa a #v En fuga#! y el auge termina en un [concept_spec_collapse]\nLos inversores se mantienen después alejados durante #v 12#! meses\n#P El peligro disminuye#! a medida que el auge envejece"
 SPEC_UNWIND_2: "Quiebra"
 SPEC_UNWIND_C_2: "@spec_bust! [concept_spec_bust]"
 SPEC_UNWIND_DESC_2: "Este auge llegó hasta #v Ávido#!\n#N Termina#! si la tendencia del precio cae por debajo de #v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!. Entonces el [concept_spec_investor_interest] pasa a #v Dudoso#! y el auge termina en una [concept_spec_bust]\nLos inversores se mantienen después alejados durante #v 6#! meses\n#P El peligro disminuye#! a medida que el auge envejece"
 SPEC_UNWIND_1: "Corrección"
 SPEC_UNWIND_C_1: "@spec_correction! [concept_spec_correction]"
 SPEC_UNWIND_DESC_1: "Este auge llegó hasta #v Interesado#!\n#N Termina#! si la tendencia del precio cae por debajo de #v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!. Entonces el [concept_spec_investor_interest] pasa a #v Dudoso#! y el auge termina en una [concept_spec_correction]\nLos inversores se mantienen después alejados durante #v 3#! meses\n#P El peligro disminuye#! a medida que el auge envejece"
