 spec_coty: "Compañía del año"
 spec_coty_desc: "El [concept_spec_blue_chip] más próspero del mundo es nuestro este año"
 spec_bc_index: "Índice Blue Chip"
 spec_bc_index_desc: "Nuestros [concept_spec_blue_chip] atraen ahorros al mercado y abaratan los préstamos. Cada uno lo refuerza. Los primeros 5 cuentan por completo, y el resto, hasta 10, a medias."
 spec_bluechip.1.t: "Un nuevo valor de primera"
 spec_bluechip.1.d: "Tras un año de beneficios constantes, [SCOPE.sCompany('spec_bc_co').GetName] figura ya entre los valores de primera. Todos los bancos y todas las viudas del país buscan sus acciones, y los corredores se preguntan si se conformará con su posición o pedirá más al mercado."
 spec_bluechip.1.f: "Segura como el Banco, dicen."
 spec_bluechip.1.a: "Tocar la campana en su honor"
 spec_bluechip.1.a.tt: "Reputación de nuestra [concept_spec_exchange]: #P +2%#!"
 spec_bluechip.1.b: "Dejar que emita nuevas acciones"
 spec_bluechip.1.b.tt: "Nuestro [concept_investment_pool]: #P +[ROOT.GetCountry.MakeScope.ScriptValue('spec_bc_shares')|D]#! @money!\n[SCOPE.sCompany('spec_bc_co').GetName] queda frágil durante #v 5#! años, así que un solo mes por debajo de #v 70#! de [concept_prosperity] hace que deje de ser un valor de primera"
 spec_bluechip.2.t: "Un valor de primera tropieza"
 spec_bluechip.2.d: "[SCOPE.sCompany('spec_bc_co').GetName] ha caído por debajo del listón de un valor de primera. Si sus beneficios no se recuperan en 3 meses, el mercado la borrará de la lista, y nuestra Bolsa lo notará."
 spec_bluechip.2.f: "Una casa que se mantuvo en pie una generación puede caer en una temporada."
 spec_bluechip.2.a: "Sostenerla"
 spec_bluechip.2.a.tt: "Coste: #N [ROOT.GetCountry.MakeScope.ScriptValue('spec_bc_prop_cost')|D]#! @money!\n[SCOPE.sCompany('spec_bc_co').GetName] conserva su condición durante #v 12#! meses, sean cuales sean sus beneficios"
 spec_bluechip.2.b: "Que decida el mercado"
 spec_bluechip.2.b.tt: "Si sigue por debajo del listón durante #v 3#! meses:\nReputación de nuestra [concept_spec_exchange]: #N -2%#!\n[concept_spec_market_confidence]: #N -3#!"
 spec_bluechip.3.t: "Compañía del año"
 spec_bluechip.3.d: "La prensa financiera de todas las capitales coincide en que [SCOPE.sCompany('spec_bc_co').GetName] es la compañía más próspera del mundo este año. Nuestra Bolsa se baña en su gloria."
 spec_bluechip.3.f: "Todo oficinista de la City quiere su parte."
 spec_bluechip.3.a: "Un día de orgullo"
 spec_bluechip.3.a.tt: "Reputación de nuestra [concept_spec_exchange]: #P +2%#!\n$spec_coty$ durante un año: [concept_prestige] #P +5%#!"
 SPEC_H_CENTRES: "Bolsas principales"
 SPEC_H_CENTRES_TT: "#header $concept_spec_financial_centres$#!\n$concept_spec_financial_centre_desc$"
 concept_spec_financial_centre: "Bolsa principal"
 concept_spec_financial_centres: "Bolsas principales"
 concept_spec_financial_centre_desc: "@spec_financial_centre! Las $concept_spec_financial_centres$ son las #v 5#! [Concept('concept_country','$concept_countries|q$')] con mayor puntuación de [Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')], clasificadas cada mes. Cuanto más dinero del [concept_investment_pool] puede aprovechar tu [concept_spec_exchange], mayor es su puntuación. La reputación, la riqueza por habitante, los distritos financieros, las compañías, las tecnologías financieras, el [concept_rank] y el sistema económico también la modifican. La media de los tres primeros es #v 100#!.\n\nPrimer puesto: #P +10%#! de [concept_prestige], #P -10%#! de tipo de interés de los [concept_loans], #P +5#! meses de límite de préstamo\nÚltimo puesto (#v 5#!): #P +2%#!, #P -2%#!, #P +1#! mes\nLa bonificación al límite de préstamo requiere [GetTechnology('central_banking').GetName] y criterios de préstamo #v Prudentes#! o más estrictos"
 SPEC_CENTRE_PLACE: "#v ##[Country.MakeScope.Var('spec_centre_rank').GetValueWithDefault('(CFixedPoint)0')|0]#!"
 SPEC_CENTRE_PLACE_TT: "Ocupamos el puesto #v ##[Country.MakeScope.Var('spec_centre_rank').GetValueWithDefault('(CFixedPoint)0')|0]#! entre los [Concept('concept_spec_financial_centre','$concept_spec_financial_centres|q$')] del mundo"
 SPEC_CENTRE_EMPTY: "Sin $concept_spec_financial_centres$"
 SPEC_CENTRE_COL_NAME: "$concept_country$"
 SPEC_CENTRE_COL_RANK_TT: "El puesto de la [concept_spec_exchange] entre todas las Bolsas, por puntuación"
 SPEC_CENTRE_COL_SCORE: "Puntos"
 SPEC_CENTRE_COL_SCORE_TT: "Lo fuerte que es la [concept_spec_exchange]. Parte del dinero del que puede disponer y crece con la riqueza por habitante, los distritos financieros, las compañías, las tecnologías financieras y la reputación\n#v 100#! es la media de las tres primeras del mundo"
 SPEC_CENTRE_COL_CALM: "Años de calma"
 SPEC_CENTRE_COL_CALM_TT: "Años desde el último [concept_spec_financial_panic] en el [concept_country]"
 SPEC_CENTRE_SCORE: "#v [Country.MakeScope.Var('spec_centre_score').GetValueWithDefault('(CFixedPoint)0')|0]#!"
