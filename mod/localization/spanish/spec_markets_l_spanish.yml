 SPEC_DRIVER_RESTRAIN_TT: "#header Auges contenidos: [Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] por los auges que hemos dejado bajar con suavidad este mes\n#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#! por lo caliente que está el mercado ([concept_spec_market_conditions])\n$TOOLTIP_DELIMITER$\n#weak Los auges contenidos se apagan despacio como una [concept_spec_correction] en lugar de hundirse de golpe#!"
 SPEC_DRIVER_CAUTION_TT: "#header Gobierno y acontecimientos: [Country.MakeScope.Var('spec_c_caution').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\nUn cambio puntual por nuestras decisiones y por acontecimientos del mercado"
 SPEC_DRIVER_LIMIT_TT: "#header Límites: [Country.MakeScope.Var('spec_c_limit').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\nLa [concept_spec_market_confidence] no puede bajar de #v 0#! ni subir de #v 100#!. Esta es la parte que no cabía."
 SPEC_DRIVER_RESCUE_TT: "#header Rescate bancario: [Country.MakeScope.Var('spec_c_rescue').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\nUn impulso puntual por #v Prestar a los bancos#! o #v Suspender la Ley bancaria#! (nunca por encima de #v 100#!)"
 SPEC_DRIVER_RESCUE: "Rescate bancario"
 SPEC_DRIVER_WAREND: "Fin de la guerra"
 SPEC_DRIVER_WAREND_TT: "#header Fin de la guerra: [Country.MakeScope.Var('spec_c_warend').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#v x[Country.MakeScope.Var('spec_war_stakes_now').GetValueWithDefault('(CFixedPoint)0')|%0]#! del efecto completo, según nuestras [concept_casualties]\n$TOOLTIP_DELIMITER$\n#title Efecto completo#!\nGanamos y obtuvimos un [concept_war_goal]: #P +4#!\nGanamos, pero no obtuvimos nada: #P +1#!\nPerdimos y cedimos un [concept_war_goal]: #N -8#!\nPerdimos, pero no cedimos nada: #N -2#!\nNadie ganó: #N -1#!\n\n#weak Siempre notamos al menos el #v 25%#!, y todo una vez que la guerra nos costó el #v 25%#! de nuestras fuerzas#!"
 SPEC_DRIVER_BURST: "Estallidos especulativos"
 SPEC_DRIVER_BURST_TT: "#header Estallidos especulativos: [Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#italic La burbuja ha estallado.#!\n\n#v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0'), Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_burst_per_heat'), '(CFixedPoint)-1'))|0]#! puntos de [concept_spec_speculative_excess]\n#N -[Country.MakeScope.ScriptValue('spec_burst_per_heat')|2]#! por cada punto\nNunca más de #N -[Country.MakeScope.ScriptValue('spec_burst_max')|0]#!\n$TOOLTIP_DELIMITER$\nEstalla cuando la [concept_spec_market_confidence] baja de #v 60#! tras un auge por encima de #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#!\nCuanto más largo y alto el auge, mayor el estallido\n#weak Requiere [GetTechnology('stock_exchange').GetName]#!"
 SPEC_DRIVER_CAUTION: "Gobierno y acontecimientos"
 SPEC_DRIVER_RESTRAIN: "Auges contenidos"
 SPEC_DRIVER_LIMIT: "Límites"
 SPEC_DRIVER_BOOM: "Bienes florecientes"
 SPEC_DRIVER_BOOM_TT: "#header Bienes florecientes: [Country.MakeScope.Var('spec_c_boom').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] de #v [Country.MakeScope.Var('spec_n_boom').GetValueWithDefault('(CFixedPoint)0')|0]#! [Concept('concept_good','$concept_goods|q$')] en auge[AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_BOOM_CAP')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_steady'), '(CFixedPoint)1')), 'SPEC_BOOM_STEADY')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_fin_boom'), '(CFixedPoint)1')), 'SPEC_BOOM_FIN')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_boom_rule'), '(CFixedPoint)1')), 'SPEC_BOOM_RULE')]\n$TOOLTIP_DELIMITER$\nCuanto mayor es la cuota de un bien en nuestro [concept_market], más aporta su auge. Nada durante un [concept_spec_financial_panic]\n#weak [GetTechnology('stock_exchange').GetName], [GetTechnology('investment_banks').GetName] y [GetTechnology('modern_financial_instruments').GetName] lo aumentan#!"
 SPEC_BOOM_CAP: "\nLimitado a #v +3#! antes de todo lo de abajo"
 SPEC_BOOM_STEADY: "\n#v x[Country.MakeScope.ScriptValue('spec_steady')|2]#! de casas señoriales"
 SPEC_BOOM_FIN: "\n#v x[Country.MakeScope.ScriptValue('spec_fin_boom')|2]#! de tecnologías financieras"
 SPEC_BOOM_RULE: "\n#v x[Country.MakeScope.ScriptValue('spec_boom_rule')|2]#! de la volatilidad bursátil"
 SPEC_DRIVER_CRASH: "Auges terminados"
 SPEC_DRIVER_CRASH_TT: "#header Auges terminados: [Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\nEl mayor del mes pasado: #v [Country.MakeScope.Var('spec_crashed').GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] por el tamaño de los auges terminados\n#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#! por lo caliente que está el mercado ([concept_spec_market_conditions])[AddLocalizationIf(Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-40')), 'SPEC_CRASH_CAP')]\n$TOOLTIP_DELIMITER$\nLos auges mayores, y los bienes con más peso en nuestro [concept_market], hacen más daño\n#weak [GetTechnology('mutual_funds').GetName] lo suaviza, [GetTechnology('modern_financial_instruments').GetName] lo empeora#!"
 SPEC_CRASH_CAP: "\nLimitado a #N -40#! al mes"
 SPEC_DRIVER_FOREIGN: "Pánicos extranjeros"
 SPEC_FOREIGN_HIT: "\n#N -20#! de golpe base por un [concept_spec_foreign_panic]\n#v x[Country.MakeScope.Var('spec_fh_size').GetValueWithDefault('(CFixedPoint)0')|2]#! por el tamaño de su economía frente a la nuestra\n#v x[Country.MakeScope.Var('spec_fh_tie').GetValueWithDefault('(CFixedPoint)0')|2]#! por lo estrecho de nuestro vínculo ([concept_spec_market_tie])\n#v x[Country.MakeScope.Var('spec_fh_reach').GetValueWithDefault('(CFixedPoint)0')|2]#! por su importancia ([concept_rank])[AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_foreign_loss_mult'), '(CFixedPoint)1')), 'SPEC_FOREIGN_UNSTD')]"
 SPEC_FOREIGN_UNSTD: "\n#v x[Country.MakeScope.ScriptValue('spec_foreign_loss_mult')|2]#! porque no tenemos [GetTechnology('currency_standards').GetName]"
 SPEC_FOREIGN_FLIGHT: "\n[Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')|+=2] de la [concept_spec_capital_flight]"
 SPEC_DRIVER_FOREIGN_TT: "#header Pánicos extranjeros: [Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\nEl más reciente: #v [Country.MakeScope.Var('spec_foreign_src').GetCountry.GetName]#!\n$TOOLTIP_DELIMITER$[AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_HIT')][AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_FLIGHT')]\n$TOOLTIP_DELIMITER$\n#title @spec_market_tie! [concept_spec_market_tie]#!\n#italic Cuánto del pánico de un país vinculado nos llega por cada tipo de vínculo. No se suman. Si varios pánicos nos llegan en un mes, solo cuenta el golpe mayor.#!\nMismo [concept_market]: #v [Country.MakeScope.ScriptValue('spec_tie_market')|%0]#!\nSúbdito o soberano: #v 80%#!\nDerechos de inversión extranjeros: #v [Country.MakeScope.ScriptValue('spec_tie_investment')|%0]#!\nComercio intenso entre mercados: #v [Country.MakeScope.ScriptValue('spec_tie_trade')|%0]#!\nPropiedad extranjera de nuestra economía: hasta #v 90%#!\n$TOOLTIP_DELIMITER$\n#weak El pánico de una [concept_great_power] nos golpea por completo, el de una potencia importante a medias y el de un país pequeño apenas. Un pánico contagiado desde el extranjero no se propaga más.#!"
 SPEC_DRIVER_TURMOIL: "Guerra y agitación"
 SPEC_DRIVER_TURMOIL_TT: "#header Guerra y agitación: [Country.MakeScope.Var('spec_c_turmoil').GetValueWithDefault('(CFixedPoint)0')|+=2]#!$SPEC_ITEMS_TURMOIL$\n$TOOLTIP_DELIMITER$\nCada [concept_war] ([concept_spec_war_news]): de #N -3#! a #P +0.15#! al mes\nTodas las guerras juntas: de #N -4#! a #P +0.5#! al mes\nUna [concept_diplomatic_play] que aún no es guerra: #N -0.5#! al mes\nTesoro casi vacío: hasta #N -3#! al mes, desde #v 20#! semanas antes de la [concept_bankruptcy]\n[concept_default]: #N -5#! al mes\n[concept_revolution]: #N -2#! al mes\n\n#instruction Pase el cursor sobre una cifra para ver sus causas#!"
 SPEC_DRIVER_MOOD: "Ánimo bursátil"
 SPEC_DRIVER_MOOD_TT: "#header Ánimo bursátil: [Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0')|+=2] por la oscilación aleatoria de este mes\n[Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0'))|+=2] que queda del mes pasado\n$TOOLTIP_DELIMITER$\n#weak Oscila al azar cada mes, hasta #v 0.75#! en cualquier sentido. El #v 75%#! pasa al mes siguiente. Las compañías con alta [concept_prosperity] lo elevan en cuanto nuestra [concept_spec_exchange] alcanza el rango #v Nacional#!.#!"
 SPEC_DRIVER_DRIFT: "Retorno al nivel base"
 SPEC_DRIVER_DRIFT_TT: "#header Retorno al nivel base: [Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0'), Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100'))|+=1] por la distancia a la [concept_spec_baseline] (#v 55#!)\n#v x[Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100')|%1]#! de la diferencia se cierra cada mes\n$TOOLTIP_DELIMITER$\n#weak [GetTechnology('macroeconomics').GetName] lo hace un 50% más rápido#!"
 SPEC_DRIVER_TIGHT: "Crédito restrictivo"
 SPEC_DRIVER_GROWTH: "Crecimiento"
 SPEC_DRIVER_GROWTH_TT: "#header Crecimiento: [Country.MakeScope.Var('spec_c_growth').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#v [Country.MakeScope.Var('spec_growth').GetValueWithDefault('(CFixedPoint)0')|=+%1]#! de crecimiento del [concept_gdp] frente a los meses recientes\nUn crecimiento del #v 2%#! se considera normal y no cambia nada\n$TOOLTIP_DELIMITER$\n#weak La [concept_spec_market_confidence] se mueve #v 0.1#! al mes por cada #v 1%#! más rápido o más lento de lo normal, hasta #v 0.6#! en cualquier sentido#!"
 SPEC_DRIVER_BUSINESS: "Ánimo empresarial"
 SPEC_DRIVER_BUSINESS_TT: "#header Ánimo empresarial: [Country.MakeScope.Var('spec_c_business').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[concept_approval] de los industrialistas: #v [Country.MakeScope.ScriptValue('spec_ind_approval')|0]#!\n\nLeales (#v 10#! o más): #P +0.4#! al mes\nSatisfechos (#v 5#! o más): #P +0.2#! al mes\nDescontentos (#v -5#! o menos): #N -0.2#! al mes\nEnfurecidos (#v -10#! o menos): #N -0.4#! al mes"
 SPEC_DRIVER_TIGHT_TT: "#header Crédito restrictivo: [Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.1')|1]#! de [concept_spec_market_confidence] por encima de #v 60#!\n#N -10%#! de eso al mes, por [Concept('concept_spec_credit_policy','$concept_spec_credit_policy_tight|q$')]\n$TOOLTIP_DELIMITER$\n#weak Enfría un auge despacio a lo largo de meses en lugar de todo a la vez#!"
 concept_spec_market_conditions: "Condiciones del mercado"
 concept_spec_market_conditions_desc: "@spec_market_conditions! Las $concept_spec_market_conditions$ indican lo caliente que está el mercado cuando llega un [concept_spec_boom_end]. Deciden cuánta [concept_spec_market_confidence] cuesta ese final. Cuanto más alta esté la $concept_spec_market_confidence$ en ese momento, mayor es la pérdida. Con #v 55#! no tienen efecto. Los distritos financieros, las casas señoriales y las tecnologías financieras también las modifican."
 concept_spec_baseline: "Confianza base"
 concept_spec_baseline_desc: "@spec_baseline! Si se la deja sola, la [concept_spec_market_confidence] vuelve a su $concept_spec_baseline$ de #v 55#!, tanto desde arriba como desde abajo. Cuanto más se ha alejado, más rápido regresa."
 concept_spec_market_mood: "Ánimo bursátil"
 concept_spec_market_mood_desc: "@spec_market_mood! El $concept_spec_market_mood$ es la oscilación del sentir de los inversores sin una causa única. Cada mes cambia al azar, hasta #v 0.75#! en cualquier sentido, y #v 75%#! pasa al mes siguiente, así que las rachas buenas y malas duran un tiempo antes de desvanecerse."
 concept_spec_market_tie: "Vínculo de mercado"
 concept_spec_market_tie_desc: "@spec_market_tie! Un $concept_spec_market_tie$ indica cuánto sigue un [concept_country] al [concept_market] de otro. Determina qué parte de un [concept_spec_financial_panic] pasa de uno a otro.\n\nLa propiedad cuenta cuando un país posee el #v 10%#! del [concept_gdp] del otro, y es máxima en #v 30%#!. [GetLawType('law_free_trade').GetName] refuerza el vínculo comercial y otras políticas comerciales lo debilitan. [GetTechnology('international_exchange_standards').GetName] refuerza los vínculos de mercado e inversión. Un [concept_embargo] corta el vínculo comercial."
 concept_spec_capital_flight: "Fuga de capitales"
 concept_spec_capital_flight_desc: "@spec_capital_flight! Cuando empieza un [concept_spec_financial_panic], el dinero huye hacia lugares seguros. Cada [concept_great_power], y cada [concept_country] cuya [concept_spec_exchange] tenga rango #v Internacional#! o superior, gana hasta #P +[GetPlayer.MakeScope.ScriptValue('spec_flight_gain_max')|0]#! de [concept_spec_market_confidence] si está en paz, en #v Estabilidad#! o mejor, y sin vínculos con el país en pánico. [GetTechnology('international_trade').GetName] y [GetTechnology('international_exchange_standards').GetName] aumentan la ganancia. Cuanto más alto es el rango de una [concept_spec_exchange], más recibe."
 concept_spec_war_news: "Noticias de guerra"
 concept_spec_war_news_desc: "@spec_war_news! Los inversores siguen una [concept_war] mes a mes. Las $concept_spec_war_news$ mueven la [concept_spec_market_confidence] cada mes según cómo va: las [concept_casualties], el [concept_blockade], la [concept_devastation], la caída del [concept_gdp] y una guerra larga la reducen, mientras que ganar [Concept('concept_battle','$concept_battles|q$')] y mantener territorio enemigo la elevan. Cada guerra la mueve entre #N -3#! y #P +0.15#! al mes, y todas las guerras juntas entre #N -4#! y #P +0.5#!."
