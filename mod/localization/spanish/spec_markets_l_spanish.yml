 spec_panic_movements: "Desconfianza en los mercados"
 spec_panic_movements_desc: "Tras el pánico, muchos han llegado a creer que el Estado debe poner freno a los mercados, y los [Concept('concept_political_movement','$concept_political_movements|q$')] contrarios a [GetLawType('law_laissez_faire').GetName] han ganado apoyo."
 spec_mania_movements: "Fe en los mercados"
 spec_mania_movements_desc: "Un largo auge ha convencido a muchos de que es mejor dejar actuar a los mercados, y los [Concept('concept_political_movement','$concept_political_movements|q$')] favorables a [GetLawType('law_laissez_faire').GetName] han ganado apoyo."
 SPEC_DRIVER_DEBT: "Deuda pública"
 SPEC_DRIVER_DEBT_TT: "#header Deuda pública: [GetPlayer.MakeScope.Var('spec_c_debt').GetValue|+=2]#!\n$TOOLTIP_DELIMITER$\n#italic Los inversores se ponen nerviosos cuando pedimos demasiado prestado.#!\n\nHemos usado #v [GetPlayer.MakeScope.ScriptValue('spec_debt_share')|%0]#! de nuestro [concept_credit] ([concept_principal])\n#P Seguro#! hasta #v 50%#!\nPor cada #v 10%#! por encima: #N -0.2#! de [concept_spec_market_confidence] al mes (nunca más de #N -1#!)\n$TOOLTIP_DELIMITER$\n#instruction Devuelva deuda hasta bajar del 50% y esto desaparecerá.#!"
