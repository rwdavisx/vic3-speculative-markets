 SPEC_XS_TT: "#header @spec_speculative_excess! $concept_spec_speculative_excess$: [Country.MakeScope.Var('spec_heat').GetValueWithDefault('(CFixedPoint)0')|0] / 200#!\n$TOOLTIP_DELIMITER$\n#italic Esta es la burbuja. Cuanto más tiempo sigue caliente un auge, más crece.#!\n\n#P Crece#! mientras la [concept_spec_market_confidence] es de #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#! o más\n#v Se reduce#! despacio mientras está entre #v 60#! y #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#!\n#N Estalla#! si cae por debajo de #v 60#!\n\nSi estallara ahora: #N -[Country.MakeScope.ScriptValue('spec_burst_now')|0]#! de [concept_spec_market_confidence] de golpe (nunca más de #N [Country.MakeScope.ScriptValue('spec_burst_max')|0]#!)\n$TOOLTIP_DELIMITER$\n#instruction Para desinflarla con suavidad, mantén la confianza entre 60 y [Country.MakeScope.ScriptValue('spec_heat_from')|0]. La barra se vuelve roja cuando un estallido haría daño.#!"
