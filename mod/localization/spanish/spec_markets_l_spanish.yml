 notification_spec_tied_panic_name: "Estalla el pánico en [SCOPE.sC('spec_note_src').GetName]"
 notification_spec_tied_panic_desc: "Ha estallado un [concept_spec_financial_panic] en [SCOPE.sC('spec_note_src').GetName], y nuestros vínculos con ellos han traído un [concept_spec_foreign_panic] a nuestros propios mercados."
 notification_spec_tied_panic_tooltip: "#header $notification_spec_tied_panic_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_tied_panic_desc$"
 notification_spec_tied_mania_name: "La manía especulativa se apodera de [SCOPE.sC('spec_note_src').GetName]"
 notification_spec_tied_mania_desc: "Los inversores de [SCOPE.sC('spec_note_src').GetName] se han dejado llevar por una [concept_spec_speculative_mania]. Si termina en un [concept_spec_financial_panic], nuestros vínculos con ellos arrastrarán nuestra propia [concept_spec_market_confidence]."
 notification_spec_tied_mania_tooltip: "#header $notification_spec_tied_mania_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_tied_mania_desc$"
 notification_spec_feverish_name: "Los inversores se enfervorizan con [SCOPE.sGoods('spec_note_good').GetName]"
 notification_spec_feverish_desc: "El [concept_spec_investor_interest] en [SCOPE.sGoods('spec_note_good').GetName] ha alcanzado #v Febril#!. Si cae hasta #v En fuga#! mientras el auge sigue siendo tan grande, terminará en un [concept_spec_collapse] y la [concept_spec_market_confidence] caerá con fuerza. El auge se reduce despacio mientras se enfría, así que un enfriamiento suave lo termina con más suavidad, y Contener la especulación lo desinfla poco a poco, como una corrección leve."
