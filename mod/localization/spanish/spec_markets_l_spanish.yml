 SPEC_WHY_SPEED: "#header Reacción inversora#!\n$TOOLTIP_DELIMITER$\n#italic Con qué rapidez persiguen los inversores un cambio de precio.#!\n\nCuando suben los precios: #v x[Country.MakeScope.ScriptValue('spec_hype_mult')|2]#!\nCuando bajan los precios: #v x[Country.MakeScope.ScriptValue('spec_hype_mult_down')|2]#!\n$TOOLTIP_DELIMITER$\n#b Por qué#!\n#v x[Country.MakeScope.ScriptValue('spec_law_mult')|2]#! del sistema económico\n#v x[Country.MakeScope.ScriptValue('spec_stance_hype')|2]#! de la [concept_spec_credit_policy][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_stance_hype'), '(CFixedPoint)1'), 'SPEC_WHY_SPEED_LOOSE')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_tech_hype'), '(CFixedPoint)1')), 'SPEC_WHY_SPEED_TECH')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_depth'), '(CFixedPoint)1')), 'SPEC_WHY_SPEED_DEPTH')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_band_gain'), '(CFixedPoint)1')), 'SPEC_WHY_SPEED_BAND')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_hype'), '(CFixedPoint)1')), 'SPEC_WHY_SPEED_EXCH')]\n$TOOLTIP_DELIMITER$\n#weak Cuanto más alta, más rápido sigue el [concept_spec_investor_interest] a los precios al alza o a la baja#!"
