 SPEC_JE_EXCH_ON: "Bolsa de $SPEC_EXCH_CITY_ME$: #v $SPEC_EXCH_STAND_ME$#!"
 SPEC_JE_EXCH_TT: "Nuestra [concept_spec_exchange] y su rango. La pestaña #bold $SPEC_FIN_TAB_EXCHANGE$#! de la ventana #bold $SPEC_FINANCE$#! muestra el resto."
 SPEC_JE_FAVOURED: "Preferidos"
 SPEC_JE_FAVOURED_TT: "Los bienes que más atraen a los inversores este mes, por lo que las acciones de las compañías y edificios que los producen se venden con facilidad"
 SPEC_JE_SHUNNED: "Rehuidos"
 SPEC_JE_SHUNNED_TT: "Los bienes con los que los inversores menos quieren tener que ver este mes"
 SPEC_JE_STAGE_6: "La [concept_spec_long_depression] se cierne sobre [JournalEntry.GetCountry.GetCapital.GetCityHubName]. Los inversores atesoran lo que tienen y no prestan a nadie, y cada recuperación hasta ahora ha flaqueado en pocos meses. Su propia entrada del diario sigue la recuperación mundial.\n\nLas obras asistenciales dan trabajo y sustento a los desempleados mientras dure la crisis."
 SPEC_JE_STAGE_5: "El pánico se ha apoderado de [JournalEntry.GetCountry.GetCapital.GetCityHubName]. Los depositantes hacen cola ante los bancos desde el alba, se exige la devolución de los préstamos y la [concept_private_construction] se reduce a la mitad durante #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! meses más, a menos que el gobierno actúe.\n\n#v Prestar a los bancos#! lo terminaría antes y reduciría a la mitad sus efectos. Las obras asistenciales dan trabajo y sustento a los desempleados.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_currency_v'), '(CFixedPoint)0'), 'SPEC_JE_SUSPEND_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_4: "El pánico ha pasado y deja tras de sí casas quebradas y obras a medio terminar. Los inversores cuentan sus pérdidas y no puede comenzar otro pánico durante #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic_cooldown').GetValue|0]#! meses.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_reform_open_v'), '(CFixedPoint)0'), 'SPEC_JE_INQUIRY_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_3: "La bolsa de [JournalEntry.GetCountry.GetCapital.GetCityHubName] ha enloquecido. Oficinistas y viudas compran acciones de #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! y #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! con dinero prestado, y cada mes en que la [concept_spec_market_confidence] se mantiene en #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#! o más aumenta el [concept_spec_speculative_excess]. Cuando la $concept_spec_market_confidence$ cae por debajo de #v 60#!, la burbuja estalla; cuanto mayor sea el exceso, más dura será la caída.\n\nContener la especulación en los bienes más disputados, o endurecer el crédito, la desinflaría poco a poco."
 SPEC_JE_STAGE_2: "El dinero abunda y los inversores rebosan optimismo. Las acciones de nuevas compañías de #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! y #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! reciben más suscripciones de las disponibles en menos de una hora, y los bancos prestan sin reparos contra ellas. Con la [concept_spec_market_confidence] en #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#! o más, empieza a acumularse el [concept_spec_speculative_excess].\n\nLos buenos tiempos también son el momento de convertir la deuda nacional a un interés menor."
 SPEC_JE_STAGE_1: "Las operaciones en la bolsa de [JournalEntry.GetCountry.GetCapital.GetCityHubName] transcurren con orden. Los inversores favorecen #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! y #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#!, y rehúyen #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! y #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!."
 SPEC_JE_STAGE_0: "Los inversores de [JournalEntry.GetCountry.GetCapital.GetCityHubName] se muestran cautos. Escarmentados por las pérdidas recientes, guardan su dinero y rehúyen #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! y #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!. Un crédito expansivo o el fomento de la inversión en un bien puede atraerlos de nuevo."
