 SPEC_H_COMPANIES: "Compañías"
 SPEC_H_COMPANIES_TT: "#header $concept_companies$#!\n$TOOLTIP_DELIMITER$\n#italic Cómo el ánimo del mercado hacia un bien cambia los edificios que lo producen.#!\n\nCon un [concept_spec_investor_interest] alto, sus edificios obtienen #P más#! [concept_throughput]\nCon un interés bajo, obtienen #N menos#!\nTras terminar su auge, obtienen #N aún menos#! hasta que se recupera\nUna [concept_company] gana más mientras la gente quiere sus bienes"
 SPEC_H_COMPANIES_RIGHT: "[GetDataModelSize(Country.GetCompanies)]  @spec_blue_chip! #v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!"
 SPEC_H_COMPANIES_RIGHT_TT: "#header @spec_company_strength! [concept_spec_company_strength]: #v [Country.MakeScope.ScriptValue('spec_log_kstr')|1]#!#!\n$TOOLTIP_DELIMITER$\n#italic Nuestra puntuación para Sede de grandes compañías.#!\n\n#b De dónde viene#!\nSumamos la [concept_prosperity] de todas nuestras $concept_companies$, y cada #v 20#! suma #v 1#!\n[Concept('concept_spec_blue_chip','$concept_spec_blue_chips|q$')]: #v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!, cada uno suma #v 2#! más\n#grey Tener más compañías solo ayuda a través de su prosperidad#!"
 SPEC_CO_BC: "#P [concept_spec_blue_chip]#!, que suma #v 2#! a nuestra [concept_spec_company_strength] y cuenta entre nuestros $concept_spec_blue_chips$"
 SPEC_CO_BC_LOW: "  #N En declive#!, por debajo de #v 70#! de [concept_prosperity] durante #v [Company.MakeScope.Var('spec_bc_low').GetValue|0]#! de #v 3#! meses. Con #v 3#! deja de serlo"
 SPEC_CO_BC_CLIMB: "Pasa a ser [concept_spec_blue_chip] tras #v [Subtract_CFixedPoint('(CFixedPoint)12', Company.MakeScope.Var('spec_bc_months').GetValue)|0]#! meses más con #v 70#! o más de [concept_prosperity]"
 SPEC_CO_COTY: "#P Compañía del año#!, el [concept_spec_blue_chip] más próspero del mundo"
 SPEC_CO_PROPPED: "  Sostenida para conservar su condición por ahora, sea cual sea su [concept_prosperity]"
 SPEC_CO_FRAGILE: "  #N Frágil#!, así que un solo mes por debajo de #v 70#! de [concept_prosperity] le hace perder la condición"
 SPEC_CO_NONE: "#low No tenemos compañías#!"
 SPEC_BC_STRIP: "Valores de primera"
 SPEC_BC_STRIP_N: "#v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#! en cartera"
 SPEC_BC_STRIP_FX: "Escudo ante quiebras #P [Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)4.0')|0]%#!\nPeso en duelos #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)3.0')|0]%#!\nReputación #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.417')|1]%#! al año"
 SPEC_BC_STRIP_TT: "#header $concept_spec_blue_chips$: #v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!#!\n$TOOLTIP_DELIMITER$\n#italic Nuestras compañías más estables y prósperas.#!\n\nUna compañía pasa a ser valor de primera tras #v 12#! meses seguidos con #v 70#! o más de [concept_prosperity]\n\n#b Qué nos aportan#!\n[concept_spec_market_confidence] perdida por crisis y pánicos: #P -[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)4.0')|0]%#! #grey (-4% cada uno)#!\nReputación de la [concept_spec_exchange]: #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.4167')|1]%#! de la barra completa al año #grey (+0.4% cada uno)#!\nPulsos de la [concept_spec_exchange]: #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)3.0')|0]%#! a nuestro favor #grey (+3% cada uno)#!\nAportación de los capitalistas al [concept_investment_pool]: #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.6')|1]%#! #grey (+0.6% cada uno)#!\nInterés de los préstamos: #P -[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)1.0')|0]%#! #grey (-1% cada uno)#!\n#grey Los primeros 5 cuentan por completo y los 5 siguientes, la mitad. Cada uno suma además #v 2#! a nuestra [concept_spec_company_strength], nuestra puntuación para Sede de grandes compañías#!\n$TOOLTIP_DELIMITER$\n#b Si perdemos uno#!\nOcurre tras #v 3#! meses seguidos por debajo de #v 70#! de [concept_prosperity]\nReputación de la [concept_spec_exchange]: #N -1.7%#! de la barra completa\n[concept_spec_market_confidence]: #N -3#!\nUn ataque bajista contra nosotros vuelve #N Frágil#! a uno durante un año. Entonces deja de serlo tras un solo mes por debajo de #v 70#! de [concept_prosperity], no #v 3#!\n\n#b Compañía del año#!\nSi la nuestra es la más próspera del mundo, ganamos #P +2.5%#! de la barra completa de reputación de la [concept_spec_exchange] y #P +5%#! de [concept_prestige] durante un año"
