 SPEC_RV_NOW_LINE: "Si se resolviera ahora: [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)0.75'), 'SPEC_RV_BAND_BIGWIN', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)0.2'), 'SPEC_RV_BAND_WIN', SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)-0.2'), 'SPEC_RV_BAND_DRAW', SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)-0.75'), 'SPEC_RV_BAND_LOSS', 'SPEC_RV_BAND_BIGLOSS'))))]\nLa barra: #v [Select_CFixedPoint(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)0'), Country.MakeScope.Var('spec_rv_ui_p').GetValue, Multiply_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)-1'))|%0]#! [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)0'), 'SPEC_RV_OUR_WAY', 'SPEC_RV_THEIR_WAY')]\nSe resuelve en #v [Country.MakeScope.Var('spec_rv_ui_left').GetValueWithDefault('(CFixedPoint)5')|0]#! años"
 SPEC_RV_OUR_WAY: "a nuestro favor"
 SPEC_RV_THEIR_WAY: "a su favor"
 SPEC_RV_SCORE_BODY: "#b Qué mueve la barra#!\nPuntuaciones de [concept_spec_exchange], de #v [GetPlayer.MakeScope.Var('spec_centre_score').GetValue|0]#! a #v [Country.MakeScope.Var('spec_centre_score').GetValue|0]#!: [Divide_CFixedPoint(Subtract_CFixedPoint(Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1')), Multiply_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Country.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'))), Max_CFixedPoint(Max_CFixedPoint(Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1')), Multiply_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Country.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'))), '(CFixedPoint)1'))|+=%0][AddLocalizationIf(LessThan_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)0.99'), 'SPEC_RV_THIN_US')][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)0.99'), 'SPEC_RV_THIN_THEM')]\nNuestros empujones, #v [Country.MakeScope.Var('spec_rv_ui_us').GetValue|0]#!: [Multiply_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_us').GetValue, '(CFixedPoint)0.1')|+=%0]\nSus empujones, #v [Country.MakeScope.Var('spec_rv_ui_them').GetValue|0]#!: [Multiply_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_them').GetValue, '(CFixedPoint)-0.1')|+=%0]\n[concept_spec_blue_chip] (nuestros), #v [GetPlayer.MakeScope.Var('spec_bc_n').GetValueWithDefault('(CFixedPoint)0')|0]#!: [Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.03')|+=%0]\n[concept_spec_blue_chip] (suyos), #v [Country.MakeScope.Var('spec_bc_n').GetValueWithDefault('(CFixedPoint)0')|0]#!: [Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)-0.03')|+=%0]\n\n#weak Cada acción que funciona la empuja un #v 10%#!, hasta #v 5#! por lado#!"
 SPEC_RV_THIN_US: "\n#indent_newline:2 Estamos #N dispersos#! en #v [GetPlayer.MakeScope.Var('spec_rv_n_all').GetValueWithDefault('(CFixedPoint)0')|0]#! pulsos, así que nuestra puntuación cuenta #N [GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1')|%0]#!#!"
