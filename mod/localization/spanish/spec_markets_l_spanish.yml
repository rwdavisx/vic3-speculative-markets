 SPEC_XS_CAP_TT: "#header Capital#!\n$TOOLTIP_DELIMITER$\n#italic El dinero con el que puede contar nuestra [concept_spec_exchange].#!\n\nPropio: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_own_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, seis meses de ingresos del [concept_investment_pool] (media anual)\nDe nuestros vínculos: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_reach_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, una cuarta parte del dinero de cada [concept_country] más pequeño de nuestro [concept_market], de nuestros [Concept('concept_subject','$concept_subjects|q$')], de nuestro [concept_power_bloc] o de cualquiera que nos conceda derechos de [concept_foreign_investment]. Nunca más que el propio\n$TOOLTIP_DELIMITER$\n#weak Más dinero ayuda, pero cada vez menos. Hace falta dieciséis veces más dinero para duplicar la puntuación#!"
 SPEC_XS_WEALTH_TT: "#header Riqueza por habitante#!\n$TOOLTIP_DELIMITER$\n#italic Lo rico que es nuestro pueblo frente al mundo.#!\n\nLos ingresos del [concept_investment_pool] por persona son #v [Country.MakeScope.Var('spec_xs_ratio_v').GetValueWithDefault('(CFixedPoint)0')|2]#! veces la media mundial\nBonificación: de #v x0.75#! a #v x1.5#!\n$TOOLTIP_DELIMITER$\n#weak Ser más rico ayuda, pero cada vez menos#!"
 SPEC_XS_TECH_TT: "#header Tecnologías financieras#!\n$TOOLTIP_DELIMITER$\n#italic Conocimientos financieros que ha investigado nuestro país. Cada uno aumenta la puntuación de nuestra Bolsa.#!\n\n#b Cada una investigada suma#!\n$banking$: #P +5%#!\n$stock_exchange$: #P +5%#!\n$central_banking$: #P +5%#!\n$joint_stock_companies$: #P +5%#!\n$mutual_funds$: #P +5%#!\n$investment_banks$: #P +10%#!\n$international_exchange_standards$: #P +10%#!\n$modern_financial_instruments$: #P +10%#!\n$TOOLTIP_DELIMITER$\n#instruction [GetTechnology('stock_exchange').GetName] también es necesaria para llegar a #v Internacional#!, y [GetTechnology('central_banking').GetName] para llegar a #v Centro mundial#!, junto con lo demás que pide cada rango#!"
 SPEC_XS_ECON_TT: "#header Sistema económico#!\n$TOOLTIP_DELIMITER$\n#italic Cómo cambia la puntuación nuestra ley económica.#!\n\n$law_laissez_faire$: #P x1.15#!\n$law_interventionism$: #P x1.05#!\n$law_agrarianism$: #N x0.95#!\n$law_traditionalism$: #N x0.9#!\n$law_extraction_economy$: #N x0.9#!\n$law_command_economy$: #N x0.75#!\n$law_cooperative_ownership$: #N x0.6#!"
