 spec_excess_bar: "Exceso especulativo"
 concept_spec_speculative_excess: "Exceso especulativo"
 concept_spec_speculative_excess_desc: "@spec_speculative_excess! #italic Esta es la burbuja del [concept_market] de un [concept_country]. Cuanto más tiempo sigue caliente un auge, más crece.#!\n\nNo puede formarse ninguna burbuja antes de [GetTechnology('stock_exchange').GetName].\n#P Crece#! cada mes en que la [concept_spec_market_confidence] es de #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! o más, y más deprisa cuanto más sube\n#v Se reduce#! despacio mientras está entre #v 60#! y #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!\n#N Estalla#! si cae por debajo de #v 60#!\n\nAl estallar, la $concept_spec_market_confidence$ cae aún más, hasta #N [GetPlayer.MakeScope.ScriptValue('spec_burst_max')|0]#!. Cuanto mayor la burbuja, más dura la caída."
 concept_spec_sound_finance: "Solidez financiera"
 concept_spec_sound_finance_desc: "@spec_sound_finance! #italic El premio por aprobar las tres [concept_spec_banking_reforms]: normas de emisión, prestamista de última instancia y ley de sociedades.#!\n\nCuando un [concept_country] tiene las tres:\n#P +10#! de [concept_prestige]\n#P 5%#! menos de intereses por sus [concept_loans]"
 concept_spec_banking_reforms: "Reformas bancarias"
 concept_spec_banking_reform: "Reforma bancaria"
 concept_spec_banking_reforms_desc: "@spec_banking_reforms! #italic Las normas con las que operan los bancos y las compañías de un [concept_country]. Cada una cambia cómo transcurren los auges y los pánicos.#!\n\nCada reforma se desbloquea con una tecnología. Una comisión de investigación aprueba una reforma cada vez. Puede reunirse tras un [concept_spec_financial_panic], o tras #v 10#! años tranquilos sin pánico.\n\n#bold Normas de emisión#! ([GetTechnology('banking').GetName]), elige una:\n#bold Escuela monetaria#!\n$spec_reform_currency_tt$\n#bold Banca libre#!\n$spec_reform_free_tt$\n\n#bold Prestamista de última instancia#! ([GetTechnology('central_banking').GetName])\n$spec_reform_llr_tt$\n\n#bold Ley de sociedades#! ([GetTechnology('joint_stock_companies').GetName])\n$spec_reform_company_tt$\n\nAprobar las tres otorga [concept_spec_sound_finance]."
 alert_spec_panic_risk_alert_name: "Riesgo de pánico"
 spec_panic_risk_alert_setting_name: "Riesgo de pánico"
 alert_spec_panic_risk_alert_desc: "Si todos nuestros auges terminaran a la vez, la [concept_spec_market_confidence] caería a #N [GetPlayer.MakeScope.ScriptValue('spec_after_collapse')|0]#!.\nUn [concept_spec_financial_panic] comienza por debajo de #v [GetPlayer.MakeScope.ScriptValue('spec_panic_at')|0]#!."
 alert_spec_panic_risk_alert_hint: "Para reducir el riesgo, contenga la especulación en los bienes más arriesgados o endurezca la [concept_spec_credit_policy]. Ambas opciones están en la pestaña #bold $SPEC_FIN_TAB_BANKING$#! de la ventana #bold $SPEC_FINANCE$#!."
