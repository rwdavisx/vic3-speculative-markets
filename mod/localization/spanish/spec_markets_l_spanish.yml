 SPEC_STANCE_TIGHT_TT: "#header Crédito restrictivo#!\nCrédito concedido este mes: #v Ninguno#!\n$TOOLTIP_DELIMITER$\n#italic Los bancos dejan de prestar para enfriar el mercado.#!\n\nCada mes se pierde el #N 10%#! de nuestra [concept_spec_market_confidence] por encima de #v 60#!\nReacción inversora: #N -50%#!\n@intelligentsia! Intelectualidad [concept_in_government]: #P +2#! de [concept_approval]\n@industrialists! Industriales [concept_in_government]: #N -2#! de [concept_approval]\n\nAuges #P menores#!, y crisis y pánicos #P más suaves#![SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-1'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-1')), Not(GetScriptedGui('spec_sgui_tight').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_TIGHT_WHY')]"
 SPEC_STANCE_NORMAL_TT: "#header Crédito normal#!\nCrédito concedido este mes: #v @money![Country.MakeScope.ScriptValue('spec_credit_preview')|D]#!\n$TOOLTIP_DELIMITER$\n#italic Los bancos prestan como de costumbre.#!\n\nLos bancos prestan al [concept_investment_pool] mientras la [concept_spec_market_confidence] está por encima de #v 55#!.[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0')), Not(GetScriptedGui('spec_sgui_normal').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_NORMAL_WHY')]"
 SPEC_STANCE_LOOSE_TT: "#header Crédito expansivo#!\nCrédito concedido este mes: #v @money![Country.MakeScope.ScriptValue('spec_credit_preview_loose')|D]#!\n$TOOLTIP_DELIMITER$\n#italic Los bancos prestan con libertad para calentar el mercado.#!\n\nReacción inversora a la subida de precios: #v +30%#!\n@industrialists! Industriales [concept_in_government]: #P +2#! de [concept_approval]\n@intelligentsia! Intelectualidad [concept_in_government]: #N -2#! de [concept_approval]\n\nAuges #P mayores#!, pero pérdidas #N mayores#! cuando terminan[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1')), Not(GetScriptedGui('spec_sgui_loose').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_LOOSE_WHY')]"
