l_spanish:
 spec_confidence_bar: "Confianza bursátil"
 spec_confidence_bar_desc: "@spec_market_confidence! [concept_spec_market_confidence]: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!"
 spec_stance_current_tt: "Esta no es la [concept_spec_credit_policy] vigente"
 spec_stance_cooldown_tt: "La [concept_spec_credit_policy] no ha cambiado en los últimos #v 6#! meses"
 spec_rescued_tt: "No hemos prestado a los bancos ni suspendido la Ley bancaria durante este [concept_spec_financial_panic]"
 spec_credit_tight: "Crédito restrictivo"
 spec_credit_tight_fx: "La [concept_spec_credit_policy] pasa a ser #v Restrictiva#!"
 spec_credit_normal_fx: "La [concept_spec_credit_policy] pasa a ser #v Normal#!"
 spec_credit_loose_fx: "La [concept_spec_credit_policy] pasa a ser #v Expansiva#!"
 spec_credit_tight_desc: "#italic Encarezca el crédito para enfriar el mercado.#!\n\n#N Los bancos dejan de prestar#!\nLos inversores se entusiasman menos con la subida de precios\n#P Auges menores#!, finales más suaves y pánicos más leves\nCada mes se pierde el #N 10%#! de la [concept_spec_market_confidence] que esté por encima de #v 60#!\n\nBloquea la [concept_spec_credit_policy] durante #v 6#! meses\nRequiere [GetTechnology('central_banking').GetName]\n\n@intelligentsia! Intelectualidad [concept_in_government]: #P +2#! de [concept_approval]\n@industrialists! Industriales [concept_in_government]: #N -2#! de [concept_approval]"
 spec_credit_normal: "Crédito normal"
 spec_credit_normal_desc: "#italic Los bancos prestan en condiciones normales.#!\n\nPrestan al [concept_investment_pool] mientras la [concept_spec_market_confidence] está por encima de #v 55#!\n\nBloquea la [concept_spec_credit_policy] durante #v 6#! meses\nRequiere [GetTechnology('central_banking').GetName]"
 spec_credit_loose: "Crédito expansivo"
 spec_credit_loose_desc: "#italic Abarate el crédito y deje que fluya el dinero.#!\n\n#P Los bancos prestan más#!\nLos inversores se entusiasman más con la subida de precios\n#P Auges mayores#!, pero #N pérdidas mayores#! cuando terminan\n\nBloquea la [concept_spec_credit_policy] durante #v 6#! meses\nRequiere [GetTechnology('central_banking').GetName]\n\n@industrialists! Industriales [concept_in_government]: #P +2#! de [concept_approval]\n@intelligentsia! Intelectualidad [concept_in_government]: #N -2#! de [concept_approval]"
 spec_rescue_banks: "Prestar a los bancos"
 spec_rescue_banks_desc: "#italic Inyecte dinero del [concept_treasury] en los bancos para detener el pánico.#!\n\nCoste: unos #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#! del [concept_gdp]\n#P Termina#! el [concept_spec_financial_panic] en #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#! meses como mucho\n#P Reduce a la mitad#! sus penalizaciones durante los meses que le quedan\nLa [concept_spec_market_confidence] sube #P 20#!\n\n#b Sin cambios#!\nPagos de $spec_panic_relief$\nLa gente ya radicalizada al empezar el pánico\nLas [concept_spec_bad_debts] que deja\n\nCuanto más le quede al pánico, más cuesta\nSolo una vez por $concept_spec_financial_panic$\n[GetTechnology('central_banking').GetName] lo abarata y lo acelera"
 spec_conf_panic: "Inversores conmocionados"
 spec_conf_panic_held: "Inversores conmocionados"
 spec_conf_wary: "Inversores cautos"
 spec_conf_steady: "Inversores estables"
 spec_conf_buoyant: "Inversores optimistas"
 spec_conf_mania: "Inversores eufóricos"
 spec_conf_panic_desc: "Efectos de la [concept_spec_market_confidence] en la inversión y el interés de los [concept_loans]"
 spec_conf_panic_held_desc: "Efectos de la [concept_spec_market_confidence] en la inversión y el interés de los [concept_loans]"
 spec_conf_wary_desc: "Efectos de la [concept_spec_market_confidence] en la inversión y el interés de los [concept_loans]"
 spec_conf_steady_desc: "Efectos de la [concept_spec_market_confidence] en la inversión y el interés de los [concept_loans]"
 spec_conf_buoyant_desc: "Efectos de la [concept_spec_market_confidence] en la inversión y el interés de los [concept_loans]"
 spec_conf_mania_desc: "Efectos de la [concept_spec_market_confidence] en la inversión y el interés de los [concept_loans]"
 spec_panic: "Pánico financiero"
 spec_panic_desc: "Efectos de un [concept_spec_financial_panic] en el [concept_market]"
 spec_panic_crunch: "Restricción crediticia"
 spec_panic_crunch_desc: "Los bancos han dejado de prestar mientras dure el [concept_spec_financial_panic], y la [concept_private_construction] se ha frenado bruscamente"
 spec_lev_boom: "Auge crediticio"
 spec_bailout_fx_tt: "@spec_bad_debts! [concept_spec_bad_debts]: #P reducidas a la mitad#!, desaparecen en #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_months')|0]#! meses en vez de #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#!"
 spec_bailout_cost_tt: "[concept_treasury]: #N -@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_cost')|D]#!, aproximadamente el #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_share')|%0]#! del [concept_gdp]"
 spec_bailout_debts_tt: "Hay [concept_spec_bad_debts] que eliminar"
 spec_bailed_tt: "El Estado no ha comprado préstamos incobrables desde que comenzaron estas [concept_spec_bad_debts]"
 spec_lev_boom_desc: "El dinero prestado mantiene activas las fábricas y añade #P +2%#! de [concept_throughput] por cada mes completo de [concept_spec_leverage], hasta #P +24%#!"
 spec_credit_crunch: "Deudas incobrables"
 spec_credit_crunch_desc: "Los bancos aún están contando sus pérdidas del último auge. #N No prestan nada#! hasta que esto se desvanezca.\n#v Prestar a los bancos#! no lo elimina\n#v Comprar préstamos incobrables#! lo reduce a la mitad, una vez mientras dure"
 spec_loose_credit: "Crédito expansivo"
 spec_loose_credit_desc: "Efectos de la [concept_spec_credit_policy]"
 spec_tight_credit: "Crédito restrictivo"
 spec_tight_credit_desc: "Efectos de la [concept_spec_credit_policy]"
 spec_markets.1.t: "Manía especulativa"
 spec_markets.1.d: "En [ROOT.GetCountry.GetCapital.GetCityHubName] se amasan fortunas más deprisa de lo que pueden contarse. Los precios de [ROOT.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName], [ROOT.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName] y [ROOT.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName] suben cada semana, casi a diario salen a bolsa nuevas compañías para producirlos y los bancos prestan contra sus acciones sin mirarlas dos veces. Pocos se detienen a preguntar cuánto vale todo aquello.\n\nAlgunos $capitalists_no_icon$ y $shopkeepers_no_icon$ atribuyen su nueva riqueza al gobierno y se convierten en [Concept('concept_loyalist','$concept_loyalists|q$')]. Si esto perdura, aumentará el apoyo a los [Concept('concept_political_movement','$concept_political_movements|q$')] favorables a [GetLawType('law_laissez_faire').GetName]."
 spec_markets.1.d_generic: "En [ROOT.GetCountry.GetCapital.GetCityHubName] se amasan fortunas más deprisa de lo que pueden contarse. Los precios suben cada semana, casi a diario salen a bolsa nuevas compañías y los bancos prestan contra sus acciones sin mirarlas dos veces. Pocos se detienen a preguntar cuánto vale todo aquello.\n\nAlgunos $capitalists_no_icon$ y $shopkeepers_no_icon$ atribuyen su nueva riqueza al gobierno y se convierten en [Concept('concept_loyalist','$concept_loyalists|q$')]. Si esto perdura, aumentará el apoyo a los [Concept('concept_political_movement','$concept_political_movements|q$')] favorables a [GetLawType('law_laissez_faire').GetName]."
 spec_markets.1.f: "«Compra, muchacho, y no mires el precio. Pagues lo que pagues hoy, mañana otro pagará más»."
 spec_markets.1.a: "La prosperidad habla por sí sola."
 spec_markets.1.b: "Aconsejemos moderación."
 spec_markets.1.b.tt: "La [concept_spec_market_confidence] cae en #v 10#!"
 spec_markets.1.c: "Que los especuladores paguen lo que les corresponde."
 spec_markets.1.c.tt: "La [concept_spec_market_confidence] cae en #v 5#!"
 spec_markets.2.t: "Pánico financiero"
 spec_markets.2.d_crash: "El fin del auge de [ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName], el mayor de los auges terminados, se ha convertido en un pánico general. Las casas que prestaron contra su precio quiebran una tras otra, y los depositantes hacen cola ante los bancos de [ROOT.GetCountry.GetCapital.GetCityHubName] desde el alba. Los bancos exigen la devolución de #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#! en préstamos, y los inversores se aferran a lo poco que les queda. La [concept_private_construction] se reducirá a la mitad durante #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! meses.\n\nLos $capitalists_no_icon$, $aristocrats_no_icon$ y $shopkeepers_no_icon$ arruinados culpan al gobierno, y algunos se vuelven [Concept('concept_radical','$concept_radicals|q$')]. Muchos quieren ahora que el Estado ponga freno a los mercados, y cualquier [Concept('concept_political_movement','$concept_political_movements|q$')] contra [GetLawType('law_laissez_faire').GetName] gana apoyo.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_crash_no_loans: "El fin del auge de [ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName], el mayor de los auges terminados, se ha convertido en un pánico general. Las casas que prestaron contra su precio quiebran una tras otra, y los depositantes hacen cola ante los bancos de [ROOT.GetCountry.GetCapital.GetCityHubName] desde el alba. Los inversores se aferran a lo poco que les queda. La [concept_private_construction] se reducirá a la mitad durante #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! meses.\n\nLos $capitalists_no_icon$, $aristocrats_no_icon$ y $shopkeepers_no_icon$ arruinados culpan al gobierno, y algunos se vuelven [Concept('concept_radical','$concept_radicals|q$')]. Muchos quieren ahora que el Estado ponga freno a los mercados, y cualquier [Concept('concept_political_movement','$concept_political_movements|q$')] contra [GetLawType('law_laissez_faire').GetName] gana apoyo.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign: "El pánico de [ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName] ha llegado a nuestros mercados. Las casas que comerciaban o pedían prestado allí quiebran una tras otra, y los depositantes hacen cola ante los bancos de [ROOT.GetCountry.GetCapital.GetCityHubName] desde el alba. Los bancos exigen la devolución de #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#! en préstamos, y los inversores se aferran a lo poco que les queda. La [concept_private_construction] se reducirá a la mitad durante #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! meses.\n\nLos $capitalists_no_icon$, $aristocrats_no_icon$ y $shopkeepers_no_icon$ arruinados culpan al gobierno, y algunos se vuelven [Concept('concept_radical','$concept_radicals|q$')]. Muchos quieren ahora que el Estado ponga freno a los mercados, y cualquier [Concept('concept_political_movement','$concept_political_movements|q$')] contra [GetLawType('law_laissez_faire').GetName] gana apoyo.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign_no_loans: "El pánico de [ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName] ha llegado a nuestros mercados. Las casas que comerciaban o pedían prestado allí quiebran una tras otra, y los depositantes hacen cola ante los bancos de [ROOT.GetCountry.GetCapital.GetCityHubName] desde el alba. Los inversores se aferran a lo poco que les queda. La [concept_private_construction] se reducirá a la mitad durante #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! meses.\n\nLos $capitalists_no_icon$, $aristocrats_no_icon$ y $shopkeepers_no_icon$ arruinados culpan al gobierno, y algunos se vuelven [Concept('concept_radical','$concept_radicals|q$')]. Muchos quieren ahora que el Estado ponga freno a los mercados, y cualquier [Concept('concept_political_movement','$concept_political_movements|q$')] contra [GetLawType('law_laissez_faire').GetName] gana apoyo.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other: "La confianza se ha desplomado de golpe. Ni las empresas solventes consiguen crédito a ningún precio, y los depositantes hacen cola ante los bancos de [ROOT.GetCountry.GetCapital.GetCityHubName] desde el alba. Los bancos exigen la devolución de #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#! en préstamos, y los inversores se aferran a lo poco que les queda. La [concept_private_construction] se reducirá a la mitad durante #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! meses.\n\nLos $capitalists_no_icon$, $aristocrats_no_icon$ y $shopkeepers_no_icon$ arruinados culpan al gobierno, y algunos se vuelven [Concept('concept_radical','$concept_radicals|q$')]. Muchos quieren ahora que el Estado ponga freno a los mercados, y cualquier [Concept('concept_political_movement','$concept_political_movements|q$')] contra [GetLawType('law_laissez_faire').GetName] gana apoyo.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other_no_loans: "La confianza se ha desplomado de golpe. Ni las empresas solventes consiguen crédito a ningún precio, y los depositantes hacen cola ante los bancos de [ROOT.GetCountry.GetCapital.GetCityHubName] desde el alba. Los inversores se aferran a lo poco que les queda. La [concept_private_construction] se reducirá a la mitad durante #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! meses.\n\nLos $capitalists_no_icon$, $aristocrats_no_icon$ y $shopkeepers_no_icon$ arruinados culpan al gobierno, y algunos se vuelven [Concept('concept_radical','$concept_radicals|q$')]. Muchos quieren ahora que el Estado ponga freno a los mercados, y cualquier [Concept('concept_political_movement','$concept_political_movements|q$')] contra [GetLawType('law_laissez_faire').GetName] gana apoyo.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.bad_debts: "Los préstamos del auge se han vuelto incobrables. En los próximos meses, las [concept_spec_bad_debts] reducirán el [concept_throughput] un #N [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_tp_full_pct')|1]%#! y luego se desvanecerán, hasta desaparecer en #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#! meses. Los bancos no prestarán nada hasta entonces, y #v Prestar a los bancos#! no las eliminará."
 spec_markets.2.d_crash_bad: "$spec_markets.2.d_crash$\n\n$spec_markets.2.bad_debts$"
 spec_markets.2.d_crash_no_loans_bad: "$spec_markets.2.d_crash_no_loans$\n\n$spec_markets.2.bad_debts$"
