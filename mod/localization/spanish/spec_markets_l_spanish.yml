eWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_XS_ROW_TECH_N')][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_xs_rank_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_XS_ROW_RANK')][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.Var('spec_xs_rank_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_XS_ROW_RANK_N')][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_xs_econ_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_XS_ROW_ECON')][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.Var('spec_xs_econ_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_XS_ROW_ECON_N')][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_xs_trust_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_XS_ROW_TRUST')][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.Var('spec_xs_trust_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_XS_ROW_TRUST_N')][AddLocalizationIf(Country.MakeScope.Var('spec_issue').IsSet, 'SPEC_XS_ROW_ISSUE')]\n$TOOLTIP_DELIMITER$\nTotal: #v [Country.MakeScope.Var('spec_xs_raw').GetValueWithDefault('(CFixedPoint)0')|0]#!, nuestro capital con todas las bonificaciones anteriores\nNuestra puntuación compara este total con los tres primeros del mundo, cuya media cuenta como #v 100#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_xs_reg').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_XS_REGLINE_1')][AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_xs_reg').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_XS_REGLINE_2')][AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_xs_reg').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_XS_REGLINE_3')][AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_xs_reg').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)4'), 'SPE