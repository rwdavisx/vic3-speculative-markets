 spec_excess_cooling: "Se reduce lentamente porque la [concept_spec_market_confidence] está por debajo de #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!"
 spec_finance_bar: "Solidez financiera"
 spec_finance_bar_desc: "@spec_sound_finance! [concept_spec_sound_finance]: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#! de #v 3#! [concept_spec_banking_reforms]"
 spec_inquiry_no_panic_tt: "No hay ningún [concept_spec_financial_panic] en curso"
 spec_inquiry_reform_tt: "Nuestra tecnología desbloquea una de las [Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')] que aún no hemos aprobado"
 spec_suspend_panic_tt: "Hay un [concept_spec_financial_panic] en curso"
 spec_suspend_note_tt: "Elegimos la Escuela monetaria para nuestras normas de emisión"
 spec_inquiry_when_tt: "Un [concept_spec_financial_panic] terminó en el último año y desde entonces no se ha reunido ninguna comisión, o han pasado #v 10#! años tranquilos sin pánico (faltan #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_calm_left')|0]#! meses)"
 spec_convert_conf_tt: "La [concept_spec_market_confidence] es de al menos #v 60#!"
 spec_convert_debt_tt: "Nuestra deuda es de al menos el #v 20%#! de nuestro límite de [concept_credit]"
 spec_convert_cd_tt: "No hemos convertido la deuda en los últimos #v 10#! años"
 spec_convert_conf_cost_tt: "@spec_market_confidence! [concept_spec_market_confidence] #N -5#!"
 spec_relief_when_tt: "Hay un [concept_spec_financial_panic] o la [concept_spec_long_depression] en curso"
 spec_relief_cd_tt: "No ha habido obras asistenciales en los últimos #v 12#! meses"
 spec_suspend_tt: "El [concept_spec_financial_panic] #P termina#! en #v 2#! meses, pero golpea con toda su fuerza hasta entonces\n[concept_spec_market_confidence] #P +15#!\nDurante los #v 10#! años siguientes, el [concept_spec_speculative_excess] crece un #N 50%#! más rápido\nLos [concept_spec_lending_standards] se relajan, igual que tras un rescate bancario"
 spec_suspend_act: "Suspender la Ley bancaria"
 spec_suspend_act_desc: "Permitir que el banco imprima más billetes de los que permite la Ley. El pánico remite en pocos meses y no le cuesta nada al Tesoro. El inconveniente es que los inversores aprenden que siempre los rescataremos. Cuenta como #v Prestar a los bancos#! para este pánico.\n\n#lore Gran Bretaña suspendió su Ley bancaria en 1847, 1857 y 1866.#!"
 spec_relief_works_button: "Obras asistenciales"
 spec_relief_works_button_desc: "Pague obras públicas y ayudas mientras dure la crisis. Durante #v 12#! meses mejora el bienestar y la construcción y resta apoyo a los radicales. Cuanto mayor sea nuestro [concept_gdp], más cuesta cada semana."
 spec_convert_debt: "Convertir la deuda nacional"
 spec_convert_debt_desc: "Mientras los inversores están de buen humor, cambie nuestros préstamos por otros nuevos con un interés más bajo. Quienes vivían del interés antiguo no nos lo agradecerán."
 spec_inquiry: "Comisión de investigación"
 spec_inquiry_desc: "Pida a una comisión que escuche a banqueros, corredores y ahorradores arruinados y diga cómo deben funcionar nuestros bancos y compañías. Su informe aprueba una de las [Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')] que desbloquea nuestra tecnología. Mantiene ocupado al gobierno durante #v 6#! meses."
 spec_debt_converted: "Deuda convertida"
 spec_debt_converted_desc: "Nuestros préstamos se convirtieron a un tipo menor mientras los inversores estaban ávidos de prestar."
 spec_relief_works: "Obras asistenciales"
 spec_relief_works_desc: "Se ofrecen obras públicas y socorro a quienes la crisis ha dejado sin trabajo."
 spec_relief_costs: "Costes de las obras asistenciales"
 spec_relief_costs_desc: "El Tesoro corre con el coste de las obras públicas y el socorro."
 spec_act_suspended: "Ley bancaria suspendida"
 spec_act_suspended_desc: "El gobierno ha dejado de lado su propia ley para terminar un pánico."
 spec_inquiry_sitting: "Comisión de investigación"
 spec_inquiry_sitting_desc: "Una comisión recoge testimonios sobre la conducta de nuestros bancos y compañías."
 spec_sound_finance: "Solidez financiera"
 spec_sound_finance_desc: "Nuestra moneda, nuestros bancos y nuestras compañías se rigen por normas en las que confían los inversores."
 spec_rentiers_cut: "Recorte de ingresos rentistas"
 spec_relief_thanks: "Obras asistenciales"
 spec_dear_money: "Dinero caro"
 spec_free_issue: "Banca libre"
 spec_disclosure_burden: "Obligaciones informativas"
 spec_disclosure_welcomed: "Obligaciones informativas"
 spec_report_shelved: "Todo sigue igual"
 spec_report_buried: "Comisión archivada"
 spec_reform_currency_tt: "Los bancos prestan un #v 25%#! menos, el [concept_spec_speculative_excess] crece un #v 25%#! más despacio y cada [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')] dura un #v 25%#! más\nPuede suspender la Ley bancaria durante un pánico"
 spec_reform_free_tt: "Los bancos prestan un #v 25%#! más, los auges son un #v 10%#! mayores y, al terminar, cuestan un #v 10%#! más de [concept_spec_market_confidence]"
 spec_reform_llr_tt: "#v Prestar a los bancos#! cuesta un #v 50%#! menos y termina el pánico un mes antes"
 spec_reform_company_tt: "Cuando terminan los auges, cuestan un #v 30%#! menos de [concept_spec_market_confidence]"
 spec_reform.1.t: "Comisión de investigación"
 spec_reform.1.d_panic: "La comisión nombrada tras el pánico ha entregado su informe en tres volúmenes de testimonios de banqueros, corredores y depositantes arruinados. Sus miembros coinciden en que el pánico no fue obra de la Providencia. En casi todo lo demás discrepan, y cada remedio tiene sus defensores en la cámara."
 spec_reform.1.d_calm: "Con los mercados tranquilos, una comisión ha dedicado el año a escuchar a banqueros, corredores y economistas sobre cómo impedir que el próximo auge termine en ruina. Su informe propone varios remedios, y cada uno tiene sus defensores en la cámara."
 spec_reform.1.f: "«En épocas de alarma desatada, una quiebra provoca muchas, y el mejor modo de evitar las quiebras derivadas es detener la primera que las causa»."
 spec_reform.1.a: "Vinculemos la emisión de billetes al oro de las cámaras."
 spec_reform.1.b: "Que todo banco solvente emita sus propios billetes."
 spec_reform.1.c: "Designemos un prestamista de última instancia."
 spec_reform.1.d: "Obliguemos a las compañías a publicar sus cuentas."
 spec_reform.1.e: "Agradezcamos su labor a la comisión y archivemos su informe."
 spec_reform.2.t: "Solidez financiera"
 spec_reform.2.d: "Nuestros bancos emiten billetes conforme a unas reglas, un prestamista está dispuesto a actuar cuando cunde el pánico y nuestras compañías deben mostrar a los inversores lo que poseen y lo que deben. En el extranjero, nuestros bonos ya se venden con prima, y se habla de [ROOT.GetCountry.GetCapital.GetCityHubName] como de un puerto seguro para el capital."
 spec_reform.2.f: "«El primer deber de un banquero no es ganar dinero, sino guardarlo»."
 spec_reform.2.a: "La confianza es el fundamento del crédito."
