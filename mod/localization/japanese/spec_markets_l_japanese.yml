 building_group_bg_financial_districts_standard_of_living_add: "金融街の従業員の[concept_sol]"
 building_group_bg_financial_districts_standard_of_living_add_desc: "金融街の従業員の[concept_sol]に対するボーナスまたはペナルティ"
 SPEC_H_COMPANIES: "企業"
 SPEC_H_COMPANIES_TT: "#header $concept_companies$#!\n$TOOLTIP_DELIMITER$\n#italic 物資に対する市場の気分が、それを生産する建物をどう変えるか。#!\n\n[concept_spec_investor_interest]が高いと、建物の[concept_throughput]が#P 増えます#!\n関心が低いと#N 減ります#!\n好況が終わった後は、回復するまで#N さらに減ります#!\n[concept_company]は、人々がその物資を求めている間は収益が増えます"
 SPEC_H_COMPANIES_RIGHT: "[GetDataModelSize(Country.GetCompanies)]  @spec_blue_chip! #v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!"
 SPEC_H_COMPANIES_RIGHT_TT: "#header @spec_company_strength! [concept_spec_company_strength]: #v [Country.MakeScope.ScriptValue('spec_log_kstr')|1]#!#!\n$TOOLTIP_DELIMITER$\n#italic 大企業の本拠における我が国のスコア。#!\n\n#b 内訳#!\n我が国のすべての$concept_companies$の[concept_prosperity]を合計し、#v 20#!ごとに#v 1#!を加算\n[Concept('concept_spec_blue_chip','$concept_spec_blue_chips|q$')]: #v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!、1つにつき#v 2#!を追加\n#grey 企業の数を増やしても、その繁栄を通じてしか効果はありません#!"
 SPEC_CO_BC: "#P [concept_spec_blue_chip]#!。我が国の[concept_spec_company_strength]に#v 2#!加わり、我が国の$concept_spec_blue_chips$に数えられます"
 SPEC_CO_BC_LOW: "  [concept_prosperity]が#v 70#!を下回った月が#v 3#!か月中#v [Company.MakeScope.Var('spec_bc_low').GetValue|0]#!か月で#N 後退中#!。#v 3#!か月で地位を失います"
 SPEC_CO_BC_CLIMB: "#v 70#!以上の[concept_prosperity]をあと#v [Subtract_CFixedPoint('(CFixedPoint)12', Company.MakeScope.Var('spec_bc_months').GetValue)|0]#!か月保つと[concept_spec_blue_chip]になる"
 SPEC_CO_COTY: "#P 年間最優秀企業#!、世界で最も繁栄した[concept_spec_blue_chip]"
 SPEC_CO_PROPPED: "  [concept_prosperity]にかかわらず、当面は地位を保つよう下支えされています"
 SPEC_CO_FRAGILE: "  #N 脆弱#!のため、[concept_prosperity]が#v 70#!を1か月でも下回ると地位を失います"
 SPEC_CO_NONE: "#low 我が国は企業を所有していません#!"
 SPEC_BC_STRIP: "優良株"
 SPEC_BC_STRIP_N: "#v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!社保有"
 SPEC_BC_STRIP_FX: "崩壊の緩和 #P [Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)4.0')|0]%#!\n対決の押し #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)3.0')|0]%#!\n信認 毎年#P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.417')|1]%#!"
 SPEC_BC_STRIP_TT: "#header $concept_spec_blue_chips$: #v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!#!\n$TOOLTIP_DELIMITER$\n#italic 我が国で最も安定し、最も繁栄している企業です。#!\n\n[concept_prosperity]が#v 70#!以上の月が#v 12#!か月続くと、企業はこれになります\n\n#b 我が国が得るもの#!\n暴落と恐慌で失う[concept_spec_market_confidence]: #P -[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)4.0')|0]%#! #grey （1社につき-4%）#!\n[concept_spec_exchange]の信認: 毎年、最大値の#P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.4167')|1]%#! #grey （1社につき+0.4%）#!\n[concept_spec_exchange]の対決: 我が国側に#P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)3.0')|0]%#! #grey （1社につき+3%）#!\n資本家の[concept_investment_pool]への拠出: #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.6')|1]%#! #grey （1社につき+0.6%）#!\n借入の利子: #P -[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)1.0')|0]%#! #grey （1社につき-1%）#!\n#grey 最初の5社は全額、次の5社は半分として数えます。1社ごとに、大企業の本拠における我が国のスコアである[concept_spec_company_strength]にも#v 2#!加わります#!\n$TOOLTIP_DELIMITER$\n#b 失う場合#!\n[concept_prosperity]が#v 70#!未満の月が#v 3#!か月続くと失います\n[concept_spec_exchange]の信認: 最大値の#N -1.7%#!\n[concept_spec_market_confidence]: #N -3#!\n我が国が売り崩しを受けると、1社が1年間#N 脆弱#!になります。その間は[concept_prosperity]が#v 3#!ではなく#v 70#!を1か月下回るだけで地位を失います\n\n#b 年間最優秀企業#!\n我が国の企業が世界で最も繁栄している場合、[concept_spec_exchange]の信認が最大値の#P +2.5%#!、[concept_prestige]が1年間#P +5%#!増えます"
