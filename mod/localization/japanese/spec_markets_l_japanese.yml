 notification_spec_nearly_broke_name: "国庫の枯渇"
 notification_spec_nearly_broke_desc: "この赤字が続くと、あと#v [GetPlayer.ScriptValue('spec_broke_weeks')|0]#!週で[concept_bankruptcy]に至ります。予算が回復するまで[concept_spec_market_confidence]は低下し続けます。"
 notification_spec_nearly_broke_tooltip: "#header $notification_spec_nearly_broke_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_nearly_broke_desc$"
 notification_spec_panic_over_name: "金融恐慌の終息"
 notification_spec_panic_over_desc: "[concept_spec_financial_panic]が終わり、その影響は解消されました。"
 notification_spec_panic_over_tooltip: "#header $notification_spec_panic_over_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_panic_over_desc$"
 notification_spec_bubble_burst_name: "バブルの破裂"
 notification_spec_bubble_burst_desc: "[concept_spec_market_confidence]が下がりすぎ、[concept_spec_speculative_excess]を維持できなくなりました。バブルは破裂し、$concept_spec_market_confidence$はさらに低下します。"
 notification_spec_bubble_burst_tooltip: "#header $notification_spec_bubble_burst_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_bubble_burst_desc$"
 notification_spec_lev_unsafe_name: "信用レバレッジが危険水準に"
 notification_spec_lev_unsafe_desc: "[concept_spec_leverage]が安全な上限である#v 3#!か月分を超えました。ここからは、[concept_spec_financial_panic]がより高い[concept_spec_market_confidence]で始まり、[concept_spec_bad_debts]を残します。"
 notification_spec_lev_unsafe_tooltip: "#header $notification_spec_lev_unsafe_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_lev_unsafe_desc$"
 notification_spec_boom_end_1_name: "[SCOPE.sGoods('spec_note_good').GetName]の調整"
 notification_spec_boom_end_1_desc: "[SCOPE.sGoods('spec_note_good').GetName]の好況は[concept_spec_correction]で終わりました。[concept_spec_market_confidence]が低下し、長続きしなかった価格を前提に築かれた産業は#v 回復中#!となりました。投資家は約#v 3#!か月間、この産業から手を引きます。$SPEC_NOTE_BANKS$"
 notification_spec_boom_end_1_tooltip: "#header $notification_spec_boom_end_1_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_boom_end_1_desc$"
 notification_spec_boom_end_2_name: "[SCOPE.sGoods('spec_note_good').GetName]の破綻"
 notification_spec_boom_end_2_desc: "[SCOPE.sGoods('spec_note_good').GetName]の好況は[concept_spec_bust]で終わりました。[concept_spec_market_confidence]が低下し、長続きしなかった価格を前提に築かれた産業は#v 回復中#!となりました。投資家は約#v 6#!か月間、この産業から手を引きます。$SPEC_NOTE_BANKS$"
