 spec_suspend_tt: "[concept_spec_financial_panic]は#v 2#!か月以内に#P 終息#!しますが、それまでは全力で打撃を与えます\n[concept_spec_market_confidence] #P +15#!\nその後#v 10#!年間、[concept_spec_speculative_excess]の増加が#N 50%#!速くなります\n銀行救済の後と同じく、[concept_spec_lending_standards]が緩みます"
 spec_suspend_act: "銀行法を停止"
 spec_suspend_act_desc: "法が認める以上の銀行券を銀行が発行できるようにします。恐慌は数か月で収まり、国庫の負担もありません。ただし投資家は、政府が必ず救済すると学びます。この恐慌では#v 銀行に融資する#!を行ったものとして扱われます。\n\n#lore イギリスは1847年、1857年、1866年にピール銀行法を停止しました。#!"
 spec_relief_works_button: "救済事業"
 spec_relief_works_button_desc: "不況が続く間、公共事業と救済に資金を出します。#v 12#!か月間、福祉と建設を押し上げ、急進派から支持を引き離します。我が国の[concept_gdp]が大きいほど、毎週の費用も増えます。"
 spec_convert_debt: "国債の借り換え"
 spec_convert_debt_desc: "投資家が上機嫌なうちに、借入を金利の低い新しいものに借り換えます。古い利息で暮らしていた人々には感謝されないでしょう。"
 spec_inquiry: "調査委員会"
 spec_inquiry_desc: "銀行家、仲買人、破産した預金者から話を聞き、我が国の銀行と企業をどう運営すべきかを答える委員会を設けます。その報告により、我が国の技術で解禁された[Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')]を1つ実施します。#v 6#!か月間、政府はこれにかかりきりになります。"
 spec_debt_converted: "借り換え済み債務"
 spec_debt_converted_desc: "投資家が融資に意欲的な間に、借入を低い金利に借り換えました。"
 spec_relief_works: "救済事業"
 spec_relief_works_desc: "不況で職を失った人々に公共事業と救済が提供されています。"
 spec_relief_costs: "救済事業費"
 spec_relief_costs_desc: "国庫が公共事業と救済の費用を負担しています。"
 spec_act_suspended: "銀行法の停止"
 spec_act_suspended_desc: "政府は恐慌を終息させるため、自らの法律を停止しました。"
 spec_inquiry_sitting: "調査委員会"
 spec_inquiry_sitting_desc: "委員会が我が国の銀行と企業の行いについて証言を聞いています。"
 spec_sound_finance: "健全な金融"
 spec_sound_finance_desc: "我が国の通貨、銀行、企業は、投資家が信頼する規則に従って運営されています。"
 spec_rentiers_cut: "金利生活者の減収"
