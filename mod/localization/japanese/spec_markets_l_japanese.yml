 SPEC_LEVER_RESTRAIN_TT: "#header [Goods.GetName]の投機を抑制#!\n$TOOLTIP_DELIMITER$\n#italic 過熱した[concept_good]を、好況が大きくなりすぎる前に冷まします。#!\n\n[concept_spec_investor_interest]は数か月かけて#v 平静#!まで低下します\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_DOWN', 'SPEC_LEVER_NONE')][concept_budget_additional_income]: 毎週#P @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_levy_', Goods.GetKey))|D]#!（基準価格での生産額の#v 10%#!）\n好況が終わるときは、一度にではなく約1年かけて[concept_spec_correction]としてゆっくり収束します\n\n有効な間、[concept_authority]を#N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#!拘束します。毎月払い直すわけではなく、解除すると戻ってきます#indent_newline:3 \n通常この[concept_good]では#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#!、その消費税の半分と同じ\n取引量に応じて#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#!（我が国の市場の#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#!）#!\n\n#lore 南海泡沫事件の後、1720年の泡沫会社規制法は、国王の特許状なしに株式会社を設立することを禁じました。#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_restrain_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_restrain').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_LEVER_ENCOURAGE_TT: "#header [Goods.GetName]への投資を奨励#!\n$TOOLTIP_DELIMITER$\n#italic 投資家が見向きもしない[concept_good]に関心を向けさせます。#!\n\n[concept_spec_investor_interest]は数か月かけて#v 積極#!まで上昇します\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_UP', 'SPEC_LEVER_NONE')][concept_budget_additional_expenses]: 毎週#N @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_subsidy_', Goods.GetKey))|D]#!（基準価格での生産額の#v 20%#!）\n[concept_good]が#v 意欲#!になると自動的に終わります\n\n有効な間、[concept_authority]を#N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#!拘束します。毎月払い直すわけではなく、解除すると戻ってきます#indent_newline:3 \n通常この[concept_good]では#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#!、その消費税の半分と同じ\n取引量に応じて#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#!（我が国の市場の#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#!）#!\n\n#lore 1800年代半ば、イギリス領インドとフランスは鉄道投資家に資本への一定の利益を保証しました。#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_encourage_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_encourage').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
