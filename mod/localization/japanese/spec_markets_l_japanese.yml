 SPEC_IL_SORT_GOODS_TT: "#header 商品順に並べ替え#!\n$TOOLTIP_DELIMITER$\n我が国の[concept_market]で取引される[Concept('concept_good','$concept_goods|q$')]を、分類別、次に名前順の固定順序で表示します。"
 SPEC_IL_SORT_INTEREST_TT: "#header [concept_spec_investor_interest]順に並べ替え#!\n$TOOLTIP_DELIMITER$\n関心の高い物資を先に、次に取引量の多い順\n\n印は段階を示し、@spec_interest_fleeing! #v 逃避#!から@spec_interest_feverish! #v 過熱#!まであります\n矢印は今月の変化を示します"
