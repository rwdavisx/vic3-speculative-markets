 concept_spec_long_depression_desc: "$concept_spec_long_depression$は世界的な経済危機です。[concept_great_power]が[concept_spec_financial_panic]に陥ると始まり、その時点で恐慌中のすべての国に及び、密接な関係を通じて広がります: [concept_market]の共有、従属国と宗主国、投資権、盛んな貿易、外国による所有。\n\n世界的暴落（#v 4#!か月）: 融資が凍結し、[concept_spec_market_confidence]が流出\n不況（最長#v 5#!年）: 投資、建設、貿易が鈍化し、一部のPOPが[Concept('concept_radical','$concept_radicals|q$')]になる\n回復（#v 1#!年）: [concept_spec_market_confidence]が戻る\n\n各政府の選択が自国と世界の回復を早め、[concept_great_power]の選択が最も重要です。"
