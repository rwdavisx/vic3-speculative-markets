 SPEC_XS_CAP_TT: "#header 資本#!\n$TOOLTIP_DELIMITER$\nスコアは我が国の[concept_spec_exchange]が利用できる資本から始まり、その平方根に比例して増えます。資本が4倍になるとスコアは2倍になります。\n\n自国: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_own_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!、過去1年間の平均による[concept_investment_pool]収入の6か月分\n関係国から: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_reach_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!、我が国の[concept_market]、我が国の[Concept('concept_subject','$concept_subjects|q$')]、我が国の[concept_power_bloc]に属するか、我が国に[concept_foreign_investment]権を与えている、より小さな各[concept_country]の資本の4分の1。最大で自国分と同額"
 SPEC_XS_WEALTH_TT: "#header 1人当たりの富#!\n$TOOLTIP_DELIMITER$\n我が国の1人当たりの[concept_investment_pool]収入は世界の#v [Country.MakeScope.Var('spec_xs_ratio_v').GetValueWithDefault('(CFixedPoint)0')|2]#!倍です。豊かな国民の貯蓄は市場を厚くします。その平方根により、#v x0.5#!から#v x2#!まで"
 SPEC_XS_TECH_TT: "#header 金融技術#!\n$TOOLTIP_DELIMITER$\n研究済みの技術ごとにスコアが上がります:\n$banking$: #P +5%#!\n$stock_exchange$: #P +5%#!\n$central_banking$: #P +5%#!\n$joint_stock_companies$: #P +5%#!\n$mutual_funds$: #P +5%#!\n$investment_banks$: #P +10%#!\n$international_exchange_standards$: #P +10%#!\n$modern_financial_instruments$: #P +10%#!\n\n#v 国際級#!には[GetTechnology('stock_exchange').GetName]、#v 世界中心#!には[GetTechnology('central_banking').GetName]が必要です"
 SPEC_XS_ECON_TT: "#header 経済システム#!\n$TOOLTIP_DELIMITER$\n我が国の経済システムがスコアに乗算されます:\n$law_laissez_faire$: #P x1.15#!\n$law_interventionism$: #P x1.05#!\n$law_agrarianism$: #N x0.95#!\n$law_traditionalism$: #N x0.9#!\n$law_extraction_economy$: #N x0.9#!\n$law_command_economy$: #N x0.75#!\n$law_cooperative_ownership$: #N x0.6#!"
