 SPEC_RISK_4_ON: "#header 債務不履行の危険#!\n$TOOLTIP_DELIMITER$\n#italic 借り入れが上限に近づいています。超えると債務不履行です。#!\n\n[concept_credit]の使用額: #v [Country.MakeScope.Var('spec_default_risk').GetValueWithDefault('(CFixedPoint)0')|%0]#![AddLocalizationIf(Country.MakeScope.Var('spec_tm_broke').IsSet, 'SPEC_RISK_4_BROKE')]\n#v 100%#!を超えると: [concept_default]に陥り、終わるまで毎月[concept_spec_market_confidence] #N -5#!\n$TOOLTIP_DELIMITER$\n#weak $concept_credit$の#v 80%#!を使うと表示されます#!"
