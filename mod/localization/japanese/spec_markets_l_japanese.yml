 concept_spec_speculative_excess_desc: "@spec_speculative_excess! #italic [concept_country]の[concept_market]のバブル。好況が過熱したまま長く続くほど大きくなります。#!\n\n[GetTechnology('stock_exchange').GetName]より前にはバブルは生じません。\n[concept_spec_market_confidence]が#v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!以上の月ごとに#P 膨張#!し、高いほど速く膨らみます\n#v 60#!から#v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!の間はゆっくり#v 縮小#!\n#v 60#!を下回ると#N 破裂#!\n\n破裂すると、$concept_spec_market_confidence$はさらに最大#N [GetPlayer.MakeScope.ScriptValue('spec_burst_max')|0]#!低下します。バブルが大きいほど下落も激しくなります。"
 concept_spec_sound_finance: "健全な金融"
 concept_spec_sound_finance_desc: "@spec_sound_finance! #italic 銀行券の規則、最後の貸し手、会社法の3つの[concept_spec_banking_reforms]をすべて実施した報酬。#!\n\n[concept_country]が3つすべてを実施すると:\n[concept_prestige] #P +10#!\n[concept_loans]の金利が#P 5%#!低下"
 concept_spec_banking_reforms: "銀行改革"
 concept_spec_banking_reform: "銀行改革"
 concept_spec_banking_reforms_desc: "@spec_banking_reforms! #italic [concept_country]の銀行と企業が従う規則。それぞれが好況と恐慌の進み方を変えます。#!\n\n各改革は技術によって解禁されます。調査委員会は一度に1つの改革を実施します。委員会は[concept_spec_financial_panic]の後、または恐慌のない平穏な年が#v 10#!年続いた後に開けます。\n\n#bold 銀行券の規則#!（[GetTechnology('banking').GetName]）、1つを選択:\n#bold 通貨学派#!\n$spec_reform_currency_tt$\n#bold 自由銀行制度#!\n$spec_reform_free_tt$\n\n#bold 最後の貸し手#!（[GetTechnology('central_banking').GetName]）\n$spec_reform_llr_tt$\n\n#bold 会社法#!（[GetTechnology('joint_stock_companies').GetName]）\n$spec_reform_company_tt$\n\n3つすべてを実施すると[concept_spec_sound_finance]を達成します。"
