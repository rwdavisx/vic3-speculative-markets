 spec_levy_tt: "[concept_treasury]: #P +@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_speculator_tax')|D]#!、[concept_gdp]の約#v 0.25%#!"
 spec_bank_bailout_tt: "#v 2.5#!年間、$ig_trade_unions$と$ig_rural_folk$の[concept_approval]: #N -2#!"
 spec_markets.2.c: "この災いを招いたのは投機家だ。"
