 SPEC_COL_LEVER: "介入"
 SPEC_COL_LEVER_TT: "#header 市場介入#!\n$TOOLTIP_DELIMITER$\n投機の抑制: 関心を#v 平静#!に抑え、生産者の[concept_throughput]が減少し、賦課金を支払います\n投資の奨励: 関心を#v 積極#!以上に保ち、生産者の[concept_throughput]が増加し、国がその費用を負担します\n\nいずれも解除するまで毎月[concept_authority]を消費します。生活必需品や市場の貿易に占める割合が大きい商品ほど、消費量が増えます。投機を抑制できるのは、#v 意欲#!または#v 過熱#!にある商品か、好況が終わると[concept_spec_market_confidence]が#v 2#!以上失われる商品です。投資を奨励できるのは、#v 積極#!未満の商品です。"
