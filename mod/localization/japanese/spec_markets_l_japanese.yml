 spec_coty: "年間最優秀企業"
 spec_coty_desc: "世界で最も繁栄した[concept_spec_blue_chip]は今年、我が国のものです"
 spec_bc_index: "ブルーチップ指数"
 spec_bc_index_desc: "我が国の[concept_spec_blue_chip]は貯蓄を市場に呼び込み、借入を安くします。1社ごとに強まります。最初の5社は全額、それ以降10社までは半分として数えます。"
 spec_bluechip.1.t: "新たな優良株"
 spec_bluechip.1.d: "1年にわたる堅調な利益を経て、[SCOPE.sCompany('spec_bc_co').GetName]は優良株の仲間入りを果たした。その株は国中の銀行や未亡人がこぞって求めており、仲買人たちは、同社が今の地位に満足するのか、それとも市場にさらなる資金を求めるのかと噂し合っている。"
 spec_bluechip.1.f: "「銀行並みに安全」と人は言う。"
 spec_bluechip.1.a: "彼らのために鐘を鳴らす"
 spec_bluechip.1.a.tt: "我が国の[concept_spec_exchange]の信認: #P +2%#!"
 spec_bluechip.1.b: "新株の発行を認める"
 spec_bluechip.1.b.tt: "我が国の[concept_investment_pool]: #P +[ROOT.GetCountry.MakeScope.ScriptValue('spec_bc_shares')|D]#! @money!\n[SCOPE.sCompany('spec_bc_co').GetName]は#v 5#!年間脆弱になり、[concept_prosperity]が#v 70#!を1か月でも下回ると優良株ではなくなります"
 spec_bluechip.2.t: "優良株の陰り"
 spec_bluechip.2.d: "[SCOPE.sCompany('spec_bc_co').GetName]は優良株の水準を下回った。3か月以内に利益が回復しなければ、市場は同社を名簿から外し、我が国の取引所もその痛手を受けるだろう。"
 spec_bluechip.2.f: "一世代続いた商会も、ひと季節で倒れうる。"
 spec_bluechip.2.a: "下支えする"
 spec_bluechip.2.a.tt: "費用: #N [ROOT.GetCountry.MakeScope.ScriptValue('spec_bc_prop_cost')|D]#! @money!\n[SCOPE.sCompany('spec_bc_co').GetName]は利益にかかわらず#v 12#!か月間地位を保つ"
 spec_bluechip.2.b: "市場に任せる"
 spec_bluechip.2.b.tt: "#v 3#!か月間水準を下回り続けた場合:\n我が国の[concept_spec_exchange]の信認: #N -2%#!\n[concept_spec_market_confidence]: #N -3#!"
 spec_bluechip.3.t: "年間最優秀企業"
 spec_bluechip.3.d: "各国の首都の経済紙は口をそろえる。今年世界で最も繁栄した企業は[SCOPE.sCompany('spec_bc_co').GetName]だと。我が国の取引所もその栄光に浴している。"
 spec_bluechip.3.f: "シティの事務員は誰もがその株を欲しがっている。"
 spec_bluechip.3.a: "誇らしい日"
 spec_bluechip.3.a.tt: "我が国の[concept_spec_exchange]の信認: #P +2%#!\n$spec_coty$、1年間: [concept_prestige] #P +5%#!"
