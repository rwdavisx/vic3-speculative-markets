 SPEC_RV_THEIR_WAY: "相手側"
 SPEC_RV_SCORE_BODY: "#b 棒を引くもの#!\n[concept_spec_exchange]のスコア、#v [GetPlayer.MakeScope.Var('spec_centre_score').GetValue|0]#!対#v [Country.MakeScope.Var('spec_centre_score').GetValue|0]#!: [Divide_CFixedPoint(Subtract_CFixedPoint(Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1')), Multiply_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Country.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'))), Max_CFixedPoint(Max_CFixedPoint(Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1')), Multiply_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Country.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'))), '(CFixedPoint)1'))|+=%0][AddLocalizationIf(LessThan_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)0.99'), 'SPEC_RV_THIN_US')][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)0.99'), 'SPEC_RV_THIN_THEM')]\n我が国の押し込み、#v [Country.MakeScope.Var('spec_rv_ui_us').GetValue|0]#!回: [Multiply_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_us').GetValue, '(CFixedPoint)0.1')|+=%0]\n相手の押し込み、#v [Country.MakeScope.Var('spec_rv_ui_them').GetValue|0]#!回: [Multiply_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_them').GetValue, '(CFixedPoint)-0.1')|+=%0]\n我が国の[concept_spec_blue_chip]、#v [GetPlayer.MakeScope.Var('spec_bc_n').GetValueWithDefault('(CFixedPoint)0')|0]#!社: [Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.03')|+=%0]\n相手の[concept_spec_blue_chip]、#v [Country.MakeScope.Var('spec_bc_n').GetValueWithDefault('(CFixedPoint)0')|0]#!社: [Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)-0.03')|+=%0]\n\n#weak 成功した行動ごとに#v 10%#!押し込みます。各側最大#v 5#!回#!"
 SPEC_RV_THIN_US: "\n#indent_newline:2 我が国は#v [GetPlayer.MakeScope.Var('spec_rv_n_all').GetValueWithDefault('(CFixedPoint)0')|0]#!件の勝負に#N 手を広げすぎ#!ているため、スコアは#N [GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1')|%0]#!として数えられます#!"
 SPEC_RV_THIN_THEM: "\n#indent_newline:2 相手は#v [Country.MakeScope.Var('spec_rv_n_all').GetValueWithDefault('(CFixedPoint)0')|0]#!件の勝負に#P 手を広げすぎ#!ているため、スコアは#P [Country.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1')|%0]#!として数えられます#!"
