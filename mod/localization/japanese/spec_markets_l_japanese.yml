 SPEC_RV_SLOT_CANCEL_TT: "#header [Country.GetNameNoFormatting]との勝負を終了#!\n$TOOLTIP_DELIMITER$\n#italic $SPEC_RV_LEFT$で決着します。今終了すると敗北扱いとなり、勝負がすでに$SPEC_RV_BAND_BIGLOSS$を示していればそうなります。#!\n\n我が国の[concept_spec_exchange]は信認を#N [Multiply_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_forfeit').GetValueWithDefault('(CFixedPoint)0'), Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_exch_loss'), Select_CFixedPoint(GetScriptedGui('spec_sgui_rv_is_bitter').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End), '(CFixedPoint)1.5', '(CFixedPoint)1')))|1]#!失う\n相手は信認を#N [Country.MakeScope.Var('spec_rv_ui_forfeit').GetValueWithDefault('(CFixedPoint)0')|1]#!得る\n[SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)-0.7499'), 'SPEC_RV_SLOT_CANCEL_LURE', 'SPEC_RV_EV_NONE')]勝負枠が空く[SelectLocalization(GetScriptedGui('spec_sgui_rv_is_locked').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End), 'SPEC_RV_SLOT_CANCEL_LOCKED', 'SPEC_RV_SLOT_CANCEL_CLICK')]"
