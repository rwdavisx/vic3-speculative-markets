 notification_spec_tied_mania_name: "[SCOPE.sC('spec_note_src').GetName]が[concept_spec_speculative_mania]に"
 notification_spec_tied_mania_desc: "[SCOPE.sC('spec_note_src').GetName]の投資家は[concept_spec_speculative_mania]に陥りました。これが[concept_spec_financial_panic]に終われば、同国との関係を通じて我が国の[concept_spec_market_confidence]も引き下げられます。"
 notification_spec_tied_mania_tooltip: "#header $notification_spec_tied_mania_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_tied_mania_desc$"
 notification_spec_feverish_name: "[SCOPE.sGoods('spec_note_good').GetName]への関心が過熱"
 notification_spec_feverish_desc: "[SCOPE.sGoods('spec_note_good').GetName]への[concept_spec_investor_interest]が#v 過熱#!に達しました。ここから低下すると好況は[concept_spec_collapse]に終わり、[concept_spec_market_confidence]が急激に低下します。"
 notification_spec_feverish_tooltip: "#header $notification_spec_feverish_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_feverish_desc$"
 notification_spec_near_panic_name: "信頼度が恐慌寸前"
 notification_spec_near_panic_desc: "[concept_spec_market_confidence]が#v [GetPlayer.Var('spec_conf').GetValue|0]#!まで低下しました。#v $SPEC_PANIC_AT$#!を下回ると[concept_spec_financial_panic]が始まります。"
