l_japanese:
 spec_confidence_bar: "市場信頼度"
 spec_confidence_bar_desc: "[concept_spec_market_confidence]: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!"
 spec_stance_current_tt: "現在の[concept_spec_credit_policy]とは異なる"
 spec_stance_cooldown_tt: "過去#v 6#!か月間に[concept_spec_credit_policy]を変更していない"
 spec_rescued_tt: "今回の[concept_spec_financial_panic]中に、銀行の支援も銀行法の停止も行っていない"
 spec_credit_tight: "信用引き締め"
 spec_credit_tight_fx: "[concept_spec_credit_policy]が#v 引き締め#!になります"
 spec_credit_normal_fx: "[concept_spec_credit_policy]が#v 通常#!になります"
 spec_credit_loose_fx: "[concept_spec_credit_policy]が#v 緩和#!になります"
 spec_credit_tight_desc: "銀行は融資を停止し、投資家は価格上昇に反応しにくくなります。好況は小規模に留まり、その終息や恐慌も穏やかになります。[concept_spec_market_confidence]は毎月、#v 60#!を超える部分の#N 10%#!を失います。選択すると#v 6#!か月間は[concept_spec_credit_policy]を変更できません。[GetTechnology('central_banking').GetName]が必要です。\n\n[concept_in_government]の@intelligentsia! 知識人: [concept_approval] #P +2#!\n[concept_in_government]の@industrialists! 実業家: [concept_approval] #N -2#!"
 spec_credit_normal: "通常の信用政策"
 spec_credit_normal_desc: "[concept_spec_market_confidence]が#v 55#!を上回る間、銀行は[concept_investment_pool]に融資します。選択すると#v 6#!か月間は[concept_spec_credit_policy]を変更できません。[GetTechnology('central_banking').GetName]が必要です。"
 spec_credit_loose: "信用緩和"
 spec_credit_loose_desc: "銀行の融資が増え、投資家は価格上昇により強く反応します。好況は拡大し、終息時の損失も増えます。選択すると#v 6#!か月間は[concept_spec_credit_policy]を変更できません。[GetTechnology('central_banking').GetName]が必要です。\n\n[concept_in_government]の@industrialists! 実業家: [concept_approval] #P +2#!\n[concept_in_government]の@intelligentsia! 知識人: [concept_approval] #N -2#!"
 spec_rescue_banks: "銀行に融資する"
 spec_rescue_banks_desc: "[concept_treasury]から[concept_gdp]の約#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#!を支出し、[concept_spec_financial_panic]を#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#!か月以内に終息させ、影響を半減させます。[concept_spec_market_confidence]は#v 20#!上昇します。恐慌の残り月数が多いほど費用が増えます。1回の恐慌につき一度だけ実行できます。[GetTechnology('central_banking').GetName]により費用が減り、終息も早まります。"
 spec_conf_panic: "動揺する投資家"
 spec_conf_panic_held: "動揺する投資家"
 spec_conf_wary: "警戒する投資家"
 spec_conf_steady: "安定した投資家"
 spec_conf_buoyant: "活気づく投資家"
 spec_conf_mania: "熱狂する投資家"
 spec_conf_panic_desc: "[concept_spec_market_confidence]が投資と[concept_loans]の金利に及ぼす影響"
 spec_conf_panic_held_desc: "[concept_spec_market_confidence]が投資と[concept_loans]の金利に及ぼす影響"
 spec_conf_wary_desc: "[concept_spec_market_confidence]が投資と[concept_loans]の金利に及ぼす影響"
 spec_conf_steady_desc: "[concept_spec_market_confidence]が投資と[concept_loans]の金利に及ぼす影響"
 spec_conf_buoyant_desc: "[concept_spec_market_confidence]が投資と[concept_loans]の金利に及ぼす影響"
 spec_conf_mania_desc: "[concept_spec_market_confidence]が投資と[concept_loans]の金利に及ぼす影響"
 spec_panic: "金融恐慌"
 spec_panic_desc: "[concept_market]における[concept_spec_financial_panic]の影響"
 spec_panic_crunch: "貸し渋り"
 spec_panic_crunch_desc: "[concept_spec_financial_panic]の間、銀行は融資を停止し、[concept_private_construction]が半減しています"
 spec_lev_boom: "融資好況"
 spec_bailout_fx_tt: "[concept_spec_bad_debts]: #P 半減#!、#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#!か月ではなく#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_months')|0]#!か月で解消"
 spec_bailout_cost_tt: "[concept_treasury]: #N -@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_cost')|D]#!、[concept_gdp]の約#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_share')|%0]#!"
 spec_bailout_debts_tt: "解消すべき[concept_spec_bad_debts]がある"
 spec_bailed_tt: "この[concept_spec_bad_debts]が発生してから国家は不良債権を買い取っていない"
 spec_lev_boom_desc: "銀行の融資により、[concept_spec_leverage]1か月分につき[concept_throughput]が#P +2%#!、最大#P +24%#!増加します。"
 spec_credit_crunch: "不良債権"
 spec_credit_crunch_desc: "銀行は先の好況の融資を償却しており、これが薄れるまで融資しません。#v 銀行に融資する#!では解消されません。#v 不良債権を買い取る#!と、続いている間に1回だけ半減します。"
 spec_loose_credit: "信用緩和"
 spec_loose_credit_desc: "[concept_spec_credit_policy]の効果"
 spec_tight_credit: "信用引き締め"
 spec_tight_credit_desc: "[concept_spec_credit_policy]の効果"
 spec_markets.1.t: "投機狂乱"
 spec_markets.1.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]では、数える間もないほどの速さで富が生まれている。[ROOT.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]、[ROOT.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]、[ROOT.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]の価格は週ごとに上がり、それらを生産する新会社がほぼ毎日設立され、銀行はその株式を担保にろくに確かめもせず金を貸す。本当の価値はいくらなのかと立ち止まって考える者は少ない。\n\n一部の$capitalists_no_icon$や$shopkeepers_no_icon$は、新たな富を政府のおかげと考え、[Concept('concept_loyalist','$concept_loyalists|q$')]になる。この状況が続けば、[GetLawType('law_laissez_faire').GetName]を支持する[Concept('concept_political_movement','$concept_political_movements|q$')]への支持が増すだろう。"
 spec_markets.1.d_generic: "[ROOT.GetCountry.GetCapital.GetCityHubName]では、数える間もないほどの速さで富が生まれている。価格は週ごとに上がり、新会社がほぼ毎日設立され、銀行はその株式を担保にろくに確かめもせず金を貸す。本当の価値はいくらなのかと立ち止まって考える者は少ない。\n\n一部の$capitalists_no_icon$や$shopkeepers_no_icon$は、新たな富を政府のおかげと考え、[Concept('concept_loyalist','$concept_loyalists|q$')]になる。この状況が続けば、[GetLawType('law_laissez_faire').GetName]を支持する[Concept('concept_political_movement','$concept_political_movements|q$')]への支持が増すだろう。"
 spec_markets.1.f: "「買いたまえ、若者よ。値段など気にするな。今日いくら払おうと、明日には別の誰かがもっと高く買ってくれる」"
 spec_markets.1.a: "繁栄がすべてを物語っている。"
 spec_markets.1.b: "自制を促そう。"
 spec_markets.1.b.tt: "[concept_spec_market_confidence]が#v 10#!低下します"
 spec_markets.1.c: "投機家にも相応の負担をさせよ。"
 spec_markets.1.c.tt: "[concept_spec_market_confidence]が#v 5#!低下します"
 spec_markets.2.t: "金融恐慌"
 spec_markets.2.d_crash: "終息した好況の中で最大だった[ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName]の好況の終わりは、全般的な恐慌へと発展した。その価格を担保に貸し付けていた商会が次々と倒れ、[ROOT.GetCountry.GetCapital.GetCityHubName]の銀行の前には夜明けから預金者が列を作っている。銀行は#v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#!の融資を回収し、投資家はわずかに残った財産を握りしめている。[concept_private_construction]は#v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!か月間、半減する。\n\n財産を失った$capitalists_no_icon$、$aristocrats_no_icon$、$shopkeepers_no_icon$は政府を非難し、一部は[Concept('concept_radical','$concept_radicals|q$')]になる。今や多くの人が国家による市場の統制を望み、[GetLawType('law_laissez_faire').GetName]に反対する[Concept('concept_political_movement','$concept_political_movements|q$')]への支持が増している。[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_crash_no_loans: "終息した好況の中で最大だった[ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName]の好況の終わりは、全般的な恐慌へと発展した。その価格を担保に貸し付けていた商会が次々と倒れ、[ROOT.GetCountry.GetCapital.GetCityHubName]の銀行の前には夜明けから預金者が列を作っている。投資家はわずかに残った財産を握りしめている。[concept_private_construction]は#v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!か月間、半減する。\n\n財産を失った$capitalists_no_icon$、$aristocrats_no_icon$、$shopkeepers_no_icon$は政府を非難し、一部は[Concept('concept_radical','$concept_radicals|q$')]になる。今や多くの人が国家による市場の統制を望み、[GetLawType('law_laissez_faire').GetName]に反対する[Concept('concept_political_movement','$concept_political_movements|q$')]への支持が増している。[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign: "[ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName]の恐慌が我が国の市場に押し寄せた。同国で取引や借入を行っていた商会が次々と倒れ、[ROOT.GetCountry.GetCapital.GetCityHubName]の銀行の前には夜明けから預金者が列を作っている。銀行は#v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#!の融資を回収し、投資家はわずかに残った財産を握りしめている。[concept_private_construction]は#v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!か月間、半減する。\n\n財産を失った$capitalists_no_icon$、$aristocrats_no_icon$、$shopkeepers_no_icon$は政府を非難し、一部は[Concept('concept_radical','$concept_radicals|q$')]になる。今や多くの人が国家による市場の統制を望み、[GetLawType('law_laissez_faire').GetName]に反対する[Concept('concept_political_movement','$concept_political_movements|q$')]への支持が増している。[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign_no_loans: "[ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName]の恐慌が我が国の市場に押し寄せた。同国で取引や借入を行っていた商会が次々と倒れ、[ROOT.GetCountry.GetCapital.GetCityHubName]の銀行の前には夜明けから預金者が列を作っている。投資家はわずかに残った財産を握りしめている。[concept_private_construction]は#v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!か月間、半減する。\n\n財産を失った$capitalists_no_icon$、$aristocrats_no_icon$、$shopkeepers_no_icon$は政府を非難し、一部は[Concept('concept_radical','$concept_radicals|q$')]になる。今や多くの人が国家による市場の統制を望み、[GetLawType('law_laissez_faire').GetName]に反対する[Concept('concept_political_movement','$concept_political_movements|q$')]への支持が増している。[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other: "信頼が一挙に失われた。健全な企業すら、どれだけ利息を払おうと金を借りられず、[ROOT.GetCountry.GetCapital.GetCityHubName]の銀行の前には夜明けから預金者が列を作っている。銀行は#v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#!の融資を回収し、投資家はわずかに残った財産を握りしめている。[concept_private_construction]は#v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!か月間、半減する。\n\n財産を失った$capitalists_no_icon$、$aristocrats_no_icon$、$shopkeepers_no_icon$は政府を非難し、一部は[Concept('concept_radical','$concept_radicals|q$')]になる。今や多くの人が国家による市場の統制を望み、[GetLawType('law_laissez_faire').GetName]に反対する[Concept('concept_political_movement','$concept_political_movements|q$')]への支持が増している。[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other_no_loans: "信頼が一挙に失われた。健全な企業すら、どれだけ利息を払おうと金を借りられず、[ROOT.GetCountry.GetCapital.GetCityHubName]の銀行の前には夜明けから預金者が列を作っている。投資家はわずかに残った財産を握りしめている。[concept_private_construction]は#v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!か月間、半減する。\n\n財産を失った$capitalists_no_icon$、$aristocrats_no_icon$、$shopkeepers_no_icon$は政府を非難し、一部は[Concept('concept_radical','$concept_radicals|q$')]になる。今や多くの人が国家による市場の統制を望み、[GetLawType('law_laissez_faire').GetName]に反対する[Concept('concept_political_movement','$concept_political_movements|q$')]への支持が増している。[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.bad_debts: "好況期の融資が焦げ付きました。今後数か月、[concept_spec_bad_debts]により[concept_throughput]が#N [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_tp_full_pct')|1]%#!低下し、その後薄れて#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#!か月で解消します。解消するまで銀行は一切融資せず、#v 銀行に融資する#!でも解消しません。"
