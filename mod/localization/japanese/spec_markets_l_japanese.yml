 notification_spec_tied_mania_name: "[SCOPE.sC('spec_note_src').GetName]で投機熱が高まる"
 notification_spec_tied_mania_desc: "[SCOPE.sC('spec_note_src').GetName]の投資家は[concept_spec_speculative_mania]に陥りました。これが[concept_spec_financial_panic]に終われば、同国との関係を通じて我が国の[concept_spec_market_confidence]も引き下げられます。"
 notification_spec_tied_mania_tooltip: "#header $notification_spec_tied_mania_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_tied_mania_desc$"
 notification_spec_feverish_name: "[SCOPE.sGoods('spec_note_good').GetName]への投資熱が過熱"
 notification_spec_feverish_desc: "[SCOPE.sGoods('spec_note_good').GetName]への[concept_spec_investor_interest]が#v 過熱#!に達しました。好況がこの大きさのまま#v 逃避#!まで下がると、好況は[concept_spec_collapse]に終わり、[concept_spec_market_confidence]が急激に低下します。冷え込む間に好況はゆっくり縮むため、穏やかに冷ませばより軽く終わります。投機を抑制すれば、穏やかな調整としてゆっくり収めることができます。"
 notification_spec_feverish_tooltip: "#header $notification_spec_feverish_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_feverish_desc$"
 notification_spec_near_panic_name: "信頼度が恐慌寸前"
 notification_spec_near_panic_desc: "@spec_market_confidence! [concept_spec_market_confidence]が#v [GetPlayer.MakeScope.Var('spec_conf').GetValue|0]#!まで低下しました。#v $SPEC_PANIC_AT$#!を下回ると[concept_spec_financial_panic]が始まります。"
 notification_spec_near_panic_tooltip: "#header $notification_spec_near_panic_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_near_panic_desc$"
 notification_spec_nearly_broke_name: "国庫が底をつきつつある"
 notification_spec_nearly_broke_desc: "現在の赤字が続くと、あと#v [GetPlayer.MakeScope.ScriptValue('spec_broke_weeks')|0]#!週で[concept_bankruptcy]に至ります。予算が回復するまで[concept_spec_market_confidence]は低下し続けます。"
 notification_spec_nearly_broke_tooltip: "#header $notification_spec_nearly_broke_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_nearly_broke_desc$"
 notification_spec_panic_over_name: "恐慌が収まる"
 notification_spec_panic_over_desc: "[concept_spec_financial_panic]が収まりました。その影響と$spec_panic_relief$の支払いは終わりました。残った[concept_spec_bad_debts]は、消えるまで生産と投資を鈍らせ続けます。"
 notification_spec_panic_over_tooltip: "#header $notification_spec_panic_over_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_panic_over_desc$"
 notification_spec_bubble_burst_name: "バブルが破裂"
 notification_spec_bubble_burst_desc: "@spec_market_confidence! [concept_spec_market_confidence]が下がりすぎ、[concept_spec_speculative_excess]を維持できなくなりました。バブルは破裂し、$concept_spec_market_confidence$はさらに低下します。"
 notification_spec_bubble_burst_tooltip: "#header $notification_spec_bubble_burst_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_bubble_burst_desc$"
 notification_spec_lev_unsafe_name: "レバレッジが安全な上限を超える"
 notification_spec_lev_unsafe_desc: "@spec_leverage! [concept_spec_leverage]が安全な上限である#v 3#!か月分を超えました。ここからは、[concept_spec_financial_panic]がより高い[concept_spec_market_confidence]で始まり、[concept_spec_bad_debts]を残します。"
 notification_spec_lev_unsafe_tooltip: "#header $notification_spec_lev_unsafe_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_lev_unsafe_desc$"
 notification_spec_boom_end_1_name: "[SCOPE.sGoods('spec_note_good').GetName]の好況が調整で終わる"
 notification_spec_boom_end_1_desc: "[SCOPE.sGoods('spec_note_good').GetName]の好況は[concept_spec_correction]で終わりました。[concept_spec_market_confidence]が低下し、長続きしなかった価格を前提に築かれた産業は#v 回復中#!となり、約#v 3#!か月間、投資家に避けられます。$SPEC_NOTE_BANKS$"
