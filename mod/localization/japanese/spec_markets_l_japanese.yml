 je_spec_depression_reason: "大取引所での恐慌が世界的な危機に発展しました。投資と建設は鈍化し、貿易は減少し、失業者の不安が高まっています。[concept_spec_long_depression]は世界が回復すると、または最長#v 5#!年で終息します。\n\n我が国の選択は自国と世界の回復を早め、[Concept('concept_great_power','$concept_great_powers|q$')]の選択はさらに大きな影響を持ちます。我が国の回復が完了すれば、他国に先駆けて[concept_spec_market_confidence]が戻ります。"
