 SPEC_XS_TT: "#header @spec_speculative_excess! $concept_spec_speculative_excess$: [Country.MakeScope.Var('spec_heat').GetValueWithDefault('(CFixedPoint)0')|0] / 200#!\n$TOOLTIP_DELIMITER$\n#italic これがバブルです。好況が過熱したまま長く続くほど大きくなります。#!\n\n[concept_spec_market_confidence]が#v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#!以上の間は#P 膨張#!\n#v 60#!から#v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#!の間はゆっくり#v 縮小#!\n#v 60#!を下回ると#N 破裂#!\n\n今破裂した場合: [concept_spec_market_confidence]が即座に#N -[Country.MakeScope.ScriptValue('spec_burst_now')|0]#!（最大#N [Country.MakeScope.ScriptValue('spec_burst_max')|0]#!）\n$TOOLTIP_DELIMITER$\n#instruction 穏やかにしぼませるには、信頼度を60から[Country.MakeScope.ScriptValue('spec_heat_from')|0]の間に保ちます。破裂で痛手を受ける状態になるとバーが赤くなります。#!"
