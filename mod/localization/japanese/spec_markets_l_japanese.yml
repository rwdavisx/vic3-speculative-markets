 concept_spec_intervention_desc: "@spec_intervention! $concept_spec_intervention$によって、政府は1つの[concept_good]の市場に介入します。#v 投機を抑制#!するか、#v 投資を奨励#!するかを選べます。\n\n#v 投機を抑制#!すると、[concept_spec_investor_interest]が#v 平静#!まで冷え込みます。生産者は[concept_throughput]を#N 10%#!失い、毎週、基準価格での生産額の#v 10%#!を賦課金として支払います。\n\n#v 投資を奨励#!すると、関心が#v 積極#!まで高まります。生産者は$concept_throughput$が#P 10%#!増え、生産額の#v 20%#!の助成金を受け取ります。\n\nいずれも解除するまで毎月[concept_authority]を消費します。生活必需品や、[concept_market]の貿易に占める割合が大きい$concept_goods$ほど費用が増えます。"
 SPEC_LEVER_ISSUE_TT: "#header [Goods.GetName]で大型起債を行う#!\n$TOOLTIP_DELIMITER$\n#italic 過熱した[concept_good]の株を我が国の取引所で売り出します。見返りも危険も大きいです。#!\n\n#v 2#!年間:\n[Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]スコア: #P +25%#!\n好況が終わると、そこへの銀行融資の打撃が#N x1.5#!\n好況が終わると、得る、または失う信認が#v x2#!\n$TOOLTIP_DELIMITER$\n同時に1件のみ、少なくとも#v 1#!年の間隔が必要です[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_issue_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_ISSUE_ON', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_issue').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_ISSUE_ON: "\n\nこの[concept_good]で起債が進行中です"
