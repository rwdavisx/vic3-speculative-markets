 concept_spec_market_confidence: "市場信頼度"
 concept_spec_market_confidence_desc: "@spec_market_confidence! #italic 投資家が[concept_country]の[concept_market]をどう見ているか。#v 0#!（#v 恐慌#!）から#v 100#!（#v 狂乱#!）まで。#!\n\n恐怖は#N 投資を鈍らせ#!、[concept_loans]の費用を高めます\n欲は#P 投資を加速させます#!\n\n好況にある[Concept('concept_good','$concept_goods|q$')]で#P 上昇#!\n[Concept('concept_spec_boom_end','$concept_spec_boom_ends|q$')]、[Concept('concept_spec_foreign_panic','$concept_spec_foreign_panics|q$')]、[Concept('concept_diplomatic_play','$concept_diplomatic_plays|q$')]、[concept_war]で#N 低下#!\n経済に占める$building_financial_district$の割合が大きいほど好況もその終わりも大きくなり、$building_manor_house$のほうが多いと小さくなります\n\n#v 55#!を上回ると銀行は[concept_investment_pool]に融資します\n#v 80#!以上で[concept_spec_speculative_mania]になります\n#v 25#!を下回ると[concept_spec_financial_panic]が始まります\n[concept_spec_leverage]が高いとこの水準は上がります\n$building_financial_district$が少ないと少し下がります"
 concept_spec_speculative_mania: "投機狂乱"
 concept_spec_speculative_mania_desc: "@spec_speculative_mania! #italic [concept_market]が欲に駆られて狂乱しています。#!\n\n[concept_spec_market_confidence]が#v 80#!以上の間続きます\n#P 銀行は最も自由に#![concept_investment_pool]へ融資します\n#N [concept_spec_boom_end]で失われる$concept_spec_market_confidence$が増えます#!\n\n狂乱が長く続くか極度に高まると、その後数年間、[GetLawType('law_laissez_faire').GetName]を求める[Concept('concept_political_movement','$concept_political_movements|q$')]が支持を得ます"
 concept_spec_financial_panic: "金融恐慌"
 concept_spec_financial_panics: "金融恐慌"
 concept_spec_financial_panic_desc: "@spec_financial_panic! #italic 投資家が逃げ出し、銀行が資金を引き揚げる暴落。#!\n\n[concept_spec_market_confidence]が#v 25#!を下回ると始まります。[concept_spec_leverage]が#v 3#!か月分を超えると、この水準は最大#v 65#!まで上昇します。$building_financial_district$が少ないと下がり、最低#v 20#!になります。\n\n続いている間:\nすべての建物の[concept_throughput]が#N 減少#!し、徴収される税も減少\n失業者救済のため毎週[concept_treasury]が#N 流出#!\n[concept_private_construction]と投資が#N 鈍化#!\n[Concept('concept_company','$concept_companies|q$')]の$concept_throughput$ボーナスが#N 縮小#!\n#N 一部の投資家が#![Concept('concept_radical','$concept_radicals|q$')]に変わる\n#N 銀行が#![concept_investment_pool]から[concept_spec_outstanding_credit]を回収\n\n関係のある各[concept_country]に[concept_spec_foreign_panic]として広がり、資金は平静な[Concept('concept_great_power','$concept_great_powers|q$')]へ逃れます\nその後数年間、[GetLawType('law_laissez_faire').GetName]に反対する[Concept('concept_political_movement','$concept_political_movements|q$')]への支持が増えます"
 concept_spec_foreign_panic: "外国の恐慌"
 concept_spec_foreign_panics: "外国の恐慌"
 concept_spec_foreign_panic_desc: "@spec_foreign_panic! #italic 外国の恐慌が我が国の市場に波及したもの。#!\n\n我が国と関係のある[concept_country]で[concept_spec_financial_panic]が始まると、[concept_spec_market_confidence]が#N 低下#!します\n関係とは、[concept_market]の共有、一方が他方の従属国であること、投資権、盛んな貿易、我が国経済の一部の所有です\n#N 関係が密接なほど低下も大きくなります#!\n\n[GetLawType('law_free_trade').GetName]は貿易関係を強めます\nその他の貿易政策は弱めます\n[concept_embargo]は貿易関係を断ちます"
 concept_spec_boom_end: "好況の終息"
 concept_spec_boom_ends: "好況の終息"
 concept_spec_boom_end_desc: "@spec_boom_end! #italic 上がったものは下がる。[concept_good]への[concept_spec_investor_interest]が上昇後に下がると、好況は終わります。#!\n\n頂点が高いほど、下落も激しくなります:\n#v 積極#!で頂点: [concept_spec_correction]\n#v 意欲#!で頂点: [concept_spec_bust]\n#v 過熱#!で頂点: [concept_spec_collapse]\n\n[concept_spec_market_confidence]を#N 低下#!させます。好況が大きいほど、また[concept_market]の貿易に占める割合が大きい$concept_goods$ほど大きく低下します\nその後、$concept_good$が回復する間、投資家は投資を控えます\n[concept_company]が生産している場合、その産業は[concept_throughput]を#N 失います#!\n\n#instruction 頂点は毎月少しずつ下がります。ゆっくり冷え込む好況はより穏やかに終わるか、$concept_spec_boom_end$を迎えずに済みます。#!"
 concept_spec_correction: "調整"
 concept_spec_correction_desc: "@spec_correction! #italic $concept_spec_correction$は、最も穏やかな[concept_spec_boom_end]です。#!\n\n#v 積極#!で頂点に達した[concept_good]への[concept_spec_investor_interest]が、#v 懐疑#!まで下がると起こります\n\n[concept_spec_market_confidence]をわずかに#N 低下#!させます\n投資家は#v 3#!か月間、その$concept_good$への投資を控えます\n[concept_company]が生産している場合、その産業は#v 90#!日間[concept_throughput]が#N 2.5%#!減少し、[GetTechnology('corporate_charters').GetName]と[GetTechnology('corporate_management').GetName]を研究するごとにさらに#N 25%#!減少します"
 concept_spec_bust: "破綻"
 concept_spec_bust_desc: "@spec_bust! #italic $concept_spec_bust$は、[concept_spec_correction]より激しい[concept_spec_boom_end]です。#!\n\n#v 意欲#!で頂点に達した[concept_good]への[concept_spec_investor_interest]が、#v 懐疑#!まで下がると起こります\n\n[concept_spec_market_confidence]をより大きく#N 低下#!させ、同じ好況の$concept_spec_correction$の約#v 2#!倍になります\n投資家は#v 6#!か月間、その$concept_good$への投資を控えます\n[concept_company]が生産している場合、その産業は#v 180#!日間[concept_throughput]が#N 5%#!減少し、[GetTechnology('corporate_charters').GetName]と[GetTechnology('corporate_management').GetName]を研究するごとにさらに#N 25%#!減少します"
 concept_spec_collapse: "崩壊"
 concept_spec_collapse_desc: "@spec_collapse! #italic $concept_spec_collapse$は、最も激しい[concept_spec_boom_end]です。#!\n\n#v 過熱#!で頂点に達した[concept_good]への[concept_spec_investor_interest]が、#v 逃避#!まで下がると起こります\n\n[concept_spec_market_confidence]を急激に#N 低下#!させ、同じ好況の[concept_spec_correction]の約#v 5#!倍になります\n投資家は#v 12#!か月間、その$concept_good$への投資を控えます\n[concept_company]が生産している場合、その産業は1年間[concept_throughput]が#N 10%#!減少し、[GetTechnology('corporate_charters').GetName]と[GetTechnology('corporate_management').GetName]を研究するごとにさらに#N 25%#!減少します\n\n最悪の場合、[concept_market]の貿易で大きな割合を占める物資の$concept_spec_collapse$は[concept_spec_financial_panic]を引き起こすことがあります"
 concept_spec_investor_interest: "投資家の関心"
 concept_spec_investor_interest_desc: "@spec_investor_interest! #italic [concept_good]を生産する[Concept('concept_building','$concept_buildings|q$')]に投資家がどれほど乗り気か。#v 逃避#!から#v 過熱#!まで。#!\n\n[concept_market_price]が長期平均を上回る間は#P 上昇#!\n下回る間は#N 低下#!\n\nそれらの建物の[concept_throughput]も連動し、#v 逃避#!での#N -10%#!から#v 過熱#!での#P +8%#!まで変化します\nその$concept_good$を生産する[Concept('concept_company','$concept_companies|q$')]の[concept_prosperity]も同様です\n好況にある$concept_good$は[concept_spec_market_confidence]を高めます\n関心が下がると、好況は[concept_spec_boom_end]を迎えます"
 concept_spec_credit_policy: "信用政策"
 concept_spec_credit_policy_tight: "信用引き締め"
 concept_spec_credit_policy_normal: "通常の信用政策"
 concept_spec_credit_policy_loose: "信用緩和"
 concept_spec_credit_policy_desc: "@spec_credit_policy! #italic 銀行が[concept_investment_pool]にどれほど自由に融資するか。#!\n\n[GetTechnology('central_banking').GetName]で解禁\n$concept_spec_credit_policy_tight$、$concept_spec_credit_policy_normal$、$concept_spec_credit_policy_loose$から選べます\n\n#v 引き締め#!は投資を鈍らせ、[concept_spec_market_confidence]が高いときにはそれを引き下げます\n#v 緩和#!は[concept_spec_outstanding_credit]を増やします\n\n変更すると#v 6#!か月間は固定されます"
 concept_spec_leverage: "信用レバレッジ"
 concept_spec_leverage_desc: "@spec_leverage! #italic 銀行がどれだけ融資したか。[concept_spec_outstanding_credit]を[concept_investment_pool]の月収の何か月分かで表したものです。#!\n\n1か月分につき[concept_throughput]#P +2%#!、最大#P +24%#!\n[concept_spec_financial_panic]の間や[concept_spec_bad_debts]が残っている間は、このボーナスは薄れていきます\n\n#v 3#!か月分を超えると危険になります:\n#N $concept_spec_financial_panic$が早く始まる#!（より高い[concept_spec_market_confidence]で）\n#N $concept_spec_bad_debts$が残る#!"
 concept_spec_bad_debts: "不良債権"
 concept_spec_bad_debts_desc: "@spec_bad_debts! #italic [concept_spec_financial_panic]が銀行の帳簿に残す損失。#!\n\n[concept_spec_leverage]が#v 3#!か月分を超えるほど大きくなります\n\n1ポイントにつき: [concept_throughput]#N -0.4%#!、投資#N -0.75%#!\n数か月間増え続け、その後ゆっくり減少します\n最悪の場合、解消まで約#v 6#!年かかります\n残っている間、#N 銀行は融資しません#!\n\n#v 銀行に融資する#!では解消されません\n#v 不良債権を買い取る#!と、残っている間に1回だけ半減します"
 concept_spec_lending_standards: "融資基準"
 concept_spec_lending_standards_desc: "@spec_lending_standards! #italic [concept_country]の銀行がどれほど慎重に融資するか。#v 厳格#!、#v 慎重#!、#v 健全#!、#v 緩慢#!、#v 無謀#!のいずれかです。#!\n\n緩い銀行ほど[concept_investment_pool]に多く融資し、そのうち多くを好況に振り向けます\n#N そのため好況の終わりは激しくなり#!、銀行救済の費用も増えます\n\n[concept_spec_financial_panic]のない月ごとに少しずつ#N 緩み#!、平穏な年が約#v 20#!年続くと#v 厳格#!から#v 無謀#!に至ります\n銀行救済や#v 不良債権を買い取る#!のたびに#N さらに緩みます#!\n好況が終わると#P 引き締まり#!、何より$concept_spec_financial_panic$が銀行救済なしに最後まで続くと大きく引き締まります"
 concept_spec_blue_chip: "優良株"
 concept_spec_blue_chips: "優良株"
 concept_spec_blue_chip_desc: "@spec_blue_chip! #italic [concept_prosperity]を#v 12#!か月連続で#v 70#!以上に保った花形の[concept_company]。#!\n\n1つにつき[concept_spec_company_strength]に#v 2#!を加算\n#b 1つにつき#! #grey （最初の5は全額、次の5は半分）#!\n暴落や恐慌で失う[concept_spec_market_confidence]: #P -4%#!\n[concept_spec_exchange]の信認: 年にバー全体の#P +0.4%#!\n[concept_spec_exchange]の競争: 我が国に有利に#P +3%#!\n資本家の[concept_investment_pool]への拠出: #P +0.6%#!\n融資の金利: #P -1%#!\n\n#b 失った場合#!\n[concept_prosperity]が#v 3#!か月連続で#v 70#!を下回ると失います\n[concept_spec_exchange]の信認: バー全体の#N -1.7%#!\n[concept_spec_market_confidence]: #N -3#!\n我が国が売り崩しを受けると、1つが1年間#N 脆弱#!になります。その間は、[concept_prosperity]が#v 3#!ではなく#v 70#!を1か月でも下回ると地位を失います\n\n#b 年間最優秀企業#!\n我が国の企業が世界で最も繁栄していれば、1年間[concept_spec_exchange]の信認がバー全体の#P +2.5%#!、[concept_prestige]が#P +5%#!\n\n#v 70#!を#v 3#!か月連続で下回ると#N 失われ#!、その後は再び#v 12#!か月が必要になります\n1か月でも下回ると、それまでの積み上げはリセットされます\n市場経済を離れた[concept_country]はすべて失います"
 concept_spec_company_strength: "企業の強さ"
 concept_spec_company_strength_desc: "@spec_company_strength! #italic [concept_country]の[Concept('concept_company','$concept_companies|q$')]全体の強さ。#!\n\n各企業は[concept_prosperity]を#v 20#!で割った値を加えます。#v 100#!の企業なら#v 5#!です\n[concept_spec_blue_chip]1つにつき、さらに#v 2#!を加えます\n最も強い国が大企業の本拠の栄誉を得ます"
 concept_spec_outstanding_credit: "融資残高"
 concept_spec_outstanding_credit_desc: "@spec_outstanding_credit! #italic 銀行が[concept_investment_pool]に貸し付け、まだ返済されていない資金。#!\n\n[concept_spec_market_confidence]が#v 55#!を上回る間、銀行は融資します\nプールの月収#v 3#!か月分の融資上限で止まります\n[GetTechnology('central_banking').GetName]で#v 5#!か月分増加\n[GetTechnology('investment_banks').GetName]と[GetTechnology('international_exchange_standards').GetName]でそれぞれ#v 2#!か月分増加\n\n毎月少しずつプールから返済されます\n[concept_spec_financial_panic]が始まると、銀行は#N その一部を回収します#!\n\n#lore 銀行は1840年代には鉄道株、1837年には綿花、1873年にはウィーンの建設用地を担保に融資し、それらの好況が崩れたときに痛手を負いました。#!"
