 SPEC_RV_NOW_LINE: "今決着した場合: [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)0.75'), 'SPEC_RV_BAND_BIGWIN', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)0.2'), 'SPEC_RV_BAND_WIN', SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)-0.2'), 'SPEC_RV_BAND_DRAW', SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)-0.75'), 'SPEC_RV_BAND_LOSS', 'SPEC_RV_BAND_BIGLOSS'))))]\n棒: #v [Select_CFixedPoint(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)0'), Country.MakeScope.Var('spec_rv_ui_p').GetValue, Multiply_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)-1'))|%0]#! [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_p').GetValue, '(CFixedPoint)0'), 'SPEC_RV_OUR_WAY', 'SPEC_RV_THEIR_WAY')]\n決着まで#v [Country.MakeScope.Var('spec_rv_ui_left').GetValueWithDefault('(CFixedPoint)5')|0]#!年"
