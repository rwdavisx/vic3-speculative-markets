 SPEC_XS_CAP_TT: "#header 資本#!\n$TOOLTIP_DELIMITER$\n#italic 我が国の[concept_spec_exchange]が利用できる資金。#!\n\n自国: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_own_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!、[concept_investment_pool]収入（年間平均）の6か月分\n関係国から: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_reach_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!、我が国の[concept_market]、[Concept('concept_subject','$concept_subjects|q$')]、[concept_power_bloc]に属するか、我が国に[concept_foreign_investment]権を与えている、より小さな各[concept_country]の資金の4分の1。自国分を超えることはありません\n$TOOLTIP_DELIMITER$\n#weak 資金が多いほど有利ですが、効果は次第に小さくなります。スコアを2倍にするには16倍の資金が必要です#!"
 SPEC_XS_WEALTH_TT: "#header 1人当たりの富#!\n$TOOLTIP_DELIMITER$\n#italic 我が国の国民が世界と比べてどれだけ豊かか。#!\n\n1人当たりの[concept_investment_pool]収入は世界平均の#v [Country.MakeScope.Var('spec_xs_ratio_v').GetValueWithDefault('(CFixedPoint)0')|2]#!倍です\n上乗せ: #v x0.75#!から#v x1.5#!\n$TOOLTIP_DELIMITER$\n#weak 豊かなほど有利ですが、効果は次第に小さくなります#!"
 SPEC_XS_TECH_TT: "#header 金融技術#!\n$TOOLTIP_DELIMITER$\n#italic 我が国が研究した金融の知識。それぞれが取引所のスコアを高めます。#!\n\n#b 研究済みの技術ごとに#!\n$banking$: #P +5%#!\n$stock_exchange$: #P +5%#!\n$central_banking$: #P +5%#!\n$joint_stock_companies$: #P +5%#!\n$mutual_funds$: #P +5%#!\n$investment_banks$: #P +10%#!\n$international_exchange_standards$: #P +10%#!\n$modern_financial_instruments$: #P +10%#!\n$TOOLTIP_DELIMITER$\n#instruction #v 国際級#!には[GetTechnology('stock_exchange').GetName]、#v 世界中心#!には[GetTechnology('central_banking').GetName]も必要です。加えて各地位のその他の条件もあります#!"
