 spec_markets.2.f: "「昨日の私には4万の財産があった。今朝の財産はこの上着だけだ。それすら、ろくな値がつかない」"
 spec_markets.2.a: "市場は自ら底値を見いださねばならない。"
 spec_markets.2.a.tt: "後で#v 銀行に融資する#!を行わない限り、[concept_spec_financial_panic]は最後まで続きます。融資すると、この$ig_industrialists$の[concept_approval]の変化もなくなります"
 spec_markets.2.b: "銀行に融資せねばならない。"
 spec_markets.2.b.tt: "[concept_spec_financial_panic]は#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#!か月以内に終息し、影響が半減します\n[concept_spec_market_confidence]が#v 20#!上昇します"
