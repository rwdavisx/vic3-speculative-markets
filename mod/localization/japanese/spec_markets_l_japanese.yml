 spec_depression.1.t: "$SPEC_LD_NAME$"
 spec_depression.1.d: "世界の取引所を襲った恐慌は、一つの大きな恐慌となった。大商会の間で融資は途絶え、あらゆる場所で一斉に物価が下がり、我が国の工場や鉱山を忙しくさせていた注文も電信で取り消されている。どの市場も他の市場に寄りかかり、今やすべてがともに倒れつつある。\n\n暴落は数か月続き、その後には長期不況が訪れる。回復までの道のりは、今我々が何をするか、そして[Concept('concept_great_power','$concept_great_powers|q$')]が何をするかにかかっている。"
 spec_depression.1.f: "「恐慌はこれまでもあった。だが今回は、金の逃げ場がどこにもない」"
 spec_depression.1.a: "支出を切り詰めねばならない。"
 spec_depression.1.b: "取引所を落ち着かせよ。"
 spec_depression.2.t: "関税の壁"
 spec_depression.2.d: "我が国最大の工場の所有者たちが政府に請願を提出し、大地主たちもこれに加わった。彼らによれば、外国の商品や安い外国産穀物は、作り手が得られる値段ならいくらでも我が国の市場で売られ、国内の工場や荘園は賃金を賄える価格では売ることができないという。彼らは国内の産業と収穫に競合するあらゆる品目の関税引き上げを求めている。\n\n保護すれば我が国の回復を支えられるが、その代償は貿易相手国が負い、世界の回復も損なわれるだろう。"
 spec_depression.2.f: "「どの国も自国の市場を壁で囲い、なぜ輸出が回復しないのかと首をかしげている」"
 spec_depression.2.a: "我が国の産業を守れ。"
 spec_depression.2.b: "市場を開いたままにせよ。"
 spec_depression.3.t: "救済事業"
 spec_depression.3.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]では幾千もの男たちに仕事がなく、救済基金も底をついた。市の技師たちは、彼らを雇える事業を列挙している。排水路、道路、堤防、そして新たな市場の建物。国庫が費用を出すならば、どれも着手できるという。"
 spec_depression.3.f: "「日当を得るために排水路を掘る男は、施しにすがる貧民ではない。本人もそれを心得ている」"
 spec_depression.3.a: "事業に資金を出そう。"
 spec_depression.3.b: "慈善は民間に任せる。"
 spec_depression.4.t: "包囲された銀行"
 spec_depression.4.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]の銀行が、今にも倒れそうな企業に多額の貸付を行っていたとの噂が広まった。朝から預金者が貯金を引き出そうと列を作り、このままでは夕刻までに支払う硬貨が尽きる。銀行の取締役たちは政府に対応を求めている。"
 spec_depression.4.f: "「銀行は、誰もが健全でないと信じるまでは、まったく健全なのだ」"
 spec_depression.4.a: "銀行の休業を宣言せよ。"
 spec_depression.4.b: "銀行を救済せよ。"
 spec_depression.4.c: "破綻に任せよ。"
 spec_depression.5.t: "通貨問題"
 spec_depression.5.d: "物価の下落が国を二分している。農民や小口の借り手は、金があまりに高くつくようになり、物価が下がる年ごとに借金の重みが増すと訴える。彼らは通貨発行の増加と融資の緩和を求めている。銀行家や債権者は、国内外の投資家の信頼を取り戻せるのは健全な通貨だけだと反論する。"
 spec_depression.5.f: "「抵当に入れた土地の借金は5年前と変わらない。小麦の値段は半分だ」"
 spec_depression.5.a: "何よりも健全な通貨を。"
 spec_depression.5.b: "融資を受けやすくせよ。"
 spec_depression.6.t: "失業者の行進"
 spec_depression.6.d: "失業した男たちの隊列が、「仕事かパンか」と書かれた旗を掲げて[ROOT.GetCountry.GetCapital.GetCityHubName]へ行進してきた。彼らは官庁の前に居座り、請願書の提出を求めている。警察は、日没までに広場を一掃できると報告している。"
 spec_depression.6.f: "「施しが欲しいのではない。仕事が欲しいのだ」"
 spec_depression.6.a: "解散させよ。"
 spec_depression.6.b: "請願に耳を傾けよう。"
 spec_depression.7.t: "改革を求める声"
 spec_depression.7.d: "新聞各紙は、なぜ不況がこれほど長引くのか、その前の投機で誰が富を得たのかと問いただしている。議員たちは、銀行、取引所、そして政府自身の行動について調査を求めている。"
 spec_depression.7.f: "「もはや問題は制度が破綻したかどうかではない。誰がその責任を取るかだ」"
 spec_depression.7.a: "調査を命じよ。"
 spec_depression.7.b: "制度は健全だ。"
 spec_depression.8.t: "$SPEC_LD_NAME$の終息"
 spec_depression.8.d: "何年ぶりかで、注文の増加が取り消しを上回っている。物価は底を打ち、銀行は再び貸し始め、休止していた工場も人を雇い始めた。不況は終わった。だが、それを生き抜いた者の記憶から、そうすぐに消え去ることはないだろう。"
 spec_depression.8.f: "「商いは上向いているという。私の注文帳がそう言ってくれたら、信じるとしよう」"
 spec_depression.8.a: "教訓は得られた。"
 spec_depression.8.b: "商売に戻ろう。"
