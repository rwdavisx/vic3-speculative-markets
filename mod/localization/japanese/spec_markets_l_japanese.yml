 concept_spec_exchange: "取引所"
 concept_spec_trust: "信認"
 concept_spec_trust_desc: "@spec_trust! 投資家が[concept_country]の[concept_spec_exchange]をどれほど信じているか。#v 0%#!から#v 100%#!まで。\n\n平穏な月には#P 上昇#!し、[concept_spec_financial_panic]、破綻、崩壊のたびに#N 低下#!します。その段階（#N 不信任#!、疑問視、#v 尊重#!、#P 信任#!）によって、[concept_country]の借入費用が変わります。"
 concept_spec_exchange_desc: "@spec_exchange! [concept_country]の$concept_spec_exchange$とは、その国の株式、債券、信用が取引される場です。その地位は[Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]スコアに従います: #v 地方級#!、#v 全国級#!、#v 国際級#!（[GetTechnology('stock_exchange').GetName]が必要）、#v 世界中心#!（[GetTechnology('central_banking').GetName]が必要）。地位が高いほど価格上昇に対する投資家の反応が高まり、#v 国際級#!からは[concept_spec_capital_flight]を受け入れます。\n\n国家は取引所に特許状を1つ付与します: #v 商品取引所#!、#v 短期金融市場#!、#v 株式市場#!のいずれかです。取引所は#v 10#!の名声への道から#v 1#!〜#v 4#!つの専門分野を持ち、地位が上がるほど多く持てます。それぞれ少なくとも#v 5#!年間維持されます。\n\n信認は健全な融資のもとで平穏な年に高まり、[Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')]、[concept_spec_bad_debts]、主要な物資の[concept_spec_bust]や[concept_spec_collapse]で低下します。信認が低いと[concept_loans]の金利が上がり、高いと下がります。"
