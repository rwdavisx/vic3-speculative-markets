ixedPoint(Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), '(CFixedPoint)60'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), '(CFixedPoint)80')),'SPEC_GAUGE_NEXT_BUOYANT', 'SPEC_GAUGE_NEXT_MANIA'))))][AddLocalizationIf(Not(ObjectsEqual(Country.Self, Country.GetCapital.GetMarket.GetOwner)), 'SPEC_CARD_MEMBER')]"
