 concept_spec_financial_centres: "主要取引所"
 concept_spec_financial_centre_desc: "$concept_spec_financial_centres$とは、[Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]スコアが最も高い#v 5#!の[Concept('concept_country','$concept_countries|q$')]で、毎月順位が決まります。スコアは[concept_investment_pool]収入#v 6#!か月分の平方根に比例して増え、信認、1人当たりの富、金融街、企業、金融技術、[concept_rank]、経済システムによっても増えます。上位3位の平均は#v 100#!と表示されます。\n\n1位: [concept_prestige]#P +10%#!、[concept_loans]の金利#P -10%#!、融資上限#P +5#!か月\n最下位（#v 5#!）: #P +2%#!、#P -2%#!、#P +1#!か月\n融資上限のボーナスには[GetTechnology('central_banking').GetName]と、融資基準が#v 健全#!以上に厳格であることが必要"
