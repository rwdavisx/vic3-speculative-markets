 SPEC_SEP_EAGER_TT: "#header @spec_interest_eager! [concept_spec_investor_interest]: 意欲#!\n我が国の貿易に占める割合: #v [Country.MakeScope.Var('spec_heat_5').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n生産者の[concept_throughput]: #P +5%#!\n[concept_spec_market_confidence]: 毎月#P 上昇#!。貿易に占める割合が大きいほど効果が強まり、[concept_spec_financial_panic]の間は無効\n終わり方: [concept_spec_bust]"
 SPEC_SEP_KEEN_TT: "#header @spec_interest_keen! [concept_spec_investor_interest]: 積極#!\n我が国の貿易に占める割合: #v [Country.MakeScope.Var('spec_heat_4').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n生産者の[concept_throughput]: #P +3%#!\n終わり方: [concept_spec_correction]"
 SPEC_SEP_CALM_TT: "#header @spec_interest_calm! [concept_spec_investor_interest]: 平静#!\n我が国の貿易に占める割合: #v [Country.MakeScope.Var('spec_heat_3').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n効果なし"
 SPEC_SEP_DOUBTFUL_TT: "#header @spec_interest_doubtful! [concept_spec_investor_interest]: 懐疑#!\n我が国の貿易に占める割合: #v [Country.MakeScope.Var('spec_heat_2').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n生産者の[concept_throughput]: #N -5%#!\n好況が終わった後、回復中の商品はしばらくこの段階以下に留まります"
 SPEC_SEP_FLEEING_TT: "#header @spec_interest_fleeing! [concept_spec_investor_interest]: 逃避#!\n我が国の貿易に占める割合: #v [Country.MakeScope.Var('spec_heat_1').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n生産者の[concept_throughput]: #N -10%#!\n#v 過熱#!した好況がここまで冷え込むと、[concept_spec_collapse]に終わります"
 SPEC_IB_TURNING_TT: "#header 好況の転機#!\n[Goods.GetName]は大きな好況から下降に転じました。[concept_spec_investor_interest]が下がり続けると[concept_spec_collapse]に至り、[concept_spec_market_confidence]が約#N [Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#!低下します。"
