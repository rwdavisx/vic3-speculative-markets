 spec_rival.1.t11: "#v [ROOT.GetCountry.GetCapital.GetCityHubName]#!に売り崩し！"
 spec_rival.1.d11: "取引開始の鐘が鳴る前、#v [SCOPE.sCountry('target').GetName]#!の手先の仲買人たちが、我が国の鉄道株と銀行株の大口を一斉に売り浴びせた。株価は崩れ、相場表示機は追いつかず、昼には我が国の事務員までが恐怖に駆られて売っていた。\n\n我が国の[concept_spec_market_confidence]は6か月で#N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#!低下します。"
 spec_rival.1.f11: "「市場への殺到は、たった一つの噂から始まりうる。」"
 spec_rival.1.t10: "不発に終わった売り崩し"
 spec_rival.1.d10: "#v [SCOPE.sCountry('target').GetName]#!の手先の仲買人たちは、総崩れを見込んで我が国の株を一斉に売り浴びせた。だが我が国の銀行は売りに出された株をすべて買い取り、株価は持ちこたえた。終業の鐘が鳴る頃、損失に苦しんでいたのは仕掛けた側だった。\n\n相手自身の[concept_spec_market_confidence]は6か月で#P 3#!低下します。"
 spec_rival.1.f10: "\"持たざるものを売る熊は、当たっていなければならない。\""
 spec_rival.1.t21: "我々の資本が口説かれている"
 spec_rival.1.d21: "#v [SCOPE.sCountry('target').GetName]#!の代理人たちが我が国の最高級ホテルに部屋を取り、我が国の大投資家たちと毎晩食事を共にしている。彼らの申し出は単純だ。より良い利率、より安全な避難先、そして面倒な詮索は一切なし。\n\n12か月間、我が国の[concept_investment_pool]収入の#N [GetPlayer.MakeScope.Var('spec_rv_lure_share').GetValue|%0]#!が相手に流れます。"
 spec_rival.1.f21: "\"資本は厚遇される所へ行き、よく養われる所に留まる。\""
 spec_rival.1.t31: "ささやきの工作"
 spec_rival.1.d31: "#v [SCOPE.sCountry('target').GetName]#!の朝刊各紙は、#v [ROOT.GetCountry.GetCapital.GetCityHubName]#!の偽造された貸借対照表と揺らぐ銀行について長い記事を載せている。どれも署名はなく、真実のものはほとんどないが、大陸中の会計事務所で読まれている。\n\n我が国の[concept_spec_exchange]は信認を#N [Multiply_CFixedPoint('(CFixedPoint)0.0167', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|%0]#!失います。"
 spec_rival.1.f31: "\"真実が長靴を履いているうちに、嘘は世界を半周する。\""
 spec_rival.1.t3n: "金で雇われた工作が露見"
 spec_rival.1.d3n: "#v [SCOPE.sCountry('target').GetName]#!の新聞は、我が国の[concept_spec_exchange]への疑念で埋め尽くされていた。だが一人の事務員が口を割り、今や誰もがそのインク代を誰の金が払ったかを知っている。\n\n我が国は信認を失うが、相手も同じく失い、国外での評判も傷つく。"
 spec_rival.1.f3n: "\"闇に紛れて投げた泥でも、手は汚れる。\""
 spec_rival.1.t: "競合相手が仕掛けてきた"
 spec_rival.1.f: "「市場への殺到は、たった一つの噂から始まりうる。」"
 spec_rival.1.a: "同じ手で報いてやれ。"
 spec_rival.1.a_tt: "今年すでに行っていても、我が国も相手に同じことを行います。"
 spec_rival.1.a_1: "#v 売り崩し#!で反撃:"
 spec_rival.1.a_2: "#v 相手の資金を誘致#!:"
 spec_rival.1.a_3: "#v 報道工作#!で反撃:"
 spec_rival.1.b: "団結して対抗せよ。"
 spec_rival.1.b_tt: "12か月間、我が国に対する相手の行動は効果が半減します。費用は@money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]。"
 spec_rival.1.c: "何事もなかったように続けよう。"
 spec_rival.1.c_tt: "冷静さを保った我が国の[concept_spec_exchange]は信認を#P [Multiply_CFixedPoint('(CFixedPoint)0.01', Add_CFixedPoint('(CFixedPoint)1', Multiply_CFixedPoint('(CFixedPoint)1', SCOPE.sCountry('target').MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'))))|%0]#!得ます。受け流した相手の取引所が大きいほど、その価値も大きくなります。"
 spec_rival.1.d: "恐慌に乗じて買い込め。"
 spec_rival.1.d_tt: "我が国の銀行が売り手の放出した株を買い取ります。売り崩しで失う[concept_spec_market_confidence]は#P 半分#!になります。費用#N @money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rv_counter_cost')|D]#!（GDPの#v 1%#!）。"
 spec_rival.1.e: "相手の条件に合わせよ。"
 spec_rival.1.e_tt: "投資家に金を払って引き留めます。相手が奪う我が国の[concept_investment_pool]は#P 半分#!になります。費用#N @money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rv_counter_cost')|D]#!（GDPの#v 1%#!）。"
 spec_rival.1.g: "我が国の新聞で反論せよ。"
 spec_rival.1.g_tt: "我が国の新聞が数字を公表します。我が国の[concept_spec_exchange]は信認を#P 1%#!取り戻します。費用#N @money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rv_counter_cost')|D]#!（GDPの#v 1%#!）。"
 SPEC_DRIVER_RIVAL: "競合相手の行動"
 SPEC_DRIVER_RIVAL_TT: "#header 競合相手の行動: [Country.MakeScope.Var('spec_c_rival').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#italic 競合相手が我が国の市場に仕掛けた売り崩し。6か月に分けて効きます。#!\n#instruction 売り崩しで失う信頼度は、何回受けても1年で最大#v 4#!です。#!"
 spec_rival.1.d11_big: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#!の大取引所がついに我が国に目を留めたが、その目に映るものが気に入らないようだ。\n\n取引開始の鐘が鳴る前、#v [SCOPE.sCountry('target').GetName]#!の手先の仲買人たちが、我が国の鉄道株と銀行株の大口を一斉に売り浴びせた。株価は崩れ、相場表示機は追いつかず、昼には我が国の事務員までが恐怖に駆られて売っていた。\n\n我が国の[concept_spec_market_confidence]は6か月で#N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#!低下します。"
 spec_rival.1.d11_even: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#!と#v [ROOT.GetCountry.GetCapital.GetCityHubName]#!の取引所は何年も互いの様子をうかがってきた。時間の問題だったのだ。\n\n取引開始の鐘が鳴る前、#v [SCOPE.sCountry('target').GetName]#!の手先の仲買人たちが、我が国の鉄道株と銀行株の大口を一斉に売り浴びせた。株価は崩れ、相場表示機は追いつかず、昼には我が国の事務員までが恐怖に駆られて売っていた。\n\n我が国の[concept_spec_market_confidence]は6か月で#N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#!低下します。"
 spec_rival.1.d11_small: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#!の新興勢力は、#v [ROOT.GetCountry.GetCapital.GetCityHubName]#!の鼻をへし折ってやろうと決めた。\n\n取引開始の鐘が鳴る前、#v [SCOPE.sCountry('target').GetName]#!の手先の仲買人たちが、我が国の鉄道株と銀行株の大口を一斉に売り浴びせた。株価は崩れ、相場表示機は追いつかず、昼には我が国の事務員までが恐怖に駆られて売っていた。\n\n我が国の[concept_spec_market_confidence]は6か月で#N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#!低下します。"
 spec_rival.1.d10_big: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#!の大取引所がついに我が国に目を留めたが、その目に映るものが気に入らないようだ。\n\n#v [SCOPE.sCountry('target').GetName]#!の手先の仲買人たちは、総崩れを見込んで我が国の株を一斉に売り浴びせた。だが我が国の銀行は売りに出された株をすべて買い取り、株価は持ちこたえた。終業の鐘が鳴る頃、損失に苦しんでいたのは仕掛けた側だった。\n\n相手自身の[concept_spec_market_confidence]は6か月で#P 3#!低下します。"
 spec_rival.1.d10_even: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#!と#v [ROOT.GetCountry.GetCapital.GetCityHubName]#!の取引所は何年も互いの様子をうかがってきた。時間の問題だったのだ。\n\n#v [SCOPE.sCountry('target').GetName]#!の手先の仲買人たちは、総崩れを見込んで我が国の株を一斉に売り浴びせた。だが我が国の銀行は売りに出された株をすべて買い取り、株価は持ちこたえた。終業の鐘が鳴る頃、損失に苦しんでいたのは仕掛けた側だった。\n\n相手自身の[concept_spec_market_confidence]は6か月で#P 3#!低下します。"
 spec_rival.1.d10_small: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#!の新興勢力は、#v [ROOT.GetCountry.GetCapital.GetCityHubName]#!の鼻をへし折ってやろうと決めた。\n\n#v [SCOPE.sCountry('target').GetName]#!の手先の仲買人たちは、総崩れを見込んで我が国の株を一斉に売り浴びせた。だが我が国の銀行は売りに出された株をすべて買い取り、株価は持ちこたえた。終業の鐘が鳴る頃、損失に苦しんでいたのは仕掛けた側だった。\n\n相手自身の[concept_spec_market_confidence]は6か月で#P 3#!低下します。"
 spec_rival.1.d21_big: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#!の大取引所がついに我が国に目を留めたが、その目に映るものが気に入らないようだ。\n\n#v [SCOPE.sCountry('target').GetName]#!の代理人たちが我が国の最高級ホテルに部屋を取り、我が国の大投資家たちと毎晩食事を共にしている。彼らの申し出は単純だ。より良い利率、より安全な避難先、そして面倒な詮索は一切なし。\n\n12か月間、我が国の[concept_investment_pool]収入の#N [GetPlayer.MakeScope.Var('spec_rv_lure_share').GetValue|%0]#!が相手に流れます。"
 spec_rival.1.d21_even: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#!と#v [ROOT.GetCountry.GetCapital.GetCityHubName]#!の取引所は何年も互いの様子をうかがってきた。時間の問題だったのだ。\n\n#v [SCOPE.sCountry('target').GetName]#!の代理人たちが我が国の最高級ホテルに部屋を取り、我が国の大投資家たちと毎晩食事を共にしている。彼らの申し出は単純だ。より良い利率、より安全な避難先、そして面倒な詮索は一切なし。\n\n12か月間、我が国の[concept_investment_pool]収入の#N [GetPlayer.MakeScope.Var('spec_rv_lure_share').GetValue|%0]#!が相手に流れます。"
 spec_rival.1.d21_small: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#!の新興勢力は、#v [ROOT.GetCountry.GetCapital.GetCityHubName]#!の鼻をへし折ってやろうと決めた。\n\n#v [SCOPE.sCountry('target').GetName]#!の代理人たちが我が国の最高級ホテルに部屋を取り、我が国の大投資家たちと毎晩食事を共にしている。彼らの申し出は単純だ。より良い利率、より安全な避難先、そして面倒な詮索は一切なし。\n\n12か月間、我が国の[concept_investment_pool]収入の#N [GetPlayer.MakeScope.Var('spec_rv_lure_share').GetValue|%0]#!が相手に流れます。"
 spec_rival.1.d31_big: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#!の大取引所がついに我が国に目を留めたが、その目に映るものが気に入らないようだ。\n\n#v [SCOPE.sCountry('target').GetName]#!の朝刊各紙は、#v [ROOT.GetCountry.GetCapital.GetCityHubName]#!の偽造された貸借対照表と揺らぐ銀行について長い記事を載せている。どれも署名はなく、真実のものはほとんどないが、大陸中の会計事務所で読まれている。\n\n我が国の[concept_spec_exchange]は信認を#N [Multiply_CFixedPoint('(CFixedPoint)0.0167', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|%0]#!失います。"
 spec_rival.1.d31_even: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#!と#v [ROOT.GetCountry.GetCapital.GetCityHubName]#!の取引所は何年も互いの様子をうかがってきた。時間の問題だったのだ。\n\n#v [SCOPE.sCountry('target').GetName]#!の朝刊各紙は、#v [ROOT.GetCountry.GetCapital.GetCityHubName]#!の偽造された貸借対照表と揺らぐ銀行について長い記事を載せている。どれも署名はなく、真実のものはほとんどないが、大陸中の会計事務所で読まれている。\n\n我が国の[concept_spec_exchange]は信認を#N [Multiply_CFixedPoint('(CFixedPoint)0.0167', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|%0]#!失います。"
 spec_rival.1.d31_small: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#!の新興勢力は、#v [ROOT.GetCountry.GetCapital.GetCityHubName]#!の鼻をへし折ってやろうと決めた。\n\n#v [SCOPE.sCountry('target').GetName]#!の朝刊各紙は、#v [ROOT.GetCountry.GetCapital.GetCityHubName]#!の偽造された貸借対照表と揺らぐ銀行について長い記事を載せている。どれも署名はなく、真実のものはほとんどないが、大陸中の会計事務所で読まれている。\n\n我が国の[concept_spec_exchange]は信認を#N [Multiply_CFixedPoint('(CFixedPoint)0.0167', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|%0]#!失います。"
 spec_rival.1.d3n_big: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#!の大取引所がついに我が国に目を留めたが、その目に映るものが気に入らないようだ。\n\n#v [SCOPE.sCountry('target').GetName]#!の新聞は、我が国の[concept_spec_exchange]への疑念で埋め尽くされていた。だが一人の事務員が口を割り、今や誰もがそのインク代を誰の金が払ったかを知っている。\n\n我が国は信認を失うが、相手も同じく失い、国外での評判も傷つく。"
 spec_rival.1.d3n_even: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#!と#v [ROOT.GetCountry.GetCapital.GetCityHubName]#!の取引所は何年も互いの様子をうかがってきた。時間の問題だったのだ。\n\n#v [SCOPE.sCountry('target').GetName]#!の新聞は、我が国の[concept_spec_exchange]への疑念で埋め尽くされていた。だが一人の事務員が口を割り、今や誰もがそのインク代を誰の金が払ったかを知っている。\n\n我が国は信認を失うが、相手も同じく失い、国外での評判も傷つく。"
 spec_rival.1.d3n_small: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#!の新興勢力は、#v [ROOT.GetCountry.GetCapital.GetCityHubName]#!の鼻をへし折ってやろうと決めた。\n\n#v [SCOPE.sCountry('target').GetName]#!の新聞は、我が国の[concept_spec_exchange]への疑念で埋め尽くされていた。だが一人の事務員が口を割り、今や誰もがそのインク代を誰の金が払ったかを知っている。\n\n我が国は信認を失うが、相手も同じく失い、国外での評判も傷つく。"
 spec_rival.1.desc: "競合相手が我が国の[concept_spec_exchange]に対して動きました。"
 SPEC_RV_RAID_TT: "#header 売り崩し#!\n$TOOLTIP_DELIMITER$\n#italic 我が国の仲買人が[Country.GetNameNoFormatting]の株を一斉に売り浴びせ、相手の市場を暴落させます。#!\n$TOOLTIP_DELIMITER$\n#b 成功した場合#!\n[Country.GetNameNoFormatting]の[concept_spec_market_confidence]: #v 6#!か月で#P -[Multiply_CFixedPoint('(CFixedPoint)3', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|0]#!\n勝負: 我が国側へ#P 10%#!\n\n#b 失敗した場合#!（確率#N [Min_CFixedPoint('(CFixedPoint)80', Add_CFixedPoint('(CFixedPoint)20', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint('(CFixedPoint)0', Divide_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, GetPlayer.MakeScope.Var('spec_centre_score').GetValue), Max_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|0]%#!）\n我が国の[concept_spec_market_confidence]: #v 6#!か月で#N -3#!\n勝負: 相手側へ#N 10%#!\n$TOOLTIP_DELIMITER$\n費用: [concept_treasury]から#N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#!\n再使用まで: [Country.GetNameNoFormatting]に対して#v 1年#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_raid').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_RAID')]"
 SPEC_RV_WHY_RV_RAID: "\n\n[GetScriptedGui('spec_sgui_rv_raid').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_LURE_TT: "#header 資金誘致#!\n$TOOLTIP_DELIMITER$\n#italic 我が国の銀行家が、よりよい条件で[Country.GetNameNoFormatting]の投資家を口説きます。#!\n$TOOLTIP_DELIMITER$\n[Country.GetNameNoFormatting]の[concept_investment_pool]収入の#P [Multiply_CFixedPoint('(CFixedPoint)0.05', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|%0]#!が、#v 12#!か月間我が国に流れます\n勝負: 我が国側へ#P 10%#!\n$TOOLTIP_DELIMITER$\n費用: 我が国の[concept_spec_outstanding_credit]に#N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_lure_debt_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#!が加わる\n再使用まで: [Country.GetNameNoFormatting]に対して#v 1年#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_lure').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_LURE')]"
 SPEC_RV_WHY_RV_LURE: "\n\n[GetScriptedGui('spec_sgui_rv_lure').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_PRESS_TT: "#header 報道工作#!\n$TOOLTIP_DELIMITER$\n#italic 友好的な新聞が、[Country.GetNameNoFormatting]の[concept_spec_exchange]への疑念で紙面を埋めます。#!\n$TOOLTIP_DELIMITER$\n#b 成功した場合#!\n[Country.GetNameNoFormatting]の[concept_spec_exchange]の信認: #P -[Multiply_CFixedPoint('(CFixedPoint)0.0167', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|%0]#!\n勝負: 我が国側へ#P 10%#!\n\n#b 露見した場合#!（確率#N [Country.MakeScope.ScriptValue('spec_rv_press_expose')|0]%#!、[Country.GetNameNoFormatting]の報道が自由なほど高い）\n[Country.GetNameNoFormatting]との[concept_relations]: #N -20#!\n我が国の[concept_spec_exchange]の信認: #N -1.7%#!\n勝負: 相手側へ#N 10%#!\n$TOOLTIP_DELIMITER$\n費用: #v 12#!か月間[concept_influence] #N -75#! @inf!\n再使用まで: [Country.GetNameNoFormatting]に対して#v 1年#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_press').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_PRESS')]"
 SPEC_RV_WHY_RV_PRESS: "\n\n[GetScriptedGui('spec_sgui_rv_press').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_HOLD_TT: "#header 踏みとどまる#!\n$TOOLTIP_DELIMITER$\n#italic [Country.GetNameNoFormatting]が売ったものを買い戻し、勝負の我が国側を立て直します。#!\n$TOOLTIP_DELIMITER$\n[Country.GetNameNoFormatting]の押し込みを1回帳消しにし、勝負を我が国側へ#P 10%#!戻します\n現在の我が国に対する相手の押し込み: #v [Country.MakeScope.Var('spec_rv_ui_them').GetValue|0]#!\n$TOOLTIP_DELIMITER$\n費用: [concept_treasury]から#N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#!\n再使用まで: [Country.GetNameNoFormatting]に対して#v 1年#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_hold').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_HOLD')]"
 SPEC_RV_WHY_RV_HOLD: "\n\n[GetScriptedGui('spec_sgui_rv_hold').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_SHORE_TT: "#header 下支え#!\n$TOOLTIP_DELIMITER$\n#italic 我が国の銀行が[Country.GetNameNoFormatting]に対して結束します。#!\n$TOOLTIP_DELIMITER$\n[Country.GetNameNoFormatting]の我が国に対する行動は、#v 12#!か月間効果が#P 半分#!になります\n$TOOLTIP_DELIMITER$\n費用: [concept_treasury]から#N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#!\n再使用まで: [Country.GetNameNoFormatting]に対して#v 2年#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_shore').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_SHORE')]"
 SPEC_RV_WHY_RV_SHORE: "\n\n[GetScriptedGui('spec_sgui_rv_shore').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
