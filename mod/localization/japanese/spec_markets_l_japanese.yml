 SPEC_WHY_SPEED: "#header 投資家の反応#!\n$TOOLTIP_DELIMITER$\n#italic 投資家が価格の変化をどれだけ速く追いかけるか。#!\n\n価格上昇時: #v x[Country.MakeScope.ScriptValue('spec_hype_mult')|2]#!\n価格下落時: #v x[Country.MakeScope.ScriptValue('spec_hype_mult_down')|2]#!\n$TOOLTIP_DELIMITER$\n#b 理由#!\n経済システムに由来#v x[Country.MakeScope.ScriptValue('spec_law_mult')|2]#!\n[concept_spec_credit_policy]に由来#v x[Country.MakeScope.ScriptValue('spec_stance_hype')|2]#![AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_stance_hype'), '(CFixedPoint)1'), 'SPEC_WHY_SPEED_LOOSE')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_tech_hype'), '(CFixedPoint)1')), 'SPEC_WHY_SPEED_TECH')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_depth'), '(CFixedPoint)1')), 'SPEC_WHY_SPEED_DEPTH')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_band_gain'), '(CFixedPoint)1')), 'SPEC_WHY_SPEED_BAND')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_hype'), '(CFixedPoint)1')), 'SPEC_WHY_SPEED_EXCH')]\n$TOOLTIP_DELIMITER$\n#weak 高いほど、[concept_spec_investor_interest]が価格の上下に速く追随します#!"
