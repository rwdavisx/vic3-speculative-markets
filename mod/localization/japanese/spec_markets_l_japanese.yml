 SPEC_IL_ISSUE_FILTER: "\n\n進行中の大規模発行も表示されます。"
 SPEC_IL_SORT_LEVER_BASE_TT: "#header 介入を表示#!\n$TOOLTIP_DELIMITER$\n[concept_spec_intervention]を実施中の物資のみを表示\n\n#instruction クリックで絞り込み、もう一度クリックですべて表示#!"
 SPEC_IL_DANGER_TT: "#header 崩壊の領域#!\n$TOOLTIP_DELIMITER$\n#italic 好況が大きすぎて、今下がると悪い終わり方をします。#!\n\n[concept_spec_investor_interest]がここまで下がると、好況は[concept_spec_collapse]に終わります\nその場合、[concept_spec_market_confidence]が約#N [Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#!失われます"
 SPEC_IL_CRASHED_TT: "#header [Goods.GetName]: 好況終息#!\n$TOOLTIP_DELIMITER$\n#italic この物資の好況はちょうど終わりました。#!\n\n今月、[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]に終わりました\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))]にわたって#N 投資家は離れたまま#!です\nこれを生産する[Concept('concept_company','$concept_companies|q$')]は[concept_throughput]を#N 失います#!"
 SPEC_IL_GLUT_TT: "#header [Goods.GetName]は回復中#!\n$TOOLTIP_DELIMITER$\n#italic 前回の好況が終わり、投資家はまだ警戒しています。#!\n\nその好況は[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]に終わりました\n[concept_spec_investor_interest]は[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))]にわたって#v 懐疑#!以下に#N 留まります#!\nこれを生産する[Concept('concept_company','$concept_companies|q$')]は[concept_throughput]を#N 失います#!"
 SPEC_TILE_BANKS: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_expx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_BANKS_ON', 'SPEC_GOODS_NONE')]$SPEC_TILE_CYCLE$"
