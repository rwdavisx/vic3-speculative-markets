 SPEC_EFFECT_LAX_TT: "#header @spec_lending_standards! [concept_spec_lending_standards]: $SPEC_EFFECT_LAX_VALUE$#!\n$TOOLTIP_DELIMITER$\n#italic 我が国の銀行が融資にどれほど慎重か。不注意な銀行ほど多く融資しますが、好況の終わりも激しくなります。#!\n\n#b 通常（#v 健全#!）との比較#!\n毎月の融資額: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_credit'), '(CFixedPoint)1')|+%0]#!\n好況に向かう融資の通常の割合に対して: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_pull'), '(CFixedPoint)1')|+%0]#!\n銀行救済の費用: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_cost'), '(CFixedPoint)1')|+%0]#!\n\n#b 変化の仕方#!\n平穏な月ごとに少し#N 緩む#!（#v 厳格#!から#v 無謀#!まで約#v 20#!年）\n銀行を救済するたびに#N 大きく緩む#!\n好況が終わるか、好況を抑制すると#P 引き締まる#!\n[concept_spec_financial_panic]が救済なしに終わると#P 大きく引き締まる#!\n$TOOLTIP_DELIMITER$\n#instruction [concept_spec_credit_policy]を#v 引き締め#!にすると緩むのが止まります。恐慌中や不良債権がある間も止まります。#v 健全#!以上に厳格なら、[concept_spec_exchange]の信認も高まります。#!"
 SPEC_TILE_CYCLE: "[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_overx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_OVER_ON', 'SPEC_GOODS_NONE')][SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_bb_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_TILE_BB_ON', 'SPEC_GOODS_NONE')]"
 SPEC_TILE_OVER_ON: "\n\n#title 過剰建設:#! この好況の開始以来、供給が#v [Country.MakeScope.Var(Concatenate('spec_ui_over_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#!増加\nこの好況が終わると、[concept_spec_market_confidence]への打撃が#N x[Country.MakeScope.Var(Concatenate('spec_ui_overx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|2]#!になります"
 SPEC_TILE_BB_ON: "\n\n#title 好況建設:#! 投資家の関心がこの水準にある間、その産業の建設効率#P +[Country.MakeScope.Var(Concatenate('spec_ui_bb_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#!"
 SPEC_NOTE_CYCLE: "[SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)2.5'), 'SPEC_NOTE_PPL_3', SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)1.5'), 'SPEC_NOTE_PPL_2', SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)0.5'), 'SPEC_NOTE_PPL_1', 'SPEC_GOODS_NONE')))]"
 SPEC_NOTE_OVER_ON: "好況中にあまりに多くが建設されていたため、下落は#N x[SCOPE.GetValue('spec_note_over')|2]#!倍の激しさでした。"
 SPEC_NOTE_PPL_1: "その産業を所有していた労働者が損失を被り、一部はその所在州で[Concept('concept_radical', '$concept_radicals|q$')]になりました。"
 SPEC_NOTE_PPL_2: "所有者が損失を被り、一部はその所在州で[Concept('concept_radical', '$concept_radicals|q$')]になりました。"
 SPEC_NOTE_PPL_3: "所有者と一般の預金者が損失を被り、多くがその所在州で[Concept('concept_radical', '$concept_radicals|q$')]になりました。"
