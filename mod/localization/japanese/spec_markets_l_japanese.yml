 spec_lever_not_encourage_tt: "この商品への投資が奨励されていない"
 spec_levers: "市場介入"
 spec_lever_authority_tt: "十分な[concept_authority]がある"
 spec_lever_fits_restrain_tt: "[concept_spec_investor_interest]が#v 意欲#!以上である、または好況の終息によって[concept_spec_market_confidence]を#v 2#!以上失う"
 spec_lever_fits_encourage_tt: "[concept_spec_investor_interest]が#v 積極#!未満であり、[concept_good]が好況後の回復中ではなく、[concept_spec_bust]や[concept_spec_collapse]に終わる恐れのある好況もない"
 SPEC_LEVER_RESTRAIN_TT: "#header [Goods.GetName]の投機を抑制#!\n$TOOLTIP_DELIMITER$\n[concept_spec_investor_interest]: 数か月かけて#v 平静#!まで低下\n[concept_authority]: 毎月#N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#!#indent_newline:3 \n基準価値に由来#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#!（その消費税の半分）\n貿易割合に由来#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#!（我が国の市場の#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#!）#!\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_DOWN', 'SPEC_LEVER_NONE')][concept_budget_additional_income]: 毎週#P @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_levy_', Goods.GetKey))|D]#!、基準価格での週間生産額の10%に相当する賦課金\n\n抑制されている間、その好況は拡大も即時の終息もしません。約1年かけて[concept_spec_correction]として収束し、毎月わずかに[concept_spec_market_confidence]を損ないます。\n\n#lore 南海泡沫事件の後に新規の株式会社を制限した、1720年の泡沫会社規制法のように。#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_restrain_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_restrain').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_LEVER_ENCOURAGE_TT: "#header [Goods.GetName]への投資を奨励#!\n$TOOLTIP_DELIMITER$\n[concept_spec_investor_interest]: 数か月かけて#v 積極#!まで上昇\n[concept_authority]: 毎月#N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#!#indent_newline:3 \n基準価値に由来#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#!（その消費税の半分）\n貿易割合に由来#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#!（我が国の市場の#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#!）#!\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_UP', 'SPEC_LEVER_NONE')][concept_budget_additional_expenses]: 毎週#N @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_subsidy_', Goods.GetKey))|D]#!、基準価格での週間生産額の20%に相当する助成金\n\n[concept_good]が#v 意欲#!になると自動的に解除されるため、その好況は自然に終わりえます。\n\n#lore 1800年代半ばにイギリス領インドとフランスが鉄道投資家に与えた利益保証のように。#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_encourage_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_encourage').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
