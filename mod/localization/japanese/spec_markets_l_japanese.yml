 concept_spec_intervention_desc: "$concept_spec_intervention$によって、政府は[concept_good]の#v 投機を抑制#!したり、#v 投資を奨励#!したりできます。\n\n#v 投機の抑制#!: [concept_spec_investor_interest]が#v 平静#!まで低下、生産者の[concept_throughput] #N -10%#!、基準価格での週間生産額の#v 10%#!を賦課金として徴収\n#v 投資の奨励#!: 関心が#v 積極#!まで上昇、生産者の[concept_throughput] #P +10%#!、#v 20%#!の助成金\n\nいずれも解除するまで毎月[concept_authority]を消費し、生活必需品や[concept_market]の貿易に占める割合が大きい物資ほど消費量が増えます。"
 SPEC_LEVER_ISSUE_TT: "#header [Goods.GetName]で大型起債を行う#!\n$TOOLTIP_DELIMITER$\n#v 2#!年間:\n[Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]スコア: #P +25%#!\nこの好況が終わると、そこへの銀行融資は#N x1.5#!として数えられます\n好況の終息時に得る、または失う信認: #v x2#!\n$TOOLTIP_DELIMITER$\n全国級以上の地位、[concept_spec_investor_interest]が#v 意欲#!以上、[concept_spec_intervention]がないことが必要です。大型起債は一度に1件のみで、次の起債はこの起債の終了から#v 1#!年後に行えます。[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_issue_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_ISSUE_ON', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_issue').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_ISSUE_ON: "\n\nこの[concept_good]で起債が進行中です"
 spec_issue_stand_tt: "我が国の[concept_spec_exchange]が#v 全国級#!以上"
 spec_issue_hot_tt: "[concept_spec_investor_interest]が#v 意欲#!以上"
 spec_issue_one_tt: "他の起債が進行中でない"
 spec_issue_cool_tt: "前回の起債から市場が1年間休んでいる"
 spec_issue_no_lever_tt: "この[concept_good]に[concept_spec_intervention]が実施されていない"
 spec_lever_no_issue_tt: "この[concept_good]で大型起債が進行中でない"
 SPEC_LEVERS_TT: "#header 市場介入#!\n毎月[concept_authority] #N -[Country.MakeScope.ScriptValue('spec_lever_authority')|0]#!\n$TOOLTIP_DELIMITER$\n抑制中: #v [Country.MakeScope.ScriptValue('spec_n_restrain')|0]#!\n奨励中: #v [Country.MakeScope.ScriptValue('spec_n_encourage')|0]#!\n[concept_budget_additional_income]: 毎週#P @money![Country.MakeScope.ScriptValue('spec_lever_levy')|D]#!\n[concept_budget_additional_expenses]: 毎週#N @money![Country.MakeScope.ScriptValue('spec_lever_spend')|D]#!"
 spec_story.1.t: "[ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName]市場の瓦解"
 spec_story.1.t_generic: "市場の瓦解"
 spec_story.1.d: "[ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName]への殺到は終わった。1年かけて上がった価格は1か月で崩れ、熱狂の頂点で設立された会社は手形を決済できない。値段を問わず買い付けた商人には、売り払えない在庫を抱えた倉庫が残り、その在庫を担保に金を貸した銀行は損失を数えている。"
 spec_story.1.d_generic: "この時期の人気商品への殺到は終わった。1年かけて上がった価格は1か月で崩れ、熱狂の頂点で設立された会社は手形を決済できない。値段を問わず買い付けた商人には、売り払えない在庫を抱えた倉庫が残り、その在庫を担保に金を貸した銀行は損失を数えている。"
 spec_story.1.f: "「[ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName]を商って30年になるが、この1年ほど皆が熱心に買い、必死に売ろうとする姿は見たことがない」"
 spec_story.1.f_generic: "「この商売を始めて30年になるが、この1年ほど皆が熱心に買い、必死に売ろうとする姿は見たことがない」"
 spec_story.1.a: "破産した生産者に救済の手を差し伸べよ。"
 spec_story.1.b: "弱い商会は淘汰に任せよ。"
 spec_story.1.c: "発起人たちを調査せよ。"
 spec_story.2.t: "詐欺の発覚"
 spec_story.2.d: "[ROOT.GetCountry.GetCapital.GetCityHubName][ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName]会社の取締役たちが国外へ逃亡した。帳簿を調べると、過去2年間の高配当は新たな出資金から支払われていたことが明らかになった。何千もの事務員、未亡人、商店主がこの会社の株を持っていた。今や[ROOT.GetCountry.GetCapital.GetCityHubName]の新聞各紙は、ほかにいくつの目論見書が同じ手で書かれたのかと問いただしている。"
 spec_story.2.d_generic: "[ROOT.GetCountry.GetCapital.GetCityHubName]の名高い株式会社の取締役たちが国外へ逃亡した。帳簿を調べると、過去2年間の高配当は新たな出資金から支払われていたことが明らかになった。何千もの事務員、未亡人、商店主がこの会社の株を持っていた。今や[ROOT.GetCountry.GetCapital.GetCityHubName]の新聞各紙は、ほかにいくつの目論見書が同じ手で書かれたのかと問いただしている。"
 spec_story.2.f: "#bold 詐欺容疑により指名手配#!\n[ROOT.GetCountry.GetCapital.GetCityHubName][ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName]会社の専務取締役。年の頃50歳、身なりはよく、もっともらしい物腰。最後の目撃場所は波止場。"
 spec_story.2.f_generic: "#bold 詐欺容疑により指名手配#!\n[ROOT.GetCountry.GetCapital.GetCityHubName]の株式会社の専務取締役。年の頃50歳、身なりはよく、もっともらしい物腰。最後の目撃場所は波止場。"
 spec_story.2.a: "取締役たちを訴追せよ。"
 spec_story.2.b: "事を荒立てるな。"
 spec_story.2.c: "小口投資家を補償せよ。"
 spec_story.3.t: "銀行への取り付け"
 spec_story.3.d: "今朝、[ROOT.GetCountry.GetCapital.GetCityHubName]でも指折りの老舗銀行を預金者が取り囲み、正午には扉が閉ざされた。その銀行券は市内の至る所で受け取りを拒まれ、そこに口座を持つ企業は今週の賃金を払えない。他の銀行の前に並ぶ列も、刻一刻と長くなっている。"
 spec_story.3.f: "「父も、父の父も、あの銀行に貯金していた。国庫と同じくらい確かだと言われていたのに」"
 spec_story.3.a: "預金を保証せよ。"
 spec_story.3.b: "存続も破綻も自力で決するべきだ。"
 spec_story.3.c: "銀行に融資せねばならない。"
 spec_story.4.t: "[ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]の恐慌"
 spec_story.4.t_generic: "国外の恐慌"
 spec_story.4.d: "[ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]で[concept_spec_financial_panic]が起きたとの報が[ROOT.GetCountry.GetCapital.GetCityHubName]に届いた。同国の銀行は国外への融資を回収しており、[ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]に販売したり、そこで借り入れたりしていた我が国の企業は、突然資金不足に陥った。取引所の商人たちは皆、この災いが広がるかどうかを知りたがっている。"
 spec_story.4.d_generic: "外国で金融恐慌が起きたとの報が[ROOT.GetCountry.GetCapital.GetCityHubName]に届いた。外国の銀行は融資を回収しており、海外に販売したり、海外で借り入れたりしていた我が国の企業は、突然資金不足に陥った。取引所の商人たちは皆、この災いが広がるかどうかを知りたがっている。"
 spec_story.4.f: "「[ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]がくしゃみをすると、我が国の取引所は寝込んでしまう」"
 spec_story.4.f_generic: "「隣国がくしゃみをすると、我が国の取引所は寝込んでしまう」"
 spec_story.4.a: "我が国の商会に融資せよ。"
 spec_story.4.b: "他国の苦境は我が国の苦境ではない。"
 spec_story.4.c: "無謀な外国の銀行家を非難せよ。"
 spec_story.5.t: "信頼の回復"
 spec_story.5.d: "恐慌の最悪の時期は過ぎた。生き残った企業は再び人を雇い、銀行は堅実な顧客に貸し始め、勇気ある少数の投資家は昨年の何分の一かの値で株を買っている。かつての行き過ぎがすぐに戻ると考える者はいないが、[ROOT.GetCountry.GetCapital.GetCityHubName]は再び商いの場となった。"
 spec_story.5.f: "「春に何もかも売った連中が、秋には買い戻している。しかも、売った時よりよい値段で」"
 spec_story.5.a: "新たな事業を奨励しよう。"
 spec_story.5.b: "今度こそ健全な融資を。"
 spec_story.6.t: "製造業者の代表団"
 spec_story.6.d: "製造業者と商人の代表団が政府を訪れた。彼らによれば、融資が得られず新工場は未完成のまま放置され、その間に国外の競争相手は自由に借り入れて市場を奪っているという。銀行が再び貸し出せるようにしてほしいと求めている。"
 spec_story.6.f: "「閣下のご慎重さのおかげで、暴落は免れました。暴落するものが何一つ残らなくなりましたからな」"
 spec_story.6.a: "信用を緩和せよ。"
 spec_story.6.b: "引き締めを維持せよ。"
 spec_story.6.c: "代わりに助成金を与えよう。"
 spec_story.7.t: "株式熱"
 spec_story.7.d: "事務員、商店主、教師が[ROOT.GetCountry.GetCapital.GetCityHubName]の喫茶店に詰めかけ、見たこともない会社の株を売買している。[ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName]事業の株は1日に何度も持ち主を変え、その大半は借金で買われている。使用人まで、次の株式募集に加わろうと蓄えを担保にしているという。"
 spec_story.7.d_generic: "事務員、商店主、教師が[ROOT.GetCountry.GetCapital.GetCityHubName]の喫茶店に詰めかけ、見たこともない会社の株を売買している。最新の事業の株は1日に何度も持ち主を変え、その大半は借金で買われている。使用人まで、次の株式募集に加わろうと蓄えを担保にしているという。"
 spec_story.7.f: "「今朝、床屋が[ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName]株の耳寄りな話をくれた。ありがたく受け取り、こちらも一言返してやった。売れ、と」"
 spec_story.7.f_generic: "「今朝、床屋が株の耳寄りな話をくれた。ありがたく受け取り、こちらも一言返してやった。売れ、と」"
 spec_story.7.a: "民衆にも富を分かち合おう。"
 spec_story.7.b: "借金による取引を禁じよ。"
 spec_story.7.c: "株式の譲渡に印紙税を課せ。"
 spec_story.8.t: "バブルへの警告"
 spec_story.8.d: "高名な経済学者が[ROOT.GetCountry.GetCapital.GetCityHubName]の有力紙に寄稿し、[ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName]と[ROOT.GetCountry.MakeScope.Var('spec_story_good2').GetGoods.GetName]の値上がりは続かず、銀行は分別ある者なら誰も払わぬ価格を当てに融資していると論じた。仲買人たちは老婆の繰り言だとあざ笑う。それでも、その投書は市内のあらゆるクラブや商館で読み上げられている。"
 spec_story.8.d_generic: "高名な経済学者が[ROOT.GetCountry.GetCapital.GetCityHubName]の有力紙に寄稿し、今最も人気のある商品の値上がりは続かず、銀行は分別ある者なら誰も払わぬ価格を当てに融資していると論じた。仲買人たちは老婆の繰り言だとあざ笑う。それでも、その投書は市内のあらゆるクラブや商館で読み上げられている。"
 spec_story.8.f: "「価格とは、最後の買い手が払う気になった額にすぎない。読者諸君には、あと何人の買い手が残っているか考えていただきたい」"
 spec_story.8.a: "時宜を得た警告だ。"
 spec_story.8.b: "不安を煽るたわごとだ。"
