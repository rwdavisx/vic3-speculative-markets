 SPEC_RISK_SLIGHT: "#header $SPEC_UNWIND$の危険#!\n好況終息時の[concept_spec_market_confidence]: #v わずかな低下#!\n$TOOLTIP_DELIMITER$\n$SPEC_UNWIND_DESC$"
 SPEC_RISK_GLUT: "#header 回復中#!\n$TOOLTIP_DELIMITER$\n[Goods.GetName]は前回の好況の終息から回復しつつあります。投資家は投資を控えており、[concept_spec_investor_interest]はしばらく#v 懐疑#!に留まります。"
 SPEC_RISK_CALM: "#header 好況なし#!\n$TOOLTIP_DELIMITER$\n[Goods.GetName]には最近の好況がありません。[concept_spec_investor_interest]が#v 積極#!以上に達した後、#v 懐疑#!まで下がると好況が終わります。頂点が高いほど、下落も激しくなります。"
 SPEC_UNWIND_3: "崩壊"
 SPEC_UNWIND_C_3: "[concept_spec_collapse]"
 SPEC_UNWIND_DESC_3: "この[concept_good]は#v 過熱#!に達する好況を経験しました。価格動向が#v [Divide_CFixedPoint('(CFixedPoint)-4.988', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!を下回ると、[concept_spec_investor_interest]が#v 逃避#!に変わり、好況は[concept_spec_collapse]に終わります。その後#v 12#!か月間、投資家は投資を控えます。好況の開始から時間がたつほど危険は薄れます。"
 SPEC_UNWIND_2: "破綻"
 SPEC_UNWIND_C_2: "[concept_spec_bust]"
 SPEC_UNWIND_DESC_2: "この[concept_good]は#v 意欲#!に達する好況を経験しました。価格動向が#v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!を下回ると、[concept_spec_investor_interest]が#v 懐疑#!に変わり、好況は[concept_spec_bust]に終わります。その後#v 6#!か月間、投資家は投資を控えます。好況の開始から時間がたつほど危険は薄れます。"
 SPEC_UNWIND_1: "調整"
 SPEC_UNWIND_C_1: "[concept_spec_correction]"
 SPEC_UNWIND_DESC_1: "この[concept_good]は#v 積極#!に達する好況を経験しました。価格動向が#v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!を下回ると、[concept_spec_investor_interest]が#v 懐疑#!に変わり、好況は[concept_spec_correction]に終わります。その後#v 3#!か月間、投資家は投資を控えます。好況の開始から時間がたつほど危険は薄れます。"
