 SPEC_DRIVER_WORLD_TT: "#header $SPEC_LD_NAME$: [Country.MakeScope.Var('spec_c_world').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#italic 世界全体が不況に陥り、ここの[concept_spec_market_confidence]も引きずられています。#!\n\n不況の局面に由来[Country.MakeScope.Var('spec_ld_conf').GetValueWithDefault('(CFixedPoint)0')|+=2][AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_world').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_ld_conf').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_world').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_ld_conf').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)-0.01'))), 'SPEC_WORLD_TARIFF')]\n$TOOLTIP_DELIMITER$\n#b 局面ごとの毎月の効果#!\n世界的暴落: #N -4#!\n不況: #N -0.6#!\n回復: #P +1#!"
