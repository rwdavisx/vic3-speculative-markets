 concept_spec_market_confidence: "市場信頼度"
 concept_spec_market_confidence_desc: "$concept_spec_market_confidence$は、投資家が[concept_country]の[concept_market]をどう見ているかを、#v 0#!（#v 恐慌#!）から#v 100#!（#v 狂乱#!）で表します。恐怖は投資を鈍らせ、[concept_loans]の金利を高めます。欲は投資を加速させます。\n\n好況にある[Concept('concept_good','$concept_goods|q$')]は信頼度を高め、[Concept('concept_spec_boom_end','$concept_spec_boom_ends|q$')]、[Concept('concept_spec_foreign_panic','$concept_spec_foreign_panics|q$')]、[Concept('concept_diplomatic_play','$concept_diplomatic_plays|q$')]、[concept_war]は低下させます。経済に占める$building_financial_district$の割合が大きいほど好況もその終息も激しくなり、$building_manor_house$のほうが多いと穏やかになります。\n\n#v 55#!を上回ると銀行は[concept_investment_pool]に融資し、#v 80#!で市場は[concept_spec_speculative_mania]に入り、#v 25#!を下回ると[concept_spec_financial_panic]が始まります。"
 concept_spec_speculative_mania: "投機狂乱"
 concept_spec_speculative_mania_desc: "[concept_spec_market_confidence]が#v 80#!以上の間、[concept_market]は$concept_spec_speculative_mania$にあります。銀行の[concept_investment_pool]への融資は最大となりますが、[concept_spec_boom_end]による$concept_spec_market_confidence$の損失も増えます。狂乱が長く続くか極度に高まると、[GetLawType('law_laissez_faire').GetName]を支持する[Concept('concept_political_movement','$concept_political_movements|q$')]への支持が数年間増加します。"
 concept_spec_financial_panic: "金融恐慌"
 concept_spec_financial_panics: "金融恐慌"
 concept_spec_financial_panic_desc: "$concept_spec_financial_panic$は、[concept_spec_market_confidence]が恐慌の発生水準#v 25#!を下回ると始まります。[concept_spec_leverage]が#v 3#!か月分を超えると、この水準は最大#v 65#!まで上昇します。$building_financial_district$が少ないと低くなり、最低#v 20#!まで下がります。\n\nすべての建物の[concept_throughput]と徴収される税を減らし、終わるまで毎週[concept_treasury]に失業者救済の費用を負わせ、[concept_private_construction]と投資を鈍らせ、[Concept('concept_company','$concept_companies|q$')]の[concept_throughput]ボーナスを下げ、一部の投資家を[Concept('concept_radical','$concept_radicals|q$')]に変え、銀行に[concept_investment_pool]から[concept_spec_outstanding_credit]を回収させます。\n\n関係のある各[concept_country]は[concept_spec_foreign_panic]に見舞われ、資金は他の平静な[Concept('concept_great_power','$concept_great_powers|q$')]へと逃れます。その後数年間、[GetLawType('law_laissez_faire').GetName]に反対する[Concept('concept_political_movement','$concept_political_movements|q$')]への支持が増えます。"
 concept_spec_foreign_panic: "外国の恐慌"
 concept_spec_foreign_panics: "外国の恐慌"
 concept_spec_foreign_panic_desc: "$concept_spec_foreign_panic$は、[concept_market]の共有、従属関係、投資権、盛んな貿易、経済の所有によって結びついた国で[concept_spec_financial_panic]が始まると、[concept_country]の[concept_spec_market_confidence]を低下させます。関係が密接なほど損失は大きくなります。[GetLawType('law_free_trade').GetName]は貿易関係を強め、その他の貿易政策は弱めます。[concept_embargo]は貿易関係を断ちます。"
 concept_spec_boom_end: "好況の終息"
 concept_spec_boom_ends: "好況の終息"
 concept_spec_boom_end_desc: "[concept_good]への[concept_spec_investor_interest]が上昇後に低下すると、好況が終わります。頂点が高いほど下落も激しくなります。最高で#v 積極#!に達した好況は[concept_spec_correction]に、#v 意欲#!なら[concept_spec_bust]に、#v 過熱#!なら[concept_spec_collapse]に終わります。\n\nいずれも[concept_spec_market_confidence]を低下させ、好況が大きいほど、また[Concept('concept_good','$concept_goods|q$')]が[concept_market]の貿易に占める割合が大きいほど損失が増えます。その後、$concept_good$が回復する間、投資家は投資を控え、それを生産する[concept_company]の産業では[concept_throughput]が減少します。基準となる頂点は毎月少しずつ下がるため、ゆっくり冷え込む好況はより穏やかに終わるか、$concept_spec_boom_end$を迎えずに済みます。"
 concept_spec_correction: "調整"
 concept_spec_correction_desc: "$concept_spec_correction$は、最も穏やかな[concept_spec_boom_end]です。[concept_good]への[concept_spec_investor_interest]が#v 積極#!で頂点に達し、その後#v 懐疑#!まで低下すると起こります。\n\n[concept_spec_market_confidence]がわずかに低下します。その後#v 3#!か月間、投資家は$concept_good$への投資を控え、それを生産する[concept_company]の産業では#v 90#!日間、[concept_throughput]が#N 2.5%#!減少し、[GetTechnology('corporate_charters').GetName]と[GetTechnology('corporate_management').GetName]を研究するごとにさらに#N 25%#!減少します。"
 concept_spec_bust: "破綻"
 concept_spec_bust_desc: "$concept_spec_bust$は、[concept_spec_correction]より激しい[concept_spec_boom_end]です。[concept_good]への[concept_spec_investor_interest]が#v 意欲#!で頂点に達し、その後#v 懐疑#!まで低下すると起こります。\n\n[concept_spec_market_confidence]の低下は大きく、同じ好況の[concept_spec_correction]の約#v 2#!倍になります。その後#v 6#!か月間、投資家は$concept_good$への投資を控え、それを生産する[concept_company]の産業では#v 180#!日間、[concept_throughput]が#N 5%#!減少し、[GetTechnology('corporate_charters').GetName]と[GetTechnology('corporate_management').GetName]を研究するごとにさらに#N 25%#!減少します。"
 concept_spec_collapse: "崩壊"
 concept_spec_collapse_desc: "$concept_spec_collapse$は、最も激しい[concept_spec_boom_end]です。[concept_good]への[concept_spec_investor_interest]が#v 過熱#!で頂点に達し、その後#v 逃避#!まで低下すると起こります。\n\n[concept_spec_market_confidence]は急激に低下し、同じ好況の[concept_spec_correction]の約#v 5#!倍になります。その後#v 12#!か月間、投資家は$concept_good$への投資を控え、それを生産する[concept_company]の産業では1年間、[concept_throughput]が#N 10%#!減少し、[GetTechnology('corporate_charters').GetName]と[GetTechnology('corporate_management').GetName]を研究するごとにさらに#N 25%#!減少します。[concept_market]の貿易に占める割合が大きい物資で$concept_spec_collapse$が起こると、[concept_spec_financial_panic]に陥る恐れがあります。"
 concept_spec_investor_interest: "投資家の関心"
 concept_spec_investor_interest_desc: "$concept_spec_investor_interest$は、[concept_good]を生産する[Concept('concept_building','$concept_buildings|q$')]が投資家にとってどれほど魅力的かを表します。[concept_market_price]が長期平均を上回る間は上昇し、下回る間は低下し、#v 逃避#!から#v 過熱#!まで変化します。\n\nそれらの建物の[concept_throughput]も関心に連動し、#v 逃避#!での#N -10%#!から#v 過熱#!での#P +8%#!まで変化します。その$concept_good$を生産する[Concept('concept_company','$concept_companies|q$')]の[concept_prosperity]も同様です。好況にある$concept_good$は[concept_spec_market_confidence]を高めます。関心が下がると、好況は[concept_spec_boom_end]を迎えます。"
 concept_spec_credit_policy: "信用政策"
 concept_spec_credit_policy_tight: "信用引き締め"
 concept_spec_credit_policy_normal: "通常の信用政策"
 concept_spec_credit_policy_loose: "信用緩和"
 concept_spec_credit_policy_desc: "$concept_spec_credit_policy$は、銀行が[concept_investment_pool]にどれほど自由に融資するかを定めます。[GetTechnology('central_banking').GetName]が必要で、$concept_spec_credit_policy_tight$、$concept_spec_credit_policy_normal$、$concept_spec_credit_policy_loose$から選べます。信用の引き締めは投資を鈍らせ、[concept_spec_market_confidence]が高いときにはそれを引き下げます。信用の緩和は[concept_spec_outstanding_credit]を増やします。変更すると#v 6#!か月間は変更できません。"
 concept_spec_leverage: "信用レバレッジ"
 concept_spec_leverage_desc: "$concept_spec_leverage$は、[concept_country]の[concept_spec_outstanding_credit]を[concept_investment_pool]の月収の何か月分かで表したものです。\n\n1か月分につき[concept_throughput]#P +2%#!、最大#P +24%#!です。[concept_spec_financial_panic]の間や[concept_spec_bad_debts]が残っている間は、毎月#N 2%#!ずつ減少します。#v 3#!か月分を超えると、より高い[concept_spec_market_confidence]で[concept_spec_financial_panic]が始まり、[concept_spec_bad_debts]が残ります。"
 concept_spec_bad_debts: "不良債権"
 concept_spec_bad_debts_desc: "$concept_spec_bad_debts$は[concept_spec_financial_panic]が残す損失で、[concept_spec_leverage]が#v 3#!か月分を超えるほど大きくなります。\n\n1ポイントにつき[concept_throughput]が#N 0.4%#!、投資が#N 0.75%#!減少します。毎月#v 3#!ポイントずつ増え、その後は毎月#v 0.6#!ポイントずつ減り、最悪の場合、解消まで約#v 6#!年かかります。残っている間、銀行は融資しません。#v 銀行に融資する#!では解消されません。#v 不良債権を買い取る#!と、残っている間に1回だけ半減します。"
 concept_spec_lending_standards: "融資基準"
 concept_spec_lending_standards_desc: "$concept_spec_lending_standards$は、[concept_country]の銀行がどれほど慎重に融資するかを表します: #v 厳格#!、#v 慎重#!、#v 健全#!、#v 緩慢#!、#v 無謀#!。緩い銀行ほど[concept_investment_pool]に多く融資し、そのうち多くを好況に振り向けるため、好況の終わりは激しくなり、銀行救済の費用も増えます。\n\n[concept_spec_financial_panic]のない月ごとに少しずつ緩み、平穏な年が約#v 20#!年続くと#v 厳格#!から#v 無謀#!に至ります。銀行救済や#v 不良債権を買い取る#!のたびにさらに緩みます。好況が終わると引き締まり、何より$concept_spec_financial_panic$が銀行救済なしに最後まで続くと大きく引き締まります。"
 concept_spec_outstanding_credit: "融資残高"
 concept_spec_outstanding_credit_desc: "$concept_spec_outstanding_credit$は、銀行が[concept_investment_pool]に貸し付け、まだ返済されていない資金です。[concept_spec_market_confidence]が#v 55#!を上回る間、銀行はプールの月収#v 3#!か月分の融資上限まで融資します。[GetTechnology('central_banking').GetName]は#v 5#!か月分、[GetTechnology('investment_banks').GetName]と[GetTechnology('international_exchange_standards').GetName]はそれぞれ#v 2#!か月分これを引き上げます。\n\n毎月#v 2%#!がプールから返済されます。[concept_spec_financial_panic]が始まると、その一部が回収されます。\n\n#lore 銀行は1840年代には鉄道株、1837年には綿花、1873年にはウィーンの建設用地を担保に融資し、それらの好況が崩れたときに痛手を負いました。#!"
