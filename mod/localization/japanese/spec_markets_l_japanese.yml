 SPEC_H_RIVAL: "競争"
 SPEC_H_RIVAL_TT: "#header 競争#!\n$TOOLTIP_DELIMITER$\n$SPEC_RIVAL_RULE$"
 SPEC_H_RIVAL_RIGHT: "#N -[GetPlayer.MakeScope.ScriptValue('spec_rv_upkeep_total')|0]#! @inf!"
 SPEC_RIVAL_RULE: "#italic 我が国の[concept_spec_exchange]は、他の取引所を選んで信認を争うことができます。#!\n\n競合相手1つの維持には影響力#N 25#!〜#N 150#!がかかります。地位が高いほど高くなります\n最低の地位では#v 1#!つ、地位が1つ上がるごとにもう1つ選べます（最大#v 4#!）\n最初の1年間は競合相手から外せません\nこれは外交上のライバル関係とは別です\n\n#b 勝負#!\n各勝負は始まってから#v 5#!年続き、綱引きのように決着して、新しい勝負が始まります\n棒は両者の[Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]スコアから始まります\n#N 2つ目以降の勝負ごとに手が広がりすぎ#!、すべての勝負で我が国のスコアが弱まります（#v 2#!件: #N 80%#!、#v 4#!件: #N 57.1%#!）\n[concept_spec_blue_chip]1社ごとに自陣へ#v 3%#!引き寄せます（#v 5#!社までは全額、#v 10#!社までは半分）\n成功した行動ごとに自陣へ#v 10%#!押し込みます。押し込みは各側最大#v 5#!回\n中央付近なら引き分けです\n\n#b 勝利#!\n#P 勝利#!すると、敗者は信認を#P 5%#!失います\n#P 大勝#!（棒が一方に#v 75%#!以上寄って終わる）すると、敗者は信認を#P 10%#!失い、12か月間[concept_investment_pool]収入の#P 5%#!も失います\n地位の高い取引所に勝つと得るものが多く、低い取引所に勝つと少なくなります\n[concept_relations]が悪い以下の場合、敗者の損失は#N x1.5#!になります\n\n#b 行動#!\n我が国が競合する取引所にも、我が国と競合する取引所にも使えます\n各行動は競合相手ごとに年1回だけ効果があります\n大きな取引所に対しては費用が増え、効果が減ります（#v x0.75#!〜#v x1.33#!）\n[concept_spec_financial_panic]の際、逃げ出す資金はまず競合相手に流れます"
