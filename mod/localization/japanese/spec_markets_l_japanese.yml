 SPEC_EXCH_NEXT_0: "#instruction 全国級になるには#!、上位三位のスコアの#v 15%#!、地域首位のスコアの#v 35%#!、または[Concept('concept_spec_financial_centre','$concept_spec_financial_centres|q$')]入りが必要です"
 SPEC_EXCH_NEXT_1: "#instruction 国際級になるには#!、上位#v 5#!の[Concept('concept_spec_financial_centre','$concept_spec_financial_centres|q$')]入りまたは地域首位に加えて、[GetTechnology('stock_exchange').GetName]が必要です"
 SPEC_EXCH_NEXT_2: "#instruction 世界中心になるには#!、[Concept('concept_spec_financial_centre','$concept_spec_financial_centres|q$')]で上位#v 3#!に加えて、[GetTechnology('central_banking').GetName]が必要です"
 SPEC_EXCH_NEXT_3: "#v 世界中心#!は最高の地位です。上位#v 3#!位を保つ限り維持されます"
