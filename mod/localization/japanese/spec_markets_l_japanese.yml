 notification_spec_tied_panic_name: "[SCOPE.sC('spec_note_src').GetName]で恐慌が発生"
 notification_spec_tied_panic_desc: "[SCOPE.sC('spec_note_src').GetName]で[concept_spec_financial_panic]が起こり、同国との関係により、我が国の市場にも[concept_spec_foreign_panic]が及びました。"
