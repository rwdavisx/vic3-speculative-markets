 SPEC_DRIVER_RESTRAIN_TT: "#header 抑制された好況: [Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n今月ゆるやかに収束させた好況に由来[Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0')|+=2]\n市場の過熱度（[concept_spec_market_conditions]）に由来#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#!\n$TOOLTIP_DELIMITER$\n#weak 抑えられた好況は、一度に崩れる代わりに[concept_spec_correction]としてゆっくり収束します#!"
 SPEC_DRIVER_CAUTION_TT: "#header 政府と出来事: [Country.MakeScope.Var('spec_c_caution').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n我が国の決定と市場の出来事による一時的な変化です"
 SPEC_DRIVER_LIMIT_TT: "#header 下限と上限: [Country.MakeScope.Var('spec_c_limit').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_market_confidence]は#v 0#!を下回らず、#v 100#!を上回りません。これは収まりきらなかった分です。"
 SPEC_DRIVER_RESCUE_TT: "#header 銀行救済: [Country.MakeScope.Var('spec_c_rescue').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#v 銀行に融資する#!または#v 銀行法を停止#!による一時的な上昇（#v 100#!を超えることはありません）"
 SPEC_DRIVER_RESCUE: "銀行救済"
 SPEC_DRIVER_WAREND: "戦争の終結"
 SPEC_DRIVER_WAREND_TT: "#header 戦争の終結: [Country.MakeScope.Var('spec_c_warend').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n我が国の[concept_casualties]に基づき、全効果の#v x[Country.MakeScope.Var('spec_war_stakes_now').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#title 全効果#!\n勝利し[concept_war_goal]を得た: #P +4#!\n勝利したが何も得なかった: #P +1#!\n敗北し[concept_war_goal]を譲った: #N -8#!\n敗北したが何も譲らなかった: #N -2#!\n勝者なし: #N -1#!\n\n#weak 常に少なくとも#v 25%#!は受け、戦争で戦力の#v 25%#!を失うと全効果を受けます#!"
 SPEC_DRIVER_BURST: "バブルの破裂"
 SPEC_DRIVER_BURST_TT: "#header バブルの破裂: [Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#italic バブルがはじけました。#!\n\n[concept_spec_speculative_excess]: #v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0'), Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_burst_per_heat'), '(CFixedPoint)-1'))|0]#!ポイント\n1ポイントにつき#N -[Country.MakeScope.ScriptValue('spec_burst_per_heat')|2]#!\n上限#N -[Country.MakeScope.ScriptValue('spec_burst_max')|0]#!\n$TOOLTIP_DELIMITER$\n好況で#v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#!を超えた[concept_spec_market_confidence]が#v 60#!を下回るとはじけます\n好況が長く高いほど、はじけたときの損失も大きくなります\n#weak [GetTechnology('stock_exchange').GetName]が必要です#!"
 SPEC_DRIVER_CAUTION: "政府と出来事"
 SPEC_DRIVER_RESTRAIN: "好況の抑制"
 SPEC_DRIVER_LIMIT: "下限と上限"
 SPEC_DRIVER_BOOM: "好況の商品"
 SPEC_DRIVER_BOOM_TT: "#header 好況の物資: [Country.MakeScope.Var('spec_c_boom').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n好況にある[Concept('concept_good','$concept_goods|q$')]（#v [Country.MakeScope.Var('spec_n_boom').GetValueWithDefault('(CFixedPoint)0')|0]#!件）に由来[Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0')|+=2][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_BOOM_CAP')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_steady'), '(CFixedPoint)1')), 'SPEC_BOOM_STEADY')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_fin_boom'), '(CFixedPoint)1')), 'SPEC_BOOM_FIN')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_boom_rule'), '(CFixedPoint)1')), 'SPEC_BOOM_RULE')]\n$TOOLTIP_DELIMITER$\n物資が我が国の[concept_market]に占める割合が大きいほど、その好況の効果も大きくなります。[concept_spec_financial_panic]の間は効果がありません\n#weak [GetTechnology('stock_exchange').GetName]、[GetTechnology('investment_banks').GetName]、[GetTechnology('modern_financial_instruments').GetName]で大きくなります#!"
 SPEC_BOOM_CAP: "\n以下の乗数の適用前で上限#v +3#!"
 SPEC_BOOM_STEADY: "\nマナーハウスに由来#v x[Country.MakeScope.ScriptValue('spec_steady')|2]#!"
 SPEC_BOOM_FIN: "\n金融技術に由来#v x[Country.MakeScope.ScriptValue('spec_fin_boom')|2]#!"
 SPEC_BOOM_RULE: "\n市場の変動性に由来#v x[Country.MakeScope.ScriptValue('spec_boom_rule')|2]#!"
 SPEC_DRIVER_CRASH: "終息した好況"
 SPEC_DRIVER_CRASH_TT: "#header 終わった好況: [Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n先月最大のもの: #v [Country.MakeScope.Var('spec_crashed').GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\n終わった好況の規模に由来[Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0')|+=2]\n市場の過熱度（[concept_spec_market_conditions]）に由来#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#![AddLocalizationIf(Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-40')), 'SPEC_CRASH_CAP')]\n$TOOLTIP_DELIMITER$\n好況が大きいほど、また我が国の[concept_market]に占める割合が大きい物資ほど、損失も大きくなります\n#weak [GetTechnology('mutual_funds').GetName]は損失を和らげ、[GetTechnology('modern_financial_instruments').GetName]は強めます#!"
 SPEC_CRASH_CAP: "\n上限は毎月#N -40#!"
 SPEC_DRIVER_FOREIGN: "外国の恐慌"
 SPEC_FOREIGN_HIT: "\n[concept_spec_foreign_panic]の基本の損失に由来#N -20#!\n相手と我が国の経済規模の比に由来#v x[Country.MakeScope.Var('spec_fh_size').GetValueWithDefault('(CFixedPoint)0')|2]#!\n結びつきの強さ（[concept_spec_market_tie]）に由来#v x[Country.MakeScope.Var('spec_fh_tie').GetValueWithDefault('(CFixedPoint)0')|2]#!\n相手の重要度（[concept_rank]）に由来#v x[Country.MakeScope.Var('spec_fh_reach').GetValueWithDefault('(CFixedPoint)0')|2]#![AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_foreign_loss_mult'), '(CFixedPoint)1')), 'SPEC_FOREIGN_UNSTD')]"
 SPEC_FOREIGN_UNSTD: "\n[GetTechnology('currency_standards').GetName]がないことに由来#v x[Country.MakeScope.ScriptValue('spec_foreign_loss_mult')|2]#!"
 SPEC_FOREIGN_FLIGHT: "\n[concept_spec_capital_flight]に由来[Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')|+=2]"
 SPEC_DRIVER_FOREIGN_TT: "#header 外国の恐慌: [Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n直近: #v [Country.MakeScope.Var('spec_foreign_src').GetCountry.GetName]#!\n$TOOLTIP_DELIMITER$[AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_HIT')][AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_FLIGHT')]\n$TOOLTIP_DELIMITER$\n#title @spec_market_tie! [concept_spec_market_tie]#!\n#italic 関係国の恐慌が、関係の種類ごとにどれだけ我が国に波及するか。これらは合算されません。1か月に複数の恐慌が波及した場合、最大の打撃のみが数えられます。#!\n同一の[concept_market]: #v [Country.MakeScope.ScriptValue('spec_tie_market')|%0]#!\n従属国または宗主国: #v 80%#!\n外国投資権: #v [Country.MakeScope.ScriptValue('spec_tie_investment')|%0]#!\n市場間の盛んな貿易: #v [Country.MakeScope.ScriptValue('spec_tie_trade')|%0]#!\n外国による我が国経済の所有: 最大#v 90%#!\n$TOOLTIP_DELIMITER$\n#weak [concept_great_power]の恐慌は全額、大国の恐慌は半分、小国の恐慌はわずかしか波及しません。外国から波及した恐慌がさらに広がることはありません。#!"
 SPEC_DRIVER_TURMOIL: "戦争と動乱"
 SPEC_DRIVER_TURMOIL_TT: "#header 戦争と動乱: [Country.MakeScope.Var('spec_c_turmoil').GetValueWithDefault('(CFixedPoint)0')|+=2]#!$SPEC_ITEMS_TURMOIL$\n$TOOLTIP_DELIMITER$\n[concept_war]1件ごと（[concept_spec_war_news]）: 毎月#N -3#!から#P +0.15#!\n全戦争の合計: 毎月#N -4#!から#P +0.5#!\nまだ戦争に至らない[concept_diplomatic_play]: 毎月#N -0.5#!\n国庫の枯渇: 毎月最大#N -3#!（[concept_bankruptcy]の#v 20#!週前から）\n[concept_default]: 毎月#N -5#!\n[concept_revolution]: 毎月#N -2#!\n\n#instruction 数値にカーソルを合わせると原因が表示されます#!"
 SPEC_DRIVER_MOOD: "市場心理"
 SPEC_DRIVER_MOOD_TT: "#header 市場心理: [Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n今月のランダムな変動に由来[Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0')|+=2]\n先月からの持ち越しに由来[Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0'))|+=2]\n$TOOLTIP_DELIMITER$\n#weak 毎月ランダムに変動し、どちらの方向にも最大#v 0.75#!動きます。その#v 75%#!は翌月に持ち越されます。我が国の[concept_spec_exchange]が#v 全国級#!になると、[concept_prosperity]の高い企業が市場心理を押し上げます。#!"
 SPEC_DRIVER_DRIFT: "基準値への回帰"
 SPEC_DRIVER_DRIFT_TT: "#header 基準への回帰: [Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_baseline]（#v 55#!）との差に由来[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0'), Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100'))|+=1]\n毎月、差の#v x[Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100')|%1]#!が縮まります\n$TOOLTIP_DELIMITER$\n#weak [GetTechnology('macroeconomics').GetName]があると、1.5倍の速さになります#!"
 SPEC_DRIVER_TIGHT: "信用引き締め"
 SPEC_DRIVER_GROWTH: "成長"
 SPEC_DRIVER_GROWTH_TT: "#header 成長: [Country.MakeScope.Var('spec_c_growth').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n直近数か月と比べた[concept_gdp]の成長: #v [Country.MakeScope.Var('spec_growth').GetValueWithDefault('(CFixedPoint)0')|=+%1]#!\n#v 2%#!の成長は通常とみなされ、何も変わりません\n$TOOLTIP_DELIMITER$\n#weak 通常より#v 1%#!速い、または遅いごとに、[concept_spec_market_confidence]が毎月#v 0.1#!動きます。どちらの方向にも最大#v 0.6#!です#!"
 SPEC_DRIVER_BUSINESS: "実業界の心理"
 SPEC_DRIVER_BUSINESS_TT: "#header 実業界の心理: [Country.MakeScope.Var('spec_c_business').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n実業家の[concept_approval]: #v [Country.MakeScope.ScriptValue('spec_ind_approval')|0]#!\n\n忠実（#v 10#!以上）: 毎月#P +0.4#!\n幸福（#v 5#!以上）: 毎月#P +0.2#!\n不幸（#v -5#!以下）: 毎月#N -0.2#!\n怒り（#v -10#!以下）: 毎月#N -0.4#!"
 SPEC_DRIVER_TIGHT_TT: "#header 信用引き締め: [Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_market_confidence]の#v 60#!を超える部分: #v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.1')|1]#!\n[Concept('concept_spec_credit_policy','$concept_spec_credit_policy_tight|q$')]により、毎月その#N -10%#!\n$TOOLTIP_DELIMITER$\n#weak 好況を一度にではなく、数か月かけてゆっくり冷まします#!"
 concept_spec_market_conditions: "市場の状況"
 concept_spec_market_conditions_desc: "@spec_market_conditions! $concept_spec_market_conditions$は、[concept_spec_boom_end]が来たときの市場の過熱具合です。好況の終わりで[concept_spec_market_confidence]がどれだけ失われるかを決めます。そのときの$concept_spec_market_confidence$が高いほど、損失は大きくなります。#v 55#!では影響はありません。金融街、マナーハウス、金融技術もこれを変化させます。"
 concept_spec_baseline: "基準信頼度"
 concept_spec_baseline_desc: "@spec_baseline! 放置すると、[concept_spec_market_confidence]は上からでも下からでも、$concept_spec_baseline$の#v 55#!へ戻っていきます。離れているほど、戻る速度は速くなります。"
 concept_spec_market_mood: "市場心理"
 concept_spec_market_mood_desc: "@spec_market_mood! $concept_spec_market_mood$は、特定の原因のない投資家の気分の揺れです。毎月ランダムに、どちらの方向にも最大#v 0.75#!変化し、その#v 75%#!が持ち越されるため、良い時期も悪い時期もしばらく続いてから薄れます。"
 concept_spec_market_tie: "市場関係"
 concept_spec_market_tie_desc: "@spec_market_tie! $concept_spec_market_tie$は、ある[concept_country]が別の国の[concept_market]にどれだけ追随するかを表します。[concept_spec_financial_panic]が両者の間でどれだけ波及するかを決めます。\n\n所有は、ある国が相手国の[concept_gdp]の#v 10%#!を所有した時点から数えられ、#v 30%#!で最も強くなります。[GetLawType('law_free_trade').GetName]は貿易関係を強め、他の貿易政策は弱めます。[GetTechnology('international_exchange_standards').GetName]は市場と投資の関係を強めます。[concept_embargo]は貿易関係を断ちます。"
 concept_spec_capital_flight: "資本逃避"
 concept_spec_capital_flight_desc: "@spec_capital_flight! [concept_spec_financial_panic]が始まると、資金は安全な場所へ逃げます。各[concept_great_power]と、[concept_spec_exchange]が#v 国際級#!以上の各[concept_country]は、平時にあり、#v 安定#!以上で、恐慌中の国と関係がなければ、[concept_spec_market_confidence]が最大#P +[GetPlayer.MakeScope.ScriptValue('spec_flight_gain_max')|0]#!上昇します。[GetTechnology('international_trade').GetName]と[GetTechnology('international_exchange_standards').GetName]はこの上昇を高めます。[concept_spec_exchange]の地位が高いほど、受け入れる量も増えます。"
 concept_spec_war_news: "戦況報道"
 concept_spec_war_news_desc: "@spec_war_news! 投資家は[concept_war]を月ごとに追っています。$concept_spec_war_news$は、戦争の状況に応じて毎月[concept_spec_market_confidence]を動かします。[concept_casualties]、[concept_blockade]、[concept_devastation]、[concept_gdp]の低下、戦争の長期化は信頼度を下げ、[Concept('concept_battle','$concept_battles|q$')]の勝利と敵の土地の占領は上げます。各戦争は毎月#N -3#!から#P +0.15#!、全戦争の合計は#N -4#!から#P +0.5#!動かします。"
