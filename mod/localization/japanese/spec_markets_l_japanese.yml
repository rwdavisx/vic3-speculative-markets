 spec_rv_press_fx: "12か月間、影響力を#N 75#!支払います。相手の[concept_spec_exchange]は信認を#N [Multiply_CFixedPoint('(CFixedPoint)0.0167', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|%0]#!失います。露見することがあり、相手の報道が自由なほどその可能性は高まります。露見すると、関係が#N 20#!、我が国の信認が#N 1.7%#!低下します。"
