 spec_panic_movements_desc: "恐慌の後、国家が市場を統制すべきだと多くの人が考えるようになり、[GetLawType('law_laissez_faire').GetName]に反対する[Concept('concept_political_movement','$concept_political_movements|q$')]への支持が増えました。"
 spec_mania_movements: "市場への信頼"
