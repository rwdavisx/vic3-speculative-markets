 SPEC_JE_FAVOURED: "人気"
 SPEC_JE_FAVOURED_TT: "今月、投資家が最も熱心な物資です。これを生産する企業や建物の株は売れやすくなります"
 SPEC_JE_SHUNNED: "不人気"
 SPEC_JE_SHUNNED_TT: "今月、投資家が最も関わりたがらない物資"
 SPEC_JE_STAGE_6: "[concept_spec_long_depression]が[JournalEntry.GetCountry.GetCapital.GetCityHubName]を覆っています。投資家は手持ちの資金を抱え込んで誰にも貸さず、これまでの回復もいずれも数か月で失速しました。世界の回復は専用のジャーナル記事で確認できます。\n\n不況が続く間、救済事業は失業者に仕事を与え、食い扶持を確保できます。"
 SPEC_JE_STAGE_5: "恐慌が[JournalEntry.GetCountry.GetCapital.GetCityHubName]を襲いました。夜明けから預金者が銀行の前に列を作り、融資は回収され、政府が手を打たなければ[concept_private_construction]はあと#v [JournalEntry.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!か月間、半減したままとなります。\n\n#v 銀行に融資する#!と終息が早まり、影響も半減します。救済事業は失業者に仕事を与え、食い扶持を確保できます。[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_currency_v'), '(CFixedPoint)0'), 'SPEC_JE_SUSPEND_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_4: "恐慌は過ぎ去り、破綻した商会と未完成の工事を後に残しました。投資家は損失を数えています。今後#v [JournalEntry.GetCountry.MakeScope.Var('spec_panic_cooldown').GetValue|0]#!か月間、新たな恐慌は起こりません。[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_reform_open_v'), '(CFixedPoint)0'), 'SPEC_JE_INQUIRY_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_3: "[JournalEntry.GetCountry.GetCapital.GetCityHubName]の取引所は狂乱に陥りました。事務員も未亡人も借金で#v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!、#v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#!、#v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#!の株を買い、[concept_spec_market_confidence]が#v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#!以上の月ごとに[concept_spec_speculative_excess]が蓄積しています。$concept_spec_market_confidence$が#v 60#!を下回るとバブルは破裂し、過剰の度合いが高いほど下落も激しくなります。\n\n最も過熱した物資の投機を抑制するか、信用を引き締めれば、ゆっくりと熱を冷ますことができます。"
 SPEC_JE_STAGE_2: "資金は借りやすく、投資家は活気づいています。#v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!、#v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#!、#v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#!の新会社には1時間もたたずに募集額を超える申し込みが集まり、銀行はその株式を担保に惜しみなく融資しています。[concept_spec_market_confidence]が#v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#!以上になると、[concept_spec_speculative_excess]が蓄積し始めます。\n\n好況は、国債を低い金利に借り換える好機でもあります。"
 SPEC_JE_STAGE_1: "[JournalEntry.GetCountry.GetCapital.GetCityHubName]の取引所では秩序ある取引が行われています。投資家は#v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!、#v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#!、#v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#!を好み、#v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#!と#v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!を避けています。"
 SPEC_JE_STAGE_0: "[JournalEntry.GetCountry.GetCapital.GetCityHubName]の投資家は警戒しています。先の損失に懲りて資金を手放さず、#v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#!と#v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!を避けています。信用を緩和するか、物資への投資を奨励すれば、呼び戻せるかもしれません。"
