 SPEC_H_BANK_LENT: "銀行の融資先"
 SPEC_H_BANK_LENT_TT: "#header 銀行の融資先#!\n$TOOLTIP_DELIMITER$\n銀行は新規融資の大半を、好況にある物資に振り向けます。その物資が我が国の貿易に占める割合が大きく、[concept_spec_investor_interest]が高いほど、より多くの融資を集めます。融資は返済されるまでその物資に残ります。\n\n銀行が貸し込んだ好況が終わると、[concept_spec_market_confidence]はより大きく下落します。物資の投機を抑制すると、そこに集まる新規融資は半分になります。"
