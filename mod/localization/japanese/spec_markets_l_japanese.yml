 spec_bubble_alert_setting_name: "投機の過剰"
 alert_spec_bubble_alert_desc: "我が国の[concept_spec_speculative_excess]は#v [GetPlayer.MakeScope.Var('spec_heat').GetValue|0]#!です。[concept_spec_market_confidence]が再び#v 60#!を下回ると、バブルが破裂し、[concept_spec_market_confidence]がさらに#N [GetPlayer.MakeScope.ScriptValue('spec_burst_now')|0]#!低下します。"
 alert_spec_bubble_alert_hint: "[concept_spec_market_confidence]が#v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!以上の月ごとにバブルは膨らみ、#v 60#!からその値までの間では冷え込みます。好況にある商品の投機を抑制するか、[concept_spec_credit_policy]を引き締めると、緩やかに縮小します。"
