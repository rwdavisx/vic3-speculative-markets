 spec_relief_cd_tt: "過去#v 12#!か月間に救済事業を行っていない"
 spec_suspend_tt: "[concept_spec_financial_panic]は#v 2#!か月以内に終息し、それまで影響は軽減されません\n[concept_spec_market_confidence]が#v 15#!上昇します\n#v 10#!年間、[concept_spec_speculative_excess]の蓄積が#v 50%#!速くなります\n銀行救済の後と同様に、[concept_spec_lending_standards]が緩みます"
 spec_suspend_act: "銀行法を停止"
 spec_suspend_act_desc: "法が銀行券に課す限度を超えて銀行が貸し出せるようにします。恐慌は数か月で収まり、国庫の負担もありませんが、投資家は政府が必ず介入すると学びます。この恐慌では#v 銀行に融資する#!を行ったものとして扱われます。\n\n#lore イギリスは1847年、1857年、1866年にピール銀行法を停止しました。#!"
 spec_relief_works_button: "救済事業"
 spec_relief_works_button_desc: "不況の間、公共事業と救済に資金を出します。#v 12#!か月間、福祉とより多くの建設を提供し、急進派を減らします。毎週の費用は我が国の[concept_gdp]に応じて増えます。"
 spec_convert_debt: "国債の借り換え"
 spec_convert_debt_desc: "投資家が活気づいている間に、借入を金利の低いものに借り換えます。従来の利息で暮らしていた国債保有者には感謝されないでしょう。"
 spec_inquiry: "調査委員会"
 spec_inquiry_desc: "銀行家、仲買人、財産を失った預金者から話を聞き、銀行と企業の運営について報告する委員会を任命します。報告に基づき、我が国の技術で可能な[Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')]を1件実施します。審議のため、#v 6#!か月間は政府の注意が割かれます。"
 spec_debt_converted: "借り換え済み債務"
 spec_debt_converted_desc: "投資家が融資に意欲的な間に、借入を低い金利に借り換えました"
 spec_relief_works: "救済事業"
 spec_relief_works_desc: "不況で職を失った人々のための公共事業と救済"
 spec_relief_costs: "救済事業費"
 spec_relief_costs_desc: "救済事業の費用"
 spec_act_suspended: "銀行法の停止"
 spec_act_suspended_desc: "政府は恐慌を終息させるため、自らの法律を停止しました"
 spec_inquiry_sitting: "調査委員会"
 spec_inquiry_sitting_desc: "委員会が前回の恐慌について証言を聞いています"
 spec_sound_finance: "健全な金融"
 spec_sound_finance_desc: "通貨、銀行、企業が、投資家が信頼する規則に従って運営されています"
 spec_rentiers_cut: "金利生活者の減収"
 spec_relief_thanks: "救済事業"
 spec_dear_money: "高利の資金"
 spec_free_issue: "自由銀行制度"
 spec_disclosure_burden: "情報開示規則"
 spec_disclosure_welcomed: "情報開示規則"
 spec_reform_currency_tt: "銀行の融資が#v 25%#!減少し、[concept_spec_speculative_excess]の蓄積が#v 25%#!遅くなり、[Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')]が#v 25%#!長引きます\n恐慌中に銀行法を停止できるようになります"
 spec_reform_free_tt: "銀行の融資が#v 25%#!増加し、好況が#v 10%#!拡大し、終息時の[concept_spec_market_confidence]の損失が#v 10%#!増加します"
 spec_reform_llr_tt: "#v 銀行に融資する#!の費用が#v 50%#!減少し、恐慌の終息が1か月早まります"
 spec_reform_company_tt: "好況終息時の[concept_spec_market_confidence]の損失が#v 30%#!減少します"
 spec_reform.1.t: "調査委員会"
 spec_reform.1.d_panic: "恐慌の後に任命された委員会が報告書を提出した。銀行家、仲買人、財産を失った預金者の証言が3巻にまとめられている。委員たちの意見が一致するのは、この恐慌が天災ではなかったという点だ。それ以外のほとんどすべてで意見は割れ、議場では各対策にそれぞれ擁護者がいる。"
 spec_reform.1.d_calm: "市場が静かなうちに、委員会は1年を費やし、次の好況を破滅に終わらせぬ方法について、銀行家、仲買人、経済学者から意見を聞いた。報告書にはいくつもの対策が示され、議場ではそれぞれに擁護者がいる。"
 spec_reform.1.f: "「恐怖が荒れ狂う時には、一つの破綻が幾多の破綻を生む。連鎖する破綻を防ぐ最善の道は、その原因となる最初の破綻を食い止めることである」"
 spec_reform.1.a: "紙幣の発行を金庫の金に結びつけよ。"
 spec_reform.1.b: "健全な銀行には自行の紙幣の発行を認めよ。"
 spec_reform.1.c: "最後の貸し手を指定せよ。"
 spec_reform.1.d: "企業に会計を公開させよ。"
 spec_reform.1.e: "委員会の労に謝意を表そう。"
 spec_reform.2.t: "健全な金融"
 spec_reform.2.d: "我が国の銀行は規則に従って紙幣を発行し、恐慌の際には貸し手が控え、企業は資産と債務を投資家に明かす義務を負っている。今や国外では我が国の債券が額面を上回る価格で売られ、[ROOT.GetCountry.GetCapital.GetCityHubName]は資本の安全な港と呼ばれている。"
 spec_reform.2.f: "「銀行家の第一の務めは、金を儲けることではなく、金を守ることだ」"
 spec_reform.2.a: "信頼こそ信用の礎だ。"
