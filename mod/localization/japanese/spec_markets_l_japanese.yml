 spec_report_buried: "調査の棚上げ"
 spec_reform_currency_tt: "銀行の融資が#v 25%#!減り、[concept_spec_speculative_excess]の膨張が#v 25%#!遅くなり、[Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')]が#v 25%#!長引きます\n恐慌の際に銀行法を停止できます"
 spec_reform_free_tt: "銀行の融資が#v 25%#!増え、好況が#v 10%#!大きくなり、終わったときに失う[concept_spec_market_confidence]が#v 10%#!増えます"
 spec_reform_llr_tt: "#v 銀行に融資する#!の費用が#v 50%#!減少し、恐慌の終息が1か月早まります"
