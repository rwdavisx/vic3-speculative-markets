 SPEC_RISKS_TT: "#header 危険要因#!\n$TOOLTIP_DELIMITER$\n#italic 我が国の[concept_spec_market_confidence]を押し下げうるもの。赤い数字が大きいほど、打撃も大きくなります。#!\n\n#b 危険な好況#!は、我が国の好況が終わった場合の打撃を示します\n#b 恐慌の危険#!は、我が国と結びついた市場の恐慌が波及した場合の打撃を示します\n#b 戦争の危険#!は、[concept_diplomatic_play]が戦争に発展した場合の打撃を示します\n#b 債務不履行の危険#!は、[Concept('concept_credit','$concept_credit_limit|q$')]を超えて借りた場合の打撃を示します\n#b バブル#!は、我が国の$concept_spec_speculative_excess$がはじけた場合の打撃を示します\n$TOOLTIP_DELIMITER$\n#instruction 各項目にカーソルを合わせると、その中身が表示されます#!"
 SPEC_RISK_1: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_risk_top').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_RISK_1_V', 'SPEC_CHIP_ZERO')]"
