edPoint)40'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_risk_src').GetCountry.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), '(CFixedPoint)60')),'SPEC_TIER_STEADY', SelectLocalization(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_risk_src').GetCountry.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), '(CFixedPoint)60'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_risk_src').GetCountry.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), '(CFixedPoint)80')),'SPEC_TIER_BUOYANT', 'SPEC_TIER_MANIA'))))]#!の段階にあり、そこで[concept_spec_financial_panic]が起きた場合、我が国の[concept_spec_market_confidence]がこの分だけ低下する恐れがあります。\n\n対象は、#v 動揺#!、#v 警戒#!、または#v 狂乱#!の状態にある国のみです。"
