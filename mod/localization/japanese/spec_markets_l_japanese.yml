 concept_spec_long_depression_desc: "@spec_long_depression! $concept_spec_long_depression$は世界経済全体の危機です。[concept_great_power]が[concept_spec_financial_panic]に陥ると始まります。その後、すでに恐慌中のすべての国に及び、[concept_market]の共有、従属国と宗主国、投資権、盛んな貿易、外国による所有といった密接な関係を通じて広がります。\n\n世界的暴落（#v 4#!か月）の間は、融資が凍結し、[concept_spec_market_confidence]が流出します。\n不況（最長#v 5#!年）の間は、投資、建設、貿易が鈍化し、一部のPOPが[Concept('concept_radical','$concept_radicals|q$')]になります。\n回復（#v 1#!年）の間に、$concept_spec_market_confidence$が戻ります。\n\n自国の選択は、自国と世界の回復を早めます。$concept_great_power$の選択が最も重要です。"
