 SPEC_STANCE_TIGHT_TT: "#header 信用引き締め#!\n今月の融資額: #v なし#!\n$TOOLTIP_DELIMITER$\n#italic 銀行が融資を止め、市場を冷まします。#!\n\n毎月、[concept_spec_market_confidence]の#v 60#!を超える部分の#N 10%#!が失われます\n投資家の反応: #N -50%#!\n[concept_in_government]の@intelligentsia! 知識人: [concept_approval] #P +2#!\n[concept_in_government]の@industrialists! 実業家: [concept_approval] #N -2#!\n\n好況は#P 小さく#!なり、暴落や恐慌は#P 穏やか#!になります[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-1'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-1')), Not(GetScriptedGui('spec_sgui_tight').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_TIGHT_WHY')]"
 SPEC_STANCE_NORMAL_TT: "#header 通常の信用政策#!\n今月の融資額: #v @money![Country.MakeScope.ScriptValue('spec_credit_preview')|D]#!\n$TOOLTIP_DELIMITER$\n#italic 銀行はいつも通りに貸します。#!\n\n[concept_spec_market_confidence]が#v 55#!を上回る間、銀行は[concept_investment_pool]に融資します。[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0')), Not(GetScriptedGui('spec_sgui_normal').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_NORMAL_WHY')]"
 SPEC_STANCE_LOOSE_TT: "#header 信用緩和#!\n今月の融資額: #v @money![Country.MakeScope.ScriptValue('spec_credit_preview_loose')|D]#!\n$TOOLTIP_DELIMITER$\n#italic 銀行が自由に貸し、市場を温めます。#!\n\n価格上昇に対する投資家の反応: #v +30%#!\n[concept_in_government]の@industrialists! 実業家: [concept_approval] #P +2#!\n[concept_in_government]の@intelligentsia! 知識人: [concept_approval] #N -2#!\n\n好況は#P 大きく#!なりますが、終わったときの損失も#N 大きく#!なります[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1')), Not(GetScriptedGui('spec_sgui_loose').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_LOOSE_WHY')]"
