 spec_excess_bar: "投機の過剰"
 concept_spec_speculative_excess: "投機の過剰"
 concept_spec_speculative_excess_desc: "$concept_spec_speculative_excess$は、好況中に[concept_country]の[concept_market]で膨らむバブルの大きさを表します。[GetTechnology('stock_exchange').GetName]の研究後、[concept_spec_market_confidence]が#v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!以上の月ごとに増加し、$concept_spec_market_confidence$が高いほど速く増えます。$concept_spec_market_confidence$が#v 60#!から#v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!の間に留まると、毎月#v 2%#!ずつ冷え込みます。\n\n$concept_spec_market_confidence$が#v 60#!を下回るとバブルが破裂し、$concept_spec_market_confidence$はさらに最大#v [GetPlayer.MakeScope.ScriptValue('spec_burst_max')|0]#!低下します。$concept_spec_speculative_excess$が高いほど下落も激しくなります。"
 concept_spec_sound_finance: "健全な金融"
 concept_spec_sound_finance_desc: "$concept_spec_sound_finance$は、銀行券の規則、最後の貸し手、会社法の3つの[concept_spec_banking_reforms]をすべて実施すると達成されます。\n\n3つすべてを実施すると、[concept_country]は#v 10#!の[concept_prestige]を得て、[concept_loans]の金利が#v 5%#!低下します。"
 concept_spec_banking_reforms: "銀行改革"
 concept_spec_banking_reform: "銀行改革"
 concept_spec_banking_reforms_desc: "$concept_spec_banking_reforms$は、[concept_country]の銀行と企業が従う規則を定めます。それぞれ技術によって解禁され、調査委員会を通じて実施します。委員会は[concept_spec_financial_panic]の後、または恐慌が起きずに#v 10#!年が過ぎた後に開けます。1つの委員会につき1つの改革を実施します。\n\n#bold 銀行券の規則#!（[GetTechnology('banking').GetName]）、次の2つから選択:\n#bold 通貨学派:#! $spec_reform_currency_tt$\n#bold 自由銀行制度:#! $spec_reform_free_tt$\n\n#bold 最後の貸し手#!（[GetTechnology('central_banking').GetName]）: $spec_reform_llr_tt$\n\n#bold 会社法#!（[GetTechnology('joint_stock_companies').GetName]）: $spec_reform_company_tt$\n\n3つすべてを実施すると[concept_spec_sound_finance]を達成します。"
 alert_spec_panic_risk_alert_name: "恐慌の危険"
 spec_panic_risk_alert_setting_name: "恐慌の危険"
 alert_spec_panic_risk_alert_desc: "今、我が国の好況が終わると、[concept_spec_market_confidence]は#N [GetPlayer.MakeScope.ScriptValue('spec_after_collapse')|0]#!まで低下し、[concept_spec_financial_panic]が始まる#v [GetPlayer.MakeScope.ScriptValue('spec_panic_at')|0]#!を下回ります。"
 alert_spec_panic_risk_alert_hint: "最も危険な物資の投機を抑制するか、#bold $SPEC_FINANCE$#!ウィンドウの#bold $SPEC_FIN_TAB_BANKING$#!タブで[concept_spec_credit_policy]を引き締めてください。"
