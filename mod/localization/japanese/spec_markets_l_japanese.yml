 SPEC_RISK_3_ON: "#header 戦争の危険#!\n$TOOLTIP_DELIMITER$\n#italic 戦争に発展した[concept_diplomatic_play]は市場を揺さぶります。#!\n\n戦争が始まると、毎月[concept_spec_market_confidence]が最大#N -[Country.MakeScope.Var('spec_war_risk').GetValueWithDefault('(CFixedPoint)0')|1]#!\n戦争になりうるもの: #v [Country.MakeScope.Var('spec_wr_n').GetValueWithDefault('(CFixedPoint)0')|0]#!件\n平均的な戦争の場合、1件につき#N -0.6#!#indent_newline:3 [AddLocalizationIf(Country.MakeScope.Var('spec_wr1').IsSet, 'SPEC_ITEM_WR_1')][AddLocalizationIf(Country.MakeScope.Var('spec_wr2').IsSet, 'SPEC_ITEM_WR_2')][AddLocalizationIf(Country.MakeScope.Var('spec_wr3').IsSet, 'SPEC_ITEM_WR_3')]#!\n$TOOLTIP_DELIMITER$\n#weak 戦況が悪いと、[concept_spec_war_news]を通じて損失がさらに増えます。#!"
 SPEC_ITEM_WR_1: "\n対#v [Country.MakeScope.Var('spec_wr1').GetCountry.GetName]#!: #N -0.6#!"
