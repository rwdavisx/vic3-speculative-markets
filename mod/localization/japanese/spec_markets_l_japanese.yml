 SPEC_PLEDGE_MAKE_TT: "#header 銀行救済を誓約する#!\n$TOOLTIP_DELIMITER$\n#italic 銀行が困ったときはいつでも、国が救うと約束します。#!\n\n[concept_treasury]が準備金から支払え、[concept_default]に陥っていない限り、#P すべての#![concept_spec_financial_panic]が即座に救済され、費用は#P 25%#!安くなります\n恐慌で我が国の[concept_spec_exchange]が失う信認: #P -50%#!\n流入する[concept_spec_capital_flight]: #P +50%#!\n#N 救済のたびに#!融資基準が緩みます\n$TOOLTIP_DELIMITER$\n#N [concept_default]に陥ると#!誓約は破られ、信認をすべて失います。#v 5#!年間[concept_spec_market_confidence] #N -15#!、[concept_legitimacy] #N -10#!\n#weak 誓約の撤回には#! #v 24#! #weak か月前の予告が必要です#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_pledge').IsValid(GuiScope.SetRoot(Country.MakeScope).End)), 'SPEC_PLEDGE_PLEDGE_WHY')]"
 SPEC_PLEDGE_OUT_TT: "#header $SPEC_PLEDGE_OUT$#!\n$TOOLTIP_DELIMITER$\n誓約を終わらせる#v 24#!か月前の予告を始めます。予告期間が終わるまで誓約は有効で、恐慌はすべて救済されます。\n\n#b 終わらせる誓約#!\n#italic 銀行が困ったときはいつでも、国が救うと約束します。#!\n\n[concept_treasury]が準備金から支払え、[concept_default]に陥っていない限り、#P すべての#![concept_spec_financial_panic]が即座に救済され、費用は#P 25%#!安くなります\n恐慌で我が国の[concept_spec_exchange]が失う信認: #P -50%#!\n流入する[concept_spec_capital_flight]: #P +50%#!\n#N 救済のたびに#!融資基準が緩みます\n$TOOLTIP_DELIMITER$\n#N [concept_default]に陥ると#!誓約は破られ、信認をすべて失います。#v 5#!年間[concept_spec_market_confidence] #N -15#!、[concept_legitimacy] #N -10#!\n#weak 誓約の撤回には#! #v 24#! #weak か月前の予告が必要です#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_pledge_leave').IsValid(GuiScope.SetRoot(Country.MakeScope).End)), 'SPEC_PLEDGE_PLEDGE_LEAVE_WHY')]"
