 spec_lever_market_tt: "我国的$ECONOMIC_SYSTEM_GC_LINK$允许投资者追逐价格"
 spec_lever_not_restrain_tt: "未抑制这种商品的投机"
 spec_lever_not_encourage_tt: "未鼓励对这种商品的投资"
 spec_levers: "市场干预"
 spec_lever_authority_tt: "有足够的[concept_authority]"
 spec_lever_fits_restrain_tt: "@spec_investor_interest! [concept_spec_investor_interest]为#v 追捧#!或更高，或其热潮结束将损失#v 2#!或更多[concept_spec_market_confidence]"
 spec_lever_fits_encourage_tt: "@spec_investor_interest! [concept_spec_investor_interest]低于#v 看好#!，该[concept_good]未处于热潮后的恢复期，且没有可能以[concept_spec_bust]或[concept_spec_collapse]告终的热潮"
 SPEC_LEVER_RESTRAIN_TT: "#header 抑制[Goods.GetName]的投机#!\n$TOOLTIP_DELIMITER$\n#italic 在一种过热的[concept_good]热潮变得太大之前，为其降温。#!\n\n[concept_spec_investor_interest]在数月内降至#v 平静#!\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_DOWN', 'SPEC_LEVER_NONE')][concept_budget_additional_income]：每周#P @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_levy_', Goods.GetKey))|D]#!（按基础价格计算，为其产出的#v 10%#!）\n其热潮结束时，会以[concept_spec_correction]的方式在约一年内缓慢平息，而不是一下子结束\n\n生效期间占用#N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#![concept_authority]，不按月重复支付。解除后即可收回#indent_newline:3 \n通常该[concept_good]为#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#!，相当于对其征收一半消费税\n按我国的交易量（占我国市场的#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#!）为#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#!#!\n\n#lore 南海泡沫之后，1720年的《泡沫法案》禁止在没有皇家特许状的情况下设立股份公司。#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_restrain_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_restrain').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_LEVER_ENCOURAGE_TT: "#header 鼓励对[Goods.GetName]的投资#!\n$TOOLTIP_DELIMITER$\n#italic 让投资者重新关注一种被冷落的[concept_good]。#!\n\n[concept_spec_investor_interest]在数月内升至#v 看好#!\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_UP', 'SPEC_LEVER_NONE')][concept_budget_additional_expenses]：每周#N @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_subsidy_', Goods.GetKey))|D]#!（按基础价格计算，为其产出的#v 20%#!）\n一旦该[concept_good]达到#v 追捧#!，便自动结束\n\n生效期间占用#N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#![concept_authority]，不按月重复支付。解除后即可收回#indent_newline:3 \n通常该[concept_good]为#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#!，相当于对其征收一半消费税\n按我国的交易量（占我国市场的#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#!）为#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#!#!\n\n#lore 19世纪中叶，英属印度和法国向铁路投资者保证其资本的固定回报。#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_encourage_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_encourage').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_LEVER_TP_DOWN: "其生产者的[concept_throughput]：#N -10%#!\n"
 SPEC_LEVER_TP_UP: "其生产者的[concept_throughput]：#P +10%#!\n"
