 SPEC_H_BANK_LENT_TT: "#header 银行贷款去向#!\n$TOOLTIP_DELIMITER$\n银行将大部分新增信贷贷入热潮商品：一种商品在我国贸易中的份额越大、[concept_spec_investor_interest]越高，获得的贷款就越多。贷款在偿还之前一直留在该商品中。\n\n当银行贷入的热潮终结时，[concept_spec_market_confidence]会进一步下跌。抑制某种商品的投机可使其吸引的新增贷款减半。"
