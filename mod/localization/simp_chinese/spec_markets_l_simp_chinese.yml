 concept_spec_exchange: "交易所"
 concept_spec_exchange_desc: "一个[concept_country]的$concept_spec_exchange$是其股票、债券和信贷易手的场所。其地位取决于[Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]得分：#v 地方级#!、#v 全国级#!、#v 国际级#!（需要[GetTechnology('stock_exchange').GetName]）或#v 世界中心#!（需要[GetTechnology('central_banking').GetName]）。地位越高，投资者对价格上涨的反应越强；从#v 国际级#!起，交易所会接收[concept_spec_capital_flight]。\n\n国家授予其交易所一份特许状：#v 商品交易所#!、#v 货币市场#!或#v 股票市场#!。交易所可从#v 7#!条扬名路线中持有#v 1#!至#v 4#!项专长，地位越高越多，每项至少保留#v 5#!年。\n\n在稳健放贷的平静年份里信誉会上升，而[Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')]、[concept_spec_bad_debts]以及主要商品的[concept_spec_bust]或[concept_spec_collapse]会使信誉下降。信誉低会提高[concept_loans]的利率，信誉高则会降低利率。"
