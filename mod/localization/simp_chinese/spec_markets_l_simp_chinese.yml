 spec_reform_llr_tt: "#v 向银行放贷#!的成本降低#v 50%#!，且恐慌提前一个月结束"
 spec_reform_company_tt: "热潮结束时，损失的[concept_spec_market_confidence]减少#v 30%#!"
 spec_reform.1.t: "调查委员会"
 spec_reform.1.d_panic: "恐慌后任命的委员会已提交报告，内含三卷银行家、经纪人和破产储户的证词。委员们一致认为，这场恐慌绝非天灾。在其他几乎所有问题上他们都各执一词，每种方案在议会中都有拥护者。"
 spec_reform.1.d_calm: "趁市场平静，一个委员会花了一年时间听取银行家、经纪人和政治经济学家的意见，研究如何防止下一轮热潮以毁灭告终。其报告提出了若干方案，每种方案在议会中都有拥护者。"
 spec_reform.1.f: "“在狂乱的恐慌时期，一家倒闭会引发多家倒闭，而防止这些连带倒闭的最佳办法，是阻止引发它们的最初倒闭。”"
 spec_reform.1.a: "将纸币发行与金库中的黄金挂钩。"
 spec_reform.1.b: "让每家健全的银行发行自己的纸币。"
 spec_reform.1.c: "指定最后贷款人。"
 spec_reform.1.d: "要求公司公布账目。"
 spec_reform.1.e: "感谢委员会，然后把报告束之高阁。"
 spec_reform.2.t: "健全金融"
 spec_reform.2.d: "我们的银行依规则发行纸币，恐慌来袭时有贷款人随时待命，我们的公司也必须向投资者表明自己拥有什么、欠下什么。在国外，我们的债券如今以溢价出售，[ROOT.GetCountry.GetCapital.GetCityHubName]被称为资本的避风港。"
 spec_reform.2.f: "“银行家的首要职责不是赚钱，而是守住钱。”"
 spec_reform.2.a: "信心是信用的基础。"
