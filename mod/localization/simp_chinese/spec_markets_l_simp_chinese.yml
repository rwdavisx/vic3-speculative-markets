 spec_suspend_act: "暂停实施银行法"
 spec_suspend_act_desc: "允许银行发行超出该法案限额的纸币。恐慌会在数月内平息，且不会让国库负担任何成本。代价是投资者会认定政府总会出手相救。在本次恐慌中视同#v 向银行放贷#!。\n\n#lore 英国曾于1847年、1857年和1866年暂停实施《银行特许法》。#!"
 spec_relief_works_button: "救济工程"
 spec_relief_works_button_desc: "在萧条期间为公共工程和救济出资。在#v 12#!个月内提升福利和建设，并削弱激进派的支持。我国[concept_gdp]越大，每周花费越多。"
 spec_convert_debt: "转换国债"
 spec_convert_debt_desc: "趁投资者心情不错，把我们的贷款换成利息更低的新贷款。靠旧利息过日子的人可不会感谢我们。"
 spec_inquiry: "调查委员会"
 spec_inquiry_desc: "任命一个委员会，听取银行家、经纪人和破产储户的证词，并说明我国的银行和公司应如何运作。其报告将颁行一项我国科技已解锁的[Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')]。委员会将占用政府#v 6#!个月的精力。"
