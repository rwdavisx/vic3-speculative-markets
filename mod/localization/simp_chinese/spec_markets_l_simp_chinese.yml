l_simp_chinese:
 spec_confidence_bar: "市场信心"
 spec_confidence_bar_desc: "[concept_spec_market_confidence]: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!"
 spec_stance_current_tt: "这不是当前的[concept_spec_credit_policy]"
 spec_stance_cooldown_tt: "[concept_spec_credit_policy]在过去#v 6#!个月内未更改"
 spec_rescued_tt: "本次[concept_spec_financial_panic]期间，我们既未向银行放贷，也未暂停实施银行法"
 spec_credit_tight: "紧缩信贷"
 spec_credit_tight_fx: "[concept_spec_credit_policy]变为#v 紧缩#!"
 spec_credit_normal_fx: "[concept_spec_credit_policy]变为#v 常规#!"
 spec_credit_loose_fx: "[concept_spec_credit_policy]变为#v 宽松#!"
 spec_credit_tight_desc: "银行停止放贷，投资者对价格上涨的反应减弱。热潮保持较小规模，因此其终结和恐慌都更温和。每月[concept_spec_market_confidence]会损失其高出#v 60#!部分的#N 10%#!。选择后将锁定[concept_spec_credit_policy]#v 6#!个月。需要[GetTechnology('central_banking').GetName]。\n\n@intelligentsia! 知识分子[concept_in_government]：#P +2#![concept_approval]\n@industrialists! 工业家[concept_in_government]：#N -2#![concept_approval]"
 spec_credit_normal: "常规信贷"
 spec_credit_normal_desc: "[concept_spec_market_confidence]高于#v 55#!时，银行向[concept_investment_pool]放贷。选择后，[concept_spec_credit_policy]将锁定#v 6#!个月。需要[GetTechnology('central_banking').GetName]。"
 spec_credit_loose: "宽松信贷"
 spec_credit_loose_desc: "银行放贷更多，投资者对价格上涨反应更强烈。热潮变得更大，结束时的损失也更大。选择后，[concept_spec_credit_policy]将锁定#v 6#!个月。需要[GetTechnology('central_banking').GetName]。\n\n@industrialists! 实业家[concept_in_government]：[concept_approval]#P +2#!\n@intelligentsia! 知识分子[concept_in_government]：[concept_approval]#N -2#!"
 spec_rescue_banks: "向银行放贷"
 spec_rescue_banks_desc: "从[concept_treasury]支出约为[concept_gdp]#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#!的资金，在#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#!个月内结束[concept_spec_financial_panic]并使其影响减半。[concept_spec_market_confidence]上升#v 20#!。恐慌剩余月数越多，成本越高。每次恐慌只能实施一次。[GetTechnology('central_banking').GetName]使其更便宜、更快捷。"
 spec_conf_panic: "投资者动摇"
 spec_conf_panic_held: "投资者动摇"
 spec_conf_wary: "投资者谨慎"
 spec_conf_steady: "投资者稳定"
