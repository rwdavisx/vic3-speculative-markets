 concept_spec_financial_centre_desc: "@spec_financial_centre! $concept_spec_financial_centres$是[Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]得分最高的#v 5#!个[Concept('concept_country','$concept_countries|q$')]，每月排名一次。你的[concept_spec_exchange]能调动的[concept_investment_pool]资金越多，得分越高。信誉、人均财富、金融区、公司、金融科技、[concept_rank]和经济体制都会改变得分。前三名的平均分为#v 100#!。\n\n第一名：#P +10%#![concept_prestige]，#P -10%#![concept_loans]利率，#P +5#!个月放贷上限\n最后一名（#v 5#!）：#P +2%#!，#P -2%#!，#P +1#!个月\n放贷上限加成需要[GetTechnology('central_banking').GetName]，且放贷标准为#v 稳健#!或更严格"
