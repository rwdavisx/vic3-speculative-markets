 SPEC_EFFECT_LAX_TT: "#header [concept_spec_lending_standards]#!\n$SPEC_EFFECT_LAX_VALUE$\n$TOOLTIP_DELIMITER$\n每月放贷额：#v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_credit'), '(CFixedPoint)1')|+%0]#!\n贷入热潮的比例：#v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_pull'), '(CFixedPoint)1')|+%0]#!\n银行救助成本：#v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_cost'), '(CFixedPoint)1')|+%0]#!\n$TOOLTIP_DELIMITER$\n银行在没有损失的年份里，以及每次银行救助之后，会变得松懈。只有承受损失才能让它们重新审慎：热潮终结时如此，尤其是[concept_spec_financial_panic]在没有银行救助的情况下自然结束时。\n\n#title 保持银行审慎的办法：#!\n- 将[concept_spec_credit_policy]设为紧缩：银行不再变得松懈\n- 在热潮恶性终结之前加以抑制\n- 让恐慌在没有银行救助的情况下自然结束，或减少暂停实施银行法的次数\n\n等级：#v 严格#!、#v 审慎#!、#v 稳健#!、#v 松懈#!、#v 鲁莽#!"
