 building_group_bg_financial_districts_standard_of_living_add_desc: "金融区员工[concept_sol]的加成或减成"
 SPEC_H_COMPANIES: "公司"
 SPEC_H_COMPANIES_TT: "#header $concept_companies$#!\n$TOOLTIP_DELIMITER$\n#italic 市场对一种商品的情绪如何影响生产它的建筑。#!\n\n[concept_spec_investor_interest]高时，其建筑获得#P 更多#![concept_throughput]\n热度低时，获得#N 更少#!\n热潮结束后，获得的#N 进一步减少#!，直到恢复\n人们想要[concept_company]的商品时，它的收益会增加"
 SPEC_H_COMPANIES_RIGHT: "[GetDataModelSize(Country.GetCompanies)]  @spec_blue_chip! #v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!"
 SPEC_H_COMPANIES_RIGHT_TT: "#header @spec_company_strength! [concept_spec_company_strength]：#v [Country.MakeScope.ScriptValue('spec_log_kstr')|1]#!#!\n$TOOLTIP_DELIMITER$\n#italic 我国在大公司之家中的得分。#!\n\n#b 来源#!\n我们将所有$concept_companies$的[concept_prosperity]相加，每#v 20#!点增加#v 1#!\n[Concept('concept_spec_blue_chip','$concept_spec_blue_chips|q$')]：#v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!，每个再增加#v 2#!\n#grey 公司数量多，只有通过其繁荣度才有帮助#!"
 SPEC_CO_BC: "#P [concept_spec_blue_chip]#!，为我国[concept_spec_company_strength]增加#v 2#!，并计入我国的$concept_spec_blue_chips$"
 SPEC_CO_BC_LOW: "  #N 下滑#!，#v 3#!个月中有#v [Company.MakeScope.Var('spec_bc_low').GetValue|0]#!个月[concept_prosperity]低于#v 70#!。达到#v 3#!个月时将失去地位"
 SPEC_CO_BC_CLIMB: "再保持#v [Subtract_CFixedPoint('(CFixedPoint)12', Company.MakeScope.Var('spec_bc_months').GetValue)|0]#!个月[concept_prosperity]在#v 70#!或以上，即成为[concept_spec_blue_chip]"
 SPEC_CO_COTY: "#P 年度公司#!，世界上最繁荣的[concept_spec_blue_chip]"
 SPEC_CO_PROPPED: "  受扶持，暂时保持地位，无论[concept_prosperity]如何"
 SPEC_CO_FRAGILE: "  #N 脆弱#!，[concept_prosperity]只要有一个月低于#v 70#!，即失去地位"
 SPEC_CO_NONE: "#low 我们没有公司#!"
 SPEC_BC_STRIP: "蓝筹股"
 SPEC_BC_STRIP_N: "持有#v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!家"
 SPEC_BC_STRIP_FX: "崩盘缓冲#P [Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)4.0')|0]%#!\n较量拉力#P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)3.0')|0]%#!\n信任每年#P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.417')|1]%#!"
 SPEC_BC_STRIP_TT: "#header $concept_spec_blue_chips$：#v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!#!\n$TOOLTIP_DELIMITER$\n#italic 我国最稳健、最繁荣的公司。#!\n\n公司连续#v 12#!个月[concept_prosperity]保持在#v 70#!或以上，即成为蓝筹\n\n#b 它们给我们带来什么#!\n热潮破灭和恐慌造成的[concept_spec_market_confidence]损失：#P -[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)4.0')|0]%#! #grey （每家-4%）#!\n[concept_spec_exchange]信誉：每年增加满格的#P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.4167')|1]%#! #grey （每家+0.4%）#!\n[concept_spec_exchange]较量：向我方#P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)3.0')|0]%#! #grey （每家+3%）#!\n资本家的[concept_investment_pool]贡献：#P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.6')|1]%#! #grey （每家+0.6%）#!\n贷款利息：#P -[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)1.0')|0]%#! #grey （每家-1%）#!\n#grey 前5家全额计算，之后5家按一半计算。每家还为我国[concept_spec_company_strength]增加#v 2#!，这是我国争夺大公司之家的得分#!\n$TOOLTIP_DELIMITER$\n#b 如果失去一家#!\n连续#v 3#!个月[concept_prosperity]低于#v 70#!时发生\n[concept_spec_exchange]信誉：#N -1.7%#!满格\n[concept_spec_market_confidence]：#N -3#!\n命中我国的做空袭击会使一家蓝筹在一年内变得#N 脆弱#!。在此期间，[concept_prosperity]只要有一个月低于#v 70#!（而非#v 3#!）就会失去地位\n\n#b 年度公司#!\n如果我国的蓝筹是世界上最繁荣的，我们将获得[concept_spec_exchange]信誉#P +2.5%#!满格，以及[concept_prestige]#P +5%#!，持续一年"
