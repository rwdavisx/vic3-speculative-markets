 concept_spec_long_depression_desc: "$concept_spec_long_depression$是一场世界性的经济危机。当一个[concept_great_power]陷入[concept_spec_financial_panic]时它便开始，波及当时所有处于恐慌中的国家，并沿着紧密联系蔓延：共同的[concept_market]、附属国与宗主国、投资权、大量贸易以及外国所有权。\n\n世界性崩溃（#v 4#!个月）：信贷冻结，[concept_spec_market_confidence]流失\n萧条（最多#v 5#!年）：投资、建设和贸易放缓，部分人口成为[Concept('concept_radical','$concept_radicals|q$')]\n复苏（#v 1#!年）：[concept_spec_market_confidence]回升\n\n各国政府的选择会加快本国和世界的复苏，其中[concept_great_power]的选择影响最大。"
