 SPEC_XS_TT: "#header @spec_speculative_excess! $concept_spec_speculative_excess$：[Country.MakeScope.Var('spec_heat').GetValueWithDefault('(CFixedPoint)0')|0] / 200#!\n$TOOLTIP_DELIMITER$\n#italic 这就是泡沫。热潮过热的时间越长，泡沫越大。#!\n\n[concept_spec_market_confidence]达到#v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#!或以上时#P 增长#!\n介于#v 60#!与#v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#!之间时#v 缓慢缩小#!\n跌破#v 60#!时#N 破裂#!\n\n如果现在破裂：[concept_spec_market_confidence]立即#N -[Country.MakeScope.ScriptValue('spec_burst_now')|0]#!（最多#N [Country.MakeScope.ScriptValue('spec_burst_max')|0]#!）\n$TOOLTIP_DELIMITER$\n#instruction 若想让它平稳消退，请将信心保持在60至[Country.MakeScope.ScriptValue('spec_heat_from')|0]之间。破裂会造成损害时，进度条会变红。#!"
