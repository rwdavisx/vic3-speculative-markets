 SPEC_PLEDGE_MAKE_TT: "#header 承诺救助银行#!\n$TOOLTIP_DELIMITER$\n#italic 国家承诺，银行一旦陷入困境就出手相救。#!\n\n只要[concept_treasury]能用储备支付且我们未处于[concept_default]，#P 每次#![concept_spec_financial_panic]都会立即获得救助，成本降低#P 25%#!\n我国[concept_spec_exchange]在恐慌中损失的信誉：#P -50%#!\n流入的[concept_spec_capital_flight]：#P +50%#!\n#N 每次救助#!都会放松放贷标准\n$TOOLTIP_DELIMITER$\n#N 如果我们陷入#![concept_default]，承诺即告破裂，失去全部信誉。[concept_spec_market_confidence]#N -15#!，[concept_legitimacy]#N -10#!，持续#v 5#!年\n#weak 撤回承诺需提前#!#v 24#!#weak 个月通知#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_pledge').IsValid(GuiScope.SetRoot(Country.MakeScope).End)), 'SPEC_PLEDGE_PLEDGE_WHY')]"
 SPEC_PLEDGE_OUT_TT: "#header $SPEC_PLEDGE_OUT$#!\n$TOOLTIP_DELIMITER$\n开始为期#v 24#!个月的通知期，以结束承诺。通知期结束前，承诺依然有效，每次恐慌仍会获得救助。\n\n#b 我们将要结束的承诺#!\n#italic 国家承诺，银行一旦陷入困境就出手相救。#!\n\n只要[concept_treasury]能用储备支付且我们未处于[concept_default]，#P 每次#![concept_spec_financial_panic]都会立即获得救助，成本降低#P 25%#!\n我国[concept_spec_exchange]在恐慌中损失的信誉：#P -50%#!\n流入的[concept_spec_capital_flight]：#P +50%#!\n#N 每次救助#!都会放松放贷标准\n$TOOLTIP_DELIMITER$\n#N 如果我们陷入#![concept_default]，承诺即告破裂，失去全部信誉。[concept_spec_market_confidence]#N -15#!，[concept_legitimacy]#N -10#!，持续#v 5#!年\n#weak 撤回承诺需提前#!#v 24#!#weak 个月通知#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_pledge_leave').IsValid(GuiScope.SetRoot(Country.MakeScope).End)), 'SPEC_PLEDGE_PLEDGE_LEAVE_WHY')]"
