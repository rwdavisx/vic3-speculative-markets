 concept_spec_exchange: "交易所"
 concept_spec_trust: "信誉"
 concept_spec_trust_desc: "@spec_trust! 投资者对一个[concept_country]的[concept_spec_exchange]的信任程度，从#v 0%#!到#v 100%#!。\n\n它在平静的月份#P 上升#!，并随每次[concept_spec_financial_panic]、暴跌和崩盘而#N 下降#!。它的等级（#N 不受信任#!、受到怀疑、#v 受人尊重#!或#P 深受信任#!）决定该[concept_country]的借贷成本。"
 concept_spec_exchange_desc: "@spec_exchange! 一个[concept_country]的$concept_spec_exchange$是其股票、债券和信贷易手的场所。其地位取决于[Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]得分：#v 地方级#!、#v 全国级#!、#v 国际级#!（需要[GetTechnology('stock_exchange').GetName]）或#v 世界中心#!（需要[GetTechnology('central_banking').GetName]）。地位越高，投资者对价格上涨的反应越强；从#v 国际级#!起，交易所会接收[concept_spec_capital_flight]。\n\n国家授予其交易所一份特许状：#v 商品交易所#!、#v 货币市场#!或#v 股票市场#!。交易所可从#v 10#!条扬名路线中持有#v 1#!至#v 4#!项专长，地位越高越多，每项至少保留#v 5#!年。\n\n在稳健放贷的平静年份里信誉会上升，而[Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')]、[concept_spec_bad_debts]以及主要商品的[concept_spec_bust]或[concept_spec_collapse]会使信誉下降。信誉低会提高[concept_loans]的利率，信誉高则会降低利率。"
 spec_exch_national: "交易所地位"
 spec_trust_0: "不受信任的交易所"
 spec_trust_0_desc: "该[concept_country]的[concept_spec_exchange]在投资者眼中#v 不受信任#!。"
 spec_trust_1: "受到怀疑的交易所"
 spec_trust_1_desc: "该[concept_country]的[concept_spec_exchange]在投资者眼中#v 受到怀疑#!。"
 spec_trust_3: "深受信任的交易所"
