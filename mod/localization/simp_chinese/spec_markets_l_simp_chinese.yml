 spec_issue_cool_tt: "自上次发行以来，市场已休整一年"
 spec_issue_no_lever_tt: "该[concept_good]未受任何[concept_spec_intervention]"
 spec_lever_no_issue_tt: "该[concept_good]没有正在进行的大宗发行"
 SPEC_LEVERS_TT: "#header 市场干预#!\n$TOOLTIP_DELIMITER$\n#italic 我国政府正在为其降温或升温的商品。#!\n\n每月消耗#N -[Country.MakeScope.ScriptValue('spec_lever_authority')|0]#![concept_authority]\n受抑制：#v [Country.MakeScope.ScriptValue('spec_n_restrain')|0]#!\n受鼓励：#v [Country.MakeScope.ScriptValue('spec_n_encourage')|0]#!\n[concept_budget_additional_income]：每周#P @money![Country.MakeScope.ScriptValue('spec_lever_levy')|D]#!\n[concept_budget_additional_expenses]：每周#N @money![Country.MakeScope.ScriptValue('spec_lever_spend')|D]#!"
 spec_story.1.t: "[ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName]市场破裂"
 spec_story.1.t_generic: "市场破裂"
 spec_story.1.d: "涌入[ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName]的热潮已经结束。攀升了一年的价格在一个月内跌落，在狂热顶峰上市的公司付不出账单。不计价格买入的商人守着清不空的仓库，以其存货为抵押放贷的银行正在清算损失。"
 spec_story.1.d_generic: "涌入当季热门商品的热潮已经结束。攀升了一年的价格在一个月内跌落，在狂热顶峰上市的公司付不出账单。不计价格买入的商人守着清不空的仓库，以其存货为抵押放贷的银行正在清算损失。"
 spec_story.1.f: "“我做[ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName]生意三十年了，从没见过人们像这十二个月里这样急着买，又这样拼命地卖。”"
 spec_story.1.f_generic: "“我做这行三十年了，从没见过人们像这十二个月里这样急着买，又这样拼命地卖。”"
 spec_story.1.a: "向破产的生产者提供救济。"
 spec_story.1.b: "让最弱的商号倒闭。"
 spec_story.1.c: "调查发起人。"
 spec_story.2.t: "骗局败露"
 spec_story.2.d: "[ROOT.GetCountry.GetCapital.GetCityHubName][ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName]公司的董事们已逃往国外，账簿显示过去两年丰厚的股息竟是用新认购款支付的。成千上万的职员、寡妇和店主持有其股票。[ROOT.GetCountry.GetCapital.GetCityHubName]的每家报纸都在追问，还有多少招股书出自同一人之手。"
 spec_story.2.d_generic: "一家著名的[ROOT.GetCountry.GetCapital.GetCityHubName]股份公司的董事们已逃往国外，账簿显示过去两年丰厚的股息竟是用新认购款支付的。成千上万的职员、寡妇和店主持有其股票。[ROOT.GetCountry.GetCapital.GetCityHubName]的每家报纸都在追问，还有多少招股书出自同一人之手。"
 spec_story.2.f: "#bold 诈骗通缉#!\n[ROOT.GetCountry.GetCapital.GetCityHubName][ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName]公司总经理，年约五十，衣着考究，谈吐令人信服。最后出现于码头。"
 spec_story.2.f_generic: "#bold 诈骗通缉#!\n某[ROOT.GetCountry.GetCapital.GetCityHubName]股份公司的总经理，年约五十，衣着考究，谈吐令人信服。最后出现于码头。"
 spec_story.2.a: "起诉董事。"
 spec_story.2.b: "压下此事。"
 spec_story.2.c: "赔偿小投资者。"
 spec_story.3.t: "银行挤兑"
 spec_story.3.d: "今晨储户围攻了[ROOT.GetCountry.GetCapital.GetCityHubName]最古老的银行之一，到中午它已关门。全城都拒收它的银行券，在那里开户的商号本周发不出工钱。其他每家银行门外的队伍每小时都在变长。"
 spec_story.3.f: "“我父亲把积蓄存在那家银行，他父亲也是。他们告诉我们，那里和国库一样安全。”"
 spec_story.3.a: "担保其存款。"
 spec_story.3.b: "它必须自行存亡。"
 spec_story.3.c: "必须向银行放贷。"
 spec_story.4.t: "[ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]恐慌"
 spec_story.4.t_generic: "海外恐慌"
 spec_story.4.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]传来了[ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]发生[concept_spec_financial_panic]的消息。那里的银行正在收回海外贷款，向[ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]销售货物或在那里借款的我国商号突然缺钱。交易所里的每个商人都想知道麻烦是否会蔓延。"
 spec_story.4.d_generic: "[ROOT.GetCountry.GetCapital.GetCityHubName]传来了国外发生金融恐慌的消息。外国银行正在收回贷款，在海外销售或借款的我国商号突然缺钱。交易所里的每个商人都想知道麻烦是否会蔓延。"
 spec_story.4.f: "“[ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]打个喷嚏，我们的交易所就卧床不起。”"
 spec_story.4.f_generic: "“邻国打个喷嚏，我们的交易所就卧床不起。”"
 spec_story.4.a: "向我们的商行放贷。"
 spec_story.4.b: "他们的麻烦与我们无关。"
 spec_story.4.c: "归咎于鲁莽的外国银行家。"
 spec_story.5.t: "信心回归"
 spec_story.5.d: "恐慌最糟糕的时候已经过去。幸存的商号重新开始招工，银行开始向稳健的客户放贷，几位大胆的投资者正以去年价格的零头买入股票。没有人指望很快回到昔日的放纵，但[ROOT.GetCountry.GetCapital.GetCityHubName]又一次开门营业了。"
 spec_story.5.f: "“春天卖光一切的人，秋天正在买回来，价钱比他们卖的时候还划算。”"
 spec_story.5.a: "鼓励新企业。"
 spec_story.5.b: "这次放贷必须稳健。"
 spec_story.6.t: "制造商代表团"
 spec_story.6.d: "一个由制造商和商人组成的代表团拜会了政府。他们说，自己的新工厂因缺乏信贷而半途停工，而国外的竞争对手自由借贷，抢走了他们的市场。他们请求允许银行重新放贷。"
 spec_story.6.f: "“先生，您的谨慎让我们免于崩溃，办法是确保再没有什么可崩溃的了。”"
 spec_story.6.a: "放松信贷。"
 spec_story.6.b: "信贷继续收紧。"
 spec_story.6.c: "改为向他们提供补贴。"
 spec_story.7.t: "炒股狂潮"
 spec_story.7.d: "职员、店主和教师挤满了[ROOT.GetCountry.GetCapital.GetCityHubName]的咖啡馆，买卖他们从未见过的公司的股票。[ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName]企业的股票一天数次易手，大部分都是举债买入的。据说仆人们正把礼拜日穿的衣服典当出去，只为在下一次上市中分一杯羹。"
 spec_story.7.d_generic: "职员、店主和教师挤满了[ROOT.GetCountry.GetCapital.GetCityHubName]的咖啡馆，买卖他们从未见过的公司的股票。最新企业的股票一天数次易手，大部分都是举债买入的。据说仆人们正把礼拜日穿的衣服典当出去，只为在下一次上市中分一杯羹。"
 spec_story.7.f: "“今早我的理发师给了我一条[ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName]股票的内幕消息。我收下了，也回赠他一条：卖。”"
 spec_story.7.f_generic: "“今早我的理发师给了我一条股票内幕消息。我收下了，也回赠他一条：卖。”"
 spec_story.7.a: "让人民分享财富。"
 spec_story.7.b: "禁止举债交易。"
 spec_story.7.c: "对股票转让征收印花税。"
 spec_story.8.t: "泡沫警告"
 spec_story.8.d: "一位德高望重的经济学家致信[ROOT.GetCountry.GetCapital.GetCityHubName]的主要报纸，称[ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName]和[ROOT.GetCountry.MakeScope.Var('spec_story_good2').GetGoods.GetName]的上涨不可持续，银行放贷所依据的价格没有哪个清醒的人愿意支付。经纪人们称之为老太婆的聒噪。然而全城每家俱乐部和账房都在高声朗读这封信。"
 spec_story.8.d_generic: "一位德高望重的经济学家致信[ROOT.GetCountry.GetCapital.GetCityHubName]的主要报纸，称当下最受青睐的商品的上涨不可持续，银行放贷所依据的价格没有哪个清醒的人愿意支付。经纪人们称之为老太婆的聒噪。然而全城每家俱乐部和账房都在高声朗读这封信。"
 spec_story.8.f: "“价格不过是最后一位买家愿意支付的数目。我请读者想一想，还剩下多少买家。”"
 spec_story.8.a: "这一警告来得及时。"
 spec_story.8.b: "危言耸听的胡话。"
