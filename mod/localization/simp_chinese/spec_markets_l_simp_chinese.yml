l_simp_chinese:
 spec_confidence_bar: "市场信心"
 spec_confidence_bar_desc: "@spec_market_confidence! [concept_spec_market_confidence]: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!"
 spec_stance_current_tt: "这不是当前的[concept_spec_credit_policy]"
 spec_stance_cooldown_tt: "@spec_credit_policy! [concept_spec_credit_policy]在过去#v 6#!个月内未更改"
 spec_rescued_tt: "本次[concept_spec_financial_panic]期间，我们既未向银行放贷，也未暂停实施银行法"
 spec_credit_tight: "紧缩信贷"
 spec_credit_tight_fx: "@spec_credit_policy! [concept_spec_credit_policy]变为#v 紧缩#!"
 spec_credit_normal_fx: "@spec_credit_policy! [concept_spec_credit_policy]变为#v 常规#!"
 spec_credit_loose_fx: "@spec_credit_policy! [concept_spec_credit_policy]变为#v 宽松#!"
 spec_credit_tight_desc: "#italic 让借钱变贵，给市场降温。#!\n\n#N 银行停止放贷#!\n投资者对价格上涨不那么兴奋\n#P 热潮更小#!，结束更温和，恐慌也更轻\n每月，[concept_spec_market_confidence]高于#v 60#!的部分会流失#N 10%#!\n\n锁定[concept_spec_credit_policy]#v 6#!个月\n需要[GetTechnology('central_banking').GetName]\n\n@intelligentsia! 知识分子[concept_in_government]：#P +2#![concept_approval]\n@industrialists! 工业家[concept_in_government]：#N -2#![concept_approval]"
 spec_credit_normal: "常规信贷"
 spec_credit_normal_desc: "#italic 银行按常规条件放贷。#!\n\n[concept_spec_market_confidence]高于#v 55#!时，银行向[concept_investment_pool]放贷\n\n锁定[concept_spec_credit_policy]#v 6#!个月\n需要[GetTechnology('central_banking').GetName]"
 spec_credit_loose: "宽松信贷"
 spec_credit_loose_desc: "#italic 让借钱变得便宜，让资金流动起来。#!\n\n#P 银行放贷更多#!\n投资者对价格上涨更加兴奋\n#P 热潮更大#!，但结束时#N 损失也更大#!\n\n锁定[concept_spec_credit_policy]#v 6#!个月\n需要[GetTechnology('central_banking').GetName]\n\n@industrialists! 工业家[concept_in_government]：#P +2#![concept_approval]\n@intelligentsia! 知识分子[concept_in_government]：#N -2#![concept_approval]"
 spec_rescue_banks: "向银行放贷"
 spec_rescue_banks_desc: "#italic 从[concept_treasury]拿钱注入银行，制止恐慌。#!\n\n花费：约为[concept_gdp]的#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#!\n在#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#!个月内#P 结束#![concept_spec_financial_panic]\n剩余月份的惩罚#P 减半#!\n[concept_spec_market_confidence]上升#P 20#!\n\n#b 不会改变#!\n$spec_panic_relief$支出\n恐慌开始时已激进化的人\n它留下的[concept_spec_bad_debts]\n\n恐慌剩余时间越长，花费越多\n每次$concept_spec_financial_panic$只能使用一次\n[GetTechnology('central_banking').GetName]使其更便宜、更快"
 spec_conf_panic: "投资者动摇"
 spec_conf_panic_held: "投资者动摇"
 spec_conf_wary: "投资者谨慎"
 spec_conf_steady: "投资者稳定"
 spec_conf_buoyant: "投资者乐观"
 spec_conf_mania: "投资者狂热"
 spec_conf_panic_desc: "[concept_spec_market_confidence]对投资和[concept_loans]利息的影响"
 spec_conf_panic_held_desc: "[concept_spec_market_confidence]对投资和[concept_loans]利息的影响"
 spec_conf_wary_desc: "[concept_spec_market_confidence]对投资和[concept_loans]利息的影响"
 spec_conf_steady_desc: "[concept_spec_market_confidence]对投资和[concept_loans]利息的影响"
 spec_conf_buoyant_desc: "[concept_spec_market_confidence]对投资和[concept_loans]利息的影响"
 spec_conf_mania_desc: "[concept_spec_market_confidence]对投资和[concept_loans]利息的影响"
 spec_panic: "金融恐慌"
 spec_panic_desc: "[concept_market]中[concept_spec_financial_panic]的影响"
 spec_panic_crunch: "信贷紧缩"
 spec_panic_crunch_desc: "[concept_spec_financial_panic]期间银行已停止放贷，[concept_private_construction]大幅放缓"
 spec_lev_boom: "信贷热潮"
 spec_bailout_fx_tt: "@spec_bad_debts! [concept_spec_bad_debts]：#P 减半#!，#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_months')|0]#!个月后清除，而非#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#!个月"
 spec_bailout_cost_tt: "[concept_treasury]：#N -@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_cost')|D]#!，约为[concept_gdp]的#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_share')|%0]#!"
 spec_bailout_debts_tt: "有待清除的[concept_spec_bad_debts]"
 spec_bailed_tt: "自这些[concept_spec_bad_debts]出现以来国家尚未收购不良贷款"
 spec_lev_boom_desc: "借来的资金让工厂保持忙碌，[concept_spec_leverage]每满一个月，[concept_throughput]增加#P +2%#!，最多#P +24%#!"
 spec_credit_crunch: "坏账"
 spec_credit_crunch_desc: "银行仍在清点上一轮热潮的损失。在此效果消退之前，#N 它们不会放贷#!。\n#v 向银行放贷#!无法将其清除\n#v 收购不良贷款#!可将其减半，在其存续期间限一次"
 spec_loose_credit: "宽松信贷"
 spec_loose_credit_desc: "[concept_spec_credit_policy]的影响"
 spec_tight_credit: "紧缩信贷"
 spec_tight_credit_desc: "[concept_spec_credit_policy]的影响"
 spec_markets.1.t: "投机狂热"
 spec_markets.1.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]的财富来得太快，已经数不过来。[ROOT.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]、[ROOT.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]和[ROOT.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]的价格逐周攀升，生产它们的新公司几乎每天都在上市，银行也不假思索地以其股票为抵押放贷。很少有人停下来问一问，这一切究竟值多少钱。\n\n一些$capitalists_no_icon$和$shopkeepers_no_icon$把新得的财富归功于政府，成为[Concept('concept_loyalist','$concept_loyalists|q$')]。如果这种局面持续下去，支持[GetLawType('law_laissez_faire').GetName]的[Concept('concept_political_movement','$concept_political_movements|q$')]将获得支持。"
 spec_markets.1.d_generic: "[ROOT.GetCountry.GetCapital.GetCityHubName]的财富来得太快，已经数不过来。物价逐周攀升，新公司几乎每天都在上市，银行也不假思索地以其股票为抵押放贷。很少有人停下来问一问，这一切究竟值多少钱。\n\n一些$capitalists_no_icon$和$shopkeepers_no_icon$把新得的财富归功于政府，成为[Concept('concept_loyalist','$concept_loyalists|q$')]。如果这种局面持续下去，支持[GetLawType('law_laissez_faire').GetName]的[Concept('concept_political_movement','$concept_political_movements|q$')]将获得支持。"
 spec_markets.1.f: "“买吧，孩子，别管价格。不管你今天付多少，明天总有别的家伙付得更多。”"
 spec_markets.1.a: "繁荣本身就是明证。"
 spec_markets.1.b: "劝诫节制。"
 spec_markets.1.b.tt: "@spec_market_confidence! [concept_spec_market_confidence]下降#v 10#!"
 spec_markets.1.c: "让投机者缴纳他们的份额。"
 spec_markets.1.c.tt: "@spec_market_confidence! [concept_spec_market_confidence]下降#v 5#!"
 spec_markets.2.t: "金融恐慌"
 spec_markets.2.d_crash: "[ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName]的热潮是已终结热潮中规模最大的，它的终结已演变为一场全面恐慌。以其价格为抵押放贷的商号接连倒闭，从天一亮起，储户就在[ROOT.GetCountry.GetCapital.GetCityHubName]的银行外排起长队。银行正在收回#v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#!的贷款，投资者紧紧攥住所剩无几的财产。[concept_private_construction]将在#v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!个月内减半。\n\n破产的$capitalists_no_icon$、$aristocrats_no_icon$和$shopkeepers_no_icon$归咎于政府，其中一些人成为了[Concept('concept_radical','$concept_radicals|q$')]。许多人如今希望国家约束市场，反对[GetLawType('law_laissez_faire').GetName]的[Concept('concept_political_movement','$concept_political_movements|q$')]获得了支持。[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_crash_no_loans: "[ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName]的热潮是已终结热潮中规模最大的，它的终结已演变为一场全面恐慌。以其价格为抵押放贷的商号接连倒闭，从天一亮起，储户就在[ROOT.GetCountry.GetCapital.GetCityHubName]的银行外排起长队。投资者紧紧攥住所剩无几的财产。[concept_private_construction]将在#v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!个月内减半。\n\n破产的$capitalists_no_icon$、$aristocrats_no_icon$和$shopkeepers_no_icon$归咎于政府，其中一些人成为了[Concept('concept_radical','$concept_radicals|q$')]。许多人如今希望国家约束市场，反对[GetLawType('law_laissez_faire').GetName]的[Concept('concept_political_movement','$concept_political_movements|q$')]获得了支持。[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign: "[ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName]的恐慌已蔓延到我国市场。在那里交易或借款的商号接连倒闭，从天一亮起，储户就在[ROOT.GetCountry.GetCapital.GetCityHubName]的银行外排起长队。银行正在收回#v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#!的贷款，投资者紧紧攥住所剩无几的财产。[concept_private_construction]将在#v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!个月内减半。\n\n破产的$capitalists_no_icon$、$aristocrats_no_icon$和$shopkeepers_no_icon$归咎于政府，其中一些人成为了[Concept('concept_radical','$concept_radicals|q$')]。许多人如今希望国家约束市场，反对[GetLawType('law_laissez_faire').GetName]的[Concept('concept_political_movement','$concept_political_movements|q$')]获得了支持。[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign_no_loans: "[ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName]的恐慌已蔓延到我国市场。在那里交易或借款的商号接连倒闭，从天一亮起，储户就在[ROOT.GetCountry.GetCapital.GetCityHubName]的银行外排起长队。投资者紧紧攥住所剩无几的财产。[concept_private_construction]将在#v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!个月内减半。\n\n破产的$capitalists_no_icon$、$aristocrats_no_icon$和$shopkeepers_no_icon$归咎于政府，其中一些人成为了[Concept('concept_radical','$concept_radicals|q$')]。许多人如今希望国家约束市场，反对[GetLawType('law_laissez_faire').GetName]的[Concept('concept_political_movement','$concept_political_movements|q$')]获得了支持。[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other: "信心在一瞬间崩溃。即使是健全的商号，出价再高也借不到钱，从天一亮起，储户就在[ROOT.GetCountry.GetCapital.GetCityHubName]的银行外排起长队。银行正在收回#v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#!的贷款，投资者紧紧攥住所剩无几的财产。[concept_private_construction]将在#v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!个月内减半。\n\n破产的$capitalists_no_icon$、$aristocrats_no_icon$和$shopkeepers_no_icon$归咎于政府，其中一些人成为了[Concept('concept_radical','$concept_radicals|q$')]。许多人如今希望国家约束市场，反对[GetLawType('law_laissez_faire').GetName]的[Concept('concept_political_movement','$concept_political_movements|q$')]获得了支持。[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other_no_loans: "信心在一瞬间崩溃。即使是健全的商号，出价再高也借不到钱，从天一亮起，储户就在[ROOT.GetCountry.GetCapital.GetCityHubName]的银行外排起长队。投资者紧紧攥住所剩无几的财产。[concept_private_construction]将在#v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!个月内减半。\n\n破产的$capitalists_no_icon$、$aristocrats_no_icon$和$shopkeepers_no_icon$归咎于政府，其中一些人成为了[Concept('concept_radical','$concept_radicals|q$')]。许多人如今希望国家约束市场，反对[GetLawType('law_laissez_faire').GetName]的[Concept('concept_political_movement','$concept_political_movements|q$')]获得了支持。[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.bad_debts: "热潮中的贷款已成坏账。在接下来的几个月里，[concept_spec_bad_debts]将使[concept_throughput]降低#N [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_tp_full_pct')|1]%#!，随后逐渐消退，在#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#!个月内清除。在清除之前银行不会放贷，#v 向银行放贷#!也无法将其清除。"
 spec_markets.2.d_crash_bad: "$spec_markets.2.d_crash$\n\n$spec_markets.2.bad_debts$"
 spec_markets.2.d_crash_no_loans_bad: "$spec_markets.2.d_crash_no_loans$\n\n$spec_markets.2.bad_debts$"
 spec_markets.2.d_foreign_bad: "$spec_markets.2.d_foreign$\n\n$spec_markets.2.bad_debts$"
 spec_markets.2.d_foreign_no_loans_bad: "$spec_markets.2.d_foreign_no_loans$\n\n$spec_markets.2.bad_debts$"
 spec_markets.2.d_other_bad: "$spec_markets.2.d_other$\n\n$spec_markets.2.bad_debts$"
 spec_markets.2.d_other_no_loans_bad: "$spec_markets.2.d_other_no_loans$\n\n$spec_markets.2.bad_debts$"
 spec_markets.2.f: "“昨天我身家四万。今天早上我只剩身上这件外套，而且有人出的价还低得可怜。”"
 spec_markets.2.a: "市场必须自行触底。"
 spec_markets.2.a.tt: "除非我们之后#v 向银行放贷#!，否则[concept_spec_financial_panic]将完整地走完全程；向银行放贷也会消除这项$ig_industrialists$[concept_approval]变化"
 spec_markets.2.b: "必须向银行放贷。"
 spec_markets.2.b.tt: "[concept_spec_financial_panic]在#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#!个月内结束，其影响减半\n[concept_spec_market_confidence]上升#v 20#!"
 spec_rescue_cost_tt: "[concept_treasury]：#N -@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_cost')|D]#!，约为[concept_gdp]的#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#!"
 spec_levy_tt: "[concept_treasury]：#P +@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_speculator_tax')|D]#!，约为[concept_gdp]的#v 0.25%#!"
 spec_bank_bailout_tt: "$ig_trade_unions$和$ig_rural_folk$[concept_approval]：#N -2#!，持续#v 2.5#!年"
 spec_markets.2.c: "这是投机者招来的祸。"
 spec_boom_riding: "乘热潮而上"
 spec_boom_warning: "不受欢迎的警告"
 spec_prudent_counsel: "审慎进言"
 spec_speculation_levy: "投机税"
 spec_market_left_alone: "放任市场"
 spec_bank_bailout: "银行纾困"
 spec_blamed_for_panic: "被指造成恐慌"
 spec_speculators_blamed: "投机者受谴责"
 SPEC_UNWIND: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_sev_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_sev_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_2', 'SPEC_UNWIND_1'))]"
 SPEC_UNWIND_LINK: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_sev_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_sev_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]"
 SPEC_UNWIND_DESC: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_sev_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_DESC_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_sev_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_DESC_2', 'SPEC_UNWIND_DESC_1'))]"
 SPEC_RISK_NONE: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_sev_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_RISK_SLIGHT', SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_RISK_GLUT', 'SPEC_RISK_CALM'))]"
 SPEC_RISK_SLIGHT: "#header $SPEC_UNWIND$风险#!\n热潮结束时的[concept_spec_market_confidence]：#v 轻微#!\n$TOOLTIP_DELIMITER$\n#italic 一轮小热潮。即使现在结束，也几乎没有影响。#!\n\n$SPEC_UNWIND_DESC$"
 SPEC_RISK_GLUT: "#header 恢复中#!\n$TOOLTIP_DELIMITER$\n#italic [Goods.GetName]正在从上一轮热潮中恢复。#!\n\n投资者会观望一段时间，因此[concept_spec_investor_interest]停留在#v 疑虑#!"
 SPEC_RISK_CALM: "#header 无热潮#!\n$TOOLTIP_DELIMITER$\n#italic 无需担心。[Goods.GetName]近期没有热潮。#!\n\n一旦[concept_spec_investor_interest]达到#v 看好#!或更高，回落到#v 疑虑#!就会#N 结束热潮#!\n涨得越高，摔得越重"
 SPEC_UNWIND_3: "崩盘"
 SPEC_UNWIND_C_3: "@spec_collapse! [concept_spec_collapse]"
 SPEC_UNWIND_DESC_3: "这轮热潮最高达到#v 过热#!\n如果价格趋势跌破#v [Divide_CFixedPoint('(CFixedPoint)-4.988', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!，热潮就会#N 结束#!。届时[concept_spec_investor_interest]转为#v 逃离#!，热潮以[concept_spec_collapse]告终\n之后投资者会观望#v 12#!个月\n随着热潮变老，#P 危险逐渐减弱#!"
 SPEC_UNWIND_2: "暴跌"
