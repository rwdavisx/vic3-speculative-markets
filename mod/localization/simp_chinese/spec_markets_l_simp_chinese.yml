 concept_spec_long_depression_desc: "@spec_long_depression! $concept_spec_long_depression$是一场世界经济的危机。当一个[concept_great_power]陷入[concept_spec_financial_panic]时它便开始，随后波及所有已处于恐慌中的国家，并沿着紧密联系蔓延，例如共同的[concept_market]、附属国与宗主国、投资权、大量贸易以及外国所有权。\n\n在世界性崩溃期间（#v 4#!个月），信贷冻结，[concept_spec_market_confidence]流失。\n在萧条期间（最多#v 5#!年），投资、建设和贸易放缓，部分人口成为[Concept('concept_radical','$concept_radicals|q$')]。\n在复苏期间（#v 1#!年），$concept_spec_market_confidence$回升。\n\n你的选择会加快本国和世界的复苏。$concept_great_power$的选择影响最大。"
