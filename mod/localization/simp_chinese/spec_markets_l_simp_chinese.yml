 concept_spec_intervention: "干预"
 concept_spec_intervention_desc: "@spec_intervention! 通过$concept_spec_intervention$，你的政府介入一种[concept_good]的市场。你可以对它#v 抑制投机#!或#v 鼓励投资#!。\n\n#v 抑制投机#!使[concept_spec_investor_interest]降至#v 平静#!。其生产者损失#N 10%#![concept_throughput]，并按基础价格缴纳每周产出#v 10%#!的税款。\n\n#v 鼓励投资#!使热度升至#v 看好#!。其生产者获得#P 10%#!$concept_throughput$，以及相当于产出#v 20%#!的补贴。\n\n每项干预在解除前每月消耗[concept_authority]。必需品以及在[concept_market]贸易中占比大的$concept_goods$消耗更多。"
 SPEC_LEVER_ISSUE_TT: "#header 为[Goods.GetName]发起大宗发行#!\n$TOOLTIP_DELIMITER$\n#italic 在我国交易所出售一种热门[concept_good]的股份。回报大，风险也大。#!\n\n在#v 2#!年内：\n[Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]得分：#P +25%#!\n其热潮结束时，其中的银行贷款造成的打击为#N x1.5#!\n其热潮结束时，获得或损失的信誉为#v x2#!\n$TOOLTIP_DELIMITER$\n同一时间只能进行一项，两次之间至少间隔#v 1#!年[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_issue_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_ISSUE_ON', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_issue').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_ISSUE_ON: "\n\n该[concept_good]正在进行一次发行"
 spec_issue_stand_tt: "我国[concept_spec_exchange]地位为#v 全国级#!或更高"
