 spec_coty: "年度公司"
 spec_coty_desc: "今年世界上最繁荣的[concept_spec_blue_chip]属于我们"
 spec_bc_index: "蓝筹指数"
 spec_bc_index_desc: "我国的[concept_spec_blue_chip]吸引储蓄流入市场，并使贷款更便宜。每家都会使其更强。前5家全额计算，之后最多到10家按一半计算。"
 spec_bluechip.1.t: "新的蓝筹股"
 spec_bluechip.1.d: "经过一年稳定盈利，[SCOPE.sCompany('spec_bc_co').GetName]如今跻身蓝筹股之列。全国的银行和寡妇都争购其股票，经纪人们则议论它是会满足于现有地位，还是会向市场索取更多资金。"
 spec_bluechip.1.f: "人们说，它和银行一样稳妥。"
 spec_bluechip.1.a: "为他们敲响钟声"
 spec_bluechip.1.a.tt: "我方[concept_spec_exchange]信任：#P +2%#!"
 spec_bluechip.1.b: "让他们发行新股"
 spec_bluechip.1.b.tt: "我方[concept_investment_pool]：#P +[ROOT.GetCountry.MakeScope.ScriptValue('spec_bc_shares')|D]#! @money!\n[SCOPE.sCompany('spec_bc_co').GetName]在#v 5#!年内变得脆弱，因此[concept_prosperity]只要有一个月低于#v 70#!，就不再是蓝筹股"
 spec_bluechip.2.t: "蓝筹股失色"
 spec_bluechip.2.d: "[SCOPE.sCompany('spec_bc_co').GetName]已跌破蓝筹股的标准。如果其利润在3个月内无法恢复，市场将把它从名单上除名，我们的交易所也将受到冲击。"
 spec_bluechip.2.f: "屹立一代人的商号，也可能在一季之间倒下。"
 spec_bluechip.2.a: "扶持它"
 spec_bluechip.2.a.tt: "花费：#N [ROOT.GetCountry.MakeScope.ScriptValue('spec_bc_prop_cost')|D]#! @money!\n无论盈利如何，[SCOPE.sCompany('spec_bc_co').GetName]在#v 12#!个月内保持地位"
 spec_bluechip.2.b: "让市场决定"
 spec_bluechip.2.b.tt: "如果它在#v 3#!个月内一直低于标准：\n我方[concept_spec_exchange]信任：#N -2%#!\n[concept_spec_market_confidence]：#N -3#!"
 spec_bluechip.3.t: "年度公司"
 spec_bluechip.3.d: "各国首都的财经报刊一致认为，[SCOPE.sCompany('spec_bc_co').GetName]是今年世界上最繁荣的公司。我们的交易所也沐浴在它的荣光之中。"
 spec_bluechip.3.f: "金融城里的每个职员都想买它的股票。"
 spec_bluechip.3.a: "荣耀之日"
 spec_bluechip.3.a.tt: "我方[concept_spec_exchange]信任：#P +2%#!\n$spec_coty$一年内：[concept_prestige]#P +5%#!"
