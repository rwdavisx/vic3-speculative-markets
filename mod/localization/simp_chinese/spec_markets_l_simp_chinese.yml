 spec_suspend_act_desc: "允许银行突破该法案对其纸币设定的限额放贷。恐慌会在数月内平息，且无需国库负担任何成本，但投资者会认定政府总会出手相救。在本次恐慌中视同#v 向银行放贷#!。\n\n#lore 英国曾于1847年、1857年和1866年暂停实施《银行特许法》。#!"
 spec_relief_works_button: "救济工程"
 spec_relief_works_button_desc: "在萧条期间为公共工程和救济出资：#v 12#!个月内提供社会福利、更多建设并减少激进派，每周成本随我们的[concept_gdp]增长。"
 spec_convert_debt: "转换国债"
 spec_convert_debt_desc: "趁投资者情绪乐观，将我们的贷款换成利率更低的新贷款。靠旧利息过活的债券持有人可不会感谢我们。"
 spec_inquiry: "调查委员会"
 spec_inquiry_desc: "任命一个委员会，听取银行家、经纪人和破产储户的证词，并就我们的银行和公司应如何运作提出报告。其报告将颁行一项我们的科技所允许的[Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')]。委员会的会议将占用政府#v 6#!个月的精力。"
 spec_debt_converted: "债务已转换"
 spec_debt_converted_desc: "趁投资者热衷放贷之际，以更低利率转换的贷款"
 spec_relief_works: "救济工程"
 spec_relief_works_desc: "为因萧条失业的人提供公共工程和救济"
 spec_relief_costs: "救济工程成本"
 spec_relief_costs_desc: "救济工程的成本"
 spec_act_suspended: "银行法已暂停"
 spec_act_suspended_desc: "政府为结束恐慌搁置了自己的法律"
 spec_inquiry_sitting: "调查委员会"
 spec_inquiry_sitting_desc: "委员会正在听取有关上一次恐慌的证词"
 spec_sound_finance: "健全金融"
 spec_sound_finance_desc: "货币、银行和公司按投资者信任的规则运作"
 spec_rentiers_cut: "食利者收入削减"
 spec_relief_thanks: "救济工程"
 spec_dear_money: "银根紧缩"
 spec_free_issue: "自由银行制"
 spec_disclosure_burden: "披露规定"
 spec_disclosure_welcomed: "披露规定"
 spec_reform_currency_tt: "银行放贷减少#v 25%#!，[concept_spec_speculative_excess]积累速度降低#v 25%#!，[Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')]持续时间延长#v 25%#!\n允许在恐慌时暂停实施银行法"
 spec_reform_free_tt: "银行放贷增加#v 25%#!，热潮规模扩大#v 10%#!，其结束时损失的[concept_spec_market_confidence]增加#v 10%#!"
 spec_reform_llr_tt: "#v 向银行放贷#!的成本降低#v 50%#!，且恐慌提前一个月结束"
 spec_reform_company_tt: "热潮结束损失的[concept_spec_market_confidence]减少#v 30%#!"
 spec_reform.1.t: "调查委员会"
 spec_reform.1.d_panic: "恐慌后任命的委员会已提交报告：三卷银行家、经纪人和破产储户的证词。委员们一致认为，这场恐慌绝非天灾。在其他几乎所有问题上他们都各执一词，每种方案在议会中都有拥护者。"
 spec_reform.1.d_calm: "趁市场平静，一个委员会花了一年时间听取银行家、经纪人和政治经济学家的意见，研究如何防止下一轮热潮以毁灭告终。其报告提出了若干方案，每种方案在议会中都有拥护者。"
 spec_reform.1.f: "“在狂乱的恐慌时期，一家倒闭会引发多家倒闭，而防止这些连带倒闭的最佳办法，是阻止引发它们的最初倒闭。”"
 spec_reform.1.a: "将纸币发行与金库中的黄金挂钩。"
 spec_reform.1.b: "让每家健全的银行发行自己的纸币。"
 spec_reform.1.c: "指定最后贷款人。"
 spec_reform.1.d: "要求公司公布账目。"
 spec_reform.1.e: "感谢委员会的辛劳。"
 spec_reform.2.t: "健全金融"
 spec_reform.2.d: "我们的银行依规则发行纸币，恐慌来袭时有贷款人随时待命，我们的公司也必须向投资者表明自己拥有什么、欠下什么。在国外，我们的债券如今以溢价出售，[ROOT.GetCountry.GetCapital.GetCityHubName]被称为资本的避风港。"
 spec_reform.2.f: "“银行家的首要职责不是赚钱，而是守住钱。”"
 spec_reform.2.a: "信心是信用的基础。"
