 spec_markets.2.f: "“昨天我身家四万。今天早上我只剩身上这件外套，而且有人出的价还低得可怜。”"
 spec_markets.2.a: "市场必须自行触底。"
 spec_markets.2.a.tt: "除非我们之后#v 向银行放贷#!，否则[concept_spec_financial_panic]将完整地走完全程；向银行放贷也会消除这项$ig_industrialists$[concept_approval]变化"
 spec_markets.2.b: "必须向银行放贷。"
 spec_markets.2.b.tt: "[concept_spec_financial_panic]在#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#!个月内结束，其影响减半\n[concept_spec_market_confidence]上升#v 20#!"
 spec_rescue_cost_tt: "[concept_treasury]：#N -@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_cost')|D]#!，约为[concept_gdp]的#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#!"
