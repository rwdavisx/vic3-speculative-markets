 SPEC_RISK_SLIGHT: "#header $SPEC_UNWIND$风险#!\n热潮结束时的[concept_spec_market_confidence]：#v 轻微#!\n$TOOLTIP_DELIMITER$\n$SPEC_UNWIND_DESC$"
 SPEC_RISK_GLUT: "#header 恢复中#!\n$TOOLTIP_DELIMITER$\n[Goods.GetName]在上一轮热潮结束后正在恢复。投资者持观望态度，使[concept_spec_investor_interest]在一段时间内保持在#v 疑虑#!。"
 SPEC_RISK_CALM: "#header 无热潮#!\n$TOOLTIP_DELIMITER$\n[Goods.GetName]近期没有热潮。一旦[concept_spec_investor_interest]达到#v 看好#!或更高，回落到#v 疑虑#!就会结束热潮，涨得越高，摔得越重。"
 SPEC_UNWIND_3: "崩盘"
 SPEC_UNWIND_C_3: "[concept_spec_collapse]"
 SPEC_UNWIND_DESC_3: "这种[concept_good]的热潮曾达到#v 过热#!。如果其价格趋势跌破#v [Divide_CFixedPoint('(CFixedPoint)-4.988', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!，[concept_spec_investor_interest]将转为#v 逃离#!，热潮以[concept_spec_collapse]告终。投资者随后观望#v 12#!个月。风险随热潮老化而减弱。"
 SPEC_UNWIND_2: "暴跌"
 SPEC_UNWIND_C_2: "[concept_spec_bust]"
 SPEC_UNWIND_DESC_2: "这种[concept_good]的热潮曾达到#v 追捧#!。如果其价格趋势跌破#v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!，[concept_spec_investor_interest]将转为#v 疑虑#!，热潮以[concept_spec_bust]告终。投资者随后观望#v 6#!个月。风险随热潮老化而减弱。"
 SPEC_UNWIND_1: "回调"
