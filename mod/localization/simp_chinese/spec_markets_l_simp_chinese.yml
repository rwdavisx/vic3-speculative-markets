 spec_lev_boom_desc: "[concept_spec_leverage]每满一个月，银行信贷使[concept_throughput]增加#P +2%#!，最多#P +24%#!。"
 spec_credit_crunch: "坏账"
 spec_credit_crunch_desc: "银行正在冲销上一轮热潮的贷款，在此效果消退之前不会放贷。#v 向银行放贷#!无法将其清除。#v 收购不良贷款#!可将其减半，在其存续期间限一次。"
 spec_loose_credit: "宽松信贷"
 spec_loose_credit_desc: "[concept_spec_credit_policy]的影响"
 spec_tight_credit: "紧缩信贷"
 spec_tight_credit_desc: "[concept_spec_credit_policy]的影响"
 spec_markets.1.t: "投机狂热"
 spec_markets.1.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]的财富来得太快，已经数不过来。[ROOT.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]、[ROOT.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]和[ROOT.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]的价格逐周攀升，生产它们的新公司几乎每天都在上市，银行也不假思索地以其股票为抵押放贷。很少有人停下来问一问，这一切究竟值多少钱。\n\n一些$capitalists_no_icon$和$shopkeepers_no_icon$把新得的财富归功于政府，成为[Concept('concept_loyalist','$concept_loyalists|q$')]。如果这种局面持续下去，支持[GetLawType('law_laissez_faire').GetName]的[Concept('concept_political_movement','$concept_political_movements|q$')]将获得支持。"
 spec_markets.1.d_generic: "[ROOT.GetCountry.GetCapital.GetCityHubName]的财富来得太快，已经数不过来。物价逐周攀升，新公司几乎每天都在上市，银行也不假思索地以其股票为抵押放贷。很少有人停下来问一问，这一切究竟值多少钱。\n\n一些$capitalists_no_icon$和$shopkeepers_no_icon$把新得的财富归功于政府，成为[Concept('concept_loyalist','$concept_loyalists|q$')]。如果这种局面持续下去，支持[GetLawType('law_laissez_faire').GetName]的[Concept('concept_political_movement','$concept_political_movements|q$')]将获得支持。"
 spec_markets.1.f: "“买吧，孩子，别管价格。不管你今天付多少，明天总有别的家伙付得更多。”"
 spec_markets.1.a: "繁荣本身就是明证。"
 spec_markets.1.b: "劝诫节制。"
 spec_markets.1.b.tt: "[concept_spec_market_confidence]下降#v 10#!"
 spec_markets.1.c: "让投机者缴纳他们的份额。"
 spec_markets.1.c.tt: "[concept_spec_market_confidence]下降#v 5#!"
 spec_markets.2.t: "金融恐慌"
 spec_markets.2.d_crash: "[ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName]的热潮是已终结热潮中规模最大的，它的终结已演变为一场全面恐慌。以其价格为抵押放贷的商号接连倒闭，从天一亮起，储户就在[ROOT.GetCountry.GetCapital.GetCityHubName]的银行外排起长队。银行正在收回#v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#!的贷款，投资者紧紧攥住所剩无几的财产。[concept_private_construction]将在#v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!个月内减半。\n\n破产的$capitalists_no_icon$、$aristocrats_no_icon$和$shopkeepers_no_icon$归咎于政府，其中一些人成为了[Concept('concept_radical','$concept_radicals|q$')]。许多人如今希望国家约束市场，反对[GetLawType('law_laissez_faire').GetName]的[Concept('concept_political_movement','$concept_political_movements|q$')]获得了支持。[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_crash_no_loans: "[ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName]的热潮是已终结热潮中规模最大的，它的终结已演变为一场全面恐慌。以其价格为抵押放贷的商号接连倒闭，从天一亮起，储户就在[ROOT.GetCountry.GetCapital.GetCityHubName]的银行外排起长队。投资者紧紧攥住所剩无几的财产。[concept_private_construction]将在#v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!个月内减半。\n\n破产的$capitalists_no_icon$、$aristocrats_no_icon$和$shopkeepers_no_icon$归咎于政府，其中一些人成为了[Concept('concept_radical','$concept_radicals|q$')]。许多人如今希望国家约束市场，反对[GetLawType('law_laissez_faire').GetName]的[Concept('concept_political_movement','$concept_political_movements|q$')]获得了支持。[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign: "[ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName]的恐慌已蔓延到我国市场。在那里交易或借款的商号接连倒闭，从天一亮起，储户就在[ROOT.GetCountry.GetCapital.GetCityHubName]的银行外排起长队。银行正在收回#v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#!的贷款，投资者紧紧攥住所剩无几的财产。[concept_private_construction]将在#v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!个月内减半。\n\n破产的$capitalists_no_icon$、$aristocrats_no_icon$和$shopkeepers_no_icon$归咎于政府，其中一些人成为了[Concept('concept_radical','$concept_radicals|q$')]。许多人如今希望国家约束市场，反对[GetLawType('law_laissez_faire').GetName]的[Concept('concept_political_movement','$concept_political_movements|q$')]获得了支持。[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign_no_loans: "[ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName]的恐慌已蔓延到我国市场。在那里交易或借款的商号接连倒闭，从天一亮起，储户就在[ROOT.GetCountry.GetCapital.GetCityHubName]的银行外排起长队。投资者紧紧攥住所剩无几的财产。[concept_private_construction]将在#v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!个月内减半。\n\n破产的$capitalists_no_icon$、$aristocrats_no_icon$和$shopkeepers_no_icon$归咎于政府，其中一些人成为了[Concept('concept_radical','$concept_radicals|q$')]。许多人如今希望国家约束市场，反对[GetLawType('law_laissez_faire').GetName]的[Concept('concept_political_movement','$concept_political_movements|q$')]获得了支持。[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other: "信心在一瞬间崩溃。即使是健全的商号，出价再高也借不到钱，从天一亮起，储户就在[ROOT.GetCountry.GetCapital.GetCityHubName]的银行外排起长队。银行正在收回#v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#!的贷款，投资者紧紧攥住所剩无几的财产。[concept_private_construction]将在#v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!个月内减半。\n\n破产的$capitalists_no_icon$、$aristocrats_no_icon$和$shopkeepers_no_icon$归咎于政府，其中一些人成为了[Concept('concept_radical','$concept_radicals|q$')]。许多人如今希望国家约束市场，反对[GetLawType('law_laissez_faire').GetName]的[Concept('concept_political_movement','$concept_political_movements|q$')]获得了支持。[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other_no_loans: "信心在一瞬间崩溃。即使是健全的商号，出价再高也借不到钱，从天一亮起，储户就在[ROOT.GetCountry.GetCapital.GetCityHubName]的银行外排起长队。投资者紧紧攥住所剩无几的财产。[concept_private_construction]将在#v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!个月内减半。\n\n破产的$capitalists_no_icon$、$aristocrats_no_icon$和$shopkeepers_no_icon$归咎于政府，其中一些人成为了[Concept('concept_radical','$concept_radicals|q$')]。许多人如今希望国家约束市场，反对[GetLawType('law_laissez_faire').GetName]的[Concept('concept_political_movement','$concept_political_movements|q$')]获得了支持。[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.bad_debts: "热潮中的贷款已成坏账。在接下来的几个月里，[concept_spec_bad_debts]将使[concept_throughput]降低#N [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_tp_full_pct')|1]%#!，随后逐渐消退，在#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#!个月内清除。在清除之前银行不会放贷，#v 向银行放贷#!也无法将其清除。"
