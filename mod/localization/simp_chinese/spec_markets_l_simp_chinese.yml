 SPEC_DRIVER_WAREND: "战争结束"
 SPEC_DRIVER_WAREND_TT: "#header 战争结束：[Country.MakeScope.Var('spec_c_warend').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n按我国[concept_casualties]计算：完整效果的#v x[Country.MakeScope.Var('spec_war_stakes_now').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#title 完整效果#!\n获胜并取得[concept_war_goal]：#P +4#!\n获胜但一无所获：#P +1#!\n战败并放弃了[concept_war_goal]：#N -8#!\n战败但未放弃任何东西：#N -2#!\n无人获胜：#N -1#!\n\n#weak 我们至少会感受到#v 25%#!的效果；若战争损失了我国#v 25%#!的兵力，则感受全部效果#!"
 SPEC_DRIVER_BURST: "泡沫破裂"
 SPEC_DRIVER_BURST_TT: "#header 泡沫破裂：[Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#italic 泡沫破了。#!\n\n[concept_spec_speculative_excess]：#v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0'), Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_burst_per_heat'), '(CFixedPoint)-1'))|0]#!点\n每点#N -[Country.MakeScope.ScriptValue('spec_burst_per_heat')|2]#!\n最多#N -[Country.MakeScope.ScriptValue('spec_burst_max')|0]#!\n$TOOLTIP_DELIMITER$\n热潮使信心超过#v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#!后，一旦[concept_spec_market_confidence]跌破#v 60#!，泡沫就会破裂\n热潮持续越久、涨得越高，破裂越猛\n#weak 需要[GetTechnology('stock_exchange').GetName]#!"
