 SPEC_UNWIND_DESC_1: "这种[concept_good]的热潮曾达到#v 看好#!。如果其价格趋势跌破#v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!，[concept_spec_investor_interest]将转为#v 疑虑#!，热潮以[concept_spec_correction]告终。投资者随后观望#v 3#!个月。风险随热潮老化而减弱。"
