 SPEC_DOWNSIDE_TT: "#header 热潮风险#!\n$TOOLTIP_DELIMITER$\n#italic 热潮不会永远持续。一旦结束，我国[concept_spec_market_confidence]就会受到冲击。#!\n\n最大危险：#v [Country.MakeScope.Var('spec_risk_top_good').GetGoods.GetName]#!，若现在结束则#N -[Min_CFixedPoint(Country.MakeScope.Var('spec_risk_top').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'))|0]#!\n可能结束的热潮：#v [Country.MakeScope.Var('spec_n_risk').GetValueWithDefault('(CFixedPoint)0')|0]#!\n如果全部同时结束，信心将跌至#v [Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), Country.MakeScope.Var('spec_exposure').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0')|0]#!（#v [SelectLocalization(LessThan_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), Country.MakeScope.Var('spec_exposure').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0'), '(CFixedPoint)20'),'SPEC_TIER_PANIC', SelectLocalization(And(GreaterThanOrEqualTo_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), Country.MakeScope.Var('spec_exposure').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0'), '(CFixedPoint)20'), LessThan_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), Country.MakeScope.Var('spec_exposure').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0'), '(CFixedPoint)40')),'SPEC_TIER_WARY', SelectLocalization(And(GreaterThanOrEqualTo_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), Country.MakeScope.Var('spec_exposure').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0'), '(CFixedPoint)40'), LessThan_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), Country.MakeScope.Var('spec_exposure').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0'), '(CFixedPoint)60')),'SPEC_TIER_STEADY', SelectLocalization(And(GreaterThanOrEqualTo_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), Country.MakeScope.Var('spec_exposure').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0'), '(CFixedPoint)60'), LessThan_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'), Country.MakeScope.Var('spec_exposure').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0'), '(CFixedPoint)80')),'SPEC_TIER_BUOYANT', 'SPEC_TIER_MANIA'))))]#!）[AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_n_held').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_RISK_HELD_LINE')]\n$TOOLTIP_DELIMITER$\n#title 按商品：#!#indent_newline:3 $SPEC_ITEMS_RISK$#![AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_heat_collapse').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.005'), 'SPEC_RISK_SHARE')]"
