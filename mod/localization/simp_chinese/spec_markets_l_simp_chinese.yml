 SPEC_FOREIGN_UNSTD: "\n没有[GetTechnology('currency_standards').GetName]：#v x[Country.MakeScope.ScriptValue('spec_foreign_loss_mult')|2]#!"
 SPEC_FOREIGN_FLIGHT: "\n[concept_spec_capital_flight]：[Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')|+=2]"
 SPEC_DRIVER_FOREIGN_TT: "#header 外来恐慌：[Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n最近一次：#v [Country.MakeScope.Var('spec_foreign_src').GetCountry.GetName]#!\n$TOOLTIP_DELIMITER$[AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_HIT')][AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_FLIGHT')]\n$TOOLTIP_DELIMITER$\n同一[concept_market]：#v [Country.MakeScope.ScriptValue('spec_tie_market')|%0]#!\n附属国或宗主国：#v 80%#!\n外国投资权：#v [Country.MakeScope.ScriptValue('spec_tie_investment')|%0]#!\n市场间的大量贸易：#v [Country.MakeScope.ScriptValue('spec_tie_trade')|%0]#!\n外国对我国经济的所有权：最高#v 90%#!\n\n与我们有联系的[concept_country]发生[concept_spec_financial_panic]时，会降低这里的[concept_spec_market_confidence]。[concept_spec_market_tie]越紧密、对方经济相对我们越大，损失越大。[concept_great_power]传导全部损失，主要政权传导一半，小国几乎不传导。从国外传来的恐慌不会继续扩散。没有[GetTechnology('currency_standards').GetName]时，损失增加四分之一。"
 SPEC_DRIVER_TURMOIL: "战争与动荡"
 SPEC_DRIVER_TURMOIL_TT: "#header 战争与动荡：[Country.MakeScope.Var('spec_c_turmoil').GetValueWithDefault('(CFixedPoint)0')|+=2]#!$SPEC_ITEMS_TURMOIL$\n$TOOLTIP_DELIMITER$\n每场[concept_war]，来自[concept_spec_war_news]：每月#N -3#!至#P +0.15#!\n所有战争合计：每月#N -4#!至#P +0.5#!\n尚未开战的[concept_diplomatic_play]：每月#N -0.5#!\n国库见底：每月最多#N -3#!，自[concept_bankruptcy]前#v 20#!周起\n[concept_default]：每月#N -5#!\n[concept_revolution]：每月#N -2#!\n\n将鼠标悬停在数字上可查看原因。"
 SPEC_DRIVER_MOOD: "市场情绪"
 SPEC_DRIVER_MOOD_TT: "#header 市场情绪：[Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n本月的波动：[Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0')|+=2]\n上月的情绪：[Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0'))|+=2]\n$TOOLTIP_DELIMITER$\n[concept_spec_market_mood]每月随机波动，任一方向最多#v 0.75#!，其中#v 75%#!会延续到下个月。"
 SPEC_DRIVER_DRIFT: "回归基准"
 SPEC_DRIVER_DRIFT_TT: "#header 回归基准：[Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n与[concept_spec_baseline]的差距（#v 55#!）：[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0'), Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100'))|+=1]\n每月恢复#v x[Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100')|%1]#!\n$TOOLTIP_DELIMITER$\n[GetTechnology('macroeconomics').GetName]使这一速度提高一半。"
 SPEC_DRIVER_TIGHT: "紧缩信贷"
 SPEC_DRIVER_GROWTH: "增长"
 SPEC_DRIVER_GROWTH_TT: "#header 增长：[Country.MakeScope.Var('spec_c_growth').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[concept_gdp]相对近期均值：#v [Country.MakeScope.Var('spec_growth').GetValueWithDefault('(CFixedPoint)0')|=+%1]#!\n正常增长：#v -2%#!\n$TOOLTIP_DELIMITER$\n增长每高于或低于正常水平#v 1%#!，[concept_spec_market_confidence]每月变动#v 0.1#!，任一方向最多#v 0.6#!。"
 SPEC_DRIVER_BUSINESS: "商业情绪"
 SPEC_DRIVER_BUSINESS_TT: "#header 商业情绪：[Country.MakeScope.Var('spec_c_business').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n实业家的[concept_approval]：#v [Country.MakeScope.ScriptValue('spec_ind_approval')|0]#!\n\n忠诚（#v 10#!或以上）：每月#P +0.4#!\n满意（#v 5#!或以上）：每月#P +0.2#!\n不满（#v -5#!或以下）：每月#N -0.2#!\n愤怒（#v -10#!或以下）：每月#N -0.4#!"
 SPEC_DRIVER_TIGHT_TT: "#header 紧缩信贷：[Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_market_confidence]高于#v 60#!的部分：#v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.1')|1]#!\n每月#N -10%#!，来自[Concept('concept_spec_credit_policy','$concept_spec_credit_policy_tight|q$')]\n$TOOLTIP_DELIMITER$\n这使热潮在数月内逐步降温，而非一夕冷却。"
 concept_spec_market_conditions: "市场状况"
 concept_spec_market_conditions_desc: "$concept_spec_market_conditions$决定[concept_spec_boom_end]会造成多少[concept_spec_market_confidence]损失。热潮终结时$concept_spec_market_confidence$越高，损失越大。$concept_spec_market_confidence$为#v 55#!时，市场状况没有影响。金融区、庄园宅邸和金融科技也会改变市场状况。"
 concept_spec_baseline: "基准信心"
 concept_spec_baseline_desc: "放任不管时，[concept_spec_market_confidence]无论从上方还是下方，都会回归其$concept_spec_baseline$#v 55#!。偏离越远，回归越快。"
 concept_spec_market_mood: "市场情绪"
 concept_spec_market_mood_desc: "$concept_spec_market_mood$是没有单一原因的投资者情绪波动。它每月随机变动，任一方向最多#v 0.75#!，其中#v 75%#!会延续到下个月，因此好坏时期会持续一阵才消退。"
 concept_spec_market_tie: "市场联系"
 concept_spec_market_tie_desc: "$concept_spec_market_tie$表示一个[concept_country]在多大程度上跟随另一国的[concept_market]，决定两国之间传导多少[concept_spec_financial_panic]。\n\n一国拥有另一国[concept_gdp]的#v 10%#!起开始计入所有权，在#v 30%#!时最强。[GetLawType('law_free_trade').GetName]加强贸易联系，其他贸易政策则削弱贸易联系。[GetTechnology('international_exchange_standards').GetName]加强市场和投资联系。[concept_embargo]切断贸易联系。"
 concept_spec_capital_flight: "资本外逃"
 concept_spec_capital_flight_desc: "[concept_spec_financial_panic]爆发时，资金会逃往安全之地。每个[concept_great_power]，以及[concept_spec_exchange]为#v 国际级#!或更高的每个[concept_country]，若处于和平、信心为#v 稳定#!或更高且与恐慌国无关联，最多可获得#P +[GetPlayer.MakeScope.ScriptValue('spec_flight_gain_max')|0]#![concept_spec_market_confidence]。[GetTechnology('international_trade').GetName]和[GetTechnology('international_exchange_standards').GetName]提高这一收益。[concept_spec_exchange]地位越高，获得越多。"
 concept_spec_war_news: "战争消息"
 concept_spec_war_news_desc: "投资者逐月关注[concept_war]。$concept_spec_war_news$根据战局每月改变[concept_spec_market_confidence]：[concept_casualties]、[concept_blockade]、[concept_devastation]、[concept_gdp]下降和久拖不决会使其降低，而赢得[Concept('concept_battle','$concept_battles|q$')]和占领敌方土地则使其上升。每场战争每月使其变动#N -3#!至#P +0.15#!，所有战争合计为#N -4#!至#P +0.5#!。"
