 SPEC_DRIVER_RESTRAIN_TT: "#header 受抑制的热潮：[Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n本月我们让其缓慢降温的热潮：[Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0')|+=2]\n市场有多热（[concept_spec_market_conditions]）：#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#!\n$TOOLTIP_DELIMITER$\n#weak 受抑制的热潮会以[concept_spec_correction]的方式慢慢平息，而不是一下子崩落#!"
 SPEC_DRIVER_CAUTION_TT: "#header 政府与事件：[Country.MakeScope.Var('spec_c_caution').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n来自我们的决策和市场事件的一次性变化"
 SPEC_DRIVER_LIMIT_TT: "#header 下限与上限：[Country.MakeScope.Var('spec_c_limit').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_market_confidence]不能低于#v 0#!或高于#v 100#!。这是超出范围、未被计入的部分。"
