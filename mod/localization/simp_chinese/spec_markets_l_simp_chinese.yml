 SPEC_RIVAL_RULE: "#italic 我国[concept_spec_exchange]可以挑选其他交易所，与之争夺信誉。#!\n\n每个竞争者需要#N 25#!至#N 150#!影响力来维持。地位越高，花费越多\n在最低地位时可挑选#v 1#!个竞争者，地位每高一级多一个（最多#v 4#!个）\n竞争者在第一年内不能放弃\n这与外交上的宿敌关系无关\n\n#b 较量#!\n每场较量从开始起持续#v 5#!年，然后像拔河一样结算，并开始新一场\n力度条从双方的[Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]得分起算\n#N 第一场之后，每多一场较量都会分散我们的力量#!，削弱我们在所有较量中的得分（#v 2#!场：#N 80%#!，#v 4#!场：#N 57.1%#!）\n每家[concept_spec_blue_chip]将其拉向己方#v 3%#!（最多#v 5#!家全额，最多#v 10#!家减半）\n每次奏效的行动将其推向己方#v 10%#!，每方最多推动#v 5#!次\n接近中间即为平局\n\n#b 获胜#!\n#P 获胜#!后，败方失去#P 5%#!信誉\n#P 大胜#!（结算时力度条偏向一方超过#v 75%#!）后，败方失去#P 10%#!信誉，以及12个月内#P 5%#!的[concept_investment_pool]收入\n击败地位更高的交易所收获更多。击败地位更低的收获更少\n如果[concept_relations]为较差或更差，败方损失#N x1.5#!\n\n#b 行动#!\n既可以对我们竞争的交易所使用，也可以对与我们竞争的交易所使用\n每项行动对每个竞争者每年只能奏效一次\n对更大的交易所，花费更多、效果更差（#v x0.75#!至#v x1.33#!）\n发生[concept_spec_financial_panic]时，外逃的资金首先流向竞争者"
