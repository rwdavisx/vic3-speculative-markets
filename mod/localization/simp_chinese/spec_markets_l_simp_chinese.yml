 SPEC_PLEDGE_MAKE_TT: "#header 承诺救助银行#!\n$TOOLTIP_DELIMITER$\n只要[concept_treasury]能用储备支付且国家未处于[concept_default]，每次[concept_spec_financial_panic]都会立即获得救助，成本降低#P 25%#!\n恐慌造成的[concept_spec_exchange]信誉损失：#P -50%#!\n接收的[concept_spec_capital_flight]：#P +50%#!（国际级或更高地位，或身为[concept_great_power]）\n每次救助都会放松放贷标准\n$TOOLTIP_DELIMITER$\n陷入[concept_default]将违背承诺：失去全部信誉，[concept_spec_market_confidence]#N -15#!，[concept_legitimacy]#N -10#!，持续#v 5#!年\n撤回承诺需提前#v 24#!个月通知[AddLocalizationIf(Not(GetScriptedGui('spec_sgui_pledge').IsValid(GuiScope.SetRoot(Country.MakeScope).End)), 'SPEC_PLEDGE_PLEDGE_WHY')]"
