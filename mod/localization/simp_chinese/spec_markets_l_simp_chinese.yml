 SPEC_RV_SHORE_TT: "#header 稳固市场#!\n$TOOLTIP_DELIMITER$\n#italic 我国银行联合起来对付[Country.GetNameNoFormatting]。#!\n$TOOLTIP_DELIMITER$\n[Country.GetNameNoFormatting]对我方的行动在#v 12#!个月内效果#P 减半#!\n$TOOLTIP_DELIMITER$\n花费：从我国[concept_treasury]支出#N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#!\n冷却：对[Country.GetNameNoFormatting]#v 2年#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_shore').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_SHORE')]"
 SPEC_RV_WHY_RV_SHORE: "\n\n[GetScriptedGui('spec_sgui_rv_shore').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
