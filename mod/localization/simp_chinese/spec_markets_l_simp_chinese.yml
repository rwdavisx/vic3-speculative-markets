 SPEC_JE_STAGE_6: "[concept_spec_long_depression]笼罩着[JournalEntry.GetCountry.GetCapital.GetCityHubName]。投资者囤积手中所有，不肯借给任何人，迄今每一次复苏都在数月内夭折。世界的复苏另有专门的日志条目追踪。\n\n萧条期间，救济工程可让失业者有工可做、得以温饱。"
 SPEC_JE_STAGE_5: "恐慌笼罩了[JournalEntry.GetCountry.GetCapital.GetCityHubName]。储户天一亮就在银行外排起长队，贷款被纷纷收回，除非政府采取行动，[concept_private_construction]将在今后#v [JournalEntry.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!个月内减半。\n\n#v 向银行放贷#!可使恐慌更早结束，并使其影响减半。救济工程可让失业者有工可做、得以温饱。[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_currency_v'), '(CFixedPoint)0'), 'SPEC_JE_SUSPEND_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_4: "恐慌已经过去，身后留下倒闭的商号和半途而废的工程。投资者正在清点损失，#v [JournalEntry.GetCountry.MakeScope.Var('spec_panic_cooldown').GetValue|0]#!个月内不会发生新的恐慌。[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_reform_open_v'), '(CFixedPoint)0'), 'SPEC_JE_INQUIRY_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_3: "[JournalEntry.GetCountry.GetCapital.GetCityHubName]的交易所已经疯了。职员和寡妇们举债买入#v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!、#v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#!和#v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#!的股票，[concept_spec_market_confidence]处于#v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#!或以上的每个月都在加剧[concept_spec_speculative_excess]。当$concept_spec_market_confidence$跌破#v 60#!时，泡沫就会破裂，过度程度越高，摔得越重。\n\n抑制最热门商品的投机或收紧信贷，可以让泡沫慢慢泄气。"
 SPEC_JE_STAGE_2: "银根宽松，投资者情绪乐观。#v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!、#v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#!和#v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#!领域的新公司不出一小时便被超额认购，银行也以其股票为抵押慷慨放贷。[concept_spec_market_confidence]达到#v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#!或以上时，[concept_spec_speculative_excess]便开始累积。\n\n景气时期也是将国债转换为较低利率的时机。"
 SPEC_JE_STAGE_1: "[JournalEntry.GetCountry.GetCapital.GetCityHubName]交易所的买卖秩序井然。投资者青睐#v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!、#v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#!和#v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#!，避开#v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#!和#v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!。"
 SPEC_JE_STAGE_0: "[JournalEntry.GetCountry.GetCapital.GetCityHubName]的投资者十分谨慎。近来的损失让他们吃尽苦头，他们捂紧钱袋，避开#v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#!和#v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!。宽松信贷或鼓励对某种商品的投资，可以把他们引回来。"
