 SPEC_RV_EV_NONE: ""
 spec_rival.1.t11: "#v [ROOT.GetCountry.GetCapital.GetCityHubName]#!遭做空袭击！"
 spec_rival.1.d11: "开盘钟响之前，代表#v [SCOPE.sCountry('target').GetName]#!的经纪人一下子把大批我国铁路和银行股票抛向交易大厅。价格崩落，行情收报机跟不上，到中午时我们自己的职员也在惊慌抛售。\n\n我国[concept_spec_market_confidence]将在6个月内下降#N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#!。"
 spec_rival.1.f11: ""市场挤兑，可能只始于一则谣言。""
 spec_rival.1.t10: "失败的袭击"
 spec_rival.1.d10: "代表#v [SCOPE.sCountry('target').GetName]#!的经纪人一下子把我国股票抛向交易大厅，指望引发溃败。然而我国银行买下了他们抛出的每一批股票，价格稳住了，到收盘钟响时，舔舐伤口的反倒是袭击者。\n\n他们自己的[concept_spec_market_confidence]在6个月内下降#P 3#!。"
 spec_rival.1.f10: "\"卖出自己并不拥有之物的熊，最好别看错。\""
 spec_rival.1.t21: "有人在拉拢我们的资本"
 spec_rival.1.d21: "来自#v [SCOPE.sCountry('target').GetName]#!的代理人住进了我国最好的酒店，我国最大的投资者每晚都与他们共进晚餐。他们的条件很简单：更好的利率、更安全的避风港，而且不问尴尬的问题。\n\n在12个月内，我国[concept_investment_pool]收入的#N [GetPlayer.MakeScope.Var('spec_rv_lure_share').GetValue|%0]#!归他们所有。"
 spec_rival.1.f21: "\"资本流向善待它的地方，留在喂饱它的地方。\""
 spec_rival.1.t31: "流言攻势"
 spec_rival.1.d31: "#v [SCOPE.sCountry('target').GetName]#!的晨报连篇累牍地报道#v [ROOT.GetCountry.GetCapital.GetCityHubName]#!的伪造资产负债表和摇摇欲坠的银行。这些文章无一署名，也鲜有属实，但欧洲大陆的每一家账房都在读。\n\n我国[concept_spec_exchange]损失#N [Multiply_CFixedPoint('(CFixedPoint)0.0167', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|%0]#!信誉。"
 spec_rival.1.f31: "\"真相还在穿靴子，谎言已经绕了半个地球。\""
 spec_rival.1.t3n: "收买的舆论攻势败露"
 spec_rival.1.d3n: "#v [SCOPE.sCountry('target').GetName]#!的报纸上满是对我国[concept_spec_exchange]的质疑。但有个职员说漏了嘴，如今人人都知道是谁出钱买的墨水。\n\n我们失去了信誉，他们也一样，而且他们在国外的名声也受损了。"
 spec_rival.1.f3n: "\"暗中抛出的泥巴，照样弄脏双手。\""
 spec_rival.1.t: "竞争者对我们下手了"
 spec_rival.1.f: ""市场挤兑，可能只始于一则谣言。""
 spec_rival.1.a: "以其人之道，还治其人之身。"
 spec_rival.1.a_tt: "我们对其如法炮制，即使我们今年已经这样做过。"
 spec_rival.1.a_1: "对其#v 做空袭击#!："
 spec_rival.1.a_2: "#v 吸引对方资本#!："
 spec_rival.1.a_3: "对其#v 舆论攻势#!："
 spec_rival.1.b: "团结起来对付他们。"
 spec_rival.1.b_tt: "12个月内，其针对我方的行动效果减半。花费@money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]。"
 spec_rival.1.c: "若无其事，照常行事。"
 spec_rival.1.c_tt: "我国[concept_spec_exchange]因沉着应对获得#P [Multiply_CFixedPoint('(CFixedPoint)0.01', Add_CFixedPoint('(CFixedPoint)1', Multiply_CFixedPoint('(CFixedPoint)1', SCOPE.sCountry('target').MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'))))|%0]#!信誉。被我们无视的交易所越大，这一点越有分量。"
 spec_rival.1.d: "趁恐慌入场买进。"
 spec_rival.1.d_tt: "我国银行买下袭击者抛售的东西。袭击造成的[concept_spec_market_confidence]损失#P 减半#!。花费#N @money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rv_counter_cost')|D]#!（我国GDP的#v 1%#!）。"
 spec_rival.1.e: "开出同样的条件。"
 spec_rival.1.e_tt: "我们出钱留住投资者。对方从我国[concept_investment_pool]拿走的#P 减半#!。花费#N @money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rv_counter_cost')|D]#!（我国GDP的#v 1%#!）。"
 spec_rival.1.g: "在我们自己的报纸上回击。"
 spec_rival.1.g_tt: "我们的报纸刊出真实数字。我国[concept_spec_exchange]挽回#P 1%#!信誉。花费#N @money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rv_counter_cost')|D]#!（我国GDP的#v 1%#!）。"
 SPEC_DRIVER_RIVAL: "竞争者行动"
 SPEC_DRIVER_RIVAL_TT: "#header 竞争者行动：[Country.MakeScope.Var('spec_c_rival').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#italic 竞争者对我国市场发动的做空袭击，分六个月展开。#!\n#instruction 无论来多少次，袭击每年最多使我国损失#v 4#!信心。#!"
 spec_rival.1.d11_big: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#!的大交易所终于注意到了我们，而且对所见颇为不满。\n\n开盘钟响之前，代表#v [SCOPE.sCountry('target').GetName]#!的经纪人一下子把大批我国铁路和银行股票抛向交易大厅。价格崩落，行情收报机跟不上，到中午时我们自己的职员也在惊慌抛售。\n\n我国[concept_spec_market_confidence]将在6个月内下降#N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#!。"
 spec_rival.1.d11_even: "多年来，#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#!和#v [ROOT.GetCountry.GetCapital.GetCityHubName]#!的交易所一直相互周旋。这只是时间问题。\n\n开盘钟响之前，代表#v [SCOPE.sCountry('target').GetName]#!的经纪人一下子把大批我国铁路和银行股票抛向交易大厅。价格崩落，行情收报机跟不上，到中午时我们自己的职员也在惊慌抛售。\n\n我国[concept_spec_market_confidence]将在6个月内下降#N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#!。"
