 SPEC_RV_RAID_TT: "#header 做空袭击#!\n$TOOLTIP_DELIMITER$\n#italic 我国经纪人一下子抛售[Country.GetNameNoFormatting]的股票，让其市场崩盘。#!\n$TOOLTIP_DELIMITER$\n#b 如果奏效#!\n[Country.GetNameNoFormatting]的[concept_spec_market_confidence]：#v 6#!个月内#P -[Multiply_CFixedPoint('(CFixedPoint)3', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|0]#!\n较量：向我方#P 10%#!\n\n#b 如果失败#!（#N [Min_CFixedPoint('(CFixedPoint)80', Add_CFixedPoint('(CFixedPoint)20', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint('(CFixedPoint)0', Divide_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, GetPlayer.MakeScope.Var('spec_centre_score').GetValue), Max_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|0]%#!概率）\n我国[concept_spec_market_confidence]：#v 6#!个月内#N -3#!\n较量：向对方#N 10%#!\n$TOOLTIP_DELIMITER$\n花费：从我国[concept_treasury]支出#N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#!\n冷却：对[Country.GetNameNoFormatting]#v 1年#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_raid').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_RAID')]"
 SPEC_RV_WHY_RV_RAID: "\n\n[GetScriptedGui('spec_sgui_rv_raid').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_LURE_TT: "#header 吸引资本#!\n$TOOLTIP_DELIMITER$\n#italic 我国银行家以更优厚的条件招揽[Country.GetNameNoFormatting]的投资者。#!\n$TOOLTIP_DELIMITER$\n[Country.GetNameNoFormatting]的[concept_investment_pool]收入中有#P [Multiply_CFixedPoint('(CFixedPoint)0.05', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|%0]#!在#v 12#!个月内归我们\n较量：向我方#P 10%#!\n$TOOLTIP_DELIMITER$\n花费：#N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_lure_debt_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#!计入我国[concept_spec_outstanding_credit]\n冷却：对[Country.GetNameNoFormatting]#v 1年#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_lure').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_LURE')]"
 SPEC_RV_WHY_RV_LURE: "\n\n[GetScriptedGui('spec_sgui_rv_lure').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_PRESS_TT: "#header 舆论攻势#!\n$TOOLTIP_DELIMITER$\n#italic 友好的报纸连篇累牍地质疑[Country.GetNameNoFormatting]的[concept_spec_exchange]。#!\n$TOOLTIP_DELIMITER$\n#b 如果奏效#!\n[Country.GetNameNoFormatting]的[concept_spec_exchange]信誉：#P -[Multiply_CFixedPoint('(CFixedPoint)0.0167', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|%0]#!\n较量：向我方#P 10%#!\n\n#b 如果被揭穿#!（#N [Country.MakeScope.ScriptValue('spec_rv_press_expose')|0]%#!概率，[Country.GetNameNoFormatting]的新闻越自由，概率越高）\n与[Country.GetNameNoFormatting]的[concept_relations]：#N -20#!\n我国[concept_spec_exchange]信誉：#N -1.7%#!\n较量：向对方#N 10%#!\n$TOOLTIP_DELIMITER$\n花费：#v 12#!个月内[concept_influence]#N -75#! @inf!\n冷却：对[Country.GetNameNoFormatting]#v 1年#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_press').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_PRESS')]"
 SPEC_RV_WHY_RV_PRESS: "\n\n[GetScriptedGui('spec_sgui_rv_press').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_HOLD_TT: "#header 坚守阵线#!\n$TOOLTIP_DELIMITER$\n#italic 我们买回[Country.GetNameNoFormatting]抛售的东西，稳住我方在较量中的阵地。#!\n$TOOLTIP_DELIMITER$\n抵消[Country.GetNameNoFormatting]的一次推动，使较量向我方回拨#P 10%#!\n对方目前对我方的推动：#v [Country.MakeScope.Var('spec_rv_ui_them').GetValue|0]#!\n$TOOLTIP_DELIMITER$\n花费：从我国[concept_treasury]支出#N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#!\n冷却：对[Country.GetNameNoFormatting]#v 1年#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_hold').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_HOLD')]"
