 spec_lever_authority_tt: "有足够的[concept_authority]"
 spec_lever_fits_restrain_tt: "[concept_spec_investor_interest]为#v 追捧#!或更高，或其热潮结束将损失#v 2#!或更多[concept_spec_market_confidence]"
