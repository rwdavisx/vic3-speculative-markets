 notification_spec_tied_panic_name: "[SCOPE.sC('spec_note_src').GetName]爆发恐慌"
 notification_spec_tied_panic_desc: "[SCOPE.sC('spec_note_src').GetName]爆发了[concept_spec_financial_panic]，我们与他们的联系把[concept_spec_foreign_panic]带进了我们自己的市场。"
 notification_spec_tied_panic_tooltip: "#header $notification_spec_tied_panic_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_tied_panic_desc$"
 notification_spec_tied_mania_name: "投机狂热席卷[SCOPE.sC('spec_note_src').GetName]"
 notification_spec_tied_mania_desc: "[SCOPE.sC('spec_note_src').GetName]的投资者已陷入[concept_spec_speculative_mania]。如果它以[concept_spec_financial_panic]告终，我们与他们的联系将拖累我们自己的[concept_spec_market_confidence]。"
 notification_spec_tied_mania_tooltip: "#header $notification_spec_tied_mania_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_tied_mania_desc$"
 notification_spec_feverish_name: "[SCOPE.sGoods('spec_note_good').GetName]投资过热"
 notification_spec_feverish_desc: "[SCOPE.sGoods('spec_note_good').GetName]的[concept_spec_investor_interest]已达到#v 过热#!。如果热潮仍这么大时一路跌到#v 逃离#!，热潮将以[concept_spec_collapse]告终，[concept_spec_market_confidence]会急剧下降。热潮降温时会缓慢缩小，因此平稳降温能让它终结得更温和，而抑制投机会让它慢慢消退，成为一次温和的回调。"
 notification_spec_feverish_tooltip: "#header $notification_spec_feverish_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_feverish_desc$"
 notification_spec_near_panic_name: "信心濒临恐慌"
 notification_spec_near_panic_desc: "@spec_market_confidence! [concept_spec_market_confidence]已跌至#v [GetPlayer.MakeScope.Var('spec_conf').GetValue|0]#!。低于#v $SPEC_PANIC_AT$#!时将爆发[concept_spec_financial_panic]。"
 notification_spec_near_panic_tooltip: "#header $notification_spec_near_panic_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_near_panic_desc$"
 notification_spec_nearly_broke_name: "国库吃紧"
 notification_spec_nearly_broke_desc: "按当前赤字，我们将在#v [GetPlayer.MakeScope.ScriptValue('spec_broke_weeks')|0]#!周后[concept_bankruptcy]。[concept_spec_market_confidence]会持续下滑，直到预算好转。"
 notification_spec_nearly_broke_tooltip: "#header $notification_spec_nearly_broke_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_nearly_broke_desc$"
 notification_spec_panic_over_name: "恐慌平息"
 notification_spec_panic_over_desc: "[concept_spec_financial_panic]已经结束。其惩罚和$spec_panic_relief$支出均已停止。它留下的[concept_spec_bad_debts]仍会拖慢生产和投资，直到消退。"
 notification_spec_panic_over_tooltip: "#header $notification_spec_panic_over_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_panic_over_desc$"
 notification_spec_bubble_burst_name: "泡沫破裂"
 notification_spec_bubble_burst_desc: "@spec_market_confidence! [concept_spec_market_confidence]已跌得太低，无法维持我国的[concept_spec_speculative_excess]。泡沫已经破裂，$concept_spec_market_confidence$进一步下跌。"
 notification_spec_bubble_burst_tooltip: "#header $notification_spec_bubble_burst_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_bubble_burst_desc$"
 notification_spec_lev_unsafe_name: "杠杆超出安全上限"
 notification_spec_lev_unsafe_desc: "@spec_leverage! [concept_spec_leverage]已超过#v 3#!个月，即安全上限。此后，[concept_spec_financial_panic]会在更高的[concept_spec_market_confidence]下爆发，并留下[concept_spec_bad_debts]。"
 notification_spec_lev_unsafe_tooltip: "#header $notification_spec_lev_unsafe_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_lev_unsafe_desc$"
 notification_spec_boom_end_1_name: "[SCOPE.sGoods('spec_note_good').GetName]热潮以回调告终"
 notification_spec_boom_end_1_desc: "[SCOPE.sGoods('spec_note_good').GetName]的热潮以[concept_spec_correction]告终。[concept_spec_market_confidence]下降，其产业是为未能持续的价格而建，现处于#v 恢复中#!：投资者将在约#v 3#!个月内对其敬而远之。$SPEC_NOTE_BANKS$"
 notification_spec_boom_end_1_tooltip: "#header $notification_spec_boom_end_1_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_boom_end_1_desc$"
