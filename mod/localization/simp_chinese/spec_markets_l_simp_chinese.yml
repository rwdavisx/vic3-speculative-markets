 SPEC_RV_SCORE_BODY: "#b 是什么在拉动力度条#!\n[concept_spec_exchange]得分，#v [GetPlayer.MakeScope.Var('spec_centre_score').GetValue|0]#!对#v [Country.MakeScope.Var('spec_centre_score').GetValue|0]#!：[Divide_CFixedPoint(Subtract_CFixedPoint(Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1')), Multiply_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Country.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'))), Max_CFixedPoint(Max_CFixedPoint(Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1')), Multiply_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Country.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'))), '(CFixedPoint)1'))|+=%0][AddLocalizationIf(LessThan_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)0.99'), 'SPEC_RV_THIN_US')][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)0.99'), 'SPEC_RV_THIN_THEM')]\n我方推动，#v [Country.MakeScope.Var('spec_rv_ui_us').GetValue|0]#!次：[Multiply_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_us').GetValue, '(CFixedPoint)0.1')|+=%0]\n对方推动，#v [Country.MakeScope.Var('spec_rv_ui_them').GetValue|0]#!次：[Multiply_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_them').GetValue, '(CFixedPoint)-0.1')|+=%0]\n我方[concept_spec_blue_chip]，#v [GetPlayer.MakeScope.Var('spec_bc_n').GetValueWithDefault('(CFixedPoint)0')|0]#!家：[Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.03')|+=%0]\n对方[concept_spec_blue_chip]，#v [Country.MakeScope.Var('spec_bc_n').GetValueWithDefault('(CFixedPoint)0')|0]#!家：[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)-0.03')|+=%0]\n\n#weak 每次奏效的行动推动