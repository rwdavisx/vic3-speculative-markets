 concept_spec_banking_reforms_desc: "@spec_banking_reforms! #italic 一个[concept_country]的银行和公司所遵循的规则。每项改革都会改变热潮和恐慌的走向。#!\n\n每项改革随一项科技解锁。调查委员会每次颁行一项改革。它可在[concept_spec_financial_panic]之后召开，或在连续#v 10#!个平静年份没有恐慌后召开。\n\n#bold 银行券规则#!（[GetTechnology('banking').GetName]），二选一：\n#bold 通货学派#!\n$spec_reform_currency_tt$\n#bold 自由银行制#!\n$spec_reform_free_tt$\n\n#bold 最后贷款人#!（[GetTechnology('central_banking').GetName]）\n$spec_reform_llr_tt$\n\n#bold 公司法#!（[GetTechnology('joint_stock_companies').GetName]）\n$spec_reform_company_tt$\n\n颁行全部三项即可获得[concept_spec_sound_finance]。"
