 spec_rival.1.d3n_big: "#v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#!的大交易所终于注意到了我们，而且对所见颇为不满。\n\n#v [SCOPE.sCountry('target').GetName]#!的报纸上满是对我国[concept_spec_exchange]的质疑。但有个职员说漏了嘴，如今人人都知道是谁出钱买的墨水。\n\n我们失去了信誉，他们也一样，而且他们在国外的名声也受损了。"
