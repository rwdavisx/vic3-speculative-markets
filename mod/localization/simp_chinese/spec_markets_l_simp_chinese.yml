 concept_spec_speculative_excess_desc: "@spec_speculative_excess! #italic 这是一个[concept_country]的[concept_market]中的泡沫。热潮过热的时间越长，泡沫越大。#!\n\n在[GetTechnology('stock_exchange').GetName]之前不会形成泡沫。\n[concept_spec_market_confidence]处于#v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!或以上的每个月#P 增长#!，信心攀得越高，增长越快\n介于#v 60#!与#v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!之间时#v 缓慢缩小#!\n跌破#v 60#!时#N 破裂#!\n\n破裂时，$concept_spec_market_confidence$会进一步下跌，最多#N [GetPlayer.MakeScope.ScriptValue('spec_burst_max')|0]#!。泡沫越大，摔得越重。"
