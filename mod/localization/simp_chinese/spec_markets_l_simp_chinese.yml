 concept_spec_market_confidence: "市场信心"
 concept_spec_market_confidence_desc: "@spec_market_confidence! #italic 投资者如何看待你的[concept_country]的[concept_market]，从#v 0#!（#v 恐慌#!）到#v 100#!（#v 狂热#!）。#!\n\n恐惧会#N 减缓投资#!，并使[concept_loans]成本更高\n贪婪会#P 加快投资#!\n\n热潮中的[Concept('concept_good','$concept_goods|q$')]使其#P 上升#!\n[Concept('concept_spec_boom_end','$concept_spec_boom_ends|q$')]、[Concept('concept_spec_foreign_panic','$concept_spec_foreign_panics|q$')]、[Concept('concept_diplomatic_play','$concept_diplomatic_plays|q$')]和[concept_war]使其#N 下降#!\n$building_financial_district$在经济中占比越大，热潮及其终结越剧烈；$building_manor_house$的数量超过他们时则越弱\n\n高于#v 55#!时银行向[concept_investment_pool]放贷\n达到#v 80#!或以上时出现[concept_spec_speculative_mania]\n低于#v 25#!时爆发[concept_spec_financial_panic]\n高[concept_spec_leverage]会抬高这条线\n$building_financial_district$较少时会使其略微降低"
 concept_spec_speculative_mania: "投机狂热"
 concept_spec_speculative_mania_desc: "@spec_speculative_mania! #italic 你的[concept_market]已陷入贪婪的狂热。#!\n\n在[concept_spec_market_confidence]处于#v 80#!或以上时持续\n银行向[concept_investment_pool]#P 放贷最为宽松#!\n每次[concept_spec_boom_end]都会#N 损失更多#!$concept_spec_market_confidence$\n\n持续很久或程度很高的狂热，会在此后数年帮助支持[GetLawType('law_laissez_faire').GetName]的[Concept('concept_political_movement','$concept_political_movements|q$')]"
 concept_spec_financial_panic: "金融恐慌"
 concept_spec_financial_panics: "金融恐慌"
 concept_spec_financial_panic_desc: "@spec_financial_panic! #italic 一场崩溃：投资者纷纷逃离，银行抽回资金。#!\n\n当你的[concept_spec_market_confidence]跌破#v 25#!时爆发。[concept_spec_leverage]超过#v 3#!个月后，这条线会上升，最高达#v 65#!。$building_financial_district$较少时它会下降，最低为#v 20#!。\n\n持续期间：\n所有建筑的[concept_throughput]#N 降低#!，征收的税款减少\n每周#N 消耗#![concept_treasury]救济失业者\n[concept_private_construction]和投资#N 放缓#!\n[Concept('concept_company','$concept_companies|q$')]的$concept_throughput$加成#N 减少#!\n#N 部分投资者转为#![Concept('concept_radical','$concept_radicals|q$')]\n#N 银行撤回#![concept_investment_pool]中的[concept_spec_outstanding_credit]\n\n它会以[concept_spec_foreign_panic]的形式蔓延到每个有联系的[concept_country]，资金则外逃至平静的[Concept('concept_great_power','$concept_great_powers|q$')]\n此后数年，反对[GetLawType('law_laissez_faire').GetName]的[Concept('concept_political_movement','$concept_political_movements|q$')]会获得支持"
 concept_spec_foreign_panic: "外来恐慌"
 concept_spec_foreign_panics: "外来恐慌"
 concept_spec_foreign_panic_desc: "@spec_foreign_panic! #italic 国外的恐慌蔓延到你的市场。#!\n\n当与你有联系的[concept_country]爆发[concept_spec_financial_panic]时，你的[concept_spec_market_confidence]会#N 下降#!\n国家之间通过共同的[concept_market]、附属关系、投资权、大量贸易或拥有你的部分经济而相互联系\n#N 联系越紧密，降幅越大#!\n\n[GetLawType('law_free_trade').GetName]会加强贸易联系\n其他贸易政策则会削弱它\n[concept_embargo]会切断贸易联系"
 concept_spec_boom_end: "热潮终结"
 concept_spec_boom_ends: "热潮终结"
 concept_spec_boom_end_desc: "@spec_boom_end! #italic 涨上去的总会跌下来。当一种[concept_good]的[concept_spec_investor_interest]在上升后回落时，热潮便告终结。#!\n\n涨得越高，跌得越狠：\n峰值为#v 看好#!：[concept_spec_correction]\n峰值为#v 追捧#!：[concept_spec_bust]\n峰值为#v 过热#!：[concept_spec_collapse]\n\n#N 降低#!你的[concept_spec_market_confidence]，热潮越大、该$concept_goods$在[concept_market]贸易中所占份额越大，降幅越大\n之后在该$concept_good$恢复期间，投资者会持观望态度\n如果有[concept_company]生产它，该行业会#N 损失#![concept_throughput]\n\n#instruction 峰值每月略有回落。缓慢降温的热潮终结得更温和，甚至完全不会出现$concept_spec_boom_end$。#!"
 concept_spec_correction: "回调"
 concept_spec_correction_desc: "@spec_correction! #italic $concept_spec_correction$是最温和的[concept_spec_boom_end]。#!\n\n当峰值为#v 看好#!的[concept_good]的[concept_spec_investor_interest]回落到#v 疑虑#!时发生\n\n#N 略微降低#![concept_spec_market_confidence]\n投资者对该$concept_good$观望#v 3#!个月\n如果有[concept_company]生产它，该行业损失#N 2.5%#![concept_throughput]，持续#v 90#!天；每研究[GetTechnology('corporate_charters').GetName]和[GetTechnology('corporate_management').GetName]中的一项，再多损失#N 25%#!"
 concept_spec_bust: "暴跌"
 concept_spec_bust_desc: "@spec_bust! #italic $concept_spec_bust$是比[concept_spec_correction]更严重的[concept_spec_boom_end]。#!\n\n当峰值为#v 追捧#!的[concept_good]的[concept_spec_investor_interest]回落到#v 疑虑#!时发生\n\n#N 降低#![concept_spec_market_confidence]更多，约为同一热潮下$concept_spec_correction$的#v 2#!倍\n投资者对该$concept_good$观望#v 6#!个月\n如果有[concept_company]生产它，该行业损失#N 5%#![concept_throughput]，持续#v 180#!天；每研究[GetTechnology('corporate_charters').GetName]和[GetTechnology('corporate_management').GetName]中的一项，再多损失#N 25%#!"
 concept_spec_collapse: "崩盘"
 concept_spec_collapse_desc: "@spec_collapse! #italic $concept_spec_collapse$是最严重的[concept_spec_boom_end]。#!\n\n当峰值为#v 过热#!的[concept_good]的[concept_spec_investor_interest]一路跌到#v 逃离#!时发生\n\n#N 大幅降低#![concept_spec_market_confidence]，约为同一热潮下[concept_spec_correction]的#v 5#!倍\n投资者对该$concept_good$观望#v 12#!个月\n如果有[concept_company]生产它，该行业损失#N 10%#![concept_throughput]，持续一年；每研究[GetTechnology('corporate_charters').GetName]和[GetTechnology('corporate_management').GetName]中的一项，再多损失#N 25%#!\n\n最糟糕的是，在[concept_market]贸易中占比很大的$concept_spec_collapse$可能引发[concept_spec_financial_panic]"
 concept_spec_investor_interest: "投资热度"
 concept_spec_investor_interest_desc: "@spec_investor_interest! #italic 投资者对生产某种[concept_good]的[Concept('concept_building','$concept_buildings|q$')]有多热衷，从#v 逃离#!到#v 过热#!。#!\n\n[concept_market_price]高于长期均值时#P 上升#!\n低于时#N 下降#!\n\n这些建筑的[concept_throughput]随之变化，从#v 逃离#!时的#N -10%#!到#v 过热#!时的#P +8%#!\n生产该$concept_good$的[Concept('concept_company','$concept_companies|q$')]的[concept_prosperity]也随之变化\n热潮中的$concept_good$会提升[concept_spec_market_confidence]\n当热度回落时，热潮会以[concept_spec_boom_end]告终"
 concept_spec_credit_policy: "信贷政策"
 concept_spec_credit_policy_tight: "紧缩信贷"
 concept_spec_credit_policy_normal: "常规信贷"
 concept_spec_credit_policy_loose: "宽松信贷"
 concept_spec_credit_policy_desc: "@spec_credit_policy! #italic 银行向[concept_investment_pool]放贷的宽松程度。#!\n\n由[GetTechnology('central_banking').GetName]解锁\n可设为$concept_spec_credit_policy_tight$、$concept_spec_credit_policy_normal$或$concept_spec_credit_policy_loose$\n\n#v 收紧#!信贷会减缓投资，并在[concept_spec_market_confidence]过高时将其拉低\n#v 放宽#!信贷会增加[concept_spec_outstanding_credit]\n\n更改后将锁定#v 6#!个月"
 concept_spec_leverage: "信贷杠杆"
 concept_spec_leverage_desc: "@spec_leverage! #italic 你的银行放贷了多少。即你的[concept_spec_outstanding_credit]，以[concept_investment_pool]收入的月数计算。#!\n\n每满一个月提供#P +2%#![concept_throughput]，最多#P +24%#!\n在[concept_spec_financial_panic]期间以及[concept_spec_bad_debts]存续期间，该加成会消退\n\n超过#v 3#!个月后会变得危险：\n#N $concept_spec_financial_panic$更早爆发#!，即在更高的[concept_spec_market_confidence]下爆发\n#N 留下$concept_spec_bad_debts$#!"
 concept_spec_bad_debts: "坏账"
 concept_spec_bad_debts_desc: "@spec_bad_debts! #italic [concept_spec_financial_panic]在你的银行账面上留下的损失。#!\n\n随[concept_spec_leverage]超出#v 3#!个月的部分而增加\n\n每一点：#N -0.4%#![concept_throughput]，#N -0.75%#!投资\n先累积数月，然后缓慢减少\n最严重时约需#v 6#!年才能清除\n坏账存续期间#N 银行不会放贷#!\n\n#v 向银行放贷#!无法清除坏账\n#v 收购不良贷款#!可将其减半，在坏账存续期间限一次"
 concept_spec_lending_standards: "放贷标准"
 concept_spec_lending_standards_desc: "@spec_lending_standards! #italic 你的[concept_country]的银行放贷有多谨慎。可以是#v 严格#!、#v 审慎#!、#v 稳健#!、#v 松懈#!或#v 鲁莽#!。#!\n\n越松懈的银行向[concept_investment_pool]放贷越多，投入热潮的也越多\n#N 因此热潮终结得更猛烈#!，银行救助的成本也更高\n\n没有[concept_spec_financial_panic]的每个月#N 略微放松#!，在约#v 20#!个平静年份内从#v 严格#!变为#v 鲁莽#!\n每次银行救助或#v 收购不良贷款#!之后#N 进一步放松#!\n热潮终结时#P 收紧#!，尤其是$concept_spec_financial_panic$在没有银行救助的情况下结束时"
 concept_spec_blue_chip: "蓝筹股"
 concept_spec_blue_chips: "蓝筹股"
 concept_spec_blue_chip_desc: "@spec_blue_chip! #italic 连续#v 12#!个月保持#v 70#!或以上[concept_prosperity]的明星[concept_company]。#!\n\n每个使我国[concept_spec_company_strength]增加#v 2#!\n#b 每个#! #grey （前5个全额生效，之后5个效果减半）#!\n因崩盘和恐慌而损失的[concept_spec_market_confidence]：#P -4%#!\n[concept_spec_exchange]信誉：每年#P +0.4%#!（以满条计）\n[concept_spec_exchange]竞争：对我方有利#P +3%#!\n资本家对[concept_investment_pool]的贡献：#P +0.6%#!\n贷款利息：#P -1%#!\n\n#b 失去蓝筹股时#!\n[concept_prosperity]连续#v 3#!个月低于#v 70#!时失去\n[concept_spec_exchange]信誉：#N -1.7%#!（以满条计）\n[concept_spec_market_confidence]：#N -3#!\n遭到做空袭击的蓝筹股会在一年内变得#N 脆弱#!。期间[concept_prosperity]只要有一个月低于#v 70#!就会失去地位，而非#v 3#!\n\n#b 年度公司#!\n如果我国的蓝筹股是世界上最繁荣的，[concept_spec_exchange]信誉#P +2.5%#!（以满条计），一年内[concept_prestige]#P +5%#!\n\n连续#v 3#!个月低于#v 70#!即#N 失去#!，之后重新计算#v 12#!个月\n只要有一个月低于标准，晋升进度就会重置\n离开市场经济的[concept_country]不保留任何蓝筹股"
 concept_spec_company_strength: "公司实力"
 concept_spec_company_strength_desc: "@spec_company_strength! #italic 一个[concept_country]的[Concept('concept_company','$concept_companies|q$')]整体有多强。#!\n\n每家公司增加其[concept_prosperity]除以#v 20#!的值，因此繁荣度为#v 100#!的公司增加#v 5#!\n每个[concept_spec_blue_chip]再增加#v 2#!\n最强者赢得大公司之家的荣誉"
 concept_spec_outstanding_credit: "未偿信贷"
 concept_spec_outstanding_credit_desc: "@spec_outstanding_credit! #italic 银行已贷入[concept_investment_pool]但尚未收回的资金。#!\n\n[concept_spec_market_confidence]高于#v 55#!时银行放贷\n达到资金池#v 3#!个月收入的放贷上限后停止\n[GetTechnology('central_banking').GetName]增加#v 5#!个月\n[GetTechnology('investment_banks').GetName]和[GetTechnology('international_exchange_standards').GetName]各增加#v 2#!个月\n\n每月从资金池偿还一小部分\n[concept_spec_financial_panic]爆发时，银行会#N 撤回其中一部分#!\n\n#lore 19世纪40年代，银行以铁路股票为抵押放贷，1837年以棉花为抵押，1873年以维也纳的建筑用地为抵押，结果在这些热潮破灭时深陷其中。#!"
