 SPEC_DRIVER_RESTRAIN_TT: "#header 受抑制的热潮：[Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n本月缓慢降温的热潮：[Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0')|+=2]\n[concept_spec_market_conditions]：#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#!\n$TOOLTIP_DELIMITER$\n受抑制的热潮会以[concept_spec_correction]的方式缓慢降温，而不是一次崩落。每月需付出少许代价。"
 SPEC_DRIVER_CAUTION_TT: "#header 政府与事件：[Country.MakeScope.Var('spec_c_caution').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n本月因我们的决策和市场事件而产生的一次性变化。"
 SPEC_DRIVER_LIMIT_TT: "#header 下限与上限：[Country.MakeScope.Var('spec_c_limit').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_market_confidence]不能低于#v 0#!或高于#v 100#!，因此本月变化中有这么多未被计入。"
 SPEC_DRIVER_RESCUE_TT: "#header 银行救助：[Country.MakeScope.Var('spec_c_rescue').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n来自#v 向银行放贷#!或#v 暂停实施银行法#!的一次性提升。它不能使[concept_spec_market_confidence]超过#v 100#!。"
 SPEC_DRIVER_RESCUE: "银行纾困"
 SPEC_DRIVER_WAREND: "战争结束"
 SPEC_DRIVER_WAREND_TT: "#header 战争结束：[Country.MakeScope.Var('spec_c_warend').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n我国[concept_casualties]：完整效果的#v x[Country.MakeScope.Var('spec_war_stakes_now').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n按战争结局计算的完整效果：\n获胜且强制执行了[concept_war_goal]：#P +4#!\n获胜但未强制执行任何目标：#P +1#!\n战败且被强制执行了[concept_war_goal]：#N -8#!\n战败但未被强制执行任何目标：#N -2#!\n双方均未获胜：#N -1#!\n\n按我国损失调整：至少为效果的#v 25%#!，当战争损失我国#v 25%#!的兵力时达到全部效果。"
 SPEC_DRIVER_BURST: "泡沫破裂"
 SPEC_DRIVER_BURST_TT: "#header 泡沫破裂：[Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_speculative_excess]：#v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0'), Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_burst_per_heat'), '(CFixedPoint)-1'))|0]#!\n每点#N -[Country.MakeScope.ScriptValue('spec_burst_per_heat')|2]#!\n上限#N -[Country.MakeScope.ScriptValue('spec_burst_max')|0]#!\n$TOOLTIP_DELIMITER$\n一轮热潮将[concept_spec_market_confidence]推高至#v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#!以上后，一旦信心跌破#v 60#!，泡沫就会破裂。热潮持续越久、涨得越高，损失越大。\n\n只有拥有[GetTechnology('stock_exchange').GetName]的国家才会产生泡沫。"
 SPEC_DRIVER_CAUTION: "政府与事件"
 SPEC_DRIVER_RESTRAIN: "受抑热潮"
 SPEC_DRIVER_LIMIT: "下限与上限"
 SPEC_DRIVER_BOOM: "热潮商品"
 SPEC_DRIVER_BOOM_TT: "#header 热潮商品：[Country.MakeScope.Var('spec_c_boom').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#v [Country.MakeScope.Var('spec_n_boom').GetValueWithDefault('(CFixedPoint)0')|0]#!种处于热潮的[Concept('concept_good','$concept_goods|q$')]：[Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0')|+=2][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_BOOM_CAP')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_steady'), '(CFixedPoint)1')), 'SPEC_BOOM_STEADY')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_fin_boom'), '(CFixedPoint)1')), 'SPEC_BOOM_FIN')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_boom_rule'), '(CFixedPoint)1')), 'SPEC_BOOM_RULE')]\n$TOOLTIP_DELIMITER$\n每个热潮按其在[concept_market]中的份额提升[concept_spec_market_confidence]。[concept_spec_financial_panic]期间无效。[GetTechnology('stock_exchange').GetName]和[GetTechnology('investment_banks').GetName]使热潮更大，[GetTechnology('modern_financial_instruments').GetName]亦然。"
 SPEC_BOOM_CAP: "\n乘数计算前上限为#v +3#!"
 SPEC_BOOM_STEADY: "\n庄园宅邸：#v x[Country.MakeScope.ScriptValue('spec_steady')|2]#!"
 SPEC_BOOM_FIN: "\n金融科技：#v x[Country.MakeScope.ScriptValue('spec_fin_boom')|2]#!"
 SPEC_BOOM_RULE: "\n市场波动：#v x[Country.MakeScope.ScriptValue('spec_boom_rule')|2]#!"
 SPEC_DRIVER_CRASH: "已终结热潮"
 SPEC_DRIVER_CRASH_TT: "#header 已终结热潮：[Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n最近一个月最大的：#v [Country.MakeScope.Var('spec_crashed').GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\n已终结热潮的规模：[Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0')|+=2]\n[concept_spec_market_conditions]：#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#![AddLocalizationIf(Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-40')), 'SPEC_CRASH_CAP')]\n$TOOLTIP_DELIMITER$\n每次[concept_spec_boom_end]都会降低[concept_spec_market_confidence]。热潮越大、其在[concept_market]中的份额越大，损失就越大。[GetTechnology('mutual_funds').GetName]会减轻损失；[GetTechnology('modern_financial_instruments').GetName]会加重损失。"
 SPEC_CRASH_CAP: "\n每月最多#N -40#!"
 SPEC_DRIVER_FOREIGN: "外来恐慌"
