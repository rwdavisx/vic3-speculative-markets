 concept_spec_market_confidence: "市场信心"
 concept_spec_market_confidence_desc: "$concept_spec_market_confidence$衡量投资者如何看待一个[concept_country]的[concept_market]，范围从#v 0#!（#v 恐慌#!）到#v 100#!（#v 狂热#!）。恐惧会减缓投资并提高[concept_loans]的利息，而贪婪会加快投资。\n\n热潮中的[Concept('concept_good','$concept_goods|q$')]会提升它，而[Concept('concept_spec_boom_end','$concept_spec_boom_ends|q$')]、[Concept('concept_spec_foreign_panic','$concept_spec_foreign_panics|q$')]、[Concept('concept_diplomatic_play','$concept_diplomatic_plays|q$')]和[concept_war]会降低它。$building_financial_district$在经济中占比越大，热潮及其终结越剧烈；$building_manor_house$的数量超过他们时则越弱。\n\n高于#v 55#!时银行向[concept_investment_pool]放贷，达到#v 80#!时市场进入[concept_spec_speculative_mania]，低于#v 25#!时爆发[concept_spec_financial_panic]。"
 concept_spec_speculative_mania: "投机狂热"
 concept_spec_speculative_mania_desc: "当[concept_spec_market_confidence]处于#v 80#!或以上时，[concept_market]就处于$concept_spec_speculative_mania$。银行向[concept_investment_pool]放贷最多，但[concept_spec_boom_end]会损失更多$concept_spec_market_confidence$。持续很久或程度很高的狂热，会使支持[GetLawType('law_laissez_faire').GetName]的[Concept('concept_political_movement','$concept_political_movements|q$')]在此后数年获得更多支持。"
 concept_spec_financial_panic: "金融恐慌"
 concept_spec_financial_panics: "金融恐慌"
 concept_spec_financial_panic_desc: "当[concept_spec_market_confidence]跌破#v 25#!的恐慌门槛时，便会爆发$concept_spec_financial_panic$。[concept_spec_leverage]超过#v 3#!个月后，门槛会上升，最高达#v 65#!。$building_financial_district$较少时门槛较低，最低为#v 20#!。\n\n恐慌会削减所有建筑的[concept_throughput]和征收的税款，在结束前每周让[concept_treasury]负担失业救济，减缓[concept_private_construction]和投资，降低[Concept('concept_company','$concept_companies|q$')]的[concept_throughput]加成，使部分投资者成为[Concept('concept_radical','$concept_radicals|q$')]，并使银行从[concept_investment_pool]撤回[concept_spec_outstanding_credit]。\n\n每个有联系的[concept_country]都会遭受[concept_spec_foreign_panic]，而资金则会外逃至其他地方平静的[Concept('concept_great_power','$concept_great_powers|q$')]。此后数年，反对[GetLawType('law_laissez_faire').GetName]的[Concept('concept_political_movement','$concept_political_movements|q$')]会获得支持。"
 concept_spec_foreign_panic: "外来恐慌"
 concept_spec_foreign_panics: "外来恐慌"
 concept_spec_foreign_panic_desc: "当通过共同[concept_market]、附属关系、投资权、大量贸易或经济所有权相联系的国家爆发[concept_spec_financial_panic]时，$concept_spec_foreign_panic$会降低[concept_country]的[concept_spec_market_confidence]。联系越紧密，损失越大。[GetLawType('law_free_trade').GetName]加强贸易联系，其他贸易政策则削弱贸易联系。[concept_embargo]切断贸易联系。"
 concept_spec_boom_end: "热潮终结"
 concept_spec_boom_ends: "热潮终结"
 concept_spec_boom_end_desc: "当一种[concept_good]的[concept_spec_investor_interest]在上升后回落时，热潮便告终结，涨得越高，跌得越狠：峰值为#v 看好#!的热潮以[concept_spec_correction]告终，峰值为#v 追捧#!的以[concept_spec_bust]告终，峰值为#v 过热#!的以[concept_spec_collapse]告终。\n\n每次终结都会降低[concept_spec_market_confidence]，热潮越大、[Concept('concept_good','$concept_goods|q$')]在[concept_market]贸易中所占份额越大，降幅越大。之后在该$concept_good$恢复期间投资者会持观望态度，生产它的[concept_company]所在行业会损失[concept_throughput]。衡量所用的峰值每月略有回落，因此缓慢降温的热潮终结得更温和，甚至完全不会出现$concept_spec_boom_end$。"
 concept_spec_correction: "回调"
 concept_spec_correction_desc: "$concept_spec_correction$是最温和的[concept_spec_boom_end]。当峰值为#v 看好#!的[concept_good]的[concept_spec_investor_interest]回落到#v 疑虑#!时发生。\n\n它使[concept_spec_market_confidence]略微下降。投资者随后对该$concept_good$观望#v 3#!个月，在有[concept_company]生产该商品的地方，其产业损失#N 2.5%#![concept_throughput]，持续#v 90#!天；每研究[GetTechnology('corporate_charters').GetName]和[GetTechnology('corporate_management').GetName]中的一项，再多损失#N 25%#!。"
 concept_spec_bust: "暴跌"
 concept_spec_bust_desc: "$concept_spec_bust$是比[concept_spec_correction]更严重的[concept_spec_boom_end]。当峰值为#v 追捧#!的[concept_good]的[concept_spec_investor_interest]回落到#v 疑虑#!时发生。\n\n它使[concept_spec_market_confidence]下降更多，对同一热潮约为[concept_spec_correction]的#v 2#!倍。投资者随后对该$concept_good$观望#v 6#!个月，在有[concept_company]生产该商品的地方，其产业损失#N 5%#![concept_throughput]，持续#v 180#!天；每研究[GetTechnology('corporate_charters').GetName]和[GetTechnology('corporate_management').GetName]中的一项，再多损失#N 25%#!。"
 concept_spec_collapse: "崩盘"
 concept_spec_collapse_desc: "$concept_spec_collapse$是最严重的[concept_spec_boom_end]。当峰值为#v 过热#!的[concept_good]的[concept_spec_investor_interest]一路跌到#v 逃离#!时发生。\n\n它使[concept_spec_market_confidence]急剧下降，对同一热潮约为[concept_spec_correction]的#v 5#!倍。投资者随后对该$concept_good$观望#v 12#!个月，在有[concept_company]生产该商品的地方，其产业损失#N 10%#![concept_throughput]，持续一年；每研究[GetTechnology('corporate_charters').GetName]和[GetTechnology('corporate_management').GetName]中的一项，再多损失#N 25%#!。在[concept_market]贸易中占比很大的$concept_spec_collapse$可能将其推入[concept_spec_financial_panic]。"
 concept_spec_investor_interest: "投资热度"
 concept_spec_investor_interest_desc: "$concept_spec_investor_interest$是投资者对生产某种[concept_good]的[Concept('concept_building','$concept_buildings|q$')]的看好程度。[concept_market_price]高于长期均值时它会上升，低于时会下降，范围从#v 逃离#!到#v 过热#!。\n\n这些建筑的[concept_throughput]随之变化，从#v 逃离#!时的#N -10%#!到#v 过热#!时的#P +8%#!，生产该$concept_good$的[Concept('concept_company','$concept_companies|q$')]的[concept_prosperity]也随之变化。热潮中的$concept_good$会提升[concept_spec_market_confidence]。当热度回落时，热潮会以[concept_spec_boom_end]告终。"
 concept_spec_credit_policy: "信贷政策"
 concept_spec_credit_policy_tight: "紧缩信贷"
 concept_spec_credit_policy_normal: "常规信贷"
 concept_spec_credit_policy_loose: "宽松信贷"
 concept_spec_credit_policy_desc: "$concept_spec_credit_policy$决定银行向[concept_investment_pool]放贷的宽松程度。它需要[GetTechnology('central_banking').GetName]，可设为$concept_spec_credit_policy_tight$、$concept_spec_credit_policy_normal$或$concept_spec_credit_policy_loose$。收紧信贷会减缓投资，并在[concept_spec_market_confidence]过高时将其拉低；放宽信贷则会增加[concept_spec_outstanding_credit]。更改后将锁定#v 6#!个月。"
 concept_spec_leverage: "信贷杠杆"
 concept_spec_leverage_desc: "$concept_spec_leverage$是一个[concept_country]的[concept_spec_outstanding_credit]，以[concept_investment_pool]收入的月数衡量。\n\n每满一个月提供#P +2%#![concept_throughput]，最多#P +24%#!。在[concept_spec_financial_panic]期间或[concept_spec_bad_debts]存续期间，它每月消退#N 2%#!。超过#v 3#!个月后，[concept_spec_financial_panic]会在更高的[concept_spec_market_confidence]下爆发，并留下[concept_spec_bad_debts]。"
 concept_spec_bad_debts: "坏账"
 concept_spec_bad_debts_desc: "$concept_spec_bad_debts$是[concept_spec_financial_panic]留下的损失，随[concept_spec_leverage]超出#v 3#!个月的部分而增加。\n\n每一点使[concept_throughput]降低#N 0.4%#!，投资降低#N 0.75%#!。坏账每月累积#v 3#!点，随后每月减少#v 0.6#!点，最严重时约需#v 6#!年才能清除。坏账存续期间银行不会放贷。#v 向银行放贷#!无法清除坏账。#v 收购不良贷款#!可将其减半，在坏账存续期间限一次。"
 concept_spec_lending_standards: "放贷标准"
 concept_spec_lending_standards_desc: "$concept_spec_lending_standards$是一个[concept_country]的银行放贷的谨慎程度：#v 严格#!、#v 审慎#!、#v 稳健#!、#v 松懈#!或#v 鲁莽#!。越松懈的银行向[concept_investment_pool]放贷越多，贷入热潮的比例也越高，因此这些热潮终结得更猛烈，银行救助的成本也更高。\n\n每个没有[concept_spec_financial_panic]的月份，放贷标准都会略微放松，在约#v 20#!个平静年份内从#v 严格#!降至#v 鲁莽#!，每次银行救助或#v 收购不良贷款#!之后放松得更多。热潮终结时放贷标准会收紧，尤其是$concept_spec_financial_panic$在没有银行救助的情况下自然结束时。"
 concept_spec_outstanding_credit: "未偿信贷"
 concept_spec_outstanding_credit_desc: "$concept_spec_outstanding_credit$是银行已贷入[concept_investment_pool]但尚未收回的信贷。只要[concept_spec_market_confidence]高于#v 55#!，银行就会放贷，最高达资金池#v 3#!个月收入的放贷上限。[GetTechnology('central_banking').GetName]增加#v 5#!个月，[GetTechnology('investment_banks').GetName]和[GetTechnology('international_exchange_standards').GetName]各增加#v 2#!个月。\n\n每月有#v 2%#!从资金池中偿还。[concept_spec_financial_panic]爆发时，其中一部分会被撤回。\n\n#lore 19世纪40年代，银行以铁路股票为抵押放贷，1837年以棉花为抵押，1873年以维也纳的建筑用地为抵押，结果在这些热潮破灭时深陷其中。#!"
