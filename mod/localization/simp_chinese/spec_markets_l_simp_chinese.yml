 SPEC_EFFECT_EXCH_TT: "#header $SPEC_EFFECT_EXCH$#!\n[concept_spec_exchange]地位：$SPEC_EFFECT_EXCH_VALUE$\n$TOOLTIP_DELIMITER$\n[Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]得分：#v [Country.MakeScope.Var('spec_centre_score').GetValueWithDefault('(CFixedPoint)0')|0]#!\n信誉：#v $SPEC_EXCH_TRUST$#!\n交易所特许状：#v [SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_exch_known').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.5'), 'SPEC_EXCH_KNOWN_0', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_exch_known').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1.5'), 'SPEC_EXCH_KNOWN_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_exch_known').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2.5'), 'SPEC_EXCH_KNOWN_2', 'SPEC_EXCH_KNOWN_3')))]#!\n$TOOLTIP_DELIMITER$\n投资者对价格上涨的反应：与正常相比#v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_hype'), '(CFixedPoint)1')|+%0]#!（越高，热潮形成越快）\n[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1.5'), 'SPEC_EXCH_FX_FLIGHT', 'SPEC_EXCH_FX_FLIGHT_GP')][AddLocalizationIf(And(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.5'), Not(Country.MakeScope.Var('spec_centre_rank').IsSet)), 'SPEC_EXCH_FX_PRESTIGE')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_loss'), '(CFixedPoint)1')), 'SPEC_EXCH_FX_LOSS')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_credit'), '(CFixedPoint)1')), 'SPEC_EXCH_FX_CREDIT')]\n按信誉的[concept_spec_market_mood]波动：#v x[Country.MakeScope.ScriptValue('spec_exch_mood')|2]#!（低于#v x1#!更平稳，高于则更剧烈）\n按信誉的[concept_spec_market_confidence]恢复：#v x[Country.MakeScope.ScriptValue('spec_exch_recover')|2]#!（高于#v x1#!更快，低于则更慢）[AddLocalizationIf(Country.MakeScope.Var('spec_crunch').IsSet, 'SPEC_EXCH_FX_CRUNCH')][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.5'), 'SPEC_EXCH_FX_LEAN')]\n$TOOLTIP_DELIMITER$\n[SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.5'), 'SPEC_EXCH_NEXT_0', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1.5'), 'SPEC_EXCH_NEXT_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2.5'), 'SPEC_EXCH_NEXT_2', 'SPEC_EXCH_NEXT_3')))]"
