 SPEC_EFFECT_LAX_TT: "#header @spec_lending_standards! [concept_spec_lending_standards]：$SPEC_EFFECT_LAX_VALUE$#!\n$TOOLTIP_DELIMITER$\n#italic 我国银行放贷时有多谨慎。松懈的银行放贷更多，但它们的热潮终结得更猛烈。#!\n\n#b 与正常水平（#v 稳健#!）相比#!\n每月放贷额#v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_credit'), '(CFixedPoint)1')|+%0]#!\n贷入热潮的通常比例#v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_pull'), '(CFixedPoint)1')|+%0]#!\n银行救助成本#v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_cost'), '(CFixedPoint)1')|+%0]#!\n\n#b 如何变化#!\n每个平静的月份#N 略微放松#!（从#v 严格#!到#v 鲁莽#!约需#v 20#!年）\n每次救助银行后#N 大幅放松#!\n热潮终结或我们抑制热潮时#P 收紧#!\n[concept_spec_financial_panic]在没有救助的情况下结束时#P 大幅收紧#!\n$TOOLTIP_DELIMITER$\n#instruction 将[concept_spec_credit_policy]设为#v 紧缩#!可阻止其放松。恐慌或坏账也会使其暂停。#v 稳健#!或更严格还会提升我国[concept_spec_exchange]的信誉。#!"
