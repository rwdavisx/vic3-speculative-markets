 spec_depression.1.t: "$SPEC_LD_NAME$"
 spec_depression.1.d: "世界各交易所的恐慌已汇成一场。信贷在各大商号之间停止流动，各地物价同时下跌，曾让我们的工厂和矿山忙碌不停的订单正被电报一一取消。每个市场都倚靠着另一个市场，而它们全都在一同坠落。\n\n崩溃将持续数月，随后是长期萧条。我们多快恢复，取决于我们现在的所作所为，也取决于[Concept('concept_great_power','$concept_great_powers|q$')]的所作所为。"
 spec_depression.1.f: "“恐慌我们见得多了。但这一次，钱已无处可逃。”"
 spec_depression.1.a: "我们必须紧缩开支。"
 spec_depression.1.b: "稳住交易所。"
 spec_depression.2.t: "关税之墙"
 spec_depression.2.d: "我国最大工厂的业主向政府请愿，大地主们也加入了他们。他们说，外国商品和廉价的外国谷物在我们的市场上不计价格地出售，而我们自己的工厂和庄园却卖不出足以支付工资的价钱。他们要求对一切与本国工业和本国收成竞争的商品提高关税。\n\n保护政策能为我们的复苏遮风挡雨，但我们的贸易伙伴将因此受损，世界的复苏也会随之受损。"
 spec_depression.2.f: "“每个国家都在自己的市场周围筑墙，又都在纳闷自己的出口为何不见起色。”"
 spec_depression.2.a: "保护我国工业。"
 spec_depression.2.b: "保持市场开放。"
 spec_depression.3.t: "救济工程"
 spec_depression.3.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]有成千上万的人无所事事，救济基金也已耗尽。市政工程师手上有一份可以雇用他们的工程清单：排水渠、道路、堤岸和一座新的市场大厅，只要国库愿意付钱。"
 spec_depression.3.f: "“一个靠挖水沟挣日薪的人不是贫民，他自己也知道这一点。”"
 spec_depression.3.a: "为工程拨款。"
 spec_depression.3.b: "慈善是私人的事。"
 spec_depression.4.t: "银行遭围"
 spec_depression.4.d: "消息传开，[ROOT.GetCountry.GetCapital.GetCityHubName]的银行向如今濒临倒闭的商号大量放贷。从早晨起储户就在排队取款，到傍晚银行将无钱可付。银行董事们请求政府采取行动。"
 spec_depression.4.f: "“一家银行完全稳固，直到所有人都不再相信这一点。”"
 spec_depression.4.a: "宣布银行休业。"
 spec_depression.4.b: "为银行纾困。"
 spec_depression.4.c: "任其倒闭。"
 spec_depression.5.t: "货币问题"
 spec_depression.5.d: "物价下跌使全国陷入分裂。农民和小额借款人说，钱变得太贵了，物价每跌一年，每笔债务就沉重一分。他们要求增发货币、放宽信贷。银行家和债权人则回应说，只有稳健的货币才能赢回国内外投资者的信心。"
 spec_depression.5.f: "“我的抵押贷款和五年前一样多。我的小麦却只卖得上一半的价钱。”"
 spec_depression.5.a: "稳健货币高于一切。"
 spec_depression.5.b: "放宽信贷。"
 spec_depression.6.t: "失业者的游行"
 spec_depression.6.d: "一支失业者队伍打着写有“要工作，要面包”的旗帜开进了[ROOT.GetCountry.GetCapital.GetCityHubName]。他们在政府机关前扎营，要求呈递请愿书。警察说他们能在天黑前清空广场。"
 spec_depression.6.f: "“我们不求施舍。我们要的是工作。”"
 spec_depression.6.a: "驱散他们。"
 spec_depression.6.b: "听取他们的请愿。"
 spec_depression.7.t: "改革呼声"
 spec_depression.7.d: "报纸纷纷质问，萧条为何持续如此之久，又是谁在此前的投机中发了财。议员们呼吁调查银行、交易所以及政府自身的行为。"
 spec_depression.7.f: "“问题不再是制度是否失败，而是谁该为此负责。”"
 spec_depression.7.a: "委托调查。"
 spec_depression.7.b: "制度是健全的。"
 spec_depression.8.t: "$SPEC_LD_NAME$消退"
 spec_depression.8.d: "多年来第一次，订单增加的速度超过了取消的速度。物价已经触底，银行重新放贷，闲置的工厂正在招工。萧条结束了，尽管亲历者很少有人能很快将它忘记。"
 spec_depression.8.f: "“他们说生意好转了。等我自己的订单簿这么说，我才相信。”"
 spec_depression.8.a: "教训已经吸取。"
 spec_depression.8.b: "回到生意上来。"
