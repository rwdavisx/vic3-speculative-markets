 SPEC_DRIVER_BOOM_TT: "#header 热潮商品：[Country.MakeScope.Var('spec_c_boom').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#v [Country.MakeScope.Var('spec_n_boom').GetValueWithDefault('(CFixedPoint)0')|0]#!种热潮中的[Concept('concept_good','$concept_goods|q$')]：[Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0')|+=2][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_BOOM_CAP')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_steady'), '(CFixedPoint)1')), 'SPEC_BOOM_STEADY')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_fin_boom'), '(CFixedPoint)1')), 'SPEC_BOOM_FIN')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_boom_rule'), '(CFixedPoint)1')), 'SPEC_BOOM_RULE')]\n$TOOLTIP_DELIMITER$\n一种商品在我国[concept_market]中的份额越大，其热潮的贡献越大。[concept_spec_financial_panic]期间无效\n#weak [GetTechnology('stock_exchange').GetName]、[GetTechnology('investment_banks').GetName]和[GetTechnology('modern_financial_instruments').GetName]会使其更大#!"
 SPEC_BOOM_CAP: "\n在计算下列各项之前，上限为#v +3#!"
 SPEC_BOOM_STEADY: "\n庄园宅邸：#v x[Country.MakeScope.ScriptValue('spec_steady')|2]#!"
 SPEC_BOOM_FIN: "\n金融科技：#v x[Country.MakeScope.ScriptValue('spec_fin_boom')|2]#!"
 SPEC_BOOM_RULE: "\n市场波动：#v x[Country.MakeScope.ScriptValue('spec_boom_rule')|2]#!"
 SPEC_DRIVER_CRASH: "已终结热潮"
 SPEC_DRIVER_CRASH_TT: "#header 已终结热潮：[Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n上月最大的：#v [Country.MakeScope.Var('spec_crashed').GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\n已终结热潮的规模：[Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0')|+=2]\n市场有多热（[concept_spec_market_conditions]）：#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#![AddLocalizationIf(Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-40')), 'SPEC_CRASH_CAP')]\n$TOOLTIP_DELIMITER$\n热潮越大、商品在我国[concept_market]中份额越大，损失越重\n#weak [GetTechnology('mutual_funds').GetName]会减轻损失，[GetTechnology('modern_financial_instruments').GetName]会加重损失#!"
 SPEC_CRASH_CAP: "\n每月最多#N -40#!"
 SPEC_DRIVER_FOREIGN: "外来恐慌"
 SPEC_FOREIGN_HIT: "\n[concept_spec_foreign_panic]的基础冲击：#N -20#!\n对方经济相对我国的规模：#v x[Country.MakeScope.Var('spec_fh_size').GetValueWithDefault('(CFixedPoint)0')|2]#!\n我们联系的紧密程度（[concept_spec_market_tie]）：#v x[Country.MakeScope.Var('spec_fh_tie').GetValueWithDefault('(CFixedPoint)0')|2]#!\n对方的重要程度（[concept_rank]）：#v x[Country.MakeScope.Var('spec_fh_reach').GetValueWithDefault('(CFixedPoint)0')|2]#![AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_foreign_loss_mult'), '(CFixedPoint)1')), 'SPEC_FOREIGN_UNSTD')]"
 SPEC_FOREIGN_UNSTD: "\n因为我们没有[GetTechnology('currency_standards').GetName]：#v x[Country.MakeScope.ScriptValue('spec_foreign_loss_mult')|2]#!"
 SPEC_FOREIGN_FLIGHT: "\n[concept_spec_capital_flight]：[Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')|+=2]"
 SPEC_DRIVER_FOREIGN_TT: "#header 外来恐慌：[Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n最近一次：#v [Country.MakeScope.Var('spec_foreign_src').GetCountry.GetName]#!\n$TOOLTIP_DELIMITER$[AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_HIT')][AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_FLIGHT')]\n$TOOLTIP_DELIMITER$\n#title @spec_market_tie! [concept_spec_market_tie]#!\n#italic 有联系的国家发生恐慌时，每种联系会把多少传导给我们。它们不会相加。若一个月内有多场恐慌传来，只计最大的一次。#!\n同一[concept_market]：#v [Country.MakeScope.ScriptValue('spec_tie_market')|%0]#!\n附属国或宗主国：#v 80%#!\n外国投资权：#v [Country.MakeScope.ScriptValue('spec_tie_investment')|%0]#!\n市场间的大量贸易：#v [Country.MakeScope.ScriptValue('spec_tie_trade')|%0]#!\n外国对我国经济的所有权：最高#v 90%#!\n$TOOLTIP_DELIMITER$\n#weak [concept_great_power]的恐慌会全部传给我们，主要政权传一半，小国几乎不传。从国外传来的恐慌不会继续扩散。#!"
 SPEC_DRIVER_TURMOIL: "战争与动荡"
 SPEC_DRIVER_TURMOIL_TT: "#header 战争与动荡：[Country.MakeScope.Var('spec_c_turmoil').GetValueWithDefault('(CFixedPoint)0')|+=2]#!$SPEC_ITEMS_TURMOIL$\n$TOOLTIP_DELIMITER$\n每场[concept_war]（[concept_spec_war_news]）：每月#N -3#!至#P +0.15#!\n所有战争合计：每月#N -4#!至#P +0.5#!\n尚未开战的[concept_diplomatic_play]：每月#N -0.5#!\n国库见底：每月最多#N -3#!，自[concept_bankruptcy]前#v 20#!周起\n[concept_default]：每月#N -5#!\n[concept_revolution]：每月#N -2#!\n\n#instruction 将鼠标悬停在数字上可查看原因#!"
 SPEC_DRIVER_MOOD: "市场情绪"
 SPEC_DRIVER_MOOD_TT: "#header 市场情绪：[Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n本月的随机波动：[Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0')|+=2]\n上月延续下来的：[Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0'))|+=2]\n$TOOLTIP_DELIMITER$\n#weak 每月随机波动，任一方向最多#v 0.75#!。其中#v 75%#!会延续到下个月。我国[concept_spec_exchange]达到#v 全国级#!后，[concept_prosperity]高的公司会推高市场情绪。#!"
 SPEC_DRIVER_DRIFT: "回归基准"
 SPEC_DRIVER_DRIFT_TT: "#header 回归基准：[Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n与[concept_spec_baseline]（#v 55#!）的差距：[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0'), Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100'))|+=1]\n每月缩小差距的#v x[Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100')|%1]#!\n$TOOLTIP_DELIMITER$\n#weak [GetTechnology('macroeconomics').GetName]使这一速度提高一半#!"
 SPEC_DRIVER_TIGHT: "紧缩信贷"
 SPEC_DRIVER_GROWTH: "增长"
 SPEC_DRIVER_GROWTH_TT: "#header 增长：[Country.MakeScope.Var('spec_c_growth').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[concept_gdp]增长与近几个月相比：#v [Country.MakeScope.Var('spec_growth').GetValueWithDefault('(CFixedPoint)0')|=+%1]#!\n#v 2%#!的增长算作正常，不产生影响\n$TOOLTIP_DELIMITER$\n#weak 增长每比正常快或慢#v 1%#!，[concept_spec_market_confidence]每月变动#v 0.1#!，任一方向最多#v 0.6#!#!"
 SPEC_DRIVER_BUSINESS: "商业情绪"
 SPEC_DRIVER_BUSINESS_TT: "#header 商业情绪：[Country.MakeScope.Var('spec_c_business').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n实业家的[concept_approval]：#v [Country.MakeScope.ScriptValue('spec_ind_approval')|0]#!\n\n忠诚（#v 10#!或以上）：每月#P +0.4#!\n满意（#v 5#!或以上）：每月#P +0.2#!\n不满（#v -5#!或以下）：每月#N -0.2#!\n愤怒（#v -10#!或以下）：每月#N -0.4#!"
 SPEC_DRIVER_TIGHT_TT: "#header 紧缩信贷：[Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_market_confidence]高于#v 60#!的部分：#v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.1')|1]#!\n每月损失其中的#N -10%#!，来自[Concept('concept_spec_credit_policy','$concept_spec_credit_policy_tight|q$')]\n$TOOLTIP_DELIMITER$\n#weak 让热潮在数月内慢慢降温，而不是一下子冷却#!"
 concept_spec_market_conditions: "市场状况"
 concept_spec_market_conditions_desc: "@spec_market_conditions! $concept_spec_market_conditions$是[concept_spec_boom_end]到来时市场的热度。它们决定这次终结会造成多少[concept_spec_market_confidence]损失。届时$concept_spec_market_confidence$越高，损失越大。为#v 55#!时，市场状况没有影响。金融区、庄园宅邸和金融科技也会改变市场状况。"
 concept_spec_baseline: "基准信心"
 concept_spec_baseline_desc: "@spec_baseline! 放任不管时，[concept_spec_market_confidence]无论从上方还是下方，都会回归其$concept_spec_baseline$#v 55#!。偏离越远，回归越快。"
 concept_spec_market_mood: "市场情绪"
 concept_spec_market_mood_desc: "@spec_market_mood! $concept_spec_market_mood$是没有单一原因的投资者情绪波动。它每月随机变动，任一方向最多#v 0.75#!，其中#v 75%#!会延续到下个月，因此好坏时期会持续一阵才消退。"
 concept_spec_market_tie: "市场联系"
 concept_spec_market_tie_desc: "@spec_market_tie! $concept_spec_market_tie$表示一个[concept_country]在多大程度上跟随另一国的[concept_market]，决定两国之间传导多少[concept_spec_financial_panic]。\n\n一国拥有另一国[concept_gdp]的#v 10%#!起开始计入所有权，在#v 30%#!时最强。[GetLawType('law_free_trade').GetName]加强贸易联系，其他贸易政策则削弱贸易联系。[GetTechnology('international_exchange_standards').GetName]加强市场和投资联系。[concept_embargo]切断贸易联系。"
 concept_spec_capital_flight: "资本外逃"
 concept_spec_capital_flight_desc: "@spec_capital_flight! [concept_spec_financial_panic]爆发时，资金会逃往安全之地。每个[concept_great_power]，以及[concept_spec_exchange]为#v 国际级#!或更高的每个[concept_country]，若处于和平、信心为#v 稳定#!或更高且与恐慌国无关联，最多可获得#P +[GetPlayer.MakeScope.ScriptValue('spec_flight_gain_max')|0]#![concept_spec_market_confidence]。[GetTechnology('international_trade').GetName]和[GetTechnology('international_exchange_standards').GetName]提高这一收益。[concept_spec_exchange]地位越高，获得越多。"
 concept_spec_war_news: "战争消息"
 concept_spec_war_news_desc: "@spec_war_news! 投资者逐月关注[concept_war]。$concept_spec_war_news$根据战局每月改变[concept_spec_market_confidence]：[concept_casualties]、[concept_blockade]、[concept_devastation]、[concept_gdp]下降和久拖不决会使其降低，而赢得[Concept('concept_battle','$concept_battles|q$')]和占领敌方土地则使其上升。每场战争每月使其变动#N -3#!至#P +0.15#!，所有战争合计为#N -4#!至#P +0.5#!。"
