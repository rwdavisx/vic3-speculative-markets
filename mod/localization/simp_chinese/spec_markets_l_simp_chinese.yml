 spec_panic_desc: "[concept_market]中[concept_spec_financial_panic]的影响"
 spec_panic_crunch: "信贷紧缩"
 spec_panic_crunch_desc: "[concept_spec_financial_panic]期间银行停止放贷，[concept_private_construction]减半"
 spec_lev_boom: "信贷热潮"
 spec_bailout_fx_tt: "[concept_spec_bad_debts]：#P 减半#!，#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_months')|0]#!个月后清除，而非#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#!个月"
 spec_bailout_cost_tt: "[concept_treasury]：#N -@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_cost')|D]#!，约为[concept_gdp]的#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_share')|%0]#!"
 spec_bailout_debts_tt: "有待清除的[concept_spec_bad_debts]"
