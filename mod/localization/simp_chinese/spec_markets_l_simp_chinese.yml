 concept_spec_speculative_excess_desc: "$concept_spec_speculative_excess$衡量热潮期间[concept_country]的[concept_market]中积累的泡沫。一旦研究了[GetTechnology('stock_exchange').GetName]，[concept_spec_market_confidence]处于#v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!或以上的每个月它都会增长，且$concept_spec_market_confidence$攀得越高，增长越快。当$concept_spec_market_confidence$保持在#v 60#!与#v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!之间时，它每月冷却#v 2%#!。\n\n当$concept_spec_market_confidence$跌破#v 60#!时，泡沫破裂，$concept_spec_market_confidence$进一步下跌，最多#v [GetPlayer.MakeScope.ScriptValue('spec_burst_max')|0]#!。$concept_spec_speculative_excess$越高，摔得越重。"
 concept_spec_sound_finance: "健全金融"
 concept_spec_sound_finance_desc: "颁行全部三项[concept_spec_banking_reforms]即达成$concept_spec_sound_finance$：银行券规则、最后贷款人和公司法。\n\n全部颁行后，该[concept_country]获得#v 10#![concept_prestige]，[concept_loans]利息减少#v 5%#!。"
 concept_spec_banking_reforms: "银行改革"
 concept_spec_banking_reform: "银行改革"
 concept_spec_banking_reforms_desc: "$concept_spec_banking_reforms$规定了一个[concept_country]的银行和公司的运作规则。每项改革随一项科技解锁，并通过调查委员会颁行；调查委员会可在[concept_spec_financial_panic]之后召开，或在连续#v 10#!年没有恐慌后召开。每个委员会颁行一项改革。\n\n#bold 银行券规则#!（[GetTechnology('banking').GetName]），二选一：\n#bold 通货学派：#!$spec_reform_currency_tt$\n#bold 自由银行制：#!$spec_reform_free_tt$\n\n#bold 最后贷款人#!（[GetTechnology('central_banking').GetName]）：$spec_reform_llr_tt$\n\n#bold 公司法#!（[GetTechnology('joint_stock_companies').GetName]）：$spec_reform_company_tt$\n\n颁行全部三项改革即实现[concept_spec_sound_finance]。"
