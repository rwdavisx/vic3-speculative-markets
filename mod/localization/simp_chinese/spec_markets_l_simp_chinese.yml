 SPEC_LAXL_HERE: "\n\n#P 我们在这里#!"
 SPEC_LAXL_0_TT: "#header 严格#!\n$TOOLTIP_DELIMITER$\n#italic 银行几乎不放贷。热潮规模小，结束得温和。#!\n\n#b 与#v 稳健#!相比：#!\n每月放贷额：#v -25%#!至#v -15%#!\n贷入热潮的比例：#P -50%#!至#P -30%#!\n银行救助成本：#P -50%#!至#P -30%#!\n\n#P 我国[concept_spec_exchange]在平静的月份积累信誉#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.2')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_1_TT: "#header 审慎#!\n$TOOLTIP_DELIMITER$\n#italic 银行放贷谨慎。#!\n\n#b 与#v 稳健#!相比：#!\n每月放贷额：#v -15%#!至#v -5%#!\n贷入热潮的比例：#P -30%#!至#P -10%#!\n银行救助成本：#P -30%#!至#P -10%#!\n\n#P 我国[concept_spec_exchange]在平静的月份积累信誉#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.2'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.4')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_2_TT: "#header 稳健#!\n$TOOLTIP_DELIMITER$\n#italic 正常水平。#!\n\n#b 与#v 稳健#!相比：#!\n每月放贷额：#v -5%#!至#v +5%#!\n贷入热潮的比例：#P -10%#!至#N +10%#!\n银行救助成本：#P -10%#!至#N +10%#!\n\n#P 我国[concept_spec_exchange]在平静的月份积累信誉#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.4'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.6')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_3_TT: "#header 松懈#!\n$TOOLTIP_DELIMITER$\n#italic 银行放贷随意，追逐热潮。#!\n\n#b 与#v 稳健#!相比：#!\n每月放贷额：#v +5%#!至#v +15%#!\n贷入热潮的比例：#N +10%#!至#N +30%#!\n银行救助成本：#N +10%#!至#N +30%#!\n\n#N 我国[concept_spec_exchange]不再积累信誉#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.6'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.8')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_4_TT: "#header 鲁莽#!\n$TOOLTIP_DELIMITER$\n#italic 银行来者不拒。热潮过热，结束惨烈。#!\n\n#b 与#v 稳健#!相比：#!\n每月放贷额：#v +15%#!至#v +25%#!\n贷入热潮的比例：#N +30%#!至#N +50%#!\n银行救助成本：#N +30%#!至#N +50%#!\n\n#N 我国[concept_spec_exchange]不再积累信誉#![AddLocalizationIf(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.8'), 'SPEC_LAXL_HERE')]"
 SPEC_EFFECT_LAX: "放贷标准"
