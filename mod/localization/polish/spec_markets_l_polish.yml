 SPEC_IL_SORT_GOODS_TT: "#header Sortuj według towarów#!\n$TOOLTIP_DELIMITER$\nKategoria [Concept('concept_good','$concept_goods|q$')]: towary, którymi obraca nasz [concept_market], w stałej kolejności według kategorii, a następnie nazwy."
 SPEC_IL_SORT_INTEREST_TT: "#header Sortuj według: [concept_spec_investor_interest]#!\n$TOOLTIP_DELIMITER$\nNajpierw najwyższe zainteresowanie; w obrębie poziomu najpierw towary o największych obrotach.\n\nZnacznik pokazuje poziom, od @spec_interest_fleeing! #v Odpływ#! do @spec_interest_feverish! #v Gorączka#!. Strzałka pokazuje zmianę w tym miesiącu."
 SPEC_IL_SORT_LEVER_TT: "$SPEC_IL_SORT_LEVER_BASE_TT$$SPEC_IL_ISSUE_FILTER$"
 SPEC_IL_ISSUE_FILTER: "\n\nTrwające wielkie emisje są również wyświetlane."
 SPEC_IL_SORT_LEVER_BASE_TT: "#header Pokaż interwencje#!\n$TOOLTIP_DELIMITER$\nPokazuje tylko towary objęte interwencją ([concept_spec_intervention]).\n\n$SPEC_COL_LEVER_TT$\n\n#instruction Kliknij, aby filtrować; kliknij ponownie, aby pokazać wszystkie#!"
 SPEC_IL_DANGER_TT: "#header Strefa załamania#!\nJeśli [concept_spec_investor_interest] spadnie tak nisko, nastąpi [concept_spec_collapse], a [concept_spec_market_confidence] spadnie o około #N [Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#!."
 SPEC_IL_CRASHED_TT: "#header [Goods.GetName]: koniec boomu#!\nJego boom zakończył się w tym miesiącu: [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]. Inwestorzy wstrzymują się teraz przez [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))], a tam, gdzie wytwarza go [concept_company], przemysł tego towaru traci [concept_throughput]."
 SPEC_IL_GLUT_TT: "#header [Goods.GetName]: odbudowa#!\nFinał ostatniego boomu to [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]. Po jego końcu inwestorzy wstrzymują się przez [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))], przez co [concept_spec_investor_interest] nie przekracza poziomu #v Wątpliwości#!. Jeśli towar wytwarza [concept_company], spada [concept_throughput] w jej branży."
 SPEC_TILE_BANKS: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_expx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_BANKS_ON', 'SPEC_GOODS_NONE')]$SPEC_TILE_CYCLE$"
 SPEC_TILE_BANKS_ON: "\n\n#title Kredyty bankowe:#! #v [Country.MakeScope.Var(Concatenate('spec_exp_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! z [concept_spec_outstanding_credit], #v [Country.MakeScope.Var(Concatenate('spec_ui_expm_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! mies. dochodu puli\nGdyby jego boom się skończył, [concept_spec_market_confidence] spadłaby #v x[Country.MakeScope.Var(Concatenate('spec_ui_expx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|2]#! razy mocniej niż przy boomie, w który żaden bank nie pożyczał"
 SPEC_NOTE_BANKS: ""
 SPEC_NOTE_BANKS_ON: " Banki mocno w niego pożyczały, więc spadek był #N x[SCOPE.GetValue('spec_note_bank')|2]#! silniejszy."
 SPEC_H_BANK_LENT: "Gdzie pożyczały banki"
 SPEC_H_BANK_LENT_TT: "#header Gdzie pożyczały banki#!\n$TOOLTIP_DELIMITER$\nBanki kierują większość nowego kredytu do towarów przeżywających boom: im większy udział towaru w naszym handlu i im wyższe [concept_spec_investor_interest], tym więcej otrzymuje. Pożyczka pozostaje w swoim towarze aż do spłaty.\n\nGdy kończy się boom, w który pożyczały banki, [concept_spec_market_confidence] spada mocniej. Ograniczenie spekulacji towarem zmniejsza o połowę napływ nowych pożyczek."
 SPEC_BANK_PIE: "Kredyty w boomach według dóbr"
 SPEC_BANK_SLICE_NAME: "[SelectLocalization(Country.MakeScope.Var(Concatenate('spec_bank_oth_', Scope.GetGoods.GetKey)).IsSet, 'SPEC_BANK_OTHER', 'SPEC_BANK_GOOD_NAME')]"
 SPEC_BANK_GOOD_NAME: "[Scope.GetGoods.GetName]"
 SPEC_BANK_SLICE_SHARE: "[SelectLocalization(Country.MakeScope.Var(Concatenate('spec_bank_oth_', Scope.GetGoods.GetKey)).IsSet, 'SPEC_BANK_OTHER_SHARE', 'SPEC_BANK_GOOD_SHARE')]"
 SPEC_BANK_OTHER_SHARE: "#v [Divide_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_exp_booms'), Country.MakeScope.Var('spec_bank_top').GetValueWithDefault('(CFixedPoint)0')), Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_exp_booms'), '(CFixedPoint)0.001'))|%0]#!"
 SPEC_BANK_GOOD_SHARE: "#v [Divide_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_exp_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_exp_booms'), '(CFixedPoint)0.001'))|%0]#!"
 SPEC_BANK_SLICE_TT: "[SelectLocalization(Country.MakeScope.Var(Concatenate('spec_bank_oth_', Scope.GetGoods.GetKey)).IsSet, 'SPEC_BANK_OTHER_TT', 'SPEC_BANK_GOOD_TT')]"
 SPEC_BANK_GOOD_TT: "#header [Scope.GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\nTen towar otrzymał #v [Country.MakeScope.Var(Concatenate('spec_exp_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%1]#! udzielonego kredytu ([concept_spec_outstanding_credit]).\nGdyby jego boom się skończył, [concept_spec_market_confidence] spadłoby #v x[Country.MakeScope.Var(Concatenate('spec_ui_expx_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)1')|2]#! mocniej.\n\n#grey Pożyczka pozostaje w swoim towarze aż do spłaty, nawet gdy boom ostygnie.#!"
