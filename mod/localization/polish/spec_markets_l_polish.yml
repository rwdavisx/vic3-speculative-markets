 concept_spec_financial_centre_desc: "$concept_spec_financial_centres$ to giełdy #v 5#! państw ([Concept('concept_country','$concept_countries|q$')]) o najwyższym wyniku ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]), ustalanym co miesiąc. Wynik rośnie z pierwiastkiem kwadratowym z #v 6#! mies. dochodu w kategorii [concept_investment_pool] oraz z wiarygodnością, zamożnością na mieszkańca, dzielnicami finansowymi, firmami, technologiami finansowymi, pozycją ([concept_rank]) i systemem gospodarczym. Średnia trzech czołowych jest pokazywana jako #v 100#!.\n\nPierwsze miejsce: #P +10%#! [concept_prestige], #P -10%#! oprocentowania w kategorii [concept_loans], #P +5#! mies. limitu kredytowego\nOstatnie miejsce (#v 5#!): #P +2%#!, #P -2%#!, #P +1#! mies.\nPremia do limitu kredytowego wymaga: [GetTechnology('central_banking').GetName] i standardów kredytowych #v Solidne#! lub surowszych"
 SPEC_CENTRE_PLACE: "#v ##[Country.MakeScope.Var('spec_centre_rank').GetValueWithDefault('(CFixedPoint)0')|0]#!"
 SPEC_CENTRE_PLACE_TT: "[Concept('concept_spec_financial_centre','$concept_spec_financial_centres|q$')] świata - nasze miejsce w rankingu: #v ##[Country.MakeScope.Var('spec_centre_rank').GetValueWithDefault('(CFixedPoint)0')|0]#!"
