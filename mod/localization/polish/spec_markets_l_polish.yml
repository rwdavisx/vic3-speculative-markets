 SPEC_JE_STAGE_6: "Nad państwem [JournalEntry.GetCountry.GetCapital.GetCityHubName] ciąży [concept_spec_long_depression]. Inwestorzy gromadzą to, co mają, i nikomu nie pożyczają, a każde dotychczasowe ożywienie gasło w ciągu kilku miesięcy. Odbudowę świata śledzi osobny wpis w dzienniku.\n\nRoboty publiczne dają bezrobotnym pracę przy budowie i utrzymanie, dopóki kryzys trwa."
 SPEC_JE_STAGE_5: "Panika ogarnęła państwo [JournalEntry.GetCountry.GetCapital.GetCityHubName]. Deponenci od świtu stoją w kolejkach przed bankami, pożyczki są wypowiadane, a [concept_private_construction] spadnie o połowę na kolejne #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! mies., jeśli rząd nie zareaguje.\n\n#v Pożycz bankom#! szybciej ją kończy i zmniejsza jej skutki o połowę. Roboty publiczne dają bezrobotnym pracę przy budowie i utrzymanie.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_currency_v'), '(CFixedPoint)0'), 'SPEC_JE_SUSPEND_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_4: "Panika minęła, pozostawiając upadłe domy handlowe i niedokończone zakłady. Inwestorzy liczą straty, a nowa panika nie może wybuchnąć przez #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic_cooldown').GetValue|0]#! mies.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_reform_open_v'), '(CFixedPoint)0'), 'SPEC_JE_INQUIRY_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_3: "W stolicy ([JournalEntry.GetCountry.GetCapital.GetCityHubName]) giełdę ogarnęło szaleństwo. Urzędnicy i wdowy za pożyczone pieniądze kupują akcje w branżach takich jak #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! i #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#!, a każdy miesiąc, w którym [concept_spec_market_confidence] wynosi #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#! lub więcej, zwiększa [concept_spec_speculative_excess]. Gdy [concept_spec_market_confidence] spadnie poniżej #v 60#!, bańka pęknie. Im większy nadmiar, tym dotkliwszy upadek.\n\nOgraniczenie spekulacji najpopularniejszymi towarami lub zaostrzenie polityki kredytowej pozwala powoli wypuścić z bańki powietrze."
 SPEC_JE_STAGE_2: "Pieniądze są łatwo dostępne, a inwestorzy pełni optymizmu. Nowe firmy w branżach takich jak #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! i #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! już w godzinę otrzymują więcej zapisów na akcje, niż mogą zaspokoić, a banki chętnie pożyczają pod zastaw tych akcji. Gdy [concept_spec_market_confidence] wynosi #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#! lub więcej, zaczyna narastać [concept_spec_speculative_excess].\n\nDobra koniunktura to także pora na konwersję długu państwowego na niższe oprocentowanie."
 SPEC_JE_STAGE_1: "W stolicy ([JournalEntry.GetCountry.GetCapital.GetCityHubName]) handel giełdowy przebiega spokojnie. Inwestorzy wybierają towary takie jak #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! i #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#!, a unikają takich jak #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! i #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!."
 SPEC_JE_STAGE_0: "W stolicy ([JournalEntry.GetCountry.GetCapital.GetCityHubName]) inwestorzy są ostrożni. Nauczeni ostatnimi stratami trzymają pieniądze przy sobie i unikają towarów takich jak #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! i #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!. Łagodna polityka kredytowa lub zachęty do inwestycji w dany towar mogą skłonić ich do powrotu."
