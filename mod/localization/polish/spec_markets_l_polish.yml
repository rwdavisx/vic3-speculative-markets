 concept_spec_long_depression: "Długi kryzys"
 concept_spec_long_depression_desc: "$concept_spec_long_depression$ to światowy kryzys gospodarczy. Zaczyna się, gdy [concept_great_power] pogrąża się w panice ([concept_spec_financial_panic]), obejmuje każdy kraj będący wtedy w panice i rozprzestrzenia się poprzez bliskie powiązania: wspólny [concept_market], relacje poddanych i zwierzchników, prawa inwestycyjne, intensywny handel i zagraniczną własność.\n\nŚwiatowy krach (#v 4#! mies.): kredyt zamarza, a [concept_spec_market_confidence] topnieje\nKryzys (do #v 5#! lat): inwestycje, budownictwo i handel zwalniają, a część ludności staje się: [Concept('concept_radical','$concept_radicals|q$')]\nOdbudowa (#v 1#! r.): [concept_spec_market_confidence] wraca\n\nDecyzje każdego rządu przyspieszają odbudowę jego kraju i świata, a najbardziej decyzje mocarstw ([concept_great_power])."
 je_spec_depression: "$SPEC_LD_NAME$"
