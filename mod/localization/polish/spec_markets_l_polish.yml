 spec_mania_movements_desc: "Długi boom przekonał wielu, że rynki najlepiej pozostawić samym sobie. W kategorii [Concept('concept_political_movement','$concept_political_movements|q$')] zyskują poparcie zwolennicy prawa [GetLawType('law_laissez_faire').GetName]. Efekt z czasem zanika."
