 SPEC_EFFECT_LAX_VALUE: "#v [SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.2'), 'SPEC_LAXW_0', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.4'), 'SPEC_LAXW_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.6'), 'SPEC_LAXW_2', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.8'), 'SPEC_LAXW_3', 'SPEC_LAXW_4'))))]#!"
 SPEC_EFFECT_LAX_TT: "#header [concept_spec_lending_standards]#!\n$SPEC_EFFECT_LAX_VALUE$\n$TOOLTIP_DELIMITER$\nKredyt udzielany co miesiąc: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_credit'), '(CFixedPoint)1')|+%0]#!\nCzęść kierowana do boomów: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_pull'), '(CFixedPoint)1')|+%0]#!\nKoszt ratowania banków: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_cost'), '(CFixedPoint)1')|+%0]#!\n$TOOLTIP_DELIMITER$\nBanki stają się nieostrożne w latach bez strat i po każdym ratowaniu banków. Ostrożność odzyskują tylko, ponosząc straty: gdy kończy się boom, a przede wszystkim, gdy [concept_spec_financial_panic] dobiega końca bez ratowania banków.\n\n#title Jak utrzymać ich ostrożność:#!\n- Ustaw [concept_spec_credit_policy] na „Surowa”: banki przestają tracić ostrożność\n- Ograniczaj boomy, zanim źle się skończą\n- Pozwól panice dobiec końca bez ratowania banków lub rzadziej zawieszaj ustawę bankową\n\nPoziomy: #v Surowe#!, #v Ostrożne#!, #v Solidne#!, #v Luźne#!, #v Lekkomyślne#!"
 SPEC_TILE_CYCLE: "[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_overx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_OVER_ON', 'SPEC_GOODS_NONE')][SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_bb_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_TILE_BB_ON', 'SPEC_GOODS_NONE')]"
 SPEC_TILE_OVER_ON: "\n\n#title Nadmierna rozbudowa:#! podaż wzrosła o #v [Country.MakeScope.Var(Concatenate('spec_ui_over_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! od początku tego boomu\nGdyby jego boom się skończył, [concept_spec_market_confidence] spadłoby #v x[Country.MakeScope.Var(Concatenate('spec_ui_overx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|2]#! mocniej"
 SPEC_TILE_BB_ON: "\n\n#title Budowa w boomie:#! #P +[Country.MakeScope.Var(Concatenate('spec_ui_bb_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! do efektywności budowy dla jego przemysłu, dopóki inwestorzy pozostają tak chętni"
 SPEC_NOTE_CYCLE: "[SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)2.5'), 'SPEC_NOTE_PPL_3', SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)1.5'), 'SPEC_NOTE_PPL_2', SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)0.5'), 'SPEC_NOTE_PPL_1', 'SPEC_GOODS_NONE')))]"
 SPEC_NOTE_OVER_ON: " W czasie boomu zbudowano tak wiele, że spadek był #N x[SCOPE.GetValue('spec_note_over')|2]#! silniejszy."
 SPEC_NOTE_PPL_1: " Straty ponieśli robotnicy, do których należał jego przemysł, a niektórzy w stanach, gdzie się on znajduje, zasilili grupę określaną jako [Concept('concept_radical', '$concept_radicals|q$')]."
 SPEC_NOTE_PPL_2: " Straty ponieśli jego właściciele, a niektórzy w stanach, gdzie się on znajduje, zasilili grupę określaną jako [Concept('concept_radical', '$concept_radicals|q$')]."
 SPEC_NOTE_PPL_3: " Straty ponieśli jego właściciele i zwykli ciułacze, a wielu w stanach, gdzie się on znajduje, zasiliło grupę określaną jako [Concept('concept_radical', '$concept_radicals|q$')]."
