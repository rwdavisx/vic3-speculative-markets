 concept_spec_exchange: "Giełda"
 concept_spec_exchange_desc: "$concept_spec_exchange$ danego państwa ([concept_country]) to miejsce, gdzie z rąk do rąk przechodzą jego akcje, obligacje i kredyt. Jej pozycja zależy od wyniku ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]): #v Prowincjonalna#!, #v Krajowa#!, #v Międzynarodowa#! (wymaga: [GetTechnology('stock_exchange').GetName]) lub #v Światowe centrum#! (wymaga: [GetTechnology('central_banking').GetName]). Wyższa pozycja zwiększa reakcję inwestorów na rosnące ceny, a od poziomu #v Międzynarodowa#! giełda otrzymuje: [concept_spec_capital_flight].\n\nPaństwo nadaje swojej giełdzie jeden statut: #v Giełda towarowa#!, #v Rynek pieniężny#! lub #v Rynek akcji#!. Giełda ma od #v 1#! do #v 4#! specjalności spośród #v 7#! dróg do sławy, tym więcej, im wyższa jej pozycja, i zachowuje każdą co najmniej #v 5#! lat.\n\nWiarygodność rośnie w spokojnych latach przy solidnym kredytowaniu, a spada z powodu: [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')], [concept_spec_bad_debts] oraz finałów typu [concept_spec_bust] lub [concept_spec_collapse] w głównym towarze. Niska wiarygodność podnosi oprocentowanie w kategorii [concept_loans], a wysoka je obniża."
