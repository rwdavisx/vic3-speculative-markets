 SPEC_IL_LEVEL_1_TT: "#header @spec_interest_fleeing! Odpływ#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_IL_LEVEL_CURRENT')]\nObowiązuje, gdy trend cenowy jest poniżej #v [Country.MakeScope.ScriptValue('spec_level_from_2')|=+%1]#! względem średniej długoterminowej\nObecny trend cenowy: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Efekty:#!\n[concept_throughput] producentów: #N -10%#!\nBoom na poziomie #v Gorączka#!, który spadnie tak nisko, kończy się finałem: [concept_spec_collapse]\nMożna zachęcać do inwestycji, chyba że towar przechodzi odbudowę"
 SPEC_IL_LEVEL_2_TT: "#header @spec_interest_doubtful! Wątpliwości#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_LEVEL_CURRENT')]\nObowiązuje, gdy trend cenowy wynosi od #v [Country.MakeScope.ScriptValue('spec_level_from_2')|=+%1]#! do #v [Country.MakeScope.ScriptValue('spec_level_from_3')|=+%1]#! względem średniej długoterminowej\nObecny trend cenowy: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Efekty:#!\n[concept_throughput] producentów: #N -5%#!\nPo zakończeniu boomu odbudowujący się towar pozostaje przez pewien czas na tym poziomie lub niżej\nMożna zachęcać do inwestycji, chyba że towar przechodzi odbudowę"
 SPEC_IL_LEVEL_3_TT: "#header @spec_interest_calm! Spokój#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_LEVEL_CURRENT')]\nObowiązuje, gdy trend cenowy wynosi od #v [Country.MakeScope.ScriptValue('spec_level_from_3')|=+%1]#! do #v [Country.MakeScope.ScriptValue('spec_level_from_4')|=+%1]#! względem średniej długoterminowej\nObecny trend cenowy: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Efekty:#!\nBrak efektów\nMożna zachęcać do inwestycji, chyba że towar przechodzi odbudowę"
 SPEC_IL_LEVEL_4_TT: "#header @spec_interest_keen! Ożywienie#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)4'), 'SPEC_IL_LEVEL_CURRENT')]\nObowiązuje, gdy trend cenowy wynosi od #v [Country.MakeScope.ScriptValue('spec_level_from_4')|=+%1]#! do #v [Country.MakeScope.ScriptValue('spec_level_from_5')|=+%1]#! względem średniej długoterminowej\nObecny trend cenowy: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Efekty:#!\n[concept_throughput] producentów: #P +3%#!\nMoże zakończyć się finałem: [concept_spec_correction]"
 SPEC_IL_LEVEL_5_TT: "#header @spec_interest_eager! Zapał#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)5'), 'SPEC_IL_LEVEL_CURRENT')]\nObowiązuje, gdy trend cenowy wynosi od #v [Country.MakeScope.ScriptValue('spec_level_from_5')|=+%1]#! do #v [Country.MakeScope.ScriptValue('spec_level_from_6')|=+%1]#! względem średniej długoterminowej\nObecny trend cenowy: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Efekty:#!\n[concept_throughput] producentów: #P +5%#!\n[concept_spec_market_confidence]: #P rośnie#! co miesiąc, bardziej przy większym udziale w obrotach, z wyjątkiem okresu, gdy trwa [concept_spec_financial_panic]\nMoże zakończyć się finałem: [concept_spec_bust]\nMożna ograniczyć spekulację"
 SPEC_IL_LEVEL_6_TT: "#header @spec_interest_feverish! Gorączka#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)6'), 'SPEC_IL_LEVEL_CURRENT')]\nObowiązuje, gdy trend cenowy jest powyżej #v [Country.MakeScope.ScriptValue('spec_level_from_6')|=+%1]#! względem średniej długoterminowej\nObecny trend cenowy: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Efekty:#!\n[concept_throughput] producentów: #P +8%#!\n[concept_spec_market_confidence]: #P rośnie#! co miesiąc, bardziej przy większym udziale w obrotach, z wyjątkiem okresu, gdy trwa [concept_spec_financial_panic]\nMoże zakończyć się finałem: [concept_spec_collapse]\nMożna ograniczyć spekulację"
