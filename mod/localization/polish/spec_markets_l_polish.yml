 SPEC_XS_CAP_TT: "#header Kapitał#!\n$TOOLTIP_DELIMITER$\nWynik zaczyna się od kapitału, z którego czerpie nasza [concept_spec_exchange], i rośnie jak jego pierwiastek kwadratowy: czterokrotnie większy kapitał podwaja wynik.\n\nWłasny: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_own_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, sześć miesięcy wpływów do funduszu [concept_investment_pool], uśrednione z ostatniego roku\nZ naszych powiązań: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_reach_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, jedna czwarta kapitału każdego mniejszego państwa ([concept_country]), które należy do naszego rynku ([concept_market]), jest naszym podmiotem ([Concept('concept_subject','$concept_subjects|q$')]), należy do naszego bloku ([concept_power_bloc]) lub przyznaje nam prawa: [concept_foreign_investment]; najwyżej tyle, ile własny"
 SPEC_XS_WEALTH_TT: "#header Zamożność na mieszkańca#!\n$TOOLTIP_DELIMITER$\nNasze wpływy do funduszu [concept_investment_pool] na osobę są #v [Country.MakeScope.Var('spec_xs_ratio_v').GetValueWithDefault('(CFixedPoint)0')|2]#! razy większe niż średnia światowa. Oszczędności zamożnego narodu tworzą głębszy rynek: pierwiastek kwadratowy z tej wartości, od #v x0.5#! do #v x2#!"
 SPEC_XS_TECH_TT: "#header Technologie finansowe#!\n$TOOLTIP_DELIMITER$\nKażda zbadana podnosi wynik:\n$banking$: #P +5%#!\n$stock_exchange$: #P +5%#!\n$central_banking$: #P +5%#!\n$joint_stock_companies$: #P +5%#!\n$mutual_funds$: #P +5%#!\n$investment_banks$: #P +10%#!\n$international_exchange_standards$: #P +10%#!\n$modern_financial_instruments$: #P +10%#!\n\nPozycja #v Międzynarodowa#! wymaga technologii [GetTechnology('stock_exchange').GetName], a pozycja #v Światowe centrum#! technologii [GetTechnology('central_banking').GetName]"
 SPEC_XS_ECON_TT: "#header System gospodarczy#!\n$TOOLTIP_DELIMITER$\nNasz system gospodarczy mnoży wynik:\n$law_laissez_faire$: #P x1.15#!\n$law_interventionism$: #P x1.05#!\n$law_agrarianism$: #N x0.95#!\n$law_traditionalism$: #N x0.9#!\n$law_extraction_economy$: #N x0.9#!\n$law_command_economy$: #N x0.75#!\n$law_cooperative_ownership$: #N x0.6#!"
