 SPEC_RISK_SLIGHT: "#header Możliwy finał: $SPEC_UNWIND$#!\n[concept_spec_market_confidence] po zakończeniu boomu: #v Niewielka strata#!\n$TOOLTIP_DELIMITER$\n$SPEC_UNWIND_DESC$"
 SPEC_RISK_GLUT: "#header Odbudowa#!\n$TOOLTIP_DELIMITER$\nTowar [Goods.GetName] odradza się po końcu ostatniego boomu. Inwestorzy wstrzymują się, przez co [concept_spec_investor_interest] przez pewien czas pozostaje na poziomie #v Wątpliwości#!."
 SPEC_RISK_CALM: "#header Brak boomu#!\n$TOOLTIP_DELIMITER$\nTowar [Goods.GetName] nie przeżywał ostatnio boomu. Gdy [concept_spec_investor_interest] osiągnie poziom #v Ożywienie#! lub wyższy, powrót do poziomu #v Wątpliwości#! kończy boom. Im wyżej sięgnął, tym boleśniejszy upadek."
 SPEC_UNWIND_3: "Załamanie"
 SPEC_UNWIND_C_3: "[concept_spec_collapse]"
 SPEC_UNWIND_DESC_3: "Ten [concept_good] przeżył boom na poziomie #v Gorączka#!. Jeśli trend cenowy spadnie poniżej #v [Divide_CFixedPoint('(CFixedPoint)-4.988', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!, [concept_spec_investor_interest] osiągnie poziom #v Odpływ#!, a finałem boomu będzie [concept_spec_collapse]. Inwestorzy wstrzymają się wtedy na #v 12#! mies. Ryzyko maleje z wiekiem boomu."
 SPEC_UNWIND_2: "Zapaść"
 SPEC_UNWIND_C_2: "[concept_spec_bust]"
 SPEC_UNWIND_DESC_2: "Ten [concept_good] przeżył boom na poziomie #v Zapał#!. Jeśli trend cenowy spadnie poniżej #v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!, [concept_spec_investor_interest] osiągnie poziom #v Wątpliwości#!, a finałem boomu będzie [concept_spec_bust]. Inwestorzy wstrzymają się wtedy na #v 6#! mies. Ryzyko maleje z wiekiem boomu."
 SPEC_UNWIND_1: "Korekta"
 SPEC_UNWIND_C_1: "[concept_spec_correction]"
 SPEC_UNWIND_DESC_1: "Ten [concept_good] przeżył boom na poziomie #v Ożywienie#!. Jeśli trend cenowy spadnie poniżej #v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!, [concept_spec_investor_interest] osiągnie poziom #v Wątpliwości#!, a finałem boomu będzie [concept_spec_correction]. Inwestorzy wstrzymają się wtedy na #v 3#! mies. Ryzyko maleje z wiekiem boomu."
 spec_map_tt: "#header [SCOPE.sCountry('spec_map_owner').GetName]#!\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)6'), 'SPEC_MAP_STAGE_6', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)5'), 'SPEC_MAP_STAGE_5', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)4'), 'SPEC_MAP_STAGE_4', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)3'), 'SPEC_MAP_STAGE_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)2'), 'SPEC_MAP_STAGE_2', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)1'), 'SPEC_MAP_STAGE_1', 'SPEC_MAP_STAGE_0'))))))]\n[concept_spec_market_confidence]: #v [SCOPE.sCountry('spec_map_owner').MakeScope.Var('spec_conf').GetValue|0]#!"
