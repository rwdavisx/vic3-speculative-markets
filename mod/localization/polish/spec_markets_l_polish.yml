l_polish:
 spec_confidence_bar: "Zaufanie rynkowe"
 spec_confidence_bar_desc: "[concept_spec_market_confidence]: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!"
 spec_stance_current_tt: "Ten wariant nie obowiązuje obecnie w dziedzinie [concept_spec_credit_policy]"
 spec_stance_cooldown_tt: "[concept_spec_credit_policy] nie zmieniła się w ciągu ostatnich #v 6#! mies."
 spec_rescued_tt: "Odkąd trwa ta [concept_spec_financial_panic], nie pożyczyliśmy bankom ani nie zawiesiliśmy ustawy bankowej"
 spec_credit_tight: "Ograniczony kredyt"
 spec_credit_tight_fx: "[concept_spec_credit_policy] przyjmuje wariant #v Surowa#!"
 spec_credit_normal_fx: "[concept_spec_credit_policy] przyjmuje wariant #v Normalna#!"
 spec_credit_loose_fx: "[concept_spec_credit_policy] przyjmuje wariant #v Łagodna#!"
 spec_credit_tight_desc: "Banki przestają pożyczać, a inwestorzy słabiej reagują na rosnące ceny. Boomy pozostają mniejsze, więc ich finały i paniki są łagodniejsze. Co miesiąc [concept_spec_market_confidence] traci #N 10%#! nadwyżki ponad #v 60#!. Wybór blokuje zasady ([concept_spec_credit_policy]) na #v 6#! mies. Wymaga: [GetTechnology('central_banking').GetName].\n\n@intelligentsia! Inteligencja ([concept_in_government]): #P +2#! [concept_approval]\n@industrialists! Przemysłowcy ([concept_in_government]): #N -2#! [concept_approval]"
 spec_credit_normal: "Normalny kredyt"
 spec_credit_normal_desc: "Banki zasilają fundusz [concept_investment_pool], gdy [concept_spec_market_confidence] przekracza #v 55#!. Wybór blokuje zmiany w dziedzinie [concept_spec_credit_policy] na #v 6#! mies. Wymagana technologia: [GetTechnology('central_banking').GetName]."
 spec_credit_loose: "Łatwy kredyt"
 spec_credit_loose_desc: "Banki udzielają więcej pożyczek, a inwestorzy silniej reagują na wzrost cen. Boomy rosną mocniej, podobnie jak straty po ich zakończeniu. Wybór blokuje zmiany w dziedzinie [concept_spec_credit_policy] na #v 6#! mies. Wymagana technologia: [GetTechnology('central_banking').GetName].\n\n@industrialists! Przemysłowcy [concept_in_government]: [concept_approval] #P +2#!\n@intelligentsia! Inteligencja [concept_in_government]: [concept_approval] #N -2#!"
 spec_rescue_banks: "Pożycz bankom"
 spec_rescue_banks_desc: "Wydaj z zasobu [concept_treasury] kwotę równą około #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#! wartości [concept_gdp], aby [concept_spec_financial_panic] skończyła się w ciągu #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#! mies., a jej skutki zmalały o połowę. [concept_spec_market_confidence] rośnie o #v 20#!. Im więcej miesięcy paniki pozostało, tym większy koszt. Można to zrobić raz podczas każdej paniki. Technologia [GetTechnology('central_banking').GetName] obniża koszt i przyspiesza działanie."
 spec_conf_panic: "Wstrząśnięci inwestorzy"
 spec_conf_panic_held: "Wstrząśnięci inwestorzy"
 spec_conf_wary: "Ostrożni inwestorzy"
 spec_conf_steady: "Stabilni inwestorzy"
 spec_conf_buoyant: "Optymistyczni inwestorzy"
 spec_conf_mania: "Rozgorączkowani inwestorzy"
 spec_conf_panic_desc: "Skutki, które wywołuje [concept_spec_market_confidence] dla inwestycji i oprocentowania w kategorii [concept_loans]"
 spec_conf_panic_held_desc: "Skutki, które wywołuje [concept_spec_market_confidence] dla inwestycji i oprocentowania w kategorii [concept_loans]"
 spec_conf_wary_desc: "Skutki, które wywołuje [concept_spec_market_confidence] dla inwestycji i oprocentowania w kategorii [concept_loans]"
 spec_conf_steady_desc: "Skutki, które wywołuje [concept_spec_market_confidence] dla inwestycji i oprocentowania w kategorii [concept_loans]"
 spec_conf_buoyant_desc: "Skutki, które wywołuje [concept_spec_market_confidence] dla inwestycji i oprocentowania w kategorii [concept_loans]"
 spec_conf_mania_desc: "Skutki, które wywołuje [concept_spec_market_confidence] dla inwestycji i oprocentowania w kategorii [concept_loans]"
 spec_panic: "Panika finansowa"
 spec_panic_desc: "Skutki paniki ([concept_spec_financial_panic]) na rynku ([concept_market])"
 spec_panic_crunch: "Zapaść kredytowa"
 spec_panic_crunch_desc: "Banki wstrzymały udzielanie pożyczek, gdy trwa [concept_spec_financial_panic], przez co [concept_private_construction] jest ograniczona o połowę"
 spec_lev_boom: "Boom kredytowy"
 spec_bailout_fx_tt: "[concept_spec_bad_debts]: #P zmniejszone o połowę#!, znikną za #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_months')|0]#! mies. zamiast #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#!"
 spec_bailout_cost_tt: "[concept_treasury]: #N -@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_cost')|D]#!, około #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_share')|%0]#! wartości [concept_gdp]"
 spec_bailout_debts_tt: "Są [concept_spec_bad_debts] do usunięcia"
 spec_bailed_tt: "Państwo nie wykupiło złych kredytów, odkąd pojawiły się te [concept_spec_bad_debts]"
 spec_lev_boom_desc: "Kredyt bankowy zwiększa [concept_throughput] o #P +2%#! za każdy pełny miesiąc, jaki wynosi [concept_spec_leverage], maksymalnie o #P +24%#!."
 spec_credit_crunch: "Złe długi"
 spec_credit_crunch_desc: "Banki odpisują pożyczki z ostatniego boomu i nie pożyczają niczego, dopóki to nie minie. #v Pożycz bankom#! tego nie usuwa. #v Wykup złe kredyty#! zmniejsza to o połowę, raz na okres trwania."
 spec_loose_credit: "Łatwy kredyt"
 spec_loose_credit_desc: "Skutki, które wywołuje [concept_spec_credit_policy]"
 spec_tight_credit: "Ograniczony kredyt"
 spec_tight_credit_desc: "Skutki, które wywołuje [concept_spec_credit_policy]"
 spec_markets.1.t: "Mania spekulacyjna"
 spec_markets.1.d: "W stolicy ([ROOT.GetCountry.GetCapital.GetCityHubName]) fortuny powstają szybciej, niż można je zliczyć. Towary takie jak [ROOT.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName], [ROOT.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName] i [ROOT.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName] drożeją z tygodnia na tydzień, niemal codziennie powstają nowe spółki mające je wytwarzać, a banki bez namysłu pożyczają pod zastaw ich akcji. Mało kto pyta, ile to wszystko naprawdę jest warte.\n\nNiektórzy z grup $capitalists_no_icon$ i $shopkeepers_no_icon$ przypisują rządowi zasługę pomnożenia majątku i zasilają grupę określaną jako [Concept('concept_loyalist','$concept_loyalists|q$')]. Jeśli to potrwa, w kategorii [Concept('concept_political_movement','$concept_political_movements|q$')] zyskają poparcie zwolennicy prawa [GetLawType('law_laissez_faire').GetName]."
 spec_markets.1.d_generic: "W stolicy ([ROOT.GetCountry.GetCapital.GetCityHubName]) fortuny powstają szybciej, niż można je zliczyć. Ceny rosną z tygodnia na tydzień, niemal codziennie powstają nowe spółki, a banki bez namysłu pożyczają pod zastaw ich akcji. Mało kto pyta, ile to wszystko naprawdę jest warte.\n\nNiektórzy z grup $capitalists_no_icon$ i $shopkeepers_no_icon$ przypisują rządowi zasługę pomnożenia majątku i zasilają grupę określaną jako [Concept('concept_loyalist','$concept_loyalists|q$')]. Jeśli to potrwa, w kategorii [Concept('concept_political_movement','$concept_political_movements|q$')] zyskają poparcie zwolennicy prawa [GetLawType('law_laissez_faire').GetName]."
 spec_markets.1.f: "„Kupuj, mój chłopcze, i nie patrz na cenę. Ilekolwiek zapłacisz dziś, jutro znajdzie się ktoś, kto zapłaci więcej”."
 spec_markets.1.a: "Dobrobyt mówi sam za siebie."
 spec_markets.1.b: "Zalećmy umiar."
 spec_markets.1.b.tt: "[concept_spec_market_confidence] spada o #v 10#!"
 spec_markets.1.c: "Niech spekulanci zapłacą swoją część."
 spec_markets.1.c.tt: "[concept_spec_market_confidence] spada o #v 5#!"
 spec_markets.2.t: "Panika finansowa"
 spec_markets.2.d_crash: "Koniec boomu ([ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName]), największego z zakończonych boomów, przerodził się w powszechną panikę. Domy handlowe, które pożyczały pod zastaw jego ceny, upadają jeden po drugim, a deponenci od świtu stoją w kolejkach przed bankami ([ROOT.GetCountry.GetCapital.GetCityHubName]). Banki żądają zwrotu pożyczek na kwotę #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#!, a inwestorzy kurczowo trzymają to niewiele, co im zostało. [concept_private_construction] spadnie o połowę na #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! mies.\n\nZrujnowani $capitalists_no_icon$, $aristocrats_no_icon$ i $shopkeepers_no_icon$ obwiniają rząd, a niektórzy stają się: [Concept('concept_radical','$concept_radicals|q$')]. Wielu chce teraz, by państwo okiełznało rynki, a poparcie zyskują: [Concept('concept_political_movement','$concept_political_movements|q$')] przeciwko: [GetLawType('law_laissez_faire').GetName].[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_crash_no_loans: "Koniec boomu ([ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName]), największego z zakończonych boomów, przerodził się w powszechną panikę. Domy handlowe, które pożyczały pod zastaw jego ceny, upadają jeden po drugim, a deponenci od świtu stoją w kolejkach przed bankami ([ROOT.GetCountry.GetCapital.GetCityHubName]). Inwestorzy kurczowo trzymają to niewiele, co im zostało. [concept_private_construction] spadnie o połowę na #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! mies.\n\nZrujnowani $capitalists_no_icon$, $aristocrats_no_icon$ i $shopkeepers_no_icon$ obwiniają rząd, a niektórzy stają się: [Concept('concept_radical','$concept_radicals|q$')]. Wielu chce teraz, by państwo okiełznało rynki, a poparcie zyskują: [Concept('concept_political_movement','$concept_political_movements|q$')] przeciwko: [GetLawType('law_laissez_faire').GetName].[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign: "Panika ([ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName]) przeniknęła na nasze rynki. Domy handlowe, które tam handlowały lub pożyczały, upadają jeden po drugim, a deponenci od świtu stoją w kolejkach przed bankami ([ROOT.GetCountry.GetCapital.GetCityHubName]). Banki żądają zwrotu pożyczek na kwotę #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#!, a inwestorzy kurczowo trzymają to niewiele, co im zostało. [concept_private_construction] spadnie o połowę na #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! mies.\n\nZrujnowani $capitalists_no_icon$, $aristocrats_no_icon$ i $shopkeepers_no_icon$ obwiniają rząd, a niektórzy stają się: [Concept('concept_radical','$concept_radicals|q$')]. Wielu chce teraz, by państwo okiełznało rynki, a poparcie zyskują: [Concept('concept_political_movement','$concept_political_movements|q$')] przeciwko: [GetLawType('law_laissez_faire').GetName].[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign_no_loans: "Panika ([ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName]) przeniknęła na nasze rynki. Domy handlowe, które tam handlowały lub pożyczały, upadają jeden po drugim, a deponenci od świtu stoją w kolejkach przed bankami ([ROOT.GetCountry.GetCapital.GetCityHubName]). Inwestorzy kurczowo trzymają to niewiele, co im zostało. [concept_private_construction] spadnie o połowę na #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! mies.\n\nZrujnowani $capitalists_no_icon$, $aristocrats_no_icon$ i $shopkeepers_no_icon$ obwiniają rząd, a niektórzy stają się: [Concept('concept_radical','$concept_radicals|q$')]. Wielu chce teraz, by państwo okiełznało rynki, a poparcie zyskują: [Concept('concept_political_movement','$concept_political_movements|q$')] przeciwko: [GetLawType('law_laissez_faire').GetName].[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other: "Zaufanie załamało się w jednej chwili. Solidne firmy nie mogą pożyczyć za żadną cenę, a deponenci od świtu stoją w kolejkach przed bankami ([ROOT.GetCountry.GetCapital.GetCityHubName]). Banki żądają zwrotu pożyczek na kwotę #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#!, a inwestorzy kurczowo trzymają to niewiele, co im zostało. [concept_private_construction] spadnie o połowę na #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! mies.\n\nZrujnowani $capitalists_no_icon$, $aristocrats_no_icon$ i $shopkeepers_no_icon$ obwiniają rząd, a niektórzy stają się: [Concept('concept_radical','$concept_radicals|q$')]. Wielu chce teraz, by państwo okiełznało rynki, a poparcie zyskują: [Concept('concept_political_movement','$concept_political_movements|q$')] przeciwko: [GetLawType('law_laissez_faire').GetName].[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other_no_loans: "Zaufanie załamało się w jednej chwili. Solidne firmy nie mogą pożyczyć za żadną cenę, a deponenci od świtu stoją w kolejkach przed bankami ([ROOT.GetCountry.GetCapital.GetCityHubName]). Inwestorzy kurczowo trzymają to niewiele, co im zostało. [concept_private_construction] spadnie o połowę na #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! mies.\n\nZrujnowani $capitalists_no_icon$, $aristocrats_no_icon$ i $shopkeepers_no_icon$ obwiniają rząd, a niektórzy stają się: [Concept('concept_radical','$concept_radicals|q$')]. Wielu chce teraz, by państwo okiełznało rynki, a poparcie zyskują: [Concept('concept_political_movement','$concept_political_movements|q$')] przeciwko: [GetLawType('law_laissez_faire').GetName].[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.bad_debts: "Kredyty boomu okazały się złe. W nadchodzących miesiącach [concept_spec_bad_debts] obniżą [concept_throughput] o #N [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_tp_full_pct')|1]%#!, po czym osłabną i znikną po #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#! mies. Banki nie pożyczą niczego, dopóki nie znikną, a #v Pożycz bankom#! ich nie usunie."
