 SPEC_TM_REVOLUTION_TT: "#header [concept_revolution]: [Country.MakeScope.Var('spec_tm_revolution').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#N -2#! ze względu na: [concept_revolution]"
 concept_spec_market_confidence: "Zaufanie rynkowe"
 concept_spec_market_confidence_desc: "$concept_spec_market_confidence$ mierzy, jak inwestorzy postrzegają rynek ([concept_market]) danego państwa ([concept_country]), od #v 0#! (#v Panika#!) do #v 100#! (#v Mania#!). Strach spowalnia inwestycje i podnosi oprocentowanie w kategorii [concept_loans], a chciwość przyspiesza inwestycje.\n\nPodnoszą je towary przeżywające boom ([Concept('concept_good','$concept_goods|q$')]), a obniżają: [Concept('concept_spec_boom_end','$concept_spec_boom_ends|q$')], [Concept('concept_spec_foreign_panic','$concept_spec_foreign_panics|q$')], [Concept('concept_diplomatic_play','$concept_diplomatic_plays|q$')] i [concept_war]. Boomy i ich finały są silniejsze tam, gdzie $building_financial_district$ stanowią większą część gospodarki, a słabsze tam, gdzie przeważają nad nimi liczebnie: $building_manor_house$.\n\nPowyżej #v 55#! banki pożyczają do kategorii [concept_investment_pool], przy #v 80#! rynek wchodzi w stan: [concept_spec_speculative_mania], a poniżej #v 25#! zaczyna się [concept_spec_financial_panic]."
 concept_spec_speculative_mania: "Mania spekulacyjna"
 concept_spec_speculative_mania_desc: "[concept_market] ogarnia $concept_spec_speculative_mania$, gdy [concept_spec_market_confidence] wynosi co najmniej #v 80#!. Banki najmocniej zasilają wówczas fundusz [concept_investment_pool], ale [concept_spec_boom_end] bardziej obniża $concept_spec_market_confidence$. Długotrwała lub bardzo silna mania na kilka lat zwiększa poparcie w kategorii [Concept('concept_political_movement','$concept_political_movements|q$')] dla zwolenników prawa [GetLawType('law_laissez_faire').GetName]."
 concept_spec_financial_panic: "Panika finansowa"
 concept_spec_financial_panics: "Paniki finansowe"
 concept_spec_financial_panic_desc: "$concept_spec_financial_panic$ zaczyna się, gdy [concept_spec_market_confidence] spadnie poniżej progu paniki wynoszącego #v 25#!. Gdy [concept_spec_leverage] przekracza #v 3#! mies., próg rośnie, maksymalnie do #v 65#!. Przy niewielkiej liczbie: $building_financial_district$ jest niższy, minimalnie #v 20#!.\n\nObniża [concept_throughput] każdego budynku i pobierane podatki, co tydzień aż do jej końca kosztuje [concept_treasury] zasiłki dla bezrobotnych, spowalnia [concept_private_construction] i inwestycje, zmniejsza premię ([concept_throughput]) dla: [Concept('concept_company','$concept_companies|q$')], zmienia część inwestorów w: [Concept('concept_radical','$concept_radicals|q$')] i sprawia, że banki wycofują [concept_spec_outstanding_credit] z kategorii [concept_investment_pool].\n\nKażde powiązane państwo ([concept_country]) dotyka [concept_spec_foreign_panic], a pieniądze uciekają gdzie indziej, do spokojnych mocarstw ([Concept('concept_great_power','$concept_great_powers|q$')]). Przez kilka lat potem poparcie zyskują: [Concept('concept_political_movement','$concept_political_movements|q$')] przeciwko: [GetLawType('law_laissez_faire').GetName]."
 concept_spec_foreign_panic: "Zagraniczna panika"
 concept_spec_foreign_panics: "Zagraniczne paniki"
 concept_spec_foreign_panic_desc: "$concept_spec_foreign_panic$ obniża [concept_spec_market_confidence], gdy dane [concept_country] ma więzi z państwem, w którym zaczyna się [concept_spec_financial_panic]. Łączyć je może wspólny [concept_market], poddaństwo, prawa inwestycyjne, duże obroty handlowe lub własność gospodarki. Bliższe więzi oznaczają większe straty. Prawo [GetLawType('law_free_trade').GetName] wzmacnia więzi handlowe, a inne zasady handlu je osłabiają. [concept_embargo] zrywa więź handlową."
 concept_spec_boom_end: "Finał boomu"
 concept_spec_boom_ends: "Finały boomów"
 concept_spec_boom_end_desc: "Boom kończy się, gdy [concept_spec_investor_interest] towarem ([concept_good]) spada po wzroście, a im wyżej sięgnęło, tym mocniej spada: boom, który osiągnął szczyt na poziomie #v Ożywienie#!, kończy się finałem: [concept_spec_correction], na poziomie #v Zapał#!: [concept_spec_bust], a na poziomie #v Gorączka#!: [concept_spec_collapse].\n\nKażdy z nich obniża [concept_spec_market_confidence], bardziej przy większych boomach i dla towarów ([Concept('concept_good','$concept_goods|q$')]) o większym udziale w obrotach rynku ([concept_market]). Inwestorzy powstrzymują się następnie, dopóki $concept_good$ się nie odbuduje, a tam, gdzie wytwarza go [concept_company], jej branża traci [concept_throughput]. Szczyt, od którego jest mierzony, nieco słabnie co miesiąc, więc boom, który stygnie powoli, kończy się łagodniej lub wcale nie kończy się finałem ($concept_spec_boom_end$)."
 concept_spec_correction: "Korekta"
 concept_spec_correction_desc: "$concept_spec_correction$ to najłagodniejszy [concept_spec_boom_end]. Następuje, gdy [concept_spec_investor_interest], którego przedmiotem jest [concept_good], spada z osiągniętego wcześniej poziomu #v Ożywienie#! do poziomu #v Wątpliwości#!.\n\nNieznacznie obniża [concept_spec_market_confidence]. Następnie dany $concept_good$ czeka #v 3#! mies. powściągliwości inwestorów. Jeśli wytwarza go [concept_company], [concept_throughput] w jej branży spada o #N 2.5%#! na #v 90#! dni, o #N 25%#! więcej za każdą zbadaną technologię: [GetTechnology('corporate_charters').GetName] i [GetTechnology('corporate_management').GetName]."
 concept_spec_bust: "Zapaść"
 concept_spec_bust_desc: "$concept_spec_bust$ to dotkliwszy [concept_spec_boom_end] niż [concept_spec_correction]. Następuje, gdy [concept_spec_investor_interest], którego przedmiotem jest [concept_good], spada z osiągniętego wcześniej poziomu #v Zapał#! do poziomu #v Wątpliwości#!.\n\nMocniej obniża [concept_spec_market_confidence], około #v 2#! razy bardziej niż [concept_spec_correction] przy takim samym boomie. Następnie dany $concept_good$ czeka #v 6#! mies. powściągliwości inwestorów. Jeśli wytwarza go [concept_company], [concept_throughput] w jej branży spada o #N 5%#! na #v 180#! dni, o #N 25%#! więcej za każdą zbadaną technologię: [GetTechnology('corporate_charters').GetName] i [GetTechnology('corporate_management').GetName]."
 concept_spec_collapse: "Załamanie"
 concept_spec_collapse_desc: "$concept_spec_collapse$ to najgorszy [concept_spec_boom_end]. Następuje, gdy [concept_spec_investor_interest], którego przedmiotem jest [concept_good], spada z osiągniętego wcześniej poziomu #v Gorączka#! aż do poziomu #v Odpływ#!.\n\nGwałtownie obniża [concept_spec_market_confidence], około #v 5#! razy bardziej niż [concept_spec_correction] przy takim samym boomie. Następnie dany $concept_good$ czeka #v 12#! mies. powściągliwości inwestorów. Jeśli wytwarza go [concept_company], [concept_throughput] w jej branży spada o #N 10%#! na rok, o #N 25%#! więcej za każdą zbadaną technologię: [GetTechnology('corporate_charters').GetName] i [GetTechnology('corporate_management').GetName]. Jeśli $concept_spec_collapse$ obejmie dużą część obrotów, jakie odnotowuje [concept_market], może wybuchnąć [concept_spec_financial_panic]."
 concept_spec_investor_interest: "Zainteresowanie inwestorów"
 concept_spec_investor_interest_desc: "$concept_spec_investor_interest$ określa, jak atrakcyjne dla inwestorów są budynki ([Concept('concept_building','$concept_buildings|q$')]) wytwarzające towar ([concept_good]). Rośnie, gdy [concept_market_price] przekracza swoją średnią długoterminową, i spada, gdy jest poniżej, od #v Odpływ#! do #v Gorączka#!.\n\nPodąża za nim [concept_throughput] tych budynków, od #N -10%#! przy #v Odpływ#! do #P +8%#! przy #v Gorączka#!, a także [concept_prosperity] firm ([Concept('concept_company','$concept_companies|q$')]) wytwarzających ten towar ($concept_good$). Towar przeżywający boom ($concept_good$) podnosi [concept_spec_market_confidence]. Gdy zainteresowanie spada, boom kończy się finałem: [concept_spec_boom_end]."
 concept_spec_credit_policy: "Polityka kredytowa"
 concept_spec_credit_policy_tight: "Ograniczony kredyt"
 concept_spec_credit_policy_normal: "Normalny kredyt"
 concept_spec_credit_policy_loose: "Łatwy kredyt"
 concept_spec_credit_policy_desc: "$concept_spec_credit_policy$ określa, jak swobodnie banki pożyczają do kategorii [concept_investment_pool]. Wymaga: [GetTechnology('central_banking').GetName] i może być ustawiona na: $concept_spec_credit_policy_tight$, $concept_spec_credit_policy_normal$ lub $concept_spec_credit_policy_loose$. Ostrzejsza polityka spowalnia inwestycje i obniża [concept_spec_market_confidence], gdy jest wysokie, a łagodniejsza zwiększa: [concept_spec_outstanding_credit]. Zmiana blokuje ją na #v 6#! mies."
 concept_spec_leverage: "Dźwignia kredytowa"
 concept_spec_leverage_desc: "$concept_spec_leverage$ to [concept_spec_outstanding_credit] danego państwa ([concept_country]), mierzony w miesiącach dochodu w kategorii [concept_investment_pool].\n\nKażdy pełny miesiąc daje #P +2%#! [concept_throughput], maksymalnie #P +24%#!. Gdy trwa [concept_spec_financial_panic] lub istnieją [concept_spec_bad_debts], słabnie o #N 2%#! miesięcznie. Powyżej #v 3#! mies. [concept_spec_financial_panic] zaczyna się przy wyższym poziomie ([concept_spec_market_confidence]) i pozostawia [concept_spec_bad_debts]."
 concept_spec_bad_debts: "Złe długi"
 concept_spec_bad_debts_desc: "$concept_spec_bad_debts$ to straty po panice ([concept_spec_financial_panic]), rosnące wraz z wartością ([concept_spec_leverage]) powyżej #v 3#! mies.\n\nKażdy punkt obniża [concept_throughput] o #N 0.4%#!, a inwestycje o #N 0.75%#!. Narastają o #v 3#! pkt miesięcznie, a następnie maleją o #v 0.6#! pkt miesięcznie; w najgorszym razie znikają po około #v 6#! latach. Dopóki istnieją, banki nie pożyczają. #v Pożycz bankom#! ich nie usuwa. #v Wykup złe kredyty#! zmniejsza je o połowę, raz na okres ich trwania."
 concept_spec_lending_standards: "Standardy kredytowe"
 concept_spec_lending_standards_desc: "$concept_spec_lending_standards$ określają, jak ostrożnie pożyczają banki danego państwa ([concept_country]): #v Surowe#!, #v Ostrożne#!, #v Solidne#!, #v Luźne#! lub #v Lekkomyślne#!. Mniej ostrożne banki pożyczają więcej do kategorii [concept_investment_pool] i kierują więcej do boomów, więc te boomy kończą się gwałtowniej, a ratowanie banków kosztuje więcej.\n\nLuzują się nieco w każdym miesiącu bez paniki ([concept_spec_financial_panic]), od #v Surowe#! do #v Lekkomyślne#! w ciągu około #v 20#! spokojnych lat, a bardziej po każdym ratowaniu banków lub #v Wykup złe kredyty#!. Zaostrzają się, gdy kończy się boom, a przede wszystkim, gdy $concept_spec_financial_panic$ dobiega końca bez ratowania banków."
 concept_spec_outstanding_credit: "Niespłacony kredyt"
 concept_spec_outstanding_credit_desc: "$concept_spec_outstanding_credit$ to kredyt, którego banki udzieliły do kategorii [concept_investment_pool] i który nie został jeszcze spłacony. Banki pożyczają, gdy [concept_spec_market_confidence] przekracza #v 55#!, do limitu kredytowego wynoszącego #v 3#! mies. dochodu puli. [GetTechnology('central_banking').GetName] dodaje #v 5#! mies., a [GetTechnology('investment_banks').GetName] i [GetTechnology('international_exchange_standards').GetName] po #v 2#!.\n\nCo miesiąc #v 2%#! jest spłacane z puli. Gdy zaczyna się [concept_spec_financial_panic], część jest wycofywana.\n\n#lore Banki pożyczały pod zastaw akcji kolejowych w latach 40. XIX wieku, bawełny w 1837 roku i gruntów budowlanych w Wiedniu w 1873 roku, i zostały zaskoczone, gdy te boomy pękły.#!"
