 SPEC_RIVAL_RULE: "Co roku giełda z wyższym wynikiem ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]) zyskuje #P 5%#! wiarygodności, a druga traci #N 5%#! lub #N 7.5%#!, jeśli oba państwa są w złych lub gorszych stosunkach (przed efektami utraty wiarygodności). Dotyczy to obu, niezależnie od tego, która wskazała drugą.\nMożna wskazać: rynek o naszej pozycji lub o jedną wyższej, z wynikiem co najmniej równym naszemu. Światowe centrum nie wskazuje rywala.\nGdy trwa [concept_spec_financial_panic], uciekające pieniądze trafiają najpierw do rywala.\nSojusz, pakt obronny lub prawa inwestycyjne między tymi państwami kończą rywalizację."
