 spec_lever_market_tt: "Obowiązujące zasady, $ECONOMIC_SYSTEM_GC_LINK$, pozwalają inwestorom reagować na ceny"
 spec_lever_not_restrain_tt: "Spekulacja tym towarem nie jest ograniczona"
 spec_lever_not_encourage_tt: "Inwestycje w ten towar nie są objęte zachętami"
 spec_levers: "Interwencje rynkowe"
 spec_lever_authority_tt: "Dostępny jest wystarczający zasób [concept_authority]"
 spec_lever_fits_restrain_tt: "[concept_spec_investor_interest] osiąga co najmniej poziom #v Zapał#! lub koniec boomu obniżyłby [concept_spec_market_confidence] o co najmniej #v 2#!"
 spec_lever_fits_encourage_tt: "[concept_spec_investor_interest] jest poniżej poziomu #v Ożywienie#!, [concept_good] nie przechodzi odbudowy po boomie ani nie jest objęty boomem, którego finałem mogłaby być [concept_spec_bust] lub [concept_spec_collapse]"
 SPEC_LEVER_RESTRAIN_TT: "#header Ogranicz spekulację: [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_investor_interest]: spada do poziomu #v Spokój#! w ciągu kilku miesięcy\n[concept_authority]: #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#! miesięcznie#indent_newline:3 \n#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! ze względu na wartość bazową (połowa podatku konsumpcyjnego od niej)\n#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! ze względu na udział w obrotach (#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! naszego rynku)#!\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_DOWN', 'SPEC_LEVER_NONE')][concept_budget_additional_income]: #P @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_levy_', Goods.GetKey))|D]#! tygodniowo, danina w wysokości 10% naszej tygodniowej produkcji po cenie bazowej\n\nPodczas ograniczenia jego boom nie może rosnąć ani nagle się skończyć. Wygasa stopniowo w ciągu mniej więcej roku, kończąc się finałem: [concept_spec_correction], i co miesiąc nieco obniża [concept_spec_market_confidence].\n\n#lore Podobnie jak Bubble Act z 1720 roku, który ograniczył zakładanie nowych spółek akcyjnych po pęknięciu bańki Kompanii Mórz Południowych.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_restrain_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_restrain').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_LEVER_ENCOURAGE_TT: "#header Zachęć do inwestycji: [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_investor_interest]: wzrasta do poziomu #v Ożywienie#! w ciągu kilku miesięcy\n[concept_authority]: #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#! miesięcznie#indent_newline:3 \n#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! ze względu na wartość bazową (połowa podatku konsumpcyjnego od niej)\n#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! ze względu na udział w obrotach (#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! naszego rynku)#!\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_UP', 'SPEC_LEVER_NONE')][concept_budget_additional_expenses]: #N @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_subsidy_', Goods.GetKey))|D]#! tygodniowo, subsydium w wysokości 20% naszej tygodniowej produkcji po cenie bazowej\n\nZnika samoczynnie, gdy [concept_good] osiągnie poziom #v Zapał#!, aby jego boom mógł zakończyć się sam.\n\n#lore Podobnie jak gwarantowane zyski, które Indie Brytyjskie i Francja oferowały inwestorom kolejowym w połowie XIX wieku.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_encourage_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_encourage').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_LEVER_TP_DOWN: "[concept_throughput] producentów: #N -10%#!\n"
 SPEC_LEVER_TP_UP: "[concept_throughput] producentów: #P +10%#!\n"
 SPEC_LEVER_LIFT: "\n\nObowiązuje\n#instruction Kliknij, aby znieść#!"
 SPEC_LEVER_NONE: ""
 SPEC_LEVERS_RIGHT: "[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_levers_used'), '(CFixedPoint)0'), SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_levers_used'), '(CFixedPoint)1'), 'SPEC_LEVERS_ONE', 'SPEC_LEVERS_MANY'), 'SPEC_LEVER_NONE')]"
 SPEC_LEVERS_ONE: "Interwencje: 1: #N -[Country.MakeScope.ScriptValue('spec_lever_authority')|0]#! @aut!"
 SPEC_LEVERS_MANY: "Interwencje: [Country.MakeScope.ScriptValue('spec_levers_used')|0]: #N -[Country.MakeScope.ScriptValue('spec_lever_authority')|0]#! @aut!"
 concept_spec_intervention: "Interwencja"
 concept_spec_intervention_desc: "$concept_spec_intervention$ pozwala rządowi zastosować wobec towaru ([concept_good]) #v Ogranicz spekulację#! lub #v Zachęć do inwestycji#!.\n\n#v Ogranicz spekulację#!: [concept_spec_investor_interest] spada do poziomu #v Spokój#!, producenci #N -10%#! [concept_throughput] i danina w wysokości #v 10%#! tygodniowej produkcji po cenie bazowej\n#v Zachęć do inwestycji#!: zainteresowanie rośnie do poziomu #v Ożywienie#!, producenci #P +10%#! [concept_throughput] i subsydium w wysokości #v 20%#!\n\nKażda kosztuje [concept_authority] co miesiąc aż do zniesienia, więcej w przypadku dóbr podstawowych i towarów o dużym udziale w obrotach rynku ([concept_market])."
 SPEC_LEVER_ISSUE_TT: "#header Przeprowadź wielką emisję: [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\nPrzez #v 2#! lat:\nWynik ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]): #P +25%#!\nPożyczki bankowe w ten towar liczą się #N x1.5#!, gdy kończy się jego boom\nWiarygodność zyskana lub utracona, gdy kończy się jego boom: #v x2#!\n$TOOLTIP_DELIMITER$\nWymaga pozycji Krajowa lub wyższej, poziomu #v Zapał#! lub wyższego ([concept_spec_investor_interest]) i braku interwencji ([concept_spec_intervention]). Jedna wielka emisja naraz; następną można przeprowadzić #v 1#! r. po zakończeniu tej.[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_issue_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_ISSUE_ON', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_issue').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_ISSUE_ON: "\n\nTrwa emisja, której przedmiotem jest ten [concept_good]"
 spec_issue_stand_tt: "Nasza [concept_spec_exchange] ma pozycję co najmniej #v Krajowa#!"
 spec_issue_hot_tt: "[concept_spec_investor_interest] na poziomie #v Zapał#! lub wyższym"
 spec_issue_one_tt: "Nie trwa żadna inna emisja"
 spec_issue_cool_tt: "Od ostatniej emisji rynek odpoczywał już rok"
 spec_issue_no_lever_tt: "Ten towar ([concept_good]) nie jest objęty interwencją ([concept_spec_intervention])"
 spec_lever_no_issue_tt: "Nie trwa wielka emisja na ten towar ([concept_good])"
 SPEC_LEVERS_TT: "#header Interwencje rynkowe#!\n[concept_authority]: #N -[Country.MakeScope.ScriptValue('spec_lever_authority')|0]#! miesięcznie\n$TOOLTIP_DELIMITER$\nOgraniczone: #v [Country.MakeScope.ScriptValue('spec_n_restrain')|0]#!\nWspierane: #v [Country.MakeScope.ScriptValue('spec_n_encourage')|0]#!\n[concept_budget_additional_income]: #P @money![Country.MakeScope.ScriptValue('spec_lever_levy')|D]#! tygodniowo\n[concept_budget_additional_expenses]: #N @money![Country.MakeScope.ScriptValue('spec_lever_spend')|D]#! tygodniowo"
 spec_story.1.t: "[ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName]: załamanie rynku"
 spec_story.1.t_generic: "Załamanie rynku"
 spec_story.1.d: "Skończył się pęd do inwestowania w towar [ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName]. Ceny, które rosły przez rok, runęły w miesiąc, a spółki założone u szczytu gorączki nie mogą regulować rachunków. Kupcy, którzy kupowali za każdą cenę, zostali z magazynami, których nie potrafią opróżnić, a banki udzielające pożyczek pod zastaw ich zapasów liczą straty."
 spec_story.1.d_generic: "Skończył się pęd do inwestowania w najmodniejsze towary sezonu. Ceny, które rosły przez rok, runęły w miesiąc, a spółki założone u szczytu gorączki nie mogą regulować rachunków. Kupcy, którzy kupowali za każdą cenę, zostali z magazynami, których nie potrafią opróżnić, a banki udzielające pożyczek pod zastaw ich zapasów liczą straty."
 spec_story.1.f: "„Od trzydziestu lat moją branżą jest [ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName], lecz nigdy nie widziałem ludzi tak chętnych do kupna ani tak rozpaczliwie szukających nabywcy jak w tym ostatnim roku”."
 spec_story.1.f_generic: "„Od trzydziestu lat zajmuję się tym handlem, lecz nigdy nie widziałem ludzi tak chętnych do kupna ani tak rozpaczliwie szukających nabywcy jak w tym ostatnim roku”."
 spec_story.1.a: "Pomóżmy zrujnowanym producentom."
 spec_story.1.b: "Niech najsłabsze domy handlowe upadną."
 spec_story.1.c: "Zbadajmy poczynania założycieli spółek."
 spec_story.2.t: "Ujawnione oszustwo"
 spec_story.2.d: "Dyrektorzy spółki „[ROOT.GetCountry.GetCapital.GetCityHubName]: [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName]” uciekli z kraju, a jej księgi ujawniły, że sowite dywidendy z ostatnich dwóch lat wypłacano z nowych zapisów na akcje. Jej udziałowcami były tysiące urzędników, wdów i właścicieli sklepów. W stolicy ([ROOT.GetCountry.GetCapital.GetCityHubName]) każda gazeta pyta teraz, ile innych prospektów wyszło spod tej samej ręki."
 spec_story.2.d_generic: "Dyrektorzy słynnej spółki akcyjnej ze stolicy ([ROOT.GetCountry.GetCapital.GetCityHubName]) uciekli z kraju, a jej księgi ujawniły, że sowite dywidendy z ostatnich dwóch lat wypłacano z nowych zapisów na akcje. Jej udziałowcami były tysiące urzędników, wdów i właścicieli sklepów. W stolicy ([ROOT.GetCountry.GetCapital.GetCityHubName]) każda gazeta pyta teraz, ile innych prospektów wyszło spod tej samej ręki."
 spec_story.2.f: "#bold Poszukiwany pod zarzutem oszustwa#!\nDyrektor zarządzający spółką „[ROOT.GetCountry.GetCapital.GetCityHubName]: [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName]”, lat około pięćdziesięciu, dobrze ubrany, o wzbudzającym zaufanie obejściu. Ostatnio widziany w dokach."
 spec_story.2.f_generic: "#bold Poszukiwany pod zarzutem oszustwa#!\nDyrektor zarządzający spółką akcyjną ze stolicy ([ROOT.GetCountry.GetCapital.GetCityHubName]), lat około pięćdziesięciu, dobrze ubrany, o wzbudzającym zaufanie obejściu. Ostatnio widziany w dokach."
 spec_story.2.a: "Postawmy dyrektorów przed sądem."
 spec_story.2.b: "Zatuszujmy sprawę."
 spec_story.2.c: "Wypłaćmy odszkodowania drobnym inwestorom."
 spec_story.3.t: "Szturm na banki"
 spec_story.3.d: "Dziś rano w stolicy ([ROOT.GetCountry.GetCapital.GetCityHubName]) deponenci oblegli jeden z najstarszych banków, a do południa zamknięto jego drzwi. W całym mieście odmawia się przyjmowania jego banknotów, a firmy, które prowadziły tam rachunki, nie mogą w tym tygodniu wypłacić pensji robotnikom. Kolejki przed pozostałymi bankami wydłużają się z godziny na godzinę."
 spec_story.3.f: "„Mój ojciec trzymał oszczędności w tym banku, a przed nim jego ojciec. Mówiono nam, że jest równie pewny jak skarb państwa”."
 spec_story.3.a: "Zagwarantujmy jego depozyty."
 spec_story.3.b: "Musi sobie poradzić sam albo upaść."
 spec_story.3.c: "Musimy pożyczyć bankom."
 spec_story.4.t: "Panika: [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]"
 spec_story.4.t_generic: "Panika za granicą"
 spec_story.4.d: "Do stolicy ([ROOT.GetCountry.GetCapital.GetCityHubName]) dotarła wieść, że w państwie [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] wybuchła [concept_spec_financial_panic]. Tamtejsze banki żądają zwrotu zagranicznych pożyczek, a naszym firmom, które sprzedawały towary do państwa [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] lub pożyczały tam pieniądze, nagle brakuje środków. Każdy kupiec na giełdzie chce wiedzieć, czy kłopoty się rozprzestrzenią."
 spec_story.4.d_generic: "Do stolicy ([ROOT.GetCountry.GetCapital.GetCityHubName]) dotarła wieść o panice finansowej za granicą. Zagraniczne banki żądają zwrotu pożyczek, a naszym firmom, które sprzedawały towary lub pożyczały pieniądze za morzem, nagle brakuje środków. Każdy kupiec na giełdzie chce wiedzieć, czy kłopoty się rozprzestrzenią."
 spec_story.4.f: "„Gdy państwo [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] kicha, nasza giełda kładzie się do łóżka”."
 spec_story.4.f_generic: "„Gdy sąsiedzi kichają, nasza giełda kładzie się do łóżka”."
 spec_story.4.a: "Udzielmy pożyczek naszym domom handlowym."
 spec_story.4.b: "Ich kłopoty nie są naszymi."
 spec_story.4.c: "Obwińmy lekkomyślnych zagranicznych bankierów."
 spec_story.5.t: "Powrót zaufania"
 spec_story.5.d: "Najgorsza część paniki minęła. Ocalałe firmy znów zatrudniają robotników, banki zaczęły pożyczać solidnym klientom, a kilku śmiałych inwestorów kupuje akcje za ułamek zeszłorocznych cen. Nikt nie spodziewa się rychłego powrotu dawnych ekscesów, lecz miasto [ROOT.GetCountry.GetCapital.GetCityHubName] znów jest gotowe robić interesy."
 spec_story.5.f: "„Ci, którzy wiosną sprzedali wszystko, jesienią to odkupują i płacą mniej, niż sami dostali”."
 spec_story.5.a: "Zachęćmy do nowych przedsięwzięć."
 spec_story.5.b: "Tym razem pożyczajmy rozważnie."
 spec_story.6.t: "Deputacja fabrykantów"
 spec_story.6.d: "Do rządu przybyła deputacja fabrykantów i kupców. Twierdzą, że ich nowe zakłady stoją niedokończone z braku kredytu, podczas gdy zagraniczni rywale swobodnie pożyczają pieniądze i przejmują ich rynki. Proszą, by bankom znów pozwolono udzielać pożyczek."
 spec_story.6.f: "„Pańska ostrożność, szanowny panie, uchroniła nas przed krachem, pilnując, by nie zostało już nic, co mogłoby się załamać”."
 spec_story.6.a: "Złagodźmy politykę kredytową."
 spec_story.6.b: "Kredyt pozostanie ograniczony."
 spec_story.6.c: "Zamiast tego zaproponujmy im subsydium."
 spec_story.7.t: "Gorączka akcji"
 spec_story.7.d: "W stolicy ([ROOT.GetCountry.GetCapital.GetCityHubName]) urzędnicy, właściciele sklepów i nauczyciele tłoczą się w kawiarniach, handlując akcjami firm, których nigdy nie widzieli. Akcje przedsięwzięć w branży [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] zmieniają właścicieli kilka razy dziennie, w większości kupowane za pożyczone pieniądze. Mówi się, że służba zastawia swoje oszczędności, aby wziąć udział w kolejnej emisji."
 spec_story.7.d_generic: "W stolicy ([ROOT.GetCountry.GetCapital.GetCityHubName]) urzędnicy, właściciele sklepów i nauczyciele tłoczą się w kawiarniach, handlując akcjami firm, których nigdy nie widzieli. Akcje najnowszych przedsięwzięć zmieniają właścicieli kilka razy dziennie, w większości kupowane za pożyczone pieniądze. Mówi się, że służba zastawia swoje oszczędności, aby wziąć udział w kolejnej emisji."
 spec_story.7.f: "„Mój balwierz dał mi dziś rano radę w sprawie akcji w branży [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName]. Wziąłem ją sobie do serca i odpłaciłem własną: sprzedawaj”."
 spec_story.7.f_generic: "„Mój balwierz dał mi dziś rano radę w sprawie akcji. Wziąłem ją sobie do serca i odpłaciłem własną: sprzedawaj”."
 spec_story.7.a: "Niech lud ma udział w bogactwie."
 spec_story.7.b: "Zakażmy obrotu za pożyczone pieniądze."
 spec_story.7.c: "Nałóżmy opłatę stemplową na obrót akcjami."
 spec_story.8.t: "Przestrogi przed bańką"
 spec_story.8.d: "Szanowany ekonomista napisał do czołowej gazety w stolicy ([ROOT.GetCountry.GetCapital.GetCityHubName]), że wzrost cen towarów takich jak [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] i [ROOT.GetCountry.MakeScope.Var('spec_story_good2').GetGoods.GetName] nie może trwać wiecznie, a banki udzielały pożyczek przyjmując wyceny, których żaden trzeźwo myślący nabywca by nie uznał. Maklerzy nazywają to krakaniem starej baby. Mimo to list odczytuje się na głos w każdym klubie i kantorze miasta."
 spec_story.8.d_generic: "Szanowany ekonomista napisał do czołowej gazety w stolicy ([ROOT.GetCountry.GetCapital.GetCityHubName]), że wzrost cen najmodniejszych towarów nie może trwać wiecznie, a banki udzielały pożyczek przyjmując wyceny, których żaden trzeźwo myślący nabywca by nie uznał. Maklerzy nazywają to krakaniem starej baby. Mimo to list odczytuje się na głos w każdym klubie i kantorze miasta."
 spec_story.8.f: "„Cena to tylko kwota, którą ostatni nabywca był gotów zapłacić. Proszę czytelników, by zastanowili się, ilu nabywców jeszcze zostało”."
 spec_story.8.a: "Przestroga przyszła w porę."
 spec_story.8.b: "Panika i niedorzeczności."
