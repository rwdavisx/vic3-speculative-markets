 spec_rescue_alert_setting_name: "Można ratować banki"
 alert_spec_rescue_alert_desc: "Trwa [concept_spec_financial_panic], a my jeszcze nie pożyczyliśmy bankom."
 alert_spec_rescue_alert_hint: "#v Pożycz bankom#! skraca panikę, zmniejsza jej skutki o połowę i podnosi [concept_spec_market_confidence] o #P +20#!. Raz na panikę, w zakładce #bold $SPEC_FIN_TAB_BANKING$#! w oknie #bold $SPEC_FINANCE$#!."
