 spec_excess_bar: "Nadmiar spekulacyjny"
 concept_spec_speculative_excess: "Nadmiar spekulacyjny"
 concept_spec_speculative_excess_desc: "$concept_spec_speculative_excess$ mierzy rozmiar bańki, która narasta podczas boomu na rynku ([concept_market]), jaki tworzy dane [concept_country]. Po zbadaniu technologii [GetTechnology('stock_exchange').GetName] rośnie w każdym miesiącu, w którym [concept_spec_market_confidence] wynosi co najmniej #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!, i tym szybciej, im wyżej sięga $concept_spec_market_confidence$. Gdy $concept_spec_market_confidence$ pozostaje między #v 60#! a #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!, maleje o #v 2%#! miesięcznie.\n\nGdy $concept_spec_market_confidence$ spada poniżej #v 60#!, bańka pęka, a $concept_spec_market_confidence$ spada jeszcze bardziej, nawet o #v [GetPlayer.MakeScope.ScriptValue('spec_burst_max')|0]#!. Im większy $concept_spec_speculative_excess$, tym dotkliwszy spadek."
 concept_spec_sound_finance: "Zdrowe finanse"
 concept_spec_sound_finance_desc: "$concept_spec_sound_finance$ osiąga się, gdy zostaną wprowadzone wszystkie trzy [concept_spec_banking_reforms]: zasady emisji banknotów, pożyczkodawca ostatniej instancji i prawo spółek.\n\nGdy wszystkie trzy obowiązują, dane [concept_country] zyskuje #v 10#! pkt. wskaźnika [concept_prestige] i płaci o #v 5%#! mniej odsetek w kategorii [concept_loans]."
 concept_spec_banking_reforms: "Reformy bankowe"
 concept_spec_banking_reform: "Reforma bankowa"
 concept_spec_banking_reforms_desc: "$concept_spec_banking_reforms$ ustalają zasady działania banków i firm danego państwa ([concept_country]). Każda staje się dostępna wraz z technologią i jest wprowadzana przez komisję śledczą, która może obradować po panice ([concept_spec_financial_panic]) lub po #v 10#! latach bez niej. Każda komisja wprowadza jedną reformę.\n\n#bold Zasady emisji banknotów#! ([GetTechnology('banking').GetName]), jedna z dwóch:\n#bold Szkoła obiegowa:#! $spec_reform_currency_tt$\n#bold Wolna bankowość:#! $spec_reform_free_tt$\n\n#bold Pożyczkodawca ostatniej instancji#! ([GetTechnology('central_banking').GetName]): $spec_reform_llr_tt$\n\n#bold Prawo spółek#! ([GetTechnology('joint_stock_companies').GetName]): $spec_reform_company_tt$\n\nWprowadzenie wszystkich trzech zapewnia: [concept_spec_sound_finance]."
 alert_spec_panic_risk_alert_name: "Ryzyko paniki"
 spec_panic_risk_alert_setting_name: "Ryzyko paniki"
 alert_spec_panic_risk_alert_desc: "Gdyby nasze boomy skończyły się teraz, [concept_spec_market_confidence] spadłoby do #N [GetPlayer.MakeScope.ScriptValue('spec_after_collapse')|0]#!, poniżej progu #v [GetPlayer.MakeScope.ScriptValue('spec_panic_at')|0]#!, przy którym zaczyna się [concept_spec_financial_panic]."
 alert_spec_panic_risk_alert_hint: "Ogranicz spekulację najbardziej zagrożonymi towarami lub zaostrz zasady ([concept_spec_credit_policy]) w zakładce #bold $SPEC_FIN_TAB_BANKING$#! w oknie #bold $SPEC_FINANCE$#!."
