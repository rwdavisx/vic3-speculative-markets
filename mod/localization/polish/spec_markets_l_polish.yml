 spec_relief_when_tt: "Trwa [concept_spec_financial_panic] lub [concept_spec_long_depression]"
 spec_relief_cd_tt: "W ciągu ostatnich #v 12#! mies. nie prowadzono robót publicznych"
 spec_suspend_tt: "[concept_spec_financial_panic] kończy się w ciągu #v 2#! mies., do tego czasu w pełnej sile\n[concept_spec_market_confidence] rośnie o #v 15#!\nPrzez #v 10#! lat [concept_spec_speculative_excess] narasta o #v 50%#! szybciej\n[concept_spec_lending_standards] luzują się jak po ratowaniu banków"
 spec_suspend_act: "Zawieś ustawę bankową"
 spec_suspend_act_desc: "Pozwól bankowi pożyczać ponad limit, jaki ustawa nakłada na jego banknoty. Panika słabnie w ciągu kilku miesięcy bez kosztów dla skarbu, ale inwestorzy uczą się, że rząd zawsze pospieszy z pomocą. Liczy się jako #v Pożycz bankom#! w przypadku tej paniki.\n\n#lore Wielka Brytania zawieszała ustawę Bank Charter Act w latach 1847, 1857 i 1866.#!"
 spec_relief_works_button: "Roboty publiczne"
 spec_relief_works_button_desc: "Sfinansuj roboty publiczne i pomoc na czas zastoju: świadczenia, więcej budowy i mniej radykałów przez #v 12#! mies. Tygodniowy koszt rośnie wraz ze wskaźnikiem [concept_gdp]."
 spec_convert_debt: "Konwertuj dług państwowy"
 spec_convert_debt_desc: "Gdy inwestorzy są pełni optymizmu, zamień nasze pożyczki na nowe, niżej oprocentowane. Posiadacze obligacji, którzy żyli z dawnych odsetek, nie będą nam wdzięczni."
 spec_inquiry: "Komisja śledcza"
 spec_inquiry_desc: "Powołaj komisję, która wysłucha bankierów, maklerów i zrujnowanych deponentów, a następnie przedstawi zalecenia dotyczące zarządzania bankami i firmami. Jej sprawozdanie wprowadza jedną reformę z kategorii [Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')], na którą pozwalają nasze technologie. Obrady zajmują uwagę rządu przez #v 6#! mies."
 spec_debt_converted: "Konwersja długu"
 spec_debt_converted_desc: "Pożyczki skonwertowane na niższe oprocentowanie, gdy inwestorzy chętnie pożyczali"
 spec_relief_works: "Roboty publiczne"
 spec_relief_works_desc: "Roboty publiczne i pomoc dla tych, których zastój pozbawił pracy"
 spec_relief_costs: "Koszty robót publicznych"
 spec_relief_costs_desc: "Koszt robót publicznych"
 spec_act_suspended: "Zawieszenie ustawy bankowej"
 spec_act_suspended_desc: "Rząd odstąpił od własnej ustawy, aby zakończyć panikę"
 spec_inquiry_sitting: "Komisja śledcza"
 spec_inquiry_sitting_desc: "Komisja wysłuchuje zeznań w sprawie ostatniej paniki"
 spec_sound_finance: "Zdrowe finanse"
 spec_sound_finance_desc: "Pieniądz, banki i firmy działają według zasad, którym ufają inwestorzy"
 spec_rentiers_cut: "Obniżka dochodów rentierów"
 spec_relief_thanks: "Roboty publiczne"
 spec_dear_money: "Drogi pieniądz"
 spec_free_issue: "Wolna bankowość"
 spec_disclosure_burden: "Obowiązek sprawozdawczy"
 spec_disclosure_welcomed: "Obowiązek sprawozdawczy"
 spec_reform_currency_tt: "Banki udzielają o #v 25%#! mniej pożyczek, [concept_spec_speculative_excess] narasta o #v 25%#! wolniej, a czas trwania zjawiska [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')] wydłuża się o #v 25%#!\nUmożliwia zawieszenie ustawy bankowej podczas paniki"
 spec_reform_free_tt: "Banki udzielają o #v 25%#! więcej pożyczek, boomy są o #v 10%#! większe, a ich finały obniżają [concept_spec_market_confidence] o #v 10%#! bardziej"
 spec_reform_llr_tt: "#v Pożycz bankom#! kosztuje o #v 50%#! mniej i kończy panikę miesiąc wcześniej"
 spec_reform_company_tt: "Finały boomów obniżają [concept_spec_market_confidence] o #v 30%#! mniej"
 spec_reform.1.t: "Komisja śledcza"
 spec_reform.1.d_panic: "Komisja powołana po panice przedłożyła sprawozdanie: trzy tomy zeznań bankierów, maklerów i zrujnowanych deponentów. Jej członkowie są zgodni, że panika nie była dopustem bożym. Niemal we wszystkim innym się różnią, a każde rozwiązanie ma w izbie swoich orędowników."
 spec_reform.1.d_calm: "Korzystając ze spokoju na rynkach, komisja przez rok wysłuchiwała bankierów, maklerów i ekonomistów politycznych w sprawie sposobów zapobieżenia katastrofalnemu końcowi kolejnego boomu. Jej sprawozdanie przedstawia kilka rozwiązań, a każde ma w izbie swoich orędowników."
 spec_reform.1.f: "„W czasach powszechnej trwogi jeden upadek pociąga za sobą wiele innych, a najlepszym sposobem powstrzymania kolejnych jest zapobieżenie temu pierwszemu, który je wywołuje”."
 spec_reform.1.a: "Powiążmy emisję banknotów ze złotem w skarbcach."
 spec_reform.1.b: "Niech każdy solidny bank emituje własne banknoty."
 spec_reform.1.c: "Wyznaczmy pożyczkodawcę ostatniej instancji."
 spec_reform.1.d: "Zobowiążmy firmy do publikowania sprawozdań."
 spec_reform.1.e: "Podziękujmy komisji za jej trud."
 spec_reform.2.t: "Zdrowe finanse"
 spec_reform.2.d: "Nasze banki emitują banknoty według ustalonych zasad, pożyczkodawca czuwa na wypadek paniki, a firmy muszą wykazywać inwestorom, co posiadają i ile są winne. Za granicą nasze obligacje sprzedaje się teraz powyżej wartości nominalnej, a miasto [ROOT.GetCountry.GetCapital.GetCityHubName] uchodzi za bezpieczną przystań dla kapitału."
 spec_reform.2.f: "„Pierwszym obowiązkiem bankiera nie jest zarabiać pieniądze, lecz ich strzec”."
 spec_reform.2.a: "Zaufanie jest podstawą kredytu."
