 SPEC_RISK_TT: "#header Ryzyko: $SPEC_UNWIND$#!\n[concept_spec_market_confidence] w razie końca boomu: #N -[Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#!\n$TOOLTIP_DELIMITER$\n#v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_peak_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1')|1]#! ze względu na szczyt ([concept_spec_investor_interest]: #v [Country.MakeScope.Var(Concatenate('spec_peak_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#!)\n[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_sev_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_WHY_END_3', SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_sev_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_WHY_END_2', 'SPEC_WHY_END_1'))]\n#v x[Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey))|%0]#! ze względu na udział w obrotach (#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! w kategorii [concept_market], pełny efekt przy #v 3%#!)\n#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Country.MakeScope.ScriptValue('spec_crash_scale')|2]#!#!#! ze względu na: [concept_spec_market_conditions][AddLocalizationIf(GreaterThan_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_risk_raw_', Goods.GetKey)), Country.MakeScope.ScriptValue('spec_crash_scale')), '(CFixedPoint)40'), 'SPEC_WHY_CAP')][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_hype_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_hprev_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')), 'SPEC_WHY_FALLING')]\n$TOOLTIP_DELIMITER$\n$SPEC_UNWIND_DESC$"
 SPEC_CURRENT_GOODS_FILTERS: "[SelectLocalization(GetVariableSystem.HasValue('spec_il_cat', 'staple'), 'STAPLE_FILTER_NAME', SelectLocalization(GetVariableSystem.HasValue('spec_il_cat', 'industrial'), 'INDUSTRIAL_FILTER_NAME', SelectLocalization(GetVariableSystem.HasValue('spec_il_cat', 'luxury'), 'LUXURY_FILTER_NAME', SelectLocalization(GetVariableSystem.HasValue('spec_il_cat', 'military'), 'MILITARY_FILTER_NAME', 'ALL_GOODS'))))]"
 SPEC_COL_LEVER: "Interwencja"
 SPEC_COL_LEVER_TT: "#header Interwencje rynkowe#!\n$TOOLTIP_DELIMITER$\nOgranicz spekulację: zainteresowanie utrzymane na poziomie #v Spokój#!, producenci tracą [concept_throughput] i płacą daninę\nZachęć do inwestycji: zainteresowanie co najmniej na poziomie #v Ożywienie#!, producenci zyskują [concept_throughput], a państwo za to płaci\n\nKażda kosztuje [concept_authority] co miesiąc aż do zniesienia, więcej w przypadku dóbr podstawowych i towarów o dużym udziale w obrotach rynku. Spekulację można ograniczyć w towarach na poziomie #v Zapał#! i #v Gorączka#! lub w towarze, którego koniec boomu obniżyłby [concept_spec_market_confidence] o #v 2#! lub więcej. Do inwestycji można zachęcać w towarach poniżej poziomu #v Ożywienie#!."
 SPEC_SEP_FEVERISH_TT: "#header @spec_interest_feverish! [concept_spec_investor_interest]: Gorączka#!\nUdział w naszych obrotach: #v [Country.MakeScope.Var('spec_heat_6').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] producentów: #P +8%#!\n[concept_spec_market_confidence]: #P Wzrost#! co miesiąc, większy przy większym udziale w obrotach, chyba że trwa [concept_spec_financial_panic]\nMożliwy finał: [concept_spec_collapse]"
 SPEC_SEP_EAGER_TT: "#header @spec_interest_eager! [concept_spec_investor_interest]: Zapał#!\nUdział w naszych obrotach: #v [Country.MakeScope.Var('spec_heat_5').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] producentów: #P +5%#!\n[concept_spec_market_confidence]: #P Wzrost#! co miesiąc, większy przy większym udziale w obrotach, chyba że trwa [concept_spec_financial_panic]\nMożliwy finał: [concept_spec_bust]"
 SPEC_SEP_KEEN_TT: "#header @spec_interest_keen! [concept_spec_investor_interest]: Ożywienie#!\nUdział w naszych obrotach: #v [Country.MakeScope.Var('spec_heat_4').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] producentów: #P +3%#!\nMożliwy finał: [concept_spec_correction]"
 SPEC_SEP_CALM_TT: "#header @spec_interest_calm! [concept_spec_investor_interest]: Spokój#!\nUdział w naszych obrotach: #v [Country.MakeScope.Var('spec_heat_3').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\nBrak skutków"
 SPEC_SEP_DOUBTFUL_TT: "#header @spec_interest_doubtful! [concept_spec_investor_interest]: Wątpliwości#!\nUdział w naszych obrotach: #v [Country.MakeScope.Var('spec_heat_2').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] producentów: #N -5%#!\nPo zakończeniu boomu zainteresowanie towarem przez pewien czas nie przekracza tego poziomu"
 SPEC_SEP_FLEEING_TT: "#header @spec_interest_fleeing! [concept_spec_investor_interest]: Odpływ#!\nUdział w naszych obrotach: #v [Country.MakeScope.Var('spec_heat_1').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] producentów: #N -10%#!\nJeśli boom na poziomie #v Gorączka#! spadnie tak nisko, nastąpi [concept_spec_collapse]"
 SPEC_IB_TURNING_TT: "#header Odwrót boomu#!\nTowar [Goods.GetName] traci po silnym boomie. Jeśli [concept_spec_investor_interest] będzie nadal spadać, nastąpi [concept_spec_collapse], a [concept_spec_market_confidence] spadnie o około #N [Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#!."
