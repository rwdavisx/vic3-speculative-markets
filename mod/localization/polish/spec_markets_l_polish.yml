 spec_depression.1.t: "$SPEC_LD_NAME$"
 spec_depression.1.d: "Paniki na światowych giełdach zlały się w jedną. Kredyt przestał krążyć między wielkimi domami handlowymi, ceny spadają wszędzie naraz, a zamówienia, które dawały pracę naszym zakładom i kopalniom, są odwoływane telegrafem. Każdy rynek wspiera się na pozostałych i wszystkie padają razem.\n\nKrach potrwa kilka miesięcy, po czym nadejdzie długi kryzys. Tempo odbudowy zależy od naszych obecnych działań oraz od tego, co uczynią państwa określane jako [Concept('concept_great_power','$concept_great_powers|q$')]."
 spec_depression.1.f: "„Paniki już bywały. Tym razem pieniądze nie mają dokąd uciec”."
 spec_depression.1.a: "Musimy zacisnąć pasa."
 spec_depression.1.b: "Ustabilizujmy giełdy."
 spec_depression.2.t: "Mur celny"
 spec_depression.2.d: "Właściciele naszych największych zakładów wystosowali petycję do rządu, a wielcy właściciele ziemscy przyłączyli się do nich. Twierdzą, że zagraniczne towary i tanie zagraniczne zboże sprzedaje się na naszych rynkach za każdą cenę, jaką uda się uzyskać ich wytwórcom, a krajowe fabryki i majątki nie mogą sprzedawać po cenach pozwalających wypłacić pensje. Domagają się wyższych ceł na wszystko, co konkuruje z rodzimym przemysłem i rodzimymi zbiorami.\n\nOchrona celna osłoniłaby naszą odbudowę, lecz ucierpieliby partnerzy handlowi, a wraz z nimi odbudowa światowej gospodarki."
 spec_depression.2.f: "„Każdy naród wznosi mur wokół własnego rynku i każdy dziwi się, że jego eksport nie odżywa”."
 spec_depression.2.a: "Chrońmy nasz przemysł."
 spec_depression.2.b: "Utrzymajmy otwarte rynki."
 spec_depression.3.t: "Roboty publiczne"
 spec_depression.3.d: "W stolicy ([ROOT.GetCountry.GetCapital.GetCityHubName]) tysiące ludzi nie ma pracy, a fundusze pomocowe są wyczerpane. Miejscy inżynierowie mają wykaz robót, przy których można by ich zatrudnić: kanały ściekowe, drogi, wały i nowa hala targowa, o ile zapłaci za nie skarb państwa."
 spec_depression.3.f: "„Człowiek, który kopie kanał za dniówkę, nie jest nędzarzem i dobrze o tym wie”."
 spec_depression.3.a: "Sfinansujmy roboty."
 spec_depression.3.b: "Dobroczynność to sprawa prywatna."
 spec_depression.4.t: "Banki w oblężeniu"
 spec_depression.4.d: "Rozeszła się wieść, że w stolicy ([ROOT.GetCountry.GetCapital.GetCityHubName]) banki pożyczyły znaczne sumy firmom, które teraz upadają. Od rana deponenci stoją w kolejkach po oszczędności, a do wieczora bankom zabraknie monet na wypłaty. Dyrektorzy proszą rząd o działanie."
 spec_depression.4.f: "„Bank jest zupełnie pewny, dopóki wszyscy nie uwierzą, że jest inaczej”."
 spec_depression.4.a: "Zarządźmy przerwę w pracy banków."
 spec_depression.4.b: "Uratujmy banki."
 spec_depression.4.c: "Pozwólmy im upaść."
 spec_depression.5.t: "Kwestia pieniądza"
 spec_depression.5.d: "Spadające ceny podzieliły kraj. Rolnicy i drobni dłużnicy twierdzą, że pieniądz stał się zbyt drogi, a każdy rok spadku cen zwiększa ciężar ich długów. Żądają większej emisji pieniądza i łatwiejszego dostępu do kredytu. Bankierzy i wierzyciele odpowiadają, że tylko zdrowy pieniądz odzyska zaufanie inwestorów w kraju i za granicą."
 spec_depression.5.f: "„Mój dług hipoteczny jest taki sam jak pięć lat temu. Za pszenicę dostaję połowę dawnej ceny”."
 spec_depression.5.a: "Zdrowy pieniądz przede wszystkim."
 spec_depression.5.b: "Ułatwmy dostęp do kredytu."
 spec_depression.6.t: "Marsz bezrobotnych"
 spec_depression.6.d: "Do stolicy ([ROOT.GetCountry.GetCapital.GetCityHubName]) wkroczyła kolumna bezrobotnych pod sztandarami z napisem „Pracy lub chleba”. Rozbili obóz przed urzędami i proszą o możliwość złożenia petycji. Policja zapewnia, że zdoła oczyścić plac przed zmrokiem."
 spec_depression.6.f: "„Nie prosimy o jałmużnę. Prosimy o pracę”."
 spec_depression.6.a: "Rozpędźmy ich."
 spec_depression.6.b: "Wysłuchajmy ich petycji."
 spec_depression.7.t: "Żądania reform"
 spec_depression.7.d: "Gazety pytają, dlaczego kryzys trwa tak długo i kto wzbogacił się na poprzedzającej go spekulacji. Członkowie parlamentu zażądali dochodzenia w sprawie banków, giełd i postępowania samego rządu."
 spec_depression.7.f: "„Pytanie nie brzmi już, czy system zawiódł, lecz kto za to odpowie”."
 spec_depression.7.a: "Zlećmy dochodzenie."
 spec_depression.7.b: "System jest zdrowy."
 spec_depression.8.t: "$SPEC_LD_NAME$ ustępuje"
 spec_depression.8.d: "Po raz pierwszy od lat zamówień przybywa szybciej, niż są odwoływane. Ceny przestały spadać, banki znów udzielają pożyczek, a bezczynne dotąd zakłady przyjmują robotników. Kryzys minął, choć niewielu spośród tych, którzy go przeżyli, prędko o nim zapomni."
 spec_depression.8.f: "„Podobno handel się poprawia. Uwierzę, gdy potwierdzi to moja księga zamówień”."
 spec_depression.8.a: "Wyciągnęliśmy wnioski."
 spec_depression.8.b: "Wracajmy do interesów."
