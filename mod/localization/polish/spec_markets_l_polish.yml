 SPEC_PLEDGE_MAKE_TT: "#header Zobowiązanie do ratowania banków#!\n$TOOLTIP_DELIMITER$\nPrzy każdej panice ([concept_spec_financial_panic]) banki są ratowane natychmiast, #P 25%#! taniej, jeśli [concept_treasury] może zapłacić z rezerw, a kraj nie jest w stanie: [concept_default]\nWiarygodność ([concept_spec_exchange]) tracona podczas paniki: #P -50%#!\nOtrzymywana [concept_spec_capital_flight]: #P +50%#! (pozycja Międzynarodowa lub wyższa albo status: [concept_great_power])\nKażde ratowanie luzuje standardy kredytowe\n$TOOLTIP_DELIMITER$\nWejście w stan: [concept_default] łamie zobowiązanie: cała wiarygodność przepada, [concept_spec_market_confidence] #N -15#!, [concept_legitimacy] #N -10#! na #v 5#! lat\nWycofanie zobowiązania wymaga #v 24#! mies. wypowiedzenia[AddLocalizationIf(Not(GetScriptedGui('spec_sgui_pledge').IsValid(GuiScope.SetRoot(Country.MakeScope).End)), 'SPEC_PLEDGE_PLEDGE_WHY')]"
