 je_spec_depression_reason: "Paniki na wielkich giełdach przerodziły się w światowy kryzys. Inwestycje i budowa zwolniły, handel osłabł, a bezrobotni stają się niespokojni. [concept_spec_long_depression] kończy się, gdy światowa gospodarka się odbuduje, lub najpóźniej po #v 5#! latach.\n\nNasze decyzje przyspieszają odbudowę naszej gospodarki i całego świata, a wybory państw określanych jako [Concept('concept_great_power','$concept_great_powers|q$')] mają większe znaczenie. Gdy nasza odbudowa się zakończy, [concept_spec_market_confidence] wróci tu wcześniej niż gdzie indziej."
