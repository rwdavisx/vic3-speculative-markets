 SPEC_DRIVER_RESTRAIN_TT: "#header Ograniczone boomy: [Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] ze względu na boomy wygaszane w tym miesiącu\n#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#! ze względu na: [concept_spec_market_conditions]\n$TOOLTIP_DELIMITER$\nOgraniczony boom wygasa powoli, zamiast kończyć się jednym upadkiem: następuje [concept_spec_correction]. Kosztuje to co miesiąc niewiele."
 SPEC_DRIVER_CAUTION_TT: "#header Rząd i wydarzenia: [Country.MakeScope.Var('spec_c_caution').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\nJednorazowa zmiana w tym miesiącu, wynikająca z naszych decyzji i wydarzeń rynkowych."
 SPEC_DRIVER_LIMIT_TT: "#header Dolna i górna granica: [Country.MakeScope.Var('spec_c_limit').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_market_confidence] nie może spaść poniżej #v 0#! ani wzrosnąć powyżej #v 100#!, więc część zmiany z tego miesiąca nie została uwzględniona."
 SPEC_DRIVER_RESCUE_TT: "#header Ratowanie banków: [Country.MakeScope.Var('spec_c_rescue').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\nJednorazowy wzrost dzięki #v Pożycz bankom#! lub #v Zawieś ustawę bankową#!. Nie może podnieść [concept_spec_market_confidence] powyżej #v 100#!."
 SPEC_DRIVER_RESCUE: "Ratowanie banków"
 SPEC_DRIVER_WAREND: "Koniec wojny"
 SPEC_DRIVER_WAREND_TT: "#header Koniec wojny: [Country.MakeScope.Var('spec_c_warend').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#v x[Country.MakeScope.Var('spec_war_stakes_now').GetValueWithDefault('(CFixedPoint)0')|%0]#! pełnego efektu ze względu na nasze straty ([concept_casualties])\n$TOOLTIP_DELIMITER$\nPełny efekt, zależnie od wyniku wojny:\nWygrana, z wyegzekwowanym celem ([concept_war_goal]): #P +4#!\nWygrana, bez wyegzekwowanych celów: #P +1#!\nPrzegrana, z celem wyegzekwowanym przeciwko nam ([concept_war_goal]): #N -8#!\nPrzegrana, bez wyegzekwowanych celów: #N -2#!\nBez zwycięzcy: #N -1#!\n\nSkalowane według naszych strat: co najmniej #v 25%#! efektu, a cały efekt, gdy wojna pochłonęła #v 25%#! naszych sił."
 SPEC_DRIVER_BURST: "Pęknięcia baniek"
 SPEC_DRIVER_BURST_TT: "#header Pęknięcia baniek: [Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0'), Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_burst_per_heat'), '(CFixedPoint)-1'))|0]#! ze względu na: [concept_spec_speculative_excess]\n#N -[Country.MakeScope.ScriptValue('spec_burst_per_heat')|2]#! za każdy punkt\nOgraniczone do #N -[Country.MakeScope.ScriptValue('spec_burst_max')|0]#!\n$TOOLTIP_DELIMITER$\nBańka pęka, gdy [concept_spec_market_confidence] spada poniżej #v 60#! po boomie, który wyniósł je powyżej #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#!. Im dłuższy i silniejszy był boom, tym większa strata.\n\nBańki powstają tylko w państwie, które ma technologię [GetTechnology('stock_exchange').GetName]."
 SPEC_DRIVER_CAUTION: "Rząd i wydarzenia"
 SPEC_DRIVER_RESTRAIN: "Ograniczone boomy"
 SPEC_DRIVER_LIMIT: "Dolna i górna granica"
 SPEC_DRIVER_BOOM: "Boomy towarowe"
 SPEC_DRIVER_BOOM_TT: "#header Boomy towarowe: [Country.MakeScope.Var('spec_c_boom').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] ze względu na: [Concept('concept_good','$concept_goods|q$')] w boomie, #v [Country.MakeScope.Var('spec_n_boom').GetValueWithDefault('(CFixedPoint)0')|0]#![AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_BOOM_CAP')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_steady'), '(CFixedPoint)1')), 'SPEC_BOOM_STEADY')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_fin_boom'), '(CFixedPoint)1')), 'SPEC_BOOM_FIN')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_boom_rule'), '(CFixedPoint)1')), 'SPEC_BOOM_RULE')]\n$TOOLTIP_DELIMITER$\nKażdy boom zwiększa [concept_spec_market_confidence] tym bardziej, im większy jest jego udział w obrotach, jakie odnotowuje [concept_market]. Nie działa, gdy trwa [concept_spec_financial_panic]. [GetTechnology('stock_exchange').GetName] i [GetTechnology('investment_banks').GetName] zwiększają skalę boomów, podobnie jak [GetTechnology('modern_financial_instruments').GetName]."
 SPEC_BOOM_CAP: "\nOgraniczone do #v +3#! przed mnożnikami"
 SPEC_BOOM_STEADY: "\n#v x[Country.MakeScope.ScriptValue('spec_steady')|2]#! ze względu na dwory"
 SPEC_BOOM_FIN: "\n#v x[Country.MakeScope.ScriptValue('spec_fin_boom')|2]#! ze względu na technologie finansowe"
 SPEC_BOOM_RULE: "\n#v x[Country.MakeScope.ScriptValue('spec_boom_rule')|2]#! ze względu na zmienność rynku"
 SPEC_DRIVER_CRASH: "Zakończone boomy"
 SPEC_DRIVER_CRASH_TT: "#header Zakończone boomy:[Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\nNajwiększy w ostatnim miesiącu: #v [Country.MakeScope.Var('spec_crashed').GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] ze względu na skalę zakończonych boomów\n#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#! ze względu na: [concept_spec_market_conditions][AddLocalizationIf(Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-40')), 'SPEC_CRASH_CAP')]\n$TOOLTIP_DELIMITER$\nKażdy [concept_spec_boom_end] obniża [concept_spec_market_confidence]. Im większy boom i jego udział w obrotach (kategoria: [concept_market]), tym większa strata. [GetTechnology('mutual_funds').GetName] ją zmniejsza; [GetTechnology('modern_financial_instruments').GetName] ją zwiększa."
 SPEC_CRASH_CAP: "\nOgraniczone do #N -40#! miesięcznie"
 SPEC_DRIVER_FOREIGN: "Zagraniczne paniki"
 SPEC_FOREIGN_HIT: "\n#N -20#! ze względu na: [concept_spec_foreign_panic]\n#v x[Country.MakeScope.Var('spec_fh_size').GetValueWithDefault('(CFixedPoint)0')|2]#! ze względu na ich gospodarkę względem naszej\n#v x[Country.MakeScope.Var('spec_fh_tie').GetValueWithDefault('(CFixedPoint)0')|2]#! ze względu na: [concept_spec_market_tie]\n#v x[Country.MakeScope.Var('spec_fh_reach').GetValueWithDefault('(CFixedPoint)0')|2]#! ze względu na: [concept_rank] tego kraju[AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_foreign_loss_mult'), '(CFixedPoint)1')), 'SPEC_FOREIGN_UNSTD')]"
 SPEC_FOREIGN_UNSTD: "\n#v x[Country.MakeScope.ScriptValue('spec_foreign_loss_mult')|2]#! ze względu na brak: [GetTechnology('currency_standards').GetName]"
 SPEC_FOREIGN_FLIGHT: "\n[Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')|+=2] ze względu na: [concept_spec_capital_flight]"
 SPEC_DRIVER_FOREIGN_TT: "#header Zagraniczne paniki: [Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\nOstatnio: #v [Country.MakeScope.Var('spec_foreign_src').GetCountry.GetName]#!\n$TOOLTIP_DELIMITER$[AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_HIT')][AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_FLIGHT')]\n$TOOLTIP_DELIMITER$\nWspólny [concept_market]: #v [Country.MakeScope.ScriptValue('spec_tie_market')|%0]#!\nPaństwo zależne lub suweren: #v 80%#!\nZagraniczne prawa inwestycyjne: #v [Country.MakeScope.ScriptValue('spec_tie_investment')|%0]#!\nIntensywny handel między rynkami: #v [Country.MakeScope.ScriptValue('spec_tie_trade')|%0]#!\nZagraniczna własność w naszej gospodarce: do #v 90%#!\n\n[concept_country] powiązane z naszym: gdy wybucha w nim [concept_spec_financial_panic], tutaj spada [concept_spec_market_confidence], tym bardziej, im ściślejsze jest [concept_spec_market_tie] i im większa jest jego gospodarka w porównaniu z naszą. [concept_great_power] przekazuje dalej całą stratę, mocarstwo drugiego rzędu połowę, a mniejsze państwa niewiele. Panika zaczerpnięta z zagranicy nie rozchodzi się dalej. Bez technologii [GetTechnology('currency_standards').GetName] strata jest o jedną czwartą większa."
 SPEC_DRIVER_TURMOIL: "Wojna i niepokoje"
 SPEC_DRIVER_TURMOIL_TT: "#header Wojna i niepokoje: [Country.MakeScope.Var('spec_c_turmoil').GetValueWithDefault('(CFixedPoint)0')|+=2]#!$SPEC_ITEMS_TURMOIL$\n$TOOLTIP_DELIMITER$\nKażda [concept_war] (wpływ: [concept_spec_war_news]): od #N -3#! do #P +0.15#! miesięcznie\nWszystkie wojny razem: od #N -4#! do #P +0.5#! miesięcznie\n[concept_diplomatic_play] przed wybuchem wojny: #N -0.5#! miesięcznie\nWyczerpujący się skarbiec: do #N -3#! miesięcznie, przy #v 20#! tyg. do wystąpienia: [concept_bankruptcy]\n[concept_default]: #N -5#! miesięcznie\n[concept_revolution]: #N -2#! miesięcznie\n\nNajedź na liczbę, aby zobaczyć przyczynę."
 SPEC_DRIVER_MOOD: "Nastroje rynkowe"
 SPEC_DRIVER_MOOD_TT: "#header Nastroje rynkowe: [Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0')|+=2] ze względu na zmianę w tym miesiącu\n[Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0'))|+=2] ze względu na nastroje z zeszłego miesiąca\n$TOOLTIP_DELIMITER$\n[concept_spec_market_mood] zmieniają się losowo co miesiąc, o maksymalnie #v 0.75#! w każdą stronę, a #v 75%#! tej zmiany przechodzi na następny miesiąc."
 SPEC_DRIVER_DRIFT: "Powrót do podstaw"
 SPEC_DRIVER_DRIFT_TT: "#header Powrót do podstaw: [Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0'), Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100'))|+=1] ze względu na odległość od wartości: [concept_spec_baseline] (#v 55#!)\n#v x[Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100')|%1]#! odrabiane co miesiąc\n$TOOLTIP_DELIMITER$\nTechnologia [GetTechnology('macroeconomics').GetName] przyspiesza ten proces o połowę."
 SPEC_DRIVER_TIGHT: "Ograniczony kredyt"
 SPEC_DRIVER_GROWTH: "Wzrost"
 SPEC_DRIVER_GROWTH_TT: "#header Wzrost: [Country.MakeScope.Var('spec_c_growth').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#v [Country.MakeScope.Var('spec_growth').GetValueWithDefault('(CFixedPoint)0')|=+%1]#! ze względu na: [concept_gdp] w porównaniu z niedawną średnią\n#v -2%#! ze względu na normalny wzrost\n$TOOLTIP_DELIMITER$\nKażde #v 1%#! wzrostu powyżej lub poniżej normy zmienia [concept_spec_market_confidence] o #v 0.1#! miesięcznie, maksymalnie o #v 0.6#! w każdą stronę."
 SPEC_DRIVER_BUSINESS: "Nastroje przedsiębiorców"
 SPEC_DRIVER_BUSINESS_TT: "#header Nastroje przedsiębiorców: [Country.MakeScope.Var('spec_c_business').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[concept_approval] przemysłowców: #v [Country.MakeScope.ScriptValue('spec_ind_approval')|0]#!\n\nLojalność (#v 10#! lub więcej): #P +0.4#! miesięcznie\nZadowolenie (#v 5#! lub więcej): #P +0.2#! miesięcznie\nNiezadowolenie (#v -5#! lub mniej): #N -0.2#! miesięcznie\nGniew (#v -10#! lub mniej): #N -0.4#! miesięcznie"
 SPEC_DRIVER_TIGHT_TT: "#header Ograniczony kredyt: [Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\nPoziom [concept_spec_market_confidence] powyżej #v 60#!: #v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.1')|1]#!\n#N -10%#! tej nadwyżki miesięcznie, ze względu na: [Concept('concept_spec_credit_policy','$concept_spec_credit_policy_tight|q$')]\n$TOOLTIP_DELIMITER$\nDzięki temu boom stygnie przez wiele miesięcy, a nie nagle."
 concept_spec_market_conditions: "Warunki rynkowe"
 concept_spec_market_conditions_desc: "$concept_spec_market_conditions$ określają, jak bardzo [concept_spec_market_confidence] spada w wyniku finału ([concept_spec_boom_end]). Im wyżej stoi $concept_spec_market_confidence$ w chwili końca boomu, tym większa strata. Gdy $concept_spec_market_confidence$ wynosi #v 55#!, nie mają wpływu. Zmieniają je też dzielnice finansowe, dwory i technologie finansowe."
 concept_spec_baseline: "Zaufanie bazowe"
 concept_spec_baseline_desc: "$concept_spec_baseline$ wynosi #v 55#!. Pozostawione samo sobie, [concept_spec_market_confidence] zmierza do tego poziomu, z góry lub z dołu, a im dalej od niego odeszło, tym szybciej wraca."
 concept_spec_market_mood: "Nastroje rynkowe"
 concept_spec_market_mood_desc: "$concept_spec_market_mood$ to wahania uczuć inwestorów bez jednej przyczyny. Co miesiąc zmieniają się losowo, o maksymalnie #v 0.75#! w każdą stronę, a #v 75%#! zmiany przechodzi na kolejny miesiąc, więc dobre i złe passy trwają jakiś czas, nim wygasną."
 concept_spec_market_tie: "Powiązanie rynkowe"
 concept_spec_market_tie_desc: "$concept_spec_market_tie$ mówi, jak ściśle jedno [concept_country] podąża za drugim, jeśli chodzi o [concept_market]. Decyduje o tym, jak silnie [concept_spec_financial_panic] przenosi się z jednego na drugie.\n\nWłasność zaczyna się liczyć, gdy państwo posiada #v 10%#! gospodarki drugiego ([concept_gdp]), a najsilniej działa przy #v 30%#!. [GetLawType('law_free_trade').GetName] wzmacnia powiązanie handlowe, a inne polityki handlowe je osłabiają. [GetTechnology('international_exchange_standards').GetName] wzmacnia powiązania rynkowe i inwestycyjne. [concept_embargo] przerywa powiązanie handlowe."
 concept_spec_capital_flight: "Ucieczka kapitału"
 concept_spec_capital_flight_desc: "Gdy wybucha [concept_spec_financial_panic], pieniądze uciekają w bezpieczne miejsce. Każde [concept_great_power] i każde [concept_country], którego [concept_spec_exchange] ma pozycję co najmniej #v Międzynarodowa#!, zyskuje do #P +[GetPlayer.MakeScope.ScriptValue('spec_flight_gain_max')|0]#! [concept_spec_market_confidence], jeśli jest w pokoju, na poziomie #v Stabilność#! lub wyższym i nie jest powiązane z państwem ogarniętym paniką. Zysk zwiększają: [GetTechnology('international_trade').GetName] i [GetTechnology('international_exchange_standards').GetName]. Im wyższa pozycja giełdy ([concept_spec_exchange]), tym więcej otrzymuje."
 concept_spec_war_news: "Wieści z wojny"
 concept_spec_war_news_desc: "Inwestorzy na bieżąco śledzą każdą wojnę ([concept_war]). $concept_spec_war_news$ zmieniają co miesiąc [concept_spec_market_confidence] zależnie od jej przebiegu: [concept_casualties], [concept_blockade], [concept_devastation], spadek [concept_gdp] i długa wojna obniżają je, a wygrane [Concept('concept_battle','$concept_battles|q$')] i zajmowanie ziem wroga podnoszą. Każda wojna zmienia je w przedziale od #N -3#! do #P +0.15#! miesięcznie, a wszystkie wojny razem w przedziale od #N -4#! do #P +0.5#!."
 SPEC_ITEMS_BOOM: "#indent_newline:3 [AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_hype_aeroplanes').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), GreaterThanOrEqualTo_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.Var('spec_cb_aeroplanes').GetValueWithDefault('(CFixedPoint)0'), Divide_CFixedPoint(Country.MakeScope.Var('spec_c_boom').GetValueWithDefault('(CFixedPoint)0'), Max_CFixedPoint(Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.001'))), '(CFixedPoint)0.01')), 'SPEC_ITEM_BOOM_AEROPLANES')][AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_hype_ammunition').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), GreaterThanOrEqualTo_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.Var('spec_cb_ammunition').GetValueWithDefault('(CFixedPoint)0'), Divide_CFixedPoint(Country.MakeScope.Var('spec_c_boom').GetValueWithDefault('(CFixedPoint)0'), Max_CFixedPoint(Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.001'))), '(CFixedPoint)0.01')), 'SPEC_ITEM_BOOM_AMMUNITION')][AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_hype_artillery').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), GreaterThanOrEqualTo_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.Var('spec_cb_artillery').GetValueWithDefault('(CFixedPoint)0'), Divide_CFixedPoint(Country.MakeScope.Var('spec_c_boom').GetValueWithDefault('(CFixedPoint)0'), Max_CFixedPoint(Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.001'))), '(CFixedPoint)0.01')), 'SPEC_ITEM_BOOM_ARTILLERY')][AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_hype_automobiles').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), GreaterThanOrEqualTo_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.Var('spec_cb_automobiles').GetValueWithDefau