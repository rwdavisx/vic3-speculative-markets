 spec_markets.2.f: "„Wczoraj mój majątek wynosił czterdzieści tysięcy. Dziś rano jest wart tyle co mój płaszcz, a i za niego oferowano mi niewiele”."
 spec_markets.2.a: "Rynek sam musi znaleźć dno."
 spec_markets.2.a.tt: "[concept_spec_financial_panic] trwa do końca, chyba że później zdecydujemy się na #v Pożycz bankom#!, co usuwa też tę zmianę ([concept_approval], $ig_industrialists$)"
 spec_markets.2.b: "Musimy pożyczyć bankom."
 spec_markets.2.b.tt: "[concept_spec_financial_panic] kończy się w ciągu #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#! mies., a jej skutki maleją o połowę\n[concept_spec_market_confidence] rośnie o #v 20#!"
 spec_rescue_cost_tt: "[concept_treasury]: #N -@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_cost')|D]#!, około #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#! wartości [concept_gdp]"
 spec_levy_tt: "[concept_treasury]: #P +@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_speculator_tax')|D]#!, około #v 0.25%#! wartości [concept_gdp]"
 spec_bank_bailout_tt: "$ig_trade_unions$ i $ig_rural_folk$: [concept_approval] #N -2#!; czas trwania w latach: #v 2.5#!"
 spec_markets.2.c: "To spekulanci sprowadzili na nas nieszczęście."
