 alert_spec_bubble_alert_name: "Nadmiar spekulacyjny"
 spec_bubble_alert_setting_name: "Nadmiar spekulacyjny"
 alert_spec_bubble_alert_desc: "Nasz [concept_spec_speculative_excess] wynosi #v [GetPlayer.MakeScope.Var('spec_heat').GetValue|0]#!. Gdy [concept_spec_market_confidence] spadnie poniżej #v 60#!, bańka pęknie, a [concept_spec_market_confidence] spadnie o dalsze #N [GetPlayer.MakeScope.ScriptValue('spec_burst_now')|0]#!."
 alert_spec_bubble_alert_hint: "Bańka rośnie w każdym miesiącu, gdy [concept_spec_market_confidence] wynosi co najmniej #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!, a maleje, gdy utrzymuje się między #v 60#! a tym progiem. Ograniczenie boomów towarowych lub zaostrzenie zasad w dziedzinie [concept_spec_credit_policy] pozwala zmniejszyć ją łagodnie."
 alert_spec_bubble_alert_action: "Dziennik"
