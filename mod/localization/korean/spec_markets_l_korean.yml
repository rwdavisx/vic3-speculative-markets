 SPEC_RIVAL_RULE: "매년 [Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')] 점수가 더 높은 거래소는 신뢰를 #P 5%#! 얻고 다른 쪽은 #N 5%#!, 두 국가의 관계가 나쁨 이하라면 #N 7.5%#!를 잃습니다(신뢰 손실 효과 적용 전). 어느 쪽이 지정했든 양쪽 모두에 적용됩니다.\n지정 가능: 우리와 같은 위상이거나 한 단계 위이며 점수가 우리 이상인 시장. 세계 중심은 경쟁자를 지정하지 않습니다.\n[concept_spec_financial_panic] 중에는 빠져나가는 자금이 먼저 경쟁자에게 갑니다.\n두 국가 사이에 동맹, 방위 협정, 투자권이 생기면 경쟁이 끝납니다."
