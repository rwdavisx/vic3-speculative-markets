 SPEC_LEVERS_MANY: "개입 [Country.MakeScope.ScriptValue('spec_levers_used')|0]건: #N -[Country.MakeScope.ScriptValue('spec_lever_authority')|0]#! @aut!"
 concept_spec_intervention: "개입"
 concept_spec_intervention_desc: "$concept_spec_intervention$을 통해 정부는 [concept_good]에 대해 #v 투기 억제#! 또는 #v 투자 장려#!를 할 수 있습니다.\n\n#v 투기 억제#!: [concept_spec_investor_interest]가 #v 관망#!으로 완화되고, 생산자 [concept_throughput] #N -10%#!, 기본 가격 기준 주간 생산량의 #v 10%#!에 해당하는 부담금\n#v 투자 장려#!: 관심도가 #v 관심#!까지 상승하고, 생산자 [concept_throughput] #P +10%#!, #v 20%#!의 보조금\n\n각 개입은 해제할 때까지 매달 [concept_authority]를 소모하며, 필수품과 [concept_market] 무역 비중이 큰 상품일수록 더 많이 듭니다."
 SPEC_LEVER_ISSUE_TT: "#header [Goods.GetName] 대규모 공모 발행#!\n$TOOLTIP_DELIMITER$\n#v 2#!년 동안:\n[Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')] 점수: #P +25%#!\n호황 종료 시 이 상품에 대한 은행 대출이 #N x1.5#!로 계산됨\n호황 종료 시 얻거나 잃는 신뢰: #v x2#!\n$TOOLTIP_DELIMITER$\n전국 위상 이상, [concept_spec_investor_interest] #v 열의#! 이상, [concept_spec_intervention] 없음이 필요합니다. 대규모 공모는 한 번에 하나만 가능하며, 다음 공모는 이번 공모가 끝나고 #v 1#!년 후에 발행할 수 있습니다.[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_issue_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_ISSUE_ON', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_issue').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
