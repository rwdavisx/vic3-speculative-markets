 SPEC_EFFECT_LAX_TT: "#header [concept_spec_lending_standards]#!\n$SPEC_EFFECT_LAX_VALUE$\n$TOOLTIP_DELIMITER$\n매달 대출액: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_credit'), '(CFixedPoint)1')|+%0]#!\n그중 호황에 대출되는 비율: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_pull'), '(CFixedPoint)1')|+%0]#!\n은행 지원 비용: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_cost'), '(CFixedPoint)1')|+%0]#!\n$TOOLTIP_DELIMITER$\n은행은 손실 없는 해가 이어지거나 은행 지원을 받을 때마다 부주의해집니다. 다시 신중해지려면 손실을 겪어야 합니다. 호황이 끝날 때, 특히 [concept_spec_financial_panic]이 은행 지원 없이 끝까지 진행될 때 그렇습니다.\n\n#title 신중함을 유지하려면:#!\n- [concept_spec_credit_policy]을(를) 긴축으로 설정: 더 이상 부주의해지지 않습니다\n- 호황이 나쁘게 끝나기 전에 억제\n- 은행 지원 없이 공황이 진행되게 하거나, 은행법 정지를 덜 자주 사용\n\n단계: #v 엄격#!, #v 신중#!, #v 건전#!, #v 느슨#!, #v 무모#!"
 SPEC_TILE_CYCLE: "[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_overx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_OVER_ON', 'SPEC_GOODS_NONE')][SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_bb_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_TILE_BB_ON', 'SPEC_GOODS_NONE')]"
 SPEC_TILE_OVER_ON: "\n\n#title 과잉 건설:#! 이 호황이 시작된 뒤 공급이 #v [Country.MakeScope.Var(Concatenate('spec_ui_over_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! 늘었습니다\n이 호황이 끝나면 [concept_spec_market_confidence]이(가) #v x[Country.MakeScope.Var(Concatenate('spec_ui_overx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|2]#!배 더 크게 떨어집니다"
 SPEC_TILE_BB_ON: "\n\n#title 호황 건설:#! 투자자들의 관심이 이 수준으로 유지되는 동안 해당 산업의 건설 효율 #P +[Country.MakeScope.Var(Concatenate('spec_ui_bb_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#!"
 SPEC_NOTE_CYCLE: "[SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)2.5'), 'SPEC_NOTE_PPL_3', SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)1.5'), 'SPEC_NOTE_PPL_2', SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)0.5'), 'SPEC_NOTE_PPL_1', 'SPEC_GOODS_NONE')))]"
 SPEC_NOTE_OVER_ON: " 호황 동안 너무 많이 지어진 탓에 하락이 #N x[SCOPE.GetValue('spec_note_over')|2]#!배 더 컸습니다."
 SPEC_NOTE_PPL_1: " 그 산업을 소유한 노동자들이 손실을 떠안았고, 일부는 해당 주에서 [Concept('concept_radical', '$concept_radicals|q$')]이(가) 되었습니다."
