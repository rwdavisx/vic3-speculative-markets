 spec_panic_crunch: "신용 경색"
 spec_panic_crunch_desc: "[concept_spec_financial_panic] 중 은행이 대출을 중단하여 [concept_private_construction]이 절반으로 줄어듦"
 spec_lev_boom: "신용 호황"
 spec_bailout_fx_tt: "[concept_spec_bad_debts]: #P 절반으로 감소#!, #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#!개월 대신 #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_months')|0]#!개월 후 해소"
 spec_bailout_cost_tt: "[concept_treasury]: #N -@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_cost')|D]#!, [concept_gdp]의 약 #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_share')|%0]#!"
 spec_bailout_debts_tt: "해소할 [concept_spec_bad_debts]이 있음"
 spec_bailed_tt: "이 [concept_spec_bad_debts]이 생긴 이후 국가가 부실 대출을 매입한 적이 없음"
 spec_lev_boom_desc: "은행 신용은 [concept_spec_leverage] 1개월분마다 [concept_throughput]을 #P +2%#!, 최대 #P +24%#!까지 높입니다."
 spec_credit_crunch: "부실 채권"
 spec_credit_crunch_desc: "은행이 지난 호황의 대출을 상각하고 있으며, 이것이 사라질 때까지 대출하지 않습니다. #v 은행에 대출#!로는 해소되지 않습니다. #v 부실 대출 매입#!은 지속되는 동안 한 번 이를 절반으로 줄입니다."
 spec_loose_credit: "신용 완화"
 spec_loose_credit_desc: "[concept_spec_credit_policy]의 효과"
 spec_tight_credit: "신용 긴축"
 spec_tight_credit_desc: "[concept_spec_credit_policy]의 효과"
 spec_markets.1.t: "투기 광풍"
 spec_markets.1.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]에서는 헤아릴 새도 없이 재산이 불어나고 있습니다. [ROOT.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName], [ROOT.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName], [ROOT.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName] 가격은 매주 뛰고, 이를 생산할 새 회사는 거의 날마다 설립되며, 은행은 제대로 살펴보지도 않고 그 주식을 담보로 대출합니다. 그 모든 것의 실제 가치가 얼마인지 묻는 이는 드뭅니다.\n\n일부 $capitalists_no_icon$와(과) $shopkeepers_no_icon$은(는) 새로 얻은 부를 정부 덕으로 여기며 [Concept('concept_loyalist','$concept_loyalists|q$')]이(가) 됩니다. 이 상황이 계속되면 [GetLawType('law_laissez_faire').GetName]을(를) 지지하는 [Concept('concept_political_movement','$concept_political_movements|q$')]이(가) 지지를 얻을 것입니다."
 spec_markets.1.d_generic: "[ROOT.GetCountry.GetCapital.GetCityHubName]에서는 헤아릴 새도 없이 재산이 불어나고 있습니다. 가격은 매주 뛰고, 새 회사는 거의 날마다 설립되며, 은행은 제대로 살펴보지도 않고 그 주식을 담보로 대출합니다. 그 모든 것의 실제 가치가 얼마인지 묻는 이는 드뭅니다.\n\n일부 $capitalists_no_icon$와(과) $shopkeepers_no_icon$은(는) 새로 얻은 부를 정부 덕으로 여기며 [Concept('concept_loyalist','$concept_loyalists|q$')]이(가) 됩니다. 이 상황이 계속되면 [GetLawType('law_laissez_faire').GetName]을(를) 지지하는 [Concept('concept_political_movement','$concept_political_movements|q$')]이(가) 지지를 얻을 것입니다."
 spec_markets.1.f: ""사게, 젊은이. 값은 신경 쓰지 말고. 오늘 얼마를 내든 내일은 누군가 더 쳐줄 테니.""
 spec_markets.1.a: "번영이 모든 것을 말해 준다."
 spec_markets.1.b: "자제를 권고하라."
 spec_markets.1.b.tt: "[concept_spec_market_confidence]가 #v 10#! 하락함"
 spec_markets.1.c: "투기꾼들도 제 몫을 내게 하라."
 spec_markets.1.c.tt: "[concept_spec_market_confidence]가 #v 5#! 하락함"
 spec_markets.2.t: "금융 공황"
 spec_markets.2.d_crash: "끝난 호황 중 가장 컸던 [ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName]의 호황 종료가 전면적인 공황으로 번졌습니다. 그 가격을 담보로 대출한 상사들이 잇달아 무너지고, [ROOT.GetCountry.GetCapital.GetCityHubName]의 은행 앞에는 새벽부터 예금자들이 줄을 섰습니다. 은행은 #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#!의 대출금을 회수하고 있으며, 투자자들은 얼마 남지 않은 재산을 움켜쥐고 있습니다. #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!개월 동안 [concept_private_construction]이 절반으로 줄어듭니다.\n\n몰락한 $capitalists_no_icon$, $aristocrats_no_icon$, $shopkeepers_no_icon$은(는) 정부를 탓하며, 일부는 [Concept('concept_radical','$concept_radicals|q$')]이(가) 됩니다. 이제 많은 이가 국가가 시장을 통제하기를 바라며, [GetLawType('law_laissez_faire').GetName]에 반대하는 [Concept('concept_political_movement','$concept_political_movements|q$')]이(가) 지지를 얻습니다.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_crash_no_loans: "끝난 호황 중 가장 컸던 [ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName]의 호황 종료가 전면적인 공황으로 번졌습니다. 그 가격을 담보로 대출한 상사들이 잇달아 무너지고, [ROOT.GetCountry.GetCapital.GetCityHubName]의 은행 앞에는 새벽부터 예금자들이 줄을 섰습니다. 투자자들은 얼마 남지 않은 재산을 움켜쥐고 있습니다. #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!개월 동안 [concept_private_construction]이 절반으로 줄어듭니다.\n\n몰락한 $capitalists_no_icon$, $aristocrats_no_icon$, $shopkeepers_no_icon$은(는) 정부를 탓하며, 일부는 [Concept('concept_radical','$concept_radicals|q$')]이(가) 됩니다. 이제 많은 이가 국가가 시장을 통제하기를 바라며, [GetLawType('law_laissez_faire').GetName]에 반대하는 [Concept('concept_political_movement','$concept_political_movements|q$')]이(가) 지지를 얻습니다.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign: "[ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName]의 공황이 우리 시장으로 번졌습니다. 그곳과 거래하거나 그곳에서 돈을 빌린 상사들이 잇달아 무너지고, [ROOT.GetCountry.GetCapital.GetCityHubName]의 은행 앞에는 새벽부터 예금자들이 줄을 섰습니다. 은행은 #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#!의 대출금을 회수하고 있으며, 투자자들은 얼마 남지 않은 재산을 움켜쥐고 있습니다. #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!개월 동안 [concept_private_construction]이 절반으로 줄어듭니다.\n\n몰락한 $capitalists_no_icon$, $aristocrats_no_icon$, $shopkeepers_no_icon$은(는) 정부를 탓하며, 일부는 [Concept('concept_radical','$concept_radicals|q$')]이(가) 됩니다. 이제 많은 이가 국가가 시장을 통제하기를 바라며, [GetLawType('law_laissez_faire').GetName]에 반대하는 [Concept('concept_political_movement','$concept_political_movements|q$')]이(가) 지지를 얻습니다.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign_no_loans: "[ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName]의 공황이 우리 시장으로 번졌습니다. 그곳과 거래하거나 그곳에서 돈을 빌린 상사들이 잇달아 무너지고, [ROOT.GetCountry.GetCapital.GetCityHubName]의 은행 앞에는 새벽부터 예금자들이 줄을 섰습니다. 투자자들은 얼마 남지 않은 재산을 움켜쥐고 있습니다. #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!개월 동안 [concept_private_construction]이 절반으로 줄어듭니다.\n\n몰락한 $capitalists_no_icon$, $aristocrats_no_icon$, $shopkeepers_no_icon$은(는) 정부를 탓하며, 일부는 [Concept('concept_radical','$concept_radicals|q$')]이(가) 됩니다. 이제 많은 이가 국가가 시장을 통제하기를 바라며, [GetLawType('law_laissez_faire').GetName]에 반대하는 [Concept('concept_political_movement','$concept_political_movements|q$')]이(가) 지지를 얻습니다.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other: "신뢰가 한순간에 무너졌습니다. 건실한 회사조차 어떤 금리로도 돈을 빌릴 수 없고, [ROOT.GetCountry.GetCapital.GetCityHubName]의 은행 앞에는 새벽부터 예금자들이 줄을 섰습니다. 은행은 #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#!의 대출금을 회수하고 있으며, 투자자들은 얼마 남지 않은 재산을 움켜쥐고 있습니다. #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!개월 동안 [concept_private_construction]이 절반으로 줄어듭니다.\n\n몰락한 $capitalists_no_icon$, $aristocrats_no_icon$, $shopkeepers_no_icon$은(는) 정부를 탓하며, 일부는 [Concept('concept_radical','$concept_radicals|q$')]이(가) 됩니다. 이제 많은 이가 국가가 시장을 통제하기를 바라며, [GetLawType('law_laissez_faire').GetName]에 반대하는 [Concept('concept_political_movement','$concept_political_movements|q$')]이(가) 지지를 얻습니다.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other_no_loans: "신뢰가 한순간에 무너졌습니다. 건실한 회사조차 어떤 금리로도 돈을 빌릴 수 없고, [ROOT.GetCountry.GetCapital.GetCityHubName]의 은행 앞에는 새벽부터 예금자들이 줄을 섰습니다. 투자자들은 얼마 남지 않은 재산을 움켜쥐고 있습니다. #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!개월 동안 [concept_private_construction]이 절반으로 줄어듭니다.\n\n몰락한 $capitalists_no_icon$, $aristocrats_no_icon$, $shopkeepers_no_icon$은(는) 정부를 탓하며, 일부는 [Concept('concept_radical','$concept_radicals|q$')]이(가) 됩니다. 이제 많은 이가 국가가 시장을 통제하기를 바라며, [GetLawType('law_laissez_faire').GetName]에 반대하는 [Concept('concept_political_movement','$concept_political_movements|q$')]이(가) 지지를 얻습니다.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.bad_debts: "호황의 대출이 부실화되었습니다. 앞으로 몇 달간 [concept_spec_bad_debts]이 [concept_throughput]을 #N [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_tp_full_pct')|1]%#! 줄인 뒤 점차 사라지며, #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#!개월 후 해소됩니다. 해소될 때까지 은행은 대출하지 않으며, #v 은행에 대출#!로도 해소되지 않습니다."
