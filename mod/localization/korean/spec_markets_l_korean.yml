Point)0'), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_war3_held').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.01'))), 'SPEC_WAR_ROW_3_HELD')][AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_war3_pressure').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_war3_pressure').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.01'))), 'SPEC_WAR_ROW_3_PRESSURE')][AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_war3_land').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_war3_land').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.01'))), 'SPEC_WAR_ROW_3_LAND')][AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_war3_length').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_war3_length').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.01'))), 'SPEC_WAR_ROW_3_LENGTH')][AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_war3_stalemate').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_war3_stalemate').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.01'))), 'SPEC_WAR_ROW_3_STALEMATE')]\n$TOOLTIP_DELIMITER$\n[concept_spec_war_news]은 [concept_spec_market_confidence]를 매월 #N -3#!에서 #P +0.15#!까지 움직입니다. 처음 #v 12#!개월과 최대 #v 10%#!까지의 [concept_gdp] 하락은 추가 비용이 없습니다."
