 spec_excess_cooling: "[concept_spec_market_confidence]가 #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! 미만인 동안 감소"
 spec_finance_bar: "건전한 금융"
 spec_finance_bar_desc: "[concept_spec_sound_finance]: [concept_spec_banking_reforms] #v 3#!개 중 #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!개"
 spec_inquiry_no_panic_tt: "진행 중인 [concept_spec_financial_panic]이 없음"
 spec_inquiry_reform_tt: "기술로 가능한 미시행 [Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')]이 있음"
 spec_suspend_panic_tt: "[concept_spec_financial_panic]이 진행 중임"
 spec_suspend_note_tt: "은행권 규칙이 통화학파를 따름"
 spec_inquiry_when_tt: "지난 1년 이내에 [concept_spec_financial_panic]이 끝났고 이후 조사가 열리지 않았거나, 공황 없이 #v 10#!년이 지남 (#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_calm_left')|0]#!개월 남음)"
 spec_convert_conf_tt: "[concept_spec_market_confidence]가 #v 60#! 이상임"
 spec_convert_debt_tt: "부채가 [concept_credit] 한도의 #v 20%#! 이상임"
 spec_convert_cd_tt: "최근 #v 10#!년 동안 부채를 차환하지 않음"
 spec_convert_conf_cost_tt: "[concept_spec_market_confidence]가 #v 5#! 하락함"
 spec_relief_when_tt: "[concept_spec_financial_panic] 또는 [concept_spec_long_depression]이 진행 중임"
 spec_relief_cd_tt: "최근 #v 12#!개월 동안 구호 사업을 시행하지 않음"
 spec_suspend_tt: "#v 2#!개월 이내에 [concept_spec_financial_panic]이 끝나며, 그때까지는 전체 강도로 지속\n[concept_spec_market_confidence]이(가) #v 15#! 상승\n#v 10#!년 동안 [concept_spec_speculative_excess]이(가) #v 50%#! 더 빨리 쌓임\n은행 지원 이후처럼 [concept_spec_lending_standards]이 느슨해짐"
 spec_suspend_act: "은행법 정지"
 spec_suspend_act_desc: "은행이 법이 정한 은행권 발행 한도를 넘어 대출하게 합니다. 국고 부담 없이 몇 달 안에 공황이 가라앉지만, 투자자들은 정부가 언제나 나설 것이라고 배우게 됩니다. 이번 공황에 대해 #v 은행에 대출#!한 것으로 간주됩니다.\n\n#lore 영국은 1847년, 1857년, 1866년에 은행 인가법을 정지했습니다.#!"
 spec_relief_works_button: "구호 사업"
 spec_relief_works_button_desc: "불황 동안 공공사업과 구호에 자금을 지원합니다. #v 12#!개월 동안 복지를 제공하고 건설을 늘리며 급진파를 줄입니다. 주간 비용은 우리나라의 [concept_gdp]에 비례해 증가합니다."
 spec_convert_debt: "국채 차환"
 spec_convert_debt_desc: "투자자들이 낙관하는 동안 기존 대출을 더 낮은 이자율의 새 대출로 바꿉니다. 기존 이자로 살아가던 채권 보유자들은 달가워하지 않을 것입니다."
 spec_inquiry: "조사 위원회"
 spec_inquiry_desc: "은행가, 중개인, 몰락한 예금자의 증언을 듣고 은행과 기업의 운영 방식을 보고할 위원회를 임명합니다. 보고서를 통해 현재 기술이 허용하는 [Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')] 중 하나가 시행됩니다. #v 6#!개월 동안 위원회 활동에 정부의 역량이 투입됩니다."
 spec_debt_converted: "차환된 부채"
 spec_debt_converted_desc: "투자자들이 앞다투어 빌려주려 할 때 더 낮은 금리로 차환한 대출"
 spec_relief_works: "구호 사업"
 spec_relief_works_desc: "불황으로 일자리를 잃은 이들을 위한 공공사업과 구호"
 spec_relief_costs: "구호 사업 비용"
 spec_relief_costs_desc: "구호 사업에 드는 비용"
 spec_act_suspended: "은행법 정지"
 spec_act_suspended_desc: "정부가 공황을 끝내기 위해 스스로 만든 법을 중단함"
 spec_inquiry_sitting: "조사 위원회"
 spec_inquiry_sitting_desc: "위원회가 지난 공황에 관한 증언을 청취 중임"
 spec_sound_finance: "건전한 금융"
 spec_sound_finance_desc: "투자자가 신뢰하는 규칙에 따라 운영되는 통화, 은행, 기업"
 spec_rentiers_cut: "금리 생활자 소득 감소"
 spec_relief_thanks: "구호 사업"
 spec_dear_money: "비싼 자금"
 spec_free_issue: "자유 은행제"
 spec_disclosure_burden: "공시 규칙"
 spec_disclosure_welcomed: "공시 규칙"
 spec_reform_currency_tt: "은행 대출 #v 25%#! 감소, [concept_spec_speculative_excess] 축적 속도 #v 25%#! 감소, [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')] 지속 기간 #v 25%#! 증가\n공황 중 은행법 정지 가능"
 spec_reform_free_tt: "은행 대출 #v 25%#! 증가, 호황 규모 #v 10%#! 증가, 호황 종료 시 [concept_spec_market_confidence] 손실 #v 10%#! 증가"
 spec_reform_llr_tt: "#v 은행에 대출#! 비용이 #v 50%#! 감소하고 공황이 한 달 일찍 끝남"
 spec_reform_company_tt: "호황 종료 시 [concept_spec_market_confidence] 손실 #v 30%#! 감소"
 spec_reform.1.t: "조사 위원회"
 spec_reform.1.d_panic: "공황 이후 임명된 위원회가 보고서를 제출했습니다. 은행가, 중개인, 몰락한 예금자의 증언이 세 권에 달합니다. 위원들은 공황이 천재지변은 아니었다는 데 동의합니다. 그 밖의 거의 모든 문제에서는 의견이 갈리며, 의회에는 각 대책을 지지하는 이들이 있습니다."
 spec_reform.1.d_calm: "시장이 잠잠한 가운데 위원회는 다음 호황이 파국으로 끝나지 않을 방도를 찾고자 1년간 은행가, 중개인, 정치경제학자의 의견을 들었습니다. 보고서는 여러 대책을 제시하며, 의회에는 각 방안을 지지하는 이들이 있습니다."
 spec_reform.1.f: ""불안이 극에 달한 시기에는 하나의 파산이 수많은 파산을 부른다. 그 연쇄를 막는 최선의 길은 원인이 되는 최초의 파산을 저지하는 것이다.""
 spec_reform.1.a: "금고의 금 보유량에 맞춰 은행권을 발행하게 하라."
 spec_reform.1.b: "건실한 은행이라면 자체 은행권을 발행하게 하라."
 spec_reform.1.c: "최종 대부자를 지정하라."
 spec_reform.1.d: "기업의 회계 공개를 의무화하라."
 spec_reform.1.e: "위원회의 노고에 감사를 표하라."
 spec_reform.2.t: "건전한 금융"
 spec_reform.2.d: "우리 은행은 규칙에 따라 은행권을 발행하고, 공황이 닥치면 대출을 제공할 기관이 대기하며, 기업은 소유한 재산과 진 빚을 투자자에게 밝혀야 합니다. 이제 해외에서는 우리 국채가 웃돈을 받고 팔리며, [ROOT.GetCountry.GetCapital.GetCityHubName]은(는) 자본의 안전한 항구로 불립니다."
 spec_reform.2.f: ""은행가의 첫째 의무는 돈을 버는 것이 아니라 지키는 것이오.""
 spec_reform.2.a: "신뢰는 신용의 토대다."
