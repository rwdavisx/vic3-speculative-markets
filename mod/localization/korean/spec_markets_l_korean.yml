 je_spec_depression_reason: "주요 거래소의 공황이 세계적인 위기로 번졌습니다. 투자와 건설이 둔화되고 무역이 줄었으며, 실업자들의 불만이 커지고 있습니다. [concept_spec_long_depression]은 세계가 회복하거나 최대 #v 5#!년이 지나면 끝납니다.\n\n우리나라의 선택은 자국과 세계의 회복을 앞당기며, [Concept('concept_great_power','$concept_great_powers|q$')]의 선택은 더 큰 영향을 미칩니다. 우리나라가 먼저 회복을 마치면 [concept_spec_market_confidence]도 다른 곳보다 일찍 회복됩니다."
