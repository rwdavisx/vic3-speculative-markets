 SPEC_COL_LEVER: "개입"
 SPEC_COL_LEVER_TT: "#header 시장 개입#!\n$TOOLTIP_DELIMITER$\n투기 억제: 관심도를 #v 관망#!으로 묶고, 생산자는 [concept_throughput]을 잃고 부담금을 냅니다\n투자 장려: 관심도가 최소 #v 관심#!이 되고, 생산자는 [concept_throughput]을 얻으며 국가가 비용을 부담합니다\n\n각 개입은 해제할 때까지 매달 [concept_authority]를 소모하며, 필수품과 시장 무역 비중이 큰 상품일수록 더 많이 듭니다. 투기는 #v 열의#!와 #v 과열#! 상품, 또는 호황이 끝나면 [concept_spec_market_confidence]을(를) #v 2#! 이상 잃게 할 상품에서 억제할 수 있습니다. 투자는 #v 관심#! 미만 상품에서 장려할 수 있습니다."
