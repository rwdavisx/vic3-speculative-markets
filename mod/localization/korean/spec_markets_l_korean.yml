 SPEC_H_BANK_LENT_TT: "#header 은행이 대출한 곳#!\n$TOOLTIP_DELIMITER$\n은행은 신규 신용 대부분을 호황 상품에 대출합니다. 우리 무역에서 차지하는 비중이 크고 [concept_spec_investor_interest]가 높을수록 더 많이 받습니다. 대출은 상환될 때까지 해당 상품에 남습니다.\n\n은행이 대출한 호황이 끝나면 [concept_spec_market_confidence]이(가) 더 크게 떨어집니다. 상품의 투기를 억제하면 그 상품으로 향하는 신규 대출이 절반으로 줄어듭니다."
