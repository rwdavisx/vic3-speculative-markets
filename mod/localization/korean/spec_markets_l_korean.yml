 spec_depression.1.t: "$SPEC_LD_NAME$"
 spec_depression.1.d: "세계 각지 거래소의 공황이 하나로 합쳐졌습니다. 대형 상사 사이의 신용 흐름이 끊기고, 곳곳에서 가격이 동시에 떨어지며, 공장과 광산을 바쁘게 돌리던 주문이 전신으로 취소되고 있습니다. 모든 시장이 서로에게 기대어 있다가 함께 무너지고 있습니다.\n\n폭락은 수개월간 지속되며 그 뒤로 장기 불황이 이어질 것입니다. 회복에 걸리는 시간은 지금 우리의 행동과 [Concept('concept_great_power','$concept_great_powers|q$')]의 선택에 달려 있습니다."
 spec_depression.1.f: ""공황은 전에도 있었소. 하지만 이번에는 돈이 달아날 곳이 없구려.""
 spec_depression.1.a: "지출을 줄여야 한다."
 spec_depression.1.b: "거래소를 안정시켜라."
 spec_depression.2.t: "관세의 장벽"
 spec_depression.2.d: "대규모 공장의 소유주들이 정부에 청원했고, 대지주들도 이에 가세했습니다. 외국 상품과 값싼 외국 곡물은 얼마를 받든 팔리기만 하면 그만인 가격으로 우리 시장에 들어오고, 국내 공장과 농장은 임금을 감당할 가격에 물건을 팔 수 없다고 합니다. 이들은 국내 산업 및 국내 수확물과 경쟁하는 모든 상품의 관세를 높여 달라고 요구합니다.\n\n보호 조치는 우리나라의 회복을 지켜 주겠지만, 교역 상대국과 세계의 회복에는 해가 될 것입니다."
 spec_depression.2.f: ""나라마다 제 시장 둘레에 장벽을 쌓고는, 어째서 수출이 살아나지 않는지 고개를 갸웃거리는군.""
 spec_depression.2.a: "국내 산업을 보호하라."
 spec_depression.2.b: "시장을 계속 개방하라."
 spec_depression.3.t: "구호 사업"
 spec_depression.3.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]에서 수천 명이 일손을 놓고 있으며, 구호 기금도 바닥났습니다. 도시의 기술자들은 이들을 고용할 수 있는 사업 목록을 마련했습니다. 배수로, 도로, 제방, 새 시장 회관까지, 국고에서 비용만 대 준다면 할 일은 많습니다."
 spec_depression.3.f: ""배수로를 파고 일당을 받는 사람은 구걸하는 빈민이 아니오. 그 자신도 그 사실을 알고 있소.""
 spec_depression.3.a: "사업 자금을 지원하라."
 spec_depression.3.b: "자선은 민간의 일이다."
 spec_depression.4.t: "포위된 은행"
 spec_depression.4.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]의 은행들이 지금 무너지는 기업에 거액을 빌려주었다는 소문이 퍼졌습니다. 아침부터 예금자들이 저축을 찾으려 줄을 섰고, 저녁이면 은행에 내줄 동전이 하나도 남지 않을 것입니다. 은행 이사들은 정부의 개입을 요청하고 있습니다."
 spec_depression.4.f: ""은행은 모두가 부실하다고 믿기 전까지는 더없이 건실한 법이오.""
 spec_depression.4.a: "은행 휴업을 선포하라."
 spec_depression.4.b: "은행을 구제하라."
 spec_depression.4.c: "파산하도록 내버려 두어라."
 spec_depression.5.t: "통화 문제"
 spec_depression.5.d: "가격 하락을 두고 나라가 갈라졌습니다. 농민과 소액 차입자들은 돈이 너무 귀해졌으며, 물가가 떨어지는 해마다 빚의 무게가 더해진다고 호소합니다. 이들은 통화 발행을 늘리고 신용을 완화하길 원합니다. 은행가와 채권자들은 건전한 통화만이 국내외 투자자의 신뢰를 되찾을 수 있다고 맞섭니다."
 spec_depression.5.f: ""담보 대출은 5년 전 그대로인데, 내 밀값은 절반이 되었소.""
 spec_depression.5.a: "건전한 통화가 최우선이다."
 spec_depression.5.b: "신용을 완화하라."
 spec_depression.6.t: "실업자 행진"
 spec_depression.6.d: "실업자들의 행렬이 '일자리 아니면 빵을 달라'는 깃발을 앞세우고 [ROOT.GetCountry.GetCapital.GetCityHubName]에 들어섰습니다. 이들은 관청 앞에 진을 치고 청원서를 제출하게 해 달라고 요구합니다. 경찰은 해가 지기 전에 광장을 비울 수 있다고 합니다."
 spec_depression.6.f: ""우리는 자선을 구하는 것이 아닙니다. 일거리를 달라는 것입니다.""
 spec_depression.6.a: "해산시켜라."
 spec_depression.6.b: "청원을 들어 보라."
 spec_depression.7.t: "개혁 요구"
 spec_depression.7.d: "신문들은 불황이 이토록 오래가는 이유와 그에 앞선 투기로 누가 부자가 되었는지 묻고 있습니다. 의회에서는 은행과 거래소, 나아가 정부 자체의 처신까지 조사하라는 요구가 나왔습니다."
 spec_depression.7.f: ""이제 문제는 체제가 실패했느냐가 아니라, 누가 책임질 것이냐는 것이오.""
 spec_depression.7.a: "조사를 명하라."
 spec_depression.7.b: "체제에는 문제가 없다."
 spec_depression.8.t: "걷히는 $SPEC_LD_NAME$"
 spec_depression.8.d: "수년 만에 처음으로 새 주문이 취소되는 주문보다 빠르게 늘고 있습니다. 가격은 바닥을 찾았고, 은행은 다시 돈을 빌려주며, 멈춰 섰던 공장들이 일꾼을 들이고 있습니다. 불황은 끝났지만, 이를 겪은 이들 중 곧 잊을 사람은 드물 것입니다."
 spec_depression.8.f: ""장사가 나아진다지. 내 주문 장부도 같은 말을 할 때 믿겠소.""
 spec_depression.8.a: "교훈을 얻었다."
 spec_depression.8.b: "다시 생업으로 돌아가자."
