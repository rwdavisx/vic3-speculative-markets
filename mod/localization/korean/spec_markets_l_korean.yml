 SPEC_JE_STAGE_6: "[concept_spec_long_depression]이 [JournalEntry.GetCountry.GetCapital.GetCityHubName]을(를) 짓누르고 있습니다. 투자자들은 가진 것을 움켜쥔 채 누구에게도 빌려주지 않으며, 지금까지의 회복은 모두 몇 달 만에 꺾였습니다. 세계의 회복은 별도의 일지 항목에서 추적합니다.\n\n구호 사업은 불황이 이어지는 동안 실업자에게 건설 일을 주고 끼니를 해결해 줍니다."
 SPEC_JE_STAGE_5: "공황이 [JournalEntry.GetCountry.GetCapital.GetCityHubName]을(를) 휩쓸었습니다. 예금자들은 새벽부터 은행 앞에 줄을 서고 대출금은 회수되며, 정부가 나서지 않으면 앞으로 #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#!개월 동안 [concept_private_construction]이 절반으로 줄어듭니다.\n\n#v 은행에 대출#!하면 공황이 더 빨리 끝나고 효과가 절반으로 줄어듭니다. 구호 사업은 실업자에게 건설 일을 주고 끼니를 해결해 줍니다.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_currency_v'), '(CFixedPoint)0'), 'SPEC_JE_SUSPEND_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_4: "공황이 지나간 자리에는 파산한 상사와 짓다 만 공장들이 남았습니다. 투자자들은 손실을 헤아리고 있으며, #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic_cooldown').GetValue|0]#!개월 동안 새로운 공황은 발생하지 않습니다.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_reform_open_v'), '(CFixedPoint)0'), 'SPEC_JE_INQUIRY_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_3: "[JournalEntry.GetCountry.GetCapital.GetCityHubName]의 거래소가 광기에 휩싸였습니다. 사무원과 과부들이 빌린 돈으로 #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! 부문의 주식을 사들이고, [concept_spec_market_confidence]가 #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#! 이상인 달마다 [concept_spec_speculative_excess]이 늘어납니다. [concept_spec_market_confidence]가 #v 60#! 미만으로 떨어지면 거품이 터지며, 과잉이 심할수록 하락도 가파릅니다.\n\n가장 뜨거운 상품의 투기를 억제하거나 신용을 긴축하면 거품을 서서히 뺄 수 있습니다."
 SPEC_JE_STAGE_2: "자금 조달이 쉬워지고 투자자들은 낙관에 젖어 있습니다. #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! 부문의 신생 기업은 한 시간도 안 되어 청약이 몰려들고, 은행은 그 주식을 담보로 아낌없이 대출합니다. [concept_spec_market_confidence]가 #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#! 이상이면 [concept_spec_speculative_excess]이 쌓이기 시작합니다.\n\n호경기는 국채를 더 낮은 이자율로 차환할 기회이기도 합니다."
 SPEC_JE_STAGE_1: "[JournalEntry.GetCountry.GetCapital.GetCityHubName]의 거래소에서는 질서 있게 거래가 이루어집니다. 투자자들은 #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! 부문을 선호하고 #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! 및 #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#! 부문을 기피합니다."
 SPEC_JE_STAGE_0: "[JournalEntry.GetCountry.GetCapital.GetCityHubName]의 투자자들이 경계하고 있습니다. 최근 손실에 데인 이들은 자금을 움켜쥐고 #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! 및 #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#! 부문을 기피합니다. 신용을 완화하거나 상품 투자를 장려하면 다시 투자하도록 유도할 수 있습니다."
