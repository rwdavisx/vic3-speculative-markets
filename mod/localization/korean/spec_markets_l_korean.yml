 spec_markets.2.f: ""어제 내 재산은 4만이었소. 오늘 아침엔 외투 한 벌이 전부인데, 그것마저 헐값에 사겠다는군.""
 spec_markets.2.a: "시장이 스스로 바닥을 찾아야 한다."
 spec_markets.2.a.tt: "나중에 #v 은행에 대출#!하지 않으면 [concept_spec_financial_panic]이 끝까지 진행됩니다. 은행에 대출하면 이 $ig_industrialists$ [concept_approval] 변화도 사라집니다"
