 SPEC_SEP_CALM_TT: "#header @spec_interest_calm! [concept_spec_investor_interest]: 관망#!\n우리나라 거래 비중: #v [Country.MakeScope.Var('spec_heat_3').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n효과 없음"
