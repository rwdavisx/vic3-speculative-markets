 SPEC_LEVERS_TT: "#header 시장 개입#!\n매달 [concept_authority] #N -[Country.MakeScope.ScriptValue('spec_lever_authority')|0]#!\n$TOOLTIP_DELIMITER$\n억제: #v [Country.MakeScope.ScriptValue('spec_n_restrain')|0]#!\n장려: #v [Country.MakeScope.ScriptValue('spec_n_encourage')|0]#!\n[concept_budget_additional_income]: 매주 #P @money![Country.MakeScope.ScriptValue('spec_lever_levy')|D]#!\n[concept_budget_additional_expenses]: 매주 #N @money![Country.MakeScope.ScriptValue('spec_lever_spend')|D]#!"
 spec_story.1.t: "[ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName] 시장의 붕괴"
 spec_story.1.t_generic: "시장의 붕괴"
 spec_story.1.d: "[ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName] 부문으로 몰리던 열기가 끝났습니다. 1년간 오른 가격이 한 달 만에 내려앉았고, 광풍의 정점에 설립된 회사들은 대금을 치르지 못합니다. 값도 가리지 않고 사들인 상인들에게는 비우지 못할 창고만 남았으며, 그 재고를 담보로 대출한 은행은 손실을 헤아리고 있습니다."
 spec_story.1.d_generic: "한때 가장 인기 있던 상품으로 몰리던 열기가 끝났습니다. 1년간 오른 가격이 한 달 만에 내려앉았고, 광풍의 정점에 설립된 회사들은 대금을 치르지 못합니다. 값도 가리지 않고 사들인 상인들에게는 비우지 못할 창고만 남았으며, 그 재고를 담보로 대출한 은행은 손실을 헤아리고 있습니다."
 spec_story.1.f: ""[ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName] 장사를 30년이나 했지만, 이번 한 해처럼 사겠다고 안달하고 팔겠다고 애원하는 사람들은 본 적이 없소.""
 spec_story.1.f_generic: ""이 장사를 30년이나 했지만, 이번 한 해처럼 사겠다고 안달하고 팔겠다고 애원하는 사람들은 본 적이 없소.""
 spec_story.1.a: "몰락한 생산자에게 구호를 제공하라."
 spec_story.1.b: "가장 취약한 상사는 무너지게 두어라."
 spec_story.1.c: "발기인들을 조사하라."
 spec_story.2.t: "드러난 사기"
 spec_story.2.d: "[ROOT.GetCountry.GetCapital.GetCityHubName] [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] 회사의 이사들이 국외로 달아났습니다. 장부를 살펴보니 지난 2년간의 후한 배당금은 새로 들어온 청약금에서 나왔습니다. 수천 명의 사무원, 과부, 자영업자가 이 회사의 주식을 갖고 있었습니다. 이제 [ROOT.GetCountry.GetCapital.GetCityHubName]의 모든 신문이 같은 자의 손에서 나온 투자 안내서가 얼마나 더 있는지 묻고 있습니다."
 spec_story.2.d_generic: "[ROOT.GetCountry.GetCapital.GetCityHubName]의 이름난 주식회사 이사들이 국외로 달아났습니다. 장부를 살펴보니 지난 2년간의 후한 배당금은 새로 들어온 청약금에서 나왔습니다. 수천 명의 사무원, 과부, 자영업자가 이 회사의 주식을 갖고 있었습니다. 이제 [ROOT.GetCountry.GetCapital.GetCityHubName]의 모든 신문이 같은 자의 손에서 나온 투자 안내서가 얼마나 더 있는지 묻고 있습니다."
 spec_story.2.f: "#bold 사기 혐의로 수배#!\n[ROOT.GetCountry.GetCapital.GetCityHubName] [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] 회사의 전무이사. 나이 약 50세, 옷차림이 단정하고 언행이 그럴듯함. 마지막 목격 장소는 부두."
 spec_story.2.f_generic: "#bold 사기 혐의로 수배#!\n[ROOT.GetCountry.GetCapital.GetCityHubName] 소재 주식회사의 전무이사. 나이 약 50세, 옷차림이 단정하고 언행이 그럴듯함. 마지막 목격 장소는 부두."
 spec_story.2.a: "이사들을 기소하라."
 spec_story.2.b: "조용히 덮어 두어라."
 spec_story.2.c: "소액 투자자들에게 보상하라."
 spec_story.3.t: "예금 인출 쇄도"
 spec_story.3.d: "오늘 아침 예금자들이 [ROOT.GetCountry.GetCapital.GetCityHubName]에서 가장 오래된 은행 중 한 곳을 에워쌌고, 정오가 되자 은행은 문을 닫았습니다. 도시 어디에서도 그 은행권을 받지 않으며, 그곳에 돈을 맡긴 기업은 이번 주 일꾼들의 임금을 줄 수 없습니다. 다른 은행 앞의 줄도 시간이 갈수록 길어집니다."
 spec_story.3.f: ""아버지도 그 은행에 저축을 맡겼고, 할아버지도 그랬소. 국고만큼 안전하다더니.""
 spec_story.3.a: "예금을 보장하라."
 spec_story.3.b: "흥망은 스스로 감당해야 한다."
 spec_story.3.c: "은행에 대출해야 한다."
 spec_story.4.t: "[ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]의 공황"
 spec_story.4.t_generic: "해외의 공황"
 spec_story.4.d: "[ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]에서 [concept_spec_financial_panic]이 발생했다는 소식이 [ROOT.GetCountry.GetCapital.GetCityHubName]에 전해졌습니다. 그곳 은행들이 해외 대출금을 회수하면서, [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]에 물건을 팔거나 그곳에서 돈을 빌린 우리 기업들이 갑자기 자금난에 빠졌습니다. 거래소의 모든 상인이 이 사태가 번질지 궁금해합니다."
 spec_story.4.d_generic: "해외에서 금융 공황이 발생했다는 소식이 [ROOT.GetCountry.GetCapital.GetCityHubName]에 전해졌습니다. 외국 은행들이 대출금을 회수하면서, 해외에 물건을 팔거나 해외에서 돈을 빌린 우리 기업들이 갑자기 자금난에 빠졌습니다. 거래소의 모든 상인이 이 사태가 번질지 궁금해합니다."
 spec_story.4.f: ""[ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]에서 재채기 한 번 하면 우리 거래소는 몸져눕는구려.""
 spec_story.4.f_generic: ""이웃 나라에서 재채기 한 번 하면 우리 거래소는 몸져눕는구려.""
 spec_story.4.a: "우리 상사에 대출하라."
 spec_story.4.b: "그들의 곤경은 우리 일이 아니다."
 spec_story.4.c: "무모한 외국 은행가들을 비난하라."
 spec_story.5.t: "돌아오는 신뢰"
 spec_story.5.d: "공황의 최악은 지나갔습니다. 살아남은 기업은 다시 일꾼을 고용하고, 은행은 건실한 고객에게 대출하기 시작했으며, 대담한 투자자 몇몇은 작년 가격의 일부에 불과한 값으로 주식을 사들이고 있습니다. 누구도 예전의 과열이 곧 돌아오리라 기대하지 않지만, [ROOT.GetCountry.GetCapital.GetCityHubName]의 상업은 다시 기지개를 켜고 있습니다."
 spec_story.5.f: ""봄에 전부 팔아 치운 사람들이 가을에 다시 사들이는군. 팔 때보다 더 좋은 값에 말이오.""
 spec_story.5.a: "새로운 사업을 장려하라."
 spec_story.5.b: "이번에는 건전하게 대출해야 한다."
 spec_story.6.t: "제조업자 대표단"
 spec_story.6.d: "제조업자와 상인의 대표단이 정부를 찾아왔습니다. 신용 부족으로 새 공장은 짓다 말았는데, 해외 경쟁자들은 마음껏 돈을 빌려 시장을 빼앗아 간다고 합니다. 이들은 은행이 다시 대출할 수 있도록 허용해 달라고 요구합니다."
 spec_story.6.f: ""각하의 신중함 덕에 폭락을 피했지요. 폭락할 것조차 남겨 두지 않으셨으니 말입니다.""
 spec_story.6.a: "신용을 완화하라."
 spec_story.6.b: "신용 긴축을 유지하라."
 spec_story.6.c: "대신 보조금을 제공하라."
 spec_story.7.t: "주식 열풍"
 spec_story.7.d: "사무원, 자영업자, 교사들이 [ROOT.GetCountry.GetCapital.GetCityHubName]의 커피하우스에 몰려들어 한 번도 본 적 없는 회사의 주식을 거래합니다. [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] 부문 신생 회사의 주식은 하루에도 몇 번씩 주인이 바뀌며, 대부분 빌린 돈으로 사들인 것입니다. 하인들마저 다음 주식 모집에 끼려고 모아 둔 재산을 저당 잡힌다는 말이 돕니다."
 spec_story.7.d_generic: "사무원, 자영업자, 교사들이 [ROOT.GetCountry.GetCapital.GetCityHubName]의 커피하우스에 몰려들어 한 번도 본 적 없는 회사의 주식을 거래합니다. 갓 생긴 회사의 주식은 하루에도 몇 번씩 주인이 바뀌며, 대부분 빌린 돈으로 사들인 것입니다. 하인들마저 다음 주식 모집에 끼려고 모아 둔 재산을 저당 잡힌다는 말이 돕니다."
 spec_story.7.f: ""오늘 아침 이발사가 [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] 주식에 관한 조언을 해주더군. 잘 듣고 나도 답례로 조언 하나 했지. 팔라고.""
 spec_story.7.f_generic: ""오늘 아침 이발사가 주식에 관한 조언을 해주더군. 잘 듣고 나도 답례로 조언 하나 했지. 팔라고.""
 spec_story.7.a: "국민도 부를 나누게 하라."
 spec_story.7.b: "빌린 돈으로 거래하지 못하게 하라."
 spec_story.7.c: "주식 양도에 인지세를 부과하라."
 spec_story.8.t: "거품 경고"
 spec_story.8.d: "존경받는 경제학자가 [ROOT.GetCountry.GetCapital.GetCityHubName]의 유력 신문에 글을 보냈습니다. [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] 및 [ROOT.GetCountry.MakeScope.Var('spec_story_good2').GetGoods.GetName] 가격의 상승은 지속될 수 없으며, 은행들이 제정신인 사람은 치르지 않을 가격을 믿고 대출했다는 내용입니다. 중개인들은 늙은 여인의 넋두리라며 비웃습니다. 하지만 그 글은 도시의 모든 사교 모임과 상사 사무실에서 소리 내어 읽히고 있습니다."
 spec_story.8.d_generic: "존경받는 경제학자가 [ROOT.GetCountry.GetCapital.GetCityHubName]의 유력 신문에 글을 보냈습니다. 요즘 가장 인기 있는 상품의 가격 상승은 지속될 수 없으며, 은행들이 제정신인 사람은 치르지 않을 가격을 믿고 대출했다는 내용입니다. 중개인들은 늙은 여인의 넋두리라며 비웃습니다. 하지만 그 글은 도시의 모든 사교 모임과 상사 사무실에서 소리 내어 읽히고 있습니다."
 spec_story.8.f: ""가격이란 마지막 구매자가 기꺼이 치른 금액에 불과합니다. 독자 여러분은 앞으로 살 사람이 얼마나 남았는지 생각해 보시기 바랍니다.""
 spec_story.8.a: "때맞춘 경고다."
 spec_story.8.b: "터무니없는 위기론이다."
