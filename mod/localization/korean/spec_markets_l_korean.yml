 SPEC_DRIVER_RESTRAIN_TT: "#header 억제된 호황: [Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n이번 달 서서히 가라앉힌 호황에서: [Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0')|+=2]\n[concept_spec_market_conditions]에서: #tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#!\n$TOOLTIP_DELIMITER$\n억제된 호황은 한 번에 무너지지 않고 [concept_spec_correction]으로 서서히 가라앉습니다. 매월 약간의 비용이 듭니다."
 SPEC_DRIVER_CAUTION_TT: "#header 정부와 사건: [Country.MakeScope.Var('spec_c_caution').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n우리의 결정과 시장 사건으로 이번 달 한 번만 일어나는 변화입니다."
 SPEC_DRIVER_LIMIT_TT: "#header 하한과 상한: [Country.MakeScope.Var('spec_c_limit').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_market_confidence]는 #v 0#! 아래로 내려가거나 #v 100#! 위로 올라갈 수 없으므로, 이번 달 변화 중 이만큼은 반영되지 않았습니다."
 SPEC_DRIVER_RESCUE_TT: "#header 은행 지원: [Country.MakeScope.Var('spec_c_rescue').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#v 은행에 대출#! 또는 #v 은행법 정지#!로 인한 일회성 상승입니다. [concept_spec_market_confidence]을(를) #v 100#! 이상으로 올릴 수 없습니다."
 SPEC_DRIVER_RESCUE: "은행 구제"
 SPEC_DRIVER_WAREND: "전쟁 종료"
 SPEC_DRIVER_WAREND_TT: "#header 전쟁 종료: [Country.MakeScope.Var('spec_c_warend').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n우리 [concept_casualties]에서: 전체 효과의 #v x[Country.MakeScope.Var('spec_war_stakes_now').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n전쟁 결과에 따른 전체 효과:\n승리, [concept_war_goal] 관철: #P +4#!\n승리, 관철한 것 없음: #P +1#!\n패배, 우리에게 [concept_war_goal] 관철됨: #N -8#!\n패배, 관철된 것 없음: #N -2#!\n승자 없음: #N -1#!\n\n우리 손실에 따라 조정: 최소 효과의 #v 25%#!, 전쟁으로 병력의 #v 25%#!를 잃으면 전체 효과."
 SPEC_DRIVER_BURST: "거품 붕괴"
 SPEC_DRIVER_BURST_TT: "#header 거품 붕괴: [Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_speculative_excess]에서: #v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0'), Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_burst_per_heat'), '(CFixedPoint)-1'))|0]#!\n포인트당 #N -[Country.MakeScope.ScriptValue('spec_burst_per_heat')|2]#!\n상한 #N -[Country.MakeScope.ScriptValue('spec_burst_max')|0]#!\n$TOOLTIP_DELIMITER$\n호황으로 #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#! 초과까지 오른 [concept_spec_market_confidence]가 #v 60#! 미만으로 떨어지면 거품이 터집니다. 호황이 오래 지속되고 높이 오를수록 손실이 큽니다.\n\n[GetTechnology('stock_exchange').GetName] 보유국만 거품을 만듭니다."
 SPEC_DRIVER_CAUTION: "정부와 사건"
 SPEC_DRIVER_RESTRAIN: "억제된 호황"
 SPEC_DRIVER_LIMIT: "하한과 상한"
 SPEC_DRIVER_BOOM: "호황 상품"
 SPEC_DRIVER_BOOM_TT: "#header 호황 상품: [Country.MakeScope.Var('spec_c_boom').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n호황 상태의 [Concept('concept_good','$concept_goods|q$')] #v [Country.MakeScope.Var('spec_n_boom').GetValueWithDefault('(CFixedPoint)0')|0]#!개에서: [Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0')|+=2][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_BOOM_CAP')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_steady'), '(CFixedPoint)1')), 'SPEC_BOOM_STEADY')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_fin_boom'), '(CFixedPoint)1')), 'SPEC_BOOM_FIN')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_boom_rule'), '(CFixedPoint)1')), 'SPEC_BOOM_RULE')]\n$TOOLTIP_DELIMITER$\n각 호황은 [concept_market] 점유율에 따라 [concept_spec_market_confidence]를 높입니다. [concept_spec_financial_panic] 중에는 효과가 없습니다. [GetTechnology('stock_exchange').GetName], [GetTechnology('investment_banks').GetName], [GetTechnology('modern_financial_instruments').GetName] 도입 시 호황의 규모가 커집니다."
 SPEC_BOOM_CAP: "\n배수 적용 전 상한 #v +3#!"
 SPEC_BOOM_STEADY: "\n저택에서: #v x[Country.MakeScope.ScriptValue('spec_steady')|2]#!"
 SPEC_BOOM_FIN: "\n금융 기술에서: #v x[Country.MakeScope.ScriptValue('spec_fin_boom')|2]#!"
 SPEC_BOOM_RULE: "\n시장 변동성에서: #v x[Country.MakeScope.ScriptValue('spec_boom_rule')|2]#!"
 SPEC_DRIVER_CRASH: "종료된 호황"
 SPEC_DRIVER_CRASH_TT: "#header 종료된 호황:[Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n최근 한 달 최대: #v [Country.MakeScope.Var('spec_crashed').GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\n종료된 호황의 규모에서: [Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0')|+=2]\n[concept_spec_market_conditions]에서: #tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#![AddLocalizationIf(Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-40')), 'SPEC_CRASH_CAP')]\n$TOOLTIP_DELIMITER$\n각 [concept_spec_boom_end]은(는) [concept_spec_market_confidence]을(를) 낮춥니다. 호황이 클수록, [concept_market]에서 차지하는 비중이 클수록 손실도 커집니다. [GetTechnology('mutual_funds').GetName]은(는) 이를 줄이고, [GetTechnology('modern_financial_instruments').GetName]은(는) 늘립니다."
 SPEC_CRASH_CAP: "\n월 상한 #N -40#!"
 SPEC_DRIVER_FOREIGN: "해외 공황"
 SPEC_FOREIGN_HIT: "\n[concept_spec_foreign_panic]에서: #N -20#!\n상대 경제 대비 우리 경제에서: #v x[Country.MakeScope.Var('spec_fh_size').GetValueWithDefault('(CFixedPoint)0')|2]#!\n우리 [concept_spec_market_tie]에서: #v x[Country.MakeScope.Var('spec_fh_tie').GetValueWithDefault('(CFixedPoint)0')|2]#!\n상대 [concept_rank]에서: #v x[Country.MakeScope.Var('spec_fh_reach').GetValueWithDefault('(CFixedPoint)0')|2]#![AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_foreign_loss_mult'), '(CFixedPoint)1')), 'SPEC_FOREIGN_UNSTD')]"
 SPEC_FOREIGN_UNSTD: "\n[GetTechnology('currency_standards').GetName] 미보유에서: #v x[Country.MakeScope.ScriptValue('spec_foreign_loss_mult')|2]#!"
 SPEC_FOREIGN_FLIGHT: "\n[concept_spec_capital_flight]에서: [Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')|+=2]"
 SPEC_DRIVER_FOREIGN_TT: "#header 해외 공황: [Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n최근 사례: #v [Country.MakeScope.Var('spec_foreign_src').GetCountry.GetName]#!\n$TOOLTIP_DELIMITER$[AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_HIT')][AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_FLIGHT')]\n$TOOLTIP_DELIMITER$\n동일 [concept_market]: #v [Country.MakeScope.ScriptValue('spec_tie_market')|%0]#!\n종속국 또는 종주국: #v 80%#!\n해외 투자권: #v [Country.MakeScope.ScriptValue('spec_tie_investment')|%0]#!\n시장 간 대규모 무역: #v [Country.MakeScope.ScriptValue('spec_tie_trade')|%0]#!\n우리 경제의 외국 소유: 최대 #v 90%#!\n\n우리나라와 연계된 [concept_country]에서 [concept_spec_financial_panic]이 발생하면 이곳의 [concept_spec_market_confidence]가 하락합니다. [concept_spec_market_tie]가 긴밀하고 상대국의 경제가 우리나라보다 클수록 손실이 큽니다. [concept_great_power]은 손실 전부를, 강대국은 절반을, 소국은 일부만 전달합니다. 해외에서 전염된 공황은 더 퍼지지 않습니다. [GetTechnology('currency_standards').GetName] 미보유 시 손실이 4분의 1만큼 더 커집니다."
 SPEC_DRIVER_TURMOIL: "전쟁과 소요"
 SPEC_DRIVER_TURMOIL_TT: "#header 전쟁과 소요: [Country.MakeScope.Var('spec_c_turmoil').GetValueWithDefault('(CFixedPoint)0')|+=2]#!$SPEC_ITEMS_TURMOIL$\n$TOOLTIP_DELIMITER$\n[concept_war] 하나당, [concept_spec_war_news]에서: 매월 #N -3#!~#P +0.15#!\n모든 전쟁 합계: 매월 #N -4#!~#P +0.5#!\n전쟁에 이르지 않은 [concept_diplomatic_play]: 매월 #N -0.5#!\n국고 고갈: 최대 매월 #N -3#!, [concept_bankruptcy] #v 20#!주 전부터\n[concept_default]: 매월 #N -5#!\n[concept_revolution]: 매월 #N -2#!\n\n숫자 위에 마우스를 올리면 이유가 표시됩니다."
 SPEC_DRIVER_MOOD: "시장 분위기"
 SPEC_DRIVER_MOOD_TT: "#header 시장 분위기: [Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n이번 달 변동에서: [Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0')|+=2]\n지난달 분위기에서: [Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0'))|+=2]\n$TOOLTIP_DELIMITER$\n[concept_spec_market_mood]는 매월 무작위로 변하며 어느 쪽으로든 최대 #v 0.75#! 움직입니다. 그중 #v 75%#!는 다음 달로 이어집니다."
 SPEC_DRIVER_DRIFT: "기준치 복귀"
 SPEC_DRIVER_DRIFT_TT: "#header 기준치 복귀: [Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_baseline]까지의 거리(#v 55#!)에서: [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0'), Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100'))|+=1]\n매월 #v x[Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100')|%1]#! 회복\n$TOOLTIP_DELIMITER$\n[GetTechnology('macroeconomics').GetName] 도입 시 이 속도가 절반만큼 더 빨라집니다."
 SPEC_DRIVER_TIGHT: "신용 긴축"
 SPEC_DRIVER_GROWTH: "성장"
 SPEC_DRIVER_GROWTH_TT: "#header 성장: [Country.MakeScope.Var('spec_c_growth').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n최근 평균 대비 [concept_gdp]에서: #v [Country.MakeScope.Var('spec_growth').GetValueWithDefault('(CFixedPoint)0')|=+%1]#!\n정상 성장률에서: #v -2%#!\n$TOOLTIP_DELIMITER$\n성장률이 정상보다 #v 1%#! 높거나 낮을 때마다 [concept_spec_market_confidence]가 매월 #v 0.1#!만큼 움직이며, 어느 쪽이든 최대 #v 0.6#!입니다."
 SPEC_DRIVER_BUSINESS: "재계 분위기"
 SPEC_DRIVER_BUSINESS_TT: "#header 재계 분위기: [Country.MakeScope.Var('spec_c_business').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n기업가의 [concept_approval]: #v [Country.MakeScope.ScriptValue('spec_ind_approval')|0]#!\n\n충성(#v 10#! 이상): 매월 #P +0.4#!\n만족(#v 5#! 이상): 매월 #P +0.2#!\n불만족(#v -5#! 이하): 매월 #N -0.2#!\n분노(#v -10#! 이하): 매월 #N -0.4#!"
 SPEC_DRIVER_TIGHT_TT: "#header 신용 긴축: [Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_market_confidence]의 #v 60#! 초과분: #v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.1')|1]#!\n[Concept('concept_spec_credit_policy','$concept_spec_credit_policy_tight|q$')]에서: 매월 그 #N -10%#!\n$TOOLTIP_DELIMITER$\n이로써 호황은 한 번에 식지 않고 수개월에 걸쳐 서서히 식습니다."
 concept_spec_market_conditions: "시장 여건"
 concept_spec_market_conditions_desc: "$concept_spec_market_conditions$은 [concept_spec_boom_end]이(가) [concept_spec_market_confidence]을(를) 얼마나 잃게 하는지를 정합니다. 호황이 끝날 때 $concept_spec_market_confidence$이(가) 높을수록 손실이 커집니다. $concept_spec_market_confidence$이(가) #v 55#!이면 효과가 없습니다. 금융가, 저택, 금융 기술도 이에 영향을 줍니다."
 concept_spec_baseline: "기준 신뢰도"
 concept_spec_baseline_desc: "가만히 두면 [concept_spec_market_confidence]는 위에서든 아래에서든 $concept_spec_baseline$ #v 55#! 쪽으로 되돌아갑니다. 멀리 벗어날수록 더 빨리 돌아옵니다."
 concept_spec_market_mood: "시장 분위기"
 concept_spec_market_mood_desc: "$concept_spec_market_mood$는 뚜렷한 원인 없이 나타나는 투자자 심리의 흔들림입니다. 매월 무작위로 어느 쪽으로든 최대 #v 0.75#!만큼 변하며, 이월되는 비율은 #v 75%#!입니다. 그래서 좋은 시기와 나쁜 시기가 한동안 이어지다 사라집니다."
 concept_spec_market_tie: "시장 연계"
 concept_spec_market_tie_desc: "$concept_spec_market_tie$는 한 [concept_country]가 다른 나라의 [concept_market]을 얼마나 따르는지를 나타냅니다. 둘 사이에 [concept_spec_financial_panic]이 얼마나 전달될지를 정합니다.\n\n소유 관계는 한 국가가 다른 나라 [concept_gdp]의 #v 10%#! 이상을 소유할 때부터 계산되며, #v 30%#!에서 가장 강합니다. [GetLawType('law_free_trade').GetName] 도입 시 무역 연계가 강해지고 다른 무역 정책은 이를 약화합니다. [GetTechnology('international_exchange_standards').GetName] 도입 시 시장과 투자 연계가 강해집니다. [concept_embargo]는 무역 연계를 끊습니다."
 concept_spec_capital_flight: "자본 도피"
 concept_spec_capital_flight_desc: "[concept_spec_financial_panic]이 시작되면 자금이 안전한 곳으로 도피합니다. 각 [concept_great_power]과(와), [concept_spec_exchange]이(가) #v 국제#! 이상인 각 [concept_country]는 평화 상태이고 #v 안정#! 이상이며 공황 국가와 연계되지 않았다면 [concept_spec_market_confidence]를 최대 #P +[GetPlayer.MakeScope.ScriptValue('spec_flight_gain_max')|0]#! 얻습니다. [GetTechnology('international_trade').GetName], [GetTechnology('international_exchange_standards').GetName] 도입 시 이 이득이 커집니다. [concept_spec_exchange]의 위상이 높을수록 더 많이 받습니다."
 concept_spec_war_news: "전쟁 소식"
 concept_spec_war_news_desc: "투자자들은 [concept_war]을 매월 지켜봅니다. $concept_spec_war_news$은 전쟁의 진행 상황에 따라 매월 [concept_spec_market_confidence]를 움직입니다. [concept_casualties], [concept_blockade], [concept_devastation], [concept_gdp] 하락, 장기전은 신뢰도를 낮추고, [Concept('concept_battle','$concept_battles|q$')] 승리와 적 영토 점령은 높입니다. 전쟁 하나는 매월 #N -3#!에서 #P +0.15#!까지, 모든 전쟁 합계는 #N -4#!에서 #P +0.5#!까지 움직입니다."
