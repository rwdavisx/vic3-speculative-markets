 concept_spec_exchange_desc: "[concept_country]의 $concept_spec_exchange$은(는) 주식, 채권, 신용이 거래되는 곳입니다. 위상은 [Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')] 점수에 따라 #v 지방#!, #v 전국#!, #v 국제#!([GetTechnology('stock_exchange').GetName] 필요), #v 세계 중심#!([GetTechnology('central_banking').GetName] 필요)으로 정해집니다. 위상이 높을수록 가격 상승에 대한 투자자 반응이 커지며, #v 국제#!부터는 [concept_spec_capital_flight]이(가) 유입됩니다.\n\n국가는 거래소에 #v 상품 거래소#!, #v 자금 시장#!, #v 주식 시장#! 중 하나의 인가를 부여합니다. 거래소는 #v 7#!개의 명성의 길 중 #v 1#!~#v 4#!개를 특화 분야로 가지며, 위상이 오를수록 늘어나고, 각각 최소 #v 5#!년간 유지합니다.\n\n신뢰는 건전한 대출 아래 평온한 해에 오르고, [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')], [concept_spec_bad_debts], 주요 상품의 [concept_spec_bust]이나 [concept_spec_collapse]로 떨어집니다. 신뢰가 낮으면 [concept_loans] 이자율이 오르고, 높으면 내려갑니다."
