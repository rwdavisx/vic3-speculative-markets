 concept_spec_speculative_excess: "투기 과잉"
 concept_spec_speculative_excess_desc: "$concept_spec_speculative_excess$은 호황 중 [concept_country]의 [concept_market]에 쌓이는 거품의 크기를 나타냅니다. [GetTechnology('stock_exchange').GetName] 연구를 마치면 [concept_spec_market_confidence]가 #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! 이상인 달마다 증가하며, $concept_spec_market_confidence$가 높을수록 더 빨리 증가합니다. $concept_spec_market_confidence$가 #v 60#!~#v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! 사이에 머무는 동안에는 매월 #v 2%#!씩 줄어듭니다.\n\n$concept_spec_market_confidence$가 #v 60#! 미만으로 떨어지면 거품이 터지고 $concept_spec_market_confidence$가 추가로 최대 #v [GetPlayer.MakeScope.ScriptValue('spec_burst_max')|0]#! 하락합니다. $concept_spec_speculative_excess$이 높을수록 하락도 가파릅니다."
 concept_spec_sound_finance: "건전한 금융"
 concept_spec_sound_finance_desc: "$concept_spec_sound_finance$은 은행권 규칙, 최종 대부자, 회사법의 세 가지 [concept_spec_banking_reforms]을 모두 시행하면 달성합니다.\n\n세 가지를 모두 시행하면 [concept_country]의 [concept_prestige]이 #v 10#! 증가하고 [concept_loans] 이자가 #v 5%#! 감소합니다."
 concept_spec_banking_reforms: "은행 개혁"
 concept_spec_banking_reform: "은행 개혁"
 concept_spec_banking_reforms_desc: "$concept_spec_banking_reforms$은 [concept_country]의 은행과 기업이 운영되는 규칙을 정합니다. 각 개혁은 기술로 해금되며, [concept_spec_financial_panic] 이후 또는 공황 없이 #v 10#!년이 지나면 열 수 있는 조사 위원회를 통해 시행됩니다. 위원회마다 개혁 하나를 시행합니다.\n\n#bold 은행권 규칙#! ([GetTechnology('banking').GetName]), 둘 중 하나:\n#bold 통화학파:#! $spec_reform_currency_tt$\n#bold 자유 은행제:#! $spec_reform_free_tt$\n\n#bold 최종 대부자#! ([GetTechnology('central_banking').GetName]): $spec_reform_llr_tt$\n\n#bold 회사법#! ([GetTechnology('joint_stock_companies').GetName]): $spec_reform_company_tt$\n\n세 가지를 모두 시행하면 [concept_spec_sound_finance]을(를) 달성합니다."
 alert_spec_panic_risk_alert_name: "공황 위험"
 spec_panic_risk_alert_setting_name: "공황 위험"
 alert_spec_panic_risk_alert_desc: "지금 우리나라의 호황이 끝나면 [concept_spec_market_confidence]가 #N [GetPlayer.MakeScope.ScriptValue('spec_after_collapse')|0]#!까지 하락하여, [concept_spec_financial_panic] 발생 기준인 #v [GetPlayer.MakeScope.ScriptValue('spec_panic_at')|0]#! 미만이 됩니다."
 alert_spec_panic_risk_alert_hint: "가장 위험한 상품의 투기를 억제하거나, #bold $SPEC_FINANCE$#! 창의 #bold $SPEC_FIN_TAB_BANKING$#! 탭에서 [concept_spec_credit_policy]을(를) 긴축하십시오."
 alert_spec_panic_risk_alert_action: "일지"
 alert_spec_bubble_alert_name: "투기 과잉"
 spec_bubble_alert_setting_name: "투기 과잉"
 alert_spec_bubble_alert_desc: "우리나라의 [concept_spec_speculative_excess]은 #v [GetPlayer.MakeScope.Var('spec_heat').GetValue|0]#!입니다. [concept_spec_market_confidence]가 다시 #v 60#! 미만으로 떨어지면 거품이 터지고 [concept_spec_market_confidence]가 추가로 #N [GetPlayer.MakeScope.ScriptValue('spec_burst_now')|0]#! 하락합니다."
 alert_spec_bubble_alert_hint: "[concept_spec_market_confidence]가 #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! 이상인 달마다 거품이 커지며, #v 60#!부터 그 사이에 머무는 동안에는 식어갑니다. 호황 상품의 투기를 억제하거나 [concept_spec_credit_policy]을 긴축하면 거품을 서서히 줄일 수 있습니다."
 alert_spec_bubble_alert_action: "일지"
 alert_spec_rescue_alert_name: "은행 지원 가능"
 spec_rescue_alert_setting_name: "은행 지원 가능"
 alert_spec_rescue_alert_desc: "[concept_spec_financial_panic]이 진행 중이지만 아직 은행에 대출하지 않았습니다."
 alert_spec_rescue_alert_hint: "#v 은행에 대출#!하면 공황이 짧아지고 효과가 절반으로 줄며 [concept_spec_market_confidence]이(가) #P +20#! 상승합니다. 공황마다 한 번, #bold $SPEC_FINANCE$#! 창의 #bold $SPEC_FIN_TAB_BANKING$#! 탭에서 할 수 있습니다."
 alert_spec_rescue_alert_action: "일지"
 alert_spec_bailout_alert_name: "부실 대출 매입 가능"
 spec_bailout_alert_setting_name: "부실 대출 매입 가능"
 alert_spec_bailout_alert_desc: "[concept_spec_bad_debts]이 [concept_throughput]과 투자를 억누르고 있지만, 국가는 아직 부실 대출을 매입하지 않았습니다."
 alert_spec_bailout_alert_hint: "#v 부실 대출 매입#!은 #v @money![GetPlayer.MakeScope.ScriptValue('spec_bailout_cost')|D]#!로 남은 [concept_spec_bad_debts]을(를) 절반으로 줄입니다. 지속되는 동안 한 번, #bold $SPEC_FINANCE$#! 창의 #bold $SPEC_FIN_TAB_BANKING$#! 탭에서 할 수 있습니다."
 alert_spec_bailout_alert_action: "일지"
