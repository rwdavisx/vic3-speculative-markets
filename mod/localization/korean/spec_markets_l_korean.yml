 spec_lever_authority_tt: "사용 가능한 [concept_authority]가 충분함"
 spec_lever_fits_restrain_tt: "[concept_spec_investor_interest]가 #v 열의#! 이상이거나, 호황 종료 시 [concept_spec_market_confidence] 손실이 #v 2#! 이상임"
 spec_lever_fits_encourage_tt: "[concept_spec_investor_interest]가 #v 관심#! 미만이며, [concept_good]이 호황 이후 회복 중이 아니고, [concept_spec_bust] 또는 [concept_spec_collapse]로 끝날 수 있는 호황도 없음"
 SPEC_LEVER_RESTRAIN_TT: "#header [Goods.GetName] 투기 억제#!\n$TOOLTIP_DELIMITER$\n[concept_spec_investor_interest]: 몇 달에 걸쳐 #v 관망#!으로 완화\n[concept_authority]: 매달 #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#!#indent_newline:3 \n기본 수치에서: #v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! (해당 상품 소비세의 절반)\n무역 비중에서: #v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! (우리 시장의 #v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#!)#!\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_DOWN', 'SPEC_LEVER_NONE')][concept_budget_additional_income]: 매주 #P @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_levy_', Goods.GetKey))|D]#!, 기본 가격 기준 주간 생산량의 10%에 해당하는 부담금\n\n억제 중에는 호황이 커지거나 한꺼번에 끝날 수 없습니다. 약 1년에 걸쳐 [concept_spec_correction](으)로 서서히 마무리되며, 매달 [concept_spec_market_confidence]을(를) 조금씩 잃습니다.\n\n#lore 1720년의 거품법과 같습니다. 이 법은 남해 거품 사건 이후 새로운 주식회사 설립을 제한했습니다.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_restrain_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_restrain').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_LEVER_ENCOURAGE_TT: "#header [Goods.GetName] 투자 장려#!\n$TOOLTIP_DELIMITER$\n[concept_spec_investor_interest]: 몇 달에 걸쳐 #v 관심#!까지 상승\n[concept_authority]: 매달 #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#!#indent_newline:3 \n기본 수치에서: #v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! (해당 상품 소비세의 절반)\n무역 비중에서: #v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! (우리 시장의 #v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#!)#!\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_UP', 'SPEC_LEVER_NONE')][concept_budget_additional_expenses]: 매주 #N @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_subsidy_', Goods.GetKey))|D]#!, 기본 가격 기준 주간 생산량의 20%에 해당하는 보조금\n\n[concept_good]이(가) #v 열의#!에 도달하면 스스로 해제되어, 호황이 자연스럽게 끝날 수 있습니다.\n\n#lore 1800년대 중반 영국령 인도와 프랑스가 철도 투자자에게 약속한 수익 보장과 같습니다.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_encourage_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_encourage').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
