 SPEC_XS_CAP_TT: "#header 자본#!\n$TOOLTIP_DELIMITER$\n점수는 우리 [concept_spec_exchange]가 끌어 쓰는 자본에서 출발하며, 그 제곱근에 비례해 늘어납니다. 자본이 네 배가 되면 점수는 두 배가 됩니다.\n\n자국: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_own_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, 지난 한 해 동안 평균한 [concept_investment_pool] 수입 여섯 달 치\n연계국: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_reach_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, 우리 [concept_market]에 속하거나, 우리 [Concept('concept_subject','$concept_subjects|q$')]이거나, 우리 [concept_power_bloc]에 속하거나, 우리에게 [concept_foreign_investment] 권리를 준 더 작은 각 [concept_country] 자본의 사분의 일. 최대 자국 자본만큼"
 SPEC_XS_WEALTH_TT: "#header 1인당 부#!\n$TOOLTIP_DELIMITER$\n우리의 1인당 [concept_investment_pool] 수입은 세계 평균의 #v [Country.MakeScope.Var('spec_xs_ratio_v').GetValueWithDefault('(CFixedPoint)0')|2]#!배입니다. 부유한 국민의 저축은 시장을 더 깊게 만듭니다. 그 제곱근을 적용하며, 범위는 #v x0.5#!~#v x2#!입니다"
 SPEC_XS_TECH_TT: "#header 금융 기술#!\n$TOOLTIP_DELIMITER$\n연구한 기술마다 점수가 오릅니다:\n$banking$: #P +5%#!\n$stock_exchange$: #P +5%#!\n$central_banking$: #P +5%#!\n$joint_stock_companies$: #P +5%#!\n$mutual_funds$: #P +5%#!\n$investment_banks$: #P +10%#!\n$international_exchange_standards$: #P +10%#!\n$modern_financial_instruments$: #P +10%#!\n\n#v 국제#! 위상에는 [GetTechnology('stock_exchange').GetName], #v 세계 중심#! 위상에는 [GetTechnology('central_banking').GetName]이(가) 필요합니다"
 SPEC_XS_ECON_TT: "#header 경제 체제#!\n$TOOLTIP_DELIMITER$\n우리 경제 체제가 점수에 곱해집니다:\n$law_laissez_faire$: #P x1.15#!\n$law_interventionism$: #P x1.05#!\n$law_agrarianism$: #N x0.95#!\n$law_traditionalism$: #N x0.9#!\n$law_extraction_economy$: #N x0.9#!\n$law_command_economy$: #N x0.75#!\n$law_cooperative_ownership$: #N x0.6#!"
