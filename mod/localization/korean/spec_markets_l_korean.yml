 notification_spec_ld_started_desc: "[Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')]이(가) 세계 경제 전반으로 번졌습니다. 세계적 폭락이 시작되었으며, 이미 휘말린 나라와 긴밀히 연결된 모든 경제로 퍼질 것입니다. 그 뒤를 [concept_spec_long_depression]이(가) 따를 것입니다."
