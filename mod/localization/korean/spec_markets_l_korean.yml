 SPEC_RISK_CALM: "#header 호황 없음#!\n$TOOLTIP_DELIMITER$\n[Goods.GetName] 부문에는 최근 호황이 없었습니다. [concept_spec_investor_interest]가 #v 관심#! 이상에 도달한 뒤 #v 의심#!으로 떨어지면 호황이 끝나며, 높이 오를수록 하락도 가파릅니다."
