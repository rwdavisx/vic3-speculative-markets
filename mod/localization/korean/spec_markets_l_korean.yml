 spec_panic_movements: "시장에 대한 불신"
 spec_panic_movements_desc: "공황 이후 많은 이들이 국가가 시장에 제동을 걸길 원합니다. [GetLawType('law_laissez_faire').GetName] 반대 [Concept('concept_political_movement','$concept_political_movements|q$')]의 지지가 늘어납니다. 이 효과는 시간이 지나면 사라집니다."
 spec_mania_movements: "시장에 대한 믿음"
 spec_mania_movements_desc: "오랜 호황으로 많은 이들이 시장을 그대로 두는 것이 최선이라고 확신하게 되었습니다. [GetLawType('law_laissez_faire').GetName] 지지 [Concept('concept_political_movement','$concept_political_movements|q$')]의 지지가 늘어납니다. 이 효과는 시간이 지나면 사라집니다."
 SPEC_DRIVER_DEBT: "정부 부채"
