 spec_conf_buoyant: "낙관하는 투자자"
 spec_conf_mania: "열광하는 투자자"
 spec_conf_panic_desc: "[concept_spec_market_confidence]이(가) 투자와 [concept_loans] 이자에 미치는 효과"
 spec_conf_panic_held_desc: "[concept_spec_market_confidence]이(가) 투자와 [concept_loans] 이자에 미치는 효과"
 spec_conf_wary_desc: "[concept_spec_market_confidence]이(가) 투자와 [concept_loans] 이자에 미치는 효과"
 spec_conf_steady_desc: "[concept_spec_market_confidence]이(가) 투자와 [concept_loans] 이자에 미치는 효과"
 spec_conf_buoyant_desc: "[concept_spec_market_confidence]이(가) 투자와 [concept_loans] 이자에 미치는 효과"
 spec_conf_mania_desc: "[concept_spec_market_confidence]이(가) 투자와 [concept_loans] 이자에 미치는 효과"
