 concept_spec_long_depression_desc: "$concept_spec_long_depression$은 세계적인 경제 위기입니다. [concept_great_power]가 [concept_spec_financial_panic]에 빠지면 시작되어 그때 공황 중인 모든 국가에 미치며, 긴밀한 연결을 따라 퍼집니다: 공동 [concept_market], 속국과 종주국, 투자권, 활발한 무역, 해외 소유.\n\n세계적 폭락(#v 4#!개월): 신용이 얼어붙고 [concept_spec_market_confidence]이(가) 빠져나감\n불황(최대 #v 5#!년): 투자, 건설, 무역이 둔화되고 일부 인구가 [Concept('concept_radical','$concept_radicals|q$')]이(가) 됨\n회복(#v 1#!년): [concept_spec_market_confidence] 회복\n\n각 정부의 선택은 자국과 세계의 회복을 앞당기며, [concept_great_power]의 선택이 가장 중요합니다."
