l_korean:
 spec_confidence_bar: "시장 신뢰도"
 spec_confidence_bar_desc: "[concept_spec_market_confidence]: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!"
 spec_stance_current_tt: "현재 [concept_spec_credit_policy]과 다름"
 spec_stance_cooldown_tt: "최근 #v 6#!개월 동안 [concept_spec_credit_policy]을 변경하지 않음"
 spec_rescued_tt: "이번 [concept_spec_financial_panic] 중 은행 지원이나 은행법 정지를 시행하지 않음"
 spec_credit_tight: "신용 긴축"
 spec_credit_tight_fx: "[concept_spec_credit_policy]이 #v 긴축#!으로 변경됨"
 spec_credit_normal_fx: "[concept_spec_credit_policy]이 #v 보통#!으로 변경됨"
 spec_credit_loose_fx: "[concept_spec_credit_policy]이 #v 완화#!로 변경됨"
 spec_credit_tight_desc: "은행이 대출을 멈추고 투자자는 가격 상승에 덜 반응합니다. 호황이 작게 유지되어 그 종료와 공황도 약해집니다. 매달 [concept_spec_market_confidence]은(는) #v 60#!을(를) 넘는 만큼의 #N 10%#!를 잃습니다. 선택하면 [concept_spec_credit_policy]이(가) #v 6#!개월 동안 고정됩니다. [GetTechnology('central_banking').GetName] 필요.\n\n@intelligentsia! 지식인 [concept_in_government]: [concept_approval] #P +2#!\n@industrialists! 기업가 [concept_in_government]: [concept_approval] #N -2#!"
 spec_credit_normal: "보통 신용"
 spec_credit_normal_desc: "은행은 [concept_spec_market_confidence]가 #v 55#! 초과일 때 [concept_investment_pool]에 대출합니다. 선택하면 #v 6#!개월 동안 [concept_spec_credit_policy]을 변경할 수 없습니다. 필요 조건: [GetTechnology('central_banking').GetName]."
 spec_credit_loose: "신용 완화"
 spec_credit_loose_desc: "은행의 대출이 늘고 투자자들이 가격 상승에 더 강하게 반응합니다. 호황의 규모가 커지며, 종료 시 손실도 커집니다. 선택하면 #v 6#!개월 동안 [concept_spec_credit_policy]을 변경할 수 없습니다. 필요 조건: [GetTechnology('central_banking').GetName].\n\n@industrialists! 기업가 [concept_in_government]: [concept_approval] #P +2#!\n@intelligentsia! 지식인 [concept_in_government]: [concept_approval] #N -2#!"
 spec_rescue_banks: "은행에 대출"
 spec_rescue_banks_desc: "[concept_treasury]에서 [concept_gdp]의 약 #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#!를 지출하여 [concept_spec_financial_panic]을 #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#!개월 이내에 끝내고 효과를 절반으로 줄입니다. [concept_spec_market_confidence]가 #v 20#! 상승합니다. 공황의 남은 기간이 길수록 비용이 커집니다. 공황당 한 번만 시행할 수 있습니다. [GetTechnology('central_banking').GetName] 도입 시 비용과 소요 시간이 줄어듭니다."
 spec_conf_panic: "동요하는 투자자"
 spec_conf_panic_held: "동요하는 투자자"
 spec_conf_wary: "경계하는 투자자"
