 concept_spec_financial_centre_desc: "$concept_spec_financial_centres$은(는) [Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')] 점수가 가장 높은 #v 5#!개 [Concept('concept_country','$concept_countries|q$')]의 거래소로, 매달 순위가 정해집니다. 점수는 [concept_investment_pool] 수입 #v 6#!개월분의 제곱근에 따라 커지며, 신뢰, 1인당 부, 금융가, 기업, 금융 기술, [concept_rank], 경제 체제에 따라서도 커집니다. 상위 3개의 평균은 #v 100#!로 표시됩니다.\n\n1위: [concept_prestige] #P +10%#!, [concept_loans] 이자율 #P -10%#!, 대출 한도 #P +5#!개월\n최하위(#v 5#!위): #P +2%#!, #P -2%#!, #P +1#!개월\n대출 한도 보너스에는 [GetTechnology('central_banking').GetName]과(와) 대출 기준 #v 건전#! 이상이 필요"
