 SPEC_IL_CRASHED_TT: "#header [Goods.GetName]: 호황 종료#!\n이번 달 호황이 [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))](으)로 끝났습니다. 투자자들은 이제 [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))] 동안 투자를 자제하며, [concept_company]이(가) 생산하는 경우 해당 산업의 [concept_throughput]이 감소합니다."
 SPEC_IL_GLUT_TT: "#header [Goods.GetName] 회복 중#!\n지난 호황이 끝난 양상: [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]. 종료 후 [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))] 동안 투자자들이 투자를 자제하여 [concept_spec_investor_interest]가 #v 의심#! 이하로 유지되며, [concept_company]이 생산하는 상품이면 해당 산업의 [concept_throughput]이 감소합니다."
