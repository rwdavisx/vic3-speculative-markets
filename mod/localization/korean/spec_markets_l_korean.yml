 concept_spec_market_confidence: "시장 신뢰도"
 concept_spec_market_confidence_desc: "$concept_spec_market_confidence$는 투자자가 [concept_country]의 [concept_market]을 어떻게 보는지를 #v 0#!(#v 공황#!)부터 #v 100#!(#v 광풍#!)까지 나타냅니다. 두려움은 투자를 늦추고 [concept_loans] 이자를 올리며, 탐욕은 투자를 앞당깁니다.\n\n호황 중인 [Concept('concept_good','$concept_goods|q$')]은(는) 이를 높이고, [Concept('concept_spec_boom_end','$concept_spec_boom_ends|q$')], [Concept('concept_spec_foreign_panic','$concept_spec_foreign_panics|q$')], [Concept('concept_diplomatic_play','$concept_diplomatic_plays|q$')], [concept_war]은(는) 낮춥니다. 호황과 그 종료는 $building_financial_district$이(가) 경제에서 차지하는 비중이 클수록 강해지고, $building_manor_house$이(가) 그보다 많을수록 약해집니다.\n\n#v 55#! 초과에서는 은행이 [concept_investment_pool]에 대출하고, #v 80#!에서는 시장이 [concept_spec_speculative_mania]에 들어서며, #v 25#! 미만에서는 [concept_spec_financial_panic]이 시작됩니다."
 concept_spec_speculative_mania: "투기 광풍"
 concept_spec_speculative_mania_desc: "[concept_spec_market_confidence]가 #v 80#! 이상이면 [concept_market]이 $concept_spec_speculative_mania$에 빠집니다. 은행이 [concept_investment_pool]에 가장 많은 자금을 대출하지만, [concept_spec_boom_end] 시 $concept_spec_market_confidence$ 손실도 커집니다. 광풍이 오래 지속되거나 매우 높은 수준에 달하면 이후 수년간 [GetLawType('law_laissez_faire').GetName] 지지 [Concept('concept_political_movement','$concept_political_movements|q$')]의 지지가 늘어납니다."
 concept_spec_financial_panic: "금융 공황"
 concept_spec_financial_panics: "금융 공황"
 concept_spec_financial_panic_desc: "$concept_spec_financial_panic$은 [concept_spec_market_confidence]이(가) 공황 기준인 #v 25#! 미만으로 떨어지면 시작됩니다. [concept_spec_leverage]가 #v 3#!개월분을 넘으면 기준이 높아져 최대 #v 65#!이 됩니다. $building_financial_district$이(가) 적으면 기준이 낮아져 최저 #v 20#!이 됩니다.\n\n공황은 모든 건물의 [concept_throughput]과 세수를 줄이고, 끝날 때까지 매주 [concept_treasury]에 실업자 구호 비용을 부담시키며, [concept_private_construction]과 투자를 늦추고, [Concept('concept_company','$concept_companies|q$')]의 [concept_throughput] 보너스를 낮추고, 일부 투자자를 [Concept('concept_radical','$concept_radicals|q$')](으)로 만들며, 은행이 [concept_investment_pool]에서 [concept_spec_outstanding_credit]을(를) 회수하게 합니다.\n\n연계된 각 [concept_country]은(는) [concept_spec_foreign_panic]을 겪고, 자금은 다른 곳의 평온한 [Concept('concept_great_power','$concept_great_powers|q$')](으)로 빠져나갑니다. 이후 몇 년간 [GetLawType('law_laissez_faire').GetName]에 반대하는 [Concept('concept_political_movement','$concept_political_movements|q$')]이(가) 지지를 얻습니다."
 concept_spec_foreign_panic: "해외 공황"
 concept_spec_foreign_panics: "해외 공황"
 concept_spec_foreign_panic_desc: "$concept_spec_foreign_panic$은 공동 [concept_market], 종속 관계, 투자권, 대규모 무역, 경제 소유로 연결된 국가에서 [concept_spec_financial_panic] 발생 시 해당 [concept_country]의 [concept_spec_market_confidence]를 낮춥니다. 관계가 긴밀할수록 손실이 큽니다. [GetLawType('law_free_trade').GetName] 도입 시 무역 연계가 강화되며 다른 무역 정책은 이를 약화합니다. [concept_embargo]는 무역 연계를 끊습니다."
 concept_spec_boom_end: "호황 종료"
 concept_spec_boom_ends: "호황 종료"
 concept_spec_boom_end_desc: "호황은 [concept_good]에 대한 [concept_spec_investor_interest]가 상승 후 다시 떨어질 때 끝나며, 높이 올라갈수록 더 크게 떨어집니다. #v 관심#!에서 정점을 찍은 호황은 [concept_spec_correction](으)로, #v 열의#!에서 정점을 찍은 호황은 [concept_spec_bust](으)로, #v 과열#!에서 정점을 찍은 호황은 [concept_spec_collapse](으)로 끝납니다.\n\n각 종료는 [concept_spec_market_confidence]을(를) 낮추며, 호황이 클수록, [concept_market] 무역 비중이 큰 [Concept('concept_good','$concept_goods|q$')]일수록 더 많이 낮춥니다. 이후 투자자들은 $concept_good$이(가) 회복되는 동안 투자를 자제하며, [concept_company]이(가) 생산하는 경우 해당 산업은 [concept_throughput]을 잃습니다. 기준이 되는 정점은 매달 조금씩 낮아지므로, 서서히 식는 호황은 더 완만하게 끝나거나 $concept_spec_boom_end$ 없이 끝나기도 합니다."
 concept_spec_correction: "조정"
 concept_spec_correction_desc: "$concept_spec_correction$은 가장 완만한 [concept_spec_boom_end]입니다. [concept_good]의 [concept_spec_investor_interest]가 #v 관심#!에서 정점을 찍은 뒤 #v 의심#!으로 떨어질 때 발생합니다.\n\n[concept_spec_market_confidence]가 소폭 하락합니다. 이후 투자자들이 #v 3#!개월 동안 해당 $concept_good$에 투자를 자제하며, [concept_company]이 생산하는 상품이면 해당 산업의 [concept_throughput]이 #v 90#!일 동안 #N 2.5%#! 감소하고, [GetTechnology('corporate_charters').GetName], [GetTechnology('corporate_management').GetName]을(를) 하나 연구할 때마다 #N 25%#!씩 더 감소합니다."
 concept_spec_bust: "급락"
 concept_spec_bust_desc: "$concept_spec_bust$은 [concept_spec_correction]보다 격렬한 [concept_spec_boom_end]입니다. [concept_good]의 [concept_spec_investor_interest]가 #v 열의#!에서 정점을 찍은 뒤 #v 의심#!으로 떨어질 때 발생합니다.\n\n[concept_spec_market_confidence] 손실이 더 크며, 같은 호황의 [concept_spec_correction] 대비 약 #v 2#!배입니다. 이후 투자자들이 #v 6#!개월 동안 해당 $concept_good$에 투자를 자제하며, [concept_company]이 생산하는 상품이면 해당 산업의 [concept_throughput]이 #v 180#!일 동안 #N 5%#! 감소하고, [GetTechnology('corporate_charters').GetName], [GetTechnology('corporate_management').GetName]을(를) 하나 연구할 때마다 #N 25%#!씩 더 감소합니다."
 concept_spec_collapse: "붕괴"
 concept_spec_collapse_desc: "$concept_spec_collapse$는 가장 심각한 [concept_spec_boom_end]입니다. [concept_good]의 [concept_spec_investor_interest]가 #v 과열#!에서 정점을 찍은 뒤 #v 이탈#!까지 떨어질 때 발생합니다.\n\n[concept_spec_market_confidence]가 급격히 하락하며, 손실은 같은 호황의 [concept_spec_correction] 대비 약 #v 5#!배입니다. 이후 투자자들이 #v 12#!개월 동안 해당 $concept_good$에 투자를 자제하며, [concept_company]이 생산하는 상품이면 해당 산업의 [concept_throughput]이 한 해 동안 #N 10%#! 감소하고, [GetTechnology('corporate_charters').GetName], [GetTechnology('corporate_management').GetName]을(를) 하나 연구할 때마다 #N 25%#!씩 더 감소합니다. [concept_market] 거래 비중이 큰 상품의 $concept_spec_collapse$는 [concept_spec_financial_panic] 발생으로 이어질 수 있습니다."
 concept_spec_investor_interest: "투자자 관심도"
 concept_spec_investor_interest_desc: "$concept_spec_investor_interest$는 [concept_good]을 생산하는 [Concept('concept_building','$concept_buildings|q$')]에 대해 투자자가 느끼는 매력입니다. [concept_market_price]가 장기 평균보다 높으면 오르고 낮으면 떨어지며, #v 이탈#!부터 #v 과열#!까지 있습니다.\n\n해당 건물의 [concept_throughput]도 이를 따라 #v 이탈#!에서 #N -10%#!, #v 과열#!에서 #P +8%#!가 되며, $concept_good$을 생산하는 [Concept('concept_company','$concept_companies|q$')]의 [concept_prosperity]도 마찬가지입니다. 호황 중인 $concept_good$은 [concept_spec_market_confidence]을(를) 높입니다. 관심도가 다시 떨어지면 호황은 [concept_spec_boom_end](으)로 끝납니다."
 concept_spec_credit_policy: "신용 정책"
 concept_spec_credit_policy_tight: "신용 긴축"
 concept_spec_credit_policy_normal: "보통 신용"
 concept_spec_credit_policy_loose: "신용 완화"
 concept_spec_credit_policy_desc: "$concept_spec_credit_policy$은 은행이 [concept_investment_pool]에 얼마나 자유롭게 대출하는지를 정합니다. [GetTechnology('central_banking').GetName]이(가) 필요하며 $concept_spec_credit_policy_tight$, $concept_spec_credit_policy_normal$, $concept_spec_credit_policy_loose$ 중 하나로 정할 수 있습니다. 신용을 긴축하면 투자가 느려지고 높아진 [concept_spec_market_confidence]을(를) 끌어내리며, 신용을 완화하면 [concept_spec_outstanding_credit]이(가) 늘어납니다. 변경하면 #v 6#!개월 동안 고정됩니다."
 concept_spec_leverage: "신용 레버리지"
 concept_spec_leverage_desc: "$concept_spec_leverage$는 [concept_country]의 [concept_spec_outstanding_credit]을(를) [concept_investment_pool] 수입 개월 수로 나타낸 것입니다.\n\n1개월분마다 [concept_throughput] #P +2%#!, 최대 #P +24%#!를 줍니다. [concept_spec_financial_panic] 중이거나 [concept_spec_bad_debts]이 남아 있는 동안에는 매달 #N 2%#!씩 줄어듭니다. #v 3#!개월분을 넘으면 [concept_spec_financial_panic]이 더 높은 [concept_spec_market_confidence]에서 시작되고 [concept_spec_bad_debts]을 남깁니다."
 concept_spec_bad_debts: "부실 채권"
 concept_spec_bad_debts_desc: "$concept_spec_bad_debts$은 [concept_spec_financial_panic]이 남긴 손실로, [concept_spec_leverage]가 #v 3#!개월분을 넘을수록 커집니다.\n\n1포인트마다 [concept_throughput]이 #N 0.4%#!, 투자가 #N 0.75%#! 감소합니다. 매달 #v 3#!포인트씩 쌓인 뒤 매달 #v 0.6#!포인트씩 줄어들며, 가장 심할 때는 해소까지 약 #v 6#!년이 걸립니다. 남아 있는 동안 은행은 대출하지 않습니다. #v 은행에 대출#!로는 해소되지 않습니다. #v 부실 대출 매입#!은 지속되는 동안 한 번 이를 절반으로 줄입니다."
 concept_spec_lending_standards: "대출 기준"
 concept_spec_lending_standards_desc: "$concept_spec_lending_standards$은 [concept_country]의 은행이 얼마나 신중하게 대출하는지를 나타냅니다: #v 엄격#!, #v 신중#!, #v 건전#!, #v 느슨#!, #v 무모#!. 느슨한 은행일수록 [concept_investment_pool]에 더 많이, 그중 더 많은 몫을 호황에 대출하므로 호황이 더 크게 끝나고 은행 지원 비용도 커집니다.\n\n[concept_spec_financial_panic] 없는 달마다 조금씩 느슨해져, 평온한 해가 약 #v 20#!년 이어지면 #v 엄격#!에서 #v 무모#!까지 이르며, 은행 지원이나 #v 부실 대출 매입#! 이후에는 더 느슨해집니다. 호황이 끝나면, 특히 $concept_spec_financial_panic$이 은행 지원 없이 끝까지 진행되면 다시 엄격해집니다."
 concept_spec_outstanding_credit: "대출 잔액"
 concept_spec_outstanding_credit_desc: "$concept_spec_outstanding_credit$은 은행이 [concept_investment_pool]에 대출하고 아직 상환받지 못한 신용입니다. 은행은 [concept_spec_market_confidence]이(가) #v 55#! 초과일 때 원천금 수입 #v 3#!개월분의 대출 한도까지 대출합니다. [GetTechnology('central_banking').GetName]은(는) #v 5#!개월, [GetTechnology('investment_banks').GetName]와(과) [GetTechnology('international_exchange_standards').GetName]은(는) 각각 #v 2#!개월을 더합니다.\n\n매달 #v 2%#!가 원천금에서 상환됩니다. [concept_spec_financial_panic]이 시작되면 일부가 회수됩니다.\n\n#lore 은행들은 1840년대에 철도 주식을, 1837년에 면화를, 1873년에 빈의 건축 부지를 담보로 대출했다가 그 호황이 꺼지자 곤경에 빠졌습니다.#!"
