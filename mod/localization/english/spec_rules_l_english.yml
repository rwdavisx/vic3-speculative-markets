l_english:
 rule_spec_market_volatility: "Market Volatility"
 setting_spec_volatility_historical: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_spec_volatility_historical_desc Historical#!#!"
 setting_spec_volatility_historical_desc: "Speculative booms and [Concept('concept_spec_financial_panic', '$concept_spec_financial_panics|q$')] will occur about as often as they did in the 19th century"
 setting_spec_volatility_heightened: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_spec_volatility_heightened_desc #high High#!#!#!"
 setting_spec_volatility_heightened_desc: "Speculative booms will grow larger and end more abruptly, and [Concept('concept_spec_financial_panic', '$concept_spec_financial_panics|q$')] will occur more often than they did in the 19th century"
 rule_spec_market_impact: "Market Impact"
 setting_spec_impact_flavor: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_spec_impact_flavor_desc Flavor#!#!"
 setting_spec_impact_flavor_desc: "[Concept('concept_spec_leverage', '$concept_spec_leverage|q$')] and [Concept('concept_spec_financial_panic', '$concept_spec_financial_panics|q$')] will affect your economy less, about two fifths as much"
 setting_spec_impact_standard: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_spec_impact_standard_desc Standard#!#!"
 setting_spec_impact_standard_desc: "[Concept('concept_spec_leverage', '$concept_spec_leverage|q$')] and [Concept('concept_spec_financial_panic', '$concept_spec_financial_panics|q$')] will affect your economy as the mod intends"
 setting_spec_impact_strong: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_spec_impact_strong_desc #high Strong#!#!#!"
 setting_spec_impact_strong_desc: "[Concept('concept_spec_leverage', '$concept_spec_leverage|q$')] and [Concept('concept_spec_financial_panic', '$concept_spec_financial_panics|q$')] will affect your economy more, about three fifths more"
