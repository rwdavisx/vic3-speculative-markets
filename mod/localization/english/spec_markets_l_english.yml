 spec_excess_bar: "Speculative Excess"
 concept_spec_speculative_excess: "Speculative Excess"
 concept_spec_speculative_excess_desc: "@spec_speculative_excess! #italic This is the bubble in a [concept_country]'s [concept_market]. The longer a boom runs hot, the bigger it gets.#!\n\nNo bubble can build before [GetTechnology('stock_exchange').GetName].\n#P Grows#! each month [concept_spec_market_confidence] is #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! or more, and faster the higher it climbs\n#v Shrinks#! slowly while it is between #v 60#! and #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!\n#N Pops#! if it drops below #v 60#!\n\nWhen it pops, $concept_spec_market_confidence$ drops even more, by up to #N [GetPlayer.MakeScope.ScriptValue('spec_burst_max')|0]#!. The bigger the bubble, the harder the fall."
 concept_spec_sound_finance: "Sound Finance"
 concept_spec_sound_finance_desc: "@spec_sound_finance! #italic The prize for passing all three [concept_spec_banking_reforms], Banknote Rules, a Lender of Last Resort and Company Law.#!\n\nOnce a [concept_country] has all three:\n#P +10#! [concept_prestige]\n#P 5%#! less interest on its [concept_loans]"
 concept_spec_banking_reforms: "Banking Reforms"
 concept_spec_banking_reform: "Banking Reform"
 concept_spec_banking_reforms_desc: "@spec_banking_reforms! #italic The rules a [concept_country]'s banks and companies play by. Each one changes how booms and panics go.#!\n\nEach reform unlocks with a technology. A Commission of Inquiry passes one reform at a time. It can sit after a [concept_spec_financial_panic], or after #v 10#! calm years with no panic.\n\n#bold Banknote Rules#! ([GetTechnology('banking').GetName]), pick one:\n#bold Currency School#!\n$spec_reform_currency_tt$\n#bold Free Banking#!\n$spec_reform_free_tt$\n\n#bold Lender of Last Resort#! ([GetTechnology('central_banking').GetName])\n$spec_reform_llr_tt$\n\n#bold Company Law#! ([GetTechnology('joint_stock_companies').GetName])\n$spec_reform_company_tt$\n\nPass all three to earn [concept_spec_sound_finance]."
 alert_spec_panic_risk_alert_name: "Panic Risk"
 spec_panic_risk_alert_setting_name: "Panic Risk"
 alert_spec_panic_risk_alert_desc: "If all our booms end at once, [concept_spec_market_confidence] drops to #N [GetPlayer.MakeScope.ScriptValue('spec_after_collapse')|0]#!.\nA [concept_spec_financial_panic] starts below #v [GetPlayer.MakeScope.ScriptValue('spec_panic_at')|0]#!."
 alert_spec_panic_risk_alert_hint: "To lower the risk, Restrain Speculation in the riskiest goods or tighten [concept_spec_credit_policy]. Both are in the #bold $SPEC_FIN_TAB_BANKING$#! tab of the #bold $SPEC_FINANCE$#! window."
 alert_spec_panic_risk_alert_action: "Journal"
 alert_spec_bubble_alert_name: "Speculative Excess"
 spec_bubble_alert_setting_name: "Speculative Excess"
 alert_spec_bubble_alert_desc: "Our [concept_spec_speculative_excess] is #v [GetPlayer.MakeScope.Var('spec_heat').GetValue|0]#!. This is the bubble.\n\n#N Pops#! if [concept_spec_market_confidence] drops below #v 60#!\nIf it popped now: #N -[GetPlayer.MakeScope.ScriptValue('spec_burst_now')|0]#! $concept_spec_market_confidence$ at once"
 alert_spec_bubble_alert_hint: "To let it down gently, restrain the booming goods or tighten [concept_spec_credit_policy].\n#P Grows#! while [concept_spec_market_confidence] is #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! or more\n#v Shrinks#! slowly while it is between #v 60#! and #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!"
 alert_spec_bubble_alert_action: "Journal"
 alert_spec_rescue_alert_name: "Bank Rescue Available"
 spec_rescue_alert_setting_name: "Bank Rescue Available"
 alert_spec_rescue_alert_desc: "A [concept_spec_financial_panic] is on, and we have not lent to the banks yet."
 alert_spec_rescue_alert_hint: "Use #v Lend to the Banks#! in the #bold $SPEC_FIN_TAB_BANKING$#! tab of the #bold $SPEC_FINANCE$#! window. Once per panic.\n#P Ends#! the panic sooner\n#P Halves#! its penalties for the months it has left\n[concept_spec_market_confidence] #P +20#!\n\n#weak Does not cut $spec_panic_relief$ payments, clear [concept_spec_bad_debts] or win back people already radicalized#!"
 alert_spec_rescue_alert_action: "Journal"
 alert_spec_bailout_alert_name: "Buy Up Bad Loans Available"
 spec_bailout_alert_setting_name: "Buy Up Bad Loans Available"
 alert_spec_bailout_alert_desc: "@spec_bad_debts! [concept_spec_bad_debts] are slowing our [concept_throughput] and investment, and we have not bought up the bad loans yet."
 alert_spec_bailout_alert_hint: "Use #v Buy Up Bad Loans#! in the #bold $SPEC_FIN_TAB_BANKING$#! tab of the #bold $SPEC_FINANCE$#! window. Only once while they last.\n#P Halves#! the [concept_spec_bad_debts] left\nCosts #v @money![GetPlayer.MakeScope.ScriptValue('spec_bailout_cost')|D]#!"
 alert_spec_bailout_alert_action: "Journal"
