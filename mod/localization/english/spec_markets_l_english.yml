 spec_rival.1.t11: "Bear Raid on #v [ROOT.GetCountry.GetCapital.GetCityHubName]#!!"
 spec_rival.1.d11: "Before the opening bell, brokers acting for #v [SCOPE.sCountry('target').GetName]#! threw great blocks of our railway and bank shares onto the floor at once. Prices broke, the tickers fell behind, and by noon our own clerks were selling in a fright.\n\nOur [concept_spec_market_confidence] will fall by #N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#! over 6 months."
 spec_rival.1.f11: "\"A run on the market may begin with a single rumor.\""
 spec_rival.1.t10: "The Raid That Failed"
 spec_rival.1.d10: "Brokers acting for #v [SCOPE.sCountry('target').GetName]#! dumped our shares onto the floor at once, expecting a rout. Instead our banks bought every lot they offered, prices held, and by the closing bell it was the raiders who were nursing their losses.\n\nTheir own [concept_spec_market_confidence] falls by #P 3#! over 6 months."
 spec_rival.1.f10: "\"The bear who sells what he does not own had better be right.\""
 spec_rival.1.t21: "Our Capital Is Being Courted"
 spec_rival.1.d21: "Agents from #v [SCOPE.sCountry('target').GetName]#! have taken rooms at our finest hotels, and our largest investors are dining with them nightly. Their offer is simple: a better rate, a safer harbour, and no awkward questions.\n\nFor 12 months, #N [GetPlayer.MakeScope.Var('spec_rv_lure_share').GetValue|%0]#! of our [concept_investment_pool] income goes to them."
 spec_rival.1.f21: "\"Capital goes where it is well treated, and stays where it is well fed.\""
 spec_rival.1.t31: "A Campaign of Whispers"
 spec_rival.1.d31: "The morning papers of #v [SCOPE.sCountry('target').GetName]#! carry long columns on forged balance sheets and tottering banks in #v [ROOT.GetCountry.GetCapital.GetCityHubName]#!. None are signed and few are true, but they are read in every counting house on the continent.\n\nOur [concept_spec_exchange] loses #N [Multiply_CFixedPoint('(CFixedPoint)0.0167', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|%0]#! trust."
 spec_rival.1.f31: "\"A lie travels halfway around the world while the truth is still putting on its boots.\""
 spec_rival.1.t3n: "A Paid Campaign Exposed"
 spec_rival.1.d3n: "The papers of #v [SCOPE.sCountry('target').GetName]#! have been full of doubts about our [concept_spec_exchange]. But a clerk talked, and now everyone knows whose money paid for the ink.\n\nWe lose trust, but so do they, and their name suffers abroad."
 spec_rival.1.f3n: "\"Mud thrown in the dark still leaves the hands dirty.\""
 spec_rival.1.t: "A Competitor Moves Against Us"
 spec_rival.1.f: "\"A run on the market may begin with a single rumor.\""
 spec_rival.1.a: "Give them a taste of their own medicine."
 spec_rival.1.a_tt: "We do the same to them, even if we did so this year."
 spec_rival.1.a_1: "#v Bear Raid#! against them:"
 spec_rival.1.a_2: "#v Lure Their Capital#!:"
 spec_rival.1.a_3: "#v Press Campaign#! against them:"
 spec_rival.1.b: "Close ranks against them."
 spec_rival.1.b_tt: "For 12 months their actions against us have half their effect. Costs @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]."
 spec_rival.1.c: "Carry on as if nothing happened."
 spec_rival.1.c_tt: "Our [concept_spec_exchange] gains #P [Multiply_CFixedPoint('(CFixedPoint)0.01', Add_CFixedPoint('(CFixedPoint)1', Multiply_CFixedPoint('(CFixedPoint)1', SCOPE.sCountry('target').MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'))))|%0]#! trust for keeping its head. The bigger the Exchange we shrug off, the more it counts."
 spec_rival.1.d: "Buy into the panic."
 spec_rival.1.d_tt: "Our banks buy what the raiders sell. The raid takes #P half#! as much [concept_spec_market_confidence]. Costs #N @money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rv_counter_cost')|D]#! (#v 1%#! of our GDP)."
 spec_rival.1.e: "Match their terms."
 spec_rival.1.e_tt: "We pay our investors to stay. They take #P half#! as much of our [concept_investment_pool]. Costs #N @money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rv_counter_cost')|D]#! (#v 1%#! of our GDP)."
 spec_rival.1.g: "Answer in our own papers."
 spec_rival.1.g_tt: "Our papers print the figures. Our [concept_spec_exchange] wins back #P 1%#! trust. Costs #N @money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rv_counter_cost')|D]#! (#v 1%#! of our GDP)."
 SPEC_DRIVER_RIVAL: "Competitor Actions"
 SPEC_DRIVER_RIVAL_TT: "#header Competitor Actions: [Country.MakeScope.Var('spec_c_rival').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#italic A competitor's Bear Raid on our market, spread over six months.#!\n#instruction Raids can cost us at most #v 4#! confidence a year, however many come.#!"
 spec_rival.1.d11_big: "The great Exchange of #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! has noticed us at last, and it does not care for what it sees.\n\nBefore the opening bell, brokers acting for #v [SCOPE.sCountry('target').GetName]#! threw great blocks of our railway and bank shares onto the floor at once. Prices broke, the tickers fell behind, and by noon our own clerks were selling in a fright.\n\nOur [concept_spec_market_confidence] will fall by #N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#! over 6 months."
 spec_rival.1.d11_even: "For years the Exchanges of #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! and #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! have circled one another. It was only a matter of time.\n\nBefore the opening bell, brokers acting for #v [SCOPE.sCountry('target').GetName]#! threw great blocks of our railway and bank shares onto the floor at once. Prices broke, the tickers fell behind, and by noon our own clerks were selling in a fright.\n\nOur [concept_spec_market_confidence] will fall by #N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#! over 6 months."
 spec_rival.1.d11_small: "The upstarts of #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! have decided that #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! needs taking down a peg.\n\nBefore the opening bell, brokers acting for #v [SCOPE.sCountry('target').GetName]#! threw great blocks of our railway and bank shares onto the floor at once. Prices broke, the tickers fell behind, and by noon our own clerks were selling in a fright.\n\nOur [concept_spec_market_confidence] will fall by #N [Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_raid_pm').GetValue, '(CFixedPoint)6')|0]#! over 6 months."
 spec_rival.1.d10_big: "The great Exchange of #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! has noticed us at last, and it does not care for what it sees.\n\nBrokers acting for #v [SCOPE.sCountry('target').GetName]#! dumped our shares onto the floor at once, expecting a rout. Instead our banks bought every lot they offered, prices held, and by the closing bell it was the raiders who were nursing their losses.\n\nTheir own [concept_spec_market_confidence] falls by #P 3#! over 6 months."
 spec_rival.1.d10_even: "For years the Exchanges of #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! and #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! have circled one another. It was only a matter of time.\n\nBrokers acting for #v [SCOPE.sCountry('target').GetName]#! dumped our shares onto the floor at once, expecting a rout. Instead our banks bought every lot they offered, prices held, and by the closing bell it was the raiders who were nursing their losses.\n\nTheir own [concept_spec_market_confidence] falls by #P 3#! over 6 months."
 spec_rival.1.d10_small: "The upstarts of #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! have decided that #v [ROOT.GetCountry.GetCapital.GetCityHubName]#! needs taking down a peg.\n\nBrokers acting for #v [SCOPE.sCountry('target').GetName]#! dumped our shares onto the floor at once, expecting a rout. Instead our banks bought every lot they offered, prices held, and by the closing bell it was the raiders who were nursing their losses.\n\nTheir own [concept_spec_market_confidence] falls by #P 3#! over 6 months."
 spec_rival.1.d21_big: "The great Exchange of #v [SCOPE.sCountry('target').GetCapital.GetCityHubName]#! has noticed us at last, and it does not care for what it sees.\n\nAgents from #v [SCOPE.sCountry('target').GetName]#! have taken rooms at our finest hotels, and our largest investors are dining with them nightly. Their offer is simple: a better rate, a safer harbour, and no awkward questions.\n\nFor 12 months, #N [GetPlayer.MakeScope.Var('spec_rv_lure_share').GetValue|%0]#! of our [concept_investment_pool] income goes to them."
