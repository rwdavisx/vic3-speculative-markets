 concept_spec_exchange: "Exchange"
 concept_spec_trust: "Trust"
 concept_spec_trust_desc: "@spec_trust! How much investors believe in a [concept_country]'s [concept_spec_exchange], from #v 0%#! to #v 100%#!.\n\nIt #P rises#! in calm months and #N falls#! with every [concept_spec_financial_panic], bust and collapse. Its level, #N Distrusted#!, Doubted, #v Respected#! or #P Trusted#!, changes what the [concept_country] pays to borrow."
 concept_spec_exchange_desc: "@spec_exchange! A [concept_country]'s $concept_spec_exchange$ is where its shares, bonds and credit change hands. Its Standing follows its [Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')] score: #v Provincial#!, #v National#!, #v International#! (needs [GetTechnology('stock_exchange').GetName]) or #v World Centre#! (needs [GetTechnology('central_banking').GetName]). The higher your Exchange's Standing, the more strongly investors react to rising prices, and from #v International#! it also receives [concept_spec_capital_flight].\n\nYou grant your Exchange one charter, either #v Commodity Exchange#!, #v Money Market#! or #v Share Market#!. It holds #v 1#! to #v 4#! specialities from the #v 10#! Paths to Renown, more as its Standing rises, and keeps each for at least #v 5#! years.\n\nTrust rises in calm years under sound lending, and falls with [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')], [concept_spec_bad_debts] and a [concept_spec_bust] or [concept_spec_collapse] in a main good. Low trust raises the interest rate on your [concept_loans] and high trust lowers it."
