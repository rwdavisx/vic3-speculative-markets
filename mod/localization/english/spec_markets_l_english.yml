 SPEC_DRIVER_WAREND: "End of War"
 SPEC_DRIVER_WAREND_TT: "#header End of War: [Country.MakeScope.Var('spec_c_warend').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#v x[Country.MakeScope.Var('spec_war_stakes_now').GetValueWithDefault('(CFixedPoint)0')|%0]#! of the full effect, based on our [concept_casualties]\n$TOOLTIP_DELIMITER$\n#title Full Effect#!\nWon and got a [concept_war_goal]: #P +4#!\nWon, but got nothing: #P +1#!\nLost and gave up a [concept_war_goal]: #N -8#!\nLost, but gave up nothing: #N -2#!\nNobody won: #N -1#!\n\n#weak We always feel at least #v 25%#! of it, and all of it once the war cost #v 25%#! of our forces#!"
 SPEC_DRIVER_BURST: "Bubble Bursts"
 SPEC_DRIVER_BURST_TT: "#header Bubble Bursts: [Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#italic The bubble popped.#!\n\n#v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0'), Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_burst_per_heat'), '(CFixedPoint)-1'))|0]#! points of [concept_spec_speculative_excess]\n#N -[Country.MakeScope.ScriptValue('spec_burst_per_heat')|2]#! for each point\nNever more than #N -[Country.MakeScope.ScriptValue('spec_burst_max')|0]#!\n$TOOLTIP_DELIMITER$\nIt pops when [concept_spec_market_confidence] drops below #v 60#! after a boom above #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#!\nThe longer and higher the boom, the bigger the pop\n#weak Needs [GetTechnology('stock_exchange').GetName]#!"
