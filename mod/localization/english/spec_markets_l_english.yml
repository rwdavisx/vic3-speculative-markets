 spec_finance_bar: "Sound Finance"
 spec_finance_bar_desc: "@spec_sound_finance! [concept_spec_sound_finance]: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#! of #v 3#! [concept_spec_banking_reforms]"
 spec_inquiry_no_panic_tt: "No [concept_spec_financial_panic] is under way"
 spec_inquiry_reform_tt: "Our technology unlocks a [Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')] we have not passed yet"
 spec_suspend_panic_tt: "A [concept_spec_financial_panic] is under way"
 spec_suspend_note_tt: "We picked the Currency School for our Banknote Rules"
 spec_inquiry_when_tt: "A [concept_spec_financial_panic] ended in the last year and no inquiry has sat since, or #v 10#! calm years have passed with no panic (#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_calm_left')|0]#! months to go)"
 spec_convert_conf_tt: "@spec_market_confidence! [concept_spec_market_confidence] is at least #v 60#!"
 spec_convert_debt_tt: "Our debt is at least #v 20%#! of our [concept_credit] limit"
 spec_convert_cd_tt: "We have not converted the debt in the last #v 10#! years"
 spec_convert_conf_cost_tt: "@spec_market_confidence! [concept_spec_market_confidence] #N -5#!"
 spec_relief_when_tt: "A [concept_spec_financial_panic] or the [concept_spec_long_depression] is on"
 spec_relief_cd_tt: "No Relief Works in the last #v 12#! months"
 spec_suspend_tt: "The [concept_spec_financial_panic] #P ends#! within #v 2#! months, but hits at full strength until then\n[concept_spec_market_confidence] #P +15#!\nFor #v 10#! years after, the [concept_spec_speculative_excess] grows #N 50%#! faster\n[concept_spec_lending_standards] loosen, just like after a Bank Rescue"
 spec_suspend_act: "Suspend the Bank Act"
 spec_suspend_act_desc: "Let the bank print more notes than the Act allows. The panic dies down within months and costs the treasury nothing. The catch is that investors learn we will always bail them out. This counts as #v Lend to the Banks#! for this panic.\n\n#lore Britain suspended its Bank Charter Act in 1847, 1857 and 1866.#!"
 spec_relief_works_button: "Relief Works"
 spec_relief_works_button_desc: "Pay for public works and relief while the slump lasts. For #v 12#! months it lifts welfare and construction and pulls support away from the radicals. The bigger our [concept_gdp], the more it costs each week."
 spec_convert_debt: "Convert the National Debt"
 spec_convert_debt_desc: "While investors are in a good mood, swap our loans for new ones with lower interest. People who lived on the old interest will not thank us."
 spec_inquiry: "Commission of Inquiry"
 spec_inquiry_desc: "Ask a commission to hear bankers, brokers and ruined savers and say how our banks and companies should be run. Its report passes one [Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')] our technology unlocks. It keeps the government busy for #v 6#! months."
 spec_debt_converted: "Converted Debt"
 spec_debt_converted_desc: "Our loans were converted to a lower rate while investors were eager to lend."
 spec_relief_works: "Relief Works"
 spec_relief_works_desc: "Public works and relief are provided for those the slump has thrown out of work."
 spec_relief_costs: "Relief Works Costs"
 spec_relief_costs_desc: "The treasury bears the cost of public works and relief."
 spec_act_suspended: "Bank Act Suspended"
 spec_act_suspended_desc: "The government has set aside its own law to end a panic."
 spec_inquiry_sitting: "Commission of Inquiry"
 spec_inquiry_sitting_desc: "A commission is hearing evidence on the conduct of our banks and companies."
 spec_sound_finance: "Sound Finance"
 spec_sound_finance_desc: "Our currency, banks and companies are run by rules that investors trust."
 spec_rentiers_cut: "Rentier Income Cut"
 spec_relief_thanks: "Relief Works"
 spec_dear_money: "Dear Money"
 spec_free_issue: "Free Banking"
 spec_disclosure_burden: "Disclosure Rules"
 spec_disclosure_welcomed: "Disclosure Rules"
 spec_report_shelved: "Business as Usual"
 spec_report_buried: "Inquiry Shelved"
 spec_reform_currency_tt: "Banks lend #v 25%#! less, the [concept_spec_speculative_excess] grows #v 25%#! slower, and [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')] last #v 25%#! longer\nYou can suspend the Bank Act in a panic"
 spec_reform_free_tt: "Banks lend #v 25%#! more, booms get #v 10%#! bigger, and when they end they cost #v 10%#! more [concept_spec_market_confidence]"
 spec_reform_llr_tt: "#v Lend to the Banks#! costs #v 50%#! less and ends the panic a month sooner"
 spec_reform_company_tt: "When booms end, they cost #v 30%#! less [concept_spec_market_confidence]"
 spec_reform.1.t: "Commission of Inquiry"
 spec_reform.1.d_panic: "The commission appointed after the panic has delivered its report in three volumes of testimony from bankers, brokers and ruined depositors. Its members agree that the panic was no act of God. On almost everything else they disagree, and each remedy has its champions in the chamber."
 spec_reform.1.d_calm: "With the markets quiet, a commission has spent the year hearing bankers, brokers and political economists on how to keep the next boom from ending in ruin. Its report sets out several remedies, and each has its champions in the chamber."
 spec_reform.1.f: ""In wild periods of alarm, one failure makes many, and the best way to prevent the derivative failures is to arrest the primary failure which causes them.""
 spec_reform.1.a: "Bind the issue of notes to the gold in the vaults."
 spec_reform.1.b: "Let every sound bank issue its own notes."
 spec_reform.1.c: "Name a lender of last resort."
 spec_reform.1.d: "Make companies publish their accounts."
 spec_reform.1.e: "Thank the commission, and shelve its report."
 spec_reform.2.t: "Sound Finance"
 spec_reform.2.d: "Our banks issue their notes by rule, a lender stands ready when panic strikes, and our companies must show investors what they own and what they owe. Abroad, our bonds now sell at a premium, and [ROOT.GetCountry.GetCapital.GetCityHubName] is spoken of as a safe harbor for capital."
 spec_reform.2.f: ""A banker's first duty is not to make money but to keep it.""
 spec_reform.2.a: "Confidence is the foundation of credit."
