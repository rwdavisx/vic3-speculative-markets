 SPEC_EFFECT_BAD_NONE_TT: "#header @spec_bad_debts! [concept_spec_bad_debts]#!\nNothing to worry about. Our banks have no bad loans right now.\n$TOOLTIP_DELIMITER$\nIf a [concept_spec_financial_panic] started now: #N -[Country.MakeScope.ScriptValue('spec_crunch_tp_if_pct')|1]%#! [concept_throughput], #N -[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_crunch_if'), '(CFixedPoint)0.75')|1]%#! Investment\n$SPEC_LEV_YOURS$\n\n$SPEC_BAD_SCALE$"
