l_english:
 spec_confidence_bar: "Market Confidence"
 spec_confidence_bar_desc: "@spec_market_confidence! [concept_spec_market_confidence]: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!"
 spec_stance_current_tt: "This is not the current [concept_spec_credit_policy]"
 spec_stance_cooldown_tt: "@spec_credit_policy! [concept_spec_credit_policy] has not changed in the last #v 6#! months"
 spec_rescued_tt: "We have neither lent to the banks nor suspended the Bank Act during this [concept_spec_financial_panic]"
 spec_credit_tight: "Tight Credit"
 spec_credit_tight_fx: "@spec_credit_policy! [concept_spec_credit_policy] becomes #v Tight#!"
 spec_credit_normal_fx: "@spec_credit_policy! [concept_spec_credit_policy] becomes #v Normal#!"
 spec_credit_loose_fx: "@spec_credit_policy! [concept_spec_credit_policy] becomes #v Loose#!"
 spec_credit_tight_desc: "#italic Make borrowing dear to cool the market down.#!\n\n#N Banks stop lending#!\nInvestors get less excited by rising prices\n#P Smaller booms#!, gentler endings and milder panics\nEach month, #N 10%#! of any [concept_spec_market_confidence] above #v 60#! wears off\n\nLocks [concept_spec_credit_policy] for #v 6#! months\nNeeds [GetTechnology('central_banking').GetName]\n\n@intelligentsia! Intelligentsia [concept_in_government]: #P +2#! [concept_approval]\n@industrialists! Industrialists [concept_in_government]: #N -2#! [concept_approval]"
 spec_credit_normal: "Normal Credit"
 spec_credit_normal_desc: "#italic Banks lend on ordinary terms.#!\n\nThey lend into the [concept_investment_pool] while [concept_spec_market_confidence] is above #v 55#!\n\nLocks [concept_spec_credit_policy] for #v 6#! months\nNeeds [GetTechnology('central_banking').GetName]"
 spec_credit_loose: "Loose Credit"
 spec_credit_loose_desc: "#italic Make borrowing cheap and let the money flow.#!\n\n#P Banks lend more#!\nInvestors get more excited by rising prices\n#P Bigger booms#!, but #N bigger losses#! when they end\n\nLocks [concept_spec_credit_policy] for #v 6#! months\nNeeds [GetTechnology('central_banking').GetName]\n\n@industrialists! Industrialists [concept_in_government]: #P +2#! [concept_approval]\n@intelligentsia! Intelligentsia [concept_in_government]: #N -2#! [concept_approval]"
 spec_rescue_banks: "Lend to the Banks"
 spec_rescue_banks_desc: "#italic Pour money from the [concept_treasury] into the banks to stop the panic.#!\n\nCost: about #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#! of [concept_gdp]\n#P Ends#! the [concept_spec_financial_panic] within #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#! months\n#P Halves#! its penalties for the months it has left\n[concept_spec_market_confidence] rises by #P 20#!\n\n#b Not changed#!\n$spec_panic_relief$ payments\nPeople already radicalized when the panic began\n[concept_spec_bad_debts] it leaves behind\n\nThe longer the panic has left to run, the more it costs\nOnly once per $concept_spec_financial_panic$\n[GetTechnology('central_banking').GetName] makes it cheaper and faster"
 spec_conf_panic: "Shaken Investors"
 spec_conf_panic_held: "Shaken Investors"
 spec_conf_wary: "Wary Investors"
 spec_conf_steady: "Steady Investors"
 spec_conf_buoyant: "Buoyant Investors"
 spec_conf_mania: "Manic Investors"
 spec_conf_panic_desc: "Effects of [concept_spec_market_confidence] on investment and the interest on [concept_loans]"
 spec_conf_panic_held_desc: "Effects of [concept_spec_market_confidence] on investment and the interest on [concept_loans]"
 spec_conf_wary_desc: "Effects of [concept_spec_market_confidence] on investment and the interest on [concept_loans]"
 spec_conf_steady_desc: "Effects of [concept_spec_market_confidence] on investment and the interest on [concept_loans]"
 spec_conf_buoyant_desc: "Effects of [concept_spec_market_confidence] on investment and the interest on [concept_loans]"
 spec_conf_mania_desc: "Effects of [concept_spec_market_confidence] on investment and the interest on [concept_loans]"
 spec_panic: "Financial Panic"
 spec_panic_desc: "Effects of a [concept_spec_financial_panic] in the [concept_market]"
 spec_panic_crunch: "Credit Crunch"
 spec_panic_crunch_desc: "The banks have stopped lending for the duration of the [concept_spec_financial_panic], and [concept_private_construction] has slowed sharply"
 spec_lev_boom: "Credit Boom"
 spec_bailout_fx_tt: "@spec_bad_debts! [concept_spec_bad_debts] are #P halved#!, clearing in #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_months')|0]#! months instead of #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#!"
 spec_bailout_cost_tt: "[concept_treasury]: #N -@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_cost')|D]#!, about #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_share')|%0]#! of [concept_gdp]"
 spec_bailout_debts_tt: "There are [concept_spec_bad_debts] to clear"
 spec_bailed_tt: "The state has not bought up bad loans since these [concept_spec_bad_debts] began"
 spec_lev_boom_desc: "Borrowed money keeps the works busy, adding #P +2%#! [concept_throughput] for each whole month of [concept_spec_leverage], up to #P +24%#!"
 spec_credit_crunch: "Bad Debts"
 spec_credit_crunch_desc: "The banks are still counting their losses from the last boom. #N They lend nothing#! until this fades.\n#v Lend to the Banks#! does not clear it\n#v Buy Up Bad Loans#! halves it, once while it lasts"
 spec_loose_credit: "Loose Credit"
 spec_loose_credit_desc: "Effects of the [concept_spec_credit_policy]"
 spec_tight_credit: "Tight Credit"
 spec_tight_credit_desc: "Effects of the [concept_spec_credit_policy]"
 spec_markets.1.t: "Speculative Mania"
 spec_markets.1.d: "Fortunes are being made in [ROOT.GetCountry.GetCapital.GetCityHubName] faster than they can be counted. The prices of [ROOT.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName], [ROOT.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName] and [ROOT.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName] climb by the week, new companies to produce them are floated almost daily, and the banks lend against their shares without a second look. Few stop to ask what any of it is worth.\n\nSome $capitalists_no_icon$ and $shopkeepers_no_icon$ credit the government with their new wealth and become [Concept('concept_loyalist','$concept_loyalists|q$')]. If it lasts, [Concept('concept_political_movement','$concept_political_movements|q$')] that favor [GetLawType('law_laissez_faire').GetName] will gain support."
 spec_markets.1.d_generic: "Fortunes are being made in [ROOT.GetCountry.GetCapital.GetCityHubName] faster than they can be counted. Prices climb by the week, new companies are floated almost daily, and the banks lend against their shares without a second look. Few stop to ask what any of it is worth.\n\nSome $capitalists_no_icon$ and $shopkeepers_no_icon$ credit the government with their new wealth and become [Concept('concept_loyalist','$concept_loyalists|q$')]. If it lasts, [Concept('concept_political_movement','$concept_political_movements|q$')] that favor [GetLawType('law_laissez_faire').GetName] will gain support."
 spec_markets.1.f: ""Buy, my boy, and never mind the price. Whatever you pay today, some other fellow will pay more tomorrow.""
 spec_markets.1.a: "Prosperity speaks for itself."
 spec_markets.1.b: "Counsel restraint."
 spec_markets.1.b.tt: "@spec_market_confidence! [concept_spec_market_confidence] falls by #v 10#!"
 spec_markets.1.c: "Let the speculators pay their share."
 spec_markets.1.c.tt: "@spec_market_confidence! [concept_spec_market_confidence] falls by #v 5#!"
 spec_markets.2.t: "Financial Panic"
 spec_markets.2.d_crash: "The end of the boom in [ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName], the largest of the booms that ended, has become a general panic. Houses that lent against its price are failing one after another, and depositors have queued outside the banks of [ROOT.GetCountry.GetCapital.GetCityHubName] since first light. The banks are calling in #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#! of loans, and investors hold on to what little they have left. [concept_private_construction] will be halved for #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! months.\n\nRuined $capitalists_no_icon$, $aristocrats_no_icon$ and $shopkeepers_no_icon$ blame the government, and some become [Concept('concept_radical','$concept_radicals|q$')]. Many now want the state to rein in the markets, and [Concept('concept_political_movement','$concept_political_movements|q$')] against [GetLawType('law_laissez_faire').GetName] gain support.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_crash_no_loans: "The end of the boom in [ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName], the largest of the booms that ended, has become a general panic. Houses that lent against its price are failing one after another, and depositors have queued outside the banks of [ROOT.GetCountry.GetCapital.GetCityHubName] since first light. Investors hold on to what little they have left. [concept_private_construction] will be halved for #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! months.\n\nRuined $capitalists_no_icon$, $aristocrats_no_icon$ and $shopkeepers_no_icon$ blame the government, and some become [Concept('concept_radical','$concept_radicals|q$')]. Many now want the state to rein in the markets, and [Concept('concept_political_movement','$concept_political_movements|q$')] against [GetLawType('law_laissez_faire').GetName] gain support.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign: "The panic in [ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName] has crossed into our markets. Houses that traded or borrowed there are failing one after another, and depositors have queued outside the banks of [ROOT.GetCountry.GetCapital.GetCityHubName] since first light. The banks are calling in #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#! of loans, and investors hold on to what little they have left. [concept_private_construction] will be halved for #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! months.\n\nRuined $capitalists_no_icon$, $aristocrats_no_icon$ and $shopkeepers_no_icon$ blame the government, and some become [Concept('concept_radical','$concept_radicals|q$')]. Many now want the state to rein in the markets, and [Concept('concept_political_movement','$concept_political_movements|q$')] against [GetLawType('law_laissez_faire').GetName] gain support.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign_no_loans: "The panic in [ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName] has crossed into our markets. Houses that traded or borrowed there are failing one after another, and depositors have queued outside the banks of [ROOT.GetCountry.GetCapital.GetCityHubName] since first light. Investors hold on to what little they have left. [concept_private_construction] will be halved for #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! months.\n\nRuined $capitalists_no_icon$, $aristocrats_no_icon$ and $shopkeepers_no_icon$ blame the government, and some become [Concept('concept_radical','$concept_radicals|q$')]. Many now want the state to rein in the markets, and [Concept('concept_political_movement','$concept_political_movements|q$')] against [GetLawType('law_laissez_faire').GetName] gain support.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other: "Confidence has failed all at once. Sound firms cannot borrow at any price, and depositors have queued outside the banks of [ROOT.GetCountry.GetCapital.GetCityHubName] since first light. The banks are calling in #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#! of loans, and investors hold on to what little they have left. [concept_private_construction] will be halved for #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! months.\n\nRuined $capitalists_no_icon$, $aristocrats_no_icon$ and $shopkeepers_no_icon$ blame the government, and some become [Concept('concept_radical','$concept_radicals|q$')]. Many now want the state to rein in the markets, and [Concept('concept_political_movement','$concept_political_movements|q$')] against [GetLawType('law_laissez_faire').GetName] gain support.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other_no_loans: "Confidence has failed all at once. Sound firms cannot borrow at any price, and depositors have queued outside the banks of [ROOT.GetCountry.GetCapital.GetCityHubName] since first light. Investors hold on to what little they have left. [concept_private_construction] will be halved for #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! months.\n\nRuined $capitalists_no_icon$, $aristocrats_no_icon$ and $shopkeepers_no_icon$ blame the government, and some become [Concept('concept_radical','$concept_radicals|q$')]. Many now want the state to rein in the markets, and [Concept('concept_political_movement','$concept_political_movements|q$')] against [GetLawType('law_laissez_faire').GetName] gain support.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.bad_debts: "The boom's loans have gone bad. Over the coming months [concept_spec_bad_debts] will cut [concept_throughput] by #N [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_tp_full_pct')|1]%#!, then fade, clearing in #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#! months. Banks will lend nothing until they clear, and #v Lend to the Banks#! will not clear them."
 spec_markets.2.d_crash_bad: "$spec_markets.2.d_crash$\n\n$spec_markets.2.bad_debts$"
 spec_markets.2.d_crash_no_loans_bad: "$spec_markets.2.d_crash_no_loans$\n\n$spec_markets.2.bad_debts$"
 spec_markets.2.d_foreign_bad: "$spec_markets.2.d_foreign$\n\n$spec_markets.2.bad_debts$"
 spec_markets.2.d_foreign_no_loans_bad: "$spec_markets.2.d_foreign_no_loans$\n\n$spec_markets.2.bad_debts$"
 spec_markets.2.d_other_bad: "$spec_markets.2.d_other$\n\n$spec_markets.2.bad_debts$"
 spec_markets.2.d_other_no_loans_bad: "$spec_markets.2.d_other_no_loans$\n\n$spec_markets.2.bad_debts$"
 spec_markets.2.f: ""Yesterday I was worth forty thousand. This morning I am worth my coat, and I have been offered very little for that.""
 spec_markets.2.a: "The market must find its own floor."
 spec_markets.2.a.tt: "The [concept_spec_financial_panic] runs its full course unless we later #v Lend to the Banks#!, which also removes this $ig_industrialists$ [concept_approval] change"
 spec_markets.2.b: "We must lend to the banks."
 spec_markets.2.b.tt: "The [concept_spec_financial_panic] ends within #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#! months and its effects are halved\n[concept_spec_market_confidence] rises by #v 20#!"
 spec_rescue_cost_tt: "[concept_treasury]: #N -@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_cost')|D]#!, about #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#! of [concept_gdp]"
 spec_levy_tt: "[concept_treasury]: #P +@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_speculator_tax')|D]#!, about #v 0.25%#! of [concept_gdp]"
 spec_bank_bailout_tt: "$ig_trade_unions$ and $ig_rural_folk$ [concept_approval]: #N -2#! for #v 2.5#! years"
 spec_markets.2.c: "The speculators brought this upon us."
