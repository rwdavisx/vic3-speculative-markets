 SPEC_RISK_SLIGHT: "#header Risk of a $SPEC_UNWIND$#!\n[concept_spec_market_confidence] if the boom ends: #v Slight#!\n$TOOLTIP_DELIMITER$\n#italic A small boom. If it ended now, it would barely hurt.#!\n\n$SPEC_UNWIND_DESC$"
 SPEC_RISK_GLUT: "#header Recovering#!\n$TOOLTIP_DELIMITER$\n#italic [Goods.GetName] is getting over its last boom.#!\n\nInvestors stay away for a while, so [concept_spec_investor_interest] stays at #v Doubtful#!"
 SPEC_RISK_CALM: "#header No Boom#!\n$TOOLTIP_DELIMITER$\n#italic Nothing to worry about. [Goods.GetName] has had no boom lately.#!\n\nOnce [concept_spec_investor_interest] reaches #v Keen#! or more, a drop back to #v Doubtful#! #N ends the boom#!\nThe higher it climbs, the harder it falls"
 SPEC_UNWIND_3: "Collapse"
 SPEC_UNWIND_C_3: "@spec_collapse! [concept_spec_collapse]"
 SPEC_UNWIND_DESC_3: "This boom got as high as #v Feverish#!\n#N Ends#! if the price trend drops below #v [Divide_CFixedPoint('(CFixedPoint)-4.988', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!. Then [concept_spec_investor_interest] turns #v Fleeing#! and the boom ends in a [concept_spec_collapse]\nInvestors then stay away for #v 12#! months\n#P The danger fades#! as the boom gets older"
 SPEC_UNWIND_2: "Bust"
 SPEC_UNWIND_C_2: "@spec_bust! [concept_spec_bust]"
 SPEC_UNWIND_DESC_2: "This boom got as high as #v Eager#!\n#N Ends#! if the price trend drops below #v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!. Then [concept_spec_investor_interest] turns #v Doubtful#! and the boom ends in a [concept_spec_bust]\nInvestors then stay away for #v 6#! months\n#P The danger fades#! as the boom gets older"
 SPEC_UNWIND_1: "Correction"
 SPEC_UNWIND_C_1: "@spec_correction! [concept_spec_correction]"
 SPEC_UNWIND_DESC_1: "This boom got as high as #v Keen#!\n#N Ends#! if the price trend drops below #v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!. Then [concept_spec_investor_interest] turns #v Doubtful#! and the boom ends in a [concept_spec_correction]\nInvestors then stay away for #v 3#! months\n#P The danger fades#! as the boom gets older"
 spec_map_tt: "#header [SCOPE.sCountry('spec_map_owner').GetName]#!\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)6'), 'SPEC_MAP_STAGE_6', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)5'), 'SPEC_MAP_STAGE_5', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)4'), 'SPEC_MAP_STAGE_4', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)3'), 'SPEC_MAP_STAGE_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)2'), 'SPEC_MAP_STAGE_2', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)1'), 'SPEC_MAP_STAGE_1', 'SPEC_MAP_STAGE_0'))))))]\n[concept_spec_market_confidence]: #v [SCOPE.sCountry('spec_map_owner').MakeScope.Var('spec_conf').GetValue|0]#!"
