 spec_coty: "Company of the Year"
 spec_coty_desc: "The world's most prosperous [concept_spec_blue_chip] is ours this year"
 spec_bc_index: "Blue Chip Index"
 spec_bc_index_desc: "Our [concept_spec_blue_chip]s pull savings into the market and make loans cheaper. Each one makes it stronger. The first 5 count in full, and the rest up to 10 count half."
 spec_bluechip.1.t: "A New Blue Chip"
 spec_bluechip.1.d: "After a year of steady profits, [SCOPE.sCompany('spec_bc_co').GetName] is now counted among the blue chips. Its shares are sought by every bank and widow in the land, and the brokers ask whether it will stay content with its standing or ask the market for more."
 spec_bluechip.1.f: "Safe as the Bank, they say."
 spec_bluechip.1.a: "Ring the bell for them"
 spec_bluechip.1.a.tt: "Our [concept_spec_exchange] trust: #P +2%#!"
 spec_bluechip.1.b: "Let them issue new shares"
 spec_bluechip.1.b.tt: "Our [concept_investment_pool]: #P +[ROOT.GetCountry.MakeScope.ScriptValue('spec_bc_shares')|D]#! @money!\n[SCOPE.sCompany('spec_bc_co').GetName] turns fragile for #v 5#! years, so one month below #v 70#! [concept_prosperity] means it is no longer a blue chip"
 spec_bluechip.2.t: "A Blue Chip Slips"
 spec_bluechip.2.d: "[SCOPE.sCompany('spec_bc_co').GetName] has fallen below the mark of a blue chip. If its profits do not recover within 3 months, the market will strike it from the list, and our Exchange will feel it."
 spec_bluechip.2.f: "A house that stood for a generation can fall in a season."
 spec_bluechip.2.a: "Prop it up"
 spec_bluechip.2.a.tt: "Cost: #N [ROOT.GetCountry.MakeScope.ScriptValue('spec_bc_prop_cost')|D]#! @money!\n[SCOPE.sCompany('spec_bc_co').GetName] keeps its status for #v 12#! months, whatever its profits"
 spec_bluechip.2.b: "Let the market decide"
 spec_bluechip.2.b.tt: "If it stays below the mark for #v 3#! months:\nOur [concept_spec_exchange] trust: #N -2%#!\n[concept_spec_market_confidence]: #N -3#!"
 spec_bluechip.3.t: "Company of the Year"
 spec_bluechip.3.d: "The financial press of every capital agrees that [SCOPE.sCompany('spec_bc_co').GetName] is the most prosperous company in the world this year. Our Exchange basks in its glory."
 spec_bluechip.3.f: "Every clerk in the City wants a share of it."
 spec_bluechip.3.a: "A proud day"
 spec_bluechip.3.a.tt: "Our [concept_spec_exchange] trust: #P +2%#!\n$spec_coty$ for a year: [concept_prestige] #P +5%#!"
 SPEC_H_CENTRES: "Leading Exchanges"
 SPEC_H_CENTRES_TT: "#header $concept_spec_financial_centres$#!\n$concept_spec_financial_centre_desc$"
 concept_spec_financial_centre: "Leading Exchange"
 concept_spec_financial_centres: "Leading Exchanges"
 concept_spec_financial_centre_desc: "@spec_financial_centre! The $concept_spec_financial_centres$ are the #v 5#! [Concept('concept_country','$concept_countries|q$')] with the highest [Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')] score, ranked each month. The more [concept_investment_pool] money your [concept_spec_exchange] can draw on, the higher it scores. Trust, wealth per head, Financial Districts, companies, finance technologies, [concept_rank] and economic system all change it. The top three average #v 100#!.\n\nFirst place: #P +10%#! [concept_prestige], #P -10%#! [concept_loans] interest rate, #P +5#! months of Lending Limit\nLast place (#v 5#!): #P +2%#!, #P -2%#!, #P +1#! month\nThe Lending Limit bonus needs [GetTechnology('central_banking').GetName] and Lending Standards #v Sound#! or stricter"
