 SPEC_PLEDGE_MAKE_TT: "#header Pledge to Rescue the Banks#!\n$TOOLTIP_DELIMITER$\n#italic The state promises to save the banks whenever they get into trouble.#!\n\n#P Every#! [concept_spec_financial_panic] is rescued at once, #P 25%#! cheaper, while the [concept_treasury] can pay from reserves and we are not in [concept_default]\nTrust our [concept_spec_exchange] loses in a panic: #P -50%#!\n[concept_spec_capital_flight] coming in: #P +50%#!\n#N Each rescue#! loosens Lending Standards\n$TOOLTIP_DELIMITER$\n#N If we go into#! [concept_default], the Pledge breaks and all trust is lost. [concept_spec_market_confidence] #N -15#!, [concept_legitimacy] #N -10#! for #v 5#! years\n#weak Taking the Pledge back takes#! #v 24#! #weak months' notice#![AddLocalizationIf(Not(GetScriptedGui('spec_sgui_pledge').IsValid(GuiScope.SetRoot(Country.MakeScope).End)), 'SPEC_PLEDGE_PLEDGE_WHY')]"
