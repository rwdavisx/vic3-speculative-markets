 SPEC_H_BANK_LENT: "Where the Banks Have Lent"
 SPEC_H_BANK_LENT_TT: "#header Where the Banks Have Lent#!\n$TOOLTIP_DELIMITER$\n#italic Banks pour new loans into the goods that are booming.#!\n\nBigger goods with more [concept_spec_investor_interest] get more of the money\nA loan stays in its good until it is paid back\n#N If a boom with loans in it ends#!, [concept_spec_market_confidence] falls further\n$TOOLTIP_DELIMITER$\n#instruction Restrain speculation in a good to halve the new loans it gets.#!"
