 SPEC_RV_TIER_LOSS_TT: "#header $SPEC_RV_BAND_LOSS$#!\n#italic The bar ends #v 20%#! to #v 75%#! their way when the contest settles#!\n$TOOLTIP_DELIMITER$\nOur [concept_spec_exchange] trust: #N -[Multiply_CFixedPoint(Multiply_CFixedPoint(Divide_CFixedPoint(Multiply_CFixedPoint(Select_CFixedPoint(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValue, GetPlayer.MakeScope.Var('spec_exch_stand').GetValue), Divide_CFixedPoint('(CFixedPoint)3', Add_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValue, GetPlayer.MakeScope.Var('spec_exch_stand').GetValue), '(CFixedPoint)1')), Multiply_CFixedPoint('(CFixedPoint)3', Add_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(GetPlayer.MakeScope.Var('spec_exch_stand').GetValue, Country.MakeScope.Var('spec_exch_stand').GetValue), '(CFixedPoint)0'), '(CFixedPoint)1'))), '(CFixedPoint)2'), '(CFixedPoint)120'), GetPlayer.MakeScope.ScriptValue('spec_exch_loss')), Select_CFixedPoint(GetScriptedGui('spec_sgui_rv_is_bitter').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End), '(CFixedPoint)1.5', '(CFixedPoint)1'))|%0]#!\n[Country.GetNameNoFormatting]'s trust: #P +[Divide_CFixedPoint(Multiply_CFixedPoint(Select_CFixedPoint(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValue, GetPlayer.MakeScope.Var('spec_exch_stand').GetValue), Divide_CFixedPoint('(CFixedPoint)3', Add_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValue, GetPlayer.MakeScope.Var('spec_exch_stand').GetValue), '(CFixedPoint)1')), Multiply_CFixedPoint('(CFixedPoint)3', Add_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(GetPlayer.MakeScope.Var('spec_exch_stand').GetValue, Country.MakeScope.Var('spec_exch_stand').GetValue), '(CFixedPoint)0'), '(CFixedPoint)1'))), '(CFixedPoint)2'), '(CFixedPoint)120')|%0]#!\n$TOOLTIP_DELIMITER$\n$SPEC_RV_NOW_LINE$"
 SPEC_RV_TIER_BIGLOSS_TT: "#header $SPEC_RV_BAND_BIGLOSS$#!\n#italic The bar ends more than #v 75%#! their way when the contest settles#!\n$TOOLTIP_DELIMITER$\nOur [concept_spec_exchange] trust: #N -[Multiply_CFixedPoint(Multiply_CFixedPoint(Divide_CFixedPoint(Multiply_CFixedPoint(Select_CFixedPoint(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValue, GetPlayer.MakeScope.Var('spec_exch_stand').GetValue), Divide_CFixedPoint('(CFixedPoint)3', Add_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValue, GetPlayer.MakeScope.Var('spec_exch_stand').GetValue), '(CFixedPoint)1')), Multiply_CFixedPoint('(CFixedPoint)3', Add_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(GetPlayer.MakeScope.Var('spec_exch_stand').GetValue, Country.MakeScope.Var('spec_exch_stand').GetValue), '(CFixedPoint)0'), '(CFixedPoint)1'))), '(CFixedPoint)4'), '(CFixedPoint)120'), GetPlayer.MakeScope.ScriptValue('spec_exch_loss')), Select_CFixedPoint(GetScriptedGui('spec_sgui_rv_is_bitter').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End), '(CFixedPoint)1.5', '(CFixedPoint)1'))|%0]#!\n[Country.GetNameNoFormatting]'s trust: #P +[Divide_CFixedPoint(Multiply_CFixedPoint(Select_CFixedPoint(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValue, GetPlayer.MakeScope.Var('spec_exch_stand').GetValue), Divide_CFixedPoint('(CFixedPoint)3', Add_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValue, GetPlayer.MakeScope.Var('spec_exch_stand').GetValue), '(CFixedPoint)1')), Multiply_CFixedPoint('(CFixedPoint)3', Add_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(GetPlayer.MakeScope.Var('spec_exch_stand').GetValue, Country.MakeScope.Var('spec_exch_stand').GetValue), '(CFixedPoint)0'), '(CFixedPoint)1'))), '(CFixedPoint)4'), '(CFixedPoint)120')|%0]#!\n#N 5%#! of our [concept_investment_pool] income goes to them for #v 12#! months\n$TOOLTIP_DELIMITER$\n$SPEC_RV_NOW_LINE$"
