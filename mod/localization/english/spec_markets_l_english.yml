 SPEC_IL_LEVEL_1_TT: "#header @spec_interest_fleeing! Fleeing#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_IL_LEVEL_CURRENT')]\n$TOOLTIP_DELIMITER$\n#italic One of six levels of investor mood, set by how far the price runs from normal.#!\n\nA good is here when its price is below #v [Country.MakeScope.ScriptValue('spec_level_from_2')|=+%1]#! from normal\nRight now: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Effects:#!\nProducers' [concept_throughput]: #N -10%#!\nIf a #v Feverish#! boom drops this low, it ends in a [concept_spec_collapse]\nYou can encourage investment here, unless the good is recovering"
 SPEC_IL_LEVEL_2_TT: "#header @spec_interest_doubtful! Doubtful#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_LEVEL_CURRENT')]\n$TOOLTIP_DELIMITER$\n#italic One of six levels of investor mood, set by how far the price runs from normal.#!\n\nA good is here when its price is between #v [Country.MakeScope.ScriptValue('spec_level_from_2')|=+%1]#! and #v [Country.MakeScope.ScriptValue('spec_level_from_3')|=+%1]#! from normal\nRight now: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Effects:#!\nProducers' [concept_throughput]: #N -5%#!\nAfter a boom ends, the good stays here or lower for a while to recover\nYou can encourage investment here, unless the good is recovering"
 SPEC_IL_LEVEL_3_TT: "#header @spec_interest_calm! Calm#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_LEVEL_CURRENT')]\n$TOOLTIP_DELIMITER$\n#italic One of six levels of investor mood, set by how far the price runs from normal.#!\n\nA good is here when its price is between #v [Country.MakeScope.ScriptValue('spec_level_from_3')|=+%1]#! and #v [Country.MakeScope.ScriptValue('spec_level_from_4')|=+%1]#! from normal\nRight now: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Effects:#!\nNothing happens at this level\nYou can encourage investment here, unless the good is recovering"
 SPEC_IL_LEVEL_4_TT: "#header @spec_interest_keen! Keen#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)4'), 'SPEC_IL_LEVEL_CURRENT')]\n$TOOLTIP_DELIMITER$\n#italic One of six levels of investor mood, set by how far the price runs from normal.#!\n\nA good is here when its price is between #v [Country.MakeScope.ScriptValue('spec_level_from_4')|=+%1]#! and #v [Country.MakeScope.ScriptValue('spec_level_from_5')|=+%1]#! from normal\nRight now: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Effects:#!\nProducers' [concept_throughput]: #P +3%#!\nWhen it ends: [concept_spec_correction]"
 SPEC_IL_LEVEL_5_TT: "#header @spec_interest_eager! Eager#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)5'), 'SPEC_IL_LEVEL_CURRENT')]\n$TOOLTIP_DELIMITER$\n#italic One of six levels of investor mood, set by how far the price runs from normal.#!\n\nA good is here when its price is between #v [Country.MakeScope.ScriptValue('spec_level_from_5')|=+%1]#! and #v [Country.MakeScope.ScriptValue('spec_level_from_6')|=+%1]#! from normal\nRight now: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Effects:#!\nProducers' [concept_throughput]: #P +5%#!\n[concept_spec_market_confidence] #P goes up#! every month (more if it is a big part of our trade, none during a [concept_spec_financial_panic])\nWhen it ends: [concept_spec_bust]\nYou can restrain speculation here"
 SPEC_IL_LEVEL_6_TT: "#header @spec_interest_feverish! Feverish#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)6'), 'SPEC_IL_LEVEL_CURRENT')]\n$TOOLTIP_DELIMITER$\n#italic One of six levels of investor mood, set by how far the price runs from normal.#!\n\nA good is here when its price is above #v [Country.MakeScope.ScriptValue('spec_level_from_6')|=+%1]#! from normal\nRight now: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Effects:#!\nProducers' [concept_throughput]: #P +8%#!\n[concept_spec_market_confidence] #P goes up#! every month (more if it is a big part of our trade, none during a [concept_spec_financial_panic])\nWhen it ends: [concept_spec_collapse]\nYou can restrain speculation here"
