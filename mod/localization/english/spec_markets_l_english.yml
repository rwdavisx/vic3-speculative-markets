 SPEC_LAXL_HERE: "\n\n#P We are here#!"
 SPEC_LAXL_0_TT: "#header Strict#!\n$TOOLTIP_DELIMITER$\n#italic Banks barely lend. Booms stay small and end gently.#!\n\n#b Compared with #v Sound#!:#!\nCredit lent each month: #v -25%#! to #v -15%#!\nShare of it going into booms: #P -50%#! to #P -30%#!\nCost of a Bank Rescue: #P -50%#! to #P -30%#!\n\n#P Our [concept_spec_exchange] builds trust in quiet months#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.2')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_1_TT: "#header Cautious#!\n$TOOLTIP_DELIMITER$\n#italic Banks lend carefully.#!\n\n#b Compared with #v Sound#!:#!\nCredit lent each month: #v -15%#! to #v -5%#!\nShare of it going into booms: #P -30%#! to #P -10%#!\nCost of a Bank Rescue: #P -30%#! to #P -10%#!\n\n#P Our [concept_spec_exchange] builds trust in quiet months#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.2'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.4')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_2_TT: "#header Sound#!\n$TOOLTIP_DELIMITER$\n#italic The normal level.#!\n\n#b Compared with #v Sound#!:#!\nCredit lent each month: #v -5%#! to #v +5%#!\nShare of it going into booms: #P -10%#! to #N +10%#!\nCost of a Bank Rescue: #P -10%#! to #N +10%#!\n\n#P Our [concept_spec_exchange] builds trust in quiet months#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.4'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.6')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_3_TT: "#header Lax#!\n$TOOLTIP_DELIMITER$\n#italic Banks lend easily and chase booms.#!\n\n#b Compared with #v Sound#!:#!\nCredit lent each month: #v +5%#! to #v +15%#!\nShare of it going into booms: #N +10%#! to #N +30%#!\nCost of a Bank Rescue: #N +10%#! to #N +30%#!\n\n#N Our [concept_spec_exchange] stops building trust#![AddLocalizationIf(And(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.6'), LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.8')), 'SPEC_LAXL_HERE')]"
 SPEC_LAXL_4_TT: "#header Reckless#!\n$TOOLTIP_DELIMITER$\n#italic Banks lend to anyone. Booms run hot and end hard.#!\n\n#b Compared with #v Sound#!:#!\nCredit lent each month: #v +15%#! to #v +25%#!\nShare of it going into booms: #N +30%#! to #N +50%#!\nCost of a Bank Rescue: #N +30%#! to #N +50%#!\n\n#N Our [concept_spec_exchange] stops building trust#![AddLocalizationIf(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.8'), 'SPEC_LAXL_HERE')]"
 SPEC_EFFECT_LAX: "Lending Standards"
 SPEC_EFFECT_LAX_VALUE: "#v [SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.2'), 'SPEC_LAXW_0', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.4'), 'SPEC_LAXW_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.6'), 'SPEC_LAXW_2', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.8'), 'SPEC_LAXW_3', 'SPEC_LAXW_4'))))]#!"
 SPEC_EFFECT_LAX_TT: "#header @spec_lending_standards! [concept_spec_lending_standards]: $SPEC_EFFECT_LAX_VALUE$#!\n$TOOLTIP_DELIMITER$\n#italic How careful our banks are when they lend. Careless banks lend more, but their booms end harder.#!\n\n#b Compared with normal (#v Sound#!)#!\n#v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_credit'), '(CFixedPoint)1')|+%0]#! credit lent each month\n#v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_pull'), '(CFixedPoint)1')|+%0]#! to the usual share of that credit going into booms\n#v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_cost'), '(CFixedPoint)1')|+%0]#! cost of a Bank Rescue\n\n#b How it moves#!\n#N Looser#! a little every quiet month (#v Strict#! to #v Reckless#! takes about #v 20#! years)\n#N Much looser#! each time we rescue the banks\n#P Stricter#! when a boom ends, or when we restrain one\n#P Much stricter#! when a [concept_spec_financial_panic] ends without a rescue\n$TOOLTIP_DELIMITER$\n#instruction Set [concept_spec_credit_policy] to #v Tight#! to stop it getting looser. A panic or Bad Debts also pause it. #v Sound#! or stricter also builds our [concept_spec_exchange]'s trust.#!"
 SPEC_TILE_CYCLE: "[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_overx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_OVER_ON', 'SPEC_GOODS_NONE')][SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_bb_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_TILE_BB_ON', 'SPEC_GOODS_NONE')]"
