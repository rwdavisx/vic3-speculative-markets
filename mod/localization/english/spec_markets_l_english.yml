 SPEC_DRIVER_BOOM_TT: "#header Booming Goods: [Country.MakeScope.Var('spec_c_boom').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] from #v [Country.MakeScope.Var('spec_n_boom').GetValueWithDefault('(CFixedPoint)0')|0]#! booming [Concept('concept_good','$concept_goods|q$')][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_BOOM_CAP')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_steady'), '(CFixedPoint)1')), 'SPEC_BOOM_STEADY')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_fin_boom'), '(CFixedPoint)1')), 'SPEC_BOOM_FIN')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_boom_rule'), '(CFixedPoint)1')), 'SPEC_BOOM_RULE')]\n$TOOLTIP_DELIMITER$\nThe bigger a good's share of our [concept_market], the more its boom adds. Nothing during a [concept_spec_financial_panic]\n#weak [GetTechnology('stock_exchange').GetName], [GetTechnology('investment_banks').GetName] and [GetTechnology('modern_financial_instruments').GetName] make it bigger#!"
