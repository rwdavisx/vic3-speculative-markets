 SPEC_H_COMPANIES: "Companies"
 SPEC_H_COMPANIES_TT: "#header $concept_companies$#!\n$TOOLTIP_DELIMITER$\n#italic How the market's mood about a good changes the buildings that make it.#!\n\nWith high [concept_spec_investor_interest], its buildings get #P more#! [concept_throughput]\nWith low interest, they get #N less#!\nAfter its boom ends, they get #N less still#! until it recovers\nA [concept_company] earns more while people want its goods"
 SPEC_H_COMPANIES_RIGHT: "[GetDataModelSize(Country.GetCompanies)]  @spec_blue_chip! #v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!"
 SPEC_H_COMPANIES_RIGHT_TT: "#header @spec_company_strength! [concept_spec_company_strength]: #v [Country.MakeScope.ScriptValue('spec_log_kstr')|1]#!#!\n$TOOLTIP_DELIMITER$\n#italic Our score for Home of Great Companies.#!\n\n#b Where it comes from#!\nWe add up the [concept_prosperity] of all our $concept_companies$, and every #v 20#! of it adds #v 1#!\n[Concept('concept_spec_blue_chip','$concept_spec_blue_chips|q$')]: #v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!, each one adds #v 2#! more\n#grey Having more companies only helps through their prosperity#!"
 SPEC_CO_BC: "#P [concept_spec_blue_chip]#!, adding #v 2#! to our [concept_spec_company_strength] and counting toward our $concept_spec_blue_chips$"
 SPEC_CO_BC_LOW: "  #N Slipping#! below #v 70#! [concept_prosperity] for #v [Company.MakeScope.Var('spec_bc_low').GetValue|0]#! of #v 3#! months. At #v 3#! it stops being one"
 SPEC_CO_BC_CLIMB: "Becomes a [concept_spec_blue_chip] after #v [Subtract_CFixedPoint('(CFixedPoint)12', Company.MakeScope.Var('spec_bc_months').GetValue)|0]#! more months at #v 70#! or more [concept_prosperity]"
 SPEC_CO_COTY: "#P Company of the Year#!, the world's most prosperous [concept_spec_blue_chip]"
 SPEC_CO_PROPPED: "  Propped up to keep its status for now, whatever its [concept_prosperity]"
 SPEC_CO_FRAGILE: "  #N Fragile#!, so a single month below #v 70#! [concept_prosperity] loses the status"
 SPEC_CO_NONE: "#low We own no companies#!"
 SPEC_BC_STRIP: "Blue Chips"
 SPEC_BC_STRIP_N: "#v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#! held"
 SPEC_BC_STRIP_FX: "Crash shield #P [Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)4.0')|0]%#!\nContest pull #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)3.0')|0]%#!\nTrust #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.417')|1]%#! a year"
 SPEC_BC_STRIP_TT: "#header $concept_spec_blue_chips$: #v [Country.MakeScope.ScriptValue('spec_log_kbc')|0]#!#!\n$TOOLTIP_DELIMITER$\n#italic Our steadiest, most prosperous companies.#!\n\nA company becomes one after #v 12#! months in a row at #v 70#! or more [concept_prosperity]\n\n#b What ours give us#!\n[concept_spec_market_confidence] lost to crashes and panics: #P -[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)4.0')|0]%#! #grey (-4% each)#!\n[concept_spec_exchange] trust: #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.4167')|1]%#! of the full bar a year #grey (+0.4% each)#!\n[concept_spec_exchange] contests: #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)3.0')|0]%#! our way #grey (+3% each)#!\nCapitalists' [concept_investment_pool] contribution: #P +[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.6')|1]%#! #grey (+0.6% each)#!\nLoan interest: #P -[Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)1.0')|0]%#! #grey (-1% each)#!\n#grey The first 5 count in full, the next 5 count half. Each one also adds #v 2#! to our [concept_spec_company_strength], our score for Home of Great Companies#!\n$TOOLTIP_DELIMITER$\n#b If we lose one#!\nIt happens after #v 3#! months in a row below #v 70#! [concept_prosperity]\n[concept_spec_exchange] trust: #N -1.7%#! of the full bar\n[concept_spec_market_confidence]: #N -3#!\nA Bear Raid that hits us makes one #N Fragile#! for a year. It then stops being one after a single month below #v 70#! [concept_prosperity], not #v 3#!\n\n#b Company of the Year#!\nIf ours is the world's most prosperous, we gain [concept_spec_exchange] trust #P +2.5%#! of the full bar, and [concept_prestige] #P +5%#! for a year"
