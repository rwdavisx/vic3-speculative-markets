 SPEC_COL_LEVER: "Intervention"
 SPEC_COL_LEVER_TT: "#header Market Interventions#!\n$TOOLTIP_DELIMITER$\n#italic Step in to cool a good down or heat it up.#!\n\n#v Restrain Speculation#! keeps interest #v Calm#!. Producers #N lose#! [concept_throughput] and pay a levy\n#v Encourage Investment#! keeps interest at least #v Keen#!. Producers #P gain#! $concept_throughput$ and the state pays\n$TOOLTIP_DELIMITER$\n#weak Each one costs [concept_authority] every month until lifted, more for staples and widely traded goods#!"
 SPEC_SEP_FEVERISH_TT: "#header @spec_interest_feverish! Feverish [concept_spec_investor_interest]#!\nShare of Our Trade: #v [Country.MakeScope.Var('spec_heat_6').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#italic How keen investors are on this good.#!\n\nProducers' [concept_throughput]: #P +8%#!\n[concept_spec_market_confidence] #P goes up#! every month (more if it is a big part of our trade, none during a [concept_spec_financial_panic])\nWhen it ends: [concept_spec_collapse]"
 SPEC_SEP_EAGER_TT: "#header @spec_interest_eager! Eager [concept_spec_investor_interest]#!\nShare of Our Trade: #v [Country.MakeScope.Var('spec_heat_5').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#italic How keen investors are on this good.#!\n\nProducers' [concept_throughput]: #P +5%#!\n[concept_spec_market_confidence] #P goes up#! every month (more if it is a big part of our trade, none during a [concept_spec_financial_panic])\nWhen it ends: [concept_spec_bust]"
 SPEC_SEP_KEEN_TT: "#header @spec_interest_keen! Keen [concept_spec_investor_interest]#!\nShare of Our Trade: #v [Country.MakeScope.Var('spec_heat_4').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#italic How keen investors are on this good.#!\n\nProducers' [concept_throughput]: #P +3%#!\nWhen it ends: [concept_spec_correction]"
 SPEC_SEP_CALM_TT: "#header @spec_interest_calm! Calm [concept_spec_investor_interest]#!\nShare of Our Trade: #v [Country.MakeScope.Var('spec_heat_3').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#italic How keen investors are on this good.#!\n\nNothing happens at this level"
 SPEC_SEP_DOUBTFUL_TT: "#header @spec_interest_doubtful! Doubtful [concept_spec_investor_interest]#!\nShare of Our Trade: #v [Country.MakeScope.Var('spec_heat_2').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#italic How keen investors are on this good.#!\n\nProducers' [concept_throughput]: #N -5%#!\nAfter a boom ends, the good stays here or lower for a while to recover"
 SPEC_SEP_FLEEING_TT: "#header @spec_interest_fleeing! Fleeing [concept_spec_investor_interest]#!\nShare of Our Trade: #v [Country.MakeScope.Var('spec_heat_1').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n#italic How keen investors are on this good.#!\n\nProducers' [concept_throughput]: #N -10%#!\nIf a #v Feverish#! boom drops this low, it ends in a [concept_spec_collapse]"
 SPEC_IB_TURNING_TT: "#header Boom Turning#!\n$TOOLTIP_DELIMITER$\n#italic [Goods.GetName] had a big boom, and it is fading.#!\n\nIf [concept_spec_investor_interest] keeps falling, it ends in a [concept_spec_collapse]\nThat would cost about #N [Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! [concept_spec_market_confidence]"
 SPEC_IB_HEAT_TT: "#header @spec_investor_interest! [concept_spec_investor_interest] in [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n$SPEC_TILE_BODY$"
