 notification_spec_tied_panic_name: "Panic breaks out in [SCOPE.sC('spec_note_src').GetName]"
 notification_spec_tied_panic_desc: "A [concept_spec_financial_panic] has broken out in [SCOPE.sC('spec_note_src').GetName], and our ties to them have carried a [concept_spec_foreign_panic] into our own markets."
 notification_spec_tied_panic_tooltip: "#header $notification_spec_tied_panic_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_tied_panic_desc$"
 notification_spec_tied_mania_name: "Speculative mania grips [SCOPE.sC('spec_note_src').GetName]"
 notification_spec_tied_mania_desc: "Investors in [SCOPE.sC('spec_note_src').GetName] have been seized by a [concept_spec_speculative_mania]. Should it end in a [concept_spec_financial_panic], our ties to them will drag down our own [concept_spec_market_confidence]."
 notification_spec_tied_mania_tooltip: "#header $notification_spec_tied_mania_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_tied_mania_desc$"
 notification_spec_feverish_name: "Investors grow feverish over [SCOPE.sGoods('spec_note_good').GetName]"
 notification_spec_feverish_desc: "@spec_investor_interest! [concept_spec_investor_interest] in [SCOPE.sGoods('spec_note_good').GetName] is now #v Feverish#!. If it drops all the way to #v Fleeing#! while the boom is still this big, the boom ends in a [concept_spec_collapse] and [concept_spec_market_confidence] drops hard. The boom shrinks slowly while it cools, so a gentle cool-down ends it more softly, and Restrain Speculation lets it down slowly, as a mild Correction."
 notification_spec_feverish_tooltip: "#header $notification_spec_feverish_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_feverish_desc$"
 notification_spec_near_panic_name: "Confidence nears panic"
 notification_spec_near_panic_desc: "@spec_market_confidence! [concept_spec_market_confidence] has fallen to #v [GetPlayer.MakeScope.Var('spec_conf').GetValue|0]#!. Below #v $SPEC_PANIC_AT$#!, a [concept_spec_financial_panic] will break out."
 notification_spec_near_panic_tooltip: "#header $notification_spec_near_panic_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_near_panic_desc$"
 notification_spec_nearly_broke_name: "Treasury runs low"
 notification_spec_nearly_broke_desc: "At our present deficit, we will face [concept_bankruptcy] in #v [GetPlayer.MakeScope.ScriptValue('spec_broke_weeks')|0]#! weeks. [concept_spec_market_confidence] will keep sliding until the budget recovers."
 notification_spec_nearly_broke_tooltip: "#header $notification_spec_nearly_broke_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_nearly_broke_desc$"
 notification_spec_panic_over_name: "The panic subsides"
 notification_spec_panic_over_desc: "The [concept_spec_financial_panic] has run its course. Its penalties and $spec_panic_relief$ payments have ended. Any [concept_spec_bad_debts] it left still slow production and investment until they fade."
 notification_spec_panic_over_tooltip: "#header $notification_spec_panic_over_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_panic_over_desc$"
 notification_spec_bubble_burst_name: "The bubble bursts"
 notification_spec_bubble_burst_desc: "@spec_market_confidence! [concept_spec_market_confidence] dropped too low to hold up our [concept_spec_speculative_excess]. The bubble has popped, and $concept_spec_market_confidence$ has dropped even more."
 notification_spec_bubble_burst_tooltip: "#header $notification_spec_bubble_burst_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_bubble_burst_desc$"
 notification_spec_lev_unsafe_name: "Leverage passes the safe limit"
 notification_spec_lev_unsafe_desc: "@spec_leverage! [concept_spec_leverage] has risen above #v 3#! months, the most that is safe. From here, a [concept_spec_financial_panic] will begin at a higher [concept_spec_market_confidence] and leave [concept_spec_bad_debts] behind it."
 notification_spec_lev_unsafe_tooltip: "#header $notification_spec_lev_unsafe_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_lev_unsafe_desc$"
