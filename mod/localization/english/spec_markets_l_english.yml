 concept_spec_long_depression: "Long Depression"
 concept_spec_long_depression_desc: "@spec_long_depression! The $concept_spec_long_depression$ is a crisis of the whole world economy. It begins when a [concept_great_power] falls into a [concept_spec_financial_panic]. It then reaches every country already in a panic, and spreads along close ties such as a shared [concept_market], subjects and overlords, investment rights, heavy trade and foreign ownership.\n\nDuring the World Crash (#v 4#! months), credit freezes and [concept_spec_market_confidence] drains away.\nDuring the Depression (up to #v 5#! years), investment, construction and trade slow, and some pops become [Concept('concept_radical','$concept_radicals|q$')].\nDuring the Recovery (#v 1#! year), $concept_spec_market_confidence$ returns.\n\nYour choices speed up your own recovery and the world's. A $concept_great_power$'s choices count the most."
