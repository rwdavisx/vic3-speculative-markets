 SPEC_XS_CAP_TT: "#header Capital#!\n$TOOLTIP_DELIMITER$\n#italic The money our [concept_spec_exchange] can draw on.#!\n\nOur own: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_own_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, six months of [concept_investment_pool] income (yearly average)\nFrom our ties: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_reach_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, a quarter of the money of each smaller [concept_country] in our [concept_market], our [Concept('concept_subject','$concept_subjects|q$')], our [concept_power_bloc], or any that gives us [concept_foreign_investment] rights. Never more than our own\n$TOOLTIP_DELIMITER$\n#weak More money helps, but less and less. It takes sixteen times the money to double the score#!"
 SPEC_XS_WEALTH_TT: "#header Wealth per Head#!\n$TOOLTIP_DELIMITER$\n#italic How rich our people are next to the world.#!\n\n[concept_investment_pool] income per person is #v [Country.MakeScope.Var('spec_xs_ratio_v').GetValueWithDefault('(CFixedPoint)0')|2]#! times the world average\nBoost: from #v x0.75#! to #v x1.5#!\n$TOOLTIP_DELIMITER$\n#weak Richer helps, but less and less#!"
 SPEC_XS_TECH_TT: "#header Finance Technologies#!\n$TOOLTIP_DELIMITER$\n#italic Money know-how our country has researched. Each one raises the score of our Exchange.#!\n\n#b Each one researched adds#!\n$banking$: #P +5%#!\n$stock_exchange$: #P +5%#!\n$central_banking$: #P +5%#!\n$joint_stock_companies$: #P +5%#!\n$mutual_funds$: #P +5%#!\n$investment_banks$: #P +10%#!\n$international_exchange_standards$: #P +10%#!\n$modern_financial_instruments$: #P +10%#!\n$TOOLTIP_DELIMITER$\n#instruction [GetTechnology('stock_exchange').GetName] is also needed to reach #v International#!, and [GetTechnology('central_banking').GetName] to reach #v World Centre#!, with the other things each Standing asks#!"
 SPEC_XS_ECON_TT: "#header Economic System#!\n$TOOLTIP_DELIMITER$\n#italic How our economic law changes the score.#!\n\n$law_laissez_faire$: #P x1.15#!\n$law_interventionism$: #P x1.05#!\n$law_agrarianism$: #N x0.95#!\n$law_traditionalism$: #N x0.9#!\n$law_extraction_economy$: #N x0.9#!\n$law_command_economy$: #N x0.75#!\n$law_cooperative_ownership$: #N x0.6#!"
