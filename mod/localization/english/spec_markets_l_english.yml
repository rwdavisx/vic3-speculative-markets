OW_LINE$"
 SPEC_RV_TIER_WIN_TT: "#header $SPEC_RV_BAND_WIN$#!\n#italic The bar ends #v 20%#! to #v 75%#! our way when the contest settles#!\n$TOOLTIP_DELIMITER$\nOur [concept_spec_exchange] trust: #P +[Divide_CFixedPoint(Multiply_CFixedPoint(Select_CFixedPoint(GreaterThan_CFixedPoint(GetPlayer.MakeScope.Var('spec_exch_stand').GetValue, Country.MakeScope.Var('spec_exch_stand').GetValue), Divide_CFixedPoint('(CFixedPoint)3', Add_CFixedPoint(Subtract_CFixedPoint(GetPlayer.MakeScope.Var('spec_exch_stand').GetValue, Country.MakeScope.Var('spec_exch_stand').GetValue), '(CFixedPoint)1')), Multiply_CFixedPoint('(CFixedPoint)3', Add_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValue, GetPlayer.MakeScope.Var('spec_exch_stand').GetValue), '(CFixedPoint)0'), '(CFixedPoint)1'))), '(CFixedPoint)2'), '(CFixedPoint)120')|%0]#!\n[Country.GetNameNoFormatting]'s trust: #N -[Multiply_CFixedPoint(Multiply_CFixedPoint(Divide_CFixedPoint(Multiply_CFixedPoint(Select_CFixedPoint(GreaterThan_CFixedPoint(GetPlayer.MakeScope.Var('spec_exch_stand').GetValue, Country.MakeScope.Var('spec_exch_stand').GetValue), Divide_CFixedPoint('(CFixedPoint)3', Add_CFixedPoint(Subtract_CFixedPoint(GetPlayer.MakeScope.Var('spec_exch_stand').GetValue, Country.MakeScope.Var('spec_exch_stand').GetValue), '(CFixedPoint)1')), Multiply_CFixedPoint('(CFixedPoint)3', Add_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValue, GetPlayer.MakeScope.Var('spec_exch_stand').GetValue), '(CFixedPoint)0'), '(CFixedPoint)1'))), '(CFixedPoint)2'), '(CFixedPoint)120'), Country.MakeScope.ScriptValue('spec_exch_loss')), Select_CFixedPoint(GetScriptedGui('spec_sgui_rv_is_bitter').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End), '(CFixedPoint)1.5', '(CFixedPoint)1'))|%0]#!\n$TOOLTIP_DELIMITER$\n$SPEC_RV_NOW_LINE$"
