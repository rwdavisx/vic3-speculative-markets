 SPEC_DRIVER_CRASH_TT: "#header Ended Booms: [Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\nBiggest one last month: #v [Country.MakeScope.Var('spec_crashed').GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] from how big the ended booms were\n#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#! how hot the market is ([concept_spec_market_conditions])[AddLocalizationIf(Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-40')), 'SPEC_CRASH_CAP')]\n$TOOLTIP_DELIMITER$\nBigger booms, and goods with more of our [concept_market], hurt more\n#weak [GetTechnology('mutual_funds').GetName] softens it, [GetTechnology('modern_financial_instruments').GetName] makes it worse#!"
 SPEC_CRASH_CAP: "\nCapped at #N -40#! a month"
 SPEC_DRIVER_FOREIGN: "Foreign Panics"
 SPEC_FOREIGN_HIT: "\n#N -20#! base hit from a [concept_spec_foreign_panic]\n#v x[Country.MakeScope.Var('spec_fh_size').GetValueWithDefault('(CFixedPoint)0')|2]#! how big their economy is next to ours\n#v x[Country.MakeScope.Var('spec_fh_tie').GetValueWithDefault('(CFixedPoint)0')|2]#! how closely we are tied ([concept_spec_market_tie])\n#v x[Country.MakeScope.Var('spec_fh_reach').GetValueWithDefault('(CFixedPoint)0')|2]#! how important they are ([concept_rank])[AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_foreign_loss_mult'), '(CFixedPoint)1')), 'SPEC_FOREIGN_UNSTD')]"
 SPEC_FOREIGN_UNSTD: "\n#v x[Country.MakeScope.ScriptValue('spec_foreign_loss_mult')|2]#! because we have no [GetTechnology('currency_standards').GetName]"
 SPEC_FOREIGN_FLIGHT: "\n[Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')|+=2] from [concept_spec_capital_flight]"
 SPEC_DRIVER_FOREIGN_TT: "#header Foreign Panics: [Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\nLatest: #v [Country.MakeScope.Var('spec_foreign_src').GetCountry.GetName]#!\n$TOOLTIP_DELIMITER$[AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_HIT')][AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_FLIGHT')]\n$TOOLTIP_DELIMITER$\n#title @spec_market_tie! [concept_spec_market_tie]#!\n#italic How much of a tied country's panic reaches us through each kind of tie. They do not add up. When several panics reach us in a month, only the biggest hit counts.#!\nSame [concept_market]: #v [Country.MakeScope.ScriptValue('spec_tie_market')|%0]#!\nSubject or Overlord: #v 80%#!\nForeign Investment Rights: #v [Country.MakeScope.ScriptValue('spec_tie_investment')|%0]#!\nHeavy Trade Between Markets: #v [Country.MakeScope.ScriptValue('spec_tie_trade')|%0]#!\nForeign Ownership of Our Economy: up to #v 90%#!\n$TOOLTIP_DELIMITER$\n#weak A [concept_great_power]'s panic hits us in full, a major power's by half, a small country's barely. A panic we caught from abroad does not spread on.#!"
 SPEC_DRIVER_TURMOIL: "War and Unrest"
 SPEC_DRIVER_TURMOIL_TT: "#header War and Unrest: [Country.MakeScope.Var('spec_c_turmoil').GetValueWithDefault('(CFixedPoint)0')|+=2]#!$SPEC_ITEMS_TURMOIL$\n$TOOLTIP_DELIMITER$\nEach [concept_war] ([concept_spec_war_news]): #N -3#! to #P +0.15#! a month\nAll wars together: #N -4#! to #P +0.5#! a month\nA [concept_diplomatic_play] that is not war yet: #N -0.5#! a month\nTreasury running dry: up to #N -3#! a month, starting #v 20#! weeks before [concept_bankruptcy]\n[concept_default]: #N -5#! a month\n[concept_revolution]: #N -2#! a month\n\n#instruction Hover over a figure to see its causes#!"
 SPEC_DRIVER_MOOD: "Market Mood"
 SPEC_DRIVER_MOOD_TT: "#header Market Mood: [Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0')|+=2] from this month's random swing\n[Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0'))|+=2] left over from last month\n$TOOLTIP_DELIMITER$\n#weak Swings at random each month, up to #v 0.75#! either way. #v 75%#! of it carries into next month. Companies with high [concept_prosperity] lift it once our [concept_spec_exchange] is #v National#!.#!"
 SPEC_DRIVER_DRIFT: "Return to Baseline"
 SPEC_DRIVER_DRIFT_TT: "#header Return to Baseline: [Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0'), Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100'))|+=1] how far we are from [concept_spec_baseline] (#v 55#!)\n#v x[Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100')|%1]#! of the gap closes each month\n$TOOLTIP_DELIMITER$\n#weak [GetTechnology('macroeconomics').GetName] makes this half again as fast#!"
 SPEC_DRIVER_TIGHT: "Tight Credit"
 SPEC_DRIVER_GROWTH: "Growth"
 SPEC_DRIVER_GROWTH_TT: "#header Growth: [Country.MakeScope.Var('spec_c_growth').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#v [Country.MakeScope.Var('spec_growth').GetValueWithDefault('(CFixedPoint)0')|=+%1]#! [concept_gdp] growth compared with recent months\n#v 2%#! growth counts as normal and changes nothing\n$TOOLTIP_DELIMITER$\n#weak [concept_spec_market_confidence] moves #v 0.1#! a month for each #v 1%#! faster or slower than normal, up to #v 0.6#! either way#!"
 SPEC_DRIVER_BUSINESS: "Business Mood"
 SPEC_DRIVER_BUSINESS_TT: "#header Business Mood: [Country.MakeScope.Var('spec_c_business').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\nIndustrialists' [concept_approval]: #v [Country.MakeScope.ScriptValue('spec_ind_approval')|0]#!\n\nLoyal (#v 10#! or more): #P +0.4#! per month\nHappy (#v 5#! or more): #P +0.2#! per month\nUnhappy (#v -5#! or less): #N -0.2#! per month\nAngry (#v -10#! or less): #N -0.4#! per month"
 SPEC_DRIVER_TIGHT_TT: "#header Tight Credit: [Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.1')|1]#! of [concept_spec_market_confidence] above #v 60#!\n#N -10%#! of that a month, from [Concept('concept_spec_credit_policy','$concept_spec_credit_policy_tight|q$')]\n$TOOLTIP_DELIMITER$\n#weak Cools a boom slowly over months instead of all at once#!"
 concept_spec_market_conditions: "Market Conditions"
 concept_spec_market_conditions_desc: "@spec_market_conditions! $concept_spec_market_conditions$ are how hot the market is when a [concept_spec_boom_end] comes. They decide how much [concept_spec_market_confidence] the ending costs. The higher $concept_spec_market_confidence$ is at the time, the bigger the loss. At #v 55#! they do nothing. Financial Districts, Manor Houses and finance technologies also change them."
 concept_spec_baseline: "Baseline Confidence"
 concept_spec_baseline_desc: "@spec_baseline! $concept_spec_baseline$ is the level, #v 55#!, to which [concept_spec_market_confidence] returns when left alone, from above or below. The further it has strayed, the faster it returns."
 concept_spec_market_mood: "Market Mood"
 concept_spec_market_mood_desc: "@spec_market_mood! $concept_spec_market_mood$ is the swing in investors' feelings with no single cause. Each month it shifts by chance, by up to #v 0.75#! either way, and #v 75%#! of it carries over, so good and bad spells last a while before they fade."
 concept_spec_market_tie: "Market Tie"
 concept_spec_market_tie_desc: "@spec_market_tie! A $concept_spec_market_tie$ is how closely one [concept_country] follows another's [concept_market]. It sets how much of a [concept_spec_financial_panic] passes between them.\n\nOwnership counts once a country owns #v 10%#! of the other's [concept_gdp], and is strongest at #v 30%#!. [GetLawType('law_free_trade').GetName] strengthens the trade tie and other trade policies weaken it. [GetTechnology('international_exchange_standards').GetName] strengthens market and investment ties. An [concept_embargo] cuts the trade tie."
 concept_spec_capital_flight: "Capital Flight"
 concept_spec_capital_flight_desc: "@spec_capital_flight! When a [concept_spec_financial_panic] begins, money flees to safety. Each [concept_great_power], and each [concept_country] whose [concept_spec_exchange] is #v International#! or higher, gains up to #P +[GetPlayer.MakeScope.ScriptValue('spec_flight_gain_max')|0]#! [concept_spec_market_confidence] if it is at peace, at #v Steady#! or better, and not tied to the country in panic. [GetTechnology('international_trade').GetName] and [GetTechnology('international_exchange_standards').GetName] raise the gain. The higher an [concept_spec_exchange] stands, the more it receives."
 concept_spec_war_news: "War News"
 concept_spec_war_news_desc: "@spec_war_news! Investors follow a [concept_war] month by month. $concept_spec_war_news$ moves [concept_spec_market_confidence] each month by how it is going. [concept_casualties], [concept_blockade], [concept_devastation], falling [concept_gdp] and a long war lower it, while winning [Concept('concept_battle','$concept_battles|q$')] and holding enemy land raise it. Each war moves it by #N -3#! to #P +0.15#! per month, and all wars together by #N -4#! to #P +0.5#!."
