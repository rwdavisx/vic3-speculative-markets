 SPEC_WHY_SPEED: "#header Investor Reaction#!\n$TOOLTIP_DELIMITER$\n#italic How fast investors chase a change in price.#!\n\nWhen prices rise: #v x[Country.MakeScope.ScriptValue('spec_hype_mult')|2]#!\nWhen prices fall: #v x[Country.MakeScope.ScriptValue('spec_hype_mult_down')|2]#!\n$TOOLTIP_DELIMITER$\n#b Why#!\n#v x[Country.MakeScope.ScriptValue('spec_law_mult')|2]#! from Economic System\n#v x[Country.MakeScope.ScriptValue('spec_stance_hype')|2]#! from [concept_spec_credit_policy][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_stance_hype'), '(CFixedPoint)1'), 'SPEC_WHY_SPEED_LOOSE')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_tech_hype'), '(CFixedPoint)1')), 'SPEC_WHY_SPEED_TECH')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_depth'), '(CFixedPoint)1')), 'SPEC_WHY_SPEED_DEPTH')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_band_gain'), '(CFixedPoint)1')), 'SPEC_WHY_SPEED_BAND')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_hype'), '(CFixedPoint)1')), 'SPEC_WHY_SPEED_EXCH')]\n$TOOLTIP_DELIMITER$\n#weak The higher it is, the faster [concept_spec_investor_interest] follows prices up or down#!"
