 SPEC_JE_NEWS_6: "#italic Another Lean Year: Mills Stand Silent and the Banks Will Not Lend#!"
 SPEC_JE_NEWS_5: "#italic RUN ON THE BANKS! Crowds Besiege the Counting Houses of [GetPlayer.GetCapital.GetCityHubName]#!"
 SPEC_JE_NEWS_4: "#italic Exchange Reopens to Thin Trading as Creditors Count the Cost#!"
 SPEC_JE_NEWS_3: "#italic Fever on the [GetPlayer.GetCapital.GetCityHubName] Exchange: Clerks and Widows Buy [GetPlayer.MakeScope.Var('spec_top1').GetGoods.GetName] on Borrowed Money#!"
 SPEC_JE_NEWS_2: "#italic New [GetPlayer.MakeScope.Var('spec_top1').GetGoods.GetName] Issue Oversubscribed Within the Hour as Banks Lend Freely#!"
 SPEC_JE_NEWS_1: "#italic Quiet Day in [GetPlayer.GetCapital.GetCityHubName]: [GetPlayer.MakeScope.Var('spec_top1').GetGoods.GetName] Shares Firm, the Rest Unchanged#!"
 SPEC_JE_NEWS_0: "#italic Money Shy in [GetPlayer.GetCapital.GetCityHubName]: Brokers Idle as Investors Keep Their Purses Shut#!"
 SPEC_JE_EXCH: "[SelectLocalization(GetPlayer.MakeScope.Var('spec_exch_stand').IsSet, 'SPEC_JE_EXCH_ON', 'SPEC_JE_NONE')]"
 SPEC_JE_EXCH_ON: "$SPEC_EXCH_CITY_ME$ Exchange: #v $SPEC_EXCH_STAND_ME$#!"
 SPEC_JE_EXCH_TT: "Our [concept_spec_exchange] and its Standing. The #bold $SPEC_FIN_TAB_EXCHANGE$#! tab of the #bold $SPEC_FINANCE$#! window has the rest."
 SPEC_JE_FAVOURED: "Favoured"
 SPEC_JE_FAVOURED_TT: "The goods investors are keenest on this month, so shares in the companies and buildings that make them sell easily"
 SPEC_JE_SHUNNED: "Shunned"
 SPEC_JE_SHUNNED_TT: "The goods investors want least to do with this month"
 SPEC_JE_STAGE_6: "The [concept_spec_long_depression] hangs over [JournalEntry.GetCountry.GetCapital.GetCityHubName]. Investors hoard what they have and lend to no one, and each recovery so far has faltered within months. The world's recovery is followed in a journal entry of its own.\n\nRelief Works can put the unemployed to work and keep them fed while the slump lasts."
 SPEC_JE_STAGE_5: "Panic has gripped [JournalEntry.GetCountry.GetCapital.GetCityHubName]. Depositors queue outside the banks from first light, loans are called in, and [concept_private_construction] is halved for #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! more months unless the government acts.\n\n#v Lend to the Banks#! would end it sooner and halve its effects. Relief Works can put the unemployed to work and keep them fed.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_currency_v'), '(CFixedPoint)0'), 'SPEC_JE_SUSPEND_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_4: "The panic has passed, leaving failed houses and half-built works behind it. Investors are counting their losses, and no new panic can start for #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic_cooldown').GetValue|0]#! months.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_reform_open_v'), '(CFixedPoint)0'), 'SPEC_JE_INQUIRY_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_3: "The exchange in [JournalEntry.GetCountry.GetCapital.GetCityHubName] has gone mad. Clerks and widows buy shares in #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! and #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! with borrowed money, and every month that [concept_spec_market_confidence] stands at #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#! or more adds to the [concept_spec_speculative_excess]. When $concept_spec_market_confidence$ falls below #v 60#! the bubble bursts, and the greater the excess, the harder the fall.\n\nRestraining speculation in the hottest goods, or tightening credit, would let the air out slowly."
 SPEC_JE_STAGE_2: "Money is easy and investors are buoyant. New companies in #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! and #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! are oversubscribed within the hour, and the banks lend freely against their shares. With [concept_spec_market_confidence] at #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#! or more, the [concept_spec_speculative_excess] starts to build.\n\nGood times are also the moment to convert our national debt to a lower rate."
 SPEC_JE_STAGE_1: "Trade on the exchange in [JournalEntry.GetCountry.GetCapital.GetCityHubName] is orderly. Investors favor #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! and #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! and shun #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! and #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!."
 SPEC_JE_STAGE_0: "Investors in [JournalEntry.GetCountry.GetCapital.GetCityHubName] are wary. Burned by recent losses, they keep their money close and shun #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! and #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!. Loose credit, or encouragement to invest in a good, may coax them back."
