 SPEC_LEVERS_MANY: "[Country.MakeScope.ScriptValue('spec_levers_used')|0] Interventions: #N -[Country.MakeScope.ScriptValue('spec_lever_authority')|0]#! @aut!"
 concept_spec_intervention: "Intervention"
 concept_spec_intervention_desc: "@spec_intervention! With an $concept_spec_intervention$ your government steps into the market for one [concept_good]. You can #v Restrain Speculation#! in it or #v Encourage Investment#! in it.\n\n#v Restrain Speculation#! cools [concept_spec_investor_interest] to #v Calm#!. Its makers lose #N 10%#! [concept_throughput] and pay a levy of #v 10%#! of what they make each week, at base price.\n\n#v Encourage Investment#! warms interest to #v Keen#!. Its makers gain #P 10%#! $concept_throughput$ and get a subsidy of #v 20%#! of what they make.\n\nEach one costs [concept_authority] every month until you lift it. Staples cost more, and so do $concept_goods$ that make up a big part of the [concept_market]'s trade."
 SPEC_LEVER_ISSUE_TT: "#header Float a Great Issue in [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n#italic Sell shares in a hot [concept_good] on our exchange. Big rewards, big risks.#!\n\nFor #v 2#! years:\n[Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')] score: #P +25%#!\nWhen its boom ends, bank loans in it hurt #N x1.5#! as much\nWhen its boom ends, trust won or lost is #v x2#! as big\n$TOOLTIP_DELIMITER$\nOnly one at a time, at least #v 1#! year apart[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_issue_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_ISSUE_ON', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_issue').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_ISSUE_ON: "\n\nAn issue is running on this [concept_good]"
 spec_issue_stand_tt: "Our [concept_spec_exchange] stands #v National#! or higher"
 spec_issue_hot_tt: "@spec_investor_interest! [concept_spec_investor_interest] is #v Eager#! or higher"
 spec_issue_one_tt: "No other issue is running"
 spec_issue_cool_tt: "The market has had a year's rest since the last issue"
 spec_issue_no_lever_tt: "No [concept_spec_intervention] is in effect on this [concept_good]"
 spec_lever_no_issue_tt: "No Great Issue is running on this [concept_good]"
 SPEC_LEVERS_TT: "#header Market Interventions#!\n$TOOLTIP_DELIMITER$\n#italic Goods where our government is cooling or warming the market.#!\n\nCosts #N -[Country.MakeScope.ScriptValue('spec_lever_authority')|0]#! [concept_authority] a month\nRestrained: #v [Country.MakeScope.ScriptValue('spec_n_restrain')|0]#!\nEncouraged: #v [Country.MakeScope.ScriptValue('spec_n_encourage')|0]#!\n[concept_budget_additional_income]: #P @money![Country.MakeScope.ScriptValue('spec_lever_levy')|D]#! a week\n[concept_budget_additional_expenses]: #N @money![Country.MakeScope.ScriptValue('spec_lever_spend')|D]#! a week"
 spec_story.1.t: "The [ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName] Market Breaks"
 spec_story.1.t_generic: "A Market Breaks"
 spec_story.1.d: "The rush into [ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName] is over. Prices that climbed for a year have fallen in a month, and the companies floated at the height of the craze cannot meet their bills. Merchants who bought at any price are left with warehouses they cannot empty, and the banks that lent against their stock are counting the cost."
 spec_story.1.d_generic: "The rush into the season's favorite goods is over. Prices that climbed for a year have fallen in a month, and the companies floated at the height of the craze cannot meet their bills. Merchants who bought at any price are left with warehouses they cannot empty, and the banks that lent against their stock are counting the cost."
 spec_story.1.f: ""I have been in the [ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName] trade for thirty years, and I never saw men so eager to buy, nor so desperate to sell, as I have seen this twelvemonth.""
 spec_story.1.f_generic: ""I have been in this trade for thirty years, and I never saw men so eager to buy, nor so desperate to sell, as I have seen this twelvemonth.""
 spec_story.1.a: "Extend relief to the ruined producers."
 spec_story.1.b: "Let the weakest houses fail."
 spec_story.1.c: "Inquire into the promoters."
 spec_story.2.t: "A Swindle Exposed"
 spec_story.2.d: "The directors of the [ROOT.GetCountry.GetCapital.GetCityHubName] [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] Company have fled the country, and its books show that the handsome dividends of the past two years were paid out of new subscriptions. Thousands of clerks, widows and shopkeepers held its shares. Every newspaper in [ROOT.GetCountry.GetCapital.GetCityHubName] now asks how many other prospectuses were written by the same hand."
 spec_story.2.d_generic: "The directors of a celebrated [ROOT.GetCountry.GetCapital.GetCityHubName] share company have fled the country, and its books show that the handsome dividends of the past two years were paid out of new subscriptions. Thousands of clerks, widows and shopkeepers held its shares. Every newspaper in [ROOT.GetCountry.GetCapital.GetCityHubName] now asks how many other prospectuses were written by the same hand."
 spec_story.2.f: "#bold Wanted on a Charge of Fraud#!\nThe managing director of the [ROOT.GetCountry.GetCapital.GetCityHubName] [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] Company, aged about fifty, well dressed and plausible in manner. Last seen at the docks."
 spec_story.2.f_generic: "#bold Wanted on a Charge of Fraud#!\nThe managing director of a [ROOT.GetCountry.GetCapital.GetCityHubName] share company, aged about fifty, well dressed and plausible in manner. Last seen at the docks."
 spec_story.2.a: "Prosecute the directors."
 spec_story.2.b: "Keep the matter quiet."
 spec_story.2.c: "Compensate the small investors."
 spec_story.3.t: "A Run on the Banks"
 spec_story.3.d: "Depositors besieged one of the oldest banks in [ROOT.GetCountry.GetCapital.GetCityHubName] this morning, and by noon its doors were shut. Its notes are refused all over the city, and the firms that kept their accounts there cannot pay their hands this week. The queues outside every other bank grow longer by the hour."
 spec_story.3.f: ""My father kept his savings in that bank, and his father before him. They told us it was as safe as the Treasury.""
 spec_story.3.a: "Guarantee its deposits."
 spec_story.3.b: "It must stand or fall alone."
 spec_story.3.c: "We must lend to the banks."
 spec_story.4.t: "Panic in [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]"
 spec_story.4.t_generic: "Panic Abroad"
 spec_story.4.d: "News has reached [ROOT.GetCountry.GetCapital.GetCityHubName] of a [concept_spec_financial_panic] in [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]. Its banks are calling in their loans abroad, and our firms that sold to [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] or borrowed there are suddenly short of money. Every merchant on the exchange wants to know whether the trouble will spread."
 spec_story.4.d_generic: "News has reached [ROOT.GetCountry.GetCapital.GetCityHubName] of a financial panic abroad. Foreign banks are calling in their loans, and our firms that sold or borrowed overseas are suddenly short of money. Every merchant on the exchange wants to know whether the trouble will spread."
 spec_story.4.f: ""When [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] sneezes, our exchange takes to its bed.""
 spec_story.4.f_generic: ""When our neighbors sneeze, our exchange takes to its bed.""
 spec_story.4.a: "Lend to our merchant houses."
 spec_story.4.b: "Their troubles are not ours."
 spec_story.4.c: "Blame the reckless foreign bankers."
 spec_story.5.t: "Confidence Returns"
 spec_story.5.d: "The worst of the panic is over. The firms that survived are taking on hands again, the banks have begun to lend to sound customers, and a few bold investors are buying shares at a fraction of last year's prices. No one expects a quick return to the old excesses, but [ROOT.GetCountry.GetCapital.GetCityHubName] is open for business once more."
 spec_story.5.f: ""The men who sold everything in the spring are buying it back in the autumn, and at a better price than they sold it.""
 spec_story.5.a: "Encourage new ventures."
 spec_story.5.b: "Lending must be sound this time."
 spec_story.6.t: "The Manufacturers' Deputation"
 spec_story.6.d: "A deputation of manufacturers and merchants has called on the government. Their new works stand half finished for want of credit, they say, while their rivals abroad borrow freely and take their markets. They ask that the banks be allowed to lend again."
 spec_story.6.f: ""Your caution, sir, has saved us from a crash by making certain there is nothing left to crash.""
 spec_story.6.a: "Ease credit."
 spec_story.6.b: "Credit stays tight."
 spec_story.6.c: "Offer them a subsidy instead."
 spec_story.7.t: "A Craze for Shares"
 spec_story.7.d: "Clerks, shopkeepers and schoolmasters crowd the coffee houses of [ROOT.GetCountry.GetCapital.GetCityHubName] to trade shares in companies they have never seen. Shares in [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] ventures change hands several times a day, most of them bought with borrowed money. It is said that servants are pawning their Sunday clothes for a part in the next flotation."
 spec_story.7.d_generic: "Clerks, shopkeepers and schoolmasters crowd the coffee houses of [ROOT.GetCountry.GetCapital.GetCityHubName] to trade shares in companies they have never seen. Shares in the newest ventures change hands several times a day, most of them bought with borrowed money. It is said that servants are pawning their Sunday clothes for a part in the next flotation."
 spec_story.7.f: ""My barber gave me a tip on [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] shares this morning. I took it, and gave him one in return: sell.""
 spec_story.7.f_generic: ""My barber gave me a tip on shares this morning. I took it, and gave him one in return: sell.""
 spec_story.7.a: "Let the people share in the wealth."
 spec_story.7.b: "Forbid dealing on borrowed money."
 spec_story.7.c: "Levy a stamp duty on share transfers."
 spec_story.8.t: "Warnings of a Bubble"
 spec_story.8.d: "A respected economist has written to the leading newspaper of [ROOT.GetCountry.GetCapital.GetCityHubName] that the rise in [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] and [ROOT.GetCountry.MakeScope.Var('spec_story_good2').GetGoods.GetName] cannot last, and that the banks have lent against prices no sober man would pay. The brokers call it the croaking of an old woman. Yet the letter is being read aloud in every club and counting house in the city."
 spec_story.8.d_generic: "A respected economist has written to the leading newspaper of [ROOT.GetCountry.GetCapital.GetCityHubName] that the rise in the most favored goods of the day cannot last, and that the banks have lent against prices no sober man would pay. The brokers call it the croaking of an old woman. Yet the letter is being read aloud in every club and counting house in the city."
 spec_story.8.f: ""A price is only what the last buyer was willing to pay. I ask my readers to consider how many buyers remain.""
 spec_story.8.a: "The warning is timely."
 spec_story.8.b: "Alarmist nonsense."
