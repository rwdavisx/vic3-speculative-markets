 SPEC_EXCH_W_2: "International"
 SPEC_EXCH_W_3: "World Centre"
 SPEC_EXCH_NEXT_0: "#instruction To reach National#!, we need a score of #v 15%#! of the top three's, #v 35%#! of our region's leader's, or a place among the [Concept('concept_spec_financial_centre','$concept_spec_financial_centres|q$')]"
 SPEC_EXCH_NEXT_1: "#instruction To reach International#!, we need a place among the #v 5#! [Concept('concept_spec_financial_centre','$concept_spec_financial_centres|q$')] or first place in our region, plus [GetTechnology('stock_exchange').GetName]"
