 spec_rival.1.desc: "A competitor has moved against our [concept_spec_exchange]."
 SPEC_RV_RAID_TT: "#header Bear Raid#!\n$TOOLTIP_DELIMITER$\n#italic Our brokers dump [Country.GetNameNoFormatting]'s shares all at once to crash their market.#!\n$TOOLTIP_DELIMITER$\n#b If it works#!\n[Country.GetNameNoFormatting]'s [concept_spec_market_confidence]: #P -[Multiply_CFixedPoint('(CFixedPoint)3', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|0]#! over #v 6#! months\nContest: #P 10%#! our way\n\n#b If it fails#! (#N [Min_CFixedPoint('(CFixedPoint)80', Add_CFixedPoint('(CFixedPoint)20', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint('(CFixedPoint)0', Divide_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, GetPlayer.MakeScope.Var('spec_centre_score').GetValue), Max_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|0]%#! chance)\nOur [concept_spec_market_confidence]: #N -3#! over #v 6#! months\nContest: #N 10%#! their way\n$TOOLTIP_DELIMITER$\nCost: #N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#! from our [concept_treasury]\nCooldown: #v 1 year#! against [Country.GetNameNoFormatting][AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_raid').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_RAID')]"
 SPEC_RV_WHY_RV_RAID: "\n\n[GetScriptedGui('spec_sgui_rv_raid').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_LURE_TT: "#header Lure Capital#!\n$TOOLTIP_DELIMITER$\n#italic Our bankers court [Country.GetNameNoFormatting]'s investors with better terms.#!\n$TOOLTIP_DELIMITER$\n#P [Multiply_CFixedPoint('(CFixedPoint)0.05', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|%0]#! of [Country.GetNameNoFormatting]'s [concept_investment_pool] income goes to us for #v 12#! months\nContest: #P 10%#! our way\n$TOOLTIP_DELIMITER$\nCost: #N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_lure_debt_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#! added to our [concept_spec_outstanding_credit]\nCooldown: #v 1 year#! against [Country.GetNameNoFormatting][AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_lure').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_LURE')]"
 SPEC_RV_WHY_RV_LURE: "\n\n[GetScriptedGui('spec_sgui_rv_lure').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_PRESS_TT: "#header Press Campaign#!\n$TOOLTIP_DELIMITER$\n#italic Friendly newspapers fill their pages with doubts about [Country.GetNameNoFormatting]'s [concept_spec_exchange].#!\n$TOOLTIP_DELIMITER$\n#b If it works#!\n[Country.GetNameNoFormatting]'s [concept_spec_exchange] trust: #P -[Multiply_CFixedPoint('(CFixedPoint)0.0167', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|%0]#!\nContest: #P 10%#! our way\n\n#b If it is exposed#! (#N [Country.MakeScope.ScriptValue('spec_rv_press_expose')|0]%#! chance, higher where [Country.GetNameNoFormatting]'s press is free)\n[concept_relations] with [Country.GetNameNoFormatting]: #N -20#!\nOur [concept_spec_exchange] trust: #N -1.7%#!\nContest: #N 10%#! their way\n$TOOLTIP_DELIMITER$\nCost: [concept_influence] #N -75#! @inf! for #v 12#! months\nCooldown: #v 1 year#! against [Country.GetNameNoFormatting][AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_press').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_PRESS')]"
 SPEC_RV_WHY_RV_PRESS: "\n\n[GetScriptedGui('spec_sgui_rv_press').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_HOLD_TT: "#header Hold the Line#!\n$TOOLTIP_DELIMITER$\n#italic We buy back what [Country.GetNameNoFormatting] sold and steady our side of the contest.#!\n$TOOLTIP_DELIMITER$\nUndoes one of [Country.GetNameNoFormatting]'s pushes, moving the contest #P 10%#! back our way\nTheir pushes against us now: #v [Country.MakeScope.Var('spec_rv_ui_them').GetValue|0]#!\n$TOOLTIP_DELIMITER$\nCost: #N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#! from our [concept_treasury]\nCooldown: #v 1 year#! against [Country.GetNameNoFormatting][AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_hold').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_HOLD')]"
 SPEC_RV_WHY_RV_HOLD: "\n\n[GetScriptedGui('spec_sgui_rv_hold').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
 SPEC_RV_SHORE_TT: "#header Shore Up#!\n$TOOLTIP_DELIMITER$\n#italic Our banks close ranks against [Country.GetNameNoFormatting].#!\n$TOOLTIP_DELIMITER$\n[Country.GetNameNoFormatting]'s actions against us have #P half#! their effect for #v 12#! months\n$TOOLTIP_DELIMITER$\nCost: #N @money![Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_rv_cost_base'), Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1')))))|D]#! from our [concept_treasury]\nCooldown: #v 2 years#! against [Country.GetNameNoFormatting][AddLocalizationIf(Not(GetScriptedGui('spec_sgui_rv_shore').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)), 'SPEC_RV_WHY_RV_SHORE')]"
 SPEC_RV_WHY_RV_SHORE: "\n\n[GetScriptedGui('spec_sgui_rv_shore').BuildTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target', Country.MakeScope).End)]"
