 SPEC_RV_SCORE_BODY: "#b What pulls the bar#!\n[concept_spec_exchange] scores, #v [GetPlayer.MakeScope.Var('spec_centre_score').GetValue|0]#! to #v [Country.MakeScope.Var('spec_centre_score').GetValue|0]#!: [Divide_CFixedPoint(Subtract_CFixedPoint(Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1')), Multiply_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Country.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'))), Max_CFixedPoint(Max_CFixedPoint(Multiply_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1')), Multiply_CFixedPoint(Country.MakeScope.Var('spec_centre_score').GetValue, Country.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'))), '(CFixedPoint)1'))|+=%0][AddLocalizationIf(LessThan_CFixedPoint(GetPlayer.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)0.99'), 'SPEC_RV_THIN_US')][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.Var('spec_rv_focus').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)0.99'), 'SPEC_RV_THIN_THEM')]\nOur pushes, #v [Country.MakeScope.Var('spec_rv_ui_us').GetValue|0]#!: [Multiply_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_us').GetValue, '(CFixedPoint)0.1')|+=%0]\nTheir pushes, #v [Country.MakeScope.Var('spec_rv_ui_them').GetValue|0]#!: [Multiply_CFixedPoint(Country.MakeScope.Var('spec_rv_ui_them').GetValue, '(CFixedPoint)-0.1')|+=%0]\nOur [concept_spec_blue_chip]s, #v [GetPlayer.MakeScope.Var('spec_bc_n').GetValueWithDefault('(CFixedPoint)0')|0]#!: [Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)0.03')|+=%0]\nTheir [concept_spec_blue_chip]s, #v [Country.MakeScope.Var('spec_bc_n').GetValueWithDefault('(CFixedPoint)0')|0]#!: [Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_bc_counted'), '(CFixedPoint)-0.03')|+=%0]\n\n#weak Each action that works pushes it #v 10%#!, up to #v 5#! a side#!"
