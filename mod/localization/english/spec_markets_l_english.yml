 spec_panic_movements: "Distrust of the Markets"
 spec_panic_movements_desc: "After the panic, many have come to believe that the state must rein in the markets, and [Concept('concept_political_movement','$concept_political_movements|q$')] opposed to [GetLawType('law_laissez_faire').GetName] have gained support."
 spec_mania_movements: "Faith in the Markets"
 spec_mania_movements_desc: "A long boom has convinced many that the markets are best left alone, and [Concept('concept_political_movement','$concept_political_movements|q$')] that favor [GetLawType('law_laissez_faire').GetName] have gained support."
 SPEC_DRIVER_DEBT: "Government Debt"
 SPEC_DRIVER_DEBT_TT: "#header Government Debt: [GetPlayer.MakeScope.Var('spec_c_debt').GetValue|+=2]#!\n$TOOLTIP_DELIMITER$\n#italic Investors get nervous when we borrow too much.#!\n\nWe have used #v [GetPlayer.MakeScope.ScriptValue('spec_debt_share')|%0]#! of our [concept_credit] ([concept_principal])\n#P Safe#! up to #v 50%#!\nEach #v 10%#! above that: #N -0.2#! [concept_spec_market_confidence] a month (never more than #N -1#!)\n$TOOLTIP_DELIMITER$\n#instruction Pay debt back below 50% and this goes away.#!"
