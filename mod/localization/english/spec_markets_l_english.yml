 spec_lever_encourage: "Investment Subsidies"
 spec_lever_market_tt: "Our $ECONOMIC_SYSTEM_GC_LINK$ lets investors chase prices"
 spec_lever_not_restrain_tt: "Speculation in this good is not restrained"
 spec_lever_not_encourage_tt: "Investment in this good is not encouraged"
 spec_levers: "Market Interventions"
 spec_lever_authority_tt: "Enough [concept_authority] is available"
 spec_lever_fits_restrain_tt: "@spec_investor_interest! [concept_spec_investor_interest] is #v Eager#! or higher, or its boom could cost #v 2#! or more [concept_spec_market_confidence] when it ends"
 spec_lever_fits_encourage_tt: "@spec_investor_interest! [concept_spec_investor_interest] is below #v Keen#!, the [concept_good] is not still getting over a boom, and no boom here could end in a [concept_spec_bust] or [concept_spec_collapse]"
 SPEC_LEVER_RESTRAIN_TT: "#header Restrain Speculation in [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n#italic Cool a hot [concept_good] down before its boom grows too big.#!\n\n[concept_spec_investor_interest] cools to #v Calm#! over a few months\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_DOWN', 'SPEC_LEVER_NONE')][concept_budget_additional_income]: #P @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_levy_', Goods.GetKey))|D]#! a week (#v 10%#! of what they make, at base price)\nWhen its boom ends, it winds down slowly over about a year as a [concept_spec_correction], not all at once\n\nTies up #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#! [concept_authority] while in effect, not paid again each month. We get it back when we lift it#indent_newline:3 \n#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! for this [concept_good] normally, the same as half a consumption tax on it\n#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! for how much we trade it (#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! of our market)#!\n\n#lore After the South Sea Bubble, the Bubble Act of 1720 forbade the floating of joint-stock companies without a royal charter.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_restrain_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_restrain').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_LEVER_ENCOURAGE_TT: "#header Encourage Investment in [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n#italic Warm investors up to a [concept_good] they are ignoring.#!\n\n[concept_spec_investor_interest] rises to #v Keen#! over a few months\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_UP', 'SPEC_LEVER_NONE')][concept_budget_additional_expenses]: #N @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_subsidy_', Goods.GetKey))|D]#! a week (#v 20%#! of what they make, at base price)\nEnds by itself once the [concept_good] is #v Eager#!\n\nTies up #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#! [concept_authority] while in effect, not paid again each month. We get it back when we lift it#indent_newline:3 \n#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! for this [concept_good] normally, the same as half a consumption tax on it\n#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! for how much we trade it (#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! of our market)#!\n\n#lore In the mid-1800s, British India and France guaranteed railway investors a fixed return on their capital.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_encourage_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_encourage').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
