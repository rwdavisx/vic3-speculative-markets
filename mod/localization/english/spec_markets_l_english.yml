 SPEC_BANK_GOOD_TT: "#header [Scope.GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\n#italic How much bank money is riding on this boom.#!\n\n#v [Country.MakeScope.Var(Concatenate('spec_exp_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%1]#! of all [concept_spec_outstanding_credit] is here\nIf its boom ended, the loans make [concept_spec_market_confidence] fall #N x[Country.MakeScope.Var(Concatenate('spec_ui_expx_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)1')|2]#! as far"
