 spec_rv_press_fx: "We pay #N 75#! influence for 12 months. Their [concept_spec_exchange] loses #N [Multiply_CFixedPoint('(CFixedPoint)0.0167', Divide_CFixedPoint('(CFixedPoint)1', Min_CFixedPoint('(CFixedPoint)1.33', Max_CFixedPoint('(CFixedPoint)0.75', Divide_CFixedPoint(SCOPE.sCountry('target').MakeScope.Var('spec_centre_score').GetValue, Max_CFixedPoint(GetPlayer.MakeScope.Var('spec_centre_score').GetValue, '(CFixedPoint)1'))))))|%0]#! trust. It may be exposed, more likely where their press is free. If it is, relations fall by #N 20#! and our trust by #N 1.7%#!."
