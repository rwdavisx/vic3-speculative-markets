 SPEC_IL_SORT_LEVER_BASE_TT: "#header Show Interventions#!\n$TOOLTIP_DELIMITER$\nShows only goods with an [concept_spec_intervention]\n\n#instruction Click to show only these goods, click again to show all#!"
 SPEC_IL_DANGER_TT: "#header Collapse Zone#!\n$TOOLTIP_DELIMITER$\n#italic The boom is so big that falling back now would end it badly.#!\n\nIf [concept_spec_investor_interest] falls this far, the boom ends in a [concept_spec_collapse]\nThat would cost about #N [Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! [concept_spec_market_confidence]"
 SPEC_IL_CRASHED_TT: "#header [Goods.GetName]: Boom Ended#!\n$TOOLTIP_DELIMITER$\n#italic The boom in this good just ended.#!\n\nIt ended this month in a [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]\n#N Investors stay away#! for [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))]\n[Concept('concept_company','$concept_companies|q$')] making it #N lose#! [concept_throughput]"
 SPEC_IL_GLUT_TT: "#header [Goods.GetName] Recovering#!\n$TOOLTIP_DELIMITER$\n#italic Investors are still wary after the last boom ended.#!\n\nThat boom ended in a [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]\n[concept_spec_investor_interest] #N stuck#! at #v Doubtful#! or lower for [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))]\n[Concept('concept_company','$concept_companies|q$')] making it #N lose#! [concept_throughput]"
 SPEC_TILE_BANKS: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_expx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_BANKS_ON', 'SPEC_GOODS_NONE')]$SPEC_TILE_CYCLE$"
 SPEC_TILE_BANKS_ON: "\n\n#title Bank Loans#!\n#v [Country.MakeScope.Var(Concatenate('spec_exp_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! of all [concept_spec_outstanding_credit] is in this boom, worth #v [Country.MakeScope.Var(Concatenate('spec_ui_expm_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! months of pool income\nIf it ends, the hit to [concept_spec_market_confidence] is #N x[Country.MakeScope.Var(Concatenate('spec_ui_expx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|2]#! as big as for a boom no bank had lent into"
