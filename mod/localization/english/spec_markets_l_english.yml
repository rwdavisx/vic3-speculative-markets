 concept_spec_market_confidence: "Market Confidence"
 concept_spec_market_confidence_desc: "@spec_market_confidence! #italic How investors feel about the [concept_market] of your [concept_country], from #v 0#! (#v Panic#!) to #v 100#! (#v Mania#!).#!\n\nFear #N slows investment#! and makes [concept_loans] cost more\nGreed #P speeds investment up#!\n\n#P Rises#! with booming [Concept('concept_good','$concept_goods|q$')]\n#N Falls#! with [Concept('concept_spec_boom_end','$concept_spec_boom_ends|q$')], [Concept('concept_spec_foreign_panic','$concept_spec_foreign_panics|q$')], [Concept('concept_diplomatic_play','$concept_diplomatic_plays|q$')] and [concept_war]\nBooms and their endings are bigger where $building_financial_district$ make up more of the economy, and smaller where $building_manor_house$ outnumber them\n\nBanks lend into the [concept_investment_pool] above #v 55#!\nA [concept_spec_speculative_mania] comes at #v 80#! or more\nA [concept_spec_financial_panic] begins below #v 25#!\nHigh [concept_spec_leverage] raises that line\nFew $building_financial_district$ lower it a little"
 concept_spec_speculative_mania: "Speculative Mania"
 concept_spec_speculative_mania_desc: "@spec_speculative_mania! #italic Your [concept_market] has gone wild with greed.#!\n\nIt lasts while [concept_spec_market_confidence] is #v 80#! or more\n#P Banks lend most freely#! into the [concept_investment_pool]\n#N Every [concept_spec_boom_end] costs more#! $concept_spec_market_confidence$\n\nA long or very high mania helps [Concept('concept_political_movement','$concept_political_movements|q$')] that want [GetLawType('law_laissez_faire').GetName] for some years after"
 concept_spec_financial_panic: "Financial Panic"
 concept_spec_financial_panics: "Financial Panics"
 concept_spec_financial_panic_desc: "@spec_financial_panic! #italic A crash, when investors flee and the banks pull their money back.#!\n\nStarts when your [concept_spec_market_confidence] falls below #v 25#!. Over #v 3#! months of [concept_spec_leverage], that line rises, up to #v 65#!. With few $building_financial_district$ it drops, down to #v 20#!.\n\nWhile it lasts:\n#N Less#! [concept_throughput] in every building, and fewer taxes collected\n#N Drains#! the [concept_treasury] every week to help the jobless\n#N Slower#! [concept_private_construction] and investment\n#N Smaller#! $concept_throughput$ bonus for [Concept('concept_company','$concept_companies|q$')]\n#N Some investors turn#! [Concept('concept_radical','$concept_radicals|q$')]\n#N Banks pull back#! [concept_spec_outstanding_credit] from the [concept_investment_pool]\n\nIt spreads to each linked [concept_country] as a [concept_spec_foreign_panic], and money flees to calm [Concept('concept_great_power','$concept_great_powers|q$')]\nAfterward, [Concept('concept_political_movement','$concept_political_movements|q$')] against [GetLawType('law_laissez_faire').GetName] gain support for some years"
 concept_spec_foreign_panic: "Foreign Panic"
 concept_spec_foreign_panics: "Foreign Panics"
 concept_spec_foreign_panic_desc: "@spec_foreign_panic! #italic A panic abroad that spills over into your market.#!\n\nWhen a [concept_spec_financial_panic] starts in a [concept_country] tied to yours, your [concept_spec_market_confidence] #N drops#!\nCountries are tied by a shared [concept_market], one being the other's subject, investment rights, lots of trade, or owning part of your economy\n#N Closer ties, bigger drop#!\n\n[GetLawType('law_free_trade').GetName] makes trade ties stronger\nOther trade policies make them weaker\nAn [concept_embargo] cuts the trade tie"
 concept_spec_boom_end: "Boom Ending"
 concept_spec_boom_ends: "Boom Endings"
 concept_spec_boom_end_desc: "@spec_boom_end! #italic What goes up comes down. A boom ends when [concept_spec_investor_interest] in a [concept_good] drops back after a rise.#!\n\nThe higher it went, the harder it falls:\nPeaked at #v Keen#!: a [concept_spec_correction]\nPeaked at #v Eager#!: a [concept_spec_bust]\nPeaked at #v Feverish#!: a [concept_spec_collapse]\n\n#N Lowers#! your [concept_spec_market_confidence], more for bigger booms and for $concept_goods$ that are a bigger part of the [concept_market]'s trade\nInvestors then stay away while the $concept_good$ recovers\nIf a [concept_company] makes it, that industry #N loses#! [concept_throughput]\n\n#instruction The peak fades a little each month. A boom that cools slowly ends more gently, or with no $concept_spec_boom_end$ at all.#!"
 concept_spec_correction: "Correction"
 concept_spec_correction_desc: "@spec_correction! #italic A $concept_spec_correction$ is the mildest [concept_spec_boom_end].#!\n\nHappens when [concept_spec_investor_interest] in a [concept_good] that peaked at #v Keen#! falls back to #v Doubtful#!\n\n#N Lowers#! [concept_spec_market_confidence] a little\nInvestors stay away from the $concept_good$ for #v 3#! months\nIf a [concept_company] makes it, that industry loses #N 2.5%#! [concept_throughput] for #v 90#! days, #N 25%#! more for each of [GetTechnology('corporate_charters').GetName] and [GetTechnology('corporate_management').GetName] researched"
 concept_spec_bust: "Bust"
 concept_spec_bust_desc: "@spec_bust! #italic A $concept_spec_bust$ is a harsher [concept_spec_boom_end] than a [concept_spec_correction].#!\n\nHappens when [concept_spec_investor_interest] in a [concept_good] that peaked at #v Eager#! falls back to #v Doubtful#!\n\n#N Lowers#! [concept_spec_market_confidence] more, about #v 2#! times as much as a $concept_spec_correction$ after the same boom\nInvestors stay away from the $concept_good$ for #v 6#! months\nIf a [concept_company] makes it, that industry loses #N 5%#! [concept_throughput] for #v 180#! days, #N 25%#! more for each of [GetTechnology('corporate_charters').GetName] and [GetTechnology('corporate_management').GetName] researched"
 concept_spec_collapse: "Collapse"
 concept_spec_collapse_desc: "@spec_collapse! #italic A $concept_spec_collapse$ is the worst [concept_spec_boom_end].#!\n\nHappens when [concept_spec_investor_interest] in a [concept_good] that peaked at #v Feverish#! falls all the way to #v Fleeing#!\n\n#N Lowers#! [concept_spec_market_confidence] sharply, about #v 5#! times as much as a [concept_spec_correction] after the same boom\nInvestors stay away from the $concept_good$ for #v 12#! months\nIf a [concept_company] makes it, that industry loses #N 10%#! [concept_throughput] for a year, #N 25%#! more for each of [GetTechnology('corporate_charters').GetName] and [GetTechnology('corporate_management').GetName] researched\n\nWorst of all, a $concept_spec_collapse$ in a big part of the [concept_market]'s trade can set off a [concept_spec_financial_panic]"
 concept_spec_investor_interest: "Investor Interest"
 concept_spec_investor_interest_desc: "@spec_investor_interest! #italic How keen investors are on the [Concept('concept_building','$concept_buildings|q$')] that make a [concept_good], from #v Fleeing#! to #v Feverish#!.#!\n\n#P Rises#! while the [concept_market_price] is above its long-run average\n#N Falls#! while it is below\n\nThose buildings' [concept_throughput] follows it, from #N -10%#! at #v Fleeing#! up to #P +8%#! at #v Feverish#!\nSo does the [concept_prosperity] of [Concept('concept_company','$concept_companies|q$')] making the $concept_good$\nA booming $concept_good$ raises [concept_spec_market_confidence]\nWhen interest drops back, the boom ends in a [concept_spec_boom_end]"
 concept_spec_credit_policy: "Credit Policy"
 concept_spec_credit_policy_tight: "Tight Credit"
 concept_spec_credit_policy_normal: "Normal Credit"
 concept_spec_credit_policy_loose: "Loose Credit"
 concept_spec_credit_policy_desc: "@spec_credit_policy! #italic How freely banks lend into the [concept_investment_pool].#!\n\nUnlocked by [GetTechnology('central_banking').GetName]\nCan be $concept_spec_credit_policy_tight$, $concept_spec_credit_policy_normal$ or $concept_spec_credit_policy_loose$\n\n#v Tighter#! credit slows investment, and pulls [concept_spec_market_confidence] down when it runs high\n#v Looser#! credit adds to [concept_spec_outstanding_credit]\n\nOnce changed, it is locked for #v 6#! months"
 concept_spec_leverage: "Credit Leverage"
 concept_spec_leverage_desc: "@spec_leverage! #italic How much your banks have lent. It is your [concept_spec_outstanding_credit], counted in months of [concept_investment_pool] income.#!\n\n#P +2%#! [concept_throughput] for each whole month of it, up to #P +24%#!\nThe bonus fades during a [concept_spec_financial_panic] and while [concept_spec_bad_debts] remain\n\nOver #v 3#! months it gets risky:\n#N A $concept_spec_financial_panic$ starts sooner#!, at a higher [concept_spec_market_confidence]\n#N It leaves $concept_spec_bad_debts$ behind#!"
 concept_spec_bad_debts: "Bad Debts"
 concept_spec_bad_debts_desc: "@spec_bad_debts! #italic The losses a [concept_spec_financial_panic] leaves on the books of your banks.#!\n\nThey grow with [concept_spec_leverage] over #v 3#! months\n\nEach point: #N -0.4%#! [concept_throughput] and #N -0.75%#! investment\nThey build up for some months, then slowly shrink\nAt their worst they take about #v 6#! years to clear\n#N Banks will not lend#! while they remain\n\n#v Lend to the Banks#! does not clear them\n#v Buy Up Bad Loans#! halves them, once while they last"
 concept_spec_lending_standards: "Lending Standards"
 concept_spec_lending_standards_desc: "@spec_lending_standards! #italic How carefully the banks of your [concept_country] lend. It can be #v Strict#!, #v Cautious#!, #v Sound#!, #v Lax#! or #v Reckless#!.#!\n\nLaxer banks lend more into the [concept_investment_pool] and put more of it into booms\n#N So booms end harder#! and a Bank Rescue costs more\n\n#N Get laxer#! a little each month without a [concept_spec_financial_panic], going from #v Strict#! to #v Reckless#! in about #v 20#! quiet years\n#N Get laxer still#! after each Bank Rescue or #v Buy Up Bad Loans#!\n#P Get stricter#! when a boom ends, most of all when a $concept_spec_financial_panic$ runs its course without a Bank Rescue"
 concept_spec_blue_chip: "Blue Chip"
 concept_spec_blue_chips: "Blue Chips"
 concept_spec_blue_chip_desc: "@spec_blue_chip! #italic A star [concept_company] that has held #v 70#! or more [concept_prosperity] for #v 12#! months in a row.#!\n\nEach one adds #v 2#! to our [concept_spec_company_strength]\n#b Each one#! #grey (the first 5 in full, the next 5 half as much)#!\n[concept_spec_market_confidence] lost to crashes and panics: #P -4%#!\n[concept_spec_exchange] trust: #P +0.4%#! of the full bar a year\n[concept_spec_exchange] contests: #P +3%#! our way\nCapitalists' [concept_investment_pool] contribution: #P +0.6%#!\nLoan interest: #P -1%#!\n\n#b If we lose one#!\nIt happens after #v 3#! months in a row below #v 70#! [concept_prosperity]\n[concept_spec_exchange] trust: #N -1.7%#! of the full bar\n[concept_spec_market_confidence]: #N -3#!\nA Bear Raid that hits us makes one #N Fragile#! for a year. It then stops being one after a single month below #v 70#! [concept_prosperity], not #v 3#!\n\n#b Company of the Year#!\nIf ours is the world's most prosperous, we gain [concept_spec_exchange] trust #P +2.5%#! of the full bar, and [concept_prestige] #P +5%#! for a year\n\n#N Lost#! after #v 3#! months in a row below #v 70#!, and then the #v 12#! months start over\nOne month below resets a climb toward it\nA [concept_country] that leaves the market economy keeps none"
 concept_spec_company_strength: "Company Strength"
 concept_spec_company_strength_desc: "@spec_company_strength! #italic How strong a [concept_country]'s [Concept('concept_company','$concept_companies|q$')] are, all together.#!\n\nEach company adds its [concept_prosperity] divided by #v 20#!, so one at #v 100#! adds #v 5#!\nEach [concept_spec_blue_chip] adds #v 2#! more\nThe strongest wins the Home of Great Companies honour"
 concept_spec_outstanding_credit: "Outstanding Credit"
 concept_spec_outstanding_credit_desc: "@spec_outstanding_credit! #italic Money the banks have lent into the [concept_investment_pool] and not yet got back.#!\n\nBanks lend while [concept_spec_market_confidence] is above #v 55#!\nThey stop at a Lending Limit of #v 3#! months of pool income\n[GetTechnology('central_banking').GetName] adds #v 5#! months\n[GetTechnology('investment_banks').GetName] and [GetTechnology('international_exchange_standards').GetName] add #v 2#! each\n\nA little is paid back from the pool each month\nWhen a [concept_spec_financial_panic] starts, the banks #N pull part of it back#!\n\n#lore Banks lent against railway shares in the 1840s, cotton in 1837 and building land in Vienna in 1873, and were caught when those booms broke.#!"
