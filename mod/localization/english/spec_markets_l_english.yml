 SPEC_H_RIVAL: "Competition"
 SPEC_H_RIVAL_TT: "#header Competition#!\n$TOOLTIP_DELIMITER$\n$SPEC_RIVAL_RULE$"
 SPEC_H_RIVAL_RIGHT: "#N -[GetPlayer.MakeScope.ScriptValue('spec_rv_upkeep_total')|0]#! @inf!"
 SPEC_RIVAL_RULE: "#italic Our [concept_spec_exchange] can pick other Exchanges to fight for trust.#!\n\nEach competitor costs #N 25#! to #N 150#! influence to keep up. Higher Standing costs more\nWe can pick #v 1#! competitor at the lowest Standing, one more for each Standing above (up to #v 4#!)\nWe cannot drop a competitor in its first year\nThis is separate from diplomatic rivalries\n\n#b The contest#!\nEach contest runs #v 5#! years from when it starts, then settles like a tug of war and a new one begins\nThe bar starts from the two [Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')] scores\n#N Every contest past the first spreads us thin#! and weakens our score in all of them (#v 2#! contests: #N 80%#!, #v 4#!: #N 57.1%#!)\nEach [concept_spec_blue_chip] pulls it #v 3%#! to its side (full pull up to #v 5#!, half pull up to #v 10#!)\nEach action that works pushes it #v 10%#! to its side, up to #v 5#! pushes each\nNear the middle it is a draw\n\n#b Winning#!\nAfter a #P win#!, the loser gives up #P 5%#! trust\nAfter a #P big win#! (the bar ends more than #v 75%#! to one side), the loser gives up #P 10%#! trust, and #P 5%#! of its [concept_investment_pool] income for 12 months\nBeating a higher-Standing Exchange pays more. Beating a lower one pays less\nIf [concept_relations] are poor or worse, the loser loses #N x1.5#! as much\n\n#b Actions#!\nWe can use them on Exchanges we compete with, and on ones that compete with us\nEach action works once a year on each competitor\nOn a bigger Exchange they cost more and do less (#v x0.75#! to #v x1.33#!)\nIn a [concept_spec_financial_panic], the money running away goes to a competitor first"
 SPEC_RV_SUB_OUT: "Our Competitors"
