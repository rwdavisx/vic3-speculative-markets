 SPEC_IL_SORT_GOODS_TT: "#header Sort by Goods#!\n$TOOLTIP_DELIMITER$\nThe [Concept('concept_good','$concept_goods|q$')] traded in our [concept_market] in a fixed order, by category and then by name."
 SPEC_IL_SORT_INTEREST_TT: "#header Sort by [concept_spec_investor_interest]#!\n$TOOLTIP_DELIMITER$\nHottest goods first, then the most traded\n\nThe marker shows the level, from @spec_interest_fleeing! #v Fleeing#! to @spec_interest_feverish! #v Feverish#!\nThe arrow shows this month's change"
