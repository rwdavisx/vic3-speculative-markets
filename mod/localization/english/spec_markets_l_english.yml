 SPEC_XS_TT: "#header @spec_speculative_excess! $concept_spec_speculative_excess$: [Country.MakeScope.Var('spec_heat').GetValueWithDefault('(CFixedPoint)0')|0] / 200#!\n$TOOLTIP_DELIMITER$\n#italic This is the bubble. The longer a boom runs hot, the bigger it gets.#!\n\n#P Grows#! while [concept_spec_market_confidence] is #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#! or more\n#v Shrinks#! slowly while it is between #v 60#! and #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#!\n#N Pops#! if it drops below #v 60#!\n\nIf it popped now: #N -[Country.MakeScope.ScriptValue('spec_burst_now')|0]#! [concept_spec_market_confidence] at once (never more than #N [Country.MakeScope.ScriptValue('spec_burst_max')|0]#!)\n$TOOLTIP_DELIMITER$\n#instruction To let it down gently, hold confidence between 60 and [Country.MakeScope.ScriptValue('spec_heat_from')|0]. The bar turns red when a pop would hurt.#!"
