 spec_depression.1.t: "The $SPEC_LD_NAME$"
 spec_depression.1.d: "The panics on the world's exchanges have joined into one. Credit has stopped moving between the great houses, prices are falling everywhere at once, and orders that kept our mills and mines busy are being cancelled by cable. Every market leans on every other, and all of them are falling together.\n\nThe crash will last some months, and a long depression will follow. How soon we recover depends on what we do now, and on what the [Concept('concept_great_power','$concept_great_powers|q$')] do."
 spec_depression.1.f: ""We have had panics before. This time there is nowhere for the money to run.""
 spec_depression.1.a: "We must retrench."
 spec_depression.1.b: "Steady the exchanges."
 spec_depression.2.t: "A Wall of Tariffs"
 spec_depression.2.d: "The owners of our largest works have petitioned the government, and the great landowners have joined them. Foreign goods and cheap foreign grain, they say, are sold in our markets at any price their makers can get, and our own factories and estates cannot sell at a price that pays their wages. They ask for higher duties on everything that competes with home industry and home harvests.\n\nProtection would shelter our own recovery, but our trading partners would suffer for it, and the world's recovery with them."
 spec_depression.2.f: ""Every nation builds a wall around its own market, and each wonders why its exports do not recover.""
 spec_depression.2.a: "Protect our industry."
 spec_depression.2.b: "Keep our markets open."
 spec_depression.3.t: "Relief Works"
 spec_depression.3.d: "Thousands of men stand idle in [ROOT.GetCountry.GetCapital.GetCityHubName], and the relief funds are exhausted. The city engineers have a list of works that could employ them, from drains and roads to embankments and a new market hall, if the treasury will pay for them."
 spec_depression.3.f: ""A man who digs a drain for his daily wage is no pauper, and he knows it.""
 spec_depression.3.a: "Fund the works."
 spec_depression.3.b: "Charity is a private matter."
 spec_depression.4.t: "The Banks Under Siege"
 spec_depression.4.d: "Word has spread that the banks of [ROOT.GetCountry.GetCapital.GetCityHubName] lent heavily to firms that are now failing. Since morning depositors have queued to withdraw their savings, and by evening the banks will have no coin left to pay them. Their directors ask the government to act."
 spec_depression.4.f: ""A bank is perfectly sound until everyone believes it is not.""
 spec_depression.4.a: "Declare a bank holiday."
 spec_depression.4.b: "Bail out the banks."
 spec_depression.4.c: "Let them fail."
 spec_depression.5.t: "The Currency Question"
 spec_depression.5.d: "Falling prices have divided the country. Farmers and small borrowers say money has grown too dear, and that every debt weighs heavier each year that prices fall. They want more money issued and credit made easy. Bankers and creditors answer that only sound money will win back the confidence of investors at home and abroad."
 spec_depression.5.f: ""My mortgage is the same as it was five years ago. My wheat fetches half the price.""
 spec_depression.5.a: "Sound money above all."
 spec_depression.5.b: "Make credit easy."
 spec_depression.6.t: "March of the Unemployed"
 spec_depression.6.d: "A column of unemployed men has marched into [ROOT.GetCountry.GetCapital.GetCityHubName] behind banners reading 'Work or Bread'. They have camped before the government offices and ask to present a petition. The police say they can clear the square by nightfall."
 spec_depression.6.f: ""We do not ask for charity. We ask for work.""
 spec_depression.6.a: "Disperse them."
 spec_depression.6.b: "Hear their petition."
 spec_depression.7.t: "Calls for Reform"
 spec_depression.7.d: "The newspapers ask why the depression has lasted so long, and who grew rich on the speculation that came before it. Members of the legislature have called for an inquiry into the banks, the exchanges and the conduct of the government itself."
 spec_depression.7.f: ""The question is no longer whether the system failed, but who will answer for it.""
 spec_depression.7.a: "Commission an inquiry."
 spec_depression.7.b: "The system is sound."
 spec_depression.8.t: "The $SPEC_LD_NAME$ Lifts"
 spec_depression.8.d: "For the first time in years, orders are rising faster than they are cancelled. Prices have found a floor, the banks are lending again, and works that stood idle are taking on hands. The depression is over, though few who lived through it will soon forget it."
 spec_depression.8.f: ""Trade is improving, they say. I shall believe it when my own order book says so.""
 spec_depression.8.a: "Lessons have been learned."
 spec_depression.8.b: "Back to business."
