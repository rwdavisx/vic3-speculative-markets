l_braz_por:
 rule_spec_market_volatility: "Volatilidade Mercantil"
 setting_spec_volatility_historical: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_spec_volatility_historical_desc Histórica#!#!"
 setting_spec_volatility_historical_desc: "As expansões especulativas e os episódios de [Concept('concept_spec_financial_panic', '$concept_spec_financial_panics|q$')] ocorrerão com frequência semelhante à do século XIX"
 setting_spec_volatility_heightened: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_spec_volatility_heightened_desc #high Alta#!#!#!"
 setting_spec_volatility_heightened_desc: "As expansões especulativas serão maiores e terminarão mais abruptamente, e os episódios de [Concept('concept_spec_financial_panic', '$concept_spec_financial_panics|q$')] ocorrerão com mais frequência que no século XIX"
 rule_spec_market_impact: "Impacto do Mercado"
 setting_spec_impact_flavor: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_spec_impact_flavor_desc Ambientação#!#!"
 setting_spec_impact_flavor_desc: "@spec_leverage! [Concept('concept_spec_leverage', '$concept_spec_leverage|q$')] e [Concept('concept_spec_financial_panic', '$concept_spec_financial_panics|q$')] afetarão menos a economia, cerca de dois quintos do normal"
 setting_spec_impact_standard: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_spec_impact_standard_desc Padrão#!#!"
 setting_spec_impact_standard_desc: "@spec_leverage! [Concept('concept_spec_leverage', '$concept_spec_leverage|q$')] e [Concept('concept_spec_financial_panic', '$concept_spec_financial_panics|q$')] afetarão a economia como o mod pretende"
 setting_spec_impact_strong: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_spec_impact_strong_desc #high Forte#!#!#!"
 setting_spec_impact_strong_desc: "@spec_leverage! [Concept('concept_spec_leverage', '$concept_spec_leverage|q$')] e [Concept('concept_spec_financial_panic', '$concept_spec_financial_panics|q$')] afetarão mais a economia, cerca de três quintos a mais"
