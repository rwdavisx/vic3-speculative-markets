 notification_spec_ld_recovered_tooltip: "#header $notification_spec_ld_recovered_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_ld_recovered_desc$"
 spec_depression.1.t: "A $SPEC_LD_NAME$"
 spec_depression.1.d: "Os pânicos nas bolsas do mundo se fundiram em um só. O crédito deixou de circular entre as grandes casas, os preços caem em toda parte ao mesmo tempo, e as encomendas que ocupavam nossas fábricas e minas são canceladas por telégrafo. Cada mercado se apoia nos demais, e todos caem juntos.\n\nA quebra durará alguns meses, seguida por uma longa depressão. A rapidez da nossa recuperação depende do que fizermos agora e das ações das [Concept('concept_great_power','$concept_great_powers|q$')]."
 spec_depression.1.f: "“Já tivemos pânicos antes. Desta vez, o dinheiro não tem para onde fugir.”"
 spec_depression.1.a: "Devemos cortar gastos."
 spec_depression.1.b: "Estabilizem as bolsas."
 spec_depression.2.t: "Um Muro de Tarifas"
 spec_depression.2.d: "Os proprietários de nossas maiores fábricas apresentaram uma petição ao governo, e os grandes latifundiários se juntaram a eles. Dizem que mercadorias estrangeiras e cereais estrangeiros baratos são vendidos em nossos mercados por qualquer preço que seus produtores consigam obter, e que nossas próprias fábricas e propriedades não conseguem vender por um preço que cubra os salários. Pedem tarifas mais altas sobre tudo que concorra com a indústria e as colheitas nacionais.\n\nA proteção resguardaria nossa recuperação, mas nossos parceiros comerciais sofreriam com ela, e a recuperação mundial também."
 spec_depression.2.f: "“Cada nação ergue um muro em torno do próprio mercado, e todas se perguntam por que suas exportações não se recuperam.”"
 spec_depression.2.a: "Protejam nossa indústria."
 spec_depression.2.b: "Mantenham nossos mercados abertos."
 spec_depression.3.t: "Obras Assistenciais"
 spec_depression.3.d: "Milhares de homens estão desocupados em [ROOT.GetCountry.GetCapital.GetCityHubName], e os fundos de assistência se esgotaram. Os engenheiros da cidade têm uma lista de obras que poderiam empregá-los: esgotos, estradas, aterros e um novo mercado municipal, se o tesouro custear tudo."
 spec_depression.3.f: "“Um homem que abre valas em troca de sua diária não é um indigente, e sabe disso.”"
 spec_depression.3.a: "Financiem as obras."
 spec_depression.3.b: "A caridade é um assunto privado."
 spec_depression.4.t: "Os Bancos sob Cerco"
 spec_depression.4.d: "Correu a notícia de que os bancos de [ROOT.GetCountry.GetCapital.GetCityHubName] emprestaram grandes somas a firmas que agora estão falindo. Desde a manhã, depositantes fazem fila para sacar suas economias, e ao anoitecer os bancos já não terão moeda para pagá-los. Seus diretores pedem a intervenção do governo."
 spec_depression.4.f: "“Um banco é perfeitamente sólido até que todos acreditem que não é.”"
 spec_depression.4.a: "Declarem um feriado bancário."
 spec_depression.4.b: "Resgatem os bancos."
 spec_depression.4.c: "Deixem que quebrem."
 spec_depression.5.t: "A Questão Monetária"
 spec_depression.5.d: "A queda dos preços dividiu o país. Agricultores e pequenos devedores dizem que o dinheiro ficou caro demais, e que cada dívida pesa mais a cada ano de queda dos preços. Querem mais emissão de moeda e crédito fácil. Banqueiros e credores respondem que só uma moeda sólida reconquistará a confiança dos investidores de dentro e de fora do país."
 spec_depression.5.f: "“Minha hipoteca é a mesma de cinco anos atrás. Meu trigo rende metade do preço.”"
 spec_depression.5.a: "Moeda sólida acima de tudo."
 spec_depression.5.b: "Facilitem o crédito."
 spec_depression.6.t: "Marcha dos Desempregados"
 spec_depression.6.d: "Uma coluna de homens desempregados marchou até [ROOT.GetCountry.GetCapital.GetCityHubName] sob faixas com os dizeres 'Trabalho ou Pão'. Acamparam diante das repartições do governo e pedem para apresentar uma petição. A polícia afirma que pode esvaziar a praça antes do anoitecer."
 spec_depression.6.f: "“Não pedimos caridade. Pedimos trabalho.”"
 spec_depression.6.a: "Dispersem-nos."
 spec_depression.6.b: "Ouçam sua petição."
 spec_depression.7.t: "Clamor por Reformas"
 spec_depression.7.d: "Os jornais perguntam por que a depressão dura há tanto tempo e quem enriqueceu com a especulação que a precedeu. Membros do legislativo pediram um inquérito sobre os bancos, as bolsas e a conduta do próprio governo."
 spec_depression.7.f: "“A questão já não é se o sistema falhou, mas quem responderá por isso.”"
 spec_depression.7.a: "Instalem uma comissão de inquérito."
 spec_depression.7.b: "O sistema é sólido."
 spec_depression.8.t: "A $SPEC_LD_NAME$ Recua"
 spec_depression.8.d: "Pela primeira vez em anos, as encomendas crescem mais depressa do que são canceladas. Os preços encontraram um piso, os bancos voltaram a emprestar, e fábricas antes paradas estão contratando braços. A depressão acabou, embora poucos dos que a viveram venham a esquecê-la tão cedo."
 spec_depression.8.f: "“Dizem que o comércio está melhorando. Acreditarei quando meu livro de encomendas disser o mesmo.”"
 spec_depression.8.a: "As lições foram aprendidas."
 spec_depression.8.b: "De volta aos negócios."
