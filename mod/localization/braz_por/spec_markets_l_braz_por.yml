 spec_trust_1_desc: "A [concept_spec_exchange] do [concept_country] é #v Questionada#! pelos investidores"
 spec_trust_3: "Bolsa Confiável"
 spec_trust_3_desc: "A [concept_spec_exchange] do [concept_country] é considerada #v Confiável#! pelos investidores"
 spec_exch_national_desc: "Efeitos da Posição #v Nacional#! ou superior da [concept_spec_exchange] do [concept_country] sem um lugar entre as $concept_spec_financial_centres$"
