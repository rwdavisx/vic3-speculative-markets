 spec_lever_fits_restrain_tt: "O [concept_spec_investor_interest] está em #v Ávido#! ou acima, ou o fim de sua expansão custaria #v 2#! ou mais de [concept_spec_market_confidence]"
 spec_lever_fits_encourage_tt: "O [concept_spec_investor_interest] está abaixo de #v Interessado#!, a [concept_good] não está em recuperação após uma expansão, e não há uma expansão que possa terminar em uma [concept_spec_bust] ou um [concept_spec_collapse]"
 SPEC_LEVER_RESTRAIN_TT: "#header Conter Especulação em [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_investor_interest]: recua para #v Calmo#! em alguns meses\n[concept_authority]: #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#! por mês#indent_newline:3 \n#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! do valor base (metade de um imposto sobre consumo dela)\n#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! da parte do comércio (#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! do nosso mercado)#!\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_DOWN', 'SPEC_LEVER_NONE')][concept_budget_additional_income]: #P @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_levy_', Goods.GetKey))|D]#! por semana, uma taxa de 10% da nossa produção semanal a preço base\n\nEnquanto contida, a expansão não pode crescer nem terminar de uma vez. Ela se desfaz como uma [concept_spec_correction] ao longo de cerca de um ano, custando um pouco de [concept_spec_market_confidence] a cada mês.\n\n#lore Como a Lei da Bolha de 1720, que restringiu novas sociedades por ações após a Bolha dos Mares do Sul.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_restrain_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_restrain').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_LEVER_ENCOURAGE_TT: "#header Incentivar Investimento em [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_investor_interest]: sobe para #v Interessado#! em alguns meses\n[concept_authority]: #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#! por mês#indent_newline:3 \n#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! do valor base (metade de um imposto sobre consumo dela)\n#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! da parte do comércio (#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! do nosso mercado)#!\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_UP', 'SPEC_LEVER_NONE')][concept_budget_additional_expenses]: #N @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_subsidy_', Goods.GetKey))|D]#! por semana, um subsídio de 20% da nossa produção semanal a preço base\n\nÉ suspensa sozinha quando o interesse na [concept_good] chega a #v Ávido#!, para que a expansão possa terminar por conta própria.\n\n#lore Como os retornos garantidos que a Índia Britânica e a França ofereceram aos investidores ferroviários em meados dos anos 1800.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_encourage_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_encourage').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
