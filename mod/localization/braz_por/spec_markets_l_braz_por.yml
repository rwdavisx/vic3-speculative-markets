 SPEC_WHY_SPEED: "#header Reação dos Investidores#!\nÀ alta de preços: #v x[Country.MakeScope.ScriptValue('spec_hype_mult')|2]#!\nÀ queda de preços: #v x[Country.MakeScope.ScriptValue('spec_hype_mult_down')|2]#!\n$TOOLTIP_DELIMITER$\n#v x[Country.MakeScope.ScriptValue('spec_law_mult')|2]#! do sistema econômico\n#v x[Country.MakeScope.ScriptValue('spec_stance_hype')|2]#! da [concept_spec_credit_policy][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_stance_hype'), '(CFixedPoint)1'), 'SPEC_WHY_SPEED_LOOSE')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_tech_hype'), '(CFixedPoint)1')), 'SPEC_WHY_SPEED_TECH')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_depth'), '(CFixedPoint)1')), 'SPEC_WHY_SPEED_DEPTH')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_band_gain'), '(CFixedPoint)1')), 'SPEC_WHY_SPEED_BAND')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_hype'), '(CFixedPoint)1')), 'SPEC_WHY_SPEED_EXCH')]\n\nQuanto maior, mais rápido o [concept_spec_investor_interest] acompanha a tendência de preços."
