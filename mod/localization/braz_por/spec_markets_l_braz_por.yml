 SPEC_EXCH_G_TRUST_TT: "#header Credibilidade#!\n$TOOLTIP_DELIMITER$\nA cada mês: #P sobe#! sem [concept_spec_financial_panic] enquanto os Critérios de Crédito forem #v Sólidos#! ou mais rigorosos, fica estável com #v Frouxos#!, #N cai#! com #v Imprudentes#!\nFim de expansão numa mercadoria principal: [concept_spec_correction] #P um pouco#!, [concept_spec_bust] ou [concept_spec_collapse] #N muito#!\n[concept_spec_financial_panic]: #N -20%#! a #N -50%#! da credibilidade no início, mais com maior [concept_spec_leverage], metade disso se causado por um [concept_spec_foreign_panic] ou sob o Compromisso; #N reduzido à metade#! de novo se seguir seu curso sem Socorro Bancário\n[concept_spec_bad_debts]: #N cai#! a cada mês, e a Posição não pode subir\nUma nova Bolsa começa com #v 50%#!"
