 SPEC_DRIVER_RESTRAIN_TT: "#header Expansões Contidas: [Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] das expansões desinfladas neste mês\n#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#! das [concept_spec_market_conditions]\n$TOOLTIP_DELIMITER$\nUma expansão contida é desinflada devagar, como uma [concept_spec_correction], em vez de terminar numa queda só. Custa um pouco por mês."
 SPEC_DRIVER_CAUTION_TT: "#header Governo e Eventos: [Country.MakeScope.Var('spec_c_caution').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\nUma mudança pontual neste mês, vinda das nossas decisões e dos eventos do mercado."
 SPEC_DRIVER_LIMIT_TT: "#header Piso e Teto: [Country.MakeScope.Var('spec_c_limit').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\nA [concept_spec_market_confidence] não pode ficar abaixo de #v 0#! nem acima de #v 100#!, então parte da mudança deste mês não contou."
 SPEC_DRIVER_RESCUE_TT: "#header Socorro Bancário: [Country.MakeScope.Var('spec_c_rescue').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\nUma alta única de #v Emprestar aos Bancos#! ou #v Suspender a Lei Bancária#!. Não pode elevar a [concept_spec_market_confidence] acima de #v 100#!."
 SPEC_DRIVER_RESCUE: "Socorro Bancário"
 SPEC_DRIVER_WAREND: "Fim da Guerra"
 SPEC_DRIVER_WAREND_TT: "#header Fim da Guerra: [Country.MakeScope.Var('spec_c_warend').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#v x[Country.MakeScope.Var('spec_war_stakes_now').GetValueWithDefault('(CFixedPoint)0')|%0]#! do efeito total, das nossas [concept_casualties]\n$TOOLTIP_DELIMITER$\nO efeito total, conforme o fim da guerra:\nVitória, com um [concept_war_goal] imposto: #P +4#!\nVitória, sem nada imposto: #P +1#!\nDerrota, com um [concept_war_goal] imposto contra nós: #N -8#!\nDerrota, sem nada imposto: #N -2#!\nNenhum lado venceu: #N -1#!\n\nAjustado pelas nossas perdas: pelo menos #v 25%#! do efeito, e todo ele quando a guerra custou #v 25%#! das nossas forças."
 SPEC_DRIVER_BURST: "Bolhas Estouradas"
 SPEC_DRIVER_BURST_TT: "#header Bolhas Estouradas: [Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0'), Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_burst_per_heat'), '(CFixedPoint)-1'))|0]#! do [concept_spec_speculative_excess]\n#N -[Country.MakeScope.ScriptValue('spec_burst_per_heat')|2]#! por ponto\nLimitado a #N -[Country.MakeScope.ScriptValue('spec_burst_max')|0]#!\n$TOOLTIP_DELIMITER$\nQuando a [concept_spec_market_confidence] cai abaixo de #v 60#! depois de uma expansão que a levou acima de #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#!, a bolha estoura. Quanto mais longa e alta foi a expansão, maior a perda.\n\nSó um país com [GetTechnology('stock_exchange').GetName] forma bolhas."
 SPEC_DRIVER_CAUTION: "Governo e Eventos"
 SPEC_DRIVER_RESTRAIN: "Expansões Contidas"
 SPEC_DRIVER_LIMIT: "Piso e Teto"
 SPEC_DRIVER_BOOM: "Mercadorias Aquecidas"
 SPEC_DRIVER_BOOM_TT: "#header Mercadorias Aquecidas: [Country.MakeScope.Var('spec_c_boom').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] de #v [Country.MakeScope.Var('spec_n_boom').GetValueWithDefault('(CFixedPoint)0')|0]#! [Concept('concept_good','$concept_goods|q$')] em expansão[AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_BOOM_CAP')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_steady'), '(CFixedPoint)1')), 'SPEC_BOOM_STEADY')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_fin_boom'), '(CFixedPoint)1')), 'SPEC_BOOM_FIN')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_boom_rule'), '(CFixedPoint)1')), 'SPEC_BOOM_RULE')]\n$TOOLTIP_DELIMITER$\nCada expansão soma à [concept_spec_market_confidence] conforme sua fatia do [concept_market]. Sem efeito durante um [concept_spec_financial_panic]. [GetTechnology('stock_exchange').GetName] e [GetTechnology('investment_banks').GetName] aumentam as expansões, assim como [GetTechnology('modern_financial_instruments').GetName]."
 SPEC_BOOM_CAP: "\nLimitado a #v +3#! antes dos multiplicadores"
 SPEC_BOOM_STEADY: "\n#v x[Country.MakeScope.ScriptValue('spec_steady')|2]#! das Casas Senhoriais"
 SPEC_BOOM_FIN: "\n#v x[Country.MakeScope.ScriptValue('spec_fin_boom')|2]#! das Tecnologias Financeiras"
 SPEC_BOOM_RULE: "\n#v x[Country.MakeScope.ScriptValue('spec_boom_rule')|2]#! da volatilidade mercantil"
 SPEC_DRIVER_CRASH: "Expansões Encerradas"
 SPEC_DRIVER_CRASH_TT: "#header Expansões Encerradas:[Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\nMaior no último mês: #v [Country.MakeScope.Var('spec_crashed').GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] do tamanho das expansões encerradas\n#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#! das [concept_spec_market_conditions][AddLocalizationIf(Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-40')), 'SPEC_CRASH_CAP')]\n$TOOLTIP_DELIMITER$\nCada [concept_spec_boom_end] reduz a [concept_spec_market_confidence]. Quanto maior a expansão e sua parte do [concept_market], maior a perda. [GetTechnology('mutual_funds').GetName] a atenua; [GetTechnology('modern_financial_instruments').GetName] a agrava."
 SPEC_CRASH_CAP: "\nLimitado a #N -40#! por mês"
 SPEC_DRIVER_FOREIGN: "Pânicos Estrangeiros"
 SPEC_FOREIGN_HIT: "\n#N -20#! de um [concept_spec_foreign_panic]\n#v x[Country.MakeScope.Var('spec_fh_size').GetValueWithDefault('(CFixedPoint)0')|2]#! da economia deles em relação à nossa\n#v x[Country.MakeScope.Var('spec_fh_tie').GetValueWithDefault('(CFixedPoint)0')|2]#! do nosso [concept_spec_market_tie]\n#v x[Country.MakeScope.Var('spec_fh_reach').GetValueWithDefault('(CFixedPoint)0')|2]#! da [concept_rank] deles[AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_foreign_loss_mult'), '(CFixedPoint)1')), 'SPEC_FOREIGN_UNSTD')]"
 SPEC_FOREIGN_UNSTD: "\n#v x[Country.MakeScope.ScriptValue('spec_foreign_loss_mult')|2]#! por não ter [GetTechnology('currency_standards').GetName]"
 SPEC_FOREIGN_FLIGHT: "\n[Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')|+=2] da [concept_spec_capital_flight]"
 SPEC_DRIVER_FOREIGN_TT: "#header Pânicos Estrangeiros: [Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\nMais recente: #v [Country.MakeScope.Var('spec_foreign_src').GetCountry.GetName]#!\n$TOOLTIP_DELIMITER$[AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_HIT')][AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_FLIGHT')]\n$TOOLTIP_DELIMITER$\nMesmo [concept_market]: #v [Country.MakeScope.ScriptValue('spec_tie_market')|%0]#!\nSúdito ou soberano: #v 80%#!\nDireitos de investimento estrangeiros: #v [Country.MakeScope.ScriptValue('spec_tie_investment')|%0]#!\nComércio intenso entre mercados: #v [Country.MakeScope.ScriptValue('spec_tie_trade')|%0]#!\nPropriedade estrangeira da nossa economia: até #v 90%#!\n\nUm [concept_spec_financial_panic] em um [concept_country] ligado ao nosso reduz a [concept_spec_market_confidence] aqui, mais quanto mais estreito o [concept_spec_market_tie] e maior a economia deles em relação à nossa. Uma [concept_great_power] repassa a perda inteira, uma grande potência a metade e os países pequenos pouco. Um pânico pego do exterior não se espalha mais. Sem [GetTechnology('currency_standards').GetName], a perda é um quarto maior."
 SPEC_DRIVER_TURMOIL: "Guerra e Agitação"
 SPEC_DRIVER_TURMOIL_TT: "#header Guerra e Agitação: [Country.MakeScope.Var('spec_c_turmoil').GetValueWithDefault('(CFixedPoint)0')|+=2]#!$SPEC_ITEMS_TURMOIL$\n$TOOLTIP_DELIMITER$\nCada [concept_war], segundo as [concept_spec_war_news]: #N -3#! a #P +0.15#! por mês\nTodas as guerras juntas: #N -4#! a #P +0.5#! por mês\n[concept_diplomatic_play] sem chegar à guerra: #N -0.5#! por mês\nTesouro se Esgotando: até #N -3#! por mês, a partir de #v 20#! semanas antes da [concept_bankruptcy]\n[concept_default]: #N -5#! por mês\n[concept_revolution]: #N -2#! por mês\n\nPasse o mouse sobre um número para ver o motivo."
 SPEC_DRIVER_MOOD: "Ânimo Mercantil"
 SPEC_DRIVER_MOOD_TT: "#header Ânimo Mercantil: [Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0')|+=2] da variação deste mês\n[Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0'))|+=2] do ânimo do mês passado\n$TOOLTIP_DELIMITER$\nO [concept_spec_market_mood] varia ao acaso todo mês, até #v 0.75#! para qualquer lado, e #v 75%#! dele passa para o mês seguinte."
 SPEC_DRIVER_DRIFT: "Retorno à Base"
 SPEC_DRIVER_DRIFT_TT: "#header Retorno à Base: [Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0'), Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100'))|+=1] da distância até a [concept_spec_baseline] (#v 55#!)\n#v x[Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100')|%1]#! recuperado por mês\n$TOOLTIP_DELIMITER$\n[GetTechnology('macroeconomics').GetName] torna isso uma vez e meia mais rápido."
 SPEC_DRIVER_TIGHT: "Crédito Restrito"
 SPEC_DRIVER_GROWTH: "Crescimento"
 SPEC_DRIVER_GROWTH_TT: "#header Crescimento: [Country.MakeScope.Var('spec_c_growth').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#v [Country.MakeScope.Var('spec_growth').GetValueWithDefault('(CFixedPoint)0')|=+%1]#! do [concept_gdp] em relação à sua média recente\n#v -2%#! do crescimento normal\n$TOOLTIP_DELIMITER$\nCada #v 1%#! de crescimento acima ou abaixo do normal move a [concept_spec_market_confidence] em #v 0.1#! por mês, até #v 0.6#! para qualquer lado."
 SPEC_DRIVER_BUSINESS: "Ânimo Empresarial"
 SPEC_DRIVER_BUSINESS_TT: "#header Ânimo Empresarial: [Country.MakeScope.Var('spec_c_business').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[concept_approval] dos industrialistas: #v [Country.MakeScope.ScriptValue('spec_ind_approval')|0]#!\n\nLeais (#v 10#! ou mais): #P +0.4#! por mês\nSatisfeitos (#v 5#! ou mais): #P +0.2#! por mês\nDescontentes (#v -5#! ou menos): #N -0.2#! por mês\nFuriosos (#v -10#! ou menos): #N -0.4#! por mês"
 SPEC_DRIVER_TIGHT_TT: "#header Crédito Restrito: [Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.1')|1]#! de [concept_spec_market_confidence] acima de #v 60#!\n#N -10%#! disso por mês, de [Concept('concept_spec_credit_policy','$concept_spec_credit_policy_tight|q$')]\n$TOOLTIP_DELIMITER$\nIsso esfria uma expansão ao longo de meses, e não de uma vez."
 concept_spec_market_conditions: "Condições de Mercado"
 concept_spec_market_conditions_desc: "As $concept_spec_market_conditions$ definem quanta [concept_spec_market_confidence] um [concept_spec_boom_end] custa. Quanto mais alta estiver a $concept_spec_market_confidence$ quando uma expansão termina, maior a perda. Com a $concept_spec_market_confidence$ em #v 55#!, elas não têm efeito. Distritos Financeiros, Casas Senhoriais e tecnologias financeiras também as alteram."
 concept_spec_baseline: "Confiança Base"
 concept_spec_baseline_desc: "Se deixada sozinha, a [concept_spec_market_confidence] volta à sua $concept_spec_baseline$ de #v 55#!, vindo de cima ou de baixo. Quanto mais se afastou, mais rápido volta."
 concept_spec_market_mood: "Ânimo Mercantil"
 concept_spec_market_mood_desc: "O $concept_spec_market_mood$ é a oscilação dos sentimentos dos investidores sem uma causa única. Todo mês ele varia ao acaso, até #v 0.75#! para qualquer lado, e #v 75%#! dele passa para o mês seguinte, de modo que fases boas e ruins duram um tempo antes de passar."
 concept_spec_market_tie: "Vínculo de Mercado"
 concept_spec_market_tie_desc: "Um $concept_spec_market_tie$ mede o quanto um [concept_country] segue o [concept_market] de outro. Ele define quanto de um [concept_spec_financial_panic] passa entre eles.\n\nA propriedade conta quando um país possui #v 10%#! do [concept_gdp] do outro, e é máxima em #v 30%#!. [GetLawType('law_free_trade').GetName] reforça o vínculo comercial e outras políticas comerciais o enfraquecem. [GetTechnology('international_exchange_standards').GetName] reforça os vínculos de mercado e de investimento. Um [concept_embargo] corta o vínculo comercial."
 concept_spec_capital_flight: "Fuga de Capitais"
 concept_spec_capital_flight_desc: "Quando um [concept_spec_financial_panic] começa, o dinheiro foge para lugares seguros. Cada [concept_great_power], e cada [concept_country] cuja [concept_spec_exchange] seja #v Internacional#! ou superior, ganha até #P +[GetPlayer.MakeScope.ScriptValue('spec_flight_gain_max')|0]#! de [concept_spec_market_confidence] se estiver em paz, em #v Estável#! ou melhor e sem vínculo com o país em pânico. [GetTechnology('international_trade').GetName] e [GetTechnology('international_exchange_standards').GetName] aumentam o ganho. Quanto mais alta a Posição de uma [concept_spec_exchange], mais ela recebe."
 concept_spec_war_news: "Notícias de Guerra"
 concept_spec_war_news_desc: "Os investidores acompanham uma [concept_war] mês a mês. As $concept_spec_war_news$ movem a [concept_spec_market_confidence] todo mês conforme o andamento: [concept_casualties], [concept_blockade], [concept_devastation], queda do [concept_gdp] e guerra longa a reduzem, enquanto vencer [Concept('concept_battle','$concept_battles|q$')] e manter território inimigo a elevam. Cada guerra a move entre #N -3#! e #P +0.15#! por mês, e todas as guerras juntas entre #N -4#! e #P +0.5#!."
