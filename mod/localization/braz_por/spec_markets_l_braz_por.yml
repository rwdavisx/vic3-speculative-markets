 SPEC_RIVAL_RULE: "Todo ano, a Bolsa com a maior pontuação de [Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')] ganha #P 5%#! de credibilidade e a outra perde #N 5%#!, ou #N 7.5%#! se os dois países estiverem em más relações ou piores (antes dos efeitos de Perdas de credibilidade). Isso vale para ambas, seja qual for a que nomeou a outra.\nPode ser nomeado: um mercado na nossa Posição ou na imediatamente acima, com pontuação pelo menos igual à nossa. Um Centro Mundial não nomeia rival.\nEm um [concept_spec_financial_panic], o dinheiro em fuga vai primeiro para a rival.\nUma aliança, um pacto defensivo ou direitos de investimento entre os dois encerram a rivalidade."
