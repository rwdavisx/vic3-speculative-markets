 spec_bailout_debts_tt: "Há [concept_spec_bad_debts] a eliminar"
 spec_bailed_tt: "O Estado não comprou créditos podres desde que estas [concept_spec_bad_debts] começaram"
 spec_lev_boom_desc: "O crédito bancário aumenta o [concept_throughput] em #P +2%#! para cada mês inteiro de [concept_spec_leverage], até #P +24%#!."
 spec_credit_crunch: "Dívidas Incobráveis"
 spec_credit_crunch_desc: "Os bancos estão baixando os empréstimos da última expansão e não emprestam nada até que isso se dissipe. #v Emprestar aos Bancos#! não o elimina. #v Comprar Créditos Podres#! o reduz à metade, uma vez enquanto durar."
 spec_loose_credit: "Crédito Flexível"
 spec_loose_credit_desc: "Efeitos da [concept_spec_credit_policy]"
 spec_tight_credit: "Crédito Restrito"
 spec_tight_credit_desc: "Efeitos da [concept_spec_credit_policy]"
 spec_markets.1.t: "Mania Especulativa"
 spec_markets.1.d: "Fortunas são feitas em [ROOT.GetCountry.GetCapital.GetCityHubName] mais depressa do que se pode contá-las. Os preços de [ROOT.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName], [ROOT.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName] e [ROOT.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName] sobem a cada semana, novas companhias para produzi-los são lançadas quase diariamente, e os bancos emprestam contra suas ações sem sequer examiná-las. Poucos se detêm para perguntar quanto tudo aquilo vale.\n\nAlguns $capitalists_no_icon$ e $shopkeepers_no_icon$ atribuem sua nova riqueza ao governo e se tornam [Concept('concept_loyalist','$concept_loyalists|q$')]. Se isso durar, os [Concept('concept_political_movement','$concept_political_movements|q$')] favoráveis a [GetLawType('law_laissez_faire').GetName] ganharão apoio."
 spec_markets.1.d_generic: "Fortunas são feitas em [ROOT.GetCountry.GetCapital.GetCityHubName] mais depressa do que se pode contá-las. Os preços sobem a cada semana, novas companhias são lançadas quase diariamente, e os bancos emprestam contra suas ações sem sequer examiná-las. Poucos se detêm para perguntar quanto tudo aquilo vale.\n\nAlguns $capitalists_no_icon$ e $shopkeepers_no_icon$ atribuem sua nova riqueza ao governo e se tornam [Concept('concept_loyalist','$concept_loyalists|q$')]. Se isso durar, os [Concept('concept_political_movement','$concept_political_movements|q$')] favoráveis a [GetLawType('law_laissez_faire').GetName] ganharão apoio."
 spec_markets.1.f: "“Compre, meu rapaz, e não se importe com o preço. Seja quanto for que pague hoje, algum outro sujeito pagará mais amanhã.”"
 spec_markets.1.a: "A prosperidade fala por si."
 spec_markets.1.b: "Recomendem moderação."
 spec_markets.1.b.tt: "A [concept_spec_market_confidence] cai em #v 10#!"
 spec_markets.1.c: "Que os especuladores paguem sua parte."
 spec_markets.1.c.tt: "A [concept_spec_market_confidence] cai em #v 5#!"
 spec_markets.2.t: "Pânico Financeiro"
 spec_markets.2.d_crash: "O fim da expansão de [ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName], a maior das expansões encerradas, tornou-se um pânico generalizado. Casas que emprestaram com base em seu preço estão falindo uma após a outra, e os depositantes fazem fila diante dos bancos de [ROOT.GetCountry.GetCapital.GetCityHubName] desde o raiar do dia. Os bancos estão cobrando #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#! em empréstimos, e os investidores se agarram ao pouco que lhes resta. A [concept_private_construction] ficará reduzida à metade por #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! meses.\n\nArruinados, $capitalists_no_icon$, $aristocrats_no_icon$ e $shopkeepers_no_icon$ culpam o governo, e alguns se tornam [Concept('concept_radical','$concept_radicals|q$')]. Muitos agora querem que o Estado ponha rédeas nos mercados, e [Concept('concept_political_movement','$concept_political_movements|q$')] contra [GetLawType('law_laissez_faire').GetName] ganham apoio.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_crash_no_loans: "O fim da expansão de [ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName], a maior das expansões encerradas, tornou-se um pânico generalizado. Casas que emprestaram com base em seu preço estão falindo uma após a outra, e os depositantes fazem fila diante dos bancos de [ROOT.GetCountry.GetCapital.GetCityHubName] desde o raiar do dia. Os investidores se agarram ao pouco que lhes resta. A [concept_private_construction] ficará reduzida à metade por #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! meses.\n\nArruinados, $capitalists_no_icon$, $aristocrats_no_icon$ e $shopkeepers_no_icon$ culpam o governo, e alguns se tornam [Concept('concept_radical','$concept_radicals|q$')]. Muitos agora querem que o Estado ponha rédeas nos mercados, e [Concept('concept_political_movement','$concept_political_movements|q$')] contra [GetLawType('law_laissez_faire').GetName] ganham apoio.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign: "O pânico em [ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName] atravessou para os nossos mercados. Casas que negociavam ou tomavam empréstimos lá estão falindo uma após a outra, e os depositantes fazem fila diante dos bancos de [ROOT.GetCountry.GetCapital.GetCityHubName] desde o raiar do dia. Os bancos estão cobrando #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#! em empréstimos, e os investidores se agarram ao pouco que lhes resta. A [concept_private_construction] ficará reduzida à metade por #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! meses.\n\nArruinados, $capitalists_no_icon$, $aristocrats_no_icon$ e $shopkeepers_no_icon$ culpam o governo, e alguns se tornam [Concept('concept_radical','$concept_radicals|q$')]. Muitos agora querem que o Estado ponha rédeas nos mercados, e [Concept('concept_political_movement','$concept_political_movements|q$')] contra [GetLawType('law_laissez_faire').GetName] ganham apoio.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign_no_loans: "O pânico em [ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName] atravessou para os nossos mercados. Casas que negociavam ou tomavam empréstimos lá estão falindo uma após a outra, e os depositantes fazem fila diante dos bancos de [ROOT.GetCountry.GetCapital.GetCityHubName] desde o raiar do dia. Os investidores se agarram ao pouco que lhes resta. A [concept_private_construction] ficará reduzida à metade por #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! meses.\n\nArruinados, $capitalists_no_icon$, $aristocrats_no_icon$ e $shopkeepers_no_icon$ culpam o governo, e alguns se tornam [Concept('concept_radical','$concept_radicals|q$')]. Muitos agora querem que o Estado ponha rédeas nos mercados, e [Concept('concept_political_movement','$concept_political_movements|q$')] contra [GetLawType('law_laissez_faire').GetName] ganham apoio.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other: "A confiança ruiu de uma só vez. Firmas sólidas não conseguem tomar empréstimos a nenhum preço, e os depositantes fazem fila diante dos bancos de [ROOT.GetCountry.GetCapital.GetCityHubName] desde o raiar do dia. Os bancos estão cobrando #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#! em empréstimos, e os investidores se agarram ao pouco que lhes resta. A [concept_private_construction] ficará reduzida à metade por #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! meses.\n\nArruinados, $capitalists_no_icon$, $aristocrats_no_icon$ e $shopkeepers_no_icon$ culpam o governo, e alguns se tornam [Concept('concept_radical','$concept_radicals|q$')]. Muitos agora querem que o Estado ponha rédeas nos mercados, e [Concept('concept_political_movement','$concept_political_movements|q$')] contra [GetLawType('law_laissez_faire').GetName] ganham apoio.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other_no_loans: "A confiança ruiu de uma só vez. Firmas sólidas não conseguem tomar empréstimos a nenhum preço, e os depositantes fazem fila diante dos bancos de [ROOT.GetCountry.GetCapital.GetCityHubName] desde o raiar do dia. Os investidores se agarram ao pouco que lhes resta. A [concept_private_construction] ficará reduzida à metade por #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! meses.\n\nArruinados, $capitalists_no_icon$, $aristocrats_no_icon$ e $shopkeepers_no_icon$ culpam o governo, e alguns se tornam [Concept('concept_radical','$concept_radicals|q$')]. Muitos agora querem que o Estado ponha rédeas nos mercados, e [Concept('concept_political_movement','$concept_political_movements|q$')] contra [GetLawType('law_laissez_faire').GetName] ganham apoio.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.bad_debts: "Os empréstimos da expansão se tornaram podres. Nos próximos meses, as [concept_spec_bad_debts] reduzirão o [concept_throughput] em #N [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_tp_full_pct')|1]%#!, depois diminuirão, sendo eliminadas em #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#! meses. Os bancos não emprestarão nada até que sejam eliminadas, e #v Emprestar aos Bancos#! não as eliminará."
