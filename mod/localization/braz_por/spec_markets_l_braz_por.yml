 alert_spec_bubble_alert_name: "Excesso Especulativo"
 spec_bubble_alert_setting_name: "Excesso Especulativo"
 alert_spec_bubble_alert_desc: "Nosso [concept_spec_speculative_excess] está em #v [GetPlayer.MakeScope.Var('spec_heat').GetValue|0]#!. Quando a [concept_spec_market_confidence] voltar a cair abaixo de #v 60#!, a bolha estourará e a [concept_spec_market_confidence] cairá mais #N [GetPlayer.MakeScope.ScriptValue('spec_burst_now')|0]#!."
 alert_spec_bubble_alert_hint: "A bolha cresce todo mês em que a [concept_spec_market_confidence] está em #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! ou mais, e esfria enquanto fica entre #v 60#! e esse valor. Conter a especulação nas mercadorias em expansão ou restringir a [concept_spec_credit_policy] reduz a bolha gradualmente."
