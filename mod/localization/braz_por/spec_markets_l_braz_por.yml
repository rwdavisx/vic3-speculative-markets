 SPEC_IL_SORT_INTEREST_TT: "#header Ordenar por [concept_spec_investor_interest]#!\n$TOOLTIP_DELIMITER$\nMaior interesse primeiro; em cada nível, as mais negociadas primeiro.\n\nO marcador mostra o nível, de @spec_interest_fleeing! #v Em Fuga#! a @spec_interest_feverish! #v Febril#!. A seta mostra a variação deste mês."
