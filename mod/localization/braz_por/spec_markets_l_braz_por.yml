 concept_spec_exchange: "Bolsa"
 concept_spec_exchange_desc: "A $concept_spec_exchange$ de um [concept_country] é onde suas ações, títulos e créditos mudam de mãos. Sua Posição segue sua pontuação de [Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]: #v Provincial#!, #v Nacional#!, #v Internacional#! (exige [GetTechnology('stock_exchange').GetName]) ou #v Centro Mundial#! (exige [GetTechnology('central_banking').GetName]). Uma Posição mais alta aumenta a Reação dos Investidores à alta de preços, e a partir de #v Internacional#! a Bolsa recebe [concept_spec_capital_flight].\n\nO Estado concede à sua Bolsa uma carta: #v Bolsa de Mercadorias#!, #v Mercado Monetário#! ou #v Mercado de Ações#!. Uma Bolsa tem de #v 1#! a #v 4#! especialidades entre os #v 7#! Caminhos da Fama, mais à medida que sua Posição sobe, e mantém cada uma por pelo menos #v 5#! anos.\n\nA credibilidade sobe em anos calmos com crédito prudente e cai com [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')], [concept_spec_bad_debts] e uma [concept_spec_bust] ou um [concept_spec_collapse] numa mercadoria principal. Credibilidade baixa eleva a taxa de juros de [concept_loans], e credibilidade alta a reduz."
 spec_exch_national: "Posição da Bolsa"
 spec_trust_0: "Bolsa Desacreditada"
