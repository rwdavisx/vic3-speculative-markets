 spec_panic_movements: "Desconfiança nos Mercados"
 spec_panic_movements_desc: "Após o pânico, muitos querem que o Estado contenha os mercados. O apoio aumenta para [Concept('concept_political_movement','$concept_political_movements|q$')] contrários à lei [GetLawType('law_laissez_faire').GetName]. Esse efeito diminui com o tempo."
 spec_mania_movements: "Fé nos Mercados"
 spec_mania_movements_desc: "Uma longa expansão convenceu muitos de que é melhor deixar os mercados livres. O apoio aumenta para [Concept('concept_political_movement','$concept_political_movements|q$')] favoráveis à lei [GetLawType('law_laissez_faire').GetName]. Esse efeito diminui com o tempo."
 SPEC_DRIVER_DEBT: "Dívida Pública"
 SPEC_DRIVER_DEBT_TT: "#header Dívida Pública: [GetPlayer.MakeScope.Var('spec_c_debt').GetValue|+=2]#!\n$TOOLTIP_DELIMITER$\n[concept_credit] usado: #v [GetPlayer.MakeScope.ScriptValue('spec_debt_share')|%0]#! ([concept_principal])\nOs investidores aceitam até #v 50%#!\n$TOOLTIP_DELIMITER$\nCada #v 10%#! acima disso reduz a [concept_spec_market_confidence] em #v 0.2#! por mês, até #N -1#!."
