 SPEC_BANK_GOOD_TT: "#header [Scope.GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\n#v [Country.MakeScope.Var(Concatenate('spec_exp_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%1]#! do [concept_spec_outstanding_credit] foi emprestado a ela.\nSe a expansão terminasse, a [concept_spec_market_confidence] cairia #v x[Country.MakeScope.Var(Concatenate('spec_ui_expx_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)1')|2]#! vezes mais.\n\n#grey Um empréstimo permanece na mercadoria até ser quitado, mesmo depois que a expansão esfria.#!"
