 SPEC_BANK_GOOD_SHARE: "#v [Divide_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_exp_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_exp_booms'), '(CFixedPoint)0.001'))|%0]#!"
