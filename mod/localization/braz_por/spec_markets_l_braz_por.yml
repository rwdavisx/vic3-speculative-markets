 spec_lev_boom: "Expansão de Crédito"
 spec_bailout_fx_tt: "[concept_spec_bad_debts]: #P reduzidas pela metade#!, sumindo em #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_months')|0]#! meses em vez de #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#!"
