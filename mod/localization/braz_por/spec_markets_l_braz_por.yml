 SPEC_STANCE_TIGHT_TT: "#header Crédito Restrito#!\nCrédito concedido neste mês: #v Nenhum#!\n$TOOLTIP_DELIMITER$\nA cada mês, a [concept_spec_market_confidence] perde #N 10%#! do quanto está acima de #v 60#!\nReação dos Investidores: #N -50%#!\n@intelligentsia! Elite Intelectual [concept_in_government]: #P +2#! de [concept_approval]\n@industrialists! Industrialistas [concept_in_government]: #N -2#! de [concept_approval]\n\nAs expansões ficam menores, então seus desfechos e pânicos são mais brandos.[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-1'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-1')), Not(GetScriptedGui('spec_sgui_tight').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_TIGHT_WHY')]"
