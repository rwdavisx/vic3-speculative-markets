 je_spec_depression_reason: "Os pânicos nas grandes bolsas se tornaram uma crise mundial. O investimento e a construção desaceleraram, o comércio caiu, e os desempregados estão cada vez mais inquietos. A [concept_spec_long_depression] termina quando o mundo se recupera, ou após no máximo #v 5#! anos.\n\nNossas escolhas aceleram nossa recuperação e a do mundo, e as das [Concept('concept_great_power','$concept_great_powers|q$')] têm maior peso. Quando nossa própria recuperação estiver concluída, a [concept_spec_market_confidence] retornará aqui antes de retornar em outros lugares."
