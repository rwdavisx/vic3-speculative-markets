 SPEC_IL_LEVEL_4_TT: "#header @spec_interest_keen! Interessado#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)4'), 'SPEC_IL_LEVEL_CURRENT')]\nAplica-se enquanto a tendência de preços estiver entre #v [Country.MakeScope.ScriptValue('spec_level_from_4')|=+%1]#! e #v [Country.MakeScope.ScriptValue('spec_level_from_5')|=+%1]#! em relação à média de longo prazo\nTendência de preços atual: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Efeitos:#!\n[concept_throughput] dos produtores: #P +3%#!\nPode terminar como: [concept_spec_correction]"
 SPEC_IL_LEVEL_5_TT: "#header @spec_interest_eager! Ávido#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)5'), 'SPEC_IL_LEVEL_CURRENT')]\nAplica-se enquanto a tendência de preços estiver entre #v [Country.MakeScope.ScriptValue('spec_level_from_5')|=+%1]#! e #v [Country.MakeScope.ScriptValue('spec_level_from_6')|=+%1]#! em relação à média de longo prazo\nTendência de preços atual: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Efeitos:#!\n[concept_throughput] dos produtores: #P +5%#!\n[concept_spec_market_confidence]: #P Sobe#! a cada mês, mais com maior parte do comércio, exceto durante um [concept_spec_financial_panic]\nPode terminar como: [concept_spec_bust]\nA especulação pode ser contida"
