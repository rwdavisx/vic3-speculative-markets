 concept_spec_financial_centre_desc: "As $concept_spec_financial_centres$ são os #v 5#! [Concept('concept_country','$concept_countries|q$')] com a maior pontuação de [Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')], classificados todo mês. A pontuação cresce com a raiz quadrada de #v 6#! meses de renda do [concept_investment_pool], e com a credibilidade, a riqueza por habitante, os Distritos Financeiros, as companhias, as tecnologias financeiras, a [concept_rank] e o sistema econômico. A média dos três primeiros é exibida como #v 100#!.\n\nPrimeiro lugar: #P +10%#! de [concept_prestige], #P -10%#! na taxa de juros de [concept_loans], #P +5#! meses de Limite de Crédito\nÚltimo lugar (#v 5#!): #P +2%#!, #P -2%#!, #P +1#! mês\nO bônus de Limite de Crédito exige [GetTechnology('central_banking').GetName] e Critérios de Crédito #v Sólidos#! ou mais rigorosos"
