 SPEC_COL_LEVER: "Intervenção"
 SPEC_COL_LEVER_TT: "#header Intervenções Mercantis#!\n$TOOLTIP_DELIMITER$\nConter Especulação: interesse mantido em #v Calmo#!, seus produtores perdem [concept_throughput] e pagam uma taxa\nIncentivar Investimento: interesse de pelo menos #v Interessado#!, seus produtores ganham [concept_throughput] e o Estado paga por isso\n\nCada uma custa [concept_authority] todo mês até ser suspensa, mais para bens de primeira necessidade e para mercadorias com grande parte do comércio do mercado. A especulação pode ser contida em mercadorias nos níveis #v Ávido#! e #v Febril#!, ou numa mercadoria cuja expansão custaria #v 2#! ou mais de [concept_spec_market_confidence] se terminasse. O investimento pode ser incentivado em mercadorias abaixo de #v Interessado#!."
 SPEC_SEP_FEVERISH_TT: "#header @spec_interest_feverish! [concept_spec_investor_interest] Febril#!\nParticipação no nosso comércio: #v [Country.MakeScope.Var('spec_heat_6').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] dos produtores: #P +8%#!\n[concept_spec_market_confidence]: #P Sobe#! todo mês, mais com maior participação no comércio, exceto durante um [concept_spec_financial_panic]\nDesfecho possível: [concept_spec_collapse]"
 SPEC_SEP_EAGER_TT: "#header @spec_interest_eager! [concept_spec_investor_interest] Ávido#!\nParticipação no nosso comércio: #v [Country.MakeScope.Var('spec_heat_5').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] dos produtores: #P +5%#!\n[concept_spec_market_confidence]: #P Sobe#! todo mês, mais com maior participação no comércio, exceto durante um [concept_spec_financial_panic]\nDesfecho possível: [concept_spec_bust]"
 SPEC_SEP_KEEN_TT: "#header @spec_interest_keen! [concept_spec_investor_interest] Interessado#!\nParticipação no nosso comércio: #v [Country.MakeScope.Var('spec_heat_4').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] dos produtores: #P +3%#!\nDesfecho possível: [concept_spec_correction]"
 SPEC_SEP_CALM_TT: "#header @spec_interest_calm! [concept_spec_investor_interest] Calmo#!\nParticipação no nosso comércio: #v [Country.MakeScope.Var('spec_heat_3').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\nSem efeitos"
 SPEC_SEP_DOUBTFUL_TT: "#header @spec_interest_doubtful! [concept_spec_investor_interest] Hesitante#!\nParticipação no nosso comércio: #v [Country.MakeScope.Var('spec_heat_2').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] dos produtores: #N -5%#!\nApós uma expansão, o interesse na mercadoria em recuperação fica neste nível ou abaixo por algum tempo"
 SPEC_SEP_FLEEING_TT: "#header @spec_interest_fleeing! [concept_spec_investor_interest] Em Fuga#!\nParticipação no nosso comércio: #v [Country.MakeScope.Var('spec_heat_1').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] dos produtores: #N -10%#!\nUma expansão com interesse #v Febril#! que cai até aqui termina em um [concept_spec_collapse]"
 SPEC_IB_TURNING_TT: "#header Reversão da Expansão#!\nO setor de [Goods.GetName] recuou após uma grande expansão. Se o [concept_spec_investor_interest] continuar caindo, a expansão terminará em um [concept_spec_collapse], custando cerca de #N [Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! de [concept_spec_market_confidence]."
