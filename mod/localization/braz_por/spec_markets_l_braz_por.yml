 SPEC_XS_CAP_TT: "#header Capital#!\n$TOOLTIP_DELIMITER$\nA pontuação parte do capital em que nossa [concept_spec_exchange] se apoia, crescendo com sua raiz quadrada: quatro vezes o capital dobra a pontuação.\n\nPróprio: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_own_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, seis meses de renda do [concept_investment_pool], na média do último ano\nDos nossos vínculos: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_reach_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, um quarto do capital de cada [concept_country] menor no nosso [concept_market], dos nossos [Concept('concept_subject','$concept_subjects|q$')], do nosso [concept_power_bloc] ou que nos concede direitos de [concept_foreign_investment]; no máximo tanto quanto o nosso próprio"
 SPEC_XS_WEALTH_TT: "#header Riqueza por Habitante#!\n$TOOLTIP_DELIMITER$\nA renda do nosso [concept_investment_pool] por pessoa é #v [Country.MakeScope.Var('spec_xs_ratio_v').GetValueWithDefault('(CFixedPoint)0')|2]#! vezes a do mundo. As economias de um povo rico formam um mercado mais profundo: a raiz quadrada disso, de #v x0.5#! a #v x2#!"
 SPEC_XS_TECH_TT: "#header Tecnologias Financeiras#!\n$TOOLTIP_DELIMITER$\nCada uma pesquisada aumenta a pontuação:\n$banking$: #P +5%#!\n$stock_exchange$: #P +5%#!\n$central_banking$: #P +5%#!\n$joint_stock_companies$: #P +5%#!\n$mutual_funds$: #P +5%#!\n$investment_banks$: #P +10%#!\n$international_exchange_standards$: #P +10%#!\n$modern_financial_instruments$: #P +10%#!\n\n[GetTechnology('stock_exchange').GetName] é necessária para a Posição #v Internacional#!, [GetTechnology('central_banking').GetName] para ser #v Centro Mundial#!"
 SPEC_XS_ECON_TT: "#header Sistema Econômico#!\n$TOOLTIP_DELIMITER$\nNosso sistema econômico multiplica a pontuação:\n$law_laissez_faire$: #P x1.15#!\n$law_interventionism$: #P x1.05#!\n$law_agrarianism$: #N x0.95#!\n$law_traditionalism$: #N x0.9#!\n$law_extraction_economy$: #N x0.9#!\n$law_command_economy$: #N x0.75#!\n$law_cooperative_ownership$: #N x0.6#!"
