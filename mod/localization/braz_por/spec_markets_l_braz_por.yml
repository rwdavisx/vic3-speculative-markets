 SPEC_RISK_SLIGHT: "#header Risco de $SPEC_UNWIND$#!\nPerda de [concept_spec_market_confidence] se a expansão terminar: #v Pequena#!\n$TOOLTIP_DELIMITER$\n$SPEC_UNWIND_DESC$"
 SPEC_RISK_GLUT: "#header Em Recuperação#!\n$TOOLTIP_DELIMITER$\nO setor de [Goods.GetName] está se recuperando do fim de sua última expansão. Os investidores recuam, mantendo o [concept_spec_investor_interest] em #v Hesitante#! por algum tempo."
 SPEC_RISK_CALM: "#header Sem Expansão#!\n$TOOLTIP_DELIMITER$\nO setor de [Goods.GetName] não teve expansão recente. Quando o [concept_spec_investor_interest] atinge #v Interessado#! ou mais, uma queda para #v Hesitante#! encerra a expansão, e quanto mais alto o interesse chegou, mais dura a queda."
 SPEC_UNWIND_3: "Colapso"
 SPEC_UNWIND_C_3: "[concept_spec_collapse]"
 SPEC_UNWIND_DESC_3: "Esta [concept_good] teve uma expansão em que o interesse atingiu #v Febril#!. Se sua tendência de preços cair abaixo de #v [Divide_CFixedPoint('(CFixedPoint)-4.988', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!, o [concept_spec_investor_interest] passa a #v Em Fuga#! e a expansão termina em um [concept_spec_collapse]. Os investidores então recuam por #v 12#! meses. O risco diminui com a idade da expansão."
 SPEC_UNWIND_2: "Quebra"
 SPEC_UNWIND_C_2: "[concept_spec_bust]"
 SPEC_UNWIND_DESC_2: "Esta [concept_good] teve uma expansão em que o interesse atingiu #v Ávido#!. Se sua tendência de preços cair abaixo de #v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!, o [concept_spec_investor_interest] se torna #v Hesitante#! e a expansão termina em uma [concept_spec_bust]. Os investidores então recuam por #v 6#! meses. O risco diminui com a idade da expansão."
 SPEC_UNWIND_1: "Correção"
 SPEC_UNWIND_C_1: "[concept_spec_correction]"
 SPEC_UNWIND_DESC_1: "Esta [concept_good] teve uma expansão em que o interesse atingiu #v Interessado#!. Se sua tendência de preços cair abaixo de #v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!, o [concept_spec_investor_interest] se torna #v Hesitante#! e a expansão termina em uma [concept_spec_correction]. Os investidores então recuam por #v 3#! meses. O risco diminui com a idade da expansão."
