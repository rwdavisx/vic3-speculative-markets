l_braz_por:
 spec_confidence_bar: "Confiança"
 spec_confidence_bar_desc: "[concept_spec_market_confidence]: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!"
 spec_stance_current_tt: "Esta ainda não é a [concept_spec_credit_policy]"
 spec_stance_cooldown_tt: "A [concept_spec_credit_policy] não mudou nos últimos #v 6#! meses"
 spec_rescued_tt: "Não emprestamos aos bancos nem suspendemos a Lei Bancária durante este [concept_spec_financial_panic]"
 spec_credit_tight: "Crédito Restrito"
 spec_credit_tight_fx: "A [concept_spec_credit_policy] passa a ser #v Restrita#!"
 spec_credit_normal_fx: "A [concept_spec_credit_policy] passa a ser #v Normal#!"
 spec_credit_loose_fx: "A [concept_spec_credit_policy] passa a ser #v Flexível#!"
 spec_credit_tight_desc: "Os bancos param de emprestar e os investidores reagem menos à alta de preços. As expansões ficam menores, então seus desfechos e pânicos são mais brandos. A cada mês, a [concept_spec_market_confidence] perde #N 10%#! do quanto está acima de #v 60#!. Escolhê-la bloqueia a [concept_spec_credit_policy] por #v 6#! meses. Exige [GetTechnology('central_banking').GetName].\n\n@intelligentsia! Elite Intelectual [concept_in_government]: #P +2#! de [concept_approval]\n@industrialists! Industrialistas [concept_in_government]: #N -2#! de [concept_approval]"
 spec_credit_normal: "Crédito Normal"
 spec_credit_normal_desc: "Os bancos emprestam ao [concept_investment_pool] enquanto a [concept_spec_market_confidence] supera #v 55#!. Esta escolha impede mudanças na [concept_spec_credit_policy] por #v 6#! meses. Requer [GetTechnology('central_banking').GetName]."
 spec_credit_loose: "Crédito Flexível"
 spec_credit_loose_desc: "Os bancos emprestam mais e os investidores reagem mais intensamente à alta dos preços. As expansões se tornam maiores, assim como as perdas quando terminam. Esta escolha impede mudanças na [concept_spec_credit_policy] por #v 6#! meses. Requer [GetTechnology('central_banking').GetName].\n\n@industrialists! Industrialistas [concept_in_government]: #P +2#! de [concept_approval]\n@intelligentsia! Elite Intelectual [concept_in_government]: #N -2#! de [concept_approval]"
 spec_rescue_banks: "Emprestar aos Bancos"
 spec_rescue_banks_desc: "Gaste cerca de #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#! do [concept_gdp] com recursos do [concept_treasury] para encerrar o [concept_spec_financial_panic] em até #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#! meses e reduzir seus efeitos à metade. A [concept_spec_market_confidence] sobe em #v 20#!. Quanto mais meses restarem de pânico, maior o custo. Pode ser feito uma vez por pânico. A tecnologia [GetTechnology('central_banking').GetName] torna a medida mais barata e rápida."
 spec_conf_panic: "Investidores Abalados"
 spec_conf_panic_held: "Investidores Abalados"
