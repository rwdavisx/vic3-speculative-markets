 concept_spec_intervention: "Intervenção"
 concept_spec_intervention_desc: "Por meio de uma $concept_spec_intervention$, o governo pode #v Conter Especulação#! numa [concept_good] ou #v Incentivar Investimento#! nela.\n\n#v Conter Especulação#!: o [concept_spec_investor_interest] recua para #v Calmo#!, produtores #N -10%#! de [concept_throughput], e uma taxa de #v 10%#! da produção semanal a preço base\n#v Incentivar Investimento#!: o interesse sobe para #v Interessado#!, produtores #P +10%#! de [concept_throughput], e um subsídio de #v 20%#!\n\nCada uma custa [concept_authority] todo mês até ser suspensa, mais para bens de primeira necessidade e para mercadorias com grande parte do comércio do [concept_market]."
 SPEC_LEVER_ISSUE_TT: "#header Lançar uma Grande Emissão em [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\nPor #v 2#! anos:\nPontuação de [Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]: #P +25%#!\nEmpréstimos bancários nela contam #N x1.5#! quando a expansão terminar\nCredibilidade ganha ou perdida quando a expansão terminar: #v x2#!\n$TOOLTIP_DELIMITER$\nExige Posição Nacional ou superior, [concept_spec_investor_interest] #v Ávido#! ou superior e nenhuma [concept_spec_intervention]. Uma Grande Emissão por vez; a próxima pode ser lançada #v 1#! ano após o fim desta.[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_issue_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_ISSUE_ON', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_issue').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
