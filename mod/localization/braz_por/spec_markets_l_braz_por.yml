 spec_suspend_tt: "O [concept_spec_financial_panic] termina em até #v 2#! meses, com força total até lá\nA [concept_spec_market_confidence] sobe #v 15#!\nPor #v 10#! anos, o [concept_spec_speculative_excess] cresce #v 50%#! mais rápido\nOs [concept_spec_lending_standards] afrouxam, como após um Socorro Bancário"
 spec_suspend_act: "Suspender a Lei Bancária"
 spec_suspend_act_desc: "Permitir que o banco empreste além do limite que a Lei impõe às suas notas. O pânico diminui em poucos meses sem custo para o tesouro, mas os investidores aprendem que o governo sempre intervirá. Conta como #v Emprestar aos Bancos#! para este pânico.\n\n#lore A Grã-Bretanha suspendeu sua Lei Bancária em 1847, 1857 e 1866.#!"
 spec_relief_works_button: "Obras Assistenciais"
 spec_relief_works_button_desc: "Pague por obras públicas e assistência enquanto durar a recessão: Assistência Social, mais construção e menos radicais por #v 12#! meses, a um custo semanal que cresce com nosso [concept_gdp]."
 spec_convert_debt: "Converter a Dívida Nacional"
 spec_convert_debt_desc: "Enquanto os investidores estão otimistas, substitua nossos empréstimos por novos com juros menores. Os detentores de títulos que viviam dos juros antigos não nos agradecerão."
 spec_inquiry: "Comissão de Inquérito"
 spec_inquiry_desc: "Nomeie uma comissão para ouvir banqueiros, corretores e depositantes arruinados e relatar como nossos bancos e companhias devem funcionar. Seu relatório promulga uma [Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')] permitida pela nossa tecnologia. Suas sessões ocupam a atenção do governo por #v 6#! meses."
 spec_debt_converted: "Dívida Convertida"
 spec_debt_converted_desc: "Empréstimos convertidos a uma taxa menor enquanto os investidores estavam ávidos por emprestar"
