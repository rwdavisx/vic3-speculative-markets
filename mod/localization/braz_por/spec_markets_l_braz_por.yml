 SPEC_JE_STAGE_6: "A [concept_spec_long_depression] paira sobre [JournalEntry.GetCountry.GetCapital.GetCityHubName]. Os investidores guardam o que têm e não emprestam a ninguém, e cada recuperação até agora fraquejou em poucos meses. Uma entrada de diário própria acompanha a recuperação mundial.\n\nAs Obras Assistenciais empregam os desempregados em construções e os mantêm alimentados enquanto ela durar."
 SPEC_JE_STAGE_5: "O pânico tomou conta de [JournalEntry.GetCountry.GetCapital.GetCityHubName]. Os depositantes fazem fila diante dos bancos desde o raiar do dia, os empréstimos são cobrados, e a [concept_private_construction] fica reduzida à metade por mais #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! meses, a menos que o governo aja.\n\n#v Emprestar aos Bancos#! o encerra mais cedo e reduz seus efeitos à metade. As Obras Assistenciais empregam os desempregados em construções e os mantêm alimentados.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_currency_v'), '(CFixedPoint)0'), 'SPEC_JE_SUSPEND_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_4: "O pânico passou, deixando casas falidas e obras inacabadas. Os investidores contam suas perdas, e nenhum novo pânico pode começar por #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic_cooldown').GetValue|0]#! meses.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_reform_open_v'), '(CFixedPoint)0'), 'SPEC_JE_INQUIRY_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_3: "A bolsa de [JournalEntry.GetCountry.GetCapital.GetCityHubName] enlouqueceu. Escriturários e viúvas compram ações dos setores de #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! e #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! com dinheiro emprestado, e cada mês em que a [concept_spec_market_confidence] fica em #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#! ou mais aumenta o [concept_spec_speculative_excess]. Quando a [concept_spec_market_confidence] cai abaixo de #v 60#!, a bolha estoura, e quanto maior o excesso, mais dura a queda.\n\nConter a especulação nas mercadorias mais disputadas ou restringir o crédito esvazia a bolha aos poucos."
 SPEC_JE_STAGE_2: "O dinheiro é fácil e os investidores estão otimistas. A procura por ações de novas companhias nos setores de #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! e #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! supera a oferta em menos de uma hora, e os bancos emprestam livremente contra essas ações. Com a [concept_spec_market_confidence] em #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#! ou mais, o [concept_spec_speculative_excess] começa a crescer.\n\nOs bons tempos também são a ocasião de converter a dívida nacional para uma taxa menor."
 SPEC_JE_STAGE_1: "Os negócios na bolsa de [JournalEntry.GetCountry.GetCapital.GetCityHubName] transcorrem em ordem. Os investidores favorecem os setores de #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! e #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! e evitam os de #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! e #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!."
 SPEC_JE_STAGE_0: "Os investidores em [JournalEntry.GetCountry.GetCapital.GetCityHubName] estão cautelosos. Escaldados por perdas recentes, guardam seu dinheiro e evitam os setores de #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! e #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!. Flexibilizar o crédito ou incentivar o investimento em uma mercadoria pode atraí-los de volta."
