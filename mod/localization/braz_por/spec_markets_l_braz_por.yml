 concept_spec_long_depression: "Longa Depressão"
 concept_spec_long_depression_desc: "A $concept_spec_long_depression$ é uma crise econômica mundial. Começa quando uma [concept_great_power] entra em um [concept_spec_financial_panic], atinge todos os países então em pânico e se espalha por vínculos estreitos: um [concept_market] compartilhado, súditos e suseranos, direitos de investimento, comércio intenso e propriedade estrangeira.\n\nQuebra Mundial (#v 4#! meses): o crédito congela e a [concept_spec_market_confidence] se esvai\nDepressão (até #v 5#! anos): investimento, construção e comércio desaceleram, e algumas pops se tornam [Concept('concept_radical','$concept_radicals|q$')]\nRecuperação (#v 1#! ano): a [concept_spec_market_confidence] retorna\n\nAs escolhas de cada governo aceleram sua própria recuperação e a do mundo, e as de uma [concept_great_power] contam mais."
