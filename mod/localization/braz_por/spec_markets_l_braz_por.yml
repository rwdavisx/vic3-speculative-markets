 SPEC_IL_DANGER_TT: "#header Zona de Colapso#!\nSe o [concept_spec_investor_interest] cair até aqui, a expansão terminará em um [concept_spec_collapse], custando cerca de #N [Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! de [concept_spec_market_confidence]."
 SPEC_IL_CRASHED_TT: "#header [Goods.GetName]: Expansão Encerrada#!\nSua expansão terminou neste mês com o desfecho [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]. Os investidores agora se retraem por [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))] e, onde uma [concept_company] a produz, sua indústria perde [concept_throughput]."
 SPEC_IL_GLUT_TT: "#header [Goods.GetName] em Recuperação#!\nSua última expansão terminou com o desfecho [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]. Os investidores recuam por [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))] após o fim, mantendo o [concept_spec_investor_interest] em #v Hesitante#! ou abaixo e, onde uma [concept_company] produz a mercadoria, sua indústria perde [concept_throughput]."
 SPEC_TILE_BANKS: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_expx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_BANKS_ON', 'SPEC_GOODS_NONE')]$SPEC_TILE_CYCLE$"
 SPEC_TILE_BANKS_ON: "\n\n#title Empréstimos bancários:#! #v [Country.MakeScope.Var(Concatenate('spec_exp_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! de [concept_spec_outstanding_credit], #v [Country.MakeScope.Var(Concatenate('spec_ui_expm_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! meses de renda do fundo\nSe a expansão terminasse, a [concept_spec_market_confidence] cairia #v x[Country.MakeScope.Var(Concatenate('spec_ui_expx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|2]#! vezes mais do que com uma expansão em que nenhum banco emprestou"
 SPEC_NOTE_BANKS: ""
 SPEC_NOTE_BANKS_ON: " Os bancos tinham emprestado muito nele, então a queda foi #N x[SCOPE.GetValue('spec_note_bank')|2]#! mais dura."
 SPEC_H_BANK_LENT: "Onde os bancos emprestaram"
 SPEC_H_BANK_LENT_TT: "#header Onde os bancos emprestaram#!\n$TOOLTIP_DELIMITER$\nOs bancos emprestam a maior parte do novo crédito a mercadorias em expansão: quanto maior a parte de uma mercadoria no nosso comércio e maior seu [concept_spec_investor_interest], mais ela recebe. Um empréstimo permanece na mercadoria até ser quitado.\n\nQuando termina uma expansão em que os bancos emprestaram, a [concept_spec_market_confidence] cai mais. Conter a especulação numa mercadoria reduz à metade os novos empréstimos que ela atrai."
 SPEC_BANK_PIE: "Empréstimos de expansões por bem"
 SPEC_BANK_SLICE_NAME: "[SelectLocalization(Country.MakeScope.Var(Concatenate('spec_bank_oth_', Scope.GetGoods.GetKey)).IsSet, 'SPEC_BANK_OTHER', 'SPEC_BANK_GOOD_NAME')]"
