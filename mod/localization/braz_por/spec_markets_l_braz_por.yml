 spec_story.1.t: "O Mercado de [ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName] Quebra"
 spec_story.1.t_generic: "Um Mercado Quebra"
 spec_story.1.d: "A corrida ao setor de [ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName] acabou. Preços que subiram durante um ano caíram em um mês, e as companhias lançadas no auge da febre não conseguem honrar suas contas. Comerciantes que compravam a qualquer preço ficaram com armazéns que não conseguem esvaziar, e os bancos que emprestaram contra seus estoques contam os prejuízos."
 spec_story.1.d_generic: "A corrida às mercadorias favoritas da temporada acabou. Preços que subiram durante um ano caíram em um mês, e as companhias lançadas no auge da febre não conseguem honrar suas contas. Comerciantes que compravam a qualquer preço ficaram com armazéns que não conseguem esvaziar, e os bancos que emprestaram contra seus estoques contam os prejuízos."
 spec_story.1.f: "“Há trinta anos negocio com [ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName], e nunca vi homens tão ávidos por comprar, nem tão desesperados por vender, como nestes últimos doze meses.”"
 spec_story.1.f_generic: "“Há trinta anos estou neste ramo, e nunca vi homens tão ávidos por comprar, nem tão desesperados por vender, como nestes últimos doze meses.”"
 spec_story.1.a: "Estendam a assistência aos produtores arruinados."
 spec_story.1.b: "Deixem as casas mais fracas falirem."
 spec_story.1.c: "Investiguem os promotores."
 spec_story.2.t: "Uma Fraude Revelada"
 spec_story.2.d: "Os diretores da Companhia de [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] de [ROOT.GetCountry.GetCapital.GetCityHubName] fugiram do país, e seus livros revelam que os generosos dividendos dos últimos dois anos foram pagos com novas subscrições. Milhares de escriturários, viúvas e lojistas possuíam suas ações. Todos os jornais de [ROOT.GetCountry.GetCapital.GetCityHubName] agora perguntam quantos outros prospectos saíram da mesma pena."
 spec_story.2.d_generic: "Os diretores de uma célebre sociedade por ações de [ROOT.GetCountry.GetCapital.GetCityHubName] fugiram do país, e seus livros revelam que os generosos dividendos dos últimos dois anos foram pagos com novas subscrições. Milhares de escriturários, viúvas e lojistas possuíam suas ações. Todos os jornais de [ROOT.GetCountry.GetCapital.GetCityHubName] agora perguntam quantos outros prospectos saíram da mesma pena."
 spec_story.2.f: "#bold Procurado por Acusação de Fraude#!\nO diretor-gerente da Companhia de [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] de [ROOT.GetCountry.GetCapital.GetCityHubName], de cerca de cinquenta anos, bem-vestido e de modos convincentes. Visto pela última vez nas docas."
 spec_story.2.f_generic: "#bold Procurado por Acusação de Fraude#!\nO diretor-gerente de uma sociedade por ações de [ROOT.GetCountry.GetCapital.GetCityHubName], de cerca de cinquenta anos, bem-vestido e de modos convincentes. Visto pela última vez nas docas."
 spec_story.2.a: "Processem os diretores."
 spec_story.2.b: "Abafem o caso."
 spec_story.2.c: "Indenizem os pequenos investidores."
 spec_story.3.t: "Corrida aos Bancos"
 spec_story.3.d: "Depositantes cercaram um dos bancos mais antigos de [ROOT.GetCountry.GetCapital.GetCityHubName] nesta manhã, e ao meio-dia suas portas já estavam fechadas. Suas notas são recusadas em toda a cidade, e as firmas que mantinham contas ali não conseguem pagar seus trabalhadores nesta semana. As filas diante de todos os outros bancos crescem a cada hora."
 spec_story.3.f: "“Meu pai guardava suas economias naquele banco, e o pai dele antes dele. Disseram-nos que era tão seguro quanto o Tesouro.”"
 spec_story.3.a: "Garantam seus depósitos."
 spec_story.3.b: "Deve se sustentar ou cair sozinho."
 spec_story.3.c: "Precisamos emprestar aos bancos."
 spec_story.4.t: "Pânico no país [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]"
 spec_story.4.t_generic: "Pânico Externo"
 spec_story.4.d: "Chegaram a [ROOT.GetCountry.GetCapital.GetCityHubName] notícias de um [concept_spec_financial_panic] no país [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName]. Seus bancos exigem a devolução dos empréstimos no exterior, e nossas firmas que vendiam ao país [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] ou tomavam empréstimos ali se veem de repente sem dinheiro. Todo comerciante na bolsa quer saber se a crise se espalhará."
 spec_story.4.d_generic: "Chegaram a [ROOT.GetCountry.GetCapital.GetCityHubName] notícias de um pânico financeiro no exterior. Bancos estrangeiros exigem a devolução de seus empréstimos, e nossas firmas que vendiam ou tomavam empréstimos além-mar se veem de repente sem dinheiro. Todo comerciante na bolsa quer saber se a crise se espalhará."
 spec_story.4.f: "“Quando o país [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] espirra, nossa bolsa cai de cama.”"
 spec_story.4.f_generic: "“Quando nossos vizinhos espirram, nossa bolsa cai de cama.”"
 spec_story.4.a: "Emprestem às nossas casas comerciais."
 spec_story.4.b: "Os problemas deles não são nossos."
 spec_story.4.c: "Culpem os banqueiros estrangeiros imprudentes."
 spec_story.5.t: "Confiança Retorna"
 spec_story.5.d: "O pior do pânico passou. As firmas que sobreviveram voltam a contratar braços, os bancos começaram a emprestar a clientes sólidos, e alguns investidores ousados compram ações por uma fração dos preços do ano passado. Ninguém espera uma volta rápida aos excessos de antes, mas os negócios em [ROOT.GetCountry.GetCapital.GetCityHubName] voltam a prosperar."
 spec_story.5.f: "“Os homens que venderam tudo na primavera estão comprando de volta no outono, e por menos do que receberam.”"
 spec_story.5.a: "Incentivem novos empreendimentos."
 spec_story.5.b: "Desta vez, os empréstimos devem ser sólidos."
 spec_story.6.t: "A Delegação dos Fabricantes"
 spec_story.6.d: "Uma delegação de fabricantes e comerciantes procurou o governo. Dizem que suas novas fábricas estão inacabadas por falta de crédito, enquanto seus rivais no exterior tomam empréstimos livremente e conquistam seus mercados. Pedem que os bancos voltem a ter permissão para emprestar."
 spec_story.6.f: "“Sua cautela, senhor, nos salvou de uma quebra ao garantir que nada restasse para quebrar.”"
 spec_story.6.a: "Flexibilizar crédito."
 spec_story.6.b: "O crédito continua restrito."
 spec_story.6.c: "Ofereçam-lhes um subsídio."
 spec_story.7.t: "A Febre das Ações"
 spec_story.7.d: "Escriturários, lojistas e professores lotam os cafés de [ROOT.GetCountry.GetCapital.GetCityHubName] para negociar ações de companhias que jamais viram. Ações de empreendimentos do setor de [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] trocam de mãos várias vezes ao dia, a maioria comprada com dinheiro emprestado. Diz-se que criados empenham suas economias para participar do próximo lançamento de ações."
 spec_story.7.d_generic: "Escriturários, lojistas e professores lotam os cafés de [ROOT.GetCountry.GetCapital.GetCityHubName] para negociar ações de companhias que jamais viram. Ações dos mais novos empreendimentos trocam de mãos várias vezes ao dia, a maioria comprada com dinheiro emprestado. Diz-se que criados empenham suas economias para participar do próximo lançamento de ações."
 spec_story.7.f: "“Meu barbeiro me deu uma dica sobre ações do setor de [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] nesta manhã. Aceitei e lhe dei outra em troca: venda.”"
 spec_story.7.f_generic: "“Meu barbeiro me deu uma dica sobre ações nesta manhã. Aceitei e lhe dei outra em troca: venda.”"
 spec_story.7.a: "Que o povo participe da riqueza."
 spec_story.7.b: "Proíbam negócios com dinheiro emprestado."
 spec_story.7.c: "Cobrem um imposto do selo sobre transferências de ações."
 spec_story.8.t: "Alertas de uma Bolha"
 spec_story.8.d: "Um respeitado economista escreveu ao principal jornal de [ROOT.GetCountry.GetCapital.GetCityHubName] que a alta dos setores de [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] e [ROOT.GetCountry.MakeScope.Var('spec_story_good2').GetGoods.GetName] não pode durar, e que os bancos emprestaram com base em preços que nenhum homem sensato pagaria. Os corretores dizem que são lamúrias de uma velha. Ainda assim, a carta é lida em voz alta em todos os clubes e escritórios comerciais da cidade."
 spec_story.8.d_generic: "Um respeitado economista escreveu ao principal jornal de [ROOT.GetCountry.GetCapital.GetCityHubName] que a alta das mercadorias mais cobiçadas do momento não pode durar, e que os bancos emprestaram com base em preços que nenhum homem sensato pagaria. Os corretores dizem que são lamúrias de uma velha. Ainda assim, a carta é lida em voz alta em todos os clubes e escritórios comerciais da cidade."
 spec_story.8.f: "“Um preço é apenas aquilo que o último comprador se dispôs a pagar. Peço aos meus leitores que considerem quantos compradores ainda restam.”"
 spec_story.8.a: "A advertência é oportuna."
 spec_story.8.b: "Tolices alarmistas."
