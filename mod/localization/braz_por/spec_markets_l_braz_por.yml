 spec_excess_bar: "Excesso Especulativo"
 concept_spec_speculative_excess: "Excesso Especulativo"
 concept_spec_speculative_excess_desc: "O $concept_spec_speculative_excess$ mede a bolha que se forma no [concept_market] de um [concept_country] durante uma expansão. Após a pesquisa de [GetTechnology('stock_exchange').GetName], ele cresce todo mês em que a [concept_spec_market_confidence] está em #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! ou mais, e tanto mais rápido quanto mais alta a $concept_spec_market_confidence$. Enquanto a $concept_spec_market_confidence$ fica entre #v 60#! e #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!, o excesso diminui #v 2%#! por mês.\n\nQuando a $concept_spec_market_confidence$ cai abaixo de #v 60#!, a bolha estoura e a $concept_spec_market_confidence$ cai ainda mais, em até #v [GetPlayer.MakeScope.ScriptValue('spec_burst_max')|0]#!. Quanto maior o $concept_spec_speculative_excess$, mais dura a queda."
 concept_spec_sound_finance: "Solidez Financeira"
 concept_spec_sound_finance_desc: "A $concept_spec_sound_finance$ é alcançada com a promulgação das três [concept_spec_banking_reforms]: Regras Monetárias, Emprestador de Última Instância e Lei das Companhias.\n\nQuando as três estiverem em vigor, o [concept_country] ganha #v 10#! de [concept_prestige] e paga #v 5%#! menos juros sobre seus [concept_loans]."
 concept_spec_banking_reforms: "Reformas Bancárias"
 concept_spec_banking_reform: "Reforma Bancária"
 concept_spec_banking_reforms_desc: "As $concept_spec_banking_reforms$ definem as regras pelas quais os bancos e as companhias de um [concept_country] operam. Cada uma é liberada por uma tecnologia e adotada por meio de uma Comissão de Inquérito, que pode se reunir após um [concept_spec_financial_panic] ou após #v 10#! anos sem nenhum. Cada comissão adota uma reforma.\n\n#bold Regras Monetárias#! ([GetTechnology('banking').GetName]), uma de duas:\n#bold Escola Monetária:#! $spec_reform_currency_tt$\n#bold Liberdade Bancária:#! $spec_reform_free_tt$\n\n#bold Emprestador de Última Instância#! ([GetTechnology('central_banking').GetName]): $spec_reform_llr_tt$\n\n#bold Lei das Companhias#! ([GetTechnology('joint_stock_companies').GetName]): $spec_reform_company_tt$\n\nAdotar as três garante a [concept_spec_sound_finance]."
 alert_spec_panic_risk_alert_name: "Risco: Pânico"
 spec_panic_risk_alert_setting_name: "Risco: Pânico"
 alert_spec_panic_risk_alert_desc: "Se nossas expansões terminassem agora, a [concept_spec_market_confidence] cairia para #N [GetPlayer.MakeScope.ScriptValue('spec_after_collapse')|0]#!, abaixo de #v [GetPlayer.MakeScope.ScriptValue('spec_panic_at')|0]#!, nível em que começa um [concept_spec_financial_panic]."
 alert_spec_panic_risk_alert_hint: "Contenha a especulação nas mercadorias mais arriscadas ou restrinja a [concept_spec_credit_policy] na aba #bold $SPEC_FIN_TAB_BANKING$#! da janela #bold $SPEC_FINANCE$#!."
