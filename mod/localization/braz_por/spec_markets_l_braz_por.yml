 spec_markets.2.f: "“Ontem eu valia quarenta mil. Hoje de manhã, valho meu casaco, e nem por ele me ofereceram grande coisa.”"
 spec_markets.2.a: "O mercado deve encontrar seu próprio piso."
 spec_markets.2.a.tt: "O [concept_spec_financial_panic] segue todo o seu curso, a menos que mais tarde decidamos #v Emprestar aos Bancos#!, o que também remove esta alteração de [concept_approval] de $ig_industrialists$"
 spec_markets.2.b: "Precisamos emprestar aos bancos."
 spec_markets.2.b.tt: "O [concept_spec_financial_panic] termina em até #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#! meses e seus efeitos são reduzidos à metade\nA [concept_spec_market_confidence] sobe em #v 20#!"
 spec_rescue_cost_tt: "[concept_treasury]: #N -@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_cost')|D]#!, cerca de #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#! do [concept_gdp]"
 spec_levy_tt: "[concept_treasury]: #P +@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_speculator_tax')|D]#!, cerca de #v 0.25%#! do [concept_gdp]"
