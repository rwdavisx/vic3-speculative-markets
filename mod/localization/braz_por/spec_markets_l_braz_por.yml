 spec_reform_company_tt: "Os desfechos das expansões custam #v 30%#! menos [concept_spec_market_confidence]"
 spec_reform.1.t: "Comissão de Inquérito"
 spec_reform.1.d_panic: "A comissão nomeada após o pânico entregou seu relatório: três volumes de depoimentos de banqueiros, corretores e depositantes arruinados. Seus membros concordam que o pânico não foi obra da Providência. Discordam de quase todo o resto, e cada remédio tem seus defensores na câmara."
 spec_reform.1.d_calm: "Com os mercados tranquilos, uma comissão passou o ano ouvindo banqueiros, corretores e economistas políticos sobre como impedir que a próxima expansão termine em ruína. Seu relatório propõe vários remédios, e cada um tem seus defensores na câmara."
 spec_reform.1.f: "“Em períodos de alarme desenfreado, uma falência provoca muitas outras, e a melhor maneira de evitar as falências decorrentes é deter a primeira, que lhes dá origem.”"
 spec_reform.1.a: "Vinculem a emissão de notas ao ouro nos cofres."
 spec_reform.1.b: "Permitam que todo banco sólido emita suas próprias notas."
 spec_reform.1.c: "Designem um emprestador de última instância."
 spec_reform.1.d: "Obriguem as companhias a publicar suas contas."
 spec_reform.1.e: "Agradeçam à comissão por seus trabalhos."
 spec_reform.2.t: "Solidez Financeira"
 spec_reform.2.d: "Nossos bancos emitem notas segundo regras, há um emprestador de prontidão quando o pânico chega, e nossas companhias devem mostrar aos investidores o que possuem e o que devem. No exterior, nossos títulos agora são vendidos com ágio, e [ROOT.GetCountry.GetCapital.GetCityHubName] é vista como um porto seguro para o capital."
 spec_reform.2.f: "“O primeiro dever de um banqueiro não é ganhar dinheiro, mas conservá-lo.”"
 spec_reform.2.a: "A confiança é o fundamento do crédito."
 SPEC_OFF: "Os investidores não especulam com o atual $ECONOMIC_SYSTEM_GC_LINK$."
