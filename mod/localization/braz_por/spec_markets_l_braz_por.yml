 concept_spec_market_confidence: "Confiança"
 concept_spec_market_confidence_desc: "A $concept_spec_market_confidence$ mede como os investidores veem o [concept_market] de um [concept_country], de #v 0#! (#v Pânico#!) a #v 100#! (#v Mania#!). O medo desacelera o investimento e eleva os juros de [concept_loans], enquanto a ganância acelera o investimento.\n\n[Concept('concept_good','$concept_goods|q$')] em expansão a elevam, enquanto [Concept('concept_spec_boom_end','$concept_spec_boom_ends|q$')], [Concept('concept_spec_foreign_panic','$concept_spec_foreign_panics|q$')], [Concept('concept_diplomatic_play','$concept_diplomatic_plays|q$')] e [concept_war] a reduzem. As expansões e seus desfechos são mais fortes onde $building_financial_district$ compõem uma parte maior da economia, e mais fracos onde $building_manor_house$ são mais numerosos.\n\nAcima de #v 55#!, os bancos emprestam ao [concept_investment_pool]; em #v 80#!, o mercado entra em [concept_spec_speculative_mania]; e abaixo de #v 25#!, começa um [concept_spec_financial_panic]."
 concept_spec_speculative_mania: "Mania Especulativa"
 concept_spec_speculative_mania_desc: "Um [concept_market] está em $concept_spec_speculative_mania$ enquanto a [concept_spec_market_confidence] está em #v 80#! ou mais. Os bancos concedem o máximo de empréstimos ao [concept_investment_pool], mas um [concept_spec_boom_end] custa mais $concept_spec_market_confidence$. Uma mania longa ou muito intensa aumenta, por alguns anos, o apoio aos [Concept('concept_political_movement','$concept_political_movements|q$')] favoráveis à lei [GetLawType('law_laissez_faire').GetName]."
 concept_spec_financial_panic: "Pânico Financeiro"
 concept_spec_financial_panics: "Pânicos Financeiros"
 concept_spec_financial_panic_desc: "Um $concept_spec_financial_panic$ começa quando a [concept_spec_market_confidence] cai abaixo do seu Limiar de Pânico de #v 25#!. Acima de #v 3#! meses de [concept_spec_leverage], o limiar sobe, até #v 65#!. Com pouca presença de $building_financial_district$, ele é menor, até #v 20#!.\n\nEle reduz o [concept_throughput] de todas as construções e os impostos arrecadados, custa ao [concept_treasury] assistência semanal aos desempregados até terminar, desacelera a [concept_private_construction] e o investimento, reduz o bônus de [concept_throughput] de [Concept('concept_company','$concept_companies|q$')], transforma alguns investidores em [Concept('concept_radical','$concept_radicals|q$')] e faz os bancos retirarem [concept_spec_outstanding_credit] do [concept_investment_pool].\n\nCada [concept_country] vinculado sofre um [concept_spec_foreign_panic], enquanto o dinheiro foge para [Concept('concept_great_power','$concept_great_powers|q$')] calmas em outros lugares. Por alguns anos depois, [Concept('concept_political_movement','$concept_political_movements|q$')] contra [GetLawType('law_laissez_faire').GetName] ganham apoio."
 concept_spec_foreign_panic: "Pânico Estrangeiro"
 concept_spec_foreign_panics: "Pânicos Estrangeiros"
 concept_spec_foreign_panic_desc: "Um $concept_spec_foreign_panic$ reduz a [concept_spec_market_confidence] de um [concept_country] quando um [concept_spec_financial_panic] começa em outro país vinculado a ele por um [concept_market] compartilhado, sujeição, direitos de investimento, comércio intenso ou propriedade de sua economia. Vínculos mais próximos causam perdas maiores. A lei [GetLawType('law_free_trade').GetName] fortalece os vínculos comerciais, e outras políticas comerciais os enfraquecem. Um [concept_embargo] rompe o vínculo comercial."
 concept_spec_boom_end: "Desfecho Especulativo"
 concept_spec_boom_ends: "Desfechos Especulativos"
 concept_spec_boom_end_desc: "Uma expansão termina quando o [concept_spec_investor_interest] numa [concept_good] recua após uma alta, e quanto mais alto chegou, mais forte é a queda: uma expansão que atingiu o pico em #v Interessado#! termina em uma [concept_spec_correction], uma que atingiu #v Ávido#! em uma [concept_spec_bust], e uma que atingiu #v Febril#! em um [concept_spec_collapse].\n\nCada desfecho reduz a [concept_spec_market_confidence], mais para expansões maiores e para [Concept('concept_good','$concept_goods|q$')] com maior parte do comércio do [concept_market]. Os investidores então se retraem enquanto a $concept_good$ se recupera, e onde uma [concept_company] a produz, seu setor perde [concept_throughput]. O pico usado como referência diminui um pouco a cada mês, de modo que uma expansão que esfria devagar termina de forma mais suave, ou sem nenhum $concept_spec_boom_end$."
 concept_spec_correction: "Correção"
 concept_spec_correction_desc: "Uma $concept_spec_correction$ é o [concept_spec_boom_end] mais brando. Ocorre quando o [concept_spec_investor_interest] em uma [concept_good] que atingiu #v Interessado#! recua para #v Hesitante#!.\n\nReduz um pouco a [concept_spec_market_confidence]. Os investidores então deixam de investir na $concept_good$ por #v 3#! meses e, onde uma [concept_company] a produz, sua indústria perde #N 2.5%#! de [concept_throughput] por #v 90#! dias, e #N 25%#! a mais para cada uma das tecnologias [GetTechnology('corporate_charters').GetName] e [GetTechnology('corporate_management').GetName] pesquisadas."
 concept_spec_bust: "Quebra"
 concept_spec_bust_desc: "Uma $concept_spec_bust$ é um [concept_spec_boom_end] mais severo que uma [concept_spec_correction]. Ocorre quando o [concept_spec_investor_interest] em uma [concept_good] que atingiu #v Ávido#! recua para #v Hesitante#!.\n\nReduz mais a [concept_spec_market_confidence], cerca de #v 2#! vezes o efeito de uma [concept_spec_correction] para a mesma expansão. Os investidores então deixam de investir na $concept_good$ por #v 6#! meses e, onde uma [concept_company] a produz, sua indústria perde #N 5%#! de [concept_throughput] por #v 180#! dias, e #N 25%#! a mais para cada uma das tecnologias [GetTechnology('corporate_charters').GetName] e [GetTechnology('corporate_management').GetName] pesquisadas."
 concept_spec_collapse: "Colapso"
 concept_spec_collapse_desc: "Um $concept_spec_collapse$ é o pior [concept_spec_boom_end]. Ocorre quando o [concept_spec_investor_interest] em uma [concept_good] que atingiu #v Febril#! cai até #v Em Fuga#!.\n\nReduz drasticamente a [concept_spec_market_confidence], cerca de #v 5#! vezes o efeito de uma [concept_spec_correction] para a mesma expansão. Os investidores então deixam de investir na $concept_good$ por #v 12#! meses e, onde uma [concept_company] a produz, sua indústria perde #N 10%#! de [concept_throughput] por um ano, e #N 25%#! a mais para cada uma das tecnologias [GetTechnology('corporate_charters').GetName] e [GetTechnology('corporate_management').GetName] pesquisadas. Um $concept_spec_collapse$ que atinja uma grande parcela do comércio do [concept_market] pode provocar um [concept_spec_financial_panic]."
 concept_spec_investor_interest: "Interesse"
 concept_spec_investor_interest_desc: "O $concept_spec_investor_interest$ é o quanto os investidores consideram atraentes as [Concept('concept_building','$concept_buildings|q$')] que produzem uma [concept_good]. Ele sobe enquanto o [concept_market_price] está acima da média de longo prazo e cai enquanto está abaixo, de #v Em Fuga#! a #v Febril#!.\n\nO [concept_throughput] dessas construções o acompanha, de #N -10%#! em #v Em Fuga#! a #P +8%#! em #v Febril#!, assim como a [concept_prosperity] das [Concept('concept_company','$concept_companies|q$')] que produzem a $concept_good$. Uma $concept_good$ em expansão eleva a [concept_spec_market_confidence]. Quando o interesse recua, a expansão termina em um [concept_spec_boom_end]."
 concept_spec_credit_policy: "Política Creditícia"
 concept_spec_credit_policy_tight: "Crédito Restrito"
 concept_spec_credit_policy_normal: "Crédito Normal"
 concept_spec_credit_policy_loose: "Crédito Flexível"
 concept_spec_credit_policy_desc: "A $concept_spec_credit_policy$ define com que liberdade os bancos emprestam ao [concept_investment_pool]. Ela exige [GetTechnology('central_banking').GetName] e pode ser $concept_spec_credit_policy_tight$, $concept_spec_credit_policy_normal$ ou $concept_spec_credit_policy_loose$. Crédito mais restrito desacelera o investimento e puxa a [concept_spec_market_confidence] para baixo quando ela está alta, enquanto crédito mais flexível aumenta o [concept_spec_outstanding_credit]. Alterá-la a bloqueia por #v 6#! meses."
 concept_spec_leverage: "Alavancagem de Crédito"
 concept_spec_leverage_desc: "A $concept_spec_leverage$ é o [concept_spec_outstanding_credit] de um [concept_country], medido em meses de renda do [concept_investment_pool].\n\nCada mês inteiro dá #P +2%#! de [concept_throughput], até #P +24%#!. Durante um [concept_spec_financial_panic] ou enquanto durarem as [concept_spec_bad_debts], ela diminui #N 2%#! por mês. Acima de #v 3#! meses, um [concept_spec_financial_panic] começa com [concept_spec_market_confidence] mais alta e deixa [concept_spec_bad_debts]."
 concept_spec_bad_debts: "Dívidas Incobráveis"
 concept_spec_bad_debts_desc: "As $concept_spec_bad_debts$ são perdas deixadas por um [concept_spec_financial_panic], que aumentam com a [concept_spec_leverage] acima de #v 3#! meses.\n\nCada ponto reduz o [concept_throughput] em #N 0.4%#! e o investimento em #N 0.75%#!. Elas se acumulam em #v 3#! pontos por mês e depois diminuem #v 0.6#! pontos por mês, levando cerca de #v 6#! anos para serem eliminadas no pior caso. Os bancos não emprestam enquanto elas durarem. #v Emprestar aos Bancos#! não as elimina. #v Comprar Créditos Podres#! as reduz à metade, uma vez enquanto durarem."
 concept_spec_lending_standards: "Critérios de Crédito"
 concept_spec_lending_standards_desc: "Os $concept_spec_lending_standards$ indicam o cuidado com que os bancos de um [concept_country] emprestam: #v Rigorosos#!, #v Cautelosos#!, #v Sólidos#!, #v Frouxos#! ou #v Imprudentes#!. Bancos mais frouxos emprestam mais ao [concept_investment_pool] e destinam mais disso às expansões, de modo que essas expansões terminam pior, e um Socorro Bancário custa mais.\n\nEles afrouxam um pouco a cada mês sem [concept_spec_financial_panic], de #v Rigorosos#! a #v Imprudentes#! em cerca de #v 20#! anos tranquilos, e mais após cada Socorro Bancário ou #v Comprar Créditos Podres#!. Eles se tornam mais rigorosos quando uma expansão termina e, sobretudo, quando um $concept_spec_financial_panic$ segue seu curso sem Socorro Bancário."
 concept_spec_outstanding_credit: "Crédito Pendente"
 concept_spec_outstanding_credit_desc: "O $concept_spec_outstanding_credit$ é o crédito que os bancos emprestaram ao [concept_investment_pool] e que ainda não foi quitado. Os bancos emprestam enquanto a [concept_spec_market_confidence] estiver acima de #v 55#!, até um Limite de Crédito de #v 3#! meses de renda do fundo. [GetTechnology('central_banking').GetName] acrescenta #v 5#! meses, e [GetTechnology('investment_banks').GetName] e [GetTechnology('international_exchange_standards').GetName] acrescentam #v 2#! cada.\n\nA cada mês, #v 2%#! é quitado pelo fundo. Quando começa um [concept_spec_financial_panic], parte dele é retirada.\n\n#lore Os bancos emprestaram com garantia de ações ferroviárias nos anos 1840, de algodão em 1837 e de terrenos em Viena em 1873, e foram apanhados quando essas expansões ruíram.#!"
