<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Speculative Markets - CMF Compatibility</title>
  <desc id="desc">Original cream and brass typography on a dark blue field, with linked Finance and CMF boxes identifying the separate compatibility patch.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17242f"/><stop offset="1" stop-color="#28363d"/></linearGradient>
    <linearGradient id="gold"><stop stop-color="#a77e41"/><stop offset=".5" stop-color="#ead29a"/><stop offset="1" stop-color="#a77e41"/></linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect x="25" y="25" width="750" height="750" rx="2" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <rect x="36" y="36" width="728" height="728" fill="none" stroke="#b69d68" stroke-opacity=".4"/>
  <path d="M25 96H96V25M704 25V96H775M25 704H96V775M704 775V704H775" fill="none" stroke="#d4b980" stroke-width="2"/>
  <g fill="#f2ead7" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="400" y="130" font-size="45" letter-spacing="2">SPECULATIVE</text>
    <text x="400" y="183" font-size="45" letter-spacing="7">MARKETS</text>
  </g>
  <path d="M153 219H647" stroke="url(#gold)" stroke-width="2"/>
  <g fill="none" stroke="#d4b980" stroke-width="2">
    <rect x="171" y="270" width="190" height="100" rx="8"/>
    <rect x="439" y="270" width="190" height="100" rx="8"/>
    <path d="M362 320H438M400 302V338" stroke-width="3"/>
  </g>
  <g fill="#ecdfc3" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" letter-spacing="2">
    <text x="266" y="330">FINANCE</text><text x="534" y="330">CMF</text>
  </g>
  <text x="400" y="516" text-anchor="middle" fill="#f8eed9" font-family="Georgia, 'Times New Roman', serif" font-size="126" font-weight="bold" letter-spacing="5">CMF</text>
  <text x="400" y="584" text-anchor="middle" fill="#d9bd82" font-family="Arial, sans-serif" font-size="42" letter-spacing="3">COMPATIBILITY</text>
  <path d="M154 630H646" stroke="url(#gold)" stroke-width="2"/>
  <text x="400" y="680" text-anchor="middle" fill="#f2ead7" font-family="Arial, sans-serif" font-size="24">Load after both mods</text>
  <text x="400" y="726" text-anchor="middle" fill="#bcc4c7" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">SEPARATE PATCH · FOR VICTORIA 3</text>
</svg>
