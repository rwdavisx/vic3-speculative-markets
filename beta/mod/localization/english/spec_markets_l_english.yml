 SPEC_COL_LEVER: "Intervention"
 SPEC_COL_LEVER_TT: "#header Market Interventions#!\n$TOOLTIP_DELIMITER$\nRestrain Speculation: interest held at #v Calm#!, its producers lose [concept_throughput] and pay a levy\nEncourage Investment: interest at least #v Keen#!, its producers gain [concept_throughput] and the state pays for it\n\nEach costs [concept_authority] every month until lifted, more for staples and for goods with a large share of the market's trade. Speculation can be restrained in #v Eager#! and #v Feverish#! goods, or a good whose boom would cost #v 2#! or more [concept_spec_market_confidence] if it ended. Investment can be encouraged in goods below #v Keen#!."
 SPEC_SEP_FEVERISH_TT: "#header @spec_interest_feverish! Feverish [concept_spec_investor_interest]#!\nShare of our trade: #v [Country.MakeScope.Var('spec_heat_6').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\nProducers' [concept_throughput]: #P +8%#!\n[concept_spec_market_confidence]: #P Rises#! each month, more for a larger share of trade, not during a [concept_spec_financial_panic]\nCan end as: [concept_spec_collapse]"
 SPEC_SEP_EAGER_TT: "#header @spec_interest_eager! Eager [concept_spec_investor_interest]#!\nShare of our trade: #v [Country.MakeScope.Var('spec_heat_5').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\nProducers' [concept_throughput]: #P +5%#!\n[concept_spec_market_confidence]: #P Rises#! each month, more for a larger share of trade, not during a [concept_spec_financial_panic]\nCan end as: [concept_spec_bust]"
 SPEC_SEP_KEEN_TT: "#header @spec_interest_keen! Keen [concept_spec_investor_interest]#!\nShare of our trade: #v [Country.MakeScope.Var('spec_heat_4').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\nProducers' [concept_throughput]: #P +3%#!\nCan end as: [concept_spec_correction]"
 SPEC_SEP_CALM_TT: "#header @spec_interest_calm! Calm [concept_spec_investor_interest]#!\nShare of our trade: #v [Country.MakeScope.Var('spec_heat_3').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\nNo effects"
 SPEC_SEP_DOUBTFUL_TT: "#header @spec_interest_doubtful! Doubtful [concept_spec_investor_interest]#!\nShare of our trade: #v [Country.MakeScope.Var('spec_heat_2').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\nProducers' [concept_throughput]: #N -5%#!\nAfter a boom ends, a recovering good is held here or lower for a while"
 SPEC_SEP_FLEEING_TT: "#header @spec_interest_fleeing! Fleeing [concept_spec_investor_interest]#!\nShare of our trade: #v [Country.MakeScope.Var('spec_heat_1').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\nProducers' [concept_throughput]: #N -10%#!\nA #v Feverish#! boom that falls this far ends in a [concept_spec_collapse]"
 SPEC_IB_TURNING_TT: "#header Boom Turning#!\n[Goods.GetName] has fallen from a large boom. If [concept_spec_investor_interest] keeps falling it ends in a [concept_spec_collapse], costing about #N [Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! [concept_spec_market_confidence]."
