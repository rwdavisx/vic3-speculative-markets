 concept_spec_exchange: "Exchange"
 concept_spec_exchange_desc: "A [concept_country]'s $concept_spec_exchange$ is where its shares, bonds and credit change hands. Its Standing follows its [Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')] score: #v Provincial#!, #v National#!, #v International#! (needs [GetTechnology('stock_exchange').GetName]) or #v World Centre#! (needs [GetTechnology('central_banking').GetName]). A higher Standing raises Investor Reaction to rising prices, and from #v International#! the Exchange receives [concept_spec_capital_flight].\n\nThe state grants its Exchange one charter: #v Commodity Exchange#!, #v Money Market#! or #v Share Market#!. An Exchange holds #v 1#! to #v 4#! specialities from the #v 7#! Paths to Renown, more as its Standing rises, and keeps each at least #v 5#! years.\n\nTrust rises in calm years under sound lending, and falls with [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')], [concept_spec_bad_debts] and a [concept_spec_bust] or [concept_spec_collapse] in a main good. Low trust raises the interest rate on [concept_loans] and high trust lowers it."
