 SPEC_RISK_4_ON: "#header Default Risk#!\nUp to #N -5#! [concept_spec_market_confidence] per month\n$TOOLTIP_DELIMITER$\n[concept_credit] used: #v [Country.MakeScope.Var('spec_default_risk').GetValueWithDefault('(CFixedPoint)0')|%0]#![AddLocalizationIf(Country.MakeScope.Var('spec_tm_broke').IsSet, 'SPEC_RISK_4_BROKE')]\n$TOOLTIP_DELIMITER$\nOver #v 100%#!: [concept_default], #N -5#! per month until it ends\nShown from #v 80%#!"
