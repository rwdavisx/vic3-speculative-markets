 SPEC_H_BANK_LENT_TT: "#header Where the Banks Have Lent#!\n$TOOLTIP_DELIMITER$\nBanks lend most new credit into booming goods: the larger a good's share of our trade and the higher its [concept_spec_investor_interest], the more it gets. A loan stays in its good until repaid.\n\nWhen a boom the banks lent into ends, [concept_spec_market_confidence] falls further. Restraining speculation in a good halves the new lending it attracts."
