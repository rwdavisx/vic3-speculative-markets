 notification_spec_bubble_burst_name: "The Bubble Bursts"
 notification_spec_bubble_burst_desc: "[concept_spec_market_confidence] has fallen too low to sustain our [concept_spec_speculative_excess]. The bubble has burst, and $concept_spec_market_confidence$ falls further."
 notification_spec_bubble_burst_tooltip: "#header $notification_spec_bubble_burst_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_bubble_burst_desc$"
 notification_spec_lev_unsafe_name: "Credit Leverage No Longer Safe"
 notification_spec_lev_unsafe_desc: "[concept_spec_leverage] has risen above #v 3#! months, the most that is safe. From here a [concept_spec_financial_panic] begins at higher [concept_spec_market_confidence] and leaves [concept_spec_bad_debts]."
