 SPEC_RISK_HELD_LINE: "\nRestrained booms: #v [Country.MakeScope.Var('spec_n_held').GetValueWithDefault('(CFixedPoint)0')|0]#!. Each winds down slowly as a [concept_spec_correction] instead of ending at once."
 SPEC_WHY_END_3: "#v x6#! from [concept_spec_collapse]"
 SPEC_WHY_END_2: "#v x2.5#! from [concept_spec_bust]"
 SPEC_WHY_END_1: "#v x1.25#! from [concept_spec_correction]"
 SPEC_WHY_CAP: "\nNo boom can take more than #N 40#! in a month."
 SPEC_WHY_FALLING: "\n\nInterest fell this month. If it keeps falling, the boom ends."
 SPEC_RISK_1_NONE: "#header Booms at Risk#!\nNo boom here would cost #v 1#! or more [concept_spec_market_confidence] if it ended."
