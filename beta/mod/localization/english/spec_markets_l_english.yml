 notification_spec_nearly_broke_name: "Treasury Running Out"
 notification_spec_nearly_broke_desc: "At this deficit we reach [concept_bankruptcy] in #v [GetPlayer.ScriptValue('spec_broke_weeks')|0]#! weeks. [concept_spec_market_confidence] slides until the budget recovers."
