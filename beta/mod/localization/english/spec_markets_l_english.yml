 concept_spec_long_depression: "Long Depression"
 concept_spec_long_depression_desc: "The $concept_spec_long_depression$ is a world economic crisis. It begins when a [concept_great_power] falls into a [concept_spec_financial_panic], reaches every country then in a panic, and spreads along close ties: a shared [concept_market], subjects and overlords, investment rights, heavy trade and foreign ownership.\n\nWorld Crash (#v 4#! months): credit freezes and [concept_spec_market_confidence] drains\nDepression (up to #v 5#! years): investment, construction and trade slow, and some pops become [Concept('concept_radical','$concept_radicals|q$')]\nRecovery (#v 1#! year): [concept_spec_market_confidence] returns\n\nEach government's choices speed its own and the world's recovery, and a [concept_great_power]'s count most."
