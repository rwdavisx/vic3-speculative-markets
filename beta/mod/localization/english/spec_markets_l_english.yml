 SPEC_CREDIT_LOCK: "\n\nChoosing it locks [concept_spec_credit_policy] for #v 6#! months."
 SPEC_EFFECT_GIVEN_TT: "#header Credit Lent This Month#!\n#v @money![Country.MakeScope.Var('spec_credit_given').GetValueWithDefault('(CFixedPoint)0')|D]#! this month\n$TOOLTIP_DELIMITER$\nLending rate: #v [SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_credit_rate'), '(CFixedPoint)0.01'), 'SPEC_CREDITW_0', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_credit_rate'), '(CFixedPoint)0.5'), 'SPEC_CREDITW_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_credit_rate'), '(CFixedPoint)1.15'), 'SPEC_CREDITW_2', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_credit_rate'), '(CFixedPoint)1.8'), 'SPEC_CREDITW_3', 'SPEC_CREDITW_4'))))]#!\n$ECONOMIC_SYSTEM_GC_LINK$: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_law_mult'), '(CFixedPoint)1')|+%0]#!\nFinance technologies: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_tech_credit'), '(CFixedPoint)1')|+%0]#!\n[concept_spec_credit_policy]: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_stance_credit'), '(CFixedPoint)1')|+%0]#!\n[concept_spec_banking_reforms]: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_reform_credit'), '(CFixedPoint)1')|+%0]#!\n[concept_spec_lending_standards]: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_credit'), '(CFixedPoint)1')|+%0]#!\n[concept_spec_exchange]: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_credit'), '(CFixedPoint)1')|+%0]#!\n\nBanks lend once a month while [concept_spec_market_confidence] is above #v 55#!, more as it rises. They lend nothing past the Lending Limit, below the Panic Threshold, during a [concept_spec_financial_panic] or the World Crash, while [concept_spec_bad_debts] last, or under [Concept('concept_spec_credit_policy','$concept_spec_credit_policy_tight|q$')].\n\nThe [concept_investment_pool] change is shown per week."
