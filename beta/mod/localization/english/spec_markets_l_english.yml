 SPEC_XS_CAP_TT: "#header Capital#!\n$TOOLTIP_DELIMITER$\nThe score begins from the capital our [concept_spec_exchange] draws on, growing as its square root: four times the capital doubles the score.\n\nOur own: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_own_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, six months of [concept_investment_pool] income, averaged over the past year\nFrom our ties: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_reach_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, a quarter of the capital of each smaller [concept_country] in our [concept_market], our [Concept('concept_subject','$concept_subjects|q$')], our [concept_power_bloc], or granting us [concept_foreign_investment] rights; at most as much as our own"
 SPEC_XS_WEALTH_TT: "#header Wealth per Head#!\n$TOOLTIP_DELIMITER$\nOur [concept_investment_pool] income per person is #v [Country.MakeScope.Var('spec_xs_ratio_v').GetValueWithDefault('(CFixedPoint)0')|2]#! times the world's. A rich people's savings make a deeper market: the square root of that, from #v x0.5#! to #v x2#!"
 SPEC_XS_TECH_TT: "#header Finance Technologies#!\n$TOOLTIP_DELIMITER$\nEach one researched raises the score:\n$banking$: #P +5%#!\n$stock_exchange$: #P +5%#!\n$central_banking$: #P +5%#!\n$joint_stock_companies$: #P +5%#!\n$mutual_funds$: #P +5%#!\n$investment_banks$: #P +10%#!\n$international_exchange_standards$: #P +10%#!\n$modern_financial_instruments$: #P +10%#!\n\n[GetTechnology('stock_exchange').GetName] is needed to stand #v International#!, [GetTechnology('central_banking').GetName] to stand #v World Centre#!"
 SPEC_XS_ECON_TT: "#header Economic System#!\n$TOOLTIP_DELIMITER$\nOur economic system multiplies the score:\n$law_laissez_faire$: #P x1.15#!\n$law_interventionism$: #P x1.05#!\n$law_agrarianism$: #N x0.95#!\n$law_traditionalism$: #N x0.9#!\n$law_extraction_economy$: #N x0.9#!\n$law_command_economy$: #N x0.75#!\n$law_cooperative_ownership$: #N x0.6#!"
