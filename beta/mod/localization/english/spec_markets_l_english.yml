 SPEC_RISK_SLIGHT: "#header Risk of a $SPEC_UNWIND$#!\n[concept_spec_market_confidence] if the boom ends: #v Slight#!\n$TOOLTIP_DELIMITER$\n$SPEC_UNWIND_DESC$"
 SPEC_RISK_GLUT: "#header Recovering#!\n$TOOLTIP_DELIMITER$\n[Goods.GetName] is recovering after its last boom ended. Investors hold back, keeping [concept_spec_investor_interest] at #v Doubtful#! for a while."
 SPEC_RISK_CALM: "#header No Boom#!\n$TOOLTIP_DELIMITER$\n[Goods.GetName] has had no recent boom. Once [concept_spec_investor_interest] reaches #v Keen#! or higher, a fall back to #v Doubtful#! ends the boom, and the higher it went, the harder it falls."
 SPEC_UNWIND_3: "Collapse"
 SPEC_UNWIND_C_3: "[concept_spec_collapse]"
 SPEC_UNWIND_DESC_3: "This [concept_good] has had a boom that reached #v Feverish#!. If its price trend falls below #v [Divide_CFixedPoint('(CFixedPoint)-4.988', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!, [concept_spec_investor_interest] turns #v Fleeing#! and the boom ends in a [concept_spec_collapse]. Investors then hold back for #v 12#! months. The risk fades as the boom ages."
 SPEC_UNWIND_2: "Bust"
 SPEC_UNWIND_C_2: "[concept_spec_bust]"
 SPEC_UNWIND_DESC_2: "This [concept_good] has had a boom that reached #v Eager#!. If its price trend falls below #v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!, [concept_spec_investor_interest] turns #v Doubtful#! and the boom ends in a [concept_spec_bust]. Investors then hold back for #v 6#! months. The risk fades as the boom ages."
 SPEC_UNWIND_1: "Correction"
 SPEC_UNWIND_C_1: "[concept_spec_correction]"
 SPEC_UNWIND_DESC_1: "This [concept_good] has had a boom that reached #v Keen#!. If its price trend falls below #v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!, [concept_spec_investor_interest] turns #v Doubtful#! and the boom ends in a [concept_spec_correction]. Investors then hold back for #v 3#! months. The risk fades as the boom ages."
 spec_map_tt: "#header [SCOPE.sCountry('spec_map_owner').GetName]#!\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)6'), 'SPEC_MAP_STAGE_6', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)5'), 'SPEC_MAP_STAGE_5', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)4'), 'SPEC_MAP_STAGE_4', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)3'), 'SPEC_MAP_STAGE_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)2'), 'SPEC_MAP_STAGE_2', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)1'), 'SPEC_MAP_STAGE_1', 'SPEC_MAP_STAGE_0'))))))]\n[concept_spec_market_confidence]: #v [SCOPE.sCountry('spec_map_owner').MakeScope.Var('spec_conf').GetValue|0]#!"
