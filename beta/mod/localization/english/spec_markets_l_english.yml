 concept_spec_financial_centres: "Leading Exchanges"
 concept_spec_financial_centre_desc: "The $concept_spec_financial_centres$ are the #v 5#! [Concept('concept_country','$concept_countries|q$')] with the highest [Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')] score, ranked each month. The score grows with the square root of #v 6#! months of [concept_investment_pool] income, and with trust, wealth per head, Financial Districts, companies, finance technologies, [concept_rank] and economic system. The average of the top three is shown as #v 100#!.\n\nFirst place: #P +10%#! [concept_prestige], #P -10%#! [concept_loans] interest rate, #P +5#! months of Lending Limit\nLast place (#v 5#!): #P +2%#!, #P -2%#!, #P +1#! month\nThe Lending Limit bonus needs [GetTechnology('central_banking').GetName] and Lending Standards #v Sound#! or stricter"
