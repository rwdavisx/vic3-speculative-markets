 concept_spec_market_confidence: "Market Confidence"
 concept_spec_market_confidence_desc: "$concept_spec_market_confidence$ measures how investors view the [concept_market] of a [concept_country], from #v 0#! (#v Panic#!) to #v 100#! (#v Mania#!). Fear slows investment and raises the interest on [concept_loans], while greed speeds investment up.\n\nBooming [Concept('concept_good','$concept_goods|q$')] raise it, while [Concept('concept_spec_boom_end','$concept_spec_boom_ends|q$')], [Concept('concept_spec_foreign_panic','$concept_spec_foreign_panics|q$')], [Concept('concept_diplomatic_play','$concept_diplomatic_plays|q$')] and [concept_war] lower it. Booms and their endings are stronger where $building_financial_district$ make up more of the economy, and weaker where $building_manor_house$ outnumber them.\n\nAbove #v 55#! banks lend into the [concept_investment_pool], at #v 80#! the market enters [concept_spec_speculative_mania], and below #v 25#! a [concept_spec_financial_panic] begins."
 concept_spec_speculative_mania: "Speculative Mania"
 concept_spec_speculative_mania_desc: "A [concept_market] is in $concept_spec_speculative_mania$ while [concept_spec_market_confidence] is at #v 80#! or more. Banks lend the most into the [concept_investment_pool], but a [concept_spec_boom_end] costs more $concept_spec_market_confidence$. A long or very high mania gives [Concept('concept_political_movement','$concept_political_movements|q$')] that favor [GetLawType('law_laissez_faire').GetName] more support for some years."
 concept_spec_financial_panic: "Financial Panic"
 concept_spec_financial_panics: "Financial Panics"
 concept_spec_financial_panic_desc: "A $concept_spec_financial_panic$ begins when [concept_spec_market_confidence] falls below its Panic Threshold of #v 25#!. Past #v 3#! months of [concept_spec_leverage] the threshold rises, up to #v 65#!. With few $building_financial_district$ it is lower, down to #v 20#!.\n\nIt cuts every building's [concept_throughput] and the taxes collected, costs the [concept_treasury] relief for the jobless each week until it ends, slows [concept_private_construction] and investment, lowers the [concept_throughput] bonus of [Concept('concept_company','$concept_companies|q$')], turns some investors into [Concept('concept_radical','$concept_radicals|q$')], and makes banks withdraw [concept_spec_outstanding_credit] from the [concept_investment_pool].\n\nEach linked [concept_country] suffers a [concept_spec_foreign_panic], while money flees to calm [Concept('concept_great_power','$concept_great_powers|q$')] elsewhere. For some years after, [Concept('concept_political_movement','$concept_political_movements|q$')] against [GetLawType('law_laissez_faire').GetName] gain support."
 concept_spec_foreign_panic: "Foreign Panic"
 concept_spec_foreign_panics: "Foreign Panics"
 concept_spec_foreign_panic_desc: "A $concept_spec_foreign_panic$ lowers [concept_spec_market_confidence] in a [concept_country] when a [concept_spec_financial_panic] begins in a country tied to it by a shared [concept_market], subjecthood, investment rights, heavy trade or ownership of its economy. Closer ties cause larger losses. [GetLawType('law_free_trade').GetName] strengthens trade ties and other trade policies weaken them. An [concept_embargo] cuts the trade tie."
 concept_spec_boom_end: "Boom Ending"
 concept_spec_boom_ends: "Boom Endings"
 concept_spec_boom_end_desc: "A boom ends when [concept_spec_investor_interest] in a [concept_good] falls back after a rise, and the higher it went, the harder it falls: a boom that peaked at #v Keen#! ends in a [concept_spec_correction], one that peaked at #v Eager#! in a [concept_spec_bust], and one that peaked at #v Feverish#! in a [concept_spec_collapse].\n\nEach lowers [concept_spec_market_confidence], more for larger booms and for [Concept('concept_good','$concept_goods|q$')] with a larger share of the [concept_market]'s trade. Investors then hold back while the $concept_good$ recovers, and where a [concept_company] makes it, its industry loses [concept_throughput]. The peak it is measured from fades a little each month, so a boom that cools slowly ends more gently, or without a $concept_spec_boom_end$ at all."
 concept_spec_correction: "Correction"
 concept_spec_correction_desc: "A $concept_spec_correction$ is the mildest [concept_spec_boom_end]. It happens when [concept_spec_investor_interest] in a [concept_good] that peaked at #v Keen#! falls back to #v Doubtful#!.\n\nIt lowers [concept_spec_market_confidence] slightly. Investors then hold back from the $concept_good$ for #v 3#! months, and where a [concept_company] makes it, its industry loses #N 2.5%#! [concept_throughput] for #v 90#! days, #N 25%#! more for each of [GetTechnology('corporate_charters').GetName] and [GetTechnology('corporate_management').GetName] researched."
 concept_spec_bust: "Bust"
 concept_spec_bust_desc: "A $concept_spec_bust$ is a harsher [concept_spec_boom_end] than a [concept_spec_correction]. It happens when [concept_spec_investor_interest] in a [concept_good] that peaked at #v Eager#! falls back to #v Doubtful#!.\n\nIt lowers [concept_spec_market_confidence] more, about #v 2#! times as much as a [concept_spec_correction] for the same boom. Investors then hold back from the $concept_good$ for #v 6#! months, and where a [concept_company] makes it, its industry loses #N 5%#! [concept_throughput] for #v 180#! days, #N 25%#! more for each of [GetTechnology('corporate_charters').GetName] and [GetTechnology('corporate_management').GetName] researched."
 concept_spec_collapse: "Collapse"
 concept_spec_collapse_desc: "A $concept_spec_collapse$ is the worst [concept_spec_boom_end]. It happens when [concept_spec_investor_interest] in a [concept_good] that peaked at #v Feverish#! falls all the way to #v Fleeing#!.\n\nIt lowers [concept_spec_market_confidence] sharply, about #v 5#! times as much as a [concept_spec_correction] for the same boom. Investors then hold back from the $concept_good$ for #v 12#! months, and where a [concept_company] makes it, its industry loses #N 10%#! [concept_throughput] for a year, #N 25%#! more for each of [GetTechnology('corporate_charters').GetName] and [GetTechnology('corporate_management').GetName] researched. A $concept_spec_collapse$ in a large share of the [concept_market]'s trade can tip it into a [concept_spec_financial_panic]."
 concept_spec_investor_interest: "Investor Interest"
 concept_spec_investor_interest_desc: "$concept_spec_investor_interest$ is how attractive investors find the [Concept('concept_building','$concept_buildings|q$')] producing a [concept_good]. It rises while the [concept_market_price] is above its long-run average and falls while it is below, from #v Fleeing#! to #v Feverish#!.\n\nThe [concept_throughput] of those buildings follows it, from #N -10%#! at #v Fleeing#! to #P +8%#! at #v Feverish#!, and so does the [concept_prosperity] of [Concept('concept_company','$concept_companies|q$')] making the $concept_good$. A booming $concept_good$ raises [concept_spec_market_confidence]. When interest falls back, the boom ends in a [concept_spec_boom_end]."
 concept_spec_credit_policy: "Credit Policy"
 concept_spec_credit_policy_tight: "Tight Credit"
 concept_spec_credit_policy_normal: "Normal Credit"
 concept_spec_credit_policy_loose: "Loose Credit"
 concept_spec_credit_policy_desc: "$concept_spec_credit_policy$ sets how freely banks lend into the [concept_investment_pool]. It requires [GetTechnology('central_banking').GetName] and can be $concept_spec_credit_policy_tight$, $concept_spec_credit_policy_normal$ or $concept_spec_credit_policy_loose$. Tighter credit slows investment and pulls [concept_spec_market_confidence] down when it runs high, while looser credit adds to [concept_spec_outstanding_credit]. Changing it locks it for #v 6#! months."
 concept_spec_leverage: "Credit Leverage"
 concept_spec_leverage_desc: "$concept_spec_leverage$ is the [concept_spec_outstanding_credit] of a [concept_country], measured in months of [concept_investment_pool] income.\n\nEach whole month gives #P +2%#! [concept_throughput], up to #P +24%#!. During a [concept_spec_financial_panic] or while [concept_spec_bad_debts] remain it fades by #N 2%#! per month. Beyond #v 3#! months, a [concept_spec_financial_panic] begins at higher [concept_spec_market_confidence] and leaves [concept_spec_bad_debts]."
 concept_spec_bad_debts: "Bad Debts"
 concept_spec_bad_debts_desc: "$concept_spec_bad_debts$ are losses left by a [concept_spec_financial_panic], increasing with [concept_spec_leverage] above #v 3#! months.\n\nEach point reduces [concept_throughput] by #N 0.4%#! and investment by #N 0.75%#!. They build up by #v 3#! points per month, then decline by #v 0.6#! points per month, taking about #v 6#! years to clear at their worst. Banks will not lend while they remain. #v Lend to the Banks#! does not clear them. #v Buy Up Bad Loans#! halves them, once while they last."
 concept_spec_lending_standards: "Lending Standards"
 concept_spec_lending_standards_desc: "$concept_spec_lending_standards$ are how carefully the banks of a [concept_country] lend: #v Strict#!, #v Cautious#!, #v Sound#!, #v Lax#! or #v Reckless#!. Laxer banks lend more into the [concept_investment_pool] and more of it into booms, so those booms end harder, and a Bank Rescue costs more.\n\nThey loosen a little in each month without a [concept_spec_financial_panic], from #v Strict#! to #v Reckless#! in about #v 20#! quiet years, and more after each Bank Rescue or #v Buy Up Bad Loans#!. They tighten when a boom ends, and most of all when a $concept_spec_financial_panic$ runs its course without a Bank Rescue."
 concept_spec_outstanding_credit: "Outstanding Credit"
 concept_spec_outstanding_credit_desc: "$concept_spec_outstanding_credit$ is the credit banks have lent into the [concept_investment_pool] and not yet been repaid. Banks lend while [concept_spec_market_confidence] is above #v 55#!, up to a Lending Limit of #v 3#! months of pool income. [GetTechnology('central_banking').GetName] adds #v 5#! months, and [GetTechnology('investment_banks').GetName] and [GetTechnology('international_exchange_standards').GetName] add #v 2#! each.\n\nEach month #v 2%#! is repaid from the pool. When a [concept_spec_financial_panic] begins, part of it is withdrawn.\n\n#lore Banks lent against railway shares in the 1840s, cotton in 1837 and building land in Vienna in 1873, and were caught when those booms broke.#!"
