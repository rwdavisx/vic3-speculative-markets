 SPEC_EFFECT_LAX_VALUE: "#v [SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.2'), 'SPEC_LAXW_0', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.4'), 'SPEC_LAXW_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.6'), 'SPEC_LAXW_2', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.8'), 'SPEC_LAXW_3', 'SPEC_LAXW_4'))))]#!"
 SPEC_EFFECT_LAX_TT: "#header [concept_spec_lending_standards]#!\n$SPEC_EFFECT_LAX_VALUE$\n$TOOLTIP_DELIMITER$\nCredit lent each month: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_credit'), '(CFixedPoint)1')|+%0]#!\nShare of it lent into booms: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_pull'), '(CFixedPoint)1')|+%0]#!\nBank Rescue cost: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_cost'), '(CFixedPoint)1')|+%0]#!\n$TOOLTIP_DELIMITER$\nBanks grow careless in years without losses, and after each Bank Rescue. They grow careful again only by taking losses: when a boom ends, and most of all when a [concept_spec_financial_panic] runs its course without a Bank Rescue.\n\n#title To keep them careful:#!\n- Set [concept_spec_credit_policy] to Tight: they stop growing careless\n- Restrain booms before they end badly\n- Let a panic run without a Bank Rescue, or Suspend the Bank Act less often\n\nLevels: #v Strict#!, #v Cautious#!, #v Sound#!, #v Lax#!, #v Reckless#!"
 SPEC_TILE_CYCLE: "[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_overx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_OVER_ON', 'SPEC_GOODS_NONE')][SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_bb_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_TILE_BB_ON', 'SPEC_GOODS_NONE')]"
 SPEC_TILE_OVER_ON: "\n\n#title Overbuilding:#! supply is up #v [Country.MakeScope.Var(Concatenate('spec_ui_over_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! since this boom began\nIf its boom ended, [concept_spec_market_confidence] would fall #v x[Country.MakeScope.Var(Concatenate('spec_ui_overx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|2]#! as far"
 SPEC_TILE_BB_ON: "\n\n#title Boom Construction:#! #P +[Country.MakeScope.Var(Concatenate('spec_ui_bb_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! construction efficiency for its industry while investors stay this keen"
 SPEC_NOTE_CYCLE: "[SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)2.5'), 'SPEC_NOTE_PPL_3', SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)1.5'), 'SPEC_NOTE_PPL_2', SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)0.5'), 'SPEC_NOTE_PPL_1', 'SPEC_GOODS_NONE')))]"
 SPEC_NOTE_OVER_ON: " So much had been built during the boom that the fall was #N x[SCOPE.GetValue('spec_note_over')|2]#! as hard."
