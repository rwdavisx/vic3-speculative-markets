 spec_excess_bar: "Speculative Excess"
 concept_spec_speculative_excess: "Speculative Excess"
 concept_spec_speculative_excess_desc: "$concept_spec_speculative_excess$ measures the bubble building in a [concept_country]'s [concept_market] during a boom. Once [GetTechnology('stock_exchange').GetName] has been researched, it grows in each month that [concept_spec_market_confidence] is at #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! or more, and grows faster the higher $concept_spec_market_confidence$ climbs. While $concept_spec_market_confidence$ stays between #v 60#! and #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!, it cools by #v 2%#! per month.\n\nWhen $concept_spec_market_confidence$ falls below #v 60#!, the bubble bursts and $concept_spec_market_confidence$ falls further, by up to #v [GetPlayer.MakeScope.ScriptValue('spec_burst_max')|0]#!. The higher the $concept_spec_speculative_excess$, the harder the fall."
 concept_spec_sound_finance: "Sound Finance"
 concept_spec_sound_finance_desc: "$concept_spec_sound_finance$ is achieved by enacting all three [concept_spec_banking_reforms]: Banknote Rules, a Lender of Last Resort and Company Law.\n\nOnce all three are enacted, the [concept_country] gains #v 10#! [concept_prestige] and pays #v 5%#! less interest on its [concept_loans]."
 concept_spec_banking_reforms: "Banking Reforms"
 concept_spec_banking_reform: "Banking Reform"
 concept_spec_banking_reforms_desc: "$concept_spec_banking_reforms$ set the rules by which a [concept_country]'s banks and companies operate. Each becomes available with a technology and is enacted through a Commission of Inquiry, which can sit after a [concept_spec_financial_panic] or after #v 10#! years without one. Each commission enacts one reform.\n\n#bold Banknote Rules#! ([GetTechnology('banking').GetName]), one of two:\n#bold Currency School:#! $spec_reform_currency_tt$\n#bold Free Banking:#! $spec_reform_free_tt$\n\n#bold Lender of Last Resort#! ([GetTechnology('central_banking').GetName]): $spec_reform_llr_tt$\n\n#bold Company Law#! ([GetTechnology('joint_stock_companies').GetName]): $spec_reform_company_tt$\n\nEnacting all three achieves [concept_spec_sound_finance]."
 alert_spec_panic_risk_alert_name: "Panic Risk"
 spec_panic_risk_alert_setting_name: "Panic Risk"
 alert_spec_panic_risk_alert_desc: "If our booms ended now, [concept_spec_market_confidence] would fall to #N [GetPlayer.MakeScope.ScriptValue('spec_after_collapse')|0]#!, below the #v [GetPlayer.MakeScope.ScriptValue('spec_panic_at')|0]#! where a [concept_spec_financial_panic] begins."
 alert_spec_panic_risk_alert_hint: "Restrain Speculation in the goods most at risk, or tighten [concept_spec_credit_policy] in the #bold $SPEC_FIN_TAB_BANKING$#! tab of the #bold $SPEC_FINANCE$#! window."
 alert_spec_panic_risk_alert_action: "Journal"
 alert_spec_bubble_alert_name: "Speculative Excess"
 spec_bubble_alert_setting_name: "Speculative Excess"
 alert_spec_bubble_alert_desc: "Our [concept_spec_speculative_excess] stands at #v [GetPlayer.MakeScope.Var('spec_heat').GetValue|0]#!. When [concept_spec_market_confidence] falls back below #v 60#!, the bubble bursts and [concept_spec_market_confidence] falls a further #N [GetPlayer.MakeScope.ScriptValue('spec_burst_now')|0]#!."
 alert_spec_bubble_alert_hint: "The bubble grows each month [concept_spec_market_confidence] is at #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! or more, and cools while it stays between #v 60#! and that. Restraining booming goods or tightening [concept_spec_credit_policy] brings it down gently."
 alert_spec_bubble_alert_action: "Journal"
 alert_spec_rescue_alert_name: "Bank Rescue Available"
 spec_rescue_alert_setting_name: "Bank Rescue Available"
 alert_spec_rescue_alert_desc: "A [concept_spec_financial_panic] is under way and we have not yet lent to the banks."
 alert_spec_rescue_alert_hint: "#v Lend to the Banks#! shortens the panic, halves its effects and raises [concept_spec_market_confidence] by #P +20#!. Once per panic, from the #bold $SPEC_FIN_TAB_BANKING$#! tab of the #bold $SPEC_FINANCE$#! window."
 alert_spec_rescue_alert_action: "Journal"
 alert_spec_bailout_alert_name: "Buy Up Bad Loans Available"
 spec_bailout_alert_setting_name: "Buy Up Bad Loans Available"
 alert_spec_bailout_alert_desc: "[concept_spec_bad_debts] are holding back [concept_throughput] and investment, and the state has not yet bought up bad loans."
 alert_spec_bailout_alert_hint: "#v Buy Up Bad Loans#! halves the remaining [concept_spec_bad_debts] for #v @money![GetPlayer.MakeScope.ScriptValue('spec_bailout_cost')|D]#!, once while they last, from the #bold $SPEC_FIN_TAB_BANKING$#! tab of the #bold $SPEC_FINANCE$#! window."
 alert_spec_bailout_alert_action: "Journal"
