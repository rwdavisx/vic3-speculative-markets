 spec_excess_cooling: "Cooling while [concept_spec_market_confidence] stays below #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!"
 spec_finance_bar: "Sound Finance"
 spec_finance_bar_desc: "[concept_spec_sound_finance]: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#! of #v 3#! [concept_spec_banking_reforms]"
 spec_inquiry_no_panic_tt: "No [concept_spec_financial_panic] is under way"
 spec_inquiry_reform_tt: "Our technology allows a [Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')] not yet enacted"
 spec_suspend_panic_tt: "A [concept_spec_financial_panic] is under way"
 spec_suspend_note_tt: "Banknote Rules follow the Currency School"
 spec_inquiry_when_tt: "A [concept_spec_financial_panic] ended within the last year and no inquiry has sat since, or #v 10#! years have passed without a panic (#v [ROOT.GetCountry.MakeScope.ScriptValue('spec_calm_left')|0]#! months to go)"
 spec_convert_conf_tt: "[concept_spec_market_confidence] is at least #v 60#!"
 spec_convert_debt_tt: "Our debt is at least #v 20%#! of our [concept_credit] limit"
 spec_convert_cd_tt: "The debt has not been converted in the last #v 10#! years"
 spec_convert_conf_cost_tt: "[concept_spec_market_confidence] falls by #v 5#!"
 spec_relief_when_tt: "A [concept_spec_financial_panic] or the [concept_spec_long_depression] is under way"
 spec_relief_cd_tt: "No Relief Works in the last #v 12#! months"
 spec_suspend_tt: "The [concept_spec_financial_panic] ends within #v 2#! months, at full strength until then\n[concept_spec_market_confidence] rises by #v 15#!\nFor #v 10#! years the [concept_spec_speculative_excess] builds #v 50%#! faster\n[concept_spec_lending_standards] loosen, as after a Bank Rescue"
 spec_suspend_act: "Suspend the Bank Act"
 spec_suspend_act_desc: "Let the bank lend beyond the limit the Act sets on its notes. The panic subsides within months at no cost to the treasury, but investors learn that the government will always step in. Counts as #v Lend to the Banks#! for this panic.\n\n#lore Britain suspended its Bank Charter Act in 1847, 1857 and 1866.#!"
 spec_relief_works_button: "Relief Works"
 spec_relief_works_button_desc: "Pay for public works and relief while the slump lasts: welfare, more construction and fewer radicals for #v 12#! months, at a weekly cost that grows with our [concept_gdp]."
 spec_convert_debt: "Convert the National Debt"
 spec_convert_debt_desc: "While investors are buoyant, swap our loans for new ones at a lower rate. Bondholders who lived on the old interest will not thank us."
 spec_inquiry: "Commission of Inquiry"
 spec_inquiry_desc: "Appoint a commission to hear bankers, brokers and ruined depositors and report on how our banks and companies should be run. Its report enacts one [Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')] our technology allows. Its sittings take up the government's attention for #v 6#! months."
 spec_debt_converted: "Converted Debt"
 spec_debt_converted_desc: "Loans converted to a lower rate while investors were eager to lend"
 spec_relief_works: "Relief Works"
 spec_relief_works_desc: "Public works and relief for those the slump has thrown out of work"
 spec_relief_costs: "Relief Works Costs"
 spec_relief_costs_desc: "The cost of the Relief Works"
 spec_act_suspended: "Bank Act Suspended"
 spec_act_suspended_desc: "The government set aside its own law to end a panic"
 spec_inquiry_sitting: "Commission of Inquiry"
 spec_inquiry_sitting_desc: "A commission is hearing evidence on the last panic"
 spec_sound_finance: "Sound Finance"
 spec_sound_finance_desc: "Currency, banks and companies run by rules investors trust"
 spec_rentiers_cut: "Rentier Income Cut"
 spec_relief_thanks: "Relief Works"
 spec_dear_money: "Dear Money"
 spec_free_issue: "Free Banking"
 spec_disclosure_burden: "Disclosure Rules"
 spec_disclosure_welcomed: "Disclosure Rules"
 spec_reform_currency_tt: "Banks lend #v 25%#! less, the [concept_spec_speculative_excess] builds #v 25%#! slower, and [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')] last #v 25%#! longer\nAllows suspending the Bank Act in a panic"
 spec_reform_free_tt: "Banks lend #v 25%#! more, booms are #v 10%#! larger, and their endings cost #v 10%#! more [concept_spec_market_confidence]"
 spec_reform_llr_tt: "#v Lend to the Banks#! costs #v 50%#! less and ends the panic a month sooner"
 spec_reform_company_tt: "Boom endings cost #v 30%#! less [concept_spec_market_confidence]"
 spec_reform.1.t: "Commission of Inquiry"
 spec_reform.1.d_panic: "The commission appointed after the panic has delivered its report: three volumes of testimony from bankers, brokers and ruined depositors. Its members agree that the panic was no act of God. On almost everything else they disagree, and each remedy has its champions in the chamber."
 spec_reform.1.d_calm: "With the markets quiet, a commission has spent the year hearing bankers, brokers and political economists on how to keep the next boom from ending in ruin. Its report sets out several remedies, and each has its champions in the chamber."
 spec_reform.1.f: ""In wild periods of alarm, one failure makes many, and the best way to prevent the derivative failures is to arrest the primary failure which causes them.""
 spec_reform.1.a: "Bind the issue of notes to the gold in the vaults."
 spec_reform.1.b: "Let every sound bank issue its own notes."
 spec_reform.1.c: "Name a lender of last resort."
 spec_reform.1.d: "Make companies publish their accounts."
 spec_reform.1.e: "Thank the commission for its labors."
 spec_reform.2.t: "Sound Finance"
 spec_reform.2.d: "Our banks issue their notes by rule, a lender stands ready when panic strikes, and our companies must show investors what they own and what they owe. Abroad, our bonds now sell at a premium, and [ROOT.GetCountry.GetCapital.GetCityHubName] is spoken of as a safe harbour for capital."
 spec_reform.2.f: ""A banker's first duty is not to make money but to keep it.""
 spec_reform.2.a: "Confidence is the foundation of credit."
