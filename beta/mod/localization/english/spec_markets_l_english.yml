 SPEC_RISKS_TT: "#header Risks#!\n$TOOLTIP_DELIMITER$\nWhat could cost [concept_spec_market_confidence] if things go wrong. Unlike pressures, these have not happened yet.\n\nBooms at Risk: our booms ending in a [concept_spec_boom_end]\nPanic Risk: a [concept_spec_financial_panic] spreading from a [concept_country] tied to ours\nWar Risk: a [concept_diplomatic_play] becoming a war\nDefault Risk: our debt reaching our [Concept('concept_credit','$concept_credit_limit|q$')]"
 SPEC_RISK_1: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_risk_top').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_RISK_1_V', 'SPEC_CHIP_ZERO')]"
 SPEC_RISK_1_V: "#N -[Min_CFixedPoint(Country.MakeScope.Var('spec_risk_top').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)55'))|0]#!"
