 je_spec_markets: "Financial Markets"
 je_spec_markets_reason: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)6'), 'SPEC_JE_STAGE_6', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)5'), 'SPEC_JE_STAGE_5', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)4'), 'SPEC_JE_STAGE_4', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)3'), 'SPEC_JE_STAGE_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)2'), 'SPEC_JE_STAGE_2', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)1'), 'SPEC_JE_STAGE_1', 'SPEC_JE_STAGE_0'))))))]\n\n#bold [concept_spec_banking_reforms]:#! [SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_reform_count'), '(CFixedPoint)0'), 'SPEC_JE_NONE', 'SPEC_JE_INST_NONE')][SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_currency_v'), '(CFixedPoint)0'), 'SPEC_JE_INST_CURRENCY', 'SPEC_JE_NONE')][SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_free_v'), '(CFixedPoint)0'), 'SPEC_JE_INST_FREE', 'SPEC_JE_NONE')][SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_llr_v'), '(CFixedPoint)0'), 'SPEC_JE_INST_LLR', 'SPEC_JE_NONE')][SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_company_v'), '(CFixedPoint)0'), 'SPEC_JE_INST_COMPANY', 'SPEC_JE_NONE')]\n\nThe #bold $SPEC_FINANCE$#! window shows the details."
 SPEC_JE_STAGE_6: "The [concept_spec_long_depression] hangs over [JournalEntry.GetCountry.GetCapital.GetCityHubName]. Investors hoard what they have and lend to no one, and each recovery so far has faltered within months. Its own journal entry tracks the world's recovery.\n\nRelief Works put the unemployed to building and keep them fed while it lasts."
 SPEC_JE_STAGE_5: "Panic has gripped [JournalEntry.GetCountry.GetCapital.GetCityHubName]. Depositors queue outside the banks from first light, loans are called in, and [concept_private_construction] is halved for #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! more months unless the government acts.\n\n#v Lend to the Banks#! ends it sooner and halves its effects. Relief Works put the unemployed to building and keep them fed.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_currency_v'), '(CFixedPoint)0'), 'SPEC_JE_SUSPEND_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_4: "The panic has passed, leaving failed houses and half-built works behind it. Investors are counting their losses, and no new panic can start for #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic_cooldown').GetValue|0]#! months.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_reform_open_v'), '(CFixedPoint)0'), 'SPEC_JE_INQUIRY_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_3: "The exchange in [JournalEntry.GetCountry.GetCapital.GetCityHubName] has gone mad. Clerks and widows buy shares in #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! and #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! with borrowed money, and every month that [concept_spec_market_confidence] stands at #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#! or more adds to the [concept_spec_speculative_excess]. When [concept_spec_market_confidence] falls below #v 60#! the bubble bursts, and the higher the excess, the harder the fall.\n\nRestraining speculation in the hottest goods, or tightening credit, lets the air out slowly."
 SPEC_JE_STAGE_2: "Money is easy and investors are buoyant. New companies in #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! and #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! are oversubscribed within the hour, and the banks lend freely against their shares. With [concept_spec_market_confidence] at #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#! or more, the [concept_spec_speculative_excess] starts to build.\n\nGood times are also the moment to convert the national debt to a lower rate."
 SPEC_JE_STAGE_1: "Trade on the exchange in [JournalEntry.GetCountry.GetCapital.GetCityHubName] is orderly. Investors favor #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! and #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! and shun #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! and #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!."
 SPEC_JE_STAGE_0: "Investors in [JournalEntry.GetCountry.GetCapital.GetCityHubName] are wary. Burned by recent losses, they keep their money close and shun #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! and #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!. Loose credit, or encouraging investment in a good, can coax them back."
