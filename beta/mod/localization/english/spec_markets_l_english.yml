 je_spec_depression_reason: "Panics on the great exchanges have become a world crisis. Investment and building have slowed, trade has fallen, and the unemployed grow restless. The [concept_spec_long_depression] ends when the world has recovered, or after #v 5#! years at the most.\n\nOur choices hasten our own recovery and the world's, and those of [Concept('concept_great_power','$concept_great_powers|q$')] count for more. Once our own recovery is complete, [concept_spec_market_confidence] returns here before it returns elsewhere."
