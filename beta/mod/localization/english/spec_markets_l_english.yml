 SPEC_EXCESS_ON: "[concept_spec_speculative_excess]: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#![SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_burst_now'), '(CFixedPoint)0'), 'SPEC_EXCESS_COST', 'SPEC_JE_NONE')]"
 SPEC_EXCESS_COST: ", a fall now costs #N [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_burst_now')|0]#! [concept_spec_market_confidence]"
 SPEC_EXCESS_OFF: "[concept_spec_speculative_excess]: none without a [GetTechnology('stock_exchange').GetName]"
