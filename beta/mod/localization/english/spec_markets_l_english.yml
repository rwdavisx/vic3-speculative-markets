 SPEC_DRIVER_RESTRAIN_TT: "#header Restrained Booms: [Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] from Booms Let Down This Month\n#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#! from [concept_spec_market_conditions]\n$TOOLTIP_DELIMITER$\nA restrained boom is let down slowly, as a [concept_spec_correction], instead of ending in one fall. It costs a little each month."
 SPEC_DRIVER_CAUTION_TT: "#header Government and Events: [Country.MakeScope.Var('spec_c_caution').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\nA one-off change this month from our decisions and from market events."
 SPEC_DRIVER_LIMIT_TT: "#header Floor and Ceiling: [Country.MakeScope.Var('spec_c_limit').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_market_confidence] cannot go below #v 0#! or above #v 100#!, so this much of this month's change did not count."
 SPEC_DRIVER_RESCUE_TT: "#header Bank Rescue: [Country.MakeScope.Var('spec_c_rescue').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\nA one-off rise from #v Lend to the Banks#! or #v Suspend the Bank Act#!. It cannot take [concept_spec_market_confidence] above #v 100#!."
 SPEC_DRIVER_RESCUE: "Bank Rescue"
 SPEC_DRIVER_WAREND: "End of War"
 SPEC_DRIVER_WAREND_TT: "#header End of War: [Country.MakeScope.Var('spec_c_warend').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#v x[Country.MakeScope.Var('spec_war_stakes_now').GetValueWithDefault('(CFixedPoint)0')|%0]#! of the Full Effect, from Our [concept_casualties]\n$TOOLTIP_DELIMITER$\nThe full effect, by how the war ended:\nWon, with a [concept_war_goal] enforced: #P +4#!\nWon, with nothing enforced: #P +1#!\nLost, with a [concept_war_goal] enforced against us: #N -8#!\nLost, with nothing enforced: #N -2#!\nNeither side won: #N -1#!\n\nScaled by our losses: at least #v 25%#! of the effect, and all of it once the war cost #v 25%#! of our forces."
 SPEC_DRIVER_BURST: "Bubble Bursts"
 SPEC_DRIVER_BURST_TT: "#header Bubble Bursts: [Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0'), Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_burst_per_heat'), '(CFixedPoint)-1'))|0]#! from [concept_spec_speculative_excess]\n#N -[Country.MakeScope.ScriptValue('spec_burst_per_heat')|2]#! for each point\nHeld to #N -[Country.MakeScope.ScriptValue('spec_burst_max')|0]#!\n$TOOLTIP_DELIMITER$\nWhen [concept_spec_market_confidence] falls below #v 60#! after a boom that took it above #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#!, the bubble bursts. The longer and higher the boom ran, the larger the loss.\n\nOnly a country with a [GetTechnology('stock_exchange').GetName] builds bubbles."
 SPEC_DRIVER_CAUTION: "Government and Events"
 SPEC_DRIVER_RESTRAIN: "Restrained Booms"
 SPEC_DRIVER_LIMIT: "Floor and Ceiling"
 SPEC_DRIVER_BOOM: "Booming Goods"
 SPEC_DRIVER_BOOM_TT: "#header Booming Goods: [Country.MakeScope.Var('spec_c_boom').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] from #v [Country.MakeScope.Var('spec_n_boom').GetValueWithDefault('(CFixedPoint)0')|0]#! Booming [Concept('concept_good','$concept_goods|q$')][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_BOOM_CAP')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_steady'), '(CFixedPoint)1')), 'SPEC_BOOM_STEADY')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_fin_boom'), '(CFixedPoint)1')), 'SPEC_BOOM_FIN')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_boom_rule'), '(CFixedPoint)1')), 'SPEC_BOOM_RULE')]\n$TOOLTIP_DELIMITER$\nEach boom adds to [concept_spec_market_confidence] by its share of the [concept_market]. No effect during a [concept_spec_financial_panic]. [GetTechnology('stock_exchange').GetName] and [GetTechnology('investment_banks').GetName] make booms larger, as does [GetTechnology('modern_financial_instruments').GetName]."
 SPEC_BOOM_CAP: "\nHeld to #v +3#! before multipliers"
 SPEC_BOOM_STEADY: "\n#v x[Country.MakeScope.ScriptValue('spec_steady')|2]#! from Manor Houses"
 SPEC_BOOM_FIN: "\n#v x[Country.MakeScope.ScriptValue('spec_fin_boom')|2]#! from Finance Technologies"
 SPEC_BOOM_RULE: "\n#v x[Country.MakeScope.ScriptValue('spec_boom_rule')|2]#! from Market Volatility"
 SPEC_DRIVER_CRASH: "Ended Booms"
 SPEC_DRIVER_CRASH_TT: "#header Ended Booms:[Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\nLargest in the latest month: #v [Country.MakeScope.Var('spec_crashed').GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] from the Size of the Booms That Ended\n#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#! from [concept_spec_market_conditions][AddLocalizationIf(Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-40')), 'SPEC_CRASH_CAP')]\n$TOOLTIP_DELIMITER$\nEach [concept_spec_boom_end] lowers [concept_spec_market_confidence]. The larger the boom and its share of the [concept_market], the larger the loss. [GetTechnology('mutual_funds').GetName] lessens it; [GetTechnology('modern_financial_instruments').GetName] adds to it."
 SPEC_CRASH_CAP: "\nHeld to #N -40#! per month"
 SPEC_DRIVER_FOREIGN: "Foreign Panics"
 SPEC_FOREIGN_HIT: "\n#N -20#! from a [concept_spec_foreign_panic]\n#v x[Country.MakeScope.Var('spec_fh_size').GetValueWithDefault('(CFixedPoint)0')|2]#! from Their Economy against Ours\n#v x[Country.MakeScope.Var('spec_fh_tie').GetValueWithDefault('(CFixedPoint)0')|2]#! from Our [concept_spec_market_tie]\n#v x[Country.MakeScope.Var('spec_fh_reach').GetValueWithDefault('(CFixedPoint)0')|2]#! from Their [concept_rank][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_foreign_loss_mult'), '(CFixedPoint)1')), 'SPEC_FOREIGN_UNSTD')]"
 SPEC_FOREIGN_UNSTD: "\n#v x[Country.MakeScope.ScriptValue('spec_foreign_loss_mult')|2]#! from No [GetTechnology('currency_standards').GetName]"
 SPEC_FOREIGN_FLIGHT: "\n[Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')|+=2] from [concept_spec_capital_flight]"
 SPEC_DRIVER_FOREIGN_TT: "#header Foreign Panics: [Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\nMost recent: #v [Country.MakeScope.Var('spec_foreign_src').GetCountry.GetName]#!\n$TOOLTIP_DELIMITER$[AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_HIT')][AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_FLIGHT')]\n$TOOLTIP_DELIMITER$\nSame [concept_market]: #v [Country.MakeScope.ScriptValue('spec_tie_market')|%0]#!\nSubject or overlord: #v 80%#!\nForeign investment rights: #v [Country.MakeScope.ScriptValue('spec_tie_investment')|%0]#!\nHeavy trade between markets: #v [Country.MakeScope.ScriptValue('spec_tie_trade')|%0]#!\nForeign ownership of our economy: up to #v 90%#!\n\nA [concept_spec_financial_panic] in a [concept_country] tied to ours lowers [concept_spec_market_confidence] here, more the closer the [concept_spec_market_tie] and the larger their economy against ours. A [concept_great_power] passes on the full loss, a major power half and smaller countries little. A panic caught from abroad does not spread further. Without [GetTechnology('currency_standards').GetName], the loss is a quarter larger."
 SPEC_DRIVER_TURMOIL: "War and Unrest"
 SPEC_DRIVER_TURMOIL_TT: "#header War and Unrest: [Country.MakeScope.Var('spec_c_turmoil').GetValueWithDefault('(CFixedPoint)0')|+=2]#!$SPEC_ITEMS_TURMOIL$\n$TOOLTIP_DELIMITER$\nEach [concept_war], from [concept_spec_war_news]: #N -3#! to #P +0.15#! per month\nAll wars together: #N -4#! to #P +0.5#! per month\n[concept_diplomatic_play] short of war: #N -0.5#! per month\nTreasury running out: up to #N -3#! per month, from #v 20#! weeks before [concept_bankruptcy]\n[concept_default]: #N -5#! per month\n[concept_revolution]: #N -2#! per month\n\nHover a number to see why."
 SPEC_DRIVER_MOOD: "Market Mood"
 SPEC_DRIVER_MOOD_TT: "#header Market Mood: [Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0')|+=2] from This Month's Shift\n[Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0'))|+=2] from Last Month's Mood\n$TOOLTIP_DELIMITER$\n[concept_spec_market_mood] shifts by chance each month, up to #v 0.75#! either way, and #v 75%#! of it carries over to the next month."
 SPEC_DRIVER_DRIFT: "Return to Baseline"
 SPEC_DRIVER_DRIFT_TT: "#header Return to Baseline: [Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0'), Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100'))|+=1] from the distance to [concept_spec_baseline] (#v 55#!)\n#v x[Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100')|%1]#! recovered per month\n$TOOLTIP_DELIMITER$\n[GetTechnology('macroeconomics').GetName] speeds this up by half."
 SPEC_DRIVER_TIGHT: "Tight Credit"
 SPEC_DRIVER_GROWTH: "Growth"
 SPEC_DRIVER_GROWTH_TT: "#header Growth: [Country.MakeScope.Var('spec_c_growth').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#v [Country.MakeScope.Var('spec_growth').GetValueWithDefault('(CFixedPoint)0')|=+%1]#! from [concept_gdp] against Its Recent Average\n#v -2%#! from Normal Growth\n$TOOLTIP_DELIMITER$\nEach #v 1%#! of growth above or below normal moves [concept_spec_market_confidence] by #v 0.1#! per month, up to #v 0.6#! either way."
 SPEC_DRIVER_BUSINESS: "Business Mood"
 SPEC_DRIVER_BUSINESS_TT: "#header Business Mood: [Country.MakeScope.Var('spec_c_business').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\nIndustrialists' [concept_approval]: #v [Country.MakeScope.ScriptValue('spec_ind_approval')|0]#!\n\nLoyal (#v 10#! or more): #P +0.4#! per month\nHappy (#v 5#! or more): #P +0.2#! per month\nUnhappy (#v -5#! or less): #N -0.2#! per month\nAngry (#v -10#! or less): #N -0.4#! per month"
 SPEC_DRIVER_TIGHT_TT: "#header Tight Credit: [Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.1')|1]#! of [concept_spec_market_confidence] above #v 60#!\n#N -10%#! of it per month, from [Concept('concept_spec_credit_policy','$concept_spec_credit_policy_tight|q$')]\n$TOOLTIP_DELIMITER$\nThis cools a boom over months rather than at once."
 concept_spec_market_conditions: "Market Conditions"
 concept_spec_market_conditions_desc: "$concept_spec_market_conditions$ set how much [concept_spec_market_confidence] a [concept_spec_boom_end] costs. The higher $concept_spec_market_confidence$ stands when a boom ends, the greater the loss. With $concept_spec_market_confidence$ at #v 55#!, they have no effect. Financial Districts, Manor Houses and finance technologies also change them."
 concept_spec_baseline: "Baseline Confidence"
 concept_spec_baseline_desc: "Left alone, [concept_spec_market_confidence] drifts back to its $concept_spec_baseline$ of #v 55#!, from above or below. The further it has strayed, the faster it returns."
 concept_spec_market_mood: "Market Mood"
 concept_spec_market_mood_desc: "$concept_spec_market_mood$ is the swing in investors' feelings with no single cause. Each month it shifts by chance, by up to #v 0.75#! either way, and #v 75%#! of it carries over, so good and bad spells last a while before they fade."
 concept_spec_market_tie: "Market Tie"
 concept_spec_market_tie_desc: "A $concept_spec_market_tie$ is how closely one [concept_country] follows another's [concept_market]. It sets how much of a [concept_spec_financial_panic] passes between them.\n\nOwnership counts once a country owns #v 10%#! of the other's [concept_gdp], and is strongest at #v 30%#!. [GetLawType('law_free_trade').GetName] strengthens the trade tie and other trade policies weaken it. [GetTechnology('international_exchange_standards').GetName] strengthens market and investment ties. An [concept_embargo] cuts the trade tie."
 concept_spec_capital_flight: "Capital Flight"
 concept_spec_capital_flight_desc: "When a [concept_spec_financial_panic] begins, money flees to safety. Each [concept_great_power], and each [concept_country] whose [concept_spec_exchange] is #v International#! or higher, gains up to #P +[GetPlayer.MakeScope.ScriptValue('spec_flight_gain_max')|0]#! [concept_spec_market_confidence] if it is at peace, at #v Steady#! or better, and not tied to the country in panic. [GetTechnology('international_trade').GetName] and [GetTechnology('international_exchange_standards').GetName] raise the gain. The higher an [concept_spec_exchange] stands, the more it receives."
 concept_spec_war_news: "War News"
 concept_spec_war_news_desc: "Investors follow a [concept_war] month by month. $concept_spec_war_news$ moves [concept_spec_market_confidence] each month by how it is going: [concept_casualties], [concept_blockade], [concept_devastation], falling [concept_gdp] and a long war lower it, while winning [Concept('concept_battle','$concept_battles|q$')] and holding enemy land raise it. Each war moves it by #N -3#! to #P +0.15#! per month, and all wars together by #N -4#! to #P +0.5#!."
