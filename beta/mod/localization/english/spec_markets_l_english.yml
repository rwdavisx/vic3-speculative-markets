 SPEC_RISK_3_ON: "#header War Risk#!\nUp to #N -[Country.MakeScope.Var('spec_war_risk').GetValueWithDefault('(CFixedPoint)0')|1]#! [concept_spec_market_confidence] per month\n$TOOLTIP_DELIMITER$\n#v [Country.MakeScope.Var('spec_wr_n').GetValueWithDefault('(CFixedPoint)0')|0]#! [Concept('concept_diplomatic_play','$concept_diplomatic_plays|q$')] that could become wars\n#N -0.6#! for each, from an average war#indent_newline:3 [AddLocalizationIf(Country.MakeScope.Var('spec_wr1').IsSet, 'SPEC_ITEM_WR_1')][AddLocalizationIf(Country.MakeScope.Var('spec_wr2').IsSet, 'SPEC_ITEM_WR_2')][AddLocalizationIf(Country.MakeScope.Var('spec_wr3').IsSet, 'SPEC_ITEM_WR_3')]#!\n$TOOLTIP_DELIMITER$\nA war that goes badly costs more. See [concept_spec_war_news]."
 SPEC_ITEM_WR_1: "\nAgainst #v [Country.MakeScope.Var('spec_wr1').GetCountry.GetName]#!: #N -0.6#!"
