l_spanish:
 rule_spec_market_volatility: "Volatilidad bursátil"
 setting_spec_volatility_historical: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_spec_volatility_historical_desc Histórica#!#!"
 setting_spec_volatility_historical_desc: "Los auges especulativos y los episodios de [Concept('concept_spec_financial_panic', '$concept_spec_financial_panics|q$')] ocurrirán con una frecuencia similar a la del siglo XIX"
 setting_spec_volatility_heightened: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_spec_volatility_heightened_desc #high Alta#!#!#!"
 setting_spec_volatility_heightened_desc: "Los auges especulativos crecerán más y terminarán más bruscamente, y los episodios de [Concept('concept_spec_financial_panic', '$concept_spec_financial_panics|q$')] serán más frecuentes que en el siglo XIX"
 rule_spec_market_impact: "Impacto bursátil"
 setting_spec_impact_flavor: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_spec_impact_flavor_desc Ambientación#!#!"
 setting_spec_impact_flavor_desc: "@spec_leverage! [Concept('concept_spec_leverage', '$concept_spec_leverage|q$')] y [Concept('concept_spec_financial_panic', '$concept_spec_financial_panics|q$')] afectarán menos a la economía, aproximadamente dos quintas partes de lo normal"
 setting_spec_impact_standard: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_spec_impact_standard_desc Normal#!#!"
 setting_spec_impact_standard_desc: "@spec_leverage! [Concept('concept_spec_leverage', '$concept_spec_leverage|q$')] y [Concept('concept_spec_financial_panic', '$concept_spec_financial_panics|q$')] afectarán a la economía tal como pretende el mod"
 setting_spec_impact_strong: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_spec_impact_strong_desc #high Fuerte#!#!#!"
 setting_spec_impact_strong_desc: "@spec_leverage! [Concept('concept_spec_leverage', '$concept_spec_leverage|q$')] y [Concept('concept_spec_financial_panic', '$concept_spec_financial_panics|q$')] afectarán más a la economía, aproximadamente tres quintas partes más"
