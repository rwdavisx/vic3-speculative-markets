 setting_spec_impact_strong: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_spec_impact_strong_desc #high Stark#!#!#!"
 setting_spec_impact_strong_desc: "@spec_leverage! [Concept('concept_spec_leverage', '$concept_spec_leverage|q$')] und [Concept('concept_spec_financial_panic', '$concept_spec_financial_panics|q$')] wirken sich stärker auf Ihre Wirtschaft aus, etwa drei Fünftel mehr"
