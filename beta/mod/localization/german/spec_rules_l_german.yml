 setting_spec_impact_flavor_desc: "@spec_leverage! [Concept('concept_spec_leverage', '$concept_spec_leverage|q$')] und [Concept('concept_spec_financial_panic', '$concept_spec_financial_panics|q$')] wirken sich weniger auf Ihre Wirtschaft aus, etwa zwei Fünftel so stark"
 setting_spec_impact_standard: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_spec_impact_standard_desc Standard#!#!"
