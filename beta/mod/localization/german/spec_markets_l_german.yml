 je_spec_markets_reason: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)6'), 'SPEC_JE_STAGE_6', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)5'), 'SPEC_JE_STAGE_5', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)4'), 'SPEC_JE_STAGE_4', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)3'), 'SPEC_JE_STAGE_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)2'), 'SPEC_JE_STAGE_2', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)1'), 'SPEC_JE_STAGE_1', 'SPEC_JE_STAGE_0'))))))]\n\n#bold [concept_spec_banking_reforms]:#! [SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_reform_count'), '(CFixedPoint)0'), 'SPEC_JE_NONE', 'SPEC_JE_INST_NONE')][SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_currency_v'), '(CFixedPoint)0'), 'SPEC_JE_INST_CURRENCY', 'SPEC_JE_NONE')][SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_free_v'), '(CFixedPoint)0'), 'SPEC_JE_INST_FREE', 'SPEC_JE_NONE')][SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_llr_v'), '(CFixedPoint)0'), 'SPEC_JE_INST_LLR', 'SPEC_JE_NONE')][SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_company_v'), '(CFixedPoint)0'), 'SPEC_JE_INST_COMPANY', 'SPEC_JE_NONE')]\n\nDas Fenster #bold $SPEC_FINANCE$#! zeigt die Einzelheiten."
 SPEC_JE_STAGE_6: "Die [concept_spec_long_depression] lastet auf [JournalEntry.GetCountry.GetCapital.GetCityHubName]. Anleger horten, was sie haben, und leihen niemandem etwas, und jede bisherige Erholung ist binnen Monaten ins Stocken geraten. Ein eigener Journaleintrag verfolgt die Erholung der Welt.\n\nNotstandsarbeiten verschaffen den Arbeitslosen Arbeit am Bau und halten sie satt, solange sie andauert."
 SPEC_JE_STAGE_5: "Panik hat [JournalEntry.GetCountry.GetCapital.GetCityHubName] erfasst. Sparer stehen ab dem Morgengrauen vor den Banken Schlange, Kredite werden gekündigt, und [concept_private_construction] ist für #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! weitere Monate halbiert, sofern die Regierung nicht handelt.\n\n#v Banken Kredit gewähren#! beendet sie früher und halbiert ihre Auswirkungen. Notstandsarbeiten verschaffen den Arbeitslosen Arbeit am Bau und halten sie satt.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_currency_v'), '(CFixedPoint)0'), 'SPEC_JE_SUSPEND_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_4: "Die Panik ist vorüber. Sie hat bankrotte Handelshäuser und halbfertige Fabriken hinterlassen. Anleger zählen ihre Verluste, und für #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic_cooldown').GetValue|0]#! Monate kann keine neue Panik beginnen.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_reform_open_v'), '(CFixedPoint)0'), 'SPEC_JE_INQUIRY_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_3: "Die Börse in [JournalEntry.GetCountry.GetCapital.GetCityHubName] hat den Verstand verloren. Schreiber und Witwen kaufen mit geliehenem Geld Aktien für #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! und #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#!, und jeder Monat, in dem [concept_spec_market_confidence] bei #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#! oder mehr steht, lässt [concept_spec_speculative_excess] wachsen. Sinkt [concept_spec_market_confidence] unter #v 60#!, platzt die Blase, und je größer der Überschwang, desto tiefer der Fall.\n\nDie Spekulation bei den begehrtesten Waren einzudämmen oder die Kredite zu verknappen, lässt die Luft langsam entweichen."
 SPEC_JE_STAGE_2: "Geld ist billig und Anleger sind zuversichtlich. Neue Kompanien für #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! und #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! sind binnen einer Stunde überzeichnet, und die Banken verleihen bereitwillig Geld gegen deren Aktien. Liegt [concept_spec_market_confidence] bei #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#! oder mehr, beginnt [concept_spec_speculative_excess] zu wachsen.\n\nGute Zeiten bieten auch Gelegenheit, die Staatsschulden zu einem niedrigeren Zinssatz umzuschulden."
 SPEC_JE_STAGE_1: "Der Börsenhandel in [JournalEntry.GetCountry.GetCapital.GetCityHubName] verläuft geordnet. Anleger bevorzugen #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! und #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! und meiden #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! und #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!."
 SPEC_JE_STAGE_0: "Anleger in [JournalEntry.GetCountry.GetCapital.GetCityHubName] sind vorsichtig. Durch die jüngsten Verluste gewarnt, halten sie ihr Geld zusammen und meiden #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! und #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!. Eine lockere Kreditpolitik oder die Förderung von Investitionen in eine Ware kann sie zurücklocken."
