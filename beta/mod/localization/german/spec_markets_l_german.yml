 SPEC_RIVAL_RULE: "Jedes Jahr gewinnt die Börse mit mehr Punkten ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]) #P 5%#! Vertrauen und die andere verliert #N 5%#!, oder #N 7.5%#!, wenn die beiden Länder schlechte oder schlechtere Beziehungen haben (vor Auswirkungen auf Vertrauensverluste). Dies gilt für beide, gleich wer wen benannt hat.\nBenennbar: ein Markt mit unserer Stellung oder der darüber, mit mindestens unserer Punktzahl. Ein Weltzentrum benennt keinen Rivalen.\nIn einer [concept_spec_financial_panic] fließt fliehendes Geld zuerst zum Rivalen.\nEin Bündnis, ein Verteidigungspakt oder Investitionsrechte zwischen beiden beenden die Rivalität."
