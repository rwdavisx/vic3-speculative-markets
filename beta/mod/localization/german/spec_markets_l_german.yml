 SPEC_XS_CAP_TT: "#header Kapital#!\n$TOOLTIP_DELIMITER$\nDie Punktzahl beruht auf dem Kapital, auf das unsere [concept_spec_exchange] zurückgreift, und wächst mit dessen Quadratwurzel: Das vierfache Kapital verdoppelt die Punktzahl.\n\nEigenes: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_own_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, sechs Monate Einkommen des [concept_investment_pool], gemittelt über das vergangene Jahr\nAus unseren Bindungen: #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_reach_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, ein Viertel des Kapitals von jedem kleineren [concept_country], das in unserem [concept_market] liegt, unser [Concept('concept_subject','$concept_subjects|q$')] ist, unserem [concept_power_bloc] angehört oder uns Rechte für [concept_foreign_investment] gewährt; höchstens so viel wie das eigene"
 SPEC_XS_WEALTH_TT: "#header Wohlstand pro Kopf#!\n$TOOLTIP_DELIMITER$\nUnser Einkommen des [concept_investment_pool] pro Kopf beträgt das #v [Country.MakeScope.Var('spec_xs_ratio_v').GetValueWithDefault('(CFixedPoint)0')|2]#!-Fache des Weltdurchschnitts. Die Ersparnisse eines reichen Volkes machen einen Markt tiefer: die Quadratwurzel davon, von #v x0.5#! bis #v x2#!"
 SPEC_XS_TECH_TT: "#header Finanztechnologien#!\n$TOOLTIP_DELIMITER$\nJede erforschte erhöht die Punktzahl:\n$banking$: #P +5%#!\n$stock_exchange$: #P +5%#!\n$central_banking$: #P +5%#!\n$joint_stock_companies$: #P +5%#!\n$mutual_funds$: #P +5%#!\n$investment_banks$: #P +10%#!\n$international_exchange_standards$: #P +10%#!\n$modern_financial_instruments$: #P +10%#!\n\n[GetTechnology('stock_exchange').GetName] ist für die Stellung #v International#! nötig, [GetTechnology('central_banking').GetName] für die Stellung #v Weltzentrum#!"
 SPEC_XS_ECON_TT: "#header Wirtschaftssystem#!\n$TOOLTIP_DELIMITER$\nUnser Wirtschaftssystem multipliziert die Punkte:\n$law_laissez_faire$: #P x1,15#!\n$law_interventionism$: #P x1,05#!\n$law_agrarianism$: #N x0,95#!\n$law_traditionalism$: #N x0,9#!\n$law_extraction_economy$: #N x0,9#!\n$law_command_economy$: #N x0,75#!\n$law_cooperative_ownership$: #N x0,6#!"
