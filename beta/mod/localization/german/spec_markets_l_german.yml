 SPEC_EFFECT_LAX_VALUE: "#v [SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.2'), 'SPEC_LAXW_0', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.4'), 'SPEC_LAXW_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.6'), 'SPEC_LAXW_2', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_lax').GetValueWithDefault('(CFixedPoint)0.4'), '(CFixedPoint)0.8'), 'SPEC_LAXW_3', 'SPEC_LAXW_4'))))]#!"
 SPEC_EFFECT_LAX_TT: "#header [concept_spec_lending_standards]#!\n$SPEC_EFFECT_LAX_VALUE$\n$TOOLTIP_DELIMITER$\nMonatliche Kreditvergabe: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_credit'), '(CFixedPoint)1')|+%0]#!\nDavon in Booms vergeben: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_pull'), '(CFixedPoint)1')|+%0]#!\nKosten der Bankenrettung: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_cost'), '(CFixedPoint)1')|+%0]#!\n$TOOLTIP_DELIMITER$\nBanken werden in Jahren ohne Verluste nachlässig, ebenso nach jeder Bankenrettung. Vorsichtig werden sie erst wieder durch Verluste: wenn ein Boom endet, und vor allem, wenn eine [concept_spec_financial_panic] ohne Bankenrettung ihren Lauf nimmt.\n\n#title So bleiben sie vorsichtig:#!\n- [concept_spec_credit_policy] auf Straff setzen: sie werden nicht nachlässiger\n- Booms eindämmen, bevor sie schlimm enden\n- Eine Panik ohne Bankenrettung laufen lassen oder das Bankgesetz seltener aussetzen\n\nStufen: #v Streng#!, #v Umsichtig#!, #v Solide#!, #v Locker#!, #v Leichtfertig#!"
 SPEC_TILE_CYCLE: "[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_overx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_OVER_ON', 'SPEC_GOODS_NONE')][SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_bb_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_TILE_BB_ON', 'SPEC_GOODS_NONE')]"
 SPEC_TILE_OVER_ON: "\n\n#title Überbau:#! Das Angebot ist seit Beginn dieses Booms um #v [Country.MakeScope.Var(Concatenate('spec_ui_over_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! gestiegen\nEndete sein Boom, fiele [concept_spec_market_confidence] #v x[Country.MakeScope.Var(Concatenate('spec_ui_overx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|2]#! so tief"
 SPEC_TILE_BB_ON: "\n\n#title Boombau:#! #P +[Country.MakeScope.Var(Concatenate('spec_ui_bb_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! Baueffizienz für ihre Industrie, solange die Anleger so interessiert bleiben"
 SPEC_NOTE_CYCLE: "[SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)2.5'), 'SPEC_NOTE_PPL_3', SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)1.5'), 'SPEC_NOTE_PPL_2', SelectLocalization(GreaterThan_CFixedPoint(SCOPE.GetValue('spec_note_ppl'), '(CFixedPoint)0.5'), 'SPEC_NOTE_PPL_1', 'SPEC_GOODS_NONE')))]"
 SPEC_NOTE_OVER_ON: " Während des Booms war so viel gebaut worden, dass der Fall #N x[SCOPE.GetValue('spec_note_over')|2]#! so hart war."
 SPEC_NOTE_PPL_1: " Die Arbeiter, denen ihre Industrie gehörte, trugen die Verluste, und in den Staaten, wo sie steht, sind einige nun [Concept('concept_radical', '$concept_radicals|q$')]."
 SPEC_NOTE_PPL_2: " Ihre Eigentümer trugen die Verluste, und in den Staaten, wo sie steht, sind einige nun [Concept('concept_radical', '$concept_radicals|q$')]."
 SPEC_NOTE_PPL_3: " Ihre Eigentümer und gewöhnliche Sparer trugen die Verluste, und in den Staaten, wo sie steht, sind viele nun [Concept('concept_radical', '$concept_radicals|q$')]."
