 SPEC_TM_BROKE_TT: "#header Schwindende Landeskasse: [Country.MakeScope.Var('spec_tm_broke').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#v [Country.MakeScope.ScriptValue('spec_broke_weeks')|0]#! Wochen bis zum [concept_bankruptcy] bei diesem Defizit\n$TOOLTIP_DELIMITER$\nBeginnt bei #v 20#! Wochen und wächst auf #N -3#!, während sich die [concept_treasury] leert."
