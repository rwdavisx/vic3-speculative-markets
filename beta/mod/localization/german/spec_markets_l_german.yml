 spec_inquiry_when_tt: "Im letzten Jahr endete eine [concept_spec_financial_panic], ohne dass seither eine Untersuchung stattfand, oder #v 10#! Jahre sind ohne Panik vergangen (noch #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_calm_left')|0]#! Monate)"
