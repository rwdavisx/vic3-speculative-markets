 concept_spec_intervention: "Eingriff"
 concept_spec_intervention_desc: "Durch einen $concept_spec_intervention$ kann die Regierung bei einer [concept_good] #v Spekulation eindämmen#! oder #v Investitionen fördern#!.\n\n#v Spekulation eindämmen#!: [concept_spec_investor_interest] sinkt auf #v Gelassen#!, Produzenten #N -10%#! [concept_throughput] und eine Abgabe von #v 10%#! der wöchentlichen Produktion zum Grundpreis\n#v Investitionen fördern#!: Interesse steigt auf #v Interessiert#!, Produzenten #P +10%#! [concept_throughput] und eine Subvention von #v 20%#!\n\nJeder Eingriff kostet jeden Monat [concept_authority], bis er aufgehoben wird, mehr bei Grundgütern und bei Waren mit großem Anteil am Handel auf dem [concept_market]."
 SPEC_LEVER_ISSUE_TT: "#header Große Emission für [Goods.GetName] auflegen#!\n$TOOLTIP_DELIMITER$\nFür #v 2#! Jahre:\nPunkte ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]): #P +25%#!\nBankkredite darin zählen #N x1,5#!, wenn der Boom endet\nVertrauen, das beim Boomende gewonnen oder verloren wird: #v x2#!\n$TOOLTIP_DELIMITER$\nErfordert die Stellung National oder höher, [concept_spec_investor_interest] #v Eifrig#! oder höher und keinen [concept_spec_intervention]. Nur eine Große Emission gleichzeitig; die nächste kann #v 1#! Jahr nach dem Ende dieser aufgelegt werden.[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_issue_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_ISSUE_ON', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_issue').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_ISSUE_ON: "\n\nFür diese [concept_good] läuft eine Emission"
 spec_issue_stand_tt: "Unsere [concept_spec_exchange] hat mindestens die Stellung #v National#!"
 spec_issue_hot_tt: "[concept_spec_investor_interest] ist #v Eifrig#! oder höher"
 spec_issue_one_tt: "Keine andere Emission läuft"
 spec_issue_cool_tt: "Seit der letzten Emission hatte der Markt ein Jahr Ruhe"
 spec_issue_no_lever_tt: "Für diese [concept_good] ist kein [concept_spec_intervention] in Kraft"
 spec_lever_no_issue_tt: "Für diese [concept_good] läuft keine Große Emission"
 SPEC_LEVERS_TT: "#header Markteingriffe#!\n#N -[Country.MakeScope.ScriptValue('spec_lever_authority')|0]#! [concept_authority] pro Monat\n$TOOLTIP_DELIMITER$\nEingedämmt: #v [Country.MakeScope.ScriptValue('spec_n_restrain')|0]#!\nGefördert: #v [Country.MakeScope.ScriptValue('spec_n_encourage')|0]#!\n[concept_budget_additional_income]: #P @money![Country.MakeScope.ScriptValue('spec_lever_levy')|D]#! pro Woche\n[concept_budget_additional_expenses]: #N @money![Country.MakeScope.ScriptValue('spec_lever_spend')|D]#! pro Woche"
 spec_story.1.t: "Der Markt für [ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName] bricht ein"
 spec_story.1.t_generic: "Ein Markt bricht ein"
 spec_story.1.d: "Der Ansturm auf [ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName] ist vorbei. Preise, die ein Jahr lang gestiegen waren, sind binnen eines Monats gefallen. Die auf dem Höhepunkt des Rausches an die Börse gebrachten Kompanien können ihre Rechnungen nicht mehr begleichen. Händler, die zu jedem Preis kauften, sitzen auf Lagern, die sie nicht leeren können. Die Banken, die ihre Bestände beliehen, zählen die Verluste."
 spec_story.1.d_generic: "Der Ansturm auf die begehrtesten Waren der Saison ist vorbei. Preise, die ein Jahr lang gestiegen waren, sind binnen eines Monats gefallen. Die auf dem Höhepunkt des Rausches an die Börse gebrachten Kompanien können ihre Rechnungen nicht mehr begleichen. Händler, die zu jedem Preis kauften, sitzen auf Lagern, die sie nicht leeren können. Die Banken, die ihre Bestände beliehen, zählen die Verluste."
 spec_story.1.f: "„Seit dreißig Jahren vertreibe ich [ROOT.GetCountry.MakeScope.Var('spec_story_crashed').GetGoods.GetName]. Noch nie sah ich Männer so begierig kaufen und so verzweifelt verkaufen wie in diesen letzten zwölf Monaten.“"
 spec_story.1.f_generic: "„Seit dreißig Jahren bin ich in diesem Geschäft. Noch nie sah ich Männer so begierig kaufen und so verzweifelt verkaufen wie in diesen letzten zwölf Monaten.“"
 spec_story.1.a: "Den ruinierten Produzenten Hilfe gewähren."
 spec_story.1.b: "Die schwächsten Häuser sollen fallen."
 spec_story.1.c: "Die Gründer untersuchen lassen."
 spec_story.2.t: "Ein Schwindel fliegt auf"
 spec_story.2.d: "Die Direktoren der Kompanie für [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] aus [ROOT.GetCountry.GetCapital.GetCityHubName] sind außer Landes geflohen. Ihre Bücher zeigen, dass die stattlichen Dividenden der letzten beiden Jahre aus neuen Zeichnungen bezahlt wurden. Tausende Schreiber, Witwen und Verkäufer hielten ihre Aktien. Jede Zeitung in [ROOT.GetCountry.GetCapital.GetCityHubName] fragt nun, wie viele andere Börsenprospekte aus derselben Feder stammen."
 spec_story.2.d_generic: "Die Direktoren einer gefeierten Aktiengesellschaft aus [ROOT.GetCountry.GetCapital.GetCityHubName] sind außer Landes geflohen. Ihre Bücher zeigen, dass die stattlichen Dividenden der letzten beiden Jahre aus neuen Zeichnungen bezahlt wurden. Tausende Schreiber, Witwen und Verkäufer hielten ihre Aktien. Jede Zeitung in [ROOT.GetCountry.GetCapital.GetCityHubName] fragt nun, wie viele andere Börsenprospekte aus derselben Feder stammen."
 spec_story.2.f: "#bold Wegen Betruges gesucht#!\nDer geschäftsführende Direktor der Kompanie für [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] aus [ROOT.GetCountry.GetCapital.GetCityHubName], etwa fünfzig Jahre alt, gut gekleidet und von gewinnendem Auftreten. Zuletzt an den Hafenanlagen gesehen."
 spec_story.2.f_generic: "#bold Wegen Betruges gesucht#!\nDer geschäftsführende Direktor einer Aktiengesellschaft aus [ROOT.GetCountry.GetCapital.GetCityHubName], etwa fünfzig Jahre alt, gut gekleidet und von gewinnendem Auftreten. Zuletzt an den Hafenanlagen gesehen."
 spec_story.2.a: "Die Direktoren vor Gericht stellen."
 spec_story.2.b: "Die Angelegenheit verschweigen."
 spec_story.2.c: "Die Kleinanleger entschädigen."
 spec_story.3.t: "Ein Ansturm auf die Banken"
 spec_story.3.d: "Heute Morgen belagerten Sparer eine der ältesten Banken in [ROOT.GetCountry.GetCapital.GetCityHubName]; bis Mittag waren ihre Türen geschlossen. Überall in der Stadt werden ihre Noten zurückgewiesen. Die Firmen, die ihre Konten dort führten, können diese Woche ihre Arbeiter nicht bezahlen. Vor jeder anderen Bank werden die Schlangen von Stunde zu Stunde länger."
 spec_story.3.f: "„Mein Vater hatte seine Ersparnisse bei dieser Bank und sein Vater vor ihm. Man sagte uns, sie sei so sicher wie die Landeskasse.“"
 spec_story.3.a: "Für die Einlagen bürgen."
 spec_story.3.b: "Sie muss allein bestehen oder fallen."
 spec_story.3.c: "Wir müssen die Banken stützen."
 spec_story.4.t: "[ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] in Panik"
 spec_story.4.t_generic: "Auslandspanik"
 spec_story.4.d: "Die Nachricht, dass [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] eine [concept_spec_financial_panic] erlebt, hat [ROOT.GetCountry.GetCapital.GetCityHubName] erreicht. Die dortigen Banken fordern ihre Auslandskredite zurück. Unsere Firmen, für die [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] Absatzmarkt oder Kreditgeber war, stehen plötzlich ohne Mittel da. Jeder Händler an der Börse will wissen, ob das Unheil weiter um sich greifen wird."
 spec_story.4.d_generic: "Die Nachricht von einer Finanzpanik im Ausland hat [ROOT.GetCountry.GetCapital.GetCityHubName] erreicht. Ausländische Banken fordern ihre Kredite zurück. Unsere Firmen, die nach Übersee verkauften oder sich dort Geld liehen, stehen plötzlich ohne Mittel da. Jeder Händler an der Börse will wissen, ob das Unheil weiter um sich greifen wird."
 spec_story.4.f: "„Wenn [ROOT.GetCountry.MakeScope.Var('spec_story_src').GetCountry.GetName] niest, legt sich unsere Börse ins Bett.“"
 spec_story.4.f_generic: "„Wenn unsere Nachbarn niesen, legt sich unsere Börse ins Bett.“"
 spec_story.4.a: "Unseren Handelshäusern Kredite gewähren."
 spec_story.4.b: "Ihre Sorgen sind nicht die unseren."
 spec_story.4.c: "Die leichtsinnigen ausländischen Bankiers beschuldigen."
 spec_story.5.t: "Das Vertrauen kehrt zurück"
 spec_story.5.d: "Das Schlimmste der Panik ist vorüber. Die überlebenden Firmen stellen wieder Arbeiter ein, die Banken verleihen Geld an solide Kunden, und einige kühne Anleger kaufen Aktien zu einem Bruchteil der Vorjahrespreise. Niemand erwartet eine rasche Rückkehr zum alten Überschwang, doch in [ROOT.GetCountry.GetCapital.GetCityHubName] werden wieder Geschäfte gemacht."
 spec_story.5.f: "„Die Herren, die im Frühjahr alles verkauften, kaufen es im Herbst zurück. Und billiger, als sie es verkauft haben.“"
 spec_story.5.a: "Neue Unternehmungen fördern."
 spec_story.5.b: "Diesmal muss die Kreditvergabe solide sein."
 spec_story.6.t: "Die Abordnung der Fabrikanten"
 spec_story.6.d: "Eine Abordnung von Fabrikanten und Kaufleuten ist bei der Regierung vorstellig geworden. Ihre neuen Werke stünden aus Kreditmangel halbfertig da, während ihre ausländischen Wettbewerber ungehindert Geld leihen und ihnen die Märkte abnehmen könnten. Sie bitten darum, den Banken die Kreditvergabe wieder zu gestatten."
 spec_story.6.f: "„Eure Vorsicht, mein Herr, hat uns vor einem Zusammenbruch bewahrt, indem sie sicherstellte, dass nichts mehr übrig ist, was zusammenbrechen könnte.“"
 spec_story.6.a: "Die Kreditpolitik lockern."
 spec_story.6.b: "Die Kredite bleiben knapp."
 spec_story.6.c: "Ihnen stattdessen eine Subvention anbieten."
 spec_story.7.t: "Im Aktienfieber"
 spec_story.7.d: "Schreiber, Verkäufer und Schulmeister drängen sich in den Kaffeehäusern von [ROOT.GetCountry.GetCapital.GetCityHubName], um Aktien von Kompanien zu handeln, die sie nie gesehen haben. Anteile an Unternehmungen für [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] wechseln mehrmals täglich den Besitzer, die meisten mit geliehenem Geld bezahlt. Man sagt, selbst Dienstboten verpfändeten ihre Ersparnisse, um bei der nächsten Ausgabe dabei zu sein."
 spec_story.7.d_generic: "Schreiber, Verkäufer und Schulmeister drängen sich in den Kaffeehäusern von [ROOT.GetCountry.GetCapital.GetCityHubName], um Aktien von Kompanien zu handeln, die sie nie gesehen haben. Anteile an den jüngsten Unternehmungen wechseln mehrmals täglich den Besitzer, die meisten mit geliehenem Geld bezahlt. Man sagt, selbst Dienstboten verpfändeten ihre Ersparnisse, um bei der nächsten Ausgabe dabei zu sein."
 spec_story.7.f: "„Mein Barbier gab mir heute früh einen Tipp zu Aktien für [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName]. Ich nahm ihn an und gab ihm dafür auch einen: verkaufen.“"
 spec_story.7.f_generic: "„Mein Barbier gab mir heute früh einen Aktientipp. Ich nahm ihn an und gab ihm dafür auch einen: verkaufen.“"
 spec_story.7.a: "Das Volk soll am Reichtum teilhaben."
 spec_story.7.b: "Den Handel mit geliehenem Geld verbieten."
 spec_story.7.c: "Eine Stempelsteuer auf Aktienübertragungen erheben."
 spec_story.8.t: "Warnungen vor einer Blase"
 spec_story.8.d: "Ein angesehener Nationalökonom hat der führenden Zeitung in [ROOT.GetCountry.GetCapital.GetCityHubName] geschrieben, der Anstieg bei [ROOT.GetCountry.MakeScope.Var('spec_story_good').GetGoods.GetName] und [ROOT.GetCountry.MakeScope.Var('spec_story_good2').GetGoods.GetName] könne nicht anhalten. Die Banken hätten Kredite gegen Preise vergeben, die kein nüchterner Mann zahlen würde. Die Makler nennen es das Unken einer alten Frau. Doch in jedem Klub und Kontor der Stadt wird der Brief laut verlesen."
 spec_story.8.d_generic: "Ein angesehener Nationalökonom hat der führenden Zeitung in [ROOT.GetCountry.GetCapital.GetCityHubName] geschrieben, der Preisanstieg bei den begehrtesten Waren der Zeit könne nicht anhalten. Die Banken hätten Kredite gegen Preise vergeben, die kein nüchterner Mann zahlen würde. Die Makler nennen es das Unken einer alten Frau. Doch in jedem Klub und Kontor der Stadt wird der Brief laut verlesen."
 spec_story.8.f: "„Ein Preis ist nur das, was der letzte Käufer zu zahlen bereit war. Ich bitte meine Leser zu bedenken, wie viele Käufer noch übrig sind.“"
 spec_story.8.a: "Die Warnung kommt zur rechten Zeit."
 spec_story.8.b: "Unsinnige Schwarzmalerei."
