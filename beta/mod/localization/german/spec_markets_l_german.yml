 SPEC_RISK_SLIGHT: "#header Risiko: $SPEC_UNWIND$#!\nVerlust an [concept_spec_market_confidence] bei Boomende: #v Gering#!\n$TOOLTIP_DELIMITER$\n$SPEC_UNWIND_DESC$"
 SPEC_RISK_GLUT: "#header Erholung#!\n$TOOLTIP_DELIMITER$\nFür [Goods.GetName] läuft die Erholung nach dem letzten Boom. Anleger halten sich zurück, wodurch [concept_spec_investor_interest] vorübergehend auf #v Zweifelnd#! bleibt."
 SPEC_RISK_CALM: "#header Kein Boom#!\n$TOOLTIP_DELIMITER$\nFür [Goods.GetName] gab es zuletzt keinen Boom. Sobald [concept_spec_investor_interest] mindestens die Stufe #v Interessiert#! erreicht, beendet ein Rückgang auf #v Zweifelnd#! den Boom. Je höher er stieg, desto tiefer fällt er."
 SPEC_UNWIND_3: "Zusammenbruch"
 SPEC_UNWIND_C_3: "[concept_spec_collapse]"
 SPEC_UNWIND_DESC_3: "Diese [concept_good] hatte einen Boom bis zur Stufe #v Fieberhaft#!. Fällt ihr Preistrend unter #v [Divide_CFixedPoint('(CFixedPoint)-4.988', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!, sinkt [concept_spec_investor_interest] auf #v Fliehend#! und der Boom endet in einem [concept_spec_collapse]. Anleger halten sich danach #v 12#! Monate zurück. Das Risiko nimmt mit dem Alter des Booms ab."
 SPEC_UNWIND_2: "Einbruch"
 SPEC_UNWIND_C_2: "[concept_spec_bust]"
 SPEC_UNWIND_DESC_2: "Diese [concept_good] hatte einen Boom bis zur Stufe #v Eifrig#!. Fällt ihr Preistrend unter #v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!, sinkt [concept_spec_investor_interest] auf #v Zweifelnd#! und der Boom endet in einem [concept_spec_bust]. Anleger halten sich danach #v 6#! Monate zurück. Das Risiko nimmt mit dem Alter des Booms ab."
 SPEC_UNWIND_1: "Korrektur"
 SPEC_UNWIND_C_1: "[concept_spec_correction]"
 SPEC_UNWIND_DESC_1: "Diese [concept_good] hatte einen Boom bis zur Stufe #v Interessiert#!. Fällt ihr Preistrend unter #v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!, sinkt [concept_spec_investor_interest] auf #v Zweifelnd#! und der Boom endet in einer [concept_spec_correction]. Anleger halten sich danach #v 3#! Monate zurück. Das Risiko nimmt mit dem Alter des Booms ab."
