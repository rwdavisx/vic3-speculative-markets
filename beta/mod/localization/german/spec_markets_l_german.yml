 SPEC_STANCE_TIGHT_TT: "#header Knappe Kredite#!\nDiesen Monat vergebene Kredite: #v Keine#!\n$TOOLTIP_DELIMITER$\nJeden Monat verliert [concept_spec_market_confidence] #N 10%#! seines Abstands über #v 60#!\nAnlegerreaktion: #N -50%#!\n@intelligentsia! Intellektuelle [concept_in_government]: #P +2#! [concept_approval]\n@industrialists! Industrielle [concept_in_government]: #N -2#! [concept_approval]\n\nBooms bleiben kleiner, daher fallen ihr Ende und Paniken milder aus.[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-1'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-1')), Not(GetScriptedGui('spec_sgui_tight').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_TIGHT_WHY')]"
 SPEC_STANCE_NORMAL_TT: "#header Normale Kredite#!\nDiesen Monat vergebene Kredite: #v @money![Country.MakeScope.ScriptValue('spec_credit_preview')|D]#!\n$TOOLTIP_DELIMITER$\nBanken vergeben Kredite an den [concept_investment_pool], solange [concept_spec_market_confidence] über #v 55#! liegt.[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0')), Not(GetScriptedGui('spec_sgui_normal').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_NORMAL_WHY')]"
 SPEC_STANCE_LOOSE_TT: "#header Reichliche Kredite#!\nDiesen Monat vergebene Kredite: #v @money![Country.MakeScope.ScriptValue('spec_credit_preview_loose')|D]#!\n$TOOLTIP_DELIMITER$\nAnlegerreaktion auf steigende Preise: #v +30%#!\n@industrialists! Industrielle [concept_in_government]: #P +2#! [concept_approval]\n@intelligentsia! Intellektuelle [concept_in_government]: #N -2#! [concept_approval]\n\nBooms werden größer, und damit auch die Verluste bei ihrem Ende.[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1')), Not(GetScriptedGui('spec_sgui_loose').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_LOOSE_WHY')]"
