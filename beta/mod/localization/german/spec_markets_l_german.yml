 SPEC_IL_SORT_LEVER_BASE_TT: "#header Eingriffe anzeigen#!\n$TOOLTIP_DELIMITER$\nZeigt nur Waren mit einem [concept_spec_intervention].\n\n$SPEC_COL_LEVER_TT$\n\n#instruction Zum Filtern klicken, erneut klicken, um alle anzuzeigen#!"
 SPEC_IL_DANGER_TT: "#header Zusammenbruchszone#!\nSinkt [concept_spec_investor_interest] so weit, endet der Boom in einem [concept_spec_collapse] und kostet etwa #N [Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! [concept_spec_market_confidence]."
 SPEC_IL_CRASHED_TT: "#header [Goods.GetName]: Boom beendet#!\nDer Boom endete diesen Monat mit folgendem Ausgang: [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]. Anleger halten sich nun für [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))] zurück, und produziert eine [concept_company] diese Ware, verliert deren Wirtschaftszweig [concept_throughput]."
 SPEC_IL_GLUT_TT: "#header [Goods.GetName]: Erholung#!\nDer letzte Boom endete mit folgendem Ausgang: [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]. Anleger halten sich danach für [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))] zurück, wodurch [concept_spec_investor_interest] höchstens die Stufe #v Zweifelnd#! erreicht. Produziert eine [concept_company] diese Ware, verliert deren Wirtschaftszweig [concept_throughput]."
 SPEC_TILE_BANKS: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_expx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_BANKS_ON', 'SPEC_GOODS_NONE')]$SPEC_TILE_CYCLE$"
 SPEC_TILE_BANKS_ON: "\n\n#title Bankkredite:#! #v [Country.MakeScope.Var(Concatenate('spec_exp_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! von [concept_spec_outstanding_credit], #v [Country.MakeScope.Var(Concatenate('spec_ui_expm_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! Monatseinkommen des Pools\nWürde sein Boom enden, fiele [concept_spec_market_confidence] #v x[Country.MakeScope.Var(Concatenate('spec_ui_expx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|2]#! so stark wie bei einem Boom, in den keine Bank Kredit gegeben hat"
 SPEC_NOTE_BANKS: ""
 SPEC_NOTE_BANKS_ON: " Die Banken hatten viel Kredit hineingegeben, daher fiel der Einbruch #N x[SCOPE.GetValue('spec_note_bank')|2]#! so hart aus."
 SPEC_H_BANK_LENT: "Wohin die Banken Kredit gegeben haben"
 SPEC_H_BANK_LENT_TT: "#header Wohin die Banken Kredit gegeben haben#!\n$TOOLTIP_DELIMITER$\nBanken vergeben die meisten neuen Kredite in boomende Waren: Je größer der Anteil einer Ware an unserem Handel und je höher ihr [concept_spec_investor_interest], desto mehr erhält sie. Ein Kredit bleibt bis zur Rückzahlung in seiner Ware.\n\nEndet ein Boom, in den die Banken Kredite vergeben haben, sinkt [concept_spec_market_confidence] stärker. Eine Ware mit eingedämmter Spekulation zieht nur halb so viele neue Kredite an."
 SPEC_BANK_PIE: "Boomkredite nach Gut"
 SPEC_BANK_SLICE_NAME: "[SelectLocalization(Country.MakeScope.Var(Concatenate('spec_bank_oth_', Scope.GetGoods.GetKey)).IsSet, 'SPEC_BANK_OTHER', 'SPEC_BANK_GOOD_NAME')]"
