 notification_spec_ld_recovered_tooltip: "#header $notification_spec_ld_recovered_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_ld_recovered_desc$"
 spec_depression.1.t: "Die $SPEC_LD_NAME$"
 spec_depression.1.d: "Die Paniken an den Börsen der Welt sind zu einer einzigen verschmolzen. Zwischen den großen Handelshäusern fließt kein Kredit mehr, überall fallen zugleich die Preise, und Aufträge, die unsere Fabriken und Bergwerke auslasteten, werden per Telegramm storniert. Jeder Markt stützt sich auf alle anderen, und nun stürzen sie gemeinsam.\n\nDer Börsenkrach wird einige Monate dauern, gefolgt von einer langen Depression. Wie rasch wir uns erholen, hängt von unserem jetzigen Handeln ab und davon, wie die [Concept('concept_great_power','$concept_great_powers|q$')] handeln."
 spec_depression.1.f: "„Paniken haben wir schon erlebt. Diesmal gibt es keinen Ort mehr, an den das Geld fliehen kann.“"
 spec_depression.1.a: "Wir müssen sparen."
 spec_depression.1.b: "Die Börsen stabilisieren."
 spec_depression.2.t: "Eine Zollmauer"
 spec_depression.2.d: "Die Besitzer unserer größten Werke haben eine Bittschrift an die Regierung gerichtet, und die großen Grundbesitzer haben sich ihnen angeschlossen. Ausländische Waren und billiges ausländisches Getreide, so sagen sie, würden auf unseren Märkten zu jedem Preis verkauft, den ihre Hersteller nur erzielen könnten, und unsere eigenen Fabriken und Güter könnten nicht zu Preisen verkaufen, die ihre Löhne deckten. Sie verlangen höhere Zölle auf alles, was mit der heimischen Industrie und der heimischen Ernte konkurriert.\n\nEin solcher Schutz würde unsere eigene Erholung abschirmen, doch unsere Handelspartner müssten dafür büßen und mit ihnen die Erholung der Welt."
 spec_depression.2.f: "„Jede Nation zieht eine Mauer um ihren Markt, und jede wundert sich, weshalb ihre Ausfuhr sich nicht erholt.“"
 spec_depression.2.a: "Unsere Industrie schützen."
 spec_depression.2.b: "Unsere Märkte offen halten."
 spec_depression.3.t: "Notstandsarbeiten"
 spec_depression.3.d: "Tausende Männer stehen in [ROOT.GetCountry.GetCapital.GetCityHubName] ohne Arbeit da, und die Hilfskassen sind erschöpft. Die städtischen Ingenieure haben Bauvorhaben aufgelistet, die ihnen Beschäftigung geben könnten: Abwasserkanäle, Straßen, Dämme und eine neue Markthalle, sofern die Landeskasse dafür aufkommt."
 spec_depression.3.f: "„Ein Mann, der für seinen Tagelohn einen Kanal aushebt, ist kein Almosenempfänger. Und er weiß es.“"
 spec_depression.3.a: "Die Bauvorhaben finanzieren."
 spec_depression.3.b: "Wohltätigkeit ist Privatsache."
 spec_depression.4.t: "Die Banken unter Belagerung"
 spec_depression.4.d: "Es hat sich herumgesprochen, dass die Banken in [ROOT.GetCountry.GetCapital.GetCityHubName] hohe Kredite an Firmen vergeben haben, die nun zusammenbrechen. Seit dem Morgen stehen Sparer Schlange, um ihr Guthaben abzuheben. Bis zum Abend werden die Banken keine Münze mehr haben, um sie auszuzahlen. Ihre Direktoren bitten die Regierung einzugreifen."
 spec_depression.4.f: "„Eine Bank ist vollkommen gesund, bis alle glauben, sie sei es nicht.“"
 spec_depression.4.a: "Die Banken vorübergehend schließen."
 spec_depression.4.b: "Die Banken retten."
 spec_depression.4.c: "Sie sollen bankrottgehen."
 spec_depression.5.t: "Die Währungsfrage"
 spec_depression.5.d: "Fallende Preise haben das Land gespalten. Bauern und kleine Schuldner klagen, Geld sei zu teuer geworden und jede Schuld wiege mit jedem Jahr sinkender Preise schwerer. Sie fordern die Ausgabe von mehr Geld und eine leichtere Kreditvergabe. Bankiers und Gläubiger entgegnen, nur eine solide Währung könne das Vertrauen der Anleger im In- und Ausland zurückgewinnen."
 spec_depression.5.f: "„Meine Hypothek ist noch dieselbe wie vor fünf Jahren. Mein Weizen bringt die Hälfte ein.“"
 spec_depression.5.a: "Eine solide Währung geht vor."
 spec_depression.5.b: "Die Kreditvergabe erleichtern."
 spec_depression.6.t: "Marsch der Arbeitslosen"
 spec_depression.6.d: "Ein Zug arbeitsloser Männer ist unter Bannern mit der Aufschrift ‚Arbeit oder Brot‘ in [ROOT.GetCountry.GetCapital.GetCityHubName] einmarschiert. Sie lagern vor den Regierungsgebäuden und verlangen, eine Bittschrift überreichen zu dürfen. Die Polizei erklärt, sie könne den Platz bis Einbruch der Dunkelheit räumen."
 spec_depression.6.f: "„Wir verlangen keine Almosen. Wir verlangen Arbeit.“"
 spec_depression.6.a: "Sie auseinanderjagen."
 spec_depression.6.b: "Ihre Bittschrift entgegennehmen."
 spec_depression.7.t: "Rufe nach Reformen"
 spec_depression.7.d: "Die Zeitungen fragen, weshalb die Depression so lange anhält und wer an der Spekulation vor ihrem Ausbruch reich geworden ist. Abgeordnete verlangen eine Untersuchung der Banken, der Börsen und des Verhaltens der Regierung selbst."
 spec_depression.7.f: "„Die Frage ist nicht mehr, ob das System versagt hat, sondern wer dafür einstehen wird.“"
 spec_depression.7.a: "Eine Untersuchung anordnen."
 spec_depression.7.b: "Das System ist gesund."
 spec_depression.8.t: "Die $SPEC_LD_NAME$ endet"
 spec_depression.8.d: "Erstmals seit Jahren gehen mehr Aufträge ein, als storniert werden. Die Preise haben ihren Tiefpunkt gefunden, Banken vergeben wieder Kredite und stillgelegte Werke stellen Arbeiter ein. Die Depression ist vorüber, doch nur wenige, die sie erlebt haben, werden sie bald vergessen."
 spec_depression.8.f: "„Der Handel belebt sich, heißt es. Ich glaube es, sobald mein eigenes Auftragsbuch dasselbe sagt.“"
 spec_depression.8.a: "Wir haben daraus gelernt."
 spec_depression.8.b: "Zurück an die Geschäfte."
