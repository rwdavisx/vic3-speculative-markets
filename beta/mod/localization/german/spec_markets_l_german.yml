l_german:
 spec_confidence_bar: "Marktvertrauen"
 spec_confidence_bar_desc: "[concept_spec_market_confidence]: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!"
 spec_stance_current_tt: "Dies ist nicht bereits die derzeitige [concept_spec_credit_policy]"
 spec_stance_cooldown_tt: "[concept_spec_credit_policy] wurde in den letzten #v 6#! Monaten nicht geändert"
 spec_rescued_tt: "Während dieser [concept_spec_financial_panic] haben wir den Banken weder Geld geliehen noch das Bankgesetz ausgesetzt"
 spec_credit_tight: "Knappe Kredite"
 spec_credit_tight_fx: "[concept_spec_credit_policy] wird #v Straff#!"
 spec_credit_normal_fx: "[concept_spec_credit_policy] wird #v Normal#!"
 spec_credit_loose_fx: "[concept_spec_credit_policy] wird #v Locker#!"
 spec_credit_tight_desc: "Banken stellen die Kreditvergabe ein, und Anleger reagieren schwächer auf steigende Preise. Booms bleiben kleiner, daher fallen ihr Ende und Paniken milder aus. Jeden Monat verliert [concept_spec_market_confidence] #N 10%#! seines Abstands über #v 60#!. Die Wahl sperrt [concept_spec_credit_policy] für #v 6#! Monate. Erfordert [GetTechnology('central_banking').GetName].\n\n@intelligentsia! Intellektuelle [concept_in_government]: #P +2#! [concept_approval]\n@industrialists! Industrielle [concept_in_government]: #N -2#! [concept_approval]"
 spec_credit_normal: "Normale Kredite"
 spec_credit_normal_desc: "Banken vergeben Kredite an den [concept_investment_pool], solange [concept_spec_market_confidence] über #v 55#! liegt. Diese Wahl legt die [concept_spec_credit_policy] für #v 6#! Monate fest. Erfordert [GetTechnology('central_banking').GetName]."
 spec_credit_loose: "Reichliche Kredite"
 spec_credit_loose_desc: "Banken vergeben mehr Kredite und Anleger reagieren stärker auf steigende Preise. Booms werden größer, ebenso die Verluste an ihrem Ende. Diese Wahl legt die [concept_spec_credit_policy] für #v 6#! Monate fest. Erfordert [GetTechnology('central_banking').GetName].\n\n@industrialists! Industrielle [concept_in_government]: #P +2#! [concept_approval]\n@intelligentsia! Intellektuelle [concept_in_government]: #N -2#! [concept_approval]"
 spec_rescue_banks: "Banken Kredit gewähren"
 spec_rescue_banks_desc: "Aus der [concept_treasury] einen Betrag von etwa #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#! gemessen am [concept_gdp] aufwenden, um die [concept_spec_financial_panic] binnen #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#! Monaten zu beenden und ihre Auswirkungen zu halbieren. [concept_spec_market_confidence] steigt um #v 20#!. Je länger die Panik noch dauern würde, desto höher die Kosten. Einmal pro Panik möglich. [GetTechnology('central_banking').GetName] macht die Maßnahme günstiger und schneller."
 spec_conf_panic: "Erschütterte Anleger"
 spec_conf_panic_held: "Erschütterte Anleger"
 spec_conf_wary: "Vorsichtige Anleger"
 spec_conf_steady: "Stabile Anleger"
 spec_conf_buoyant: "Zuversichtliche Anleger"
 spec_conf_mania: "Manische Anleger"
 spec_conf_panic_desc: "Auswirkungen von [concept_spec_market_confidence] auf Investitionen und die Zinsen für [concept_loans]"
 spec_conf_panic_held_desc: "Auswirkungen von [concept_spec_market_confidence] auf Investitionen und die Zinsen für [concept_loans]"
 spec_conf_wary_desc: "Auswirkungen von [concept_spec_market_confidence] auf Investitionen und die Zinsen für [concept_loans]"
 spec_conf_steady_desc: "Auswirkungen von [concept_spec_market_confidence] auf Investitionen und die Zinsen für [concept_loans]"
 spec_conf_buoyant_desc: "Auswirkungen von [concept_spec_market_confidence] auf Investitionen und die Zinsen für [concept_loans]"
 spec_conf_mania_desc: "Auswirkungen von [concept_spec_market_confidence] auf Investitionen und die Zinsen für [concept_loans]"
 spec_panic: "Finanzpanik"
 spec_panic_desc: "Auswirkungen einer [concept_spec_financial_panic] auf dem [concept_market]"
 spec_panic_crunch: "Kreditklemme"
 spec_panic_crunch_desc: "Banken haben während der [concept_spec_financial_panic] die Kreditvergabe eingestellt, wodurch [concept_private_construction] halbiert ist"
 spec_lev_boom: "Kreditboom"
 spec_bailout_fx_tt: "[concept_spec_bad_debts]: #P halbiert#!, abgebaut in #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_months')|0]#! statt #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#! Monaten"
 spec_bailout_cost_tt: "[concept_treasury]: #N -@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_cost')|D]#!, etwa #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_share')|%0]#! von [concept_gdp]"
 spec_bailout_debts_tt: "Es gibt [concept_spec_bad_debts] abzubauen"
 spec_bailed_tt: "Der Staat hat seit Beginn dieser [concept_spec_bad_debts] keine faulen Kredite aufgekauft"
 spec_lev_boom_desc: "Bankkredite erhöhen [concept_throughput] um #P +2%#! je vollem Monat [concept_spec_leverage], bis zu #P +24%#!."
 spec_credit_crunch: "Faule Kredite"
 spec_credit_crunch_desc: "Banken schreiben die Kredite des letzten Booms ab und vergeben nichts, bis dies abklingt. #v Banken Kredit gewähren#! baut es nicht ab. #v Faule Kredite aufkaufen#! halbiert es, einmal solange es besteht."
 spec_loose_credit: "Reichliche Kredite"
 spec_loose_credit_desc: "Auswirkungen der [concept_spec_credit_policy]"
 spec_tight_credit: "Knappe Kredite"
 spec_tight_credit_desc: "Auswirkungen der [concept_spec_credit_policy]"
 spec_markets.1.t: "Spekulationsmanie"
 spec_markets.1.d: "In [ROOT.GetCountry.GetCapital.GetCityHubName] entstehen Vermögen schneller, als man sie zählen kann. Die Preise für [ROOT.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName], [ROOT.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName] und [ROOT.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName] steigen Woche für Woche, beinahe täglich werden neue Kompanien zu ihrer Herstellung an die Börse gebracht, und die Banken beleihen deren Aktien ohne nähere Prüfung. Kaum jemand fragt noch, was all dies eigentlich wert ist.\n\nEinige $capitalists_no_icon$ und $shopkeepers_no_icon$ schreiben ihren neuen Reichtum der Regierung zu und werden [Concept('concept_loyalist','$concept_loyalists|q$')]. Hält dies an, gewinnen [Concept('concept_political_movement','$concept_political_movements|q$')], die für [GetLawType('law_laissez_faire').GetName] eintreten, Unterstützung."
 spec_markets.1.d_generic: "In [ROOT.GetCountry.GetCapital.GetCityHubName] entstehen Vermögen schneller, als man sie zählen kann. Die Preise steigen Woche für Woche, beinahe täglich werden neue Kompanien an die Börse gebracht, und die Banken beleihen deren Aktien ohne nähere Prüfung. Kaum jemand fragt noch, was all dies eigentlich wert ist.\n\nEinige $capitalists_no_icon$ und $shopkeepers_no_icon$ schreiben ihren neuen Reichtum der Regierung zu und werden [Concept('concept_loyalist','$concept_loyalists|q$')]. Hält dies an, gewinnen [Concept('concept_political_movement','$concept_political_movements|q$')], die für [GetLawType('law_laissez_faire').GetName] eintreten, Unterstützung."
 spec_markets.1.f: "„Kauf, mein Junge, und kümmere dich nicht um den Preis. Was du heute auch zahlst, morgen zahlt irgendein anderer mehr.“"
 spec_markets.1.a: "Der Wohlstand spricht für sich."
 spec_markets.1.b: "Zur Mäßigung mahnen."
 spec_markets.1.b.tt: "[concept_spec_market_confidence] sinkt um #v 10#!"
 spec_markets.1.c: "Die Spekulanten sollen ihren Anteil zahlen."
 spec_markets.1.c.tt: "[concept_spec_market_confidence] sinkt um #v 5#!"
 spec_markets.2.t: "Finanzpanik"
 spec_markets.2.d_crash: "Das Ende des Booms bei [ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName], des größten der beendeten Booms, ist zu einer allgemeinen Panik geworden. Bankhäuser, die auf seinen Preis hin Kredite gewährt hatten, brechen eines nach dem anderen zusammen, und seit dem Morgengrauen stehen Sparer vor den Banken von [ROOT.GetCountry.GetCapital.GetCityHubName] Schlange. Die Banken fordern Kredite über #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#! zurück, und Anleger klammern sich an das Wenige, das ihnen bleibt. [concept_private_construction] wird für #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! Monate halbiert.\n\nRuinierte $capitalists_no_icon$, $aristocrats_no_icon$ und $shopkeepers_no_icon$ geben der Regierung die Schuld, und manche werden zu [Concept('concept_radical','$concept_radicals|q$')]. Viele wollen nun, dass der Staat die Märkte zügelt, und [Concept('concept_political_movement','$concept_political_movements|q$')] gegen [GetLawType('law_laissez_faire').GetName] gewinnen an Unterstützung.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_crash_no_loans: "Das Ende des Booms bei [ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName], des größten der beendeten Booms, ist zu einer allgemeinen Panik geworden. Bankhäuser, die auf seinen Preis hin Kredite gewährt hatten, brechen eines nach dem anderen zusammen, und seit dem Morgengrauen stehen Sparer vor den Banken von [ROOT.GetCountry.GetCapital.GetCityHubName] Schlange. Anleger klammern sich an das Wenige, das ihnen bleibt. [concept_private_construction] wird für #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! Monate halbiert.\n\nRuinierte $capitalists_no_icon$, $aristocrats_no_icon$ und $shopkeepers_no_icon$ geben der Regierung die Schuld, und manche werden zu [Concept('concept_radical','$concept_radicals|q$')]. Viele wollen nun, dass der Staat die Märkte zügelt, und [Concept('concept_political_movement','$concept_political_movements|q$')] gegen [GetLawType('law_laissez_faire').GetName] gewinnen an Unterstützung.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign: "Die Panik in [ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName] ist auf unsere Märkte übergesprungen. Bankhäuser, die dort handelten oder Geld liehen, brechen eines nach dem anderen zusammen, und seit dem Morgengrauen stehen Sparer vor den Banken von [ROOT.GetCountry.GetCapital.GetCityHubName] Schlange. Die Banken fordern Kredite über #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#! zurück, und Anleger klammern sich an das Wenige, das ihnen bleibt. [concept_private_construction] wird für #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! Monate halbiert.\n\nRuinierte $capitalists_no_icon$, $aristocrats_no_icon$ und $shopkeepers_no_icon$ geben der Regierung die Schuld, und manche werden zu [Concept('concept_radical','$concept_radicals|q$')]. Viele wollen nun, dass der Staat die Märkte zügelt, und [Concept('concept_political_movement','$concept_political_movements|q$')] gegen [GetLawType('law_laissez_faire').GetName] gewinnen an Unterstützung.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign_no_loans: "Die Panik in [ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName] ist auf unsere Märkte übergesprungen. Bankhäuser, die dort handelten oder Geld liehen, brechen eines nach dem anderen zusammen, und seit dem Morgengrauen stehen Sparer vor den Banken von [ROOT.GetCountry.GetCapital.GetCityHubName] Schlange. Anleger klammern sich an das Wenige, das ihnen bleibt. [concept_private_construction] wird für #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! Monate halbiert.\n\nRuinierte $capitalists_no_icon$, $aristocrats_no_icon$ und $shopkeepers_no_icon$ geben der Regierung die Schuld, und manche werden zu [Concept('concept_radical','$concept_radicals|q$')]. Viele wollen nun, dass der Staat die Märkte zügelt, und [Concept('concept_political_movement','$concept_political_movements|q$')] gegen [GetLawType('law_laissez_faire').GetName] gewinnen an Unterstützung.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other: "Das Vertrauen ist schlagartig zusammengebrochen. Solide Firmen bekommen zu keinem Preis Kredit, und seit dem Morgengrauen stehen Sparer vor den Banken von [ROOT.GetCountry.GetCapital.GetCityHubName] Schlange. Die Banken fordern Kredite über #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#! zurück, und Anleger klammern sich an das Wenige, das ihnen bleibt. [concept_private_construction] wird für #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! Monate halbiert.\n\nRuinierte $capitalists_no_icon$, $aristocrats_no_icon$ und $shopkeepers_no_icon$ geben der Regierung die Schuld, und manche werden zu [Concept('concept_radical','$concept_radicals|q$')]. Viele wollen nun, dass der Staat die Märkte zügelt, und [Concept('concept_political_movement','$concept_political_movements|q$')] gegen [GetLawType('law_laissez_faire').GetName] gewinnen an Unterstützung.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other_no_loans: "Das Vertrauen ist schlagartig zusammengebrochen. Solide Firmen bekommen zu keinem Preis Kredit, und seit dem Morgengrauen stehen Sparer vor den Banken von [ROOT.GetCountry.GetCapital.GetCityHubName] Schlange. Anleger klammern sich an das Wenige, das ihnen bleibt. [concept_private_construction] wird für #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! Monate halbiert.\n\nRuinierte $capitalists_no_icon$, $aristocrats_no_icon$ und $shopkeepers_no_icon$ geben der Regierung die Schuld, und manche werden zu [Concept('concept_radical','$concept_radicals|q$')]. Viele wollen nun, dass der Staat die Märkte zügelt, und [Concept('concept_political_movement','$concept_political_movements|q$')] gegen [GetLawType('law_laissez_faire').GetName] gewinnen an Unterstützung.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.bad_debts: "Die Kredite des Booms sind faul geworden. In den kommenden Monaten senken [concept_spec_bad_debts] [concept_throughput] um #N [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_tp_full_pct')|1]%#!, schwinden dann und sind in #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#! Monaten abgebaut. Bis dahin vergeben Banken keine Kredite, und #v Banken Kredit gewähren#! baut sie nicht ab."
