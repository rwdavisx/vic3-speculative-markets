 SPEC_IL_LEVEL_4_TT: "#header @spec_interest_keen! Interessiert#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)4'), 'SPEC_IL_LEVEL_CURRENT')]\nGilt, solange der Preistrend zwischen #v [Country.MakeScope.ScriptValue('spec_level_from_4')|=+%1]#! und #v [Country.MakeScope.ScriptValue('spec_level_from_5')|=+%1]#! gegenüber seinem langfristigen Durchschnitt liegt\nAktueller Preistrend: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Auswirkungen:#!\n[concept_throughput] der Produzenten: #P +3%#!\nKann enden als: [concept_spec_correction]"
