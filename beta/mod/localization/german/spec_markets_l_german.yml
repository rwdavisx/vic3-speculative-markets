 spec_inquiry_reform_tt: "Unsere Technologie erlaubt eine noch nicht eingeführte [Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')]"
 spec_suspend_panic_tt: "Es herrscht eine [concept_spec_financial_panic]"
