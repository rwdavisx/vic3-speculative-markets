 spec_reform_llr_tt: "#v Banken Kredit gewähren#! kostet #v 50%#! weniger und beendet die Panik einen Monat früher"
 spec_reform_company_tt: "Boomenden kosten #v 30%#! weniger [concept_spec_market_confidence]"
 spec_reform.1.t: "Untersuchungskommission"
 spec_reform.1.d_panic: "Die nach der Panik eingesetzte Kommission hat ihren Bericht vorgelegt: drei Bände mit Aussagen von Bankiers, Maklern und ruinierten Sparern. Ihre Mitglieder sind sich einig, dass die Panik kein Schicksalsschlag war. Über fast alles andere sind sie uneins, und jede Abhilfe hat ihre Fürsprecher in der Kammer."
 spec_reform.1.d_calm: "Während an den Märkten Ruhe herrschte, hat eine Kommission ein Jahr lang Bankiers, Makler und Nationalökonomen angehört. Sie sollte klären, wie der nächste Boom vor einem verheerenden Ende bewahrt werden kann. Ihr Bericht schlägt mehrere Abhilfen vor, und jede hat ihre Fürsprecher in der Kammer."
 spec_reform.1.f: "„In Zeiten wilder Bestürzung zieht ein Bankrott viele nach sich. Am besten verhindert man diese weiteren Zusammenbrüche, indem man den ersten aufhält, der sie verursacht.“"
 spec_reform.1.a: "Die Notenausgabe an das Gold in den Tresoren binden."
 spec_reform.1.b: "Jede solide Bank soll eigene Noten ausgeben dürfen."
 spec_reform.1.c: "Einen Kreditgeber letzter Instanz bestimmen."
 spec_reform.1.d: "Kompanien zur Offenlegung ihrer Bilanzen verpflichten."
 spec_reform.1.e: "Der Kommission für ihre Mühen danken."
 spec_reform.2.t: "Solides Finanzwesen"
 spec_reform.2.d: "Unsere Banken geben ihre Noten nach festen Regeln aus, bei Panik steht ein Kreditgeber bereit, und unsere Kompanien müssen Anlegern offenlegen, was sie besitzen und was sie schulden. Im Ausland werden unsere Anleihen nun mit Aufschlag gehandelt, und [ROOT.GetCountry.GetCapital.GetCityHubName] gilt als sicherer Hafen für Kapital."
 spec_reform.2.f: "„Die erste Pflicht eines Bankiers ist es nicht, Geld zu verdienen, sondern es zu bewahren.“"
 spec_reform.2.a: "Vertrauen ist die Grundlage des Kredits."
