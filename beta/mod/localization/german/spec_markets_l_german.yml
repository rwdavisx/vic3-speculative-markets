 SPEC_PLEDGE_MAKE_TT: "#header Zusage zur Bankenrettung#!\n$TOOLTIP_DELIMITER$\nJede [concept_spec_financial_panic] wird sofort und #P 25%#! günstiger abgewendet, wenn die [concept_treasury] aus ihren Reserven zahlen kann und das Land nicht [concept_default] ist\nDurch eine Panik verlorenes Vertrauen der [concept_spec_exchange]: #P -50%#!\nErhaltene [concept_spec_capital_flight]: #P +50%#! (ab Stellung International oder als [concept_great_power])\nJede Rettung lockert die Kreditstandards\n$TOOLTIP_DELIMITER$\nWird das Land [concept_default], ist die Zusage gebrochen: alles Vertrauen geht verloren, [concept_spec_market_confidence] #N -15#!, [concept_legitimacy] #N -10#! für #v 5#! Jahre\nDer Rückzug der Zusage erfordert #v 24#! Monate Vorlauf[AddLocalizationIf(Not(GetScriptedGui('spec_sgui_pledge').IsValid(GuiScope.SetRoot(Country.MakeScope).End)), 'SPEC_PLEDGE_PLEDGE_WHY')]"
 SPEC_PLEDGE_OUT_TT: "#header $SPEC_PLEDGE_OUT$#!\n$TOOLTIP_DELIMITER$\nJede [concept_spec_financial_panic] wird sofort und #P 25%#! günstiger abgewendet, wenn die [concept_treasury] aus ihren Reserven zahlen kann und das Land nicht [concept_default] ist\nDurch eine Panik verlorenes Vertrauen der [concept_spec_exchange]: #P -50%#!\nErhaltene [concept_spec_capital_flight]: #P +50%#! (ab Stellung International oder als [concept_great_power])\nJede Rettung lockert die Kreditstandards\n$TOOLTIP_DELIMITER$\nWird das Land [concept_default], ist die Zusage gebrochen: alles Vertrauen geht verloren, [concept_spec_market_confidence] #N -15#!, [concept_legitimacy] #N -10#! für #v 5#! Jahre\nDer Rückzug der Zusage erfordert #v 24#! Monate Vorlauf[AddLocalizationIf(Not(GetScriptedGui('spec_sgui_pledge_leave').IsValid(GuiScope.SetRoot(Country.MakeScope).End)), 'SPEC_PLEDGE_PLEDGE_LEAVE_WHY')]"
