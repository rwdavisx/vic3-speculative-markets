 SPEC_BANK_GOOD_TT: "#header [Scope.GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_outstanding_credit] darin: #v [Country.MakeScope.Var(Concatenate('spec_exp_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%1]#!\nEndete sein Boom, würde [concept_spec_market_confidence] #v x[Country.MakeScope.Var(Concatenate('spec_ui_expx_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)1')|2]#! so stark sinken.\n\n#grey Ein Kredit bleibt bis zur Rückzahlung in seiner Ware, auch wenn der Boom abkühlt.#!"
