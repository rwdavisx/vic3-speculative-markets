 concept_spec_financial_centre: "Spitzenbörse"
 concept_spec_financial_centres: "Spitzenbörsen"
 concept_spec_financial_centre_desc: "Die $concept_spec_financial_centres$ sind die #v 5#! Börsen mit den meisten Punkten ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]), höchstens eine je [Concept('concept_country','$concept_countries|q$')], monatlich neu ermittelt. Die Punkte wachsen mit der Quadratwurzel aus #v 6#! Monaten Einnahmen des [concept_investment_pool] sowie mit Vertrauen, Wohlstand pro Kopf, Bankenvierteln, Kompanien, Finanztechnologien, [concept_rank] und Wirtschaftssystem. Der Durchschnitt der besten drei wird als #v 100#! angezeigt.\n\nErster Platz: #P +10%#! [concept_prestige], #P -10%#! Zinssatz für [concept_loans], #P +5#! Monate Kreditgrenze\nLetzter Platz (#v 5#!): #P +2%#!, #P -2%#!, #P +1#! Monat\nDer Bonus auf die Kreditgrenze erfordert [GetTechnology('central_banking').GetName] und Kreditstandards #v Solide#! oder strenger"
 SPEC_CENTRE_PLACE: "#v ##[Country.MakeScope.Var('spec_centre_rank').GetValueWithDefault('(CFixedPoint)0')|0]#!"
 SPEC_CENTRE_PLACE_TT: "Wir stehen auf Rang #v ##[Country.MakeScope.Var('spec_centre_rank').GetValueWithDefault('(CFixedPoint)0')|0]#! unter den [Concept('concept_spec_financial_centre','$concept_spec_financial_centres|q$')] der Welt"
