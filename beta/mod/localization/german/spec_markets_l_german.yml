 concept_spec_long_depression: "Lange Depression"
 concept_spec_long_depression_desc: "Die $concept_spec_long_depression$ ist eine Weltwirtschaftskrise. Sie beginnt, wenn eine [concept_great_power] in eine [concept_spec_financial_panic] gerät, erfasst jedes Land, das sich dann in einer Panik befindet, und breitet sich über enge Verbindungen aus: einen gemeinsamen [concept_market], Untertanen und Suzeräne, Investitionsrechte, starken Handel und ausländischen Besitz.\n\nWeltweiter Börsenkrach (#v 4#! Monate): Kredite frieren ein und [concept_spec_market_confidence] schwindet\nDepression (bis zu #v 5#! Jahre): Investitionen, Bau und Handel verlangsamen sich, und manche Pops werden zu [Concept('concept_radical','$concept_radicals|q$')]\nErholung (#v 1#! Jahr): [concept_spec_market_confidence] kehrt zurück\n\nDie Entscheidungen jeder Regierung beschleunigen ihre eigene Erholung und die der Welt, die einer [concept_great_power] am meisten."
