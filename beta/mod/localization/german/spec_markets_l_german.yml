 SPEC_TM_WARCAP_TT: "#header Grenze für alle Kriege: [Country.MakeScope.Var('spec_tm_warcap').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_war_sum').GetValueWithDefault('(CFixedPoint)0')|+=2] durch alle Kriege\nBegrenzt auf #N -4#! bis #P +0.5#! pro Monat"
