 SPEC_IW_SLICE_SHARE: "[SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1.5'), 'SPEC_IW_SHARE_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2.5'), 'SPEC_IW_SHARE_2', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3.5'), 'SPEC_IW_SHARE_3', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)4.5'), 'SPEC_IW_SHARE_4', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)5.5'), 'SPEC_IW_SHARE_5', 'SPEC_IW_SHARE_6')))))]"
