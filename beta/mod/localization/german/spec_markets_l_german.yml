 je_spec_depression_reason: "Paniken an den großen Börsen sind zur Weltkrise geworden. Investitionen und Bau stocken, der Handel ist zurückgegangen und die Arbeitslosen werden unruhig. Die [concept_spec_long_depression] endet, sobald sich die Welt erholt hat, spätestens jedoch nach #v 5#! Jahren.\n\nUnsere Entscheidungen beschleunigen unsere eigene Erholung und die der Welt. Die Entscheidungen der [Concept('concept_great_power','$concept_great_powers|q$')] fallen stärker ins Gewicht. Sobald unsere eigene Erholung abgeschlossen ist, kehrt [concept_spec_market_confidence] hier früher zurück als anderswo."
