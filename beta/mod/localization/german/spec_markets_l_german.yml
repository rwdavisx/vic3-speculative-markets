 SPEC_IL_LEVEL_2_TT: "#header @spec_interest_doubtful! Zweifelnd#![AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_word_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_LEVEL_CURRENT')]\nGilt, solange der Preistrend zwischen #v [Country.MakeScope.ScriptValue('spec_level_from_2')|=+%1]#! und #v [Country.MakeScope.ScriptValue('spec_level_from_3')|=+%1]#! gegenüber seinem langfristigen Durchschnitt liegt\nAktueller Preistrend: #v [Subtract_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_fast_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var(Concatenate('spec_slow_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'))|=+%1]#!\n$TOOLTIP_DELIMITER$\n#title Auswirkungen:#!\n[concept_throughput] der Produzenten: #N -5%#!\nNach einem Boomende bleibt eine sich erholende Ware eine Weile auf dieser Stufe oder darunter\nInvestitionen können gefördert werden, außer die Ware erholt sich"
