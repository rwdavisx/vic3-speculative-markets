 SPEC_EFFECT_GIVEN_TT: "#header Diesen Monat vergebene Kredite#!\n#v @money![Country.MakeScope.Var('spec_credit_given').GetValueWithDefault('(CFixedPoint)0')|D]#! diesen Monat\n$TOOLTIP_DELIMITER$\nVergaberate: #v [SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_credit_rate'), '(CFixedPoint)0.01'), 'SPEC_CREDITW_0', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_credit_rate'), '(CFixedPoint)0.5'), 'SPEC_CREDITW_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_credit_rate'), '(CFixedPoint)1.15'), 'SPEC_CREDITW_2', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('spec_credit_rate'), '(CFixedPoint)1.8'), 'SPEC_CREDITW_3', 'SPEC_CREDITW_4'))))]#!\n$ECONOMIC_SYSTEM_GC_LINK$: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_law_mult'), '(CFixedPoint)1')|+%0]#!\nFinanztechnologien: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_tech_credit'), '(CFixedPoint)1')|+%0]#!\n[concept_spec_credit_policy]: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_stance_credit'), '(CFixedPoint)1')|+%0]#!\n[concept_spec_banking_reforms]: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_reform_credit'), '(CFixedPoint)1')|+%0]#!\n[concept_spec_lending_standards]: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_credit'), '(CFixedPoint)1')|+%0]#!\n[concept_spec_exchange]: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_exch_credit'), '(CFixedPoint)1')|+%0]#!\n\nBanken vergeben einmal im Monat Kredite, solange [concept_spec_market_confidence] über #v 55#! liegt, und mehr, je höher es steigt. Sie vergeben nichts jenseits der Kreditgrenze, unter der Panikschwelle, während einer [concept_spec_financial_panic] oder des weltweiten Börsenkrachs, solange [concept_spec_bad_debts] bestehen, oder bei [Concept('concept_spec_credit_policy','$concept_spec_credit_policy_tight|q$')].\n\nDie Änderung des [concept_investment_pool] wird pro Woche angezeigt."
