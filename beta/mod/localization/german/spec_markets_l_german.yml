 SPEC_TM_REVOLUTION_TT: "#header [concept_revolution]: [Country.MakeScope.Var('spec_tm_revolution').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#N -2#! durch eine [concept_revolution]"
 concept_spec_market_confidence: "Marktvertrauen"
 concept_spec_market_confidence_desc: "$concept_spec_market_confidence$ misst, wie Anleger den [concept_market] in einem [concept_country] sehen, von #v 0#! (#v Panik#!) bis #v 100#! (#v Manie#!). Angst bremst Investitionen und erhöht die Zinsen für [concept_loans], während Gier Investitionen beschleunigt.\n\nEin Boom bei [Concept('concept_good','$concept_goods|q$')] hebt es, während [Concept('concept_spec_boom_end','$concept_spec_boom_ends|q$')], [Concept('concept_spec_foreign_panic','$concept_spec_foreign_panics|q$')], [Concept('concept_diplomatic_play','$concept_diplomatic_plays|q$')] und [concept_war] es senken. Booms und ihr Ende sind stärker, wo $building_financial_district$ einen größeren Teil der Wirtschaft ausmachen, und schwächer, wo $building_manor_house$ in der Überzahl sind.\n\nÜber #v 55#! vergeben Banken Kredite an den [concept_investment_pool], bei #v 80#! gerät der Markt in [concept_spec_speculative_mania], und unter #v 25#! beginnt eine [concept_spec_financial_panic]."
 concept_spec_speculative_mania: "Spekulationsmanie"
 concept_spec_speculative_mania_desc: "Ein [concept_market] befindet sich in $concept_spec_speculative_mania$, solange [concept_spec_market_confidence] mindestens #v 80#! beträgt. Banken vergeben die meisten Kredite an den [concept_investment_pool], doch ein [concept_spec_boom_end] kostet mehr $concept_spec_market_confidence$. Nach einer langen oder besonders starken Manie gewinnen [Concept('concept_political_movement','$concept_political_movements|q$')], die für [GetLawType('law_laissez_faire').GetName] eintreten, für einige Jahre mehr Unterstützung."
 concept_spec_financial_panic: "Finanzpanik"
 concept_spec_financial_panics: "Finanzpaniken"
 concept_spec_financial_panic_desc: "Eine $concept_spec_financial_panic$ beginnt, wenn [concept_spec_market_confidence] unter seine Panikschwelle von #v 25#! fällt. Ab #v 3#! Monaten [concept_spec_leverage] steigt die Schwelle, bis zu #v 65#!. Mit wenigen $building_financial_district$ ist sie niedriger, bis hinab zu #v 20#!.\n\nSie senkt [concept_throughput] aller Gebäude und die eingenommenen Steuern, kostet die [concept_treasury] jede Woche Unterstützung für die Arbeitslosen, bis sie endet, bremst [concept_private_construction] und Investitionen, senkt den Bonus auf [concept_throughput] durch [Concept('concept_company','$concept_companies|q$')], macht manche Anleger zu [Concept('concept_radical','$concept_radicals|q$')] und lässt Banken [concept_spec_outstanding_credit] aus dem [concept_investment_pool] abziehen.\n\nJedes verbundene [concept_country] erleidet eine [concept_spec_foreign_panic], während Geld anderswo zu einer ruhigen [Concept('concept_great_power','$concept_great_powers|q$')] flieht. Noch einige Jahre danach gewinnen [Concept('concept_political_movement','$concept_political_movements|q$')] gegen [GetLawType('law_laissez_faire').GetName] an Unterstützung."
 concept_spec_foreign_panic: "Auslandspanik"
 concept_spec_foreign_panics: "Auslandspaniken"
 concept_spec_foreign_panic_desc: "Eine $concept_spec_foreign_panic$ senkt das [concept_spec_market_confidence] in einem [concept_country], wenn eine [concept_spec_financial_panic] in einem verbundenen Land beginnt. Verbindungen entstehen durch einen gemeinsamen [concept_market], Untertanenverhältnisse, Investitionsrechte, starken Handel oder Eigentum an der Wirtschaft. Engere Verbindungen verursachen größere Verluste. [GetLawType('law_free_trade').GetName] stärkt Handelsverbindungen, andere Handelspolitiken schwächen sie. Ein [concept_embargo] unterbricht die Handelsverbindung."
 concept_spec_boom_end: "Boomende"
 concept_spec_boom_ends: "Boomenden"
 concept_spec_boom_end_desc: "Ein Boom endet, wenn [concept_spec_investor_interest] an einer [concept_good] nach einem Anstieg zurückgeht, und je höher es stieg, desto tiefer der Fall: Ein Boom mit Höchststand #v Interessiert#! endet in einer [concept_spec_correction], einer mit #v Eifrig#! in einem [concept_spec_bust] und einer mit #v Fieberhaft#! in einem [concept_spec_collapse].\n\nJedes Ende senkt [concept_spec_market_confidence], stärker bei größeren Booms und bei [Concept('concept_good','$concept_goods|q$')] mit größerem Anteil am Handel auf dem [concept_market]. Danach halten sich Anleger zurück, während sich die $concept_good$ erholt, und wo eine [concept_company] sie herstellt, verliert ihr Industriezweig [concept_throughput]. Der Höchststand, an dem gemessen wird, sinkt jeden Monat etwas, sodass ein langsam abkühlender Boom sanfter endet oder ganz ohne $concept_spec_boom_end$."
 concept_spec_correction: "Korrektur"
 concept_spec_correction_desc: "Eine $concept_spec_correction$ ist das mildeste [concept_spec_boom_end]. Sie tritt ein, wenn [concept_spec_investor_interest] an einer [concept_good] vom Höchststand #v Interessiert#! auf #v Zweifelnd#! zurückfällt.\n\nSie senkt [concept_spec_market_confidence] geringfügig. Anleger halten sich danach #v 3#! Monate von der $concept_good$ fern. Wird sie von einer [concept_company] hergestellt, verliert deren Wirtschaftszweig für #v 90#! Tage #N 2.5%#! [concept_throughput], und #N 25%#! mehr für jede erforschte Technologie von [GetTechnology('corporate_charters').GetName] und [GetTechnology('corporate_management').GetName]."
 concept_spec_bust: "Einbruch"
 concept_spec_bust_desc: "Ein $concept_spec_bust$ ist ein heftigeres [concept_spec_boom_end] als eine [concept_spec_correction]. Er tritt ein, wenn [concept_spec_investor_interest] an einer [concept_good] vom Höchststand #v Eifrig#! auf #v Zweifelnd#! zurückfällt.\n\nEr senkt [concept_spec_market_confidence] stärker, etwa #v 2#!-mal so viel wie eine [concept_spec_correction] beim selben Boom. Anleger halten sich danach #v 6#! Monate von der $concept_good$ fern. Wird sie von einer [concept_company] hergestellt, verliert deren Wirtschaftszweig für #v 180#! Tage #N 5%#! [concept_throughput], und #N 25%#! mehr für jede erforschte Technologie von [GetTechnology('corporate_charters').GetName] und [GetTechnology('corporate_management').GetName]."
 concept_spec_collapse: "Zusammenbruch"
 concept_spec_collapse_desc: "Ein $concept_spec_collapse$ ist das schlimmste [concept_spec_boom_end]. Er tritt ein, wenn [concept_spec_investor_interest] an einer [concept_good] vom Höchststand #v Fieberhaft#! bis auf #v Fliehend#! fällt.\n\nEr senkt [concept_spec_market_confidence] stark, etwa #v 5#!-mal so viel wie eine [concept_spec_correction] beim selben Boom. Anleger halten sich danach #v 12#! Monate von der $concept_good$ fern. Wird sie von einer [concept_company] hergestellt, verliert deren Wirtschaftszweig ein Jahr lang #N 10%#! [concept_throughput], und #N 25%#! mehr für jede erforschte Technologie von [GetTechnology('corporate_charters').GetName] und [GetTechnology('corporate_management').GetName]. Betrifft ein $concept_spec_collapse$ einen großen Anteil am Handel des [concept_market], kann er eine [concept_spec_financial_panic] auslösen."
 concept_spec_investor_interest: "Anlegerinteresse"
 concept_spec_investor_interest_desc: "$concept_spec_investor_interest$ gibt an, wie attraktiv Anleger die [Concept('concept_building','$concept_buildings|q$')] finden, die eine [concept_good] herstellen. Es steigt, solange [concept_market_price] über seinem langfristigen Durchschnitt liegt, und sinkt, solange er darunter liegt, von #v Fliehend#! bis #v Fieberhaft#!.\n\n[concept_throughput] dieser Gebäude folgt ihm, von #N -10%#! bei #v Fliehend#! bis #P +8%#! bei #v Fieberhaft#!, ebenso [concept_prosperity] von [Concept('concept_company','$concept_companies|q$')], die die $concept_good$ herstellen. Eine boomende $concept_good$ hebt [concept_spec_market_confidence]. Geht das Interesse zurück, endet der Boom in einem [concept_spec_boom_end]."
 concept_spec_credit_policy: "Kreditpolitik"
 concept_spec_credit_policy_tight: "Knappe Kredite"
 concept_spec_credit_policy_normal: "Normale Kredite"
 concept_spec_credit_policy_loose: "Reichliche Kredite"
 concept_spec_credit_policy_desc: "$concept_spec_credit_policy$ legt fest, wie freizügig Banken Kredite an den [concept_investment_pool] vergeben. Sie erfordert [GetTechnology('central_banking').GetName] und kann $concept_spec_credit_policy_tight$, $concept_spec_credit_policy_normal$ oder $concept_spec_credit_policy_loose$ sein. Straffere Kredite bremsen Investitionen und drücken [concept_spec_market_confidence], wenn es hoch steht, während bei lockereren Krediten [concept_spec_outstanding_credit] wächst. Eine Änderung sperrt sie für #v 6#! Monate."
 concept_spec_leverage: "Kredithebel"
 concept_spec_leverage_desc: "$concept_spec_leverage$ misst [concept_spec_outstanding_credit] in einem [concept_country], in Monaten an Einnahmen des [concept_investment_pool].\n\nJeder volle Monat bringt #P +2%#! [concept_throughput], bis zu #P +24%#!. Während einer [concept_spec_financial_panic] oder solange [concept_spec_bad_debts] bestehen, schwindet er um #N 2%#! pro Monat. Über #v 3#! Monaten beginnt eine [concept_spec_financial_panic] schon bei höherem [concept_spec_market_confidence] und hinterlässt [concept_spec_bad_debts]."
 concept_spec_bad_debts: "Faule Kredite"
 concept_spec_bad_debts_desc: "$concept_spec_bad_debts$ sind Verluste, die eine [concept_spec_financial_panic] hinterlässt, und wachsen mit [concept_spec_leverage] über #v 3#! Monaten.\n\nJeder Punkt senkt [concept_throughput] um #N 0.4%#! und Investitionen um #N 0.75%#!. Sie wachsen um #v 3#! Punkte pro Monat, sinken dann um #v 0.6#! Punkte pro Monat und brauchen im schlimmsten Fall etwa #v 6#! Jahre, bis sie abgebaut sind. Solange sie bestehen, vergeben Banken keine Kredite. #v Banken Kredit gewähren#! baut sie nicht ab. #v Faule Kredite aufkaufen#! halbiert sie, einmal solange sie bestehen."
 concept_spec_lending_standards: "Kreditstandards"
 concept_spec_lending_standards_desc: "$concept_spec_lending_standards$ geben an, wie vorsichtig Banken in einem [concept_country] Kredite vergeben: #v Streng#!, #v Umsichtig#!, #v Solide#!, #v Locker#! oder #v Leichtfertig#!. Lockerere Banken vergeben mehr Kredite an den [concept_investment_pool] und mehr davon in Booms, sodass diese Booms härter enden und eine Bankenrettung mehr kostet.\n\nSie lockern sich in jedem Monat ohne [concept_spec_financial_panic] ein wenig, von #v Streng#! bis #v Leichtfertig#! in etwa #v 20#! ruhigen Jahren, und stärker nach jeder Bankenrettung oder jedem #v Faule Kredite aufkaufen#!. Sie werden strenger, wenn ein Boom endet, und vor allem, wenn eine $concept_spec_financial_panic$ ohne Bankenrettung ihren Lauf nimmt."
 concept_spec_outstanding_credit: "Ausstehender Kredit"
 concept_spec_outstanding_credit_desc: "$concept_spec_outstanding_credit$ ist der Kredit, den Banken an den [concept_investment_pool] vergeben haben und der noch nicht zurückgezahlt ist. Banken vergeben Kredite, solange [concept_spec_market_confidence] über #v 55#! liegt, bis zu einer Kreditgrenze von #v 3#! Monaten an Fondseinnahmen. [GetTechnology('central_banking').GetName] fügt #v 5#! Monate hinzu, [GetTechnology('investment_banks').GetName] und [GetTechnology('international_exchange_standards').GetName] je #v 2#!.\n\nJeden Monat werden #v 2%#! aus dem Fonds zurückgezahlt. Beginnt eine [concept_spec_financial_panic], wird ein Teil davon abgezogen.\n\n#lore Banken liehen in den 1840ern gegen Eisenbahnaktien, 1837 gegen Baumwolle und 1873 in Wien gegen Bauland und wurden erwischt, als diese Booms platzten.#!"
