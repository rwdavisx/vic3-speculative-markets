 spec_lever_encourage: "Investitionssubventionen"
 spec_lever_market_tt: "Das Wirtschaftssystem $ECONOMIC_SYSTEM_GC_LINK$ lässt Anleger auf Preise reagieren"
 spec_lever_not_restrain_tt: "Spekulation mit dieser Ware wird nicht eingedämmt"
 spec_lever_not_encourage_tt: "Investitionen in diese Ware werden nicht gefördert"
 spec_levers: "Markteingriffe"
 spec_lever_authority_tt: "Genügend [concept_authority] ist verfügbar"
 spec_lever_fits_restrain_tt: "[concept_spec_investor_interest] liegt mindestens auf #v Eifrig#! oder das Ende des Booms würde mindestens #v 2#! [concept_spec_market_confidence] kosten"
 spec_lever_fits_encourage_tt: "[concept_spec_investor_interest] liegt unter #v Interessiert#!, die [concept_good] erholt sich nicht von einem Boom und hat keinen Boom, der in einem [concept_spec_bust] oder [concept_spec_collapse] enden könnte"
 SPEC_LEVER_RESTRAIN_TT: "#header Spekulation mit [Goods.GetName] eindämmen#!\n$TOOLTIP_DELIMITER$\n[concept_spec_investor_interest]: sinkt über einige Monate auf #v Gelassen#!\n[concept_authority]: #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#! pro Monat#indent_newline:3 \n#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! durch Grundwert (halbe Verbrauchssteuer darauf)\n#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! durch Handelsanteil (#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! unseres Marktes)#!\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_DOWN', 'SPEC_LEVER_NONE')][concept_budget_additional_income]: #P @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_levy_', Goods.GetKey))|D]#! pro Woche, eine Abgabe von 10 % unserer wöchentlichen Produktion zum Grundpreis\n\nSolange eingedämmt, kann der Boom weder wachsen noch sofort enden. Er klingt über etwa ein Jahr als [concept_spec_correction] ab und kostet jeden Monat etwas [concept_spec_market_confidence].\n\n#lore Wie der Bubble Act von 1720, der nach der Südseeblase neue Aktiengesellschaften beschränkte.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_restrain_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_restrain').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_LEVER_ENCOURAGE_TT: "#header Investitionen in [Goods.GetName] fördern#!\n$TOOLTIP_DELIMITER$\n[concept_spec_investor_interest]: steigt über einige Monate auf #v Interessiert#!\n[concept_authority]: #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#! pro Monat#indent_newline:3 \n#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! durch Grundwert (halbe Verbrauchssteuer darauf)\n#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! durch Handelsanteil (#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! unseres Marktes)#!\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_UP', 'SPEC_LEVER_NONE')][concept_budget_additional_expenses]: #N @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_subsidy_', Goods.GetKey))|D]#! pro Woche, eine Subvention von 20 % unserer wöchentlichen Produktion zum Grundpreis\n\nWird von selbst aufgehoben, sobald die [concept_good] #v Eifrig#! wird, damit ihr Boom von allein enden kann.\n\n#lore Wie die garantierten Renditen, die Britisch-Indien und Frankreich Mitte des 19. Jahrhunderts Eisenbahninvestoren boten.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_encourage_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_encourage').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
