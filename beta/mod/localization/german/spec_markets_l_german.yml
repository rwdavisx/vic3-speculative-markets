 spec_relief_when_tt: "Eine [concept_spec_financial_panic] oder die [concept_spec_long_depression] hält an"
 spec_relief_cd_tt: "Keine Notstandsarbeiten in den letzten #v 12#! Monaten"
 spec_suspend_tt: "Die [concept_spec_financial_panic] endet innerhalb von #v 2#! Monaten, bis dahin in voller Stärke\n[concept_spec_market_confidence] steigt um #v 15#!\nFür #v 10#! Jahre wächst der [concept_spec_speculative_excess] #v 50%#! schneller\n[concept_spec_lending_standards] lockern sich wie nach einer Bankenrettung"
 spec_suspend_act: "Bankgesetz aussetzen"
 spec_suspend_act_desc: "Der Bank erlauben, über die Grenze hinaus zu leihen, die das Gesetz ihren Banknoten setzt. Die Panik legt sich binnen Monaten, ohne die Staatskasse etwas zu kosten, doch Anleger lernen, dass die Regierung stets einspringen wird. Gilt für diese Panik als #v Banken Kredit gewähren#!.\n\n#lore Großbritannien setzte seinen Bank Charter Act 1847, 1857 und 1866 aus.#!"
 spec_relief_works_button: "Notstandsarbeiten"
 spec_relief_works_button_desc: "Während der Krise öffentliche Bauvorhaben und Hilfen finanzieren: Sozialhilfe, mehr Bauleistung und weniger Radikale für #v 12#! Monate. Die wöchentlichen Kosten wachsen mit unserem [concept_gdp]."
 spec_convert_debt: "Staatsschulden umschulden"
 spec_convert_debt_desc: "Solange Anleger zuversichtlich sind, können wir unsere Anleihen gegen neue mit niedrigerem Zinssatz tauschen. Gläubiger, die von den alten Zinsen lebten, werden es uns nicht danken."
 spec_inquiry: "Untersuchungskommission"
 spec_inquiry_desc: "Eine Kommission einsetzen, die Bankiers, Makler und ruinierte Sparer anhört und Vorschläge zur Führung unserer Banken und Kompanien vorlegt. Ihr Bericht setzt eine [Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')] um, die unsere Technologie erlaubt. Ihre Sitzungen beanspruchen die Aufmerksamkeit der Regierung für #v 6#! Monate."
 spec_debt_converted: "Umgeschuldete Anleihen"
 spec_debt_converted_desc: "Anleihen wurden zu einem niedrigeren Zins umgeschuldet, als Anleger bereitwillig Geld verliehen"
 spec_relief_works: "Notstandsarbeiten"
 spec_relief_works_desc: "Öffentliche Bauvorhaben und Hilfen für jene, die durch die Krise ihre Arbeit verloren haben"
 spec_relief_costs: "Notstandsarbeitskosten"
