 SPEC_DRIVER_RESTRAIN_TT: "#header Eingedämmte Booms: [Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] durch in diesem Monat abgebaute Booms\n#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#! durch [concept_spec_market_conditions]\n$TOOLTIP_DELIMITER$\nEin eingedämmter Boom wird langsam abgebaut, als [concept_spec_correction], statt in einem Sturz zu enden. Das kostet jeden Monat etwas."
 SPEC_DRIVER_CAUTION_TT: "#header Regierung und Ereignisse: [Country.MakeScope.Var('spec_c_caution').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\nEine einmalige Änderung in diesem Monat durch unsere Entscheidungen und durch Marktereignisse."
 SPEC_DRIVER_LIMIT_TT: "#header Unter- und Obergrenze: [Country.MakeScope.Var('spec_c_limit').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_market_confidence] kann nicht unter #v 0#! fallen oder über #v 100#! steigen, daher zählte dieser Teil der Änderung dieses Monats nicht."
 SPEC_DRIVER_RESCUE_TT: "#header Bankenrettung: [Country.MakeScope.Var('spec_c_rescue').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\nEin einmaliger Anstieg durch #v Banken Kredit gewähren#! oder #v Bankgesetz aussetzen#!. Er kann [concept_spec_market_confidence] nicht über #v 100#! heben."
 SPEC_DRIVER_RESCUE: "Bankenrettung"
 SPEC_DRIVER_WAREND: "Kriegsende"
 SPEC_DRIVER_WAREND_TT: "#header Kriegsende: [Country.MakeScope.Var('spec_c_warend').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#v x[Country.MakeScope.Var('spec_war_stakes_now').GetValueWithDefault('(CFixedPoint)0')|%0]#! der vollen Wirkung, durch unsere [concept_casualties]\n$TOOLTIP_DELIMITER$\nDie volle Wirkung, je nach Kriegsausgang:\nGewonnen, [concept_war_goal] durchgesetzt: #P +4#!\nGewonnen, nichts durchgesetzt: #P +1#!\nVerloren, [concept_war_goal] gegen uns durchgesetzt: #N -8#!\nVerloren, nichts durchgesetzt: #N -2#!\nKeine Seite gewann: #N -1#!\n\nSkaliert nach unseren Verlusten: mindestens #v 25%#! der Wirkung, die volle, sobald der Krieg #v 25%#! unserer Streitkräfte gekostet hat."
 SPEC_DRIVER_BURST: "Platzende Blase"
 SPEC_DRIVER_BURST_TT: "#header Platzende Blase: [Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0'), Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_burst_per_heat'), '(CFixedPoint)-1'))|0]#! durch [concept_spec_speculative_excess]\n#N -[Country.MakeScope.ScriptValue('spec_burst_per_heat')|2]#! je Punkt\nBegrenzt auf #N -[Country.MakeScope.ScriptValue('spec_burst_max')|0]#!\n$TOOLTIP_DELIMITER$\nFällt [concept_spec_market_confidence] unter #v 60#!, nachdem ein Boom es über #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#! gehoben hat, platzt die Blase. Je länger und höher der Boom lief, desto größer der Verlust.\n\nNur ein Land mit [GetTechnology('stock_exchange').GetName] bildet Blasen."
 SPEC_DRIVER_CAUTION: "Regierung und Ereignisse"
 SPEC_DRIVER_RESTRAIN: "Eingedämmte Booms"
 SPEC_DRIVER_LIMIT: "Unter- und Obergrenze"
 SPEC_DRIVER_BOOM: "Boomende Waren"
 SPEC_DRIVER_BOOM_TT: "#header Boomende Waren: [Country.MakeScope.Var('spec_c_boom').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] durch #v [Country.MakeScope.Var('spec_n_boom').GetValueWithDefault('(CFixedPoint)0')|0]#! Boom bei [Concept('concept_good','$concept_goods|q$')][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_BOOM_CAP')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_steady'), '(CFixedPoint)1')), 'SPEC_BOOM_STEADY')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_fin_boom'), '(CFixedPoint)1')), 'SPEC_BOOM_FIN')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_boom_rule'), '(CFixedPoint)1')), 'SPEC_BOOM_RULE')]\n$TOOLTIP_DELIMITER$\nJeder Boom erhöht [concept_spec_market_confidence] entsprechend seinem Anteil am [concept_market]. Keine Wirkung während einer [concept_spec_financial_panic]. [GetTechnology('stock_exchange').GetName] und [GetTechnology('investment_banks').GetName] vergrößern Booms, ebenso [GetTechnology('modern_financial_instruments').GetName]."
 SPEC_BOOM_CAP: "\nBegrenzt auf #v +3#! vor Multiplikatoren"
 SPEC_BOOM_STEADY: "\n#v x[Country.MakeScope.ScriptValue('spec_steady')|2]#! durch Herrenhäuser"
 SPEC_BOOM_FIN: "\n#v x[Country.MakeScope.ScriptValue('spec_fin_boom')|2]#! durch Finanztechnologien"
 SPEC_BOOM_RULE: "\n#v x[Country.MakeScope.ScriptValue('spec_boom_rule')|2]#! durch Marktschwankungen"
 SPEC_DRIVER_CRASH: "Beendete Booms"
 SPEC_DRIVER_CRASH_TT: "#header Beendete Booms:[Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\nGrößter im letzten Monat: #v [Country.MakeScope.Var('spec_crashed').GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0')|+=2] durch die Größe der beendeten Booms\n#tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#! durch [concept_spec_market_conditions][AddLocalizationIf(Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-40')), 'SPEC_CRASH_CAP')]\n$TOOLTIP_DELIMITER$\nJedes [concept_spec_boom_end] senkt [concept_spec_market_confidence]. Je größer der Boom und sein Anteil am [concept_market], desto größer der Verlust. [GetTechnology('mutual_funds').GetName] mildert ihn, [GetTechnology('modern_financial_instruments').GetName] verstärkt ihn."
 SPEC_CRASH_CAP: "\nBegrenzt auf #N -40#! pro Monat"
 SPEC_DRIVER_FOREIGN: "Auslandspaniken"
 SPEC_FOREIGN_HIT: "\n#N -20#! durch eine [concept_spec_foreign_panic]\n#v x[Country.MakeScope.Var('spec_fh_size').GetValueWithDefault('(CFixedPoint)0')|2]#! durch deren Wirtschaft im Vergleich zu unserer\n#v x[Country.MakeScope.Var('spec_fh_tie').GetValueWithDefault('(CFixedPoint)0')|2]#! durch unsere [concept_spec_market_tie]\n#v x[Country.MakeScope.Var('spec_fh_reach').GetValueWithDefault('(CFixedPoint)0')|2]#! durch deren [concept_rank][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_foreign_loss_mult'), '(CFixedPoint)1')), 'SPEC_FOREIGN_UNSTD')]"
 SPEC_FOREIGN_UNSTD: "\n#v x[Country.MakeScope.ScriptValue('spec_foreign_loss_mult')|2]#! ohne [GetTechnology('currency_standards').GetName]"
 SPEC_FOREIGN_FLIGHT: "\n[Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')|+=2] durch [concept_spec_capital_flight]"
 SPEC_DRIVER_FOREIGN_TT: "#header Auslandspaniken: [Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\nZuletzt: #v [Country.MakeScope.Var('spec_foreign_src').GetCountry.GetName]#!\n$TOOLTIP_DELIMITER$[AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_HIT')][AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_FLIGHT')]\n$TOOLTIP_DELIMITER$\nGleicher [concept_market]: #v [Country.MakeScope.ScriptValue('spec_tie_market')|%0]#!\nKlientelland oder Suzerän: #v 80%#!\nInvestitionsrechte im Ausland: #v [Country.MakeScope.ScriptValue('spec_tie_investment')|%0]#!\nIntensiver Handel zwischen Märkten: #v [Country.MakeScope.ScriptValue('spec_tie_trade')|%0]#!\nAuslandsbesitz an unserer Wirtschaft: bis zu #v 90%#!\n\nEine [concept_spec_financial_panic] in einem mit uns verbundenen [concept_country] senkt hier [concept_spec_market_confidence], umso stärker, je enger die [concept_spec_market_tie] und je größer ihre Wirtschaft im Vergleich zu unserer ist. Eine [concept_great_power] gibt den vollen Verlust weiter, eine Mittelmacht die Hälfte, kleinere Länder wenig. Eine aus dem Ausland übernommene Panik breitet sich nicht weiter aus. Ohne [GetTechnology('currency_standards').GetName] ist der Verlust ein Viertel größer."
 SPEC_DRIVER_TURMOIL: "Krieg und Unruhen"
 SPEC_DRIVER_TURMOIL_TT: "#header Krieg und Unruhen: [Country.MakeScope.Var('spec_c_turmoil').GetValueWithDefault('(CFixedPoint)0')|+=2]#!$SPEC_ITEMS_TURMOIL$\n$TOOLTIP_DELIMITER$\nJeder [concept_war], laut [concept_spec_war_news]: #N -3#! bis #P +0.15#! pro Monat\nAlle Kriege zusammen: #N -4#! bis #P +0.5#! pro Monat\n[concept_diplomatic_play] ohne Krieg: #N -0.5#! pro Monat\nSchwindende Landeskasse: bis zu #N -3#! pro Monat, ab #v 20#! Wochen vor dem [concept_bankruptcy]\n[concept_default]: #N -5#! pro Monat\n[concept_revolution]: #N -2#! pro Monat\n\nAuf eine Zahl zeigen, um den Grund zu sehen."
 SPEC_DRIVER_MOOD: "Marktstimmung"
 SPEC_DRIVER_MOOD_TT: "#header Marktstimmung: [Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0')|+=2] durch die Verschiebung dieses Monats\n[Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0'))|+=2] durch die Stimmung des Vormonats\n$TOOLTIP_DELIMITER$\nDie [concept_spec_market_mood] verschiebt sich jeden Monat zufällig, bis zu #v 0.75#! in beide Richtungen, und #v 75%#! davon wirken im nächsten Monat nach."
 SPEC_DRIVER_DRIFT: "Rückkehr zum Normalwert"
 SPEC_DRIVER_DRIFT_TT: "#header Rückkehr zum Normalwert: [Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0'), Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100'))|+=1] durch den Abstand zu [concept_spec_baseline] (#v 55#!)\n#v x[Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100')|%1]#! pro Monat erholt\n$TOOLTIP_DELIMITER$\n[GetTechnology('macroeconomics').GetName] beschleunigt dies um die Hälfte."
 SPEC_DRIVER_TIGHT: "Knappe Kredite"
 SPEC_DRIVER_GROWTH: "Wachstum"
 SPEC_DRIVER_GROWTH_TT: "#header Wachstum: [Country.MakeScope.Var('spec_c_growth').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#v [Country.MakeScope.Var('spec_growth').GetValueWithDefault('(CFixedPoint)0')|=+%1]#! durch [concept_gdp] im Vergleich zum jüngsten Durchschnitt\n#v -2%#! durch normales Wachstum\n$TOOLTIP_DELIMITER$\nJe #v 1%#! Wachstum über oder unter dem Normalwert verschiebt sich [concept_spec_market_confidence] um #v 0.1#! pro Monat, bis zu #v 0.6#! in beide Richtungen."
 SPEC_DRIVER_BUSINESS: "Geschäftsklima"
 SPEC_DRIVER_BUSINESS_TT: "#header Geschäftsklima: [Country.MakeScope.Var('spec_c_business').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[concept_approval] der Industriellen: #v [Country.MakeScope.ScriptValue('spec_ind_approval')|0]#!\n\nLoyal (#v 10#! oder mehr): #P +0.4#! pro Monat\nZufrieden (#v 5#! oder mehr): #P +0.2#! pro Monat\nUnzufrieden (#v -5#! oder weniger): #N -0.2#! pro Monat\nWütend (#v -10#! oder weniger): #N -0.4#! pro Monat"
 SPEC_DRIVER_TIGHT_TT: "#header Knappe Kredite: [Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.1')|1]#! von [concept_spec_market_confidence] über #v 60#!\n#N -10%#! davon pro Monat, durch [Concept('concept_spec_credit_policy','$concept_spec_credit_policy_tight|q$')]\n$TOOLTIP_DELIMITER$\nDas kühlt einen Boom über Monate ab statt auf einmal."
 concept_spec_market_conditions: "Marktbedingungen"
 concept_spec_market_conditions_desc: "$concept_spec_market_conditions$ bestimmen, wie viel [concept_spec_market_confidence] ein [concept_spec_boom_end] kostet. Je höher $concept_spec_market_confidence$ beim Ende eines Booms steht, desto größer der Verlust. Steht $concept_spec_market_confidence$ bei #v 55#!, haben sie keine Wirkung. Bankenviertel, Herrenhäuser und Finanztechnologien verändern sie ebenfalls."
 concept_spec_baseline: "Basisvertrauen"
 concept_spec_baseline_desc: "Sich selbst überlassen, kehrt [concept_spec_market_confidence] zu seinem $concept_spec_baseline$ von #v 55#! zurück, von oben wie von unten. Je weiter es abgewichen ist, desto schneller kehrt es zurück."
 concept_spec_market_mood: "Marktstimmung"
 concept_spec_market_mood_desc: "Die $concept_spec_market_mood$ ist der Ausschlag der Anlegerstimmung ohne einzelne Ursache. Jeden Monat verschiebt sie sich zufällig, bis zu #v 0.75#! in beide Richtungen, und #v 75%#! davon wirken im nächsten Monat nach, sodass gute und schlechte Phasen eine Weile anhalten, bevor sie abklingen."
 concept_spec_market_tie: "Marktbindung"
 concept_spec_market_tie_desc: "Eine $concept_spec_market_tie$ beschreibt, wie eng ein [concept_country] dem [concept_market] eines anderen folgt. Sie bestimmt, wie viel einer [concept_spec_financial_panic] zwischen ihnen übergeht.\n\nBesitz zählt, sobald ein Land #v 10%#! vom [concept_gdp] des anderen besitzt, und ist am stärksten bei #v 30%#!. [GetLawType('law_free_trade').GetName] stärkt die Handelsbindung, andere Handelspolitiken schwächen sie. [GetTechnology('international_exchange_standards').GetName] stärkt Markt- und Investitionsbindungen. Ein [concept_embargo] kappt die Handelsbindung."
 concept_spec_capital_flight: "Kapitalflucht"
 concept_spec_capital_flight_desc: "Beginnt eine [concept_spec_financial_panic], flieht Geld in die Sicherheit. Jede [concept_great_power] und jedes [concept_country], dessen [concept_spec_exchange] mindestens #v International#! steht, gewinnt bis zu #P +[GetPlayer.MakeScope.ScriptValue('spec_flight_gain_max')|0]#! [concept_spec_market_confidence], sofern es im Frieden ist, mindestens #v Stabil#! erreicht und nicht mit dem Land in Panik verbunden ist. [GetTechnology('international_trade').GetName] und [GetTechnology('international_exchange_standards').GetName] erhöhen den Gewinn. Je höher eine [concept_spec_exchange] steht, desto mehr erhält sie."
 concept_spec_war_news: "Kriegsnachrichten"
 concept_spec_war_news_desc: "Die Anleger verfolgen einen [concept_war] Monat für Monat. Die $concept_spec_war_news$ bewegen [concept_spec_market_confidence] jeden Monat je nach Verlauf: [concept_casualties], [concept_blockade], [concept_devastation], ein fallendes [concept_gdp] und ein langer Krieg senken es, während gewonnene [Concept('concept_battle','$concept_battles|q$')] und gehaltenes Feindesland es heben. Jeder Krieg bewegt es um #N -3#! bis #P +0.15#! pro Monat, alle Kriege zusammen um #N -4#! bis #P +0.5#!."
