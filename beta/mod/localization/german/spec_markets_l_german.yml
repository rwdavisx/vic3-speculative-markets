 SPEC_COL_LEVER: "Eingriff"
 SPEC_COL_LEVER_TT: "#header Markteingriffe#!\n$TOOLTIP_DELIMITER$\nSpekulation eindämmen: Interesse wird bei #v Gelassen#! gehalten, die Produzenten verlieren [concept_throughput] und zahlen eine Abgabe\nInvestitionen fördern: Interesse mindestens #v Interessiert#!, die Produzenten gewinnen [concept_throughput] und der Staat zahlt dafür\n\nJeder Eingriff kostet jeden Monat [concept_authority], bis er aufgehoben wird, mehr bei Grundgütern und bei Waren mit großem Anteil am Handel des Marktes. Spekulation kann bei Waren auf #v Eifrig#! und #v Fieberhaft#! eingedämmt werden, oder bei einer Ware, deren Boomende #v 2#! oder mehr [concept_spec_market_confidence] kosten würde. Investitionen können bei Waren unter #v Interessiert#! gefördert werden."
 SPEC_SEP_FEVERISH_TT: "#header @spec_interest_feverish! [concept_spec_investor_interest]: Fieberhaft#!\nAnteil an unserem Handel: #v [Country.MakeScope.Var('spec_heat_6').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] der Produzenten: #P +8%#!\n[concept_spec_market_confidence]: #P Steigt#! monatlich, stärker bei größerem Handelsanteil, nicht während einer [concept_spec_financial_panic]\nMöglicher Ausgang: [concept_spec_collapse]"
 SPEC_SEP_EAGER_TT: "#header @spec_interest_eager! [concept_spec_investor_interest]: Eifrig#!\nAnteil an unserem Handel: #v [Country.MakeScope.Var('spec_heat_5').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] der Produzenten: #P +5%#!\n[concept_spec_market_confidence]: #P Steigt#! monatlich, stärker bei größerem Handelsanteil, nicht während einer [concept_spec_financial_panic]\nMöglicher Ausgang: [concept_spec_bust]"
 SPEC_SEP_KEEN_TT: "#header @spec_interest_keen! [concept_spec_investor_interest]: Interessiert#!\nAnteil an unserem Handel: #v [Country.MakeScope.Var('spec_heat_4').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] der Produzenten: #P +3%#!\nMöglicher Ausgang: [concept_spec_correction]"
 SPEC_SEP_CALM_TT: "#header @spec_interest_calm! [concept_spec_investor_interest]: Gelassen#!\nAnteil an unserem Handel: #v [Country.MakeScope.Var('spec_heat_3').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\nKeine Auswirkungen"
 SPEC_SEP_DOUBTFUL_TT: "#header @spec_interest_doubtful! [concept_spec_investor_interest]: Zweifelnd#!\nAnteil an unserem Handel: #v [Country.MakeScope.Var('spec_heat_2').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] der Produzenten: #N -5%#!\nNach einem Boom bleibt eine sich erholende Ware vorübergehend auf dieser Stufe oder darunter"
 SPEC_SEP_FLEEING_TT: "#header @spec_interest_fleeing! [concept_spec_investor_interest]: Fliehend#!\nAnteil an unserem Handel: #v [Country.MakeScope.Var('spec_heat_1').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] der Produzenten: #N -10%#!\nEin Boom der Stufe #v Fieberhaft#!, der so weit fällt, endet in einem [concept_spec_collapse]"
 SPEC_IB_TURNING_TT: "#header Boom am Wendepunkt#!\nEin großer Boom für [Goods.GetName] geht zurück. Sinkt [concept_spec_investor_interest] weiter, endet er in einem [concept_spec_collapse] und kostet etwa #N [Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! [concept_spec_market_confidence]."
