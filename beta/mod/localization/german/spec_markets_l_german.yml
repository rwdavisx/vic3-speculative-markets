 spec_excess_bar: "Spekulativer Überschwang"
 concept_spec_speculative_excess: "Spekulativer Überschwang"
 concept_spec_speculative_excess_desc: "$concept_spec_speculative_excess$ misst die Blase, die während eines Booms auf dem [concept_market] in einem [concept_country] entsteht. Nach Erforschung der Technologie [GetTechnology('stock_exchange').GetName] wächst er jeden Monat, in dem [concept_spec_market_confidence] mindestens #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! beträgt, und umso schneller, je höher $concept_spec_market_confidence$ steigt. Solange $concept_spec_market_confidence$ zwischen #v 60#! und #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! bleibt, kühlt er monatlich um #v 2%#! ab.\n\nSinkt $concept_spec_market_confidence$ unter #v 60#!, platzt die Blase und $concept_spec_market_confidence$ fällt um bis zu weitere #v [GetPlayer.MakeScope.ScriptValue('spec_burst_max')|0]#!. Je höher $concept_spec_speculative_excess$ ist, desto tiefer der Fall."
 concept_spec_sound_finance: "Solides Finanzwesen"
 concept_spec_sound_finance_desc: "$concept_spec_sound_finance$ wird durch die Umsetzung aller drei [concept_spec_banking_reforms] erreicht: Banknotenregeln, ein Kreditgeber letzter Instanz und Gesellschaftsrecht.\n\nSobald alle drei umgesetzt sind, erhält das [concept_country] #v 10#! [concept_prestige] und zahlt #v 5%#! weniger Zinsen für [concept_loans]."
 concept_spec_banking_reforms: "Bankenreformen"
 concept_spec_banking_reform: "Bankenreform"
 concept_spec_banking_reforms_desc: "$concept_spec_banking_reforms$ legen fest, nach welchen Regeln Banken und Kompanien in einem [concept_country] arbeiten. Jede wird mit einer Technologie verfügbar und durch eine Untersuchungskommission eingeführt, die nach einer [concept_spec_financial_panic] oder nach #v 10#! Jahren ohne eine solche tagen kann. Jede Kommission führt eine Reform ein.\n\n#bold Banknotenregeln#! ([GetTechnology('banking').GetName]), eine von zwei:\n#bold Currency-Schule:#! $spec_reform_currency_tt$\n#bold Freies Bankwesen:#! $spec_reform_free_tt$\n\n#bold Kreditgeber letzter Instanz#! ([GetTechnology('central_banking').GetName]): $spec_reform_llr_tt$\n\n#bold Gesellschaftsrecht#! ([GetTechnology('joint_stock_companies').GetName]): $spec_reform_company_tt$\n\nAlle drei zusammen ergeben [concept_spec_sound_finance]."
 alert_spec_panic_risk_alert_name: "Panikrisiko"
 spec_panic_risk_alert_setting_name: "Panikrisiko"
 alert_spec_panic_risk_alert_desc: "Endeten unsere Booms jetzt, würde [concept_spec_market_confidence] auf #N [GetPlayer.MakeScope.ScriptValue('spec_after_collapse')|0]#! sinken, unter die Schwelle von #v [GetPlayer.MakeScope.ScriptValue('spec_panic_at')|0]#!, bei der eine [concept_spec_financial_panic] beginnt."
 alert_spec_panic_risk_alert_hint: "Spekulation mit den am stärksten gefährdeten Waren eindämmen oder [concept_spec_credit_policy] im Reiter #bold $SPEC_FIN_TAB_BANKING$#! des Fensters #bold $SPEC_FINANCE$#! straffen."
 alert_spec_panic_risk_alert_action: "Journal"
 alert_spec_bubble_alert_name: "Spekulativer Überschwang"
 spec_bubble_alert_setting_name: "Spekulativer Überschwang"
 alert_spec_bubble_alert_desc: "Unser Wert für [concept_spec_speculative_excess] beträgt #v [GetPlayer.MakeScope.Var('spec_heat').GetValue|0]#!. Sinkt [concept_spec_market_confidence] wieder unter #v 60#!, platzt die Blase und [concept_spec_market_confidence] fällt um weitere #N [GetPlayer.MakeScope.ScriptValue('spec_burst_now')|0]#!."
 alert_spec_bubble_alert_hint: "Die Blase wächst jeden Monat, in dem [concept_spec_market_confidence] mindestens #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! beträgt, und kühlt ab, solange es zwischen #v 60#! und diesem Wert bleibt. Die Spekulation bei boomenden Waren einzudämmen oder die [concept_spec_credit_policy] zu straffen, lässt sie sanft schrumpfen."
 alert_spec_bubble_alert_action: "Journal"
 alert_spec_rescue_alert_name: "Bankenrettung möglich"
 spec_rescue_alert_setting_name: "Bankenrettung möglich"
 alert_spec_rescue_alert_desc: "Eine [concept_spec_financial_panic] ist im Gange, und wir haben die Banken noch nicht gestützt."
 alert_spec_rescue_alert_hint: "#v Banken Kredit gewähren#! verkürzt die Panik, halbiert ihre Auswirkungen und hebt [concept_spec_market_confidence] um #P +20#!. Einmal pro Panik, im Reiter #bold $SPEC_FIN_TAB_BANKING$#! des Fensters #bold $SPEC_FINANCE$#!."
