 spec_convert_debt_tt: "Unsere Schulden betragen mindestens #v 20%#! unserer Grenze für [concept_credit]"
 spec_convert_cd_tt: "Die Schulden wurden in den letzten #v 10#! Jahren nicht umgeschuldet"
