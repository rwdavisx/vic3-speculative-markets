 SPEC_IL_SORT_INTEREST_TT: "#header Nach [concept_spec_investor_interest] sortieren#!\n$TOOLTIP_DELIMITER$\nHöchstes Interesse zuerst; innerhalb jeder Stufe die meistgehandelten zuerst.\n\nDie Markierung zeigt die Stufe, von @spec_interest_fleeing! #v Fliehend#! bis @spec_interest_feverish! #v Fieberhaft#!. Der Pfeil zeigt die Änderung dieses Monats."
