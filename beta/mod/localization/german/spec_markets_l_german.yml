 spec_markets.2.f: "„Gestern besaß ich vierzigtausend. Heute früh besitze ich meinen Mantel, und dafür hat man mir herzlich wenig geboten.“"
 spec_markets.2.a: "Der Markt muss seinen Tiefpunkt selbst finden."
 spec_markets.2.a.tt: "Die [concept_spec_financial_panic] nimmt ihren vollen Lauf, sofern wir nicht später #v Banken Kredit gewähren#!, was auch diese Änderung der [concept_approval] von $ig_industrialists$ aufhebt"
 spec_markets.2.b: "Wir müssen die Banken stützen."
 spec_markets.2.b.tt: "Die [concept_spec_financial_panic] endet binnen #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#! Monaten und ihre Auswirkungen werden halbiert\n[concept_spec_market_confidence] steigt um #v 20#!"
 spec_rescue_cost_tt: "[concept_treasury]: #N -@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_cost')|D]#!, etwa #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#! von [concept_gdp]"
 spec_levy_tt: "[concept_treasury]: #P +@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_speculator_tax')|D]#!, etwa #v 0.25%#! von [concept_gdp]"
