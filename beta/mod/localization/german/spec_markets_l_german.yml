 concept_spec_exchange: "Börse"
 concept_spec_exchange_desc: "Die $concept_spec_exchange$ ist der Ort, an dem in einem [concept_country] Aktien, Anleihen und Kredite gehandelt werden. Ihre Stellung folgt ihren Punkten ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]): #v Provinziell#!, #v National#!, #v International#! (erfordert [GetTechnology('stock_exchange').GetName]) oder #v Weltzentrum#! (erfordert [GetTechnology('central_banking').GetName]). Eine höhere Stellung erhöht die Anlegerreaktion auf steigende Preise, und ab #v International#! erhält die Börse [concept_spec_capital_flight].\n\nDer Staat erteilt seiner Börse ein Privileg: #v Warenbörse#!, #v Geldmarkt#! oder #v Aktienmarkt#!. Eine Börse hat #v 1#! bis #v 4#! Schwerpunkte aus den #v 7#! Wegen zum Ruhm, mehr mit steigender Stellung, und behält jeden mindestens #v 5#! Jahre.\n\nVertrauen steigt in ruhigen Jahren bei solider Kreditvergabe und sinkt durch [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')], [concept_spec_bad_debts] sowie einen [concept_spec_bust] oder [concept_spec_collapse] bei einer Hauptware. Geringes Vertrauen erhöht den Zinssatz für [concept_loans], hohes Vertrauen senkt ihn."
