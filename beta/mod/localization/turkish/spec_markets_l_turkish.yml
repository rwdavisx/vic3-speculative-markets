unch').IsSet, 'SPEC_EXCH_FX_CRUNCH')][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.5'), 'SPEC_EXCH_FX_LEAN')]\n$TOOLTIP_DELIMITER$\n[SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.5'), 'SPEC_EXCH_NEXT_0', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1.5'), 'SPEC_EXCH_NEXT_1', SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.Var('spec_exch_stand').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2.5'), 'SPEC_EXCH_NEXT_2', 'SPEC_EXCH_NEXT_3')))]"
