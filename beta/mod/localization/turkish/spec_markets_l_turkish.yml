 SPEC_UNWIND_DESC_1: "Bu [concept_good] için yükseliş #v İlgili#! düzeyine ulaştı. Fiyat eğilimi #v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#! altına düşerse [concept_spec_investor_interest] #v Kuşkulu#! olur ve yükseliş [concept_spec_correction] ile sona erer. Ardından yatırımcılar #v 3#! ay boyunca geri durur. Yükseliş eskidikçe risk azalır."
