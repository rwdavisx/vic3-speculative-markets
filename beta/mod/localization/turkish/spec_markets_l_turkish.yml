 spec_suspend_tt: "[concept_spec_financial_panic] #v 2#! ay içinde sona erer, o zamana kadar tam güçle sürer\n[concept_spec_market_confidence] #v 15#! yükselir\n#v 10#! yıl boyunca [concept_spec_speculative_excess] #v %50#! daha hızlı birikir\n[concept_spec_lending_standards] bir Banka Kurtarmadan sonraki gibi gevşer"
 spec_suspend_act: "Bankacılık Kanunu'nu Askıya Al"
 spec_suspend_act_desc: "Bankanın, Kanun'un banknotlarına koyduğu sınırın ötesinde borç vermesine izin ver. Panik hazineye maliyet olmadan birkaç ay içinde yatışır, ancak yatırımcılar hükümetin her zaman devreye gireceğini öğrenir. Bu panik için #v Bankalara Borç Ver#! sayılır.\n\n#lore Britanya, Bank Charter Act'i 1847, 1857 ve 1866 yıllarında askıya aldı.#!"
 spec_relief_works_button: "Yardım İşleri"
 spec_relief_works_button_desc: "Daralma sürerken bayındırlık işlerini ve yardımları finanse et: #v 12#! ay boyunca sosyal yardım, daha fazla inşaat ve daha az radikal sağlanır. Haftalık maliyet [concept_gdp] ile birlikte artar."
 spec_convert_debt: "Devlet Borcunu Yenile"
 spec_convert_debt_desc: "Yatırımcılar iyimserken borçlarımızı daha düşük faizli yeni borçlarla değiştir. Eski faizle geçinen tahvil sahipleri bize minnettar olmayacak."
 spec_inquiry: "Araştırma Komisyonu"
 spec_inquiry_desc: "Bankacıları, borsacıları ve varını yoğunu kaybetmiş mevduat sahiplerini dinleyerek bankalarımızın ve şirketlerimizin nasıl yönetilmesi gerektiğini raporlayacak bir komisyon ata. Rapor, teknolojimizin elverdiği [Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')] kapsamından bir düzenlemeyi yürürlüğe koyar. Oturumlar #v 6#! ay boyunca hükümetin ilgisini meşgul eder."
 spec_debt_converted: "Yenilenen Borç"
 spec_debt_converted_desc: "Yatırımcılar borç vermeye hevesliyken krediler daha düşük faizle yenilendi"
 spec_relief_works: "Yardım İşleri"
 spec_relief_works_desc: "Daralma yüzünden işsiz kalanlar için bayındırlık işleri ve yardımlar"
 spec_relief_costs: "Yardım İşleri Maliyeti"
 spec_relief_costs_desc: "Yardım İşleri maliyeti"
 spec_act_suspended: "Bankacılık Kanunu Askıda"
 spec_act_suspended_desc: "Hükümet bir paniği sona erdirmek için kendi kanununu bir kenara bıraktı"
 spec_inquiry_sitting: "Araştırma Komisyonu"
 spec_inquiry_sitting_desc: "Bir komisyon son paniğe ilişkin ifadeleri dinliyor"
 spec_sound_finance: "Sağlam Maliye"
 spec_sound_finance_desc: "Para, bankalar ve şirketler yatırımcıların güvendiği kurallarla yönetiliyor"
 spec_rentiers_cut: "Rantiye Geliri Kesintisi"
 spec_relief_thanks: "Yardım İşleri"
 spec_dear_money: "Pahalı Para"
 spec_free_issue: "Serbest Bankacılık"
 spec_disclosure_burden: "Açıklama Kuralları"
 spec_disclosure_welcomed: "Açıklama Kuralları"
 spec_reform_currency_tt: "Bankalar #v %25#! daha az kredi verir, [concept_spec_speculative_excess] #v %25#! daha yavaş birikir ve [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')] #v %25#! daha uzun sürer\nPanik sırasında Bankacılık Kanunu'nun askıya alınmasına izin verir"
 spec_reform_free_tt: "Bankalar #v %25#! daha fazla kredi verir, yükselişler #v %10#! daha büyük olur ve sona erdiklerinde #v %10#! daha fazla [concept_spec_market_confidence] kaybı yaşanır"
 spec_reform_llr_tt: "#v Bankalara Borç Ver#! #v %50#! daha ucuza mal olur ve paniği bir ay daha erken bitirir"
 spec_reform_company_tt: "Yükseliş sonlarında [concept_spec_market_confidence] kaybı #v %30#! azalır"
 spec_reform.1.t: "Araştırma Komisyonu"
 spec_reform.1.d_panic: "Panikten sonra atanan komisyon raporunu sundu: bankacıların, borsacıların ve servetini yitirmiş mevduat sahiplerinin ifadelerinden oluşan üç cilt. Üyeler, paniğin ilahi bir felaket olmadığı konusunda hemfikir. Neredeyse diğer her konuda ayrılıyorlar. Önerilen her çarenin mecliste savunucuları var."
 spec_reform.1.d_calm: "Pazarların sakin olduğu bu yılda bir komisyon, bir sonraki yükselişin yıkımla bitmesini nasıl önleyebileceğimizi bankacılara, borsacılara ve siyasi iktisatçılara sordu. Raporunda çeşitli çareler sıralanıyor. Her birinin mecliste savunucuları var."
 spec_reform.1.f: "“Dehşetin hüküm sürdüğü zamanlarda bir iflas nicelerine yol açar. Peşi sıra gelen iflasları önlemenin en iyi yolu, onlara sebep olan ilk iflası durdurmaktır.”"
 spec_reform.1.a: "Banknot basımını kasalardaki altına bağla."
 spec_reform.1.b: "Her sağlam banka kendi banknotunu bassın."
 spec_reform.1.c: "Bir son kredi mercii ata."
 spec_reform.1.d: "Şirketleri hesaplarını yayımlamaya mecbur et."
 spec_reform.1.e: "Komisyona emekleri için teşekkür et."
 spec_reform.2.t: "Sağlam Maliye"
 spec_reform.2.d: "Bankalarımız banknotlarını kurallara göre basıyor, panik anında kredi verecek bir merci hazır bekliyor. Şirketlerimiz yatırımcılara neleri olduğunu ve ne kadar borçları bulunduğunu göstermek zorunda. Tahvillerimiz artık yurt dışında değerinin üzerinde satılıyor. [ROOT.GetCountry.GetCapital.GetCityHubName], sermaye için güvenli bir liman olarak anılıyor."
 spec_reform.2.f: "“Bir bankacının ilk vazifesi para kazanmak değil, parayı muhafaza etmektir.”"
 spec_reform.2.a: "Güven, kredinin temelidir."
