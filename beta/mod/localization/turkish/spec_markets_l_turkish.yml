 SPEC_UNWIND_DESC_3: "Bu [concept_good] için yükseliş #v Hararetli#! düzeyine ulaştı. Fiyat eğilimi #v [Divide_CFixedPoint('(CFixedPoint)-4.988', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#! altına düşerse [concept_spec_investor_interest] #v Kaçış#! durumuna geçer ve yükseliş [concept_spec_collapse] ile sona erer. Ardından yatırımcılar #v 12#! ay boyunca geri durur. Yükseliş eskidikçe risk azalır."
 SPEC_UNWIND_2: "Daralma"
 SPEC_UNWIND_C_2: "[concept_spec_bust]"
 SPEC_UNWIND_DESC_2: "Bu [concept_good] için yükseliş #v Hevesli#! düzeyine ulaştı. Fiyat eğilimi #v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#! altına düşerse [concept_spec_investor_interest] #v Kuşkulu#! olur ve yükseliş [concept_spec_bust] ile sona erer. Ardından yatırımcılar #v 6#! ay boyunca geri durur. Yükseliş eskidikçe risk azalır."
