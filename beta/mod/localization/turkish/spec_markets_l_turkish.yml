 SPEC_H_BANK_LENT_TT: "#header Bankaların Kredi Verdiği Yerler#!\n$TOOLTIP_DELIMITER$\nBankalar yeni kredilerinin çoğunu yükselişteki mallara verir: bir mal ticaretimizde ne kadar büyük pay tutuyor ve [concept_spec_investor_interest] ne kadar yüksekse o kadar çok kredi alır. Bir kredi geri ödenene kadar kendi malında kalır.\n\nBankaların kredi verdiği bir yükseliş sona erdiğinde [concept_spec_market_confidence] daha da düşer. Bir malda spekülasyonu dizginlemek, çektiği yeni kredileri yarıya indirir."
