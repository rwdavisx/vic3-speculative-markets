 SPEC_LEVER_RESTRAIN_TT: "#header [Goods.GetName] Spekülasyonunu Dizginle#!\n$TOOLTIP_DELIMITER$\n[concept_spec_investor_interest]: birkaç ayda #v Sakin#! düzeyine iner\n[concept_authority]: ayda #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#!#indent_newline:3 \nTemel Değerden #v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! (üzerindeki tüketim vergisinin yarısı)\nTicaret Payından #v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! (pazarımızın #v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! kadarı)#!\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_DOWN', 'SPEC_LEVER_NONE')][concept_budget_additional_income]: haftada #P @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_levy_', Goods.GetKey))|D]#!, haftalık üretimimizin temel fiyat üzerinden %10 oranında vergi\n\nDizginlendiği sürece yükselişi ne büyüyebilir ne de birden sona erebilir. Bunun yerine yaklaşık bir yıl içinde bir [concept_spec_correction] olarak sönümlenir ve her ay biraz [concept_spec_market_confidence] kaybettirir.\n\n#lore Güney Denizi Balonu'ndan sonra yeni anonim şirketleri kısıtlayan 1720 tarihli Bubble Act gibi.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_restrain_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_restrain').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_LEVER_ENCOURAGE_TT: "#header [Goods.GetName] Yatırımını Teşvik Et#!\n$TOOLTIP_DELIMITER$\n[concept_spec_investor_interest]: birkaç ayda #v İlgili#! düzeyine yükselir\n[concept_authority]: ayda #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#!#indent_newline:3 \nTemel Değerden #v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! (üzerindeki tüketim vergisinin yarısı)\nTicaret Payından #v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! (pazarımızın #v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! kadarı)#!\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_UP', 'SPEC_LEVER_NONE')][concept_budget_additional_expenses]: haftada #N @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_subsidy_', Goods.GetKey))|D]#!, haftalık üretimimizin temel fiyat üzerinden %20 oranında sübvansiyon\n\n[concept_good] #v Hevesli#! düzeye ulaşınca kendiliğinden kalkar; böylece yükselişi kendi kendine sona erebilir.\n\n#lore 19. yüzyıl ortasında Britanya Hindistanı ve Fransa'nın demiryolu yatırımcılarına sunduğu garantili getiriler gibi.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_encourage_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_encourage').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
