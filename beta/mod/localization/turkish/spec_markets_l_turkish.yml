 concept_spec_long_depression_desc: "$concept_spec_long_depression$ dünya çapında bir iktisadi krizdir. Bir [concept_great_power] bir [concept_spec_financial_panic] içine düştüğünde başlar, o sırada panik yaşayan her ülkeye ulaşır ve yakın bağlar üzerinden yayılır: ortak [concept_market], bağlı ülkeler ve egemenler, yatırım hakları, yoğun ticaret ve yabancı mülkiyet.\n\nDünya Çöküşü (#v 4#! ay): kredi donar ve [concept_spec_market_confidence] erir\nBunalım (en fazla #v 5#! yıl): yatırım, inşaat ve ticaret yavaşlar, bazı nüfuslar [Concept('concept_radical','$concept_radicals|q$')] olur\nToparlanma (#v 1#! yıl): [concept_spec_market_confidence] geri döner\n\nHer hükümetin kararları kendi ve dünyanın toparlanmasını hızlandırır; en çok da bir [concept_great_power] kararları."
