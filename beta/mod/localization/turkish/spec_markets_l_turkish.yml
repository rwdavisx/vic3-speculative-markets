 concept_spec_exchange_desc: "Bir [concept_country] için $concept_spec_exchange$, hisselerinin, tahvillerinin ve kredisinin el değiştirdiği yerdir. Konumu [Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')] puanına bağlıdır: #v Taşra#!, #v Ulusal#!, #v Uluslararası#! ([GetTechnology('stock_exchange').GetName] gerekir) veya #v Dünya Merkezi#! ([GetTechnology('central_banking').GetName] gerekir). Daha yüksek Konum, yükselen fiyatlara Yatırımcı Tepkisini artırır ve #v Uluslararası#! düzeyinden itibaren Borsa [concept_spec_capital_flight] alır.\n\nDevlet, Borsasına bir imtiyaz verir: #v Emtia Borsası#!, #v Para Piyasası#! veya #v Hisse Piyasası#!. Bir Borsa #v 7#! Şöhret Yolundan #v 1#! ile #v 4#! arasında uzmanlık tutar; Konumu yükseldikçe daha fazlasını tutar ve her birini en az #v 5#! yıl korur.\n\nGüvenilirlik sağlam kredi altında sakin yıllarda artar; [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')], [concept_spec_bad_debts] ve başlıca bir maldaki [concept_spec_bust] veya [concept_spec_collapse] ile düşer. Düşük güvenilirlik [concept_loans] faiz oranını yükseltir, yüksek güvenilirlik düşürür."
