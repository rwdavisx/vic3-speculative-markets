 concept_spec_intervention: "Müdahale"
 concept_spec_intervention_desc: "Hükümet bir $concept_spec_intervention$ ile bir [concept_good] için #v Spekülasyonu Dizginle#! veya #v Yatırımı Teşvik Et#! kararı alabilir.\n\n#v Spekülasyonu Dizginle#!: [concept_spec_investor_interest] #v Sakin#! düzeyine iner, üreticiler #N -%10#! [concept_throughput], haftalık üretimin temel fiyat üzerinden #v %10#! kadarı vergi\n#v Yatırımı Teşvik Et#!: ilgi #v İlgili#! düzeyine çıkar, üreticiler #P +%10#! [concept_throughput], #v %20#! sübvansiyon\n\nHer biri kaldırılana kadar her ay [concept_authority] harcar; temel ihtiyaç malları ve [concept_market] ticaretinde büyük payı olan mallar için daha fazla."
 SPEC_LEVER_ISSUE_TT: "#header [Goods.GetName] için Büyük İhraç Yap#!\n$TOOLTIP_DELIMITER$\n#v 2#! yıl boyunca:\n[Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')] puanı: #P +%25#!\nYükselişi sona erdiğinde buna verilen banka kredileri #N x1.5#! sayılır\nYükselişi sona erdiğinde kazanılan veya kaybedilen güvenilirlik: #v x2#!\n$TOOLTIP_DELIMITER$\nUlusal veya daha yüksek Konum, #v Hevesli#! veya daha yüksek [concept_spec_investor_interest] ve hiçbir [concept_spec_intervention] olmaması gerekir. Aynı anda tek Büyük İhraç yapılabilir; bir sonraki, bu ihraç bittikten #v 1#! yıl sonra yapılabilir.[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_issue_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_ISSUE_ON', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_issue').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_ISSUE_ON: "\n\nBu [concept_good] için bir ihraç sürüyor"
