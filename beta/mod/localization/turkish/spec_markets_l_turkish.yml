 spec_depression.1.t: "$SPEC_LD_NAME$"
 spec_depression.1.d: "Dünya borsalarındaki panikler birleşti. Büyük firmalar arasında kredi akışı durdu, fiyatlar her yerde aynı anda düşüyor. Fabrikalarımızı ve madenlerimizi meşgul eden siparişler telgraflarla iptal ediliyor. Her pazar diğerlerine dayanıyor ve hepsi birlikte çöküyor.\n\nÇöküş birkaç ay sürecek, ardından uzun bir bunalım gelecek. Ne kadar çabuk toparlanacağımız şimdi yapacaklarımıza ve [Concept('concept_great_power','$concept_great_powers|q$')] tarafından atılacak adımlara bağlı."
 spec_depression.1.f: "“Daha önce de panik gördük. Bu kez paranın kaçabileceği hiçbir yer yok.”"
 spec_depression.1.a: "Harcamaları kısmalıyız."
 spec_depression.1.b: "Borsalara istikrar kazandır."
 spec_depression.2.t: "Gümrük Duvarı"
 spec_depression.2.d: "En büyük tesislerimizin sahipleri hükümete dilekçe sundu, büyük toprak sahipleri de onlara katıldı. Söylediklerine göre yabancı mallar ve ucuz yabancı tahıl pazarlarımızda üreticilerinin bulabildiği her fiyattan satılıyor, kendi fabrikalarımız ve çiftliklerimiz ise ücretleri karşılayacak bir fiyata satış yapamıyor. Yerli sanayi ve yerli hasatla rekabet eden her şey için daha yüksek gümrük vergileri istiyorlar.\n\nKorumacılık kendi toparlanmamızı güvenceye alır ama ticaret ortaklarımız bundan zarar görür, onlarla birlikte dünyanın toparlanması da."
 spec_depression.2.f: "“Her millet kendi pazarının çevresine bir duvar örüyor, sonra da ihracatının neden toparlanmadığına şaşıyor.”"
 spec_depression.2.a: "Sanayimizi koru."
 spec_depression.2.b: "Pazarlarımız açık kalsın."
 spec_depression.3.t: "Yardım İşleri"
 spec_depression.3.d: "[ROOT.GetCountry.GetCapital.GetCityHubName] şehrinde binlerce insan işsiz ve yardım fonları tükendi. Şehir mühendislerinin onlara iş sağlayabilecek bir listesi var: kanallar, yollar, setler ve yeni bir kapalı pazar. Yeter ki hazine masrafları karşılasın."
 spec_depression.3.f: "“Gündeliği için kanal kazan adam dilenci değildir, kendisi de bunu bilir.”"
 spec_depression.3.a: "İşleri finanse et."
 spec_depression.3.b: "Hayırseverlik şahsi bir meseledir."
 spec_depression.4.t: "Kuşatma Altındaki Bankalar"
 spec_depression.4.d: "[ROOT.GetCountry.GetCapital.GetCityHubName] bankalarının şimdi batmakta olan firmalara büyük krediler verdiği haberi yayıldı. Mevduat sahipleri sabahtan beri birikimlerini çekmek için sırada. Akşam olduğunda bankalarda onlara ödenecek tek kuruş kalmayacak. Banka müdürleri hükümetten harekete geçmesini istiyor."
 spec_depression.4.f: "“Herkes aksine inanana kadar bir banka sapasağlamdır.”"
 spec_depression.4.a: "Bankalar için tatil ilan et."
 spec_depression.4.b: "Bankaları kurtar."
 spec_depression.4.c: "Bırak batsınlar."
 spec_depression.5.t: "Para Meselesi"
 spec_depression.5.d: "Düşen fiyatlar ülkeyi ikiye böldü. Çiftçiler ve küçük borçlular paranın fazlasıyla pahalılaştığını, fiyatların düştüğü her yıl borçların biraz daha ağırlaştığını söylüyor. Daha fazla para basılmasını ve kredinin kolaylaştırılmasını istiyorlar. Bankacılar ve alacaklılar ise yerli ve yabancı yatırımcıların güvenini ancak sağlam paranın geri getireceğini savunuyor."
 spec_depression.5.f: "“İpotek borcum beş yıl önce neyse bugün de o. Buğdayım ise yarı fiyatına gidiyor.”"
 spec_depression.5.a: "Her şeyden önce sağlam para."
 spec_depression.5.b: "Krediyi kolaylaştır."
 spec_depression.6.t: "İşsizlerin Yürüyüşü"
 spec_depression.6.d: "Bir işsizler kafilesi 'İş veya Ekmek' yazılı pankartların ardında [ROOT.GetCountry.GetCapital.GetCityHubName] şehrine yürüdü. Hükümet binalarının önünde kamp kurup dilekçe sunmak istiyorlar. Polis, gece çökmeden meydanı boşaltabileceğini söylüyor."
 spec_depression.6.f: "“Sadaka istemiyoruz. İş istiyoruz.”"
 spec_depression.6.a: "Onları dağıt."
 spec_depression.6.b: "Dilekçelerini dinle."
 spec_depression.7.t: "Reform Çağrıları"
 spec_depression.7.d: "Gazeteler bunalımın neden bu kadar uzadığını ve öncesindeki spekülasyondan kimlerin zengin olduğunu soruyor. Meclis üyeleri bankalar, borsalar ve hükümetin kendi tutumu hakkında araştırma yapılmasını talep etti."
 spec_depression.7.f: "“Artık mesele sistemin çöküp çökmediği değil, bunun hesabını kimin vereceğidir.”"
 spec_depression.7.a: "Bir araştırma komisyonu kur."
 spec_depression.7.b: "Sistem sağlam."
 spec_depression.8.t: "$SPEC_LD_NAME$ Sona Eriyor"
 spec_depression.8.d: "Yıllardır ilk kez gelen siparişler iptal edilenlerden daha hızlı artıyor. Fiyatlar dibe oturdu, bankalar yeniden kredi veriyor, boş duran tesisler işçi alıyor. Bunalım sona erdi. Yine de onu yaşayanların pek azı kolayca unutacak."
 spec_depression.8.f: "“Ticaret düzeliyor diyorlar. Kendi sipariş defterim de aynısını söylediğinde inanırım.”"
 spec_depression.8.a: "Dersler çıkarıldı."
 spec_depression.8.b: "İş başına."
