 je_spec_depression_reason: "Büyük borsalardaki panikler dünya çapında bir krize dönüştü. Yatırım ve inşaat yavaşladı, ticaret geriledi, işsizler huzursuzlanıyor. [concept_spec_long_depression] dünya toparlandığında veya en geç #v 5#! yıl sonra sona erer.\n\nKararlarımız hem bizim hem de dünyanın toparlanmasını hızlandırır. [Concept('concept_great_power','$concept_great_powers|q$')] tarafından alınan kararlar daha fazla etki gösterir. Kendi toparlanmamız tamamlandığında [concept_spec_market_confidence] başka yerlerden önce burada geri döner."
