 SPEC_JE_STAGE_6: "[JournalEntry.GetCountry.GetCapital.GetCityHubName] üzerine [concept_spec_long_depression] çökmüş durumda. Yatırımcılar ellerindekini saklıyor, kimseye borç vermiyor; şimdiye kadarki her toparlanma birkaç ay içinde sekteye uğradı. Dünyanın toparlanmasını kendi günlük girdisi takip eder.\n\nBunalım sürerken Yardım İşleri işsizlere inşaatlarda iş ve geçim sağlar."
 SPEC_JE_STAGE_5: "[JournalEntry.GetCountry.GetCapital.GetCityHubName] paniğe kapıldı. Mevduat sahipleri gün ağarırken bankaların önünde sıraya giriyor, krediler geri çağrılıyor ve hükümet harekete geçmezse [concept_private_construction] #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! ay daha yarıya inmiş kalacak.\n\n#v Bankalara Borç Ver#! paniği daha erken bitirir ve etkilerini yarıya indirir. Yardım İşleri işsizlere inşaatlarda iş ve geçim sağlar.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_currency_v'), '(CFixedPoint)0'), 'SPEC_JE_SUSPEND_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_4: "Panik geçti, ardında batmış firmalar ve yarım kalmış tesisler bıraktı. Yatırımcılar kayıplarını hesaplıyor. #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic_cooldown').GetValue|0]#! ay boyunca yeni bir panik başlayamaz.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_reform_open_v'), '(CFixedPoint)0'), 'SPEC_JE_INQUIRY_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_3: "[JournalEntry.GetCountry.GetCapital.GetCityHubName] borsası çılgına döndü. Kâtipler ve dul kadınlar borç parayla #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! ve #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! hisseleri alıyor. [concept_spec_market_confidence] değerinin #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#! veya üzerinde kaldığı her ay [concept_spec_speculative_excess] artıyor. [concept_spec_market_confidence] #v 60#! altına düştüğünde balon patlar; aşırılık ne kadar büyükse düşüş o kadar sert olur.\n\nEn sıcak mallarda spekülasyonu dizginlemek veya krediyi sıkılaştırmak balonun havasını yavaşça indirir."
 SPEC_JE_STAGE_2: "Para bol, yatırımcılar iyimser. #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! ve #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! alanındaki yeni şirketlerin hisselerine bir saat içinde arzı aşan talep geliyor. Bankalar bu hisseler karşılığında bolca kredi veriyor. [concept_spec_market_confidence] #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#! veya üzerindeyken [concept_spec_speculative_excess] birikmeye başlar.\n\nİşlerin iyi gittiği bu dönem, devlet borcunu daha düşük faizle yenilemek için de uygun bir fırsattır."
 SPEC_JE_STAGE_1: "[JournalEntry.GetCountry.GetCapital.GetCityHubName] borsasında ticaret düzenli ilerliyor. Yatırımcılar #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! ve #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! ticaretini tercih ederken #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! ve #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#! ticaretinden kaçınıyorlar."
 SPEC_JE_STAGE_0: "[JournalEntry.GetCountry.GetCapital.GetCityHubName] şehrindeki yatırımcılar temkinli. Son kayıplardan canları yandığı için paralarını ellerinde tutuyor, #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! ve #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#! ticaretinden kaçınıyorlar. Gevşek kredi veya bir malda yatırımın teşvik edilmesi onları geri çekebilir."
