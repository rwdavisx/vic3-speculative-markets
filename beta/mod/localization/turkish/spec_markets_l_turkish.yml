 spec_panic_movements_desc: "Panikten sonra pek çok kişi devletin pazarları dizginlemesini istiyor. [GetLawType('law_laissez_faire').GetName] karşıtı [Concept('concept_political_movement','$concept_political_movements|q$')] daha fazla destek kazanır. Bu etki zamanla söner."
 spec_mania_movements: "Pazarlara İnanç"
 spec_mania_movements_desc: "Uzun bir yükseliş, pek çok kişiyi pazarları kendi haline bırakmanın en iyisi olduğuna inandırdı. [GetLawType('law_laissez_faire').GetName] yanlısı [Concept('concept_political_movement','$concept_political_movements|q$')] daha fazla destek kazanır. Bu etki zamanla söner."
