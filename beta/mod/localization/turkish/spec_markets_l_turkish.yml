 SPEC_EFFECT_LAX_TT: "#header [concept_spec_lending_standards]#!\n$SPEC_EFFECT_LAX_VALUE$\n$TOOLTIP_DELIMITER$\nHer ay verilen kredi: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_credit'), '(CFixedPoint)1')|+%0]#!\nBunun yükselişlere verilen payı: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_pull'), '(CFixedPoint)1')|+%0]#!\nBanka Kurtarma maliyeti: #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_cost'), '(CFixedPoint)1')|+%0]#!\n$TOOLTIP_DELIMITER$\nBankalar zarar görmedikleri yıllarda ve her Banka Kurtarmanın ardından özensizleşir. Yeniden dikkatli olmaları ancak zarar etmekle olur: bir yükseliş sona erdiğinde ve en çok da bir [concept_spec_financial_panic] Banka Kurtarma olmadan sonuna kadar sürdüğünde.\n\n#title Onları dikkatli tutmak için:#!\n- [concept_spec_credit_policy] ayarını Sıkı yap: özensizleşmeyi bırakırlar\n- Yükselişleri kötü bitmeden dizginle\n- Bir paniğin Banka Kurtarma olmadan sürmesine izin ver veya Bankacılık Kanunu'nu daha seyrek askıya al\n\nDüzeyler: #v Katı#!, #v İhtiyatlı#!, #v Sağlam#!, #v Özensiz#!, #v Pervasız#!"
