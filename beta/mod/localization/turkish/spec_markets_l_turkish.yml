 concept_spec_market_confidence: "Pazar Güveni"
 concept_spec_market_confidence_desc: "$concept_spec_market_confidence$, yatırımcıların bir [concept_country] için [concept_market] durumunu nasıl gördüğünü ölçer; #v 0#! (#v Panik#!) ile #v 100#! (#v Çılgınlık#!) arasında değişir. Korku yatırımı yavaşlatır ve [concept_loans] faizini yükseltir, hırs ise yatırımı hızlandırır.\n\nYükselişteki [Concept('concept_good','$concept_goods|q$')] onu artırır; [Concept('concept_spec_boom_end','$concept_spec_boom_ends|q$')], [Concept('concept_spec_foreign_panic','$concept_spec_foreign_panics|q$')], [Concept('concept_diplomatic_play','$concept_diplomatic_plays|q$')] ve [concept_war] ise azaltır. $building_financial_district$ ekonomide daha büyük yer tuttuğunda yükselişler ve sonları güçlenir, $building_manor_house$ sayıca onları aştığında zayıflar.\n\n#v 55#! üzerinde bankalar [concept_investment_pool] için kredi verir, #v 80#! düzeyinde pazar [concept_spec_speculative_mania] durumuna geçer, #v 25#! altında ise bir [concept_spec_financial_panic] başlar."
 concept_spec_speculative_mania: "Spekülatif Çılgınlık"
 concept_spec_speculative_mania_desc: "[concept_spec_market_confidence] en az #v 80#! olduğunda [concept_market], $concept_spec_speculative_mania$ durumundadır. Bankalar [concept_investment_pool] için en fazla krediyi verir ama bir [concept_spec_boom_end] daha çok $concept_spec_market_confidence$ kaybettirir. Uzun süren veya çok yüksek düzeye ulaşan çılgınlık, [GetLawType('law_laissez_faire').GetName] yanlısı [Concept('concept_political_movement','$concept_political_movements|q$')] için birkaç yıl boyunca daha fazla destek sağlar."
 concept_spec_financial_panic: "Mali Panik"
 concept_spec_financial_panics: "Mali Panikler"
 concept_spec_financial_panic_desc: "[concept_spec_market_confidence] #v 25#! olan Panik Eşiğinin altına düştüğünde $concept_spec_financial_panic$ başlar. [concept_spec_leverage] #v 3#! ayı aşınca eşik yükselir, en fazla #v 65#! olur. $building_financial_district$ azsa daha düşüktür, en az #v 20#!.\n\nHer binanın [concept_throughput] değerini ve toplanan vergileri azaltır, bitene kadar her hafta [concept_treasury] için işsiz yardımı maliyeti doğurur, [concept_private_construction] ve yatırımı yavaşlatır, [Concept('concept_company','$concept_companies|q$')] için [concept_throughput] bonusunu düşürür, bazı yatırımcıları [Concept('concept_radical','$concept_radicals|q$')] yapar ve bankaların [concept_investment_pool] içinden [concept_spec_outstanding_credit] çekmesine yol açar.\n\nBağlantılı her [concept_country] bir [concept_spec_foreign_panic] yaşar, para ise başka yerlerdeki sakin [Concept('concept_great_power','$concept_great_powers|q$')] ülkelerine kaçar. Sonraki birkaç yıl boyunca [GetLawType('law_laissez_faire').GetName] karşıtı [Concept('concept_political_movement','$concept_political_movements|q$')] destek kazanır."
 concept_spec_foreign_panic: "Yabancı Panik"
 concept_spec_foreign_panics: "Yabancı Panikler"
 concept_spec_foreign_panic_desc: "Bir [concept_country] ile ortak [concept_market], bağlı ülke ilişkisi, yatırım hakları, yoğun ticaret veya ekonomi mülkiyeti üzerinden bağlantılı başka bir ülkede [concept_spec_financial_panic] başladığında $concept_spec_foreign_panic$ o ülkede [concept_spec_market_confidence] kaybına yol açar. Yakın bağlar daha büyük kayıp doğurur. [GetLawType('law_free_trade').GetName] ticaret bağlarını güçlendirir, diğer ticaret politikaları zayıflatır. [concept_embargo] ticaret bağını keser."
 concept_spec_boom_end: "Yükseliş Sonu"
 concept_spec_boom_ends: "Yükseliş Sonları"
 concept_spec_boom_end_desc: "Bir [concept_good] için [concept_spec_investor_interest] yükseldikten sonra gerileyince yükseliş sona erer ve ne kadar yükselmişse o kadar sert düşer: zirvesi #v İlgili#! olan yükseliş [concept_spec_correction], #v Hevesli#! olan [concept_spec_bust], #v Hararetli#! olan ise [concept_spec_collapse] ile sona erer.\n\nHer biri [concept_spec_market_confidence] düzeyini düşürür; büyük yükselişler ve [concept_market] ticaretindeki payı büyük olan [Concept('concept_good','$concept_goods|q$')] için daha fazla. Ardından $concept_good$ toparlanırken yatırımcılar geri durur ve malı bir [concept_company] üretiyorsa sanayisi [concept_throughput] kaybeder. Ölçülen zirve her ay biraz söner, böylece yavaş soğuyan bir yükseliş daha yumuşak biter ya da hiç $concept_spec_boom_end$ yaşanmaz."
 concept_spec_correction: "Düzeltme"
 concept_spec_correction_desc: "$concept_spec_correction$, en hafif [concept_spec_boom_end] türüdür. Bir [concept_good] için #v İlgili#! düzeyine çıkan [concept_spec_investor_interest] yeniden #v Kuşkulu#! düzeyine düştüğünde gerçekleşir.\n\nHafif bir [concept_spec_market_confidence] kaybına yol açar. Ardından yatırımcılar #v 3#! ay boyunca $concept_good$ yatırımından uzak durur. Malı bir [concept_company] üretiyorsa ilgili sanayi #v 90#! gün boyunca #N %2.5#! [concept_throughput] kaybeder; araştırılan [GetTechnology('corporate_charters').GetName] ve [GetTechnology('corporate_management').GetName] her biri için bu kayıp #N %25#! daha artar."
 concept_spec_bust: "Daralma"
 concept_spec_bust_desc: "$concept_spec_bust$, [concept_spec_correction] ile karşılaştırıldığında daha sert bir [concept_spec_boom_end] türüdür. Bir [concept_good] için #v Hevesli#! düzeyine çıkan [concept_spec_investor_interest] yeniden #v Kuşkulu#! düzeyine düştüğünde gerçekleşir.\n\nDaha fazla [concept_spec_market_confidence] kaybına yol açar; aynı yükselişte bir [concept_spec_correction] kaybının yaklaşık #v 2#! katıdır. Ardından yatırımcılar #v 6#! ay boyunca $concept_good$ yatırımından uzak durur. Malı bir [concept_company] üretiyorsa ilgili sanayi #v 180#! gün boyunca #N %5#! [concept_throughput] kaybeder; araştırılan [GetTechnology('corporate_charters').GetName] ve [GetTechnology('corporate_management').GetName] her biri için bu kayıp #N %25#! daha artar."
 concept_spec_collapse: "Çöküş"
 concept_spec_collapse_desc: "$concept_spec_collapse$, en ağır [concept_spec_boom_end] türüdür. Bir [concept_good] için #v Hararetli#! düzeyine çıkan [concept_spec_investor_interest] tamamen #v Kaçış#! durumuna gerilediğinde gerçekleşir.\n\nSert bir [concept_spec_market_confidence] kaybına yol açar; aynı yükselişte bir [concept_spec_correction] kaybının yaklaşık #v 5#! katıdır. Ardından yatırımcılar #v 12#! ay boyunca $concept_good$ yatırımından uzak durur. Malı bir [concept_company] üretiyorsa ilgili sanayi bir yıl boyunca #N %10#! [concept_throughput] kaybeder; araştırılan [GetTechnology('corporate_charters').GetName] ve [GetTechnology('corporate_management').GetName] her biri için bu kayıp #N %25#! daha artar. [concept_market] ticaretinin büyük bir payında yaşanan $concept_spec_collapse$, [concept_spec_financial_panic] doğurabilir."
 concept_spec_investor_interest: "Yatırımcı İlgisi"
 concept_spec_investor_interest_desc: "$concept_spec_investor_interest$, bir [concept_good] üreten [Concept('concept_building','$concept_buildings|q$')] için yatırımcıların duyduğu ilgidir. [concept_market_price] uzun dönem ortalamasının üzerindeyken artar, altındayken düşer; #v Kaçış#! düzeyinden #v Hararetli#! düzeyine kadar.\n\nBu binaların [concept_throughput] değeri onu izler: #v Kaçış#! düzeyinde #N -%10#!, #v Hararetli#! düzeyinde #P +%8#!. $concept_good$ üreten [Concept('concept_company','$concept_companies|q$')] için [concept_prosperity] de onu izler. Yükselişteki bir $concept_good$ [concept_spec_market_confidence] düzeyini artırır. İlgi geri düştüğünde yükseliş bir [concept_spec_boom_end] ile biter."
 concept_spec_credit_policy: "Kredi Politikası"
 concept_spec_credit_policy_tight: "Sıkı Kredi"
 concept_spec_credit_policy_normal: "Normal Kredi"
 concept_spec_credit_policy_loose: "Gevşek Kredi"
 concept_spec_credit_policy_desc: "$concept_spec_credit_policy$, bankaların [concept_investment_pool] için ne kadar serbestçe kredi verdiğini belirler. [GetTechnology('central_banking').GetName] gerektirir ve $concept_spec_credit_policy_tight$, $concept_spec_credit_policy_normal$ veya $concept_spec_credit_policy_loose$ olabilir. Sıkı kredi yatırımı yavaşlatır ve yüksek seyrettiğinde [concept_spec_market_confidence] değerini aşağı çeker; gevşek kredi ise [concept_spec_outstanding_credit] miktarını artırır. Değiştirildiğinde #v 6#! ay boyunca kilitlenir."
 concept_spec_leverage: "Kredi Kaldıracı"
 concept_spec_leverage_desc: "$concept_spec_leverage$, bir [concept_country] için [concept_spec_outstanding_credit] miktarının [concept_investment_pool] gelirinin kaç ayına denk geldiğini gösterir.\n\nHer tam ay #P +%2#! [concept_throughput] sağlar, en fazla #P +%24#!. Bir [concept_spec_financial_panic] sırasında veya [concept_spec_bad_debts] sürerken ayda #N %2#! azalır. #v 3#! ayı geçince [concept_spec_financial_panic] daha yüksek [concept_spec_market_confidence] düzeyinde başlar ve [concept_spec_bad_debts] bırakır."
 concept_spec_bad_debts: "Batık Alacaklar"
 concept_spec_bad_debts_desc: "$concept_spec_bad_debts$, bir [concept_spec_financial_panic] sonrasında kalan zararlardır ve [concept_spec_leverage] #v 3#! ayı aştıkça artar.\n\nHer puan [concept_throughput] değerini #N %0.4#!, yatırımı #N %0.75#! azaltır. Önce ayda #v 3#! puan artarlar, sonra ayda #v 0.6#! puan azalırlar; en kötü durumda temizlenmeleri yaklaşık #v 6#! yıl sürer. Onlar sürdükçe bankalar kredi vermez. #v Bankalara Borç Ver#! onları temizlemez. #v Batık Kredileri Satın Al#! onları yarıya indirir, sürdükleri sürece bir kez."
 concept_spec_lending_standards: "Kredi Standartları"
 concept_spec_lending_standards_desc: "$concept_spec_lending_standards$, bir [concept_country] bankalarının ne kadar dikkatli kredi verdiğini gösterir: #v Katı#!, #v İhtiyatlı#!, #v Sağlam#!, #v Özensiz#! veya #v Pervasız#!. Özensiz bankalar [concept_investment_pool] için daha çok, bunun da daha büyük kısmını yükselişlere verir; bu yüzden o yükselişler daha sert biter ve Banka Kurtarma daha pahalıya mal olur.\n\n[concept_spec_financial_panic] olmadan geçen her ay biraz gevşerler; yaklaşık #v 20#! sakin yılda #v Katı#! düzeyinden #v Pervasız#! düzeyine iner, her Banka Kurtarma veya #v Batık Kredileri Satın Al#! sonrasında daha fazla gevşerler. Bir yükseliş sona erdiğinde, en çok da bir $concept_spec_financial_panic$ Banka Kurtarma olmadan sonuna kadar sürdüğünde sıkılaşırlar."
 concept_spec_outstanding_credit: "Ödenmemiş Kredi"
 concept_spec_outstanding_credit_desc: "$concept_spec_outstanding_credit$, bankaların [concept_investment_pool] için verdiği ve henüz geri ödenmemiş kredidir. [concept_spec_market_confidence] #v 55#! üzerindeyken bankalar, havuz gelirinin #v 3#! ayı olan Kredi Sınırına kadar kredi verir. [GetTechnology('central_banking').GetName] #v 5#! ay ekler, [GetTechnology('investment_banks').GetName] ve [GetTechnology('international_exchange_standards').GetName] de her biri #v 2#! ay ekler.\n\nHer ay #v %2#! kadarı havuzdan geri ödenir. Bir [concept_spec_financial_panic] başladığında bir kısmı geri çekilir.\n\n#lore Bankalar 1840'larda demiryolu hisseleri, 1837 yılında pamuk ve 1873 yılında Viyana'da arsa karşılığında borç verdi ve bu yükselişler çöktüğünde ortada kaldı.#!"
