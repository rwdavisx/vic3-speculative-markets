 spec_lev_boom_desc: "Banka kredisi, [concept_spec_leverage] düzeyinin her tam ayı için [concept_throughput] değerini #P +%2#! artırır, en fazla #P +%24#!."
 spec_credit_crunch: "Batık Alacaklar"
 spec_credit_crunch_desc: "Bankalar son yükselişin kredilerini zarar yazıyor ve bu etki geçene kadar hiç kredi vermiyor. #v Bankalara Borç Ver#! bunu gidermez. #v Batık Kredileri Satın Al#! bunu yarıya indirir, sürdüğü sürece bir kez."
