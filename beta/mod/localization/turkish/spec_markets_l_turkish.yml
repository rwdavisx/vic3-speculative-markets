 concept_spec_speculative_excess: "Spekülatif Aşırılık"
 concept_spec_speculative_excess_desc: "$concept_spec_speculative_excess$, bir yükseliş sırasında bir [concept_country] için [concept_market] içinde oluşan balonu ölçer. [GetTechnology('stock_exchange').GetName] araştırıldıktan sonra [concept_spec_market_confidence] en az #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! olduğu her ay artar. $concept_spec_market_confidence$ ne kadar yükselirse birikim o kadar hızlanır. $concept_spec_market_confidence$ #v 60#! ile #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#! arasında kalırken ayda #v %2#! azalır.\n\n$concept_spec_market_confidence$ #v 60#! altına düşünce balon patlar ve $concept_spec_market_confidence$ en fazla #v [GetPlayer.MakeScope.ScriptValue('spec_burst_max')|0]#! daha düşer. $concept_spec_speculative_excess$ ne kadar yüksekse düşüş o kadar sert olur."
 concept_spec_sound_finance: "Sağlam Maliye"
 concept_spec_sound_finance_desc: "$concept_spec_sound_finance$, [concept_spec_banking_reforms] kapsamındaki üç düzenlemenin tamamıyla sağlanır: Banknot Kuralları, Son Kredi Mercii ve Şirketler Kanunu.\n\nÜçü de yürürlüğe girince yönettiğin [concept_country] #v 10#! [concept_prestige] kazanır ve [concept_loans] için #v %5#! daha az faiz öder."
 concept_spec_banking_reforms: "Bankacılık Reformları"
 concept_spec_banking_reform: "Bankacılık Reformu"
 concept_spec_banking_reforms_desc: "$concept_spec_banking_reforms$, bir [concept_country] için bankaların ve şirketlerin uyacağı kuralları belirler. Her biri bir teknolojiyle açılır ve bir Araştırma Komisyonu aracılığıyla yürürlüğe girer; komisyon bir [concept_spec_financial_panic] sonrasında veya paniksiz geçen #v 10#! yılın ardından toplanabilir. Her komisyon bir reform yapar.\n\n#bold Banknot Kuralları#! ([GetTechnology('banking').GetName]), iki seçenekten biri:\n#bold Para Okulu:#! $spec_reform_currency_tt$\n#bold Serbest Bankacılık:#! $spec_reform_free_tt$\n\n#bold Son Kredi Mercii#! ([GetTechnology('central_banking').GetName]): $spec_reform_llr_tt$\n\n#bold Şirketler Kanunu#! ([GetTechnology('joint_stock_companies').GetName]): $spec_reform_company_tt$\n\nÜçünün de yürürlüğe girmesi [concept_spec_sound_finance] sağlar."
