 spec_markets.1.t: "Spekülatif Çılgınlık"
 spec_markets.1.d: "[ROOT.GetCountry.GetCapital.GetCityHubName] şehrinde servetler sayılamayacak kadar hızlı kazanılıyor. [ROOT.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName], [ROOT.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName] ve [ROOT.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName] fiyatları her hafta yükseliyor, bunları üretecek yeni şirketler neredeyse her gün halka açılıyor ve bankalar hisseleri karşılığında gözünü kırpmadan kredi veriyor. Bütün bunların gerçekte ne kadar ettiğini soran pek az.\n\nBazı $capitalists_no_icon$ ve $shopkeepers_no_icon$ yeni servetlerini hükümete borçlu sayıp [Concept('concept_loyalist','$concept_loyalists|q$')] oluyor. Bu durum sürerse [GetLawType('law_laissez_faire').GetName] yanlısı [Concept('concept_political_movement','$concept_political_movements|q$')] destek kazanacak."
 spec_markets.1.d_generic: "[ROOT.GetCountry.GetCapital.GetCityHubName] şehrinde servetler sayılamayacak kadar hızlı kazanılıyor. Fiyatlar her hafta yükseliyor, yeni şirketler neredeyse her gün halka açılıyor ve bankalar hisseleri karşılığında gözünü kırpmadan kredi veriyor. Bütün bunların gerçekte ne kadar ettiğini soran pek az.\n\nBazı $capitalists_no_icon$ ve $shopkeepers_no_icon$ yeni servetlerini hükümete borçlu sayıp [Concept('concept_loyalist','$concept_loyalists|q$')] oluyor. Bu durum sürerse [GetLawType('law_laissez_faire').GetName] yanlısı [Concept('concept_political_movement','$concept_political_movements|q$')] destek kazanacak."
 spec_markets.1.f: "“Al evladım, fiyatına bakma. Bugün ne ödersen öde, yarın bir başkası daha fazlasını verecek.”"
 spec_markets.1.a: "Refah kendini gösteriyor."
 spec_markets.1.b: "İtidal tavsiye et."
 spec_markets.1.b.tt: "[concept_spec_market_confidence] #v 10#! düşer"
 spec_markets.1.c: "Spekülatörler de paylarına düşeni ödesin."
 spec_markets.1.c.tt: "[concept_spec_market_confidence] #v 5#! düşer"
 spec_markets.2.t: "Mali Panik"
 spec_markets.2.d_crash: "[ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName] yükselişinin sonu, sona eren yükselişlerin en büyüğü olarak genel bir paniğe dönüştü. Fiyatı üzerinden borç veren firmalar birbiri ardına batıyor ve mevduat sahipleri gün ağardığından beri [ROOT.GetCountry.GetCapital.GetCityHubName] bankalarının önünde sırada. Bankalar #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#! tutarında krediyi geri çağırıyor, yatırımcılar ellerinde kalan son paraya sarılıyor. [concept_private_construction] #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! ay boyunca yarıya inecek.\n\nServetlerini yitiren $capitalists_no_icon$, $aristocrats_no_icon$ ve $shopkeepers_no_icon$ hükümeti suçluyor, bazıları [Concept('concept_radical','$concept_radicals|q$')] oluyor. Artık pek çok kişi devletin pazarları dizginlemesini istiyor ve [GetLawType('law_laissez_faire').GetName] karşıtı [Concept('concept_political_movement','$concept_political_movements|q$')] destek kazanıyor.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_crash_no_loans: "[ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName] yükselişinin sonu, sona eren yükselişlerin en büyüğü olarak genel bir paniğe dönüştü. Fiyatı üzerinden borç veren firmalar birbiri ardına batıyor ve mevduat sahipleri gün ağardığından beri [ROOT.GetCountry.GetCapital.GetCityHubName] bankalarının önünde sırada. Yatırımcılar ellerinde kalan son paraya sarılıyor. [concept_private_construction] #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! ay boyunca yarıya inecek.\n\nServetlerini yitiren $capitalists_no_icon$, $aristocrats_no_icon$ ve $shopkeepers_no_icon$ hükümeti suçluyor, bazıları [Concept('concept_radical','$concept_radicals|q$')] oluyor. Artık pek çok kişi devletin pazarları dizginlemesini istiyor ve [GetLawType('law_laissez_faire').GetName] karşıtı [Concept('concept_political_movement','$concept_political_movements|q$')] destek kazanıyor.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
