 spec_stance_cooldown_tt: "[concept_spec_credit_policy] son #v 6#! ayda değişmedi"
 spec_rescued_tt: "Bu [concept_spec_financial_panic] sırasında bankalara borç vermedik ve Bankacılık Kanunu'nu askıya almadık"
 spec_credit_tight: "Sıkı Kredi"
 spec_credit_tight_fx: "[concept_spec_credit_policy] #v Sıkı#! olur"
 spec_credit_normal_fx: "[concept_spec_credit_policy] #v Normal#! olur"
 spec_credit_loose_fx: "[concept_spec_credit_policy] #v Gevşek#! olur"
 spec_credit_tight_desc: "Bankalar kredi vermeyi bırakır, yatırımcılar yükselen fiyatlara daha az tepki gösterir. Yükselişler daha küçük kalır, böylece sonları ve panikler daha hafif olur. [concept_spec_market_confidence] her ay #v 60#! üzerindeki kısmının #N %10#! kadarını kaybeder. Bu seçim [concept_spec_credit_policy] değişikliğini #v 6#! ay boyunca engeller. Gereken: [GetTechnology('central_banking').GetName].\n\n@intelligentsia! Aydınlar [concept_in_government] ise: #P +2#! [concept_approval]\n@industrialists! Sanayiciler [concept_in_government] ise: #N -2#! [concept_approval]"
 spec_credit_normal: "Normal Kredi"
 spec_credit_normal_desc: "[concept_spec_market_confidence] #v 55#! üzerindeyken bankalar [concept_investment_pool] için kredi verir. Bu seçim [concept_spec_credit_policy] değişikliğini #v 6#! ay boyunca engeller. Gereken: [GetTechnology('central_banking').GetName]."
 spec_credit_loose: "Gevşek Kredi"
 spec_credit_loose_desc: "Bankalar daha fazla kredi verir, yatırımcılar yükselen fiyatlara daha güçlü tepki gösterir. Yükselişler büyür, sona erdiklerinde kayıplar da büyür. Bu seçim [concept_spec_credit_policy] değişikliğini #v 6#! ay boyunca engeller. Gereken: [GetTechnology('central_banking').GetName].\n\n@industrialists! Sanayiciler [concept_in_government] ise: #P +2#! [concept_approval]\n@intelligentsia! Aydınlar [concept_in_government] ise: #N -2#! [concept_approval]"
 spec_rescue_banks: "Bankalara Borç Ver"
 spec_rescue_banks_desc: "[concept_treasury] içinden [concept_gdp] değerinin yaklaşık #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#! kadarı harcanır. [concept_spec_financial_panic] #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#! ay içinde sona erer ve etkileri yarıya iner. [concept_spec_market_confidence] #v 20#! yükselir. Paniğin bitmesine ne kadar çok ay kaldıysa maliyet o kadar artar. Her panikte bir kez yapılabilir. [GetTechnology('central_banking').GetName] bu işlemi ucuzlatır ve hızlandırır."
 spec_conf_panic: "Sarsılmış Yatırımcılar"
