 SPEC_DRIVER_RESTRAIN_TT: "#header Dizginlenen Yükselişler: [Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\nBu Ay Yavaşça İndirilen Yükselişlerden [Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0')|+=2]\n[concept_spec_market_conditions] etkisinden #tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_restrain').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_restrain_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#!\n$TOOLTIP_DELIMITER$\nDizginlenen yükseliş tek düşüşle bitmek yerine [concept_spec_correction] olarak yavaşça indirilir. Her ay biraz maliyeti vardır."
 SPEC_DRIVER_CAUTION_TT: "#header Hükümet ve Olaylar: [Country.MakeScope.Var('spec_c_caution').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\nKararlarımızdan ve pazar olaylarından bu ay gelen tek seferlik değişim."
 SPEC_DRIVER_LIMIT_TT: "#header Alt ve Üst Sınır: [Country.MakeScope.Var('spec_c_limit').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_market_confidence] #v 0#! altına inemez, #v 100#! üzerine çıkamaz; bu yüzden bu ayki değişimin bu kadarı sayılmadı."
 SPEC_DRIVER_RESCUE_TT: "#header Banka Kurtarma: [Country.MakeScope.Var('spec_c_rescue').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n#v Bankalara Borç Ver#! veya #v Bankacılık Kanunu'nu Askıya Al#! kararından gelen tek seferlik artış. [concept_spec_market_confidence] değerini #v 100#! üzerine çıkaramaz."
 SPEC_DRIVER_RESCUE: "Banka Kurtarma"
 SPEC_DRIVER_WAREND: "Savaşın Sonu"
 SPEC_DRIVER_WAREND_TT: "#header Savaşın Sonu: [Country.MakeScope.Var('spec_c_warend').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\nBizim [concept_casualties] etkisinden tam etkinin #v x[Country.MakeScope.Var('spec_war_stakes_now').GetValueWithDefault('(CFixedPoint)0')|%0]#! kadarı\n$TOOLTIP_DELIMITER$\nSavaşın nasıl bittiğine göre tam etki:\nKazanıldı, [concept_war_goal] dayatıldı: #P +4#!\nKazanıldı, hiçbir şey dayatılmadı: #P +1#!\nKaybedildi, aleyhimize [concept_war_goal] dayatıldı: #N -8#!\nKaybedildi, hiçbir şey dayatılmadı: #N -2#!\nHiçbir taraf kazanmadı: #N -1#!\n\nKayıplarımıza göre ölçeklenir: etkinin en az #v %25#! kadarı, savaş güçlerimizin #v %25#! kadarına mal olduysa tamamı."
 SPEC_DRIVER_BURST: "Balon Patlamaları"
 SPEC_DRIVER_BURST_TT: "#header Balon Patlamaları: [Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0')|+=1]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_speculative_excess] etkisinden #v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_burst').GetValueWithDefault('(CFixedPoint)0'), Multiply_CFixedPoint(Country.MakeScope.ScriptValue('spec_burst_per_heat'), '(CFixedPoint)-1'))|0]#!\nHer puan için #N -[Country.MakeScope.ScriptValue('spec_burst_per_heat')|2]#!\n#N -[Country.MakeScope.ScriptValue('spec_burst_max')|0]#! ile sınırlı\n$TOOLTIP_DELIMITER$\nBir yükseliş [concept_spec_market_confidence] değerini #v [Country.MakeScope.ScriptValue('spec_heat_from')|0]#! üzerine çıkardıktan sonra değer #v 60#! altına düşerse balon patlar. Yükseliş ne kadar uzun sürüp ne kadar yükselirse kayıp o kadar büyük olur.\n\nBalonlar yalnızca [GetTechnology('stock_exchange').GetName] bulunan ülkelerde oluşur."
 SPEC_DRIVER_CAUTION: "Hükümet ve Olaylar"
 SPEC_DRIVER_RESTRAIN: "Dizginlenen Yükselişler"
 SPEC_DRIVER_LIMIT: "Alt ve Üst Sınır"
 SPEC_DRIVER_BOOM: "Yükselen Mallar"
 SPEC_DRIVER_BOOM_TT: "#header Yükselen Mallar: [Country.MakeScope.Var('spec_c_boom').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\nYükselişteki [Concept('concept_good','$concept_goods|q$')] (#v [Country.MakeScope.Var('spec_n_boom').GetValueWithDefault('(CFixedPoint)0')|0]#!) etkisinden [Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0')|+=2][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_boom_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_BOOM_CAP')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_steady'), '(CFixedPoint)1')), 'SPEC_BOOM_STEADY')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_fin_boom'), '(CFixedPoint)1')), 'SPEC_BOOM_FIN')][AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_boom_rule'), '(CFixedPoint)1')), 'SPEC_BOOM_RULE')]\n$TOOLTIP_DELIMITER$\nHer yükseliş [concept_spec_market_confidence] değerini artırır; [concept_market] içindeki payı büyüdükçe artış da büyür. [concept_spec_financial_panic] sırasında etkisizdir. [GetTechnology('stock_exchange').GetName] ve [GetTechnology('investment_banks').GetName] yükselişleri büyütür, [GetTechnology('modern_financial_instruments').GetName] de aynı etkiyi gösterir."
 SPEC_BOOM_CAP: "\nÇarpanlardan önce #v +3#! ile sınırlı"
 SPEC_BOOM_STEADY: "\nMalikânelerden #v x[Country.MakeScope.ScriptValue('spec_steady')|2]#!"
 SPEC_BOOM_FIN: "\nMali Teknolojilerden #v x[Country.MakeScope.ScriptValue('spec_fin_boom')|2]#!"
 SPEC_BOOM_RULE: "\nPazar Oynaklığından #v x[Country.MakeScope.ScriptValue('spec_boom_rule')|2]#!"
 SPEC_DRIVER_CRASH: "Sona Eren Yükselişler"
 SPEC_DRIVER_CRASH_TT: "#header Sona Eren Yükselişler: [Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\nSon ayın en büyüğü: #v [Country.MakeScope.Var('spec_crashed').GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\nSona Eren Yükselişlerin Büyüklüğünden [Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0')|+=2]\n[concept_spec_market_conditions] etkisinden #tooltippable #tooltip:[Country.GetTooltipTag],SPEC_WHY_COND #v x[Divide_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), Min_CFixedPoint(Country.MakeScope.Var('spec_crash_raw').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.001'))|2]#!#!#![AddLocalizationIf(Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_crash').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-40')), 'SPEC_CRASH_CAP')]\n$TOOLTIP_DELIMITER$\nHer [concept_spec_boom_end], [concept_spec_market_confidence] düzeyini düşürür. Yükseliş ve [concept_market] içindeki payı ne kadar büyükse kayıp da o kadar büyük olur. [GetTechnology('mutual_funds').GetName] kaybı azaltır; [GetTechnology('modern_financial_instruments').GetName] kaybı artırır."
 SPEC_CRASH_CAP: "\nAylık #N -40#! ile sınırlı"
 SPEC_DRIVER_FOREIGN: "Yabancı Panikler"
 SPEC_FOREIGN_HIT: "\nBir [concept_spec_foreign_panic] etkisinden #N -20#!\nEkonomilerinin Bizimkine Oranından #v x[Country.MakeScope.Var('spec_fh_size').GetValueWithDefault('(CFixedPoint)0')|2]#!\nBizim [concept_spec_market_tie] etkisinden #v x[Country.MakeScope.Var('spec_fh_tie').GetValueWithDefault('(CFixedPoint)0')|2]#!\nOnların [concept_rank] etkisinden #v x[Country.MakeScope.Var('spec_fh_reach').GetValueWithDefault('(CFixedPoint)0')|2]#![AddLocalizationIf(Not(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('spec_foreign_loss_mult'), '(CFixedPoint)1')), 'SPEC_FOREIGN_UNSTD')]"
 SPEC_FOREIGN_UNSTD: "\n[GetTechnology('currency_standards').GetName] Olmamasından #v x[Country.MakeScope.ScriptValue('spec_foreign_loss_mult')|2]#!"
 SPEC_FOREIGN_FLIGHT: "\n[concept_spec_capital_flight] etkisinden [Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')|+=2]"
 SPEC_DRIVER_FOREIGN_TT: "#header Yabancı Panikler: [Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\nEn son: #v [Country.MakeScope.Var('spec_foreign_src').GetCountry.GetName]#!\n$TOOLTIP_DELIMITER$[AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_foreign').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0')), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_HIT')][AddLocalizationIf(Or(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0.01'), Not(GreaterThan_CFixedPoint(Country.MakeScope.Var('spec_c_flight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.01'))), 'SPEC_FOREIGN_FLIGHT')]\n$TOOLTIP_DELIMITER$\nOrtak [concept_market]: #v [Country.MakeScope.ScriptValue('spec_tie_market')|%0]#!\nEgemenlik altındaki ülke veya bağlı olunan ülke: #v %80#!\nYabancı yatırım hakları: #v [Country.MakeScope.ScriptValue('spec_tie_investment')|%0]#!\nPazarlar arası yoğun ticaret: #v [Country.MakeScope.ScriptValue('spec_tie_trade')|%0]#!\nEkonomimizdeki yabancı mülkiyet: en fazla #v %90#!\n\nBizimle bağlantılı bir [concept_country] içinde [concept_spec_financial_panic] başlarsa burada [concept_spec_market_confidence] düşer; [concept_spec_market_tie] ne kadar sıkı ve ekonomileri bizimkine göre ne kadar büyükse düşüş o kadar fazla olur. [concept_great_power] kaybın tamamını aktarır, büyük güç yarısını, küçük ülkeler çok azını. Yurt dışından bulaşan panik daha öteye yayılmaz. [GetTechnology('currency_standards').GetName] yoksa kayıp dörtte bir daha fazladır."
 SPEC_DRIVER_TURMOIL: "Savaş ve Huzursuzluk"
 SPEC_DRIVER_TURMOIL_TT: "#header Savaş ve Huzursuzluk: [Country.MakeScope.Var('spec_c_turmoil').GetValueWithDefault('(CFixedPoint)0')|+=2]#!$SPEC_ITEMS_TURMOIL$\n$TOOLTIP_DELIMITER$\nHer [concept_war], [concept_spec_war_news] etkisiyle: ayda #N -3#! ile #P +0.15#! arası\nTüm savaşlar birlikte: ayda #N -4#! ile #P +0.5#! arası\nSavaşa varmayan [concept_diplomatic_play]: ayda #N -0.5#!\nTükenen hazine: ayda en fazla #N -3#!, [concept_bankruptcy] öncesi #v 20#! haftadan itibaren\n[concept_default]: ayda #N -5#!\n[concept_revolution]: ayda #N -2#!\n\nNedenini görmek için bir sayının üzerine gel."
 SPEC_DRIVER_MOOD: "Pazar Havası"
 SPEC_DRIVER_MOOD_TT: "#header Pazar Havası: [Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\nBu Ayki Kaymadan [Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0')|+=2]\nGeçen Ayın Havasından [Subtract_CFixedPoint(Country.MakeScope.Var('spec_c_mood').GetValueWithDefault('(CFixedPoint)0'), Country.MakeScope.Var('spec_mood_shift').GetValueWithDefault('(CFixedPoint)0'))|+=2]\n$TOOLTIP_DELIMITER$\n[concept_spec_market_mood] her ay rastgele, her iki yönde en fazla #v 0.75#! kayar ve bu kaymanın #v %75#! kadarı bir sonraki aya taşınır."
 SPEC_DRIVER_DRIFT: "Normale Dönüş"
 SPEC_DRIVER_DRIFT_TT: "#header Normale Dönüş: [Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_baseline] düzeyine uzaklıktan [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_recover').GetValueWithDefault('(CFixedPoint)0'), Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100'))|+=1] (#v 55#!)\nHer ay geri kazanılan #v x[Divide_CFixedPoint(Country.MakeScope.ScriptValue('spec_recover_pct'), '(CFixedPoint)100')|%1]#!\n$TOOLTIP_DELIMITER$\n[GetTechnology('macroeconomics').GetName] bu süreci yarı yarıya hızlandırır."
 SPEC_DRIVER_TIGHT: "Sıkı Kredi"
 SPEC_DRIVER_GROWTH: "Büyüme"
 SPEC_DRIVER_GROWTH_TT: "#header Büyüme: [Country.MakeScope.Var('spec_c_growth').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\nSon ortalamasına göre [concept_gdp] etkisinden #v [Country.MakeScope.Var('spec_growth').GetValueWithDefault('(CFixedPoint)0')|=+%1]#!\nNormal büyümeden #v -%2#!\n$TOOLTIP_DELIMITER$\nNormalin üzerindeki veya altındaki her #v %1#! büyüme [concept_spec_market_confidence] değerini ayda #v 0.1#! değiştirir, her iki yönde en fazla #v 0.6#!."
 SPEC_DRIVER_BUSINESS: "İş İklimi"
 SPEC_DRIVER_BUSINESS_TT: "#header İş İklimi: [Country.MakeScope.Var('spec_c_business').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\nSanayicilerin [concept_approval] düzeyi: #v [Country.MakeScope.ScriptValue('spec_ind_approval')|0]#!\n\nSadık (#v 10#! ve üzeri): ayda #P +0.4#!\nMemnun (#v 5#! ve üzeri): ayda #P +0.2#!\nMemnuniyetsiz (#v -5#! ve altı): ayda #N -0.2#!\nÖfkeli (#v -10#! ve altı): ayda #N -0.4#!"
 SPEC_DRIVER_TIGHT_TT: "#header Sıkı Kredi: [Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_market_confidence] değerinin #v 60#! üzerindeki kısmı: #v [Divide_CFixedPoint(Country.MakeScope.Var('spec_c_tight').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-0.1')|1]#!\n[Concept('concept_spec_credit_policy','$concept_spec_credit_policy_tight|q$')] etkisiyle her ay bunun #N -%10#! kadarı\n$TOOLTIP_DELIMITER$\nBu, yükselişi bir anda değil, aylar içinde soğutur."
 concept_spec_market_conditions: "Pazar Koşulları"
 concept_spec_market_conditions_desc: "$concept_spec_market_conditions$, bir [concept_spec_boom_end] anında ne kadar [concept_spec_market_confidence] kaybedileceğini belirler. Bir yükseliş sona erdiğinde $concept_spec_market_confidence$ ne kadar yüksekse kayıp o kadar büyük olur. $concept_spec_market_confidence$ #v 55#! iken etkileri yoktur. Mali Bölgeler, Konaklar ve finans teknolojileri de bunları değiştirir."
 concept_spec_baseline: "Temel Güven"
 concept_spec_baseline_desc: "Kendi haline bırakılırsa [concept_spec_market_confidence], yukarıdan ya da aşağıdan, $concept_spec_baseline$ değeri olan #v 55#! düzeyine geri döner. Ne kadar uzaklaşırsa o kadar hızlı döner."
 concept_spec_market_mood: "Pazar Havası"
 concept_spec_market_mood_desc: "$concept_spec_market_mood$, yatırımcıların tek bir nedeni olmayan duygu dalgalanmasıdır. Her ay rastgele, her iki yönde en fazla #v 0.75#! kayar ve bunun #v %75#! kadarı sonraki aya taşınır; böylece iyi ve kötü dönemler sönmeden önce bir süre sürer."
 concept_spec_market_tie: "Pazar Bağı"
 concept_spec_market_tie_desc: "$concept_spec_market_tie$, bir [concept_country] için başka bir ülkenin [concept_market] gelişmelerini ne kadar yakından izlediğidir. Bir [concept_spec_financial_panic] durumunun ne kadarının aralarında geçeceğini belirler.\n\nMülkiyet, bir ülke diğerinin [concept_gdp] değerinin #v %10#! kadarına sahip olunca hesaba katılır ve #v %30#! düzeyinde en güçlüdür. [GetLawType('law_free_trade').GetName] ticaret bağını güçlendirir, diğer ticaret politikaları zayıflatır. [GetTechnology('international_exchange_standards').GetName] pazar ve yatırım bağlarını güçlendirir. Bir [concept_embargo] ticaret bağını keser."
 concept_spec_capital_flight: "Sermaye Kaçışı"
 concept_spec_capital_flight_desc: "Bir [concept_spec_financial_panic] başladığında para güvenli limana kaçar. Her [concept_great_power] ve [concept_spec_exchange] kurumu #v Uluslararası#! veya daha yüksek olan her [concept_country], barış içindeyse, #v Dengeli#! veya daha iyi durumdaysa ve panikteki ülkeyle bağı yoksa en fazla #P +[GetPlayer.MakeScope.ScriptValue('spec_flight_gain_max')|0]#! [concept_spec_market_confidence] kazanır. [GetTechnology('international_trade').GetName] ve [GetTechnology('international_exchange_standards').GetName] kazancı artırır. Bir [concept_spec_exchange] ne kadar yüksekte durursa o kadar çok pay alır."
 concept_spec_war_news: "Savaş Haberleri"
 concept_spec_war_news_desc: "Yatırımcılar her [concept_war] ayı ayına izler. $concept_spec_war_news$, savaşın gidişatına göre [concept_spec_market_confidence] değerini her ay değiştirir: [concept_casualties], [concept_blockade], [concept_devastation], düşen [concept_gdp] ve uzun savaş değeri düşürür; kazanılan [Concept('concept_battle','$concept_battles|q$')] ve düşman topraklarını elde tutmak yükseltir. Her savaş değeri ayda #N -3#! ile #P +0.15#! arasında, tüm savaşlar birlikte #N -4#! ile #P +0.5#! arasında değiştirir."
