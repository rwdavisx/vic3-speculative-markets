 SPEC_POOL_RECALL: "\n[concept_spec_financial_panic]中收回的贷款：#N @money!-[GetPlayer.MakeScope.Var('spec_clawed').GetValueWithDefault('(CFixedPoint)0')|D]#!"
 SPEC_POOL_BAD: "\n[concept_spec_bad_debts]：投资#N -[GetPlayer.MakeScope.ScriptValue('spec_crunch_invest_pct')|0]%#!，将在#v [GetPlayer.MakeScope.ScriptValue('spec_crunch_months')|0]#!个月内消退"
