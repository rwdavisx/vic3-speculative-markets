 SPEC_EFFECT_LAX_TT: "#header [concept_spec_lending_standards]#!\n$SPEC_EFFECT_LAX_VALUE$\n$TOOLTIP_DELIMITER$\nCrédit accordé chaque mois : #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_credit'), '(CFixedPoint)1')|+%0]#!\nPart prêtée aux essors : #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_pull'), '(CFixedPoint)1')|+%0]#!\nCoût d’un sauvetage bancaire : #v [Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_lax_cost'), '(CFixedPoint)1')|+%0]#!\n$TOOLTIP_DELIMITER$\nLes banques deviennent négligentes au fil des années sans pertes, et après chaque sauvetage bancaire. Elles ne redeviennent prudentes qu’en subissant des pertes : quand un essor prend fin, et surtout quand une [concept_spec_financial_panic] suit son cours sans sauvetage bancaire.\n\n#title Pour qu’elles restent prudentes :#!\n- Choisir le crédit restreint comme [concept_spec_credit_policy] : elles cessent de devenir négligentes\n- Freiner les essors avant qu’ils ne finissent mal\n- Laisser une panique suivre son cours sans sauvetage bancaire, ou suspendre moins souvent la loi bancaire\n\nNiveaux : #v Stricts#!, #v Prudents#!, #v Sains#!, #v Laxistes#!, #v Imprudents#!"
 SPEC_TILE_CYCLE: "[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_overx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_OVER_ON', 'SPEC_GOODS_NONE')][SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_bb_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_TILE_BB_ON', 'SPEC_GOODS_NONE')]"
