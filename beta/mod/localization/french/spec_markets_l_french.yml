 SPEC_RISKS_TT: "#header Risques#!\n$TOOLTIP_DELIMITER$\nCe qui pourrait coûter de la [concept_spec_market_confidence] si la situation se dégrade. Contrairement aux pressions, ces risques ne se sont pas encore concrétisés.\n\nEssors menacés : nos essors se terminant par une [concept_spec_boom_end]\nRisque de panique : une [concept_spec_financial_panic] se propageant depuis un [concept_country] lié au nôtre\nRisque de guerre : un [concept_diplomatic_play] débouchant sur une guerre\nRisque de défaut : notre dette atteignant notre [Concept('concept_credit','$concept_credit_limit|q$')]"
 SPEC_RISK_1: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var('spec_risk_top').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_RISK_1_V', 'SPEC_CHIP_ZERO')]"
