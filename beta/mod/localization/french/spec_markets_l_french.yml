 concept_spec_financial_centres: "Grandes Bourses"
 concept_spec_financial_centre_desc: "Les $concept_spec_financial_centres$ sont les #v 5#! [Concept('concept_country','$concept_countries|q$')] ayant le meilleur score ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]), classés chaque mois. Le score croît avec la racine carrée de #v 6#! mois de revenus du [concept_investment_pool], ainsi qu’avec la réputation, la richesse par habitant, les quartiers d’affaires, les compagnies, les technologies financières, le [concept_rank] et le système économique. La moyenne des trois premiers est affichée comme #v 100#!.\n\nPremière place : #P +10 %#! de [concept_prestige], #P -10 %#! de taux d’intérêt des [concept_loans], #P +5#! mois de plafond de crédit\nDernière place (#v 5#!) : #P +2 %#!, #P -2 %#!, #P +1#! mois\nLe bonus de plafond de crédit nécessite [GetTechnology('central_banking').GetName] et des critères de prêt #v Sains#! ou plus stricts"
 SPEC_CENTRE_PLACE: "#v ##[Country.MakeScope.Var('spec_centre_rank').GetValueWithDefault('(CFixedPoint)0')|0]#!"
 SPEC_CENTRE_PLACE_TT: "Nous sommes classés #v ##[Country.MakeScope.Var('spec_centre_rank').GetValueWithDefault('(CFixedPoint)0')|0]#! parmi les [Concept('concept_spec_financial_centre','$concept_spec_financial_centres|q$')] du monde"
