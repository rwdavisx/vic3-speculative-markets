 SPEC_TM_BROKE_TT: "#header Trésor qui s’épuise : [Country.MakeScope.Var('spec_tm_broke').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#v [Country.MakeScope.ScriptValue('spec_broke_weeks')|0]#! semaines avant la [concept_bankruptcy] à ce déficit\n$TOOLTIP_DELIMITER$\nCela commence à #v 20#! semaines et atteint #N -3#! à mesure que le [concept_treasury] se vide."
