 spec_excess_bar: "Excès spéculatif"
 concept_spec_speculative_excess: "Excès spéculatif"
 concept_spec_speculative_excess_desc: "L’$concept_spec_speculative_excess$ mesure la bulle qui se forme sur le [concept_market] d’un [concept_country] pendant un essor. Une fois la technologie [GetTechnology('stock_exchange').GetName] recherchée, il augmente chaque mois où la [concept_spec_market_confidence] atteint au moins #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!, et d’autant plus vite que la $concept_spec_market_confidence$ est élevée. Tant que la $concept_spec_market_confidence$ reste entre #v 60#! et #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!, il diminue de #v 2 %#! par mois.\n\nLorsque la $concept_spec_market_confidence$ passe sous #v 60#!, la bulle éclate et la $concept_spec_market_confidence$ chute davantage, jusqu’à #v [GetPlayer.MakeScope.ScriptValue('spec_burst_max')|0]#!. Plus l’$concept_spec_speculative_excess$ est élevé, plus la chute est rude."
 concept_spec_sound_finance: "Finances saines"
 concept_spec_sound_finance_desc: "Les $concept_spec_sound_finance$ sont atteintes en adoptant les trois [concept_spec_banking_reforms] : règles d’émission des billets, prêteur en dernier ressort et droit des sociétés.\n\nUne fois les trois réformes adoptées, le [concept_country] gagne #v 10#! de [concept_prestige] et paie #v 5 %#! d’intérêts en moins sur ses [concept_loans]."
 concept_spec_banking_reforms: "Réformes bancaires"
 concept_spec_banking_reform: "Réforme bancaire"
 concept_spec_banking_reforms_desc: "Les $concept_spec_banking_reforms$ fixent les règles qui régissent les banques et les compagnies d’un [concept_country]. Chacune devient disponible grâce à une technologie et est adoptée par une commission d’enquête, qui peut siéger après une [concept_spec_financial_panic] ou après #v 10#! ans sans panique. Chaque commission adopte une réforme.\n\n#bold Règles d’émission des billets#! ([GetTechnology('banking').GetName]), un choix parmi deux :\n#bold École monétaire :#! $spec_reform_currency_tt$\n#bold Liberté bancaire :#! $spec_reform_free_tt$\n\n#bold Prêteur en dernier ressort#! ([GetTechnology('central_banking').GetName]) : $spec_reform_llr_tt$\n\n#bold Droit des sociétés#! ([GetTechnology('joint_stock_companies').GetName]) : $spec_reform_company_tt$\n\nL’adoption des trois réformes permet d’atteindre les [concept_spec_sound_finance]."
 alert_spec_panic_risk_alert_name: "Risque de panique"
 spec_panic_risk_alert_setting_name: "Risque de panique"
 alert_spec_panic_risk_alert_desc: "Si nos essors prenaient fin maintenant, la [concept_spec_market_confidence] tomberait à #N [GetPlayer.MakeScope.ScriptValue('spec_after_collapse')|0]#!, sous le seuil de #v [GetPlayer.MakeScope.ScriptValue('spec_panic_at')|0]#! où une [concept_spec_financial_panic] éclate."
 alert_spec_panic_risk_alert_hint: "Freinez la spéculation sur les biens les plus menacés, ou resserrez la [concept_spec_credit_policy] dans l’onglet #bold $SPEC_FIN_TAB_BANKING$#! de la fenêtre #bold $SPEC_FINANCE$#!."
 alert_spec_panic_risk_alert_action: "Journal"
 alert_spec_bubble_alert_name: "Excès spéculatif"
 spec_bubble_alert_setting_name: "Excès spéculatif"
 alert_spec_bubble_alert_desc: "Notre [concept_spec_speculative_excess] s’élève à #v [GetPlayer.MakeScope.Var('spec_heat').GetValue|0]#!. Lorsque la [concept_spec_market_confidence] repasse sous #v 60#!, la bulle éclate et la [concept_spec_market_confidence] perd encore #N [GetPlayer.MakeScope.ScriptValue('spec_burst_now')|0]#!."
 alert_spec_bubble_alert_hint: "La bulle grossit chaque mois où la [concept_spec_market_confidence] atteint au moins #v [GetPlayer.MakeScope.ScriptValue('spec_heat_from')|0]#!, et se résorbe tant qu’elle reste entre #v 60#! et ce seuil. Freiner les biens en essor ou resserrer la [concept_spec_credit_policy] la fait diminuer progressivement."
 alert_spec_bubble_alert_action: "Journal"
 alert_spec_rescue_alert_name: "Sauvetage bancaire possible"
 spec_rescue_alert_setting_name: "Sauvetage bancaire possible"
 alert_spec_rescue_alert_desc: "Une [concept_spec_financial_panic] est en cours et nous n’avons pas encore soutenu les banques."
 alert_spec_rescue_alert_hint: "#v Prêter aux banques#! raccourcit la panique, réduit ses effets de moitié et augmente la [concept_spec_market_confidence] de #P +20#!. Une fois par panique, depuis l’onglet #bold $SPEC_FIN_TAB_BANKING$#! de la fenêtre #bold $SPEC_FINANCE$#!."
 alert_spec_rescue_alert_action: "Journal"
 alert_spec_bailout_alert_name: "Rachat des créances douteuses possible"
 spec_bailout_alert_setting_name: "Rachat des créances douteuses possible"
 alert_spec_bailout_alert_desc: "Les [concept_spec_bad_debts] freinent la [concept_throughput] et l’investissement, et l’État n’a pas encore racheté de créances douteuses."
 alert_spec_bailout_alert_hint: "#v Racheter les créances douteuses#! réduit de moitié les [concept_spec_bad_debts] restantes pour #v @money![GetPlayer.MakeScope.ScriptValue('spec_bailout_cost')|D]#!, une seule fois tant qu’elles durent, depuis l’onglet #bold $SPEC_FIN_TAB_BANKING$#! de la fenêtre #bold $SPEC_FINANCE$#!."
