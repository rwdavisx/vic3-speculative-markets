 SPEC_XS_CAP_TT: "#header Capital#!\n$TOOLTIP_DELIMITER$\nLe score part du capital sur lequel s’appuie notre [concept_spec_exchange] et croît comme sa racine carrée : quadrupler le capital double le score.\n\nEn propre : #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_own_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, six mois de revenus du [concept_investment_pool], en moyenne sur l’année écoulée\nGrâce à nos liens : #v @money![Multiply_CFixedPoint(Country.MakeScope.Var('spec_xs_reach_v').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1000')|D]#!, un quart du capital de chaque [concept_country] plus petit appartenant à notre [concept_market] ou à notre [concept_power_bloc], de chaque [Concept('concept_subject','$concept_subjects|q$')] et de chaque pays qui nous accorde des droits d’[concept_foreign_investment] ; au plus autant que notre capital propre"
 SPEC_XS_WEALTH_TT: "#header Richesse par habitant#!\n$TOOLTIP_DELIMITER$\nNotre revenu du [concept_investment_pool] par personne vaut #v [Country.MakeScope.Var('spec_xs_ratio_v').GetValueWithDefault('(CFixedPoint)0')|2]#! fois la moyenne mondiale. L’épargne d’un peuple riche rend le marché plus profond : la racine carrée de ce rapport, de #v x0.5#! à #v x2#!"
 SPEC_XS_TECH_TT: "#header Technologies financières#!\n$TOOLTIP_DELIMITER$\nChacune, une fois recherchée, augmente le score :\n$banking$ : #P +5 %#!\n$stock_exchange$ : #P +5 %#!\n$central_banking$ : #P +5 %#!\n$joint_stock_companies$ : #P +5 %#!\n$mutual_funds$ : #P +5 %#!\n$investment_banks$ : #P +10 %#!\n$international_exchange_standards$ : #P +10 %#!\n$modern_financial_instruments$ : #P +10 %#!\n\n[GetTechnology('stock_exchange').GetName] est nécessaire pour devenir #v Internationale#!, [GetTechnology('central_banking').GetName] pour devenir #v Centre mondial#!"
 SPEC_XS_ECON_TT: "#header Système économique#!\n$TOOLTIP_DELIMITER$\nNotre système économique multiplie le score :\n$law_laissez_faire$ : #P x1,15#!\n$law_interventionism$ : #P x1,05#!\n$law_agrarianism$ : #N x0,95#!\n$law_traditionalism$ : #N x0,9#!\n$law_extraction_economy$ : #N x0,9#!\n$law_command_economy$ : #N x0,75#!\n$law_cooperative_ownership$ : #N x0,6#!"
