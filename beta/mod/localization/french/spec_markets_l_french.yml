 je_spec_depression_reason: "Les paniques des grandes places boursières sont devenues une crise mondiale. L’investissement et la construction ont ralenti, le commerce a reculé et les chômeurs s’impatientent. La [concept_spec_long_depression] prend fin lorsque le monde s’est rétabli, ou au bout de #v 5#! ans au maximum.\n\nNos choix accélèrent notre reprise et celle du monde ; ceux des [Concept('concept_great_power','$concept_great_powers|q$')] pèsent davantage. Une fois notre propre reprise achevée, la [concept_spec_market_confidence] revient ici avant de revenir ailleurs."
