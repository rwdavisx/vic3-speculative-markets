 notification_spec_ld_recovered_name: "Notre reprise"
 notification_spec_ld_recovered_desc: "Notre économie s’est remise de la [concept_spec_long_depression] avant le reste du monde. La [concept_spec_market_confidence] se rétablit tandis que d’autres peinent encore."
 notification_spec_ld_recovered_tooltip: "#header $notification_spec_ld_recovered_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_ld_recovered_desc$"
 spec_depression.1.t: "La $SPEC_LD_NAME$"
 spec_depression.1.d: "Les paniques des places boursières du monde n’en forment plus qu’une. Le crédit ne circule plus entre les grandes maisons, les prix baissent partout à la fois, et les commandes qui faisaient tourner nos usines et nos mines sont annulées par télégramme. Chaque marché s’appuie sur les autres, et tous s’effondrent ensemble.\n\nLe krach durera quelques mois, puis viendra une longue dépression. La rapidité de notre reprise dépend de nos décisions présentes et de celles des [Concept('concept_great_power','$concept_great_powers|q$')]."
 spec_depression.1.f: "« Nous avons déjà connu des paniques. Cette fois, l’argent n’a plus nulle part où se réfugier. »"
 spec_depression.1.a: "Il faut réduire nos dépenses."
 spec_depression.1.b: "Stabilisons les places boursières."
 spec_depression.2.t: "Un mur douanier"
 spec_depression.2.d: "Les propriétaires de nos plus grandes usines ont adressé une pétition au gouvernement, et les grands propriétaires terriens se sont joints à eux. Les biens étrangers et le blé étranger bon marché, disent-ils, se vendent sur nos marchés au prix que leurs producteurs parviennent à en tirer, tandis que nos propres usines et domaines ne peuvent plus vendre à un prix qui couvre les salaires. Ils réclament une hausse des droits sur tout ce qui fait concurrence à l’industrie et aux récoltes nationales.\n\nLa protection favoriserait notre reprise, mais nos partenaires commerciaux en souffriraient, et la reprise mondiale avec eux."
 spec_depression.2.f: "« Chaque nation dresse un mur autour de son marché, puis s’étonne que ses exportations ne reprennent pas. »"
 spec_depression.2.a: "Protégeons notre industrie."
 spec_depression.2.b: "Gardons nos marchés ouverts."
 spec_depression.3.t: "Chantiers de secours"
 spec_depression.3.d: "Des milliers d’hommes restent sans ouvrage à [ROOT.GetCountry.GetCapital.GetCityHubName], et les caisses de secours sont vides. Les ingénieurs de la ville ont dressé une liste de travaux qui pourraient les employer : égouts, routes, digues et nouvelle halle, pourvu que le Trésor en assume les frais."
 spec_depression.3.f: "« L’homme qui creuse un égout pour gagner sa journée ne vit pas d’aumônes, et il le sait. »"
 spec_depression.3.a: "Finançons les travaux."
 spec_depression.3.b: "La charité est une affaire privée."
 spec_depression.4.t: "Les banques assiégées"
 spec_depression.4.d: "Le bruit court que les banques de [ROOT.GetCountry.GetCapital.GetCityHubName] ont beaucoup prêté à des entreprises désormais en faillite. Depuis ce matin, les déposants font la queue pour retirer leur épargne. Ce soir, les banques n’auront plus une pièce pour les rembourser. Leurs directeurs demandent au gouvernement d’intervenir."
 spec_depression.4.f: "« Une banque est parfaitement saine jusqu’au jour où tout le monde croit le contraire. »"
 spec_depression.4.a: "Décrétons la fermeture des banques."
 spec_depression.4.b: "Renflouons les banques."
 spec_depression.4.c: "Laissons-les faire faillite."
 spec_depression.5.t: "La question monétaire"
 spec_depression.5.d: "La baisse des prix divise le pays. Agriculteurs et petits emprunteurs affirment que l’argent est devenu trop cher et que chaque dette pèse davantage à chaque année de baisse des prix. Ils réclament davantage de monnaie en circulation et un crédit plus accessible. Banquiers et créanciers répondent que seule une monnaie saine rendra confiance aux investisseurs du pays et de l’étranger."
 spec_depression.5.f: "« Mon hypothèque est la même qu’il y a cinq ans. Mon blé se vend moitié moins cher. »"
 spec_depression.5.a: "Une monnaie saine avant tout."
 spec_depression.5.b: "Facilitons le crédit."
 spec_depression.6.t: "La marche des chômeurs"
 spec_depression.6.d: "Une colonne de chômeurs est entrée à [ROOT.GetCountry.GetCapital.GetCityHubName] derrière des banderoles proclamant « Du travail ou du pain ». Ils campent devant les bureaux du gouvernement et demandent à présenter une pétition. La police affirme pouvoir dégager la place avant la nuit."
 spec_depression.6.f: "« Nous ne demandons pas la charité. Nous demandons du travail. »"
 spec_depression.6.a: "Dispersons-les."
 spec_depression.6.b: "Écoutons leur pétition."
 spec_depression.7.t: "Appels à la réforme"
 spec_depression.7.d: "Les journaux demandent pourquoi la dépression dure depuis si longtemps et qui s’est enrichi grâce à la spéculation qui l’a précédée. Des parlementaires réclament une enquête sur les banques, les places boursières et la conduite du gouvernement lui-même."
 spec_depression.7.f: "« La question n’est plus de savoir si le système a failli, mais qui devra en répondre. »"
 spec_depression.7.a: "Ordonnons une enquête."
 spec_depression.7.b: "Le système est sain."
 spec_depression.8.t: "La $SPEC_LD_NAME$ se dissipe"
 spec_depression.8.d: "Pour la première fois depuis des années, les commandes arrivent plus vite qu’elles ne sont annulées. Les prix ont cessé de baisser, les banques prêtent à nouveau et les usines naguère à l’arrêt embauchent. La dépression est terminée, même si ceux qui l’ont traversée ne sont pas près de l’oublier."
 spec_depression.8.f: "« Le commerce se relève, dit-on. Je le croirai quand mon propre carnet de commandes me le confirmera. »"
 spec_depression.8.a: "Les leçons ont été tirées."
 spec_depression.8.b: "Reprenons les affaires."
