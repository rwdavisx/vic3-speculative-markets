 SPEC_PLEDGE_MAKE_TT: "#header Promesse de sauver les banques#!\n$TOOLTIP_DELIMITER$\nChaque [concept_spec_financial_panic] fait l’objet d’un sauvetage immédiat, #P 25 %#! moins cher, si le [concept_treasury] peut payer sur ses réserves et si le pays n’est pas en [concept_default]\nRéputation de la [concept_spec_exchange] perdue lors d’une panique : #P -50 %#!\n[concept_spec_capital_flight] reçue : #P +50 %#! (rang International ou supérieur, ou en tant que [concept_great_power])\nChaque sauvetage assouplit les critères de prêt\n$TOOLTIP_DELIMITER$\nTomber en [concept_default] rompt la promesse : toute la réputation est perdue, [concept_spec_market_confidence] #N -15#!, [concept_legitimacy] #N -10#! pendant #v 5#! ans\nRetirer la promesse exige un préavis de #v 24#! mois[AddLocalizationIf(Not(GetScriptedGui('spec_sgui_pledge').IsValid(GuiScope.SetRoot(Country.MakeScope).End)), 'SPEC_PLEDGE_PLEDGE_WHY')]"
 SPEC_PLEDGE_OUT_TT: "#header $SPEC_PLEDGE_OUT$#!\n$TOOLTIP_DELIMITER$\nChaque [concept_spec_financial_panic] fait l’objet d’un sauvetage immédiat, #P 25 %#! moins cher, si le [concept_treasury] peut payer sur ses réserves et si le pays n’est pas en [concept_default]\nRéputation de la [concept_spec_exchange] perdue lors d’une panique : #P -50 %#!\n[concept_spec_capital_flight] reçue : #P +50 %#! (rang International ou supérieur, ou en tant que [concept_great_power])\nChaque sauvetage assouplit les critères de prêt\n$TOOLTIP_DELIMITER$\nTomber en [concept_default] rompt la promesse : toute la réputation est perdue, [concept_spec_market_confidence] #N -15#!, [concept_legitimacy] #N -10#! pendant #v 5#! ans\nRetirer la promesse exige un préavis de #v 24#! mois[AddLocalizationIf(Not(GetScriptedGui('spec_sgui_pledge_leave').IsValid(GuiScope.SetRoot(Country.MakeScope).End)), 'SPEC_PLEDGE_PLEDGE_LEAVE_WHY')]"
