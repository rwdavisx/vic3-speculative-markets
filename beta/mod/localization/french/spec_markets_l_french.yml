l_french:
 spec_confidence_bar: "Confiance du marché"
 spec_confidence_bar_desc: "[concept_spec_market_confidence]: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!"
 spec_stance_current_tt: "Ce n’est pas déjà la [concept_spec_credit_policy] en vigueur"
 spec_stance_cooldown_tt: "La [concept_spec_credit_policy] n’a pas changé au cours des #v 6#! derniers mois"
 spec_rescued_tt: "Nous n’avons ni prêté aux banques ni suspendu la loi bancaire pendant cette [concept_spec_financial_panic]"
 spec_credit_tight: "Crédit restreint"
 spec_credit_tight_fx: "La [concept_spec_credit_policy] devient #v Restrictive#!"
 spec_credit_normal_fx: "La [concept_spec_credit_policy] devient #v Normale#!"
 spec_credit_loose_fx: "La [concept_spec_credit_policy] devient #v Souple#!"
 spec_credit_tight_desc: "Les banques cessent de prêter et les investisseurs réagissent moins à la hausse des prix. Les essors restent plus modestes, ce qui atténue leurs fins et les paniques. Chaque mois, la [concept_spec_market_confidence] perd #N 10 %#! de son excédent au-dessus de #v 60#!. Ce choix verrouille la [concept_spec_credit_policy] pendant #v 6#! mois. Nécessite [GetTechnology('central_banking').GetName].\n\n@intelligentsia! Intelligentsia [concept_in_government] : #P +2#! d’[concept_approval]\n@industrialists! Industriels [concept_in_government] : #N -2#! d’[concept_approval]"
 spec_credit_normal: "Crédit normal"
 spec_credit_normal_desc: "Les banques prêtent au [concept_investment_pool] tant que la [concept_spec_market_confidence] dépasse #v 55#!. Ce choix verrouille la [concept_spec_credit_policy] pendant #v 6#! mois. Nécessite [GetTechnology('central_banking').GetName]."
 spec_credit_loose: "Crédit souple"
 spec_credit_loose_desc: "Les banques prêtent davantage et les investisseurs réagissent plus fortement à la hausse des prix. Les essors sont plus forts, tout comme les pertes lorsqu’ils prennent fin. Ce choix verrouille la [concept_spec_credit_policy] pendant #v 6#! mois. Nécessite [GetTechnology('central_banking').GetName].\n\n@industrialists! Industriels [concept_in_government] : #P +2#! d’[concept_approval]\n@intelligentsia! Intelligentsia [concept_in_government] : #N -2#! d’[concept_approval]"
 spec_rescue_banks: "Prêter aux banques"
 spec_rescue_banks_desc: "Dépensez environ #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#! du [concept_gdp] en puisant dans le [concept_treasury] pour mettre fin à la [concept_spec_financial_panic] dans un délai de #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#! mois et réduire ses effets de moitié. La [concept_spec_market_confidence] augmente de #v 20#!. Plus il reste de mois de panique, plus le coût est élevé. Possible une fois par panique. La technologie [GetTechnology('central_banking').GetName] réduit le coût et accélère le résultat."
 spec_conf_panic: "Investisseurs ébranlés"
 spec_conf_panic_held: "Investisseurs ébranlés"
 spec_conf_wary: "Investisseurs méfiants"
 spec_conf_steady: "Investisseurs stables"
 spec_conf_buoyant: "Investisseurs optimistes"
 spec_conf_mania: "Investisseurs frénétiques"
 spec_conf_panic_desc: "Effets de la [concept_spec_market_confidence] sur l’investissement et les intérêts des [concept_loans]"
 spec_conf_panic_held_desc: "Effets de la [concept_spec_market_confidence] sur l’investissement et les intérêts des [concept_loans]"
 spec_conf_wary_desc: "Effets de la [concept_spec_market_confidence] sur l’investissement et les intérêts des [concept_loans]"
 spec_conf_steady_desc: "Effets de la [concept_spec_market_confidence] sur l’investissement et les intérêts des [concept_loans]"
 spec_conf_buoyant_desc: "Effets de la [concept_spec_market_confidence] sur l’investissement et les intérêts des [concept_loans]"
 spec_conf_mania_desc: "Effets de la [concept_spec_market_confidence] sur l’investissement et les intérêts des [concept_loans]"
 spec_panic: "Panique financière"
 spec_panic_desc: "Effets d’une [concept_spec_financial_panic] sur le [concept_market]"
 spec_panic_crunch: "Crédit paralysé"
 spec_panic_crunch_desc: "Les banques ont cessé de prêter pendant la [concept_spec_financial_panic], réduisant la [concept_private_construction] de moitié"
 spec_lev_boom: "Essor du crédit"
 spec_bailout_fx_tt: "[concept_spec_bad_debts] : #P réduites de moitié#!, effacées en #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_months')|0]#! mois au lieu de #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#!"
 spec_bailout_cost_tt: "[concept_treasury] : #N -@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_cost')|D]#!, soit environ #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_bailout_share')|%0]#! du [concept_gdp]"
 spec_bailout_debts_tt: "Il reste des [concept_spec_bad_debts] à effacer"
 spec_bailed_tt: "L'État n'a pas racheté de créances douteuses depuis l'apparition de ces [concept_spec_bad_debts]"
 spec_lev_boom_desc: "Le crédit bancaire augmente la [concept_throughput] de #P +2 %#! par mois entier de [concept_spec_leverage], jusqu’à #P +24 %#!."
 spec_credit_crunch: "Créances douteuses"
 spec_credit_crunch_desc: "Les banques passent par pertes et profits les prêts du dernier essor et ne prêtent rien jusqu’à leur résorption. #v Prêter aux banques#! ne les efface pas. #v Racheter les créances douteuses#! les réduit de moitié, une seule fois tant qu’elles durent."
 spec_loose_credit: "Crédit souple"
 spec_loose_credit_desc: "Effets de la [concept_spec_credit_policy]"
 spec_tight_credit: "Crédit restreint"
 spec_tight_credit_desc: "Effets de la [concept_spec_credit_policy]"
 spec_markets.1.t: "Frénésie spéculative"
 spec_markets.1.d: "À [ROOT.GetCountry.GetCapital.GetCityHubName], les fortunes se font plus vite qu’on ne peut les compter. Les cours des biens [ROOT.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName], [ROOT.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName] et [ROOT.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName] montent de semaine en semaine. Presque chaque jour, de nouvelles compagnies se constituent pour les produire, et les banques prêtent contre leurs actions sans y regarder à deux fois. Rares sont ceux qui se demandent ce que tout cela vaut réellement.\n\nCertains $capitalists_no_icon$ et $shopkeepers_no_icon$ attribuent leur nouvelle richesse au gouvernement et deviennent [Concept('concept_loyalist','$concept_loyalists|q$')]. Si cela dure, les [Concept('concept_political_movement','$concept_political_movements|q$')] favorables à [GetLawType('law_laissez_faire').GetName] gagneront des soutiens."
 spec_markets.1.d_generic: "À [ROOT.GetCountry.GetCapital.GetCityHubName], les fortunes se font plus vite qu’on ne peut les compter. Les cours montent de semaine en semaine. Presque chaque jour, de nouvelles compagnies se constituent, et les banques prêtent contre leurs actions sans y regarder à deux fois. Rares sont ceux qui se demandent ce que tout cela vaut réellement.\n\nCertains $capitalists_no_icon$ et $shopkeepers_no_icon$ attribuent leur nouvelle richesse au gouvernement et deviennent [Concept('concept_loyalist','$concept_loyalists|q$')]. Si cela dure, les [Concept('concept_political_movement','$concept_political_movements|q$')] favorables à [GetLawType('law_laissez_faire').GetName] gagneront des soutiens."
 spec_markets.1.f: "« Achetez, mon garçon, et ne regardez pas au prix. Quoi que vous payiez aujourd’hui, un autre paiera davantage demain. »"
 spec_markets.1.a: "La prospérité parle d’elle-même."
 spec_markets.1.b: "Prêchons la modération."
 spec_markets.1.b.tt: "La [concept_spec_market_confidence] baisse de #v 10#!"
 spec_markets.1.c: "Que les spéculateurs paient leur part."
 spec_markets.1.c.tt: "La [concept_spec_market_confidence] baisse de #v 5#!"
 spec_markets.2.t: "Panique financière"
 spec_markets.2.d_crash: "La fin de l’essor de [ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName], le plus important des essors terminés, s’est muée en panique générale. Les maisons qui avaient prêté sur son prix font faillite les unes après les autres, et les déposants font la queue devant les banques de [ROOT.GetCountry.GetCapital.GetCityHubName] depuis l’aube. Les banques rappellent #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#! de prêts, et les investisseurs s’accrochent au peu qui leur reste. La [concept_private_construction] sera réduite de moitié pendant #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! mois.\n\nRuinés, des $capitalists_no_icon$, des $aristocrats_no_icon$ et des $shopkeepers_no_icon$ accusent le gouvernement, et certains deviennent [Concept('concept_radical','$concept_radicals|q$')]. Beaucoup veulent désormais que l’État bride les marchés, et les [Concept('concept_political_movement','$concept_political_movements|q$')] opposés à [GetLawType('law_laissez_faire').GetName] gagnent des soutiens.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_crash_no_loans: "La fin de l’essor de [ROOT.GetCountry.MakeScope.Var('spec_crashed').GetGoods.GetName], le plus important des essors terminés, s’est muée en panique générale. Les maisons qui avaient prêté sur son prix font faillite les unes après les autres, et les déposants font la queue devant les banques de [ROOT.GetCountry.GetCapital.GetCityHubName] depuis l’aube. Les investisseurs s’accrochent au peu qui leur reste. La [concept_private_construction] sera réduite de moitié pendant #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! mois.\n\nRuinés, des $capitalists_no_icon$, des $aristocrats_no_icon$ et des $shopkeepers_no_icon$ accusent le gouvernement, et certains deviennent [Concept('concept_radical','$concept_radicals|q$')]. Beaucoup veulent désormais que l’État bride les marchés, et les [Concept('concept_political_movement','$concept_political_movements|q$')] opposés à [GetLawType('law_laissez_faire').GetName] gagnent des soutiens.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign: "La panique qui frappe [ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName] a gagné nos marchés. Les maisons qui y commerçaient ou y empruntaient tombent l’une après l’autre, et les déposants font la queue devant les banques de [ROOT.GetCountry.GetCapital.GetCityHubName] depuis l’aube. Les banques rappellent #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#! de prêts, et les investisseurs s’accrochent au peu qui leur reste. La [concept_private_construction] sera réduite de moitié pendant #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! mois.\n\nRuinés, des $capitalists_no_icon$, des $aristocrats_no_icon$ et des $shopkeepers_no_icon$ accusent le gouvernement, et certains deviennent [Concept('concept_radical','$concept_radicals|q$')]. Beaucoup veulent désormais que l’État bride les marchés, et les [Concept('concept_political_movement','$concept_political_movements|q$')] opposés à [GetLawType('law_laissez_faire').GetName] gagnent des soutiens.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_foreign_no_loans: "La panique qui frappe [ROOT.GetCountry.MakeScope.Var('spec_foreign_src').GetCountry.GetName] a gagné nos marchés. Les maisons qui y commerçaient ou y empruntaient tombent l’une après l’autre, et les déposants font la queue devant les banques de [ROOT.GetCountry.GetCapital.GetCityHubName] depuis l’aube. Les investisseurs s’accrochent au peu qui leur reste. La [concept_private_construction] sera réduite de moitié pendant #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! mois.\n\nRuinés, des $capitalists_no_icon$, des $aristocrats_no_icon$ et des $shopkeepers_no_icon$ accusent le gouvernement, et certains deviennent [Concept('concept_radical','$concept_radicals|q$')]. Beaucoup veulent désormais que l’État bride les marchés, et les [Concept('concept_political_movement','$concept_political_movements|q$')] opposés à [GetLawType('law_laissez_faire').GetName] gagnent des soutiens.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other: "La confiance s’est évanouie d’un seul coup. Même les maisons solides ne trouvent plus à emprunter, quel qu’en soit le prix, et les déposants font la queue devant les banques de [ROOT.GetCountry.GetCapital.GetCityHubName] depuis l’aube. Les banques rappellent #v @money![ROOT.GetCountry.MakeScope.Var('spec_clawed').GetValue|D]#! de prêts, et les investisseurs s’accrochent au peu qui leur reste. La [concept_private_construction] sera réduite de moitié pendant #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! mois.\n\nRuinés, des $capitalists_no_icon$, des $aristocrats_no_icon$ et des $shopkeepers_no_icon$ accusent le gouvernement, et certains deviennent [Concept('concept_radical','$concept_radicals|q$')]. Beaucoup veulent désormais que l’État bride les marchés, et les [Concept('concept_political_movement','$concept_political_movements|q$')] opposés à [GetLawType('law_laissez_faire').GetName] gagnent des soutiens.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.d_other_no_loans: "La confiance s’est évanouie d’un seul coup. Même les maisons solides ne trouvent plus à emprunter, quel qu’en soit le prix, et les déposants font la queue devant les banques de [ROOT.GetCountry.GetCapital.GetCityHubName] depuis l’aube. Les investisseurs s’accrochent au peu qui leur reste. La [concept_private_construction] sera réduite de moitié pendant #v [ROOT.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! mois.\n\nRuinés, des $capitalists_no_icon$, des $aristocrats_no_icon$ et des $shopkeepers_no_icon$ accusent le gouvernement, et certains deviennent [Concept('concept_radical','$concept_radicals|q$')]. Beaucoup veulent désormais que l’État bride les marchés, et les [Concept('concept_political_movement','$concept_political_movements|q$')] opposés à [GetLawType('law_laissez_faire').GetName] gagnent des soutiens.[AddLocalizationIf(ROOT.GetCountry.MakeScope.Var('spec_pledge_unmet').IsSet, 'SPEC_PLEDGE_UNMET')]"
 spec_markets.2.bad_debts: "Les prêts de l’essor ont mal tourné. Au cours des prochains mois, les [concept_spec_bad_debts] réduiront la [concept_throughput] de #N [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_tp_full_pct')|1] %#!, puis s’atténueront et seront résorbées dans #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_crunch_months')|0]#! mois. Les banques ne prêteront rien d’ici là, et #v Prêter aux banques#! ne les effacera pas."
 spec_markets.2.d_crash_bad: "$spec_markets.2.d_crash$\n\n$spec_markets.2.bad_debts$"
 spec_markets.2.d_crash_no_loans_bad: "$spec_markets.2.d_crash_no_loans$\n\n$spec_markets.2.bad_debts$"
