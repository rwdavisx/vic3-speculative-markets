 SPEC_EXCH_G_TRUST_TT: "#header Réputation#!\n$TOOLTIP_DELIMITER$\nChaque mois : #P progresse#! sans [concept_spec_financial_panic] tant que les critères de prêt sont #v Sains#! ou plus stricts, stagne tant qu’ils sont #v Laxistes#!, #N recule#! tant qu’ils sont #v Imprudents#!\nFin d’essor dans un bien principal : [concept_spec_correction] #P un peu#!, [concept_spec_bust] ou [concept_spec_collapse] #N beaucoup#!\n[concept_spec_financial_panic] : #N -20 %#! à #N -50 %#! de la réputation à son début, davantage avec un [concept_spec_leverage] plus élevé, moitié moins si elle est déclenchée par une [concept_spec_foreign_panic] ou sous la promesse ; encore #N réduite de moitié#! si elle suit son cours sans sauvetage bancaire\n[concept_spec_bad_debts] : #N recule#! chaque mois, et le rang ne peut pas monter\nUne nouvelle Bourse démarre à #v 50 %#!"
