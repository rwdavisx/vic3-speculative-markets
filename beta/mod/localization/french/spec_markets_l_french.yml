 spec_panic_movements: "Méfiance envers les marchés"
 spec_panic_movements_desc: "Après la panique, beaucoup veulent que l’État bride les marchés. Les [Concept('concept_political_movement','$concept_political_movements|q$')] opposés à la politique [GetLawType('law_laissez_faire').GetName] gagnent des soutiens. Cet effet s’estompe avec le temps."
 spec_mania_movements: "Foi dans les marchés"
 spec_mania_movements_desc: "Un long essor a convaincu beaucoup de personnes qu’il vaut mieux laisser les marchés agir seuls. Les [Concept('concept_political_movement','$concept_political_movements|q$')] favorables à la politique [GetLawType('law_laissez_faire').GetName] gagnent des soutiens. Cet effet s’estompe avec le temps."
 SPEC_DRIVER_DEBT: "Dette publique"
 SPEC_DRIVER_DEBT_TT: "#header Dette publique : [GetPlayer.MakeScope.Var('spec_c_debt').GetValue|+=2]#!\n$TOOLTIP_DELIMITER$\n[concept_credit] utilisé : #v [GetPlayer.MakeScope.ScriptValue('spec_debt_share')|%0]#! ([concept_principal])\nLes investisseurs acceptent jusqu’à #v 50 %#!\n$TOOLTIP_DELIMITER$\nChaque tranche de #v 10 %#! au-delà fait baisser la [concept_spec_market_confidence] de #v 0.2#! par mois, jusqu’à #N -1#!."
