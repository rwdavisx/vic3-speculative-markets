 concept_spec_intervention: "Intervention"
 concept_spec_intervention_desc: "Une $concept_spec_intervention$ permet au gouvernement de #v Freiner la spéculation#! sur un [concept_good] ou d’y #v Encourager l’investissement#!.\n\n#v Freiner la spéculation#! : l’[concept_spec_investor_interest] retombe à #v Calme#!, producteurs #N -10 %#! de [concept_throughput], et un prélèvement de #v 10 %#! de la production hebdomadaire au prix de base\n#v Encourager l’investissement#! : l’intérêt monte à #v Vif#!, producteurs #P +10 %#! de [concept_throughput], et une subvention de #v 20 %#!\n\nChaque mesure coûte de l’[concept_authority] chaque mois jusqu’à sa levée, davantage pour les biens essentiels et ceux qui représentent une grande part des échanges du [concept_market]."
 SPEC_LEVER_ISSUE_TT: "#header Lancer une grande émission sur [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\nPendant #v 2#! ans :\nScore ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]) : #P +25 %#!\nLes prêts bancaires dans ce bien comptent #N x1,5#! quand son essor prend fin\nRéputation gagnée ou perdue quand son essor prend fin : #v x2#!\n$TOOLTIP_DELIMITER$\nNécessite un rang National ou supérieur, un [concept_spec_investor_interest] #v Avide#! ou plus et aucune [concept_spec_intervention]. Une seule grande émission à la fois ; la suivante peut être lancée #v 1#! an après la fin de celle-ci.[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_issue_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_ISSUE_ON', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_issue').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_ISSUE_ON: "\n\nUne émission est en cours sur ce [concept_good]"
