 SPEC_RIVAL_RULE: "Chaque année, la Bourse au score ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]) le plus élevé gagne #P 5 %#! de réputation et l’autre en perd #N 5 %#!, ou #N 7.5 %#! si les deux pays sont en mauvais termes ou pire (avant les effets sur les pertes de réputation). Cela vaut pour les deux, quelle que soit celle qui a désigné l’autre.\nPeut être désigné : un marché de notre rang ou du rang supérieur, dont le score est au moins égal au nôtre. Un Centre mondial ne désigne pas de rivale.\nLors d’une [concept_spec_financial_panic], les capitaux en fuite vont d’abord vers la rivale.\nUne alliance, un pacte défensif ou des droits d’investissement entre les deux mettent fin à la rivalité."
