 spec_inquiry_no_panic_tt: "Aucune [concept_spec_financial_panic] n’est en cours"
 spec_inquiry_reform_tt: "Notre technologie permet une [Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')] pas encore adoptée"
 spec_suspend_panic_tt: "Une [concept_spec_financial_panic] est en cours"
 spec_suspend_note_tt: "Les règles d’émission des billets suivent l’école monétaire"
 spec_inquiry_when_tt: "Une [concept_spec_financial_panic] s’est terminée au cours de l’année écoulée et aucune commission n’a siégé depuis, ou #v 10#! ans se sont écoulés sans panique (encore #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_calm_left')|0]#! mois)"
 spec_convert_conf_tt: "La [concept_spec_market_confidence] atteint au moins #v 60#!"
 spec_convert_debt_tt: "Notre dette atteint au moins #v 20 %#! de notre limite de [concept_credit]"
 spec_convert_cd_tt: "La dette n’a pas été convertie au cours des #v 10#! dernières années"
 spec_convert_conf_cost_tt: "La [concept_spec_market_confidence] baisse de #v 5#!"
 spec_relief_when_tt: "Une [concept_spec_financial_panic] ou la [concept_spec_long_depression] est en cours"
 spec_relief_cd_tt: "Aucun chantier de secours au cours des #v 12#! derniers mois"
 spec_suspend_tt: "La [concept_spec_financial_panic] prend fin d’ici #v 2#! mois, avec tous ses effets jusque-là\nLa [concept_spec_market_confidence] augmente de #v 15#!\nPendant #v 10#! ans, l’[concept_spec_speculative_excess] s’accumule #v 50 %#! plus vite\nLes [concept_spec_lending_standards] s’assouplissent, comme après un sauvetage bancaire"
 spec_suspend_act: "Suspendre la loi bancaire"
 spec_suspend_act_desc: "Autoriser la banque à prêter au-delà de la limite que la loi fixe à ses billets. La panique s’apaise en quelques mois sans frais pour le Trésor, mais les investisseurs apprennent que le gouvernement interviendra toujours. Compte comme #v Prêter aux banques#! pour cette panique.\n\n#lore La Grande-Bretagne a suspendu son Bank Charter Act en 1847, 1857 et 1866.#!"
 spec_relief_works_button: "Chantiers de secours"
 spec_relief_works_button_desc: "Financez des travaux publics et des secours pendant la crise : des aides sociales, plus de construction et moins de radicaux pendant #v 12#! mois, pour un coût hebdomadaire qui augmente avec notre [concept_gdp]."
 spec_convert_debt: "Convertir la dette nationale"
 spec_convert_debt_desc: "Profitons de l’optimisme des investisseurs pour remplacer nos emprunts par de nouveaux à un taux plus bas. Les rentiers qui vivaient des anciens intérêts ne nous en sauront pas gré."
 spec_inquiry: "Commission d’enquête"
 spec_inquiry_desc: "Nommez une commission chargée d’entendre banquiers, courtiers et déposants ruinés, et de proposer des règles pour nos banques et nos compagnies. Son rapport adopte une [Concept('concept_spec_banking_reforms','$concept_spec_banking_reform|q$')] permise par notre technologie. Ses séances mobilisent l’attention du gouvernement pendant #v 6#! mois."
 spec_debt_converted: "Dette convertie"
 spec_debt_converted_desc: "Emprunts convertis à un taux plus bas alors que les investisseurs étaient empressés de prêter"
 spec_relief_works: "Chantiers de secours"
 spec_relief_works_desc: "Travaux publics et secours pour ceux que la crise a privés d’emploi"
 spec_relief_costs: "Coût des chantiers de secours"
 spec_relief_costs_desc: "Coût des chantiers de secours"
 spec_act_suspended: "Loi bancaire suspendue"
 spec_act_suspended_desc: "Le gouvernement a écarté sa propre loi pour mettre fin à une panique"
 spec_inquiry_sitting: "Commission d’enquête"
 spec_inquiry_sitting_desc: "Une commission recueille des témoignages sur la dernière panique"
 spec_sound_finance: "Finances saines"
 spec_sound_finance_desc: "Monnaie, banques et compagnies régies par des règles qui inspirent confiance aux investisseurs"
 spec_rentiers_cut: "Revenus des rentiers réduits"
 spec_relief_thanks: "Chantiers de secours"
 spec_dear_money: "Argent cher"
 spec_free_issue: "Liberté bancaire"
 spec_disclosure_burden: "Règles de transparence"
 spec_disclosure_welcomed: "Règles de transparence"
 spec_reform_currency_tt: "Les banques prêtent #v 25 %#! de moins, l’[concept_spec_speculative_excess] s’accumule #v 25 %#! plus lentement et les [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')] durent #v 25 %#! plus longtemps\nPermet de suspendre la loi bancaire pendant une panique"
 spec_reform_free_tt: "Les banques prêtent #v 25 %#! de plus, les essors sont #v 10 %#! plus forts et leur fin coûte #v 10 %#! de [concept_spec_market_confidence] en plus"
 spec_reform_llr_tt: "#v Prêter aux banques#! coûte #v 50 %#! de moins et met fin à la panique un mois plus tôt"
 spec_reform_company_tt: "Les fins d’essor coûtent #v 30 %#! de [concept_spec_market_confidence] en moins"
 spec_reform.1.t: "Commission d’enquête"
 spec_reform.1.d_panic: "La commission nommée après la panique a remis son rapport : trois volumes de témoignages de banquiers, de courtiers et de déposants ruinés. Ses membres conviennent que la panique n’était pas un fléau du ciel. Sur presque tout le reste, ils sont en désaccord, et chaque remède a ses défenseurs à la chambre."
 spec_reform.1.d_calm: "Les marchés étant calmes, une commission a passé l’année à entendre banquiers, courtiers et économistes sur les moyens d’empêcher le prochain essor de finir en ruine. Son rapport propose plusieurs remèdes, chacun défendu par ses partisans à la chambre."
 spec_reform.1.f: "« Dans les périodes de vive alarme, une faillite en entraîne beaucoup d’autres ; le meilleur moyen de prévenir celles qui en découlent est d’arrêter la première, qui en est la cause. »"
 spec_reform.1.a: "Lions l’émission des billets à l’or des coffres."
 spec_reform.1.b: "Que toute banque saine émette ses propres billets."
 spec_reform.1.c: "Désignons un prêteur en dernier ressort."
 spec_reform.1.d: "Obligeons les compagnies à publier leurs comptes."
 spec_reform.1.e: "Remercions la commission pour ses travaux."
 spec_reform.2.t: "Finances saines"
 spec_reform.2.d: "Nos banques émettent leurs billets selon des règles, un prêteur se tient prêt lorsque la panique frappe, et nos compagnies doivent montrer aux investisseurs ce qu’elles possèdent et ce qu’elles doivent. À l’étranger, nos obligations se vendent désormais au-dessus du pair, et l’on cite [ROOT.GetCountry.GetCapital.GetCityHubName] comme un havre sûr pour les capitaux."
 spec_reform.2.f: "« Le premier devoir d’un banquier n’est pas de gagner de l’argent, mais de le garder. »"
 spec_reform.2.a: "La confiance est le fondement du crédit."
 SPEC_OFF: "Les investisseurs ne spéculent pas avec notre $ECONOMIC_SYSTEM_GC_LINK$ actuel."
