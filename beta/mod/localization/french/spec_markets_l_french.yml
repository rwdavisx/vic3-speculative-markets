 spec_lever_authority_tt: "L’[concept_authority] disponible est suffisante"
 spec_lever_fits_restrain_tt: "L’[concept_spec_investor_interest] atteint le niveau #v Avide#! ou plus, ou la fin de son essor coûterait au moins #v 2#! de [concept_spec_market_confidence]"
 spec_lever_fits_encourage_tt: "L’[concept_spec_investor_interest] est inférieur au niveau #v Vif#!, le [concept_good] n’est pas en reprise après un essor et aucun de ses essors ne risque de se terminer par une [concept_spec_bust] ou un [concept_spec_collapse]"
 SPEC_LEVER_RESTRAIN_TT: "#header Freiner la spéculation sur [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_investor_interest] : retombe à #v Calme#! en quelques mois\n[concept_authority] : #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#! par mois#indent_newline:3 \n#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! en raison de la valeur de base (la moitié d’une taxe de consommation sur ce bien)\n#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! en raison de la part des échanges (#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! de notre marché)#!\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_DOWN', 'SPEC_LEVER_NONE')][concept_budget_additional_income] : #P @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_levy_', Goods.GetKey))|D]#! par semaine, un prélèvement de 10 % de notre production hebdomadaire au prix de base\n\nTant qu’il est freiné, son essor ne peut ni croître ni prendre fin d’un coup. Il se résorbe en une [concept_spec_correction] sur environ un an, ce qui coûte un peu de [concept_spec_market_confidence] chaque mois.\n\n#lore Comme le Bubble Act de 1720, qui restreignit la création de sociétés par actions après la bulle des mers du Sud.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_restrain_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_restrain').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
 SPEC_LEVER_ENCOURAGE_TT: "#header Encourager l’investissement dans [Goods.GetName]#!\n$TOOLTIP_DELIMITER$\n[concept_spec_investor_interest] : monte à #v Vif#! en quelques mois\n[concept_authority] : #N -[Country.MakeScope.ScriptValue(Concatenate('spec_lever_cost_', Goods.GetKey))|0]#! par mois#indent_newline:3 \n#v [Country.MakeScope.ScriptValue(Concatenate('spec_lever_base_', Goods.GetKey))|0]#! en raison de la valeur de base (la moitié d’une taxe de consommation sur ce bien)\n#v x[Add_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_weight_', Goods.GetKey)), '(CFixedPoint)0.5'), '(CFixedPoint)0.5')|%0]#! en raison de la part des échanges (#v [Divide_CFixedPoint(Country.MakeScope.ScriptValue(Concatenate('spec_mv_', Goods.GetKey)), Max_CFixedPoint(Country.MakeScope.Var('spec_mv_total').GetValueWithDefault('(CFixedPoint)1'), '(CFixedPoint)1'))|%1]#! de notre marché)#!\n[SelectLocalization(And(Country.IsLocalPlayer, GetScriptedGui('spec_sgui_lever_producers').IsValid(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)), 'SPEC_LEVER_TP_UP', 'SPEC_LEVER_NONE')][concept_budget_additional_expenses] : #N @money![Country.MakeScope.ScriptValue(Concatenate('spec_lever_subsidy_', Goods.GetKey))|D]#! par semaine, une subvention de 20 % de notre production hebdomadaire au prix de base\n\nSe lève d’elle-même quand le [concept_good] devient #v Avide#!, de sorte que son essor peut prendre fin seul.\n\n#lore Comme les rendements garantis qu’offrirent l’Inde britannique et la France aux investisseurs ferroviaires au milieu du XIXe siècle.#![SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_encourage_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_LEVER_LIFT', 'SPEC_LEVER_NONE')]\n\n[GetScriptedGui('spec_sgui_encourage').IsValidTooltip(GuiScope.SetRoot(Country.MakeScope).AddScope('spec_good', Goods.MakeScope).End)]"
