 concept_spec_long_depression: "Longue dépression"
 concept_spec_long_depression_desc: "La $concept_spec_long_depression$ est une crise économique mondiale. Elle débute lorsqu’une [concept_great_power] sombre dans une [concept_spec_financial_panic], touche tous les pays alors en proie à la panique et se propage par les liens étroits : [concept_market] commun, sujets et suzerains, droits d’investissement, échanges importants et propriété étrangère.\n\nKrach mondial (#v 4#! mois) : le crédit gèle et la [concept_spec_market_confidence] s’effrite\nDépression (jusqu’à #v 5#! ans) : l’investissement, la construction et le commerce ralentissent, et certains pops deviennent [Concept('concept_radical','$concept_radicals|q$')]\nReprise (#v 1#! an) : la [concept_spec_market_confidence] revient\n\nLes choix de chaque gouvernement accélèrent sa propre reprise et celle du monde, ceux d’une [concept_great_power] plus que tout autre."
