 SPEC_RISK_SLIGHT: "#header Risque : $SPEC_UNWIND$#!\nEffet sur la [concept_spec_market_confidence] à la fin de l’essor : #v léger#!\n$TOOLTIP_DELIMITER$\n$SPEC_UNWIND_DESC$"
 SPEC_RISK_GLUT: "#header Reprise#!\n$TOOLTIP_DELIMITER$\nLa reprise qui suit le dernier essor concerne [Goods.GetName]. Les investisseurs se retirent, maintenant l’[concept_spec_investor_interest] au niveau #v Hésitant#! pendant quelque temps."
 SPEC_RISK_CALM: "#header Aucun essor#!\n$TOOLTIP_DELIMITER$\nAucun essor récent ne concerne [Goods.GetName]. Dès que l’[concept_spec_investor_interest] atteint le niveau #v Vif#! ou plus, un retour au niveau #v Hésitant#! met fin à l’essor. Plus il est monté haut, plus sa chute est rude."
 SPEC_UNWIND_3: "Effondrement"
 SPEC_UNWIND_C_3: "[concept_spec_collapse]"
 SPEC_UNWIND_DESC_3: "Ce [concept_good] a connu un essor qui a atteint le niveau #v Fiévreux#!. Si la tendance de ses prix passe sous #v [Divide_CFixedPoint('(CFixedPoint)-4.988', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!, l’[concept_spec_investor_interest] devient #v Fuyant#! et l’essor se termine par un [concept_spec_collapse]. Les investisseurs se retirent alors pendant #v 12#! mois. Le risque s’estompe à mesure que l’essor vieillit."
 SPEC_UNWIND_2: "Débâcle"
 SPEC_UNWIND_C_2: "[concept_spec_bust]"
 SPEC_UNWIND_DESC_2: "Ce [concept_good] a connu un essor qui a atteint le niveau #v Avide#!. Si la tendance de ses prix passe sous #v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!, l’[concept_spec_investor_interest] devient #v Hésitant#! et l’essor se termine par une [concept_spec_bust]. Les investisseurs se retirent alors pendant #v 6#! mois. Le risque s’estompe à mesure que l’essor vieillit."
 SPEC_UNWIND_1: "Correction"
 SPEC_UNWIND_C_1: "[concept_spec_correction]"
 SPEC_UNWIND_DESC_1: "Ce [concept_good] a connu un essor qui a atteint le niveau #v Vif#!. Si la tendance de ses prix passe sous #v [Divide_CFixedPoint('(CFixedPoint)-1.0', Multiply_CFixedPoint('(CFixedPoint)60', Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_hype_mult_down'), '(CFixedPoint)0.01')))|%1]#!, l’[concept_spec_investor_interest] devient #v Hésitant#! et l’essor se termine par une [concept_spec_correction]. Les investisseurs se retirent alors pendant #v 3#! mois. Le risque s’estompe à mesure que l’essor vieillit."
 spec_map_tt: "#header [SCOPE.sCountry('spec_map_owner').GetName]#!\n[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)6'), 'SPEC_MAP_STAGE_6', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)5'), 'SPEC_MAP_STAGE_5', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)4'), 'SPEC_MAP_STAGE_4', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)3'), 'SPEC_MAP_STAGE_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)2'), 'SPEC_MAP_STAGE_2', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(SCOPE.sCountry('spec_map_owner').MakeScope.ScriptValue('spec_stage'), '(CFixedPoint)1'), 'SPEC_MAP_STAGE_1', 'SPEC_MAP_STAGE_0'))))))]\n[concept_spec_market_confidence]: #v [SCOPE.sCountry('spec_map_owner').MakeScope.Var('spec_conf').GetValue|0]#!"
