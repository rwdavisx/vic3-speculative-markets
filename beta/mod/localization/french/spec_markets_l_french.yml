 spec_markets.2.d_other_no_loans_bad: "$spec_markets.2.d_other_no_loans$\n\n$spec_markets.2.bad_debts$"
 spec_markets.2.f: "« Hier, je possédais quarante mille. Ce matin, il me reste mon manteau, et l’on m’en a offert bien peu. »"
 spec_markets.2.a: "Le marché doit trouver seul son plancher."
 spec_markets.2.a.tt: "La [concept_spec_financial_panic] suit son cours jusqu’au bout, sauf si nous choisissons plus tard #v Prêter aux banques#!, ce qui annule aussi cette variation d’[concept_approval] des $ig_industrialists$"
 spec_markets.2.b: "Nous devons soutenir les banques."
 spec_markets.2.b.tt: "La [concept_spec_financial_panic] prend fin dans un délai de #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_months')|0]#! mois et ses effets sont réduits de moitié\nLa [concept_spec_market_confidence] augmente de #v 20#!"
 spec_rescue_cost_tt: "[concept_treasury] : #N -@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_cost')|D]#!, soit environ #v [ROOT.GetCountry.MakeScope.ScriptValue('spec_rescue_share_now')|%1]#! du [concept_gdp]"
 spec_levy_tt: "[concept_treasury] : #P +@money![ROOT.GetCountry.MakeScope.ScriptValue('spec_speculator_tax')|D]#!, soit environ #v 0.25 %#! du [concept_gdp]"
 spec_bank_bailout_tt: "$ig_trade_unions$ et $ig_rural_folk$, [concept_approval] : #N -2#! pendant #v 2.5#! ans"
 spec_markets.2.c: "Les spéculateurs nous ont menés à cette ruine."
