 SPEC_COL_LEVER: "Intervention"
 SPEC_COL_LEVER_TT: "#header Interventions sur le marché#!\n$TOOLTIP_DELIMITER$\nFreiner la spéculation : intérêt maintenu au niveau #v Calme#!, ses producteurs perdent de la [concept_throughput] et paient un prélèvement\nEncourager l’investissement : intérêt au moins au niveau #v Vif#!, ses producteurs gagnent de la [concept_throughput] aux frais de l’État\n\nChaque mesure coûte de l’[concept_authority] chaque mois jusqu’à sa levée, davantage pour les biens essentiels et ceux qui représentent une grande part des échanges du marché. La spéculation peut être freinée sur les biens aux niveaux #v Avide#! et #v Fiévreux#!, ou sur un bien dont la fin de l’essor coûterait #v 2#! de [concept_spec_market_confidence] ou plus. L’investissement peut être encouragé pour les biens en dessous du niveau #v Vif#!."
 SPEC_SEP_FEVERISH_TT: "#header @spec_interest_feverish! [concept_spec_investor_interest] : Fiévreux#!\nPart de nos échanges : #v [Country.MakeScope.Var('spec_heat_6').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] des producteurs : #P +8 %#!\n[concept_spec_market_confidence] : #P augmente#! chaque mois, davantage si la part des échanges est grande, sauf pendant une [concept_spec_financial_panic]\nFin possible : [concept_spec_collapse]"
 SPEC_SEP_EAGER_TT: "#header @spec_interest_eager! [concept_spec_investor_interest] : Avide#!\nPart de nos échanges : #v [Country.MakeScope.Var('spec_heat_5').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] des producteurs : #P +5 %#!\n[concept_spec_market_confidence] : #P augmente#! chaque mois, davantage si la part des échanges est grande, sauf pendant une [concept_spec_financial_panic]\nFin possible : [concept_spec_bust]"
 SPEC_SEP_KEEN_TT: "#header @spec_interest_keen! [concept_spec_investor_interest] : Vif#!\nPart de nos échanges : #v [Country.MakeScope.Var('spec_heat_4').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] des producteurs : #P +3 %#!\nFin possible : [concept_spec_correction]"
 SPEC_SEP_CALM_TT: "#header @spec_interest_calm! [concept_spec_investor_interest] : Calme#!\nPart de nos échanges : #v [Country.MakeScope.Var('spec_heat_3').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\nAucun effet"
 SPEC_SEP_DOUBTFUL_TT: "#header @spec_interest_doubtful! [concept_spec_investor_interest] : Hésitant#!\nPart de nos échanges : #v [Country.MakeScope.Var('spec_heat_2').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] des producteurs : #N -5 %#!\nAprès la fin d’un essor, un bien en reprise reste quelque temps à ce niveau ou en dessous"
 SPEC_SEP_FLEEING_TT: "#header @spec_interest_fleeing! [concept_spec_investor_interest] : Fuyant#!\nPart de nos échanges : #v [Country.MakeScope.Var('spec_heat_1').GetValueWithDefault('(CFixedPoint)0')|%0]#!\n$TOOLTIP_DELIMITER$\n[concept_throughput] des producteurs : #N -10 %#!\nUn essor de niveau #v Fiévreux#! qui tombe aussi bas se termine par un [concept_spec_collapse]"
 SPEC_IB_TURNING_TT: "#header Retournement de l’essor#!\nL’essor qui concernait [Goods.GetName] a fortement reculé. Si l’[concept_spec_investor_interest] continue de baisser, il se terminera par un [concept_spec_collapse], coûtant environ #N [Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! de [concept_spec_market_confidence]."
