 SPEC_TM_REVOLUTION_TT: "#header [concept_revolution] : [Country.MakeScope.Var('spec_tm_revolution').GetValueWithDefault('(CFixedPoint)0')|+=2]#!\n$TOOLTIP_DELIMITER$\n#N -2#! en raison d’une [concept_revolution]"
 concept_spec_market_confidence: "Confiance du marché"
 concept_spec_market_confidence_desc: "La $concept_spec_market_confidence$ mesure le regard des investisseurs sur le [concept_market] d’un [concept_country], de #v 0#! (#v Panique#!) à #v 100#! (#v Frénésie#!). La peur ralentit l’investissement et augmente les intérêts des [concept_loans], tandis que l’avidité accélère l’investissement.\n\nLes [Concept('concept_good','$concept_goods|q$')] en essor l’augmentent ; les [Concept('concept_spec_boom_end','$concept_spec_boom_ends|q$')], les [Concept('concept_spec_foreign_panic','$concept_spec_foreign_panics|q$')], les [Concept('concept_diplomatic_play','$concept_diplomatic_plays|q$')] et la [concept_war] la réduisent. Les essors et leurs fins sont plus forts là où les bâtiments de type $building_financial_district$ pèsent davantage dans l’économie, et plus faibles là où ceux de type $building_manor_house$ sont plus nombreux.\n\nAu-delà de #v 55#!, les banques prêtent au [concept_investment_pool] ; à #v 80#!, le marché entre en [concept_spec_speculative_mania] ; sous #v 25#!, une [concept_spec_financial_panic] éclate."
 concept_spec_speculative_mania: "Frénésie spéculative"
 concept_spec_speculative_mania_desc: "Un [concept_market] connaît une $concept_spec_speculative_mania$ tant que la [concept_spec_market_confidence] atteint au moins #v 80#!. Les banques prêtent alors le plus au [concept_investment_pool], mais une [concept_spec_boom_end] coûte davantage de $concept_spec_market_confidence$. Une frénésie longue ou très intense apporte pendant quelques années davantage de soutiens aux [Concept('concept_political_movement','$concept_political_movements|q$')] favorables à la politique [GetLawType('law_laissez_faire').GetName]."
 concept_spec_financial_panic: "Panique financière"
 concept_spec_financial_panics: "Paniques financières"
 concept_spec_financial_panic_desc: "Une $concept_spec_financial_panic$ éclate lorsque la [concept_spec_market_confidence] passe sous son seuil de panique de #v 25#!. Au-delà de #v 3#! mois de [concept_spec_leverage], ce seuil s’élève, jusqu’à #v 65#!. Avec peu de bâtiments de type $building_financial_district$, il est plus bas, jusqu’à #v 20#!.\n\nElle réduit la [concept_throughput] de chaque bâtiment et les impôts perçus, coûte chaque semaine au [concept_treasury] des secours aux chômeurs jusqu’à sa fin, ralentit la [concept_private_construction] et l’investissement, réduit le bonus de [concept_throughput] des [Concept('concept_company','$concept_companies|q$')], transforme certains investisseurs en [Concept('concept_radical','$concept_radicals|q$')] et pousse les banques à retirer l’[concept_spec_outstanding_credit] du [concept_investment_pool].\n\nChaque [concept_country] lié subit une [concept_spec_foreign_panic], tandis que les capitaux cherchent refuge auprès des [Concept('concept_great_power','$concept_great_powers|q$')] épargnées ailleurs. Pendant quelques années, les [Concept('concept_political_movement','$concept_political_movements|q$')] opposés à [GetLawType('law_laissez_faire').GetName] gagnent des soutiens."
 concept_spec_foreign_panic: "Panique étrangère"
 concept_spec_foreign_panics: "Paniques étrangères"
 concept_spec_foreign_panic_desc: "Une $concept_spec_foreign_panic$ réduit la [concept_spec_market_confidence] d’un [concept_country] lorsqu’une [concept_spec_financial_panic] éclate dans un pays qui lui est lié par un [concept_market] commun, un rapport de sujétion, des droits d’investissement, des échanges importants ou la propriété de son économie. Plus les liens sont étroits, plus les pertes sont lourdes. La politique [GetLawType('law_free_trade').GetName] renforce les liens commerciaux, tandis que les autres politiques commerciales les affaiblissent. Un [concept_embargo] rompt le lien commercial."
 concept_spec_boom_end: "Fin d’essor"
 concept_spec_boom_ends: "Fins d’essor"
 concept_spec_boom_end_desc: "Un essor prend fin lorsque l’[concept_spec_investor_interest] pour un [concept_good] retombe après une hausse. Plus il est monté haut, plus sa chute est rude : un essor ayant culminé au niveau #v Vif#! se termine par une [concept_spec_correction], au niveau #v Avide#! par une [concept_spec_bust] et au niveau #v Fiévreux#! par un [concept_spec_collapse].\n\nChaque fin réduit la [concept_spec_market_confidence], davantage pour les grands essors et pour les [Concept('concept_good','$concept_goods|q$')] représentant une plus grande part des échanges du [concept_market]. Les investisseurs se retirent ensuite pendant la reprise du $concept_good$ et, lorsqu’une [concept_company] le produit, son secteur perd de la [concept_throughput]. Le pic de référence s’estompe un peu chaque mois : un essor qui se tempère lentement se termine plus en douceur, voire sans aucune $concept_spec_boom_end$."
 concept_spec_correction: "Correction"
 concept_spec_correction_desc: "Une $concept_spec_correction$ est la [concept_spec_boom_end] la plus modérée. Elle survient lorsque l’[concept_spec_investor_interest] pour un [concept_good], après avoir culminé au niveau #v Vif#!, retombe au niveau #v Hésitant#!.\n\nElle réduit légèrement la [concept_spec_market_confidence]. Les investisseurs se détournent alors du $concept_good$ pendant #v 3#! mois et, lorsqu’une [concept_company] le produit, son secteur perd #N 2.5 %#! de [concept_throughput] pendant #v 90#! jours, et #N 25 %#! de plus pour chacune des technologies [GetTechnology('corporate_charters').GetName] et [GetTechnology('corporate_management').GetName] recherchées."
 concept_spec_bust: "Débâcle"
 concept_spec_bust_desc: "Une $concept_spec_bust$ est une [concept_spec_boom_end] plus rude qu’une [concept_spec_correction]. Elle survient lorsque l’[concept_spec_investor_interest] pour un [concept_good], après avoir culminé au niveau #v Avide#!, retombe au niveau #v Hésitant#!.\n\nElle réduit davantage la [concept_spec_market_confidence], environ #v 2#! fois plus qu’une [concept_spec_correction] pour un même essor. Les investisseurs se détournent alors du $concept_good$ pendant #v 6#! mois et, lorsqu’une [concept_company] le produit, son secteur perd #N 5 %#! de [concept_throughput] pendant #v 180#! jours, et #N 25 %#! de plus pour chacune des technologies [GetTechnology('corporate_charters').GetName] et [GetTechnology('corporate_management').GetName] recherchées."
 concept_spec_collapse: "Effondrement"
 concept_spec_collapse_desc: "Un $concept_spec_collapse$ est la pire [concept_spec_boom_end]. Il survient lorsque l’[concept_spec_investor_interest] pour un [concept_good], après avoir culminé au niveau #v Fiévreux#!, tombe jusqu’au niveau #v Fuyant#!.\n\nIl réduit fortement la [concept_spec_market_confidence], environ #v 5#! fois plus qu’une [concept_spec_correction] pour un même essor. Les investisseurs se détournent alors du $concept_good$ pendant #v 12#! mois et, lorsqu’une [concept_company] le produit, son secteur perd #N 10 %#! de [concept_throughput] pendant un an, et #N 25 %#! de plus pour chacune des technologies [GetTechnology('corporate_charters').GetName] et [GetTechnology('corporate_management').GetName] recherchées. Un $concept_spec_collapse$ touchant une grande part des échanges du [concept_market] peut le faire basculer dans une [concept_spec_financial_panic]."
 concept_spec_investor_interest: "Intérêt des investisseurs"
 concept_spec_investor_interest_desc: "L’$concept_spec_investor_interest$ mesure l’attrait qu’exercent sur les investisseurs les [Concept('concept_building','$concept_buildings|q$')] produisant un [concept_good]. Il augmente tant que le [concept_market_price] dépasse sa moyenne à long terme et baisse tant qu’il lui est inférieur, de #v Fuyant#! à #v Fiévreux#!.\n\nLa [concept_throughput] de ces bâtiments suit cet intérêt, de #N -10 %#! au niveau #v Fuyant#! à #P +8 %#! au niveau #v Fiévreux#!, de même que la [concept_prosperity] des [Concept('concept_company','$concept_companies|q$')] produisant le $concept_good$. Un $concept_good$ en essor augmente la [concept_spec_market_confidence]. Quand l’intérêt retombe, l’essor se termine par une [concept_spec_boom_end]."
 concept_spec_credit_policy: "Politique de crédit"
 concept_spec_credit_policy_tight: "Crédit restreint"
 concept_spec_credit_policy_normal: "Crédit normal"
 concept_spec_credit_policy_loose: "Crédit souple"
 concept_spec_credit_policy_desc: "La $concept_spec_credit_policy$ détermine la facilité avec laquelle les banques prêtent au [concept_investment_pool]. Elle nécessite [GetTechnology('central_banking').GetName] et peut être : $concept_spec_credit_policy_tight$, $concept_spec_credit_policy_normal$ ou $concept_spec_credit_policy_loose$. Un crédit plus restreint ralentit l’investissement et fait baisser la [concept_spec_market_confidence] quand elle est élevée, tandis qu’un crédit plus souple accroît l’[concept_spec_outstanding_credit]. La modifier la verrouille pendant #v 6#! mois."
 concept_spec_leverage: "Levier du crédit"
 concept_spec_leverage_desc: "Le $concept_spec_leverage$ correspond à l’[concept_spec_outstanding_credit] d’un [concept_country], exprimé en mois de revenus du [concept_investment_pool].\n\nChaque mois entier accorde #P +2 %#! de [concept_throughput], jusqu’à #P +24 %#!. Pendant une [concept_spec_financial_panic] ou tant que des [concept_spec_bad_debts] subsistent, il diminue de #N 2 %#! par mois. Au-delà de #v 3#! mois, une [concept_spec_financial_panic] éclate à un niveau de [concept_spec_market_confidence] plus élevé et laisse des [concept_spec_bad_debts]."
 concept_spec_bad_debts: "Créances douteuses"
 concept_spec_bad_debts_desc: "Les $concept_spec_bad_debts$ sont les pertes laissées par une [concept_spec_financial_panic] et augmentent avec le [concept_spec_leverage] au-delà de #v 3#! mois.\n\nChaque point réduit la [concept_throughput] de #N 0.4 %#! et l’investissement de #N 0.75 %#!. Elles s’installent à raison de #v 3#! points par mois, puis reculent de #v 0.6#! points par mois et mettent environ #v 6#! ans à se résorber au pire. Les banques ne prêtent pas tant qu’elles subsistent. #v Prêter aux banques#! ne les efface pas. #v Racheter les créances douteuses#! les réduit de moitié, une seule fois tant qu’elles durent."
 concept_spec_lending_standards: "Critères de prêt"
 concept_spec_lending_standards_desc: "Les $concept_spec_lending_standards$ indiquent avec quelle prudence les banques d’un [concept_country] prêtent : #v Stricts#!, #v Prudents#!, #v Sains#!, #v Laxistes#! ou #v Imprudents#!. Des banques plus laxistes prêtent davantage au [concept_investment_pool] et en placent une plus grande part dans les essors, dont la fin est alors plus rude, et un sauvetage bancaire coûte plus cher.\n\nIls s’assouplissent un peu chaque mois sans [concept_spec_financial_panic], passant de #v Stricts#! à #v Imprudents#! en environ #v 20#! années calmes, et davantage après chaque sauvetage bancaire ou chaque recours à #v Racheter les créances douteuses#!. Ils se resserrent quand un essor prend fin, et surtout quand une $concept_spec_financial_panic$ suit son cours sans sauvetage bancaire."
 concept_spec_outstanding_credit: "Encours de crédit"
 concept_spec_outstanding_credit_desc: "L’$concept_spec_outstanding_credit$ est le crédit que les banques ont accordé au [concept_investment_pool] et qui n’a pas encore été remboursé. Les banques prêtent tant que la [concept_spec_market_confidence] dépasse #v 55#!, jusqu’à un plafond de crédit de #v 3#! mois de revenus du fonds. [GetTechnology('central_banking').GetName] ajoute #v 5#! mois, et [GetTechnology('investment_banks').GetName] et [GetTechnology('international_exchange_standards').GetName] ajoutent #v 2#! mois chacun.\n\nChaque mois, #v 2 %#! en est remboursé par le fonds. Lorsqu’une [concept_spec_financial_panic] éclate, une partie est retirée.\n\n#lore Les banques ont prêté sur des actions ferroviaires dans les années 1840, sur le coton en 1837 et sur des terrains à bâtir à Vienne en 1873, et ont été prises au piège quand ces essors ont éclaté.#!"
