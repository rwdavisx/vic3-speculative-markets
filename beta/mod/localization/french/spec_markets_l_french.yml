 notification_spec_ld_started_desc: "Les [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')] se sont propagées à toute l’économie mondiale. Le krach mondial a commencé et touchera toute économie étroitement liée à celles déjà prises dans la tourmente. La [concept_spec_long_depression] suivra."
 notification_spec_ld_started_tooltip: "#header $notification_spec_ld_started_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_ld_started_desc$"
 notification_spec_ld_deepens_name: "Le krach s’aggrave"
 notification_spec_ld_deepens_desc: "Le krach mondial s’est mué en [concept_spec_long_depression]. L’investissement, la construction et le commerce resteront faibles jusqu’au rétablissement du monde."
 notification_spec_ld_deepens_tooltip: "#header $notification_spec_ld_deepens_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_ld_deepens_desc$"
 notification_spec_ld_lifts_name: "La dépression se dissipe"
 notification_spec_ld_lifts_desc: "Le monde s’est remis de la [concept_spec_long_depression]. La [concept_spec_market_confidence] se rétablit au cours de l’année à venir."
 notification_spec_ld_lifts_tooltip: "#header $notification_spec_ld_lifts_name$#!\n$TOOLTIP_DELIMITER$\n$notification_spec_ld_lifts_desc$"
