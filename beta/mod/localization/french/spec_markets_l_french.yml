 concept_spec_exchange: "Bourse"
 concept_spec_exchange_desc: "La $concept_spec_exchange$ d’un [concept_country] est le lieu où s’échangent ses actions, ses obligations et son crédit. Son rang suit son score ([Concept('concept_spec_financial_centre','$concept_spec_exchange|q$')]) : #v Provinciale#!, #v Nationale#!, #v Internationale#! (nécessite [GetTechnology('stock_exchange').GetName]) ou #v Centre mondial#! (nécessite [GetTechnology('central_banking').GetName]). Un rang plus élevé accroît la réaction des investisseurs à la hausse des prix et, à partir du rang #v Internationale#!, la Bourse reçoit la [concept_spec_capital_flight].\n\nL’État accorde une charte à sa Bourse : #v Bourse de commerce#!, #v Marché monétaire#! ou #v Bourse des valeurs#!. Une Bourse détient de #v 1#! à #v 4#! spécialités parmi les #v 7#! voies de la renommée, davantage à mesure que son rang s’élève, et conserve chacune au moins #v 5#! ans.\n\nLa réputation progresse pendant les années calmes avec des prêts prudents, et recule avec les [Concept('concept_spec_financial_panic','$concept_spec_financial_panics|q$')], les [concept_spec_bad_debts] et une [concept_spec_bust] ou un [concept_spec_collapse] dans un bien principal. Une faible réputation augmente le taux d’intérêt des [concept_loans], et une forte réputation le réduit."
