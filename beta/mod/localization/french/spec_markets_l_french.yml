 SPEC_IL_SORT_GOODS_TT: "#header Trier par biens#!\n$TOOLTIP_DELIMITER$\nListe des [Concept('concept_good','$concept_goods|q$')] échangés sur notre [concept_market] dans un ordre fixe : par catégorie, puis par nom."
 SPEC_IL_SORT_INTEREST_TT: "#header Trier par [concept_spec_investor_interest]#!\n$TOOLTIP_DELIMITER$\nL’intérêt le plus élevé d’abord ; au sein de chaque niveau, les biens les plus échangés d’abord.\n\nLe repère indique le niveau, de @spec_interest_fleeing! #v Fuyant#! à @spec_interest_feverish! #v Fiévreux#!. La flèche montre la variation de ce mois-ci."
 SPEC_IL_SORT_LEVER_TT: "$SPEC_IL_SORT_LEVER_BASE_TT$$SPEC_IL_ISSUE_FILTER$"
 SPEC_IL_ISSUE_FILTER: "\n\nLes grandes émissions en cours sont également affichées."
 SPEC_IL_SORT_LEVER_BASE_TT: "#header Afficher les interventions#!\n$TOOLTIP_DELIMITER$\nAffiche uniquement les biens faisant l’objet d’une [concept_spec_intervention].\n\n$SPEC_COL_LEVER_TT$\n\n#instruction Cliquez pour filtrer ; cliquez à nouveau pour tout afficher#!"
 SPEC_IL_DANGER_TT: "#header Zone d’effondrement#!\nSi l’[concept_spec_investor_interest] tombe aussi bas, l’essor se termine par un [concept_spec_collapse], coûtant environ #N [Country.MakeScope.Var(Concatenate('spec_risk_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! de [concept_spec_market_confidence]."
 SPEC_IL_CRASHED_TT: "#header [Goods.GetName] : essor terminé#!\nSon essor s’est terminé ce mois-ci par un événement de type [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]. Les investisseurs se retirent désormais pendant [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_crash_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))], et lorsqu’une [concept_company] produit ce bien, son secteur perd de la [concept_throughput]."
 SPEC_IL_GLUT_TT: "#header [Goods.GetName] : reprise#!\nSon dernier essor s’est terminé par un événement de type [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_UNWIND_C_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_UNWIND_C_2', 'SPEC_UNWIND_C_1'))]. Les investisseurs se retirent pendant [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)3'), 'SPEC_IL_MONTHS_3', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_glut_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)2'), 'SPEC_IL_MONTHS_2', 'SPEC_IL_MONTHS_1'))] après sa fin, maintenant l’[concept_spec_investor_interest] au niveau #v Hésitant#! ou en dessous. Lorsqu’une [concept_company] produit ce bien, son secteur perd de la [concept_throughput]."
 SPEC_TILE_BANKS: "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_ui_expx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_TILE_BANKS_ON', 'SPEC_GOODS_NONE')]$SPEC_TILE_CYCLE$"
 SPEC_TILE_BANKS_ON: "\n\n#title Prêts bancaires :#! #v [Country.MakeScope.Var(Concatenate('spec_exp_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%0]#! de [concept_spec_outstanding_credit], #v [Country.MakeScope.Var(Concatenate('spec_ui_expm_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|1]#! mois de revenu du pool\nSi son essor prenait fin, la [concept_spec_market_confidence] chuterait #v x[Country.MakeScope.Var(Concatenate('spec_ui_expx_', Goods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|2]#! fois plus que pour un essor où aucune banque n'a prêté"
 SPEC_NOTE_BANKS: ""
 SPEC_NOTE_BANKS_ON: " Les banques y avaient beaucoup prêté, la chute a donc été #N x[SCOPE.GetValue('spec_note_bank')|2]#! plus dure."
 SPEC_H_BANK_LENT: "Où les banques ont prêté"
 SPEC_H_BANK_LENT_TT: "#header Où les banques ont prêté#!\n$TOOLTIP_DELIMITER$\nLes banques prêtent l’essentiel de leur nouveau crédit aux biens en essor : plus un bien pèse dans nos échanges et plus son [concept_spec_investor_interest] est élevé, plus il en reçoit. Un prêt reste dans son bien jusqu’à son remboursement.\n\nLorsque prend fin un essor dans lequel les banques ont prêté, la [concept_spec_market_confidence] chute plus fortement. Freiner la spéculation sur un bien réduit de moitié les nouveaux prêts qu’il attire."
 SPEC_BANK_PIE: "Prêts des essors par bien"
 SPEC_BANK_SLICE_NAME: "[SelectLocalization(Country.MakeScope.Var(Concatenate('spec_bank_oth_', Scope.GetGoods.GetKey)).IsSet, 'SPEC_BANK_OTHER', 'SPEC_BANK_GOOD_NAME')]"
 SPEC_BANK_GOOD_NAME: "[Scope.GetGoods.GetName]"
 SPEC_BANK_SLICE_SHARE: "[SelectLocalization(Country.MakeScope.Var(Concatenate('spec_bank_oth_', Scope.GetGoods.GetKey)).IsSet, 'SPEC_BANK_OTHER_SHARE', 'SPEC_BANK_GOOD_SHARE')]"
 SPEC_BANK_OTHER_SHARE: "#v [Divide_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('spec_exp_booms'), Country.MakeScope.Var('spec_bank_top').GetValueWithDefault('(CFixedPoint)0')), Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_exp_booms'), '(CFixedPoint)0.001'))|%0]#!"
 SPEC_BANK_GOOD_SHARE: "#v [Divide_CFixedPoint(Country.MakeScope.Var(Concatenate('spec_exp_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)0'), Max_CFixedPoint(Country.MakeScope.ScriptValue('spec_exp_booms'), '(CFixedPoint)0.001'))|%0]#!"
 SPEC_BANK_SLICE_TT: "[SelectLocalization(Country.MakeScope.Var(Concatenate('spec_bank_oth_', Scope.GetGoods.GetKey)).IsSet, 'SPEC_BANK_OTHER_TT', 'SPEC_BANK_GOOD_TT')]"
 SPEC_BANK_GOOD_TT: "#header [Scope.GetGoods.GetName]#!\n$TOOLTIP_DELIMITER$\n#v [Country.MakeScope.Var(Concatenate('spec_exp_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)0')|%1]#! de l’[concept_spec_outstanding_credit] y est prêté.\nSi son essor prenait fin, la [concept_spec_market_confidence] chuterait #v x[Country.MakeScope.Var(Concatenate('spec_ui_expx_', Scope.GetGoods.GetKey)).GetValueWithDefault('(CFixedPoint)1')|2]#! plus fort.\n\n#grey Un prêt reste dans son bien jusqu’à son remboursement, même quand l’essor se refroidit.#!"
 SPEC_BANK_NONE_S: "#grey Aucun crédit prêté aux essors#!"
 SPEC_BANK_NONE: "Les banques n’ont rien prêté aux essors. Elles prêtent tant que la [concept_spec_market_confidence] dépasse #v 55#! (actuellement #v [Country.MakeScope.Var('spec_conf').GetValueWithDefault('(CFixedPoint)0')|0]#!), surtout aux biens dont l’intérêt est #v Vif#! ou plus élevé."
 SPEC_LHIST_EMPTY: "#grey Enregistré chaque mois à partir de maintenant#!"
 SPEC_H_CREDIT_HISTORY: "Historique du levier du crédit"
 SPEC_H_CREDIT_HISTORY_TT: "#header Historique du levier du crédit#!\n$TOOLTIP_DELIMITER$\n[concept_spec_leverage] sur les #v 36#! derniers mois, le plus récent à droite\nSûr jusqu’à #v 3#! mois, risqué jusqu’à #v 8#!, dangereux au-delà de #v 8#!\nLigne blanche : notre plafond de crédit\nBord droit : le seuil de panique à chaque niveau"
 SPEC_H_CREDIT_HISTORY_RIGHT: "Maintenant #v [Country.MakeScope.ScriptValue('spec_lev')|1]#! mois"
