 SPEC_STANCE_TIGHT_TT: "#header Crédit restreint#!\nCrédit accordé ce mois-ci : #v Aucun#!\n$TOOLTIP_DELIMITER$\nChaque mois, la [concept_spec_market_confidence] perd #N 10 %#! de son excédent au-dessus de #v 60#!\nRéaction des investisseurs : #N -50 %#!\n@intelligentsia! Intelligentsia [concept_in_government] : #P +2#! d’[concept_approval]\n@industrialists! Industriels [concept_in_government] : #N -2#! d’[concept_approval]\n\nLes essors restent plus modestes, ce qui atténue leurs fins et les paniques.[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-1'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)-1')), Not(GetScriptedGui('spec_sgui_tight').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_TIGHT_WHY')]"
 SPEC_STANCE_NORMAL_TT: "#header Crédit normal#!\nCrédit accordé ce mois-ci : #v @money![Country.MakeScope.ScriptValue('spec_credit_preview')|D]#!\n$TOOLTIP_DELIMITER$\nLes banques prêtent au [concept_investment_pool] tant que la [concept_spec_market_confidence] dépasse #v 55#!.[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)0')), Not(GetScriptedGui('spec_sgui_normal').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_NORMAL_WHY')]"
 SPEC_STANCE_LOOSE_TT: "#header Crédit souple#!\nCrédit accordé ce mois-ci : #v @money![Country.MakeScope.ScriptValue('spec_credit_preview_loose')|D]#!\n$TOOLTIP_DELIMITER$\nRéaction des investisseurs à la hausse des prix : #v +30 %#!\n@industrialists! Industriels [concept_in_government] : #P +2#! d’[concept_approval]\n@intelligentsia! Intelligentsia [concept_in_government] : #N -2#! d’[concept_approval]\n\nLes essors sont plus forts, tout comme les pertes lorsqu’ils prennent fin.[SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1'), 'SPEC_CREDIT_CURRENT', 'SPEC_CREDIT_LOCK')][AddLocalizationIf(And(Not(EqualTo_CFixedPoint(Country.MakeScope.Var('spec_stance').GetValueWithDefault('(CFixedPoint)0'), '(CFixedPoint)1')), Not(GetScriptedGui('spec_sgui_loose').IsValid(GuiScope.SetRoot(Country.MakeScope).End))), 'SPEC_STANCE_LOOSE_WHY')]"
