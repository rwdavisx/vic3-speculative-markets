 SPEC_JE_STAGE_6: "La [concept_spec_long_depression] pèse sur [JournalEntry.GetCountry.GetCapital.GetCityHubName]. Les investisseurs thésaurisent et ne prêtent à personne ; jusqu’ici, chaque reprise s’est essoufflée en quelques mois. Une entrée du journal dédiée suit la reprise mondiale.\n\nLes chantiers de secours emploient les chômeurs à construire et les nourrissent tant qu’elle dure."
 SPEC_JE_STAGE_5: "La panique s’est emparée de [JournalEntry.GetCountry.GetCapital.GetCityHubName]. Dès l’aube, les déposants font la queue devant les banques, les prêts sont rappelés et la [concept_private_construction] est réduite de moitié pendant encore #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic').GetValue|0]#! mois, à moins que le gouvernement n’agisse.\n\n#v Prêter aux banques#! abrège la panique et réduit ses effets de moitié. Les chantiers de secours emploient les chômeurs à construire et les nourrissent.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_currency_v'), '(CFixedPoint)0'), 'SPEC_JE_SUSPEND_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_4: "La panique est passée, laissant derrière elle des maisons en faillite et des chantiers inachevés. Les investisseurs comptent leurs pertes, et aucune nouvelle panique ne peut éclater pendant #v [JournalEntry.GetCountry.MakeScope.Var('spec_panic_cooldown').GetValue|0]#! mois.[SelectLocalization(GreaterThan_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('spec_reform_open_v'), '(CFixedPoint)0'), 'SPEC_JE_INQUIRY_HINT', 'SPEC_JE_NONE')]"
 SPEC_JE_STAGE_3: "La Bourse de [JournalEntry.GetCountry.GetCapital.GetCityHubName] a perdu la raison. Employés et veuves empruntent pour acheter des actions liées aux biens #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! et #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#!, et chaque mois où la [concept_spec_market_confidence] atteint au moins #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#! accroît l’[concept_spec_speculative_excess]. Lorsque la [concept_spec_market_confidence] passe sous #v 60#!, la bulle éclate, et plus l’excès est grand, plus la chute est rude.\n\nFreiner la spéculation sur les biens les plus prisés ou resserrer le crédit permet de dégonfler lentement la bulle."
 SPEC_JE_STAGE_2: "L’argent est facile et les investisseurs sont optimistes. Les nouvelles compagnies spécialisées dans les biens #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! et #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#! voient leurs actions sursouscrites en moins d’une heure, et les banques prêtent sans réserve contre ces titres. Au-delà de #v [JournalEntry.GetCountry.MakeScope.ScriptValue('spec_heat_from')|0]#! de [concept_spec_market_confidence], l’[concept_spec_speculative_excess] commence à s’accumuler.\n\nLa prospérité est aussi le moment de convertir la dette nationale à un taux plus bas."
 SPEC_JE_STAGE_1: "Les échanges à la Bourse de [JournalEntry.GetCountry.GetCapital.GetCityHubName] sont ordonnés. Les investisseurs privilégient #v [JournalEntry.GetCountry.MakeScope.Var('spec_top1').GetGoods.GetName]#!, #v [JournalEntry.GetCountry.MakeScope.Var('spec_top2').GetGoods.GetName]#! et #v [JournalEntry.GetCountry.MakeScope.Var('spec_top3').GetGoods.GetName]#!, et délaissent #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! et #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!."
 SPEC_JE_STAGE_0: "Sur la place de [JournalEntry.GetCountry.GetCapital.GetCityHubName], les investisseurs se méfient. Échaudés par les pertes récentes, ils gardent leur argent et délaissent #v [JournalEntry.GetCountry.MakeScope.Var('spec_low1').GetGoods.GetName]#! et #v [JournalEntry.GetCountry.MakeScope.Var('spec_low2').GetGoods.GetName]#!. Une politique de crédit souple ou des encouragements à investir dans un bien peuvent les faire revenir."
